# Lifecycle plan -- see ml/lifecycle/plan.py for the schema; seeded by scripts/ops/seed_lifecycle_plans.py (2026-11-07).
plan_version: 1
plan_id: baseline-execution-quality
model_id: execution-quality-baseline-v0
manifest: ml/configs/retired/baseline-execution-quality.yaml
population_basis: every top-level ml/configs manifest (the nightly-cycle roster; registry stage lives on the trainer VM and can exceed the manifest's
  declared stage)
manifest_stage_at_seed: shadow
datasets:
- family: execution_quality
  symbol_scope: all
  timeframe: all
  version: v001
  source: scripts/ops/build_trainer_datasets.sh (trainer VM, nightly in ict-trainer.service; datasets-out/)
  window: live closed-trade fills only (backtests do not model slippage)
  point_in_time: decision-time features only; labels realised strictly after the decision
retrain:
  cadence_days: 1
  cadence_provenance: MEASURED
  triggers:
  - kind: calendar
  - kind: drift
    source_job: drift_check
    when: overall_verdict == significant
  timeout_s: 1800
  command:
  - '{py}'
  - -m
  - ml
  - train
  - '{manifest}'
  - --datasets-root
  - '{datasets_root}'
  - --experiments-root
  - '{experiments_root}'
  - --registry-root
  - '{registry_root}'
  note: 'backstop to the nightly cycle: due only if neither this scheduler nor a cycle manifest_ok row is inside the cadence'
retest:
- id: drift_check
  cadence_days: 1
  cadence_provenance: MEASURED
  what: score drift (KS+PSI, reference vs current window) -- score drift only, NOT labelled decay
  command:
  - '{py}'
  - -m
  - ml
  - shadow-drift
  - --model-id
  - '{model_id}'
- id: labelled_decay
  cadence_days: 7
  cadence_provenance: ESTIMATED
  what: shadow scores joined to realised outcomes (AUC/Brier vs base rate) -- labelled decay
  command:
  - '{py}'
  - -m
  - ml
  - model-attribution
  - --db
  - '{journal_db}'
  - --model-id
  - '{model_id}'
update:
  cadence_days: 7
  cadence_provenance: ESTIMATED
  promote_past_shadow: operator_tier3
  rule: 'PROPOSE only: gate-check writes the go/no-go packet; hold if gates fail or data is insufficient; flag for /ml-review when a result changes
    the verdict. Never calls promote-stage.'
  command:
  - '{py}'
  - -m
  - ml
  - gate-check
  - '{model_id}'
  - --registry-root
  - '{registry_root}'
reporting:
  results: runtime_logs/trainer/lifecycle_results.jsonl (one MEASURED record per job)
  state: runtime_logs/trainer/lifecycle_state.json
  red_flag: lifecycle_red_flag event in runtime_logs/training_cycle.jsonl after 3 consecutive failures (once per episode; retries continue)
  reviewed_by: /ml-review layer 1 (python scripts/ops/lifecycle_report.py)
