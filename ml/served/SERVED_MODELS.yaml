# Served-model registry facts (row ML-REGISTRY-SERVED-MODELS-NO-STAGE, lane ML-SERVING-HYGIENE, 2026-11-12).
#
# WHAT THIS IS: the source of truth for the registry STAGE and the HEADLINE METRIC of every model a config consumer
# serves directly from the repo (ml/served, ml/candidates, ml/overlay) or from the trainer mirror's exit_head dir, i.e.
# the rows /api/bot/ml/registry adds from src/runtime/ml_serving_inventory.py. None of these ids is a trainer
# registry.jsonl row, so before this file they rendered target_deployment_stage null next to a LIVE / SHADOW bucket.
# The route reads this file; it decides nothing and gates nothing (no runtime reader takes a decision from it).
#
# STAGE: the ladder value (candidate -> shadow -> advisory) the model is ALREADY operating at by config. Every model
# below changes an order on at least one consumer (strategies.yaml `execution: live` on a rostered account), which is
# the influence stage, so each is `advisory`. A served model is never labelled `shadow`: shadow means "logged,
# decisions unchanged" (I7, ML-SHADOW-NEVER-ORDERS), and tests/test_ml_registry_inventory.py refuses a declared stage
# below advisory for a model whose consumer executes live. The paper/real-money split is `stage_from_config`
# (testing / live), which the route keeps beside it.
#
# HEADLINE METRIC: copied from the committed record named in `source` (fields copied, not re-derived); `value` null
# when the record states only a verdict. provenance MEASURED = a graded run's number. The test checks every `source`
# exists. When a record is regenerated, update the entry here in the same PR.
models:
  ml-decision-entry-v1:
    stage: advisory
    stage_basis: "config id of ml_entry (strategies.yaml model:), executes live on bybit_2 (real money) + paper/prop; ml/served/ENTRY_SERVED.json currently serves the refit ml-decision-entry-v1r20261106 under this id"
    headline_metric:
      name: heldout_mean_net_r_per_trade
      value: 0.0371
      n: 907
      window: "2025-10-01..2026-09-29"
      population: "c692-01 frozen model (tau 0.1) held-out decisions on BTC/ETH/XRP/ADA/SOL, live exit (SL-only structure stop + extend-only TP), net of fee 11 + slip 3 bps + funding 1 bps/8h"
