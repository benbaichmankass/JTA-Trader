# yz regime classifier: SOLUSDT @ 1h (row ML-D2-YZ-HEADS-ETH-SOL, 2026-11-17).
#
# The current yz recipe (btc-regime-1h-lgbm-yz-v1) on the SOL 1h market_features v002 shard.
# The nightly run_training_cycle.sh trains every ml/configs/*.yaml (regime manifests last), so
# landing this file IS the training run. research_only: logs nothing to the live path, gates no cell.
# Gates this adds or changes: none.

manifest_version: v1
model_id: sol-regime-1h-lgbm-yz-v1
description: "Range-based-vol (yz) regime classifier for SOLUSDT 1h: the btc-regime-1h-lgbm-yz-v1 recipe on the SOL shard. Registered so ml_vol_label_replay can replay yz labels for the SOL TD legs (row ML-D2-YZ-HEADS-ETH-SOL; c21d-03 PASS). research_only."
model_family: classification_lightgbm
trainer: ml.trainers.lightgbm_multiclass.LightGBMMulticlassTrainer
trainer_config:
  target_column: regime_label
  feature_columns:
    - vol_bucket
    - rolling_log_return_vol
    - parkinson_vol
    - garman_klass_vol
    - rogers_satchell_vol
    - yang_zhang_vol
    - log_return
    - log_return_lag_1
    - log_return_lag_2
    - hour_of_day
    - dayofweek
  categorical_columns:
    - vol_bucket
    - hour_of_day
    - dayofweek
  freeze_regime_spec: true
  vol_feature_column: yang_zhang_vol
  vol_window_n: 20
  seed: 42
  n_iter: 200
  # Same recency weighting as the v2 head (S-MLOPT-S2 / MB-20260601-001) so the
  # only moving part vs the champion is the vol feature set — a clean A/B.
  sample_weight:
    half_life_days: 90
    time_column: ts
  class_weight:
    range: 1.0
    volatile: 4.0
  lgbm_params:
    learning_rate: 0.05
    num_leaves: 31
    min_data_in_leaf: 50
    feature_fraction: 0.9
    bagging_fraction: 0.9
    bagging_freq: 5
dataset:
  family: market_features
  symbol_scope: SOLUSDT
  timeframe: 1h
  version: v002
evaluator: ml.evaluators.multiclass_classification.MulticlassClassificationEvaluator
evaluator_config:
  target_column: regime_label
  split_strategy: time_aware_holdout
  time_column: ts
  holdout_fraction: 0.2
target_deployment_stage: research_only
notes: |
  Row ML-D2-YZ-HEADS-ETH-SOL (lane ML-ITERATION-REFILL-2-20261117, 2026-11-17). The
  btc-regime-1h-lgbm-yz-v1 recipe unchanged except the symbol: same trainer, features, regime
  spec frozen on yang_zhang_vol, recency and class weights, split. Evidence that the yz block helps
  on SOL 1h: RQ-20261117-c21d-03 PASS (lgbm + yz vs lgbm, ETH +0.0097, SOL +0.0129 nats CV log-loss).
  Pending siblings dc44-01 (+ har_rv) and dc44-02 (CatBoost): if either PASSES, a v2 manifest
  carries that change; this v1 stays the plain-yz control. research_only: it serves nothing and
  influences no order. Moving it to shadow/advisory is a separate Tier-3 decision. The next
  step is the yz-labelled money consumer test on the SOL TD legs (ml_vol_label_replay +
  regime_cell_walkforward). Leakage gate forbids forward_log_return / forward_log_return_vol /
  regime_label.
