# Short-hold lane (DESK-SHORT-HOLD-LANE): the legs whose packages get ONE Claude session for the life of the trade.
# Read by src/runtime/short_hold_wake.py (the VM trigger + 5-min packets). Operator goal 2026-10-27 (approved,
# manager relay): Claude manages a <= 1 h trade from one session; design docs/plans/claude-trading-desk-DESIGN.md
# § 6.2 "per-trade spawned lane". The legs are rostered by lane DESK-8-SHORT-HOLD (bybit_1, demo money); a leg
# listed here that is not rostered simply never opens a package. This list gates nothing about trading: it only
# decides which open packages get a managing session.
legs:
  - ict_scalp_eth_15m
  - ict_scalp_xrp_15m
# Where the 5-min packet envelopes land and the lane's rows go (the branch the VM rows watcher applies from).
branch: live-review/rows
# The lane stops itself this long after opened_at (the trade keeps its venue brackets; nothing else stops).
hard_cap_minutes: 90
