# Orders the VENUE has wedged (accepted a cancel, never performed it). OPERATOR-DECISIONS-20261028 item 4, Tier-2.
#
# An entry here is read ONLY by account_alpaca_open_orders (src/units/accounts/clients.py), the single "what rests
# NOW" read that /api/diag/alpaca_open_orders and the boot audit consume. It moves a listed order from `orders`
# to `orders_excluded_venue_wedged` (still visible, never dropped silently) AND ONLY WHEN the order's symbol is
# CONFIRMED FLAT on the account (positions read, no non-zero row). A held position, an unreadable positions
# read, or an unlisted order all leave `orders` byte-identical. It does not touch the cancel / re-arm / close
# paths, so a wedged order that still holds shares keeps being flagged until the position is gone.
#
# Entry shape: {order_id (full id), symbol, reason, evidence, added}. Remove an entry to put the order back.
