# THE DATA UNIVERSE: what we COLLECT history for, whether or not we trade it (operator, 2026-11-01:
# "we need to be collecting data on far more symbols than that, even if we're not trading them yet").
#
# This file is read by scripts/ops/fetch_etf_history.py (equity/ETF bars) and scripts/ops/capture_options_snapshot.py
# (option chains) via scripts/ops/data_universe.py. WIDENING LATER IS A CONFIG EDIT, NOT CODE.
#
# Gates this adds or changes: NONE. This is a data-pull list, not a trading roster: `accounts.yaml::symbols` and the
# `strategies:` roster still decide what trades, and nothing here reaches an order path (same status as the
# accounts.yaml `symbols:` pull list, which is "an additive data-pull list, never a gate").
#
# A symbol the data vendor does not serve is recorded as `no_data` in the store MANIFEST (measured, not assumed) and never
# halts the pipeline; a symbol that stops updating turns the freshness check red ONCE so this file can be edited.
version: 1

equities:
  start: "2016-01-04"        # Alpaca stock-bar history starts here
  timeframes: ["1h", "5m"]
  # Series refreshed first and graded in the human-readable depth table: everything the alpaca_*/ib_* legs trade + the liquid set.
  core: [SPY, QQQ, IWM, TLT, IEF, GLD, SLV, GDX, USO, TQQQ, QLD, SPYM, SPLG, IAUM, SCHA,
         XLE, XLF, XLK, XLV, XLI, XLP, XLU, XLB, XLY, DIA, HYG, LQD, EEM, EFA, VNQ, SMH]
