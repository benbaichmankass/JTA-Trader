  # Liquid US-listed ETFs (curated; target: top ~200 by average dollar volume across sector / international / bond / credit /
  # commodity / currency-vol / leveraged-inverse). Ranking is by judgment, not computed: the fetcher records each series'
  # depth and the daily-bar dollar volume can be read back to prune or add. Add a ticker here to start collecting it.
