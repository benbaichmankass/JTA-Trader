# Live trade review -- declared defaults (docs/plans/live-trade-review-DESIGN.md).
#
# This file is READ-ONLY configuration for the due computation
# (GET /api/diag/live_review_due, src/runtime/live_review_due.py). Nothing here
# gates trading, moves a stop or halts anything: it only decides which open
# packages are SURFACED for review. Every threshold is a proposed default from
# design section 2, registered here BEFORE the first run so the due log can
# later be compared against it. Edit by commit only.
#
# Sibling sections (reserve, apply_mode) are added by LTR-10 / LTR-6 and are
# not read by the due computation.
due:
  # Timeframe of a leg when its name carries no _1h/_2h/_4h/_1d suffix.
  default_timeframe: 2h
  # An open telemetry row not refreshed for this long is still evaluated but
  # flagged `telemetry_stale` (the exit loop writes it every pass).
  telemetry_max_age_minutes: 30
  events:
    r_milestone:
      first_r: 1.0      # first level; then every `step_r`
      step_r: 1.0
    new_peak:
      step_r: 0.5       # peak_r >= last reviewed peak + step
    giveback:
      min_peak_r: 1.0
      min_giveback_r: 0.5
      giveback_frac_of_peak: 0.30   # threshold = max(min_giveback_r, frac * peak_r)
    near_target:
      max_r_to_target: 0.5
    daily_floor:
      hours: 24
      # Real-money and prop accounts (design section 2 "Floor"), plus the paper
      # and soak books since 2026-10-26: operator popup "All accounts now"
      # (option text "Real-money, prop and paper at once") put paper in scope
      # for trade actions under MD-TRADE-DESK, so paper packages are floored
      # too, not surfaced by event triggers alone. Each id must exist in
      # config/accounts.yaml (tests/test_live_review_due.py).
      accounts: [bybit_2, bybit_portfolio, alpaca_live, breakout_1, breakout_2, tradeify_1, velotrade_1, bybit_1, ib_paper, alpaca_paper, alpaca_portfolio, alpaca_options_paper]
    # -- market triggers (LTR-1B-MARKET-TRIGGERS, 2026-10-26) -----------------
    # Registered here BEFORE first use. Basis for every number: the design § 2
    # events table (docs/plans/live-trade-review-DESIGN.md, operator-approved
    # 2026-10-25), copied unchanged. Inputs are what the VM already writes:
    # position_path_history (per-bar close + the Wilder-14 ATR the exit loop
    # stores), exchange_funding (the funding puller) and
    # config/economic_calendar.yaml (the news layer's calendar). Each event says
    # per package whether it LOOKED or COULD NOT LOOK (`events_could_not_look`).
    swing:
      # |close(bar t) - close(bar t-1)| >= atr_multiple x ATR(bar t-1), the
      # close being the last exit-loop pass of that bar (to within one pass).
      atr_multiple: 2.0
    vol_regime:
      # ATR(now) / ATR(entry bar). Entry ATR is the first history bar, used
      # only when that bar is within one bar of entry (bars_held), else
      # could_not_look. The design's "(trend, vol) cell changed" clause is NOT
      # evaluated: the vol bucket edges live in the trainer registry only.
      expand_ratio: 1.5
      contract_ratio: 0.67
    funding:
      # Crypto perps only. The latest settlement the account PAID on this symbol
      # within `window_hours`, with |rate| >= assumption_multiple x the
      # backtest's assumption (execution_costs.funding_bps_per_window_for).
      assumption_multiple: 3.0
      window_hours: 9
    calendar:
      # A scheduled event of a class declared for the symbol's base, with
      # impact >= min_impact, inside the next bar of the leg. A calendar whose
      # newest event is in the past is STALE: could_not_look, never "no event".
      min_impact: 0.8
    mechanics:
      # Journal half only: the exit loop is still writing telemetry for the
      # package (fresh within telemetry_max_age_minutes) but the trade row it
      # names is absent from `trades`. The venue half has no stored read on
      # the VM (see not_evaluated).
      journal_trade_absent: true
      # Venue half (LTR-MECHANICS-VENUE-SNAPSHOT, 2026-10-26). Registered here
      # BEFORE the first run. Fires level `venue_sl_diverges` when the resting
      # stop the sweeps last read at the venue (venue_protection_snapshot,
      # read_state measured) differs from order_packages.sl by MORE than
      # `venue_sl_tolerance_atr` x ATR. ATR source, in order: the newest
      # position_path_history bar, else the package's own entry ATR
      # (order_packages.meta.atr); neither -> could_not_look, never "no
      # divergence". Basis for 0.25: the row's proposed value (manager ack
      # 2026-10-26); it is wide enough to ignore tick-grid rounding (the two
      # matching IB reviews on 2026-10-25/26 differed by 0.0286 on a 4270 stop)
      # and narrow enough that a leg's whole bracket replaced by another's
      # (hundreds of points) cannot hide. A snapshot older than
      # `venue_snapshot_max_age_minutes` is could_not_look (a venue read that
      # stopped refreshing is not evidence about the venue now).
      venue_sl_tolerance_atr: 0.25
      venue_snapshot_max_age_minutes: 60
    # -- pre-screen triggers (LTR-PRACTICE-REDESIGN, 2026-10-28) ----------------
    # Operator Tier-2 OK 2026-10-28 ~07:36Z popup: "Turn wake-ups on today".
    # Basis: docs/research/practice-review-trade-mgmt-and-ai-2026-10-28.md § E.2
    # (adverse -0.5R / -0.75R, stall, momentum flip, level/structure break).
    # Registered here BEFORE the first run. Evaluated on every due pass for every
    # open package; every evaluation (flagged or not) is logged by the VM wake
    # poster to runtime_logs/live_review/prescreen.jsonl so each trigger type is
    # graded vs hold and a matched random checkpoint (§ E.4). The thresholds are
    # proposed defaults, NOT tuned: the grading decides which survive.
    # ROLLBACK: delete these four blocks; an absent block is not evaluated.
    adverse_r:
      # First crossing of each level by open_r (the live telemetry value). A
      # reviewed deeper level covers the shallower one.
      levels: [-0.5, -0.75]
    stall:
      # bars_held >= the leg's threshold while peak_r < max_peak_r (no +0.5R
      # progress); fires again every further threshold. The practice anchor is
      # the leg's median winning duration; until that is measured per leg the
      # threshold is derived from the leg's timeframe (about a session of bars
      # for intraday legs, a few bars for 4h/1d).
      max_peak_r: 0.5
      bars_by_timeframe: {5m: 24, 15m: 16, 30m: 12, 1h: 12, 2h: 8, 4h: 6, 1d: 5}
      default_bars: 8
    momentum_flip:
      # The last `bars` CLOSED path-history bars each closed against the position
      # and their net move against it is >= min_atr x ATR. Edge-triggered: one
      # level per episode, a new episode no sooner than cooldown_bars later.
      bars: 3
      min_atr: 1.0
      cooldown_bars: 3
    structure_break:
      # A CLOSED bar's close beyond the since-entry extreme close against the
      # position (the trade's own structure) by more than buffer_atr x ATR,
      # after min_bars closed bars. Edge-triggered with cooldown_bars.
      min_bars: 3
      buffer_atr: 0.1
      cooldown_bars: 3
  # Design clauses whose inputs the due computation does not read yet.
  # Surfaced as `events_not_evaluated` so "not checked" is never read as
  # "did not fire".
  #   mechanics_venue_tp -- live TP at the venue vs the package: the snapshot
  #                       stores venue_tp but NO tolerance is registered for it,
  #                       so it is stored and not evaluated. (The SL half is
  #                       evaluated since LTR-MECHANICS-VENUE-SNAPSHOT.)
  #   vol_regime_cell  -- the (trend, vol) cell change since entry.
  not_evaluated: [mechanics_venue_tp, vol_regime_cell]
  # Per-package cooldown: at most one review per closed bar of the leg's
  # timeframe, except for these events. adverse_r (2026-10-28): a slide from
  # -0.5R to -0.75R inside one bar is reviewed, not held for the next bar.
  cooldown_exempt: [giveback, mechanics, adverse_r]

# -- attention watch (LTR-1B-ATTENTION-PROBE, 2026-10-27) ----------------------
# Read by scripts/ops/attention_watch.py::probe_live_review_due_stale ONLY; the due
# computation ignores it (load_config returns the `due:` block alone). Registered
# BEFORE first use. No existing threshold fits (telemetry_max_age_minutes is a
# 30-minute telemetry freshness bound, daily_floor.hours a 24 h cadence), so both
# are new, both ~2 h as the row specified: long enough for one reviewer cycle,
# short enough that the 2026-10-26 23:19Z mirror stall (hours, silent) pages the
# same night.
watch:
  # A package that has stayed in the due list this long without a review covering it.
  due_stale_minutes: 120
  # A row on live-review/rows that main's comms/live_review/reviews.jsonl still
  # lacks this long after its reviewed_at (the mirror is stuck or failing).
  rows_lag_minutes: 120

# -- apply (LTR-6R-APPLY-PATH; design § 4, desk design § 3.0) -----------------
# apply_mode is a sanctioned *_MODE selector (CLAUDE-RULES-CANONICAL § Prime
# Directive rule 6), NOT a gate on trading and NOT a halting latch:
#   off       — nothing is computed per account
#   recommend — each account's RiskManager.approve_amend is computed and
#               recorded (account_reads); nothing is sent to any venue
#   apply     — an approved/clipped amend goes to THAT account's executor, and
#               ONLY under a granted mandate (config/mandates.yaml,
#               MD-LIVE-TIGHTEN-SL); apply_mode alone never applies anything
# ONLY A COMMIT CHANGES THIS. No runtime code writes it. Setting `apply` is
# the operator's act (Tier 3).
apply_mode: apply
# Per-account override (same three values); absent = inherit the global.
#   accounts:
#     bybit_portfolio: {apply_mode: off}
accounts: {}
# Noise floor (design § 3 guardrails): a review stop sits at least this many x
# the leg's ATR beyond the mark. An account may RAISE its own floor with
# config/accounts.yaml::<acct>.risk.live_review_min_buffer_atr.
min_buffer_atr: 1.0
