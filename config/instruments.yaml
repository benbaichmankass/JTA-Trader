# config/instruments.yaml — typed instrument specifications for the multi-strategy
# architecture refactor (S-REFACTOR-S2, 2026-05-20).
#
# Consumed by:
#   - src/core/profile_loader.load_instrument_profiles()
#   - coordinator.instrument_profiles (read-only property, S2)
#   - Future: allocator position sizing (S4), IB execution layer (S7)
#
# Schema per instrument:
#   exchange:             bybit | interactive_brokers
#   category:            linear | inverse | spot | futures | unknown
#   base_asset:          underlying asset ticker
#   quote_currency:      pricing currency
#   settlement_currency: P&L settlement currency
#   tick_size:           minimum price increment
#   min_qty:             minimum order quantity (contracts or units)
#   qty_step:            order quantity granularity
#   contract_value_usd:  USD notional per contract (futures); 1.0 for crypto perps
#   max_leverage:        maximum allowed leverage (0 = no cap / spot)
#   display_name:        human-readable label for UI / logs
#   asset_class:         OPTIONAL reporting override — crypto | index | commodity
#                        | bond | equity | fx. Consumed ONLY by the reporting layer
#                        (src/web/api/_asset_class.py → /performance perAssetClass
#                        breakdown); never the order path. When omitted it is
#                        inferred from exchange/category/base_asset, so this is a
#                        pin for the ambiguous cases (a gold ETF on an equity
#                        venue, an index future on IB, …).
#   ib:                  OPTIONAL per-symbol IBKR instrument-type map (added
#                        2026-07-07, docs/integrations/ibkr-equity-etf-support-DESIGN.md
#                        §4.1). Consumed by
#                        src/units/accounts/ib_instruments.py::ib_instrument_spec()
#                        — the single source of truth for "is this symbol a
#                        FUT or a STK on IBKR, and on which exchange?", used by
#                        IBClient._build_contract (src/units/accounts/ib_client.py)
#                        and the coordinator's per-order whole-share sizing
#                        resolution. Fields: sec_type (FUT|STK), exchange
#                        (CME/COMEX for futures; SMART for equities),
#                        primary_exchange (equities only — a qualifyContracts
#                        disambiguation hint), currency. A symbol with no `ib:`
#                        block falls back to the legacy MES/MGC/MHG futures map
#                        inside the resolver (purely additive; unmapped symbols
#                        still raise a clear error rather than routing wrong).
#
# Adding a new instrument:
#   1. Add entry here following the schema above.
#   2. If IB: ensure the execution layer handles the symbol before enabling
#      live. The IB execution path is wired (2026-05-21, STK support added
#      2026-07-07): IBClient (src/units/accounts/ib_client.py) +
#      the interactive_brokers branch in execute._submit_order build the
#      contract via ib_instrument_spec() — add the symbol's `ib:` block above
#      before routing a new IB symbol (futures need a new sec_type:FUT entry
#      only if it isn't MES/MGC/MHG; equities/ETFs always need a sec_type:STK
#      entry — there is no equity default).
#   3. Add the symbol to the relevant strategy's config/strategies.yaml entry.
#   4. Run tests/test_s2_profile_wiring.py to validate the new entry loads cleanly.

# MEASURED round-trip taker fee (bps of notional) per "<exchange>:<category>", read by
# profile_loader.roundtrip_fee_bps_for. A venue absent here keeps
# execution_costs.DEFAULT_FEE_BPS_ROUNDTRIP. bybit:linear = 2 x 5.5 bps/side, every one of
# 1,411 fills taker (comms/research/desk_edge/levers/bybit-fee-measured-2026-10-27.json).
venue_roundtrip_fee_bps:
  "bybit:linear": 11.0

instruments:

  # ------------------------------------------------------------------
  # BTCUSDT — Bybit V5 USDT-margined linear perpetual
  # Current live instrument for all three active strategies.
  # bybit_1 and bybit_2 both trade this symbol.
  # ------------------------------------------------------------------
  BTCUSDT:
    exchange: bybit
    category: linear
    base_asset: BTC
    asset_class: crypto
    quote_currency: USDT
    settlement_currency: USDT
    tick_size: 0.1           # minimum price increment ($0.10)
    min_qty: 0.001           # minimum order size (0.001 BTC)
    qty_step: 0.001          # qty granularity
    contract_value_usd: 1.0  # 1 USDT per $1 of BTC move (linear perp)
    max_leverage: 100        # Bybit max for BTC linear
    display_name: "BTC/USDT Perp (Bybit)"

  # ------------------------------------------------------------------
  # ETHUSDT — Bybit V5 USDT-margined linear perpetual
  # M15 WS-C alt sleeve (2026-06-11): eth_pullback_2h on bybit_1 (demo).
  # ------------------------------------------------------------------
  ETHUSDT:
    exchange: bybit
    category: linear
    base_asset: ETH
    asset_class: crypto
    quote_currency: USDT
    settlement_currency: USDT
    tick_size: 0.01          # minimum price increment ($0.01)
    min_qty: 0.01            # minimum order size (0.01 ETH)
    qty_step: 0.01           # qty granularity
    contract_value_usd: 1.0  # 1 USDT per $1 of ETH move (linear perp)
    max_leverage: 100        # Bybit max for ETH linear
    display_name: "ETH/USDT Perp (Bybit)"

  # ------------------------------------------------------------------
  # SOL/XRP/ADA/AVAX USDT — Bybit V5 USDT-margined linear perpetuals
  # Added 2026-06-18 (Tier-3) for the trend_4h + pullback_2h alt-cell soak
  # on bybit_1 (Bybit DEMO — paper money). `exchange: bybit` is the
  # connector-routing key (connector_for_symbol). tick_size / qty_step /
  # min_qty here are STATIC FALLBACKS only — Bybit's live get_instruments_info
  # is authoritative on the demo venue (src/units/accounts/precision.py), so a
  # stale value can never block the order path. contract_value_usd: 1.0 (linear
  # perp: 1 USDT per $1 underlying move) drives local PnL resolution.
  # ------------------------------------------------------------------
  SOLUSDT:
    exchange: bybit
    category: linear
    base_asset: SOL
    asset_class: crypto
    quote_currency: USDT
    settlement_currency: USDT
    tick_size: 0.001         # fallback — live lookup authoritative
    min_qty: 0.1
    qty_step: 0.1
    contract_value_usd: 1.0
    max_leverage: 100
    display_name: "SOL/USDT Perp (Bybit)"

  # BNBUSDT — Bybit V5 USDT-margined linear perpetual. Added 2026-07-15 for the
  # M22 D2 pairs sleeve (the BNB/BTC pair's leg). Reporting/connector-routing
  # only — BNBUSDT is NOT in any account's `symbols` roster (the isolated pairs
  # executor fetches its own candles + places its own legs; it does not ride the
  # per-account symbol union), so no single-symbol strategy trades it.
  BNBUSDT:
    exchange: bybit
    category: linear
    base_asset: BNB
    asset_class: crypto
    quote_currency: USDT
    settlement_currency: USDT
    tick_size: 0.01          # fallback — live lookup authoritative
    min_qty: 0.01
    qty_step: 0.01
    contract_value_usd: 1.0
    max_leverage: 75
    display_name: "BNB/USDT Perp (Bybit)"

  XRPUSDT:
    exchange: bybit
    category: linear
    base_asset: XRP
    asset_class: crypto
    quote_currency: USDT
    settlement_currency: USDT
    tick_size: 0.0001        # fallback — live lookup authoritative
    # MEASURED from the venue, not chosen. Bybit V5
    # /v5/market/instruments-info?category=linear&symbol=XRPUSDT read
    # 2026-09-06T11:03:10Z (trainer-vm-diag issue #11120, Actions run
    # 34029110078) returns lotSizeFilter {"minOrderQty":"0.1","qtyStep":"0.1"}.
    # These were BOTH declared 1.0 and were BOTH wrong — field beats comment.
    # Corroborated independently: /api/diag/exchange_positions read
    # 2026-09-06T11:02:43Z holds XRPUSDT 7114.1 (bybit_1), 58.5 (bybit_2) and
    # 11903.8 (bybit_portfolio). A linear-perp position size changes only by
    # fills, so a .1/.5 tail cannot exist at step 1.0.
    # ⚠️ NOT cosmetic: this profile is the offline FALLBACK a qty resolver uses
    # when the live lookup misses, and a step COARSER than the real one makes a
    # floor drop up to 0.1 XRP off every close — the silent-orphan direction.
    min_qty: 0.1
    qty_step: 0.1
    contract_value_usd: 1.0
    max_leverage: 100
    display_name: "XRP/USDT Perp (Bybit)"

  ADAUSDT:
    exchange: bybit
    category: linear
    base_asset: ADA
    asset_class: crypto
    quote_currency: USDT
    settlement_currency: USDT
    tick_size: 0.0001        # fallback — live lookup authoritative
    min_qty: 1.0
    qty_step: 1.0
    contract_value_usd: 1.0
    max_leverage: 100
    display_name: "ADA/USDT Perp (Bybit)"

  AVAXUSDT:
    exchange: bybit
    category: linear
    base_asset: AVAX
    asset_class: crypto
    quote_currency: USDT
    settlement_currency: USDT
    tick_size: 0.001         # fallback — live lookup authoritative
    min_qty: 0.1
    qty_step: 0.1
    # Venue per-order CEILING. MEASURED, not chosen: Bybit's own rejection text
    # names it exactly — order_qty:2299510000000 > max_qty:2200000000000
    # (ErrCode 10001, bybit_1 AVAXUSDT 2026-09-02T09:06:11Z); /1e8 => 22000.
    # Fallback only: the live lot-rule lookup is authoritative (prefer_live).
    # It exists because when that lookup misses, the offline profile answers —
    # and a profile that cannot state a ceiling made the clamp a silent no-op
    # (BL-20260902-AVAX-VENUE-MAX-CLAMP-INERT-WHEN-THE-LIVE-LOOKUP-MISSES).
    # ⚠️ Populate this ONLY from a venue-published value. A guessed ceiling is
    # a fabricated constraint on the live order path; leaving it absent grades
    # `could_not_look`, which is the honest state.
    #
    # ⚠️ PROVENANCE OF THE 22000, stated so a later reader can judge its reach
    # (verified 2026-09-03, MI-90). POPULATION: one rejection, `bybit_1`,
    # AVAXUSDT, 2026-09-02T09:06:11Z, read from the live VM's
    # `ict-trader-live.service` journal. The wire target in that same log line
    # is `https://api-demo.bybit.com/v5/order/create`, and `config/accounts.yaml`
    # confirms `bybit_1` carries `demo: true`. SO THIS CEILING IS MEASURED ON
    # BYBIT'S DEMO VENUE, NOT PRODUCTION.
    #
    # That is correctly scoped TODAY and only today: AVAXUSDT is traded by
    # `bybit_1` and by no other account (`bybit_2`, the sole non-demo Bybit
    # account, lists BTCUSDT/ETHUSDT/XRPUSDT/ADAUSDT). But `max_qty` here is
    # SYMBOL-scoped, so the day AVAXUSDT is added to `bybit_2`, this
    # demo-measured number silently becomes a production fallback ceiling that
    # was never measured on production. Re-measure before that happens; do not
    # let this comment's existence substitute for the measurement.
    max_qty: 22000
    contract_value_usd: 1.0
    max_leverage: 100
    display_name: "AVAX/USDT Perp (Bybit)"

  # ------------------------------------------------------------------
  # MES — Micro E-mini S&P 500 futures via CME / Interactive Brokers
  # IB execution path wired 2026-05-21 (IBClient + ib_client_for +
  # execute._submit_order interactive_brokers branch). Traded by the
  # ib_paper (mode: live → paper money) and ib_live (mode: dry_run)
  # accounts in config/accounts.yaml. No MES strategy is assigned yet —
  # see docs/runbooks/ib-integration.md for the remaining wire-up.
  # ------------------------------------------------------------------
  MES:
    exchange: interactive_brokers
    category: futures
    base_asset: ES              # underlying E-mini S&P 500
    asset_class: index          # equity-index future
    quote_currency: USD
    settlement_currency: USD
    tick_size: 0.25             # $0.25 per index point
    min_qty: 1.0                # 1 contract minimum
    qty_step: 1.0               # whole contracts only
    contract_value_usd: 5.0     # $5 per index point per contract
    max_leverage: 0             # no leverage cap (futures margin set by broker)
    display_name: "Micro E-mini S&P 500 (CME/IB)"
    ib: { sec_type: FUT, exchange: CME, currency: USD }

  # ------------------------------------------------------------------
  # MGC — Micro Gold futures via COMEX / Interactive Brokers (WS-A, 2026-06-02)
