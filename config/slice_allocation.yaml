# Slice allocation — how several strategies share ONE (account, symbol).
#
# Checklist row NETTED-SLICES. Operator, verbatim, 2026-10-15:
#   "We can have different strategies working with netted positions as long as
#    we know how much of that position belongs to each strategy, and each piece
#    of that position has its own brackets. ... We don't need to collapse it, we
#    just need to make sure we know how to allocate between the trades
#    correctly. And it should be based on those other things, not just
#    backtesting. It's just that backtesting is also a parameter here."
#
# Applies ONLY to accounts that declare `position_model: slices` in
# config/accounts.yaml. Every other account keeps the one-strategy-per-symbol
# election unchanged.
#
# ⚠️ CHANGING ANY NUMBER IN THIS FILE IS TIER-3 (sizing / risk meaning).
#
# score(strategy) = Σ weight[k] · term[k], every term in [0, 1]:
#   confidence  the intent's own confidence (clamped to [0, 1]).
#   backtest    0.5 + expectancy_r_oos from comms/strategy_evidence/<leg>.json,
#               clamped to [0, 1]. ONLY a `coverage_state: measured` record
#               counts; anything else is NEUTRAL 0.5 (an absent record is not a
#               leg without edge — see that directory's README).
#   live        (wins + 1) / (n + 2) over the leg's last `live_window_trades`
#               closed, non-backtest journal trades with a recorded pnl.
#               No trades -> 0.5 (neutral prior, never 0).
#   regime      1.0 when config/regime_policy.yaml has an EXPLICIT `on` cell for
#               the leg's family in the intent's regime and side; 0.5 when the
#               cell is unlisted (permissive default, unmeasured). Off cells
#               never reach allocation (gate_intents drops them first).
# Weights are normalised by their sum, so they need not add to 1.
# A strategy's share of the symbol budget is score_i / Σ score over the tick's
# contenders on that account. The name never decides: equal scores get equal
# shares.
weights:
  confidence: 0.4
  backtest: 0.3
  live: 0.2
  regime: 0.1

# Rolling window for the `live` term.
live_window_trades: 30

# Per-(account, symbol) risk budget, in units of the account's per-trade risk
# (the RiskManager's size for one trade). 1.0 = the same total risk a symbol
# could carry under the old pick-one election, so slices never RAISE risk on a
# symbol by default. Open slices of strategies NOT contending this tick count
# against it at their CURRENT stop (a stop trailed to break-even frees budget).
symbol_budget_trades: 1.0
