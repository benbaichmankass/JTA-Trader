# Market-neutral cointegration pairs sleeve (M22 D2).
#
# The winner of the small-TF-directions research (docs/research/
# small-tf-directions-2026-07-15.md; proposal docs/research/
# pairs-sleeve-PROPOSAL-2026-07-15.md). Each entry is a long-spread /
# short-spread reverter on a cointegrated USDT-perp pair: log-spread
# s = logA - beta*logB, rolling hedge-beta, z-score entry/exit. Validated
# 3yr IS + 2025-26 OOS (net-positive, no expectancy decay), cointegration-
# stable (half-life ~12h, 100% valid windows), funding-negligible.
#
# This is an ISOLATED 2-leg sleeve — NOT loaded by the strategy roster. The
# once-per-tick src.units.strategies.pairs_executor.run_pairs_tick hook reads
# THIS file, decides per pair on fresh candles, and (only for execution: live)
# places/closes the two legs on the account. Legs are journalled with per-leg
# strategy names pairs_<name>_a / _b (resolved to pairs_executor's no-op
# monitor via pipeline.monitor_unit_for) and linked by a shared pairs_group_id.
#
# ── EXECUTION GATE (the sanctioned strategy-level shadow/live switch) ──
#   execution: shadow  → compute the would-be 2-leg trade + write the soak,
#                        place NOTHING (observe-only; confirm live == backtest).
#   execution: live    → place the two legs on `account_id` (bybit_1 = Bybit
#                        DEMO / paper venue — real order placement, paper money).
#
# PAPER-ONLY, edge-gated (operator directive 2026-07-16): "if it's not negative,
# trade it on paper, but not on real money." The whole sleeve routes to bybit_1
# (Bybit DEMO / paper) — there is NO pairs config on a real-money account, so the
# "not real money" constraint is structural. Per-pair live/shadow is now an
# ECONOMICS call, driven by the G2 $-and-lots evidence
# (docs/research/pairs-sleeve-real-money-readiness-2026-07-16.md § G2 FINDINGS,
# trainer-diag #6612/#6615): the fee-free fixed-β-hold edge is
#   SOL/ETH +$1279 · BNB/BTC +$357 · SOL/BTC −$295 · ETH/BTC −$855.
# → the two positive-edge pairs (SOL/ETH, BNB/BTC) run `live` on paper; the two
#   negative-edge pairs (SOL/BTC, ETH/BTC) stay `shadow`.
# NOTE the earlier min-qty HALF-PLACEMENT safety reason for shadowing the BTC-quote
# pairs is RESOLVED — the #6591 both-legs-or-nothing gate (deployed) skips a sub-min
# pair cleanly (skip_size), so a naked leg can no longer form; shadow here is purely
# "no edge", not "unsafe". CAVEAT: on the taker paper venue every pair is NET-negative
# (7.5bps × 2 legs sinks the thin gross edge); paper placement is for EXECUTION
# validation while the maker-fee + live-β-rehedge fix is built, NOT for paper PnL.
# SUPERSEDED 2026-10-16 (operator decision "Fix + shadow", checklist row
# PAIRS-R-SCALE): all FOUR Bybit pairs are `shadow`. The G2 figures above were
# measured on an R unit inflated by rolling-β drift; the honest fixed-β-at-entry
# re-run is net-negative on every pair (SOL/BTC −0.112, BNB/BTC −0.376, ETH/BTC
# −0.526, SOL/ETH −0.383 R/trade, n 254-271), and the β-at-entry sizing fix
# (PR #18648) would grow Bybit pair legs by up to ~87x on a path with no notional
# cap. Re-entry to `live` waits on the pre-registered fixed-β ENTRY-trigger test
# (research unit RQ-20261017-9582-01). GLD/GDX (hedge_beta: one) is unaffected.
# Flipping a pair to `shadow` is the one-line rollback (config re-read each tick).
# Tier-3: flip only with operator approval.
#
# Rollback: set a pair back to `execution: shadow` (or delete this file → the
# sleeve is a complete no-op).

account_id: bybit_1                 # default account for all pairs (Bybit demo / paper)
# Per-pair $-risk-at-the-spread-stop is DERIVED from the account's canonical risk
# basis — live balance × the account's risk_pct (config/accounts.yaml::bybit_1.risk)
# × pairs_risk_fraction — NOT a hardcoded dollar literal. This is the same basis
# RiskManager.position_size uses for every other strategy (CLAUDE.md: "sizing is
# the per-account RiskManager's job; account basis × …"). The old hardcoded
# `risk_budget_usd: 20.0` was an architectural violation (BL-20260716-PAIRS-EXEC):
# a magic constant divorced from the account, which on the ~$166k paper balance
# under-sized every leg below the exchange minimum → the sleeve never traded.
# The executor reads the balance itself (execute._fetch_balance) each tick; a pair
# whose basis can't be read skips (skip_no_risk_basis) rather than sizing off a
# guessed number. Enforced by the pairs-sizing-basis CI guard.
pairs_risk_fraction: 1.0            # scale the sleeve's per-pair risk below the flat account basis (1.0 = full per-trade risk basis; e.g. 0.5 = half)
correlation_haircut_factor: 0.5     # per already-open correlated pair (shares a leg): 0.5**n
backstop_mult: 3.0                  # per-leg catastrophe SL/TP at 3x risk_spread in log-price (wide of the spread exit); the displacement is CLAMPED to +/-100%/-50% so a degenerate risk_spread can't explode the level (BL-20260716-PAIRS-BACKSTOP-EXPLODE, #6549). See pairs_sizing.leg_protective_levels.
min_leg_notional_usd: 10.0          # skip a pair whose sized leg notional is below this $ (would be sub-min / break the hedge if rounded up)

pairs:
  - name: pairs_sol_btc
    symbol_a: SOLUSDT
    symbol_b: BTCUSDT
    execution: shadow    # shadow-guard: allow — OPERATOR DECISION 2026-10-16 "Fix + shadow" (popup answer to the manager; checklist row PAIRS-R-SCALE): honest fixed-β R re-run is NET-NEGATIVE (−0.112 R/trade, n=267; was already shadow on the G2 2026-07-16 no-edge hold). Shadow so PR #18648 (β frozen at entry) cannot size this pair up ~87x on an uncapped sleeve. Rollback: back to live only on a passing fixed-β entry-trigger test.
    timeframe: 1h
    lookback: 15
    entry_z: 2.0
    exit_z: 0.5
    stop_z: 2.0
    max_hold_bars: 20
    hedge_beta: rolling

  - name: pairs_bnb_btc
    symbol_a: BNBUSDT
    symbol_b: BTCUSDT
    execution: shadow    # shadow-guard: allow — OPERATOR DECISION 2026-10-16 "Fix + shadow" (popup answer to the manager; checklist row PAIRS-R-SCALE): honest fixed-β R re-run is NET-NEGATIVE (−0.376 R/trade, n=254), and PR #18648 (β frozen at entry) would grow its legs by up to ~87x with no notional cap on the Bybit pairs path. Was live on paper since 2026-07-16. Rollback: set back to live (one line) — only on a passing fixed-β entry-trigger test.
    timeframe: 1h
    lookback: 15
    entry_z: 2.0
    exit_z: 0.5
    stop_z: 2.0
    max_hold_bars: 20
    hedge_beta: rolling

  - name: pairs_eth_btc
    symbol_a: ETHUSDT
    symbol_b: BTCUSDT
    execution: shadow    # shadow-guard: allow — OPERATOR DECISION 2026-10-16 "Fix + shadow" (popup answer to the manager; checklist row PAIRS-R-SCALE): honest fixed-β R re-run is NET-NEGATIVE (−0.526 R/trade, n=270; was already shadow on the G2 2026-07-16 no-edge hold). Shadow so PR #18648 (β frozen at entry) cannot size this pair up ~87x on an uncapped sleeve. Rollback: back to live only on a passing fixed-β entry-trigger test.
    timeframe: 1h
    lookback: 15
    entry_z: 2.0
    exit_z: 0.5
    stop_z: 2.0
    max_hold_bars: 20
    hedge_beta: rolling

  - name: pairs_sol_eth
    symbol_a: SOLUSDT
    symbol_b: ETHUSDT
    execution: shadow    # shadow-guard: allow — OPERATOR DECISION 2026-10-16 "Fix + shadow" (popup answer to the manager; checklist row PAIRS-R-SCALE): honest fixed-β R re-run is NET-NEGATIVE (−0.383 R/trade, n=271), and PR #18648 (β frozen at entry) would grow its legs by up to ~87x with no notional cap on the Bybit pairs path. Was live on paper since 2026-07-16. Rollback: set back to live (one line) — only on a passing fixed-β entry-trigger test.
    timeframe: 1h
    lookback: 15
    entry_z: 2.0
    exit_z: 0.5
    stop_z: 2.0
    max_hold_bars: 20
    hedge_beta: rolling

  # ── GLD/GDX daily — Alpaca, Stage-1 SOAK on alpaca_paper (PAPER money) ──────
  # OPERATOR DECISION 2026-10-12 (popup "Build, paper soak"; checklist row
  # PAIRS-ALPACA-BUILD, roadmap M22). Evidence: RQ-20261007-025 PASS
  # (research/results/RQ-20261007-025/ro0847-RQ-20261007-025.jsonl): OOS
  # 2022-01..2026-10 n=69 net +5.25R; 8/10 years positive; 8/9 neighbourhood
  # cells positive; costs fee 7.5 + slip 5.0 bps round-trip per leg. The params
  # below are EXACTLY the registered defaults that run used (scripts/
  # backtest_pairs.py: lookback 20, entry_z 2.0, exit_z 0.5, stop_z 2.0,
  # max_hold_bars 20, hedge_beta one, cooldown_bars 1). Not on any real-money or
  # mirror account; promotion follows the ladder (Gate 2 = realized cost vs the
  # 12.5 bps/leg the backtest assumed).
  # Session venue (src/units/strategies/pairs_venue.py): decides in the last
  # `decision_window_minutes` of the RTH session on the forming daily bar (the
  # harness fills at the close), counts max_hold/cooldown in TRADING bars,
  # whole shares, short-borrow + buying-power + directional-netting checks
  # before any leg is sent. leg_tp: spread_target = each leg's TP is the price
  # that closes the predicted reversion gap, re-estimated every bar (TP doctrine).
  # Rollback: set execution: shadow (or delete this entry).
  - name: pairs_gld_gdx
    account_id: alpaca_paper
    symbol_a: GLD
    symbol_b: GDX
    execution: live      # PAPER (operator decision 2026-10-12, Tier-3): alpaca_paper is paper money.
    timeframe: 1d
    lookback: 20
    entry_z: 2.0
    exit_z: 0.5
    stop_z: 2.0
    max_hold_bars: 20
    hedge_beta: one
    cooldown_bars: 1
    leg_tp: spread_target
    decision_window_minutes: 10
