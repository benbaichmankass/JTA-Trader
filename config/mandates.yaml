    # `cost_tolerance_bps` is now `2.0` and `blocked_until` was removed. See
    # the 2026-09-28 correction note near the top of this entry.]
    fires_when: >-
      A leg already on the Stage-1 soak roster for its exchange (or trading live
      on a prop account -- a `prop_live` soak source counts) has a committed
      Stage-0 evidence record that passes B1's four clauses and its identity
      check, clears the bar below, whose SOAK-stage1 contract reads `passed`
      (bar.soak_passed), and whose VENUE's measured round-trip cost for the
      leg's SYMBOL (bar.cost_basis: venue_symbol -- the venue's own MEASURED
      cost for that symbol, not a per-leg accrual) has a 95% CI upper bound at
      or below the slippage the leg's record modelled + bar.cost_tolerance_bps.
      An `inconclusive`, `insufficient_n` or absent venue-symbol measurement is
      NEEDS_DATA, never a pass. The PER-LEG R3 cost-fidelity verdict
      (RULE-R3-GATE1-COST-FIDELITY-v1) is no longer a promotion gate: it is
      ONGOING monitoring that feeds MD-DEMOTE-S2-S1 / MD-DEMOTE-S1-OFF
      (operator amendment 2026-10-15). On alpaca_equities and ibkr_futures,
      where no decisive measurement exists yet, the operator-accepted 5.0 bps
      provisional basis in `never:` below still applies and is checked first --
      a measurement never buys a way around it. The edit ADDS the leg to the
      Stage-2 account AND to its mirror -- Stage 2 is one stage, and the mirror
      carries the identical roster.
    never: >-
      Never a leg whose Stage-1 soak contract SOAK-stage1-<account>-<leg> in
      docs/claude/work/SOAKS.json is not `passed` (n_needed <= 2 clean trades,
      each clearing the mechanical checklist; a `prop_live` source counts).
      Never while `blocked_until`
      stands. Never onto an account whose account_class is not `real_money`.
      Never past the cap: total declared risk across AUTO-PROMOTED legs may not
      exceed 25% of the account's configured risk budget. Never on an equities
      or futures leg whose record modelled LESS than the 5.0 bps provisional
      slippage -- on those venues there is no measurement to compare against.
    evidence_required: >-
