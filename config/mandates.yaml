      brackets, but nothing is supposed to remove brackets". Rows LTR-ALL-ACTIONS,
      DESK-13-MANDATE; the system-wide half is row BRACKETS-ALWAYS.
    functions:
      in_trade:
        what: the live trade review -- managing OPEN order packages (live-trade-review SKILL; REVIEWER-BRIEF for a repo-less reviewer)
        actions: [tighten_sl, close, partial_close, move_tp, widen_sl, change_size, add_entry]
        state: armed (apply_mode in config/live_trade_review.yaml decides per account)
      entry_generation:
        what: desk-generated NEW entries from the desk's scan packet (trading-desk SKILL)
        actions: [propose_entry]
        state: live_demo
        # The demo floor (operator popup 2026-10-27, relayed by manager session_01C1ooo4kqBbng7vytdG1UVs, verbatim
        # "Yes, live on bybit_1 demo now (Recommended)"): desk-generated entries trade on these accounts ONLY, and
        # only while every account rostering the claude_desk leg is one of them AND is a demo/paper account in
        # config/accounts.yaml (scripts/ops/desk_intake.py entry_gate). blocked_until below still binds every
        # other account (real money, mirrors, prop). REVERT: delete demo_accounts and set state back to shadow.
        # 2026-10-27 DESK-PAPER-ACCOUNTS: alpaca_paper + ib_paper added (operator verbatim, chat ~15:58Z, relayed by
        # Manager Session 2026-10-27a: "I do want to have the desk live on the other paper accounts as well, so Alpaca
        # and IB."). Both are account_class: paper; the floor still closes for all if a real-money account rosters the leg.
        demo_accounts: [bybit_1, alpaca_paper, ib_paper]
        blocked_until: >-
          The DESK-13 gate, operator verbatim "Beat random entries only": the
          desk's entries show OOS edge vs the random-entry baseline, net of the
          full cost stack, at n >= 30 graded decisions
          (scripts/ops/desk_grade.py promotion_gate), recorded as a committed
          evidence record on row DESK-13-MANDATE. Until then generated entries
          trade only on demo_accounts above and are record-only everywhere else
          (every one replayed and graded). Clearing it is a committed record
          plus the manager's PR, never a session's own act.
    scope: >-
      Every account carrying the package (real-money, prop and paper), each
      through its own RiskManager (approve_amend for a tighten, approve_action
      for every other action) and its own existing executor
      (scripts/ops/live_review_apply.py --apply). An account with no executor for
      an action refuses it as no_action_path:<action>, named, pinged once on a
      real-money or prop account; it never falls back to another account's path.
    fires_when:
      - a committed decision row (comms/live_review/reviews.jsonl for the in-trade function) whose action is one of that function's `actions`, its decision packet recorded, read at a PINNED commit on main or on the protected append-only branch live-review/rows
      - the row carries a non-empty reason AND either evidence_source table (a measured LTR-0 cell; for a tighten the Q1 bound ev_delta_r >= -0.25 and worst_case_delta_r > 0; for any other action its ev_delta_r) or evidence_source judgement with judgement_confidence in [0, 1] -- the operator's "as long as they have reasoning and confidence attached"
      - the row carries the action's own target (tighten_sl / widen_sl / move_tp a price level; partial_close a size_fraction in (0, 1); change_size a size_multiplier > 0 and != 1; add_entry a size_fraction > 0)
      - mechanics.verdict == match
      - config/live_trade_review.yaml apply_mode == apply for the account
      - the account's own approve_amend / approve_action returns approve or clip. Its checks are the account's OWN and are never bypassed - a tighten is tighten-only beyond the min_buffer_atr noise floor; a widened stop and any added size pass the same risk check a fresh entry would (account live, leg not shadow, the daily-DD switch's block on new risk, the gross-exposure cap, total size <= the size a fresh entry at the stop in force would get); every result keeps BOTH brackets; one action per package per closed bar; could_not_look never applies
      - entry_generation additionally needs its blocked_until cleared
    never: [act on a read that could not look, act on a mechanics mismatch, act without a recorded reason and either a confidence or a table basis, write mode or execution, remove or null a stop-loss or a take-profit on any action (move_tp / tighten_sl / widen_sl MOVE a bracket and never delete one; a partial_close or change_size leaves the remaining position with BOTH brackets; an add_entry is placed with both brackets; a close removes the position, not just its brackets), leave a leg without a REAL take-profit (TP doctrine -- no sentinel, no TP through the mark), bypass an account's per-trade risk limit / sizing cap / exposure cap / daily-DD switch, route one account's action through another account's executor, place a desk-generated entry before entry_generation's blocked_until clears]
    notify: trade-update ping tagged with the mandate per applied account; ONE ping per refuse / no_action_path / apply_failed on a real-money or prop account; ONE flag after 3 consecutive could_not_look cycles; brief section 1 line with the decision row
    review_rule: >-
      The MD-LIVE-TIGHTEN-SL review_rule (operator "1", 2026-10-26), applied to
      the whole mandate, graded per action class AND per function (in_trade vs
      entry_generation): scripts/ops/live_review_grade.py use_rules (hold-vs-
      action counterfactual, scripts/research/live_review_counterfactual.py) and
      scripts/ops/desk_grade.py. Proposals only, nothing automatic.
    soak: >-
      Mechanical (OPERATING-PLAN § 2): the first apply of each action type on
      each venue is checked against the venue read-back (including both
      brackets present after it) and recorded on checklist row LTR-ALL-ACTIONS;
      1-2 clean applies per action type, never a sample size or a calendar.
    revert: a close, partial close or filled size change cannot be undone; disarm per account with config/live_trade_review.yaml accounts.<id>.apply_mode recommend, or all with apply_mode recommend; restore the pre-2026-10-26 state by deleting this entry (MD-LIVE-TIGHTEN-SL still grants the tighten alone)

