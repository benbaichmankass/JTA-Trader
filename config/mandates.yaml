    # cleared" note earlier in this block (which is chronologically NEWER
    # despite appearing above it on the page). Clause (a) is no longer
    # blocking as of 2026-09-28 -- re-measured at 0 of 27 differing records --
    # and `blocked_until` was removed from this entry the same day (PR
    # #13582). Do not read this sentence as the current state.
    # ⚠️ CLAUSE 3 NAMES A PER-LEG VERDICT, NOT A VENUE POINT ESTIMATE
    # (2026-09-25, checklist row R3). It previously read "whose venue's realized
    # round-trip cost is within bar.cost_tolerance_bps of what the record
    # modelled" -- one number for a whole venue, which a leg with three measured
