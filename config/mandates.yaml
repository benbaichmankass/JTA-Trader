  # manager skill says "expiry is load-bearing -- an expired mandate stops
  # authorizing"; writing an `expires:` this file was not given would be a
  # session inventing the bound of its own authorization, which is the one thing
  # it may never do. If the operator wants expiry, it is granted, not inferred.
  #
  # THE BAR and THE CAP below are the operator's 2026-09-21 decisions, recorded
  # on checklist row B5 and in § 5.3 "The bar and the cap — DECIDED 2026-09-21":
  # expectancy > 0 net of the FULL cost stack at n >= 30 closed; positive in a
  # MAJORITY of walk-forward folds; Stage-1 realized cost within a stated
  # tolerance of modelled; total declared risk across AUTO-PROMOTED legs <= 25%
  # of the account's configured risk budget, with NO RATE LIMIT.
  # <!-- population-ok: a configured ceiling the operator chose, not a measurement -->

  - id: MD-PROMOTE-S0-S1
    grants: add a leg to the Stage-1 soak book on a passing Stage-0 record
    direction: add_risk
    granted_by: operator (Ben)
    granted_at: '2026-09-24'
    source: >-
      Popup in session_01Ljhs6sFAdWHdMDhJpL5aBP, 2026-09-24 ~17:15Z, verbatim
      "Grant all 10 as written"; recorded on checklist row B5. The underlying
      grant is the operator's 2026-09-21 ladder mandate, quoted in
      docs/plans/OPERATING-PLAN-2026-09-21.md § 5.3.
    fires_when: >-
      A leg not on a Stage-1 soak roster (bybit_1, alpaca_paper, ib_paper) has a
      committed Stage-0 evidence record at comms/strategy_evidence/<leg>.json
      that passes B1's four clauses and its identity check, whose source_run is
      a committed file in the repo, and that clears the bar below. The edit ADDS
      the leg to that one soak roster and nothing else.
    never: >-
      Never a leg whose record is missing, unreadable, or cites a source_run
      absent from the repo. Never onto a Stage-2 roster -- Stage 2 is reached
      only through Stage 1. Never when the account's account_class is not
      `paper`; a class mismatch is config drift the resolver will not paper
      over. Never past the cap.
    evidence_required: >-
      The committed record -- named harness, stated n, decision rule registered
      before the run, net of the full cost stack -- plus the realtime ping and
      the section-1 evidence review in the next daily brief.
    bar:
      min_n_closed: 30
      expectancy_gt: 0
      fold_majority: true
      # OPERATOR DECISION 2026-10-16 (popup "Require holdout", relayed by Manager
      # Session 2026-10-16 session_01VduHYzdaXe27wTDBLSu8ao; verbatim on checklist
      # row PROMOTION-BAR-MULTIPLICITY): "From now on, promotion needs a pass on the
      # held-back 25% you just approved. That's one setting tested once, so no
      # deflation is needed. Live legs are not demoted on this number (live
      # net-of-cost results still govern demotion), but all 8 real-money legs get
      # holdout re-runs first." The Stage-0 record must carry `holdout_confirmation`:
      # the configuration SELECTED on the earliest span, evaluated ONCE on a
      # pre-registered, never-seen latest span (~25%, grown to holdout_min_n trades,
      # capped at 40%), same rule, full cost stack, positive net of cost.
      # mandate_resolver.py clause R-HOLDOUT: absent or unreadable -> NEEDS-DATA
      # naming the holdout unit, never REFUSE; a valid confirmation that failed ->
      # REFUSE. holdout_min_n (25) is the held-back trade floor from the same
      # dispatch. Nothing else in this entry changed; MD-DEMOTE-S2-S1 is untouched.
      holdout_required: true
      holdout_min_n: 25
    cap:
      basis: uniform_account_risk_pct_share_of_roster
      max_auto_share: 0.25

