      before the run, net of the full cost stack -- the realized-cost record it
      was checked against, the cap arithmetic, the realtime ping, and the
      section-1 evidence review in the next daily brief.
    bar:
      min_n_closed: 30
      expectancy_gt: 0
      fold_majority: true
      # ⚠️ § 5.3 requires clause 3 to be checked against "a stated tolerance"
