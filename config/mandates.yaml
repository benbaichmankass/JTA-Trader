  - id: MD-SOAK-EXIT-CELL-PATHB
    grants: declare a passing stop-multiplier (atr_stop_mult) cell on a leg that sits ONLY on Stage-1 soak rosters
    direction: exit_geometry
    proposed_by: session_01R2PHzyjMvQoNiB39SdYWco
    proposed_at: '2026-09-30'
    granted_by: operator (Ben)
    granted_at: '2026-09-30'
    amended_by: operator (Ben)
    amended_at: '2026-09-30'
    amendment: >-
      Bound ADDED by the operator in the PATHB-MANDATE lane session, verbatim
      "Yes, make spy_pullback_1h's contamination a bound", in answer to the lane's
      question whether the coverage matrix's `timeout_binding: CONTAMINATED` flag
      (the harness force-closes at 200 bars; live has no such exit) should become
      a bound. Clause (8) below. The grant otherwise stands as written.
      CONSEQUENCE, stated for the record: the bound also refuses four legs from the
      operator's 2026-08-30 approved batch -- trend_donchian, trend_donchian_ada_4h,
      trend_donchian_avax_4h, trend_donchian_sol_4h -- because the audit reads them
      contaminated (binding 20/38, 17/38, 2/39, 2/38).
    source: >-
      Popup in manager session session_01HYq6XtfesZ57VyaQrK6CL1, ~05:15Z
      2026-09-30, answered verbatim "Grant; firing opens a PR (Recommended)".
      The popup stated the bounds as written here. Recorded by the manager on
      checklist row PATHB-MANDATE in docs/claude/work/MANAGER-CHECKLIST.json
      (PR #14550). Confirmed again directly by the operator in this lane's
      session, 2026-09-30: "Grant confirmed, proceed with the mandate move".
      NO auto-land: a fire opens a PR and pings, and the manager merges it.
    recurrence: 2 occurrences (2026-08-30 batch of 8 cells with a computable ratio; 2026-09-29 #14332)
    # `direction: exit_geometry` is NOT add_risk|derisk_only, so `_decide()` (the
    # roster resolver) REFUSES this id by design. It is evaluated by
    # mandate_resolver.resolve_exit_cell() -- `python3 scripts/ops/mandate_resolver.py
    # --leg <leg> --exit-cell <cell> [--dry-proposed]`. A tighter stop raises
    # notional per unit risk (1.24x-1.93x over the measured population), so it is
    # NOT filed as derisk_only.
    fires_when: >-
      For ONE (leg, cell) in docs/research/e35-bracket-corpus.jsonl, read at
      fire time: (1) EVERY account roster in config/accounts.yaml that lists the
      leg is a Stage-1 paper soak account (bybit_1, alpaca_paper, ib_paper) --
      Stage-1 MEMBERSHIP, never `account_class`, because bybit_portfolio and
      alpaca_portfolio are class `paper` and are Stage-2 mirrors; a leg on any
      other account, including a mirror, a prop account or alpaca_options_paper,
      is out of scope; (2) every graded corpus row for the cell says
      `path_b_wf_pass`, and the newest is `state: measured`, `axis: stop`,
      `gate_path: B`, with no `tp_r` and no `timeout` (no live unit implements a
      bar-count exit), from a `family` in {pullback, donchian}; (3) net_R rises in
      BOTH the IS and OOS windows and capital/day rises; (4) base OOS trades >=
      bar.min_oos_trades; (5) wf_wins_effective / wf_usable clears
      bar.min_wf_win_fraction with wf_usable >= bar.min_wf_usable; (6) the
      cell's full-history d_max_dd is within the sweep's own exchange-rate
      allowance min(D_b x dN/N_b, D_b) AND within
      bar.max_dd_worsening_frac_of_base of the base drawdown; (7) the cell's
      leverage_multiple <= bar.max_leverage_multiple; (8) the leg's verdicts are
      not CONTAMINATED by the harness timeout force-close: EITHER
      scripts/research/timeout_binding_audit.audit() re-run over the corpus reads
      `contaminated` OR the coverage matrix's own `timeout_binding` note reads
      `leg CONTAMINATED` refuses (fail closed), and an audit that cannot run or
      reads `no_power` is NEEDS-DATA, never a pass. ⚠️ THE TWO READINGS DISAGREE ON
      spy_pullback_1h AT ADOPTION: the matrix note says CONTAMINATED (17 of 39
      pairs), the audit over both the 08-29 and 08-31 sweeps says clean (0 of 39).
      RE-DERIVED 2026-09-30 from the RAW rows (base arm vs the 400-bar arm per
      geometry, no audit() code): 0 of 39 (08-31) and 0 of 35 (08-29) differ, no
      null arms; no leg in any sweep has exactly 17 of 39 (the only 17-binding
      leg is trend_donchian_ada_4h, 17 of 38). So the NOTE is the stale reading
      and the audit the reliable one; it is refused through the note only because
      the bound fails closed until the note is corrected (PI-20260930-39SDYWCO-0004). The edit changes ONE key,
      `atr_stop_mult`, on that one leg in config/strategies.yaml, and nothing
      else. One cell per leg per fire, chosen by the rule B4 stated in advance:
      highest wf_wins_effective, tie-break d_net_r, over the leg's gate-passing
      cells.
    never: >-
      Never a leg present on ANY of bybit_2, bybit_portfolio, alpaca_live,
      alpaca_portfolio, ib_live, breakout_1, or any account not listed as
      Stage-1 above. Never a row that is missing, unmeasured, or whose
      base_oos_trades is null -- "could not look" is not a pass. Never a cell
      any graded corpus row disagrees with. Never a cell carrying a `timeout` or
      a `tp_r`. Never a harness family outside {pullback, donchian}; in
      particular never scripts/backtest_orb.py, src/backtest/backtester.py,
      scripts/backtest_xsec_momentum.py or scripts/backtest_vol_target.py.
      Never touches config/accounts.yaml, config/mandates.yaml, a roster, a risk
      cap, `mode:` or `execution:`. Never lands itself: the PR declares
      `landing: hold`.
    evidence_required: >-
      The corpus row (measurement_key and source run), the leg's regenerated
      comms/strategy_evidence/<leg>.json produced by the harness rather than
      hand-edited, the exit-refinement-coverage.json cell flipped in the same PR,
      the realtime ping, and the section-1 evidence review in the next daily
      brief. The regenerated record's net_r_oos must not be WORSE than the
      committed one it replaces (#14332: -14.07 -> -8.55; both read
      decision_rule.verdict=fail on a harness that omits skip_hours -- so this
      mandate ships exit geometry on a soak leg, it does not certify the leg).
    # Every number below is either taken from the sweep/skill, or PROPOSED with
    # its reasoning stated here -- none is a fitted constant. INFERRED entries
    # say so, and the operator may move any of them.
    bar:
      # skill § "MIN-OOS-TRADES FLOOR", operator-set 2026-08-11 -- a denominator
      # requirement, carried unchanged.
      min_oos_trades: 25
      # PROPOSED TIGHTENING of the sweep's "wf_usable >= 4 and wins x 3 >= usable x 2"
      # (=> 4/6 passes). Arithmetic, not evidence: under a coin-flip null with
      # independent folds P(>=4 of 6) = 22/64 = 34%, P(>=5 of 6) = 7/64 = 11%. The
      # sweep grades ~10 cells per leg across ~44 legs, so a 4/6 gate is close to no
      # filter, and an unattended fire has no human to catch a selection artifact.
      # (Folds are NOT independent, so read 11% as an order of magnitude.) 5/6
      # keeps 6 of the 8 batch cells with a computable ratio and drops
      # htf_pullback_trend_2h and avax_pullback_2h (4/6; their maxDD ask was <= 0).
      # Those two go to the operator, as they did before.
      min_wf_usable: 5
      min_wf_win_fraction: 0.8
      # PROPOSED. The largest maxDD-worsening (d_max_dd / base maxDD, full history)
      # in the 2026-08-30 batch is 0.35 (trend_donchian_avax_4h sm1.5); #14332 is
      # 0.24. The mandate is meant to REPEAT what the operator already accepted,
      # not extend it, so the cap is that batch's own maximum. The 2026-08-29 batch
      # went further (mgc_pullback_1d 0.94, slv_trend_1h 0.76) -- the operator
      # approved those individually, and this cap deliberately routes cells like
      # them back to a person. The sweep's exchange-rate test (clause 6) is
      # enforced BESIDE it and is NOT redundant: it would let gld_pullback_1h
      # sm1.5 (0.39) and slv_trend_1h sm1.5 (0.76) through; this cap does not.
      max_dd_worsening_frac_of_base: 0.35
      # INFERRED, PROPHYLACTIC, BINDS ON 0 OF THE 46 MEASURED path_b_wf_pass ROWS
      # (max 1.93x). A tighter stop raises notional per unit of risk; this only
      # bounds a future cell. It is a bound on a future cell, not a correction of a
      # present one -- strike it if a control that controls nothing is unwanted.
      max_leverage_multiple: 2.0
      # OPERATOR-ADDED 2026-09-30 (see `amendment`). true = clause (8) is part of the
      # grant; the resolver REFUSES the whole mandate if this is not stated.
      refuse_timeout_contaminated: true
    # AUTO-LAND: NOT GRANTED (operator, same popup). Short form:
    # scripts/ci/check_mandate_autoland.py clause A1/A2 is built for REMOVALS from
    # accounts.yaml and refuses config/strategies.yaml; this entry ADDS notional
    # per unit risk on paper; and it has never fired once. No `autoland:` field.

  # ── PROPOSED 2026-10-04, GRANTED 2026-10-04 ──────────────────────────────────
  # Proposed by lane SOAK-WATCH in docs/plans/soak-verdicts-2026-10-04.md
  # § "Proposed mandate": the same Tier-3 question ("Stage-1 soak complete,
  # Stage-0 record fails, nothing removes it") arrived once per ready leg on
  # 2026-10-04. GRANTED by the operator. Transcribed here by lane MANDATE-S1-CUT
  # in a PR the lane does not merge (landing: hold); the manager reviews and merges.
  - id: MD-S1-CUT-ON-STAGE0-FAIL
    grants: remove a Stage-1 leg from its Stage-1 paper roster when its Stage-0 evidence record fails
    direction: derisk_only
    proposed_by: SOAK-WATCH lane (manager session_01MM8o5js6TcDFeNAPBY4Ntv)
    proposed_at: '2026-10-04'
    granted_by: operator (Ben)
    granted_at: '2026-10-04'
    source: >-
      Popup in manager session session_01MM8o5js6TcDFeNAPBY4Ntv, 2026-10-04
      ~21:25Z, answered verbatim "Grant it (Recommended)" to granting the
      mandate proposed in docs/plans/soak-verdicts-2026-10-04.md: remove a
      Stage-1 leg from a Stage-1 (paper) roster (bybit_1 / alpaca_paper) when
      its Stage-0 evidence record fails, whether net of cost, on folds, on
      sample size or on affordability; de-risk only, removes and never adds,
      touches no real-money roster, and reports every cut to the operator.
      Confirmed to lane MANDATE-S1-CUT in its own session ("Go"), 2026-10-05.
      Recorded on checklist row MANDATE-S1-CUT.
    recurrence: >-
      2026-10-04: every ready/overdue Stage-1 soak that REFUSED promotion on its
      Stage-0 record (docs/plans/soak-verdicts-2026-10-04.md § 1, § 3) had no
      mandate able to remove it. MD-DEMOTE-S1-OFF fires only on an R3
      `divergent` cost verdict; MD-DERISK-ONLY-ROSTER-CUT covers real-money
      rosters only.
    # Evaluated by scripts/ops/mandate_resolver.py::_s1_cut_on_stage0_fail,
    # reached ONLY as `--from S1 --to OFF --account <acct> --mandate
    # MD-S1-CUT-ON-STAGE0-FAIL`. TRANSITION_MANDATE still maps S1 -> OFF to
    # MD-DEMOTE-S1-OFF, so no existing consumer changes behaviour.
    fires_when: >-
      ALL of: (1) the account is in scope_accounts (bybit_1, alpaca_paper);
      (2) the leg is `execution: live` and on NO roster other than paper soak
      books: not on bybit_2, bybit_portfolio, alpaca_live, alpaca_portfolio,
      ib_live, breakout_1, tradeify_1, or any account whose account_class is
      not `paper`; (3) its committed Stage-0 record at
      comms/strategy_evidence/<leg>.json is DECISIVE (B1 C1-C3: named harness,
      stated n, the full cost stack; B1 identity: bound to the leg's current
      config; source_run committed) and FAILS at least one of: its
      decision_rule verdict is `fail` with the rule registered before the run
      (R-CUT-RULE); expectancy_r_oos or net_r_oos <= 0 net of the full cost
      stack (R-CUT-EXPECTANCY); positive folds are not a majority
      (R-CUT-FOLDS); n_trades_oos < bar.min_n_closed (R-CUT-N); or, only when
      none of those fails, the exchange's Stage-2 account (bybit_2 /
      alpaca_live) sizes NONE of the leg's committed setups at its measured
      equity (R-CUT-AFFORD, the S1->S2 R-AFFORD measurement reused); and (4)
      its Stage-1 soak contract SOAK-stage1-<account>-<leg> reads a state in
      bar.soak_states in the newest committed snapshot under
      comms/mandate_evidence/soak_state/ captured within
      bar.soak_snapshot_max_age_days. The edit REMOVES the leg from that one
      Stage-1 roster in config/accounts.yaml and nothing else.
    never: >-
      NEVER an addition. Never a leg on any real-money roster or Stage-2
      mirror; that path is MD-DEMOTE-S2-S1. Never touches
      config/strategies.yaml, `mode:`, `execution:`, a risk cap or another
      account's roster. Never on a record that is missing, unreadable,
      fee-only, stale against the leg's config, or cites a source_run absent
      from the repo: "could not look" is not a cut signal. Never on a soak
      that is awaiting_first_trade, in_progress, unknown, absent from the
      snapshot, or read from a stale snapshot (vocabulary re-mapped
      2026-10-15 from accruing / dead / unknown; see bar.soak_states). Never an `execution: shadow` leg (not a Stage-1 soak).
      Never lands itself: no `autoland:`; the PR declares `landing: hold` and
      a human merges.
    evidence_required: >-
      Per leg: the Stage-0 record path, its harness, n, net-of-full-cost
      expectancy, folds and decision-rule verdict, and the failing clause(s);
      the soak snapshot path, its captured_at and the soak's state; the
      resolver verdict line. Plus the realtime ping to the operator and the
      section-1 evidence review in the next daily brief.
    scope_accounts: [bybit_1, alpaca_paper]
    bar:
      # Same floor as MD-PROMOTE-S0-S1 / MD-PROMOTE-S1-S2: a record below it
      # could never promote, which is what "fails on sample size" means here.
      min_n_closed: 30
      expectancy_gt: 0
      # Majority, as the promotion bar reads it: 2 of 4 is NOT a majority and
      # fails. (The proposal's prose said "a fold minority"; the grant says
      # "fails on folds", which is the promotion bar's fold clause.)
      fold_majority: true
      affordability: true
      # soak_state.STATES. RE-MAPPED 2026-10-15 (lane SOAK-REDEFINE, landing:
      # hold, the manager merges) because the operator redefined the soak the same
      # day (verbatim: "A soak is a mechanical verification that was already
      # proven in backtesting, and nothing needs to soak for more than one or two
      # trades"). The old values were "complete = n reached (ready) or end date
      # passed (overdue)"; NEITHER STATE EXISTS ANY MORE (a mechanical soak has no
      # sample size and no end date), so left unchanged this mandate could never
      # fire again. The translation keeps the clause's meaning -- "the soak has
      # reached a verdict": passed (n_needed <= 2 clean trades) or mechanical_fail
      # (a fault, to fix and re-soak). awaiting_first_trade / in_progress /
      # unknown stay NEEDS_DATA, as accruing / dead / unknown did.
      # ⚠️ FOR THE OPERATOR: since edge is decided OFFLINE, a failing Stage-0
      # record is arguably enough to cut a paper leg whatever its soak state.
      # Dropping this clause would WIDEN the mandate (it would then cut legs still
      # awaiting a first trade), so it is not done here -- it is the operator's.
      soak_states: [passed, mechanical_fail]
      soak_snapshot_max_age_days: 7

