# WSD-S4-READERS-FLIP: pin ONLY the work store's path for the register's VM readers
# (ict-work-digest, ict-work-report). After the freeze they read the register through
# checklist_store / pipeline.read_log, which read work_store_db_path(); ict-web-api and
# ict-work-store-import resolve that to $DATA_DIR/work_store.db = /data/bot-data/work_store.db.
# Deliberately NOT the full data-dir drop-in: that would also move these units' runtime_logs_dir().
[Service]
Environment=WORK_STORE_DB=/data/bot-data/work_store.db
