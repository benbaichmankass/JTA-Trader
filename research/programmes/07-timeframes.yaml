# ── Q5 -- regime-filtered daily position trading (arm A4) ───────────────────────────────────────────────────────────────
- id: P7-Q5-confirm
  goal: G1
  roadmap: [L-TIMEFRAMES, L-REGIME]
  value: {usd_at_stake_per_month: 150, confidence: 0.3}
  after:
  - {unit: RQ-20261021-7c2b-03, verdict: any}
  - {unit: RQ-20261026-f679-05, verdict: any}
  unit:
    title: 'DISJOINT-SYMBOL confirmation of the daily long-only Donchian-20 (f679-05 PASS): does LONG pass the same pooled Stage-0 rule and beat unfiltered B by >= 0.10 R/trade on six perps outside the twelve
      (TRX/ETC/XLM/ATOM/VET/FIL)?'
    cadence: once
    priority: 2
    kind: experiment
    theme: timeframes
    question: On Binance USD-M daily candles for TRXUSDT, ETCUSDT, XLMUSDT, ATOMUSDT, VETUSDT, FILUSDT over 2020-06-01..2026-10-25 (donchian 20, trail_mult 5.0, the f679-05 parameters and window unchanged),
      does LONG (--long-only) pass the pooled Stage-0 rule AND beat unfiltered B by >= 0.10 R per trade?
    why_this_matters: 'Node P7-Q5-confirm, PASS branch. RQ-20261026-f679-05 PASSED: LONG pooled 181.4 R over 12 perps (ef5d-06 six + 7c2b-03 six), beating B; but it pooled symbols that already had two committed
      records on purpose, so its own rule names this disjoint-symbol check as the next unit before the long-only daily filter is treated as fold-consistent (RESEARCH-NO-WAIT order 2: a symbol holdout; correlated
      evidence, said so: crypto alts co-move). Symbols fixed now, chosen only for a Binance USD-M daily history covering most of the window and a Bybit linear listing; none of the six appears in any committed
      daily-Donchian record. Decision changed: PASS -> the P7-Q6-daily-donchian overlap read uses the LONG arm and the long-only filter enters any daily re-entry case with an out-of-sample breadth read; FAIL
      -> the f679-05 pass is recorded on 07 s1 as specific to the twelve (a symbol fit) and the daily arm proceeds unfiltered. Arm denominator 2 (B, LONG), nothing re-selected.'
    power:
      expected_n: 200
      min_detectable_effect: 0.3
      effect_units: sd
      design: one_sample
      alpha: 0.05
      power: 0.8
      basis: 'f679-05 LONG kept 32-41 trades per perp over the same window and params (MEASURED); six perps with shorter listings (FIL from 2020-10) -> ~200 pooled LONG trades (an estimate). Floors as f679-05:
        20 per cell, 39 pooled; a cell under 20 is named indeterminate, never dropped.'
      feasibility:
        source: none
        accrual_basis: Re-measurement on freshly fetched public candles over a pinned window; nothing accrues.
    evidence_class:
      holdout: holdout_window
      claim: edge
    decision_rule:
      id: RULE-P7-Q5-CONFIRM-DISJOINT-SYMBOLS
      registered_before_run: true
      statistic: 'harness_stage0.py --family trend --timeframe 1d, arms fixed now: B=; LONG=--long-only; baseline B; per cell and pooled across TRXUSDT,ETCUSDT,XLMUSDT,ATOMUSDT,VETUSDT,FILUSDT; 6 calendar folds
        (~1 year each over the 6.4-year window), net of the harness''s venue-aware fee + slippage + funding.'
      rule: 'PASS iff LONG passes the pooled Stage-0 rule (pooled n >= 39, pooled net R > 0, pooled folds >= 4 of 6 net positive, cells passing >= half of the powered cells) AND beats B by >= 0.10 R/trade.
        FAIL iff LONG fails with pooled n >= 39. INDETERMINATE iff pooled n < 39, fewer than 2 powered cells, or fewer than half the declared cells measured (cells under the floor named, the floor never lowered).
        Verdicts are harness_stage0.py''s own under exactly these flags. Regime-robustness (REPORTED in the result''s per-fold table and read before any Tier-3 note, not separately graded by the harness): net
        positive in >= 4 of the 6 roughly-yearly folds is graded above; no single fold above 50% of total pooled net R; long-only, so the short-side clause does not apply. Holm-corrected p-values are reported,
        not graded. Thresholds are not changed after any result.'
      what_it_does_not_do: Does not edit config/strategies.yaml, config/accounts.yaml or any roster; adds no symbol to any book; tunes nothing beyond the two fixed arms; does not pool with f679-05 or any committed
        record; is not a promotion case. Candles are Binance USD-M (a PROXY for Bybit linear) and funding is a directionless magnitude, both stated in the record.
    compute: cpu_long
    value:
      bucket: frontier
      usd_at_stake_per_month: 150
      confidence: 0.3
      basis: 'stand-in (node weight): decides whether the daily arm''s one live lead carries a long-only filter; an estimate.'
    routing:
      needs_trainer_resident_data: false
      needs_gpu: false
      peak_memory_gb: 4.0
      est_minutes: 40
      basis: Half the cells of f679-05 (est 60 min for 12 perps x 2 arms); estimate, the first run replaces it.
      why_runner: harness_stage0.py fetches keyless public Binance candles; these symbols are not in the metis-market-data allowlist and a Kaggle kernel has no internet; CPU only.
    run:
      command:
      - python3
      - scripts/research/harness_stage0.py
      - --family
      - trend
      - --symbols
      - TRXUSDT,ETCUSDT,XLMUSDT,ATOMUSDT,VETUSDT,FILUSDT
      - --timeframe
      - 1d
      - --days
      - '2500'
      - --start
      - '2020-06-01'
      - --end
      - '2026-10-25'
      - --param
      - trail_mult=5.0
      - --arm
      - B=
      - --arm
      - LONG=--long-only
      - --baseline
      - B
      - --delta-r-per-trade
      - '0.1'
      - --folds
      - '6'
      - --fold-majority
      - '4'
      - --n-floor
      - '20'
      - --pooled-n-floor
      - '39'
      - --breadth-frac
      - '0.5'
      - --rule-id
      - RULE-P7-Q5-CONFIRM-DISJOINT-SYMBOLS
      - --data-dir
      - '{out_dir}/data'
      - --out
      - '{out_dir}'
      timeout_minutes: 240
    lands:
      store: research/results/
      assert_field: read_state
      min_rows: 1
    ml_consumer:
      not_applicable: 'Not an ML unit: a rule-based daily trend filter read on a symbol holdout.'
    intervention_controls:
      not_applicable: Entry-filter A/B (B vs LONG) over the harness, not an active-management action.
    programme: P7
    related:
    - research/queue/RQ-20261026-f679-05.yaml
    - research/queue/RQ-20261021-7c2b-03.yaml
    - research/queue/RQ-20261018-ef5d-06.yaml
    - scripts/research/harness_stage0.py
