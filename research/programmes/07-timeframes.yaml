# Programme P7 -- TIMEFRAMES (the horizon frontier): the machine-readable question tree for
# docs/research/programmes/07-TIMEFRAMES.md (s3 questions Q1-Q14, s5 backlog W1-W4).
# Same contract as research/programmes/01-active-trade-management.yaml (read by scripts/research/queue_replenish.py;
# every edit holds for a human merge; `value` figures are INFERRED planning weights, not measurements).
# Authored 2026-10-18 by lane FRONTIER-TIMEFRAMES-1018 (manager dispatch; operator 2026-10-18: "the LOWEST-priority
# research theme, but start planning it now and get tests into the queue soon").
#
# Two arms, one instrument first. Arm A (longer horizons: daily/weekly bars, weeks-long holds, regime-filtered position
# trading) and arm B (shorter horizons: NEW breakout families whose expected move clears the full fee+slippage stack).
# Each arm opens with the cost-aware break-even study (scripts/research/timeframe_breakeven.py: RQ-20261018-ef5d-01 long,
# -02 short), which decides which horizons can pay before any strategy is tried on them. The Stage-0 units run on
# scripts/research/harness_stage0.py (a harness family at FIXED params on symbols/bars no roster carries; calendar folds;
# pooled across symbols; breadth over powered cells; Holm reported). Units registered directly (they dispatch on merge):
# RQ-20261018-ef5d-01..09 in research/queue/; ef5d-10 (ORB) and -11 (ignition) in research/queue/blocked/ on the two
# harness rows below. The nodes here are what follows each verdict, plus the questions carried by builds.
#
# Prior work this programme builds on (do not re-run): RQ-20260930-504/505 (<=1h discovery grid at live/default params,
# FAIL at taker cost), RQ-20261016-1fa6-07 (maker entries, FAIL on the causal 15m scalp book), the 2026-10-06 prop
# breadth batch RQ-20261006-005..031 (5m-15m taker FAIL as a configuration class), the idea-family review
# docs/research/idea-family-review-2026-10-16.md s11/s13/s16, rows IR-CRYPTO-DAILY-TREND (its first step is delivered by
# harness_stage0.py) and IR-INTRADAY-SEASONALITY-HARNESS.
programme: P7
