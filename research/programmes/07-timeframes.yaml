- id: P7-Q6-weekly-etf
  goal: G1
  roadmap: [L-TIMEFRAMES, L-LADDER, M18]
  value: {usd_at_stake_per_month: 150, confidence: 0.3}
  after:
  - {unit: RQ-20261018-ef5d-05, verdict: pass}
  unit:
    title: 'Weekly ETF trend (ef5d-05 LO PASS): how many independent bets are the twelve powered weekly long-only ETF cells (N_eff >= 3.0), and which are same-bet clusters, before any count of passing cells
      is quoted?'
    cadence: once
    priority: 2
    kind: deterministic
    theme: timeframes
    question: 'Using the committed LO-arm trade ledgers of RQ-20261018-ef5d-05''s twelve powered US ETF cells (SPY, QQQ, QLD, TQQQ, IWM, SCHA, GLD, SLV, GDX, IEF, TLT, USO; weekly Donchian trend, long-only,
      2007..2026), each trade''s net R spread evenly over its calendar holding days and summed to W-SUN weekly series over the common weeks: is the participation-ratio effective number of independent bets N_eff
      at least 3.0, which pairs are same-bet (r >= 0.5), and which cell''s removal lowers the pooled weekly information ratio most?'
    why_this_matters: 'Node P7-Q6-weekly-etf. ef5d-05 PASSED (LO pooled 127.7 R; BOTH also passed). The node requires the weekly arm''s per-symbol passes to be read as one bet before any count of passing cells
      is quoted: SPY/QQQ/QLD/TQQQ/IWM/SCHA are one equity-beta factor on priors, GLD/SLV/GDX one metals factor, IEF/TLT one rates factor, USO its own. Decision changed: PASS (N_eff >= 3.0) -> a re-entry case
      may carry at most floor(N_eff) weekly legs, one per same-bet cluster, the strongest per cluster named by the leave-one-out table, each needing its own holdout confirmation before a book; FAIL -> the weekly
      arm is at most two bets and a case carries at most one leg per the leave-one-out table. Cells fixed before the run by a rule that does not look at outcomes: every LO ETF cell with n >= the parent''s n_floor
      10; excluded: IAUM (n 7, under the floor), SPLG (not measured), and the futures proxies MES/MGC/MHG (the node rules them out as re-entry candidates from a Yahoo continuous series).'
    why_not_inferential: 'A descriptive measurement on committed ledgers: N_eff >= 3.0 either holds or does not on these series; the edge question was ef5d-05''s.'
    decision_rule:
      id: RULE-P7-Q6-WEEKLY-ETF-OVERLAP
      registered_before_run: true
      statistic: 'scripts/research/soak_equity_overlap.py on the twelve committed LO ledgers named in run.command: weekly (W-SUN) net R with each trade''s net_r spread evenly over entry..exit calendar days,
        common weeks only (expected ~2010-10..2026-01, ~790 weeks); N_eff = (sum lambda)^2 / sum lambda^2 of the Pearson correlation matrix; same-bet pairs r >= 0.5; leave-one-out pooled mean/sd of the equal-weight
        weekly series; --min-neff 3.0 --min-weeks 104 --same-bet-corr 0.5 (the script''s verdict is this rule).'
      rule: 'INDETERMINATE IF common weeks < 104 or fewer than 2 ledgers load. PASS IF N_eff >= 3.0. FAIL IF N_eff < 3.0. Either way the same-bet pairs and the leave-one-out table are carried into any re-entry
        case, which may name at most floor(N_eff) weekly legs and at most one per same-bet cluster. Regime-robustness clause: not applicable to an overlap read (no P&L claim is graded; any re-entry case restates
        the per-year table of each leg it names). Thresholds are not changed after any result.'
      what_it_does_not_do: 'Promotes nothing, edits no config or roster, places no order. Reads harness ledgers built on unadjusted Yahoo daily bars resampled weekly (no dividends), not live fills. Does not
        read overlap with the LIVE alpaca legs: tqqq_trend_long_1d''s committed ledger starts 2021-06 and slv_trend_1h / tlt_pullback_1h start 2025-07, so adding them would cut the common window to < 104 weeks
        or to 2021+; the TQQQ weekly cell is the same instrument as live tqqq_trend_long_1d and is treated as the same bet by construction in any case.'
    compute: cpu_light
    value:
      bucket: structural
      usd_at_stake_per_month: 150
      confidence: 0.3
      basis: 'stand-in (node weight): stops one equity-beta bet being counted as several passing cells in a re-entry case; not a P&L measurement.'
    routing:
      needs_trainer_resident_data: false
      needs_gpu: false
      peak_memory_gb: 1.0
      est_minutes: 5
      why_runner: Reads committed ledgers in the repo checkout; no network, no secret; seconds of CPU.
      basis: Twelve JSONL files of 14-28 rows and a 12x12 eigen decomposition (the RQ-20261022-008 shape).
    run:
      command:
      - python3
      - scripts/research/soak_equity_overlap.py
      - --leg
      - SPY=comms/research/RQ-20261018-ef5d-05/39124033697/cells/trend_SPY_1w_LO__trades.jsonl
      - --leg
      - QQQ=comms/research/RQ-20261018-ef5d-05/39124033697/cells/trend_QQQ_1w_LO__trades.jsonl
      - --leg
      - QLD=comms/research/RQ-20261018-ef5d-05/39124033697/cells/trend_QLD_1w_LO__trades.jsonl
      - --leg
