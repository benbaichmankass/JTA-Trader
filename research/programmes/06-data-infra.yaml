      verdict: pass
    needs_authoring: 'Binance UM 1m agrees with Bybit linear 1m on first-passage labels (>= 98% per family). Not a
      research question: note on DATA-INTRADE-LABEL-STORE that the free archive may label our venue''s trades; author
      per-family label-store units only for a consumer that exists (IN-TRADE-EXIT-MODEL, M23).'
