  - id: P6-Q6-roadmap-ref-valid
    goal: G4
    roadmap:
    - L-OPS
    value:
      usd_at_stake_per_month: 60
      confidence: 0.4
    unit:
      theme: infra
      priority: 2
      kind: deterministic
      cadence: daily
      title: 'Roadmap refs valid: does every queued authored unit carry `roadmap:` as a list of milestone
        ids that exist in docs/roadmap/milestones.yaml?'
      question: Does every queued authored unit's `roadmap:` parse as a list whose every element is a milestone
        id in docs/roadmap/milestones.yaml?
      why_this_matters: 'Lane THEME-AUTHOR-1025 (research SLO breach 2026-10-25). The roadmap loop (CLAUDE.md)
        builds units FROM milestones and writes outcomes back to them; a bare string (`roadmap: M28` on
        five NEWS-ALPHA units, found by this check on its first run and corrected in the same PR) iterates
        as characters in code that expects a list and breaks the unit -> milestone map silently. Detects
        the next one the day it is authored instead of at the weekly roadmap pass.'
      why_not_inferential: 'A deterministic self-test of repo state on the runner: the property either holds
        or it does not. There is no sampling question to power.'
      decision_rule:
        id: RULE-P6-Q6-ROADMAP-REF-VALID
        registered_at: '2026-10-25'
        statistic: scripts/research/infra_selftest.py --check roadmap_ref_valid
        rule: 'PASS IF every queued authored unit that declares `roadmap:` declares a list of ids all present
          in milestones.yaml. FAIL IF any does not: measurement.sample names the unit and the fault (not
          a list, or the unknown id). A producer_failed or no_data record is NOT a verdict.'
        what_it_does_not_do: Measures nothing about any strategy, model or market; edits no config, registry,
          account or queue unit.
      compute: cpu_light
      value:
        usd_at_stake_per_month: 60
        confidence: 0.4
        bucket: structural
        basis: 'infrastructure detector: a stand-in figure for the research throughput a silent queue fault
          costs, not a measured P&L'
      routing:
        needs_trainer_resident_data: false
        needs_gpu: false
        peak_memory_gb: 1.0
        est_minutes: 5
        basis: Reads only the repo checkout on a GitHub-hosted runner; no network, no secret.
      run:
        command:
        - python3
        - scripts/research/infra_selftest.py
        - --check
        - roadmap_ref_valid
        - --out
        - '{out_dir}'
        timeout_minutes: 20
      lands:
        store: research/results/
        assert_field: read_state
        min_rows: 1
      related:
      - scripts/research/infra_selftest.py
      - docs/roadmap/milestones.yaml
      - THEME-AUTHOR-1025
