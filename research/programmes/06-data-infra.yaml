    goal: G4
    roadmap:
    - L-OPS
    value:
      usd_at_stake_per_month: 70
      confidence: 0.4
    unit:
      theme: infra
      priority: 2
      kind: deterministic
      cadence: daily
      title: 'Starvation: are at most 10 queued authored units, free of any requires_result gate, left undispatched
        for more than 7 days?'
      question: Do at most 10 queued authored units without a requires_result gate sit with no last_dispatched_at
        more than 7 days after their id date?
      why_this_matters: Lane THEME-AUTHOR-1025. The dispatcher ranks by value, so a low-value unit can wait
        indefinitely while the runnable-floor count still reads healthy; starve_hours exists in the router
        but nothing counted how many units it is failing. A queued unit that never fires is authoring spend
        with no result. The threshold (10) and age (7 d) are registered here before the first run and not
        tuned after it.
      why_not_inferential: 'A deterministic self-test of repo state on the runner: the property either holds
        or it does not. There is no sampling question to power.'
      decision_rule:
        id: RULE-P6-Q6-NEVER-DISPATCHED-AGE
        registered_at: '2026-10-25'
        statistic: scripts/research/infra_selftest.py --check never_dispatched_age
        rule: 'PASS IF the count of queued authored units with no last_dispatched_at, no requires_result
          and an id date more than 7 days old is <= 10. FAIL IF > 10: measurement.sample lists up to ten
          of them for the next research-ops pass to fire, unblock or retire. A producer_failed or no_data
          record is NOT a verdict.'
        what_it_does_not_do: Measures nothing about any strategy, model or market; edits no config, registry,
