        .md .yaml .yml .json .jsonl .sh .ts) exist?
      why_this_matters: Lane THEME-AUTHOR-1025. `related:` is how a reader of a result finds the instrument,
        the plan and the sibling units; a dead path sends the grader or the next session to a file that
        moved. command_resolvable (RQ-20261024-0142-19) covers run.command only. Cheap to detect, and each
        dead pointer is a re-derivation cost on a later session.
      why_not_inferential: 'A deterministic self-test of repo state on the runner: the property either holds
        or it does not. There is no sampling question to power.'
      decision_rule:
