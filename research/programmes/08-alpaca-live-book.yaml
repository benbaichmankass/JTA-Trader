      add the two fields to the diag read (Tier 1) or read GET /v2/account once via the diag relay. Only if the account is approved:
      author a scoping unit -- which long call / put or debit-spread structures on the pool cost <= 0.9 x cash per contract, and what
      the macro sleeve's alpaca_options_paper record (P4) says they earn net of the options cost stack. The options executor has no
      cancel / open-orders read today (docs/reference/account-capability-matrix.md), a build gap before any live use.
