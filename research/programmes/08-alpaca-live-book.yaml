  - id: P8-Q9-options
    goal: G1
    roadmap: [L-LADDER]
    value: {usd_at_stake_per_month: 30, confidence: 0.15}
    needs_authoring: >-
      SCOPING, not a strategy test: can alpaca_live trade options at all, and would any defined-risk structure fit $194.52? Step 1 is
