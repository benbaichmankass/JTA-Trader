  goal: G2
  roadmap:
  - L-PROP
  value:
    usd_at_stake_per_month: 300
    confidence: 0.4
  unit:
    theme: new_strategy_prop
    priority: 1
    kind: experiment
    title: 'velotrade_1: does adding trend_donchian_eth_4h ALONE (the only gate-eligible 4h leg) to the 1h ETH+SOL
      book beat it at the SAME risk 0.005 on EV per life with no worse survival on every seed? (window-matched 1095
      d)'
    question: On the same 5 seeds x 4,000 lives under velotrade_classic_1step (balance sizing, switch 0.8, f516-01's
      stack), does CE4H (A + trend_donchian_eth_4h, both at risk 0.005) beat A (the incumbent 2-leg book at risk
      0.005) on ev_net_usd_per_life AND p_alive_at_horizon on EVERY seed? All four ledgers are the window-matched
      1095 d prop-venue-stack (fee 8 bps rt, slip 3, swap 5 bps/24h) Stage-0 arms of RQ-20261015-1bf3-03..06 (eth_prop
      517, sol_prop 203, eth_4h 116, sol_4h 116 trades, 2023-10-13..2026-10-11); the sim re-prices gross_r under
      --costs breakout, so the harness stack is not double-charged. This removes the 730 d-vs-1095 d window mismatch
      every earlier head-to-head disclosed.
    why_this_matters: 'Manager programme audit 2026-10-16 § 5.1: ''velotrade_1 1h book + eth_4h only, at matched
      risk 0.0035 and 0.005 -- the only gate-eligible version of the C4H gain''. trend_donchian_sol_4h is execution=shadow
      in config/strategies.yaml and on no account''s roster, so a prop add of it faces the full Stage-1 path first;
      eth_4h is live on bybit_1/bybit_2. Every C4H result so far (ee68-01, 8bbc-03..05, 1bf3-02, and lane RESEARCH-FOLLOWUP-1016''s
      e2db-07 at 0.005) prices BOTH 4h legs. DISCLOSED BEFORE REGISTRATION (730 d incumbents vs 1095 d 4h rows,
      MEASURED from research/results): 8bbc-05 at 0.0035 1h-book EV ~$72 vs +pair ~$550 (PASS), 8bbc-03 at 0.0045
      FAIL; no eth_4h-only arm has run.'
    power:
      expected_n: 116
      min_detectable_effect: 0.3
      effect_units: sd
      design: one_sample
      alpha: 0.05
      power: 0.8
      basis: Binding leg n = 116 (eth_4h, 1095 d); incumbents 517 + 203. 2 arms x 5 seeds.
      feasibility: &id001
        source: none
        accrual_basis: Re-pricing of committed trade ledgers under the firm's rules; nothing accrues.
    decision_rule:
      id: RULE-P5-Q5-E4H-VELO-005
      registered_at: '2026-10-16'
      registered_before_run: true
      statistic: 'Per seed and arm: path-mode ev_net_usd_per_life and p_alive_at_horizon (and its MC SE), velotrade_classic_1step,
        switch 0.8.'
      rule: 'prop_ev_grid --grade any_c_dominates, mechanically. PASS IF CE4H beats A on ev AND p_alive >= A on
        ALL 5 seeds -> the gate-eligible leg adds at matched risk window-matched: with P5-GATE-VELO''s eth_4h record
        this is the operator decision ''add eth_4h to velotrade_1'' (manager, Tier-3 roster; a prop_variant leg
        + Stage-1 soak per the prop superset ladder). FAIL IF no C arm dominates on every seed -> eth_4h alone is
        not shown to add at this risk; recorded on PROP-BOOK-SEARCH-1095D. NULL if an arm is missing. STRICT-SEED
        CAVEAT, registered here: prop_ev_grid compares p_alive per seed with a strict >= (no MC-SE tolerance; manager
        audit 2026-10-16 § 4.1, build row PROP-GRID-SURVIVAL-TOL), so a FAIL decided only by a survival gap inside
        about 2 MC SE on a seed is reported as ''FAIL (within-noise survival)'' beside the mechanical verdict, and
        is re-graded only by a separately registered rule once that row lands. The mechanical verdict here is not
        changed after the run.'
      min_n: '88'
    compute: cpu_long
    routing:
      needs_trainer_resident_data: false
      needs_gpu: false
      peak_memory_gb: 2.0
      est_minutes: 75
      basis: RQ-20261015-1bf3-02 ran 2 arms x 5 seeds x 4,000 lives in 61 min (--jobs 4); scaled by arm count.
      why_runner: 'Repo data only (committed trade JSONL + ruleset YAML), no GPU: the inputs are not in metis-market-data
        (so not kaggle_cpu) and are not trainer-resident (so not needs_vm_data).'
    value:
      bucket: structural
      usd_at_stake_per_month: 300
      confidence: 0.4
      basis: 'INFERRED stand-in: 8bbc-04/-05 matched-risk +pair gains of ~$320-480/life on velotrade_1 (730 d vs
        1095 d); this asks how much survives with the one leg that can actually be added.'
    run:
      timeout_minutes: 240
      command:
      - python3
      - scripts/research/prop_ev_grid.py
      - --leg
      - trend_donchian_eth_prop=comms/research/RQ-20261015-1bf3-05/38713761684/arms/P__trades.jsonl
      - --arm
      - A=--sizing balance --risk-pct 0.005 --dd-switch-frac 0.8
      - --arm
      - CE4H=--sizing balance --risk-pct 0.005 --dd-switch-frac 0.8 --trades trend_donchian_eth_4h=comms/research/RQ-20261015-1bf3-03/38713755448/arms/P__trades.jsonl
        --lev-cap trend_donchian_eth_4h=5
      - --common
      - --trades trend_donchian_sol_prop=comms/research/RQ-20261015-1bf3-06/38730575207/arms/P__trades.jsonl --ruleset
        config/prop_rulesets/velotrade_classic_1step.yaml --costs breakout --commission-bps-rt 6 --slippage-bps-rt
        3 --swap-daily 0.0005 --swap-model dxtrade --no-hedge --funded-start fresh --lev-cap trend_donchian_eth_prop=5
        --lev-cap trend_donchian_sol_prop=5
      - --seeds
      - 1,2,3,4,5
      - --grade
      - any_c_dominates
      - --out
      - '{out_dir}'
      - --jobs
      - '4'
      - --note
      - P5 Q5 eth_4h-only matched risk 0.005, velotrade_1
    lands: &id002
      store: research/results/
      assert_field: read_state
      min_rows: 1
    related:
    - docs/research/programmes/05-PROP.md
    - research/queue/RQ-20261015-1bf3-03.yaml
    - research/queue/RQ-20261015-1bf3-04.yaml
    - research/queue/RQ-20261015-1bf3-05.yaml
    - research/queue/RQ-20261015-1bf3-06.yaml
    - research/queue/RQ-20261015-8bbc-04.yaml
    - research/queue/RQ-20261015-8bbc-05.yaml
    - docs/claude/work/checklist/PROP-BOOK-SEARCH-1095D.json
    what_it_does_not_do: Changes no roster, risk, sizing or switch setting (Tier-3 with this record as input, never
      applied by the unit). A live or paper prop book's P&L is not read. Does not re-grade 8bbc-03..05 or e2db-07;
      does not price sol_4h alone.
