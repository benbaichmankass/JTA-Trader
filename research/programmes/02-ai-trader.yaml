        statistic: 'Per OOS trade: mean over its bar events of logloss(reference dist) - logloss(model rich), trade-weighted;
          pooled mean with a 1,000-draw trade bootstrap 95% CI; sign per fold (4 expanding purged time folds); calibration
          slope. Identical to RQ-20261014-d6e7-04''s statistic, restricted by --leg-re.'
        rule: 'PASS IF gain >= 0.002 nats AND CI lower bound > 0 AND gain > 0 in >= 3 of 4 folds AND calibration slope
          in [0.7, 1.3]: the donchian family''s in-trade state carries information -> author the exit-now POLICY unit
          for this class only (the d6e7-05 shape, requires this PASS) and a disjoint-window confirmation. FAIL IF
          the CI upper bound < 0.002 nats: closes the rich state for this class on this corpus (note on IN-TRADE-EXIT-MODEL).
          INDETERMINATE otherwise or under 300 OOS trades.'
        min_n: 300 OOS trades in the class.
        what_it_does_not_do: Trains nothing that serves; edits no exit lever, config or roster; the 0.002-nat bar,
