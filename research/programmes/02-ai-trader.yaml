# docs/research/programmes/02-AI-TRADER.md (§ 6 backlog, W1-W4).
# Read by scripts/research/queue_replenish.py (programme source, RESEARCH-LOOP-AUDIT RC2/RC3);
# see research/programmes/01-active-trade-management.yaml for the contract. Landing machinery:
# every edit holds for a human merge. `value` figures are INFERRED planning weights.
# 2026-10-16 lane P2-AI-REGIME-BACKLOG-1016: authored the four authoring-queue nodes (Q2.1/Q3.1/Q1.5/Q2.5), added Q1.3 drift,
# Q4 successor and Q6 parity branches. The regime half (L-REGIME, REGIME-PROGRAM) lives in 02r-regime.yaml (same programme).
# P2-Q4-et-mlp-extend is left as is: it materialised RQ-20261016-001, which repeats RQ-20261015-ab54-01 (both tail_rows 43000);
# the ensemble_stack line gets no further node until that record is graded.
