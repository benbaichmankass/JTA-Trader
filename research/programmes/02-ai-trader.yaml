# Programme P2 -- AI trader: the machine-readable question tree for
# docs/research/programmes/02-AI-TRADER.md (§ 6 backlog, W1-W4).
# Read by scripts/research/queue_replenish.py (programme source, RESEARCH-LOOP-AUDIT RC2/RC3);
# see research/programmes/01-active-trade-management.yaml for the contract. Landing machinery:
# every edit holds for a human merge. `value` figures are INFERRED planning weights.
programme: P2
plan: docs/research/programmes/02-AI-TRADER.md
nodes:
  # ── Q2 meta-labeling: 9d20-02 (thin-column baseline) closed FAIL ────────────
  - id: P2-Q2.1-fail
    goal: G4
    roadmap: [M23]
    value: {usd_at_stake_per_month: 300, confidence: 0.3}
    after: [{unit: RQ-20261014-9d20-02, verdict: fail}]
    needs_authoring: >-
      The meta-label head on the thin committed columns FAILED. 02 § 6 already names the refinement:
      widen the emits (row METALABEL-EMIT-FEATURES) and re-test as 9d20-04 (blocked on that row). Until
      the row lands, register the cheapest measurable step that does not need it (e.g. the same head on
      the families whose emits already carry the regime/vol columns) or state why none exists.
  # ── Q3 giveback predictable at entry: 9d20-03 closed FAIL ───────────────────
  - id: P2-Q3.1-fail
    goal: G1
    roadmap: [M23]
    value: {usd_at_stake_per_month: 300, confidence: 0.3}
    after: [{unit: RQ-20261014-9d20-03, verdict: fail}]
    needs_authoring: >-
      Large peak-to-exit giveback is NOT predictable at entry on the committed columns. That moves the
      question in-trade: register the link to P1-Q8 (per-bar state, d6e7-02/04) rather than an entry-time
      re-test, or a refinement with features the census says differ (01's census by class).
  # ── Q4 family diversity: 9d20-05 closed INDETERMINATE ───────────────────────
  - id: P2-Q4-et-mlp-extend
    goal: G4
    roadmap: [M23]
    value: {usd_at_stake_per_month: 150, confidence: 0.3}
    after: [{unit: RQ-20261014-9d20-05, verdict: indeterminate}]
    unit:
      theme: ml_health
      priority: 2
      title: 'AI trader / family diversity, n EXTENDED: do ExtraTrees or a small MLP come within 0.01 macro-F1
        of LightGBM on the BTC and ETH 1h volatility-regime head over the FULL published history (tail_rows
        43000 vs 20000)? (re-test of 9d20-05, which closed INDETERMINATE)'
      question: RQ-20261014-9d20-05 closed INDETERMINATE (MLP -0.020 vs LightGBM on BTC cv, CI spanning 0;
        ExtraTrees -0.142, sign-consistent worse). Same learners, same six features, same rule and thresholds,
        same folds/embargo/holdout; the only change is tail_rows 20000 -> 43000 (the whole published 1h v002
        shard, ~43,800 rows per symbol) so each CV fold and the holdout carry ~2x the rows. Changing nothing
        else keeps the two records comparable.
      why_this_matters: ensemble_stack has 0 registered models (ml_plan_status.py --diversity); the 9d20-05
        INDETERMINATE says n was the limit, not that the family is dead. A FAIL here closes these two learners
        at these settings with the exact configuration written to families.ensemble_stack.history; a PASS
        files a candidate-manifest note, never a registration.
      power:
        expected_n: 16000
        min_detectable_effect: 0.05
        effect_units: sd
        design: one_sample
        alpha: 0.05
        power: 0.8
        basis: tail_rows 43000 per symbol at min_train_frac 0.4 leaves ~26,000 test rows per symbol over 5
          folds plus the ~90-day holdout; ESTIMATE, bars autocorrelated so effective n is lower. Nothing accrues
          (fixed published shard).
        feasibility:
          source: none
          accrual_basis: 'Nightly-rebuilt published shard: the history read is fixed, nothing accrues.'
      compute: auto
      value:
        bucket: frontier
        usd_at_stake_per_month: 120
        confidence: 0.25
        basis: 'stand-in: a non-inferior non-boosted family is a second opinion for the advisory heads and
          a diversity record either way; not a measured P&L'
      routing:
        needs_trainer_resident_data: false
        needs_gpu: false
        published_data: metis-market-data
        peak_memory_gb: 4.0
        est_minutes: 70
        basis: 'Estimate, NOT measured: 9d20-05 at 20k rows was budgeted 40 min; ~2.15x rows -> ~70 min. The
          first run replaces it.'
      ml_bakeoff:
        task: classification
        metric: macro_f1
        dataset:
          kind: jsonl
          groups:
            BTCUSDT_1h:
              path: datasets-out/market_features/BTCUSDT/1h/v002/data.jsonl
            ETHUSDT_1h:
              path: datasets-out/market_features/ETHUSDT/1h/v002/data.jsonl
          ts_col: ts
          target: regime_label
          features:
          - rolling_log_return_vol
          - log_return
          - log_return_lag_1
          - log_return_lag_2
          - hour_of_day
          - dayofweek
          tail_rows: 43000
          holdout_after: '2026-07-12'
        cv:
          folds: 5
          embargo_rows: 24
          min_train_frac: 0.4
        baseline: lgbm
        controls:
        - prior
        candidates:
        - extratrees
        - mlp
        learners:
          prior:
            kind: prior
          lgbm:
            kind: lightgbm
            params:
              n_estimators: 200
              learning_rate: 0.05
              num_leaves: 31
              min_child_samples: 50
          extratrees:
            kind: sklearn_extratrees
            params:
              n_estimators: 300
              min_samples_leaf: 20
          mlp:
            kind: sklearn_mlp
            params:
              hidden_layer_sizes:
              - 64
              - 64
              max_iter: 300
        rule:
          min_folds: 3
          pass_if:
          - group: &id001
            - BTCUSDT_1h
            - ETHUSDT_1h
            vs: baseline
            window: cv
            op: '>='
            value: -0.01
          - group: *id001
            vs: baseline
            window: holdout
            op: '>='
            value: -0.01
          fail_if_no_candidate_reaches:
          - group: any
            vs: baseline
            window: cv
            op: '>='
            value: -0.03
      run:
        inputs:
          research_unit: RQ-20261016-001
        command:
        - python3
        - scripts/research/ml_bakeoff.py
        - --unit
        - '{unit}'
        - --out
        - '{out_dir}'
        timeout_minutes: 240
      lands:
        store: research/results/
        assert_field: read_state
        min_rows: 1
      decision_rule:
        id: RULE-P2-Q4-ET-MLP-EXTEND-1H
        registered_at: '2026-10-16'
        registered_before_run: true
        registered_before_run_note: Thresholds and rule text are byte-identical to RULE-RQ20261014-9D20-05-EXTRATREES-MLP-1H;
          only n (tail_rows 43000) differs. Registered before this unit has run.
        statistic: Paired per-fold macro-F1 difference (candidate minus LightGBM) on identical purged folds
          and on the holdout, per symbol; mean over folds; applied by ml_bakeoff.py evaluate_rule from this
          unit's ml_bakeoff.rule.
        rule: 'PASS (non-inferior or better) IF a candidate reaches >= -0.010 vs LightGBM on the CV mean AND
          on the holdout on BOTH symbols: the family is a registrable alternative; file the candidate-manifest
          proposal (Tier-3 note on FRONTIER-RESEARCH) and append families.ensemble_stack.history PASS. FAIL
          IF no candidate reaches >= -0.030 vs LightGBM on the CV mean on any symbol AND both arms were evaluated:
          closes these two learners at these settings on this feature set (history FAIL). INDETERMINATE otherwise,
          if folds < 3, or if an arm is unavailable.'
        min_n: 3 usable CV folds per symbol; holdout >= 20 rows.
        what_it_does_not_do: Trains or registers nothing, touches no manifest, stage or config; unweighted
          LightGBM incumbent (a family comparison, not a re-grade of the shipped heads). Says nothing about
          trade P&L.
      roadmap:
      - M25
      related:
      - RQ-20261014-9d20-05
      - RQ-20261013-1414-07
      - FRONTIER-RESEARCH
      - AI-TRADER-PROGRAMME
