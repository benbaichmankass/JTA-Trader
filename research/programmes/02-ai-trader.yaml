        0.00054 nats, CI [-0.00118, 0.00245]). Same script, features, reference, K, folds and bar, restricted to the
        donchian legs (--leg-re ''trend_donchian''): does the rich state beat the calibrated distance-only reference
        by >= 0.002 nats with CI lower bound > 0?'
      why_this_matters: 'A pooled null can hide a class that carries the signal and a class that carries none (01''s
        census differs by class: pullback headroom 1.54 R/trade in 9d20-01). The three class units (P2-Q3.1-fail donchian,
        -b pullback, -c scalp) are registered together, so the split is pre-registered, not mined; a single-class
        PASS is a lead for a policy unit, confirmed on a disjoint window before anything else.'
      power:
        expected_n: 550
        min_detectable_effect: 0.1
        effect_units: sd
        design: one_sample
        alpha: 0.05
        power: 0.8
        basis: 'Unit = OOS test trade. d6e7-01''s census walked donchian legs for ~1100 trades; 4 of 5 time blocks
          tested and timeouts excluded -> ~550 OOS trades (ESTIMATE). A 0.1 sd per-trade gain needs ~785, so this
          class is near or below that: the rule grades INDETERMINATE under the 300 floor and a CI that spans the bar,
          never FAIL on thin n.'
        feasibility:
          source: none
          accrual_basis: Committed ledgers + public candles; nothing accrues.
