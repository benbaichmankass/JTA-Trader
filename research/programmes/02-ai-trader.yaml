    - unit: RQ-20261014-9d20-04
      verdict: fail
    needs_authoring: 'AUTHORED 2026-10-16 (lane P2-AI-REGIME-BACKLOG-1016) as ''no cheaper step exists'': 9d20-02
      already evaluated the pullback legs whose emits carry a real adx_at_entry (eth_pullback_2h, pullback_ada/doge/link_1h,
      in its 17 legs at n >= 100), so ''the same head on families with regime columns'' has run and failed. The only
      route is METALABEL-EMIT-FEATURES -> RQ-20261014-9d20-04 (blocked/). This node now waits on 9d20-04 FAILING too:
      then register the M23 kill-or-redirect -- a pooled head on live+backtest labels gated by the pooling-parity
