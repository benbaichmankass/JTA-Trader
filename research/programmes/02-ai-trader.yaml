          slope. Identical to RQ-20261014-d6e7-04''s statistic, restricted by --leg-re.'
        rule: 'PASS IF gain >= 0.002 nats AND CI lower bound > 0 AND gain > 0 in >= 3 of 4 folds AND calibration slope
