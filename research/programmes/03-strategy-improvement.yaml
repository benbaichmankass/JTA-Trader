- id: P3-Q3-ief-tune
  goal: G1
  roadmap:
  - M21
  - L-LADDER
  value:
    usd_at_stake_per_month: 60
    confidence: 0.3
  after:
  - unit: RQ-20261016-c56e-16
    verdict: pass
  unit:
    title: 'Tune at power (programme 03 Q2 after Q3): does moving ief_pullback_1d''s pullback_frac (0.382, 0.618,
      0.75) beat the declared 0.5 over 2006-10-02 .. 2025-04-09, net of the full cost stack?'
    cadence: once
    theme: live_strategy
    priority: 1
    kind: experiment
    question: On 2006-10-02 .. 2025-04-09 (the window RQ-20261016-c56e-16 graded the declared leg on), does any
      of the 3 pre-registered pullback_frac arms on ief_pullback_1d beat the leg as declared by >= 1.0 R, with no
      worse drawdown, in >= 3 of 4 calendar folds?
    why_this_matters: 'RQ-20261016-c56e-16 PASSED: ief_pullback_1d has a Stage-0 grade at power for the first time,
      so it can now be tuned (tune-before-retire, programme 03 § 4 Q2). pullback_frac is the axis that moved ada_pullback_2h
      (470a-05 PASS).'
    power:
      expected_n: 55
      min_detectable_effect: 0.45
      effect_units: sd
      design: one_sample
      alpha: 0.05
      power: 0.8
      basis: d=0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo's standing E35 floor). expected_n=55 is
        an ESTIMATE (RQ-20261016-c56e-16's own n replaces it on the first run). Bar 1.0 R over the window.
      feasibility:
        source: none
        accrual_basis: 'Yahoo daily history via yfinance (regime_debt_matrix._fetch_csv: period is uncapped for
          1d). INFERRED, not measured this lane: no committed run has yet fetched >2y of 1d bars this way; the first
          run''s verdict.json window/data_start is the check. Nothing accrues.'
    decision_rule:
      id: RULE-P3-Q3-IEF-TUNE
      registered_before_run: true
      statistic: 'Per arm, from the harness''s own --json summary (argv built by regime_debt_matrix.build_harness_cmd
        from config/strategies.yaml plus the arm''s tokens; full cost stack: fee + resolved slippage + funding via
        execution_costs.resolve_cost_policy, never a zero default): total_trades, net_total_r, max_drawdown_r, plus
        net_r per fold over FOUR equal calendar spans (same boundaries every arm). Arms: B = leg as declared (pullback_frac
        0.5); F0382=pullback_frac=0.382; F0618=pullback_frac=0.618; F075=pullback_frac=0.75. Per candidate C: dR
        = net_r(C) - net_r(B); dDD = maxDD(C) - maxDD(B); fold_wins = folds in which C out-earns B. Also reported
        per arm, not graded: net_r_per_capital_day (the programme''s headline measure).'
      rule: 'indeterminate IF n(B) < 39 (underpowered: no verdict; never FAIL on thin n). A candidate C PASSES iff
        dR >= 1.0 R AND dDD <= 0 AND fold_wins >= 3 of 4. PASS IF any candidate passes (best = highest dR). FAIL
        IF none passes: the declared value stands and the axis is recorded honest_negative on this window for this
        leg. A PASS from a best-of-3 sweep is a LEAD, not a finding: it opens exactly one fresh-window confirmation
        unit (the passing arm alone vs B, on the disjoint window AFTER this one (2025-04-10 .. the latest close;
        the leg''s own record window), same bars, no re-selection; 03-STRATEGY-IMPROVEMENT.md rung S0-C; programme
        node P3 tree), and no Tier-3 proposal is written until that unit reads CONFIRMED. The 1.0 R bar, the drawdown
        clause, the 3-of-4 fold majority and the 39 floor are not changed after any result.'
      what_it_does_not_do: Does not edit config or any roster. Does not mine values (fixed here). A PASS is a LEAD
        for rung S0-C, never a promotion case.
    compute: cpu_light
    value:
      usd_at_stake_per_month: 60
      confidence: 0.3
      bucket: own_losses
      basis: 'stand-in: a small real-money alpaca_live leg; estimate, not a measurement.'
    routing:
      needs_trainer_resident_data: false
      needs_gpu: false
      peak_memory_gb: 2.0
      est_minutes: 10
      basis: One Yahoo 1d fetch of ~20 years and 4 harness passes over it.
      why_runner: exit_lever_ablation.py fetches its own keyless candles (Binance Vision / Yahoo) and runs the repo
        harnesses; the symbol/timeframe is not in metis-market-data and the script has no published-data input,
        so the Kaggle-CPU and trainer backends cannot take it.
    run:
      command:
      - python3
      - scripts/research/exit_lever_ablation.py
      - --leg
      - ief_pullback_1d
      - --arm
      - B=
      - --arm
      - F0382=pullback_frac=0.382
      - --arm
      - F0618=pullback_frac=0.618
      - --arm
      - F075=pullback_frac=0.75
      - --days
      - '7414'
      - --start
      - '2006-10-02'
      - --end
      - '2025-04-09'
      - --grade
      - sweep
      - --baseline
      - B
      - --delta-r
      - '1.0'
      - --fold-majority
      - '3'
      - --n-floor
      - '39'
      - --out
      - '{out_dir}'
      timeout_minutes: 60
    lands:
      store: research/results/
      assert_field: read_state
      min_rows: 1
      note: research/results/RQ-NODE/<run_id>.jsonl via the batch collector; per-arm summaries and verdict.json
        under comms/research/RQ-NODE/<run_id>/.
    roadmap:
    - M21
    - L-LADDER
    related:
    - P3-STRATEGY-BACKLOG-1016
    - docs/research/programmes/03-STRATEGY-IMPROVEMENT.md
    - research/programmes/03-strategy-improvement.yaml
    - scripts/research/exit_lever_ablation.py
