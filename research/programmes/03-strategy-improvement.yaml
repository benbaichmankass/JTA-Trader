      - --leg
      - qqq=comms/research/RQ-20261016-c56e-20/39462143593/arms/B__trades.jsonl
      - --leg
      - spy=comms/research/RQ-20261016-c56e-21/39470070325/arms/B__trades.jsonl
      - --leg
      - iwm=comms/research/RQ-20261016-c56e-22/39470074338/arms/B__trades.jsonl
      - --leg
      - qld=comms/research/RQ-20261016-c56e-23/39470078680/arms/B__trades.jsonl
      - --out
      - '{out_dir}'
      timeout_minutes: 20
    lands:
      store: research/results/
      assert_field: read_state
      min_rows: 1
