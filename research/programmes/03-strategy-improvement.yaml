    question: Using the committed Stage-0 arm-B trade ledgers of qqq_trend_long_1d, spy_trend_long_1d, iwm_trend_long_1d and qld_trend_long_1d (RQ-20261016-c56e-20..23,
      each PASS), with each trade's net R spread evenly over its calendar holding days and summed to weekly series over the common weeks, is the participation-ratio
      effective number of independent bets N_eff of their correlation matrix at least 2.0, and which leg's removal lowers the pooled weekly information
      ratio most?
    why_this_matters: 'SPY, QQQ, QLD and IWM are one equity-beta factor on priors. Any MD-PROMOTE-S1-S2 case for them counts the same bet up to four
      times unless this is measured (programme 03 node P3-Q3-soak-equity-overlap). gdx_pullback_1d (c56e-19) read FAIL and is excluded. Disclosure:
      a smoke run of an earlier variant of the script that binned each trade at its EXIT week was seen before registration (it read N_eff 3.86 of
      4); that variant was discarded on measure-validity grounds (exit-week bins ignore holding overlap, so multi-week trend trades of the same bet
      exit in different weeks and look independent). This holding-period-spread variant had not been read when registered, and the thresholds were
      set before either variant ran.'
    why_not_inferential: 'A descriptive measurement on committed ledgers: the property N_eff >= 2.0 either holds or does not on these series. There
      is no sampling question to power.'
    decision_rule:
      id: RULE-RQ-20261022-1F8B-02-SOAK-EQUITY-OVERLAP
      registered_at: '2026-10-22'
      registered_before_run: true
      statistic: 'scripts/research/soak_equity_overlap.py on the four committed arm-B ledgers: weekly (W-SUN) net R with each trade''s net_r spread
        evenly over entry..exit calendar days, common weeks only; N_eff = (sum lambda)^2 / sum lambda^2 of the correlation matrix; pairs with Pearson
        r >= 0.5 are ''same bet''; leave-one-out pooled mean/sd of the equal-weight weekly series.'
      rule: 'INDETERMINATE IF common weeks < 104. PASS IF N_eff >= 2.0: the legs are at least two distinct bets and the same_bet_pairs are named in
        measurement. FAIL IF N_eff < 2.0: they are effectively one equity bet and at most ONE of them is carried to an MD-PROMOTE-S1-S2 case (the
        leave-one-out table names the strongest). Thresholds are not changed after any result.'
      what_it_does_not_do: Promotes nothing and edits no config. It measures overlap of realised Stage-0 R, not a Gate-2 case, a cost check or a prop
        survival gate; a PASS does not make any leg promotable.
    compute: cpu_light
    value:
      bucket: structural
      usd_at_stake_per_month: 100
      confidence: 0.3
      basis: 'stand-in: guards a promotion count against double-counting one factor; not a P&L measurement.'
    routing:
      needs_trainer_resident_data: false
      needs_gpu: false
      peak_memory_gb: 1.0
      est_minutes: 5
      why_runner: Reads committed ledgers in the repo checkout; no network, no secret.
