  unit:
    title: 'Same-symbol overlap read, SOLUSDT (bybit_2 book): per-leg OOS net R per capital-day, solo vs shared slot, for trend_donchian_sol_4h and trend_donchian_sol_prop'
    cadence: once
    theme: live_strategy
    priority: 2
    kind: experiment
    question: On SOLUSDT, what is each of trend_donchian_sol_4h and trend_donchian_sol_prop's OOS net R per capital-day when it has the slot to itself,
      and what is the combined book's when both share one slot under the live election, net of the full cost stack, OOS from 2025-01-01?
    why_this_matters: 'RQ-20261016-c56e-15 PASSED (trend_donchian_sol_4h: net +21.65 R, n=147, 5/6 folds on 2020-10-13 .. 2023-10-12, disjoint from the
      leg''s committed record): the leg has Stage-0 evidence on two disjoint windows and is a re-entry case under MD-PROMOTE-S0-S1 (bybit_1 soak) only after
      this overlap read against trend_donchian_sol_prop (SOLUSDT, bybit_2 real money). INSTRUMENT: both legs are registered in backtest_system.ROSTER (read
      2026-10-17: trend_donchian_sol_4h tf 4h, trend_donchian_sol_prop tf 1h), so scripts/research/same_symbol_head_to_head.py reads them as a pair with no
      shadow add and no --legs override; the earlier node text feared a roster gap, and it was the harness ROSTER, not accounts.yaml, that the driver checks.
      One input to the existing allocator, no winner picked (operator 2026-10-15 re-scope).'
    power:
      expected_n: 40
      min_detectable_effect: 0.5
      effect_units: sd
      design: one_sample
      alpha: 0.05
      power: 0.8
      basis: Unit = OOS closed trade per arm; min_oos_trades 20 per arm is a floor on reporting a usable input, not a significance claim. No effect is tested and
        nothing is ranked. Bars are autocorrelated; treat per-leg figures as noisy.
      feasibility:
        source: none
        accrual_basis: Re-measurement on freshly fetched candles over a pinned historical window; an arm below 20 OOS trades returns indeterminate naming it.
    decision_rule:
      id: RULE-P3-Q8-SOL4H-OVERLAP-REPORT
      registered_before_run: true
      statistic: Per-leg and combined-book OOS net R per capital-day (scripts/research/same_symbol_head_to_head.py), full venue cost stack via execution_costs,
        live risk basis of bybit_2.
      rule: 'Arms (fixed now): solo:<leg> for each leg and together (both legs under the live aggregate_intents election, one shared slot). Metric per arm: OOS
        net R per capital-day = sum(pnl/(qty*|entry-entry_stop|)) / sum(holding days), pnl net of fee+slippage+funding, OOS = entries on/after 2025-01-01. REPORT
        each leg''s solo metric and the combined book''s. IF every arm has >= 20 OOS trades THEN verdict pass (inputs usable); IF any arm is below 20 or has zero
        capital-days THEN indeterminate, naming the starved arm. NO winner and NO exclusion verdict, whatever the numbers. read_state producer_failed (no candles / leg
        not in backtest_system.ROSTER) is a ROUTE/HARNESS FAULT, never a verdict.'
      what_it_does_not_do: Picks no leg, cuts no leg, edits no config or roster. Not a promotion case; a re-entry case under MD-PROMOTE-S0-S1 goes to the manager
        with this read attached.
    compute: cpu_long
    head_to_head:
      symbol: SOLUSDT
      legs:
      - trend_donchian_sol_4h
      - trend_donchian_sol_prop
      accounts:
      - bybit_2
      oos_start: '2025-01-01'
      min_oos_trades: 20
      clock_tf: 15m
      risk_account: bybit_2
