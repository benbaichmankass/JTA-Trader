  - L-LADDER
  - M21
  value:
    usd_at_stake_per_month: 200
    confidence: 0.2
  after:
  - {unit: RQ-20261021-7c2b-06, verdict: any}
  unit:
    title: 'Stage B, new-symbol cells of trend_donchian_eth_4h: do the six 7c2b-06 cells (BNB/DOGE/LINK/LTC/BCH/DOT 4h) add at least one independent bet to the live bybit_2 trend legs (N_eff >= 3.0 of 8)?'
    cadence: once
    priority: 2
    kind: deterministic
    theme: live_strategy
    question: 'Using the committed arm-B trade ledgers of the six RQ-20261021-7c2b-06 cells (trend_donchian_eth_4h at its declared params on BNBUSDT, DOGEUSDT, LINKUSDT, LTCUSDT, BCHUSDT, DOTUSDT 4h, 2020-06..2026-10)
      and the committed Stage-0 ledgers of the two live bybit_2 trend legs with >= 2 years of ledger (trend_donchian_xrp_4h, trend_donchian_sol_prop), each trade''s net R spread evenly over its calendar holding
      days and summed to W-SUN weekly series over the common weeks: is the participation-ratio effective number of independent bets N_eff of the 8-series correlation matrix at least 3.0, and which series are
      same-bet pairs (r >= 0.5)?'
    why_this_matters: 'Node P3-Q8-new-symbols Stage B. 7c2b-06 PASSED (pooled 442.9 R, all six cells net positive, 4h). Before any widening case for trend_donchian_eth_4h''s population (operator 2026-11-04:
      an account configures strategies, never symbols; a real-money widening needs its own population test) the six cells must be read against the live book: crypto trend-following on six alts is, on priors,
      one crypto-beta trend bet already held by the live 4h Donchian legs. The two live legs alone can contribute at most N_eff 2.0, so N_eff >= 3.0 means the new cells add at least one independent bet. Decision
      changed: PASS -> a population-widening case for trend_donchian_eth_4h (pooled, not per symbol) goes to the manager with this record and the leave-one-out table; FAIL -> the cells are the same bet as the
      live book: recorded on 03 s1 and no widening case is made from 7c2b-06. Exclusions stated before the run: ada_pullback_2h (ledger covers 2025-11..2026-11 only, < 104 common weeks), trend_donchian_xrp_adx25
      (a parameter sibling of trend_donchian_xrp_4h on the same symbol; including it would double one series), ml_entry (no harness trade ledger). 7c2b-10 (the same six symbols at 1h on trend_donchian_eth_prop,
      PASS) is not pooled here: same symbols and family at another bar are one bet with these cells by construction; it is read after this one if this passes.'
    why_not_inferential: 'A descriptive measurement on committed ledgers: the property N_eff >= 3.0 either holds or does not on these series. There is no sampling question to power; the edge question was 7c2b-06''s.'
    decision_rule:
      id: RULE-P3-Q8-NEW-SYMBOLS-STAGEB-OVERLAP
      registered_before_run: true
      statistic: 'scripts/research/soak_equity_overlap.py on the eight committed ledgers named in run.command: weekly (W-SUN) net R with each trade''s net_r spread evenly over entry..exit calendar days, common
        weeks only (expected 2022-11..2026-10, ~200 weeks); N_eff = (sum lambda)^2 / sum lambda^2 of the Pearson correlation matrix; pairs with r >= 0.5 are same-bet pairs; leave-one-out pooled mean/sd of the
