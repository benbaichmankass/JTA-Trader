    confidence: 0.35
  unit:
    theme: live_strategy
    priority: 1
    kind: experiment
    title: 'Programme 01 Q2, real money + prop: derive trend_donchian_sol_prop''s PREDICTIVE take-profit from its
      own uncapped MFE distribution (bybit_2, bybit_portfolio and the three prop accounts trade the 6R target reached
      by 1.9% of trades)'
    question: 'trend_donchian_sol_prop declares tp_r 6.0, reached by 1.9% of 370 harness trades (docs/research/mi307-offline-mfe-2026-09-18.json)
      -- TP-REACH-FLOOR grades it ''unreachable'' (scripts/ci/check_tp_doctrine.py --json, read 2026-10-16T07:15Z:
      entry_state unreachable on bybit_2, bybit_portfolio, breakout_2, tradeify_1, velotrade_1). Where does this
      leg''s own uncapped MFE distribution say the move runs out, and is a TP there calibrated and no worse than
      the 6R target out of sample, net of cost? The BRACKETS-AS-PREDICTIONS lane ran this instrument on the four
      2h/4h Bybit legs and the alpaca 1d family (RQ-20261015-cab7-01..06) but never on the two prop Donchian legs.'
    why_this_matters: 'trend_donchian_sol_prop trades on bybit_2, bybit_portfolio, breakout_2, tradeify_1, velotrade_1.
      TP doctrine clause 1 (docs/ARCHITECTURE-CANONICAL.md): a target touched by < 10% of trades is a sentinel under
      another name, so every one of these routings is non-compliant today. This is the cheapest decisive screen
      for a real predictive TP on the prop legs.'
    power:
      expected_n: 148
      min_detectable_effect: 0.45
      effect_units: sd
      design: one_sample
      alpha: 0.05
      power: 0.8
      basis: 'Floor: (1.96 + 0.8416)^2 / 0.45^2 = 38.76 -> 39 OOS trades. mi307 uncapped n = 370 trades over its
        window -> ~148 OOS (ESTIMATE; this run''s window is 1830 d). The OOS half is the last 40% of the uncapped
        replay''s trades.'
      feasibility:
        source: none
        accrual_basis: Binance Vision 1h candles over 1830 d; nothing accrues.
    decision_rule:
      id: RULE-P1-Q2-SOLPROP-PREDICTIVE-TP
      statistic: 'From the leg''s config-exact UNCAPPED no-TP harness replay (scripts/research/tp_prediction_derive.py,
        base_args tp_cap_pct=0.0, 1830 d binance_vision candles, net_r = the harness''s full cost stack via execution_costs.resolve_cost_policy
        -- the Bybit perp stack, not the prop venue''s; stated): trades sorted by entry time, first 60% IS, last
        40% OOS. On IS the reach curve P(mfe_r >= K) and the counterfactual net R of a TP at K (venue cap per trade)
        for K in {1, 1.25, 1.5, 1.75, 2, 2.5, 3, 3.5, 4, 5, 6, 8}; K* = the IS-best K with IS reach >= 0.10 and
        K <= the median IS cap_r. On OOS: paired per-trade delta = net(K*) - net(tp_r 6.0, capped), seeded bootstrap
        95% CI (2000 resamples, seed 20261015); calibration gap = |reach_OOS(K*) - reach_IS(K*)|; n_oos. The constants
        are tp_prediction_derive.py''s, registered by RQ-20261015-cab7-0*; this unit re-uses them unchanged.'
      rule: INDETERMINATE IF n_oos < 39 OR no K is eligible on IS. FAIL IF reach_OOS(K*) < 0.10 OR calibration gap
        > 0.10 OR CI upper < -0.05 R/trade -> no FIXED target on this leg both predicts and holds its edge; its
        doctrine route is the per-bar revision rule or the in-trade exit model (Programme 01 Q3/Q8), written to
        row TP-DOCTRINE; never a demotion. PASS IF reach_OOS(K*) >= 0.10 AND calibration gap <= 0.10 AND CI lower
        >= -0.05 R/trade (PASS_IMPROVES when CI lower > 0, else PASS_NONINFERIOR) -> K* is the leg's data-derived
        predictive TP; the programme node after this unit registers the harness-native confirmation of tp_r = K*
        at the prop cost stack before any Tier-3 proposal.
      what_it_does_not_do: 'Touches no config, roster or account. A PASS is a SCREEN: the counterfactual ignores
        entries an earlier TP would have freed, and the cost stack is Bybit''s, not the prop venue''s. Says nothing
        about prop survival (prop_ev_sim is the instrument for that).'
    compute: cpu_light
    value:
      bucket: own_losses
      usd_at_stake_per_month: 500
      confidence: 0.35
      basis: 'stand-in: one leg on real money AND three prop accounts; not a P&L measurement.'
    routing:
      needs_trainer_resident_data: false
      needs_gpu: false
      peak_memory_gb: 2.0
      est_minutes: 30
      why_runner: Fetches keyless public candles (Binance Vision / dukascopy) for a pinned window; Kaggle CPU runs
        with the internet off and metis-market-data carries no 2h/4h/1d candles for these legs; reads no trainer
        data.
      basis: 'Same instrument as RQ-20261015-cab7-0*: candle fetch + one uncapped replay + stdlib grading (58 s
        measured for one 2h leg on 2026-10-15); 1h legs carry ~2x the bars.'
    run:
      command:
      - python3
      - scripts/research/tp_prediction_derive.py
      - --legs
      - trend_donchian_sol_prop
      - --days
      - '1830'
      - --out
      - '{out_dir}'
      timeout_minutes: 120
    lands:
      store: research/results/
      assert_field: read_state
      min_rows: 1
    roadmap:
    - L-ATM
    - M20
    related:
    - docs/research/programmes/01-ACTIVE-TRADE-MANAGEMENT.md
    - scripts/research/tp_prediction_derive.py
    - docs/research/mi307-offline-mfe-2026-09-18.json
    - TP-REACH-FLOOR
    - RQ-20261015-cab7-04
