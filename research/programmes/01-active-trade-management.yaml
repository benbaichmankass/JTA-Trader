  - L-ATM
  value:
    usd_at_stake_per_month: 400
    confidence: 0.35
  unit:
    theme: live_strategy
    priority: 1
    kind: experiment
    title: 'Programme 01 Q3, real money: do the six tp_extend cells that cleared the m20 gate on BOTH partitions
      for xrp_pullback_2h (bybit_2) still beat the declared 3R bracket by a material margin in 5 of 6 calendar folds
      over 2020-07..2026-10, net of cost?'
    question: 'The same six tp_extend cells (tpx_t3_*: target 3R, extend 0.5/1R on approach 0.75/0.85, up to 1/3
      extensions, thesis native) cleared the m20 IS/OOS gate on xrp_pullback_2h on 2026-10-08 (RQ-20261007-001,
      split oos-trades, base OOS n 49) and again on 2026-10-14 (RQ-20261014-9807-03, split date 2024-10-01, base
      OOS n 103) -- MEASURED, research/results/RQ-20261007-001/37724750138.jsonl and research/results/RQ-20261014-9807-03/38540451920.jsonl.
      Neither run measured fold stability or materiality, and 9807-03''s registered calibration/walk-forward statistic
      never reached main (RESEARCH-GRADE-PILE). Does any of the six beat the leg as declared by >= 0.02 R/trade
      in >= 5 of 6 calendar folds within the Path B drawdown bar?'
    why_this_matters: 'xrp_pullback_2h is a bybit_2 real-money leg (+ bybit_portfolio mirror). TP doctrine: tp_revision
      fails on every routing (check_tp_doctrine.py --json, 2026-10-16T07:15Z). A confirmed revision cell is the
      first doctrine-compliant real-money bracket; cab7-02 found a FIXED predictive TP indeterminate (OOS delta
      CI [-0.13, +0.12]), so revision is this leg''s doctrine route.'
    power:
      expected_n: 394
      min_detectable_effect: 0.45
      effect_units: sd
      design: one_sample
      alpha: 0.05
      power: 0.8
      basis: 'Floor: (1.96 + 0.8416)^2 / 0.45^2 = 38.76 -> 39 incumbent trades (the repo''s E35/exit-refinement
        floor). MEASURED in the lane sandbox 2026-10-16: the declared arm carries 394 trades over this window (a
        smoke run of A vs X5 only, disclosed: X5 beat A by +1.25 R over 394 trades in 4 of 4 folds -- below this
        unit''s materiality bar of 0.02 x 394 = 7.9 R; the bar is the programme''s own scale, set before the other
        five arms were run). Trade sequences autocorrelate, so the floor is necessary, not sufficient; the calendar-fold
        majority carries the rest.'
      feasibility:
        source: none
        accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
    decision_rule:
      id: RULE-P1-Q3-XRPPB-TPX-CONFIRM
      statistic: 'From scripts/research/exit_lever_ablation.py --grade replace on xrp_pullback_2h, window 2020-07-01
        .. 2026-10-15 23:59 (6 equal calendar folds; a trade is binned by entry time), net of the full cost stack
        the harness resolves per venue (fee 7.5 bps + slippage 3 bps round trip + funding 1 bps per 8 h window on
        Bybit perps, via execution_costs.resolve_cost_policy; recorded per arm as cost_stack). Per arm, from the
        harness''s own --json summary: n, net_total_r, max_drawdown_r, net R per fold. A = the leg as declared in
        config/strategies.yaml (argv built by regime_debt_matrix.build_harness_cmd). Candidates: X1 = tpx_t3_a0.75_e0.5_m1;
        X2 = tpx_t3_a0.75_e0.5_m3; X3 = tpx_t3_a0.75_e1_m3; X4 = tpx_t3_a0.85_e0.5_m1; X5 = tpx_t3_a0.85_e0.5_m3;
        X6 = tpx_t3_a0.85_e1_m3. Per candidate C: delta = net_r(C) - net_r(A); folds_ge = folds where net_r(C) >=
        net_r(A) (ties count); maxDD(C) vs maxDD(A). Reported, not graded: by_outcome, lever_fired, tp_doctrine
        (declared tp_r and P(mfe_r >= 6)).'
      rule: 'INDETERMINATE IF n(A) < 39 (underpowered: no verdict, never FAIL on thin n). A candidate C PASSES iff
        net_r(C) > net_r(A) AND delta >= 0.02 R x n(A) (materiality: ~2x the cost of one extra exit, 3 bps slippage
        on a 1-5% stop distance = 0.006-0.03 R) AND folds_ge >= 5 of 6 AND maxDD(C) <= maxDD(A) x 1.35. PASS IF
        one or more pass: the passing candidate with the highest net R is named -> the evidence record for a Tier-3
        declare proposal of that tp_extend cell on bybit_2 + bybit_portfolio + bybit_1 in one PR (mirror-equality
        tests), via Programme 01 Q6 (TP-DOCTRINE B1 producer declares the rule; observe-only parity on 1-2 trades)
        -- a note on row TP-DOCTRINE for the manager, never a config edit. FAIL IF none passes -> the declared bracket
        stands; the six cells are retired for this leg (partition-specific gains) and the leg''s doctrine route
        is the in-trade exit model (Q8). Thresholds (the 0.02 R/trade bar, 5/6 folds, the 0.35 drawdown tolerance,
        the 39 floor) are not changed after any result.'
      what_it_does_not_do: 'Edits no config and places no order: a PASS is an evidence record for a Tier-3 proposal,
        never a change. Does not measure TP calibration (the ablation emits by_outcome only; row ABLATION-TP-CALIBRATION).
        Overlaps the m20 sweep''s data (same history, longer window), so it is a stability/materiality confirmation,
        not an independent holdout. Best-of-several candidates is a multiple comparison; the fold majority and the
        materiality bar are what guard it.'
    compute: cpu_light
    value:
      bucket: own_losses
      usd_at_stake_per_month: 400
      confidence: 0.35
      basis: 'stand-in: a real-money leg''s exit; a confirmed cell is the first doctrine-compliant real-money bracket.
        Not a P&L measurement.'
    routing:
