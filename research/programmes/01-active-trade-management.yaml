      - --arm
      - X4=--tp-target-r=3;--tp-extend-r=0.5;--tp-approach-frac=0.85;--tp-max-extends=1;--tp-thesis=native
      - --arm
      - X5=--tp-target-r=3;--tp-extend-r=0.5;--tp-approach-frac=0.85;--tp-max-extends=3;--tp-thesis=native
      - --arm
      - X6=--tp-target-r=3;--tp-extend-r=1;--tp-approach-frac=0.85;--tp-max-extends=3;--tp-thesis=native
