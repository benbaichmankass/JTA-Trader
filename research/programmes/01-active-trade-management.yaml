      below its OOS floor (n 31/24) hold over the whole 2020-07..2026-10 history in 3 of 4 calendar folds, net of
      cost?'
    question: 'On trend_donchian_xrp_4h the m20 gate passed adx20_k0_t2.5, adx25_k0_t2.5 (RQ-20261007-042, the monthly
      RQ-20261009-005/RQ-20261010-003), gb1R_afterMFE2R (monthly) and tpr_stall10_t3 / tpr_atr_t3 (RQ-20261007-003,
      RQ-20261014-9807-03) -- every one on a base OOS of 24-31 trades, below the 39 floor, so none is a verdict.
      Over the full window the declared arm carries 68 trades: does any cell beat it by >= 0.02 R/trade in >= 3
      of 4 calendar folds within the Path B drawdown bar?'
    why_this_matters: bybit_2 real-money leg (+ mirror); tp_r 3 is reached by 15.8% of 146 harness trades and tp_revision
      fails; cab7-03 was INDETERMINATE (n_oos 24). Whole-history folds are the only way this leg reaches the floor.
    power:
      expected_n: 68
      min_detectable_effect: 0.45
      effect_units: sd
      design: one_sample
      alpha: 0.05
      power: 0.8
      basis: 'Floor: (1.96 + 0.8416)^2 / 0.45^2 = 38.76 -> 39 incumbent trades (the repo''s E35/exit-refinement
        floor). MEASURED in the lane sandbox 2026-10-16: 68 trades over this window (7-17 per sixth), hence 4 folds
        (~17 per fold) and a 3-of-4 majority, the exit-refinement walk-forward''s own minimum. Trade sequences autocorrelate,
        so the floor is necessary, not sufficient; the calendar-fold majority carries the rest.'
      feasibility:
        source: none
        accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
    decision_rule:
      id: RULE-P1-Q4-XRP4H-EXIT-CONFIRM
      statistic: 'From scripts/research/exit_lever_ablation.py --grade replace on trend_donchian_xrp_4h, window
        2020-07-01 .. 2026-10-15 23:59 (4 equal calendar folds; a trade is binned by entry time), net of the full
        cost stack the harness resolves per venue (fee 7.5 bps + slippage 3 bps round trip + funding 1 bps per 8
        h window on Bybit perps, via execution_costs.resolve_cost_policy; recorded per arm as cost_stack). Per arm,
        from the harness''s own --json summary: n, net_total_r, max_drawdown_r, net R per fold. A = the leg as declared
        in config/strategies.yaml (argv built by regime_debt_matrix.build_harness_cmd). Candidates: M1 = adx20_k0_t2.5;
        M2 = adx25_k0_t2.5; G1 = gb1R_afterMFE2R; R1 = tpr_stall10_t3; R2 = tpr_atr_t3. Per candidate C: delta =
        net_r(C) - net_r(A); folds_ge = folds where net_r(C) >= net_r(A) (ties count); maxDD(C) vs maxDD(A). Reported,
        not graded: by_outcome, lever_fired, tp_doctrine (declared tp_r and P(mfe_r >= 6)).'
      rule: 'INDETERMINATE IF n(A) < 39 (underpowered: no verdict, never FAIL on thin n). A candidate C PASSES iff
        net_r(C) > net_r(A) AND delta >= 0.02 R x n(A) (materiality: ~2x the cost of one extra exit, 3 bps slippage
        on a 1-5% stop distance = 0.006-0.03 R) AND folds_ge >= 3 of 4 AND maxDD(C) <= maxDD(A) x 1.35. PASS IF
        one or more pass: the passing candidate with the highest net R is named -> the evidence record for a Tier-3
        declare proposal on bybit_2 + mirrors in one PR, via Programme 01 Q6 -- a note on row TP-DOCTRINE. FAIL
        IF none passes -> the declared exit stands; the cells are retired for this leg. Thresholds (the 0.02 R/trade
        bar, 3/4 folds, the 0.35 drawdown tolerance, the 39 floor) are not changed after any result.'
      what_it_does_not_do: 'Edits no config and places no order: a PASS is an evidence record for a Tier-3 proposal,
        never a change. 68 trades is thin: a PASS is a candidate a second leg must corroborate, not a ship. Overlaps
        the m20 sweep''s data (same history, longer window), so it is a stability/materiality confirmation, not
        an independent holdout. Best-of-several candidates is a multiple comparison; the fold majority and the materiality
        bar are what guard it.'
    compute: cpu_light
    value:
      bucket: own_losses
      usd_at_stake_per_month: 300
      confidence: 0.25
      basis: 'stand-in: smallest-n real-money leg; not a P&L measurement.'
    routing:
      needs_trainer_resident_data: false
      needs_gpu: false
      peak_memory_gb: 2.0
      est_minutes: 25
      why_runner: Fetches keyless public candles (Binance Vision / dukascopy) for a pinned window; Kaggle CPU runs
        with the internet off and metis-market-data carries no 2h/4h/1d candles for these legs; reads no trainer
        data.
      basis: 'Runner. One exit_lever_ablation.py invocation: one keyless candle fetch + one harness pass per arm.
        MEASURED 2026-10-16 in the lane sandbox: 2 arms on xrp_pullback_2h over 2020-07..2026-10 took 74 s wall
        incl. the fetch; est_minutes carries headroom for up to 7 arms and runner fetch latency.'
    run:
      command:
      - python3
      - scripts/research/exit_lever_ablation.py
      - --leg
      - trend_donchian_xrp_4h
      - --arm
      - A=
      - --arm
      - M1=--trail-adx-below=20;--trail-adx-tight-mult=2.5
      - --arm
      - M2=--trail-adx-below=25;--trail-adx-tight-mult=2.5
      - --arm
      - G1=--giveback-min-mfe-r=2;--giveback-r=1
      - --arm
      - R1=--tp-target-r=3;--tp-retarget-mode=stall_pull_in;--tp-retarget-stall-bars=10
      - --arm
      - R2=--tp-target-r=3;--tp-retarget-mode=atr_rescale
      - --days
      - '2330'
      - --start
      - '2020-07-01'
      - --end
      - 2026-10-15 23:59
      - --grade
      - replace
      - --baseline
      - A
      - --delta-r
      - '0'
      - --delta-r-per-trade
      - '0.02'
      - --folds
      - '4'
      - --fold-majority
      - '3'
      - --dd-tol-frac
      - '0.35'
      - --n-floor
      - '39'
      - --out
      - '{out_dir}'
      timeout_minutes: 120
    lands:
      store: research/results/
      assert_field: read_state
      min_rows: 1
    roadmap:
    - L-ATM
    - M20
    related:
    - docs/research/programmes/01-ACTIVE-TRADE-MANAGEMENT.md
    - scripts/research/exit_lever_ablation.py
    - docs/research/d1-cost-stack-verification-2026-09-25.md (harness cost stack)
