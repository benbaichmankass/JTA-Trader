    question: 'The 2026-07-12 fleet sweeps tested trail geometry, stale, giveback and trail_decay on ada_pullback_2h
      and every cell failed (trail_decay stall 10 / tight 2.5: 3 of 6 folds), but against an older incumbent: tp_r
      4 shipped 2026-08-30 and pullback_frac 0.618 merged 2026-10-18 (#18869). The live monitor (htf_pullback_trend_2h.monitor)
      reads trail_decay_* and giveback_* keys, so a passing arm is declarable without code. On the open trade
      (pkg-fa7365f5edff45ba, entry 0.2305, peak 2.37 R at 0.2142, 5-ATR trail = 0.23713 = the original stop) the
      arms would lock +1.17 R (10/1.8), +0.70 R (10/2.5) or exit at +1.37 R (giveback); the question is whether
      any of them pays net of cost over the leg''s history, not whether it saves this trade.'
    why_this_matters: Real-money leg (bybit_2 + mirror bybit_portfolio + bybit_1). The operator asked why the stop
      has not moved; the answer must be a measured lever record on the current incumbent, not a hand-moved stop.
    power:
      expected_n: 200
      min_detectable_effect: 0.45
      effect_units: sd
      design: one_sample
      alpha: 0.05
      power: 0.8
      basis: 'Floor: (1.96 + 0.8416)^2 / 0.45^2 = 38.76 -> 39 incumbent trades (the repo''s E35/exit-refinement
        floor). ESTIMATE: RQ-20261016-008 (same leg, same window shape) reported ~449 incumbent trades over 2020-10..2026-10;
        the 0.618 pullback_frac admits fewer entries, so expect 150-300. Trade sequences autocorrelate, so the floor
        is necessary, not sufficient; the calendar-fold majority carries the rest.'
      feasibility:
        source: none
        accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
    decision_rule:
      id: RULE-P1-Q4-ADAPB-LIVE-LEVERS
      statistic: 'From scripts/research/exit_lever_ablation.py --grade replace on ada_pullback_2h, window 2020-10-05
        .. 2026-10-15 23:59 (4 equal calendar folds; a trade is binned by entry time), net of the full cost stack
        the harness resolves per venue (fee + slippage + funding per 8 h window on Bybit perps, via execution_costs.resolve_cost_policy;
        recorded per arm as cost_stack). Per arm, from the harness''s own --json summary: n, net_total_r, max_drawdown_r,
        net R per fold. A = the leg as declared in config/strategies.yaml on this branch (argv built by regime_debt_matrix.build_harness_cmd;
        the pullback builder does not forward trail_decay/giveback keys, so the candidates pass them as raw harness
        flags). Candidates: D18 = --trail-decay-stall-bars 10 --trail-decay-tight-mult 1.8; D25 = --trail-decay-stall-bars
        10 --trail-decay-tight-mult 2.5; G = --giveback-min-mfe-r 2.0 --giveback-r 1.0. Per candidate C: delta
        = net_r(C) - net_r(A); folds_ge = folds where net_r(C) >= net_r(A) (ties count); maxDD(C) vs maxDD(A). Reported,
        not graded: by_outcome, lever_fired, tp_doctrine.'
      rule: 'INDETERMINATE IF n(A) < 39 (underpowered: no verdict, never FAIL on thin n). A candidate C PASSES iff
        net_r(C) > net_r(A) AND delta >= 0.02 R x n(A) (materiality: ~2x the cost of one extra exit) AND folds_ge
        >= 3 of 4 AND maxDD(C) <= maxDD(A) x 1.1. PASS IF one or more pass: the passing candidate with the highest
        net R is named -> a data-backed Tier-3 PROPOSAL (config/strategies.yaml ada_pullback_2h: trail_decay_stall_bars
        + trail_decay_tight_mult, or giveback_min_mfe_r + giveback_r) for the manager under the standing authorization;
        the live monitor re-reads strategies.yaml by mtime so it applies to the open package once merged and synced.
        FAIL IF none passes -> the incumbent exit stands and the open trade rides it; the four lever cells are recorded
        honest_negative on the CURRENT incumbent in the coverage matrix. Thresholds (0.02 R/trade, 3 of 4 folds,
        the 0.1 drawdown tolerance, the 39 floor) are not changed after any result.'
      what_it_does_not_do: 'Edits no config and places no order: a PASS is an evidence record for a Tier-3 proposal,
        never a change, and nothing here touches the open position. It does not test TP geometry (RQ-20261016-008
        already failed tp_extend on this leg) or entry filters. Three candidates against one incumbent is a multiple
        comparison; the fold majority and the materiality bar are what guard it. It overlaps the 2026-07-12 sweep''s
        history, so it is a re-test on the new incumbent, not an independent holdout.'
    compute: cpu_light
    value:
      bucket: own_losses
      usd_at_stake_per_month: 500
      confidence: 0.3
      basis: 'stand-in: operator-raised exit question on a real-money leg with an open position.'
