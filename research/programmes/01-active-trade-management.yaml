- id: P1-Q8.4-indet-policy
  goal: G1
  roadmap:
  - L-ATM
  - M23
  value:
    usd_at_stake_per_month: 400
    confidence: 0.2
  after:
  - unit: RQ-20261014-d6e7-04
    verdict: indeterminate
  unit:
    theme: ml_health
    priority: 1
    kind: experiment
    title: 'In-trade exit line, rung 4 INDETERMINATE -> the decisive money test: does an exit-now policy on the
      RICH in-trade state beat holding the fixed 2R bracket, net of cost, out of sample?'
    question: 'RQ-20261014-d6e7-04 closed INDETERMINATE: the rich state (momentum, ADX and slope, range, close location,
      ATR regime on top of where the trade is) gained +0.00054 nats over the distance-only reference, CI [-0.00118,
      +0.00245], positive in 4 of 4 folds, calibration slope 1.03, n_oos 2389 (MEASURED research/results/RQ-20261014-d6e7-04/38747778982.jsonl).
      Its PASS-gated policy rung RQ-20261014-d6e7-05 can therefore never dispatch. The information question cannot
      be settled at this n; the MONEY question can: on the same corpus and folds (newest committed ledger per USDT
      leg (comms/strategy_evidence/runs/*/*__trades.jsonl) re-walked bar by bar over public Binance Vision candles
      with a fixed bracket (initial SL -1R, TP K R), legs that pass the MFE control (>= 80% re-walk to the ledger
      mfe_r within 0.05 R); costs: every arm pays the trade''s ledger cost_total_r (fee + slippage + funding via
      execution_costs.resolve_cost_policy()), an early exit pays cost_slippage_r once more), does a policy that
      exits when the rich model''s E[R | hold] is below R_now by more than the extra exit cost beat holding the
      bracket by >= 0.05 R/trade?'
    why_this_matters: 'The operator''s destination (row IN-TRADE-EXIT-MODEL): turn would-be losers into winners.
      An information gain too small to read in nats either pays for its exits or it does not; this is the test that
      decides whether the per-bar linear line continues on this corpus or waits for the harness-native path emit
      (EXIT-PATH-EMIT-OFFLINE).'
    power:
      expected_n: 2000
      min_detectable_effect: 0.05
      effect_units: metric
      sd: 0.8
      design: one_sample
      alpha: 0.05
      power: 0.8
      basis: 'Paired per-trade difference (policy - bracket), sd ~0.8 R (INFERRED: an early exit moves a trade by
        up to 1 + K R); 0.05 R needs (2.80 x 0.8 / 0.05)^2 = 2,007 trades; d6e7-04 MEASURED n_oos 2389 on this corpus,
        so the test is at its power edge and INDETERMINATE is a live outcome.'
      feasibility:
        source: none
        accrual_basis: Committed ledgers + public candles; nothing accrues.
    decision_rule:
      id: RULE-P1-Q8-RICH-POLICY-ON-INDETERMINATE
      statistic: 'Exactly RQ-20261014-d6e7-05''s statistic: per OOS trade, policy net R - fixed-bracket net R (same
        trade; early exit pays cost_total_r + cost_slippage_r, the bracket pays cost_total_r); pooled mean with
        a 1,000-draw trade bootstrap 95% CI; sign per fold (4 expanding purged time folds); net R per capital-day
        for both arms; early-exit share; sanity control: share of trades the p0 policy would exit. first_passage.py
        --mode policy --features rich --ref dist --policy-tp-r 2.0.'
      rule: 'PASS IF pooled per-trade gain >= 0.05 R AND CI lower > 0 AND gain > 0 in >= 3 of 4 folds AND the capital-day
        guard holds AND the p0 sanity control exits on < 5% of trades -> next rung is the harness-native confirmation
        RQ-20261014-d6e7-06 (blocked on EXIT-PATH-EMIT-OFFLINE), then walk-forward and an observe-only shadow; Tier-3
        only after both. FAIL IF CI upper < 0.05 R -> the rich model''s information does not pay for its exits on
        the fixed-bracket reconstruction: the per-bar linear line closes on this corpus, written to IN-TRADE-EXIT-MODEL;
        the destination waits for the harness-native paths (all legs, the bracket as traded). INDETERMINATE otherwise,
        under n, or if the sanity control fails.'
      min_n: 300 OOS trades with a first passage
      what_it_does_not_do: Ships no exit rule. Fixed-bracket reconstruction, not the legs as traded. Crypto USDT
        legs only (22 non-crypto legs have no feed on the runner). Supersedes RQ-20261014-d6e7-05, whose PASS gate
        on d6e7-04 cannot be met.
    compute: cpu_light
    value:
      bucket: ai_trader
      usd_at_stake_per_month: 400
      confidence: 0.2
      basis: 'stand-in: the operator''s exit-now mechanism; not a P&L measurement.'
    routing: &id001
      needs_trainer_resident_data: false
      needs_gpu: false
      peak_memory_gb: 3.0
      est_minutes: 90
      why_runner: Fetches keyless public candles (Binance Vision / dukascopy) for a pinned window; Kaggle CPU runs
        with the internet off and metis-market-data carries no 2h/4h/1d candles for these legs; reads no trainer
        data.
      basis: Same instrument and candle fetch as RQ-20261014-d6e7-04 (one fetch per symbol x timeframe; ~90 min
        budget, timeout 240).
    run:
      command:
      - python3
      - scripts/research/first_passage.py
      - --mode
      - policy
      - --features
      - rich
      - --ref
      - dist
      - --policy-tp-r
      - '2.0'
      - --min-trade-gain-r
      - '0.05'
      - --min-folds
