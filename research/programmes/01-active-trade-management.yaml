- id: P1-Q4-ethprop-exit-confirm
  goal: G1
  roadmap:
  - L-ATM
  value:
    usd_at_stake_per_month: 350
    confidence: 0.3
  unit:
    theme: live_strategy
    priority: 1
    kind: experiment
    title: 'Programme 01 Q4, prop: do the four exit cells that cleared the m20 gate on trend_donchian_eth_prop beat
      the declared exit by a material margin in 5 of 6 calendar folds over 2020-07..2026-10 at the PROP venue''s
      cost stack?'
    question: The m20 gate passed adx25_k0_t1.8, adx25_k3_t1.8 (RQ-20261007-042), ms8_a25 (RQ-20261007-043) and
      trail4.5 (monthly RQ-20261009-002) on trend_donchian_eth_prop (base OOS n 49, base OOS net R +0.49; MEASURED
      research/results/RQ-20261009-002/38015170972.jsonl). All at the Bybit cost stack. At the prop venue's costs
      over 2020-07..2026-10, does any beat the declared exit by >= 0.02 R/trade in >= 5 of 6 calendar folds within
      the Path B drawdown bar?
    why_this_matters: trend_donchian_eth_prop trades on breakout_2, tradeify_1 and velotrade_1. The prop bar is
      a superset of the real-money ladder (operator 2026-10-15), so an exit change there needs the prop costs, not
      Bybit's.
    power:
      expected_n: 1085
      min_detectable_effect: 0.45
      effect_units: sd
      design: one_sample
      alpha: 0.05
      power: 0.8
      basis: 'Floor: (1.96 + 0.8416)^2 / 0.45^2 = 38.76 -> 39 incumbent trades (the repo''s E35/exit-refinement
        floor). MEASURED in the lane sandbox 2026-10-16 at the prop cost stack: 1,085 trades over this window (173-191
        per fold). Trade sequences autocorrelate, so the floor is necessary, not sufficient; the calendar-fold majority
        carries the rest.'
      feasibility:
        source: none
        accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
    decision_rule:
      id: RULE-P1-Q4-ETHPROP-EXIT-CONFIRM
      statistic: 'From scripts/research/exit_lever_ablation.py --grade replace on trend_donchian_eth_prop, window
        2020-07-01 .. 2026-10-15 23:59 (6 equal calendar folds; a trade is binned by entry time), net of the PROP
        venue cost stack passed explicitly on every arm (commission 6 bps + slippage 3 bps round trip + swap 5 bps
        per 24 h, the dxtrade/breakout economics RQ-20261015-6504-01 used), recorded per arm as cost_stack. Per
        arm, from the harness''s own --json summary: n, net_total_r, max_drawdown_r, net R per fold. A = the leg
        as declared in config/strategies.yaml (argv built by regime_debt_matrix.build_harness_cmd). Candidates:
        M1 = adx25_k0_t1.8; M2 = adx25_k3_t1.8; M3 = ms8_a25; T1 = trail4.5. Per candidate C: delta = net_r(C) -
        net_r(A); folds_ge = folds where net_r(C) >= net_r(A) (ties count); maxDD(C) vs maxDD(A). Reported, not
        graded: by_outcome, lever_fired, tp_doctrine (declared tp_r and P(mfe_r >= 6)).'
      rule: 'INDETERMINATE IF n(A) < 39 (underpowered: no verdict, never FAIL on thin n). A candidate C PASSES iff
        net_r(C) > net_r(A) AND delta >= 0.02 R x n(A) (materiality: ~2x the cost of one extra exit, 3 bps slippage
        on a 1-5% stop distance = 0.006-0.03 R) AND folds_ge >= 5 of 6 AND maxDD(C) <= maxDD(A) x 1.35. PASS IF
        one or more pass: the passing candidate with the highest net R is named -> the input to the prop EV/survival
        gate: the follow-on node scores the passing arm''s trades with prop_ev_grid against each firm''s ruleset
        before any Tier-3 proposal (a note on row PROP-EXIT-UNITS). FAIL IF none passes -> the declared exit stands
        on the prop legs; the four cells are retired for eth_prop. Thresholds (the 0.02 R/trade bar, 5/6 folds,
        the 0.35 drawdown tolerance, the 39 floor) are not changed after any result.'
      what_it_does_not_do: 'Edits no config and places no order: a PASS is an evidence record for a Tier-3 proposal,
        never a change. Does not score prop survival/EV (prop_ev_grid is the next rung). Overlaps the m20 sweep''s
        data (same history, longer window), so it is a stability/materiality confirmation, not an independent holdout.
        Best-of-several candidates is a multiple comparison; the fold majority and the materiality bar are what
        guard it.'
    compute: cpu_light
    value:
      bucket: own_losses
      usd_at_stake_per_month: 350
      confidence: 0.3
      basis: 'stand-in: three prop accounts; not a P&L measurement.'
    routing:
      needs_trainer_resident_data: false
      needs_gpu: false
      peak_memory_gb: 2.0
      est_minutes: 25
      why_runner: Fetches keyless public candles (Binance Vision / dukascopy) for a pinned window; Kaggle CPU runs
        with the internet off and metis-market-data carries no 2h/4h/1d candles for these legs; reads no trainer
        data.
      basis: 'Runner. One exit_lever_ablation.py invocation: one keyless candle fetch + one harness pass per arm.
        MEASURED 2026-10-16 in the lane sandbox: 2 arms on xrp_pullback_2h over 2020-07..2026-10 took 74 s wall
        incl. the fetch; est_minutes carries headroom for up to 7 arms and runner fetch latency.'
    run:
      command:
      - python3
      - scripts/research/exit_lever_ablation.py
      - --leg
      - trend_donchian_eth_prop
      - --arm
      - A=--fee-bps-roundtrip=6;--slippage-bps-roundtrip=3;--funding-bps-per-window=5;--funding-window-hours=24
      - --arm
      - M1=--trail-adx-below=25;--trail-adx-tight-mult=1.8;--fee-bps-roundtrip=6;--slippage-bps-roundtrip=3;--funding-bps-per-window=5;--funding-window-hours=24
      - --arm
      - M2=--trail-adx-below=25;--trail-adx-falling-bars=3;--trail-adx-tight-mult=1.8;--fee-bps-roundtrip=6;--slippage-bps-roundtrip=3;--funding-bps-per-window=5;--funding-window-hours=24
      - --arm
      - M3=--momentum-stale-bars=8;--momentum-stale-adx-below=25;--fee-bps-roundtrip=6;--slippage-bps-roundtrip=3;--funding-bps-per-window=5;--funding-window-hours=24
      - --arm
      - T1=trail_mult=4.5;--fee-bps-roundtrip=6;--slippage-bps-roundtrip=3;--funding-bps-per-window=5;--funding-window-hours=24
      - --days
      - '2330'
      - --start
      - '2020-07-01'
      - --end
      - 2026-10-15 23:59
      - --grade
      - replace
      - --baseline
      - A
      - --delta-r
      - '0'
      - --delta-r-per-trade
      - '0.02'
      - --folds
      - '6'
      - --fold-majority
      - '5'
      - --dd-tol-frac
      - '0.35'
      - --n-floor
      - '39'
      - --out
      - '{out_dir}'
      timeout_minutes: 120
    lands:
      store: research/results/
      assert_field: read_state
      min_rows: 1
    roadmap:
    - L-ATM
    - M20
    related:
    - docs/research/programmes/01-ACTIVE-TRADE-MANAGEMENT.md
    - scripts/research/exit_lever_ablation.py
    - docs/research/d1-cost-stack-verification-2026-09-25.md (harness cost stack)
- id: P1-Q2-alpaca-1d-pooled
  goal: G1
  roadmap:
  - L-ATM
  value:
    usd_at_stake_per_month: 250
    confidence: 0.3
  after:
  - unit: RQ-20261006-061
    verdict: any
  unit:
    theme: live_strategy
    priority: 1
    kind: experiment
    title: 'Programme 01 Q2, real money: the alpaca 1d sentinel family''s predictive TP on the LONGEST available
      history (dukascopy from 2018-02, ~8.7 y vs cab7-06''s 5 y) with gld added to the pool -- can the pooled test
      reach a verdict?'
    question: 'RQ-20261015-cab7-06 (the family-pooled follow-on of RQ-20261006-061) closed INDETERMINATE: pooled
      iaum/ief/slv/gdx/tlt 1d, K* 2.5R, n_oos 65, OOS delta -0.10 R/trade, CI [-0.237, +0.010], calibration gap
      0.091 (MEASURED research/results/RQ-20261015-cab7-06/38775469135.jsonl). The CI straddles the -0.05 non-inferiority
      margin. Same instrument, same constants, same rule; the window is the longest the runner''s dukascopy lane
      serves (--days 3180, data from 2018-02-01) and gld_pullback_1d (same unit, same tp_r 50, alpaca_paper) joins
      the pool. Does the pooled 1d family''s K* predict and hold its edge vs the 50R sentinel?'
    why_this_matters: 'alpaca_live trades iaum/ief/slv 1d on the 50R sentinel (entry_tp and tp_revision fail on
      all three; alpaca_portfolio mirrors ief/slv). Per-leg n cannot reach the floor (TP-PREDICT-HEAD note: 34-44
      trades per leg), so pooling over the longest history is the only powered test.'
    power:
      expected_n: 100
      min_detectable_effect: 0.45
      effect_units: sd
      design: one_sample
      alpha: 0.05
      power: 0.8
      basis: 'Floor 39 OOS trades. ESTIMATE: cab7-06 had 155 pooled trades on 1830 d; 3180 d x 6 legs scales that
        to ~270-320 (x1.74 window, +gld) -> ~110-130 OOS. MEASURED 2026-10-16 in the lane sandbox: dukascopy IEF
        daily history starts 2018-02-01 (2,172 rows). If the CI is still wide at this n the record says so; the
        window cannot be lengthened on this lane.'
      feasibility:
        source: none
        accrual_basis: dukascopy daily ETF-CFD candles; nothing accrues.
    decision_rule:
      id: RULE-P1-Q2-ALPACA1D-LONG-PREDICTIVE-TP
      statistic: 'Exactly RQ-20261015-cab7-06''s statistic (tp_prediction_derive.py --pool, constants unchanged:
        K grid 1-8R, IS 60% chronological per leg, reach floor 0.10, calibration tolerance 0.10, non-inferiority
        margin 0.05 R/trade, bootstrap 2000 seed 20261015) over legs iaum_pullback_1d,ief_pullback_1d,slv_pullback_1d,gdx_pullback_1d,tlt_pullback_1d,gld_pullback_1d
        and a 3180-day window; net of the harness''s full cost stack (equity fee + slippage via execution_costs).'
      rule: 'INDETERMINATE IF n_oos < 39 OR no K eligible. FAIL IF reach_OOS(K*) < 0.10 OR calibration gap > 0.10
        OR CI upper < -0.05 R/trade -> no fixed target predicts this family and holds its edge: the 1d family''s
        doctrine route is the trail itself (clause 3) and the in-trade model, and the debt is recorded on row TP-DOCTRINE
        with this record; never a demotion. PASS IF reach_OOS(K*) >= 0.10 AND gap <= 0.10 AND CI lower >= -0.05
        -> K* is the family''s predictive TP; the node after this unit registers the harness-native confirmation
        (per leg, ablation of tp_r = K* vs the sentinel) before any Tier-3 proposal on alpaca_live + alpaca_portfolio.'
      what_it_does_not_do: Touches no config. Pooling assumes the six legs' R-distributions are comparable (same
        unit, same 1d timeframe); per-leg rows are reported, not graded. A PASS is a screen.
    compute: cpu_light
    value:
      bucket: own_losses
      usd_at_stake_per_month: 250
      confidence: 0.3
      basis: 'stand-in: three alpaca_live legs on the sentinel; not a P&L measurement.'
    routing:
      needs_trainer_resident_data: false
      needs_gpu: false
      peak_memory_gb: 2.0
      est_minutes: 30
      why_runner: Fetches keyless public candles (Binance Vision / dukascopy) for a pinned window; Kaggle CPU runs
        with the internet off and metis-market-data carries no 2h/4h/1d candles for these legs; reads no trainer
        data.
      basis: Runner. dukascopy daily fetch x6 + one uncapped replay per leg + grading; cab7-06 ran the same shape
        on 1830 d.
    run:
      command:
      - python3
      - scripts/research/tp_prediction_derive.py
      - --legs
      - iaum_pullback_1d,ief_pullback_1d,slv_pullback_1d,gdx_pullback_1d,tlt_pullback_1d,gld_pullback_1d
      - --days
      - '3180'
      - --pool
      - --out
      - '{out_dir}'
      timeout_minutes: 150
    lands:
      store: research/results/
      assert_field: read_state
      min_rows: 1
    roadmap:
    - L-ATM
    - M20
    related:
    - docs/research/programmes/01-ACTIVE-TRADE-MANAGEMENT.md
    - RQ-20261015-cab7-06
    - RQ-20261006-061
    - scripts/research/tp_prediction_derive.py
