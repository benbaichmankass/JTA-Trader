  value:
    usd_at_stake_per_month: 200
    confidence: 0.3
  after:
  - unit: RQ-20261014-9807-01
    verdict: any
  - unit: RQ-20260928-019
    verdict: any
  unit:
    theme: live_strategy
    priority: 2
    kind: experiment
    cadence: once
    title: 'Programme 01 Q11 rung 1 (label study): do in-trade path metrics at bar 6 -- chop, Kaufman efficiency ratio, MFE
      share, peak position -- predict peak-to-exit giveback beyond bars-in-trade and current R, out of sample by calendar
      fold, on the four bybit_2 money legs?'
    question: 'Operator idea (IDEAS.md 2026-10-21; the live ADA swings): on harness paths (--emit-paths, config-exact) of
      trend_donchian_eth_4h, trend_donchian_xrp_4h, ada_pullback_2h, xrp_pullback_2h over 2020-07-01 .. 2026-10-15, for trades
      still open after bar 6, does adding chop_k, er_k, shape_k and early_k to a baseline of open_r_k, peak_r_k and bars_since_peak_k
      raise out-of-sample R2 on giveback by >= 0.02, or lower log-loss on giveback >= the training folds'' median by >= 0.01,
      in >= 4 of 6 calendar folds (pooled over the legs)?'
    why_this_matters: Giveback is the operator's standing priority (7-day 14.7R of 21.8R peak; paper+mirror ~85-87%). A rung-1
      PASS opens the rung-2 LEVER arm (bank 50% at +1 R when the metric crosses its threshold, net of cost); a FAIL closes
      this family for these legs without building a lever. The giveback census (RQ-20261014-9807-01, graded PASS 2026-10-15)
      supplies the per-leg distribution this chains after.
    power:
      expected_n: 600
      min_detectable_effect: 0.15
      effect_units: sd
      design: one_sample
      alpha: 0.05
      power: 0.8
      basis: 'The registered bar r2_gain >= 0.02 is a partial correlation of about 0.14 between the path metrics and the
        giveback left over after the bars+R baseline; stated as 0.15 sd, the floor is (1.96 + 0.8416)^2 / 0.15^2 = 349 pooled
        trades. Expected about 600 pooled trades still open at bar 6 across the four legs (incumbents read n 275 / 68 / 402 /
        ~200 in the sibling Q9 units; on the eth4h smoke run 157 of 258 trades were still open at bar 6). Trades autocorrelate:
        the calendar-fold majority carries the rest.'
      feasibility:
        source: none
        accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
    decision_rule:
      id: RULE-P1-Q11-PATH-METRIC-GIVEBACK-R1
      registered_at: '2026-10-22'
      registered_before_run: true
      statistic: From scripts/research/path_metric_giveback.py, k=6, 6 calendar folds by entry time, leave-one-fold-out. Label
        giveback = peak_r_final - exit_r on the trade's own last path row (truncation-honest). Baseline features open_r_k,
        peak_r_k, bars_since_peak_k; full adds chop_k, er_k, shape_k, early_k; ridge (lambda 1) on standardised features for
        R2, Newton logistic for the binary label giveback >= the training folds' median. r2_gain = R2_oos(full) - R2_oos(base)
        and ll_gain = logloss_oos(base) - logloss_oos(full), pooled over held-out rows; fold wins = folds where the gain >
        0.
      rule: 'INDETERMINATE IF pooled n < 100. PASS IF (r2_gain >= 0.02 AND r2 fold wins >= 4 of 6) OR (ll_gain >= 0.01 AND
        ll fold wins >= 4 of 6): opens rung 2 (the lever arm), never a config change. FAIL otherwise: path metrics add nothing
        measurable over bars-in-trade and current R for these legs. Per-leg verdicts are reported, not graded. Thresholds
        are not changed after any result.'
    what_it_does_not_do: 'A label study, not a lever: edits no config, places no order, tests no exit. Harness paths are not
      live paths (P2-Q3.1 read INDETERMINATE on the live ledger, n-bound). Volatility is a confound: a choppier path also
      has larger R swings, so a PASS says the metrics carry information, not that chop causes giveback. No exploratory look
      at this window was taken before registration.'
    compute: cpu_light
    value:
      bucket: own_losses
      usd_at_stake_per_month: 500
      confidence: 0.35
      basis: 'stand-in: money leg; not a P&L measurement.'
    routing:
      needs_trainer_resident_data: false
      needs_gpu: false
      peak_memory_gb: 2.0
      est_minutes: 20
      why_runner: Fetches keyless public candles (Binance Vision) for a pinned window; reads no trainer data.
      basis: Four keyless candle fetches + four harness passes with --emit-paths (~60 s each MEASURED 2026-10-21) + numpy
        fits.
