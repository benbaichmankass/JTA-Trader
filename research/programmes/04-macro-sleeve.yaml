# Programme P4 -- macro sleeve: the machine-readable question tree for
# docs/research/programmes/04-MACRO-SLEEVE.md (Q1-Q7). Lane P4-MACRO-BACKLOG-1016, 2026-10-16.
# Read by scripts/research/queue_replenish.py (programme source, RESEARCH-LOOP-AUDIT RC2/RC3); the contract is in
# research/programmes/01-active-trade-management.yaml. Landing machinery: every edit holds for a human merge.
# `value` figures are INFERRED planning weights (same scale as the units they key on), not measurements.
#
# STATE AT AUTHORING (MEASURED from research/results/ 2026-10-16): the PPI m/m -> ES drift passed its stability
# halves (4a4c-01/-02), a clean -10 td placebo (4a4c-03) and NQ (4a4c-04); ZN failed (4a4c-05); the net-of-MES-cost
# SIGN book failed (4a4c-06: +0.00221/trade t 1.53 vs all-long +0.00341). So the 4a4c-09 confirmation clause failed:
# 4a4c-09 is RETIRED and P4-Q3-event-axis carries the revival, keyed on the magnitude-weighted rank tilt
# (RQ-20261016-7769-20, blocked on MACRO-EVENT-RANKTILT-ARM). core_cpi/core_pce (4a4c-07/-08) failed their IC bars.
#
# SHAPE. Every runnable IC unit this lane authored (RQ-20261016-7769-02..19) has three pre-registered `unit:` rungs
# that materialise on its PASS (-placebo, -early, -late) and one economic rung (-econ) after a clean placebo: a full
# sign-book `unit:` for directional bond kinds, a needs_authoring rank-tilt ask for equity kinds (a sign book cannot
# beat a rising index -- 4a4c-06 arithmetic). A FAIL needs no node: the unit closes and the kind is out of the family.
# M29 (Q6) and the sleeve executor (Q7) key on P4-Q3-event-axis, which waits until someone replaces its
# needs_authoring with a unit body -- so "M29 dormant" is the tree's honest default, not an omission.
programme: P4
plan: docs/research/programmes/04-MACRO-SLEEVE.md
nodes:
- id: P4-Q1-cost-read
  goal: G6
  roadmap: [M28]
  value: {usd_at_stake_per_month: 100, confidence: 0.3}
  after:
  - {unit: RQ-20260928-010, verdict: any}
  needs_authoring: 'The realistic-cost rescore landed. Close PI-20260927-CAA05-0003 with its number, then decide the VALUATION READ''s calibration: the
    pooled read is null at every horizon tested (comms/macro/horizon_ic_scorecard.json: IC 7d +0.034 t 1.13 ... 180d -0.025 t -0.34, zero cost) and in every
    construction (value_construction_scorecard.json: clean NULL). The one cut never run is PER SYMBOL (GLD/IEF/SLV/SPY/TLT pooled can hide opposite signs):
    register that unit (5 symbols x 1 horizon, BH within the 5) or retire the valuation axis as M28''s conviction source with these records as the reason.'
- id: P4-Q1-options-cost
  goal: G6
  roadmap: [M28]
  value: {usd_at_stake_per_month: 60, confidence: 0.2}
  after:
  - {unit: RQ-20260928-010, verdict: pass}
  needs_authoring: 'Q1 rung 2: the realistic-cost rescore did NOT kill the valuation axis, so the labelled fee_frac 0.005 proxy must be replaced by a MEASURED
    options cost (Alpaca options fee schedule + point-in-time chain spreads for GLD/IEF/SLV/SPY/TLT) before anything is proposed.'
- id: P4-Q2-ppi-nq-artifact
  goal: G6
  roadmap: [M28]
  value: {usd_at_stake_per_month: 60, confidence: 0.3}
  after:
  - {unit: RQ-20261016-7769-01, verdict: pass}
  needs_authoring: 'The NQ=F placebo PASSED: the NQ leg of the PPI lead is a sample artifact. Record it on the lead (ES alone remains), retire RQ-20261016-7769-22
    (NQ rank tilt) with this reason, and state whether the ES placebo''s cleanliness still carries the lead.'
- id: P4-Q2-ppi-ranktilt-fail
  goal: G6
  roadmap: [M28]
  value: {usd_at_stake_per_month: 80, confidence: 0.3}
  after:
  - {unit: RQ-20261016-7769-20, verdict: fail}
  needs_authoring: 'The PPI drift does not pay even magnitude-weighted at a daily-close entry on ES. Two honest exits: (a) the intraday-reaction rung (programme
    04 Q2 rung 6: needs intraday bars at release time, a build) if the IC record argues the money is in the first hours, or (b) close the PPI lead on M28
    with the 4a4c set + this record as the reason. Register (a) as a unit + lever row, or write (b).'
- id: P4-Q2-ppi-rty-placebo
  goal: G6
  roadmap: [M28]
  value: {usd_at_stake_per_month: 60, confidence: 0.2}
  after:
  - {unit: RQ-20261016-7769-02, verdict: pass}
  unit:
    title: 'P4-Q2 placebo for RQ-20261016-7769-02 (ppi_mom -> RTY=F): does the surprise ''predict'' RTY=F over a window that ENDS BEFORE the release (anchor
      -10 trading days)? Expected FAIL'
    theme: macro
    priority: 2
    kind: experiment
    question: With every ppi_mom release's base bar moved 10 trading days earlier, is the IC at h=3 NEGATIVE with |ic_t_eff| >= 2.0, n >= 100? A PASS means
      the parent's IC is a sample artifact.
    why_this_matters: A rung pre-registered BEFORE RQ-20261016-7769-02 ran (lane P4-MACRO-BACKLOG-1016); it materialises only on that unit's PASS. A family
      PASS at t~2.4 is a lead under BH (64 tests, rank-1 |t|~3.36), so placebo, stability and cost rungs decide, not the IC.
    power:
      expected_n: 140
      min_detectable_effect: 0.25
      effect_units: sd
      design: one_sample
      alpha: 0.05
      power: 0.8
      basis: '140 releases (parent''s population, MEASURED 2026-10-16); floor ((2.0+0.84)/0.25)^2 = 130: CLEARED. Shifted bars before the panel start are
        dropped.'
      feasibility: {source: none, accrual_basis: fixed historical backfill; ~12 releases/yr accrue}
    decision_rule:
      id: RULE-P4-Q2-ppi-rty-placebo
      statistic: scripts/research/macro_event_study_run.py grade() with --anchor-shift-td -10 at horizon 3.
      rule: 'The verdict is stated FOR THE PLACEBO: PASS (= the ''edge'' exists in a window that ends BEFORE the print = the parent is an ARTIFACT) IF at
        h=3 with n >= 100, |ic_t_eff| >= 2.0 AND the IC is negative. FAIL (= placebo clean, the parent survives) IF n >= 100 and it does not. INDETERMINATE
        IF n < 100. no_data/producer_failed: a route fault, not a verdict.'
      what_it_does_not_do: Rules a sample artifact in or out for the parent; tests nothing post-release.
      registered_at: '2026-10-16'
      registered_before_run: true
    compute: cpu_light
    routing:
      needs_trainer_resident_data: false
      needs_gpu: false
      peak_memory_gb: 1.0
      est_minutes: 10
      basis: same shape as the parent (minutes on the runner)
      why_runner: off-VM yfinance fetch + committed snapshots; no idle backend holds these instruments
    run:
      command: [python3, scripts/research/macro_event_study_run.py, --kind, ppi_mom, --snapshots, 'comms/macro/econ_calendar_snapshots.jsonl,comms/macro/econ_calendar_snapshots_survey_backfill.jsonl',
        --symbol, RTY=F, --horizons, '3', --primary-horizons, '3', --min-n, '100', --t-bar, '2.0', --expected-sign, negative, --anchor-shift-td, '-10',
        --population, 'ppi_mom releases, RTY=F base bar shifted -10 trading days (placebo)', --out, '{out_dir}']
      timeout_minutes: 30
    lands:
      store: research/results/
      assert_field: read_state
      min_rows: 1
    programme: P4
    related: [RQ-20261016-7769-02, research/programmes/04-macro-sleeve.yaml]
