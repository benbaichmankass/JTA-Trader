manifest_notes:
  window_decision_2026_11_23: 'The seven 2026-11-17 units on this leg (9e1a-01, 9e1b-01, 9e1c-01, b2f1-03, b2f1-14, b2f2-02, b2f2-21) were blocked
    on a Yahoo ES=F data refusal, which is fixed (yfinance 1.7.0), but their registered 2018-06-01 window gives A n=31 < the floor of 39, so every
    arm would grade INDETERMINATE. Manager ruling 2026-11-23: register a longer window as superseding units (new ids RQ-20261123-c5d2-01/02/04/05/06/07;
    the old files are marked superseded_by and otherwise unedited), start chosen from data quality and power ALONE before any arm was read: A-arm-only
    counts over <start> .. 2026-10-15 were 2016 n=37, 2014 n=42, 2012 n=51, 2010 n=58, 2008 n=66; 2012-01-01 is the earliest start with zero malformed
    daily bars (ES=F 2001-2011 carries 1-2 malformed bars in 8 of those 11 years and none in 2001, 2003 and 2009; CORRECTED 2026-11-23 from ''1-2
    a year'', which overstated it). Bars are yfinance ES=F, the index future the leg''s micro MES is 1/10 of (same instrument family, not a proxy);
    costs resolve for MES (7.5 bps fee, 5.0 bps slippage). The adx-max grid of 9e1c-01 was NOT superseded: both arms (AX40, AX50) are byte-identical
    to A on the longer window too (lever_never_fired), so it would read INDETERMINATE on any window here; it is RETIRED BY RECORD (manager ruling
    2026-11-23): A, AX40 and AX50 have identical trades (same n and net R, same trade rows) on the registered window (n=31) and on 2012+ (n=51),
    and the leg''s ADX at entry never reaches 40 (max 38.23), so an ADX ceiling of 40 or 50 excluded no entry in either window.'
