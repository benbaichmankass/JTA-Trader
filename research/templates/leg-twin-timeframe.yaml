family: leg-twin-timeframe
weight: 1
kind: experiment
cadence: once
theme: live_strategy
priority: 3
roadmap: L-PROGRAMMES
compute: cpu_light
# CONFIG-EXACT TIMEFRAME TWIN (row RESEARCH-LEVER-FAMILY-REACH part a, 2026-11-26; scripts/research/twin_design.py). The weekly arm sweep cannot reach the
# `timeframe` lever family: an arm is graded as "arm minus control A on the same trades", but a different bar size is a different trade set.
# Each twin is therefore its OWN unit, graded ABSOLUTE by the Stage-0 rule. The leg's other config keys and its own cost policy are kept (exit_lever_ablation --timeframe).
# A twin result is a lever-map reading; per-symbol results never gate (operator 2026-11-04). Gates this adds or changes: none.
structured:
  mode: twin
  hypothesis: >-
    the leg's net-of-cost edge is a property of the setup, not of one bar size: a config-exact twin on another bar size keeps net R > 0
    with >= 3 of 4 folds positive at an adequate n
title: "Config-exact timeframe twin of {leg}: {twin} (generated)"
practice_precedent: "M4, R1 (docs/reference/trading-and-model-practice-principles.md): the same rule on a different instrument or horizon is the cheapest robustness read; every twin is counted"
question: >-
  Does {leg} ({harness} harness, native {symbol} {timeframe}) keep a net-of-cost Stage-0 edge when run config-exact on the bar size {twin}
  over the last ~1830 days: net R > 0, n >= 39 and >= 3 of 4 calendar folds net-positive, with the leg's own cost policy?
why_this_matters: >-
  The lever map reads `timeframe` as not tested for {leg}. If the edge only exists on one bar size it is more likely a fit to that
  bar size's history than a property of the setup; if it holds on a twin it is a lead for a population-level pooled test (never a per-symbol decision).
power:
  expected_n: 50
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: >-
    d=0.45 -> 39 trades at alpha 0.05 / power 0.8 (the E35 floor). expected_n 50 is an ESTIMATE from comparable single-leg Stage-0 windows, not a
    measurement of this twin; below the 39 floor the unit grades INDETERMINATE, never FAIL.
  feasibility:
    source: none
    accrual_basis: >-
      Re-measurement on freshly fetched public candles over a pinned window; nothing accrues. Bybit-hosted symbols may land producer_failed on a
      GitHub runner (known geoblock), recorded honestly rather than retried.
decision_rule:
  id: "RULE-TPL-LEG-TWIN-TIMEFRAME-STAGE0"
  statistic: >-
    exit_lever_ablation.py --leg {leg} --arm A= --timeframe {twin} --grade stage0 --baseline A, 4 calendar folds, net of the full cost stack
    (execution_costs.resolve_cost_policy, the leg's own); reports n, net R, maxDD and net R per fold.
  rule: >-
    PASS IF net R > 0 AND n >= 39 AND >= 3 of 4 folds net-positive (the harness stage0 grade). FAIL IF n >= 39 and that does not hold.
    INDETERMINATE IF n < 39 or the producer failed. A PASS or FAIL is a reading of the leg's lever map for `timeframe`
    (counted in iteration.multiple_testing), never a promotion, a demotion or a retirement; a FAIL closes THIS twin, not the lever family.
    Thresholds are not changed after any result.
  what_it_does_not_do: Edits no config or roster and places no order. Per-symbol results never gate (operator 2026-11-04); a population claim needs its own pooled test.
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 30
  basis: one leg, one arm through the committed-record argv builder on a GitHub runner (comparable to the f2a4 cost-reprice units, ~15 min).
run:
  workflow: research-script-run.yml
  timeout_minutes: 120
  command:
    - python3
    - scripts/research/exit_lever_ablation.py
    - --leg
    - "{leg}"
    - --arm
    - "A="
    - --timeframe
    - "{twin}"
    - --days
    - "1830"
    - --grade
    - stage0
    - --baseline
    - A
    - --delta-r
    - "0"
    - --folds
    - "4"
    - --fold-majority
    - "3"
    - --n-floor
    - "39"
    - --out
    - "{out_dir}"
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
grid:
  legs: live_roster_legs_timeframe_twins
