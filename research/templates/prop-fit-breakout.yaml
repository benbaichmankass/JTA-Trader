family: prop-fit-breakout
weight: 30
kind: experiment
cadence: once
theme: new_strategy_prop
priority: 2
# STRUCTURED LEVER DESIGN (RESEARCH-TEMPLATES-STRUCTURED, 2026-11-01; OPERATING-PLAN § 2 "THE research workflow"): ONE unit per leg
# prices ALL the sizing arms together -- control A (flat 1.0% of balance) plus the one-factor variants (risk_pct 0.5% / 1.5%, and
# the cushion-fit room fractions) -- instead of one unit per arm. The lever is `sizing_vs_cost`; the arms are counted for
# multiple testing; prop_ev_grid.py `--grade arms_pass_bar` reports every arm against the SAME absolute bar. The old per-arm
# units (family key `...sizing_arm_key=`) are untouched; this mints a new key per leg. Gates this adds or changes: none.
structured:
  mode: fixed_arms
  lever: sizing_vs_cost
  correction: "none needed for ranking: the arms re-price one fixed trade set; a PASS names the arm(s), the count is stated"
  hypothesis: >-
    the leg's prop EV and survival respond smoothly to risk_pct and to the cushion-fit room fraction; a response that only clears
    the bar at one arm is a lead for that sizing, a response that clears none is evidence the leg does not fit the firm's limits
  arms:
    - {key: A, args: "--sizing balance --risk-pct 0.010"}
    - {key: C-bal005, args: "--sizing balance --risk-pct 0.005"}
    - {key: C-bal015, args: "--sizing balance --risk-pct 0.015"}
    - {key: C-room033, args: "--sizing room --risk-pct 0.015 --room-frac 0.33"}
    - {key: C-room050, args: "--sizing room --risk-pct 0.015 --room-frac 0.50"}
title: "Breakout prop fit: {leg} across the sizing arms under RULE-B6 V2 (generated)"
practice_precedent: "none: a prop firm's drawdown-limit survival fit is a house-specific constraint check; no external practice source was reviewed for it"
question: >-
  Does {leg} ({symbol} {timeframe}, Breakout market {breakout_market}) clear the
  operator's prop bar -- E[net $ banked before the account dies] > 0 with
  P(net>0) >= 0.70 on every seed -- under Breakout's own cost stack
  (config/prop_rulesets/breakout_turbo_1step.yaml -- breakout_2's ruleset, --costs breakout, swap model
  {swap_model}) at its best sizing among 5 pre-registered arms (control A = flat 1.0% of balance;
  variants one-factor in risk_pct and room fraction)? Re-prices the leg's committed
  trade evidence; no new backtest.
why_this_matters: >-
  Breakout prop is the operator's priority-1 fit target (weight 30 of 100).
  Every leg with committed evidence and a Breakout-mappable symbol gets one
  row per sizing arm so the roster proposal for breakout_2 (Turbo) can be made
  from a record, never from a memo. RETARGETED 2026-10-16 (lane
  P5-PROP-BACKLOG-1016): until then this priced Classic breakout.yaml for the
  retired breakout_1 (RQ-20261016-002/003 had already run when this was
  fixed: their numbers are valid Classic-ruleset prices, but a PASS from them is not
  actionable for breakout_2).
power:
  expected_n: "{n_trades}"
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: >-
    d=0.3 needs ~87-90 observations at alpha 0.05 / power 0.8 (the floor
    RQ-20260928-011/-012 registered). expected_n is the leg's committed
    trade count read from its evidence record at generation time; below 88
    the unit grades UNDERPOWERED (indeterminate), never FAIL.
  feasibility:
    source: none
    accrual_basis: >-
      Re-grading of committed trade evidence; nothing accrues.
decision_rule:
  id: "RULE-TPL-PROP-FIT-B6V2-ARMS-{leg}"
  statistic: >-
    Per seed: prop_ev_sim path-mode ev_net_usd_per_life and p_net_positive
    over the leg's committed trades ({trades_file}), for each of the 5 sizing arms.
  rule: >-
    PASS IF ANY arm has ev_net_usd_per_life > 0 on ALL 5 seeds AND P(net>0) >= 0.70 on
    ALL 5 seeds (the passing arm(s) and the control A's own reading are named; 5 arms counted). UNDERPOWERED (indeterminate) IF n < 88. FAIL IF every arm has ev <= 0 on
    some seed. NULL (indeterminate) otherwise. A PASS is a Tier-3 roster
    proposal for breakout_2, not applied by this unit; a FAIL is one pass and
    re-queues for a confirmatory run before it is read as a kill.
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 1.0
  est_minutes: 60
  basis: 1 leg x 5 arms x 5 seeds of prop_ev_sim, ~2.5 min per cell serial (~60 min on the runner at --jobs 4).
run:
  workflow: research-script-run.yml
  timeout_minutes: 150
  command:
    - python3
    - scripts/research/prop_ev_grid.py
    - --leg
    - "{leg}"
    - "@ARMS@"
    - --common
    - "--ruleset config/prop_rulesets/breakout_turbo_1step.yaml --costs breakout --funded-start fresh --swap-model {swap_model}"
    - --seeds
    - "1,2,3,4,5"
    - --grade
    - arms_pass_bar
    - --p-floor
    - "0.70"
    - --n-floor
    - "88"
    - --out
    - "{out_dir}"
    - --jobs
    - "4"
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
# PI-20261004-FOJGFIZF-0002: a leg whose committed n is below the unit's own
# 88 floor can only grade UNDERPOWERED (33 such runs, zero decisions). The
# generator skips it; since the unit key excludes n_trades, the leg is minted
# on the first replenish after its committed evidence reaches 88 (accruing,
# not dropped). MUST equal run.command's --n-floor -- queue_replenish refuses
# a template where they differ.
min_n_trades: 88
grid:
  # Expanded by the generator: every live-roster leg whose evidence record
  # exists AND whose symbol maps to a Breakout market (see `markets`), and
  # whose committed n_trades >= min_n_trades.
  legs: evidence_legs_with_breakout_market
markets:
  # our symbol -> Breakout market and the swap model its venue uses
  # (docs/integrations/breakout-instruments-2026-09-27.md).
  BTCUSDT: {market: BTCUSD, swap_model: dxtrade}
  ETHUSDT: {market: ETHUSD, swap_model: dxtrade}
  SOLUSDT: {market: SOLUSD, swap_model: dxtrade}
  XRPUSDT: {market: XRPUSD, swap_model: dxtrade}
  ADAUSDT: {market: ADAUSD, swap_model: dxtrade}
  AVAXUSDT: {market: AVAXUSD, swap_model: dxtrade}
  SPY: {market: S&P500, swap_model: prorated}
  MES: {market: S&P500, swap_model: prorated}
  QQQ: {market: XYZ100, swap_model: prorated}
  TQQQ: {market: XYZ100, swap_model: prorated}
  QLD: {market: XYZ100, swap_model: prorated}
  SLV: {market: SILVER, swap_model: prorated}
  USO: {market: CL, swap_model: prorated}
