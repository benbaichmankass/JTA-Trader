test_design_review:
  first_skeptic_flaw: >-
    "64 live trades is far too few, and 62 of 64 cost rows are estimates." It does not apply to THIS conclusion, which is a bound and not an
    estimate. A cost lever can recover at most the cost paid. With cost set to ZERO (every cost lever's ceiling at once) net = gross = -65.84,
    still negative, so neither n nor the estimate's accuracy can change the sign. The pre-development window (617c-01, n 130) independently
    fails the one cost lever that ALSO selects trades (signal strength).
  checks:
    window_vs_mechanism: 'the mechanism (cost <= cost paid) holds in any window; two disjoint windows read it: the 2026-07..11 live window (58e4-04) and 2019-01..2021-11 (617c-01)'
    metric_vs_baseline: 'net USD vs net USD on the same trades; the baseline cannot be beaten by chance because the bound is arithmetic (saving <= cost)'
    label_vs_payoff: 'graded on realised net P&L, the payoff itself; no label'
    gate_vs_size: 'fixed live sizing, no gate in the overlay; sizing scales gross and cost together, so the sign is size-invariant'
    harness_validity: 'attribution by scripts/research/edge_failure_attribution.py on journal rows; 617c-01 by exit_lever_ablation.py on the venue-aware cost stack; no known defect at run time'
    reference_distribution: 'not needed for the bound (deterministic); 617c-01 graded on its registered fold rule (3 folds, majority 2, n floor 39)'
