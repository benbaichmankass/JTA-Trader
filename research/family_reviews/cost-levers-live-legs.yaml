positive_control:
  test: 'RQ-20261101-58e4-04 per-leg row trend_donchian_eth_4h: the same cost accounting reads the one gross-positive leg as net-positive (gross +8.82, cost 1.27, net +7.54, n 18), so the measurement can see a positive'
  passed: true
outside_evidence:
  sources:
  - source: 'Novy-Marx & Velikov (2016), A Taxonomy of Anomalies and Their Trading Costs, Review of Financial Studies 29(1):104-147'
    url: https://www.nber.org/papers/w20721
    primary: true
    finding: 'cost mitigation (buy/hold spreads, lower turnover) preserves net spreads only for strategies with a gross spread to preserve; transaction costs always reduce profitability. Mitigation is bounded by the cost it removes, which here is 7% of the loss, so it names no condition that could flip a gross-negative leg.'
  - source: 'Frazzini, Israel & Moskowitz, Trading Costs (SSRN 3229719)'
    url: https://papers.ssrn.com/abstract=3229719
    primary: true
    finding: 'live institutional execution costs are far smaller than model estimates; if our 5.17 estimate is too high, the true cost lever ceiling is even smaller, strengthening the bound.'
  - source: 'Albers, Cucuringu, Howison & Shestopaloff, The Market Maker''s Dilemma / To Make, or to Take (arXiv 2502.18625), live experiment on the Binance BTC perpetual'
    url: https://arxiv.org/abs/2502.18625v2
    primary: true
    finding: 'maker fill probability is negatively correlated with post-fill returns (adverse selection), so the 58e4-04 maker ceiling (100% fill, no adverse selection) overstates what a maker-entry lever can recover.'
