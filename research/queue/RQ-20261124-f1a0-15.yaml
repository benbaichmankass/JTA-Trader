  subject_kind: ml_model
  from_result: manager REGIME + CF plan 2026-11-24 (R4) + REGIME-PROGRAM R1 local read
  verdict_read: indeterminate
  diagnosis: 'Every regime gate so far was a DROP-gate (fewer trades, lost power: oracle ADX gating lost -44 R; router cells no better than random).
    R4 conditions SIZE instead, keeping every decision. The R1 local read shows the BTC state persists week to week (acf 0.87) while side edge
    does not; vol parity is the sizing that uses only the persistent part (vol), not a side forecast.'
  search: 'lever family regime/sizing, one fixed rule (no grid): weight = clip(median_train(btc_vol24) / btc_vol24_at_bar, 0.5, 2), normalised
    to mean 1 per fold.'
