  - unweighted) - 2 se > -0.0068 AND bar Sharpe(weighted) > unweighted AND > the permuted-weight control AND bar max DD(weighted) <= 0.85 x unweighted
  AND weighted Sharpe better in >= 5 of 8 folds?'
why_this_matters: Drop-gates lose power; sizing keeps every decision and only redistributes risk across regimes.
