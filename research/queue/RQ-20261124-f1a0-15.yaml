title: 'REGIME-PROGRAM R4, regime-conditioned SIZING: do vol-parity weights per decision (clip(train-median BTC vol24 / BTC vol24 at the bar,
  0.5, 2), mean 1) keep net R per 1R deployed (non-inferior) while raising bar Sharpe and cutting bar max DD, on the SL 4 / TP 6 / 24 h refit,
  vs unweighted and vs permuted weights?'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
programme: P2
kind: experiment
iteration:
