decision_rule:
  id: RULE-ML-ENTRY-FIX-ARMS-20261124
  registered_at: '2026-11-24'
  registered_before_run: true
  baseline: the registered recipe on the same folds, rows, tau and cost stack
  statistic: 'scripts/research/ml_entry_fix_arms.py --arm rsz_xwide (split_verdict / RSZ_RULE): weighted mean net R per 1R deployed with week-clustered
    influence se (wdiff); bar series = per-ts sum of weight x net R; Sharpe = mean / sd per bar; maxDD on the cumulative bar series.'
  rule: PASS iff n_bars >= 3000 AND delta(weighted - unweighted, net R per 1R deployed) - 2.0 se > -0.0068 AND bar Sharpe(weighted) > bar Sharpe(unweighted)
    AND > bar Sharpe of the permuted-weight control AND maxDD(weighted) <= 0.85 x maxDD(unweighted) AND weighted bar Sharpe > unweighted in >=
    5 of 8 folds. FAIL iff delta + 2.0 se < -0.0068 OR bar Sharpe(weighted) <= unweighted. INDETERMINATE otherwise. Fixed now.
  pass_action: A data-backed Tier-3 sizing proposal (regime-conditioned risk per ml_entry decision) to the manager with the measured Sharpe and
    drawdown change.
  fail_action: Record vol parity closed at this cap; the next R4 form sizes by the R2 strategy-performance regime once R2 exists.
  proposal_mapping: pass -> fresh-window confirmation (bars after 2025-10-01, holdout ledger claim, deflated bar) -> Tier-3 proposal to the manager
    with this evidence record; fail/indeterminate -> the next iteration authored from this diagnosis at once.
  what_it_does_not_do: Changes no served model, config, sizing or order path; reads no held-out window; is not a promotion; adds no gate.
  min_n: 3000
