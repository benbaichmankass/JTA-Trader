question: On trend_donchian_ada_4h over 2020-07-01..2026-10-15 23:59, does AX40 or AX50 (AX40 = --adx-max=40, AX50 = --adx-max=50) beat the declared
  leg (A) by >= 0.02 R x n(A), in >= 4 of 6 folds, with maxDD <= 1.35 x A, net of the harness cost stack?
