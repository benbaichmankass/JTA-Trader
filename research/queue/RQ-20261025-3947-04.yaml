id: RQ-20261025-3947-04
title: 'Path-state trail gate (ada_pullback_2h (bybit_2 + bybit_portfolio)): does a trail that tightens to 2.5 x ATR once peak_r >= 1.5 AND the path-state gate holds
  beat the declared ada_pullback_2h exit?'
status: queued
cadence: once
roadmap:
- L-ATM
- L-REGIME
- M20
theme: regime
priority: 2
kind: experiment
question: On ada_pullback_2h, does a trail that tightens to 2.5 x ATR once peak_r >= 1.5 AND a path-state gate holds (E25 = er < 0.25 over 6 bars; E35 = er < 0.35
  over 6 bars; C75 = chop > 0.75 over 6 bars; declared now) beat the declared exit A by >= 0.02 R/trade in >= 5 of 6 folds within the drawdown bar, AND beat the ungated
  control UT?
why_this_matters: 'First path-state test on ada_pullback_2h (ada_pullback_2h trades real money; the 8bbc-02 cause-naming read says BELOW_BACKTEST). The lever exists
  in the harness since PATHSTATE-TRAIL-GATE and has been run on other 4h and 2h legs; this leg has no path-state test. Hypothesis: give-back on this leg is a PATH
  condition (efficiency ratio low / chop high after a +1.5R run) that a regime-conditioned tightening can bank without paying the cost of tightening every trade (the
  UT control). Lane RESEARCH-AUTHOR-1025PM (research runnable floor: 43 runnable vs computed floor 65 at the 14:47Z research-ops pass 2026-10-25, record comms/research/ops/).
  Operator 2026-10-22: an idea that failed one test is not dead; it failed the first test.'
power:
  expected_n: 200
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d=0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo standing E35 floor). expected_n=200 is an ESTIMATE from sibling units on this leg/window, not
    a measurement; below 39 the unit grades indeterminate, never FAIL.
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ20261025394704-PATHSTATE
  registered_at: '2026-10-25'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg ada_pullback_2h --grade replace, window 2020-07-01 .. 2026-10-15 23:59, 6 equal calendar folds by entry
    time, net of the full cost stack the harness resolves per venue (execution_costs.resolve_cost_policy, recorded per arm as cost_stack). Arms fixed now: A = the
    leg as declared in config/strategies.yaml; candidates E25, E35, C75; ungated control UT (tighten every trade at peak_r >= 1.5). Per arm: n, net_total_r, max_drawdown_r,
    net R per fold.'
  rule: 'INDETERMINATE IF n(A) < 39 or IF every candidate arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C) > net_r(A) AND delta
    >= 0.02 R x n(A) AND net R(C) >= net R(A) in >= 5 of 6 folds AND maxDD(C) <= maxDD(A) x 1.35 AND net_r(C) > net_r(UT) in >= 5 of 6 folds (so a PASS cannot be
    "any early action"). PASS IF one or more pass: the best by net R is named and the follow-up is ONE confirmation unit on a disjoint partition (a PASS on one window
    is a discovery; the denominator is the number of arms in this unit), then a live-producer check and a Tier-3 declare PROPOSAL with the mirror in the same PR,
    never a config edit. FAIL IF none passes with n(A) >= 39: THIS arm grid is closed on ada_pullback_2h for this window and the family is NOT retired; the record
    names the arm that moved closest and the next variant (the other feature, a different window length, or a later peak_r arm). Thresholds and the arm grid are not
    changed after any result.'
  what_it_does_not_do: 'Edits no config and no roster, places no order, is not a promotion case. A PASS also needs a live producer for the lever (check the leg monitor)
    and a Tier-3 declare. The arm grid is the whole search: no arm is added after the run, and the baseline is the declared leg, not a tuned one.'
compute: cpu_light
value:
  usd_at_stake_per_month: 220
  confidence: 0.12
  bucket: own_losses
  basis: 'stand-in: a regime-conditioned exit lever on ada_pullback_2h (bybit_2 + bybit_portfolio); an estimate of the monthly net-R at stake if it passed, not a
    measurement.'
