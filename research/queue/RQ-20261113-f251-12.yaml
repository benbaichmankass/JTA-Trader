decision_rule:
  id: RULE-DFI2-TURTLE-SYMBOL-20261113
  registered_at: '2026-11-13'
  registered_before_run: true
  statistic: exit_lever_ablation --grade stage0, one run per arm per window (Binance, config-exact twin via --symbol); timeframe_lever_grade.py --family symbol_set
    --prefix arm_ --confirm-prefix pre_.
  rule: 'AM-ML multiple-testing guard (2026-11-13 18:50Z): successive levers on one window fork the paths, so this rule NAMES the leg''s prior lever attempts on the
    record window and ALSO requires the pass to hold on the equal-length window before the record window, which no diagnosis or lever pick read. No fold bar is relaxed
    from the leg''s first DEMO-FLOOR-ITER unit. Prior lever attempts on this window: RQ-20261101-78fc-12 (baseline, -81.81R), RQ-20261113-f251-04 (timeframe: 1h,
    4h -- FAIL). PASS iff the candidate passes its own Stage 0 on the record window (net_r > 0, n >= 30, >= 4/6 folds positive) AND beats the baseline arm''s net_r
    there, AND on the confirmation window 2022-10-05..2024-10-04 (the equal-length window BEFORE the record window, read by no diagnosis or lever pick) its net_r
    is > 0 and above the baseline arm''s. FAIL iff graded and either clause fails. INDETERMINATE otherwise (a run wrote no verdict, the baseline did not run, the
    candidate under its n floor on the record window). Arms, windows, folds and floors are fixed now.'
  what_it_does_not_do: Changes no config, roster, order or evidence record. A PASS is a data-backed Tier-3 proposal routed to the manager via AM-ML (the leg stays
    on the demo floor until then); a FAIL is recorded on the lever map and the next untested family is picked.
  baseline: turtle_soup config-exact on BTCUSDT (its live symbol) at 15m, re-run in this unit on both windows.
