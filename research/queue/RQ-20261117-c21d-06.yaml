question: Foxhound-4 (ml_entry_eq_struct) is a live real-money D3 model whose score mostly encodes cost per R. If the target is made cost-neutral
  (A1) or split into a direction head plus the known cost (A2), does the same recipe pick trades with higher realised net R at the same trade
  count?
why_this_matters: 'PASS -> the first new D3 lever for the equity book: a retrain of Foxhound-4 on that target goes to a confirm-window read, then
  a Tier-3 challenger proposal (the live model keeps trading until then). FAIL -> these two target configurations (A1, A2) close on this leg (the label family stays open)
  and the next lever tested is features (direction-bearing inputs), recorded in the lever map.'
