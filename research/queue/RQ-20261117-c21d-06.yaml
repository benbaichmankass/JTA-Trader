decision_rule:
  id: RULE-RQ20261117-c21d-06-COSTNEUTRAL
  registered_at: '2026-11-17'
  registered_before_run: true
  statistic: 'Dev walk-forward OOF (ml_entry_equity DEV_FOLDS to TRAIN_END, 5-seed pinned ensemble, config B features, structure exit pivot=5;sl_only)
    restricted-LONG decisions on the Foxhound-4 ETF pool. Baseline = the live net-R recipe taken at tau 0.25. Each arm is taken at the count-matched
    threshold (the same number of rows above threshold as the baseline). Per arm: mean realised net_long of the taken trades, se, folds with mean
    > 0, diff vs baseline and t = diff / sqrt(se_a^2 + se_b^2).'
  rule: INDETERMINATE IF the baseline n < 30. PASS IF A1 or A2 has n >= 30 AND mean net R >= baseline + 0.03 R AND t >= holdout_lock.bar_for(2).point_t_min
    AND mean net R > 0 in >= 3 of 5 folds. FAIL otherwise. Thresholds fixed now, never changed after any result.
  proposal_mapping: pass -> a confirm-window read of the winning target (fresh unit), then a Tier-3 challenger proposal for ml_entry_eq_struct;
    fail -> the A1 and A2 target configurations close on this leg (the labels family stays open); next lever tested = features. indeterminate -> baseline n starved,
    reported.
  what_it_does_not_do: Reads no confirm-window row (bars end at TRAIN_END), serves nothing, places no order, changes no config. Not a promotion
    case.
  min_n: 30 trades per arm
