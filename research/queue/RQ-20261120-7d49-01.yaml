title: 'BUILD: rebuild the donchian 1h exit-head training rows on the ALIGNED grid (post-#27566 harness emit + PR #27676 live-fill anchor) into
  datasets-out/exit_head/1h/donchian_aligned_fresh/rows.jsonl'
status: done
cadence: once
theme: ml_health
priority: 1
roadmap:
