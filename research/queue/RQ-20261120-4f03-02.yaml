  - --bar
  - '0'
  - --n-floor
  - '100'
  - --repro-tol
  - '0.005'
  - --out
  - '{out_dir}'
  inputs:
    research_unit: RQ-20261120-4f03-02
  timeout_minutes: 120
  workflow: research-script-run-trainer.yml
ml_consumer:
  consumer: src/units/strategies/ml_entry.py
  decision: 'evidence for the operator on keeping ml_entry on the real-money roster: its Stage-0 margin net of its own measured Bybit venue penalty (no change rides on this unit)'
  legs:
  - ml_entry
  book: money
lands:
