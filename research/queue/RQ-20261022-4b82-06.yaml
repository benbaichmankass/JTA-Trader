why_this_matters: 'Operator directive 2026-10-22: an idea that failed one test is not dead; it failed the first test. This unit is a registered
  VARIANT of that first test. First test: RQ-20261011-fc31-05 (trend BNB 4h, -0.0093 R n=191) graded FAIL, and RQ-20261010-419b-03 (long/short
  asymmetry on the prop trend legs) graded FAIL. DIAGNOSIS (one line): BNB 4h trend at defaults is within noise of zero (-0.0093 R, 34.6% win,
  n=191): the first test pooled both sides with no regime filter, and short breakouts in a drifting-up alt basket are the plausible drag; the
  side and ADX arms are the cheapest cut of that. Lane AUTHOR-FLOOR-1022 (research runnable floor 33 vs 65 at 17:40Z). Prior ids: RQ-20261011-fc31-05,
  RQ-20261010-419b-03. theme new_strategy_prop was short in the 17:40Z health check.'
