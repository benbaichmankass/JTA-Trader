  graded FAIL. Over 2020-06-01..2026-10-22 on 6 cells (BNBUSDT,LINKUSDT,DOGEUSDT,LTCUSDT,BCHUSDT,DOTUSDT) at 4h, does any candidate arm (LONG,
  LONGA, ADX) of the trend harness pass the pooled Stage-0 rule with breadth AND beat the baseline arm B by >= 0.05 R/trade pooled? The pre-registered
