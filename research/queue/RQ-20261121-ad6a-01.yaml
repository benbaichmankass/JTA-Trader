question: On QQQ 1h Dukascopy closed bars from 2022-12-01 to 2025-05-28 (disjoint from the ca49-02 discovery window that began 2025-05-29), does atr_stop_mult 3.0
  beat the configured 2.5 by >= 4.0 R net of cost, with maxDD no worse and >= 3 of 4 calendar folds, at control n >= 39? One arm vs control (denominator 1 of the
  2 variants ca49-02 chose from).
why_this_matters: ca49-02 PASSED on one window (stop30 +10.45 R, 3/4 folds) but the control itself was net -2.62 R there and the leg's per-trade expectancy is thin;
  a PASS read on one window is a discovery. This is the one confirmation before any Tier-3 stop-width proposal to the manager.
power:
  expected_n: 60
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'MEASURED: ca49-02 control n 57 over ~540 days (cadence ~0.105/day); a ~30-month pre-dev window projects n ~95 for the control (ESTIMATE); floor 39 per the
    E35 rule. If the Dukascopy feed does not reach 2022-12 the producer reports a short window and the unit is INDETERMINATE (not a verdict). Replays history; nothing
    accrues.'
  feasibility:
    source: none
    accrual_basis: Replays history on public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-TPL-ROSTER-WALKFORWARD-LEVER-SWEEP
  registered_at: '2026-11-21'
  registered_before_run: true
  statistic: 'exit_lever_ablation.py --grade sweep: per variant, delta net R vs the control A, delta maxDD and calendar folds (of 4) in which it beats A, net of the
    full cost stack; the control n, net R and fold signs are reported.'
  rule: PASS iff stop30 beats A by >= 4.0 R net of the full cost stack on the pre-dev window with maxDD no worse and >= 3 of 4 calendar folds at A's n >= 39 (thresholds
    identical to ca49-02, unchanged). FAIL iff A's n >= 39 and stop30 does not clear them (the discovery did not replicate; the stop-width lever stays open on other
    legs/windows, this configuration is closed). INDETERMINATE if A's n < 39 or the window is not covered by the feed. Per-year table and long/short split attached,
    not graded. A PASS goes to the manager as a Tier-3 stop-width proposal citing denominator 2 (ca49-02) and this confirmation; never applied here.
