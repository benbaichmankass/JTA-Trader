  needs_gpu: false
  peak_memory_gb: 10.0
  est_minutes: 60
  why_runner: Fetches keyless public Binance Vision archives (vision_streams.py); the Kaggle kernel has no internet. GBDT on CPU.
  basis: 'ESTIMATE from 26ac-01 (7 arms, dev 2020-07..2025-09 fetch, ~90 min): 3 arms (A, P25, N8) on an 18-month fetch with 12 small monthly refits each; ~40-60
    min.'
intervention_controls:
  hold_to_bracket: true
  hold_to_bracket_note: every arm holds the recipe's SL 2 / TP 3 ATR14 bracket and 24 h stop; only the model inputs differ
  matched_random:
    draws: 100
    note: 'declared, NOT computed (each draw is a full 8-fold refit): the control that matters is the matched-width seeded noise placebo (N4 / N8), which prices the
      recipe''s measured per-column overfit (fs01-01 N9 -0.0167 R)'
  best_static:
    grid:
    - recipe (20 features)
    - recipe + 4 noise columns (N4)
    - recipe + 8 noise columns (N8)
    excludes_test_folds: true
    note: every arm is refit per fold on rows before the fold minus the registered purge/embargo; tau is chosen leave-one-fold-out
  bootstrap_group: fold
ml_consumer:
