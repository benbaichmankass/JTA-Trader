# Hand-authored 2026-11-27 by lane ML-PRIMARY (Tier 1 research), approved by Manager Session 2026-11-27a (20:43Z: 'author the P25 re-read,
# one arm, k=1 bar, disjoint pre-dev windows, power stated'). Rule registered before any run. Gates this adds or changes: none.
id: RQ-20261127-c25a-01
title: 'ml_entry compact derivatives state P25 (F2c+F5c, 8 cols) RE-READ on a DISJOINT window: 2021 monthly folds (each trained only on earlier rows), single arm
  vs its matched 8-column placebo. Does the 26ac-01 lead (+0.0335, t 1.89 on the dev folds that chose it) hold out of window?'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: experiment
origin: follow_up
question: On the 12 monthly folds of 2021 (test rows 2021-01-01..2021-12-31, each fold's model trained only on rows from 2020-07-01 before it; no 2022-01..2025-09
  dev row and no sealed row is a test row or even downloaded), is P25 (the 20 baseline features + F2c + F5c) better than the same recipe with an 8-column seeded N(0,1)
  placebo by >= +0.010 R/decision, net of the full cost stack, with the one-sided t on the 12 per-fold deltas >= 2.2010 and >= 8 of 12 folds positive?
why_this_matters: '26ac-01 (dev folds 2022-01..2025-09) left exactly one lead: P25 +0.0335 vs its placebo, 6/8 folds, 4/4 years, but t 1.89 against a 3.12 bar, with
  one fold (2024-01) carrying much of the mean. That window chose P25, so it can never confirm it (OPERATING-PLAN § 2: a number measured only over the grading window
  never promotes). 2021 is in hand, disjoint and pre-dev; a PASS makes P25 the next ml_entry_retrain challenger candidate (via a data-backed Tier-3 packet), a FAIL
  closes compact derivatives state for crypto ENTRY.'
practice_precedent: M3 (one lever per arm against a same-shape control), M4 (rule registered before the run), M6 (net of the full cost stack), M13 (a post-hoc reading
  motivates a fresh registered test, never a promotion) and T1 (purged + embargoed walk-forward on dev folds only) in docs/reference/trading-and-model-practice-principles.md.
evidence_class:
  holdout: disjoint_window
  claim: ml_dev_fold_feature_value
power:
  expected_n: 12
  min_detectable_effect: 0.07
  effect_units: R_per_decision
  sd: 0.08
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATE, stated before the run: MDE at 80% power on 12 folds with a per-fold sd ~0.08 is ~+0.07 R/decision. per-fold deltas on the dev folds spread ~0.05 R (26ac-01 P25 fold sd 0.050); on 12 monthly folds with ~1/4 of a half-year
    fold''s decisions each, the per-fold sd is likely LARGER (~0.07-0.10), so se ~0.02-0.03. A true effect at the 26ac-01 point (+0.033) passes ~15-30% of the time;
    a true +0.010 passes < 5%. The most likely outcome for a real but small effect is INDETERMINATE. The 2021 folds also train on only 6-17 months of history, so
    the recipe is weaker there for BOTH arms (the placebo control absorbs that). Feasibility: perps listed after 2021 are simply absent; coverage < 40% grades INDETERMINATE.'
  feasibility:
    source: none
    accrual_basis: Replays public Binance Vision 2020-07..2021-12; nothing accrues.
run:
  command:
  - python3
  - scripts/research/ml_entry_v2_run.py
  - reread_p25_predev
  - '{unit}'
  - '{out_dir}'
  timeout_minutes: 300
  workflow: research-script-run.yml
  inputs:
    research_unit: RQ-20261127-c25a-01
decision_rule:
  id: RULE-RQ20261127-c25a-01-P25-PREDEV
  registered_at: '2026-11-27'
  registered_before_run: true
  baseline: 'N8: the same 20-feature recipe plus an 8-column seeded N(0,1) placebo (matched width), same folds, LOFO tau, cost stack.'
  statistic: 'ml_entry_v2.combine_predev: per-fold LOFO means of P25 and N8 over the 12 PREDEV_FOLDS; d_k = P25 - N8; pooled delta; fold mean, se, one-sided t; folds
    positive; window coverage.'
  rule: PASS iff pooled delta (P25 - N8) >= +0.010 R/decision AND the one-sided t on the 12 per-fold deltas >= 2.2010 (single arm, one-sided 0.025, df 11) AND delta
    > 0 in >= 8 of 12 folds AND the F2c/F5c families are present on >= 40 percent of the window's rows. FAIL iff mean(fold deltas) + 2.2010 x se < +0.010. INDETERMINATE
    otherwise, and whenever coverage < 40 percent or fewer than 12 folds carry both means. Thresholds are not changed after any result.
  pass_action: ONE confirming read on the sealed out-of-time window (2025-10-01 onward, holdout_lock claimed, deflated bar) in its own unit; only then a data-backed
    Tier-3 challenger packet for ml_entry_retrain.
  fail_action: 'compact derivatives state is closed for crypto ENTRY on research/levers/ml-entry.yaml (re-entry: a new label or a non-pooled population).'
  what_it_does_not_do: Changes no served model, config or order path; reads no dev or sealed row as a test row; a PASS is not a promotion; adds no gate.
  min_n: 12 folds with both arms measured; coverage >= 40 percent
compute: cpu_long
value:
  bucket: ai_trader
  usd_at_stake_per_month: 300
  confidence: 0.15
  basis: 'stand-in: ml_entry trades real money on bybit_2 + bybit_portfolio and is losing (c4e2-01); two independent placebo-relative near-misses (fs01-01 vs N9,
    c4e2-04 vs its placebo) point at this mechanism. Not a P&L measurement.'
