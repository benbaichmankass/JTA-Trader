id: RQ-20261026-bf56-01
title: 'Desk D-S0 harness self-check on the real-money 2h/4h legs: does the masked replay reproduce each leg''s recorded net R on HOLD, and does a scrambled-label arm score zero?'
status: queued
cadence: once
theme: live_strategy
priority: 1
roadmap:
- L-DESK
- L-ATM
kind: deterministic
question: >-
  Before any Claude judgement is scored: on the four real-money 2h/4h legs (xrp_pullback_2h, ada_pullback_2h, trend_donchian_eth_4h, trend_donchian_xrp_4h),
  (a) does the DESK-7B masked-replay driver's HOLD action reproduce every trade's recorded net_r in the leg's committed Stage-0 evidence trade list
  (comms/strategy_evidence/<leg>.json -> source_run) to within 1e-6 R, with the full cost stack resolved through execution_costs.resolve_cost_policy;
  (b) does a packet contain no symbol, date or absolute price (the mask holds); and (c) does a scrambled-label arm score ~0?
why_this_matters: >-
  A blind replay that cannot reproduce the leg's own recorded outcome on HOLD is measuring its own pricing error, not Claude. This unit is the
  instrument-before-finding gate (CLAUDE-RULES-CANONICAL.md "Always state the population": a new instrument produces no decision-grade number until it
  emits its own honesty metric). It is the prerequisite (requires_result) of RQ-20261026-bf56-02 (in-trade) and RQ-20261026-bf56-03 (exit), and the
  masked-replay construction and trade/candle set it validates are what DESK-18-GEN-REPLAY-S0 consumes (see that row's note). Design:
  docs/plans/claude-trading-desk-DESIGN.md section 8.1, checklist rows DESK-7-BLIND-REPLAY-S0 and DESK-7B-REPLAY-DRIVER.
why_not_inferential: >-
  A reproduction check: the HOLD arm either equals the committed evidence net_r on every row or it does not, and the mask either leaks a
  symbol/date/price or it does not. There is no sample whose size sets a detectable effect. The scrambled-label arm (c) is the only statistical
  clause, and it is graded against a fixed tolerance (|mean paired dR| <= 0.05 R and its 95% CI includes 0), not against an effect size.
decision_rule:
  id: RULE-RQ20261026-BF56-01-HARNESS-SELFCHECK
  registered_at: '2026-10-26'
  registered_before_run: true
  statistic: >-
    Over the four legs' committed trade lists (MEASURED 2026-10-26 from comms/strategy_evidence/*.json: n_trades_oos 55, 61, 208, 46 = 370 recorded trades):
    (a) max over trades of |replay_hold_net_r - recorded net_r|, and the count of trades not replayed; (b) a regex/field scan of every built packet for the real symbol
    string, any 4-digit-year timestamp, and any price within 0.5% of the real entry; (c) the scrambled-label arm: mean and 95% bootstrap CI of paired dR (action vs HOLD)
    after outcome ids are permuted within leg, using a fixed deterministic action policy (tighten-to-breakeven at +1R) so no LLM cost is incurred.
  rule: >-
    PASS IF (a) max |dR| <= 1e-6 AND replayed = 370 of 370 AND (b) zero leaks in every packet AND (c) |mean scrambled dR| <= 0.05 R with the CI including 0.
    FAIL IF any of (a), (b), (c) is violated with every trade replayed; the record names the violated clause and the leg, and DESK-7B-REPLAY-DRIVER reopens.
    INDETERMINATE (not a verdict) IF fewer than 370 trades are replayable because candles for a leg's window could not be fetched: the missing leg and window are
    named, and RQ-20261026-bf56-02/-03 stay blocked. The 1e-6, 0.05 and 370 are not changed after any result.
  what_it_does_not_do: >-
    Says nothing about Claude's judgement, the legs' edge, or any roster/config. A PASS only unlocks bf56-02 and bf56-03 and certifies the construction for DESK-18.
masked_replay:
  population: >-
    MEASURED 2026-10-26 by parsing config/accounts.yaml at main 38f8bcf8 (accounts with mode: live, non-prop legs; bybit_2 and its exact mirror bybit_portfolio carry the same
    legs): xrp_pullback_2h, ada_pullback_2h, trend_donchian_eth_4h, trend_donchian_xrp_4h. The 1h prop legs and iaum_pullback_1d are out of scope. Re-parse before running.
  construction: >-
    Packets are built by the driver from the committed trade list and re-fetched candles using desk_scan_packet.py --as-of masking: symbols become aliases, prices are rebased to
    100 at the decision bar and expressed in entry-ATR14 units, timestamps are anchored at 2000-01-01T00:00Z, volume and calendar are withheld, every bar at or after the decision
    bar's close is dropped. The unmask key is written only to a separate file the judging session never reads.
compute: cpu_light
value:
  usd_at_stake_per_month: 200
  confidence: 0.2
  bucket: own_losses
  basis: 'stand-in: gates the desk''s D-S0 on the four legs carrying real-money bybit_2 risk; an estimate, not a measurement.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 5
  basis: 'MEASURED 2026-10-26 in the DESK-7B lane: one full selfcheck with --fetch (four Binance Vision candle pulls, 370 trades, 176 packets) took 2 min 22 s wall on a session container; 5 is that rounded up for runner variance.'
run:
  workflow: research-script-run.yml
  command: [python3, scripts/research/desk_replay_driver.py, selfcheck, --out, '{out_dir}', --fetch]
  timeout_minutes: 30
  inputs:
    research_unit: RQ-20261026-bf56-01
  note: >-
    The driver is scripts/research/desk_replay_driver.py (DESK-7B-REPLAY-DRIVER). It writes {out_dir}/verdict.json with the three registered clauses decided exactly as registered.
    --fetch tops the four candle series up from Binance Vision (the committed copies end 2026-10-15, before the last ADA trade exits).
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
related:
- RQ-20261026-bf56-02
- RQ-20261026-bf56-03
- scripts/ops/desk_scan_packet.py
- scripts/research/live_review_outcomes.py
- docs/plans/claude-trading-desk-DESIGN.md
last_dispatched_at: null
