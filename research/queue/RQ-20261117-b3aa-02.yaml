question: 'turtle_soup: does a longer liquidity-sweep lookback (sweep_lookback_15m 120 or 180 vs the configured 60) improve net R over the same 1830-day BTCUSDT 15m window as d5a7-08, versus the config-exact
  control, in >= 3 of 4 folds, net of the full cost stack?'
why_this_matters: 'ITERATION (research-ops 2026-11-17 1006Z). DIAGNOSIS from the rows of RQ-20261116-d5a7-08 (FAIL): sweep_lookback 40 -> -104.84 R vs A (1/4 folds), 90 -> +15.81 R (2/4 folds, maxDD -15.7
  R), i.e. a MONOTONE response in the lookback (40 < 60 < 90) that the 3-arm grid stopped short of. The control has no gross edge (fee-only -118.2 R on 708 trades), so the entry family is where an absolute
  edge must come from: a longer lookback means sweeps of more significant (older, more widely watched) levels, the turtle-soup mechanism (stop-runs above obvious highs/lows get faded). Fewer, higher-quality
  trades also cut the cost drag (cost share: net -175 R vs fee-only -118 R). On PASS: a holdout confirmation on pre-dev history (b3aa-01''s window) before any Tier-3 note; on FAIL with 120 and 180 both
  <= 90''s response the entry lookback response is peaked/flat and the next entry lever is min_body_to_range (untested). Arm denominator 3 incl. control; cumulative arms on this lever 5 (40, 90 in d5a7-08).'
