id: RQ-20261120-4c1e-01
title: 'DIRECTION lever family on trend_donchian_xrp_4h (production leg, declared short-only): does either BOTH sides or LONG-only beat the declared short-only leg A over the full XRP perp history 2020-02-01..2026-10-12, net of the harness cost stack?'
status: queued
cadence: once
theme: live_strategy
priority: 2
kind: experiment
question: 'On trend_donchian_xrp_4h over 2020-02-01 .. 2026-10-12 23:59 (the whole XRPUSDT perpetual history the harness can fetch; the committed record covers its last 4 years and RQ-20261016-c56e-13 read the first part INDETERMINATE at n 29 < 39 for the short-only leg), do the arms BOTH (side_filter=both) or LONG (side_filter=long) beat the declared leg A (side_filter=short) by the registered bar, net of the harness cost stack?'
why_this_matters: 'Node P3-L-xrp4h-prewindow-underpowered: c56e-13 could not read the leg before its record window (n 29 < 39 for the short-only, min_confidence 0.8 leg) and asks whether a both-sides arm is worth a separate Stage-0 question. The leg trades real money and its lever map has no direction-family test, so the choice of side is un-audited. Registered asymmetry, stated up front: window 2022-10-13..2026-10-12 is the committed record the short-only choice was selected on, so it favours A; a FAIL (A holds) is therefore weak evidence, while a PASS for BOTH or LONG over A on a span that includes A''s own selection window would be strong. VENUE (manager method decision 2026-11-20 03:55Z, ML-14 venue-gap: Binance-fed evidence sits about 0.019 R per trade above Bybit for legs traded on Bybit, systematic, 16 of 21 legs, CI excludes 0): trend_donchian_xrp_4h trades on bybit_2, so its primary corpus should be the trainer''s Bybit linear files, but those start 2022-12-03 and this window starts 2020-02-01. Choice made here: BINANCE is the primary corpus on the full window, because the Bybit-only window (2023-02-01..2026-10-12, about 3.7 y) would put n(A) at about 40 against the 39 floor (record n 46 over 4 y), i.e. INDETERMINATE about as often as not. The penalty is stated and registered, not ignored: it does not cancel between arms with different trade counts (it scales with n), so the PASS clause below is penalty-adjusted. The Bybit-native corpus is the CONFIRMATION corpus (pass_action). Decision changed: PASS -> ONE confirmation unit on the Bybit-native corpus (a Tier-3 proposal is NOT drafted from this alone: real-money leg, overlap with the selection window, Binance-fed); FAIL -> the direction family is tested at this window on trend_donchian_xrp_4h (family not retired) and the node''s question is answered: the short-only restriction survives a both-sides and a long-only challenger.'
power:
  expected_n: 75
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'n(A) is an ESTIMATE, not a measurement: the committed record has n 46 over 1460 d and c56e-13 measured n 29 on 2018-10..2022-10 (XRP perp data starts 2020), so about 70-80 over the full history. d 0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo standing E35 floor). Below 39 for A the unit grades INDETERMINATE, never FAIL. The 0.02 R x n bar is a materiality bar, not a powered effect: a PASS is a discovery lead and a FAIL closes the configuration only.'
  feasibility:
    source: none
    accrual_basis: Re-measurement on a pinned in-hand window of public Binance perpetual candles; nothing accrues.
