  holdout: in_sample
  claim: edge
decision_rule:
  id: RULE-RQ20261120-4C1E-01-XRP4H-DIRECTION
  registered_at: '2026-11-20'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg trend_donchian_xrp_4h --grade replace on the pinned window 2020-02-01 .. 2026-10-12 23:59, 6 calendar folds by entry time, net of the full cost stack the harness resolves per venue (execution_costs.resolve_cost_policy, recorded per arm as cost_stack). Arms fixed now: A = the leg as declared (side_filter short); candidates BOTH (side_filter=both) and LONG (side_filter=long), one factor each. Per arm: n, net_total_r, max_drawdown_r, net R per fold. No window or trade of this leg beyond the committed records named above was read before this rule was written.'
  rule: 'INDETERMINATE IF n(A) < 39 OR IF every candidate arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C) > net_r(A) AND delta >= 0.02 R x n(A) AND net R(C) >= net R(A) in >= 4 of 6 folds AND maxDD(C) <= maxDD(A) x 1.35 AND, for the Binance-to-Bybit venue gap, delta - 0.019 R x (n(C) - n(A)) >= 0.02 R x n(A) (the gap is per trade, so an arm with more trades is credited more by a Binance corpus; this clause is read by hand from the arms'' raw trades, as the harness grade cannot apply it). PASS IF one or more pass: the best by net R is named (the denominator is the 2 candidate arms) and the follow-up is ONE confirmation unit on the trainer''s Bybit-native corpus (scripts/research/bybit_native_csv.py, window 2023-02-01..2026-10-12, trainer route), never a config edit. FAIL IF none passes with n(A) >= 39: THIS arm grid is closed on trend_donchian_xrp_4h for this window and the lever FAMILY is NOT retired (scripts/research/family_retirement_policy.yaml); the record names the arm that moved closest. Thresholds and the arm grid are not changed after any result.'
  what_it_does_not_do: 'Edits no config and no roster, places no order, is not a promotion case, and does not touch the real-money leg. The arm grid is the whole search: no arm is added after the run, and the baseline is the declared leg, not a tuned one. Candles are Binance USD-M (a PROXY for Bybit linear; the measured Binance-over-Bybit gap is about 0.019 R per trade, handled by the penalty-adjusted PASS clause) and the funding term is a directionless magnitude (execution_costs P1).'
practice_precedent: 'M4, M5 (docs/reference/trading-and-model-practice-principles.md): pre-registered arm grid, every arm counted, baseline = the declared leg; the same replace-grade thresholds as the registered session confirmations (RQ-20261119-8260-01..04)'
