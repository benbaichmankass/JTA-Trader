  bucket: ai_trader
  usd_at_stake_per_month: 200
  confidence: 0.1
  basis: 'ESTIMATE: ml_entry real-money closes 11-16..11-24 summed -5.8 R over 26 trades (docs/research/ml-entry-review-2026-11-24.md); this reads one candidate cause.'
