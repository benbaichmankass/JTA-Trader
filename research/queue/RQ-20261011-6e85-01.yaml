id: RQ-20261011-6e85-01
title: Is the SOL/BTC advisory regime heads' live score drift input-mix shift or model decay?
status: queued
cadence: once
theme: ml_health
priority: 2
kind: deterministic

question: >-
  sol-regime-15m-lgbm-fc-pcv-v2 (ADVISORY, order-influencing) reads drift
  `significant` (KS 0.230, PSI 0.200) between the 2026-09-04..10-04 reference
  window and the last 7 days; btc-regime-15m-lgbm-fc-pcv-v2 reads `moderate`
  (KS 0.123). Between those windows, did the volatile share of the realised
  labels (and the feature mean of the vol features) move enough to explain the
  score shift, or does the head's AUC against realised labels fall inside the
  same windows?

why_this_matters: >-
  MEASURED GET /api/bot/shadow/drift?model_id=... read 2026-10-11 (reference n
  3207, current n 750 for SOL; mean score 0.811 -> 0.877). `ml stage-guard`
  proposes demote on drift `significant` for an advisory head, and the
  drift-remediation skill says to separate transient/regime-mix drift
  (self-corrects, no action) from capability failure (needs a refinement) BEFORE
  demoting. Nothing in the repo computes that split, so each review re-argues it.

why_not_inferential: >-
  Recomputes stated statistics over a fixed, complete set of already-labelled
  shadow rows; no sample is drawn.

decision_rule:
  id: RULE-RQ1011-6E85-DRIFT-SPLIT
  registered_at: '2026-10-11'
  registered_before_run: true
  statistic: >-
    per head and window: volatile_label_share, AUC of the served score vs the
    realised regime label; delta_share = share_cur - share_ref;
    delta_auc = auc_cur - auc_ref.
  rule: >-
    IF abs(delta_share) >= 0.05 AND delta_auc >= -0.03 THEN verdict
    `regime_mix` (drift is the input mix; no refinement, no demote, re-check in
    7d). IF delta_auc < -0.03 THEN verdict `capability_loss` and a `[refinement]`
    pipeline row is opened under drift-remediation step 3. IF either window has
    < 200 labelled rows THEN verdict `underpowered`, nothing is concluded and the
    unit re-queues after 7 more days of accrual. Otherwise `no_explanation`
    (shift present, mix and AUC both flat) and the head stays HOLD with the
    number recorded.
  what_it_does_not_do: >-
    Does not demote, promote or retrain anything; every outcome that touches a
    stage is a Tier-3 proposal in the next /ml-review.

compute: needs_vm_data
routing:
  needs_trainer_resident_data: true
  needs_gpu: false
  peak_memory_gb: 1.0
  est_minutes: 10
  basis: >-
    Reads the shadow log (active + gz archives) joined to realised labels; the
    shadow log lives on the live/trainer mirrors, not on a runner.

run:
  command:
  - python3
  - scripts/research/drift_regime_mix.py
  - --mode
  - split
  - --head
  - sol-regime-15m-lgbm-fc-pcv-v2=SOLUSDT/15m
  - --head
  - btc-regime-15m-lgbm-fc-pcv-v2=BTCUSDT/15m
  - --as-of
  - '2026-10-11T09:45:00Z'
  - --out
  - '{out_dir}'
  timeout_minutes: 30
  inputs:
    research_unit: RQ-20261011-6e85-01

lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
last_dispatched_at: '2026-10-25T09:30:47+00:00'
