id: RQ-20261023-be01-02
title: 'HOLDOUT RE-RUN, soak book: does tqqq_trend_long_1d''s configuration, SELECTED on the earliest ~75% of its history, hold up net of the
  full cost stack when tested ONCE on the held-back latest ~25%?'
cadence: once
roadmap:
- L-LADDER
theme: live_strategy
priority: 1
kind: experiment
question: tqqq_trend_long_1d cleared Stage 0 at power (RQ-20261016-c56e) and its mechanical soak passed, so MD-PROMOTE-S1-S2 -> alpaca_live now
  stops at R-HOLDOUT (no holdout_confirmation in comms/strategy_evidence/tqqq_trend_long_1d.json). Select among the pre-registered configurations
  (declared + 4 neighbours) on the earliest span only, then read the ONE selected configuration once on the latest span. NOTE the c56e window
  (to 2025-04-09) was read for the pass/fail grade, not for selection; selection is re-made here on discovery alone.
why_this_matters: 'PROMO-EVIDENCE-REFRESH (manager 2026-10-23): the resolver''s data task for R-HOLDOUT on tqqq_trend_long_1d says to author this
  unit. Operator decision 2026-10-16 (PROMOTION-BAR-MULTIPLICITY): promotion needs a pass on the held-back 25%. Without it the leg cannot clear
  MD-PROMOTE-S1-S2.'
power:
  expected_n: 12
  min_detectable_effect: 0.57
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'expected_n is an ESTIMATE of the held-back trade count (committed Stage-0 record: ~100+ trades over the long window x the ~25-40% held-back
    share). Floor 25 (the dispatch); at n=25 a one-sample test detects d=0.57 sd. A thin run grades indeterminate/underpowered -> NEEDS-DATA,
    never pass or fail. Said before the run.'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ-20261023-be01-02
  statistic: 'scripts/research/exit_lever_ablation.py --grade holdout on tqqq_trend_long_1d, window 2010-06-01 .. 2026-10-22 23:59, every arm
    ONE continuous harness pass (argv via regime_debt_matrix.build_harness_cmd, the evidence builder''s own), net of the full cost stack the harness
    resolves for Alpaca equities (fee + the operator-reaffirmed provisional 5.0 bps slippage); per-trade net_r from the harness''s --emit-trades.
    Arms: A = the leg as declared; C1: atr_stop_mult=2.0; C2: atr_stop_mult=3.0; C3: donchian=20; C4: donchian=40. BOUNDARY, fixed before any
    outcome is read: the latest 25% of the calendar window, grown in 1% steps until it holds 25 of arm A''s ENTRIES (entry times only), capped
    at 40%. DISCOVERY = trades whose entry AND exit precede the boundary (straddlers are in neither span); 4 equal calendar folds of the discovery
    span. HOLDOUT = the selected arm''s trades entered on/after the boundary.'
  rule: 'SELECTION (discovery only): an arm is eligible iff discovery n >= 25 AND discovery net R > 0 AND >= 3 of 4 discovery folds net-positive;
    the eligible arm with the highest discovery net R is selected (a tie goes to A). HOLDOUT (read once): INDETERMINATE/insufficient_discovery
    IF every arm holds < 25 discovery trades; FAIL/no_discovery IF no arm is eligible otherwise; INDETERMINATE/underpowered IF the selected arm
    holds < 25 held-back trades; PASS/confirmed IF held-back net R > 0; FAIL/not_replicated otherwise (closes that configuration, never the family).
    ON PASS with A selected: write the verdict''s holdout_confirmation block (source_run -> the committed verdict.json) into comms/strategy_evidence/tqqq_trend_long_1d.json.
    ON PASS with another arm selected: the declared configuration is unconfirmed -- the result is the evidence for a Tier-3 config proposal, never
    an edit here. ON FAIL: a note on PROMOTION-BAR-MULTIPLICITY for the manager; the leg is NOT demoted on it (live net-of-cost governs demotion).
    Thresholds are not changed after any result.'
  what_it_does_not_do: 'Edits no config, roster or record and places no order. The declared configuration may itself have been chosen on data
    that overlaps the held-back span (param_selection_provenance: not_established), which is why the selection is re-made here on the discovery
    span alone; a confirmation is only as clean as that re-selection. Does not deflate: one configuration is tested once.'
  registered_before_run: true
  registered_at: '2026-10-23'
compute: cpu_light
value:
  bucket: own_losses
  usd_at_stake_per_month: 300
  confidence: 0.35
  basis: 'stand-in: a soak-book leg that would reach alpaca_live + alpaca_portfolio; not a P&L measurement.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 40
  why_runner: Fetches keyless public candles (Binance Vision / dukascopy) for a pinned window; Kaggle CPU runs with the internet off and metis-market-data
    carries no 2h/4h/1d candles for these legs; reads no trainer data.
  basis: 'Runner. One exit_lever_ablation.py invocation: one candle fetch + 9 harness passes. MEASURED 2026-10-16 (RQ-20261016-008 power.basis):
    2 arms on xrp_pullback_2h over 2020-07..2026-10 took 74 s incl. the fetch; 9 arms carry headroom.'
