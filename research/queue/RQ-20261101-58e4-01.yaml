decision_rule:
  id: RULE-RQ20261101-58E4-01-TSMOM-DISCOVERY
  registered_at: '2026-11-01'
  registered_before_run: true
  statistic: portfolio net Sharpe, stress Sharpe, half-period Sharpes, stationary-bootstrap p05 of annualised mean, DSR(N=configs run) from scripts/research/edge_portfolio_discovery.py
  rule: 'Configs T1..T10 fixed in the script (T10 = primary signal on liquid ETFs, run only if daily ETF data is supplied; otherwise N=9 and the gap is stated). PRIMARY
    = T4 (lookbacks 28/56/112 d, sleeve vol 0.40, long-short). PASS iff T4 net Sharpe >= 0.5 AND stress(2x cost) net Sharpe > 0 AND net Sharpe > 0 in BOTH halves
    of the window AND bootstrap 5th-percentile of annualised mean net return > 0 AND DSR(T4; N = configs run) > 0.95. FAIL otherwise. indeterminate IF fewer than
    200 usable days or funding/price coverage cannot be established. Costs (registered): fee round trip = execution_costs.resolve_fee_bps_roundtrip (11.0 bps) charged
    per side (RT/2 per unit |delta w|), slippage 3 bps RT, SIGNED settled funding, STRESS arm = 2x fee+slippage. Returns are daily fractional portfolio returns, not
    R. Universe = point-in-time top-N by trailing-90d mean quote volume (ex stables), recomputed each weekly rebalance; Binance USD-M archive as proxy for the Bybit
    perps. A producer_failed or no_data record is NOT a verdict.'
  what_it_does_not_do: Does not read the holdout (2024-07-01 on; edge_data.MAX_MONTH makes it unloadable), touch config/strategies.yaml, rosters or sizing, or propose
