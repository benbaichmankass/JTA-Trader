power:
  expected_n: 2400
  min_detectable_effect: 0.041
  effect_units: r_multiple
  sd: 0.7
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'sd 0.70 R carried from the measured neg25 paired sd (a10d-07 0.597, a10d-08 0.717); a feature arm differs from the champion on the same
    trades, so the same order is assumed (ESTIMATE). n MEASURED on 7d49-02: pooled n_oos 2,403. At n 2,400, sd 0.70: SE 0.0143. At n 2,400, sd
    0.70, alpha 0.05 two-sided, power 0.80: MDE = (1.960 + 0.842) x 0.70 / sqrt(2400) = 0.0400 R, declared as 0.041 (rounded up; grader floor
    2,288 <= 2,400). Corrected 2026-11-20 ~23:35Z (manager): the first draft declared 0.04, whose floor 2,403.7 exceeded expected_n by 3.7; the
    decision rule and thresholds are unchanged.'
  feasibility:
    source: replay
    verdict: comms/research/RQ-20261120-7d49-02/44718948379/verdict.json
    basis: Same harness, same fixed test corpus as the pointed run (its measured n); a re-read of an in-hand corpus, nothing accrues.
baseline:
  definition: The holding_pays champion (the shipped recipe, train_exit_head.FEATURES, unchanged hyper-parameters) retrained on the SAME fold
    training rows and replayed on the SAME OOS trades with the live predicate; each trade net of fee + slippage + funding. Hold (no head) is reported
    as context.
  net_of_cost: true
decision_rule:
  id: RULE-RQ20261120-f1a9-04-EXITHEAD-FEATURES
  registered_at: '2026-11-20'
  registered_before_run: true
  baseline: the holding_pays champion on identical folds and trades
  statistic: 'scripts/research/exit_head_label_bakeoff.py --arms '''' --feature-arms feat_exh --num-folds 3 --z 1.96 --pass-dr 0.03 on the aligned
    rows: pooled over the 8 legs and 3 folds, per OOS trade d = replayed_r(arm) - replayed_r(champion) on identical trades, replay and cost; mean,
    SE (one trade = one cluster), one arm graded, CI at z 1.96. Reported: per-leg read_state and n_oos, candle_source.resampled_to, fired counts,
    hold context, measurement.arm_features and target_coverage per arm.'
  rule: Graded by hand from verdict.json. An arm is could_not_look (INDETERMINATE for that arm) if its target_coverage < 0.90 or it trained in
    no fold. PASS iff some arm has pooled n_oos >= 1500 AND mean d >= +0.03 R/trade AND CI lower bound > 0 AND the unseen-symbol legs (LINK/BNB/XRP/ADA/AVAX)
    pooled have mean d > 0 for that arm (the best such arm by mean is named; denominator 1). FAIL iff every arm has pooled n_oos >= 1500 AND CI
    upper bound < +0.03. INDETERMINATE otherwise. A leg that is producer_failed or unestablishable lowers n only; a leg whose candle_source.resampled_to
    is not 1h is excluded and named. Thresholds, legs, arms, folds, embargo, lookback, rows path and shape are not changed after any result.
  pass_action: 'ONE confirmation before any proposal: the passing arm on the 10-perp held-out-symbol design (aadc-12 pattern) or a disjoint window;
    only then a data-backed Tier-3 proposal (export + annotate-only pin) to the manager.'
  fail_action: 'Record the arm(s) as tested on research/levers/ml-exit-head-donchian-1h.yaml (features family). If f1a9-04 and -05 both FAIL,
    the head has no in-hand feature or label lever at +0.03 R on donchian 1h: the next step is a family review (per-symbol heads need a harness
    build), never a re-run of these configurations.'
  what_it_does_not_do: Edits no config, exports or serves nothing, places no order, adds no gate. No close authority for any exit model.
practice_precedent: 'Size the test to the decision: a pre-registered minimum effect with power computed from the measured variance, rather than
  a bar the data cannot reach (docs/reference/trading-and-model-practice-principles.md).'
intervention_controls:
