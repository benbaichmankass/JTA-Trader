question: 'On datasets-out/exit_head/1h/donchian_aligned_fresh/rows.jsonl (7d49-01), with the same 8 trend_donchian 1h legs (BTC, ETH, SOL trained;
  LINK, BNB, XRP, ADA, AVAX unseen-symbol), 3 sequential walk-forward folds, 7-day embargo, lookback 500, champion target holding_pays: is the
  pooled paired per-trade replayed R of the arm feat_exh (train_exit_head.FEATURES + FEATURES_EXH, 21 columns) vs the shipped-feature champion
  >= +0.03 R with the CI lower bound > 0?'
why_this_matters: The exit head is the only learned close-path model on the demo-floor donchian 1h legs (annotate-only). The label lever is closed
  (7d49-02). If no feature list moves it by a decision-sized amount either, the head has no in-hand lever left at 1h and trainer time leaves this
  subject; a PASS is the first exit-head improvement that is not a label artefact.
