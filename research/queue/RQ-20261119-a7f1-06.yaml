    accrual_basis: 'Fixed historical backfill over the trainer''s USO 1h candles (to 2026-06-18, ~8 years, verified
      trainer-diag #18392); nothing accrues.'
decision_rule:
  id: RULE-RQ-20261016-e2db-02
  registered_at: '2026-10-16'
  registered_before_run: true
  statistic: 'Per seed 1-5: prop_ev_sim path-mode ev_net_usd_per_life and p_net_positive over the leg''s trade ledger
    (n = ledger rows), as graded by scripts/research/prop_ev_grid.py --grade pass_all_seeds.'
  rule: 'PASS IF n_trades >= 88 AND ev_net_usd_per_life > 0 on ALL 5 seeds AND p_net_positive >= 0.70 on ALL 5 seeds
    (prop_ev_sim path mode, config/prop_rulesets/tradeify_247_1step.yaml, flat 0.5% risk, --lev-cap uso_squeeze_1h=5,
    --no-hedge, prorated swap, funded-start fresh). FAIL IF ev_net_usd_per_life <= 0 on ANY seed. INDETERMINATE
    (UNDERPOWERED) IF n_trades < 88; INDETERMINATE (NULL) IF ev > 0 on all seeds but p_net_positive < 0.70 on any
    seed. The harness''s own Stage-0 number (net_total_r at the same costs) is written to harness.json and reported,
    not graded separately: a leg with no net edge cannot show ev > 0 on all 5 seeds. Tradeify cost stack: commission
    0.04%/side = 8 bps round trip and swap 0.033%/day, both FIRM-DECLARED and UNCONFIRMED (config/prop_rulesets/tradeify_247_1step.yaml,
    accepted as declared by the manager 2026-10-15 21:20Z, checklist TRADEIFY-INSTR-SPECS); slippage 3 bps round
    trip DECLARED, which is >= the MEASURED one-snapshot spread for every instrument here (bps of mid, run 38807791311:
    SILVER 1.74, XYZ100 1.00, SP500 0.13, USOIL 1.04), so the measured spread is inside the slippage term, not added
    on top of it. Leverage: 5:1 (marginRate 0.2 MEASURED by REST probe run 38808598907 for SILVER and USOIL, 5:1
    INFERRED from it; the firm''s rule page names 2:1 for indices/stocks and does not name metals/oil). RQ-20261015-ca42-01
    asks whether the cap binds for the existing legs; this unit uses the measured reading. OPERATOR RULE (2026-10-15,
    binding on every prop leg): a prop leg clears a SUPERSET of the real-money ladder: Stage 0 net of the full cost
    stack, THEN a mechanical soak (1-2 clean live prop trades count), THEN cost fidelity, PLUS prop DD survival
    under the account''s rules. This unit supplies Stage 0 and the prop-survival simulation only. A PASS authorizes
    NO roster edit, NO account opening and NO order.'
  what_it_does_not_do: 'Does not tune: harness defaults only, so there is nothing to select among. Does not touch
    config/strategies.yaml, config/accounts.yaml or config/prop_platforms.yaml, places no order, and does not claim
    the synthetic perp''s own price path: candles are the USO ETF series (regular + extended hours only), not the
    Hyperliquid-fed 24x7 instrument, so overnight/weekend gaps the perp would trade through are absent here.'
