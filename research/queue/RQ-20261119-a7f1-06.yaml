  alpha: 0.05
  power: 0.8
  basis: 'd=0.3 needs ~87-90 observations at alpha 0.05 / power 0.8 (the repo''s prop-fit floor, RQ-20260928-011/-012/-013,
    the same floor as RQ-20261015-24ca-01..05). expected_n=110 is a GUESS, not a measurement: backtest_squeeze has
