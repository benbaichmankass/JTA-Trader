question: 'Per leg, replayed config-exact on the fresh window (2026-07-14 to the latest bar): does the incumbent min_confidence 0.70 have net_total_r
  >= and max_drawdown_r <= the 0.60 arm (keep), or does 0.60 beat it on both (revert)?'
