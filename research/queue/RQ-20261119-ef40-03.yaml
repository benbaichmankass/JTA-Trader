    has net_total_r >= the 0.60 arm AND max_drawdown_r no greater. Unit verdict: FAIL if any leg FAILs, PASS if all PASS, else INDETERMINATE.
    Legs, split, delta (-0.10) and floors are not changed after any result.'
  pass_action: 'Keep 0.70 on both legs; fix the stale strategies.yaml:205 comment and add the missing strategy_changelog entry citing PR #6322
    and this record (Tier 1 doc change).'
  fail_action: For each FAILing leg, a data-backed Tier-3 change min_confidence 0.70 -> 0.60 under the standing rule (operator 2026-11-18), with
    this record, the revert (back to 0.70) and a report to the manager for the daily email. A PASSing or INDETERMINATE leg is unchanged.
  min_n: 15 trades per arm per leg on the fresh window
  what_it_does_not_do: Edits no config; places no order; adds no gate. Not a full-history re-sweep (RQ-20261106-017 owns that); a single short
