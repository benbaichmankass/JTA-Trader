  registered_at: '2026-11-18'
  registered_before_run: true
  rerun_of: RQ-20261118-04a5-01
  rerun_note: 'Re-run of RQ-20261118-04a5-01''s registered rule, unchanged (rule id kept so the reads compare). Its run 44383743409 read data
    ending before the 2026-07-14 split (BTC 2026-07-10, AVAX 2026-06-18) and reported a measured n=0; trainer-vm-diag #27319 shows both files
    now end 2026-11-19.'
  baseline: each leg at its configured min_confidence 0.70
  statistic: 'scripts/research/donchian_depth_retest.py: per leg on the fresh window (--split 2026-07-14 onward), total_trades, net_total_r and
    max_drawdown_r for the incumbent and for incumbent - 0.10. The pre-split IS window and the six yearly folds are reported as context and decide
    nothing.'
  rule: 'Per leg: INDETERMINATE if either arm has < 15 trades, or the arms differ by < 3 trades, or a harness error, or one arm wins net R while
