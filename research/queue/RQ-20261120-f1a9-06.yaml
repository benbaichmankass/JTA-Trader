id: RQ-20261120-f1a9-06
title: 'ml-tm-action-value ITERATION 10 (learner FAMILY: fitted-Q iteration): on the incumbent bench, does an optimal-STOPPING fitted-Q policy
  (close-vs-hold, Q_hold backed up from the next state''s max(Q_close, Q_hold)) pass S-OFFLINE where every Monte-Carlo action-value head failed?'
status: done
cadence: once
theme: ml_health
priority: 2
roadmap:
- L-ML-LIVE
programme: P2
kind: experiment
practice_precedent: 'M-series model-evaluation practice (docs/reference/trading-and-model-practice-principles.md): change one factor against the
  incumbent on the incumbent''s harness, folds and cost stack; a learner-class step is tried only after the label and feature levers it competes
  with were tested.'
question: 'Same bench as RQ-20261120-f1a9-02 (test corpus tmb-73f5c3660014, train corpus v2 bp2-f4271084b120 x4 sample, seed 11, path_state block,
  every-bar check-ins, actions {close}, --label full, act margin chosen on 3 inner folds from the registered grid, 6 folds, 2000 bootstrap, 200
  random draws). ONE FACTOR CHANGED vs f1a9-02: the learner is fqi_stop_value: Q_close = LightGBM regression of the realised close advantage;
  Q_hold re-fitted FQI_ITERS = 5 times to max(Q_close(s+1), Q_hold(s+1)) (0 at the last state = B0); the policy closes at the first check-in where
  Q_close - Q_hold beats the act margin. Does the fqi arm pass S-OFFLINE?'
why_this_matters: 'Every learned management arm on this bench is a Monte-Carlo per-state action-value head, and all failed S-OFFLINE (iterations
  1-9: horizon, feature block, quantile target, CatBoost learner, and the f1a9-01/02/03 action-set and label levers). Those heads value HOLD as
  ''follow B0 to the end''; a stopping policy that can close later is never credited, which biases the close/hold comparison toward the wrong
  question. Fitted-Q is the D7 family the b9d0-04 fail_action names next and the last untested family on this bench. PASS is pending a fresh window;
  FAIL closes the D7 line on in-hand data (family review).'
