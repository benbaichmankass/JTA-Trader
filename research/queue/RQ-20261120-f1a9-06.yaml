  subject: ml-tm-action-value
  subject_kind: ml_model
  from_result: RQ-20261120-f1a9-02
  verdict_read: fail
  diagnosis: 'f1a9-01/02/03 FAIL (n 2,627): close-only h12 +0.0033 [-0.0070, +0.0131]; close-only full -0.0152 [-0.0331, +0.0006]; 7 actions -0.0089
    [-0.0240, +0.0047]. With b9d0-04 (CatBoost) and 04a5-07 (quantile), every lever of the Monte-Carlo action-value family is now tested on this
    bench and the oracle close saving (0.78 R/trade) stays unreached. The untested axis is the VALUE DEFINITION: a hold value that includes the
    option to stop later (Bellman backup).'
  search: 'none: one learner (fqi_stop_value, FQI_ITERS 5, the incumbent LGBM_PARAMS per head) on the f1a9-02 configuration; nothing tuned on
