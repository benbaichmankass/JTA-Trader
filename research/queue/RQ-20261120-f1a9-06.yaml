decision_rule:
  id: RULE-RQ20261120-f1a9-06-TM-FITTED-Q
  registered_at: '2026-11-20'
  registered_before_run: true
  statistic: 'tm_bench score --rule s_offline on the one fqi_stop_value arm with --actions close --label full: delta vs B0 per trade, trade-clustered
    bootstrap CI95, folds positive of 6, per-leg max drawdown vs B0, net R per capital-day vs B0, delta vs B2, B4 matched-random margin CI, Holm-adjusted
    p (tm_bench.s_offline, which grades fqi_* arms exactly as lgbm_* arms).'
  rule: 'PASS (pass_pending_fresh_window) iff tm_bench.s_offline returns pass_pending_fresh_window for the fqi_stop_value arm: gain >= 0.03 R/trade
    over max(B0, B1), CI95 lower > 0, >= 5 of 6 folds positive, max drawdown and capital-day checks pass, beats B2, beats its own matched random
    B4 (margin CI lower > 0), Holm p < 0.05. FAIL iff its CI95 upper < max(B0, B1) + 0.03. INDETERMINATE otherwise, or if the fqi arm is not measured
    or unavailable, actions_allowed in verdict.json differs from [close], the label kind is not full, the test corpus is not tmb-73f5c3660014,
    the train corpus is not bp2-f4271084b120 with >= 10,000 de-duplicated trades after purge, or the selfcheck fails (including its fitted-Q planted
    / null controls). Thresholds, actions, label and grid are fixed now and not changed after any result.'
  pass_action: 'pass_pending_fresh_window: author the fresh-window confirmation on a corpus disjoint from tmb-73f5c3660014 before any live proposal;
    record the learner-family response on research/levers/ml-tm-action-value.yaml.'
  fail_action: 'Record fitted-Q as tested; with every Monte-Carlo lever also failed, the D7 line has no untested family on this bench: a family-review
    record, never a re-run of these configurations.'
  what_it_does_not_do: Trains nothing persistent, registers, serves or promotes nothing; changes no config; places no order.
  min_n: 2000 test trades
