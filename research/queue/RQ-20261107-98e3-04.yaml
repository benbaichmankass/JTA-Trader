  registered_before_run: true
  statistic: 'scripts/research/ml_entry_equity.py dev --structure --configs B --seeds 1,2,3,4,5 --taus 0.2,0.3: per (seed, tau) pooled purged walk-forward OOF restricted-long
    mean net R, n, n_symbols, by_fold, rows <= 2025-06-30.'
  rule: 'Descriptive: no pass bar, no promotion consumes it. Reading rule fixed now: at each tau let R = max - min of the 5 per-seed pooled OOF means (n>=300 each).
    SEED-NOISE-DOMINATED if R >= 0.04 at tau 0.20 (as large as the graded-vs-rerun gap); STABLE if R < 0.02; INTERMEDIATE otherwise. If the 5-seed MEAN at tau 0.20
    is <= 0 the graded dev selection is a fit artifact. Thresholds never change after any result.'
