question: 'Run 42396313667 (RQ-20261107-98e3-03) read tau 0.20 at +0.083 (n=3191) where the graded dev stage read +0.1222 (n=3004) for the same config, labels and
  dates: an unpinned-fit spread of ~0.04 R, the size of the edge. Dev-only (dates <= 2025-06-30, no confirming window): refit config B under PINNED determinism with
  seeds 1..5, same 5 purged walk-forward folds, taus 0.20 and 0.30; report per-seed pooled OOF mean net R and n.'
