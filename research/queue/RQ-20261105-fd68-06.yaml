# Hand-authored 2026-11-05 by lane ML-PROP-ITERATE (Tier 1), iteration of RQ-20261105-fd68-03. Gates this adds or changes: NONE. Registered BEFORE any run.
id: RQ-20261105-fd68-06
title: '8h-bar iteration of RQ-20261105-fd68-03: Tradeify-only ML leg: can a pooled ETH/SOL/XRP ML entry model, trained on its own declared feature families, beat the declared baselines NET OF Tradeify''s
  full cost stack, clear the V3 prop EV/survival gate under Tradeify''s DD limits, AND stay distinct (measured overlap ceiling) from every other prop leg?'
status: queued
cadence: once
theme: new_strategy_prop
priority: 1
kind: experiment
roadmap:
- L-PROP
- L-ML-LIVE
practice_precedent: T3 (net of the full cost stack) + M-principles on purged walk-forward with one held-out read; prop gate = scripts/research/prop_gate.py RULE-P5-GATE-BRK-PER-LEG-V3 (edge clause); docs/research/tradeify-portfolio-feasibility-2026-09-30.md;
  default regime-robustness clause = backtesting SKILL.
question: 'ITERATION 3 (8h bar, positive-sum eligibility). tradeify_1 (Tradeify 247 1-Step $10k, DXtrade) carries trend_donchian_eth_prop, the SAME leg also on breakout_2 and velotrade_1. Tradeify''s guidelines
  (https://intercom.help/tradeify/en/articles/10468318-guidelines-for-traders, "Bots/Algorithmic Trading") say, verbatim: "While you may use the bot on your personal accounts, using it across multiple firms
  is against Tradeify''s policy. The bot should be solely for your own use within Tradeify."; "We scan to ensure there are no similar orders on other accounts."; "You must be able to prove that you are
  the sole owner of the bot or strategy ... not being shared with other traders or firms."; hedging across accounts is also prohibited. PR #23154 (operator-approved, Tier 3) removes the leg from all three,
  leaving tradeify_1 empty. Operator proposal (verbatim above): a Tradeify-specific ML variant, its own unit, trained on its own data sources, separate from the other prop accounts. Does such a leg (i)
  have measured net-of-cost edge, (ii) survive Tradeify''s 6% static / 3% daily limits, and (iii) generate orders that are measurably NOT similar to any other prop leg''s?'
why_this_matters: 'ITERATION 3 (8h bar). It is the only route that puts a leg on tradeify_1 without the multi-firm exposure. The existing general entry model already FAILED this gate on Tradeify (comms/prop_survival/ml_entry.json,
  RQ-20261102-5e1a-01: EV -$83.70 median, p_breach_eval 0.682, edge mean +0.017 R with 95% CI [-0.106, +0.140], n 381, ETH+SOL) so this unit is NOT a re-test of that model: it differs in (a) training target
  = net R of a Tradeify-cost bracket, (b) a pooled ETH/SOL/XRP population, (c) a declared feature-family set per arm, (d) the distinctness requirement. A FAIL keeps tradeify_1 empty (the operator''s call)
  and the family open.'
instrument_universe:
  basis: config/prop_platforms.yaml tradeify_1.executor.enabled_venue_symbols = [ETHUSD, SOLUSD, XRPUSD] with lots measured (lot_units 1, lot_step 0.01, min_lots 0.01); ruleset/routing config/prop_rulesets/tradeify_247_1step.yaml
    + tradeify_routing.yaml (symbol_map ETHUSDT->ETHUSD, SOLUSDT->SOLUSD, XRPUSDT->XRPUSD; the routing file still marks the dxtrade names UNCONFIRMED, the ticket opener was approved for all 3 on 2026-10-03).
    Leverage caps BTC/ETH 5:1, altcoins 2:1 (UNCONFIRMED per ruleset).
  tradeable_now:
  - ETHUSDT
  - SOLUSDT
  - XRPUSDT
  listed_not_routable: 'Firm page: "100+ cryptocurrency pairs including BTC, ETH, SOL, DOGE, XRP"; terminal also lists SILVER/USD, XYZ100/USD, SP500/USD, USOIL/USD, UKOIL/USD, PAXG/USD (docs/research/tradeify-platforms-2026-10-15.md
    1, a LOWER BOUND, not the catalogue). None has routing, lots or spread measured, and the synthetics'' swap/commission is unmeasured. Excluded from this unit; adding one needs its own measurement row.
    BTC has no routing entry either and is excluded (data-only context allowed as a feature).'
  population_rule: Pooled ML over the whole tradeable_now set (an account configures strategies, never symbols; per-symbol results are reported, never gate). The same pooled population is the one the gate
    is read on.
data_sources:
  status: CANDIDATES from the repo; history depth/point-in-time coverage per family is UNVERIFIED and is the first thing the driver audits (arm unavailable => arm not run and reported, never silently dropped).
  candidates:
  - 'F0 price/volume only: ml/datasets/families/market_features.py, volatility_estimators.py, forecast_features.py (candles; lake um_perp 1m klines per config/data_universe.yaml)'
  - 'F1 derivatives positioning: ml/datasets/funding_oi_features.py, orderflow_features.py (funding, OI, long/short ratio, taker flow; lake "metrics" + funding streams)'
  - 'F2 cross-asset + macro: ml/datasets/cross_asset_features.py, macro_features.py (config/macro_econ_series.yaml, macro_events.yaml, macro_valuation.yaml; comms/macro/*)'
  - 'F3 text/embedding: ml/datasets/embedding_features.py, corpus_embedding_features.py (news, config/news_feeds.yaml) - arm runs only if point-in-time history exists'
  inventory_population: 'docs/reference/signal-catalog.yaml (static inventory 2026-10-08, 335 inputs): ml/ml_feature 105; regime_macro macro_series 54, news 31, event_calendar 20, regime_input 32, valuation
    10, cross_asset 6, crowding 1; strategy derived_indicator 35. Stale by design (dated); the driver re-reads the manifests, not this list.'
  the_35: NOT ASSUMED. No list of "35 data sources" was found in the repo (searched signal-catalog, ml/configs, config/*, docs/reference). The only 35 in the catalog is strategy derived_indicator = 35 (a
    count of indicators, not sources). Open operator question Q1 on checklist row TRADEIFY-OWN-LEG; arms F0-F3 are the proxy until it is answered.
label_and_horizon:
  bar: 8h (--bar-hours 8); horizon 6 bars = 48 h; features on 8h bars
  entry: model scores each closed 8h bar per symbol; entry at the NEXT bar open when score >= tau; one position per symbol; no simultaneous opposite-side position in the same symbol (the firm's no-hedging
    rule), long and short both allowed.
  label: 'y = 1 iff the bracket trade opened at the next bar open (stop 1.5 x ATR14, take-profit at the registered target below, max hold 48 bars = 2 days) realises net R >= +0.5 after the Tradeify cost
    stack. A second head regresses the favourable excursion (MFE in R) and sets the take-profit at its q60 clipped to [1.5R, 4.0R] (TP doctrine: a real predictive TP, never tp_r 50 / rest-at-cap; scripts/ci/check_tp_doctrine.py
    is re-run on the driver).'
  horizon_bars: 6
baselines:
  cost_stack: 'Tradeify declared: commission 4.0 bps/side (0.04% per trade, strictest = per fill), swap 3.3 bps/night, plus slippage 3.0 bps/side (the stack of the Tradeify feasibility memo), read through
    src/research/run_costs.prop_declared_costs and config/prop_rulesets/tradeify_247_1step.yaml. Every R below is NET of it. Tradeify firm costs are UNCONFIRMED (ruleset header), stated.'
  B0: 'flat (net R 0): the leg must beat doing nothing, i.e. EV > 0 on its own.'
  B1: 'class prior / all-bars control: the SAME bracket opened on EVERY eligible bar of the same population, same cost stack (zero-edge null), and a matched random-selection control (2000 draws, seed 20261105,
    same trade count k per symbol).'
  B2: 'the incumbent trend_donchian_eth_prop on ETHUSDT over the identical held-out span, same cost stack (the leg PR #23154 removes).'
  B3: 'the existing general ml_entry (served ENTRY v1 + extend-only TP) on the same ETH/SOL span: net edge +0.017 R, V3 FAIL (RQ-20261102-5e1a-01), reproduced as a reference, not re-tuned.'
arms:
  denominator: '8 registered arms: feature sets {F0, F0+F1} x tau {0.35, 0.4, 0.45, 0.5}. F2 arms are dropped on DISCOVERY evidence (every F0+F1+F2 arm was net-negative in RQ-20261105-fd68-03 and -04 at
    4h, -21.5 .. -151 R) - a registered design choice, not a threshold change. F3 has no point-in-time source. All 8 graded arms are counted and reported.'
  models: LightGBM, unchanged default hyperparameters set once in the driver (no tuning loop); ml_bakeoff.py is the harness family for any comparison against a second learner, not part of this rule.
split:
  discovery: 2022-01-01 .. 2025-09-30, purged expanding walk-forward by calendar quarter, embargo = max hold (48 bars) + 7 d
  held_out: 'NOT READ. 2025-10-01 .. 2026-09-30 was read once by RQ-20261105-fd68-03 (n=35, spent for that selection); a second selection read on the same span would be a second look. This unit is DISCOVERY-ONLY
    (--no-heldout): it selects the arm on discovery under the positive-sum rule and FREEZES it. The only unread data is 2026-10-01 onward (~5 weeks, far below the 150 floor), so the graded read is a FORWARD/accruing
    window filed on the pipeline (due when forward n is expected >= 150), not a verdict today.'
power:
  expected_n: 150
  min_detectable_effect: 0.203
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATED, not measured: (1.645 + 0.8416) / sqrt(150) = 0.203 sd of per-trade net R, one-sided. Basis for n: the general ml_entry produced 381 ETH+SOL held-out trades in this span (MEASURED, RQ-20261102-5e1a-01);
    a thresholded leg on 3 symbols is expected to trade less often than the unfiltered model; the driver''s first act records the realised held-out n. n < 150 => INDETERMINATE (cannot answer), never FAIL.
    4h bars give roughly a quarter of the 1h decision rows; n < 150 held-out trades => INDETERMINATE (cannot answer), never FAIL. At 8h the decision rows halve again versus 4h, so held-out n is expected
    near or below 150: n < 150 => INDETERMINATE (cannot answer), never FAIL.'
  feasibility:
    source: none
    accrual_basis: Replays history on a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ20261105fd6806-TRADEIFY-OWN-LEG-8H-DISCOVERY
  statistic: 'Held-out span, the single arm selected on discovery (highest summed walk-forward net R among arms with >= 2/3 of quarterly folds net-positive and >= 100 discovery trades), scored by the driver
    with the Tradeify cost stack and graded with scripts/research/prop_gate.py V3 (prop_ev_sim path mode, 5 seeds x 1000 lives, configured risk_pct 0.5%, daily_dd_switch 0.8, ruleset tradeify_247_1step)
    on the held-out ledger. DISTINCTNESS is computed on the held-out span AND the full out-of-sample walk-forward ledger against EVERY other prop leg ledger: the legs on any prop roster in config/accounts.yaml
    at run time, plus trend_donchian_eth_prop, trend_donchian_sol_prop, eth_pullback_prop_2h and the B3 ml_entry ledger even if unrostered; the bybit legs are reported as a diagnostic, not graded.'
  rule: 'DISCOVERY STAGE ONLY. FAIL iff no arm x tau is eligible (>= 100 discovery trades, >= 2/3 of folds net-positive, discovery sum net R > 0). If one is eligible: verdict INDETERMINATE, read_state measured,
    forward_pending true, selected arm and tau frozen in result.json; no E1-E4/D read and no roster PR - the held-out read is replaced by a forward window (all bars after 2026-09-30) graded by a successor
    unit registered before it is read, with E1-E4 + V3 + D1-D4 exactly as in RQ-20261105-fd68-03. Thresholds not changed after any result.'
  what_it_does_not_do: 'Trains and promotes nothing, edits no config, touches no roster (accounts.yaml is not changed), places no order. Not evidence of live edge (an offline read at the declared power).
    Does not decide whether a distinct model satisfies Tradeify''s "sole owner / no similar orders" policy: that is a compliance judgement for the operator (Q3), and the firm''s costs are UNCONFIRMED. Per-symbol
    results never gate. Not a re-test of ml_entry.'
  registered_before_run: true
  registered_at: '2026-11-05'
