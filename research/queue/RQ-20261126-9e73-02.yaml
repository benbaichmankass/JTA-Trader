ml_bakeoff:
  task: classification
  metric: logloss
  higher_is_better: false
  dataset:
    kind: jsonl
    paths: datasets-out/market_features/*/1h/v102/data.jsonl
    entity_col: symbol
    ts_col: ts
    target: regime_label
    features:
    - rolling_log_return_vol
    - log_return
    - log_return_lag_1
    - log_return_lag_2
    - hour_of_day
    - dayofweek
    - parkinson_vol
    - garman_klass_vol
    - rogers_satchell_vol
    - yang_zhang_vol
    tail_rows: 40000
  cv:
    folds: 5
    embargo_rows: 1440
    min_train_frac: 0.4
    row_bootstrap:
      block_rows: 1440
      n_boot: 1000
      seed: 0
  baseline: lgbm
  controls:
  - prior
  candidates:
  - gru_raw_w64
  - gru_raw_w168
  learners:
    prior:
      kind: prior
    lgbm:
      kind: lightgbm
      params:
        n_estimators: 200
        learning_rate: 0.05
        num_leaves: 31
        min_child_samples: 50
    gru_raw_w64:
      kind: torch_gru
      base_features: []
      feature_blocks:
      - kind: raw_bars
        path: datasets-out/market_raw/{entity}/1h/v102/data.jsonl
        vol_window: 96
        entity_col: symbol
      params:
        window_bars: 64
        hidden: 64
        layers: 2
        epochs: 30
        batch_size: 256
        max_train_windows: 1000000
        seed: 0
        device: auto
        val_frac: 0.2
        patience: 3
        calibrate: temperature
        weight_decay: 0.0001
    gru_raw_w168:
      kind: torch_gru
      base_features: []
      feature_blocks:
      - kind: raw_bars
        path: datasets-out/market_raw/{entity}/1h/v102/data.jsonl
        vol_window: 96
        entity_col: symbol
      params:
        window_bars: 168
        hidden: 64
        layers: 2
        epochs: 30
        batch_size: 256
        max_train_windows: 1000000
        seed: 0
        device: auto
        val_frac: 0.2
        patience: 3
        calibrate: temperature
        weight_decay: 0.0001
  rule:
    min_folds: 3
    pass_if:
    - group:
      - POOLED
      vs: baseline
      window: cv
      op: '>'
      value: 0.0
      stat: boot_ci_low
    fail_if_no_candidate_reaches:
    - group: any
      vs: baseline
      window: cv
      op: '>'
      value: 0.0
      stat: boot_mean
