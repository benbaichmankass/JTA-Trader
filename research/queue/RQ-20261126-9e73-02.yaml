id: RQ-20261126-9e73-02
title: 'D2/F29 POOLED GRU on RAW OHLCV WINDOWS (GPU): the 9e72-01 calibrated recipe on raw per-bar market_raw inputs (64- and 168-bar lookbacks), trained
  once per fold on the bp2 60-perp universe pooled, vs LightGBM on the 10 engineered features, 1h regime log-loss, calendar day-block bootstrap (metis-market-bp2)'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-MECE
programme: P2
kind: experiment
iteration:
  subject: ml-sequence-gru
  subject_kind: ml_model
  from_result: RQ-20261126-9e72-01/45735661023
  verdict_read: fail
  diagnosis: '9e72-01 FIXED the recipe (early stopping + temperature calibration): the GRU went from 0.11-0.26 nats WORSE than the class prior (9e71-01)
    to +0.09..+0.11 better, and then TIED LightGBM on the same 10 engineered per-bar features (BTC -0.012 nats, CI below 0; ETH -0.0005 and SOL -0.0024,
    CIs span 0). On hand-made features a sequence model has nothing the trees lack, so the open question is REPRESENTATION: does the GRU find structure
    in the RAW bar sequence (returns, ranges, bodies, gaps, relative volume over a long lookback) that the 10 engineered columns do not carry? Pooled 60-perp
    version for power (twin of RQ-20261126-9e73-01).'
  search: two lookback arms named before the run (window_bars 64 and 168 1h bars), the 9e72-01 recipe otherwise unchanged, raw_bars inputs only (base_features
    []); no other grid.
  levers:
  - model_family
  - representation
  - population
  map_entries:
  - research/levers/ml-entry.yaml
  attempt: 5
  due_by: '2026-12-03'
question: Pooled over the bp2 60-perp universe, does a calibrated GRU on RAW 1h OHLCV windows (64 or 168 bars) beat LightGBM on the 10 engineered features
  in out-of-fold regime log-loss (day-block bootstrap 95% lower bound > 0), or lose for both arms?
why_this_matters: The same representation question as 9e73-01 at ~20x the data, which a sequence model needs; it is also the confirmation read for a 9e73-01
  lead.
power:
  expected_n: 1400000
  min_detectable_effect: 0.005
  effect_units: logloss_nats_per_row
  sd: 0.3
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'MEASURED + ESTIMATE. 60 symbols x tail 40,000 1h rows (the dataset holds 2020-07 onward; the tail keeps the newest ~4.6 years per symbol, as 9e72-01)
    = up to 2.4M pooled rows. Folds score the last 60% (min_train_frac 0.4), so ~1.4M paired OOS rows. The bootstrap resamples whole calendar days (block_rows
    1440 = 24 h x 60 symbols), so the effective n is the ~1,000 OOS days, not 1.4M rows. MEASURED 2026-11-26: a local CPU smoke of this exact spec on 3
    real bp2 symbols (ADA/BTC/DOGE, 72,000 OOS rows, 1-day blocks of 72 rows; cut-down GRU budget: 4 epochs, hidden 32, 1 layer, 60k windows; n_boot 200)
    gave a bootstrap sd of the GRU-minus-LightGBM log-loss delta of 0.00176 nats/row over the same ~1,000 day-blocks. ESTIMATE: averaging 60 symbols per
    day instead of 3 lowers the per-block variance (cross-sectional correlation ~0.3 assumed), so sd ~0.0014 and MDE ~2.8 x sd ~0.004; 0.005 is declared
    to leave margin. The smoke is NOT a result of this unit (3 symbols, reduced GRU). INDETERMINATE is possible and stated now. For this unit: the same
    pooled rows and day-block bootstrap as 2819-01 (its MDE estimate 0.005 carried over); two arms counted; raw_bars adds 60 market_raw reads (~29 MB each).'
  feasibility:
    source: none
    accrual_basis: 'Published market shards (metis-market-bp2: market_features + market_raw, 60 perps, 1h v102, built from public data.binance.vision klines);
      nothing accrues.'
evidence_class:
  claim: model_quality
  holdout: none
ml_consumer:
  not_applicable: 'a model-family gate on a market regime target: no order, leg or book consumes this result; a PASS authors the entry-label GRU unit (ML-ENTRY-FINETUNE),
    which carries its own consumer'
baseline:
  definition: LightGBM (n_estimators 200, lr 0.05, num_leaves 31, min_child_samples 50) on the 10 ENGINEERED columns (the 9e72-01 baseline, unchanged),
    same pooled rows and folds; the class prior is a reported control. The GRU arms see ONLY the 5 raw_bars columns (raw_r1, raw_hl, raw_co, raw_gap, raw_lv)
    from market_raw.
  net_of_cost: false
run:
  command:
  - python3
  - scripts/research/ml_bakeoff.py
  - --unit
  - '{unit}'
  - --out
