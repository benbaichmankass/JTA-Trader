decision_rule:
  id: RULE-RQ-20261126-9e73-02
  registered_at: '2026-11-26'
  registered_before_run: true
  baseline: LightGBM on the 10 engineered columns, same rows and folds; candidates = two raw-window GRU arms
  statistic: 'scripts/research/ml_bakeoff.py POOLED mode (dataset.paths + entity_col symbol): group POOLED, the paired moving-block (block_rows 1440 = one
    calendar day across 60 symbols, n_boot 1000, seed 0) bootstrap of the out-of-fold log-loss improvement (LightGBM minus GRU; positive = GRU better),
    stat boot_ci_low (95% lower bound) and boot_mean. Reported: fold-level paired mean, the prior control, per-fit epochs/best epoch/temperature (measurement.torch_gru_fit),
    the files pooled (measurement.pooled_files) and n_entities.'
  rule: PASS iff for at least one arm (gru_raw_w64 or gru_raw_w168) boot_ci_low vs LightGBM is > 0 on POOLED (>= 3 folds measured). FAIL iff for BOTH arms
    boot_mean vs LightGBM is <= 0 on POOLED. INDETERMINATE otherwise. Fixed now; machine form in ml_bakeoff.rule.
  pass_action: 'A best-of-2 pass is a LEAD: confirm on a later out-of-time window before authoring the entry-label GRU arm (net R per side, frozen v1 recipe
    baseline, net of the full cost stack) as its own unit.'
  fail_action: Record that a calibrated GRU on raw OHLCV windows (64 and 168 bars) does not beat LightGBM on the engineered features at 60-perp scale; the
    remaining deep_sequence form is a PRETRAINED TS encoder (MLP-F-COVARIATE-TSFM), authored from this result.
  proposal_mapping: pass -> confirmation then entry-label GRU unit; fail -> pretrained TS encoder next; indeterminate -> state the CI width and iterate.
  what_it_does_not_do: Changes no served model, config or order path; reads no held-out window; is not a promotion; adds no gate. Binance-vision klines,
    not Bybit; the basis is not measured, and the target is a market regime label, so the venue does not enter a cost.
  min_n: 3
  multiple_testing:
    arms_counted: 2
    variants_vs_control: 2
    correction: each arm must clear the rule on its own; a best-of-2 pass is a LEAD that needs the confirmation read, never a finding
