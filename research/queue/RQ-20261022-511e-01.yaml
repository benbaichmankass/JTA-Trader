id: RQ-20261022-511e-01
title: 'Corroboration of RQ-20261016-015 M2: does the ADX-tightened trail cell adx25_k0_t2.5
  (trail_adx_below 25 / trail_adx_tight_mult 2.5) beat the declared exit on a sibling trend_donchian
  4h leg (eth_4h, sol_4h) over 2020-07..2026-10 in 3 of 4 calendar folds, net of cost?'
status: queued
cadence: once
roadmap:
- L-ATM
- M20
theme: live_strategy
priority: 1
kind: experiment
question: 'RQ-20261016-015 passed M2 = adx25_k0_t2.5 on trend_donchian_xrp_4h (+17.07 vs +14.30
  R over n 68, 4 of 4 folds, maxDD 4.15 vs 4.57), and its own what_it_does_not_do says "68 trades
  is thin: a PASS is a candidate a second leg must corroborate, not a ship". Does the SAME cell, graded
  by the SAME rule, beat the declared exit on a sibling trend_donchian 4h leg?'
why_this_matters: 'Operator 2026-10-22 (popup, verbatim): "bybit_1 now, real money after corroboration
  (Recommended)". The lever runs on bybit_1 only (soak alias trend_donchian_xrp_adx25, checklist
  OPERATOR-DECISIONS-1022); a PASS here is the evidence record for declaring it on trend_donchian_xrp_4h
  for bybit_2 (real money) + bybit_portfolio together.'
power:
  expected_n: 133
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'Floor: (1.96 + 0.8416)^2 / 0.45^2 = 38.76 -> 39 incumbent trades, the same floor as
    RQ-20261016-015. expected_n is a per-leg estimate, NOT measured on this window: eth_4h''s committed
    1095d Stage-0 record carries n_oos 133 (comms/strategy_evidence/trend_donchian_eth_4h.json), and
    a 2020-07..2026-10 window is longer, so eth_4h clears 39; sol_4h is unmeasured here and a sol_4h
    row under 39 reads INDETERMINATE under the rule, never FAIL.'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-ODC1022-ADX25-SIBLING-CORROBORATE
  statistic: 'Per sibling leg L in {trend_donchian_eth_4h, trend_donchian_sol_4h}, one invocation of
    scripts/research/exit_lever_ablation.py --grade replace, window 2020-07-01 .. 2026-10-15 23:59 (the
    SAME window as RQ-20261016-015; 4 equal calendar folds; a trade is binned by entry time), net of
    the full cost stack the harness resolves per venue (fee 7.5 bps + slippage 3 bps round trip + funding
    1 bps per 8 h window on Bybit perps, via execution_costs.resolve_cost_policy; recorded per arm as
    cost_stack). Per arm, from the harness''s own --json summary: n, net_total_r, max_drawdown_r, net
    R per fold. A = L as declared in config/strategies.yaml (argv built by regime_debt_matrix.build_harness_cmd).
    Candidate: M2 = adx25_k0_t2.5 (--trail-adx-below=25;--trail-adx-tight-mult=2.5), the ONE cell
    RQ-20261016-015 named, so there is no best-of-several selection within a leg. delta = net_r(M2)
    - net_r(A); folds_ge = folds where net_r(M2) >= net_r(A) (ties count); maxDD(M2) vs maxDD(A).'
  rule: 'Per leg, IDENTICAL to RULE-P1-Q4-XRP4H-EXIT-CONFIRM: INDETERMINATE IF n(A) < 39 (underpowered:
    no verdict, never FAIL on thin n). M2 PASSES on L iff net_r(M2) > net_r(A) AND delta >= 0.02 R x
    n(A) AND folds_ge >= 3 of 4 AND maxDD(M2) <= maxDD(A) x 1.35. UNIT PASS IF M2 passes on >= 1 of
    the two siblings -> the evidence record for a Tier-3 declare of trail_adx_below 25 / trail_adx_tight_mult
    2.5 on trend_donchian_xrp_4h (bybit_2 + bybit_portfolio together, one PR), recorded on checklist
    row OPERATOR-DECISIONS-1022. UNIT FAIL IF M2 is measured (n(A) >= 39) and fails on BOTH siblings
    -> the lever stays on the bybit_1 alias only; real money is not declared on this cell. UNIT INDETERMINATE
    IF no sibling passes and at least one is INDETERMINATE. Thresholds (0.02 R/trade, 3/4 folds, 0.35
    drawdown tolerance, the 39 floor, the >= 1-of-2 bar) are not changed after any result. GRADING NOTE:
    queue_grade.py grades E5 rows by UNANIMITY, so a mixed {pass, fail} result lands as needs_review
    and a session applies the >= 1-of-2 rule above, as registered here.'
  what_it_does_not_do: 'Edits no config and places no order: a PASS is an evidence record for a Tier-3
    proposal, never a change. NOT an independent holdout of RQ-20261016-015: same history, same harness,
    different symbol. It corroborates that the cell generalises across the family, not that xrp_4h''s
    gain is out of sample. KNOWN PRIOR: RQ-20261019-010 (adx-replace on eth_4h, 6 folds / 5 majority)
    already graded the ADX arms FAIL against the CURRENT eth_4h incumbent (trail decay 10/1.8 + measured-move
    tp_revision); this unit grades eth_4h under the 4-fold rule RQ-20261016-015 used, so a FAIL on
    eth_4h is the expected reading and the corroboration most likely rests on sol_4h. sol_4h is execution:
    shadow (no roster), so its result says nothing about live mechanics. Two siblings with a >= 1 bar
    is a 2-way multiple comparison; the per-leg fold majority and the materiality bar are what guard
    it.'
  registered_before_run: true
  registered_at: '2026-10-22'
