theme: live_strategy
priority: 3
kind: experiment
question: On 2006-10-02 .. 2025-04-09 (disjoint from, and immediately preceding, the committed record's window), is tlt_pullback_1d at its configured params
  net-positive with >= 5 of 8 calendar folds net > 0, at n >= 39?
why_this_matters: 'Programme 03 Q3 / L-LADDER: a soak-book leg whose 365d record is NEGATIVE or flat and underpowered cannot be told apart from a leg with
  no edge. A long-window grade either gives it a Stage-0 case or retires the question with a number. tlt_pullback_1d sits on the soak books (alpaca_paper,
  ib_paper): -3.61 R on n=8 (365d). It was pulled from alpaca_live by A6 (#12673) on 2026-09-21.'
power:
  expected_n: 148
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'd=0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo''s standing E35 floor). expected_n=148 is an ESTIMATE: the 365d record''s 8 trades
    x 18.5 yr. Cost stack: Alpaca equity fee 0 + the provisional 5 bps slippage (E62) + no funding. Window 2006-10-02 (after the instrument''s listing)
    .. 2025-04-09 (the day before every 1d record''s data_start 2025-04-10). Folds 8, majority 5.'
  feasibility:
    source: none
    accrual_basis: Re-measurement on freshly fetched keyless candles over a pinned historical window; nothing accrues.
decision_rule:
  id: RULE-RQ20261016c56e24
  registered_at: '2026-10-16'
  registered_before_run: true
  statistic: 'ONE arm B = the leg exactly as declared in config/strategies.yaml (argv built by regime_debt_matrix.build_harness_cmd; full cost stack fee
    + resolved slippage + funding via execution_costs.resolve_cost_policy), graded by exit_lever_ablation.py --grade stage0: net_total_r, n, max_drawdown_r,
    and net_r per fold over 8 equal calendar spans of the window. Reported, not graded: net_r_per_capital_day. NO positive control: no committed record
    exists on this window (it is disjoint from and immediately precedes the leg''s record), the precedent being RQ-20261014-470a-01; the argv is built by
    the same builder the committed record used, from the same config keys.'
  rule: 'indeterminate IF n(B) < 39 (underpowered: no verdict, never FAIL on thin n). PASS IF net_r(B) > 0 AND >= 5 of 8 calendar folds net > 0: the leg
    is graded at power for the first time: Stage-0 evidence at n >= 39 over 18.5 years -- the evidence a soak-book leg needs before any Gate-2 case. FAIL
    IF n >= 39 and that does not hold: the leg has no fold-consistent edge over 18.5 years at its configured params -- it has no path to Stage 2 at these
    params; recorded on L-LADDER. Windows are never pooled with the committed record''s; the record keeps its own grade. The 0 R bar, the 5-of-8 fold majority
    and the 39 floor are not changed after any result.'
  what_it_does_not_do: Does not edit config or any roster, does not tune (one arm, as declared), does not pool windows. Not a promotion case.
