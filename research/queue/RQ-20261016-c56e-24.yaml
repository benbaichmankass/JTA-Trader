id: RQ-20261016-c56e-24
title: 'Re-validation at power, soak book: does tlt_pullback_1d AS DECLARED clear Stage 0 on the disjoint window before its committed record (2006-10-02
  .. 2025-04-09), net of the full cost stack?'
status: done
