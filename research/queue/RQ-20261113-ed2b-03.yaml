baseline:
  arm: hold
  definition: 'each corpus row''s recorded net_r: the leg''s own declared exit, untouched, net of the full cost stack (fee 11 bps round trip +
    slippage + funding per window, as recorded per row by the corpus harness)'
  source: comms/strategy_evidence/ltr_corpus/<leg>__trades.jsonl
power:
  expected_n: 4076
  min_detectable_effect: 0.05
  effect_units: metric
  sd: 0.5
  design: paired
  alpha: 0.0056
  power: 0.8
  basis: 'INFERRED, not measured: the book is the 4076 committed corpus trades (counted 2026-11-13 from the trades.jsonl files); hold net_r sd
    over them is 1.47 R (measured), and the per-trade paired difference action - hold is assumed about 0.5 R because the action touches only the
    post-trigger part of a trade. At alpha 0.0056 (Bonferroni over 9) and power 0.8 a paired mean difference of about 0.028 R/trade is detectable,
    below the 0.05 R R1 bar. Trades with no candles or no path are excluded and counted; V1''s n_floor 39 governs.'
  feasibility:
    source: none
    accrual_basis: Replays committed corpora and candles; nothing accrues.
decision_rule:
  id: RULE-RQ-20261113-ed2b-03
  registered_at: '2026-11-13'
  registered_before_run: true
  statistic: 'Over the pooled committed Stage-0 per-trade corpora in comms/strategy_evidence/ltr_corpus (8 legs, 4,076 trades; each row''s net_r
    already net of fee + slippage + funding), per pre-registered trigger T in {new_peak, r_milestone, swing}: the book with the stop moved at
    the bar after T fires to min(adverse R over the last 5 closed bars) - 0.1 ATR (taken only when > -1 R and below the next open; else the trade
    holds) and replayed to the recorded exit (a stop that is not hit leaves the recorded exit), vs the HOLD book, against 200 matched random-time
    structure moves on the same trades.'
  rule: 'RULE-AM-RISK-ADJUSTED-V1 (am_risk_adjusted.grade_risk_adjusted, V1 parameters: R1 r_cost <= 0.05 R per baseline trade; R2 maxDD cut >=
    15% OR weekly-CVaR5 cut >= 15%; R3 >= 4 of 6 calendar folds hold; n_floor 39) with R4 vs 200 matched random-time books, plus L1: a pass must
    keep r_cost <= 0.05 R/trade after dropping the leg with the largest favourable contribution. Reported, never graded: the B3 best static rule
    (hold + the registered trigger arms, chosen leave-one-fold-out) and each candidate''s margin over it. Multiple comparisons: RQ-20261113-ed2b-01
    / -03 / -05 share this harness with 3 pre-registered triggers each = 9 candidates, so R4 uses min_control_beat_frac 0.9944 (1 - 0.05/9, Bonferroni;
    199 of 200 random books must be beaten) instead of V1''s 0.95, and the reported edge CI is at 1 - 0.05/9. PASS: at least one pre-registered
    trigger candidate clears R1-R4 and L1. It is a SCREEN pass (per-trade R books, graduation_eligible false until BOOK-SIM-REAL-SIZER): a Tier-3
    proposal input for the class''s status, never an apply. FAIL: every candidate fails a read necessary clause (R1, R2 or R3) or is beaten by
    its random control (R4): back to diagnosis (trigger choice, then action bounds). INDETERMINATE: anything else, i.e. the best candidate is
    under the n floor, never fired, carried by one leg (L1 fails), or no trade could be priced (read_state no_data). Fixed now; not changed after
    a run.'
  what_it_does_not_do: 'Advice-only research: serves, promotes or applies nothing; adds no gate; changes no config, mandate or roster; places
    no order.'
