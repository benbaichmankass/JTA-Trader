theme: live_strategy
priority: 2
roadmap:
- L-ATM
programme: P1
kind: experiment
question: Over the committed Stage-0 per-trade corpora, does sl_to_structure (stop to the swing extreme against the position over the last 5 closed
  bars less 0.1 ATR, only when tighter than the initial stop) at the first new_peak, r_milestone or swing trigger cut book risk at <= 0.05 R/trade
  net of cost and beat the same move at a random bar?
why_this_matters: 'ltr-sl-to-structure is an orphan: no live iteration unit (scripts/research/iteration_orphans.py, 2026-11-13), verdict pending
  since LTR-CLASS-GRADE closed. docs/ARCHITECTURE-CANONICAL.md § Active management: each action class stays advice-only until its own net-of-cost
  test passes, so a class with no test can never graduate or be retired on evidence.'
iteration:
  subject: ltr-sl-to-structure
  subject_kind: ltr_class
  from_result: comms/research/ltr_class_grade/verdict.json
  verdict_read: pending
  diagnosis: comms/research/ltr_class_grade/VERDICT.md has no sl_to_structure action at all, and the desk labels hold 0 structure rows, so the
    class has never been called or graded. Structure was graded only as an ENTRY-declared strategy exit (RQ-20261101-5e01-*, -5e02-*, RQ-20261105-5e05-*,
    mostly fail or indeterminate), never as an in-trade move at a review trigger. The plain tighten class lost -0.097 R per check-in over 981
    check-ins (comms/research/ltr_tighten_optimize/verdict.json); a structure stop is a tighten whose level comes from the chart, so it must beat
    hold AND a random-time move.
  hypothesis: a chart-structure stop placed once the trade has moved in favour cuts drawdown at small R cost, because the level sits where the
    trade's thesis is invalidated rather than at an arbitrary distance
