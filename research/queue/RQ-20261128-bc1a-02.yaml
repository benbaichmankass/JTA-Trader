id: RQ-20261128-bc1a-02
title: 'ml_entry CALIBRATION lever: on the registered dev folds, does remapping each side''s predicted net R to realised net R (isotonic, or per-decile means that
  may be non-monotone) before the tau 0.10 policy raise mean net R per decision, and does the decile remap beat the same decile means permuted?'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: experiment
origin: follow_up
practice_precedent: 'M3, T2 (docs/reference/trading-and-model-practice-principles.md): one lever per arm (the upper bound only), graded against the registered recipe
  and a same-size random-removal control on the same folds, so the arm must beat removing trades blindly, not just removing trades.'
question: On the registered ml_entry dev folds (8 half-year folds 2022-01-01..2025-10-01, purge + embargo, tau 0.10, the harness cost stack), is mean net R per decision
  higher when each fold's test predictions are remapped to realised net R by a map fitted on a calibration slice (the last 20% of that fold's train rows, scored by
  the recipe fitted on the first 80%), isotonic (cal_iso) or per-decile means (cal_bin10), than with the raw registered predictions; and for cal_bin10, higher than
  the same decile means permuted across deciles?
why_this_matters: 'research/levers/ml-entry.yaml declares `calibration` (''non-monotone remap repairs the top band'') and the manifest family `calibration` is untested.
  RQ-20261128-bc1a-01 tests the blunt version (cut the top band); this unit tests the learned version, which can also LOWER the bar where low raw scores pay. ml_entry
  trades real money and the staleness/capacity/encoder arms are spent. A remap needs no retrain of the served model. Idle-compute order, Manager 2026-11-28a: runs
  on the trainer.'
evidence_class:
  holdout: dev_folds
  claim: edge
power:
  expected_n: 60000
  min_detectable_effect: 0.0068
  effect_units: R
  sd: 1.2
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'alpha is the tabulated power-floor level (as c4e2-02); the per-arm family bar t >= 2.239 (Sidak, k = 2) is enforced by the decision rule, so INDETERMINATE
    is a live outcome stated now. MEASURED on the same folds: base arm n 72,996 decisions (f1a0-01 run 45484674095); a remap moves only which bars clear tau, so n
    per arm stays of that order. min_detectable_effect = LEVER_RULE min_delta_r (0.0068 R).'
  feasibility:
    source: none
    accrual_basis: Replays public Binance history fetched at run time; nothing accrues.
decision_rule:
  id: RULE-RQ20261128-bc1a-02-CALIBRATION
  registered_at: '2026-11-28'
  registered_before_run: true
  baseline: the registered raw-prediction policy (arm 'base'), same refit, tau 0.10, policy and cost stack
  statistic: 'per arm, ml_decision_entry.py lever_arms(): delta = mean net R (arm) - mean net R (base) over the pooled dev-fold decisions, week-clustered se; for
    cal_bin10 also delta vs random_cal_bin10 (the same decile means permuted, seeded per fold); folds where the arm beats base; years with a positive yearly delta.
    The map is fitted on the calibration slice only (train rows, out of sample for the 80% fit); no test row is read.'
  rule: 'Each of the 2 arms (cal_iso, cal_bin10) is graded by LEVER_RULE (RULE-ML-ENTRY-LEVER-ARMS-20261124) with the family bar for 2 arms in one unit: PASS iff
    n >= 3000 AND delta >= 0.0068 R AND week-clustered t >= 2.239 (one-sided Sidak for k = 2, alpha 0.025; the code sets min_t = max(2.0, this)) AND (cal_bin10)
    delta vs random_cal_bin10 >= 0.0068 AND the arm beats base in >= 6 of 8 folds AND the yearly delta is positive in >= 3 years. FAIL iff n ok and delta + min_t
    * se < 0.0068. INDETERMINATE otherwise. verdict.json carries the first arm; arm_verdicts carries both. cal_iso has no information control: a monotone remap only
    moves the effective threshold, so its PASS reads as ''the learned threshold beats tau 0.10'', not as a calibration effect.'
  pass_action: The best PASSing arm gets ONE confirming read on disjoint out-of-time data (2025-10-01 onward, holdout_lock claimed, the deflated ENTRY bar) in its
    own unit; a pass there makes the remap a data-backed Tier-3 packet for the served ml_entry policy (manager or mandate applies, never a lane).
  fail_action: Close score calibration for crypto ENTRY on research/levers/ml-entry.yaml (both monotone and decile remaps); no re-run with other bin counts or slice
    shares.
  proposal_mapping: pass -> confirming out-of-time read -> Tier-3 packet; fail -> lever closed; indeterminate -> report the realised se, stop.
  what_it_does_not_do: 'Promotes nothing. These are DEV folds, the window that chooses: a PASS only qualifies the chosen remap for ONE confirming read on disjoint
    data in its own unit, and that read decides. No served artifact, roster or config changes here.'
  min_n: 3000
compute: cpu_long
baseline:
  definition: The registered recipe (20 FEATURES, LGB_PARAMS) refit per dev fold on every row before the fold minus the embargo, unweighted, better predicted side
    if > tau 0.10, one open position per symbol, SL 2 / TP 3 ATR14, 24 h time stop, full cost stack. Arm 'base' = this, uncapped.
  net_of_cost: true
value:
  bucket: ai_trader
  usd_at_stake_per_month: 300
  confidence: 0.15
  basis: 'stand-in: ml_entry trades real money on bybit_2 + bybit_portfolio and is losing (c4e2-01); a fresher fit is the direct lever on the diagnosed staleness.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 4.0
  est_minutes: 60
