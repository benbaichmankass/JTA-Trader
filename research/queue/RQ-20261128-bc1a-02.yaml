  basis: 'ESTIMATE from c4e2-02 (RAN on the trainer: 12 fit sets x 8 folds in its 240-min budget). This unit: the base fit plus ONE 80%-train fit scoring the 20%
    slice per fold, ~2 fit sets x 8 folds ~ 15-25 min + fetch ~15 min; 60 min est, 180 allowed.'
