  diagnosis: 'Live decision trace (61 ml_entry packages 2026-11-16..11-24, model replay matches the logged scores to 5e-6, so serve
    parity holds): the side is set by MARKET-WIDE inputs. On the 22 crypto LONG packages the mean SHAP contribution to (p_long - p_short)
    is btc_vol24 +0.255 and btc_ret24 +0.114 (breadth_up24 +0.032); on the 17 SHORT packages breadth_up24 -0.089, btc_ret24 -0.083,
    ret_72 -0.069. In 9 of the 10 decision bars with a non-zero BTC 24h move the side was AGAINST that move (the one bar WITH it, 11-20
    11:00Z, won). Live btc_vol24 0.0096-0.0107 sits above the Oct-Nov 90th percentile (0.0073, Binance 1h). The model learned "high BTC vol
    + BTC down 24h + weak breadth = buy" and has no input that says whether that panic is inside a bull or a bear. The side split tracks
    the regime (RQ-20261123-d3a1-01: per-fold gap vs the always-short minus always-long gap, corr 0.89); a ret_168 side gate FAILED
    (+0.012, t 0.83) because a gate throws decisions away; this lever gives the model the state as INPUT instead.'
  search: 'lever family features/regime-state, one fixed set of 5 columns (no grid): btc_ret168, btc_ret720 (log returns), btc_vol_pct90d
    (rank of BTC vol24 in its trailing 2160 h), btc_dist_sma1200 (log close minus log 1200 h mean), breadth_up168 (share of the 60 perps
    with a positive 168 h return). Placebo: 5 seeded N(0,1) columns, one draw per timestamp shared across symbols.'
  levers:
  - features
  map_entries:
  - research/levers/ml-entry.yaml
  attempt: 1
  due_by: '2026-12-01'
question: 'On the 8 dev folds (2022-01-01..2025-10-01, expanding refit of the registered recipe, tau 0.10, the 60-perp frozen universe), is
  the mean net R per decision of the recipe + REGIME_FEATURES at least +0.0068 above BOTH the recipe and the recipe + 5 noise columns,
  with a week-clustered t >= 2 vs the recipe, better in >= 6 of 8 folds and the same sign in >= 3 of 4 years?'
why_this_matters: 'ml_entry is the only ML leg on real money (bybit_2 + bybit_portfolio). Every ranked ENTRY lever so far has failed its
  held-out read and the lever map says the next one must ADD information. This is that information, chosen from the measured driver of
