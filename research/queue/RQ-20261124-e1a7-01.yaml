title: 'ml_entry REGIME-STATE lever: does adding 5 slow market-state columns (BTC 7d / 30d return, BTC vol percentile over 90d, BTC distance
  from its 50d mean, 7d breadth) to the registered recipe beat both the recipe and a 5-column noise placebo by +0.0068 R/decision on the
  dev folds, net of the full cost stack?'
