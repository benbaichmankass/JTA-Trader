question: Over the calendar window each pair covers, is the Pearson correlation of the daily realised net R of any passing 1b57-08 cell (AVAXUSDT
  228 trades, NEARUSDT 215, ETCUSDT 213, as declared, run 40544537821) with any of the six live crypto legs (ada_pullback_2h, xrp_pullback_2h,
  trend_donchian_eth_4h, trend_donchian_xrp_4h, trend_donchian_eth_prop, trend_donchian_sol_prop; committed corpora) above 0.30 in absolute value
  on at least 250 common days?
why_this_matters: 1b57-08 PASSED Stage 0 on basket B but is weak (pooled one-sided p 0.10, last fold -24.6 R, 3 of 6 cells pass). Before the prop
  EV/survival gate and a re-entry case, the passing cells must be shown to be a different bet from the live book; a cell that moves with ada_pullback_2h
  or the trend legs adds no diversification. PASS -> the prop EV/survival gate and a re-entry case under MD-PROMOTE-S0-S1 for the non-redundant
  cells (never a roster act). FAIL -> the named redundant cells are dropped from the candidate list.
power:
  expected_n: 3
  min_detectable_effect: 0.25
  effect_units: sd
  design: one_sample
  alpha: 0.1
  power: 0.8
  basis: 'Deterministic read of committed per-trade rows: 3 cells x 6 legs = 18 correlations, each over about 2,000 calendar days (MEASURED when
    the run lands). The power table is a PROXY: a correlation of 0.30 over 250 days has a standard error near 0.06, so the 0.30 bar is about 5
    SE from 0; INDETERMINATE below 250 common days or fewer than 2 cells with 4 legs.'
  feasibility:
