decision_rule:
  id: RULE-RQ20261119E6B2-01-SOL4H-B-OVERLAP
  registered_at: '2026-11-19'
  registered_before_run: true
  baseline: 'No baseline arm: a pairwise correlation read of each passing cell against each live leg; |corr| <= 0.30 reads as a different bet.'
  statistic: 'Per (cell, leg): Pearson correlation of the daily realised net R (a trade booked on its exit date, 0 on days without an exit) over
    the calendar window both cover, with the day count; also reported, not graded: the share of the cell''s trades overlapping an open same-direction
    trade of the leg.'
  rule: A cell is REDUNDANT with a leg iff |corr| > 0.30 on >= 250 common days. PASS iff no passing cell is redundant with any live leg. FAIL
    iff at least one cell is redundant with at least one leg (named in the result). INDETERMINATE iff fewer than 2 of the 3 cells have >= 250
    common days with at least 4 of the 6 legs. Thresholds, cells and legs are fixed now and not changed after any result.
  pass_action: register the prop EV/survival gate (prop_ev_grid) for the cells and a re-entry case under MD-PROMOTE-S0-S1 as a new evidence record;
    never a roster act.
  fail_action: drop the redundant cells from the candidate list and say so on the programme node; carry the others forward.
  what_it_does_not_do: Changes no config or roster, places no order, adds no gate. Daily-R correlation says nothing about drawdown overlap or
    the prop survival gate. ml_entry and the non-crypto legs are not read.
  min_n: 250 common days per pair; >= 2 cells with >= 4 legs
