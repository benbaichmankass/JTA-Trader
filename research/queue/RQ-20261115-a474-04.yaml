decision_rule:
  id: RULE-RQ20261115-a474-04-ENTRY-V1-FILTERS
  registered_at: '2026-11-15'
  registered_before_run: true
  statistic: 'scripts/research/ml_entry_v1_filters_read.py. Table = ml_decision_entry.build_table over ml_decision_entry.universe()
    (the frozen-60). FIXED ON DEV ROWS ONLY (ts < 2025-10-01), before the claim: vol24 cut = 1/3 quantile of dev vol24 (label-free);
    k = median over dev rows of mean(cost_long, cost_short) x atr_pct; estimated cost per R = k / atr_pct. CLAIM: holdout_lock.claim_read
    (model ENTRY-v1-frozen-vol24abstain-gate006, window 2025-10-01..2026-09-30, train_end 2025-09-22) BEFORE any held-out outcome;
    its returned bar grades the read (deflated: expected n_tries 12, point_t_min ~1.66). The served artifact''s long/short regressors
    score the held-out rows unchanged; a filtered bar is set to abstain (frees the symbol), then ml_decision_entry.policy at the
    artifact tau (0.10). Arms base / V (vol only) / G (gate only) / VG (both); net R at the table''s full cost stack
    (ml_decision_entry._cost_r: fee + slippage + funding). Reported, not graded: V, G, abstain shares, traded-five slice,
    by-month, by-side, exit reasons.'
  rule: 'Multiple-testing disclosure: the 12th ENTRY-family read overlapping this held-out year (11 prior in
    comms/research/holdout_reads.jsonl); the bar is deflated accordingly. The two filters were selected on dev folds only (b602-01,
    b606-01). PASS iff ALL on VG: (a) n >= 300 decisions and >= 10 symbols (ml_decision_entry N_FLOOR / SYMBOL_FLOOR); (b) mean net
    R clears the deflated point bar of the claim (holdout_lock.point_ok: mean >= point_t_min x SE); (c) mean net R >= base mean net R
    on the same window. INDETERMINATE iff (a) fails. FAIL otherwise. Thresholds are not changed after any result.'
  proposal_mapping: 'pass -> a HELD Tier-3 serving proposal for ml_entry (the two abstention thresholds, values from fixed_on_dev,
    on the served artifact; real-money and prop books), via the manager, disclosing the dev selection and this read. fail ->
    both dev candidates close for v1; MLP-D3-FOXHOUND-1 continues on the population test and the forward grade.
    indeterminate -> reported; no serving change.'
  what_it_does_not_do: 'Refits nothing, changes no config or served artifact, places no order. Grades VG only; V and G alone are
    reported and never promoted from this unit. The cutoffs are recomputed on this table''s dev rows (label-free), not copied from
    the levers table the dev runs used.'
  min_n: 300 held-out decisions
