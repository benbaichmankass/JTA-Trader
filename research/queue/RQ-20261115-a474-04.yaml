id: RQ-20261115-a474-04
title: 'ML-BAR-ONE-READ, ENTRY v1 (served, frozen): on the held-out year, does applying BOTH dev-fold lever candidates (vol24
  low-tercile abstention + cost-per-R gate 0.06) keep a mean net R per decision that clears the deflated bar AND is no worse
  than v1 as served?'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: experiment
question: 'Three ENTRY dev-fold lever units were hand-graded 2026-11-15 (PR #26252): b602-01 PASS (C_vol24_abstain_t0: +0.0133
  R/decision over base, 6/8 folds, 4/4 years), b606-01 PASS (gate_0.06: +0.0115..+0.0124, 6/8 folds, 3/4 years), b601-01 FAIL
  (bracket). Their rules route every winner into ONE combined held-out read. This is that read, on the model that actually
  serves: the frozen v1 artifact (ml/served/ml_decision_entry_v1, trained to 2025-09-22), unchanged, on its frozen-60 population
  over the held-out year 2025-10-01..2026-09-30, with both filters applied (VG), against v1 as served (base).'
why_this_matters: 'ml_entry trades real money (bybit_2 + bybit_portfolio) and three prop books. Both candidates are pure
  abstention rules (no refit), so a PASS is a cheap Tier-3 serving change (two thresholds on the served artifact); a FAIL closes
  both dev candidates for v1.'
