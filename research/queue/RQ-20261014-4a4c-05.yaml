id: RQ-20261014-4a4c-05
title: 'P4-Q2 cross-instrument: does the PPI m/m surprise predict ZN=F (10-year note future) forward returns at 3-5 trading days? (n~139)'
status: done
cadence: once
theme: macro
priority: 1
kind: experiment
question: Is Spearman(ppi_mom survey surprise, ZN=F forward return from the release-day close) negative with |t_eff| >= 2.4 at h=3 or h=5? A hot print should push yields up and note
  prices down if the ES drift is a rates channel.
why_this_matters: 'Parent: RQ-20261014-de02-04 PASSED 2026-10-14 (run 38605585550): ppi_mom survey surprise vs ES=F forward return, n=139 releases 2015-01-15..2026-09-10, IC h1 -0.183
  (t -2.17), h3 -0.281 (t -3.43), h5 -0.247 (t -2.98), expected negative sign. It was 1 PASS of 13 kinds x 3 horizons = 39 tests landed 2026-10-13/14; normal-approx two-sided p at t=-3.43
  is ~0.0006, under the BH rank-1 threshold 0.05/39 = 0.0013, so it survives the family read, but a single-sample IC on daily closes is a lead: stability, a placebo, a second instrument
  and a net-of-cost book are owed before it can feed a conviction axis (programme 04-MACRO-SLEEVE.md, Q2). The rates leg is the mechanism test: an ES drift with no rates drift points
  at an equity-specific or spurious channel; both together are the axis the sleeve''s TLT/IEF debit verticals could carry.'
power:
  expected_n: 139
  min_detectable_effect: 0.25
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 139 releases on file; floor 126 at d=0.25, CLEARED at the declared effect. Bar |t_eff| >= 2.4 as RQ-20261014-4a4c-04.
  feasibility:
    source: none
    accrual_basis: 'n is bounded by the resolved ppi_mom releases with a defined survey surprise on file (a fixed historical backfill, MEASURED 2026-10-14 with econ_event_study.load_resolved_events_multi
      over the two committed files: 139 total, 71 before 2021-01-01, 68 on/after; 118 with a non-zero surprise). Not an accrual: ~12 releases/yr add slowly; the run prints the joined
      count and a short join lands INDETERMINATE, never padded.'
decision_rule:
  id: RULE-RQ-20261014-4a4c-05
  registered_at: '2026-10-14'
  registered_before_run: true
  statistic: ic_t_eff at horizons 3 and 5 on ZN=F.
  rule: PASS IF at h=3 or h=5 with n >= 100, |ic_t_eff| >= 2.4 AND negative. FAIL IF both horizons have n >= 100 and neither does. INDETERMINATE IF a horizon has n < 100.
  what_it_does_not_do: As RQ-20261014-4a4c-04 (roll gaps unadjusted; not a P&L figure).
