id: RQ-20261127-c4e2-03
title: 'ml_entry CAPACITY / FAMILY lever: on the registered dev folds, does a BIGGER learner (LightGBM 2000 trees / 127 leaves, or XGBoost on GPU at
  depth 6 / 8 / 10) beat the registered 300-tree LightGBM recipe, net of cost?'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: experiment
origin: follow_up
practice_precedent: 'M3, M10 (docs/reference/trading-and-model-practice-principles.md): one lever per arm (only the capacity or family of the learner),
  graded against the registered recipe on the same folds; frontier-research family diversity. Applied per .claude/skills/drift-remediation/SKILL.md step 3: the diagnosed driver (c4e2-01: a model trained
  through 2025-09-22 losing -0.085 R/decision in 2026-11, longs -0.46 R, a side split far outside its dev history) becomes one lever unit.'
question: On the registered ml_entry dev folds (8 half-year folds 2022-01-01..2025-10-01, purge + embargo, tau 0.10, the harness cost stack), is mean
  net R per decision higher when each fold's two regressors are a bigger LightGBM (2000 trees, lr 0.01, 127 leaves, min_child 200) or XGBoost
  hist on CUDA (depth 6/600 rounds lr 0.05; depth 8/2000 lr 0.02; depth 10/3000 lr 0.01; subsample 0.8, colsample 0.8, min_child_weight 50,
  lambda 5) than with the registered 300-tree, 31-leaf LightGBM, same 20 features and rows?
why_this_matters: 'c4e2-01 (run 45976150814): the served v1, trained through 2025-09-22, made -0.085 R/decision on 2026-11-01..11-26 (n 867; traded
  bybit_2 n 87, -0.245), with longs at -0.462 (n 381) against +0.211 for shorts. On its own dev and held-out folds the two sides were near
  -0.02 / +0.02, and the side and regime arms are spent (f1a0-01/03, e1a7-01, d3a1-01 FAIL or INDETERMINATE). Untested beside staleness
  (c4e2-02): CAPACITY. The registered recipe is a small, heavily regularised LightGBM (300 trees, min_child 500); the frontier diversity check
  asks whether a deeper learner or another GBDT family extracts more from the same 20 features. TabICL is closed on a free T4 (7ab1-02 FAIL)
  and the GRU line is closed (9e73), so deeper GBDT is the next family on the GPU we have.'
