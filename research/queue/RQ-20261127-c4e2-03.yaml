  alpha: 0.05
  power: 0.8
  basis: 'alpha is the tabulated power-floor level (as f1a0-01); the per-arm family bar t >= 2.4943 (Sidak, k = 4) is enforced by the decision rule, so INDETERMINATE is a live outcome stated now. MEASURED on the same folds: f1a0-01 base arm n 72,996 and arm n 66,803 decisions over the 8 dev folds (run 45484674095). alpha = the
    one-sided Sidak per-arm level for 4 arms (t >= 2.4943). min_detectable_effect = LEVER_RULE min_delta_r (0.0068 R).'
  feasibility:
    source: none
    accrual_basis: Replays public Binance history fetched at run time; nothing accrues.
decision_rule:
  id: RULE-RQ20261127-c4e2-03-CAPACITY-ARMS
  registered_at: '2026-11-27'
  registered_before_run: true
  baseline: the registered expanding unweighted refit per fold (arm "base"), same features, tau 0.10, policy and cost stack
  statistic: 'per arm, ml_decision_entry.py lever_arms(): delta = mean net R (arm) - mean net R (base) over the pooled dev-fold decisions,
    week-clustered se; folds where the arm beats base; years with a positive yearly delta. No placebo: the arm changes only the learner, so
    the registered recipe IS the control.'
  rule: 'Each of the 4 arms is graded by LEVER_RULE (RULE-ML-ENTRY-LEVER-ARMS-20261124) with the family bar for 4 arms in one unit: PASS iff n
    >= 3000 AND delta >= 0.0068 R AND week-clustered t >= 2.4943 (one-sided Sidak for k = 4, alpha 0.025; the code sets min_t = max(2.0, this))
    AND the arm beats base in >= 6 of 8 folds AND the yearly delta is positive in >= 3 years. FAIL iff n ok and delta + min_t * se < 0.0068.
    INDETERMINATE otherwise. verdict.json carries the first arm; arm_verdicts carries all 4.'
  pass_action: 'The best PASSing arm (largest delta) gets ONE confirming read on disjoint out-of-time data (2025-10-01 onward, holdout_lock
    claimed, the deflated ENTRY bar) in its own unit; a pass there makes that learner the next ml_entry_retrain challenger, a data-backed
    Tier-3 replacement packet applied by the manager or a mandate, never by a lane.'
  fail_action: Close learner capacity / GBDT family for crypto ENTRY on research/levers/ml-entry.yaml (with TabICL and GRU already closed, the
    next family is a pretrained time-series encoder, frontier-gated); no re-run with other depths.
  proposal_mapping: pass -> confirming out-of-time read -> Tier-3 packet; fail -> lever closed; indeterminate -> report the realised se, stop.
  what_it_does_not_do: 'Promotes nothing. These are DEV folds, the window that chooses: a PASS only qualifies the chosen learner for ONE
    confirming read on disjoint data (out-of-time 2025-10-01 onward, holdout_lock claimed) in its own unit, and that read decides. No served
    artifact, roster or config changes here.'
