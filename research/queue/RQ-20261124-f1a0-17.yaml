id: RQ-20261124-f1a0-17
title: 'ml_entry PULLBACK LIMIT ENTRY: does entering the SL 4 / TP 6 refit''s own decisions by a post-only limit 0.5 ATR better (4 h, maker
  fee) beat the same decisions at market by +0.0068 R/decision, and beat random thinning to the same fill rate?'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
programme: P2
kind: experiment
iteration:
  subject: ml-entry
  subject_kind: ml_model
  from_result: RQ-20261124-f1a0-12/45505516869
  verdict_read: indeterminate
  diagnosis: 'Cost per R is the binding constraint on ml_entry (gross ~ +0.067 vs cost ~ 0.064 R/decision over 11 arms). Widening the bracket cut cost per R monotonically (SL 2 / 3 / 4 refits: +0.003 / +0.011 / +0.012 net) but no arm cleared the bar; regime soft-weighting f1a0-12 (run 45505516869) was INDETERMINATE (+0.0128, t 1.04) and beat its placebo by only +0.0033, so the regime lever is moving to sizing (f1a0-15) and routing (R2). The ENTRY ORDER is the untested cost term at this scale: a maker fill saves 3.5 bps of fee and 1.5 bps of slippage and buys 0.5 ATR (0.125 R at SL 4) of price, against the adverse selection 1c4e-01 found for a touch-peg entry (directional picks run away). This unit measures that trade-off on the model''s own decisions at the 1h scale.'
  search: 'lever family entry-execution, one fixed policy (no grid): limit 0.5 ATR14 better than bar t+1 open, 4 x 1h bars resting, strict
    fill 1 bp through, maker 2.0 bps entry + taker 5.5 bps exit; LGB_PARAMS, FEATURES and the SL 4 / TP 6 / 24 h labels unchanged.'
  levers:
  - entry
  map_entries:
  - research/levers/ml-entry.yaml
  attempt: 13
  due_by: '2026-12-01'
question: On the 8 dev folds, is mean net R per DECISION of the SL 4 / TP 6 / 24 h refit's decisions entered by a post-only limit 0.5 ATR14
  better than bar t+1's open (resting 4 h, strict fill, maker entry fee; an unfilled decision is 0 R) at least +0.0068 above the same decisions
  entered at market (week-clustered t >= 2, >= 6/8 folds, >= 3/4 years), AND at least +0.0068 above those market outcomes thinned at random
  to the arm's fill rate (100 draws)?
why_this_matters: Cost per R binds; the entry order is the remaining cost term, and a pullback fill also improves the price. The random-thinning
  control separates the fill's selection from mere trade reduction.
