decision_rule:
  id: RULE-ML-ENTRY-FIX-ARMS-20261124
  registered_at: '2026-11-24'
  registered_before_run: true
  baseline: the registered recipe on the same folds, rows, tau and cost stack
  statistic: 'scripts/research/ml_entry_fix_arms.py --arm lim_xwide (lim_labels): delta = pooled mean net R per decision (limit entry) - (same
    decisions at market, SL 4 / TP 6 refit) over the 8 dev folds; week-clustered influence se; folds/years vs the market entry; vs_control =
    arm - the market outcomes thinned at random to the arm fill rate (100 draws). Fill rate and filled-only net R reported per fold.'
  rule: PASS iff arm n >= 3000 AND delta(arm - market entry) >= +0.0068 AND t >= 2.0 AND delta(arm - random thinning) >= +0.0068 AND folds_better
    >= 6 of 8 AND years_positive >= 3 of 4. FAIL iff n >= 3000 AND delta + 2.0 se < +0.0068. INDETERMINATE otherwise. Fixed now.
  pass_action: Fresh-window confirmation (2025-10..2026-11, holdout ledger claim), then a data-backed Tier-3 entry-order proposal to the manager (applied
    by the operator or a mandate).
  fail_action: Record the 0.5 ATR / 4 h pullback limit closed; the next execution form is a fill-probability model (post a limit only when
    P(fill) x price gain exceeds the expected missed-winner cost), the D9 learned step.
  proposal_mapping: pass -> fresh-window confirmation (bars after 2025-10-01, holdout ledger claim, deflated bar) -> Tier-3 proposal to the manager
    with this evidence record; fail/indeterminate -> the next iteration authored from this diagnosis at once.
