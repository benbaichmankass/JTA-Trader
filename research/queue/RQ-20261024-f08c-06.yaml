id: RQ-20261024-f08c-06
title: 'Variant of level-trail 003 (level trail failed on trend_donchian_sol_prop): judge the PROP leg on drawdown at a bounded R cost'
status: done
cadence: once
roadmap:
- L-ATM
- M20
theme: live_strategy
priority: 1
kind: experiment
question: 'On trend_donchian_sol_prop (prop leg), does a swing or FVG level trail cut maxDD with a net-R give-up of at most 2 R over the window,
  in at least 3 of 6 folds, at the venue cost stack? DIAGNOSIS of the first test (003): MEASURED in RQ-20261022-003: LS / LF / LR dR -8.62 / -3.65
  / -28.16, maxDD 9.3 / 10.3 / 18.4 vs 12.1 (LS -23%, LF -15%), folds 3 / 3 / 1 of 6, trail_stop exits 223 -> 265 / 240 / 323. Same pattern as
  eth_prop: a drawdown trade-off the R-gain bar cannot score. Class: wrong objective for a prop leg (INFERRED) and wrong parameter region for
  the tight mult 1.75 (-8.6 R). This unit adds looser mults (2.5, FVG lookback 120) that the first test did not include.'
why_this_matters: 'Operator rule 2026-10-22: a first-test fail is diagnosed and re-asked, never retired. Lane EXIT-FAILED-LEVERS-DIAG (2026-10-24),
  row EXIT-FAILED-LEVERS-DIAG, serves 003. Diagnosis and evidence: docs/research/exit-failed-levers-diag-2026-10-24.md. Looked before authoring
  (PLANNING s1): the queue was grepped for the same leg and lever family; no queued or done unit asks this exact arm set. Parents: research/queue/RQ-20261022-003.yaml.'
power:
  expected_n: 400
  min_detectable_effect: 0.14
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'n = 400 is the MEASURED baseline trade count of trend_donchian_sol_prop in the parent verdict(s). Unpaired one-sample MDE = 2.8/sqrt(n)
    = 0.14 sd. Arms share most trades, so the paired difference is far tighter than that (MEASURED in the diag doc: paired sd 0.06-0.5 R per entry);
    the unit''s bar is stated in R and is not claimed to be detectable at the unpaired MDE. A unit whose lever touches a handful of trades is
    reported with its differing-trade count.'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-F08C-06
  registered_at: '2026-10-24'
  registered_before_run: true
  statistic: scripts/research/exit_lever_ablation.py --grade sweep on trend_donchian_sol_prop, window 2020-07-01 .. 2026-10-15 23:59, 6 calendar
    folds, dR and dDD vs A net of the harness venue-aware stack (fee 7.5 bps round trip, slippage 3.0 bps round trip, funding 1.0 bps per 8h window;
    MEASURED in the parent verdicts' cost_stack).
  rule: 'INDETERMINATE IF n(A) < 39. A candidate arm PASSES iff dR >= -2.0 R (net_r(C) - net_r(A) over the window) AND dDD <= 0 (maxDD(C) - maxDD(A),
    in R) AND it beats A in >= 3 of 6 folds. PASS IF any arm passes (best = highest dR): a LEAD, followed by ONE confirmation unit on a disjoint
    window with the same statistic and bar; only a confirmed pass becomes a Tier-3 PROPOSAL note on the owning checklist row, never a config edit.
    FAIL IF none passes with n(A) >= 39: this variant is closed on this window and the record names the arm that moved closest; the idea is not
    retired. Thresholds are fixed now and not changed after any result.'
what_it_does_not_do: 'Edits no config and places no order. Not a promotion case: a PASS is a discovery needing one disjoint-window confirmation.
  HARNESS CAVEAT (code-read 2026-10-24, scripts/backtest_pullback.py / backtest_trend.py): a stop or ratcheted trail that the bar trades through
  fills AT the stop price, not at a gap-open worse than it, and lever exits fill at the bar close; that flatters every arm in proportion to its
  stop exits, so it favours tight-trail arms. A PASS must be re-run gap-adjusted before any Tier-3 note. A drawdown cut is not a prop clearance:
  the firm DD simulation (comms/prop_survival) still applies after any lead.'
