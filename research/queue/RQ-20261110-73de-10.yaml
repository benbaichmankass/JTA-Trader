question: Does a swing-pivot structure exit (pivot 3, 5 or 8 bars), selected on the earliest ~75% of 2020-07..2026-10 and read once on the held-back span, beat the declared trend_donchian_sol_4h exit net
  of the full cost stack?
why_this_matters: 'Operator 2026-11-10 (throttle to the 11-11 reset): keep the queue filled from the authoring queue; drawn from node structure-exit coverage (programme 05 prop fit / 01 Q10 structure-trail
  lever). Look-before-you-re-test: the cell below has no unit in research/queue/ (grep of every exit_lever_ablation arm token per leg, 2026-11-10); prior units on the leg: structure-exit arms exist on ada/xrp
  pullback, eth_4h, xrp_4h, sol_prop, eth_prop; none on trend_donchian_sol_4h. MULTIPLE-TESTING DENOMINATOR: 3 arms on this leg, selected on discovery only, read once on the holdout.'
