  rule: Registered 2026-11-13 on row DEMO-FLOOR-ITER-20261113 before any run of this arm set (no arm was run on this window before registration). Each arm runs as
    its OWN Stage-0 run through exit_lever_ablation --grade stage0 on the same pinned window, feed and full cost stack (fee + slippage + funding from resolve_run_costs);
    timeframe_lever_grade.py grades them together. PASS iff some candidate passes its own Stage 0 (net_r > 0, n >= 30, >= 3/4 folds positive) AND its net_r exceeds
