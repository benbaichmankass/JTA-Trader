  the common weeks: is the participation-ratio effective number of independent bets N_eff at least 3.0,
  which pairs are same-bet (r >= 0.5), and which cell''s removal lowers the pooled weekly information
  ratio most?'
why_this_matters: 'Node P7-Q6-weekly-etf. ef5d-05 PASSED (LO pooled 127.7 R; BOTH also passed). The node
  requires the weekly arm''s per-symbol passes to be read as one bet before any count of passing cells
  is quoted: SPY/QQQ/QLD/TQQQ/IWM/SCHA are one equity-beta factor on priors, GLD/SLV/GDX one metals factor,
  IEF/TLT one rates factor, USO its own. Decision changed: PASS (N_eff >= 3.0) -> a re-entry case may
  carry at most floor(N_eff) weekly legs, one per same-bet cluster, the strongest per cluster named by
  the leave-one-out table, each needing its own holdout confirmation before a book; FAIL -> the weekly
  arm is at most two bets and a case carries at most one leg per the leave-one-out table. Cells fixed
  before the run by a rule that does not look at outcomes: every LO ETF cell with n >= the parent''s n_floor
  10; excluded: IAUM (n 7, under the floor), SPLG (not measured), and the futures proxies MES/MGC/MHG
  (the node rules them out as re-entry candidates from a Yahoo continuous series).'
why_not_inferential: 'A descriptive measurement on committed ledgers: N_eff >= 3.0 either holds or does
  not on these series; the edge question was ef5d-05''s.'
decision_rule:
  id: RULE-P7-Q6-WEEKLY-ETF-OVERLAP
  registered_before_run: true
  statistic: 'scripts/research/soak_equity_overlap.py on the twelve committed LO ledgers named in run.command:
    weekly (W-SUN) net R with each trade''s net_r spread evenly over entry..exit calendar days, common
    weeks only (expected ~2010-10..2026-01, ~790 weeks); N_eff = (sum lambda)^2 / sum lambda^2 of the
