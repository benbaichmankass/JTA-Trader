id: RQ-20261118-aadc-13
title: 'ml-exit-head-donchian-1h POPULATION WIDENING (4h legs): does the holding_pays_neg25 target, trained on the 1h BTC/ETH/SOL rows, beat the
  holding_pays champion by +0.01 R/trade on the five live 4h donchian legs, each replayed with its own parameters?'
status: done
cadence: once
roadmap:
- L-ML-LIVE
theme: ml_health
priority: 1
kind: experiment
iteration:
  subject: ml-exit-head-donchian-1h
  subject_kind: ml_model
  from_result: RQ-20261117-aadc-12
  verdict_read: pass
  diagnosis: aadc-12 PASSED on five held-out 1h perps (+0.0160 R/trade, CI [+0.0063, +0.0256], n 18,649; vs hold +0.026), after the aadc-11 dev
    pass. The retrain to neg25 for the three 1h legs is in flight under a data-backed manager GO. The head acts on no 4h leg today. The 4h donchian
    legs include real-money legs (trend_donchian_eth_4h, _xrp_4h), so an exit head that pays on them is the larger prize. Whether a head trained
    on 1h trade paths carries to 4h paths (bar-count features change meaning) is untested; a474-03 (a POOLED 4h head trained on 4h rows) failed,
    which does not answer it.
  search: 'none: arm (holding_pays_neg25), recipe, shape, folds, embargo and lookback fixed at aadc-12''s; only the TEST population changes (the
    five 4h donchian legs on their own config parameters); every training row stays from the 1h corpus'
  levers:
  - universe
  map_entries:
  - research/levers/ml-exit-head-donchian-1h.yaml#manifest.universe
  attempt: 6
  due_by: '2026-11-25'
question: Same recipe as aadc-12, ONE ARM (holding_pays_neg25) vs the holding_pays champion, trained per fold on the 1h rows.jsonl rows (BTC/ETH/SOL),
  tested on the 4h harness trades of trend_donchian_eth_4h, trend_donchian_sol_4h, trend_donchian_xrp_4h, trend_donchian_ada_4h and trend_donchian_avax_4h
  (each on its own strategies.yaml parameters). Is the paired per-trade replayed R >= +0.01 with a CI lower bound > 0?
why_this_matters: A pass is the evidence for a data-backed Tier-3 proposal to put the neg25 exit head on the 4h legs, two of them real money.
  A fail keeps the head on the 1h demo legs and records that the 1h trade-path label does not carry across timeframes.
evidence_class:
  holdout: walk_forward
  claim: model_quality
power:
  expected_n: 2000
  min_detectable_effect: 0.034
  effect_units: r_multiple
  sd: 0.535
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'sd MEASURED from aadc-11/12 (~0.535 R per trade on 1h). expected_n is an ESTIMATE: a 4h donchian leg trades roughly a quarter as often
    as a 1h leg (~1,100 harness trades, ~900 out of sample over 5 folds), so five legs give a few thousand at most if every leg has 4h candles
    on the trainer. At n 2,000 the z 1.96 half-width is ~0.023 R, so this unit is powered only for an effect near +0.03 R: a sub-bar positive
    mean is INDETERMINATE, stated before the run.'
  feasibility:
    source: none
    accrual_basis: Replays the trainer corpus (1h rows.jsonl) and trainer-resolved 4h candles; nothing accrues.
baseline:
  definition: The holding_pays champion (the shipped recipe, train_exit_head.FEATURES, unchanged hyper-parameters) retrained on the SAME fold
    training rows and replayed on the SAME OOS trades with the live predicate; each trade net of fee + slippage + funding. Hold (no head) is reported
    as context.
  net_of_cost: true
decision_rule:
  id: RULE-RQ20261118-aadc-13-EXITHEAD-NEG25-4H
  registered_at: '2026-11-17'
  registered_before_run: true
  baseline: the holding_pays champion on identical folds and trades
  statistic: 'scripts/research/exit_head_label_bakeoff.py --timeframe 4h --arms holding_pays_neg25 --z 1.96 --pass-dr 0.01: pooled over the five
    4h legs and 5 folds, per OOS trade d = replayed_r(neg25) - replayed_r(champion) on identical trades, replay and cost; mean, SE (one trade
    = one cluster), CI at z 1.96. Reported: per-leg read_state, each arm vs hold, firing counts, rows_by_symbol.'
  rule: PASS iff n_oos >= 1000 AND mean d >= +0.01 R/trade AND CI lower bound > 0. FAIL iff n_oos >= 1000 AND CI upper bound < +0.01. INDETERMINATE
    otherwise (n below 1000, or between the bars). A leg without 4h candles is producer_failed for that leg only. Thresholds, legs, arm, folds
    (5), embargo (7 d), lookback (500) and shape are not changed after any result.
  pass_action: 'A data-backed Tier-3 PROPOSAL to the manager: an exit head for the 4h donchian legs (a 4h-scoped artifact of the neg25 recipe,
    exit_head_model pinned per leg, exit_head_action close), demo legs first where the leg runs on both books; with this record.'
  fail_action: 'The 1h trade-path label does not carry to 4h paths; record the universe lever (timeframe) as flat for this head and keep it on
    the 1h legs. Next lever for 4h: a head trained on 4h rows with the neg25 label (a474-03 used the champion label).'
  what_it_does_not_do: Edits no config, registry, artifact or exit_head_action; promotes and demotes nothing. A PASS is an offline result under
    the head's own judge, then a confirmation, then a Tier-3 proposal. Places no order; adds no gate.
  min_n: 1000 pooled OOS trades; per fold MIN_FOLD_TEST_N test trades and the multifold training floor
practice_precedent: M1 (label what the decision is paid on; a trail-shaped label conflates the exit rule with the forecast), one-factor ablation
  against a baseline control (docs/reference/trading-and-model-practice-principles.md)
intervention_controls:
  hold_to_bracket: true
  hold_to_bracket_note: every arm keeps the leg's own entry, stop and trail; only the head's close decision differs, replayed by the live predicate
  matched_random:
    draws: 200
    note: 'not computed by this unit; the champion''s own matched random truncation control is RQ-20260927-002 / 78fc-03. Reported here as context
      only: hold (no head) per arm.'
  best_static:
    grid:
    - holding_pays (champion, fixed)
    - holding_pays_neg25 (fixed by aadc-11)
    excludes_test_folds: true
    note: each fold trains on rows with bar_t <= fold start - 7 d only; nothing is tuned on a test fold
  bootstrap_group: trade
compute: needs_vm_data
value:
  bucket: ai_trader
  usd_at_stake_per_month: 80
  confidence: 0.2
  basis: 'stand-in: one demo-floor leg acts on the head; the value is mainly the decision to retire or keep spending trainer time.'
