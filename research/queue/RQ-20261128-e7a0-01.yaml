id: RQ-20261128-e7a0-01
title: 'ITERATION 2 of ltr-partial-close (action_bounds): does banking THREE QUARTERS (not half) of the position at the first near-target / +1R trigger cut maxDD
  or weekly CVaR5 by >= 15% under RULE-AM-RISK-ADJUSTED-V1, at <= 0.05 R/trade, beating matched random-time banks?'
status: queued
cadence: once
theme: live_strategy
priority: 2
roadmap:
- L-ATM
programme: P1
kind: experiment
question: On the committed LTR Stage-0 corpora (8 legs, 3,921 trades, 6 calendar folds), does partial_close with --partial-frac 0.75 at the near_target or r_milestone
  trigger pass RULE-AM-RISK-ADJUSTED-V1 (R1 cost <= 0.05 R/trade, R2 maxDD or weekly CVaR5 cut >= 15%, R3 >= 4/6 folds, R4 beats >= 97.5% of 200 matched random-time
  books, L1 leg-drop)?
why_this_matters: 'ltr-partial-close is an ORPHAN (Manager 2026-11-28a drain). ed2b-01 (half bank) FAILED on R2/R3 only: R1 cost was fine (near_target -0.0005 R/trade,
  i.e. free) but the risk cut was too small (maxDD -8.3%, CVaR5 -6.2%, 0/6 folds). A bigger bank at the same cheap triggers is the direct lever on the clause that
  failed.'
iteration:
  subject: ltr-partial-close
  subject_kind: ltr_class
  from_result: RQ-20261113-ed2b-01
  verdict_read: fail
  diagnosis: 'ed2b-01: partial_close@near_target cost nothing (r_cost -0.0005 R/trade, R1 ok) but cut maxDD only 8.3% and weekly CVaR5 6.2% (R2 needs 15%) and held
    0 of 6 folds; r_milestone and stall failed the same clauses. Banking half is too small a cut to move the tails.'
  hypothesis: the class's cost is near zero, so a larger bank (0.75) at the same triggers can buy the >= 15% risk cut R2 asks for without breaking R1
  levers:
  - action_bounds
  attempt: 2
  due_by: '2026-12-05'
baseline:
  arm: hold
  definition: 'each corpus row''s recorded net_r: the leg''s own declared exit, untouched, net of the full cost stack (fee 11 bps round trip + slippage + funding
    per window, as recorded per row by the corpus harness)'
  source: comms/strategy_evidence/ltr_corpus/<leg>__trades.jsonl
power:
  expected_n: 4076
  min_detectable_effect: 0.05
  effect_units: metric
  sd: 0.5
  design: paired
  alpha: 0.05
  power: 0.8
  basis: INFERRED as ed2b-01 (4,076 committed corpus trades counted 2026-11-13; hold net_r sd 1.47 R measured; paired action - hold difference assumed ~0.5 R). At
    alpha 0.025 (Bonferroni over 2) and power 0.8 a paired mean difference of ~0.023 R/trade is detectable, below the 0.05 R R1 bar. POWER-BLOCK ALPHA 0.05 is declared
    because research_queue tabulates only 0.10 / 0.05 / 0.01; the RULE grades at the Bonferroni bar 0.975, unchanged.
  feasibility:
    source: none
    accrual_basis: Replays committed corpora and candles; nothing accrues.
decision_rule:
  id: RULE-RQ20261128-e7a0-01-LTR-PARTIAL-075
  registered_at: '2026-11-28'
  registered_before_run: true
  statistic: 'Over the pooled committed Stage-0 per-trade corpora in comms/strategy_evidence/ltr_corpus (8 legs, 4,076 trades; each row''s net_r already net of fee
    + slippage + funding), per pre-registered trigger T in {r_milestone, near_target, stall} (config/live_trade_review.yaml due.events thresholds, first CLOSED bar):
    the book with partial_close 0.5 at the open of the bar after T fires (the rest keeps the recorded exit, brackets unchanged) vs the HOLD book (recorded net_r),
    against 200 matched random-time books (the same partial at a uniformly drawn bar of the same trade, on the same trades).'
  rule: 'RULE-AM-RISK-ADJUSTED-V1 (am_risk_adjusted.grade_risk_adjusted, V1 parameters: R1 r_cost <= 0.05 R per baseline trade; R2 maxDD cut >= 15% OR weekly-CVaR5
    cut >= 15%; R3 >= 4 of 6 calendar folds hold; n_floor 39) with R4 vs 200 matched random-time books, plus L1: a pass must keep r_cost <= 0.05 R/trade after dropping
    the leg with the largest favourable contribution. Multiple comparisons: this unit grades 2 pre-registered trigger candidates, so R4 uses min_control_beat_frac
    0.975 (1 - 0.05/2, Bonferroni) and the reported edge CI is at 1 - 0.05/2. PASS: at least one candidate clears R1-R4 and L1 (a SCREEN pass, graduation_eligible
    false until BOOK-SIM-REAL-SIZER; a Tier-3 proposal input, never an apply). FAIL: every candidate fails a necessary clause (R1, R2 or R3) or is beaten by its random
    control (R4). INDETERMINATE: anything else (under the n floor, never fired, carried by one leg, or no_data). Fixed now; not changed after a run. Same harness
    and corpora as ed2b-01; only the action bound and the trigger subset change.'
  what_it_does_not_do: 'Advice-only research: serves, promotes or applies nothing; adds no gate; changes no config, mandate or roster; places no order.'
  fail_action: 'Record partial_frac 0.75 as tested (action_bounds) on research/levers/ltr-partial-close.yaml; next: timing (a later trigger), never this setting again.'
  pass_action: ONE confirmation on a disjoint corpus (twin legs) before any advice-standing proposal; no apply authority follows.
practice_precedent: 'T1 (docs/reference/trading-and-model-practice-principles.md): an intervention is graded against a matched random-intervention control in the
  same trade, net of the full cost stack, per class (RULE-AM-RISK-ADJUSTED-V1); the design copies LTR-TRIGGER-CLOSE-S0 (comms/research/ltr_trigger_close_s0/PREREGISTRATION.md).'
compute: cpu_light
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 4.0
  est_minutes: 60
  basis: 'Estimate: 4,076 trades x 3 triggers x 200 random books on CPU; the first run replaces it.'
  why_runner: Replays committed corpora and candles on CPU.
value:
