question: 'Operator idea ''once a trade passes a certain R the stop turns into a tight trail'': on trend_donchian_eth_prop, does an R-ARMED tight trail (peak >= 1.5
  / 2.0 / 3.0 R -> 3.5 x ATR) beat the declared exit A by >= 0.02 R/trade in >= 5 of 6 folds within the drawdown bar?'
why_this_matters: 'eth_prop declares a 1.8 x ATR decay tighten at stall and an arm at 2.99 R; this asks a looser 3.5 x multiple, the prop DD limits make give-back
  the binding cost. First R-armed read on trend_donchian_eth_prop; the same question on ada_pullback_2h is RQ-20261022-eba2-03. The live producer for the lever exists
  (src/runtime/trail_decay.py), so a PASS has a short path to a Tier-3 declare proposal; a FAIL closes only these three arms at this multiple. Lane RESEARCH-AUTHOR-1025PM
  (research runnable floor: 43 runnable vs computed floor 65 at the 14:47Z research-ops pass 2026-10-25, record comms/research/ops/). Operator 2026-10-22: an idea
  that failed one test is not dead; it failed the first test.'
power:
  expected_n: 180
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d=0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo standing E35 floor). expected_n=180 is an ESTIMATE from sibling units on this leg/window, not
    a measurement; below 39 the unit grades indeterminate, never FAIL.
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ20261025394713-RARMED
  registered_at: '2026-10-25'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg trend_donchian_eth_prop --grade replace, window 2020-07-01 .. 2026-10-15 23:59, 6 equal calendar folds
    by entry time, net of the full cost stack the harness resolves per venue (cost_stack recorded per arm). Arms fixed now: A = the leg as declared; T15 / T20 / T30
    = --trail-decay-arm-r 1.5 / 2.0 / 3.0 with --trail-decay-tight-mult 3.5. Per arm: n, net_total_r, max_drawdown_r, net R per fold.'
  rule: 'INDETERMINATE IF n(A) < 39, or IF every C arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C) > net_r(A) AND delta >= 0.02
    R x n(A) AND folds_ge >= 5 of 6 AND maxDD(C) <= maxDD(A) x 1.35. PASS IF one or more pass: the best by net R is named, and the follow-up is ONE confirmation unit
    on a disjoint partition with the same statistic and bar (a PASS on one window is a discovery; the denominator is 3 arms), never a config edit. FAIL IF none passes
    with n(A) >= 39: the declared exit stands against these three arms at this multiple; the family is NOT retired (next variants: a different multiple, a time-in-trade
    arm, a path-state gate).'
  what_it_does_not_do: Edits no config and no roster, places no order, is not a promotion case. A prop-leg PASS goes through the prop EV/survival gate in its own
    PR; the arm grid is the whole search and is not widened after the run.
