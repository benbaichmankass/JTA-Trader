id: RQ-20261024-f08c-10
title: 'Variant of eba2-14 (banking failed on trend_donchian_eth_prop): the farthest rungs (4-5 R), small size'
status: queued
cadence: once
roadmap:
- L-ATM
- M20
theme: live_strategy
priority: 3
kind: experiment
question: 'On trend_donchian_eth_prop (prop leg, finite 6R target), does a 15-25% bank at 4.0/5.0 R replace the declared exit on net R in 5 of
  6 folds over 2020-07..2026-10, at the venue cost stack? DIAGNOSIS of the first test (eba2-14): MEASURED in RQ-20261022-eba2-14: P25 (3.0 R)
  / P33 (2.0 R) / PT dR -3.07 / -14.24 / -31.32, folds 1 / 0 / 1, and maxDD 23.4 / 23.2 vs 22.0 (banking did not cut drawdown). MEASURED from
  the A-arm trade file: of 70 trades reaching 3.0 R, 0% finished more than 1 R below that mark (mean net +2.90 R), and no stop exit ever reached
  1 R (the leg''s losers are its stops, its profit is the trail). The monotone move toward zero as the rung rises (-14.2 at 2.0 R, -3.1 at 3.0
  R) supports class: genuinely no effect at this design; this unit extends the rung to 4-5 R to test that: if a far bank is still <= 0 the cell
  is closed on this window.'
why_this_matters: 'Operator rule 2026-10-22: a first-test fail is diagnosed and re-asked, never retired. Lane EXIT-FAILED-LEVERS-DIAG (2026-10-24),
  row EXIT-FAILED-LEVERS-DIAG, serves eba2-14. Diagnosis and evidence: docs/research/exit-failed-levers-diag-2026-10-24.md. Looked before authoring
  (PLANNING s1): the queue was grepped for the same leg and lever family; no queued or done unit asks this exact arm set. Parents: research/queue/RQ-20261022-eba2-14.yaml,
  research/queue/RQ-20261023-a1f3-04.yaml.'
power:
  expected_n: 1085
  min_detectable_effect: 0.09
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'n = 1085 is the MEASURED baseline trade count of trend_donchian_eth_prop in the parent verdict(s). Unpaired one-sample MDE = 2.8/sqrt(n)
    = 0.09 sd. Arms share most trades, so the paired difference is far tighter than that (MEASURED in the diag doc: paired sd 0.06-0.5 R per entry);
    the unit''s bar is stated in R and is not claimed to be detectable at the unpaired MDE. A unit whose lever touches a handful of trades is
    reported with its differing-trade count.'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-F08C-10
  registered_at: '2026-10-24'
  registered_before_run: true
  statistic: scripts/research/exit_lever_ablation.py --grade replace on trend_donchian_eth_prop, window 2020-07-01 .. 2026-10-15 23:59, 6 calendar
    folds, net_r per arm net of the harness venue-aware stack (fee 7.5 bps round trip, slippage 3.0 bps round trip, funding 1.0 bps per 8h window;
    MEASURED in the parent verdicts' cost_stack); baseline A = the leg as declared.
  rule: 'INDETERMINATE IF n(A) < 39, or IF every C arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C) > net_r(A)
    AND delta >= 0.02 R x n(A) AND folds_ge >= 5 of 6 AND maxDD(C) <= maxDD(A) x 1.35. PASS IF one or more pass: the best by net R is named and
    the follow-up is ONE confirmation unit on a disjoint partition (a PASS on one window is a discovery), never a config edit; before any Tier-3
    proposal the winner is re-run with stop fills gap-adjusted (see what_it_does_not_do). FAIL IF none passes: the declared exit stands for THESE
    arms on this leg; the idea is not retired (the operator''s 2026-10-22 rule) and the diagnosis in this unit decides the next variant. Thresholds
    are not changed after any result.'
what_it_does_not_do: 'Edits no config and places no order. Not a promotion case: a PASS is a discovery needing one disjoint-window confirmation.
  HARNESS CAVEAT (code-read 2026-10-24, scripts/backtest_pullback.py / backtest_trend.py): a stop or ratcheted trail that the bar trades through
  fills AT the stop price, not at a gap-open worse than it, and lever exits fill at the bar close; that flatters every arm in proportion to its
  stop exits, so it favours tight-trail arms. A PASS must be re-run gap-adjusted before any Tier-3 note. '
