  - --start
  - '2023-10-13'
  - --end
  - 2026-10-11 20:00
  - --control
  - B=comms/strategy_evidence/runs/2026-10-12-1095d/trend_donchian_eth_4h__bt.json
  - --control-tol-n
  - '0.02'
  - --control-tol-r
  - '0.5'
  - --grade
  - sweep
  - --baseline
  - B
  - --delta-r
