id: RQ-20261102-8ef8-02
title: 'PROP STRUCTURE EXITS (programme 05): does a swing-structure trail (--trail-level swing) on trend_donchian_sol_prop beat the config-exact exit at the prop venue stack, 1110 d? Arms P / SW15 / SW10
  / SW15R1; feeds the prop gate per arm'
status: done
cadence: once
kind: experiment
theme: new_strategy_prop
priority: 1
roadmap:
- L-PROP
question: On trend_donchian_sol_prop (config-exact, prop stack fee 8 / slip 3 / funding 5 per 24h, 2023-10-13..2026-10-11 20:00), does tightening the trail to a multiple of ATR once price touches the prior
  confirmed swing extreme (the harness's structure-based dynamic exit, --trail-level swing) raise net R over the window? The arms' trade books are the inputs of the per-arm prop gate nodes P5-SX-GATE-*
  (RULE-P5-GATE-BRK-PER-LEG-V3).
why_this_matters: 'Operator 2026-11-02 15:58Z verbatim: "I also want to check applying strucure dynamice based exits for props this week if we can". --structure-exit (STRUCTURE-EXITS-DEFAULT, PR #22281)
  has not landed (scope + queue only), so the existing swing-level trail lever is the structure exit measured here. Prop legs clear a SUPERSET (OPERATING-PLAN § 2): this Stage-0 read is necessary, the V3
  prop gate decides.'
power:
  expected_n: 200
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: RQ-20261015-1bf3-06 measured the same leg and window; n floor 39 is the Stage-0 grade floor, the gate needs n>=88.
  feasibility:
    source: none
    accrual_basis: Re-measure of committed price history; nothing accrues.
evidence_class:  # EVIDENCE-CLASS-BACKFILL 2026-11-11, rule E2 (scripts/research/backfill_evidence_class.py)
  holdout: in_sample
  claim: edge
decision_rule:
  id: RULE-RQ-20261102-8ef8-02-STRUCT-SWEEP
  registered_at: '2026-11-02'
  registered_before_run: true
  statistic: net_total_r over the window, n, and net_r per each of 4 equal calendar folds, for arm P (config-exact at the prop stack) and each structure arm SW15, SW10, SW15R1 (exit_lever_ablation.py --grade
    sweep, baseline P, delta-r 0).
  rule: PASS IF at least one structure arm has n >= 39, net_total_r above arm P, and net R above P in at least 3 of 4 folds -> a structure exit beats the config-exact exit at Stage 0 (an input to the prop
    gate, NOT a promotion). FAIL IF no arm does with every arm n >= 39. INDETERMINATE IF an arm has n < 39. Three structure arms were registered together, so a PASS is read as one of three tries (no multiplicity
    correction is claimed). Every arm, pass or fail, is graded by the V3 prop gate through P5-SX-GATE-* regardless of this verdict.
  what_it_does_not_do: Changes no roster, params, exits or risk. Is not the prop gate and does not clear it.
