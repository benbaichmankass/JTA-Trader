  min_n: 39
  statistic: 'scripts/research/exit_lever_ablation.py --leg trend_donchian_sol --grade replace, baseline B = the leg as declared in config/strategies.yaml (config-exact argv from regime_debt_matrix.build_harness_cmd),
    20 candidate arms fixed now: trail_mult {2.5, 3.0, 3.5, 4.0} (declared 5.0); tp_r {3, 4, 6, 8} R through the live capped-TP formula (declared 50 = no predictive TP); giveback stop armed at 1.0 R MFE
    with giveback_r {0.5, 0.75, 1.0, 1.5} R; trail_decay_arm_r {1.0, 2.0, 3.0, 4.0} R with tight mult 2.5; partial bank of 0.5 of the position at bank_at_r {1.0, 1.5, 2.0, 3.0} R. One lever moved per arm,
    every other key as declared (20 candidates + B). trail_decay is not declared on this leg (one prior point, arm 1.5 / tight 2.5, ed1c family). SOLUSDT 1h, 2020-07-01..2026-10-15 23:59, 6 equal calendar
    folds by entry time, net of the venue-aware cost stack the harness resolves (fee 11 bps rt incl. taker, slippage 3 bps rt, funding 1 bps per 8h window, recorded per arm as cost_stack). Per arm: n, net_total_r,
    max_drawdown_r, net R per fold, tp_doctrine reach, lever_fired.'
  rule: 'Registered 2026-11-19 by ML-PRIMARY-13 BEFORE any run of the grid. A candidate C REPLACES B iff net_r(C) > net_r(B) AND net_r(C) - net_r(B) >= 0.03 R x n(B) AND folds where net_r(C) >= net_r(B)
    >= 5 of 6 AND maxDD(C) <= 1.35 x maxDD(B). Several pass -> the highest net R is SELECTED. MULTIPLICITY: 20 candidates per leg (60 across the three units), so the bars are STRICTER than the single-arm
    RULE-STRUCTURE-EXITS-V1 family (0.02 R/trade, 4 of 6): 0.03 R/trade and 5 of 6, fixed now. PASS = a SELECTION, unconfirmed: it supports nothing on the order path until the selected arm alone passes
    a confirmation registered now: exit_lever_ablation --grade paired (selected vs B) on the disjoint pre-window 2017-09-01..2020-06-30 for BTC/ETH (paired mean dR > 0 with |t| >= 2.0 and >= 3 of 4 folds),
    and for SOL (Binance 1h history starts 2020-08) the same selected setting must also pass on the ETH and BTC confirmation windows. FAIL = no candidate passes at n(B) >= 39: these 20 settings are closed
    on this leg and window (honest negative for the configurations tested; the lever families stay open, and the D8 head work proceeds against this measured floor). INDETERMINATE if n(B) < 39 or the B arm''s
    argv differs from the declared config. Reported, never graded: per-lever shape over its 4 values (monotone / peaked / flat), each arm''s lever_fired, long vs short net, and the MFE-capture decomposition
    of B by scripts/research/exit_census.py on B__trades.jsonl. Thresholds, arms and window are not changed after any result.'
  what_it_does_not_do: Edits no config, roster or order path; grants no exit model close authority; a PASS is a selection for a confirmation, not a declare.
