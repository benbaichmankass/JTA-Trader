id: RQ-20261119-2780-02
title: 'D8 give-back: registered static exit grid on trend_donchian_sol (5 exit levers x 4 values, one lever per arm) vs the declared exit, 2020-07-01..2026-10-15, net of the full cost stack'
status: done
cadence: once
kind: experiment
theme: live_strategy
priority: 1
roadmap:
- L-ML-LIVE
programme: P1
practice_precedent: 'T1/T3 (docs/reference/trading-and-model-practice-principles.md): one setting per arm against the declared exit on the same entries and cost stack; a grid winner is a SELECTION that
  needs an out-of-window confirmation (M13) before any declare.'
question: On trend_donchian_sol (SOLUSDT 1h), over 2020-07-01..2026-10-15 (the abab/b2f2 window), does any single static exit setting in the registered grid -- trail_mult {2.5, 3.0, 3.5, 4.0} (declared
  5.0); tp_r {3, 4, 6, 8} R through the live capped-TP formula (declared 50 = no predictive TP); giveback stop armed at 1.0 R MFE with giveback_r {0.5, 0.75, 1.0, 1.5} R; trail_decay_arm_r {1.0, 2.0, 3.0,
  4.0} R with tight mult 2.5; partial bank of 0.5 of the position at bank_at_r {1.0, 1.5, 2.0, 3.0} R. One lever moved per arm, every other key as declared (20 candidates + B). -- replace the declared exit
  by the registered bar (net R per trade >= +0.03 R over B, >= 5 of 6 calendar folds at least as good, max drawdown within +35% of B), net of the full cost stack?
why_this_matters: 'D8 give-back (PI-20261119-RIMARY12-0004; manager 2026-11-19: ''that''s where the money is''). RQ-20261118-04a5-04 (run 44572560928) measured that closing the same number of trades at
  RANDOM points recovers 4-7x the R the neg25 exit head recovers on every cell (ETH 951.8 vs 143.6 at p95; SOL 416.2 vs 59.7; BTC 169.6 vs 19.8), so these legs hand back a lot of open profit after entry.
  The lever maps (research/levers/<leg>.yaml, read 2026-11-19) show the exit levers that act on give-back were never swept on these legs: trail_mult has only ever run at 5.0, tp_r only at the 50 R sentinel,
  giveback_r and bank_* were never tested, and trail_decay has one point. If a static setting captures the give-back, it is a cheaper, auditable exit than any head; if none does, the head work (per-symbol
  heads, --features extended, sequence model) is justified on a measured floor.'
