question: 'On rows rebuilt in-run from public Binance-Vision USD-M perp 1h klines (2020-06 to now) for BTC, ETH, SOL, LINK, BNB, XRP, ADA and AVAX (harness trades of trend_donchian on
  each symbol, full venue cost policy, no journal rows), 3 folds, 7-day embargo, lookback 500: is the pooled paired per-trade replayed R of feat_exh vs the champion >= +0.03 R with the
  CI lower bound > 0, and is pooled n_oos >= 8,200?'
why_this_matters: 'RE-SOURCE of RQ-20261122-fa22-02, which produced no trades because api.bybit.com returned HTTP 403 to the GitHub runner for every symbol (MEASURED, run 45015557842;
  read_state producer_failed, never a result). The harness already supports `--candle-source binance_vision` (globally reachable public archive). ONE factor changes: the candle feed.
  Everything the rule registered on 2026-11-22 is unchanged: arm feat_exh vs the holding_pays champion, 8 symbols, 3 folds, +0.03 R pass bar. HONEST LIMIT: Binance USD-M perp klines
  are not the Bybit venue the legs trade, and the basis vs Bybit is NOT measured (the harness says so in its population line), so a PASS is a lead for the trainer-resident build (fa22-03),
  not a ship decision. The corpus-widening test of row ML-EXITHEAD-CORPUS-WIDEN on public market data, available now: it measures the n an 8-symbol multi-year backtest corpus reaches
  (the trainer build fa22-03 is the live-aligned twin) and reads the contrast at that n. The result de-risks ad6a-03.'
evidence_class:
  holdout: walk_forward
  claim: model_quality
power:
  expected_n: 8200
  min_detectable_effect: 0.03
  effect_units: r_multiple
  sd: 0.97
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: n ESTIMATED from the f1a9-04 trade rate (pooled n_oos 2,403 over 8 legs x 3 folds; the span of that corpus is not stated in the record); multi-year backtest rows are expected
    to reach the 8,200 needed for MDE 0.03 (80% power, sd 0.97 MEASURED), the run measures the actual n. MDE (1.960+0.842) x 0.97 / sqrt(8200) = 0.030.
  feasibility:
    source: none
    accrual_basis: Replays history; nothing accrues. n is the corpus size the run measures; a run below the rule's n floor is INDETERMINATE, not a verdict.
baseline:
  definition: The holding_pays champion (the shipped recipe, train_exit_head.FEATURES, unchanged hyper-parameters) retrained on the SAME fold training rows and replayed on the SAME OOS
    trades with the live predicate; each trade net of fee + slippage + funding. Hold (no head) is reported as context.
  net_of_cost: true
decision_rule:
  id: RULE-RQ20261125-11d7-12-EXITHEAD-FEATURES-WIDE-BV
  registered_at: '2026-11-25'
  registered_before_run: true
  baseline: the holding_pays champion on identical folds and trades
  statistic: 'exit_head_label_bakeoff.py (via the driver) --arms none --feature-arms feat_exh --z 1.96 --pass-dr 0.03: pooled over legs and folds, per OOS trade d = replayed_r(arm) -
    replayed_r(champion) on identical trades, replay and cost; mean, SE (one trade = one cluster), CI at z 1.96. One arm graded (denominator 1). Reported: per-leg n_oos, target_coverage,
    fired counts, rows_by_source / corpus facts.'
  rule: An arm is could_not_look if target_coverage < 0.90. PASS iff pooled n_oos >= 1500 AND mean d >= +0.03 R/trade AND CI lower bound > 0. FAIL iff pooled n_oos >= 8200 (the n at
    which +0.03 is resolvable at sd 0.97, 80% power) AND CI upper bound < +0.03. INDETERMINATE otherwise; the verdict then reports n_oos and the n still needed. Thresholds, legs, arm,
    folds, embargo, lookback and rows source are not changed after any result.
  pass_action: ONE confirmation before any proposal (the held-out-symbol design or a disjoint window), then a data-backed Tier-3 proposal (export + annotate-only pin) to the manager.
  fail_action: Record feat_exh as tested at power on research/levers/ml-exit-head-donchian-1h.yaml (features family); the head has no in-hand feature lever at +0.03 R on donchian 1h
    and the next step is the family review, never a re-run.
  what_it_does_not_do: Edits no config, exports or serves nothing, places no order, adds no gate. No close authority for any exit model. Backtest-source rows are a different population
    from the trainer live-aligned corpus (stated in the result). Thresholds are copied unchanged from RULE-RQ20261122-fa22-02-EXITHEAD-FEATURES-WIDE; the feed is the only change; it
    does not measure the Binance-vs-Bybit basis.
practice_precedent: 'Size the test to the decision: a pre-registered minimum effect with power computed from the measured variance, rather than a bar the data cannot reach (docs/reference/trading-and-model-practice-principles.md).'
