id: RQ-20261016-1fa6-01
title: 'Positive control for the macro family: does the NFP survey surprise move ZN=F (10y note future) on the RELEASE DAY (prior close -> release-day close), with
  the documented negative sign?'
status: done
cadence: once
theme: macro
priority: 1
kind: experiment
question: 'All 14 macro survey-surprise units (2026-10-13/14) measured POST-release drift: base bar = the release-day close, and every kind prints 12:30-19:00 UTC,
  so the announcement reaction sat INSIDE the base bar and was excluded. This asks the question the literature says is answered: a positive payrolls surprise lowers
  Treasury prices the same day. If our PIT consensus + join are sound, this should PASS.'
why_this_matters: A negative needs a denominator (RULE ONE). 13 FAILs were never checked against a test that should pass; if the strongest documented bond reaction
  (NFP) does not show up in our instrument at the daily release-day window, the consensus data or the join is suspect and the 13 FAILs are not evidence about the
  idea.
power:
  expected_n: 140
  min_detectable_effect: 0.25
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'Unit = one release with a defined survey surprise. nfp: 294 snapshot rows across both files; ~140 resolved releases with a survey surprise (de02-02 joined
    n=140 on ES=F). Floor (1.96+0.84)^2/0.25^2 = 125 at d=0.25. The bar is the harness''s overlap-free t >= 2.4 (h=1 has no overlap), stricter than the floor''s alpha.'
  feasibility:
    source: none
    accrual_basis: Fixed historical backfill of resolved releases (comms/macro/econ_calendar_snapshots*.jsonl); nothing accrues. A short price join lands INDETERMINATE,
      never padded.
decision_rule:
  id: RULE-RQ-20261016-1fa6-01
  registered_at: '2026-10-16'
  registered_before_run: true
  statistic: 'macro_event_study_run.py grade(): Spearman IC of the survey surprise vs the h=1 forward return with --anchor-shift-td -1, i.e. the return from the close
    BEFORE the release day to the release-day close (verified 2026-10-16: shift_anchor moves the base bar one trading row back, make_forward_return reads the close
    one row later). n, ic, ic_t_eff.'
  rule: 'PASS IF n >= 100 AND ic_t_eff >= 2.4 in magnitude with the expected sign (negative). FAIL IF n >= 100 and not PASS. INDETERMINATE IF n < 100. no_data / producer_failed:
    a route fault, not a verdict. Bars are not changed after any result.'
  what_it_does_not_do: 'Not a tradeable book: the release-day window starts at the PRIOR close, before the print, so it measures the announcement reaction, which
    is not capturable at daily-close granularity (an intraday entry needs row MACRO-INTRADAY-EVENT-STUDY). It does not re-open the 13 post-release-drift FAILs by
    itself; it is the positive control that says whether those negatives had a working instrument. No config, no leg.'
compute: cpu_light
value:
  bucket: information
  usd_at_stake_per_month: 60
  confidence: 0.3
  basis: 'stand-in: decides whether the macro survey-surprise family (14 units, 13 FAIL) was tested with a working instrument; information value, not a P&L claim.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 1.0
  est_minutes: 10
  basis: Same shape as RQ-20261014-de02-04 (one daily-close fetch, a few hundred snapshot rows).
  why_runner: public yfinance daily closes + committed snapshots; minutes of CPU, no trainer data, no GPU shape.
