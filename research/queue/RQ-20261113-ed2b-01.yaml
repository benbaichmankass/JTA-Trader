stated_biases:
- the hold arm is the corpus harness's recorded exit; the action arms replay on committed candles from the action bar, so a leg's own trail path
  after the action is not modelled except through its recorded exit
- a replayed stop fills at its level (a gap fills at the open), which flatters stop-based actions
- triggers are evaluated on bar closes, live on telemetry passes
- 8 legs; trend_donchian_eth_prop is 1,182 of 4,076 trades, so L1 (drop the best leg) is a pass condition
what_it_does_not_do: 'Advice-only research: serves, promotes or applies nothing; adds no gate; changes no config, mandate or roster; places no
  order.'
