id: RQ-20261113-ed2b-01
title: 'ITERATION 1 of ltr-partial-close (pending, n=0 live): does banking half the position at the first +1R / near-target / stall trigger clear
  RULE-AM-RISK-ADJUSTED-V1 vs hold and vs a random-time partial, on the Stage-0 corpus?'
status: queued
cadence: once
theme: live_strategy
priority: 2
roadmap:
- L-ATM
programme: P1
kind: experiment
question: Over the committed Stage-0 per-trade corpora, does partial_close 0.5 at the first r_milestone, near_target or stall trigger cut book
  risk at <= 0.05 R/trade net of cost, and beat the same partial at a random bar of the same trade?
why_this_matters: 'ltr-partial-close is an orphan: no live iteration unit (scripts/research/iteration_orphans.py, 2026-11-13), verdict pending
  since LTR-CLASS-GRADE closed. docs/ARCHITECTURE-CANONICAL.md § Active management: each action class stays advice-only until its own net-of-cost
  test passes, so a class with no test can never graduate or be retired on evidence.'
iteration:
  subject: ltr-partial-close
  subject_kind: ltr_class
  from_result: comms/research/ltr_class_grade/verdict.json
  verdict_read: pending
  diagnosis: 'comms/research/ltr_class_grade/VERDICT.md: 1 partial_close call in 318 live review rows and 0 priced (the trade was open), so the
    class reads INDETERMINATE n=0 and live calls will not accrue fast enough to grade it. No offline arm existed: LTR-TRIGGER-CLOSE-S0 graded
    only a FULL close (552 packages; the profit triggers beat a random close but never hold), and live_review_outcomes.py prices a partial only
    per open trade at one conditional state, never as a class over a corpus with a random-time control. With brackets unchanged a partial is linear
    in the close arm (f x close), so what this test adds is the RISK cut V1 credits, on 4,076 Stage-0 trades instead of 552 live packages.'
  hypothesis: scaling out half at +1R, near the target or on a stall cuts the book's maxDD or weekly CVaR5 by >= 15% for <= 0.05 R/trade, and
    its timing beats a random partial in the same trade
  attempt: 1
  due_by: '2026-11-20'
  map_entries:
  - research/levers/ltr-partial-close.yaml
baseline:
  arm: hold
  definition: 'each corpus row''s recorded net_r: the leg''s own declared exit, untouched, net of the full cost stack (fee 11 bps round trip +
    slippage + funding per window, as recorded per row by the corpus harness)'
  source: comms/strategy_evidence/ltr_corpus/<leg>__trades.jsonl
power:
  expected_n: 4076
  min_detectable_effect: 0.05
  effect_units: metric
  sd: 0.5
  design: paired
  alpha: 0.01
  power: 0.8
  basis: 'INFERRED, not measured: the book is the 4076 committed corpus trades (counted 2026-11-13 from the trades.jsonl files); hold net_r sd over them
    is 1.47 R (measured), and the per-trade paired difference action - hold is assumed about 0.5 R because the action touches only the post-trigger part
    of a trade. At alpha 0.0056 (Bonferroni over 9) and power 0.8 a paired mean difference of about 0.028 R/trade is detectable, below the 0.05 R R1 bar.
    Trades with no candles or no path are excluded and counted; V1''s n_floor 39 governs. POWER-BLOCK ALPHA: 0.01 is declared because research_queue tabulates
    only 0.10 / 0.05 / 0.01 (an untabulated alpha is refused, not interpolated); the RULE still grades at the Bonferroni bar 0.9944 (alpha 0.0056), unchanged.
    At 0.0056 the required n is ~1,303 (z 2.77) vs ~1,168 at 0.01, both below expected_n.'
  feasibility:
    source: none
    accrual_basis: Replays committed corpora and candles; nothing accrues.
decision_rule:
  id: RULE-RQ-20261113-ed2b-01
  registered_at: '2026-11-13'
  registered_before_run: true
  statistic: 'Over the pooled committed Stage-0 per-trade corpora in comms/strategy_evidence/ltr_corpus (8 legs, 4,076 trades; each row''s net_r
    already net of fee + slippage + funding), per pre-registered trigger T in {r_milestone, near_target, stall} (config/live_trade_review.yaml
    due.events thresholds, first CLOSED bar): the book with partial_close 0.5 at the open of the bar after T fires (the rest keeps the recorded
    exit, brackets unchanged) vs the HOLD book (recorded net_r), against 200 matched random-time books (the same partial at a uniformly drawn
    bar of the same trade, on the same trades).'
  rule: 'RULE-AM-RISK-ADJUSTED-V1 (am_risk_adjusted.grade_risk_adjusted, V1 parameters: R1 r_cost <= 0.05 R per baseline trade; R2 maxDD cut >=
    15% OR weekly-CVaR5 cut >= 15%; R3 >= 4 of 6 calendar folds hold; n_floor 39) with R4 vs 200 matched random-time books, plus L1: a pass must
    keep r_cost <= 0.05 R/trade after dropping the leg with the largest favourable contribution. Reported, never graded: the B3 best static rule
    (hold + the registered trigger arms, chosen leave-one-fold-out) and each candidate''s margin over it. Multiple comparisons: RQ-20261113-ed2b-01
    / -03 / -05 share this harness with 3 pre-registered triggers each = 9 candidates, so R4 uses min_control_beat_frac 0.9944 (1 - 0.05/9, Bonferroni;
    199 of 200 random books must be beaten) instead of V1''s 0.95, and the reported edge CI is at 1 - 0.05/9. PASS: at least one pre-registered
    trigger candidate clears R1-R4 and L1. It is a SCREEN pass (per-trade R books, graduation_eligible false until BOOK-SIM-REAL-SIZER): a Tier-3
    proposal input for the class''s status, never an apply. FAIL: every candidate fails a read necessary clause (R1, R2 or R3) or is beaten by
    its random control (R4): back to diagnosis (trigger choice, then action bounds). INDETERMINATE: anything else, i.e. the best candidate is
    under the n floor, never fired, carried by one leg (L1 fails), or no trade could be priced (read_state no_data). Fixed now; not changed after
    a run.'
  what_it_does_not_do: 'Advice-only research: serves, promotes or applies nothing; adds no gate; changes no config, mandate or roster; places
    no order.'
practice_precedent: 'T1 (docs/reference/trading-and-model-practice-principles.md): an intervention is graded against a matched random-intervention
  control in the same trade, net of the full cost stack, per class (RULE-AM-RISK-ADJUSTED-V1); the design copies LTR-TRIGGER-CLOSE-S0 (comms/research/ltr_trigger_close_s0/PREREGISTRATION.md).'
