id: RQ-20261014-65cc-10
title: 'AI trader / probability quality at 1h on published data: do the BTC and ETH 1h regime learners beat the class prior on LOG-LOSS, not only macro-F1? (off-trainer twin
  of RQ-20261013-1414-02)'
status: done
cadence: once
theme: ml_health
priority: 2
kind: experiment
question: On the 1h regime label, does LightGBM or the logit beat the class prior by >= 0.005 nats of multiclass log-loss on the CV mean on BOTH symbols?
why_this_matters: 'Macro-F1 skill can be a threshold artifact; log-loss says whether the probabilities carry information, which is what a conformal or confidence-gating lever
  needs. RQ-20261013-1414-02 asks it for 15m on the trainer; this is the 1h twin on published data, runnable on a GitHub runner with no trainer slot. DATA PATHS UNVERIFIED
  FROM THIS SANDBOX (the shards are not reachable here): the BTC/ETH 1h v002 market_features paths are inside the published allowlist (scripts/research/market_data_export.py::ALLOW)
  and RQ-20261013-1414-03 already reads ETHUSDT 1h with these six features; BTC 1h and the target column on each shard are the ones to check in the first run''s published-data.json
  (last_ts per shard). A missing column or a stale/withheld shard lands as producer_failed or no_data: a ROUTE FAULT to fix and re-queue, never a verdict.'
power:
  expected_n: 24000
  min_detectable_effect: 0.1
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'tail_rows 40000 with min_train_frac 0.4 leaves ~24000 out-of-sample rows over 5 folds per symbol; d=0.1 paired needs ~785 rows, so each symbol is above the row floor
    on rows, but bars are autocorrelated so effective n is lower: the rule also requires the same-direction CV mean on BOTH symbols.'
  feasibility:
    source: none
    accrual_basis: 'Fixed by construction (tail_rows of a nightly-rebuilt shard): n does not grow with waiting, so an underpowered result is reported as such and the follow-up
      is a larger or different dataset, not a re-run.'
decision_rule:
  id: RULE-RQ20261014-65CC-10-REGIME-LOGLOSS-VS-PRIOR-1H
  registered_at: '2026-10-14'
  registered_before_run: true
  statistic: Paired per-fold difference in multiclass log-loss (prior minus learner, positive = learner better) on identical purged folds (5, embargo 24 rows), mean over folds,
    per symbol.
  rule: PASS IF a candidate (lgbm or logit) beats the class prior by >= +0.005 nats on the CV mean on BOTH symbols (the 1h probabilities carry information over the prior).
    FAIL IF no candidate beats the prior by >= 0 on the CV mean on ANY symbol. INDETERMINATE otherwise, or if folds < 3 or an arm is unavailable.
  min_n: 3 usable CV folds per symbol; reported n_rows per symbol.
  what_it_does_not_do: Builds, calibrates and serves nothing, promotes nothing, touches no config; a log-loss PASS is not edge and not a P&L figure.
compute: auto
value:
  bucket: ai_trader
  usd_at_stake_per_month: 100
  confidence: 0.25
  basis: 'stand-in: gates whether a conformal/confidence lever is worth building on the 1h heads; not a measured P&L'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  published_data: metis-market-data
  peak_memory_gb: 3.0
  est_minutes: 20
  basis: 'Estimate, NOT measured: re-declare from the first run''s run-manifest.json.'
ml_bakeoff:
  task: classification
  metric: logloss
  higher_is_better: false
  dataset:
    kind: jsonl
    groups:
      BTCUSDT_1h:
        path: datasets-out/market_features/BTCUSDT/1h/v002/data.jsonl
      ETHUSDT_1h:
        path: datasets-out/market_features/ETHUSDT/1h/v002/data.jsonl
    ts_col: ts
    target: regime_label
    features:
    - rolling_log_return_vol
    - log_return
    - log_return_lag_1
    - log_return_lag_2
    - hour_of_day
    - dayofweek
    tail_rows: 40000
  cv:
    folds: 5
    embargo_rows: 24
    min_train_frac: 0.4
  baseline: prior
  controls: []
  candidates:
  - lgbm
  - logit
  learners:
    prior:
      kind: prior
    lgbm:
      kind: lightgbm
      params:
        n_estimators: 200
        learning_rate: 0.05
        num_leaves: 31
        min_child_samples: 50
    logit:
      kind: numpy_logit
  rule:
    min_folds: 3
    pass_if:
    - group:
      - BTCUSDT_1h
      - ETHUSDT_1h
      vs: baseline
      window: cv
      op: '>='
      value: 0.005
    fail_if_no_candidate_reaches:
    - group: any
      vs: baseline
      window: cv
      op: '>='
      value: 0.0
run:
  command:
  - python3
  - scripts/research/ml_bakeoff.py
  - --unit
  - '{unit}'
  - --out
  - '{out_dir}'
  timeout_minutes: 60
  inputs:
    research_unit: RQ-20261014-65cc-10
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
roadmap:
- M25
related:
- RQ-20261013-1414-02
- scripts/research/market_data_export.py
- scripts/research/research_compute.yaml
last_dispatched_at: '2026-10-14T07:33:49+00:00'
