id: RQ-20261125-f1a0-25
title: 'REGIME-PROGRAM trade-level state: within each rostered leg, does tilting each trade 2.0 / 0.5 by the leg''s prior net R in its OWN
  symbol''s current trend x vol cell beat equal risk by +0.01 R/trade and beat permutations within leg-month?'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
programme: P2
kind: experiment
iteration:
  subject: regime-program
  subject_kind: ml_model
  from_result: RQ-20261125-f1a0-24/45525451835
  verdict_read: indeterminate
  diagnosis: 'f1a0-24 (run 45525451835): on the 21 rostered legs replayed with declared params, book-level tilts did not confirm (no-state +0.0025 t 0.33; advol -0.0128; hmm2 -0.0034), and f1a0-23 showed BTC state adds nothing beyond book quality. Every rostered leg is net positive, so selecting BOOKS adds nothing; the remaining regime question is whether, within a good leg, the state of the leg''s OWN traded symbol at entry separates its better trades from its worse ones. BTC-wide state is the wrong axis for an alt leg; its own trend / vol is the axis the regime directive names.'
  search: one fixed cell definition (own symbol daily close vs 50-day mean x 20-day vol vs 365-day median), one tilt rule (2.0 / 0.5, >= 20
    exited prior trades in the cell), one renormalisation (leg x month); no grid.
  levers:
  - regime
  map_entries:
  - research/levers/ml-entry.yaml
  attempt: 8
  due_by: '2026-12-01'
question: 'On every rostered crypto trend / pullback / fade / squeeze leg replayed with declared params (2020-09-01..2026-10-26; test trades from
  2022-01-03), does tilting each trade 2.0 / 0.5 by the sign of the mean net R of the same leg x direction''s prior trades that had EXITED before its
  entry in the same OWN-symbol cell (trend x vol), renormalised within leg x month, beat equal risk by >= +0.01 R/trade (entry-week bootstrap t >= 2),
  beat >= 95% of 200 within-leg-month permutations of the tilts, and hold in >= 4 of 5 years?'
why_this_matters: 'The regime lever in the form a live leg can use: per-trade risk set by the traded symbol''s state at entry, every trade kept. A pass
  goes to a fresh-window confirmation, then a Tier-3 per-leg sizing proposal; a fail closes own-symbol trend x vol cells and moves the program to
  the ML state head (the vol head) and change-point state on the same trades.'
power:
  expected_n: 251
  min_detectable_effect: 0.01
  effect_units: r_per_trade
  sd: 0.05
  design: paired
  alpha: 0.01
  power: 0.8
  basis: 'MEASURED from f1a0-24: 7,963 replayed trades over 21 legs, ~5,500 in the test window; the cluster is the entry week (~250). INDETERMINATE
    is a live outcome.'
  feasibility:
    source: none
    accrual_basis: Fixed in-repo corpus with a pinned entry window; nothing accrues.
evidence_class:
  holdout: none
  claim: edge
ml_consumer:
