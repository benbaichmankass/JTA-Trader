  bp2_next60 perps (broad_paths_corpus.select_universe order, END and min-days unchanged, ranks 61-120, every bp2 symbol excluded), 4h Binance
  USD-M candles 2020-06-01..run date, 5 sequential folds cut on POOLED entry times with a 7-day embargo: does the exit-now head (retrained per
  fold on rows with bar_t <= fold start - embargo, live predicate below_half_r) improve mean R per OOS trade over the declared exit by >=
  +0.05 R, and beat the 95th percentile of a causal matched random exit?
why_this_matters: 'PASS -> the cf48-04 result holds on symbols its grading never saw: the exit-now head becomes a Tier-3 candidate for the
  trend_donchian legs (bybit_1 demo floor first), via ML-D8-EXITHEAD-HPN25-DOWNSTREAM. FAIL -> the cf48-04 gain was population-specific;
  D8 keeps riding D7 Stage B and the universe lever is recorded as not confirmed.'
decision_rule:
  id: RULE-RQ20261126-1e75-01-D8-EXIT-NOW-DISJOINT
  registered_at: '2026-11-26'
  registered_before_run: true
  min_n: 3000
  statistic: 'verdict.json from exit_head_kaggle_bakeoff.py --judge exit_now: measurement.legs[POOLED].random_control = {n_oos,
    head_mean_dr_per_trade (champion replayed R minus declared R, every OOS trade), control_p95 (500 draws)}.'
  rule: >-
    Thresholds copied unchanged from cf48-04 (RULE-RQ20261125-cf48-04-D8-EXIT-NOW-POOLED). PASS iff n_oos >= 3000 AND head_mean_dr_per_trade
    >= +0.05 R AND head_mean_dr_per_trade > control_p95. FAIL iff n_oos >= 3000 and either clause fails. INDETERMINATE iff n_oos < 3000 or
    the pooled leg / control is absent; producer_failed is a route fault, never a verdict. Nothing is changed after a result.
  what_it_does_not_do: >-
    Edits no config, roster, model or order path; serves nothing. A PASS is a Tier-3 candidate, not a promotion. The twins are a research
    population. Both arms are compared on gross R per trade (the harness trade loop reads no cost term); the head's discretionary close is
    not charged an extra slippage side, exactly as in cf48-04, so the delta is net of cost only to that stated extent.
intervention_controls:
  hold_to_bracket: true
  hold_to_bracket_note: the declared exit (arm B) is every OOS trade's pair; only the head's close decision differs, replayed by the live predicate
  matched_random:
    draws: 500
    note: CAUSAL matched random exit (exit_head_label_bakeoff._causal_random_fold), as in cf48-04; GATING (control_p95).
  best_static:
    grid:
    - holding_pays (champion exit-now recipe, fixed hyper-parameters)
    - holding_pays_neg25 (context)
    excludes_test_folds: true
    note: each fold trains on rows with bar_t <= fold start - 7 d only
  bootstrap_group: trade
