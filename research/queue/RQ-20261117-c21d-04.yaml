decision_rule:
  id: RULE-RQ20261117-c21d-04-TM-CADENCE
  registered_at: '2026-11-17'
  registered_before_run: true
  baseline: 'B0 hold-to-bracket; B1 best static rule chosen on train folds; B2 distance logit at the same cadence; B4 matched random at
    the same cadence and action rate'
  statistic: 'tm_bench S-OFFLINE per lgbm arm (one per cadence cell): gain over max(B0, B1) in R/trade, CI95, folds positive of 6, max
    drawdown and capital-day checks, vs B2, vs own B4, Holm p over the family.'
  rule: 'PASS (pass_pending_fresh_window) iff tm_bench.s_offline returns pass_pending_fresh_window for at least one lgbm cadence arm:
    gain >= 0.03 R/trade over max(B0, B1), CI95 lower > 0, >= 5 of 6 folds positive, max drawdown and capital-day checks pass, beats B2,
    beats its own matched random B4 (margin CI lower > 0), Holm p < 0.05. FAIL iff every lgbm arm''s CI95 upper < max(B0, B1) + 0.03.
    INDETERMINATE otherwise, or if the test corpus is not tmb-73f5c3660014, the train corpus is not bp2-f4271084b120 with >= 10,000
    de-duplicated trades after purge, or the selfcheck fails. Thresholds, actions, cadences and margin grid fixed now.'
  pass_action: 'author the fresh-window full-label (net-of-cost policy value) confirmation for the passing cadence; a horizon-label arm
    delta is not itself a net-of-cost policy value (tm_bench label note).'
  fail_action: 'record the checkin_policy family as tested in research/levers/ml-tm-action-value.yaml; next family = learner class.'
