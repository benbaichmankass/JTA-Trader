id: RQ-20261015-f01d-02
title: 'MORE FOLDS for the MD-PROMOTE-S1-S2 fold-majority clause: is trend_donchian_eth_prop positive in a MAJORITY of 8 calendar folds over ~6 years of
  ETHUSDT 1h, net of the full cost stack, at its declared params?'
status: done
cadence: once
theme: new_strategy_prop
priority: 1
kind: experiment
question: 'MD-PROMOTE-S1-S2''s bar.fold_majority refuses trend_donchian_eth_prop for bybit_2 (mandate_resolver: REFUSE R-FOLDS ''positive in 2 of 4 folds
  -- not a majority'', 2026-10-15). The committed record covers ONE year in 4 folds of ~3 months, n=163. This unit re-measures the SAME config (declared
  params, config-exact argv via regime_debt_matrix.build_harness_cmd) over the longest window both prop legs share on Binance Vision ETHUSDT 1h (2020-10-15
  .. 2026-10-06 (~2182 days); SOLUSDT perps list 2020-09, so 2020-10-15 leaves a month of warm-up and both legs use the same start) in 8 equal calendar
  folds.'
why_this_matters: 'Operator decision 2026-10-15 ~21:35Z (popup, verbatim ''Hold, run more folds (Recommended)''): PR #18440 (sol_prop -> bybit_2 + bybit_portfolio,
  real money) stays draft until this grades. A 4-fold split of one year cannot distinguish a leg that is positive in most regimes from one carried by two
  good quarters.'
power:
  expected_n: 970
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'expected_n is an ESTIMATE: the record''s rate (163/yr) times ~5.9 years, not a measurement of this window. The E35 floor is 39 trades (d=0.45,
    alpha 0.05, power 0.8). WHY 8 FOLDS: ~9 months each over ~6 years, so each fold spans a multi-month regime and carries ~121 trades at the record''s
    rate; an 8-way split with a STRICT majority (5 of 8) is a harder bar than the 4-fold mandate split, and more folds than that would thin SOL''s folds
    toward the floor. The rule is the unit''s, fixed here before the graded run.'
  feasibility:
    source: none
    accrual_basis: Re-measurement on freshly fetched keyless Binance Vision candles over a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ20261015F01D02
  registered_at: '2026-10-15'
  registered_before_run: true
  statistic: 'ONE arm B = the leg exactly as declared in config/strategies.yaml (no lever change). From the harness''s own --json summary with the full
    cost stack (fee + slippage + funding resolved by execution_costs.resolve_cost_policy, never a zero default): net_total_r, total_trades, max_drawdown_r,
    and net_r per fold over 8 equal calendar spans of the pinned window (exit_lever_ablation.py --folds 8, --grade stage0).'
  rule: 'POSITIVE CONTROL FIRST: arm B restricted to trades entered on/after the committed record''s data_start must reproduce that record (comms/strategy_evidence/runs/2026-10-07/trend_donchian_eth_prop__bt.json)
    within 2% of n and 0.5 R, else INDETERMINATE (the config or data drifted; nothing is read). indeterminate IF n < 39. PASS iff net_total_r > 0 AND at
    least 5 of the 8 folds are net-positive (a strict majority). FAIL otherwise. On PASS: write a new evidence record for trend_donchian_eth_prop from this
    run, re-run mandate_resolver --from S1 --to S2 --account bybit_2; if it returns FIRE (or, for eth_prop, only NETTED-SLICES blocks), PR #18440 is undrafted
    for the operator to merge. On FAIL: the leg is not promoted to bybit_2 on this evidence and PR #18440 is closed with the reason (sol) / eth_prop stays
    off bybit_2. Bars fixed here and unchanged after any result.'
  what_it_does_not_do: Does not re-tune or select params; does not edit config or any roster; does not touch the prop rosters or bybit_1. A PASS is an input
    to the mandate resolver, never a promotion by itself.
  disclosed_before_registration: 'A plumbing smoke test of --folds 8 was run on eth_prop''s OWN one-year record window (2025-10-07..2026-10-06) before this
    rule was written: control reproduced exactly (163 trades, +9.324 R) and 4 of 8 folds were positive. That window is a subset of this unit''s; the bar
    (strict majority, net > 0) is the manager''s instruction, not chosen after the smoke run.'
