id: RQ-20261029-a538-11
title: 'Prop stop width: does SL x1.25 (3.125 ATR) or x0.8 (2.0 ATR) beat the declared 2.5 ATR on trend_donchian_eth_prop net of the prop cost
  stack?'
status: queued
cadence: once
roadmap:
- L-PROP
theme: new_strategy_prop
priority: 1
kind: experiment
question: On trend_donchian_eth_prop over 2023-06-01..2026-10-15 23:00 at the breakout_1 stack, does atr_stop_mult 3.125 (SL125) or 2.0 (SL80)
  beat 2.5 (A) by >= 0.02 R x n(A) in >= 4 of 6 folds with maxDD <= 1.35 x A?
why_this_matters: Only the TP (4ceb-03) and trail levers were run on the eth prop leg; the stop width that sets its per-trade loss was not, and
  prop survival depends on the loss tail. Window starts after the window the E65 evidence used so it is not a re-read of it.
power:
  expected_n: 120
  min_detectable_effect: 0.02
  effect_units: r_per_trade
  sd: 0.9
  design: paired
  alpha: 0.05
  power: 0.5
  basis: Declared leg n >= 39 is the unit floor; at sd ~0.9 R per trade a 0.02 R/trade bar is NOT powered for n ~ 120 (ESTIMATE), so a PASS is
    a discovery lead and a FAIL closes the configuration only; folds 6.
  feasibility:
    source: none
    accrual_basis: Re-measurement on freshly fetched public candles over a pinned window; nothing accrues.
decision_rule:
  id: RULERQ20261029A53811
  registered_at: '2026-10-29'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg trend_donchian_eth_prop --grade replace, window 2023-06-01 .. 2026-10-15 23:00, 6
    equal calendar folds by entry time, net of the prop cost flags in the arm argv (7.5 bps fee + 5.0 bps slippage round trip + 1.0 bps funding/window,
    the breakout_1 stack). Arms fixed now: A = the leg as declared in config/strategies.yaml; candidates SL125, SL80. Per arm: n, net_total_r,
    max_drawdown_r, net R per fold.'
  rule: 'INDETERMINATE IF n(A) < 39 or IF every candidate arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C)
    > net_r(A) AND delta >= 0.02 R x n(A) AND net R(C) >= net R(A) in >= 4 of 6 folds AND maxDD(C) <= maxDD(A) x 1.35. PASS IF one or more pass:
    the best by net R is named and the follow-up is ONE confirmation unit on a disjoint window (a PASS on one window is a discovery; the denominator
    is the number of candidate arms in this unit), then a live-producer check and a Tier-3 declare PROPOSAL with the mirror in the same PR, never
    a config edit. FAIL IF none passes with n(A) >= 39: THIS arm grid is closed on trend_donchian_eth_prop for this window and the family is NOT
    retired; the record names the arm that moved closest. Thresholds and the arm grid are not changed after any result.'
  what_it_does_not_do: 'Edits no config and no roster, places no order, is not a promotion case. A PASS also needs a live producer for the lever
    and a Tier-3 declare. The arm grid is the whole search: no arm is added after the run, and the baseline is the declared leg, not a tuned one.'
intervention_controls:
  not_applicable: a parameter-width ablation of the declared entry/exit geometry run through the harness, not an in-trade action or active-management
    intervention
