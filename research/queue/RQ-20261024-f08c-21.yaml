question: 'On trend_donchian_eth_prop and trend_donchian_sol_prop (1h), do path metrics read at bar 6 predict peak-to-exit giveback beyond bars-in-trade
  and current R, by R2 >= 0.02 or log-loss >= 0.01 in >= 4 of 6 folds? DIAGNOSIS of the first test (eba2-02): MEASURED in RQ-20261022-eba2-02
  (k=12): pooled OOS R2 base 0.0048 -> full 0.0062 (+0.0014, 4 of 6 folds); log-loss gain +0.0016 (2 of 6); n=796 trades still open after bar
  12 of 1488; eth_prop alone R2 gain +0.0147 (4 of 6 folds). The units that PASSED (RQ-20261022-007, eba2-01, eba2-04) read the metrics at bar
  6 on 2h/4h legs. The base R2 is about 0.005, so there is almost no explainable giveback to improve on at k=12. Class: wrong parameter region
  (k=12 on 1h bars is 12 hours, 523 of 1085 eth_prop trades had already exited by then) and a bar (0.02 R2) larger than the whole baseline R2.'
why_this_matters: 'Operator rule 2026-10-22: a first-test fail is diagnosed and re-asked, never retired. Lane EXIT-FAILED-LEVERS-DIAG (2026-10-24),
  row EXIT-FAILED-LEVERS-DIAG, serves eba2-02. Diagnosis and evidence: docs/research/exit-failed-levers-diag-2026-10-24.md. Looked before authoring
  (PLANNING s1): the queue was grepped for the same leg and lever family; no queued or done unit asks this exact arm set. Parents: research/queue/RQ-20261022-eba2-02.yaml,
  research/queue/RQ-20261022-007.yaml, research/queue/RQ-20261022-eba2-01.yaml.'
power:
  expected_n: 796
  min_detectable_effect: 0.1
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'n = 796 is the MEASURED baseline trade count of trend_donchian_eth_prop + trend_donchian_sol_prop in the parent verdict(s). Unpaired
    one-sample MDE = 2.8/sqrt(n) = 0.1 sd. Arms share most trades, so the paired difference is far tighter than that (MEASURED in the diag doc:
    paired sd 0.06-0.5 R per entry); the unit''s bar is stated in R and is not claimed to be detectable at the unpaired MDE. A unit whose lever
    touches a handful of trades is reported with its differing-trade count.'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-F08C-21
  registered_at: '2026-10-24'
  registered_before_run: true
  statistic: 'scripts/research/path_metric_giveback.py (the SAME features, label, ridge/logistic models as RQ-20261022-eba2-02) at k=6 bars (1h),
    legs trend_donchian_eth_prop and trend_donchian_sol_prop, window 2020-07-01 .. 2026-10-15 23:59, 6 calendar folds, pooled over legs: r2_gain,
    ll_gain, fold wins, net of the harness venue-aware stack (fee 7.5 bps round trip, slippage 3.0 bps round trip, funding 1.0 bps per 8h window;
    MEASURED in the parent verdicts'' cost_stack).'
  rule: 'INDETERMINATE IF pooled n < 100. PASS IF (r2_gain >= 0.02 AND r2 fold wins >= 4 of 6) OR (ll_gain >= 0.01 AND ll fold wins >= 4 of 6),
    the SAME bar as eba2-02: the metric carries information on the prop legs at this k; a lever-arm unit is then pre-registered, never a config
    change. FAIL otherwise; the idea is not retired. Thresholds are not changed after any result.'
what_it_does_not_do: 'Edits no config and places no order. Not a promotion case: a PASS is a discovery needing one disjoint-window confirmation.
  HARNESS CAVEAT (code-read 2026-10-24, scripts/backtest_pullback.py / backtest_trend.py): a stop or ratcheted trail that the bar trades through
  fills AT the stop price, not at a gap-open worse than it, and lever exits fill at the bar close; that flatters every arm in proportion to its
  stop exits, so it favours tight-trail arms. A PASS must be re-run gap-adjusted before any Tier-3 note. A label study: edits no config, places
  no order. k is a single pre-registered choice. Volatility is an uncontrolled confound on these legs.'
