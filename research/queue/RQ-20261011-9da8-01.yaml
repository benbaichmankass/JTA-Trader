id: RQ-20261011-9da8-01
title: 'Frontier: time-series foundation-model forecaster bake-off for the volatility-regime head (Chronos-2, TimesFM-2.5,
  TiRex-2, Kronos vs the shipped Chronos-Bolt-Tiny fc features, with a HAR-RV control)'
status: queued
cadence: once
theme: regime
priority: 2
kind: experiment
question: Under purged 5-fold walk-forward CV and the SAME dataset rows, does ANY of Chronos-2 (119M, Apache-2.0), TimesFM-2.5
  (231M, Apache-2.0), TiRex-2 (82M, Apache-2.0), Tiny Time Mixers TTM-r2 (ibm-granite/granite-timeseries-ttm-r2, 805K params, Apache-2.0; ADDED 2026-10-15) or Kronos-base (102M, MIT, OHLCV-native) used as a frozen quantile forecaster
  (the same six scale-free fc_* columns build_forecasts.py emits) lift the BTC/ETH/SOL 15m volatility-regime head's macro_f1
  and f1_volatile over the incumbent fc features (Chronos-Bolt-Tiny, 9M) AND over a no-neural control (HAR-RV realised-vol
  forecast columns)?
why_this_matters: 'Only ONE TSFM (Chronos-Bolt-Tiny) has ever been tested, frozen, on the volatility head (T0.1/T0.4, 2026-07-01);
  its fc features are the one durable win and are advisory today (macro_f1 0.573 BTC / 0.541 SOL). Two things are UNTESTED,
  not closed: (1) larger / newer / finance-native forecasters; (2) whether fc beats a classical HAR-RV control at all (no
  record of that comparison was found in ROADMAP.md T0.4 or docs/research/T0.4-*). Operator 2026-10-11: do not let the first
  good thing dictate scope. Kronos is reported (secondary source, unverified) to be pretrained on 45 exchanges incl. crypto, so the registered rule also reads a post-2025-09-01
  holdout where overlap with pretraining is least likely (the pretraining cutoff is UNVERIFIED).'
power:
  expected_n: 78000
  min_detectable_effect: 0.025
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'RE-DECLARED 2026-10-22 (before any run; lane ML-TSFM-TRAINER) because the dispatcher''s power gate does not know design "paired" (the original block said paired / expected_n 3 symbols, which it reports as unverifiable and refuses to route). Unit = out-of-sample test row: 3 symbols x ~26000 cv test rows (full 175k-bar history, stride-4 common grid ~43800 rows/symbol, 60% of it out of sample) = ~78000; d needed at n=78000 is (1.96+0.8416)/sqrt(78000) = 0.010 sd, so 0.025 is met on rows with margin. Rows are autocorrelated and the conversion from +0.010 macro_f1 points to sd was NOT measured, so the rule keeps its own guard: the same sign on all three symbols plus the post-2025-09-01 holdout, not a significance test on one. The first run replaces this with the measured n.'
  feasibility:
    source: none
    accrual_basis: 'Nothing needs to accrue: the window is fixed history, and the Chronos-2 side-streams are built once on the trainer (datasets-out/forecasts/<SYM>/15m/c2-v002).'
decision_rule:
  id: RULE-RQ1011-9DA8-01-TSFM-BAKEOFF
  registered_at: '2026-10-11'
  registered_before_run: true
  statistic: 'Per candidate forecaster and symbol: paired purged-CV delta macro_f1 and delta f1_volatile vs the incumbent
    fc (Chronos-Bolt-Tiny) head on identical rows, and vs the HAR-RV control; plus the same deltas on the post-2025-09-01
    holdout. Feature-lift gate only -- NOT a P&L figure.'
  rule: 'PASS IF for at least one candidate forecaster: delta macro_f1 >= +0.010 vs the incumbent fc AND >= +0.010 vs HAR-RV
    on BTC, the same sign (> 0) on ETH and SOL, AND the post-2025-09-01 holdout delta is > 0 on BTC. FAIL IF no candidate
    reaches delta macro_f1 > +0.005 vs the incumbent on any symbol (the incumbent stays; the family is not closed -- a FAIL
    closes only these checkpoints, zero-shot, on this head). If HAR-RV >= the incumbent fc on BTC, REPORT that as the headline
    (the neural forecaster adds nothing over a classical one) and re-route. INDETERMINATE otherwise. A PASS is a candidate-stage
    manifest only; any advisory use is judged downstream by the regime-cell walk-forward NET OF COST.'
  ttm_arms_addendum:
    registered_at: '2026-10-15'
    registered_before_run: true
    source: 'Operator decision 2026-10-15 (weekly walk-through, Approve all). Basis: arXiv 2607.05291 (Brini, 6 Jul 2026), body read 2026-10-15 (lane ML-FRONTIER-W42).'
    arms_added: 'TTM-r2 as a frozen forecaster emitting the same six scale-free fc_* columns, and a TTM+HAR-RV EQUAL-WEIGHT combination arm (average of the TTM and HAR-RV realised-vol forecasts before the fc_* columns are formed).'
    kill_rule: 'KILL the TTM arms (and close the TTM question on this head, these checkpoints, zero-shot) IF neither the TTM arm nor the TTM+HAR-RV arm beats the HAR-RV control by the registered margin (delta macro_f1 >= +0.010 vs HAR-RV on BTC) on BTC, ETH AND SOL 15m. The main rule above applies unchanged to every other candidate; the TTM arms add candidates, they do not loosen any bar.'
    what_the_paper_does_and_does_not_show: 'CONFIRMED in the body: on 50 assets (40 US equities, 5 FX, 5 futures; daily realised variance at 5-min sampling; h=1/5/22 days; VOLARE, 2009/2015-Jan 2026) only TTM of nine zero-shot TSFMs beats Log-HAR at every horizon on the equal-weighted average QLIKE ratio (0.982 / 0.986 / 0.987, i.e. 1.3-1.8% better); TTM+Log-HAR equal weight 0.977 / 0.984 / 0.982, significantly better than Log-HAR on 36 of 50 assets at h=1 but better than TTM itself on at most 12. NOT shown: (1) no crypto asset and no 15-minute horizon in the sample; (2) after a Mincer-Zarnowitz recalibration TTM falls to 8th at the daily and weekly horizons, so the short-horizon edge is mostly better SCALE, not better dynamics; a genuine gain remains only at h=22; (3) the target is a QLIKE loss on realised variance, ours is a macro-F1 on a 4.6%-base-rate volatile CLASS; (4) the paper concedes pretraining-contamination cannot be ruled out for some models (TTM: Monash + LOTSA subsets, <1% financial). The paper is therefore the reason to TEST TTM here, not evidence it will win; the HAR-RV control is what keeps the test honest.'
  var_baseline_addendum:
    registered_at: '2026-10-22'
    registered_before_run: true
    source: 'Operator request IDEAS.md 2026-10-21 ("a predictive ML that uses multivariate regressions to create a predicted price vector"), dispatched by the manager to lane ML-TSFM-TRAINER 2026-10-22; no result of this unit existed when this was written.'
    arm_added: 'var_control = scripts/research/ml_bakeoff.py block var_price_vector: a causal rolling ridge VAR(4) over the 3 symbols'' 1-bar log returns and absolute returns (refit every 96 bars on the trailing 2000), emitting the predicted next-bar return/|return| vector per asset, fed to the same LightGBM head. It is a BASELINE: a TSFM candidate must beat it, not the other way round.'
    clause_added: 'PASS additionally requires delta macro_f1 > 0 vs var_control on BTC (cv). This tightens the PASS bar only; the FAIL floor and every other clause are unchanged. If var_control >= the incumbent on BTC, that is reported as a headline alongside the HAR-RV one.'
    scope_note: 'Candidates evaluated in THIS run: chronos-2 only. TimesFM-2.5, TiRex-2, Kronos and the TTM arms have NO loader on the trainer (build_forecasts.py registers chronos-bolt-tiny/-small and chronos-2 only), so they are not in `candidates` and a FAIL here closes only Chronos-2 zero-shot on this head, as the rule already states. They stay open under FRONTIER-LEVER-TSFM.'
    population_note: 'Full market_features v002 history of each symbol (175272 rows, 2021-10 to 2026-10), restricted by common_rows to the stride-4 grid where BOTH the incumbent fc_* and the Chronos-2 fc_* are finite (~43800 rows/symbol), dataset market_features v002 (the nightly shard present for all three symbols; the unit text said v003, which has no SOL shard). Chronos-2 built zero-shot on the trainer 2026-10-22: context 64, stride 4, horizon 1 (measured ~7 min per 10000 forecasts on the 1-CPU trainer).'
  what_it_does_not_do: 'Does not train, promote or serve anything; does not touch config/*.yaml; no live-box dependency (torch
    stays trainer-side, forecasts are mirror-published like fc). A feature-lift PASS is not edge: it earns a candidate manifest
    and the downstream net-of-cost regime-cell walk-forward, nothing more. Says nothing about fine-tuned (LoRA) variants --
    that is a separate unit only if zero-shot passes.'
ml_bakeoff:
  task: classification
  metric: macro_f1
  dataset:
    kind: jsonl
    groups:
      BTCUSDT: {path: datasets-out/market_features/BTCUSDT/15m/v002/data.jsonl}
      ETHUSDT: {path: datasets-out/market_features/ETHUSDT/15m/v002/data.jsonl}
      SOLUSDT: {path: datasets-out/market_features/SOLUSDT/15m/v002/data.jsonl}
    ts_col: ts
    target: regime_label
    features: [rolling_log_return_vol, log_return, log_return_lag_1, log_return_lag_2, hour_of_day, dayofweek]
    extra_columns: [fc_ret_med, fc_range_rel, fc_up_prob, fc_skew, fc_q10_rel, fc_q90_rel]
    holdout_after: '2025-09-01'
  common_rows: true
  cv: {folds: 5, embargo_rows: 96, min_train_frac: 0.4}
  baseline: incumbent
  controls: [har_rv_control, var_control]
  candidates: [chronos2]
  learners:
    incumbent:
      kind: lightgbm
      params: &lgbm {n_estimators: 200, learning_rate: 0.05, num_leaves: 31, min_child_samples: 50}
      feature_blocks:
        - {kind: df_columns, columns: [fc_ret_med, fc_range_rel, fc_up_prob, fc_skew, fc_q10_rel, fc_q90_rel], require_finite: true}
    har_rv_control:
      kind: lightgbm
      params: *lgbm
      feature_blocks:
        - {kind: har_rv, d: 1, w: 5, m: 22, bars_per_unit: 96}
    var_control:
      kind: lightgbm
      params: *lgbm
      feature_blocks:
        - kind: var_price_vector
          own: '{group}'
          lags: 4
          window: 2000
          refit_every: 96
          peers:
            BTCUSDT: datasets-out/market_features/BTCUSDT/15m/v002/data.jsonl
            ETHUSDT: datasets-out/market_features/ETHUSDT/15m/v002/data.jsonl
            SOLUSDT: datasets-out/market_features/SOLUSDT/15m/v002/data.jsonl
    chronos2:
      kind: lightgbm
      params: *lgbm
      feature_blocks:
        - {kind: join_columns, path: 'datasets-out/forecasts/{group}/15m/c2-v002/data.jsonl', columns: [fc_ret_med, fc_range_rel, fc_up_prob, fc_skew, fc_q10_rel, fc_q90_rel], require_finite: true}
  rule:
    min_folds: 3
    pass_if:
      - {group: [BTCUSDT], vs: baseline, window: cv, op: '>=', value: 0.01}
      - {group: [BTCUSDT], vs: har_rv_control, window: cv, op: '>=', value: 0.01}
      - {group: [BTCUSDT], vs: var_control, window: cv, op: '>', value: 0.0}
      - {group: [ETHUSDT, SOLUSDT], vs: baseline, window: cv, op: '>', value: 0.0}
      - {group: [BTCUSDT], vs: baseline, window: holdout, op: '>', value: 0.0}
    fail_if_no_candidate_reaches:
      - {group: any, vs: baseline, window: cv, op: '>', value: 0.005}
    headline_checks:
      - {name: har_rv_ge_incumbent_btc, learner: har_rv_control, group: BTCUSDT, vs: baseline, window: cv, op: '>=', value: 0.0}
      - {name: var_ge_incumbent_btc, learner: var_control, group: BTCUSDT, vs: baseline, window: cv, op: '>=', value: 0.0}
routing:
  needs_trainer_resident_data: true
  needs_gpu: false
  peak_memory_gb: 4.5
  est_minutes: 120
  basis: 'Estimate, not a measurement: 3 symbols x 4 LightGBM arms x (5 cv folds + holdout) on the full history of each 15m shard (the loader keeps only declared columns; the VAR arm streams two peer shards for ts+log_return only). The first run replaces it.'
run:
  workflow: research-script-run-trainer.yml
  timeout_minutes: 240
  command: [python3, scripts/research/ml_bakeoff.py, --unit, '{unit}', --out, '{out_dir}']
  inputs: {research_unit: RQ-20261011-9da8-01}
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
