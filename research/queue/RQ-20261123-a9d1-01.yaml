# Hand-authored 2026-11-23 by lane ML-D3-UNLOCK-20261123 (Tier 1 research), dispatched by the JTA Trader manager (Manager Session 2026-11-22a);
# operator 2026-11-23 ~18:25Z: "push those to training ... let's get them going". Design: docs/research/ml-am-heads-design-2026-11-23.md.
# STAGE A only (model skill of the TARGET and INVALIDATION heads). Decision rule registered BEFORE the full run. Gates this adds or changes: none.
# DISCLOSURE: a 5%-trade-subsample DEV-ONLY smoke (25,309 trades, no holdout, run on label run cfbl-20261123) was run to debug the script. It showed
# positive skill vs an UNCONDITIONAL baseline on every head; I then added the stronger STATE-CONDITIONED baseline and re-ran the smoke (skill vs state: stop_first +4.4%,
# dip_recovers +5.4%, reach_2 +2.2%, q0.9 +2.5%, q0.5 +0.9%, 6-8 of 8 dev folds positive). The thresholds below (0.01, 6 of 8) were written into the rule
# BEFORE the state-baseline smoke and were not moved after it; q0.5 sat just under 0.01 in the smoke, so a FAIL/INDETERMINATE on it is possible and stated.
id: RQ-20261123-a9d1-01
title: 'AM v2 stage A: do a TARGET head (MFE quantiles, P(reach 2R)) and an INVALIDATION head (P(stop before 2R), dip-that-recovers) trained on the run-w per-bar
  labels beat the training fold''s own state-conditioned empirical rate by >= 1% loss (>= 6 of 8 dev folds, positive on a claimed 2026 holdout)?'
status: running
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
programme: P2
kind: experiment
iteration:
  subject: ml-brackets
  subject_kind: ml_model
  from_result: comms/research/AM-V2-LABELS-20261123/census_cfbl-20261123.json
  verdict_read: pending
  diagnosis: 'Every D6 bracket arm so far was a FIXED or cell-chosen TP (fail), and the giveback predictor showed log-loss-only skill at one bar on ~1,000 trades.
    The operator (2026-11-23) wants brackets that move both ways: where the move stops, and when we are wrong. The labels now exist per bar: 469,172 trades,
    9,432,621 uncensored per-bar rows (591 censored), stop-before-+2R 36.41%, dip-recovers 2.64%. No head has been fit on them.'
  search: 'lever family bracket (target) and stop (invalidation), mechanism: LightGBM quantile (q 0.25/0.5/0.75/0.9 of remaining MFE in R) and binary heads
    (reach_1, reach_2, stop_first, dip_recovers) on 9 point-in-time features, one fit per head per purged half-year fold; no hyper-parameter search'
  levers:
  - bracket
  - stop
  map_entries:
  - research/levers/ml-brackets.yaml
  attempt: 1
  due_by: '2026-12-01'
question: 'On purged half-year folds of trade-entry time (2022-01..2026-01) and a claimed 2026 holdout, does each head''s loss on the test fold beat the loss of the
  training fold''s empirical rate/quantile conditioned on (strategy, open_r decile, bar-age bin) by at least 1%, in at least 6 of 8 dev folds, and positively on the holdout?'
why_this_matters: 'A pass authorises Stage B (the head applied as a bracket policy on the CF replay and graded by RULE-AM-RISK-ADJUSTED-V1) and nothing else: skill
  is necessary, never sufficient (the giveback predictor''s lesson). A fail closes these heads on these 9 features before any policy test is built.'
power:
  expected_n: 400
  min_detectable_effect: 0.01
  effect_units: loss_ratio_skill
  sd: 0.05
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATE. The independent unit is the entry WEEK, not the 9.4M rows: the four big families have 337-481 distinct entry weeks each (MEASURED from the
    run-w corpus, comms/research/AM-V2-LABELS-20261123/by_strategy_cfbl-20261123.json plus a local count) and the pooled corpus about 481 weeks. sd 0.05 of the weekly
    skill difference is NOT measured (the dev-only smoke gave across-fold se 0.003-0.014 on 8 folds, i.e. fold-level sd about 0.01-0.04). At sd 0.05 and a 0.01 effect,
    the paired floor is (2.8*0.05/0.01)^2 = 196 clusters, below 400, so a 0.01 skill is resolvable on the pooled corpus; a single small leg (trend_donchian_*_4h,
    ~200-800 trades, tens of weeks) is NOT powered and is reported only, never graded.'
  feasibility:
    source: none
    accrual_basis: Replays committed trade corpus + keyless Binance Vision bars; nothing accrues.
evidence_class:
  holdout: holdout_window
  claim: edge
ml_consumer:
  consumer: .claude/skills/live-trade-review/SKILL.md
  decision: 'target, invalidation and banking levels a live-review packet states and may move (advice-only until a class passes RULE-AM-RISK-ADJUSTED-V1)'
  legs: [ml_entry]
  book: money
baseline:
  definition: 'PRIMARY: the training fold''s empirical quantile / base rate per (strategy, open_r decile, bar-age bin) (>= 200 training rows per cell, else the per-strategy
    value). REFERENCE (reported, never gating): the per-strategy unconditional quantile / base rate. A head that does not beat a lookup on where the trade already sits has learned nothing a table does not say.'
  net_of_cost: false
run:
  command:
  - python3
  - scripts/research/am_heads_fit.py
  - run
  - --labels
  - /tmp/am_labels
  - --corpus
  - /tmp/am_corpus
  - --out
  - '{out_dir}'
  - --unit
  - '{unit}'
  - --reader
  - 'lane ML-D3-UNLOCK-20261123'
  - --rows-per-fold
  - '400000'
  inputs:
    research_unit: RQ-20261123-a9d1-01
decision_rule:
  id: RULE-AM-HEADS-STAGE-A-20261123
  registered_at: '2026-11-23'
  registered_before_run: true
  baseline: the training fold's state-conditioned empirical rate / quantile (primary); the per-strategy unconditional one is reported
  statistic: 'scripts/research/am_heads_fit.py (STAGE_A_RULE, head_verdict, stage_a_verdict). Per head: skill_vs_state = 1 - loss_model / loss_state_baseline on the test fold
    (pinball for quantile heads, log-loss for binary heads), mean over the 8 dev folds, count of dev folds with skill_vs_state > 0, and the holdout fold''s skill_vs_state.
    Graded heads: TARGET q0.5, q0.9, reach_2; INVALIDATION stop_first, dip_recovers. q0.25, q0.75, reach_1 and AUC are reported, not graded. Folds: trade entry time,
    half-years 2022-01-01..2026-01-01 dev, 2026-01-01.. holdout (ledger claim family AM-HEADS before it is scored); a training trade is dropped when its label window
    (entry .. exit + 48 bars) is not 7 days clear of the test start; the split unit is the trade. At most 400,000 rows per fold, drawn at random with a fixed seed.'
  rule: 'Per head PASS iff dev mean skill_vs_state >= +0.01 AND >= 6 of 8 dev folds positive AND holdout skill_vs_state > 0. FAIL iff dev mean skill_vs_state <= 0 OR fewer
    than 4 of 8 dev folds positive. INDETERMINATE otherwise. UNIT verdict: PASS iff >= 1 TARGET head AND >= 1 INVALIDATION head pass; FAIL iff all five graded heads fail;
    else INDETERMINATE. Thresholds, features, folds, row cap and seed are fixed now, never changed after a result.'
  pass_action: 'Register Stage B (the passing heads applied as a bracket policy on the CF replay, graded by RULE-AM-RISK-ADJUSTED-V1 with a matched random-intervention control)
    as its own unit. No bracket, config or order change; nothing graduates on skill.'
  fail_action: 'Record the heads as closed on these features on research/levers/ml-brackets.yaml and file the richer-feature build (structure, market state) as the next lever, not a re-run.'
  proposal_mapping: 'pass -> Stage B unit; fail -> features-richer unit; indeterminate -> state which heads and why and stop (no re-run at another bar).'
  what_it_does_not_do: 'Does not apply any head to a bracket, does not claim P&L, does not test ml_entry / ml_entry_eq decisions (they are NOT in this corpus: it holds rule-strategy backtest trades
    only), does not read a net-of-cost result (skill is a loss ratio, not R).'
  min_n: 100000
compute: cpu_long
value:
  bucket: ai_trader
  usd_at_stake_per_month: 500
  confidence: 0.2
  basis: 'ESTIMATE: the operator named predictive two-way brackets the top priority; the value is in Stage B, this unit only decides whether Stage B is worth building.'
intervention_controls:
  hold_to_bracket: true
  hold_to_bracket_note: 'no intervention is applied in Stage A; the control is the state-conditioned lookup on identical rows'
  matched_random:
    draws: 200
    note: 'declared, NOT computed by Stage A (no policy is applied); the matched random-intervention control belongs to Stage B under RULE-AM-RISK-ADJUSTED-V1 (R4).'
  best_static:
    grid:
    - per-strategy unconditional rate / quantile
    - strategy x open_r decile x bar-age bin lookup (primary)
    excludes_test_folds: true
    note: both baselines are fit on the training fold only
  bootstrap_group: week
practice_precedent: 'brackets as predictions (TP doctrine, reach calibration); distributional MFE heads; week-clustered dependence (principles M13); docs/research/ml-am-heads-design-2026-11-23.md.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 8.0
  est_minutes: 60
  why_runner: 'CPU LightGBM on <= 400k rows per fit, 8 fits per fold, 9 folds; the per-bar labels are an Actions artifact set (cfbl-20261123-labels-0..23, 14-day retention), so this unit was run on the lane''s own container and lands a local-<ts>.jsonl result; a runner re-run needs the artifacts downloaded into /tmp/am_labels and the corpus overlaid at the run-w sha into /tmp/am_corpus.'
  basis: 'ESTIMATE from the dev-only smoke (about 4 minutes for 25k trades at 120k rows per fold).'
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
related:
- scripts/research/am_heads_fit.py
- scripts/research/cf_bar_labels.py
- scripts/research/cf_bar_labels_run.py
- docs/research/ml-am-heads-design-2026-11-23.md
