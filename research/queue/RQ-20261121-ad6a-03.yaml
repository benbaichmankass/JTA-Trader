question: On the widened donchian exit-head rows corpus (row ML-EXITHEAD-CORPUS-WIDEN), is the pooled paired per-trade replayed R of feat_exh or feat_path_only vs
  the shipped-feature champion >= +0.03 R with the CI lower bound > 0 (Bonferroni z 2.498, 4 feature arms seen across f1a9-04/05)?
why_this_matters: 'f1a9-04 and -05 both read INDETERMINATE at n 2,403: the measured paired sd is 0.97 R (declared 0.70), so that design could only resolve ~0.055
  R. feat_exh (+0.0227) and feat_path_only (+0.0147) are the two leads; this unit reads them at the n the bar needs. Pass: first non-label exit-head improvement ->
  confirmation. Fail: the exit head has no in-hand feature lever at 1h and trainer time leaves this subject.'
evidence_class:
