  alpha: 0.05
  power: 0.8
  basis: 'MEASURED paired sd 0.97 R (f1a9-04: SE 0.01987 * sqrt(2403)). n needed = ((2.498 + 0.842) * 0.97 / 0.03)^2 = 11,660 paired OOS trades (alpha 0.05 / 4 arms,
