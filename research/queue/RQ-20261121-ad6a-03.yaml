baseline:
  definition: The holding_pays champion (the shipped recipe, train_exit_head.FEATURES, unchanged hyper-parameters) retrained on the SAME fold training rows and replayed
    on the SAME OOS trades with the live predicate; each trade net of fee + slippage + funding. Hold (no head) is reported as context.
  net_of_cost: true
decision_rule:
  id: RULE-RQ20261121-ad6a-03-EXITHEAD-FEATURES-WIDE
  registered_at: '2026-11-21'
  registered_before_run: true
  baseline: the holding_pays champion on identical folds and trades
  statistic: 'scripts/research/exit_head_label_bakeoff.py --arms '''' --feature-arms feat_exh,feat_path_only --num-folds 3 --z 2.498 --pass-dr 0.03 on the aligned
    rows: pooled over the 8 legs and 3 folds, per OOS trade d = replayed_r(arm) - replayed_r(champion) on identical trades, replay and cost; mean, SE (one trade =
    one cluster), two arms graded, 4 seen, CI at z 2.498. Reported: per-leg read_state and n_oos, candle_source.resampled_to, fired counts, hold context, measurement.arm_features
    and target_coverage per arm.'
  rule: Graded by hand from verdict.json. An arm is could_not_look (INDETERMINATE for that arm) if its target_coverage < 0.90 or it trained in no fold. PASS iff some
    arm has pooled n_oos >= 8000 AND mean d >= +0.03 R/trade AND CI lower bound > 0 AND the unseen-symbol legs (LINK/BNB/XRP/ADA/AVAX) pooled have mean d > 0 for
    that arm (the best such arm by mean is named; denominator 2 of 4 seen). FAIL iff every arm has pooled n_oos >= 8000 AND CI upper bound < +0.03. INDETERMINATE
    otherwise. A leg that is producer_failed or unestablishable lowers n only; a leg whose candle_source.resampled_to is not 1h is excluded and named. Thresholds,
    legs, arms, folds, embargo, lookback, rows path and shape are not changed after any result.
  pass_action: ONE confirmation on the 10-perp held-out-symbol design or a disjoint window before any proposal.
  fail_action: Record both arms as tested on the features family; ml-exit-head-donchian-1h goes to a family review (per-symbol heads need a harness build); never
    a re-run of these configurations.
  what_it_does_not_do: Edits no config, exports or serves nothing, places no order, adds no gate. No close authority for any exit model.
practice_precedent: 'Size the test to the decision: a pre-registered minimum effect with power computed from the measured variance, rather than a bar the data cannot
