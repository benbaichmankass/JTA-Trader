id: RQ-20261024-0142-06
title: 'Later-armed, milder ER gate on trend_donchian_sol_4h: does tightening only after a 2.5-3.0 R run, to 3.0-3.5 x ATR, beat the declared exit?'
status: queued
cadence: once
roadmap:
- L-ATM
- L-REGIME
- M20
theme: regime
priority: 2
kind: experiment
question: On trend_donchian_sol_4h, does a trail that tightens only once peak_r >= 3.0 (to 3.5 x ATR) or peak_r >= 2.5 (to 3.0 x ATR) while er_6 < 0.20 (declared
  now) beat the declared exit A by >= 0.02 R/trade in >= 4 of 6 folds within the drawdown bar, AND beat its matching ungated control (UTL / UTM)?
why_this_matters: 'Lane AUTHOR-FLOOR-1024 (research runnable floor 34 vs 57 at ~11:50Z 2026-10-24; regime 4 vs share 13). Operator directive 2026-10-22: an idea that
  failed one test is not dead; it failed the first test. This unit is a registered VARIANT/EXTENSION of RQ-20261023-1d5c-02 (ER gate on sol_4h, graded FAIL). DIAGNOSIS
  (hypothesis): E20 earned +2.2 R (bar 5.34) on 3 of 6 folds with 18 extra trades, while the ungated control lost 18.3 R: the sol_4h leg already carries a late trail-decay
  arm (5.57 R), and an early 1.5 R / 2.5 x ATR gate cuts winners that the declared decay would have let run. Arming the gate later and tightening less is the consistent
  response.'
power:
  expected_n: 267
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d=0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo's standing E35 floor). expected_n=267 is an ESTIMATE from sibling units on this leg/window, not
    a measurement; below 39 the unit grades indeterminate, never FAIL.
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ20261024014206-SOL4HERLATEARM
  registered_at: '2026-10-24'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg trend_donchian_sol_4h --grade replace, window 2020-07-01 .. 2026-10-15 23:59, 6 equal calendar folds by
    entry time, net of the full cost stack the harness resolves per venue (execution_costs.resolve_cost_policy, recorded per arm as cost_stack). Arms fixed now: A
    = the leg as declared in config/strategies.yaml; candidates E20L, E20M ; ungated controls UTL, UTM. Per arm: n, net_total_r, max_drawdown_r, net R per fold.'
  rule: 'INDETERMINATE IF n(A) < 39 or IF every candidate arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C) > net_r(A) AND delta
    >= 0.02 R x n(A) AND net R(C) >= net R(A) in >= 4 of 6 folds AND maxDD(C) <= maxDD(A) x 1.35 AND net_r(C) > net_r of its matching UNGATED control (UTL, UTM: the
    same action on every trade the gate would reach, so a PASS cannot be ''any early action''). PASS IF one or more pass: the best by net R is named and the follow-up
    is ONE confirmation unit on a disjoint partition (a PASS on one window is a discovery), then a live-producer check and a Tier-3 declare PROPOSAL with the mirror
    in the same PR, never a config edit. FAIL IF none passes with n(A) >= 39: this arm grid is closed on trend_donchian_sol_4h for this window and the family is NOT
    retired; the record names the arm that moved closest and the next variant (arm R 2.0 at mult 3.5, or the chop gate (unit 05 family)). Thresholds and the arm grid
    are not changed after any result.'
  what_it_does_not_do: 'Edits no config and no roster, places no order, is not a promotion case. A PASS also needs a live producer for the lever (check the leg''s
    monitor) and a Tier-3 declare. The arm grid is the whole search: no arm is added after the run, and the baseline is the declared leg, not a tuned one. real-money
    leg.'
