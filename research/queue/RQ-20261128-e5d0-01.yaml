id: RQ-20261128-e5d0-01
title: 'ml-exit-head-donchian-1h THRESHOLD lever: on the 8-symbol Binance-Vision donchian 1h corpus, does firing the champion head at tau 0.05 / 0.20 / 0.30 instead
  of the live 0.10 beat the champion by +0.03 R per OOS trade?'
status: queued
cadence: once
roadmap:
- L-ML-LIVE
theme: ml_health
priority: 2
programme: P2
kind: experiment
iteration:
  subject: ml-exit-head-donchian-1h
  subject_kind: ml_model
  from_result: RQ-20261125-11d7-12
  verdict_read: indeterminate
  diagnosis: 'Three feature reads were INDETERMINATE (11d7-12: feat_exh vs champion below the +0.03 bar at n 2,796) while the champion itself beats HOLD (+0.034 R,
    CI [-0.002,+0.071]); the label lever already moved to neg25. The head fires at the live tau 0.10, never varied: the remaining untested families are threshold,
    calibration and horizon.'
  hypothesis: 'the champion''s firing threshold is mis-set: firing earlier (0.05 less, 0.20/0.30 more) captures more of the signal it already has'
  levers:
  - threshold
  attempt: 1
  due_by: '2026-12-05'
question: 'On the 8-symbol BACKTEST-SOURCE donchian 1h corpus (as 11d7-12: Binance-Vision USD-M 1h klines from 2020-06-01, 3 sequential folds, 7-day embargo), with
  the champion holding_pays target and features unchanged, is mean per-trade d = replayed_r(threshold arm) - replayed_r(champion at tau 0.10) >= +0.03 R with CI lower
  bound > 0 for any of tau 0.05, 0.20, 0.30?'
why_this_matters: 'ml-exit-head-donchian-1h is an ORPHAN (Manager 2026-11-28a drain) and still closes trades on bybit_1 (ETH). Its lever map has threshold, calibration
  and horizon UNTESTED, so retirement on lever exhaustion is not available (family_retirement_policy v3). The features family read INDETERMINATE three times (f1a9-04,
  ad6a-03, 11d7-12); the label family passed (aadc-11/-12) and is the champion. 11d7-12''s context shows the champion beats HOLD by +0.034 R/trade (CI [-0.002, +0.071],
  n 2,796): the head carries signal, and where it fires (tau) is the cheapest untested knob.'
evidence_class:
  holdout: walk_forward
  claim: model_quality
power:
  expected_n: 8200
  min_detectable_effect: 0.03
  effect_units: r_multiple
  sd: 0.97
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: n ESTIMATED from the f1a9-04 trade rate (pooled n_oos 2,403 over 8 legs x 3 folds; the span of that corpus is not stated in the record); multi-year backtest
    rows are expected to reach the 8,200 needed for MDE 0.03 (80% power, sd 0.97 MEASURED), the run measures the actual n. MDE (1.960+0.842) x 0.97 / sqrt(8200) =
    0.030.
  feasibility:
    source: none
    accrual_basis: Replays history; nothing accrues. n is the corpus size the run measures; a run below the rule's n floor is INDETERMINATE, not a verdict.
baseline:
  definition: The holding_pays champion (the shipped recipe, train_exit_head.FEATURES, unchanged hyper-parameters) retrained on the SAME fold training rows and replayed
    on the SAME OOS trades with the live predicate; each trade net of fee + slippage + funding. Hold (no head) is reported as context.
  net_of_cost: true
decision_rule:
  id: RULE-RQ20261128-e5d0-01-EXITHEAD-THRESHOLD
  registered_at: '2026-11-28'
  registered_before_run: true
  baseline: the holding_pays champion at the live tau 0.10 on identical folds and trades
  statistic: 'exit_head_label_bakeoff.py (via the driver) --arms none --threshold-arms thr_tau05,thr_tau20,thr_tau30 --z 2.394 --pass-dr 0.03: pooled over legs and
    folds, per OOS trade d = replayed_r(arm) - replayed_r(champion) on identical trades, replay and cost; mean, SE (one trade = one cluster), CI at z 2.394 (Bonferroni,
    3 arms). Reported: per-leg n_oos, fired counts, d vs hold.'
  rule: 'Per arm: PASS iff pooled n_oos >= 1500 AND mean d >= +0.03 R/trade AND CI lower bound (z 2.394) > 0. FAIL iff pooled n_oos >= 8200 AND CI upper bound < +0.03.
    INDETERMINATE otherwise (the verdict reports n_oos and the n still needed). Thresholds, legs, arms, folds, embargo, lookback and rows source are not changed after
    any result.'
  pass_action: ONE confirmation of the best PASSing tau on a disjoint window or the held-out-symbol design before any proposal, then a data-backed Tier-3 tau change
    for the bybit_1 head to the manager.
  fail_action: 'Record threshold as tested on research/levers/ml-exit-head-donchian-1h.yaml; next: calibration, then horizon; the family review only when every family
    is counted.'
  what_it_does_not_do: Edits no config, exports or serves nothing, places no order, adds no gate. No close authority for any exit model. Backtest-source rows are
    a different population from the trainer live-aligned corpus (stated in the result). Thresholds are copied unchanged from RULE-RQ20261122-fa22-02-EXITHEAD-FEATURES-WIDE;
    the feed is the only change; it does not measure the Binance-vs-Bybit basis.
  proposal_mapping: pass -> confirmation -> Tier-3 tau proposal; fail -> threshold closed for this head; indeterminate -> report n_oos and the n still needed, stop.
practice_precedent: 'Size the test to the decision: a pre-registered minimum effect with power computed from the measured variance, rather than a bar the data cannot
  reach (docs/reference/trading-and-model-practice-principles.md).'
intervention_controls:
  hold_to_bracket: true
  hold_to_bracket_note: every arm keeps the leg's own entry, stop and trail; only the head's close decision differs, replayed by the live predicate
  matched_random:
    draws: 200
    note: 'not computed by this unit; the champion''s own matched random truncation control is RQ-20260927-002 / 78fc-03. Reported here as context only: hold (no
      head) per arm.'
  best_static:
    grid:
    - holding_pays (champion, shipped features, fixed)
    - feat_exh
    excludes_test_folds: true
    note: each fold trains on rows with bar_t <= fold start - 7 d only; nothing is tuned on a test fold
  bootstrap_group: trade
compute: cpu_long
value:
  bucket: ai_trader
  usd_at_stake_per_month: 80
  confidence: 0.25
  basis: 'stand-in inherited from 7d49-02: three demo-floor legs annotate on the head; the main value is the keep / retire decision on the exit head''s levers.'
