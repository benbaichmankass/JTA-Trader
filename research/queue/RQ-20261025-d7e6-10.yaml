  basis: 'sd 0.0349 nats per trade MEASURED from 09a6-01 (n 2627 trades, CI [0.00095, 0.00361] => se 0.00068 => sd = se x sqrt(2627)). Floor for the 0.002 nat bar (repo required_n: two-sided
