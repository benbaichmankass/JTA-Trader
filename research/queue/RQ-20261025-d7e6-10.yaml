question: 'RQ-20261024-09a6-02 read INDETERMINATE (read_state measured): 471 trades remained, the rule needs 600, because four of six legs were dropped for an open-interest column on
  < 80% of states (OI share 0.739 eth_4h, 0.757 eth_prop, 0.787 xrp_pb, 0.790 ada_pb; 0.847 xrp_4h and 0.846 sol_prop were kept). The cause is the window, not the legs: Binance Vision
  open-interest metrics start 2021-12-01 (day-probed 2026-10-25 by path_flow_join), so every state before it carries no OI. The same six legs PLUS three more roster legs (eth_pullback_2h,
  sol_pullback_2h, trend_donchian_sol_4h) to lift n above the floor the measured sd demands, same rule and thresholds, window 2021-12-15 .. 2026-10-15 (14 days of margin after the first
  OI day). The nine legs are decided pooled, as in the parent; the three added legs are named in the record: does adding the flow block (taker imbalance, settled funding, open interest)
  to the price state raise OOS log-loss gain by >= 0.002 nats, CI lower > 0, >= 4 of 6 folds, slope in [0.7, 1.3]?'
why_this_matters: 'Design failure, not an edge failure: the registered coverage floor and the window disagreed, and 09a6-02 could not say anything. The window start is the one change
  to the rule; three legs are ADDED, none removed, because the measured sd needs more trades (below), and thresholds are not touched. Trade count after the cut is estimated from the
  09a6-02 per-leg counts (2627 trades over 2020-07..2026-10) at the OI-era share of states (0.74-0.85): about 2000 on the six original legs and ~2800 with the three added, versus the
  600 the rule needs and the ~2390 the measured sd needs.'
