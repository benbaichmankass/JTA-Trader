    config-exact (--harness-legs), window 2021-12-15 .. 2026-10-15 23:59; reference = R1 if 09a6-01''s own rule PASSES on these trades else R0; candidate = reference + the flow block;
    trade-weighted OOS log-loss gain, trade-cluster bootstrap (2000), per-fold sign, calibration slope; the share of states carrying each flow column is reported per leg.'
  rule: 'INDETERMINATE IF any flow column is present on < 80% of states for a leg (that leg is dropped and named) or fewer than 600 trades remain. PASS IF pooled gain >= 0.002 nats AND
    CI lower > 0 AND >= 4 of 6 folds positive AND calibration slope in [0.7, 1.3] -> the flow block joins the policy rung state and a live flow producer is a named prerequisite of any
    shadow (Programme 02 Q6); it also releases P1-ATM-remaining-move-flow-variant. FAIL IF CI upper < 0.002 nats: flow adds no exit information on these legs at bar resolution in the
    OI era. Thresholds are the parent''s and are not changed after any result.'
  min_n: 600 trades pooled
  what_it_does_not_do: Edits no config and places no order; harness paths, not live paths. A flow edge seen only from 2021-12 says nothing about earlier regimes. Does not pool with 09a6-02
