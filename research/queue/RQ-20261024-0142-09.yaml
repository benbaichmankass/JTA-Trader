id: RQ-20261024-0142-09
title: 'Path-state trail gate (first test on this leg): do ER-gated tight trails beat the declared eth_pullback_2h exit?'
status: queued
cadence: once
roadmap:
- L-ATM
- L-REGIME
- M20
theme: regime
priority: 2
kind: experiment
question: On eth_pullback_2h, does a trail that tightens to 2.5 x ATR once peak_r >= 1.5 AND er_6 < 0.25 / 0.35 (or er_6 > 0.60, the prop-leg direction) (declared
  now) beat the declared exit A by >= 0.02 R/trade in >= 5 of 6 folds within the drawdown bar, AND beat the ungated control UT15?
why_this_matters: 'Lane AUTHOR-FLOOR-1024 (research runnable floor 34 vs 57 at ~11:50Z 2026-10-24; regime 4 vs share 13). Operator directive 2026-10-22: an idea that
  failed one test is not dead; it failed the first test. This unit is a registered VARIANT/EXTENSION of RQ-20261023-1d5c-0x family and RQ-20261022-b7e1-04/-05 (the
  same gate on ada_pullback_2h and xrp_pullback_2h, both graded FAIL, with the sign of the effect differing from the prop legs). eth_pullback_2h shares the pullback
  entry but has never had a path-state read (matrix of exit_lever_ablation tokens by leg, 2026-10-24: no trail-state arm on eth_pullback_2h or sol_pullback_2h). Both
  directions are registered as separate arms because the sign differs by leg family.'
power:
  expected_n: 120
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d=0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo's standing E35 floor). expected_n=120 is an ESTIMATE from sibling units on this leg/window, not
    a measurement; below 39 the unit grades indeterminate, never FAIL.
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ20261024014209-ETHPB2HPATHSTATE
  registered_at: '2026-10-24'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg eth_pullback_2h --grade replace, window 2020-07-01 .. 2026-10-15 23:59, 6 equal calendar folds by entry
    time, net of the full cost stack the harness resolves per venue (execution_costs.resolve_cost_policy, recorded per arm as cost_stack). Arms fixed now: A = the
    leg as declared in config/strategies.yaml; candidates E25, E35, PH60 ; ungated controls UT15. Per arm: n, net_total_r, max_drawdown_r, net R per fold.'
  rule: 'INDETERMINATE IF n(A) < 39 or IF every candidate arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C) > net_r(A) AND delta
    >= 0.02 R x n(A) AND net R(C) >= net R(A) in >= 5 of 6 folds AND maxDD(C) <= maxDD(A) x 1.35 AND net_r(C) > net_r of its matching UNGATED control (UT15: the same
    action on every trade the gate would reach, so a PASS cannot be ''any early action''). PASS IF one or more pass: the best by net R is named and the follow-up
    is ONE confirmation unit on a disjoint partition (a PASS on one window is a discovery), then a live-producer check and a Tier-3 declare PROPOSAL with the mirror
    in the same PR, never a config edit. FAIL IF none passes with n(A) >= 39: this arm grid is closed on eth_pullback_2h for this window and the family is NOT retired;
    the record names the arm that moved closest and the next variant (chop gate (chop_6 > 0.65 / 0.75), or the sol_pullback_2h sibling). Thresholds and the arm grid
    are not changed after any result.'
  what_it_does_not_do: 'Edits no config and no roster, places no order, is not a promotion case. A PASS also needs a live producer for the lever (check the leg''s
    monitor) and a Tier-3 declare. The arm grid is the whole search: no arm is added after the run, and the baseline is the declared leg, not a tuned one.'
compute: cpu_light
value:
  usd_at_stake_per_month: 150
  confidence: 0.12
  bucket: own_losses
  basis: 'stand-in: a regime-conditioned exit lever on a roster leg; an estimate, not a measurement.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 4.0
  est_minutes: 40
  why_runner: Fetches keyless public candles for a pinned window; reads no trainer data; CPU only.
  basis: Estimate from the comparable harness_stage0 / exit_lever_ablation runs of 2026-10-16..22; the first run replaces it.
