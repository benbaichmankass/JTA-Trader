decision_rule:
  id: RULE-RQ2026111073de14-REGIME
  statistic: 'scripts/research/exit_lever_ablation.py --grade holdout on htf_pullback_trend_2h, window 2020-07-01 .. 2026-10-15 23:59, every arm ONE continuous harness pass (argv via regime_debt_matrix.build_harness_cmd),
    net of the full cost stack the harness resolves for the venue (fee + slippage + funding where applicable); per-trade net_r from --emit-trades. Arms fixed now: A = the leg as declared; VH90: --vol-skip-above-pctl=0.9;
    VL20: --vol-skip-below-pctl=0.2; AX40: --adx-max=40. BOUNDARY, fixed before any outcome is read: the latest 25% of the calendar window, grown in 1% steps until it holds 25 of arm A''s entries, capped
    at 40%. DISCOVERY = trades whose entry AND exit precede the boundary; 4 equal calendar folds. HOLDOUT = the selected arm''s trades entered on/after the boundary. Regime-robustness clause (default template):
    the per-year table is read in the result; a PASS with one calendar year above 50% of net gain, or a net-negative long or short side, is reported as a LEAD with that caveat.'
  rule: 'SELECTION (discovery only): an arm is eligible iff discovery n >= 25 AND discovery net R > 0 AND >= 3 of 4 discovery folds net-positive; the eligible arm with the highest discovery net R is selected
    (a tie goes to A). HOLDOUT (read once): INDETERMINATE/insufficient_discovery IF every arm holds < 25 discovery trades; FAIL/no_discovery IF no arm is eligible otherwise; INDETERMINATE/underpowered IF
    the selected arm holds < 25 held-back trades; PASS/confirmed IF held-back net R > 0; FAIL/not_replicated otherwise (closes THAT configuration on THIS window, never the lever family). A PASS with a non-A
    arm is a LEAD for a Tier-3 proposal NOTE on the owning checklist row, never a config edit. Thresholds are not changed after any result.'
  what_it_does_not_do: Edits no config, roster or record and places no order. A backtest of a few levers on one leg is not edge and not a P&L claim; not a Tier-3 case; does not deflate (one configuration
    is read once on the holdout).
