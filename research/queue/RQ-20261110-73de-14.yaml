  leg: no exit_lever_ablation unit exists on htf_pullback_trend_2h for vol-skip / adx-max (grep 2026-11-10); neighbours RQ-20261107-47b6-05..08 (VH90 on other legs). MULTIPLE-TESTING DENOMINATOR: 3 arms
