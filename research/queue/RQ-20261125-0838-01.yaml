id: RQ-20261125-0838-01
title: 'D5 position aggregation CONFIRMATION on 2021-06..2023-04 (history 0104-08, a474-02 and fa22-06 never used): does the 0104-08 PASS of rule arms A1-A3 over
  today''s rule A0 hold?'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: deterministic
why_not_inferential: 'A fixed replay, not a sample: every arm re-weights the SAME fully replayed solo streams over two fixed windows, so a re-run returns the same
  numbers. The chance element is handled inside the rule by A4 (matched random exposure, 1000 seeded draws, the arm must beat its 95th percentile) and by requiring
  the SAME arm to clear the bar in both windows.'
question: 0104-08 PASSED (A1, A2, A3 beat A0 by >= 5 R, beat matched random, kept maxDD <= 1.25x in BOTH pre-dev windows 2023-04..2024-10) while a474-02 FAILED and
  fa22-06 was INDETERMINATE on 2024-10..2026-10. On two further disjoint windows (p1 2021-06..2022-03, p2 2022-03..2023-04), same five pair streams, same arms and
  thresholds, does ONE named arm clear the unchanged bar in both?
why_this_matters: A PASS read on one window is a discovery, not a confirmation (research-ops step D). The three reads disagree by window (FAIL / INDETERMINATE / PASS),
  so this is the tie-break on untouched in-hand history. PASS -> MLP-D5-MASTIFF builds its learned arm against the best rule arm and the rule arm is proposed (Tier-3,
  the manager's); FAIL -> the 0104-08 PASS was window noise and D5 stays the slices rule.
