decision_rule:
  id: RULE-RQ20261125-0838-01-D5-ARMS-CONFIRM
  registered_at: '2026-11-25'
  registered_before_run: true
  statistic: 'Per arm and window (EARLY 2024-10-01..2025-06-30, LATE 2025-07-01..2026-09-30, by entry time): net R = sum over the 5 pairs of w x net_r (w fixed at
    entry, budget 1.0 per pair, so R per capital-day = net R / (5 x days)); max_dd = max drawdown of the combined equity (pairs summed, ordered by exit). A0 slices:
    same-side w = 1 - open weights, opposite open slice refuses, w < 0.05 not opened, stops not trailed; A0 election: one open package per pair. A1 w = 1/N, opposite
    allowed, no netting fee credit. A2 w = 1 for the leg with the highest net R on the OTHER window. A3 w_leg = positive part of the leg''s mean net R on the OTHER
    window, normalised (equal when none positive). A4: each trade kept with p = A0 exposure / n trades, w = 1, 1000 seeded draws -> p95. Rule legs at the full cost
    stack (resolve_run_costs, require_full_costs); ml_entry net R from its own cost stack (BTCUSDT slippage/funding for every symbol: levels overstated for alts,
    the same for every arm).'
  rule: 'Registered 2026-11-25 BEFORE any run. Same bars as 0104-08 / fa22-06 / a474-02, unchanged: PASS iff ONE arm X in {A1, A2, A3} has net R(X) - net R(A0) >=
    5.0, net R(X) > A4 p95, and max_dd(X) <= 1.25 x max(1, max_dd(A0)) in BOTH windows p1 and p2. FAIL iff no X has net R(X) > net R(A0) in both windows. INDETERMINATE
    otherwise, or a pair stream missing in these windows (coverage attached). The winner must be named and be the same arm that passed 0104-08 selection (A1-A3 denominator
    3 arms).'
  what_it_does_not_do: Changes no slice weight or position_model, places no order, trains nothing. Solo streams with untrailed stops are a ceiling read for A0's refusals;
    the conviction score live slices split by is not replayed (first-come at full weight stands in for it).
  min_n: 20 trades per pair-window
  pass_action: 'Two of three independent windows agree: build the learned D5 aggregator against the named rule arm and file the rule arm as a Tier-3 proposal on this
    record (manager). Never applied here.'
  fail_action: 'The 0104-08 PASS was window noise: D5 stays the slices / election rule; record on research/levers/ml-position-aggregator-d5.yaml.'
