question: 'd507-01 (2026-11-01, LOFO quantile threshold): E0 single -0.0030 (range 0.0091), E1 K=3 ensemble +0.0077 (noise-immune, 6/8 folds), E2 (R1 params) +0.0210 but 5/8 folds and a fold at 986 decisions,
  E3 (R2) +0.0095: INDETERMINATE, the per-arm leave-one-fold-out threshold choice is itself a noise source (draw ranges 0.014-0.029). This unit removes it: every arm takes, in every fold, the SAME share
  of rows as the frozen v1 base at tau 0.10 (threshold = that quantile of the arm''s own max(long, short) score; labels never used). Arms against the base (R0 single model, seeds 7, 11, 13, tau 0.10): R1
  single, R2 single (seeds 7, 11, 13); E1 R0 K=3 ensemble, E2 R1 K=3 ensemble, E3 R2 K=3 ensemble (draws {7,11,13}, {17,19,23}, {29,31,37}); each also with the 9-noise-column control (S1). Dev folds only.'
