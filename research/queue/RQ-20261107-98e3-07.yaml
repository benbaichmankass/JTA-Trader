# Hand-authored 2026-11-07 by lane ML-ENTRY-EQ-STRUCTURE-RETEST (Tier 1): re-run of a unit whose only run ended producer_failed (never measured); rule and thresholds unchanged.
id: RQ-20261107-98e3-07
title: 'Regime head at 1h: does adding HAR-RV features lift sklearn HistGradientBoosting log-loss over HGB on the shipped features on BTC, ETH and SOL (learner-family
  transfer of the d5dd-17 PASS)? [RE-RUN of RQ-20261101-e5b1-04: its only run (2026-11-02) ended producer_failed, NEVER MEASURED]'
cadence: once
theme: ml_health
priority: 2
kind: experiment
programme: P2
roadmap:
- M25
question: 'On the latest 60,000 1h bars of BTCUSDT, ETHUSDT and SOLUSDT, does sklearn HistGradientBoosting with HAR-RV inputs (d/w/m, bars_per_unit 24) beat HistGradientBoosting
  on the shipped six features by >= 0.003 nats of regime log-loss on the CV mean on ALL three symbols? (Re-queued 2026-11-07 by lane ML-ENTRY-EQ-STRUCTURE-RETEST:
  the original run produced no run-manifest.json, so the question has no answer; rule, command and thresholds are the original''s, unchanged.)'
why_this_matters: 'RQ-20261031-d5dd-17 (LightGBM +/- HAR-RV at 1h) graded PASS. A single learner family is one configuration: if HAR-RV adds information the lift
  should survive a different tree learner (histogram gradient boosting with its own regularisation), or it is an artefact of LightGBM defaults. Learner-family transfer,
  not a re-run; the head advances only through /ml-review.'
ml_consumer:
  consumer: src/runtime/regime_shadow.py
  decision: whether the regime head (and its vol/direction feature set) may advance candidate -> shadow -> advisory as the vol/trend gate input on the rostered real-money
    legs (it acts only through the regime router, never an order)
  legs:
  - trend_donchian_eth_4h
  - trend_donchian_xrp_4h
  - xrp_pullback_2h
  - ada_pullback_2h
  book: money
power:
  expected_n: 36000
  min_detectable_effect: 0.1
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'tail_rows 60000 with min_train_frac 0.4 leaves ~36000 out-of-sample rows over 5 folds per symbol; d=0.1 paired needs ~785 rows; bars are autocorrelated
    so effective n is lower: the rule requires the same-direction CV mean on EVERY symbol. expected_n is an ESTIMATE, not a measurement.'
  feasibility:
    source: none
    accrual_basis: 'Fixed by construction (tail_rows of a nightly-rebuilt shard): n does not grow with waiting, so an underpowered result is reported as such and
      the follow-up is a different dataset, not a re-run.'
decision_rule:
  id: RULERQ20261101e5b103-RERUN
  registered_at: '2026-11-07'
  registered_before_run: true
  statistic: Paired per-fold difference in multiclass log-loss (baseline minus candidate, positive = candidate better) on identical purged folds (5, embargo 24 rows),
    mean over folds, per symbol.
  rule: 'PASS IF hgb_har beats hgb by >= +0.003 nats on the CV mean on ALL of BTCUSDT, ETHUSDT and SOLUSDT. FAIL IF hgb_har does not beat hgb by >= 0 on the CV mean
    on ANY symbol: the d5dd-17 lift does not transfer across the tree-learner family (handed to /ml-review, never an automatic change). INDETERMINATE otherwise, or
    if folds < 3 or a shard is stale/unavailable. Thresholds are not changed after any result.'
  min_n: 3 usable CV folds per symbol; reported n_rows per symbol.
  what_it_does_not_do: Builds, calibrates and serves nothing, promotes nothing, touches no config; a log-loss PASS is not edge and not a P&L figure, and the head's
    advisory stage is unchanged. A FAIL closes this configuration only; the learner family is not retired.
intervention_controls:
  not_applicable: a model-quality bake-off on a static published shard, not an in-trade action or active-management intervention
compute: auto
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  published_data: metis-market-data
  peak_memory_gb: 3.0
  est_minutes: 30
  basis: 'Estimate, NOT measured: 3 shards x 2 arms x 5 folds on published shards, comparable to RQ-20261030-41cc-26; compute: auto routes it to the Kaggle CPU kernel.'
value:
  bucket: ai_trader
  usd_at_stake_per_month: 150
  confidence: 0.2
  basis: 'stand-in: gates whether the head is worth advancing on the money legs; not a measured P&L'
run:
  command:
  - python3
  - scripts/research/ml_bakeoff.py
  - --unit
  - '{unit}'
  - --out
  - '{out_dir}'
  timeout_minutes: 60
  inputs:
    research_unit: RQ-20261107-98e3-07
ml_bakeoff:
  task: classification
  metric: logloss
  higher_is_better: false
  dataset:
    kind: jsonl
    groups:
      BTCUSDT_1h:
        path: datasets-out/market_features/BTCUSDT/1h/v002/data.jsonl
      ETHUSDT_1h:
        path: datasets-out/market_features/ETHUSDT/1h/v002/data.jsonl
      SOLUSDT_1h:
        path: datasets-out/market_features/SOLUSDT/1h/v002/data.jsonl
    ts_col: ts
    target: regime_label
    features:
    - rolling_log_return_vol
    - log_return
    - log_return_lag_1
    - log_return_lag_2
    - hour_of_day
    - dayofweek
    tail_rows: 60000
  cv:
    folds: 5
    embargo_rows: 24
    min_train_frac: 0.4
  baseline: hgb
  controls:
  - prior
  candidates:
  - hgb_har
  learners:
    prior:
      kind: prior
    hgb:
      kind: sklearn_hgb
      params:
        learning_rate: 0.05
        max_iter: 200
        max_leaf_nodes: 31
        min_samples_leaf: 50
    hgb_har:
      kind: sklearn_hgb
      params:
        learning_rate: 0.05
        max_iter: 200
        max_leaf_nodes: 31
        min_samples_leaf: 50
      feature_blocks:
      - kind: har_rv
        return_col: log_return
        bars_per_unit: 24
  rule:
    min_folds: 3
    pass_if:
    - group:
      - BTCUSDT_1h
      - ETHUSDT_1h
      - SOLUSDT_1h
      vs: baseline
      window: cv
      op: '>='
      value: 0.003
    fail_if_no_candidate_reaches:
    - group: any
      vs: baseline
      window: cv
      op: '>='
      value: 0.0
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
practice_precedent: 'M6 (docs/reference/trading-and-model-practice-principles.md): purged, embargoed walk-forward CV; a log-loss lift is reported per symbol, never
  pooled; the control arm is the strongest classical feature set, not only the class prior.'
