decision_rule:
  id: RULE-RQ2026102690d317-BEFLOOR
  registered_at: '2026-10-26'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg trend_donchian_1h --grade replace, window 2020-07-01 .. 2026-10-15 23:59, 6 equal calendar folds by entry time,
    net of the full cost stack the harness resolves per venue (execution_costs.resolve_cost_policy, recorded per arm as cost_stack). Arms fixed now: A = the leg as declared
    in config/strategies.yaml; candidates BE075, BE10, BE15. Per arm: n, net_total_r, max_drawdown_r, net R per fold.'
  rule: 'INDETERMINATE IF n(A) < 39 or IF every candidate arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C) > net_r(A) AND delta >= 0.02
    R x n(A) AND net R(C) >= net R(A) in >= 4 of 6 folds AND maxDD(C) <= maxDD(A) x 1.35. PASS IF one or more pass: the best by net R is named and the follow-up is ONE confirmation
    unit on a disjoint partition (a PASS on one window is a discovery; the denominator is the number of arms in this unit), then a live-producer check and a Tier-3 declare
    PROPOSAL with the mirror in the same PR, never a config edit. FAIL IF none passes with n(A) >= 39: THIS arm grid is closed on trend_donchian_1h for this window and the
    family is NOT retired; the record names the arm that moved closest and the next variant. Thresholds and the arm grid are not changed after any result.'
  what_it_does_not_do: 'Edits no config and no roster, places no order, is not a promotion case. A PASS also needs a live producer for the lever (check the leg monitor) and
    a Tier-3 declare. The arm grid is the whole search: no arm is added after the run, and the baseline is the declared leg, not a tuned one.'
