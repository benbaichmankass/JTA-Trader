question: On trend_donchian_1h over the pinned window, does a break-even floor armed at +0.75 R (BE075), +1.0 R (BE10) or +1.5 R (BE15), declared now, beat the declared exit
  A by >= 0.02 R/trade in >= 4 of 6 folds within the drawdown bar?
why_this_matters: 'The break-even-floor token appears in units on trend_donchian_eth_prop/sol_prop; a grep of research/queue (2026-10-26) shows no --be-floor-r arm on trend_donchian_1h.
  A break-even floor converts some winners into zero-R exits, so it must pay for the trades it shortens net of cost. First-test cell on this leg. Lane RESEARCH-AUTHOR-20261026-0030
  (research SLO breach 23:15Z 2026-10-25, ops-flags #17895: runnable 42 < floor 71; the 23:16Z routine fire produced no PR). Operator 2026-10-22: an idea that failed one test
  is not dead; it failed the first test.'
