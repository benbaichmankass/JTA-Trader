decision_rule:
  id: RULE-20261101-b608-01
  registered_at: '2026-11-01'
  registered_before_run: true
  statistic: 'Per stack level and seed: n, mean gross, cost and net R per decision, per-fold and per-year net; stand-alone vs marginal delta per factor; the traded-5 slice beside the pooled population.'
  rule: A stack level is ACCEPTED iff (a) it clears the common rule against the v1 base (delta >= 2 x max(0.0034, base seed range), >= 6 of 8 folds, positive delta in >= 3 of 4 calendar years, every fold
    >= 1000 decisions) AND (b) its mean exceeds the previous ACCEPTED level's mean by >= 0.0034 (the added factor adds on top; a negative interaction fails here). The WINNING STACK is the highest level
    accepted in the order S1, S2, S3, stopping at the first level not accepted. If S1 is not accepted there is no winning stack and no W1 read is run. The winning stack, with its numbers fixed on the dev
    folds, is the model of the ONE W1 read (RQ-20261101-b609-01). No W1, held-out or sealed window is read here. Thresholds are not changed after any result.
  what_it_does_not_do: Reads no sealed or held-out window (dev folds only), serves nothing, changes no config or live symbol list, places no order, sizes nothing.
