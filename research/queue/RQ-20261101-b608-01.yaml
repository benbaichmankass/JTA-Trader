practice_precedent: 'T1, M6 (docs/reference/trading-and-model-practice-principles.md): purged + embargoed walk-forward; shadow-feature (Boruta-style) controls so a model that cannot reject noise columns
  is not trusted to admit real ones.'
question: 'Operator 2026-11-01 ~19:50Z: ''Live now, swap to v2 fast (Rec.)''. Single-factor dev results (3 seeds, base v1 +0.0089): R2 recipe at a matched share +0.0293 (b607-01), cost gate 0.06 +0.0205
  (b606-01), bracket 2/4 +0.0126 (b601-01, below power). Their INTERACTION is untested. Stack, cumulative in this order, on the pooled frozen-60 population: S1 = R2 recipe (single model per seed, threshold
  = the quantile taking the SAME share of rows per fold as the v1 base at tau 0.10, set BEFORE any gate); S2 = S1 plus the cost gate (abstain when estimated cost per R = k / atr_pct exceeds 0.06, k = median
  over the OTHER dev folds of realised cost per R x atr_pct); S3 = S2 plus the 2/4 bracket outcomes. Seeds 7, 11, 13; dev folds only. Reported: each factor''s stand-alone delta, its marginal delta on the
  stack, and their ratio (the interaction).'
why_this_matters: 'Operator 2026-11-01: 20 features is a regression equation, not algorithmic trading; manager 2026-11-01 ~12:03Z: a family ablation at +0.010 cannot admit anything when the recipe overfits
  with any extra column, so fix the recipe, then the columns.'
