id: RQ-20261101-b608-01
title: 'ENTRY v2 stack on dev: do the regularised recipe (R2), the cost gate (0.06) and the 2/4 bracket add up, and which stack goes to the one W1 read? Dev folds only'
status: queued
cadence: once
theme: ml_health
