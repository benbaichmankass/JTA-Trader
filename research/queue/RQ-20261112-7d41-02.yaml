decision_rule:
  id: RULE-RQ20261112-7d41-02-OIFLOW-LOWCAP-V3
  registered_at: '2026-11-12'
  registered_before_run: true
  statistic: 'The single arm selected on discovery (highest summed walk-forward net R among arms with >= 100 discovery trades, >= 2/3 of folds with trades net-positive, and discovery sum net R
    > 0) among 2 feature sets x 5 taus = 10 registered draws (LOW-CAPACITY logistic head, --model logit) (F0 price-only control; F0+OI = F0 plus the 7 oi_flow columns oi_chg24, oi_z, ls_top_cnt,
    ls_top_pos, ls_all, taker_ratio, taker_ratio_ma24, no funding column) x tau {0.30, 0.35, 0.40, 0.45, 0.50}, scored once on the held-out, graded by the driver''s E1-E4 exactly as RQ-20261105-d256-01
    (E4 = ml_variant_prop_gate.py V3, the prop survival gate scripts/research/prop_gate.py RULE-P5-GATE-BRK-PER-LEG-V3, on breakout_2 and velotrade_1 (profile bv, pass rule any), both cost arms).
    4h bars, forward split: discovery 2022-01-01..2024-12-31 (purged expanding walk-forward from 2022-01-01, a fold scored only once its training set holds >= 5000 rows), held-out 2025-01-01..2025-09-30.'
  rule: 'INDETERMINATE iff held-out n < 150, the ledger is missing, or a self-check fails. FAIL iff no arm is eligible on discovery, or any of E1-E4 fails. PASS iff E1 (mean >= +0.10 R and block-bootstrap
    CI lower bound > 0) AND E2 (beats B0, B1 all-bars and the random p95) AND E3 (driver regime clause over the OOS ledger) AND E4 (V3 PASS on both arms for >= 1 account of this profile). The
    verdict applies to whichever arm discovery selects and the record NAMES it: if the selected arm is the price-only control F0 and it passes, that is a price-only candidate (not an oi_flow finding)
    and is flagged as such. BASELINE TO BEAT (MEASURED, comms/prop_survival/ml_entry.json and docs/research/ml-entry-prop-gate-2026-11-02/RESULT.md): the deployed ml_entry, ETH+SOL, served ENTRY
    v1 + extend-only TP on the held-out 2025-10-01..2026-09-30, n=381: edge mean net R +0.0170 (breakout_2 / tradeify_1) and +0.0223 (velotrade_1), 95% CI lower bound about -0.10 R; V3 FAIL on
    all three firms (EV median -13.55 / -83.70 / -26.75 USD for breakout_2 / tradeify_1 / velotrade_1). A candidate beats this baseline only by clearing E1 (mean >= +0.10 R, CI lower bound > 0)
    and E4 (V3 PASS) where the baseline failed both. No common-window comparison is claimed: the baseline was read on 2025-10..2026-09, this unit on 2025-01..2025-09 (a different span). A PASS
    is NOT a roster add: it authorises ONE forward-window unit for the frozen arm (bars after 2026-10-01) and a manager proposal of a minimum-size baseline variant; it adds no gate. Thresholds
    are not changed after any result.'
  what_it_does_not_do: 'DISCLOSURE (registered 2026-11-12, before any run of this unit): (1) LightGBM discovery tables for this family and split are known from 98e3-31/32 (all draws net-negative)
    and are NOT reused as evidence; this unit''s logistic discovery table has not been seen. (2) The forward span 2025-01-01..2025-09-30 was not read by 98e3-31/32 (no eligible arm); it lies inside
    the span 2025-10..2026-09''s predecessor window only for ml_entry-family reads; any read here is claimed in comms/research/holdout_reads.jsonl by the driver and graded on the deflated bar
    (principles M13). (3) Read at most once, and only if an arm is eligible on discovery. (4) Promotes nothing, edits no config or roster, places no order. (5) Self-test of the new --model option
    passes; no discovery or held-out run was made before this registration.'
