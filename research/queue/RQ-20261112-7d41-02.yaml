question: 'RQ-20261109-98e3-31 (LightGBM, F0 vs F0+OI, 4h, bv) FAILED on discovery: all 10 draws net-negative. Leverage/positioning (OI change, top-trader long/short, taker imbalance) is information
  price does not carry directly: it measures crowding and forced-liquidation fuel (Brunnermeier-Pedersen 2009 RFS on funding liquidity and spirals). Does the same family, offered to a LOW-capacity
  head, show a discovery-eligible arm and then clear the registered held-out read? Operator spec 2026-11-05 (popup "New data sources (Rec.)"); surge from 2026-11-12.'
why_this_matters: 'Second of the two highest-ranked non-price families not yet graded at low capacity (basis is first, unit 7d41-01). OI/positioning ranks second: it is slower than book depth
  (whose edge decays within minutes, Cont-Kukanov-Stoikov 2014 JFEc; Kolm-Turiel-Westray 2023 Math Fin) so a 4h bar is not a mismatch, and its history (from 2021-12) is the longest after basis.
  A discovery FAIL with the held-out unread is a clean record for the programme review.'
