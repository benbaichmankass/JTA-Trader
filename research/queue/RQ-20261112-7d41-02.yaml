id: RQ-20261112-7d41-02
title: 'P5-MLPROP-OIFLOW-LOWCAP-BV: does open-interest / long-short / taker-flow positioning carry a net-of-cost ETH+SOL entry signal at LOW model capacity (regularised logistic head) on the time-disjoint
  2025-01..2025-09 held-out, and does it clear V3 on breakout_2 and velotrade_1?'
status: queued
cadence: once
theme: new_strategy_prop
priority: 1
kind: experiment
roadmap:
