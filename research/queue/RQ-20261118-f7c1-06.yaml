  peak_memory_gb: 16.0
  est_minutes: 180
  why_runner: Kaggle GPU; the kernel has no internet, so the klines come from the published metis-market-bp2 market_raw (--cache-source published).
  basis: 'MEASURED 2026-11-26 (local): the replay table holds 771,560 rows over 59 symbols; each refit trains on 646,766-749,324 rows. One FT-Transformer epoch (both sides) on 54k rows took 99 s on a 4-core CPU. ESTIMATE: ~15-20 s per side-epoch on a T4 with fp16 at full n, so 13 refits x 2 sides x <= 30 epochs (patience 3) runs ~1-4 h; --gpu-arm-budget-min 290 records any windows past the budget as unavailable (INDETERMINATE), never a timeout with no row.'
