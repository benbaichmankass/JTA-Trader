  rule: 'INDETERMINATE IF n(S3) < 39 or IF an arm is byte-identical to S3 (the lever never fired). An arm R20 or R30 PASSES iff net_r(arm) >
    net_r(S3) AND folds where net_r(arm) >= net_r(S3) >= 5 of 6 AND maxDD(arm) <= maxDD(S3) x 1.35. DOSE READ (reported, decides the
    follow-up): if net_r rises monotonically R10 (-8.97 R vs S3 +26.64 R, measured in a7c3-05) < R20 < R30 the diagnosis (pull-in cuts winners) is supported;
    if R20 and R30 are both worse than R10 the idea is wrong for this leg. PASS -> ONE confirmation on a window the PASS did not see (forward
    OOS accrual of live xrp_pullback_2h closes), then the Tier-3 pull-in declare once row RM-AM-TP-PULLIN-PRODUCER exists. FAIL on both arms ->
    pull-in stays open only for trail-exit-dominated legs (it passed on trend_donchian_xrp_4h) and is not built for pullback legs. Thresholds
    are not changed after any result. A FAIL is first test failed -> variants queued, never dead.'
  statistic: 'From scripts/research/exit_lever_ablation.py --grade replace on xrp_pullback_2h, window 2020-07-01 .. 2026-10-26
    23:59 (6 equal calendar folds; a trade is binned by entry time), net of the full cost stack the harness resolves per
    venue (recorded per arm as cost_stack). BASELINE S3 = the leg as declared with the GEOM-B1 static target at its declared
    3R (--tp-target-r=3), isolating the retarget. R20 / R30 = S3 + stall_pull_in after 20 / 30 stalled bars (the 10-bar cell failed in a7c3-05; two dose points, fixed now, not tuned further). Reported, not graded: tp_share, lever_fired, net_r_per_capital_day.'
  what_it_does_not_do: 'Edits no config, places no order. No live producer for stall_pull_in exists yet, so a PASS is evidence,
    not a declarable lever. Not a § 5b graduation (no matched-random comparator): it changes the declared Stage-0 book itself,
    which the exit-refinement gate governs.'
