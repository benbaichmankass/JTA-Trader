practice_precedent: 'M-series confirmation practice (docs/reference/trading-and-model-practice-principles.md): a lever chosen after
  looking at one window (the mid peg, chosen from aadc-02 / aadc-10 on the held-out year) is confirmed on data it was not chosen on
  before it becomes a proposal. The execution lever is not fit at all, so any window whose ENTRY decisions are out of fold is fresh for it.'
question: 'Same approximation, exit epoch, calibration arm, W 1, mid peg, fallback and statistic as RQ-20261118-04a5-05. ONE FACTOR
  CHANGED: the population. Instead of the frozen v1 booster on the held-out year 2025-10-01..2026-09-30 (used by every maker-exit read so
  far: 1c4e-01, aadc-02 x2, aadc-10, 04a5-05), v1''s recipe (c692-01 FEATURES, LGB_PARAMS, purge + embargo, tau 0.10) scored OUT OF
  FOLD on the dev walk-forward folds E.DEV_FOLDS (2022-01-01..2025-09-30), each fold fit only on rows before its start. Is the paired
  delta, maker minus market closing order, positive in R per time-stop exit at the deflated level?'
why_this_matters: '04a5-05 PASSED: +0.0060 R per time-stop exit, deflated CI [+0.0034, +0.0087], n 2,786 on 53 symbols, fill rate 0.75
  (aadc-10 at the touch: 0.54). Its pass_action is a Tier-3 proposal for ml_entry''s time-stop exit (~25% of decisions, so about +0.0015
  R per decision), after a fresh-window confirmation. Calendar-forward data cannot carry it: Binance Vision monthly files reach only
  October 2026, about 230 time-stop exits a month against the 1,000 floor. The dev walk-forward gives several thousand exits that no
  maker-exit read has touched. Cost is about 90% of v1''s gross (RQ-20261112-a7e8-03), so execution is the binding constraint on the
  real-money D3 model.'
