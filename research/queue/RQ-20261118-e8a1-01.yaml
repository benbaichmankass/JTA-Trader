    unfilled, by side, matched random side, the delta per ALL decisions, the calibration arm.'
  rule: 'INDETERMINATE IF the calibration arm (W 5) is not calibrated (mean delta_F outside [+1.0, +3.0] bps), OR measured time-stop exits
    < 1000 OR distinct symbols < 10. PASS IF mean delta_R > 0 AND the deflated lower bound > 0. FAIL otherwise. The holdout ledger is
    claimed BEFORE any post-exit 1m bar is read. Thresholds are 04a5-05''s, fixed now and not changed after any result.'
  pass_action: 'Tier-3 PROPOSAL to the manager (data-backed, standing rule): ml_entry''s 24h time-stop exit worked post-only at the mid
    with a 1-minute market fallback, on the demo floor / paper first (an exit counterpart of src/units/accounts/maker_entry.py), with the
    exact change, 04a5-05 and this record. Then the learned step: a fill-probability model to skip the post when P(fill) is low (it can
    only add to a lever that already pays).'
  fail_action: 'The 04a5-05 pass does not replicate out of window: no proposal. Record both reads on the D9 lever map; next is the
    learned step D9 lacks, a fill-probability model (post maker only when P(fill) x filled gain exceeds (1 - P(fill)) x unfilled
    cost) fit on the dev out-of-fold exits and graded on the held-out year''s exits, so the gate is a model and not a fixed peg.'
  what_it_does_not_do: No sizing, no config change, no order; SL/TP exits untouched. A PASS is a Tier-3 PROPOSAL, not a change.
  min_n: 1000 measured time-stop exits on >= 10 symbols
