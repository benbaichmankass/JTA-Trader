  of trend_donchian_eth_4h, trend_donchian_xrp_4h, ada_pullback_2h, xrp_pullback_2h over 2020-07-01 ..
  2026-10-15, for trades still open after bar 6, does adding chop_k, er_k, shape_k and early_k to a baseline
  of open_r_k, peak_r_k and bars_since_peak_k raise out-of-sample R2 on giveback by >= 0.02, or lower
  log-loss on giveback >= the training folds'' median by >= 0.01, in >= 4 of 6 calendar folds (pooled
  over the legs)?'
why_this_matters: Giveback is the operator's standing priority (7-day 14.7R of 21.8R peak; paper+mirror
  ~85-87%). A rung-1 PASS opens the rung-2 LEVER arm (bank 50% at +1 R when the metric crosses its threshold,
  net of cost); a FAIL closes this family for these legs without building a lever. The giveback census
  (RQ-20261014-9807-01, graded PASS 2026-10-15) supplies the per-leg distribution this chains after.
