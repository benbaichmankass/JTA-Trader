decision_rule:
  id: RULE-P1-Q11-PATH-METRIC-GIVEBACK-R1
  registered_at: '2026-10-22'
  registered_before_run: true
  statistic: From scripts/research/path_metric_giveback.py, k=6, 6 calendar folds by entry time, leave-one-fold-out.
    Label giveback = peak_r_final - exit_r on the trade's own last path row (truncation-honest). Baseline
    features open_r_k, peak_r_k, bars_since_peak_k; full adds chop_k, er_k, shape_k, early_k; ridge (lambda
    1) on standardised features for R2, Newton logistic for the binary label giveback >= the training
    folds' median. r2_gain = R2_oos(full) - R2_oos(base) and ll_gain = logloss_oos(base) - logloss_oos(full),
    pooled over held-out rows; fold wins = folds where the gain > 0.
  rule: 'INDETERMINATE IF pooled n < 100. PASS IF (r2_gain >= 0.02 AND r2 fold wins >= 4 of 6) OR (ll_gain
