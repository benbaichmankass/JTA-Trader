  levers:
  - threshold
  map_entries:
  - research/levers/ml-entry.yaml
  attempt: 1
  due_by: '2026-12-01'
question: On the 8 dev folds, is mean net R per decision of the recipe with the long side unavailable in the (btc_ret168 < 0 AND btc_vol_pct90d
  >= 0.5) cell at least +0.0068 above the recipe AND above a random mute of the same share of long candidates (week-clustered t >= 2, >= 6/8 folds,
