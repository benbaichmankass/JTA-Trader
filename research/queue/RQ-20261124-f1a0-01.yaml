  diagnosis: 'RQ-20261124-e1a7-02 (run 45455675005, verdict_top1.json, MEASURED, dev folds 2022-01..2025-10, n 71,334 base decisions): the registered
    recipe''s LONG side is net -0.0063 R/decision (n 25,793) vs SHORT +0.0082 (n 45,541); 11.8 entries per decision bar; bar-level max DD 1,604
    R at full risk per entry; top-1 per bar was INDETERMINATE (+0.0042, t 0.26, beats random 1-of-k by +0.0115 t 1.16). Live (docs/research/ml-entry-review-2026-11-24.md):
    the side is a market-wide contrarian rule on btc_ret24 / btc_vol24 (SHAP); 9 of 10 BTC-move bars went against the move; 11 of 11 bars single-signed;
    management saved ~11 R vs the untouched bracket. The live losing longs were bought into BTC 24h drops with btc_vol24 above its p90 inside
    a falling week. A ret_168 per-symbol gate FAILED (RQ-20261123-d3a1-01: +0.012 t 0.83) and short-only FAILED (+0.009 t 0.46); this arm mutes
    only the BTC-regime cell the review names and leaves the short side free.'
  search: 'lever family side/regime, one fixed cell (no grid): long unavailable iff btc_ret168 < 0 AND btc_vol_pct90d >= 0.5; a muted long may
