    a config edit. FAIL IF none passes with n(A) >= 39: THIS arm grid is closed on mgc_trend_1h for this window and the lever FAMILY is NOT retired (scripts/research/family_retirement_policy.yaml);
    the record names the arm that moved closest. Thresholds and the arm grid are not changed after any result.'
  statistic: 'scripts/research/exit_lever_ablation.py --leg mgc_trend_1h --grade replace, the sibling window and folds of RQ-20261117-9e1c-03 (same leg, same flags) by entry
    time, net of the full cost stack the harness resolves per venue (execution_costs.resolve_cost_policy, recorded per arm as cost_stack). Arms fixed now: A = the leg as declared
    in config/strategies.yaml; candidates SE8/SE12. Per arm: n, net_total_r, max_drawdown_r, net R per fold.'
  what_it_does_not_do: 'Edits no config and no roster, places no order, is not a promotion case. A PASS also needs a live producer for the lever and a Tier-3 declare. The arm
    grid is the whole search: no arm is added after the run, and the baseline is the declared leg, not a tuned one.'
