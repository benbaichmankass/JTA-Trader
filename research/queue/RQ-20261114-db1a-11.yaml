question: Does qqq_pullback_1h in the T1 configuration RQ-20261113-f090-02 selected on discovery and confirmed on its held-back span (long only, trail_mult 4.0, every other field
  unchanged) clear RULE-D1 (net R > 0 net of the full cost stack) on the committed record's window and corpus (Alpaca iex clock-aligned 1Hour + 1Min, live forming decision bar,
  us_equity_intraday session, 2025-06-02 15:00 .. 2026-11-11 21:00)?
why_this_matters: 'Manager 2026-11-14 15:13Z / 15:21Z (qqq/tlt real-money promotion check). f090-02 confirmed T1 (+8.72R, n 45 held back) on dukascopy CLOSED bars, but the live config
  trades BOTH sides at trail_mult 5.0 and the committed faithful record (+5.49R n 73, shorts -6.36R n 33) measures THAT config. Promoting T1 is a config change, so T1 needs its own
  faithful forming-bar record on the live feed before any proposal. This unit measures it; a separate unit derives T1''s predictive TP (tp-doctrine-guard fails a new real-money routing
  with the 50R sentinel; RQ-20261104-7fdb-01 FAILED on the live config).'
