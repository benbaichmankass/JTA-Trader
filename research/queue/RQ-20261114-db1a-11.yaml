decision_rule:
  id: RULE-QQQ1H-T1-D1-20261114
  registered_at: '2026-11-14'
  registered_before_run: true
  statistic: 'exit_lever_ablation --grade stage0 --baseline T1 on qqq_pullback_1h over 2025-06-02 15:00 .. 2026-11-11 21:00, --forming-equity-fetch (Alpaca iex clock-aligned 1Hour +
    1Min, decision session us_equity_intraday: the corpus and decision bar of the committed record), net of the harness cost stack for the venue (fee 0, slippage 5 bps round trip,
    funding 0). Arms: A = config-exact (both sides, trail_mult 5.0, tp_r 50); T1 = --side-filter long + --trail-mult 4.0, every other field unchanged (exactly f090-02''s T1). --control
    A = the committed record''s own __bt.json (n 73, net +5.4889R): A must reproduce it within 2% of n and 0.5R. T1 is long only, so no short carry add-on applies.'
  rule: 'RULE-D1 restated on T1: PASS iff T1 net_r > 0 with n >= 10 (fold-majority 1 is exactly RULE-D1''s net > 0, which has no fold clause); FAIL iff n >= 10 and T1 net_r <= 0;
    INDETERMINATE iff the control arm A does not reproduce the committed record, T1 n < 10, or a run is missing. T1 - A and the per-fold table are REPORTED, NOT GRADED. T1 was chosen on
    f090-02''s discovery span, which overlaps this window; this is a fidelity read (does the selected config keep a positive net on the live feed and bar), not an independent edge
    test, and the proposal says so. No threshold is relaxed after any result.'
  what_it_does_not_do: Changes no config, roster, order or evidence record. A PASS is ONE of two inputs a qqq real-money proposal needs; the other is T1's predictive take-profit
    (tp-doctrine-guard), a separate unit. Makes no claim that the edge is statistically distinguishable from zero.
  baseline: the leg config-exact (arm A), which must reproduce the committed record (control), on the same corpus in this unit.
