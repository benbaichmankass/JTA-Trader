decision_rule:
  id: RULE-RQ-20261119-48ac-03
  registered_at: '2026-11-19'
  registered_before_run: true
  statistic: Per-trade R books over the stated corpus, intervention at the first trigger vs the HOLD book, against 200 matched random-time interventions on the same
    trades, net of the full cost stack.
  rule: 'RULE-AM-RISK-ADJUSTED-V1 (am_risk_adjusted.grade_risk_adjusted, V1 parameters: R1 r_cost <= 0.05 R per baseline trade; R2 maxDD cut >= 15% OR weekly-CVaR5
    cut >= 15%; R3 >= 4 of 6 calendar folds hold; n_floor 39) with R4 vs 200 matched random-time books (min_control_beat_frac 0.975), plus L1: a pass keeps r_cost
    <= 0.05 R/trade after dropping the leg with the largest favourable contribution. PASS: every pre-registered candidate listed clears R1-R4 and L1 (one candidate
    suffices where several are listed; that is a discovery, never a promotion). FAIL: every candidate fails a necessary clause (R1, R2 or R3) or is beaten by its
    random control (R4). INDETERMINATE: anything else (under the n floor, never fired, carried by one leg, no_data). Fixed now; not changed after a run. Two pre-registered
    candidates (n_comparisons 2). Population: all committed selection corpora.'
  what_it_does_not_do: 'Advice-only research: serves, promotes or applies nothing; adds no gate; changes no config, mandate or roster; places no order.'
