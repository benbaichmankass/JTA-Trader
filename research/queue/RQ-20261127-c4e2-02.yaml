  registered_before_run: true
  baseline: the registered expanding unweighted refit per fold (arm "base"), same features, tau 0.10, policy and cost stack
  statistic: 'per arm, ml_decision_entry.py lever_arms(): delta = mean net R (arm) - mean net R (base) over the pooled dev-fold decisions,
    week-clustered se; folds where the arm beats base; years with a positive yearly delta. Recency arms also: delta vs placebo_<arm> (the same
    weight values permuted across rows, seeded).'
  rule: 'Each of the 7 arms is graded by LEVER_RULE (RULE-ML-ENTRY-LEVER-ARMS-20261124) with the family bar for 7 arms in one unit: PASS iff n
    >= 3000 AND delta >= 0.0068 R AND week-clustered t >= 2.6865 (one-sided Sidak for k = 7, alpha 0.025; the code sets min_t = max(2.0, this))
    AND (recency arms) delta vs placebo >= 0.0068 AND the arm beats base in >= 6 of 8 folds AND the yearly delta is positive in >= 3 years.
    FAIL iff n ok and delta + min_t * se < 0.0068. INDETERMINATE otherwise. verdict.json carries the first arm; arm_verdicts carries all 7.'
  pass_action: 'The best PASSing arm (largest delta) gets ONE confirming read on disjoint out-of-time data (2025-10-01 onward, holdout_lock
    claimed, the deflated ENTRY bar) in its own unit; a pass there makes that weighting the next ml_entry_retrain challenger, a data-backed
    Tier-3 replacement packet applied by the manager or a mandate, never by a lane.'
  fail_action: Close recency weighting / rolling windows for crypto ENTRY on research/levers/ml-entry.yaml; no re-run with other half-lives.
  proposal_mapping: pass -> confirming out-of-time read -> Tier-3 packet; fail -> lever closed; indeterminate -> report the realised se, stop.
  what_it_does_not_do: 'Promotes nothing. These are DEV folds, the window that chooses: a PASS only qualifies the chosen weighting for ONE
    confirming read on disjoint data (out-of-time 2025-10-01 onward, holdout_lock claimed) in its own unit, and that read decides. No served
    artifact, roster or config changes here.'
