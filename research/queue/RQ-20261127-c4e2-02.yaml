id: RQ-20261127-c4e2-02
title: 'ml_entry STALENESS lever: on the registered dev folds, does fitting the two regressors with RECENCY weights (half-life 90/180/365/730 d) or a
  ROLLING window (12/24/36 months) beat the expanding unweighted recipe, net of cost, and beat a shuffled-weight placebo?'
status: done
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: experiment
origin: follow_up
practice_precedent: 'M3, T2 (docs/reference/trading-and-model-practice-principles.md): one lever per arm, graded against the registered recipe and
  a placebo on the same folds. Applied per .claude/skills/drift-remediation/SKILL.md step 3: the diagnosed driver (c4e2-01: a model trained
  through 2025-09-22 losing -0.085 R/decision in 2026-11, longs -0.46 R, a side split far outside its dev history) becomes one lever unit.'
question: On the registered ml_entry dev folds (8 half-year folds 2022-01-01..2025-10-01, purge + embargo, tau 0.10, the harness cost stack), is mean
  net R per decision higher when each fold's two LightGBM regressors are fitted with recency weights 0.5^(age/half-life) or on only the last N
  months, than with the registered expanding unweighted fit; and, for the recency arms, higher than the same weights shuffled across rows?
why_this_matters: 'c4e2-01 (run 45976150814): the served v1, trained through 2025-09-22, made -0.085 R/decision on 2026-11-01..11-26 (n 867; traded
  bybit_2 n 87, -0.245), with longs at -0.462 (n 381) against +0.211 for shorts. On its own dev and held-out folds the two sides were near
  -0.02 / +0.02, and the side and regime arms are spent (f1a0-01/03, e1a7-01, d3a1-01 FAIL or INDETERMINATE). The untested lever is STALENESS:
  whether weighting recent data more lets the model track a market that moved. A PASS here sets the weighting the weekly retrain
  (ml_entry_retrain.py, row ML-ENTRY-RETRAIN-CADENCE) should use for the next challenger.'
