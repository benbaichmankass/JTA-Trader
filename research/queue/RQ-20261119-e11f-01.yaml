id: RQ-20261119-e11f-01
title: 'AS-TRADED Stage 0 for ict_scalp_eth_15m (real money, bybit_2 + bybit_portfolio): scored on the FORMING 15m bar the leg actually enters on, does its trade set clear Stage 0 net of the full cost stack, where the committed closed-bar record fails (net_r_oos -2.93, n 76)?'
status: queued
requires_result: {unit: RQ-20261119-f1a7-01, verdict: pass}
cadence: once
theme: live_strategy
priority: 1
kind: experiment
question: 'RQ-20261118-abab-56 (graded FAIL 2026-11-19) could not test whether the backtest reproduces the live leg: 43 of 47 live trades on bybit_1 since 2026-07-24 have no closed-bar twin (match rate 0.065, median entry 4.8 min into the 15m bar, i.e. forming-bar entries; 14 harness-only trades), while its cost arm read expectancy -0.013 to +0.035 R/trade at five cost bases with every 95% CI spanning 0 (n 78). ict_scalp_eth_15m declares no decision_bar, so live decides on the forming bar and the committed record scores closed bars. Asked BEFORE the run: over the window and folds of the committed record (2025-10-28..2026-10-27), does the leg scored on the forming bar (the set it trades) clear Stage 0 net of the full cost stack, and what is its net R next to the closed-bar arm on the same bars? The same entry-bar cause as the 2026-10-21 perf-followup L3 (xrp/ada pullback 2h; as_traded_stage0.py), here on a scalp harness that has no forming-bar mode.'
why_this_matters: 'ict_scalp_eth_15m went to real money (bybit_2 + bybit_portfolio) on 2026-11-17 on the live-performance path with a FAILED closed-bar Stage-0 record; the owed fidelity re-test (abab-56) failed on bar timing, not on a measured gap (mean live-minus-replay gross R gap +0.097, bootstrap CI [-0.60, +0.84] contains 0), so it neither supports nor refutes the leg. Until a forming-bar record exists the leg has no as-traded evidence either way, and the abab-56 action (propose a revert) rests on a record that scores a different trade set than the leg trades. PASS -> an as-traded record and a fidelity re-run on the forming harness; FAIL -> the Tier-3 revert proposal (PI-20261119-PERFFW47-0001) stands on an as-traded record, not a closed-bar one. The four sibling ict_scalp legs share the harness and the same decision-bar default (carried as the second stage once the arm exists).'
power:
  expected_n: 78
  min_detectable_effect: 0.32
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATE: the committed closed-bar record has n 76 on this window (abab-56 arm B had n 78 on a window shifted 24 days earlier, both MEASURED); the forming arm is expected to take a similar count. d = 2.8 / sqrt(78) = 0.32 sd at alpha 0.05 / power 0.8. Below the 39-trade E35 floor the arm grades INDETERMINATE, never FAIL. A PASS on 78 trades is a lead for the as-traded record, not a promotion.'
  feasibility:
    source: none
    accrual_basis: Re-measurement on a pinned in-hand window of public Binance candles plus keyless 1m for the forming bar; nothing accrues.
decision_rule:
  id: RULE-RQ20261119-E11F-01-ICT-SCALP-ETH15M-ASTRADED
  registered_at: '2026-11-19'
  registered_before_run: true
  amended: 'manager-approved 2026-11-19, before_any_run: window 2025-10-04..2026-10-01 -> 2025-10-28..2026-10-27 (the committed record''s own; the old window''s committed closed run is the 2026-10-02 run, n 78 / net_r +1.318, so the n 76 / -2.925 control could not reproduce there); explicit pinned dates unchanged in kind, --days 400 -> 460; gated on RQ-20261119-f1a7-01 PASS. Thresholds, folds and the PASS/FAIL rule are unchanged and no outcome was read.'
  statistic: 'scripts/research/exit_lever_ablation.py --grade stage0 on ict_scalp_eth_15m over 2025-10-28..2026-10-27 23:59, 4 equal calendar folds, arms CLOSED (the leg as declared, closed-bar, the committed record''s arm) and FORMING (the same declared leg scored on the forming 15m bar via the harness decision-bar arm the checklist row builds), net of the full cost stack the harness resolves per venue (execution_costs.resolve_cost_policy, recorded per arm as cost_stack). Per arm: n, net_total_r, net R by fold, net R per trade. The FORMING arm is graded; CLOSED is the control and must reproduce the committed record (n 76, net_r -2.93, tolerance 2 trades and 0.5 R) or the run grades producer_failed, not FAIL.'
  rule: 'INDETERMINATE IF n(FORMING) < 39 OR the CLOSED control does not reproduce the committed record. PASS iff n(FORMING) >= 39 AND net_r(FORMING) > 0 AND net R positive in >= 3 of 4 folds. FAIL iff n(FORMING) >= 39 and not PASS. A FAIL closes the as-traded question for this leg on this window and leaves the lever FAMILY untouched (scripts/research/family_retirement_policy.yaml). Thresholds, window and folds are fixed now and not changed after any result.'
  what_it_does_not_do: 'Edits no config and no roster, places no order, is not a promotion or a demotion. A PASS needs the fidelity re-run (abab-56 arm A on the forming harness, match rate >= 0.80) before it counts as evidence for the live leg; a FAIL feeds the existing Tier-3 proposal, which only the operator grants. The harness decision-bar arm must be parity-tested against the live decision bar before this unit is un-blocked, or the arm scores something the leg does not trade.'
