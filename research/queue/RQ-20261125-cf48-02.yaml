question: 'On xrp_pullback_2h (2h pullback leg (live on the real-money roster); declared atr_stop_mult 2.5, tp_r 3.0), 2020-07-01..2026-10-15, four equal calendar
  folds by entry time, net of the full cost stack the harness resolves: does any of the 19 static (atr_stop_mult x tp_r) cells beat the declared bracket by >= 4 R
  over the window AND in >= 3 of 4 folds (maxDD <= 1.35x)?'
why_this_matters: 'Decides whether any learned-bracket (D6 Pointer) unit is worth authoring: a learned bracket can only capture headroom a static cell already shows.
  Read together with its sibling (the other leg): FAIL on both parks D6 with this re-entry test (P2-PR1125-D6-ceiling-two-legs fail branch); a PASS on either is a
  SELECTION and opens the learned-bracket design on that leg only after its confirmation.'
