  unit_rule_id: RULE-RQ20261125-cf48-02-BRACKET-CEILING
  registered_at: '2026-11-25'
  registered_before_run: true
  min_n: 39
  statistic: exit_lever_ablation.py --grade replace over 2020-07-01..2026-10-15 (--days 2330), 4 calendar folds by entry time, full cost stack the harness resolves
    per venue, baseline B = the leg as declared; delta-r 4 (R over the window), delta-r-per-trade 0, fold-majority 3 of 4, dd-tol-frac 0.35, n-floor 39.
  rule: 'Registered 2026-11-25 BEFORE any run, thresholds copied from plan node P2-PR1125-D6-ceiling-two-legs. A candidate C REPLACES B iff net_r(C) - net_r(B) >=
    4 R AND net_r(C) >= net_r(B) in >= 3 of 4 folds AND maxDD(C) <= 1.35 x maxDD(B). Several pass -> the highest net R is SELECTED. PASS = a SELECTION over 19 cells,
    unconfirmed: it supports nothing on the order path; its registered next step is the selected cell alone, exit_lever_ablation --grade paired vs B on the held-out
    2018-01-01..2020-06-30 window (the plan''s first variant), same bars. FAIL = no candidate passes with n(B) >= 39: the static bracket surface is flat on this leg
    and window. INDETERMINATE if n(B) < 39, every candidate is byte-identical to B, or the producer failed. Thresholds, arms and window are not changed after any
    result.'
  what_it_does_not_do: Edits no config, roster or order path; a PASS is not a promotion and the leg's bracket is Tier 3. A FAIL does not retire the Pointer family
    (scripts/research/family_retirement_policy.yaml). Per-trade R changes with the stop distance (R is stop-denominated), which the replace grade reports beside net
    R.
