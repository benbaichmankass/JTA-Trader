  assert_field: read_state
  min_rows: 1
related:
- RQ-20261108-98e3-23
- RQ-20261108-98e3-25
- RQ-20261108-98e3-26
- FRONTIER-Q-RESID-ENTRY
- ML-ENTRY-FINETUNE
population: The ml_decision_entry universe (Binance USD-M perps in the bp2 manifest, BTCUSDT excluded), both-sides at the served tau over
  2025-10-01..2026-09-30 in 13 x 28-day windows; a recipe comparison, not a promotion read.
