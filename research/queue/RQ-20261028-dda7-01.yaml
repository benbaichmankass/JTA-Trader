  note: 'Run SESSION-LOCAL: python3 scripts/ops/build_strategy_evidence.py --strategy ict_scalp_xrp_15m --days 1095 --folds 6 --out research/results/RQ-20261028-dda7-01/records --workdir research/results/RQ-20261028-dda7-01/runs. Not a research-script-run.yml unit (that runner executes only scripts/research/ and scripts/backtest*.py).'
