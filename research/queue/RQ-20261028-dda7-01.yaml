  needs_gpu: false
  peak_memory_gb: 1.5
  est_minutes: 45
  basis: one data.binance.vision fetch of 1095d + one harness run for one leg, session-local (the 5m/15m ict_scalp legs took ~15 min at 365d on this sandbox; 1095d of 15m is ~3x).
run:
