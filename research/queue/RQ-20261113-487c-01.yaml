  diagnosis: 'The trend-alignment framework (TREND-ALIGN-V1) was built and the journal backfill labelled 2,629 closed
    trades, but no test has yet asked whether the trend state helps the ML entry model (as opposed to the per-leg Stage-0
    corpus study 63af-01). The entry recipe currently carries no trend-alignment feature.'
  hypothesis: 'The trend state (adx + signed DI on the 1h decision bar and the completed-1d bar) adds >= +0.010 R per
    decision over the no-feature baseline on the dev folds, net of cost.'
  attempt: 1
  due_by: '2026-11-20'
  map_entries:
  - research/levers/ml-entry.yaml
