routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 45
  basis: one leg, 1+2 arms through the committed-record argv builder on a GitHub runner (same shape as RQ-20261106-011).
value:
