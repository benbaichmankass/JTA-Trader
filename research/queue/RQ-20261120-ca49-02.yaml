  subject_kind: strategy_leg
  from_result: comms/strategy_evidence/qqq_pullback_1h.json
  verdict_read: pass_unconfirmed
  diagnosis: 'qqq_pullback_1h: n 73, net R +5.4886 (3 of 4 folds positive; fold 2 -9.29 R, fold 3 +12.29 R), max drawdown 13.1 R, best trade +9.69 R vs worst -1.08
    R: the P&L is a few large winners (trail 5.0) with a thin per-trade expectancy (+0.075 R), so the pass is fragile (t ~0.34 in the lever map). db1a-11 already
