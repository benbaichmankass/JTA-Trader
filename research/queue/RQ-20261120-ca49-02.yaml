id: RQ-20261120-ca49-02
title: 'ITERATION 1 of qqq_pullback_1h (pass_unconfirmed): one-factor atr_stop_mult sweep (2.0, 3.0 vs configured) net of cost - does the exit-stop family move the
  leg fold-stably?'
status: queued
cadence: once
roadmap:
- L-LADDER
theme: live_strategy
priority: 2
kind: experiment
practice_precedent: 'M2, M4 (docs/reference/trading-and-model-practice-principles.md): walk-forward against a rule registered before the run; one-factor sensitivity
  before combinations. Template: RQ-20261106-011.'
question: On QQQ 1h (Dukascopy closed bars, ~540 days, the harness cost stack for the venue), does any atr_stop_mult variant beat the configured qqq_pullback_1h by
  >= 4.0 R net of cost, with maxDD no worse and >= 3 of 4 calendar folds, at the control n >= 39?
why_this_matters: qqq_pullback_1h is a real-money-adjacent ETF leg whose PASS is fragile (t ~0.34); a fold-stable stop width would either strengthen it or show the
  pass depends on the 2.5 choice.
power:
  expected_n: 73
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d=0.45 -> 39 trades (the E35 floor) for the control reading; the committed record holds n~73 on a comparable window (MEASURED, comms/strategy_evidence/qqq_pullback_1h.json).
    Each variant is graded against the control on the same trades with a 3-of-4 fold bar and a 4.0 R materiality bar; arms counted in iteration.multiple_testing;
    a best-of-k pass is a LEAD.
  feasibility:
    source: none
    accrual_basis: Replays history on public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-TPL-ROSTER-WALKFORWARD-LEVER-SWEEP
  registered_at: '2026-11-20'
  registered_before_run: true
  statistic: 'exit_lever_ablation.py --grade sweep: per variant, delta net R vs the control A, delta maxDD and calendar folds (of 4) in which it beats A, net of the
    full cost stack; the control n, net R and fold signs are reported.'
  rule: PASS (a LEAD for a Tier-3 setting proposal after a holdout read, never applied here) IF some variant beats A by >= 4.0 R, with maxDD no worse and >= 3 of
    4 folds, at A's n >= 39. FAIL IF none does at n >= 39 (these settings are not better than the configured ones; the lever FAMILY stays open until its map is flat/noisy
    at adequate power). INDETERMINATE IF A's n < 39 or the producer failed. Thresholds are not changed after any result. Regime-robustness reporting (per-year table,
    long/short split) is attached to the result, not a graded clause.
