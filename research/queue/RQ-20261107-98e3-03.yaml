decision_rule:
  id: RULE-RQ20261107-98e3-03-TAU-EXT
  registered_at: '2026-11-07'
  registered_before_run: true
  statistic: 'scripts/research/ml_entry_equity.py dev --structure --configs B --taus 0.2,0.25,0.3,0.4: per-tau pooled purged walk-forward OOF restricted-long mean
    net R, n, n_symbols, by_fold, on rows <= 2025-06-30.'
  rule: 'Descriptive: no pass bar and no promotion consumes this unit. read_state measured means the 4-tau grid ran. Reading rule fixed now: tau 0.20 is a PLATEAU
    if every tau in {0.25, 0.30} with n >= 300 reads within 0.03 R of 0.20''s +0.1222 or lower; a CLIFF if tau 0.25 reads below +0.06; a RISING edge if some tau with
    n >= 300 reads >= +0.15 (a hypothesis for a later N=3 confirm unit, never an adopted tau). Thresholds never change after any result.'
  what_it_does_not_do: No confirming window; no change to the graded record, tau, config or any roster. Shares the dev window with RQ-20261106-98e3-01 (4 more draws
    on the same dev data, declared).
  min_n: 300 OOF decisions per tau for the reading rule
