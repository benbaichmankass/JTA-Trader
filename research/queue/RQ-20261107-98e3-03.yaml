question: The graded structure model selected tau 0.20, the TOP of its registered grid {0.05,0.10,0.15,0.20}, with dev OOF mean rising monotonically (+0.054, +0.084,
  +0.112, +0.122) and 5 dev folds of +0.20/+0.25/-0.05/-0.22/+0.33. Dev-only walk-forward on dates <= 2025-06-30 with the structure-exit labels (pivot=5;sl_only),
  config B, taus 0.20/0.25/0.30/0.40; reports pooled OOF mean net R, n, per-fold means and n_symbols per tau. NO confirming window is loaded by any code path of this
  unit.
why_this_matters: 'Tells whether the selected tau sits on a plateau or a cliff before real money. A better tau at dev is only a hypothesis: it would need its own
  confirming read at ledger N=3 and its own Tier-3 proposal; it never changes the graded +0.2123 record.'
