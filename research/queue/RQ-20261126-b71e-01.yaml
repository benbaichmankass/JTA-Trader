question: On the 7 rostered bond and gold legs (tlt_pullback_1d/1h, ief_pullback_1d, gld_pullback_1d, iaum_pullback_1d, mgc_pullback_1d, mgc_trend_1h;
  own harness, Dukascopy candles), does skipping each LONG entry taken after a DFII10 rise of more than 20 bp over the prior 20 observations add >=
  +0.01 R per available trade over taking every trade (t >= 2, >= 4 of 5 test years positive) and beat 200 random skips of the same count within
  each leg x month (share <= 0.05), net of the full cost stack?
why_this_matters: 'It is the first regime test with a stated economic mechanism and no fitted model, on the asset classes where a macro state should
