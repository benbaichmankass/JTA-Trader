  diagnosis: 'The learned entry-filter recipe (walk-forward LightGBM on own-symbol + market-anchor daily state) failed on both asset classes:
    f1a0-35 on crypto (-0.0026 R) and e9a4-01 on 19 non-crypto legs (-0.045 R, t -1.56; the skipped tercile still averaged +0.153 R; random share
    0.44). The model ranks weakly (prediction-vs-R correlation 0.02-0.13 by year), so a learned state adds nothing. The registered next form is a
    HAND rule with a mechanism: duration and gold both price off the real rate, so a sharp real-yield rise is a direct headwind to their long
    entries. One threshold, chosen from that mechanism before the run, not fitted.'
  hypothesis: long bond and gold entries taken right after a real-yield shock lose money relative to the leg's other entries
  search: 'one fixed rule: DFII10 change over the prior 20 observations > +20 bp, the last observation dated strictly before the entry day; skip LONG
    entries only, on the 7 rostered bond / gold legs; no threshold, lookback or series search.'
