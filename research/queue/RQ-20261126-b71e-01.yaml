title: 'REGIME-PROGRAM rates / risk-off HAND RULE: on the rostered bond and gold legs, does skipping each LONG entry taken after a US 10-year REAL-yield
  shock (FRED DFII10 up > 20 bp over the prior 20 observations, read before the entry day) beat taking every trade by +0.01 R per available trade,
  and beat random skips of the same count within leg-month, net of the full cost stack?'
