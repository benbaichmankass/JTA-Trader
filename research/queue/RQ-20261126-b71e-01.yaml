decision_rule:
  id: RULE-REGIME-RATES-SHOCK-20261126
  registered_at: '2026-11-26'
  registered_before_run: true
  baseline: take every replayed trade at equal risk (the same trades); 200 random skips of the same count within each leg x month
  statistic: 'scripts/research/rostered_leg_replay.py --mode ratesrule --universe equities (fetch_fred DFII10, rates_shock, grade_ratesrule -> grade_raw
    normalise=False): delta = -(sum of skipped net R) / all test trades (a skipped trade contributes 0 R); se from 1,000 entry-week bootstrap draws;
    permutation share = share of 200 within leg x month permutations of the 0/1 keep flags with delta >= the arm; yearly delta; skipped and kept mean net
    R; per-leg delta reported.'
  rule: PASS iff delta >= +0.01 R per available trade AND t >= 2 AND permutation share <= 0.05 AND >= 4 of 5 test years > 0; FAIL iff delta <= 0 or share >= 0.5;
