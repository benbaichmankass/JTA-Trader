  alpha: 0.05
  power: 0.8
  basis: 'MEASURED counts only (local replay with the runner pin dukascopy-python 4.0.1 + FRED DFII10, 2026-11-26; no net R read): 831 test-window
    trades on the 7 legs (518 longs), 104 of them skipped by the rule (12.5%; mgc_trend_1h 72, tlt_pullback_1h 20, mgc_pullback_1d 6, gld 3, iaum 3,
