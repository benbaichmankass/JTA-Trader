id: RQ-20261016-6013-01
title: 'RESEARCH-TRIAL-LEDGER weekly regenerate: per (leg, family) n_configs + effective N, and DSR / Harvey-Liu haircut on every comms/strategy_evidence record (report-only)'
status: queued
cadence: weekly
theme: infra
priority: 2
kind: deterministic
roadmap:
- L-LADDER
question: >-
  Checklist row RESEARCH-TRIAL-LEDGER. Re-fold docs/research/m20-sweep-corpus.jsonl, research/results/**
  (E5, measured backtest rows) and research/queue grading blocks into the trial ledger keyed by
  (leg, family): how many configurations have been tried per leg, the effective N after return-
  correlation clustering, and, for every comms/strategy_evidence record, the DSR and the Harvey-Liu
  haircut net expectancy at that N. Each week the factory adds trials, so N only grows; this re-asks it.
why_not_inferential: >-
  A deterministic fold of committed stores: every row is read, nothing is sampled, and no hypothesis is
  tested by this unit. The DSR / haircut numbers it writes are deterministic functions of committed
  per-trade series and the counted N. Report-only by operator decision 2026-10-16
  (PROMOTION-BAR-MULTIPLICITY, "Measure first (Recommended)").
decision_rule:
  id: RULE-RQ20261016-6013-01-TRIAL-LEDGER-BUILD
  registered_at: '2026-10-16'
  registered_before_run: true
  statistic: >-
    scripts/research/trial_ledger.py verdict_for(): per comms/strategy_evidence record, its state
    (computed / no_series / not_a_leg_record / unreadable) and N_used; the count of Stage-0 PASS records
    and of those with DSR > 0.95 AND BHY-haircut net expectancy > 0.
  rule: >-
    PASS IF every evidence record carries a state in {computed, no_series, not_a_leg_record} and every
    computed record carries N_used: the ledger at comms/research/RQ-20261016-6013-01/<run_id>/trial_ledger.json
    is the current one, and its survival count goes to PROMOTION-BAR-MULTIPLICITY for the operator.
    INDETERMINATE otherwise (a record unreadable or without a state): the previous ledger stands and the
    failing record is named in measurement.records_without_state. NO_DATA if no evidence record was read.
  what_it_does_not_do: >-
    Changes no bar, mandate, roster or config (config/mandates.yaml untouched). A record that fails the
    deflated bar is NOT demoted or blocked by this unit; the bar decision is the operator's
    (PROMOTION-BAR-MULTIPLICITY).
