decision_rule:
  id: RULE-ML-D3-SIDE-GATE-TREND-20261123
  registered_at: '2026-11-23'
  registered_before_run: true
  baseline: the ungated both-sides policy on the same refit predictions and folds
  statistic: 'scripts/research/ml_decision_entry.py side-by-fold --gate trend (gate_verdict / GATE_TREND_RULE): pooled over the 8 dev folds,
    delta = mean net R per decision (gated) - mean net R per decision (both-sides); se = week-clustered (ISO week) influence se over both
    arms (arm_diff); gated n counted over the same folds. Dev folds only: no held-out window is read. short_only is reported as a control,
    never gating.'
  rule: 'PASS iff gated n >= 3000 AND delta >= +0.05 R/decision AND t >= 2.0. FAIL iff gated n >= 3000 AND delta + 2.0 se < +0.05.
    INDETERMINATE otherwise. The gate (ret_168 sign), tau, folds, bar and cost stack are fixed now, never changed after a result.'
  pass_action: 'A fresh-window confirmation unit first (the weeks after 2026-11-21 plus a held-out read claimed in the ledger at the deflated
    bar), then a data-backed Tier-3 proposal for a trend-aligned side gate on ml_entry with this record and the confirmation. Applied
    by the operator or a mandate, never by a lane.'
  fail_action: 'Close the trailing-168h side gate on ml_entry; record it on research/levers/ml-entry.yaml; the next D3 lever is the
    point-in-time macro feature set (Foxhound-2); no re-run at another lookback.'
  proposal_mapping: 'pass -> confirmation then Tier-3 proposal; fail -> gate closed; indeterminate -> state the realised se and stop (no
    re-run at another rule; a different gate is a new unit with its own diagnosis).'
  what_it_does_not_do: 'Changes no served model, config or order path; reads no held-out window; is not a promotion. The refit arm is the
    recipe, not the served booster (the served boosters are in-sample on every dev fold).'
