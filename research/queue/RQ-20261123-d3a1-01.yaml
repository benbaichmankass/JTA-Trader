id: RQ-20261123-d3a1-01
title: 'D3 side gate: on the registered ml_entry recipe refit per dev fold, does taking a side only when it agrees with the symbol''s
  trailing 168 h return beat both-sides by +0.05 R/decision (week-clustered t >= 2), net of the full cost stack?'
