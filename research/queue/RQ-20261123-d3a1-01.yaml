iteration:
  subject: ml-entry
  subject_kind: ml_model
  from_result: ML-D3-UNLOCK-20261123/side_by_fold
  verdict_read: indeterminate
  diagnosis: 'The by-side-by-fold record (13 refit folds, 60 perps, 2022-01..2026-11-21) shows the long-loses / short-earns split is NOT a
    persistent design deficit: on the 8 dev folds pooled long n 25,793 -0.006 R vs short n 45,541 +0.008 R, per-fold short-minus-long gap
    mean -0.006 (se 0.042, t -0.15), long negative in 5 of 8 folds. It tracks the regime: across 13 folds the per-fold gap correlates 0.89
    with the always-short minus always-long baseline gap (slope 1.78); the last fold (2026-10-01..11-21, always-long -0.291, always-short
    +0.179) has long n 325 -0.446 / short n 1,024 +0.125, and 2026-07..10 is the mirror (long +0.670 / short -0.110). A static short-only
    gate cannot clear +0.05 (dev short +0.008 vs both +0.003). The open mechanism: the model takes the side against the trailing trend.'
  search: 'lever family filter/regime, mechanism: candidate sides = long iff ret_168 > 0, short iff ret_168 < 0 (ret_168 = 0 trades neither);
    the model still picks the better predicted side among the allowed ones and thresholds at the served tau 0.10; one rule, no grid'
  levers:
  - filter
  map_entries:
  - research/levers/ml-entry.yaml
  attempt: 1
  due_by: '2026-12-01'
question: 'On the 8 dev folds (2022-01-01..2025-10-01, expanding refit of the registered recipe, tau 0.10), is the mean net R per decision of
  the trend-aligned side gate at least +0.05 above the ungated both-sides policy, with a week-clustered t >= 2?'
why_this_matters: 'D3 is the entry model on real money (ml_decision_entry_v1r20261122). Its dev OOS edge is ~0 (+0.003 R/decision pooled, se
  0.018) and its live sides split by regime. A pass is the evidence for a data-backed Tier-3 proposal for a trend-aligned side gate on
  ml_entry (confirmation on a fresh window first); a fail closes the trailing-trend gate and leaves the point-in-time macro features
  (Foxhound-2) as the next D3 lever.'
power:
  expected_n: 36000
  min_detectable_effect: 0.05
  effect_units: R_per_decision
  sd: 1.1
  design: independent_arms_week_clustered
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATE from the committed record: the both-sides dev arm has n 71,334, mean +0.003, week-clustered se 0.018 (MEASURED, summed over
    the 8 folds x sides). The gated arm is a subset (about half the decisions, estimate 30-40k) so its own clustered se is ~0.025 and the
    two arms share weeks, so se(delta) is estimated at 0.02-0.03. Then t >= 2 needs delta >= 0.04-0.06 and the 80%-power effect is
    ~0.056-0.084: +0.05 is only marginally powered. INDETERMINATE is therefore a live outcome and is stated now; the unit reports the
    realised se so the next step is chosen from it, not re-run at another rule.'
