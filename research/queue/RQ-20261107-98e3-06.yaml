  power: 0.8
  basis: 'DESCRIPTIVE dev stage (no pass bar). INFERRED: the v1 read took 1099 restricted-long trades over 13 months on this pool; the walk-forward OOF window is
    ~30 months, so several thousand OOF decisions per config/tau before the tau filter. Selection needs >= 300.'
  feasibility:
    source: none
    accrual_basis: Replays Alpaca 1h RTH history 2021-01-01 .. 2025-06-30; nothing accrues.
decision_rule:
  id: RULE-RQ20261108-98e3-06-ENS-DECISION
  registered_at: '2026-11-08'
  registered_before_run: true
  statistic: 'scripts/research/ml_entry_equity.py structure --ensemble-seeds 1,2,3,4,5 --taus 0.2,0.25 --min-mean 0.04: pooled restricted-long mean net R per decision
    under the structure exit over decisions closing in 2025-07-15 .. last complete month, n, n_symbols, iid se, month-clustered se (reported), by month, by symbol;
    ledger family ENTRY-EQ, N = prior ENTRY-EQ reads on this window and symbol set + 1 (= 3), bar = holdout_lock.bar_for(N).'
  rule: 'INDETERMINATE IF pooled n < 30. PASS IF (a) confirm mean net R >= bar.point_t_min * iid se (N=3: t_min 0.8528) AND (b) the selected tau''s dev pooled OOF
    mean net R > 0 AND (c) confirm mean >= +0.04 R (the registered seed-noise margin: the observed unpinned-fit spread at tau 0.20, +0.083 vs +0.1222). FAIL otherwise.
    PASS is a holdout pass and a real-money CANDIDATE only; the month-clustered t is reported beside it; no config is changed by this unit. If RQ-20261107-98e3-04
    reads SEED-NOISE-DOMINATED with range R > 0.04, the lane reports that the margin understates the noise and the operator decides whether the pass is enough. Thresholds
    never change after any result.'
  what_it_does_not_do: No config or roster change, no export, no order. Does not re-score the pinned single-seed sibling. This is the third read of the window (declared;
    the bar is deflated for it).
  min_n: 30 pooled decisions
  amended_registration: '2026-11-08 ~00:50Z, BEFORE dispatch, on the manager''s instruction (Manager 2026-11-07a, 00:42Z): the tau grid is restricted from {0.20,
    0.25, 0.30} to {0.20, 0.25}. Reason: RQ-20261107-98e3-04 read the seed range at tau 0.30 as 0.152 (vs 0.047 at 0.20) with ~1000 dev trades, so at tau 0.30 (~190
    confirm trades, iid se ~0.08) both PASS and FAIL would be uninformative and the unit spends the last planned read (N=3) of the confirm window. Every other threshold
    is unchanged: N=3 point bar (t_min 0.8528), dev OOF of the selected tau > 0, confirm mean >= +0.04 R, INDETERMINATE if n < 30. No outcome of this unit has been
    read.'
