    on XRPUSDT for this window and the lever FAMILY is NOT retired (scripts/research/family_retirement_policy.yaml); the record names the arm that moved closest. Thresholds and the arm grid are not changed
    after any result.'
  statistic: 'scripts/research/exit_lever_ablation.py --leg fvg_range_15m --symbol XRPUSDT --grade replace, 1830 fetch days and 6 folds by entry time, net of the full cost stack the harness resolves per
    venue (execution_costs.resolve_cost_policy, recorded per arm as cost_stack). Arms fixed now: A = the config as declared in config/strategies.yaml on XRPUSDT; candidate S_ASIA. Per arm: n, net_total_r,
    max_drawdown_r, net R per fold.'
