question: 'On a config-exact twin of trend_donchian_eth_4h on SOLUSDT 4h (every param unchanged except symbols[0] and the arm cell), 2020-07-01..2026-10-15, six calendar folds by entry
  time, full cost stack the harness resolves: is the paired per-trade net R of S10T4 minus B > +0.03 R with t >= 2.0, and does S10T4
  out-earn B in >= 5 of 6 folds?'
why_this_matters: 'PASS -> S10T4 is a data-backed Tier-3 bracket proposal for trend_donchian_eth_4h (two disjoint windows), and D6 has measured
  headroom, ONLY IF the sibling twin (BTCUSDT) also passes: then a learned entry bracket (Pointer) is worth authoring against S10T4 as the
  static baseline. FAIL on either twin -> the ETHUSDT selection did not hold on disjoint symbols; the D6 ceiling is flat on all three legs read (ada, xrp, eth) and D6 parks with a re-entry test.'
decision_rule:
  id: RULE-RQ20261126-1e75-03-D6-CEILING-TWIN
  registered_at: '2026-11-26'
  registered_before_run: true
  min_n: 39
  statistic: 'exit_lever_ablation.py --symbol SOLUSDT --grade paired --baseline B --candidate S10T4 over 2020-07-01..2026-10-15 (--days 2330), 6 calendar folds by
    entry time, full cost stack the harness resolves per venue: mean_dR = mean over paired trades of net_r(S10T4) - net_r(B), t, fold wins.'
  rule: >-
    Registered 2026-11-26 BEFORE any run of these arms on SOLUSDT; bars from the 11d7-17 / cf48-01 rule ("same bars"). S10T4 is CONFIRMED only
    if this unit AND its sibling twin (BTCUSDT) both PASS; this unit's own verdict is graded alone. PASS iff mean_dR > +0.03 R per
    paired trade AND t >= 2.0 AND S10T4 out-earns B in >= 5 of 6 folds (the harness's candidate_beats_incumbent at --paired-min-mean 0.03,
    --paired-t-bar 2.0, --fold-majority 5). FAIL on incumbent_beats_candidate or tie_keep_incumbent. INDETERMINATE iff n(B) or n(S10T4) <
    39, or fewer than 80% of the smaller arm's trades pair by entry time (entries_diverge: the tighter stop frees the position sooner, so
    entries can drift), or the producer failed. On entries_diverge the registered first variant is the same two arms under --grade replace
    (net_r(S10T4) - net_r(B) >= 0.03 R x n(B), >= 5 of 6 folds, maxDD(C) <= 1.35 x maxDD(B)) on the same window. Nothing is changed
    after a result.
  what_it_does_not_do: Edits no config, roster or order path. A PASS is a Tier-3 proposal, not a promotion. R is stop-denominated, so a tighter
    stop changes R per trade; the paired grade reads net R per trade on each arm's own risk, as the selection did.
