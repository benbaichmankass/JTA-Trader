  at 1h the sweep reversal''s per-trade R is small against a fixed round-trip cost, so the cost share, not the signal, decides it (fade 1h loses
  0.14 R/trade at 27% win, RQ-20261006-007); a 4h bar roughly doubles the ATR in price terms against the same bps cost, which was not tried for
  this arm. Lane AUTHOR-FLOOR-1022 (research runnable floor 33 vs 65 at 17:40Z). Prior ids: RQ-20261018-ef5d-09, RQ-20261006-007. theme timeframes
  was short in the 17:40Z health check.'
