id: RQ-20261127-c4e2-04
title: 'ml_entry PRETRAINED TS-ENCODER lever: on the registered dev folds, do 8 principal components of a FROZEN Chronos (chronos-t5-small)
  encoding of each decision row''s trailing 256 hourly closes, added to the 20 registered features, beat the recipe and a matched 8-noise-column
  placebo, net of cost?'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: experiment
origin: follow_up
practice_precedent: 'M3, M10, T2 (docs/reference/trading-and-model-practice-principles.md): one lever per arm against the registered recipe and a
  same-shape placebo on the same folds; model-family diversity (frontier-research). Applied per .claude/skills/drift-remediation/SKILL.md step 3,
  from the c4e2-01 decomposition (run 45976150814).'
question: On the registered ml_entry dev folds (8 half-year folds 2022-01-01..2025-10-01, purge + embargo, tau 0.10, the harness cost stack),
  is mean net R per decision higher when the two LightGBM regressors also see 8 PCA components of a frozen Chronos encoder state over each
  row's trailing 256 hourly closes (PCA fitted on each fold's train rows only) than with the registered 20 features, and higher than the same
  recipe plus 8 N(0,1) columns?
why_this_matters: 'c4e2-01: the served v1 made -0.085 R/decision on 2026-11 (longs -0.46). The side and regime arms are spent (f1a0-01/03,
  e1a7-01, d3a1-01), TabICL is closed (7ab1-02) and the GRU line is closed (9e73). c4e2-02/-03 test staleness and GBDT capacity. A pretrained
  time-series encoder is the untested family: it brings a representation learned on a large external corpus of series, which a 20-feature GBDT
  cannot build from our own history. A PASS makes these columns a candidate input for the next challenger.'
evidence_class:
  holdout: dev_folds
  claim: edge
power:
  expected_n: 50000
  min_detectable_effect: 0.0068
  effect_units: R
  sd: 1.2
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'alpha is the tabulated power-floor level (as f1a0-01); one arm, so the LEVER_RULE bar t >= 2.0 applies unchanged. MEASURED on the
    same folds: f1a0-01 base arm n 72,996 and arm n 66,803 decisions over the 8 dev folds (run 45484674095). min_detectable_effect = LEVER_RULE
    min_delta_r (0.0068 R); INDETERMINATE is a live outcome stated now.'
  feasibility:
    source: none
    accrual_basis: Replays the published Binance klines (metis-market-bp2); nothing accrues.
decision_rule:
  id: RULE-RQ20261127-c4e2-04-TSFM-COVARIATE
  registered_at: '2026-11-27'
  registered_before_run: true
  baseline: the registered recipe refit per dev fold (arm "base"), same rows, tau 0.10, policy and cost stack
  statistic: 'ml_decision_entry.py lever-arms --arm tsfm (lever_verdict / LEVER_RULE): delta = pooled mean net R per decision (tsfm) - (base),
    week-clustered se (arm_diff); delta vs placebo_tsfm (the recipe + 8 seeded N(0,1) columns); folds where tsfm beats base; years with a
    positive yearly delta.'
  rule: 'PASS iff n >= 3000 AND delta(tsfm - base) >= 0.0068 R AND week-clustered t >= 2.0 AND delta(tsfm - placebo_tsfm) >= 0.0068 AND tsfm
    beats base in >= 6 of 8 folds AND the yearly delta is positive in >= 3 years (RULE-ML-ENTRY-LEVER-ARMS-20261124). FAIL iff n ok and delta +
    2.0 se < 0.0068. INDETERMINATE otherwise, AND whenever the encoder did not reach the run (weights, wheel or GPU missing: read_state
    could_not_look). Encoder, context 256, K = 8, PCA-on-train-rows-only and the noise seed are fixed now and never changed after a result.'
  pass_action: 'ONE confirming read on disjoint out-of-time data (2025-10-01 onward, holdout_lock claimed, the deflated ENTRY bar) in its own
    unit; a pass there makes the encoder columns a challenger input (serving needs the encoder on the live path, its own Tier-2 build), applied
    by the manager or a mandate, never by a lane.'
  fail_action: Close frozen-TSFM covariates for crypto ENTRY on research/levers/ml-entry.yaml (with TabICL, GRU and, if they fail, capacity and
    staleness closed, the entry lever map is exhausted for this feature set); no re-run with another context, K or encoder size.
  proposal_mapping: pass -> confirming out-of-time read -> Tier-2/3 packet; fail -> lever closed; indeterminate -> report the realised se (or the
    missing encoder), stop.
  what_it_does_not_do: Promotes nothing; reads no held-out window (dev folds only); fine-tunes nothing; changes no served model, config or
    order path; adds no gate.
  min_n: 3000
