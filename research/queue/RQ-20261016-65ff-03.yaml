  alpha: 0.05
  power: 0.8
  basis: 'd=0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo''s standing E35 floor). expected_n=100 is an ESTIMATE: from the first window''s n(B)
    over the same 730-day length; crypto history before 2024 had fewer trending months so it may be lower. Below 39 baseline trades the unit grades indeterminate
