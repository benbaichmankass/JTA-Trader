    accrual_basis: Re-measurement on freshly fetched keyless Binance Vision candles over a pinned window; the harness replays history, nothing accrues.
decision_rule:
  id: RULE-RQ2026101665ff03-REGIME-CONFIRM
  registered_at: '2026-10-16'
  registered_before_run: true
  statistic: 'Per arm, from the harness''s own --json summary (argv built by regime_debt_matrix.build_harness_cmd plus the arm''s tokens; full cost stack:
    fee + resolved slippage + funding via execution_costs.resolve_cost_policy, never a zero default): total_trades, net_total_r, max_drawdown_r, plus net_r
    per fold over FOUR equal calendar spans (same boundaries every arm). Arms: B = leg as declared; SL = --skip-hours=20,21,22,23. Per candidate C: dR =
    net_r(C) - net_r(B); dDD = maxDD(C) - maxDD(B); fold_wins = folds in which C out-earns B. Also reported per arm, not graded: net_r_per_capital_day (the
    programme headline measure).'
  rule: 'indeterminate IF n(B) < 39 (no committed record exists on this exact window, so arm B is reported as the baseline itself) (underpowered: no verdict,
    never FAIL on thin n). A candidate C PASSES iff dR >= 1.0 R AND dDD <= 0 AND fold_wins >= 3 of 4. PASS reads CONFIRMED (both windows) -> a regime-selectivity
    Tier-3 PACKET note on REGIME-PROGRAM for the manager (walk-forward already satisfied by two disjoint windows), never a config edit. FAIL reads NOT CONFIRMED:
    the first-window pass is recorded as a selection/period artifact and no packet is filed. indeterminate re-asks once on 2020-10-05 .. 2022-10-04 23:59,
    nothing else changed. The 1.0 R bar, the drawdown clause, the 3-of-4 fold majority and the 39 floor are not changed after any result.'
  what_it_does_not_do: 'Does not mine values: the arms are fixed here and may not be edited after any result. Does not edit config/strategies.yaml, config/regime_policy.yaml
    or any roster; a pass is a lead/packet for the manager (Tier-3), never a promotion case. Live/paper P&L plays no part. Tests no other axis.'
