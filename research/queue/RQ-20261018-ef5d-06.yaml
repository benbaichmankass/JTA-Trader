id: RQ-20261018-ef5d-06
title: >-
  Programme 07 TIMEFRAMES, long arm A4: regime-FILTERED daily-bar crypto Donchian-20 (ADX >= 20 at entry; ATR percentile >=
  50; long-only) vs the unfiltered daily arm -- does a regime filter raise net R per trade on weeks-long position trades by
  a material margin, net of cost?
status: done
cadence: once
theme: timeframes
priority: 3
kind: experiment
question: >-
  On the same daily Binance USD-M candles, symbols and window as RQ-20261018-ef5d-03 (requires its record), with baseline
  arm B = Donchian 20, trail 5 x ATR, both sides (identical to ef5d-03's D20), do any of the candidate arms ADX20 (--adx-min
  20), VOL50 (--vol-skip-below-pctl 50) or LONG (--long-only) pass the pooled Stage-0 rule AND beat B's pooled net R per trade
  by >= 0.10 R? A filter trades less often by construction; the question is whether what it keeps is worth materially more
  per trade.
why_this_matters: >-
  Operator 2026-10-18, verbatim intent: 'trend/momentum/position trading, regime-filtered'. The 2026-10-16 idea-family review
  (s11) found every regime test so far was a binary SKIP on 2h-4h legs, where hot-vol skips cut trend's payoff (Hurst-Ooi-Pedersen);
  on daily bars the filter is a different question and untested. Registered as fixed arms against a declared baseline with
  a materiality bar so a 'better' arm is never the best of three by chance alone. Prior short-horizon work this builds on
  and does NOT repeat: RQ-20260930-504 (<=1h discovery grid at live/default params, FAIL at taker cost; squeeze/fade/pullback/fvg/chop
  had NO Stage-A survivor at 5m-30m), blocked/RQ-20260930-505 (its 1m arm), RQ-20261016-1fa6-07 (maker entries do not rescue
  the 15m scalp book, FAIL), the 2026-10-06 prop breadth batch RQ-20261006-005..031 (5m-15m taker FAIL as a configuration
  class), docs/research/idea-family-review-2026-10-16.md s13/s16, rows IR-CRYPTO-DAILY-TREND and IR-INTRADAY-SEASONALITY-HARNESS.
requires_result:
  unit: RQ-20261018-ef5d-03
power:
  expected_n: 110
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: >-
    As ef5d-03 (pooled 39-trade floor; ~110 pooled trades on the unfiltered arm; filtered arms trade less and may read indeterminate
    -- that is a result about the filter's selectivity, not a FAIL).
  feasibility:
    source: none
    accrual_basis: Re-measurement on fetched Binance Vision daily candles over a pinned window; nothing accrues.
decision_rule:
  id: RULE-P7-A4-REGIME-FILTERED-DAILY
  registered_at: '2026-10-18'
  registered_before_run: true
  statistic: >-
    harness_stage0.py --family trend --timeframe 1d --baseline B --delta-r-per-trade 0.10, arms B (unfiltered), ADX20, VOL50,
    LONG; per cell and pooled as ef5d-03, plus per candidate arm delta_r_per_trade_vs_baseline = pooled net_r/trade(C) - pooled
    net_r/trade(B).
  rule: >-
    Arms fixed now: B (baseline), ADX20, VOL50, LONG (candidates). Flags: --folds 6 --fold-majority 4 --n-floor 20 --pooled-n-floor
    39 --breadth-frac 0.5 --baseline B --delta-r-per-trade 0.10. A CANDIDATE passes iff it passes the pooled Stage-0 rule
    AND its pooled net R/trade exceeds B's by >= 0.10 R; PASS iff any candidate passes (best = highest pooled net_r, named)
    -> node P7-A4-confirm (the passing filter alone vs B on ef5d-05's equity weekly cells -- a transfer test on a different
    asset class, not a re-selection). FAIL iff every candidate fails -> regime filters on daily crypto Donchian closed at
    these three levers on this window. INDETERMINATE iff any candidate is indeterminate (thin after filtering) and none passes
    -> the filtered arm's own n is reported and the tree re-asks on the two-family pool. Verdicts are the script's own (scripts/research/harness_stage0.py,
    grades fixed by these flags): per CELL pass iff n >= n_floor AND net_r > 0 AND >= fold_majority of folds calendar folds
    net > 0, fail iff n >= n_floor and not, indeterminate iff n < n_floor; per ARM pass iff pooled n >= pooled_n_floor AND
    pooled net_r > 0 AND pooled folds >= fold_majority AND >= half the POWERED cells (n >= n_floor) pass, indeterminate iff
    pooled n < pooled_n_floor or < 2 powered cells or < half the declared cells measured (a fetch/harness fault is recorded
    per cell, never dropped), fail otherwise. Holm-corrected one-sided t p-values across the arm's cells are REPORTED, not
    graded. A PASS is a LEAD: it opens the programme-07 node named in the tree (a same-symbol overlap read against the live
    legs, then a re-entry case under MD-PROMOTE-S0-S1 built as a new evidence record), never a roster act; a FAIL closes the
    CONFIGURATION on this window, never the family (idea-family review 2026-10-16 negative-result protocol). Thresholds are
    not changed after any result.
  what_it_does_not_do: >-
    Does not edit config/strategies.yaml, config/accounts.yaml or any roster; does not tune beyond the fixed arms listed;
    does not pool windows with any committed record; is not a promotion case. Candles are Binance USD-M (a PROXY for Bybit
    linear; prices track within a few bps) and the funding term is a directionless magnitude (execution_costs P1), both stated
    in the record. Does not author a config/regime_policy.yaml cell (regime-selectivity skill: walk-forward before Tier 3).
