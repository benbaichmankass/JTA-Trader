id: RQ-20261022-4b82-04
title: 'Prop pace VARIANT of the failed fade cells: range-only (ADX <= 20) gating with mid/trail/1R exits on six alt perps'
status: queued
cadence: once
roadmap:
- L-PROP
theme: new_strategy_prop
priority: 2
kind: experiment
question: RQ-20261006-007 (fade XRP 1h), RQ-20261006-019 (fade DOGE 15m), RQ-20261006-025 (fade BTC 15m) graded FAIL. Over 2020-06-01..2026-10-22
  on 6 cells (ADAUSDT,XRPUSDT,LINKUSDT,DOGEUSDT,BNBUSDT,AVAXUSDT) at 1h, does any candidate arm (MID, TRL, TP1) of the fade harness pass the pooled
  Stage-0 rule with breadth AND beat the baseline arm B by >= 0.05 R/trade pooled? The pre-registered hypothesis is that fading only in low-ADX
  (range) conditions, with a nearer exit, removes the trending-breakout losers.
why_this_matters: 'Operator directive 2026-10-22: an idea that failed one test is not dead; it failed the first test. This unit is a registered
  VARIANT of that first test. First test: RQ-20261006-007 (fade XRP 1h), RQ-20261006-019 (fade DOGE 15m), RQ-20261006-025 (fade BTC 15m) graded
  FAIL. DIAGNOSIS (one line): the failed-breakout fade at defaults loses 0.14-0.44 R/trade at 27% win (XRP 1h -0.146 R n=1034; BTC 15m -0.436
  R n=4218): it fades breakouts in trending conditions where the breakout holds; the programme''s own chop gate (--adx-max) was not applied and
  the sweep-reversal arms at 1h on the majors (RQ-20261018-ef5d-09) varied the pierce, not the regime. Lane AUTHOR-FLOOR-1022 (research runnable
  floor 33 vs 65 at 17:40Z). Prior ids: RQ-20261006-007, RQ-20261006-019, RQ-20261006-025, RQ-20261018-ef5d-09. theme new_strategy_prop was short
  in the 17:40Z health check.'
power:
  expected_n: 4000
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: Pooled floor 88 trades (d = 0.3 at alpha 0.05 / power 0.8, the repo's standing floor for this family of units); expected_n=4000 is an
    ESTIMATE from the first test's per-cell counts (cited in the question's prior ids), not a measurement for the variant arms; below the floor
    the unit grades indeterminate, never FAIL.
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ20261022-4B82-04-FADE-1H-RANGE
  registered_at: '2026-10-22'
  registered_before_run: true
  statistic: 'scripts/research/harness_stage0.py --family fade --timeframe 1h, arms fixed now: B=; MID=--exit-style=mid;--adx-max=20; TRL=--exit-style=trail;--adx-max=20;
    TP1=--exit-style=tp1r;--tp-r=1.0;--adx-max=20; baseline B; per cell and pooled across 6 cells; flags --folds 6 --fold-majority 4 --n-floor
    39 --pooled-n-floor 88 --breadth-frac 0.5 --baseline B --delta-r-per-trade 0.05; cost = the harness venue-aware fee + slippage + funding stack
    (execution_costs.resolve_cost_policy), recorded per cell.'
  rule: 'Arms and thresholds are fixed now and are not changed after any result. A candidate PASSES iff it passes the pooled Stage-0 rule (pooled
    n >= 88, pooled net_r > 0, >= 4 of 6 calendar folds net positive, >= half of the powered cells pass) AND beats B''s pooled net R/trade by
    >= 0.05 R. PASS IF one or more candidates pass: the best by pooled net R is named and the follow-up is ONE confirmation unit on a disjoint
    window with the same statistic and bar (a pass on one window is a lead), then the prop/real-money SUPERSET ladder; never a roster edit. FAIL
    IF every candidate fails (n >= floor) -> this variant is closed on this window and the record names which arm moved closest, so the next variant
    is aimed. INDETERMINATE IF pooled n < 88 or fewer than half the cells measured (a fetch/harness fault is recorded per cell, never dropped).'
  what_it_does_not_do: Edits no config and no roster, places no order, is not a promotion case. A best-of-k arm is a LEAD (programme 03 rung S0-C),
    never a finding. Candles are Binance USD-M (a PROXY for Bybit linear); the funding term is a directionless magnitude (execution_costs P1);
    both are stated in the record. Does not pool with any committed record.
