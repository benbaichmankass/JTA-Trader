programme: P2
kind: experiment
question: Does the hold-biased exit head (78fc-05's 13 value heads, features, folds, tau 0.15 unchanged) pass the 78fc-05 clauses on corpus B when its argmax is restricted to the de-risking action classes close, tighten_sl and tp_pull_in?
why_this_matters: 'Iteration 2 (RQ-20261119-2780-05) read the margin lever with tau chosen inside training folds: advice rate fell to 0.0706 (inside the 15% cap) but the pooled mean dR was -0.0275 (LB95 -0.0542, p_random_ge_model 0.99), so the model acts rarely and is still worse than hold. The diagnosis is a winner''s curse: the policy is an argmax over 13 noisy per-action regression heads and the largest predicted value is selected for its noise. Restricting the argmax to the de-risking classes removes the classes that dominated the acted set and add risk (widen_sl, tp_extend, sl_to_structure, tp_to_structure) and shrinks the number of heads competing for the maximum from 13 to the de-risking ones, which is the direct reduction of the selection effect.'
