  search: 'one factor, the allowed action set, fixed now to close,tighten_sl,tp_pull_in (one setting, chosen from the risk direction of the classes and not from any held-out result); heads, features, folds, purge, corpus and the act margin (tau 0.15, as 78fc-05) unchanged'
