  rule: 'PASS iff (a) trade-bootstrap 95% LB of the pooled mean dR > -0.01 R/trade AND (b) held-out advice rate <= 15% AND (c) no leg''s mean dR < -0.05 R/trade (the 78fc-05 clauses, unchanged). FAIL otherwise at >= 500 held-out trades. INDETERMINATE below 500 held-out trades or if the producer fails. Reported, never graded: the matched-random policy, per-fold detail, per-leg dR, action mix. Third read of this model family on one corpus, with a different lever each time: the family-wise denominator is 3 reads and a pass here is a candidate for the disjoint-corpus confirmation, never a promotion. Thresholds and the lever setting are not changed after any result.'
