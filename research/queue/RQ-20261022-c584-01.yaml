id: RQ-20261022-c584-01
cadence: once
theme: ml_health
kind: experiment
title: 'CONFIRMATION of RQ-20261022-3a84-11: does the four-estimator range-vol lift on the SOLUSDT 1h regime head hold on a longer tail that adds ~20000 earlier bars
  the first read never saw?'
status: queued
priority: 2
question: 'RQ-20261022-3a84-11 PASSED on SOLUSDT 1h (tail_rows 40000) while BTC 1h read FAIL and ETH 1h/15m read INDETERMINATE, so the pass is one symbol, one window.
  Same shard, same learners, same folds count and the same thresholds, with tail_rows raised from 40000 to 60000: the extra ~20000 oldest bars are rows the first
  read did not train or test on. Does lgbm_yz still beat lgbm_base by >= +0.010 macro_f1 (CV mean) with a positive post-2026-07-12 holdout delta?'
why_this_matters: 'Research-ops 2026-10-22 14:47Z, step D: a PASS on one window is a discovery, not a confirmation, and 3a84-11 is the only positive of the five 1h/15m
  range-vol reads (BTC 1h FAIL, ETH 1h/15m INDETERMINATE). It decides whether a challenger-manifest note for the SOL 1h regime head goes to the manager. Denominator:
  the pass was chosen from 1 of 5 symbol/timeframe cells read. Overlap disclosure: the newest 40000 bars are shared with the first read; the holdout is the same,
  so the holdout clause is not independent, the CV clause is partly so.'
power:
  expected_n: 24000.0
  min_detectable_effect: 0.1
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'Same as RQ-20261022-3a84-11 with tail_rows 60000: ~36000 OOS rows over 5 folds; rows are not the limit.'
  feasibility:
    source: none
    accrual_basis: 'Fixed by construction (tail_rows of a nightly-rebuilt published shard); n does not grow with waiting. The published BTC 15m shard was whole on
      2026-10-18 (175,296 rows, trainer-vm-diag #18889); the exporter withholds a cut shard, which lands as producer_failed (a route fault, never a verdict).'
decision_rule:
  id: RULE-RQ20261022-C584-01-YZ-CONFIRM
  registered_at: '2026-10-22'
  registered_before_run: true
  statistic: Paired purged-CV delta macro_f1 (lgbm_yz minus lgbm_base) on identical rows of SOLUSDT 1h, and the same delta on the post-2026-07-12 holdout; f1_class:volatile
    reported as a headline check.
  rule: 'PASS IF lgbm_yz beats lgbm_base by >= +0.010 macro_f1 (CV mean) AND > 0 on the holdout. FAIL IF lgbm_yz does not reach > +0.005 vs lgbm_base (CV mean): range-vol
    features add nothing here. INDETERMINATE otherwise, or if folds < 3, the holdout has < 20 rows, or an arm is unavailable. A PASS is NOT a promotion: it releases
    a challenger-manifest note for the manager and a net-of-cost regime-cell walk-forward as the trading gate.'
  min_n: 3 usable CV folds per symbol; holdout >= 20 test rows.
  what_it_does_not_do: 'Promotes nothing, edits no manifest, stage or config. A feature-lift PASS is not edge. Not an independent holdout: the newest 40000 bars and
    the post-2026-07-12 holdout overlap RQ-20261022-3a84-11. A PASS releases the challenger-manifest note and the net-of-cost regime-cell walk-forward named in 3a84-11;
    it does not skip either.'
compute: auto
value:
  bucket: ai_trader
  usd_at_stake_per_month: 120
  confidence: 0.25
  basis: 'stand-in: the vol/regime head gates intents on real-money legs; a better head changes which trades are refused. Not a measured P&L.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  published_data: metis-market-data
  peak_memory_gb: 4.0
  est_minutes: 40
  basis: 'Estimate, NOT measured: RQ-20261022-3a84-11 shape at 1.5x rows; Kaggle CPU via published data.'
ml_bakeoff:
  task: classification
  metric: macro_f1
  dataset:
    kind: jsonl
    groups:
      SOLUSDT:
        path: datasets-out/market_features/SOLUSDT/1h/v002/data.jsonl
    ts_col: ts
    target: regime_label
    features:
    - rolling_log_return_vol
    - log_return
    - log_return_lag_1
    - log_return_lag_2
    - hour_of_day
    - dayofweek
    tail_rows: 60000
    holdout_after: '2026-07-12'
    extra_columns:
    - parkinson_vol
    - garman_klass_vol
    - rogers_satchell_vol
    - yang_zhang_vol
  cv:
    folds: 5
    embargo_rows: 96
    min_train_frac: 0.4
  baseline: lgbm_base
  controls:
  - prior
  candidates:
  - lgbm_yz
  learners:
    lgbm_base:
      kind: lightgbm
      params: &id001
        n_estimators: 200
        learning_rate: 0.05
        num_leaves: 31
        min_child_samples: 50
    lgbm_yz:
      kind: lightgbm
      params: *id001
      feature_blocks:
      - kind: df_columns
        columns:
        - parkinson_vol
        - garman_klass_vol
        - rogers_satchell_vol
        - yang_zhang_vol
    prior:
      kind: prior
  rule:
    min_folds: 3
    pass_if:
    - group:
      - SOLUSDT
      vs: baseline
      op: '>='
      value: 0.01
      window: cv
    - group:
      - SOLUSDT
      vs: baseline
      op: '>'
      value: 0.0
      window: holdout
    fail_if_no_candidate_reaches:
    - group:
      - SOLUSDT
      vs: baseline
      op: '>'
      value: 0.005
      window: cv
run:
  command:
  - python3
  - scripts/research/ml_bakeoff.py
  - --unit
  - '{unit}'
  - --out
  - '{out_dir}'
  timeout_minutes: 120
  inputs:
    research_unit: RQ-20261022-c584-01
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
roadmap:
- M25
- L-REGIME
related:
- RESEARCH-HEALTH-W43
- RQ-20261018-ff8f-01
- btc-regime-15m-lgbm-yz-v1
- research/queue/RQ-20261022-3a84-11.yaml
