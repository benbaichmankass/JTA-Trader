decision_rule:
  id: RULE-RQ20261127-d6c2-02-BRACKET-CEILING
  unit_rule_id: RULE-RQ20261127-d6c2-02-BRACKET-CEILING
  registered_at: '2026-11-27'
  registered_before_run: true
  min_n: 39
  statistic: exit_lever_ablation.py --grade replace over 2020-07-01..2026-10-15 (--days 2330), 6 calendar folds by entry time, full cost stack the harness resolves
    per venue, baseline B = the leg as declared; delta-r 4, delta-r-per-trade 0.03, fold-majority 5 of 6, dd-tol-frac 0.35, n-floor 39.
  rule: 'Registered 2026-11-27 BEFORE any run of the grid. A candidate C REPLACES B iff net_r(C) - net_r(B) >= 4 R AND net_r(C) - net_r(B) >= 0.03 R x n(B) AND net_r(C)
    >= net_r(B) in >= 5 of 6 folds AND maxDD(C) <= 1.35 x maxDD(B). Several pass -> the highest net R is SELECTED. The programme node states >= 4 R in >= 3 of 4 folds;
    with 19 candidates per leg that bar carries no multiplicity adjustment, so this unit keeps the node''s +4 R AND adds b18a-03''s stricter 0.03 R/trade and 5 of
    6 folds (like for like with the ada read). PASS = a SELECTION, unconfirmed: it supports nothing on the order path until the selected cell alone passes a confirmation
    (exit_lever_ablation --grade paired, selected vs B, on the pre-window 2017-09-01..2020-06-30 where the feed exists, same bars). FAIL = no candidate passes with
    n(B) >= 39: the bracket surface is flat on this leg and window. INDETERMINATE if n(B) < 39, every candidate is byte-identical to B, or the producer failed. Thresholds,
    arms and window are not changed after any result.'
  what_it_does_not_do: Edits no config, roster or order path; a PASS is not a promotion and a FAIL does not retire the Pointer family (family review needed, scripts/research/family_retirement_policy.yaml).
    Per-trade R changes with the stop distance (R is stop-denominated), which the replace grade reports beside net R.
follow_up: PASS -> author the registered paired confirmation for the selected cell on 2017-09-01..2020-06-30. FAIL on BOTH d6c2-01 and -02 -> D6 parks with re-entry
