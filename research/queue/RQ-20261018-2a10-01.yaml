id: RQ-20261018-2a10-01
title: >-
  DECISION BAR, per real-money and prop leg: does deciding the entry on the CLOSED bar
  (what Stage 0 scored) beat the live FORMING-bar decision net of the full cost stack,
  by the operator's holdout standard (select on the earliest span, read the one selected
  configuration ONCE on the held-back latest span)?
status: done
cadence: once
roadmap:
- L-LADDER
- M21
theme: live_strategy
priority: 1
kind: experiment

question: >-
  Lane DECISION-BAR-CLOSED-1018 (manager session_01VduHYzdaXe27wTDBLSu8ao, 2026-10-18).
  Six legs trade real or prop money on the pullback / donchian VARIANT builders
  (config/accounts.yaml, read 2026-10-18): xrp_pullback_2h, ada_pullback_2h,
  trend_donchian_eth_4h, trend_donchian_xrp_4h (bybit_2 + bybit_portfolio + bybit_1),
  trend_donchian_sol_prop (bybit_2 + breakout_2 + tradeify_1 + velotrade_1 + bybit_1 +
  bybit_portfolio), trend_donchian_eth_prop (breakout_2 + tradeify_1 + velotrade_1 +
  bybit_1). Five decide on the still-forming bar every ~2 min tick (no `decision_bar`;
  the code default is forming — src/runtime/strategy_signal_builders.py _decision_frame);
  trend_donchian_xrp_4h decides on the closed bar (`decision_bar: closed`, PR #14577).
  Every Stage-0 harness scores the CLOSED bar. PR #18870 (live_bt_trade_join.py) split the
  real-money decay into components and named ENTRY the largest on both pullback legs
  (xrp -5.79R of a -4.78R gap, ada -3.89R of -3.74R; live-only packages created a median
  4.4 / 6.7 min into the bar). Per leg, over 2020-01 .. 2026-10-16 on Binance USD-M 1m
  klines (a LABELLED PROXY for Bybit): which decision bar earns more, net of fee +
  venue slippage + perp funding, by the pre-registered rule below?

why_this_matters: >-
  Real money. RQ-20260929-301 and -302 measured the same two arms with a 90% month-block
  CI rule and were underpowered on every leg (MDE 31-62R per leg, 272R pooled), so no
  decision came out of them; the pooled result was INCONCLUSIVE and the per-leg
  restatement over the record window read xrp_pullback_2h closed +11.75R vs forming
  -7.56R (STANDING_AT_RISK, PI-20260929-VOLSKIP-SIGNAL-0003) while trend_donchian_eth_4h
  read forming +15.58R vs closed +10.32R — forming is not always worse; measure, do not
  assume. The operator set the repo's standard for choosing between configurations on
  2026-10-16 ("Require holdout", PROMOTION-BAR-MULTIPLICITY): one setting selected on
  the earliest span and tested once on the held-back latest span, no deflation. This
  unit applies that standard to the decision-bar choice. A CLOSED_WINS verdict is the
  evidence for ONE Tier-3 proposal PR per leg (`decision_bar: closed`, operator
  approval required); any other verdict changes nothing.

power:
  expected_n: 25
  min_detectable_effect: 0.56
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: >-
    expected_n is the HELD-BACK closed-arm trade count the boundary rule guarantees
    (floor 25, grown from the latest 25% of the window to at most 40%). MEASURED
    full-history closed-arm counts from docs/research/evidence/forming-bar-pooled-2026-09-29.json
    (same arms, same proxy, 2020-01 .. 2026-09-28): xrp_pullback_2h 413, ada_pullback_2h 399,
    trend_donchian_eth_4h 260, trend_donchian_xrp_4h 73, trend_donchian_eth_prop 1202,
    trend_donchian_sol_prop 399 — so the latest 25% holds ~18 (xrp_4h, grows to the floor
    within the 40% cap) to ~300 (eth_prop). At n=25 a one-sample test detects
    d = (1.96 + 0.8416) / sqrt(25) = 0.56 sd of the per-trade dR.
  feasibility:
    source: none
    accrual_basis: >-
      Replays history on freshly fetched public 1m klines pinned to 2026-10-16 23:59Z;
      nothing accrues. The six legs' closed-arm counts above are MEASURED in the
      committed RQ-302 record, not projected.

design:
  data: >-
    Binance USD-M perp 1m klines (data.binance.vision), XRPUSDT / ADAUSDT / ETHUSDT /
    SOLUSDT, 2020-01 (SOL: 2020-09) .. 2026-10-16 23:59Z (pinned with --end), resampled to
    [open, open+tf) bars stamped at open time (Bybit convention) by
    scripts/research/vol_skip_forming_bar_replay.build_bars. A LABELLED PROXY for Bybit —
    api.bybit.com is geo-blocked from the research containers (RQ-20260929-201/301/302).
  arms: >-
    A_closed = run_backtest(decision_bar="closed") — Stage 0 today (closed trigger bar,
    entry at its close). B_forming = run_backtest(decision_bar="forming") — the live
    decision (scripts/research/forming_bar_entries.py: the live unit's own order_package
    on 199 closed bars + the forming bar truncated to each 2-min tick; the first admitting
    tick enters at its price). Harness kwargs generated from each leg's
    config/strategies.yaml block (forming_bar_pooled_regrade.harness_kwargs), the fixed
    live conventions tp_cap_pct 0.099 / timeout_bars 200 / cooldown_bars 1, costs from
    execution_costs (fee default, venue slippage_bps_roundtrip_for, funding per 8h). Only
    the ENTRY decision differs between arms; exits, costs and bookkeeping are the
    harness's own. Prop legs are costed at the Bybit stack, not the prop firm's (stated).
  tool: scripts/research/decision_bar_holdout.py (grades; re-implements nothing — leg_run,
    holdout_boundary, discovery_trades, holdout_trades, pooled_stats, restate are imported).
  not_modelled: >-
    The prop firms' own fee/slippage; the ML exit head (none of the six legs declares
    exit_head_model, checked 2026-10-18); live min-qty refusals and the mirror's
    close-count gap (MIRROR-QTY-DIVERGE) — identical in both arms.

decision_rule:
  id: RULE-RQ-20261018-2a10-01
  registered_at: '2026-10-18'
  registered_before_run: true
  statistic: >-
    Per leg, trades entered on bars with a 200-bar live frame. BOUNDARY, fixed before any
    outcome is read: the latest 25% of the calendar window [first_decision_bar, last bar],
    grown in 1% steps until it holds 25 of ARM A_closed's entries (the Stage-0
    configuration, as the other holdout units place the boundary on the declared arm),
    capped at 40%. DISCOVERY = trades whose entry AND exit precede the boundary; 4 equal
    calendar folds of the discovery span. dR_disc = net R(A_closed) - net R(B_forming) on
    discovery; per-fold dR likewise. HOLDOUT = each arm's trades entered on/after the
    boundary; dR_hold = net R(A_closed) - net R(B_forming), read once. Reported beside,
    never gating: trade-set Jaccard, month-block bootstrap 90% interval and 80%-power MDE
    of the full-history dR (forming_bar_pooled_regrade.pooled_stats), and the leg's
    committed evidence record restated under both arms over the record's own window.
  rule: >-
    SELECTION (discovery only): CLOSED is selected iff both arms hold >= 25 discovery
    trades AND dR_disc >= 5.0R AND closed is ahead in >= 3 of the 4 folds; otherwise the
    INCUMBENT (the leg's live decision bar today) stays selected. VERDICT (incumbent
    forming): INDETERMINATE/insufficient_discovery if either arm holds < 25 discovery
    trades; INDETERMINATE/underpowered_holdout if the boundary hit the 40% cap short of
    25 closed entries; CLOSED_WINS if closed was selected AND dR_hold > 0 — the evidence
    for ONE Tier-3 proposal PR per leg setting `decision_bar: closed` (bybit_2 and
    bybit_portfolio flip together because the key is per leg; operator approval
    required; revert = delete the line); CLOSED_NOT_REPLICATED if selected AND dR_hold
    <= 0 (no change; that leg's closed-bar case is closed on this window);
    FORMING_STANDS otherwise (no change; forming_better_both_spans reported plainly
    when forming is ahead on both spans — never by itself a reason to change a leg).
    For trend_donchian_xrp_4h (incumbent closed) the same statistics map to KEEP_CLOSED /
    KEEP_CLOSED_UNCONFIRMED / RESEARCH_FLAG_FORMING_AHEAD / INDETERMINATE; a reversion to
    forming is a permissive change that would need its own evidence and is NOT proposed
    here. Thresholds are not changed after any result.
    LABEL AMENDMENT AFTER THE RUN (2026-10-18, statistics and thresholds untouched): for the
    closed incumbent, FORMING_STANDS with reason closed_not_robust maps to
    KEEP_CLOSED_NOT_SELECTED, not RESEARCH_FLAG_FORMING_AHEAD — the original mapping
    labelled "closed ahead on discovery but not across the fold majority" as a flag
    against closed, which it is not. The result's label_note records the re-grade.
  what_it_does_not_do: >-
    Edits no config, roster or record and places no order. Uses no live-book P&L as
    evidence of edge: the live join (live_bt_trade_join.py, committed beside) tests the
    TIMING cause of the gap, not returns. Does not grade legs outside the six. Does not
    decide any leg's Stage-2 standing (PI-20260929-VOLSKIP-SIGNAL-0003 stays the manager's).
    A pullback leg's CLOSED_WINS also needs the live pullback builder to HONOUR
    `decision_bar` — today only _trend_donchian_variant_builder does
    (strategy_signal_builders.py, read 2026-10-18); that wiring is a Tier-2 PR of its own,
    not an edit here.

compute: cpu_light
value:
  bucket: own_losses
  usd_at_stake_per_month: 800
  confidence: 0.4
  basis: 'stand-in: four real-money legs on bybit_2 plus two prop legs on three prop
    accounts; not a P&L measurement.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 6.0
  est_minutes: 90
  why_runner: Fetches keyless public 1m klines (data.binance.vision, ~1.6 GB for four
    symbols); Kaggle CPU runs with the internet off; reads no trainer data.
  basis: 'MEASURED on RQ-20260929-302: 15 legs, both arms, 4 workers in ~60 min; six legs
    here, one 1m load per symbol.'

