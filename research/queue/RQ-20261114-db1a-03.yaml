id: RQ-20261114-db1a-03
title: 'DEMO-FLOOR direction-regime unit: does ONE higher-timeframe trend filter on LONGS (own-symbol prior daily close below SMA200 -> skip the long) separate the common record-year
  loss of the 15 crypto demo-floor legs, holding on the year before?'
status: queued
cadence: once
kind: experiment
theme: live_strategy
priority: 1
roadmap:
- L-LADDER
question: 'Across the same 15 crypto testing pullback/Donchian legs (config-exact, live decision bar, full cost stack): are the longs taken while the symbol''s prior daily
  close is below its 200-day SMA a losing cell on the record year 2025-11-13..2026-11-12 AND on the year before 2024-11-13..2025-11-12, with a stable walk-forward drag over
  both?'
why_this_matters: 'Manager ruling 2026-11-14 06:08Z after db1a-02: the record-year loss is common (12/15 legs, pooled -142.3R vs +106.1R) and sits on the LONG side in every
  ADX cell (longs -131.7R vs +30.7R the year before), while no ADX cell separates it. A long-side market-direction filter is the natural regime lever; a pass points at a harness-native
  Tier-3 proposal and may rescue legs negative in both years (trend_donchian_1h, trend_donchian_eth_prop).'
power:
  expected_n: 2656
  min_detectable_effect: 0.2
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'MEASURED in RQ-20261114-db1a-02 (run 43562273934): 1,343 record-window and 1,313 prior-window trades across the 15 legs; longs are about 55% of them. The gated cell
    must reach n >= 30 on the record window and n >= 10 on the prior window; the walk-forward applies MIN_DIRECTION_TRADES = 10.'
  sd: null
  feasibility:
    source: none
    accrual_basis: Fixed in-hand windows; nothing accrues; Binance / Binance-vision covers them at run time.
evidence_class:
  holdout: in_sample
  claim: edge
