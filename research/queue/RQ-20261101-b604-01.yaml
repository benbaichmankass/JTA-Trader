  effect_units: metric
  sd: 1.0
  design: two_sample
  alpha: 0.05
  power: 0.8
  basis: 'MEASURED: calibration is poor at the top quintile (one seed). No gain on mean net R is expected from R1; R2 can raise the mean only through the top-band repair that b602-01 arm A also tests.'
