id: RQ-20261101-b604-01
title: 'ENTRY lever 6, calibration: does a reliability remap of the score restore a monotone score-to-outcome relation (the precondition for confidence-scaled sizing)?'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: experiment
practice_precedent: 'T1, M6 (docs/reference/trading-and-model-practice-principles.md): purged + embargoed walk-forward; shadow-feature (Boruta-style) controls so a model that cannot reject noise columns
  is not trusted to admit real ones.'
question: 'Dev reading (v1, seed 7): realised net R by predicted-score quintile is +0.008, +0.008, +0.015, +0.023, -0.0075 with mean scores 0.11, 0.14, 0.17, 0.23, 0.38: the score is mis-calibrated at the
  top (slope about zero or negative above the 4th quintile). Arms: base raw score; R1 monotone isotonic remap fit on the training folds; R2 binned reliability remap (20 score bins, realised mean net R of
  each bin from the training folds, shrunk toward the global mean with weight n/(n+200)), allowed to be non-monotone. Evaluation is on each scored fold with the remap fit on its training folds only. Three
  seeds.'
why_this_matters: 'Operator 2026-11-01: 20 features is a regression equation, not algorithmic trading; manager 2026-11-01 ~12:03Z: a family ablation at +0.010 cannot admit anything when the recipe overfits
  with any extra column, so fix the recipe, then the columns.'
