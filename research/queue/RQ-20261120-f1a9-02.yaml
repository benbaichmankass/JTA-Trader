  - comms/research/RQ-20261030-c7a1-01/41134401720/tm_bench_v1_4t7ondlz/*__paths.jsonl
  - --train-corpus
  - corpus_v2
  - --train-sample-mult
  - '4'
  - --seed
  - '11'
  - --rule
  - s_offline
  - --feature-block
  - path_state
  - --label
  - full
  - --learners
  - lgbm_action_value
  - --checkins
  - every_bar
  - --actions
  - close
  - --inner-folds
  - '3'
  - --act-margin-grid
  - 0,0.02,0.05,0.1,0.2,0.3
  - --folds
  - '6'
  - --n-boot
  - '2000'
  - --random-draws
  - '200'
  - --expect-test-corpus
  - tmb-73f5c3660014
  - --expect-train-corpus
  - bp2-f4271084b120
  - --min-train-trades
  - '10000'
  - --out
  - '{out_dir}'
  workflow: research-script-run.yml
  timeout_minutes: 240
  inputs:
    research_unit: RQ-20261120-f1a9-02
