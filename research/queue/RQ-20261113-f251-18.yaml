  diagnosis: 'f251-16 forming ledger (arm A, n 45): 34 losers -29.65R; 12 of them reached MFE +1.08..+1.79R and exited on the trail at -0.22..-0.94R (-7.25R together),
    days to weeks after the peak, so the peak and the exit are on different bars and a floor armed at +1R can bind. A floor at entry turns each into about -cost (roughly
    +7R before the cost of those exits).'
  hypothesis: 'A break-even floor at +1R MFE removes the round-trip losers (12 trades, -7.25R). Its risk is the winners that dip back to entry after +1R before running
    to target: the floor stops those at about 0, which the run measures. PASS needs the net effect to clear Stage 0 at the same fold bar.'
  search: 'Lever-family census on research/levers/tlt_pullback_1d.yaml (2026-11-14): direction and filter TESTED forming (FAIL); exit UNTESTED on the forming bar
    and the closed-bar be_floor_r test was inert (structure exit) -> chosen; sizing_vs_cost inapplicable (cost 0.83R); regime unreadable (ADX unknown).'
  attempt: 3
