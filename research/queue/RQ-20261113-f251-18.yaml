decision_rule:
  id: RULE-DFI3-TLT-BEFLOOR-20261114
  registered_at: '2026-11-14'
  registered_before_run: true
  statistic: exit_lever_ablation --grade stage0 --forming-equity-fetch, one run per arm; timeframe_lever_grade.py --family exit.
  rule: 'AM-ML multiple-testing guard: successive levers on one window fork the paths, so this rule NAMES the leg''s prior lever attempts on the record window and
    ALSO requires the pass to hold at the SAME fold-consistency bar (no earlier forming-replayable window: 1Min coverage begins at the record window''s start). No
    fold bar is relaxed. Prior lever attempts on this window: RQ-20261113-f251-02 (forming baseline, -6.96R n 45), RQ-20261113-f251-11 (short-only, +4.55R, 3/8 folds
    -- FAIL), RQ-20261113-f251-16 (vol_skip_above 0.8, -4.28R, 3/8 folds -- FAIL). ONE arm, ONE value (be_floor_r 1.0, lock 0), chosen from the ledger before the
    run. PASS iff the floor arm passes its own Stage 0 (net_r > 0, n >= 20, >= 5/8 folds positive) AND beats the baseline arm''s net_r. FAIL iff graded and not. INDETERMINATE
    otherwise (a run wrote no verdict or the baseline did not run). If the floor arm''s trades come back identical to the baseline''s, the session reading it records
    the arm as inert on the lever map (no lever response), not as evidence against the floor. Arms, window, folds and floors are fixed now.'
  what_it_does_not_do: Changes no config, roster, order or evidence record. A PASS is a data-backed Tier-3 proposal routed to the manager (the leg stays on the demo
    floor until then); a FAIL is recorded on the lever map with the census updated.
  baseline: tlt_pullback_1d config-exact, forming, no floor, re-run in this unit.
compute: cpu_light
