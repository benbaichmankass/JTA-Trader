id: RQ-20261113-f251-18
title: 'tlt_pullback_1d exit lever: break-even floor at +1R MFE (be_floor_r 1.0) vs none on the forming bar (Alpaca 1Day + 1Min)'
status: queued
cadence: once
kind: experiment
theme: live_strategy
priority: 2
roadmap:
- L-LADDER
question: 'tlt_pullback_1d fails RULE-D1 on the forming bar (f251-02: -6.96R over n 45). Two forming levers failed: short-only (f251-11, +4.55R, 3/8 folds) and vol_skip_above
  0.8 (f251-16, -4.28R, 3/8). The forming ledger shows 12 of 34 losers reached +1.08..+1.79R MFE and then exited on the trail at a loss (-7.25R together). Over 2020-07-27..2026-11-13:
  does a break-even floor armed at +1R MFE pass Stage 0 at the SAME 5/8 fold bar and beat the baseline net of the full cost stack?'
why_this_matters: 'Demo-floor paper leg; DEMO-FLOOR-ITER 3rd lever (manager GO 2026-11-14 00:09Z, after the 2nd-lever census on research/levers/tlt_pullback_1d.yaml).
  The only prior be_floor_r test on this leg (RQ-20261110-73de-04, closed bar, delta 0.0R, indeterminate) ran WITH --structure-exit pivot=5, and the pullback harness
  replaces the chandelier (and the floor folded into it) with the structure stop on every bar (`if _sx is not None: trail = _trail_prev`), so that arm was inert.
  This unit tests the floor on the config-exact leg (no structure exit), where it can bind. No confirmation window exists (1Min coverage begins at the record window
  start), so the guard is met by the same 5/8 fold bar, not relaxed.'
