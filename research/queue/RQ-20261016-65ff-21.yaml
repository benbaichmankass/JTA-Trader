id: RQ-20261016-65ff-21
title: 'Training parity, OFF-VM side, class HMM: does btc-regime-1h-hmm-v1 trained in a Kaggle CPU kernel match the trainer-VM run on the same rows?'
status: queued
cadence: once
theme: ml_health
priority: 2
kind: experiment
question: Trained off-VM (Kaggle CPU kernel, published metis-market-data copy) on the SAME BTCUSDT 1h v002 rows with ts < 2026-10-01 as the trainer reference
  RQ-20261016-65ff-20, does btc-regime-1h-hmm-v1 give the same model within the pre-registered tolerance (the RQ-20261015-8b93-02 rule, unchanged)?
why_this_matters: PI-20261016-P3PFA1GK-0002 clears when each non-LightGBM manifest class has a train_parity PASS or a stated reason to stay on the trainer.
  This is the HMM (ml.trainers.causal_hmm_regime.CausalHMMRegimeTrainer, model_family classification_hmm) class. Its trainer is pure numpy, seeded (config
  seed 42, deterministic quantile init), so the two runs should agree exactly on the same rows. A PASS is evidence for one operator-gated off-VM registry
  write of this class; FAIL/INDETERMINATE keeps the class on the trainer.
power:
  expected_n: 1000
  min_detectable_effect: 0.1
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'Not a significance test: a deterministic replication. LightGBM runs with deterministic=true and fixed seeds, so on the same rows and library build
    the two runs should agree exactly; the tolerance absorbs cross-platform (x86 vs aarch64) and lightgbm-version float drift. n = eval rows (time_aware_holdout
    20% of the rows before the cutoff), reported by the run.'
  feasibility:
    source: none
    accrual_basis: 'Fixed by construction (rows before a fixed cutoff): n does not grow with waiting.'
requires_result:
  unit: RQ-20261016-65ff-20
  verdict: pass
decision_rule:
  id: RULE-RQ2026101665ff21-TRAIN-PARITY
  registered_at: '2026-10-16'
  registered_before_run: true
  statistic: Per-metric difference (off-VM minus trainer) on the identical eval split, plus the share of eval rows given the same predicted class.
  rule: INDETERMINATE IF either run failed or the input differs (sha256 of the rows kept by the cutoff, or their count, not equal -- parity is undefined
    on different rows). PASS IF the input is identical AND every count metric (n_eval, n_train*, support_*) is exactly equal AND every score metric (accuracy,
    macro_f1, weighted_f1, precision_*, recall_*, f1_*) differs by at most 0.01 absolute AND eval-prediction agreement is >= 0.99. FAIL otherwise. Constants
    ABS_TOL / MIN_AGREEMENT in scripts/research/train_parity.py; the rule string is printed into the result.
  min_n: 100 eval rows on each side.
  what_it_does_not_do: Registers nothing, promotes nothing, edits no config or timer. A PASS is evidence for ONE operator-gated registry write of an off-VM
    candidate; it does not move training off the trainer and says nothing about model quality or edge.
compute: auto
value:
  bucket: ai_trader
  usd_at_stake_per_month: 100
  confidence: 0.5
  basis: 'stand-in: gates moving ~86% of training manifests off the saturated trainer; not a measured P&L'
