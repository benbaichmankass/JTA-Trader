  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 15
  basis: 'ESTIMATE: one streamed pass over the 480 MB BTC 15m frame projected to ~16 columns (b819-01 measured the full replay of the same file inside one job).'
