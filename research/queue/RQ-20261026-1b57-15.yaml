id: RQ-20261026-1b57-15
title: 'Daily LONG-only filter, second transfer: does the long-only daily Donchian-20 that won ef5d-06 beat unfiltered daily Donchian-20 on AVAX/NEAR/ATOM/FIL/TRX/ETC?'
status: queued
cadence: once
theme: timeframes
priority: 2
kind: experiment
question: 7c2b-03 transferred the LONG-only filter to basket A (BNB/DOGE/LINK/LTC/BCH/DOT); basket B (AVAX/NEAR/ATOM/FIL/TRX/ETC) is untouched at 1d. Over 2020-06-01..2026-10-26 on daily
  bars, does LONG (--long-only) pass the pooled Stage-0 rule AND beat unfiltered B by >= 0.10 R/trade?
why_this_matters: 'Programme 07 TIMEFRAMES (operator 2026-10-18: lowest-priority theme but get tests into the queue). Prior work this builds on and does NOT repeat: RQ-20261018-ef5d-01
  (cost-viable bar x hold cells), ef5d-03/-04/-06 (daily Donchian / pullback, regime-filtered arms), 7c2b-03 (LONG transfer to basket A), RQ-20260930-504/505 and RQ-20261016-1fa6-07
  (sub-1h FAIL at taker cost). A filter that won on its selection symbols and is then tested on ONE transfer basket is still a two-sample claim; a second symbol-disjoint basket turns
  ''lead'' into a count of independent transfers, which is the multiple-testing denominator the trial ledger (RESEARCH-TRIAL-LEDGER) asks for.'
power:
  expected_n: 120
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d = 0.45 at alpha 0.05 / power 0.8 needs 39 pooled trades. expected_n=120 is an ESTIMATE (7c2b-03's basket-A counts at six symbols), not a measurement; below the floor the unit
    grades indeterminate, never FAIL.
  feasibility:
    source: none
    accrual_basis: Re-measurement on freshly fetched public candles over a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ20261026-1B57-15-DAILY-LONG-TRANSFER-B
  registered_at: '2026-10-26'
  registered_before_run: true
  statistic: 'harness_stage0.py --family trend --timeframe 1d; arms fixed now: B=; LONG=--long-only; baseline B; --delta-r-per-trade 0.10 --folds 6 --fold-majority 4 --n-floor 20 --pooled-n-floor
    39 --breadth-frac 0.5; cost = the harness''s own venue-aware fee + slippage + funding stack resolved by execution_costs.resolve_cost_policy() (never a zero default), recorded per
    cell in the result.'
  rule: PASS iff LONG passes and beats B by >= 0.10 R/trade -> the long-only daily filter has TWO symbol-disjoint transfers recorded (7c2b-03 and this) and the overlap read in P7-Q6
    uses the LONG arm. FAIL iff LONG fails -> the ef5d-06 win does not transfer beyond basket A; recorded on P7-Q5. INDETERMINATE otherwise (cells under the floor named, never lowered).
  what_it_does_not_do: Edits no config and no roster, places no order, is not a promotion case; a best-of-k arm is a LEAD (programme 03 rung S0-C), never a finding; a FAIL closes the
    CONFIGURATION on this window, never the horizon. Candles are Binance USD-M daily/weekly (a PROXY for Bybit linear); funding is a directionless magnitude (execution_costs P1).
compute: cpu_long
value:
  usd_at_stake_per_month: 150
  confidence: 0.25
  bucket: frontier
  basis: 'stand-in: a candidate crypto position-trading leg at alpaca/bybit per-leg risk; an estimate, not a measurement.'
