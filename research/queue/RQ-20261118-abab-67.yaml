decision_rule:
  id: RULE-RQ20261118abab67-LTR-SLSTRUCT-BUF020
  registered_at: '2026-11-18'
  registered_before_run: true
  statistic: 'scripts/research/ltr_action_trigger_s0.py --action sl_to_structure --triggers new_peak on the 8 committed selection corpora; per candidate: r_cost per baseline trade, maxDD and weekly-CVaR5
    cut vs hold, folds held of 6, controls beaten of 200, L1 drop-best-leg; cost = the corpus rows'' recorded full-stack net R.'
  rule: 'PASS iff the harness label for sl_to_structure@new_peak is risk_adjusted_pass: R1 r_cost <= 0.05 R/trade AND R2 (maxDD cut >= 15% OR weekly-CVaR5 cut >= 15%) AND R3 >= 4 of 6 folds hold AND R4
    beats >= 0.9962 of 200 matched random-time books (the Bonferroni family is 13 = the 9 comparisons already read on this corpus plus these 4 arms; every arm counted) AND L1 holds after dropping the best
    leg. A PASS is a LEAD: the iteration pass then compares its folds_held with the default''s 4 of 6 and, only if it is >= 5 of 6 with R1, R2, R4 holding, authors ONE read on the four holdout legs (eth_pullback_2h,
    sol_pullback_2h, trend_donchian_ada_4h, trend_donchian_avax_4h, never used to choose these bounds). FAIL iff the label is any fails_*: this arm is closed on the selection legs and the bounds sweep moves
    to the remaining arms and then to the untested triggers (giveback, momentum_flip, structure_break). INDETERMINATE iff the harness labels it indeterminate (never_fired / underpowered). Thresholds are
    not changed after any result.'
  what_it_does_not_do: 'Applies no stop move to any live trade, edits no config, is not a promotion or apply case (the live-review apply path is MD-TRADE-DESK and Tier 3 for any new action class). The selection
    legs'' corpora are closed-bar harness replays whose recorded exits stand for the live exits only to the extent the harness reproduces them (see the ict_scalp fidelity finding, RQ-20261118-abab-56):
    this is a CLOSED-BAR corpus read, not live-bar evidence.'
practice_precedent: 'M13 and M4 (docs/reference/trading-and-model-practice-principles.md): one-factor sweep of the untested family against a baseline control, every arm counted in the multiplicity family,
  a disjoint in-hand holdout read once for the survivor; T1 (action tested against hold and against a random-time action)'
