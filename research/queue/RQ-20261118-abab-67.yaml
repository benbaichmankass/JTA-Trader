title: 'ITERATION 3 of ltr-sl-to-structure (43b6-01 near-miss, R3 3 of 6 folds): action-bounds sweep, structure buffer 0.2 ATR (default 0.1), on the 8 selection legs: does sl_to_structure@new_peak still
  clear RULE-AM-RISK-ADJUSTED-V1?'
status: done
cadence: once
theme: live_strategy
priority: 2
kind: experiment
question: On the committed Stage-0 corpora of the 8 selection legs (n = 3,921 priced trades), with the live-review action 'move the stop to the swing extreme' fired at the first new-peak trigger, does structure
  buffer 0.2 ATR (default 0.1) clear RULE-AM-RISK-ADJUSTED-V1 (R1 r_cost <= 0.05 R/trade, R2 maxDD or weekly-CVaR5 cut >= 15%, R3 >= 4 of 6 calendar folds, R4 beats >= 99.62% of 200 matched random-time
  books) plus L1 drop-best-leg?
why_this_matters: 'Live-trade-review class ltr-sl-to-structure is an iteration orphan (research/scripts iteration_orphans.py 2026-11-18): its two results are a PASS on the selection legs (ed2b-03) and a
  near-miss FAIL on the holdout (43b6-01, fold clause only). The decision it informs is whether the review''s sl_to_structure action is a candidate apply path and, if so, with which action bounds. ed2b-03
  (sl_to_structure, 8 selection legs, n=3,921 priced trades): sl_to_structure@new_peak PASSED RULE-AM-RISK-ADJUSTED-V1 (r_cost +0.0215 R/trade, weekly CVaR5 cut 13.3%, maxDD cut 19.0%, 4 of 6 folds, 200
  of 200 random-time controls beaten) at the default action bounds (pivot 5 bars, buffer 0.1 ATR), chosen from 3 triggers. 43b6-01 (the one confirmation, four holdout legs eth_pullback_2h / sol_pullback_2h
  / trend_donchian_ada_4h / avax_4h, n=1,094): FAIL on R3 only, 3 of 6 folds (R1 r_cost +0.0373, R2, R4 193 of 200 held; L1 drop-best-leg failed). Diagnosis: a near-miss on fold stability, not a null; the
  trigger family was searched (3 triggers) but the ACTION-BOUNDS family (pivot width, buffer) never was (lever map manifest action_bounds: untested), and a stop that is too tight or too loose relative to
  structure is the natural cause of a fold-unstable effect. One-factor sweep of the action bounds on the SELECTION legs only; the four holdout legs stay untouched for one read of whichever variant advances.'
