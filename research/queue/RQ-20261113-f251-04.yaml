id: RQ-20261113-f251-04
title: 'turtle_soup timeframe lever: the live 15m leg vs 1h and 4h through the same harness and window -- does a longer bar (wider stop, lower cost per R) clear Stage
  0?'
status: queued
cadence: once
kind: experiment
theme: live_strategy
priority: 2
roadmap:
- L-LADDER
question: 'turtle_soup fails Stage 0 on every split (RQ-20261101-78fc-12: -81.81R over n 215, 0/6 folds). Its loss is mostly cost: gross -22.3R vs 59.5R of fee +
  slippage + funding at a 41 bps median stop. Run on 1h and 4h bars over the same 2024-10-05..2026-10-04 window and cost stack, does any timeframe pass Stage 0 and
  beat the 15m baseline net of the full cost stack?'
why_this_matters: 'The leg is on the demo floor (testing). Row DEMO-FLOOR-ITER-20261113 keeps it there with one iteration from its own diagnosis; retirement is proposed
  only when every lever family is tested or inapplicable. Lever-family census (research/levers/turtle_soup.yaml holds NO tests; iteration_orphans.py --levers reads
  every family ''.''): entry (sweep depth, reclaim window) untested; exit/TP untested (and the harness cannot measure the TP1 partial + runner -- n_fills=1 on all
  215 trades, the E25 gap -- so an exit unit would grade a harness artefact); regime cell untested but the diagnosis shows no positive cell (every ADX cell negative);
  timeframe untested; symbol population untested; cost/venue untested. Chosen: TIMEFRAME, because the loss is a COST-SHARE loss -- gross -22.3R (-0.10R/trade) vs
  cost 59.5R (0.28R/trade) at a 41 bps median stop -- and a longer bar widens the stop, cutting cost per R; the local smoke (2025-04..2025-10, disclosed) read 15m
  -18.85 n35 (stop 28.7 bps), 1h -25.69 n34, 4h +5.72 n21 (stop 61 bps). The other families stay untested and ranked next: cost/venue, then symbol population.'
