  diagnosis: 'Every split negative: 0/6 folds; long -52.8R, short -29.0R; every ADX-14 cell; every 4h hour block but 08-12h (n 15). Median stop 41 bps; 148/215 trades
    resolve in one bar. Gross by stop tercile: tight -8.8R, mid -12.8R, wide -0.65R -- the loss falls as the stop widens. Cost 0.28R/trade vs gross -0.10R/trade.'
  hypothesis: A wider bar (1h or 4h) lifts the stop distance enough that cost per R falls below the gross edge, and one of them clears Stage 0.
  search: 'Lever-family census (research/levers/turtle_soup.yaml holds NO tests; iteration_orphans.py --levers reads every family ''.''): entry (sweep depth, reclaim
    window) untested; exit/TP untested (and the harness cannot measure the TP1 partial + runner -- n_fills=1 on all 215 trades, the E25 gap -- so an exit unit would
    grade a harness artefact); regime cell untested but the diagnosis shows no positive cell (every ADX cell negative); timeframe untested; symbol population untested;
    cost/venue untested. Chosen: TIMEFRAME, because the loss is a COST-SHARE loss -- gross -22.3R (-0.10R/trade) vs cost 59.5R (0.28R/trade) at a 41 bps median stop
    -- and a longer bar widens the stop, cutting cost per R; the local smoke (2025-04..2025-10, disclosed) read 15m -18.85 n35 (stop 28.7 bps), 1h -25.69 n34, 4h
    +5.72 n21 (stop 61 bps). The other families stay untested and ranked next: cost/venue, then symbol population.'
