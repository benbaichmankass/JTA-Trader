decision_rule:
  id: RULE-DFI-TURTLE-TF-20261113
  registered_at: '2026-11-13'
  registered_before_run: true
  statistic: exit_lever_ablation --grade stage0 per timeframe (one config-exact arm, the leg's own params; --timeframe overrides only the bar), net_r / n / positive
    folds per run; timeframe_lever_grade.py over the three. Candles are fetched at the native 15m bar and the harness resamples up (the fill engine simulates on the
    fine base).
  rule: Registered 2026-11-13 on row DEMO-FLOOR-ITER-20261113 before any run of this arm set (no arm was run on this window before registration; the 6-month local
    smoke disclosed in why_this_matters ran on 2025-04..2025-10, inside the window, and does not alter the rule; a tooling smoke on 2026-07-01..11-01 (15m n27 -5.18R,
    4h n4 -0.60R) checked the native-bar fetch and does not alter it either). Each arm runs as its OWN Stage-0 run through exit_lever_ablation --grade stage0 on the
    same pinned window, feed and full cost stack (fee + slippage + funding from resolve_run_costs); timeframe_lever_grade.py grades them together. PASS iff some candidate
    passes its own Stage 0 (net_r > 0, n >= 30, >= 4/6 folds positive) AND its net_r exceeds the baseline arm's net_r. FAIL iff every candidate is graded (n >= 30)
    and none passes both. INDETERMINATE otherwise (a run wrote no verdict, the baseline did not run, a candidate under its n floor). Arms, window, folds and floors
    are fixed now.
  what_it_does_not_do: Changes no config, roster, order or evidence record. A PASS is a data-backed Tier-3 proposal routed to the manager via AM-ML (the leg stays
    on the demo floor until then); a FAIL is recorded on the lever map and the next untested family is picked.
  baseline: turtle_soup at 15m (its live timeframe) through the same harness, window and cost stack -- 78fc-12's measurement, re-run in this unit so every arm shares
    one corpus.
