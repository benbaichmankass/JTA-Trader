  id: RULE-RQ2026111073de18
  registered_at: '2026-11-10'
  registered_before_run: true
  statistic: 'harness_stage0.py --family pullback --timeframe 4h on 12 perps, 2020-06-01..2026-11-02; ONE arm B = the family declared defaults; net of the harness venue-aware fee + slippage + funding stack
    (execution_costs.resolve_cost_policy). Regime-robustness clause (default template): per-year table read; a PASS with one year above 50% of net gain or a net-negative long or short side is a LEAD with
    that caveat.'
  rule: 'PASS iff the pooled Stage-0 rule holds for B: pooled n >= 39, pooled net_r > 0, >= 4 of 6 calendar folds net positive, >= half of the powered cells pass (Holm across cells as the harness grades).
    INDETERMINATE IF pooled n < 39. FAIL IF pooled n >= 39 and not passed: this family x timeframe at declared defaults is closed on this basket and window; the family stays open. A PASS is a LEAD: ONE
    confirmation on a symbol-disjoint basket or later window, never a roster edit. Thresholds are not changed after any result.'
  what_it_does_not_do: Edits no config or roster and places no order; a pass on one basket and one window is a lead, not edge; not a Tier-3 case.
