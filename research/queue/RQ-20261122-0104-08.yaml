id: RQ-20261122-0104-08
title: 'D5 position aggregation PRE-DEV read: do rule arms A1-A3 beat today''s rule A0 on 2023-04..2024-10 (history no earlier D5 read used)?'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: deterministic
why_not_inferential: 'A fixed replay, not a sample: every arm re-weights the SAME fully replayed solo streams over two fixed windows, so a re-run returns the same numbers.
  The chance element is handled inside the rule by A4 (matched random exposure, 1000 seeded draws, the arm must beat its 95th percentile) and by requiring the SAME arm to clear
  the bar in both windows.'
question: On two disjoint windows before 2024-10 (p1 2023-04..2024-01, p2 2024-01..2024-10) using the same five pair streams, does any of A1-A3 clear the unchanged a474-02
  bar over A0 in both windows?
why_this_matters: 'fa22-06 (split 2025-07-01) was INDETERMINATE, not FAIL: A3 beat A0 in both windows but missed the materiality (>= 5 R), random-null and drawdown bars; a474-02
  FAILED on a different split. Both read 2024-10..2026-10. Same-data re-cuts are robustness reads, not new evidence; pre-dev history is the in-hand window neither used. A3
  clearing the bar on earlier data is the first independent evidence for a learned/rule aggregator (MLP-D5-MASTIFF); A3 failing there closes the split-sensitivity story.'
