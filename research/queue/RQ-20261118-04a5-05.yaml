title: 'D9 Whippet, EXIT order PRICE: does a post-only maker time-stop exit resting at the MID (half a tick inside the touch) with the
  1-minute market fallback improve R per exit over the market exit on v1''s held-out time-stop exits, where the touch at W 1 (aadc-10) and
  W 5 (aadc-02) did not?'
status: done
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: experiment
practice_precedent: 'T-series execution practice (docs/reference/trading-and-model-practice-principles.md): when a resting order''s
  unfilled leg carries the adverse selection, shorten its exposure before abandoning the passive leg; W 1 is in a3f1-01''s registered
  window grid (desk_maker_fills.WINDOWS_MIN = 1, 5, 15). After the window, the resting PRICE is the next one-factor lever (aadc-10
  fail_action): a mid peg trades half a tick of spread capture for a higher fill probability.'
question: 'Same decisions, data, approximation, exit epoch, calibration arm and fallback window as RQ-20261117-aadc-10 (frozen v1 booster,
  60-perp pool, tau 0.10, held-out 2025-10-01..2026-09-30, 24h time-stop exits, W 1). ONE FACTOR CHANGED: the closing order rests at the
  modelled MID (the close of the minute ending at T) instead of the near touch (bid for a buy, ask for a sell, k 0). Is the paired delta,
  maker minus market closing order, positive in R per exit at the deflated level?'
why_this_matters: 'aadc-10 FAILED with the legs moved as predicted but the net flat: fill rate 0.72 -> 0.54, unfilled -18.19 -> -6.87 bps,
  filled +7.18 -> +6.41 bps, net +0.0019 -> +0.0018 R per exit. The unfilled leg is now small, so the binding term is the fill rate; resting
  at the mid raises it at the cost of half a tick per filled exit. Execution stays the binding constraint on the real-money D3 model (cost
  ~90% of v1''s gross, RQ-20261112-a7e8-03). A PASS is a Tier-3 packet, never a self-merge.'
