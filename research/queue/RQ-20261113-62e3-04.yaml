practice_precedent: 'M4, M5 (docs/reference/trading-and-model-practice-principles.md): pre-registered arm grid with a control, every arm counted,
  DSR at the cumulative trial count. Stop-order replication of an option payoff has zero expected value absent drift: Carr & Jarrow 1990
  RFS "The stop-loss start-gain paradox and option valuation".'
