id: RQ-20261026-ed1c-34
title: 'Regime head at 1h: does calibrated sklearn logistic regression beat the shipped-shape LightGBM on logloss on the BTC/ETH/SOL 1h published shards (1h transfer of RQ-20261026-90d3-01..03)?'
status: queued
cadence: once
roadmap:
- M23
theme: ml_health
priority: 2
kind: experiment
question: Does calibrated sklearn logistic regression lower the 3-class regime_label logloss vs lgbm_base (200 trees, 31 leaves, lr 0.05, min_child_samples 50) by >= 0.005 on the CV mean on ALL THREE of
  BTC/ETH/SOL 1h, and by >= 0 on the holdout after 2026-07-12? Same rows for every arm, purged 5-fold walk-forward CV (embargo 96), the six shared features, tail 40000 rows.
why_this_matters: 'Model-FAMILY diversity (frontier-research / ml_plan_status --diversity: 78% of registered models were GBDT). The 15m transfer is RQ-20261026-90d3-01..03; the first-test failure of any
  one learner on one timeframe is not a closed family. Look-before-re-test: grep of research/queue on 2026-10-26 shows no sklearn_hgb/extratrees/mlp/catboost/numpy_logit arm on the 1h regime_label head
  scored on logloss across all three symbols. Lane RESEARCH-FLOOR-20261026 (runnable 32 < computed floor 61, MEASURED 13:30Z by check_research_queue_throughput/health).'
power:
  expected_n: 24000
  min_detectable_effect: 0.1
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: Unit = OOS row per symbol. tail_rows 40000 with min_train_frac 0.4 leaves an ESTIMATED ~24,000 OOS 1h rows per symbol over 5 folds until the first run replaces it with the measured n. d=0.1 paired
    needs ~785 rows so rows are not the limit; bars are autocorrelated, so the rule also requires fold-mean deltas (min_folds 3) on all three symbols.
  feasibility:
    source: none
    accrual_basis: Fixed published shard; nothing accrues.
decision_rule:
  id: RULE-RQ20261026ed1c34
  statistic: 'Paired per-fold logloss difference on identical purged folds (5, embargo 96) and on the holdout (rows after 2026-07-12), per symbol: lgbm_base minus the candidate (positive = candidate better);
    mean over folds. Reported, not graded: every arm minus the class prior.'
  rule: 'PASS IF candidate improves logloss by >= 0.005 on the CV mean on ALL THREE symbols AND >= 0 on the holdout on all three: the learner family adds information over the shipped-shape head at 1h (a
    disjoint-window confirmation follows before any manifest note; trial count 1). FAIL IF the candidate is worse than lgbm_base on the CV mean on EVERY symbol (record the exact configuration in the plan
    family history; the family stays open for other configurations). INDETERMINATE otherwise, or if folds < 3 or an arm is unavailable.'
  min_n: 3 usable CV folds per symbol; holdout >= 200 rows per symbol.
  what_it_does_not_do: 'Trains nothing that serves; touches no config, registry, roster or order path; compares unweighted arms on the shared features, not shipped models. A learner-family result is not
    edge and is not a P&L claim. No cost stack applies: this grades a classifier, not a trade; any trade use needs its own net-of-cost unit.'
  registered_before_run: true
  registered_at: '2026-10-26'
compute: auto
value:
  bucket: ai_trader
  usd_at_stake_per_month: 50
  confidence: 0.2
  basis: planning weight for the regime-head quality and model-diversity line (02 Q1.3 / Q4), not a measured P&L
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  published_data: metis-market-data
  peak_memory_gb: 4.0
  est_minutes: 45
  basis: 'Estimate, NOT measured: 3 shards x 2 arms x 5 folds at tail_rows 40000, comparable to RQ-20261022-3a84-09..11 (30 min each, 1 shard); re-declare from the first run.'
ml_bakeoff:
  task: classification
  metric: logloss
  dataset:
    kind: jsonl
    groups:
      BTCUSDT:
        path: datasets-out/market_features/BTCUSDT/1h/v002/data.jsonl
      ETHUSDT:
        path: datasets-out/market_features/ETHUSDT/1h/v002/data.jsonl
      SOLUSDT:
        path: datasets-out/market_features/SOLUSDT/1h/v002/data.jsonl
    ts_col: ts
    target: regime_label
    features:
    - rolling_log_return_vol
    - log_return
    - log_return_lag_1
    - log_return_lag_2
    - hour_of_day
    - dayofweek
    tail_rows: 40000
    holdout_after: '2026-07-12'
  cv:
    folds: 5
    embargo_rows: 96
    min_train_frac: 0.4
  baseline: lgbm_base
  controls:
  - prior
  candidates:
  - cand
  learners:
    prior:
      kind: prior
    lgbm_base:
      kind: lightgbm
      params:
        n_estimators: 200
        learning_rate: 0.05
        num_leaves: 31
        min_child_samples: 50
    cand:
      kind: sklearn_logit_calibrated
      params: {}
  rule:
    min_folds: 3
    pass_if:
    - group:
      - BTCUSDT
      - ETHUSDT
      - SOLUSDT
      vs: baseline
      window: cv
      op: '>='
      value: 0.005
    - group:
      - BTCUSDT
      - ETHUSDT
      - SOLUSDT
      vs: baseline
      window: holdout
      op: '>='
      value: 0.0
    fail_if_no_candidate_reaches:
    - group: any
      vs: baseline
      window: cv
      op: '>='
      value: 0.0
run:
  command:
  - python3
  - scripts/research/ml_bakeoff.py
  - --unit
  - '{unit}'
  - --out
  - '{out_dir}'
  timeout_minutes: 120
  inputs:
    research_unit: RQ-20261026-ed1c-34
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
programme: P2
