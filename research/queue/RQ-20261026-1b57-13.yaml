  (cost-viable bar x hold cells), ef5d-03/-04/-06 (daily Donchian / pullback, regime-filtered arms), 7c2b-03 (LONG transfer to basket A), RQ-20260930-504/505 and RQ-20261016-1fa6-07
  (sub-1h FAIL at taker cost). Programme 07 node P7-Q3-donchian-fail named exactly this follow-on and said why this lever and not another: the daily bar''s holds are weeks long, so the
  exit geometry (how long a winner is allowed to run, and when a dead trade is cut) is the dominant degree of freedom, not the entry.'
