question: 'The v2 candidate (artifact ml/served/ml_decision_entry_v2/model.json, R2 recipe + cost-per-R gate 0.06 + SL 2 / TP 4 ATR, tau 0.07800176, trained through 2026-09-22) FAILED its one W1 read (RQ-20261101-b609-01:
  -0.1161, n=320, vs frozen v1 -0.0405) and is now a TESTING leg on bybit_1 only. This unit is the ONE read of that SAME frozen artifact (no retrain, no threshold or gate change) on a window it has never
  seen: 2026-11-01 00:00Z onward. Edge is decided OFFLINE (OPERATING-PLAN: a live or paper book checks mechanics, never edge): the read is a replay of the frozen artifact on Binance Vision klines of the
  window, with outcomes under the SL 2 / TP 4 bracket and the full cost stack, on the pooled frozen-60 population (traded five beside it). WINDOW CLOSE (label-free, so the date is computed, not declared
  and not chosen after seeing outcomes): the first day D on which the number of candidate decisions since 2026-11-01 (rows whose frozen-artifact score exceeds tau AND pass the cost gate; computed from scores
  only, `ml_entry_levers.py fwd-read --count-only`) reaches 1,100, or 2026-12-31, whichever is first. MEASURED ratio on W1: 594 candidates became 320 policy decisions (0.539), so 1,100 candidates is about
  600 decisions. ACCRUAL (measured): W1 594 candidates in 31 days = 19.2 a day -> D = 2026-12-28; the dev average is 27 policy decisions a day (about 50 candidates a day) -> D = 2026-11-23. The counter
  is run weekly; D is whatever it says. The frozen v1 booster (comms/research/RQ-20261101-c692-06/41324826751/model, tau 0.10, 2/3 bracket) scores the same rows as a second claim, reported and used only
  in condition (c).'
why_this_matters: 'Operator 2026-11-01: 20 features is a regression equation, not algorithmic trading; manager 2026-11-01 ~12:03Z: a family ablation at +0.010 cannot admit anything when the recipe overfits
  with any extra column, so fix the recipe, then the columns.'
