  sd: 0.99
  basis: 'MEASURED by a census run 2026-11-25 (exit_head_kaggle_bakeoff --census-only, the same command with --census-only, local, data.binance.vision
    4h through 2026-11-25): 11,511 harness trades on 60 legs (121-254 per leg), pooled 5-fold OOS n 9,592, MDE 0.0283 R at sd 0.99 R. The sd is
    the per-trade dR sd MEASURED by RQ-20261118-f7c1-02 (se 0.0448 at n 485), not of this population.'
  feasibility:
