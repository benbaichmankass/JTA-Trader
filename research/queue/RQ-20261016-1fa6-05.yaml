id: RQ-20261016-1fa6-05
title: 'Entry PLATEAU, not entry POINT: on ~6 years of ada_pullback_2h, does a CONTIGUOUS band of pullback_frac values (>= 3 adjacent grid arms) each beat the declared
  setting, net of the full cost stack?'
status: queued
cadence: once
theme: live_strategy
priority: 2
kind: experiment
question: 'Seven pullback_frac arms (0.40, 0.45, 0.50, 0.55, 0.618, 0.70, 0.75) against the declared leg on 2020-10-05..2026-10-04, 6 calendar folds. The question
  is not ''which arm is best'' (that is the design that failed: four best-of-3 single-window PASSes, f0e2-05 / f0e2-10 / 470a-05 / 470a-09, all failed fresh-window
  confirmation on 2026-10-14..15) but ''is there a REGION of the axis that beats the declared value everywhere in it''. The proposal value, if any, is the plateau''s
  CENTRE, never the argmax.'
why_this_matters: ada_pullback_2h is a bybit_2 real-money leg. 470a-05 showed F0382 +3.3 R, F0618 +11.8 R, F075 +5.7 R on one window -- neighbours that disagree are
  the signature of noise, and the confirmation (4941-01) duly failed (-1.17 R). The literature (Bailey/Borwein/Lopez de Prado/Zhu PBO; White 2000; Harvey-Liu 2015)
  says a best-of-N point carries selection inflation; a plateau requirement is the standard defence. P3's c56e units moved other axes to 8-fold long windows but still
  grade 'any candidate passes'; this unit is the plateau variant, on the one axis whose confirmation failed.
power:
  expected_n: 330
  min_detectable_effect: 0.2
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'n(B) ~ 330 trades over ~6 years: INFERRED from ~110-120 per 730 days measured in 470a-05/4941-01, times 3. Floor (2.8/0.2)^2 = 196 at d = 0.2: cleared at
    the estimate. Below 39 baseline trades the unit is indeterminate, never FAIL. The 3.0 R per-arm bar over ~330 trades is a materiality bar (~0.009 R/trade), the
    plateau + 5-of-6 fold clauses carry the multiplicity defence.'
  feasibility:
    source: none
    accrual_basis: Keyless Binance Vision candles over a pinned window; the harness replays history, nothing accrues.
decision_rule:
  id: RULE-RQ-20261016-1fa6-05-PLATEAU
  registered_at: '2026-10-16'
  registered_before_run: true
  statistic: 'exit_lever_ablation.py --grade sweep verdict.json, per candidate arm C: dR = net_r(C) - net_r(B), dDD = maxDD(C) - maxDD(B), fold_wins over 6 equal
    calendar folds (full cost stack: fee + resolved slippage + funding via execution_costs.resolve_cost_policy). An arm ''qualifies'' iff dR >= 3.0 R AND dDD <= 0
    AND fold_wins >= 5 of 6 (the harness''s own per-candidate test). Adjacency is the grid order 0.40-0.45-0.50-0.55-0.618-0.70-0.75; the declared value (B) is not
    a grid arm.'
  rule: 'Read from the per-candidate block, NOT the harness''s top-level pass (which is ''any candidate passes'' and is therefore NOT this rule). INDETERMINATE IF
    n(B) < 39 or the run did not evaluate all seven arms. PASS IF >= 3 ADJACENT arms qualify: the plateau is CONFIRMED-ELIGIBLE and the owning row gets a Tier-3 PROPOSAL
    note for the plateau''s centre value, conditional on a disjoint-window confirmation unit (the next ~2 years of data or a different leg family, registered then).
    FAIL IF no run of 3 adjacent arms qualifies: pullback_frac on ada_pullback_2h is honest_negative over 6 years, and ONE isolated qualifying arm is explicitly recorded
    as noise, not a lead. Bars and adjacency are not changed after any result.'
  what_it_does_not_do: Does not edit config or any roster. Does not test other axes or legs (P3 owns those). Does not re-select a point inside a plateau by its dR.
    A PASS is not a promotion case on its own.
