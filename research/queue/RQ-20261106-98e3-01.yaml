title: 'ENTRY-EQ structure-exit retest: does the equity-native ENTRY model RE-TRAINED on LIVE ml_entry structure-exit labels (structure_exit pivot=5;sl_only, config
  B, tau re-selected on the dev walk-forward) clear the DEFLATED holdout bar (N=2) on the 173-ETF pool over 2025-07-15 .. last complete month?'
