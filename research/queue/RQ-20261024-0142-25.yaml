id: RQ-20261024-0142-25
title: 'Programme 07 Q5 variant (first test failed -> variant): does a slower daily Donchian (55 / 100) on the six untested alts beat the 20-day channel?'
status: queued
cadence: once
roadmap:
- L-TIMEFRAMES
- M22
theme: timeframes
priority: 3
kind: experiment
question: On BNBUSDT, DOGEUSDT, LINKUSDT, LTCUSDT, BCHUSDT and DOTUSDT at 1d over 2020-06-01 .. 2026-10-20, does a Donchian entry lookback of 55 or 100 days (declared
  now, trail_mult 5.0) beat the 20-day default pooled, net of the full cost stack, by >= 0.10 R/trade with >= 4 of 6 folds positive?
why_this_matters: 'Lane AUTHOR-FLOOR-1024 (timeframes 2 vs share 3). RQ-20261021-7c2b-03 (LONG-only transfer of the ef5d-06 win to the same six alts) graded FAIL:
  BCH arm B n 43, net -9.8 R, 1 of 6 folds positive (3 trades a year, 36-day mean hold). DIAGNOSIS (hypothesis): the long filter changed which side was taken, not
  how noisy the entry is; at 1d a 20-day channel on a high-beta alt is crossed during ordinary rallies, and the fold losses are concentrated in 2022-2024 chop (folds
  3-4). A 55-day (the classic turtle system-2 entry) or 100-day channel selects only the persistent trends and is the untested lever on this basket.'
power:
  expected_n: 250
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: Pooled floor 39 trades (d = 0.3 at alpha 0.05 / power 0.8, the repo's standing floor for this family of units); expected_n=250 is an ESTIMATE from the first
    test's per-cell counts (cited in the question's prior ids), not a measurement for the variant arms; below the floor the unit grades indeterminate, never FAIL.
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ202610240142-25-1D-SLOW-DONCHIAN
  registered_at: '2026-10-24'
  registered_before_run: true
  statistic: scripts/research/harness_stage0.py --family trend, 1d bars on BNBUSDT,DOGEUSDT,LINKUSDT,LTCUSDT,BCHUSDT,DOTUSDT, 2020-06-01 .. 2026-10-20; pooled across
    symbols on ONE set of 6 calendar folds; net of the full cost stack the harness resolves per venue; baseline B vs candidates D55, D100.
  rule: 'Arms and thresholds are fixed now and are not changed after any result. A candidate PASSES iff it passes the pooled Stage-0 rule (pooled n >= 39, pooled
    net_r > 0, >= 4 of 6 calendar folds net positive, >= 50 % of powered cells pass) AND beats B''s pooled net R/trade by >= 0.10 R. PASS IF one or more candidates
    pass: the best by pooled net R is named and the follow-up is ONE confirmation unit on a disjoint window with the same statistic and bar (a pass on one window
    is a lead), then the prop/real-money SUPERSET ladder; never a roster edit. FAIL IF every candidate fails (n >= floor) -> this variant is closed on this window
    and the record names which arm moved closest, so the next variant is chosen from it (weekly bars on the same basket, or the 55-day arm with the LONG filter);
    the family is NOT retired. INDETERMINATE IF pooled n < 39: extend the window or add symbols in ONE new unit, never lower the floor.'
  what_it_does_not_do: Edits no config and no roster, places no order, is not a promotion case; a Stage-0 pass on one window is a lead for a disjoint-window confirmation,
    not evidence of edge.
