id: RQ-20261013-407c-16
title: >-
  Re-entry cooldown, xrp_pullback_2h: does waiting 4, 8, 16 bars after an exit (vs the declared 1) cut loss clustering net
  of the full cost stack?
status: done
cadence: once
theme: live_strategy
priority: 2
kind: experiment
question: >-
  perf-followup 2026-10-10 lesson L3 (MEASURED, bybit_1 bucket-A n=371): losses cluster - the 10 worst of 82 trading days
  carry 67% of the negative-day R, and XRP is the worst symbol (-20.9R over n=74). A re-entry cooldown is the direct, signal-free
  lever on clustering: after an exit the leg waits N bars before it may enter again. xrp_pullback_2h runs the harness default
  cooldown of 1 bar. On the pinned 730d window (XRPUSDT 2h, 2024-10-05 .. 2026-10-04 23:59), same cost stack as the evidence
  builder, does a cooldown of [4, 8, 16] bars beat the declared 1 on net R by a material margin, with no worse drawdown and
  in at least 3 of 4 calendar folds?
why_this_matters: >-
  xrp_pullback_2h is a live leg; the cooldown touches neither signal, bracket nor sizing, so it is the cheapest lever aimed
  at the one pattern the review measured with confidence (clustered losses). Cooldown was never a column in the M20/M21 matrices.
power:
  expected_n: 122
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: >-
    d=0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo's standing E35 floor, RQ-20261006-002/-004/-060). expected_n
    = 122 is an ESTIMATE from the nearest committed record or the leg's trade cadence, not a measurement of this exact arm
    set. Below 39 baseline trades the unit grades indeterminate (underpowered), never FAIL. The 1.0 R bar is a MATERIALITY
    bar over the whole window, not a significance test; the 3-of-4 calendar-fold majority is what refuses a one-period artifact.
  feasibility:
    source: none
    accrual_basis: >-
      Re-measurement on freshly fetched keyless Binance Vision candles (xrp_pullback_2h, pinned window 2024-10-05 .. 2026-10-04
      23:59); the harness replays history, nothing accrues. expected_n is an estimate, so power_state stays accruing and a
      thin baseline grades indeterminate.
decision_rule:
  id: RULE-20261013407C16-COOLDOWN
  registered_at: '2026-10-13'
  registered_before_run: true
  statistic: >-
    Per arm, from the harness's own --json summary of scripts/backtest_pullback.py (argv built by regime_debt_matrix.build_harness_cmd,
    the evidence builder's own, plus the arm's raw tokens; full cost stack: fee + resolved slippage + funding, never a zero
    default): total_trades, net_total_r, max_drawdown_r, plus net_r per fold over FOUR equal calendar spans of the window
    (same date boundaries every arm). Arms: B = leg as declared, CD4 = --cooldown-bars=4, CD8 = --cooldown-bars=8, CD16 =
    --cooldown-bars=16. POSITIVE CONTROL, first: B must reproduce the committed record (total_trades within 2%, net_total_r
    within 0.5 R). Per candidate C in {CD4, CD8, CD16}: dR = net_r(C) - net_r(B); dDD = maxDD(C) - maxDD(B); fold_wins = folds
    in which C out-earns B.
  rule: >-
    indeterminate IF the positive control fails or n(B) < 39 (underpowered: no verdict, extend the window or redesign; never
    FAIL on thin n). A candidate C PASSES iff dR >= 1.0 R AND dDD <= 0 AND fold_wins >= 3 of 4. PASS IF any candidate passes
    (best = highest dR; the script's generic label reads 'reachable_lever_beats_removed'): a Tier-3 PROPOSAL note on the owning
    checklist row for the manager, never a config edit; two passing candidates within 0.5 R of each other is a preference,
    not a finding. FAIL IF none passes (script label 'no_reachable_lever_beats_removed'): the declared cooldown_bars stands;
    the axis is recorded honest_negative on this window. The 1.0 R bar, the drawdown clause, the 3-of-4 fold majority and
    the 39 floor are not changed after any result.
  what_it_does_not_do: >-
    Does not edit config; does not touch xrp_pullback_2h's signal, gates, bracket or exits; a PASS is a Tier-3 proposal input
    only (mirror equality applies). Says nothing about cross-leg correlation (RQ-20261010-419b-04). B reproduces the committed
    730d-expand record (122 trades, +14.6686 R) as a positive control.
