id: RQ-20261024-f08c-09
title: 'Variant of eba2-13 (far-rung bank failed the 0.02 R/trade bar on xrp_pullback_2h but was positive in 5 of 6 folds): rung and size scan,
  graded as a LEAD'
status: done
cadence: once
roadmap:
- L-ATM
- M20
theme: live_strategy
priority: 2
kind: experiment
question: 'On xrp_pullback_2h, does a far-rung small bank (15-25% at 2.0-2.5 R) beat the declared exit by at least 2.0 R over the window with
  no worse maxDD and a win in at least 4 of 6 folds, at the venue cost stack? DIAGNOSIS of the first test (eba2-13): MEASURED in RQ-20261022-eba2-13:
  P25 (25% at 2.5 R) dR +2.28, folds 5 of 6, maxDD 16.27 vs 16.17; P33 (33% at 2.0 R) dR +1.88, folds 3, maxDD 13.96 vs 16.17; the 0.02 R x 394
  = 7.88 R bar was missed. MEASURED paired: P25 changes 61 of 394 trades, mean dR/entry +0.0058, paired t 1.37 (not significant): a small, possibly
  real effect below the registered bar, not a clear loss. Class: effect below the registered materiality bar (underpowered for its size) on the
  full leg. Because it is positive in sign across several capped-target legs (a1f3-01 xrp_4h +0.32, a1f3-03 sol_4h +0.87, a1f3-04 sol_prop +0.29;
  negative on ada and eth) the unit tests the sign with a scan and a bar sized to the observed effect, graded as a LEAD that needs a disjoint
  confirmation.'
why_this_matters: 'Operator rule 2026-10-22: a first-test fail is diagnosed and re-asked, never retired. Lane EXIT-FAILED-LEVERS-DIAG (2026-10-24),
  row EXIT-FAILED-LEVERS-DIAG, serves eba2-13. Diagnosis and evidence: docs/research/exit-failed-levers-diag-2026-10-24.md. Looked before authoring
  (PLANNING s1): the queue was grepped for the same leg and lever family; no queued or done unit asks this exact arm set. Parents: research/queue/RQ-20261022-eba2-13.yaml,
  research/queue/RQ-20261023-a1f3-01.yaml.'
power:
  expected_n: 394
  min_detectable_effect: 0.14
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'n = 394 is the MEASURED baseline trade count of xrp_pullback_2h in the parent verdict(s). Unpaired one-sample MDE = 2.8/sqrt(n) = 0.14
    sd. Arms share most trades, so the paired difference is far tighter than that (MEASURED in the diag doc: paired sd 0.06-0.5 R per entry);
    the unit''s bar is stated in R and is not claimed to be detectable at the unpaired MDE. A unit whose lever touches a handful of trades is
    reported with its differing-trade count.'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-F08C-09
  registered_at: '2026-10-24'
  registered_before_run: true
  statistic: scripts/research/exit_lever_ablation.py --grade sweep on xrp_pullback_2h, window 2020-07-01 .. 2026-10-15 23:59, 6 calendar folds,
    dR and dDD vs A net of the harness venue-aware stack (fee 7.5 bps round trip, slippage 3.0 bps round trip, funding 1.0 bps per 8h window;
    MEASURED in the parent verdicts' cost_stack).
  rule: 'INDETERMINATE IF n(A) < 39. A candidate arm PASSES iff dR >= 2.0 R (net_r(C) - net_r(A) over the window) AND dDD <= 0 (maxDD(C) - maxDD(A),
    in R) AND it beats A in >= 4 of 6 folds. PASS IF any arm passes (best = highest dR): a LEAD, followed by ONE confirmation unit on a disjoint
    window with the same statistic and bar; only a confirmed pass becomes a Tier-3 PROPOSAL note on the owning checklist row, never a config edit.
    FAIL IF none passes with n(A) >= 39: this variant is closed on this window and the record names the arm that moved closest; the idea is not
    retired. Thresholds are fixed now and not changed after any result.'
what_it_does_not_do: 'Edits no config and places no order. Not a promotion case: a PASS is a discovery needing one disjoint-window confirmation.
  HARNESS CAVEAT (code-read 2026-10-24, scripts/backtest_pullback.py / backtest_trend.py): a stop or ratcheted trail that the bar trades through
  fills AT the stop price, not at a gap-open worse than it, and lever exits fill at the bar close; that flatters every arm in proportion to its
  stop exits, so it favours tight-trail arms. A PASS must be re-run gap-adjusted before any Tier-3 note. '
