decision_rule:
  id: RULE-RQ20261117-aadc-09-D10-H2-STAGE0-CONFIRM
  registered_at: '2026-11-17'
  registered_before_run: true
  baseline: no action; within-leg matched random skip
  statistic: 'scripts/research/d10_basset_baseline.py --stage0-confirm (functions stage0_series + action_replay(h=2)): per leg, Stage-0
    OOS trades entered before 2026-05-01 in entry order; mu per trade = mean winsorised net R of the leg''s trades in folds that ended
    before the trade''s fold (fold_detail start/end); trades in a leg''s first fold are not scored (counted). Trade i is skipped iff the
    CUSUM through trade i-1 is >= 2; added_r = -(sum net R of skipped trades); control_p = (#within-leg random draws with added_r >=
    actual + 1) / (2000 + 1). Reported: skipped count, mean skipped R, legs positive, per-leg added_r, the onset-sign split, series counts.'
  rule: 'INDETERMINATE iff skipped trades < 50. PASS iff added_r > 0 AND control_p <= 0.05 (the aadc-06/-07 rule, H fixed at the
    discovery''s 2). FAIL otherwise. Fixed now; one read.'
  pass_action: 'A confirmed PASS goes to the manager as a data-backed Tier-3 desk-action proposal: demote-on-alarm at H 2 as a standing
