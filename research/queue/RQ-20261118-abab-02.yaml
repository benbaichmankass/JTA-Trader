decision_rule:
  id: RULE-RQ20261118-ABAB-02-D55-HOLDOUT-2H
  registered_at: '2026-11-18'
  registered_before_run: true
  statistic: 'harness_stage0.py --family trend --timeframe 2h: per cell n, net_r, max_drawdown_r, 6 calendar folds (majority 4), net_r_per_capital_day; pooled across the basket''s cells; cost = the harness''s
    own venue-aware fee + slippage + funding stack resolved by execution_costs.resolve_cost_policy() (never a zero default).'
  rule: 'PASS iff D55 passes the pooled Stage-0 rule on this basket (pooled n >= 88, pooled net_r > 0, >= 4 of 6 calendar folds positive, >= half of the powered cells pass) AND beats B by >= 0.05 R/trade.
    FAIL iff D55 fails with pooled n >= 88 (configuration closed at 2h on this basket; family stays open). INDETERMINATE otherwise (pooled n < 88, fewer than 2 powered cells, or under half the cells measured;
    record the realised n_B and the n the bar needs from the measured sd). Regime-robustness clause (set before the run): the pooled result is net positive in at least 3 of 4 calendar years of the window
    (per-year table reported), no single year carries more than 50% of total net R, long-side and short-side net are reported separately and both >= 0, and at least 2 non-overlapping sub-periods are each
    net positive; a failure of this clause downgrades a PASS to INDETERMINATE (reported, never silently dropped). Thresholds are not changed after any result.'
  what_it_does_not_do: 'Edits no config and no roster, places no order, is not a promotion case, does not tune beyond the declared arms, and does not pool with any committed record. Candles are Binance
    USD-M (a PROXY for Bybit linear); funding is a directionless magnitude (execution_costs P1); a symbol listed after the window start contributes only its own history. PROP SUPERSET BAR: this unit supplies
    Stage 0 only; the prop EV/survival gate, a mechanical Stage-1 soak and Gate 2 all still apply and no roster is edited here.'
practice_precedent: 'M13 (docs/reference/trading-and-model-practice-principles.md): confirm a discovery on an untouched in-hand window registered before the run (here a symbol holdout, correlated evidence,
  said so); R1 look-before-you-re-test: the parent''s population is disjoint from this basket (grep of research/queue for these symbols 2026-11-18: DASH/ONT/NEO/SNX/MANA/SAND = 0 units).'
