id: RQ-20261118-abab-02
title: 'Symbol holdout for the D55 prop-pace lead at 2h: does Donchian-55 / trail 6.0 beat Donchian-20 on DASH/ONT/NEO/SNX/MANA/SAND at 2h (the nearest bar to the 4b82-05 lead)?'
status: done
cadence: once
theme: new_strategy_prop
priority: 2
kind: experiment
question: On Binance USD-M 2h candles for DASH/ONT/NEO/SNX/MANA/SAND over 2020-06-01..2026-11-17, with the cost stack fixed, does D55 pass the pooled Stage-0 rule AND beat B by >= 0.05 R/trade?
why_this_matters: '4b82-05''s 2h D55 read (+0.0698 R/trade, 3 of 6 cells) was INDETERMINATE for lack of n, and the 2h bar has ~2x the trades of 4h on the same symbols. A disjoint population at 2h adds n
  to the pooled paired read and tests whether the bar-size result is robust. f679-03 (4h, six 4b82-05 perps, 2020-06..2026-10) PASS: D55 +0.1065 R/trade over B, pooled net +143.4 R, 5 of 6 folds, 4 of 6
  powered cells; the sibling 2h read (4b82-05) was +0.0698 R/trade, 3 of 6 cells, INDETERMINATE (pooled n_B 4,520 below the sd-derived floor) and 1h (f679-02) FAILED. Diagnosis: the 4h lead was selected
  on the same six perps it was measured on (a population-selection risk, not a tuning one), so its read is a discovery; the cheapest disjoint test is a symbol holdout the unit has never touched.'
