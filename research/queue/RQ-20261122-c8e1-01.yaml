id: RQ-20261122-c8e1-01
title: 'ITERATION 3 of ltr-tighten-sl (late cell failed): does the SAME breakeven+0.25R tighten, fired only AFTER momentum has already failed (giveback / momentum_flip
  / structure_break / near_target), clear RULE-AM-RISK-ADJUSTED-V1 vs hold and vs a random-time tighten on the 4,076-trade Stage-0 corpus?'
status: queued
cadence: once
theme: live_strategy
priority: 2
roadmap:
- L-ATM
programme: P1
kind: experiment
question: Over the committed Stage-0 per-trade corpora (8 legs), does moving the stop to breakeven + 0.25 R (>= 1 ATR room) at the first giveback, momentum_flip,
  structure_break or near_target trigger cut maxDD or weekly CVaR5 by >= 15% at <= 0.05 R/trade net of the full cost stack, hold in >= 4 of 6 folds, and beat the
  same tighten at a random bar?
why_this_matters: 'RQ-20261117-43b6-05 graded FAIL: the BE+0.25R tighten at r_milestone (+1R) is HARMFUL (mean dT -0.0777 R/trade, CI -0.1191..-0.0372, 0/200 controls,
  0/6 folds, all 8 legs negative). Diagnosis: a mechanical BE stop at +1R cuts runners that retrace through BE and then continue, so the trigger (open >= +1R) is
  the wrong condition. The harness already prices tighten_be at any trigger; the TRIGGER family of ltr-tighten-sl has never been tested. If a BE stop only helps AFTER
  the trade has shown failing momentum, the loss at r_milestone is a timing artefact and the class is not exhausted; if every momentum-failure trigger also fails,
  the class has failed on timing early, timing late and trigger and goes to a lever-exhaustion family review. The action level (BE+0.25R, 1 ATR room) is held FIXED
  so the trigger is the only variable. One-factor test against the hold baseline.'
