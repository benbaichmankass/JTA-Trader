  verdict_read: fail
  diagnosis: '43b6-05: tighten_be@r_milestone n_fired 1,403 of 3,921 priced trades; mean dT vs hold -0.0777 R (CI [-0.1191,-0.0372]); vs random -0.0555 R; 0/200 controls
    beaten; 0/6 folds; maxDD +4.7% worse, CVaR5 cut 5.6% (bar 15%); per-leg sum_dT negative on all 8 (ada_pullback_2h -50.5 on n 160, trend_donchian_eth_prop -20.8,
    xrp_pullback_2h -12.7). Early cell (-0.041 R) and late cell (this) both fail, so open-R timing is exhausted for BE; the untested family is the TRIGGER (what the
    trade is doing when the stop moves).'
  search: trigger family (4 momentum-failure triggers) with the action fixed (BE + 0.25 R, >= 1 ATR room); arm denominator 4 (+ hold); Bonferroni family n_comparisons
