decision_rule:
  id: RULE-RQ-20261122-c8e1-01
  registered_at: '2026-11-22'
  registered_before_run: true
  statistic: 'Over the pooled committed Stage-0 per-trade corpora in comms/strategy_evidence/ltr_corpus (8 legs), at EACH trigger in {giveback, momentum_flip, structure_break,
    near_target} (ltr_trigger_close_s0.TRIGGERS, first firing per trade): the book with the stop moved at bar j0+1 to breakeven + 0.25 R, taken only when that level
    is >= 1 ATR below the next open (else the trade holds), replayed to the recorded exit with lro.replay_tighten, vs the HOLD book, against 200 matched random-time
    tightens to the same level rule on the same trades.'
  rule: 'RULE-AM-RISK-ADJUSTED-V1 (am_risk_adjusted.grade_risk_adjusted, V1 parameters: R1 r_cost <= 0.05 R per baseline trade; R2 maxDD cut >= 15% OR weekly-CVaR5
    cut >= 15%; R3 >= 4 of 6 calendar folds hold; n_floor 39) with R4 vs 200 matched random-time books at min_control_beat_frac 0.9875 (Bonferroni over 4 trigger
    arms), plus L1: a pass must keep r_cost <= 0.05 R/trade after dropping the leg with the largest favourable contribution. Reported, never graded: the B3 best static
    rule (hold + the 4 trigger arms, chosen leave-one-fold-out). Four pre-registered candidates (n_comparisons 4). PASS: at least one tighten_be@<trigger> clears
    R1-R4 and L1 (a discovery; SCREEN pass, graduation_eligible false until BOOK-SIM-REAL-SIZER; a Tier-3 proposal input, never an apply). FAIL: every candidate fails
    a read necessary clause (R1, R2 or R3) or is beaten by its random control (R4). INDETERMINATE: the best candidate is under the n floor, never fired, carried by
    one leg (L1 fails), or no trade could be priced. Fixed now; not changed after a run.'
  what_it_does_not_do: 'Advice-only research: serves, promotes or applies nothing; adds no gate; changes no config, mandate or roster; places no order.'
