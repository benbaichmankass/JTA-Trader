    same trades, same engine replay, same cost stack. Arm denominator: this is 1 of 5 single-lever Stage-B variants authored together (horizon24, horizon6, signature,
    path_state+signature, mult8); a PASS in one of five is a discovery at denominator 5, not a confirmation.'
  statistic: 'tm_bench score --rule s_offline on the one lgbm arm: delta vs B0 per trade, trade-clustered bootstrap CI95, folds positive of 6, per-leg max drawdown
    vs B0, net R per capital-day vs B0, delta vs B2, B4 margin CI, Holm-adjusted p over the arm family (tm_bench.s_offline).'
  rule: 'PASS (pass_pending_fresh_window) iff tm_bench.s_offline returns pass_pending_fresh_window for the lgbm arm: gain >= 0.03 R/trade over max(B0, B1), CI95 lower
    > 0, >= 5 of 6 folds positive, max drawdown and capital-day checks pass, beats B2, beats its own matched random B4 (margin CI lower > 0), Holm p < 0.05. FAIL
    iff its CI95 upper < max(B0, B1) + 0.03. INDETERMINATE otherwise, or if the test corpus is not tmb-73f5c3660014, the train corpus is not bp2-f4271084b120 with
    >= 10,000 de-duplicated trades after purge, or the selfcheck fails. Thresholds, the action list and the margin grid are fixed now and not changed after any result.'
  pass_action: a fresh-window confirmation unit (forward money-leg trades after the TM-BENCH v1 window, claimed through holdout_lock family TMAV) is authored; only
    a PASS there opens a Tier-3 in-trade advice proposal (advice-only per ARCHITECTURE-CANONICAL "Active management").
  fail_action: iteration 3 closes for close / partial_close_50 on these legs; the next unit is authored from a new diagnosis (a different decision class from ML-EXIT-ACTIONGRID-LABELS,
    or a model class), never a re-run of this configuration.
  what_it_does_not_do: Serves, promotes or applies nothing; changes no config; places no order. The purged folds are walk-forward slices of the test corpus, read
    before by 3144-02 at Stage A; a PASS is explicitly pending a fresh window, which is the claimed held-out read.
