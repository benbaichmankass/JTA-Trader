question: 'Same test rows, training rows, features, label and learner as RQ-20261112-3144-02 (TM-BENCH v1 tmb-73f5c3660014, the six money legs as traded, 6 purged
  calendar folds by entry; train = v1 train trades + a seed-11 trade-grouped sample of corpus v2 bp2-f4271084b120 at 4x the fold''s v1 train-trade count, cross-symbol
  purge; R1 + path_state features; 12-bar per-action label; lgbm_action_value). 3144-02 PASSED Stage A on exactly two classes (close 4/6 folds, partial_close_50 4/6;
  research/results/RQ-20261112-3144-02/). ONE LEVER CHANGED vs RQ-20261115-7e18-01: feature block path_state -> signature. Everything else (test corpus tmb-73f5c3660014,
  corpus v2 train sample, actions close/partial_close_50, inner-fold margin grid, 6 purged folds, learner) is identical, so the response is attributable to this lever.'
why_this_matters: 'ITERATION (research-ops 2026-11-16 0715Z) of ml-tm-action-value after 7e18-01 FAIL: lgbm policy +0.0033 R/trade vs hold, CI95 [-0.0070, +0.0131],
  3 of 6 folds positive, acts on 5.4% of check-ins (measured, research/results/RQ-20261115-7e18-01); B1 -0.0315, B2 -0.0163. The CI upper bound is below the +0.03
  bar, so this configuration is closed. Diagnosis: the policy is not negative (unlike B1/B2) but its gain is inside the noise; competing causes are noise, label horizon,
  feature content and training width. path_state alone carries no market context; the signature block adds path-shape features. Features are the lever 7e18-01 and
  3144-02 never changed. On PASS the model goes to a fresh-window confirmation (Tier-3 advice proposal only after that). On FAIL this lever''s response is recorded
  in the lever map and the next untested family is chosen; the decision (whether in-trade action value is worth a fresh-window read) differs by branch.'
