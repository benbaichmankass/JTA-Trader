  what_it_does_not_do: 'Edits no config and no roster, places no order. A PASS also needs a live producer (see the leg''s monitor) and a Tier-3 declare with the mirror
    in the same PR; it is not a promotion case. The arm set is the whole search: no arm is added after the run, and the baseline is the declared leg, not a tuned
