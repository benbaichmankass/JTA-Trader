id: RQ-20261113-f251-02
title: 'The 16 Yahoo-fed forming-decision equity trend/pullback legs whose records read faithful on the CLOSED bar: 13 re-measured on the FORMING bar from Alpaca
  iex (8 daily ETF legs on 1Day, 5 intraday legs incl. real-money slv_trend_1h on clock-aligned 1Hour), RULE-D1 per leg with n floor 10; the 3 futures legs reported
  out of reach'
status: queued
cadence: monthly
kind: experiment
theme: live_strategy
priority: 1
roadmap:
- L-LADDER
question: 'Sixteen Yahoo-fed trend/pullback legs decide live on the FORMING bar (no decision_bar key, so the runtime default) yet their committed records read fidelity=faithful
  with a reproduce command that has no --decision-bar forming and no 1m source -- they measured the CLOSED bar, and all were generated before #25228 (AM-ML spot-checked
  spy/qqq/iwm_trend_long_1d 2026-11-13 13:32Z). The 8 daily ETF legs replay on the forming daily bar from Alpaca iex 1Day + 1Min (US-session mode, RQ-20261113-1449-01).
  The 5 intraday legs replay on the forming CLOCK-ALIGNED Alpaca 1Hour bar -- the bars live reads (extended hours kept), not the Yahoo RTH :30-aligned bars behind
  their closed-bar records -- with ticks admitted only where the live gate market_hours.is_market_open("us_equity") is true (forming_bar_entries US-INTRADAY MODE).
  Re-measured that way over each record''s window: does each record regenerate faithful, and does each leg with n_trades_oos >= 10 keep net_r_oos > 0 net of the harness
  cost stack (RULE-D1)?'
why_this_matters: 'slv_trend_1h trades REAL MONEY (alpaca_live + alpaca_portfolio) on a record measured on the wrong bar AND the wrong bar series; the C5 roster test
  forbids landing a real-money record as approximate, so it can only move by landing FAITHFUL from a forming replay (AM-ML 2026-11-13, PI-20261113-AMML-0002). The
  other 12 attempted legs are TESTING legs (ib_paper / alpaca_paper) whose edge read feeds any later promotion. Live behaviour of the intraday mode was MEASURED,
  not assumed: 63 slv_trend_1h_eval rows 2026-11-12 15:00-16:10Z show bar_open 15:00 evaluated 15:02..15:57 with a moving close, then bar 16:00 from 16:03 (/api/diag/audit_query).
  The 3 futures legs (mes_trend_long_1d, mgc_pullback_1d, mgc_trend_1h) have no 1m source the runner can read and are reported not attempted. Offline wiring runs
  (2026-11-13, synthetic bars through a fake Alpaca client: spy_trend_long_1d, gld_pullback_1d, slv_trend_1h) regenerated faithful records; their numbers are synthetic
  and carry no information about edge.'
power:
  expected_n: 450
  min_detectable_effect: 0.13
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATE, not measured: committed records hold n_trades_oos of about 1-50 for the 8 daily legs (gld_pullback_1d n 8, spy_trend_long_1d n 11) and about 50-120
    for the 5 intraday legs (slv_trend_1h n 73), roughly 450 pooled. RULE-D1 is graded per leg on its own n and only at n >= 10 (the unit''s floor); below it the
    record still regenerates faithful and the leg reads INDETERMINATE with no edge claim. Said before any run.'
  sd: null
  feasibility:
    source: none
    accrual_basis: 'Fixed in-hand windows: each leg''s committed record window (reproduce.data_start..data_end, else window_days back from the pinned --end 2026-11-13),
      CUT to the Alpaca iex history where shorter (iex begins 2020-07; affects scha_trend_long_1d and tlt_pullback_1d, whose records span 6200 days). The window used
      is read off the data per leg. Nothing accrues.'
