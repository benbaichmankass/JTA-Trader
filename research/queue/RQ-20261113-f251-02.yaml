decision_rule:
  id: RULE-EQUITY-FORMING-REGEN-20261113
  registered_at: '2026-11-13'
  registered_before_run: true
  statistic: 'scripts/research/forming_evidence_regen.py: per leg, Alpaca iex bars + 1Min through equity_1m_source.build (one source for both CSVs, the live feed;
    1Day for a daily leg, clock-aligned 1Hour for an intraday leg, the 1Min set chosen by the measured bar-vs-minute alignment), then build_strategy_evidence --data-csv
    --minutes-1m-csv --decision-session us_equity|us_equity_intraday --folds <record''s>; net_r_oos and n_trades_oos from the regenerated record, the harness cost
    stack.'
  rule: 'Registered 2026-11-13 on row CRYPTO-FORMING-EQUITY-REGEN before any regen run of these legs (the offline synthetic wiring runs are disclosed in why_this_matters
    and do not alter the rule). Per attempted leg: INDETERMINATE iff not measured or the regenerated record is not faithful; else, if n_trades_oos < 10, INDETERMINATE-below-floor
    (record regenerated faithful, no RULE-D1 claim); else PASS iff net_r_oos > 0, FAIL otherwise. A futures leg is NOT ATTEMPTED with its stated reason and does not
    enter the verdict. Unit verdict: INDETERMINATE if any attempted leg is not measured or not faithful, or if every measured leg is below the floor; else FAIL if
    any leg at or above the floor fails (listed); else PASS. Legs, windows, floor, feed, bar series and cost stack are fixed now.'
  what_it_does_not_do: 'Changes no config, roster or order, and writes no comms/strategy_evidence/ record: the regenerated records land under <out_dir>/evidence and
    a session copies them in through a later Tier-1 PR after reading them -- slv_trend_1h ONLY if its record is faithful (C5). A per-leg FAIL, slv_trend_1h included,
    is data reported to the manager via AM-ML; any demotion goes through the manager. It does not replay the 3 futures legs.'
  baseline: The committed closed-bar record of the same leg (its net_r_oos and n), reported beside each forming number; RULE-D1's bar is zero net of cost.
