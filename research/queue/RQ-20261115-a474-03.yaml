  registered_before_run: true
  statistic: 'scripts/research/exit_head_holdout.py --legs trend_donchian_eth_4h,trend_donchian_sol_4h,trend_donchian_xrp_4h,
    trend_donchian_ada_4h,trend_donchian_avax_4h --primary-leg trend_donchian_eth_4h, window 2020-07-01 .. 2026-11-03 23:59, tf 4h.
    Per leg, exactly e4a1-01 steps (a) baseline B config-exact via exit_lever_ablation.py, (b) E0 rows, (e) cost model with the
    1e-3 R self-check against that leg''s emitted costs (a leg failing it, or failing to build, is could_not_look and excluded from
    the pool, never zero). BOUNDARY 2025-04-03 15:00:00+00:00 (e4a1-01''s, registered) applied as a CALENDAR split to every leg:
    DISCOVERY = trades whose entry AND exit precede it, HELD-OUT = trades entered on/after it. (d) the same 19 head arms and the
    hard comparators stale_8_0 / giveback_1_1. (f) the discovery walk-forward runs on the POOLED discovery trades (fold_blocks,
    trades mode, 50-trade blocks, 7-day embargo, train_model unchanged). (g) one model on all pooled discovery rows purged 7 days
    before the boundary; every arm replayed once on each leg''s held-out trades. (h) control per leg: 2000 draws (seed 20261104 +
    leg index in sorted order) truncating that leg''s k = the selected arm''s truncations, each at a uniform random in-trade bar.
    Reported, not graded: per-leg held-out tables, clauses and controls for the four non-primary legs, AUCs, giveback.'
  rule: 'Multiple-testing disclosure: this is the SECOND exit-head read of trend_donchian_eth_4h''s held-out span at this boundary
    (e4a1-01 FAIL stands). INDETERMINATE iff the primary leg could not be measured, fewer than 2 usable pooled discovery folds, or
    the selected arm never fires on the primary leg''s held-out span. ELIGIBLE / SELECTED exactly as e4a1-01 (pooled walk-forward
    net R > B''s, folds >= B in >= ceil(2/3 x usable), >= 1 truncation, mean discovery OOS AUC > 0.55; best eligible by summed net
    R; none -> B selected -> FAIL). PASS iff ALL on trend_donchian_eth_4h''s held-out span: (1) selected is a head arm; (2) n >= 25;
    (3) net R >= B''s; (4) net R >= the better of stale_8_0 / giveback_1_1; (5) max DD <= 1.35 x B''s; (6) net R > the control''s
