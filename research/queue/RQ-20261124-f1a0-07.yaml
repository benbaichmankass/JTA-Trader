title: 'ml_entry CALIBRATED EV + PER-BAR CAP 3: does taking at most 3 entries per decision bar, ranked by calibrated EV, beat the raw recipe and
  a random 3-of-k pick from the same calibrated candidates by +0.0068 R/decision on the dev folds?'
