iteration:
  subject: ml-entry
  subject_kind: ml_model
  from_result: RQ-20261124-f1a0-02/45484678545
  verdict_read: fail
  diagnosis: 'ITERATION 2 of RQ-20261124-f1a0-01 (long_mute, run 45484674095: INDETERMINATE, delta +0.0067 t 0.82, vs random mute +0.0023 -> random
    removal of longs helps about as much) and RQ-20261124-e1a7-02 (top-1 by raw prediction INDETERMINATE). Dev calibration read (local, 2026-11-24,
    registered recipe refit per dev fold, every decision row, n ~477,600 per side, MEASURED): the LONG head''s realised net R is negative in EVERY
    prediction decile (top decile pred +0.28 -> realised -0.044; best decile -0.022); the SHORT head is positive only for preds 0.03-0.22 (+0.000..+0.026)
    and its top decile (pred > 0.22) loses -0.007. So the model''s raw scale is not an EV: tau 0.10 on raw preds takes the overconfident tails
    and every long, and ranking by raw pred (top-1) ranks by the worst tail. The fix is the model''s own calibration, not a gate. ITERATION 2
    of RQ-20261124-f1a0-02 (bar_split FAIL: per-1R -0.0146, bar Sharpe -0.013 vs +0.002; lone-entry bars lose -0.053/decision, 3-8 entry bars
    earn +0.031): equal splitting overweights the worst bars, so the concentration fix is a cap ranked by an EV that is actually calibrated.'
  search: 'lever family selection/portfolio, one fixed rule (no grid): CAP_K 3, rank = calibrated EV, EV_TAU 0.0.'
  levers:
  - threshold
  map_entries:
  - research/levers/ml-entry.yaml
  attempt: 2
  due_by: '2026-12-01'
question: On the 8 dev folds, is mean net R per decision of ev_calib with at most 3 entries per decision bar (top 3 by calibrated EV) at least
  +0.0068 above the recipe AND above a random 3-of-k pick from the same calibrated candidates (t >= 2, >= 6/8 folds, >= 3/4 years)? Uncapped calibrated
  decisions are reported beside it.
why_this_matters: Live bars stacked 4-5 single-signed entries; a cap ranked by calibrated EV is the concentration fix that does not throw away
  the crowded bars that carry the dev edge.
