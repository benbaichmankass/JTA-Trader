id: RQ-20261119-f2a4-04
title: 'P8-Q7 NEW FAMILY, Stage 0 on the alpaca_live cash book: does monthly dual-momentum ETF rotation (best 126-session total return
  of SPYM / SCHA / IEF / TLT / GLD if it beats BIL, else cash) beat buy-and-hold SPYM on drawdown without giving up most of the return,
  on 2010-2023, confirmed once on 2024-2026?'
status: queued
cadence: once
theme: new_strategy_prop
priority: 2
roadmap:
- L-LADDER
programme: P8
kind: experiment
question: 'With the parameters fixed in scripts/research/etf_rotation_stage0.py (lookback 126 sessions, monthly decision at the last
  session close, trades at the next open, catastrophic bracket stop -15%, the cost stack of execution_costs per symbol), replayed through
  the alpaca_live cash book (alpaca_live_book.replay, live sizer constants, one slot, T+1, whole shares): on DISCOVERY 2010-01..2023-12
  does the rotation clear the registered rule against buy-and-hold SPYM on the same book, and if so does the ONE confirm read on 2024-01..2026-10
  hold?'
why_this_matters: 'Decision it changes: whether P8 gets a second candidate family for the real-money cash book. 207f-01 showed the live
  ML leg''s edge is eaten by the one-slot account (slot_busy 872 of 1,016 candidates), so a family that trades rarely and holds ONE
  affordable ETF fits the account by construction. PASS -> the leg goes to the P8-Q4 head-to-head against Foxhound-4 (alpaca_live_book.py
  h2h --trades-from this run''s rotation_trades.json) and, on a pass there, a Tier-3 proposal; FAIL -> this configuration is closed,
  and the record says which clause failed (drawdown or return), which points the next variant (lookback or universe) at the failing
  clause.'
origin: new_hypothesis
origin_reason: Time-series and cross-asset momentum persists because of slow-moving institutional rebalancing and investor under-reaction
  (Moskowitz-Ooi-Pedersen 2012; Antonacci dual momentum). Absolute momentum's value is drawdown avoidance in sustained bear markets,
  paid for by lag at turns. The cash book pays per trade, so a family that trades a few times a year is the cheapest edge the account
  can hold.
levers_declared:
- entry (lookback 126, fixed)
- universe (5 ETFs + BIL, fixed)
- exit (monthly rebalance + catastrophic stop 15%, fixed)
power:
  expected_n: 70
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'INFERRED: monthly rotation among 5 assets switches ~4-6 times a year, so 14 discovery years hold ~55-85 trades; under 39 trades
    or n_taken 30 on the book the unit grades INDETERMINATE, never FAIL.'
  feasibility:
    source: none
    accrual_basis: Replays Yahoo daily history for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ20261119f2a404-P8-ROTATION-S0
  registered_at: '2026-11-19'
  registered_before_run: true
  statistic: 'etf_rotation_stage0.py run: rotation and buy-and-hold-SPYM trade lists per window, net R per trade, per-year table, and
    each list replayed through alpaca_live_book.replay.'
  rule: 'DISCOVERY (2010-01-01..2023-12-31) PASSES iff rotation trades n >= 39 AND book n_taken >= 30 AND net R > 0 AND >= 75% of calendar
    years net positive AND no single year above 50% of total net R AND book max drawdown <= 0.6x the hold book''s AND book return per
    month >= 0.75x the hold book''s. Only then the ONE CONFIRM read (2024-01-01..2026-10-31): PASS iff rotation net R > 0 AND book max
    drawdown <= the hold book''s. INDETERMINATE iff the floors are not met. FAIL otherwise; the failing clauses are named. Long-only,
    so the short-side clause does not apply. Parameters, universe, windows and thresholds are fixed now and not changed after any result.'
  what_it_does_not_do: 'Changes no roster, config or account; places no order. Not a promotion case: a PASS goes to the P8 head-to-head
    first, and a live leg would also need a declared take-profit (TP doctrine), which this Stage-0 rule does not grade.'
compute: cpu_light
