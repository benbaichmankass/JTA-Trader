id: RQ-20261118-a5b3-03
title: 'Execution cost as a markout: is the 1 h and 4 h markout of our fills (fill vs venue mid later, net of fees) worse than the cost
  the journal records (cost_source estimate / broker), by account, leg and order type?'
status: queued
cadence: once
kind: experiment
theme: live_strategy
priority: 3
roadmap:
- L-ATM
programme: P1
origin: new_hypothesis
practice_precedent: 'T3 (strengthened 2026-11-11): practice measures execution cost as a markout, fill vs a later mid net of fees, and
  counts size vs displayed depth and forced exits as cost channels [S74 Jia, Moallemi, Wang & Zeng, AFT 2026, ACAD].'
question: 'Over every filled entry and exit in trade_journal from 2026-09-01 to the run date on bybit_1, bybit_2, alpaca_paper, alpaca_live
  and ib_paper: is the mean signed markout at +1 h and +4 h (side-adjusted, in bps and in R) larger in cost than the per-trade cost
  the journal records, and does it differ by order type (market / limit / stop) and by account?'
why_this_matters: 'Every Stage-0 pass is graded net of the full cost stack, and the stack''s slippage term is an estimate on the floor
  (cost_source estimate) and a broker field on real money; neither is a markout (probe "markout|mark-out" returned 0 in all SKILL.md
  files and 0 units, 2026-11-18). If markouts are worse than the modelled slippage, every net-of-cost verdict is optimistic by that
  gap. Decision it changes: the slippage term in the harness cost stack (a Tier-1 harness change, re-grading affected verdicts) or nothing,
  with the number recorded.'
power:
  expected_n: 600
  min_detectable_effect: 3.0
  effect_units: bps
  sd: 30.0
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'INFERRED: ~600 fills since 09-01 across the five accounts (bybit_1 alone ~60/week per the 11-11 refresh); sd 30 bps at +1
    h assumed; detects ~3.4 bps pooled, per-account reads are coarser.'
  feasibility:
    source: none
    accrual_basis: Reads the journal and public candles; fills accrue daily.
evidence_class:
  holdout: none
  claim: measurement
decision_rule:
  id: RULE-RQ-20261118-a5b3-03-MARKOUT
  registered_at: '2026-11-18'
  registered_before_run: true
  statistic: 'Per fill: markout_h = side x (mid(t_fill + h) - fill_price) / fill_price - fee, h in {1 h, 4 h}, mid from the venue''s
    1m candle close; minus the journal''s recorded cost for that fill, in bps. Mean and fill-grouped bootstrap 95% CI, pooled and per
    account and order type.'
  rule: UNDERSTATED iff the pooled mean (markout cost - recorded cost) at +1 h has CI lower bound > 0 bps; then the unit reports the
    gap per account and order type as the proposed slippage term. NOT UNDERSTATED iff the CI upper bound < 2 bps. INDETERMINATE otherwise,
    or n < 200 fills, or mids missing for > 10% of fills (read_state partial). Fixed now; not changed after a run.
  baseline: the journal's recorded per-fill cost (cost_source estimate or broker).
  what_it_does_not_do: Measures only; changes no harness, config or order path. A cost-stack change is its own Tier-1 harness PR citing
    this record.
compute: cpu_light
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 60
  basis: 'MEASURED locally 2026-11-19: one symbol (XRPUSDT, 105 fills, 1m) ran in about a minute; 26 symbols of 1m candles over ~80
    days, the fetch dominates.'
  why_runner: 'Fetches public candles (bybit / binance vision for crypto, the dukascopy lane research-script-run.yml installs for equities
    and futures); the Kaggle CPU kernel has no internet. The journal read is NOT done at run time: it is the committed export below.'
value:
  usd_at_stake_per_month: 100
  confidence: 0.2
  bucket: own_losses
  basis: the cost term is in every promotion verdict; an estimate, not a measurement.
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
