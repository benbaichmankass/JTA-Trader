id: RQ-20261124-bd30-04
title: 'ITERATION 2 of xrp_pullback_2h: do the map''s "potential" levers adx_max (40/50), cooldown_bars 16 and their joint arm hold on pre-dev XRPUSDT 2h history
  2018-06-01..2019-12-31, a window none of them was selected on?'
status: queued
cadence: once
theme: live_strategy
priority: 2
kind: experiment
question: On xrp_pullback_2h over XRPUSDT 2h 2018-06-01 .. 2019-12-31, does any of AX40 / AX50 / CD16 / AX40CD16 beat the declared leg A net of the full cost stack,
  in >= 3 of 4 folds within 1.35x the drawdown?
why_this_matters: 'xrp_pullback_2h is a production leg whose map holds the only fold-stable gains of any family; the decision is whether adx_max=40 (the cheapest,
  most-supported lever) goes to a Tier-3 declare proposal. On PASS the manager gets the proposal with the 4-arm denominator; on FAIL the lead is an artefact of 2020+
  and the next pass runs regime_gating cells. HONEST LIMIT: 2018-06..2019-12 is a bear/chop XRP regime unlike 2024-26 (when the record''s edge appears), so a FAIL
  is partly a regime statement, not only a no-edge one; a PASS in the opposite regime is the stronger read.'
power:
  alpha: 0.05
  basis: 'ESTIMATE: the declared leg produced ~53 trades on the 2024-10..2026-10 record window and ~415 on 2020-01..2026-10 (ae17-05); scaled by 1.6 years this is
    ~60-100. Not a measurement of this window; below the 25 floor (E35 39 is unreachable on 1.6 years) the unit grades INDETERMINATE, never FAIL.'
  design: one_sample
  effect_units: sd
  expected_n: 60
  feasibility:
    accrual_basis: Re-measurement on freshly fetched public candles over a pinned window; nothing accrues.
    source: none
  min_detectable_effect: 0.45
  power: 0.8
decision_rule:
  id: RULERQ20261124bd3004
  registered_at: '2026-11-24'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg xrp_pullback_2h --grade replace, window 2018-06-01 .. 2019-12-31, 4 folds by entry time, net of the full
    cost stack. Arms fixed now: A=; AX40=--adx-max=40; AX50=--adx-max=50; CD16=--cooldown-bars=16; AX40CD16=--adx-max=40;--cooldown-bars=16. Per arm: n, net_total_r,
    max_drawdown_r, net R per fold.'
  rule: 'INDETERMINATE IF n(A) < 25 or IF every candidate arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C) > net_r(A) AND delta
    >= 0.02 R x n(A) AND net R(C) >= net R(A) in >= 3 of 4 folds AND maxDD(C) <= maxDD(A) x 1.35. PASS IF one or more pass: the best by net R is named (the denominator
    is the 4 candidate arm(s) here) and the follow-up is ONE confirmation unit on a disjoint symbol or venue (ADAUSDT or SOLUSDT twin, same arms) then a Tier-3 declare
    PROPOSAL for the manager, never a config edit. FAIL IF none passes with n(A) >= 25: THIS arm grid is closed for this window and the lever FAMILY is NOT retired
    (scripts/research/family_retirement_policy.yaml); the record names the arm that moved closest. Thresholds and the arm grid are not changed after any result.'
  regime_robustness: 'Reported with the result, not graded here (the grade is the rule above): per-year net R table for every arm, long-side and short-side net R
    separately, and the largest single year share of total net R. Set before the run.'
  what_it_does_not_do: Edits no config and no roster, places no order, is not a promotion case.
practice_precedent: 'M4, M5, M13 (docs/reference/trading-and-model-practice-principles.md): pre-registered arm grid, every arm counted, baseline = the declared leg,
  confirmation on an in-hand window the lead was not read on'
intervention_controls:
  not_applicable: a Stage-0 / parameter-ablation re-measurement of the declared leg through the harness, not an in-trade action or active-management intervention
iteration:
  subject: xrp_pullback_2h
  subject_kind: strategy_leg
  from_result: comms/strategy_evidence/xrp_pullback_2h.json (record n=53, net +6.56 R) and the lever map (filter.adx_max, filter.cooldown_bars)
  verdict_read: indeterminate
  diagnosis: 'Manager-cited PI-20261124-XRPPBITER-0001 asks for an iteration plan. From research/levers/xrp_pullback_2h.yaml: of ~60 tested lever values only three
    families are "smooth, fold-stable gain: potential": filter.adx_max (AX40 +17.85 R 3/4 folds, +19.60 R 4/6; AX50 +6.2; AX60 +3.5 4/4), filter.cooldown_bars (CD16
    +12.0 R, 3/4) and exit.tp_target_r (+0.75..+1.18 R, 5/6, but below its materiality bar). Everything else (stops, trails, bank, structure exits, timeouts, vol
    trails) is worse than the declared leg, and entry pullback_frac is peaked/overfit. Attribution from the record: ADX 20-30 entries +9.98 R (n 22) but 30-40 -2.75
    (n 13) and >=40 -0.67 (n 18): high-ADX entries lose, consistent with adx_max, and the leg is the short side (long -3.98 R n 25, short +10.54 R n 28), though the
    full-history side_filter arms both FAILED (ae17-05), so direction is not the lever. adx_max and cooldown_bars were each read on the 2020+ development windows
    only, so they are discoveries until they hold on data they were not chosen on; the pre-dev 2018-06..2019-12 history is in hand and earlier than every dev window.'
  search: 'filter family confirmation on pre-dev history: arms A, AX40, AX50, CD16 and the interaction AX40CD16, 4 folds. Four candidate arms are the denominator.
    Untested families left for the next pass if this fails: regime_gating (trend/vol cells), timeframe (1h/4h twin), sizing_vs_cost.'
  levers:
  - filter
  map_entries:
  - research/levers/xrp_pullback_2h.yaml#levers.filter.adx_max
  - research/levers/xrp_pullback_2h.yaml#levers.filter.cooldown_bars
