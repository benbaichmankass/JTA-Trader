  leg needs a window the record never saw. A PASS is the evidence for a data-backed Tier-3 change (manager 2026-11-18: ship on PASS);
  anything else leaves it off. It is SIGNAL SELECTION by model score, not the gross-exposure cap the operator rejected on 2026-11-18.'
