decision_rule:
  id: RULE-ML-ENTRY-FIX-ARMS-20261124
  registered_at: '2026-11-24'
  registered_before_run: true
  baseline: the registered recipe on the same folds, rows, tau and cost stack
  statistic: 'scripts/research/ml_entry_fix_arms.py --arm regime_heads: delta = pooled mean net R per decision (arm) - (base) over the 8 dev folds,
    base = the registered recipe refit per fold on the same table; se = week-clustered influence se (ml_decision_entry.arm_diff); folds_better
    = dev folds where the arm mean beats the base mean; years = calendar years of fold starts with a positive pooled delta.'
  rule: PASS iff arm n >= 3000 AND delta(arm - base) >= +0.0068 AND t >= 2.0 AND delta(arm - control) >= +0.0068 AND folds_better >= 6 of 8 AND
    years_positive >= 3 of 4. FAIL iff n >= 3000 AND delta + 2.0 se < +0.0068. INDETERMINATE otherwise. The arm's definition, tau 0.10, folds,
    bar and cost stack are fixed now and never changed after a result.
  pass_action: Enter the arm in the ML-LEVER-PLAN combined held-out read, then a data-backed Tier-3 replacement packet through the retrain workflow
    (serving needs a cell switch in src/runtime/ml_decision_features.py + a parity test). Applied by the operator or a mandate, never by a lane.
  fail_action: Close the 2-cell split; the next iteration is a regime-weighted training set (recent-regime rows up-weighted) authored from this
    diagnosis.
  proposal_mapping: pass -> fresh-window confirmation (bars after 2025-10-01, holdout ledger claim, deflated bar) -> Tier-3 proposal to the manager
    with this evidence record; fail/indeterminate -> the next iteration authored from this diagnosis at once.
