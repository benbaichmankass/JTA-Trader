decision_rule:
  id: RULE-RQ20261113-4654-01-TQQQ-D20-SPY-TWIN
  registered_at: '2026-11-13'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --grade sweep, baseline A (donchian=30) vs D20 (donchian=20) on the SPY twin of tqqq_trend_long_1d,
    2010-06-01..2026-10-22, 4 folds: net_r(D20) - net_r(A), maxDD(D20) vs maxDD(A), fold wins of D20 over A; D20''s absolute net_r and n reported.'
  rule: 'The harness''s registered sweep grade, unchanged: PASS IFF net_r(D20) - net_r(A) >= 0 AND maxDD(D20) <= maxDD(A) AND D20 beats A in >= 3 of 4 folds.
    FAIL if D20 does not (closes donchian=20 on this leg''s config, never the family). INDETERMINATE if n(A) < 25. The bar, the arm value, the window and
    the symbol are fixed now and not changed after any result. ON PASS: the record is the confirmation behind ONE data-backed Tier-3 proposal to change
    tqqq_trend_long_1d donchian 30 -> 20 on its production books (manager merges under the data-backed rule; this unit changes nothing). ON FAIL: donchian=20
    is not confirmed off TQQQ; the leg keeps donchian=30.'
  what_it_does_not_do: 'Changes no config, roster or order. One symbol (SPY), one arm vs the shipped config. Not a TQQQ read: TQQQ''s own history is spent
    for C3 (be01-02). A 2024-07-01 reservation is mentioned in 5a03-03''s text but I found none in scripts/research/holdout_lock.py, comms/research/holdout_reads.jsonl
    (33 rows, none on SPY/QQQ/QLD/SPLG), the operating plan or row HOLDOUT-LOCK, so the be01-02 window is used as is (declared).'
  baseline: 'A = the shipped tqqq_trend_long_1d config (donchian=30) on the same SPY twin, same window, same harness cost stack (exit_lever_ablation''s
    leg harness: fee + slippage; daily long-only ETF, no funding).'
