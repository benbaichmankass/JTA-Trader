question: 'RQ-20261023-be01-02 selected C3 (donchian=20) as best of 5 arms on TQQQ discovery and PASSed it on the TQQQ held-back span (n=34, +3.20 R), so
  TQQQ''s own history is spent for C3. RQ-20261103-5a03-03 tried a FORWARD read and was retired 2026-11-13 (empty window; waiting for new bars is retired
  by RESEARCH-NO-WAIT). This re-registration reads C3 ONCE on an in-hand series it has never seen: the config-exact twin of tqqq_trend_long_1d (every config
  field unchanged, symbols[0] -> SPY via exit_lever_ablation --symbol) over the same 2010-06-01..2026-10-22 window. SPY tracks a DIFFERENT index (S&P 500
  vs TQQQ''s Nasdaq-100), so the selection noise that picked C3 on TQQQ does not carry over the way it would on QQQ/QLD. Does donchian=20 beat the shipped
  donchian=30 on it?'
why_this_matters: tqqq_trend_long_1d is already PRODUCTION (alpaca_live + alpaca_portfolio; scripts/ops/strategy_status.py 2026-11-13) on donchian=30. be01-02's
  C3 (donchian=20) is the only evidence for changing that parameter, and it is unconfirmed (best-of-5 on one series). A forward read waits ~3 years for
  25 trades; an in-hand symbol holdout answers now.
