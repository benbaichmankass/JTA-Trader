decision_rule:
  id: RULE-DFI-HTF-ADX-20261113
  registered_at: '2026-11-13'
  registered_before_run: true
  statistic: exit_lever_ablation --grade stage0 --forming-1m-fetch, one run per arm (A ungated, D20/D25/D30 adx_min); timeframe_lever_grade.py --family filter over
    the four.
  rule: Registered 2026-11-13 on row DEMO-FLOOR-ITER-20261113 before any run of this arm set (no arm was run on this window before registration). Each arm runs as
    its OWN Stage-0 run through exit_lever_ablation --grade stage0 on the same pinned window, feed and full cost stack (fee + slippage + funding from resolve_run_costs);
    timeframe_lever_grade.py grades them together. PASS iff some candidate passes its own Stage 0 (net_r > 0, n >= 30, >= 3/4 folds positive) AND its net_r exceeds
    the baseline arm's net_r. FAIL iff every candidate is graded (n >= 30) and none passes both. INDETERMINATE otherwise (a run wrote no verdict, the baseline did
    not run, a candidate under its n floor). Arms, window, folds and floors are fixed now.
  what_it_does_not_do: Changes no config, roster, order or evidence record. A PASS is a data-backed Tier-3 proposal routed to the manager via AM-ML (the leg stays
    on the demo floor until then); a FAIL is recorded on the lever map and the next untested family is picked.
  baseline: htf_pullback_trend_2h config-exact (no adx_min), forming, re-run in this unit (f251-01 read -23.37R over n 105).
