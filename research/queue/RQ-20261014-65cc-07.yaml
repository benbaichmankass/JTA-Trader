id: RQ-20261014-65cc-07
title: 'AI trader / direction on Kaggle GPU: does ANY pretrained tabular learner (TabICL, TabPFN) beat the class prior on 1h direction_label (BTC, ETH) at a 6,000-row tail?'
status: done
cadence: once
theme: ml_health
priority: 2
kind: experiment
question: On the 1h direction label, does TabICL or TabPFN beat the class PRIOR by >= 0.02 macro-F1 under purged CV on BOTH symbols, with LightGBM and a logit reported as controls?
why_this_matters: 'The advisory heads are boosted trees and the direction question has never produced a learner that beats the prior (RQ-20261013-1414-03 asks the non-boosted
  families on CPU; this asks the pretrained ones, which need a GPU to be tractable at 6,000 rows x 5 folds x 2 symbols). Direction is the hardest label, so the bar is vs the
  PRIOR, not vs LightGBM: a PASS means a learner carries direction information at all; a FAIL is the honest negative the AI-trader plan needs before more capacity goes to direction
  heads. DATA PATHS UNVERIFIED FROM THIS SANDBOX (the shards are not reachable here): the BTC/ETH 1h v002 market_features paths are inside the published allowlist (scripts/research/market_data_export.py::ALLOW)
  and RQ-20261013-1414-03 already reads ETHUSDT 1h with these six features; BTC 1h and the target column on each shard are the ones to check in the first run''s published-data.json
  (last_ts per shard). A missing column or a stale/withheld shard lands as producer_failed or no_data: a ROUTE FAULT to fix and re-queue, never a verdict.'
power:
  expected_n: 3600
  min_detectable_effect: 0.1
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'tail_rows 6000 with min_train_frac 0.4 leaves ~3600 out-of-sample rows over 5 folds per symbol; d=0.1 paired needs ~785 rows, so each symbol is above the row floor
    on rows, but bars are autocorrelated so effective n is lower: the rule also requires the same-direction CV mean on BOTH symbols.'
  feasibility:
    source: none
    accrual_basis: 'Fixed by construction (tail_rows of a nightly-rebuilt shard): n does not grow with waiting, so an underpowered result is reported as such and the follow-up
      is a larger or different dataset, not a re-run.'
decision_rule:
  id: RULE-RQ20261014-65CC-07-DIRECTION-PRETRAINED-VS-PRIOR-1H
  registered_at: '2026-10-14'
  registered_before_run: true
  statistic: Paired per-fold macro-F1 difference (candidate minus class prior) on identical purged folds (5, embargo 24 rows), mean over folds, per symbol.
  rule: PASS IF a candidate (tabicl or tabpfn) beats the class prior by >= +0.020 macro-F1 on the CV mean on BOTH symbols (a direction-information gate only; it earns a follow-up
    unit on a larger tail and the licence question if TabPFN wins, never a head). FAIL IF no candidate reaches >= 0 vs the prior on any symbol AND both arms were evaluated.
    INDETERMINATE otherwise, or if folds < 3 or an arm is unavailable/errored. lgbm and logit are controls reported beside the verdict.
  min_n: 3 usable CV folds per symbol; reported n_rows per symbol.
  what_it_does_not_do: Serves nothing, registers nothing, touches no config; a PASS is not edge and not a P&L figure, and TabPFN is research-eval only.
compute: gpu
value:
  bucket: ai_trader
  usd_at_stake_per_month: 150
  confidence: 0.15
  basis: 'stand-in: a direction head that beats the prior is the missing half of the AI trader''s entry model; not a measured P&L'
routing:
  needs_trainer_resident_data: false
  needs_gpu: true
  published_data: metis-market-data
  peak_memory_gb: 8.0
  est_minutes: 75
  basis: 'Estimate, NOT measured: re-declare from the first run''s run-manifest.json.'
ml_bakeoff:
  task: classification
  metric: macro_f1
  dataset:
    kind: jsonl
    groups:
      BTCUSDT_1h:
        path: datasets-out/market_features/BTCUSDT/1h/v002/data.jsonl
      ETHUSDT_1h:
        path: datasets-out/market_features/ETHUSDT/1h/v002/data.jsonl
    ts_col: ts
    target: direction_label
    features:
    - rolling_log_return_vol
    - log_return
    - log_return_lag_1
    - log_return_lag_2
    - hour_of_day
    - dayofweek
    tail_rows: 6000
  cv:
    folds: 5
    embargo_rows: 24
    min_train_frac: 0.4
  baseline: prior
  controls:
  - lgbm
  - logit
  candidates:
  - tabicl
  - tabpfn
  learners:
    prior:
      kind: prior
    lgbm:
      kind: lightgbm
      params:
        n_estimators: 150
        learning_rate: 0.05
        num_leaves: 15
        min_child_samples: 20
    logit:
      kind: numpy_logit
    tabicl:
      kind: tabicl
      params: {}
    tabpfn:
      kind: tabpfn
      params: {}
      weights_note: Prior Labs non-commercial weights (license:other); offline research evaluation only
  rule:
    min_folds: 3
    pass_if:
    - group:
      - BTCUSDT_1h
      - ETHUSDT_1h
      vs: baseline
      window: cv
      op: '>='
      value: 0.02
    fail_if_no_candidate_reaches:
    - group: any
      vs: baseline
      window: cv
      op: '>='
      value: 0.0
run:
  command:
  - python3
  - scripts/research/ml_bakeoff.py
  - --unit
  - '{unit}'
  - --out
  - '{out_dir}'
  timeout_minutes: 225
  inputs:
    research_unit: RQ-20261014-65cc-07
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
roadmap:
- M25
related:
- RQ-20261013-1414-03
- docs/research/frontier-scan-2026-10-11.md
- scripts/research/research_compute.yaml
last_dispatched_at: '2026-10-14T13:54:26+00:00'
grading:
  auto: true
  awaiting: more_data
  decision_rule_id: RULE-RQ20261014-65CC-07-DIRECTION-PRETRAINED-VS-PRIOR-1H
  evidence:
  - research/results/RQ-20261014-65cc-07/38575872999.jsonl
  graded_at: '2026-10-14'
  grader: scripts/research/queue_grade.py
  note: 'indeterminate is the pre-registered under-powered/null outcome: complete, but NOT a pass and
    NOT a kill'
  reason: 1 row(s), all measured, all indeterminate
  rows: 1
  verdict: indeterminate
