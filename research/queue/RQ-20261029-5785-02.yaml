id: RQ-20261029-5785-02
title: 'ML-REAL-MONEY-OVERLAY V2: the RQ-20261029-5785-01 overlay gate with trade-identity corpus parity and a BLIND
  fresh-window holdout (2017-09..2020-06) that a family must also pass'
status: queued
cadence: once
roadmap:
- L-ML-LIVE
theme: ml_health
priority: 1
kind: experiment
question: Same model, features, grid, families, thresholds and checks (a)-(e) as RULE-ML-OVERLAY-NONINFERIOR-V1.
  Does a family still PASS when (1) corpus parity keys on the trade itself rather than net_r, and (2) the primary
  model, fit on the whole 2020-07..2026-10 family pool, also clears (a)-(d) on its gate legs' trades from the disjoint
  earlier window 2017-09-01..2020-06-23 that no configuration here has seen?
why_this_matters: 'V1 (RQ-20261029-5785-01, local run committed under comms/research/RQ-20261029-5785-01/local-v1-20261029)
  read INDETERMINATE for BOTH families on the parity predicate alone: every gate trade matched the reference on
  entry, exit, direction and gross_r, but net_r differed because #20783/#20813 (2026-10-28) raised the harness''s
  resolved Bybit linear taker fee from 7.5 to 11.0 bps after the reference corpus was built. The fresh corpus is
  the CURRENT full cost stack. V1''s net_r-parity predicate was a registration defect (it cannot tell a cost-stack
  update from a different trade). DISCLOSURE: V1''s main-window numbers are therefore already observed (TD: all
  of (a)-(e) hold; PB2H: (a),(c),(d),(e) fail). So V2 changes NO threshold, feature, grid, family or check, and
  adds a blind out-of-time holdout that must also pass: a family that ships has passed a test registered before
  its data was read.'
power:
  expected_n: 2600
  min_detectable_effect: 0.02
  effect_units: r_per_trade
  sd: 0.3
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'Gate population = the real-money legs'' OOS trades: RQ-20261024-09a6-01 measured ada 402 + xrp 394 (PB2H,
    796) and eth_4h 275 + xrp_4h 68 + eth_prop 1085 + sol_prop 403 (TD, 1831) over 2020-07..2026-10. A reduce of 20%
    of trades at 0.5x moves delta by at most 0.1 x |mean R of reduced|, so the margin -0.02 R is about 0.2 x a reduced-set
    mean of 1 R; per-trade R sd ~1.5 gives a LB half-width of ~0.3 x 1.5 x 1.645 / sqrt(n) ~ 0.02-0.03 on n 800-1800
    (an ESTIMATE). Below 200 gate trades -> INDETERMINATE, never FAIL. POWER METADATA corrected 2026-10-29 after V1''s
    run, for the queue schema only (no decision-rule change): design one_sample on the per-trade delta vs 0; sd 0.3
    is the sd of the DELTA (zero on taken trades, 0.5 x R on reduced), not of R -- consistent with V1''s measured
    TD LB half-width (0.0114 = 1.645 x sd / sqrt(1830) -> sd ~0.30). At MDE 0.02 R this needs n ~1,400-1,800: the
    pooled n and TD (1,830) clear it, PB2H alone (796) does not.'
  feasibility:
    source: none
    accrual_basis: Replays pinned history on freshly fetched public candles; nothing accrues.
decision_rule:
  id: RULE-ML-OVERLAY-NONINFERIOR-V2
  registered_at: '2026-10-29'
  registered_before_run: true
  statistic: 'scripts/research/ml_overlay_noninferior.py (this commit). CORPUS: config-exact harness runs with --emit-paths
    (path_metric_giveback.run_leg_paths, the RQ-20261024-09a6-01 argv builder) over 2020-07-01..2026-10-15 23:59;
    label net_r = cost-net (fee + slippage + funding, the harness cost policy recorded per leg), the exit actually
    traded, R of initial risk (practice M1). FEATURES: src/runtime/overlay_features.decision_features on the leg''s
    own candles up to and including the decision bar (entry == that bar''s close on 2,627/2,627 reference trades).
    MODEL: L2 logistic (IRLS) on standardised features predicting P(net_r > 0); tau = q-quantile of the training
    scores; REDUCE (x0.5) iff P < tau. VALIDATION: CPCV, 6 calendar groups by entry time, 2 test groups (15 splits,
    5 paths), purge any training trade whose [entry, exit] overlaps a test block, embargo 7 days after each block
    (M2). Trades in a test block from ALL family legs are excluded from training (no cross-leg contemporaneous leakage).
    Each trade''s multiplier = the mean of its 5 OOS decisions. PRIMARY config fixed now: C = 0.1, q = 0.20, multiplier
    0.5. TRIAL GRID, all run and counted (M4/M5): C in {0.1, 1.0} x q in {0.10, 0.20, 0.30} = 6 per family, 12 in
    total; PBO by CSCV over the 6 groups and a Bonferroni (alpha/6) lower bound are REPORTED. Families (+ = real-money
    gate leg; others train only): PB2H = ada_pullback_2h+, xrp_pullback_2h+, eth_pullback_2h, sol_pullback_2h, avax_pullback_2h;
    TD = trend_donchian_eth_4h+, trend_donchian_xrp_4h+, trend_donchian_eth_prop+, trend_donchian_sol_prop+, trend_donchian_sol_4h,
    trend_donchian_ada_4h, trend_donchian_avax_4h, trend_donchian_xrp_adx25. V2 CHANGES ONLY: --parity-basis trade
    (same entry_time, direction, exit_time, gross_r within 1e-3; the net_r shift is reported as the cost-stack delta)
    and --holdout-start 2017-09-01 --holdout-end 2020-06-30 23:59: fresh config-exact harness runs of the GATE legs
    over that window, trades entered before 2020-07-01 minus the 7-day embargo; the exported PRIMARY artifact (fit
    on the whole main-window family pool, tau from its training scores) scores them; random control permuted within
    3 calendar groups. Legs with no candles that early (trend_donchian_sol_prop: SOL lists 2020-08) contribute nothing
    to the holdout.'
  rule: 'PASS iff the V1 rule''s PASS on the main window (checks (a)-(e) unchanged, with the parity predicate on
    trade identity) AND the holdout CONFIRMS: on the holdout gate trades (a) one-sided 95% LB of delta > -0.02 R,
    (b) maxDD and CVaR5 not worse than take-all, (c) delta > the 90th percentile of 2000 same-rate random reduces,
    (d) reduce rate >= 5% and the reduced trades'' mean R <= the take-all mean. INDETERMINATE IF a V1 INDETERMINATE
    condition holds under trade parity, OR the holdout has < 100 gate trades. FAIL otherwise, naming the failing
    check and window. PASS -> REDUCE-ONLY at the primary tau (x0.5) as a Tier-3 packet for exactly the family''s
    gate legs, bybit_2 == bybit_portfolio, CUSUM demotion trigger on the mirror. Nothing here is changed after this
    result.'
  what_it_does_not_do: 'Edits no config, no roster and no stage; places no order. Never upsizes, never opens a trade,
    never moves a bracket. A PASS is offline evidence for a Tier-3 packet, not a promotion. iaum_pullback_1d (alpaca_live)
    is out of scope: no Stage-0 path corpus exists for it in RQ-20261024-09a6-01.'
intervention_controls:
  not_applicable: an entry-size meta-label, not an in-trade action; the matched random control is check (c) and
    the take-all baseline is the hold-equivalent.
compute: cpu_light
value:
  bucket: own_losses
  usd_at_stake_per_month: 200
  confidence: 0.2
  basis: 'stand-in: the real-money book''s losing-trade tail; an estimate, not a measurement.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 30
  why_runner: Fetches keyless public candles for a pinned window; reads no trainer data.
  basis: 13 harness legs (~4 min for 6 in RQ-20261024-09a6-01) plus 14 CPCV evaluations (estimate).
