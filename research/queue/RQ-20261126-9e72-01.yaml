title: 'D2/F29 GRU RE-OPEN (GPU): the 9e71-01 GRU with EARLY STOPPING (chronological 20% validation, patience 3) + TEMPERATURE CALIBRATION on the validation logits
  vs LightGBM on the same 10 features, 1h regime log-loss on BTC/ETH/SOL, paired block-bootstrap rule (same harness, symbols, folds as 9e71-01)'
