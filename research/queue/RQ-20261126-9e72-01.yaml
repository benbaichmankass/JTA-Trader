question: With early stopping on a chronological validation split and temperature calibration, does the GRU have a LOWER 1h regime log-loss than LightGBM on the same
  10 features, with the paired moving-block (24-row) bootstrap 95% lower bound of the improvement above 0 on all of BTC/ETH/SOL?
why_this_matters: It decides the deep_sequence family on a properly trained learner instead of a mis-trained one (9e71-01). PASS -> the entry-label GRU arm. FAIL
  -> the GRU is closed on these features with a fair test, and the family re-opens only on a new representation. Also feeds the idle GPU queue.
