ml_bakeoff:
  task: classification
  metric: logloss
  higher_is_better: false
  dataset:
    kind: jsonl
    groups:
      BTCUSDT_1h:
        path: datasets-out/market_features/BTCUSDT/1h/v002/data.jsonl
      ETHUSDT_1h:
        path: datasets-out/market_features/ETHUSDT/1h/v002/data.jsonl
      SOLUSDT_1h:
        path: datasets-out/market_features/SOLUSDT/1h/v002/data.jsonl
    ts_col: ts
    target: regime_label
    features:
    - rolling_log_return_vol
    - log_return
    - log_return_lag_1
    - log_return_lag_2
    - hour_of_day
    - dayofweek
    - parkinson_vol
    - garman_klass_vol
    - rogers_satchell_vol
    - yang_zhang_vol
    tail_rows: 40000
  cv:
    folds: 5
    embargo_rows: 24
    min_train_frac: 0.4
    row_bootstrap:
      block_rows: 24
      n_boot: 1000
      seed: 0
  baseline: lgbm
  controls:
  - prior
  candidates:
  - gru
  learners:
    prior:
      kind: prior
    lgbm:
      kind: lightgbm
      params:
        n_estimators: 200
        learning_rate: 0.05
        num_leaves: 31
        min_child_samples: 50
    gru:
      kind: torch_gru
      params:
        window_bars: 48
        hidden: 64
        layers: 2
        epochs: 30
        batch_size: 256
        max_train_windows: 40000
        seed: 0
        device: auto
        val_frac: 0.2
        patience: 3
        calibrate: temperature
        weight_decay: 0.0001
  rule:
    min_folds: 3
    pass_if:
    - group:
      - BTCUSDT_1h
      - ETHUSDT_1h
      - SOLUSDT_1h
      vs: baseline
      window: cv
      op: '>'
      value: 0.0
      stat: boot_ci_low
    fail_if_no_candidate_reaches:
    - group: any
      vs: baseline
      window: cv
      op: '>'
      value: 0.0
      stat: boot_mean
