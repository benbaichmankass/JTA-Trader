  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: n = 3,921 priced trades on the 8 selection legs is MEASURED (ed2b-03 baseline_book.n); how many of them can fire near_target depends on the legs with a real TP (388 fired in ed2b-01 at the same
    triggers). The graded statistic is the harness RULE-AM-RISK-ADJUSTED-V1 label; underpowered or never-fired cases grade indeterminate in the harness, never fail.
  feasibility:
