id: RQ-20261118-abab-68
title: 'ITERATION 3 of ltr-close (43b6-02 INDETERMINATE, near_target never fired on tp_r-50 legs): does a FULL close at the first near_target or stall trigger clear RULE-AM-RISK-ADJUSTED-V1 on the 8 selection
  legs, which include legs with a real TP?'
status: done
cadence: once
theme: live_strategy
priority: 2
kind: experiment
question: On the committed Stage-0 corpora of the 8 selection legs (n = 3,921 priced trades), does closing the WHOLE position (partial_frac 1.0) at the first near_target or stall trigger clear RULE-AM-RISK-ADJUSTED-V1
  (R1 r_cost <= 0.05 R/trade, R2 maxDD or weekly-CVaR5 cut >= 15%, R3 >= 4 of 6 folds, R4 beats >= 99.67% of 200 matched random-time full closes) plus L1 drop-best-leg?
why_this_matters: 'ltr-close is the live-trade-review class behind the audit single positive signal (one window, 4 packages after de-duplication, INDETERMINATE under its own pre-registered rule, row LTR-CLOSE-CLASS-TEST).
  Its iteration-2 test could not read near_target at all on its population. This is the first full-close test at near_target on legs with a real TP. 43b6-02 (ITERATION 2 of ltr-close, a FULL close at the
  first near_target or stall trigger, four holdout legs eth_pullback_2h / sol_pullback_2h / trend_donchian_ada_4h / avax_4h, n=1,094) read INDETERMINATE: partial_close@near_target n_fired = 0 (the lever
  never fired) and @stall fails R1 and R3 with 0 of 200 controls beaten. Cause of n_fired = 0, VERIFIED in config/strategies.yaml 2026-11-18: all four holdout legs declare tp_r 50.0 with tp_intent mode
  none (the fictional take-profit sentinel), so a NEAR-TARGET trigger, which needs a real TP, can never fire on them. The test design chose a trigger the population cannot produce. ltr-close (the audit''s
  one positive signal, AUDIT.md section 8, one window, 4 packages after de-duplication) has therefore never been tested at near_target on legs that HAVE a real take-profit. ed2b-01 did test near_target
  on the 8 selection legs, but as a HALF close (partial_frac 0.5, r_cost -0.0005, 0 of 200 controls beaten), not a full close. This unit runs the full close (--partial-frac 1.0) at near_target and stall
  on the 8 selection legs, which include the legs with a real TP.'
