decision_rule:
  id: RULE-RQ20261118abab68-LTR-CLOSE-FULL
  registered_at: '2026-11-18'
  registered_before_run: true
  statistic: 'scripts/research/ltr_action_trigger_s0.py --action partial_close --partial-frac 1.0 --triggers near_target,stall on the 8 committed selection corpora; per candidate: r_cost per baseline trade,
    maxDD and weekly-CVaR5 cut vs hold, folds held of 6, controls beaten of 200, n_fired, L1 drop-best-leg; cost = the corpus rows recorded full-stack net R.'
  rule: 'PASS iff either candidate (partial_close@near_target, partial_close@stall) has the harness label risk_adjusted_pass: R1 r_cost <= 0.05 R/trade AND R2 (maxDD cut >= 15% OR weekly-CVaR5 cut >= 15%)
    AND R3 >= 4 of 6 folds hold AND R4 beats >= 0.9967 of 200 matched random-time full closes (Bonferroni family 15 = the 13 comparisons already counted on this corpus plus these 2 arms) AND L1 holds after
    dropping the best leg. A PASS is a LEAD: ONE read on the four holdout legs follows, restricted to the trigger that passed and, for near_target, only to holdout legs that carry a real TP (none of the
    four do, so a near_target PASS first needs a holdout population with a real TP, named in the next unit). FAIL iff both labels are fails_*: a full close at these triggers is closed on the selection legs;
    the class moves to the untested triggers (giveback, adverse_r_0.5, momentum_flip). INDETERMINATE iff a label is indeterminate (never_fired / underpowered). Thresholds are not changed after any result.'
  what_it_does_not_do: 'Closes no live trade, edits no config, is not a promotion or apply case (the apply path is MD-TRADE-DESK, Tier 3 for any new action class). The corpora are closed-bar harness replays:
    this is a CLOSED-BAR corpus read, not live-bar evidence (see the ict_scalp fidelity finding, RQ-20261118-abab-56). Not run before registration.'
practice_precedent: 'T1 and M4 (docs/reference/trading-and-model-practice-principles.md): an action tested against hold and against a random-time action, every arm counted in the multiplicity family; the
  test must be able to fire on its population (n_fired reported)'
