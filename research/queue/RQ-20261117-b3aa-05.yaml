why_this_matters: 'ITERATION (research-ops 2026-11-17 1006Z; spy_pullback_1h is an ORPHAN). DIAGNOSIS from the map rows: the control is +66.7 R on 2018-06..2026-10 (78fc-55) and +34.4 R on the 2018-06..2021-10
  pre-dev span (2411-03), but -26.4 R on the recent window 2024-01..2026-11 (bf1b-05/-08 controls): the leg DECAYED, i.e. a regime/window problem, not a missing lever setting (trail, pullback lookback,
  atr stop, adx, vol skip were all one-factor tested and none fixes the recent window). Live attribution (75 trades): gross -1.06 R, longs +3.81 R, shorts -12.36 R; no gross edge in 2026. The regime_gating
  family is UNTESTED (`.`) on this leg. A daily-trend gate is the standard cut for a pullback-in-trend rule (enter pullbacks only with the higher-timeframe trend). Shorts are never gated by this harness
  flag, so the arm isolates whether counter-trend longs carry the decay; the short-side loss is reported separately and points to the direction family next if longs are not the problem. On PASS: a pre-dev
  confirmation (2018-06..2021-10) before any Tier-3 note; on FAIL: the regime family''s first configuration closes and the next test is the short side (side_filter long on THIS window, which was never read
  here). Arm denominator 3 incl. control.'
