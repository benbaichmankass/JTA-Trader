id: RQ-20261123-cf1a-06
title: 'HOLDOUT-SELECTED wider initial stop on trend_donchian BTC (live, 1h): atr-stop-mult 2.5 / 3.0 vs declared 2.0, same trail, net of cost (CF-TRENDDONCHIAN-WIDESTOP-HOLDOUT)'
status: queued
cadence: once
roadmap:
- L-LADDER
theme: live_strategy
priority: 2
kind: experiment
question: 'trend_donchian (live, BTCUSDT 1h) declares atr_stop_mult 2.0 and ranks #3 in the CF-INSIGHTS live-leg lens (corpus BTC: wider stop +0.137 R/trade [0.122,0.151], ~101 trades/yr). Does 2.5x or
  3.0x, selected on the earliest ~75% and read once on the held-back latest span, beat the declared 2.0x net of cost, in the harness''s own R?'
why_this_matters: 'Operator 2026-11-23 via the manager: the CF-INSIGHTS live-leg lens ranks this leg in the top three by lower-bound R/yr; every lead becomes a pre-registered, time-disjoint holdout unit,
  no config change. The finding is IN-SAMPLE (best of ~30 arm cells; overlapping sweep jobs deduped to unique trades; corpus rows are family x symbol sweeps, not this leg''s exact params). Declared 2.0x
  sits on the rising part of the in-sample curve (+0.131 at 2.0x vs +0.139 at 3.0x for the family), so the expected gain is small (~+0.01 to +0.03 R); the unit is mainly a CHECK that the family plateau
  holds on this leg. MULTIPLE-TESTING DENOMINATOR: 2 arms on this leg, selected on discovery only, read once on the holdout; siblings cf1a-01..07 are read as one family.'
power:
  expected_n: 160
  min_detectable_effect: 0.22
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: expected_n is the HELD-BACK trade count, an ESTIMATE (live frequency ~101 trades/yr x ~6.4y x 25%). At n=160 a one-sample test detects d = 0.22 sd (alpha 0.05, power 0.8). The in-sample effect
    is ~0.1-0.2 sd, so a SINGLE leg is UNDERPOWERED for it; the sibling units cf1a-01..07 are read as ONE family (family rule in the decision rule). A single-leg PASS is a LEAD, a null is not evidence against
    the family.
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ20261123cf1a06-LIVE_STRATEGY
  statistic: 'scripts/research/exit_lever_ablation.py --grade holdout on trend_donchian, window 2020-06-01 .. 2026-11-15 23:59, every arm ONE continuous harness pass, net of the full cost stack the harness
    resolves for the venue; per-trade net_r from --emit-trades (R in the arm''s own stop distance = constant money risk). Arms fixed now: A = the leg as declared (atr_stop_mult 2.0); C1: --atr-stop-mult=2.5;
    C2: --atr-stop-mult=3.0; trail_mult, TP and every other lever as declared. BOUNDARY, fixed before any outcome is read: the latest 25% of the calendar window, grown in 1% steps until it holds 25 of arm
    A''s entries, capped at 40%. DISCOVERY = trades whose entry AND exit precede the boundary; 4 equal calendar folds. HOLDOUT = the selected arm''s trades entered on/after the boundary. Regime-robustness
    clause (default template): the per-year table is read; a PASS with one calendar year above 50% of net gain, or a net-negative long or short side, is reported as a LEAD with that caveat.'
  rule: 'SELECTION (discovery only): an arm is eligible iff discovery n >= 25 AND discovery net R > 0 AND >= 3 of 4 discovery folds net-positive; the eligible arm with the highest discovery net R is selected
    (a tie goes to A). HOLDOUT (read once): INDETERMINATE/insufficient_discovery IF every arm holds < 25 discovery trades; FAIL/no_discovery IF no arm is eligible otherwise; INDETERMINATE/underpowered IF
    the selected arm holds < 25 held-back trades; PASS/confirmed IF held-back net R > 0 AND the selected arm''s held-back net R exceeds arm A''s on the same span; FAIL/not_replicated otherwise (closes THAT
    configuration on THIS window, never the lever family). FAMILY READ (cf1a-01..07 together, stated before any run): the family is CONFIRMED only if >= 3 of the 4 legs are PASS or the pooled held-back
    (selected arm - A) mean net R per trade is > 0 with its 80% block-bootstrap lower bound > 0. A PASS is a LEAD for a Tier-3 proposal NOTE on CF-TRENDDONCHIAN-WIDESTOP-HOLDOUT, never a config edit. Thresholds
    are not changed after any result.'
  what_it_does_not_do: Edits no config, roster or record and places no order. A backtest of a few levers on one leg is not edge and not a P&L claim; not a Tier-3 case; does not deflate (one configuration
    is read once on the holdout).
  registered_before_run: true
  registered_at: '2026-11-23'
