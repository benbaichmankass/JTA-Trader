  min_detectable_effect: 0.15
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'MEASURED: arm A n 183 record / 171 prior (RQ-20261114-db1a-05). A wider stop with the same entries keeps roughly the same trade count (691 vs 919 at 1.875 in RQ-20261106-024;
    fewer stop-outs free fewer re-entries), so about 150-180 per window with W; MDE about 0.15sd per trade pooled; per-leg Stage-0 floor 30.'
