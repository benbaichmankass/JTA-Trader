id: RQ-20261114-db1a-07
title: trend_donchian_1h atr_stop_mult 3.125 vs config-exact 2.5 on its forming decision bar, record + year before (census candidate, sizing_vs_cost)
status: queued
cadence: once
kind: experiment
theme: live_strategy
priority: 1
roadmap:
- L-LADDER
question: Does widening trend_donchian_1h's initial stop from 2.5 to 3.125 ATR make the leg pass Stage 0 on the record year 2025-11-13..2026-11-12 on its live forming bar and beat config-exact
  there, while holding (positive and above config-exact) on the year before, net of the full cost stack?
why_this_matters: 'Census 2026-11-14: trend_donchian_1h is negative in both years (-19.67R n183 / -7.68R n171) and its attribution reads ''cost erases a gross edge'' (gross +15.39R,
  cost 25.96R, n184; about 0.14R of cost per trade). A wider stop lowers cost per R. The leg''s only sizing_vs_cost responder is closed-bar atr_stop_mult 3.125 (+9.70R n691 vs -6.83R,
  3/4 folds, RQ-20261106-024; 1.875 -24.12R, monotone in the right direction). Regime gating (db1a-02/-04), timeframe (f251-05), regime off-cell (f251-17) and the profit lock (db1a-05)
  all failed on this leg.'
