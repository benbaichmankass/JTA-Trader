decision_rule:
  id: RULE-TD1H-ATRSTOP3125-20261114
  registered_at: '2026-11-14'
  registered_before_run: true
  statistic: exit_lever_ablation --grade stage0 --forming-1m-fetch --days 800, arms A (config-exact, atr_stop_mult 2.5) and W (atr_stop_mult 3.125) per window on the leg's live forming
    decision bar; two_window_lever_grade.py applies the rule.
  rule: 'Multiple-testing guard: names the prior attempts on this leg and these windows (RQ-20261114-db1a-05 profit lock FAIL, -04 harness-native HTF gate FAIL, -03 post-hoc HTF filter,
    -02 ADX cell FAIL, RQ-20261113-f251-05 timeframe FAIL, f251-17 regime off-cell FAIL) and the selection: 3.125 is the better of two values (1.875, 3.125) in RQ-20261106-024 over 2021-11..2026-11
    on the CLOSED bar, which overlaps both windows here; this leg decides on the FORMING bar and RQ-20261114-db1a-01 found closed-bar lever responses flip sign on the forming bar for
    half the levers, so this tests whether the response transfers. The value is fixed (3.125), not chosen here. PASS iff W passes Stage 0 on the record window (net_r > 0, n >= 30, >=
    3/4 folds positive) AND W net_r > A net_r there, AND on the prior window W net_r > 0 AND > A net_r. FAIL iff graded and not; INDETERMINATE iff W n < 30 on the record window or a
    run/arm is missing. No threshold is relaxed.'
  what_it_does_not_do: Changes no config, roster, order or evidence record. A PASS is a Tier-3 parameter proposal (atr_stop_mult 2.5 -> 3.125) for trend_donchian_1h on the bybit_1 demo
    floor, via the manager.
  baseline: the leg config-exact (atr_stop_mult 2.5) on its forming decision bar (arm A), both windows, run in this unit.
