id: RQ-20261022-eba2-06
title: 'Giveback as a FRACTION of the peak: does exiting when open profit falls to 60% of the peak (once peak >= 2.0 R) replace
  the declared exit of xrp_pullback_2h on net R in 5 of 6 calendar folds over 2020-07..2026-10, at the venue cost stack?'
status: queued
cadence: once
roadmap:
- L-ATM
- M20
theme: live_strategy
priority: 1
kind: experiment
question: 'The census (RQ-20261014-9807-01) measures giveback as a SHARE of peak R (paper pool 0.92, deep_then_loss 0.15;
  every peak a lower bound), but every giveback stop tested so far is an ABSOLUTE R (RQ-20261019-004/-018: 1R after 2R MFE,
  FAIL). An absolute stop is tight at a 2R peak and loose at a 6R peak; a fractional one scales with the peak. On xrp_pullback_2h
  over 2020-07-01 .. 2026-10-15 23:59 (replace grade, 6 calendar folds), does any of three arms -- F60 (exit when open R <=
  0.60 x peak after peak >= 2.0 R), F50 (0.50 x peak), F70 (0.70 x peak) -- beat the declared exit (A) by >= 0.02 R/trade
  in >= 5 of 6 folds within the Path B drawdown bar?'
why_this_matters: 'Giveback share of peak is the operator''s standing metric. The absolute-R family is closed on the money
  legs; the fractional shape is a different hypothesis (scale-free), not a re-run. PRIOR INFORMATION, disclosed: on 2026-10-22
  the fixed 50% bank (RQ-20261022-fd06-01/-02/-03), level-triggered tightening (RQ-20261022-001..006) and a 1R giveback stop
  (RQ-20261019-004/-018) all FAILED against the declared exit on the Bybit money legs, by margins of -3 to -68 R over n 68-402;
  the declared wide trail earns its R in the right tail.'
power:
  expected_n: 394
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: Floor 39 incumbent trades (0.45 sd); the incumbent read n 394 over this window (MEASURED, RQ-20261022-fd06). Fold
    majority carries autocorrelation.
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-P1-Q12-XRP-PULLBACK-2H-FRAC-GIVEBACK
  registered_at: '2026-10-22'
  registered_before_run: true
  statistic: 'From scripts/research/exit_lever_ablation.py --grade replace on xrp_pullback_2h, window 2020-07-01 .. 2026-10-15
    23:59 (6 equal calendar folds; a trade is binned by entry time), net of the full cost stack the harness resolves per venue
    (execution_costs.resolve_cost_policy, recorded per arm as cost_stack). Per arm: n, net_total_r, max_drawdown_r, net R
    per fold. A = the leg as declared. Per candidate C: delta = net_r(C) - net_r(A); folds_ge; maxDD(C) vs maxDD(A).'
  rule: 'INDETERMINATE IF n(A) < 39, or IF every C arm is byte-identical to A (the flag was not applied). A candidate C PASSES
    iff net_r(C) > net_r(A) AND delta >= 0.02 R x n(A) AND folds_ge >= 5 of 6 AND maxDD(C) <= maxDD(A) x 1.35. PASS IF one
    or more pass: the best by net R is named, follow-up ONE confirmation unit on a disjoint partition, never a config edit.
    FAIL IF none passes: the declared exit stands for the fractional-giveback family on this leg at these three arms (a family
    is not retired on one config). Thresholds are not changed after any result.'
  what_it_does_not_do: 'Edits no config and places no order; a PASS needs a live producer (a fractional giveback verdict in
    the monitor) and a Tier-3 declare. The peak is the harness''s bar-high peak (an upper bound the live monitor sees later),
    so a PASS is checked by its confirmation and by Q6 parity. PRIOR INFORMATION, disclosed: on 2026-10-22 the fixed 50% bank
    (RQ-20261022-fd06-01/-02/-03), level-triggered tightening (RQ-20261022-001..006) and a 1R giveback stop (RQ-20261019-004/-018)
    all FAILED against the declared exit on the Bybit money legs, by margins of -3 to -68 R over n 68-402; the declared wide
    trail earns its R in the right tail.'
