id: RQ-20261112-4654-09
title: 'Linear learner for the crypto ENTRY recipe: does a ridge regression on the same 20 features and raw net-R target beat LightGBM on the trades each
  would take at actual net R? (13 monthly refits over 2025-10..2026-09; linear_logit family)'
status: queued
cadence: once
theme: ml_health
priority: 3
roadmap:
- L-ML-LIVE
kind: experiment
origin: new_hypothesis
practice_precedent: 'https://doi.org/10.1093/rfs/hhaa009 (Gu, Kelly and Xiu 2020 RFS; SECONDARY, known before this pass, not re-read): penalised linear
  models are the standard baseline against trees for return prediction and are competitive when signal is weak and mostly monotone. Our own history: linear_logit
  has 0 open plan items after the 2026-11-13 hygiene pass (graded FAIL,FAIL,PASS,INDETERMINATE,INDETERMINATE,FAIL).'
levers:
- name: learner
  values:
  - LightGBM (RAW, baseline)
  - ridge alpha 10 on median-imputed standardised features (RIDGE, decided)
  hypothesised_effect: RIDGE raises held-out net R per decision by >= +0.06 vs RAW
question: Refit the SAME recipe (ml_decision_entry FEATURES, E.purge_train, served tau, raw net-R target) at each of 13 monthly origins over the frozen
  v1's held-out year with two learners -- RAW (LightGBM, LGB_PARAMS) and RIDGE (ridge alpha 10, median impute + standardise inside each refit) -- and grade
  each on the decisions it takes at the ACTUAL net R of an outright bracket trade (canonical cost stack). Does RIDGE beat RAW?
why_this_matters: Foxhound-1 (D3 ml_entry) trades bybit_2 real money, its mirror and three prop books on one GBDT. A linear model that matches or beats
  it would be a far simpler, more stable serving model; a FAIL is the linear_logit family's first result on the real-money recipe. RQ-20261112-4654-07 reports
  ridge only as a diagnostic beside its ENS decision; this unit registers the ridge decision itself.
evidence_class:
  holdout: holdout_window
  claim: edge
power:
  expected_n: 13
  min_detectable_effect: 0.06
  effect_units: metric
  sd: 0.074
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATE (QUOTED, not re-derived here): as RQ-20261112-4654-01 -- frontier-scan-2026-11-11 K1 gives a paired window sd of 0.074 R/decision for
    two refits of this recipe over the same 13 x 28-day windows, se = 0.0205, 80%-power MDE at alpha 0.05 two-sided ~0.063 R. Registered effect +0.06. Fewer
    than 10 windows with n >= 30 per arm is INDETERMINATE. The window sd is re-measured (paired_extra_vs_raw.ridge.sd).'
  feasibility:
    source: none
    accrual_basis: Replays Binance USD-M 1h history 2021..2026-09 already published; nothing accrues.
decision_rule:
  id: RULE-RQ20261112-4654-09-RIDGE
  registered_at: '2026-11-13'
  registered_before_run: true
  baseline: 'RAW: the same LightGBM recipe on the raw net-R target at the same origins, same rows (BTCUSDT excluded), same tau, same cost stack. Net of
    the full cost stack.'
  statistic: 'scripts/research/ml_entry_residual.py run --arms raw,ridge: per 28-day window, mean actual net R per taken decision for each arm (E.policy,
    served tau); d_w = RIDGE - RAW over windows where both took >= 30 decisions; mean, sd and 95% t-interval of d_w (paired_extra_vs_raw.ridge); pooled
    means and n.'
  rule: 'decide_vs_raw on RIDGE: PASS iff >= 10 paired windows AND mean d >= +0.06 R/decision AND the 95% t-CI lower bound > 0 AND RIDGE pooled n >= 300.
    FAIL iff >= 10 paired windows AND mean d <= 0. INDETERMINATE otherwise. Net of the full cost stack (fee + slippage + funding via ml_decision_entry._cost_r).
    Thresholds are not changed after any result.'
  pass_action: 'a Tier-3 proposal note on row ML-ENTRY-FINETUNE: candidate manifest for a ridge ENTRY model, plus the promotion-design unit on the full
    held-out year with the prop survival gate; tag the result linear_logit in the diversity ledger.'
  fail_action: record FAIL for this exact configuration (ridge alpha 10, the v1 features, served tau); append linear_logit history; no further linear arm
    on this recipe without a new feature set or lever.
  what_it_does_not_do: Changes no served model, tau, roster or config. No alpha search. The served tau was tuned for LightGBM's prediction scale; a ridge
    prediction distribution is narrower, so RIDGE may take fewer decisions (counts reported; n < 300 is INDETERMINATE, declared). BTCUSDT excluded. The
    window was read before by 98e3-26 and 4654-01 (declared). A PASS is not a promotion.
  min_n: 10 paired windows with >= 30 decisions per arm; 300 pooled RIDGE decisions
compute: cpu_long
value:
  bucket: ai_trader
  usd_at_stake_per_month: 150
  confidence: 0.1
  basis: 'stand-in: Foxhound-1 trades bybit_2 + 3 prop books; a +0.06 R/decision lift at ~40 decisions/month on bybit_2 is the scale; not a P&L measurement.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 8.0
  est_minutes: 50
  why_runner: Binance public klines plus 13 LightGBM pairs and 13 ridge pairs (seconds); no trainer-resident data.
  basis: 'ESTIMATE: RQ-20261108-98e3-26 (13 refits + fetch) ran ~40 min on research-script-run; ridge adds seconds.'
run:
  workflow: research-script-run.yml
  command:
  - python3
  - scripts/research/ml_entry_residual.py
  - run
  - --arms
  - raw,ridge
  - --cache
  - /tmp/ml_entry_klines
  - --out
  - '{out_dir}'
  - --unit
  - '{unit}'
  - --where
  - research-script-run
  - --run-date
  - '2026-11-13'
  - --rule-id
  - RULE-RQ20261112-4654-09-RIDGE
  - --registered-at
  - '2026-11-13'
  timeout_minutes: 300
  inputs:
    research_unit: RQ-20261112-4654-09
ml_consumer:
  consumer: src/units/strategies/ml_entry.py
  decision: whether Foxhound-1 (ml_decision_entry) could serve a ridge model; no change from this unit
  legs:
  - ml_entry
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
related:
- RQ-20261112-4654-07
- FRONTIER-Q-LINEAR-ENTRY
- ML-ENTRY-FINETUNE
population: The ml_decision_entry universe (Binance USD-M perps in the bp2 manifest, BTCUSDT excluded), both sides at the served tau over 2025-10-01..2026-09-30
  in 13 x 28-day windows; a recipe comparison, not a promotion read.
