  id: RULE-RQ20261118-04a5-07-TM-QUANTILE-LABEL
  registered_at: '2026-11-18'
  registered_before_run: true
  baseline: 'B0 hold to the leg''s own rules, B1 the best static rule chosen on train folds, B2 the distance logit, B4 matched random at
    the arm''s own action rate; same trades, same engine replay, same cost stack as 7e18-01.'
  statistic: 'tm_bench score --rule s_offline on the one lgbm arm (quantile alpha 0.3): delta vs B0 per trade, trade-clustered bootstrap
    CI95, folds positive of 6, per-leg max drawdown vs B0, net R per capital-day vs B0, delta vs B2, B4 margin CI, Holm-adjusted p
    (tm_bench.s_offline). The 7e18-01 mean-target arm (+0.0033 R/trade) is the incumbent read, reported as context.'
  rule: 'PASS (pass_pending_fresh_window) iff tm_bench.s_offline returns pass_pending_fresh_window for the lgbm arm: gain >= 0.03 R/trade
    over max(B0, B1), CI95 lower > 0, >= 5 of 6 folds positive, max drawdown and capital-day checks pass, beats B2, beats its own matched
    random B4 (margin CI lower > 0), Holm p < 0.05. FAIL iff its CI95 upper < max(B0, B1) + 0.03. INDETERMINATE otherwise, or if the
    measurement does not record lgbm_objective quantile at alpha 0.3, the test corpus is not tmb-73f5c3660014, the train corpus is not
    bp2-f4271084b120 with >= 10,000 de-duplicated trades after purge, or the selfcheck fails. Thresholds, alpha, actions and margin grid
    are fixed now and not changed after any result.'
  pass_action: 'author the fresh-window full-label (net-of-cost policy value) confirmation for the quantile head (holdout_lock family
    TMAV); a horizon-label arm delta is not itself a net-of-cost policy value (tm_bench label note).'
  fail_action: 'record the labels family (quantile target) as tested in research/levers/ml-tm-action-value.yaml; next family = learner
    class (CatBoost / a monotone head), then fitted-Q per the frontier ranking; never a re-run of this configuration.'
  what_it_does_not_do: 'Changes no live leg, no Labrador-1b setting, no config; places no order; adds no gate. Not a promotion case. The
