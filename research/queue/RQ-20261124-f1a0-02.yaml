decision_rule:
  id: RULE-ML-ENTRY-FIX-ARMS-20261124
  registered_at: '2026-11-24'
  registered_before_run: true
  baseline: the registered recipe on the same folds, rows, tau and cost stack
  statistic: 'scripts/research/ml_entry_fix_arms.py --arm bar_split (split_verdict / SPLIT_RULE): weighted mean net R per 1R deployed with week-clustered
    influence se (wdiff); bar series = per-ts sum of weight x net R; Sharpe = mean / sd per bar; maxDD on the cumulative bar series from a flat
    start.'
  rule: PASS iff n_bars >= 3000 AND delta(split - base, net R per 1R deployed) - 2.0 se > -0.0068 AND bar Sharpe(split) > bar Sharpe(base) AND
    bar Sharpe(split) > mean bar Sharpe of the random-weight control AND maxDD(split) <= 0.7 x maxDD(base / mean entries per bar) AND split bar
    Sharpe > base in >= 5 of 8 folds. FAIL iff delta + 2.0 se < -0.0068 OR bar Sharpe(split) <= bar Sharpe(base). INDETERMINATE otherwise. Fixed
    now.
  pass_action: A data-backed Tier-3 sizing proposal to the manager (per-bar risk budget for ml_entry on bybit_2 / bybit_portfolio) with the measured
    Sharpe and drawdown change. Applied by the operator or a mandate, never by a lane.
  fail_action: Report the bar risk numbers as the sizing input they are; the next iteration is a correlation-weighted split (weight by 1 - mean
    pairwise 30d return correlation) authored from this result.
  proposal_mapping: pass -> fresh-window confirmation (bars after 2025-10-01, holdout ledger claim, deflated bar) -> Tier-3 proposal to the manager
    with this evidence record; fail/indeterminate -> the next iteration authored from this diagnosis at once.
  what_it_does_not_do: Changes no served model, config, sizing or order path; reads no held-out window; is not a promotion; adds no gate.
  min_n: 3000
