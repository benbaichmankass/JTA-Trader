title: 'ml_entry BAR RISK SPLIT: with each decision bar''s k same-bar entries sharing 1R instead of taking 1R each, is net R per 1R deployed non-inferior
  (margin 0.0068) while bar Sharpe rises and bar max drawdown at matched mean risk falls by >= 30%, vs the all-full-R recipe and random per-bar
  weights?'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
programme: P2
kind: experiment
iteration:
  subject: ml-entry
  subject_kind: ml_model
  from_result: RQ-20261124-e1a7-02/45455675005
  verdict_read: indeterminate
  diagnosis: 'RQ-20261124-e1a7-02 (run 45455675005, verdict_top1.json, MEASURED, dev folds 2022-01..2025-10, n 71,334 base decisions): the registered
    recipe''s LONG side is net -0.0063 R/decision (n 25,793) vs SHORT +0.0082 (n 45,541); 11.8 entries per decision bar; bar-level max DD 1,604
    R at full risk per entry; top-1 per bar was INDETERMINATE (+0.0042, t 0.26, beats random 1-of-k by +0.0115 t 1.16). Live (docs/research/ml-entry-review-2026-11-24.md):
    the side is a market-wide contrarian rule on btc_ret24 / btc_vol24 (SHAP); 9 of 10 BTC-move bars went against the move; 11 of 11 bars single-signed;
    management saved ~11 R vs the untouched bracket. Sizing is per trade (bybit_2 risk_pct 0.015, allocator_corr observe-only), so a bar of 4-5
    single-signed entries is one bet at 6-7.5% of the book against an armed 3% daily DD switch. The 1/k split is the sizing form of one-bet-per-bar
    that keeps every candidate.'
  search: 'lever family sizing/portfolio, one rule (no grid): weight = 1 / (entries in the same decision bar).'
  levers:
  - sizing
  map_entries:
  - research/levers/ml-entry.yaml
  attempt: 1
  due_by: '2026-12-01'
question: 'On the 8 dev folds, identical decisions, weight 1/k per entry in a bar of k entries: is delta(net R per 1R deployed, split - base)
  - 2 se > -0.0068 AND bar Sharpe(split) > bar Sharpe(base) AND > the random-weight control AND max bar drawdown(split) <= 0.7 x max bar drawdown(base
  scaled to the same mean risk per bar) AND split Sharpe better in >= 5 of 8 folds?'
why_this_matters: Concentration is the amplifier of every bad ml_entry bar on real money; this prices the fix that keeps the edge per R and cuts
  the stack.
power:
  expected_n: 6000
  min_detectable_effect: 0.0068
  effect_units: R_per_decision
  sd: 1.1
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATE: ~6,000 bars over 8 folds (e1a7-02 MEASURED 6,039 bars); per-1R means differ only by within-bar weighting so se(delta) is small
    (expected < 0.005).'
  feasibility:
