decision_rule:
  id: RULE-TLT1H-TP35-D1-20261114
  registered_at: '2026-11-14'
  registered_before_run: true
  statistic: 'exit_lever_ablation --grade stage0 --baseline K35 on tlt_pullback_1h over 2025-06-02 15:00 .. 2026-11-11 20:00, --forming-equity-fetch (Alpaca iex clock-aligned 1Hour + 1Min,
    decision session us_equity_intraday: the corpus and decision bar of the committed record), net of the harness cost stack for the venue (fee 0, slippage 5 bps round trip, funding 0).
    Arms: A = config-exact (tp_r 50 sentinel); K35 = tp_r 3.5, every other field unchanged. --control A = the committed record''s own __bt.json (n 149, net +4.0263R): A must reproduce it
    within 2% of n and 0.5R.'
  rule: 'RULE-D1 restated on K35: PASS iff K35 net_r > 0 with n >= 10 (fold-majority 1 is exactly RULE-D1''s net > 0, which has no fold clause); FAIL iff n >= 10 and K35 net_r <= 0;
    INDETERMINATE iff the control arm A does not reproduce the committed record (the corpus differs, so nothing is read), K35 n < 10, or a run is missing. K35 - A and the per-fold table are
    REPORTED, NOT GRADED (5ab1-01 already measured the OOS cost of K* vs the sentinel: -0.020 R/trade, CI95 [-0.082, +0.032]). No threshold is relaxed after any result.'
  what_it_does_not_do: Changes no config, roster, order or evidence record. A PASS supplies the re-measured number for the Tier-3 real-money proposal the manager takes to the operator
    (tp_r 50 -> 3.5 + tp_intent r_multiple as the operator's DECLARATION of K*, roster alpaca_live + alpaca_portfolio, a TLT same-symbol allocation record with ml_entry_eq_struct). It
    makes no claim that the edge is statistically distinguishable from zero.
  baseline: the leg config-exact (arm A), which must reproduce the committed record (control), on the same corpus in this unit.
compute: cpu_light
