decision_rule:
  id: RULE-TLT1H-TP35-D1-20261114
  registered_at: '2026-11-14'
  registered_before_run: true
  statistic: 'exit_lever_ablation over 2025-06-02 15:00 .. 2026-11-11 20:00, --forming-equity-fetch (Alpaca iex clock-aligned 1Hour + 1Min, decision session us_equity_intraday:
    the corpus and decision bar of the committed record), net of the harness cost stack for the venue (fee 0, slippage 5 bps round trip, funding 0). Arms: A = config-exact (tp_r 50
    sentinel, both sides); K35 = tp_r 3.5, both sides; L35 = tp_r 3.5 + --side-filter long. --control A = the committed record''s own __bt.json (n 149, net +4.0263R): A must reproduce it
    within 2% of n and 0.5R. Then short_cost_addon_grade.py applies a SHORT-SIDE CARRY ADD-ON (manager 2026-11-14 15:21Z; ESTIMATED provenance): per short trade, (0.05 dividend +
    0.01 borrow per annum) x calendar hold days / 365 x entry / stop distance, in R. 0.05 is above TLT''s roughly 4%/yr distribution and 0.01 is above an easy-to-borrow rate, both
    conservative; the bars are split-adjusted only, so an ex-date drop is a gain to the short that it owes back as the dividend. A worst case (every short pays one full monthly
    dividend) is reported, not graded. Long trades carry no add-on.'
  rule: 'INDETERMINATE iff the control arm A does not reproduce the committed record (the corpus differs, so nothing is read), any arm ledger is missing, or K35 or L35 holds < 10
    trades. BOTH clause: PASS iff K35 net R AFTER the short add-on > 0 (RULE-D1 with the add-on in the cost stack). LONG clause: PASS iff L35 net R > 0 (RULE-D1; no shorts). The
    long-only arm is PRE-REGISTERED here, before any result, because the committed record''s shorts read -1.33R (n 77) on this window; it is not a post-hoc pick. PROPOSAL ARM: K35 if
    its clause passes AND its adjusted net >= L35 net; else L35 if its clause passes; else none. Unit PASS iff a proposal arm exists; FAIL otherwise. Two arms are compared on one
    window, in-sample (the window holds the record the 1751-01/f090 direction readings also touched); the proposal says so. K35 - A is reported, not graded (5ab1-01 measured the OOS
    cost of K* vs the sentinel: -0.020 R/trade, CI95 [-0.082, +0.032]). No threshold is relaxed after any result.'
  what_it_does_not_do: Changes no config, roster, order or evidence record. A PASS supplies the re-measured number for the Tier-3 real-money proposal the manager takes to the operator
    (tp_r 50 -> 3.5 + tp_intent r_multiple as the operator's DECLARATION of K*, roster alpaca_live + alpaca_portfolio, a TLT same-symbol allocation record with ml_entry_eq_struct). It
    makes no claim that the edge is statistically distinguishable from zero.
  baseline: the leg config-exact (arm A), which must reproduce the committed record (control), on the same corpus in this unit.
