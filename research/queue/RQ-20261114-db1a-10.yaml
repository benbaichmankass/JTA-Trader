id: RQ-20261114-db1a-10
title: 'tlt_pullback_1h real-money promotion: re-measure the live-faithful record (Alpaca iex 1Hour + 1Min, forming bar) at the measured predictive TP K* 3.5R (tp_r 3.5) under RULE-D1, control = the committed record'
status: queued
cadence: once
kind: experiment
theme: live_strategy
priority: 1
roadmap:
- L-LADDER
question: With tp_r 3.5 (the predictive K* RQ-20261112-5ab1-01 measured, calibration gap 0.005) in place of the 50R sentinel, does tlt_pullback_1h still clear RULE-D1 (net R > 0 net of the full
  cost stack) on its committed record's window and corpus (Alpaca iex clock-aligned 1Hour + 1Min, live forming decision bar, us_equity_intraday session, 2025-06-02 15:00 .. 2026-11-11 20:00)?
why_this_matters: 'Manager 2026-11-14 15:13Z: assemble the real-money promotion check for tlt_pullback_1h (operator 2026-11-11 verbatim "promote tlt to real money", conditional on a holdout
  confirmation that RQ-20261113-f090-01 has now given: arm A = the live config, +7.02R n145 held back). tp-doctrine-guard fails a NEW real-money routing carrying the 50R sentinel / tp_intent
  none, so promotion needs a declared finite TP. 5ab1-01 measured K* 3.5R and put it to the operator to DECLARE; this unit measures what the declared value does to the record the promotion
  would rest on, BEFORE the operator is asked, so the proposal carries the re-measured number rather than the sentinel''s.'
power:
  expected_n: 149
  min_detectable_effect: 0.23
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'MEASURED: the committed record holds n 149 on this window (comms/strategy_evidence/tlt_pullback_1h.json, sd 1.32 R/trade, mean 0.027, t 0.25). RULE-D1 is a sign test on the
    pooled net, not a significance test; at this n an edge of 0.027 R/trade is NOT distinguishable from zero, and the proposal says so. Said before any run.'
  sd: 1.32
  feasibility:
    source: none
    accrual_basis: Fixed in-hand window (the committed record's); nothing accrues; Alpaca iex 1Hour + 1Min cover it at run time.
evidence_class:
  holdout: in_sample
  claim: edge
