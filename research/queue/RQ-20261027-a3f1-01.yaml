  note: 'Registered as RQ-20261027-mk01-01 / RULE-RQ20261027-MK01-01-MAKER-FILLS in commit 1ab13e21; renamed after the run to this id ONLY because research_result.py requires a hex segment (rule text, sample and thresholds unchanged). Run locally on the lane container after the registration commit was pushed. PASS by 0.03 bps over X; not a promotion case. Next step per the rule: probe (b) + post-only entry proposal to the manager (docs/research/desk-maker-fills-2026-10-27.md s5).'
  reason: 1 row, measured, pass (n 10,560, 40 days, mean +2.03 bps, CI [1.69, 2.33], 6 of 6 symbols positive)
  rows: 1
  verdict: pass
