# Hand-authored 2026-11-24 by lane ML-ENTRY-REVIEW-20261124 (Tier 1 research), dispatched by the JTA Trader manager (Manager Session 2026-11-22a)
# on the operator's ask (2026-11-24: "I want solutions"). Diagnosis: docs/research/ml-entry-review-2026-11-24.md section "Concentration".
# One factor (per-bar top-1 selection) against a matched-random 1-of-k pick from the same candidates. Decision rule registered BEFORE any run.
# Gates this adds or changes: none (a research arm). A pass would be proposed as a SELECTION rule inside the leg (which of the model's own
# candidates it takes), not an account- or strategy-level execution gate.
id: RQ-20261124-e1a7-02
title: 'ml_entry ONE BET PER BAR: when several symbols clear tau in the same decision bar, does taking only the best-predicted one beat
  taking all of them by +0.0068 R/decision AND beat a random 1-of-k pick, on the dev folds, net of the full cost stack?'
status: done
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
programme: P2
kind: experiment
iteration:
  subject: ml-entry
  subject_kind: ml_model
  from_result: ML-ENTRY-REVIEW-20261124/bar_concentration
  verdict_read: diagnosis
  diagnosis: 'Live 2026-11-15..11-24: 11 decision bars produced 39 crypto decisions, and every bar''s decisions were the SAME side across
    all symbols (the dominant inputs are market-wide). Outcomes were near-uniform within a bar: the untouched 2/3 ATR bracket (Binance
    1h proxy) read 2 winning bars and 9 losing bars. Effective n is the bar, not the trade. bybit_2 sizes each entry at risk_pct 0.015
    with no correlation term (src/runtime/allocator_corr.py is observe-only), so one bar of 4-5 entries puts 6-7.5% of the book on one
    bet, against an armed 3% daily drawdown switch.'
  search: 'lever family selection/portfolio, one rule (k = 1, no grid): at each decision timestamp, among the free symbols whose better
    side clears tau, take the one with the highest predicted net R; skipped symbols stay free.'
  levers:
  - threshold
  map_entries:
  - research/levers/ml-entry.yaml
  attempt: 1
  due_by: '2026-12-01'
question: 'On the 8 dev folds (2022-01-01..2025-10-01, registered recipe refit per fold, tau 0.10), is the mean net R per decision of the
  per-bar top-1 policy at least +0.0068 above the all-candidates policy (week-clustered t >= 2) AND +0.0068 above a matched-random
  1-of-k pick, better in >= 6 of 8 folds and the same sign in >= 3 of 4 years? Per-bar risk (mean / sd per bar, max drawdown in R) is
  reported for every arm, never gating.'
why_this_matters: 'Concentration is the amplifier of every bad ml_entry bar on real money. If the model''s within-bar ranking carries
  information, one bet per bar keeps the edge per decision and cuts the correlated stack; if it does not, the bar-level risk report
  still prices the stack for the operator''s sizing decision (Tier 3, not proposed here).'
power:
  expected_n: 25000
  min_detectable_effect: 0.0068
  effect_units: R_per_decision
  sd: 1.1
  design: two_sample
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATE: the top-1 arm is a subset of the base decisions (about a third, guessed from 60 symbols x correlated bars), so its
    week-clustered se is near 0.02 and +0.0068 is underpowered; INDETERMINATE is the likely outcome unless the ranking effect is large.
    Stated now so an indeterminate read is not re-run at another k.'
  feasibility:
    source: none
    accrual_basis: Replays public Binance Vision USD-M 1h klines; nothing accrues.
evidence_class:
  holdout: none
  claim: edge
ml_consumer:
  consumer: ML-ENTRY-LIVE-ADAPTER
  decision: 'how many of one bar''s same-side candidates ml_entry takes (all of them today)'
  legs: [ml_entry]
  book: money
baseline:
  definition: 'The registered policy on the same refit predictions: every free symbol whose better side clears tau 0.10 is taken, one open
    position per symbol, SL 2 / TP 3 ATR14, 24 h time stop, full cost stack (fee 11 bps rt + slip 3 + funding 1 bps/8h).'
  net_of_cost: true
run:
  command:
  - python3
  - scripts/research/ml_decision_entry.py
  - lever-arms
  - --fetch
  - --run-date
  - '2026-11-22'
  - --arm
  - top1
  - --tau
  - '0.10'
  - --cache
  - /tmp/ml_entry_klines
  - --unit
  - '{unit}'
  - --out
  - '{out_dir}'
  inputs:
    research_unit: RQ-20261124-e1a7-02
decision_rule:
  id: RULE-ML-ENTRY-LEVER-ARMS-20261124
  registered_at: '2026-11-24'
  registered_before_run: true
  baseline: the all-candidates policy on identical predictions; control = a seeded random 1-of-k pick from the same candidates
  statistic: 'scripts/research/ml_decision_entry.py lever-arms --arm top1 (lever_verdict / LEVER_RULE): delta = pooled mean net R per
    decision (top1) - (base); se = week-clustered influence se (arm_diff); folds_better and years_positive as in RQ-20261124-e1a7-01.'
  rule: 'PASS iff top1 n >= 3000 AND delta(top1 - base) >= +0.0068 AND t >= 2.0 AND delta(top1 - random1) >= +0.0068 AND folds_better >=
    6 of 8 AND years_positive >= 3 of 4. FAIL iff n >= 3000 AND delta + 2.0 se < +0.0068. INDETERMINATE otherwise. k = 1, tau, folds,
    bar and cost stack are fixed now.'
  pass_action: 'A fresh-window confirmation on bars after 2026-10-01 (holdout ledger claim, deflated bar), then a data-backed Tier-3
    proposal of a top-1 selection inside the ml_entry leg. Applied by the operator or a mandate, never by a lane.'
  fail_action: 'Close within-bar ranking as a selection lever; the bar_risk report is handed to the operator as the sizing input it is.'
  proposal_mapping: 'pass -> confirmation -> Tier-3 proposal; fail -> lever closed, risk report handed over; indeterminate -> report se, stop.'
  what_it_does_not_do: 'Changes no sizing, config or order path; adds no gate; reads no held-out window.'
  min_n: 3000
compute: cpu_long
value:
  bucket: ai_trader
  usd_at_stake_per_month: 150
  confidence: 0.15
  basis: 'ESTIMATE: the 11-20 15:00Z and 11-22 07:00Z bars alone lost about 4 R each on bybit_2 (journal).'
intervention_controls:
  hold_to_bracket: true
  hold_to_bracket_note: 'identical predictions, brackets and stops; only how many same-bar candidates are taken differs'
  matched_random:
    draws: 100
    note: 'COMPUTED: 100 seeded random 1-of-k picks from the same candidate set at every bar per fold (lever_arms RANDOM_DRAWS), pooled into one control mean'
  best_static:
    grid:
    - all candidates (live)
    - random 1-of-k (control)
    excludes_test_folds: true
    note: nothing is tuned on a fold
  bootstrap_group: week
practice_precedent: 'one-bet-per-signal portfolio construction for correlated entries (principles M13); docs/research/ml-entry-review-2026-11-24.md.'
