question: 'Operator 2026-11-23: the equity books should trade both directions of an index through BUY orders on leveraged/inverse ETFs. No dedicated leg trades any
  inverse ETF. Does the shipped qqq_trend_long_1d logic (every config field unchanged, symbols[0] -> PSQ via exit_lever_ablation --symbol) earn a positive edge net of the
  harness cost stack on the inverse instrument? Trend-following a decaying inverse ETF is the live question: the breakout filter must catch the down-regimes without
  paying the leveraged decay in the chop.'
why_this_matters: 'alpaca_live cannot short (side_filter long); the only way it can be positioned for a falling index is a long position in an inverse ETF. This is the
  Stage-0 evidence behind any dedicated inverse-ETF leg in docs/research/index-leveraged-etf-roster-2026-11-23.md.'
