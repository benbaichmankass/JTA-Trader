  statistic: 'scripts/research/exit_lever_ablation.py --grade sweep, single arm A (the shipped qqq_trend_long_1d config, long-only) on PSQ, 4 calendar folds: net_r over the
    window, n, maxDD, per-fold net_r; harness cost stack (fee 0 + 5 bps slippage); a 2x-slippage re-read is reported beside it.'
  rule: 'PASS IFF n >= 25 AND net_r > 0 AND net_r > 0 in >= 3 of 4 folds AND net_r stays > 0 under 2x slippage. INDETERMINATE if n < 25. FAIL otherwise. The
