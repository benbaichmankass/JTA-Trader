    index (reported, not graded) for context. PASS is a Stage-0 pass of this twin on its own, which per the operating plan goes to real money; the roster proposal
    in docs/research/index-leveraged-etf-roster-2026-11-23.md says what config follows. This unit changes no config.'
  what_it_does_not_do: 'Changes no config, roster or order. Does not test the direction-switch form (RQ-20261123-1e02-01) or the ML entry (RQ-20261123-1e03-01).
