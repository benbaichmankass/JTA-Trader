  statistic: exit_lever_ablation --grade stage0 --forming-1m-fetch, one run per arm per window; timeframe_lever_grade.py --family exit --confirm-prefix pre_.
  rule: 'AM-ML multiple-testing guard: successive levers on one window fork the paths, so this rule NAMES the leg''s prior lever attempts on the record window (RQ-20261113-f251-06
    (forming baseline -3.35R n 55; long-only +1.88R, 2/4 folds -- FAIL)) and ALSO requires the pass to hold on the equal-length window before the record window (2024-11-13..2025-11-12),
    which no diagnosis or lever pick read. No fold bar is relaxed. ONE arm, ONE value (trail_decay stall 20 / tight 2.5), chosen from the closed-bar map before this
    run. PASS iff the candidate passes its own Stage 0 on the record window (net_r > 0, n >= 20, >= 3/4 folds positive) AND beats the baseline arm''s net_r there,
    AND on the confirmation window its net_r is > 0 and above the baseline arm''s. FAIL iff graded and either clause fails. INDETERMINATE otherwise (a run wrote no
    verdict, the baseline did not run, or the candidate is under its n floor on the record window). Arms, windows, folds and floors are fixed now.'
  what_it_does_not_do: Changes no config, roster, order or evidence record. A PASS is a data-backed Tier-3 proposal routed to the manager (the leg stays on the demo
    floor until then); a FAIL is recorded on the lever map and the census is written before any next lever.
