question: 'On qqq_pullback_1h as declared in config/strategies.yaml, over QQQ 1h candles 2019-01-01 .. 2025-06-01 (the committed evidence record comms/strategy_evidence/qqq_pullback_1h.json measured 2025-06-02
  .. 2026-11-11, n=73, net R +5.4886, 3 of 4 folds positive, verdict pass_unconfirmed), is net R > 0 after the full cost stack with >= 4 of 6 calendar folds net-positive? Lever map: research/levers/qqq_pullback_1h.yaml.'
why_this_matters: 'Iteration orphan (scripts/research/iteration_orphans.py 2026-11-23): qqq_pullback_1h is pass_unconfirmed with no live unit, and the two-week plan (research/programmes/03-strategy-improvement.yaml)
  calls it ''a discovery only: confirm on data not used for selection, then a Tier-3 proposal to the manager''. TIME-DISJOINT FORM: the record window starts 2025-06-02 and this window ends 2025-06-01, so
  no bar is shared. Yahoo serves QQQ 1h only for ~730 days (that is why the record is 528 days), so earlier bars come from Dukascopy''s same-ticker QQQ CFD (scripts/ops/dukascopy_instruments.py REL_SAME_TICKER_CFD:
  same underlying, CFD; NOT a proxy of another instrument like SPYM->SPY); the cost stack is the leg''s own venue-aware stack (fee 0, slippage 5 bps round trip). POWER CHECK, 2026-11-23, A arm only, before
  any result was read for decision: n(A)=210 trades (2019-01-17 .. 2025-05-30), sample sd of net R 1.85. HONEST LIMIT: the registered rule is a SIGN test (net R > 0, fold majority), not an effect-size estimate.
  The record''s expectancy is +0.075 R/trade, so the standard error of the mean over n=210 is about 0.128 R: if the true expectancy equals the record''s, P(net R > 0) is ~72%; if it is zero, ~50% (the 4-of-6
  fold condition lowers that). A PASS is therefore a weak lead, not an edge; a FAIL is the informative outcome. CAVEAT: param_selection_provenance on the record is ''not_established'', so this window cannot
  be proven unseen by whoever chose the parameters; stated, not hidden. A PASS is a lead for the live-producer check, the regime_gating family unit and a Tier-3 proposal to the manager, never a config edit;
  a FAIL sends the leg back to diagnosis.'
