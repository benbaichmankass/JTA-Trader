id: RQ-20261021-7c2b-03
title: >-
  Programme 07 Q5 CONFIRM by transfer: does the LONG-only filter that won ef5d-06 also beat unfiltered daily Donchian-20 on six perps
  it was NOT selected on (BNB, DOGE, LINK, LTC, BCH, DOT)?
status: done
cadence: once
theme: timeframes
priority: 2
kind: experiment
question: >-
  On Binance USD-M daily candles for BNB/DOGE/LINK/LTC/BCH/DOT over 2020-06-01..2026-10-20 (donchian 20, trail_mult 5.0), does LONG
  (--long-only) pass the pooled Stage-0 rule AND beat unfiltered B by >= 0.10 R per trade?
why_this_matters: >-
  ef5d-06 PASSED with best arm LONG: pooled 0.508 R/trade (n=216, +109.8 R) vs unfiltered 0.267 (n=256) on the six core perps. It was
  the best of three filters on those six symbols, so it is a LEAD. Node P7-Q5-confirm: confirmation is a transfer, never a re-selection
  -- the passing filter alone, same levers, on symbols it was not chosen on.
power:
  expected_n: 200
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: ef5d-06 LONG n=216 over six symbols x 6.8 y; ~6.3 y here (DOT from 2020-08) -> ~200; floor 39.
  feasibility:
    source: none
    accrual_basis: Re-measurement on fetched public candles over a pinned window; nothing accrues.
decision_rule:
  id: RULE-P7-Q5-LONG-TRANSFER
  registered_at: '2026-10-21'
  registered_before_run: true
  statistic: >-
    harness_stage0.py --family trend --timeframe 1d, arms B and LONG on six symbols disjoint from ef5d-06; per cell and pooled.
  rule: >-
    PASS iff LONG passes and beats B by >= 0.10 R/trade -> the long-only daily filter is CONFIRMED; node P7-Q6-daily-donchian's overlap
    read uses the LONG arm. FAIL iff LONG fails -> the ef5d-06 win was symbol-selected; the daily arm proceeds unfiltered (D55, ef5d-03).
    INDETERMINATE otherwise. Verdicts are the script's own (scripts/research/harness_stage0.py, grades fixed by these flags): per CELL
    pass iff n >= n_floor AND net_r > 0 AND >= fold_majority of the calendar folds net > 0, fail iff n >= n_floor and not, indeterminate
    iff n < n_floor; per ARM pass iff pooled n >= pooled_n_floor AND pooled net_r > 0 AND pooled folds >= fold_majority AND >= breadth_frac
    of the POWERED cells pass (and, with --baseline, beats the baseline's pooled net R/trade by >= delta), indeterminate iff pooled
    n < pooled_n_floor or < 2 powered cells or < half the declared cells measured (a fetch/harness fault is recorded per cell, never
    dropped), fail otherwise. Holm-corrected one-sided t p-values are REPORTED, not graded. Thresholds are not changed after any result.
  what_it_does_not_do: >-
    Does not edit config/strategies.yaml, config/accounts.yaml or any roster; does not tune beyond the fixed arms listed; does not pool
    windows with any committed record; is not a promotion case. Candles are Binance USD-M (a PROXY for Bybit linear; prices track within
    a few bps) and the funding term is a directionless magnitude (execution_costs P1), both stated in the record.
compute: cpu_long
value:
  usd_at_stake_per_month: 100
  confidence: 0.3
  bucket: frontier
  basis: stand-in (07 node P7-Q5 weight); an estimate.
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 4.0
  est_minutes: 60
  basis: >-
