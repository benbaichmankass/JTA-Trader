id: RQ-20261108-98e3-12
title: 'Regime head at 15m (the deployed regime-head timeframe): does adding HAR-RV regressors lift LightGBM log-loss over the default LightGBM on BTCUSDT, ETHUSDT
  and SOLUSDT, where the 1h reads (07/09) were indeterminate (+0.001..+0.008)?'
status: queued
cadence: once
theme: ml_health
priority: 2
kind: experiment
programme: P2
roadmap:
- M25
question: 'The 1h HAR-RV lift on the regime head was indeterminate in RQ-20261107-98e3-07 (HGB) and -09 (LightGBM, latest 25,000 bars: +0.001/+0.004/+0.008, CIs include
  0). The deployed regime heads (ml/configs btc/sol/mes regime 15m LightGBM) run at 15m, so ask the same question there: lgbm_har (HAR-RV day/week/month regressors
  from log_return, 96 bars per day) vs default lgbm, purged 5-fold CV, embargo 24, tail 60000 rows, metric logloss.'
why_this_matters: If HAR-RV lifts the 15m regime head beyond noise, it is a candidate feature for the next regime-head retrain (a Tier-3 change proposed, never applied
  here); if not, the HAR-RV line closes at 15m and 1h.
ml_consumer:
  consumer: src/runtime/regime_shadow.py
  decision: whether the direction head family/horizon advances candidate -> shadow, or the price-only null is extended; acts through no order path
  legs:
  - trend_donchian_eth_4h
  - trend_donchian_xrp_4h
  - xrp_pullback_2h
  - ada_pullback_2h
  book: money
power:
  expected_n: 36000
  min_detectable_effect: 0.1
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'tail_rows 60000 with min_train_frac 0.4 leaves ~36000 out-of-sample rows over 5 folds per symbol; d=0.1 paired needs ~785 rows; bars are autocorrelated
    so effective n is lower: the rule requires the same-direction CV mean on EVERY symbol. expected_n is an ESTIMATE, not a measurement.'
  feasibility:
    source: none
    accrual_basis: 'Fixed by construction (tail_rows of a nightly-rebuilt shard): n does not grow with waiting, so an underpowered result is reported as such and
      the follow-up is a different dataset, not a re-run.'
decision_rule:
  id: RULE-RQ2026110898e312-REG
  registered_at: '2026-11-08'
  registered_before_run: true
  statistic: 'scripts/research/ml_bakeoff.py: per-group (BTC/ETH/SOL 15m) paired CV mean logloss delta of lgbm_har vs lgbm (positive = lgbm_har better), 5 folds,
    embargo 24, tail 60000 rows.'
  rule: 'PASS IF lgbm_har beats lgbm by >= +0.003 nats on the CV mean on ALL of BTCUSDT_15m, ETHUSDT_15m and SOLUSDT_15m. FAIL IF lgbm_har does not beat lgbm by >=
    0 on ANY symbol. INDETERMINATE otherwise, or if folds < 3 or a shard is stale/unavailable. Stated n: 60,000 tail rows per group, 5 folds. Thresholds are not changed
    after any result.'
  what_it_does_not_do: 'No served model, roster or config is read or changed; a research bake-off recipe, not any deployed head. Nothing here touches the ENTRY-EQ
    confirm window. Amended 2026-11-08 (before this unit ran): bake-off config baseline prior -> lgbm (the engine only pairs learners with the baseline and controls;
    the first config would have read INDETERMINATE, as units 19/20 did). Thresholds and statistic unchanged.'
  min_n: 5 purged CV folds on the tail shard, >= 3 folds
intervention_controls:
  not_applicable: a model-quality bake-off on a static published shard, not an in-trade action or active-management intervention
compute: auto
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  published_data: metis-market-data
  peak_memory_gb: 3.0
  est_minutes: 30
  basis: 'Estimate, NOT measured: 3 shards x 2 arms x 5 folds on published shards, comparable to RQ-20261030-41cc-26; compute: auto routes it to the Kaggle CPU kernel.'
value:
  bucket: ai_trader
  usd_at_stake_per_month: 150
  confidence: 0.2
  basis: 'stand-in: gates whether the head is worth advancing on the money legs; not a measured P&L'
run:
  command:
  - python3
  - scripts/research/ml_bakeoff.py
  - --unit
  - '{unit}'
  - --out
  - '{out_dir}'
  timeout_minutes: 60
  inputs:
    research_unit: RQ-20261108-98e3-12
ml_bakeoff:
  task: classification
  metric: logloss
  higher_is_better: false
  dataset:
    kind: jsonl
    groups:
      BTCUSDT_15m:
        path: datasets-out/market_features/BTCUSDT/15m/v002/data.jsonl
      ETHUSDT_15m:
        path: datasets-out/market_features/ETHUSDT/15m/v002/data.jsonl
      SOLUSDT_15m:
        path: datasets-out/market_features/SOLUSDT/15m/v002/data.jsonl
    ts_col: ts
    target: regime_label
    features:
    - rolling_log_return_vol
    - log_return
    - log_return_lag_1
    - log_return_lag_2
    - hour_of_day
    - dayofweek
    tail_rows: 60000
  cv:
    folds: 5
    embargo_rows: 24
    min_train_frac: 0.4
  baseline: lgbm
  controls:
  - prior
  candidates:
  - lgbm_har
  learners:
    prior:
      kind: prior
    lgbm:
      kind: lightgbm
      params: &id001
        learning_rate: 0.05
        min_child_samples: 50
        n_estimators: 200
        num_leaves: 31
    lgbm_har:
      kind: lightgbm
      params: *id001
      feature_blocks:
      - kind: har_rv
        return_col: log_return
        bars_per_unit: 96
  rule:
    min_folds: 3
    pass_if:
    - group:
      - BTCUSDT_15m
      - ETHUSDT_15m
      - SOLUSDT_15m
      vs: baseline
      window: cv
      op: '>='
      value: 0.003
    fail_if_no_candidate_reaches:
    - group: any
      vs: baseline
      window: cv
      op: '>='
      value: 0.0
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
practice_precedent: 'M6 (docs/reference/trading-and-model-practice-principles.md): purged, embargoed walk-forward CV; a log-loss lift is reported per symbol, never
  pooled; the control arm is the strongest classical feature set, not only the class prior.'
related:
