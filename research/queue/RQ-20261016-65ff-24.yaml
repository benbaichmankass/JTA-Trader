id: RQ-20261016-65ff-24
title: 'AI trader / drift at 1h on published data: does LightGBM keep its macro-F1 lift over the class prior on the LAST 90 DAYS as well as under CV, on
  BTC, ETH and SOL 1h? (1h twin of RQ-20261012-75b2-16..18; drift-remediation question for PI-20261016-P3PFA1GK-0001)'
status: queued
cadence: once
theme: ml_health
priority: 2
kind: experiment
question: On the 1h regime label (published BTC/ETH/SOL 1h v002 shards, last 40000 rows), does LightGBM on the six shipped regime features beat the class
  prior on macro-F1 by >= +0.10 under purged CV AND on the holdout after 2026-07-16 (train strictly before)? The CV-vs-holdout gap is the drift reading.
why_this_matters: 'PI-20261016-P3PFA1GK-0001: the hourly drift scan flags the same 9 heads on every pass, including btc-regime-1h-lgbm-v2 and btc-regime-1h-lgbm-yz-v1
  (1h). The drift-remediation skill separates TRANSIENT drift (skill holds on recent data -> no action) from PERSISTENT capability loss (feature/label fix).
  75b2-16..18 answered it at 15m (all FAIL on the +0.10 holdout bar). This is the 1h answer, off the saturated trainer. A holdout PASS here with the flag
  still firing is evidence the persistent flag is an instrument artifact (ML-DRIFT-SPLIT-INSTRUMENT), not model decay.'
power:
  expected_n: 24000
  min_detectable_effect: 0.1
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: tail_rows 40000 with min_train_frac 0.4 leaves ~24000 out-of-sample CV rows over 5 folds per symbol and ~2,160 holdout rows (90 days x 24); bars
    are autocorrelated so effective n is lower -- the rule asks the same direction on every symbol.
  feasibility:
    source: none
    accrual_basis: 'Fixed by construction (tail_rows of a nightly-rebuilt shard): n does not grow with waiting, so an underpowered result is reported as
      such and the follow-up is a larger or different dataset, not a re-run.'
decision_rule:
  id: RULE-RQ2026101665ff24-ML-DRIFT-1H
  registered_at: '2026-10-16'
  registered_before_run: true
  statistic: Paired per-fold macro-F1 difference (lgbm minus prior) on identical purged folds (5, embargo 24 rows, min_train_frac 0.4) and on one holdout
    window (ts >= 2026-07-16), per symbol; ml_bakeoff.py evaluate_rule applies this unit's ml_bakeoff.rule.
  rule: 'PASS IF lgbm - prior macro-F1 >= +0.10 on the CV mean AND on the holdout on ALL THREE symbols (1h skill holds in the last 90 days: the 1h drift
    flags are transient or an instrument artifact -- note it on PI-20261016-P3PFA1GK-0001; no retrain). FAIL IF lgbm evaluated ok and the holdout delta
    < +0.10 on any symbol (persistent at 1h for that symbol: a drift-remediation entry on ML-REGIME-15M-DRIFT naming the 1h symbol, never a demotion). INDETERMINATE
    IF fewer than 3 usable folds, an arm is unavailable, or holdout rows < 20 (an empty holdout is the PI-20261015-WNBZB5WN-0001 route fault, not a verdict).'
  min_n: 3 usable CV folds per symbol; holdout >= 20 rows.
  what_it_does_not_do: Retrains no registered model and touches no registry, manifest, stage, timer or config; arms no retrain (TRAINER-DRIFT-NEXT Q2 is
    on hold by operator decision 2026-10-16). Grades the 1h regime LABEL with the six shared features, not the shipped head's exact feature set, and says
    nothing about P&L.
compute: auto
value:
  bucket: ai_trader
  usd_at_stake_per_month: 100
  confidence: 0.3
  basis: 'stand-in: decides whether 1h drift flags need remediation work or an instrument fix; not a measured P&L'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  published_data: metis-market-data
  peak_memory_gb: 3.0
  est_minutes: 20
  basis: 'Estimate, NOT measured: re-declare from the first run''s run-manifest.json.'
ml_bakeoff:
  task: classification
  metric: macro_f1
  dataset:
    kind: jsonl
    groups:
      BTCUSDT_1h:
        path: datasets-out/market_features/BTCUSDT/1h/v002/data.jsonl
      ETHUSDT_1h:
        path: datasets-out/market_features/ETHUSDT/1h/v002/data.jsonl
      SOLUSDT_1h:
        path: datasets-out/market_features/SOLUSDT/1h/v002/data.jsonl
    ts_col: ts
    target: regime_label
    features:
    - rolling_log_return_vol
    - log_return
    - log_return_lag_1
    - log_return_lag_2
    - hour_of_day
    - dayofweek
    tail_rows: 40000
    holdout_after: '2026-07-16'
  cv:
    folds: 5
    embargo_rows: 24
    min_train_frac: 0.4
  baseline: prior
  controls: []
  candidates:
  - lgbm
  learners:
    prior:
      kind: prior
    lgbm:
      kind: lightgbm
      params:
        n_estimators: 200
        learning_rate: 0.05
        num_leaves: 31
        min_child_samples: 50
  rule:
    min_folds: 3
    pass_if:
    - group: ALL
      vs: baseline
      window: cv
      op: '>='
      value: 0.1
    - group: ALL
      vs: baseline
      window: holdout
      op: '>='
      value: 0.1
    fail_if_no_candidate_reaches:
    - group: ALL
      vs: baseline
      window: holdout
      op: '>='
      value: 0.1
run:
  command:
  - python3
  - scripts/research/ml_bakeoff.py
  - --unit
  - '{unit}'
  - --out
  - '{out_dir}'
  timeout_minutes: 60
  inputs:
    research_unit: RQ-20261016-65ff-24
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
roadmap:
- M25
- L-REGIME
related:
- PI-20261016-P3PFA1GK-0001
- RQ-20261012-75b2-16
- ML-REGIME-15M-DRIFT
- ML-DRIFT-SPLIT-INSTRUMENT
- .claude/skills/drift-remediation/SKILL.md
- P2-AI-REGIME-BACKLOG-1016
last_dispatched_at: null
