id: RQ-20261103-5a03-02
title: 'HOLDOUT RE-RUN, soak book: does slv_trend_1h''s configuration, SELECTED on the earliest ~75% of its history, hold up net of the full cost
  stack when tested ONCE on the held-back latest ~25%?'
cadence: once
roadmap:
- L-LADDER
theme: live_strategy
priority: 1
kind: experiment
question: 'slv_trend_1h''s committed Stage-0 record (comms/strategy_evidence/slv_trend_1h.json: RULE-D1-STAGE0-NET-OF-FULL-COST pass, n=68, +53.14R,
  4/4 folds, faithful; mechanics proven by its own PASS shadow soak) leaves MD-PROMOTE-S1-S2 -> alpaca_live stopped ONLY at R-HOLDOUT. Select
  among the pre-registered configurations (declared + 4 neighbours) on the earliest span only, then read the ONE selected configuration once on
  the latest span.'
why_this_matters: 'SOAK-REGRADE 2026-11-03 (docs/claude/work/findings/soak-regrade-20261103.md): one of the four legs whose only blocker to real
  money is the holdout (operator decision 2026-10-16 PROMOTION-BAR-MULTIPLICITY). HIGHEST-VALUE unit class in the queue: a pass with A selected
  makes the leg promotable under MD-PROMOTE-S1-S2 with no further soak.'
power:
  expected_n: 12
  min_detectable_effect: 0.57
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'expected_n is an ESTIMATE of the held-back trade count (committed Stage-0 record: ~100+ trades over the long window x the ~25-40% held-back
    share). Floor 25 (the dispatch); at n=25 a one-sample test detects d=0.57 sd. A thin run grades indeterminate/underpowered -> NEEDS-DATA,
    never pass or fail. Said before the run.'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
evidence_class:  # EVIDENCE-CLASS-BACKFILL 2026-11-11, rule E1 (scripts/research/backfill_evidence_class.py)
  holdout: holdout_window
  claim: edge
decision_rule:
  id: RULE-RQ-20261103-5a03-02
  statistic: 'scripts/research/exit_lever_ablation.py --grade holdout on slv_trend_1h, window 2025-04-23 .. 2026-10-22 23:59, every arm ONE continuous
    harness pass (argv via regime_debt_matrix.build_harness_cmd, the evidence builder''s own), net of the full cost stack the harness resolves
    for Alpaca equities (fee + the operator-reaffirmed provisional 5.0 bps slippage); per-trade net_r from the harness''s --emit-trades. Arms:
    A = the leg as declared; C1: atr_stop_mult=1.0; C2: atr_stop_mult=2.0; C3: donchian=16; C4: donchian=32. BOUNDARY, fixed before any outcome
    is read: the latest 25% of the calendar window, grown in 1% steps until it holds 25 of arm A''s ENTRIES (entry times only), capped at 40%.
    DISCOVERY = trades whose entry AND exit precede the boundary (straddlers are in neither span); 4 equal calendar folds of the discovery span.
    HOLDOUT = the selected arm''s trades entered on/after the boundary.'
  rule: 'SELECTION (discovery only): an arm is eligible iff discovery n >= 25 AND discovery net R > 0 AND >= 3 of 4 discovery folds net-positive;
    the eligible arm with the highest discovery net R is selected (a tie goes to A). HOLDOUT (read once): INDETERMINATE/insufficient_discovery
    IF every arm holds < 25 discovery trades; FAIL/no_discovery IF no arm is eligible otherwise; INDETERMINATE/underpowered IF the selected arm
    holds < 25 held-back trades; PASS/confirmed IF held-back net R > 0; FAIL/not_replicated otherwise (closes that configuration, never the family).
    ON PASS with A selected: write the verdict''s holdout_confirmation block (source_run -> the committed verdict.json) into comms/strategy_evidence/slv_trend_1h.json.
    ON PASS with another arm selected: the declared configuration is unconfirmed -- the result is the evidence for a Tier-3 config proposal, never
    an edit here. ON FAIL: a note on PROMOTION-BAR-MULTIPLICITY for the manager; the leg is NOT demoted on it (live net-of-cost governs demotion).
    Thresholds are not changed after any result.'
  what_it_does_not_do: 'Edits no config, roster or record and places no order. The declared configuration may itself have been chosen on data
    that overlaps the held-back span (param_selection_provenance: not_established), which is why the selection is re-made here on the discovery
    span alone; a confirmation is only as clean as that re-selection. Does not deflate: one configuration is tested once.'
  registered_before_run: true
  registered_at: '2026-11-03'
compute: cpu_light
value:
  bucket: own_losses
  usd_at_stake_per_month: 300
  confidence: 0.35
  basis: 'stand-in: a testing leg one holdout read from alpaca_live + alpaca_portfolio; not a P&L measurement.'
