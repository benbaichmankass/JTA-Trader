question: On the 5722-01 window (QQQ 1h 2022-12..2026-11), does a trend_lookback of 75, 120 or 150 beat 60 by >= 4.0 R net of cost, maxDD no worse, >= 3 of 4 folds? Three arms,
  denominator 3 (6 with the 5722-01 arms, said in the result).
why_this_matters: 'The 5722-01 tl90 win is one point on an untested curve (40: -5.5, 60: 0, 90: +16.0). A smooth peaked or still-rising response across 75/120/150 is potential;
  an isolated tl90 spike is overfit. This reads the SHAPE the lever map needs before any holdout is trusted; the pre-dev confirmation (0104-02) reads the same lever on other
  data.'
