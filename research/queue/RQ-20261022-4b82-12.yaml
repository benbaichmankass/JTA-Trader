question: RQ-20261014-f0e2-11 (hot-vol entry skip on xrp_pullback_2h at 0.8/0.9/0.95) graded FAIL. On xrp_pullback_2h, over 2020-07-01..2026-10-15
  23:59 (6 calendar folds by entry time, the harness's venue-aware fee + slippage + funding stack), does any arm (TV80, TV90, TV95) beat the leg
  as declared (B) by >= 0.5 R net in >= 4 of 6 folds with max drawdown no worse? The pre-registered hypothesis is that the hot-tail trail-tighten
  reduces giveback without removing the entries.
why_this_matters: 'Operator directive 2026-10-22: an idea that failed one test is not dead; it failed the first test. This unit is a registered
  VARIANT of that first test. First test: RQ-20261014-f0e2-11 (hot-vol entry skip on xrp_pullback_2h at 0.8/0.9/0.95) graded FAIL. DIAGNOSIS (one
  line): the skip arms cut entries on a leg that trades below its own backtest (8bbc-01: -8.84 R over 16, 3.4th pct), but no arm beat B by +1
  R with dDD <= 0 in 3 of 4 folds; the leg''s backtest gives back most of its peak (RQ-20261022-fd06-02 why-this-matters), so an exit-side vol
  rule is the unmeasured half. Lane AUTHOR-FLOOR-1022 (research runnable floor 33 vs 65 at 17:40Z). Prior ids: RQ-20261014-f0e2-11, RQ-20261022-fd06-02.
  regime theme was short in the 17:40Z health check.'
