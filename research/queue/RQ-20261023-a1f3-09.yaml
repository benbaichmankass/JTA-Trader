  (research runnable floor 40 vs 57 at 09:14Z). First test(s): RQ-20261022-4b82-11 (hot-vol trail tighten TV80/TV90/TV95 at 2.0-2.5 x ATR on trend_donchian_xrp_4h)
  graded FAIL. Diagnosis (one line): the xrp_4h arms tightened to 2.0-2.5 x ATR against a declared 5.0 trail, i.e. HALF the stop distance, which stops out the very
