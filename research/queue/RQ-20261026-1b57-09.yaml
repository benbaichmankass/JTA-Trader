question: 'RQ-20261021-7c2b-07 ran trend_donchian_xrp_4h AS DECLARED on BNB/DOGE/LINK/LTC/BCH/DOT (4h, 2020-06-01..2026-10-20) and read UNIT FAIL on the fold-majority clause only: all
  six cells net-positive, +73 R pooled, n 434, but 3 of 6 calendar folds positive (need 4). On the same six cells and the same declared arm, over the same window extended to 2026-10-26,
  does the pooled edge show >= 5 of 8 equal calendar folds net positive (the finer cut registered BEFORE this run), with the pooled-sign and breadth clauses unchanged?'
why_this_matters: 'Programme 03 node P3-RG1025-q8-breadth-diagnosis asked for exactly this. The leg is POSITIVE on all six new symbols; the miss is whether the gain is spread across
  time or sits in two or three quarters. Eight folds over ~6.4 years are ~10-month spans: a regime-concentrated gain fails >= 5 of 8 as it failed 4 of 6, while a broadly spread one passes.
  This is the same data re-cut, so a PASS is NOT independent evidence beyond 7c2b-07 -- it says the earlier FAIL was a granularity artifact, and the follow-up for a roster add is the
  disjoint basket-B/C units (this lane: -05, -06). PROP SUPERSET BAR (CLAUDE.md promotion ladder): this unit supplies Stage 0 only. A PASS is a Stage-0 input for a prop or real-money
  roster add; the prop EV/survival gate against each firm''s DD limits (prop_ev_grid.py / comms/prop_survival/<leg>.json), a PASSED mechanical Stage-1 soak and Gate 2 are ALL still required,
  and no roster is edited here.'
