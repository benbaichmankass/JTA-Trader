decision_rule:
  id: RULERQ20261118abab10
  registered_at: '2026-11-18'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg squeeze_breakout_4h --grade replace, the sibling window and folds of RQ-20261106-014 (same leg, same flags) by entry time, net of the full cost
    stack the harness resolves per venue (execution_costs.resolve_cost_policy, recorded per arm as cost_stack). Arms fixed now: A = the leg as declared in config/strategies.yaml; candidates SE6, SE12, BE1.
    Per arm: n, net_total_r, max_drawdown_r, net R per fold.'
  rule: 'INDETERMINATE IF n(A) < 39 or IF every candidate arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C) > net_r(A) AND delta >= 0.02 R x n(A) AND net R(C) >= net
    R(A) in >= 4 of 6 folds AND maxDD(C) <= maxDD(A) x 1.35. PASS IF one or more pass: the best by net R is named (the denominator is the 3 candidate arm(s) here) and the follow-up is ONE confirmation unit
