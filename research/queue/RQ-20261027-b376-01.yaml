id: RQ-20261027-b376-01
title: 'Regime head: does a bagged-tree ExtraTrees arm (300 trees, min_samples_leaf 20, a different inductive bias from boosting) beat the shipped-shape LightGBM on logloss on the 15m published shards?'
status: queued
cadence: once
roadmap:
- M23
theme: ml_health
priority: 2
kind: experiment
question: 'The regime-head neural arms did not reach the bar (RQ-20261026-90d3-01 default MLP; a142-01 regularised MLP is queued). 78 % of registered models are GBDT, so the question the family-diversity
  line asks is open for a NON-boosting tree learner: does sklearn ExtraTrees (n_estimators 300, min_samples_leaf 20, seed 0, median impute) lower the 3-class regime_label logloss vs lgbm_base by >= 0.005
  on the CV mean on ALL THREE of BTC/ETH/SOL 15m and by >= 0 on the holdout after 2026-07-12? Same rows, folds and features as 90d3-01 and a142-01.'
why_this_matters: 'Model-family diversity is a roadmap target. ExtraTrees variance reduction is the cheapest tree-family control that is not boosting: if it ties lgbm_base the headline is that the regime
  head is saturated on these six features; if it wins, the family goes to a disjoint-window confirmation before any manifest note. First-test-failed-variants-queued applies: a FAIL records this exact configuration
  and keeps the family open. Shard drift between runs is PI-20261026-HOPS2047-0001, so this unit also states the shard state it read. Trial count for this cell across MLP and ExtraTrees arms: 3 (90d3-01,
  a142-01, this).'
power:
  expected_n: 36000
  min_detectable_effect: 0.1
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: Unit = OOS row per symbol. tail_rows leaves an ESTIMATED 24,000-36,000 OOS rows per symbol over 5 folds until the first run replaces it with the measured n. d=0.1 needs ~785 rows so rows are not
    the limit; bars are autocorrelated, so the rule also requires fold-mean deltas (min_folds 3) on all three symbols.
  feasibility:
    source: none
    accrual_basis: Fixed published shard; nothing accrues.
decision_rule:
  id: RULE-RQ20261027B37601-REGET
  statistic: 'Paired per-fold logloss difference on identical purged folds (5, embargo 96) and on the holdout (rows after 2026-07-12), per symbol: lgbm_base minus the candidate (positive = candidate better);
    mean over folds. Reported, not graded: every arm minus the class prior.'
  rule: 'PASS IF candidate improves logloss by >= 0.005 on the CV mean on ALL THREE symbols AND >= 0 on the holdout on all three: a bagged-tree arm adds information over the shipped-shape head (a disjoint-window
    confirmation follows before any manifest note; trial count 3). FAIL IF the ExtraTrees candidate is worse than lgbm_base on the CV mean on EVERY symbol (record the exact configuration in the plan family
    history; the family stays open for other configurations). INDETERMINATE otherwise, or if folds < 3 or an arm is unavailable.'
  min_n: 3 usable CV folds per symbol; holdout >= 200 rows per symbol.
  what_it_does_not_do: Trains nothing that serves; touches no config, registry, roster or order path; compares unweighted arms on the shared features, not shipped models. A learner-family result is not
    edge and is not a P&L claim.
  registered_before_run: true
  registered_at: '2026-10-27'
compute: auto
value:
  bucket: ai_trader
  usd_at_stake_per_month: 50
  confidence: 0.2
  basis: planning weight for the regime-head quality and model-diversity line (02 Q4), not a measured P&L
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  published_data: metis-market-data
  peak_memory_gb: 4.0
  est_minutes: 40
  basis: 'Estimate, NOT measured: 3 shards x 2-3 arms x 5 folds, comparable to RQ-20261025-008 (30 min at 40,000 tail rows); re-declare from the first run.'
ml_bakeoff:
  task: classification
  metric: logloss
  dataset:
    kind: jsonl
    groups:
      BTCUSDT:
        path: datasets-out/market_features/BTCUSDT/15m/v002/data.jsonl
      ETHUSDT:
        path: datasets-out/market_features/ETHUSDT/15m/v002/data.jsonl
      SOLUSDT:
        path: datasets-out/market_features/SOLUSDT/15m/v002/data.jsonl
    ts_col: ts
    target: regime_label
    features:
    - rolling_log_return_vol
    - log_return
    - log_return_lag_1
    - log_return_lag_2
    - hour_of_day
    - dayofweek
    tail_rows: 60000
    holdout_after: '2026-07-12'
  cv:
    folds: 5
    embargo_rows: 96
    min_train_frac: 0.4
  baseline: lgbm_base
  controls:
  - prior
  candidates:
  - cand
  learners:
    prior:
      kind: prior
    lgbm_base:
      kind: lightgbm
      params:
        n_estimators: 200
        learning_rate: 0.05
        num_leaves: 31
        min_child_samples: 50
    cand:
      kind: sklearn_extratrees
      params:
        n_estimators: 300
        min_samples_leaf: 20
  rule:
    min_folds: 3
    pass_if:
    - group:
      - BTCUSDT
      - ETHUSDT
      - SOLUSDT
      vs: baseline
      window: cv
      op: '>='
      value: 0.005
    - group:
      - BTCUSDT
      - ETHUSDT
      - SOLUSDT
      vs: baseline
      window: holdout
      op: '>='
      value: 0.0
    fail_if_no_candidate_reaches:
    - group: any
      vs: baseline
      window: cv
      op: '>='
      value: 0.0
run:
  command:
  - python3
  - scripts/research/ml_bakeoff.py
  - --unit
  - '{unit}'
  - --out
  - '{out_dir}'
  timeout_minutes: 120
  inputs:
    research_unit: RQ-20261027-b376-01
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
programme: P2
related:
- research/queue/RQ-20261026-90d3-01.yaml
- research/queue/RQ-20261026-a142-01.yaml
- scripts/research/ml_bakeoff.py
last_dispatched_at: '2026-10-27T04:04:31+00:00'
