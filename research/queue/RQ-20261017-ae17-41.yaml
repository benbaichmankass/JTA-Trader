id: RQ-20261017-ae17-41
title: 'Result-store readability: does every landed research/results row parse and carry read_state?'
status: queued
cadence: daily
theme: infra
priority: 1
kind: deterministic
question: >-
  Is every line of every research/results/*/*.jsonl a JSON object with a read_state field? An unreadable row is "we could not look", which the
  SLO reads as red, never as zero results.
why_this_matters: >-
  Theme infra (weight 2) held 0 runnable units on 2026-10-17 and fired 3 of 300 times in 7 d (research-slo theme_share_min_ratio 0.11 vs target
  0.5), while the research pipeline's own failures (a runner without yfinance; a grader that erased hand grades) went unseen for hours. A daily
  self-test is the cheapest standing detector for each. Plumbing only: it says nothing about any strategy or model.
why_not_inferential: 'A deterministic self-test of repo state on the runner: the property either holds or it does not. There is no sampling question
  to power.'
decision_rule:
  id: RULE-RQ20261017ae1741-INFRA-RESULTS-READABLE
  registered_at: '2026-10-17'
  registered_before_run: true
  statistic: verdict.measurement.unreadable_rows from scripts/research/infra_selftest.py --check results_readable
  rule: >-
    PASS IF 0 unreadable rows over >= 1 file. FAIL IF any row is unreadable or lacks read_state (named in measurement.sample). no_data IF no result
    file exists. A producer_failed or no_data record is NOT a verdict: read run-manifest.json, fix the route, re-queue (last_dispatched_at: null);
    the rule is never edited.
  what_it_does_not_do: Measures nothing about any strategy, model or market; edits no config, registry, account or queue unit.
compute: cpu_light
value:
  usd_at_stake_per_month: 100
  confidence: 0.5
  bucket: structural
  basis: 'infrastructure detector: a stand-in figure for the research throughput a silent pipeline fault costs, not a measured P&L'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 1.0
  est_minutes: 5
  basis: Reads only the repo checkout on a GitHub-hosted runner; no network, no secret.
run:
