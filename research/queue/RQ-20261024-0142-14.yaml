question: Over 2020-07-01 .. 2026-10-15 23:59 on trend_donchian_eth_4h, does a break-even floor alone (be-floor-r 1.5 / 2.0 / 2.5 R, declared now) beat the declared
  exit A by >= 0.02 R/trade in >= 4 of 6 folds within the drawdown bar (maxDD <= A x 1.35)?
why_this_matters: Lane AUTHOR-FLOOR-1024 (runnable floor 34 vs 57; live_strategy 3 vs share 11). RQ-20261023-a1f3-06 asks the far-arm break-even floor ALONE on trend_donchian_xrp_4h
  after the bank-plus-floor first test (RQ-20261022-fd06-03) failed; the matrix of exit_lever_ablation tokens by leg (2026-10-24) shows no be-floor-r arm on the leg
  below. The floor is the cheapest lever to produce live, so each live leg gets the same three registered arms. trend_donchian_eth_4h is the highest-weight real-money
  trend leg; its stall decay and measured-move target are declared, a break-even ratchet is not tested.
