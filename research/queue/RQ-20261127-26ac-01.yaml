id: RQ-20261127-26ac-01
title: 'ml_entry COMPACT derivatives state: on the 8 dev folds, do 4 normalised basis/funding columns (F2c), 4 path-shape columns (F5c) or both,
  added to the 20-feature ENTRY recipe, beat a seeded noise placebo of the SAME width, net of the full cost stack?'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: experiment
origin: follow_up
question: On the pooled ENTRY recipe's 8 half-year dev folds (2022-01..2025-09, 60 frozen perps, LOFO tau, fee + slippage + funding), is the
  leave-one-fold-out mean net R per decision higher with F2c (premium z168, funding z21, 8h premium minus funding, 4h premium change) or F5c
  (semivariance ratio, efficiency ratio, ATR distance to the 168h high and low) or both, than with the same recipe plus the same number of
  seeded N(0,1) columns?
why_this_matters: 'The learner levers are spent on dev (c4e2-02 recency INDETERMINATE, c4e2-03 capacity FAIL, 7ab1-02 TabICL FAIL, GRU closed)
  while served v1 loses money (c4e2-01, longs -0.46 R since 11-01). fs01-01 graded each family against the bare baseline, but its own N9
  control (9 noise columns) cost -0.0167 R/decision: against that control F2 read +0.0175 and F5 +0.0202 (POST HOC, 5 families read), and
  c4e2-04 (frozen encoder) read +0.013 vs its placebo. The recipe pays a per-column cost that hides information; this unit removes it two ways
  (fewer, normalised columns; a matched-width placebo as the control) and asks the question fresh, under a multiplicity-adjusted bar.'
practice_precedent: 'M3 (one lever per arm against a same-shape control), M4 (rule registered before the run), M6 (net of the full cost
  stack), M13 (a post-hoc reading motivates a fresh registered test, never a promotion) and T1 (purged + embargoed walk-forward on dev folds
  only) in docs/reference/trading-and-model-practice-principles.md.'
evidence_class:
  holdout: none
  claim: ml_dev_fold_feature_value
power:
  expected_n: 60000
  min_detectable_effect: 0.01
  effect_units: metric
  sd: 1.0
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATE before any run: fs01-01 arms scored 35k-92k LOFO decisions over the 8 dev folds (C/F2 64,719; F/F5 44,577; N9 52,688);
    the materiality bar +0.010 R/decision is the fs01-01 / f8a1-01 bar. The graded statistic is the one-sided t of the 8 per-fold deltas
    (df 7) at the house level (one-sided 0.025, Sidak k = 3: t >= 3.1215; Manager 26a review 2026-11-27 15:25Z). POWER, stated honestly:
    fs01-01 per-fold deltas spread about 0.02-0.05 R, so P(PASS | true effect +0.010) is about 12 / 6 / 3 percent at fold sd 0.02 / 0.03 /
    0.05 (noncentral t, df 7). A real effect of the materiality size most likely reads INDETERMINATE (upper bound above +0.010), not PASS;
    FAIL needs the upper bound below +0.010.'
  feasibility:
    source: none
    accrual_basis: Replays public Binance Vision history through 2025-09-30 only (no later date is downloaded); nothing accrues.
run:
  command:
  - python3
  - scripts/research/ml_entry_v2_run.py
  - ablation_compact
  - '{unit}'
  - '{out_dir}'
  timeout_minutes: 300
  workflow: research-script-run.yml
  inputs:
    research_unit: RQ-20261127-26ac-01
decision_rule:
  id: RULE-RQ20261127-26ac-01-COMPACT-DERIVS
  registered_at: '2026-11-27'
  registered_before_run: true
  baseline: 'per arm, its MATCHED-WIDTH PLACEBO: P2 (F2c, 4 columns) and P5 (F5c, 4 columns) vs N4 (recipe + 4 seeded N(0,1) columns); P25
    (8 columns) vs N8. Baseline A (20 features) and A2 (A, second LightGBM seed) are reported, never graded.'
  statistic: 'ml_entry_v2.combine_placebo: per arm, the pooled LOFO mean net R per decision minus its placebo''s; the 8 per-fold deltas (each
    fold at its own LOFO tau, as fs01-01); folds with delta > 0; the one-sided t of the 8 per-fold deltas; the per-calendar-year mean delta
    (2022..2025); the arm''s dev coverage. Columns, placebo seed (20261127 + width), arms and dev window are fixed now.'
  rule: 'An arm PASSES iff pooled delta vs its placebo >= +0.010 R/decision AND delta > 0 in >= 6 of 8 folds AND the per-fold t >= 3.1215
    (one-sided Sidak family bar, k = 3, alpha 0.025, df 7) AND the yearly mean delta is positive in >= 3 of 4 years AND its columns are present
    on >= 40 percent of dev rows. An arm FAILS iff mean(fold deltas) + 3.1215 x se(fold deltas) < +0.010 (the effect is excluded at the bar).
    INDETERMINATE otherwise, and whenever coverage < 40 percent or fewer than 8 folds carry both means. Unit verdict: pass if any arm passes
    (the largest pooled delta is named), fail if all three fail, indeterminate otherwise. No threshold, column or seed changes after any
    result.'
  pass_action: 'ONE confirming read of the best arm on disjoint out-of-time data (2025-10-01 onward, holdout_lock claimed, the deflated ENTRY
    bar), registered in its own unit before it runs; a pass there makes those columns an input of the next ml_entry_retrain challenger, a
    data-backed Tier-3 replacement packet applied by the manager or a mandate, never by a lane.'
  fail_action: Close compact basis/funding and path-shape state as crypto ENTRY inputs on research/levers/ml-entry.yaml; the next class in
    the plan (crypto implied volatility, Deribit DVOL) is authored as its own unit. No re-run with other columns, widths or seeds.
  proposal_mapping: pass -> confirming out-of-time read -> Tier-3 packet; fail -> class closed, next class authored; indeterminate -> report the
    realised per-fold se and coverage, stop.
  what_it_does_not_do: Promotes nothing; reads no sealed or held-out window (dev folds only, no date after 2025-09-30 is downloaded); serves
    nothing; changes no config, served model or order path; sizes nothing; adds no gate. One compact definition per family; a FAIL does not
    refute basis/funding information under a different representation.
  min_n: 1000 dev decisions per arm
