  usd_at_stake_per_month: 300
  confidence: 0.15
  basis: 'stand-in: ml_entry trades real money on bybit_2 + bybit_portfolio and is losing (c4e2-01); two independent placebo-relative
    near-misses (fs01-01 vs N9, c4e2-04 vs its placebo) point at this mechanism. Not a P&L measurement.'
