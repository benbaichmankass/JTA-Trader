# AUTHORED by scripts/research/queue_grade.py: the one confirmation of RQ-20261106-029's PASS
# (RESEARCH-CONFIRM-FRESH-WINDOW). Self-lands only while `queue_grade.py --verify` reproduces it.
id: RQ-20261107-40a6-01
title: 'Fresh-window confirmation of RQ-20261106-029: Walk-forward lever sweep of trend_donchian_eth_prop:
  next lever exit (generated, weekly)'
status: blocked
cadence: once
kind: experiment
theme: live_strategy
priority: 3
roadmap:
- L-LADDER
practice_precedent: 'M2, M4 (docs/reference/trading-and-model-practice-principles.md): walk-forward on
  fresh data against a rule registered before the run; one-factor sensitivity before combinations'
question: 'CONFIRMATION of RQ-20261106-029''s PASS on a window it did not see (data after 2026-11-06T23:54:59+00:00),
  under the SAME registered rule: Does trend_donchian_eth_prop (ETHUSDT 1h, trend harness) still show
  net-of-cost OOS edge on freshly fetched candles at its configured settings (control arm A) -- and how
  does the next lever family on the lever map, exit, move that edge when stepped one factor at a time
  (arms: see run.command / iteration.design)?'
why_this_matters: A live leg's evidence record is a photograph; the roster trades the film. A weekly re-run
  keeps the control honest AND measures one more lever of the leg per unit, so the lever map -- not a
  pass/fail on one configuration -- is what the research learns.
power:
  expected_n: 50
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d=0.45 -> 39 trades at alpha 0.05 / power 0.8 (the E35 floor) for the CONTROL reading. Each variant
    is graded against the control on the same trades (paired), with a 3-of-4 calendar-fold consistency
    bar and a materiality bar of 4.0 R over the window; the number of variants is counted in iteration.multiple_testing
    and a best-of-k pass is a LEAD, never a finding.
  feasibility:
    source: none
    accrual_basis: Free-lane candle fetch (binance_vision / yfinance); Bybit-hosted symbols may land producer_failed
      on a GitHub runner (known geoblock), which is recorded honestly rather than retried.
decision_rule:
  id: RULE-TPL-ROSTER-WALKFORWARD-LEVER-SWEEP
  statistic: 'exit_lever_ablation.py --grade sweep: per variant, delta net R vs the control A, delta maxDD,
    and the number of 4 calendar folds in which it beats A, all net of the full cost stack (execution_costs.resolve_cost_policy);
    the control''s own n, net R and fold signs are reported in verdict.json (the standing walk-forward
    reading).'
  rule: PASS (a LEAD for a Tier-3 setting proposal after a holdout read, never applied here) IF some variant
    beats A by >= 4.0 R, with maxDD no worse and >= 3 of 4 folds, at A's n >= 39. FAIL IF none does at
    n >= 39 (these settings are not better than the configured ones; the lever FAMILY stays open until
    its map is flat/noisy at adequate power). indeterminate IF A's n < 39 or the producer failed. The
    control A net R <= 0 at n >= 39 on two consecutive units is a Gate-2 demotion INPUT (never a demotion
    by this unit). The result is appended to the leg's lever map either way.
  registered_at: '2026-11-06'
  registered_before_run: true
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 60
  basis: one leg, <= 5 arms (control + 2 keys x low/high) through the committed-record argv builder on
    a GitHub runner.
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
design: structured
levers_declared:
- exit
iteration:
  subject: trend_donchian_eth_prop
  subject_kind: strategy_leg
  from_result: comms/strategy_evidence/trend_donchian_eth_prop.json
  verdict_read: fail
  diagnosis: 'trend_donchian_eth_prop: baseline net R -0.2512 on n 165; attribution read: cost erases
    a gross edge; lever map reads 4 of 9 lever families tested. exit has a noisy / single-point / unread
    response on [''tp_retarget_stall_bars'', ''trail_level'', ''trail_mult''] -- a finer sweep, not a
    verdict.'
  hypothesis: the chosen lever family moves the leg's net-of-cost OOS R monotonically and fold-stably;
    a flat or spiky response is recorded in the lever map as evidence of no edge / overfit, not discarded
  attempt: 1
  due_by: '2026-11-20'
  design:
    control: A (the subject as configured)
    kind: one-factor sweep around the control
    levers:
      trend_donchian_eth_prop: exit
    lever_basis:
      trend_donchian_eth_prop: unresolved_shape
    why_this_lever:
      trend_donchian_eth_prop: exit has a noisy / single-point / unread response on ['tp_retarget_stall_bars',
        'trail_level', 'trail_mult'] -- a finer sweep, not a verdict
    map_entries:
      trend_donchian_eth_prop:
      - 'exit.tp_retarget_stall_bars: single_point'
      - 'exit.trail_level: noisy'
      - 'exit.trail_mult: single_point'
    arms:
      trend_donchian_eth_prop:
      - - A
        - ''
      - - atr_stop_mult_lo
        - atr_stop_mult=1.875
      - - atr_stop_mult_hi
        - atr_stop_mult=3.125
      - - tp_r_lo
        - tp_r=4.5
      - - tp_r_hi
        - tp_r=7.5
  multiple_testing:
    arms_counted: 5
    variants_vs_control: 4
    correction: Holm
    note: every variant is fixed before the run; a best-of-k pass is a LEAD that needs a holdout read,
      never a finding
run:
  workflow: research-script-run.yml
  timeout_minutes: 120
  command:
  - python3
  - scripts/research/exit_lever_ablation.py
  - --leg
  - trend_donchian_eth_prop
  - --arm
  - A=
  - --arm
  - atr_stop_mult_lo=atr_stop_mult=1.875
  - --arm
  - atr_stop_mult_hi=atr_stop_mult=3.125
  - --arm
  - tp_r_lo=tp_r=4.5
  - --arm
  - tp_r_hi=tp_r=7.5
  - --days
  - '1830'
  - --grade
  - sweep
  - --baseline
  - A
  - --delta-r
  - '4.0'
  - --folds
  - '4'
  - --fold-majority
  - '3'
  - --n-floor
  - '39'
  - --out
  - '{out_dir}'
  inputs:
    research_unit: RQ-20261107-40a6-01
