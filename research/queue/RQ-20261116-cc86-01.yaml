id: RQ-20261116-cc86-01
title: 'Beagle-1 CHALLENGER (EV-thresholded reduce) vs the LIVE baseline (shipped overlay_td.json, bottom-20% reduce): does
  cutting only entries with negative predicted net R beat the live baseline on the same TD trades, cost stack and holdouts?'
status: done
cadence: once
roadmap:
- L-ML-LIVE
theme: ml_health
priority: 1
kind: experiment
question: 'Beagle-1, the live baseline, halves the bottom 20% of entries by score (tau = training q0.2). Diagnosis (RQ-20261029-5785-05,
  spot holdout 2017-09..2019-11, n 424): the trades it halves still average +0.21 R against +0.31 for take-all, so it cuts
  profitable trades. CHALLENGER: the same logistic features and C, refit on the same 2020-07..2026-10 main-window pool, but
  it reduces only where the predicted win probability is below the training breakeven p* = L/(W+L) (W the mean winning and
  L the mean losing net R, net of the full cost stack), i.e. only entries whose predicted net R is negative. The baseline
  is scored byte for byte from the committed artifact (sha256 26a55f1ab05044f117395378f755da33ee8ce2a46200b9f08979fbed72e3bb2b).
  Paired on the same holdout trades: does the challenger earn more R per trade than the live baseline?'
why_this_matters: 'Beagle-1 resizes real-money TD entries (bybit_2, bybit_portfolio). It stays live as the baseline (operator
  2026-11-16). A challenger that keeps the profitable below-tau trades at full size is the cheapest lever aimed at its measured
  weakness: one parameter-free threshold rule, no new features and no grid, so there is no selection to deflate beyond the
  re-read. It swaps in ONLY on a win; otherwise it is an iteration input and Beagle-1 keeps trading.'
power:
  expected_n: 530
  min_detectable_effect: 0.036
  effect_units: r_per_trade
  sd: 0.29
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'n: spot 2017-09..2020-06 = 424 MEASURED (5785-05) + ~105 over 2019-12..2020-06 (ESTIMATE from the perp count); perp
    2019-12..2020-06 n 105 MEASURED (5785-02). The paired delta d = (m_ch - m_base) x net_R is non-zero only where the two
    arms disagree; at a disagreement rate of ~15% with |0.5 x R| ~ 0.75 on those, sd(d) ~ sqrt(0.15) x 0.75 ~ 0.29 (an ESTIMATE).
    se ~ 0.29/sqrt(530) ~ 0.0126. power.alpha is the calculator''s two-sided 0.05 (it accepts 0.10/0.05/0.01); at n 530, power
    0.8 that detects d ~0.12, i.e. ~+0.036 R/trade. The decision bar itself is stricter and lives in the rule: the deflated
    one-sided LB at alpha 0.05/3 (z ~2.13; both windows have now been read twice, so this is the third read under M13), which
    a true paired gain of about +0.027 R/trade clears at the point estimate and ~+0.036 clears with power 0.8. Below that
    it is an iteration input, never a demotion.'
  feasibility:
    source: none
    accrual_basis: Replays pinned history on freshly fetched public candles; nothing accrues.
decision_rule:
  id: RULE-RQ20261116-cc86-01-BEAGLE1-CHALLENGER-EV
  registered_at: '2026-11-16'
  registered_before_run: true
  statistic: 'scripts/research/ml_overlay_noninferior.py, TD family as in 5785-05, with --holdout-artifact ml/overlay/overlay_td.json
    (the baseline, scored without refit; the record carries its sha256) and --holdout-challenger ev (the challenger, fit on
    the same main-window pool). Two holdouts: A = Binance SPOT 2017-09-01..2020-06-23 (--holdout-market spot; written to {out_dir}),
    B = Binance USD-M PERP 2019-12-01..2020-06-23 (written to {out_dir}/perp). Per holdout, the TD record''s `challenger`
    block gives the paired delta d = (m_ch - m_base) x net_R: mean, month-block one-sided LB at alpha 0.05 and at alpha 0.05/3
    (delta_ch_vs_base_lb_deflated_r), the maxDD and CVaR5 of each arm, the disagreement rate and each arm''s delta vs take-all.
    Full cost stack as in V2. Hand-graded from measurement.json: the top-level verdict.json token is the harness''s V2 non-inferiority
    read, not this rule.'
  rule: 'CHALLENGER WINS iff all hold: (1) on holdout A, n >= 300 and delta_ch_vs_base_lb_deflated_r > 0; (2) on holdout B,
    delta_ch_vs_base_mean_r >= 0 (direction agrees on the perp the legs trade; n ~105 is too small for its own LB); (3) on
    A, maxdd_ch_r <= 1.10 x maxdd_base_r and cvar5_ch_r >= cvar5_base_r - 0.05; (4) the baseline sha256 matches the one registered
    above. NOT A WIN otherwise; INDETERMINATE iff A has n < 300 or (4) fails. ROUTING: WIN -> a data-backed Tier-3 SWAP proposal
    to the manager: export the EV-threshold artifact as overlay_td v2 and replace Beagle-1 on the same legs and modes; the
    operator is asked only about this swap. NOT A WIN -> an ITERATION INPUT (diagnosis: where the arms disagree and why);
    Beagle-1 keeps trading unchanged and the next challenger is authored from it. Nothing in this unit can demote or reduce
    the live baseline.'
  what_it_does_not_do: Changes no config or artifact; it proposes and never applies. It does not re-grade 5785-02 or 5785-05
    and is not a demotion test of Beagle-1. Holdout A is a labelled spot proxy; B is the perp but small.
intervention_controls:
  not_applicable: an entry-size meta-label, not an in-trade action; the matched random control is check (c) and the take-all
    baseline is the hold-equivalent.
