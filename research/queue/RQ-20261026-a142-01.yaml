id: RQ-20261026-a142-01
title: 'Regime head: does a REGULARISED sklearn MLP (one 16-unit layer, alpha 0.1) beat the shipped-shape LightGBM on logloss on the 15m published shards, after the default-shape MLP missed (RQ-20261026-90d3-01)?'
status: queued
cadence: once
roadmap:
- M23
theme: ml_health
priority: 2
kind: experiment
question: 'RQ-20261026-90d3-01 (default MLP, hidden (32,16), alpha 1e-3) did not reach the bar: CV logloss delta vs lgbm_base was worse on ETH (-0.021) and SOL (-0.006) in its later run, and BTC flipped
  sign between its two runs (-0.0415 then +0.0031, ETH identical to 15 digits, so the BTC shard moved between runs). Does a smaller, more strongly regularised MLP (hidden (16,), alpha 0.1, same seed and
  early stopping) lower the 3-class regime_label logloss vs lgbm_base by >= 0.005 on the CV mean on ALL THREE of BTC/ETH/SOL 15m and by >= 0 on the holdout after 2026-07-12? Same rows, folds and features
  as 90d3-01.'
why_this_matters: 'First test failed -> variant queued (operator 2026-10-22): the 90d3-01 MLP was an unregularised default-shape net on ~60000 noisy 15m rows; the diagnosis is capacity/overfit, which this
  unit tests with ONE pre-registered regularisation step, not a grid. Model-family diversity is a roadmap target (78 % GBDT on 2026-10-11). Pairs with 90d3-01 on the same shards; shard drift between runs
  is filed as pipeline item, so this unit also reads a fresh shard state. Trial count for the MLP family on this cell: 2 (90d3-01 and this).'
power:
  expected_n: 36000
  min_detectable_effect: 0.1
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: Unit = OOS row per symbol. tail_rows leaves an ESTIMATED 24,000-36,000 OOS rows per symbol over 5 folds until the first run replaces it with the measured n. d=0.1 needs ~785 rows so rows are not
    the limit; bars are autocorrelated, so the rule also requires fold-mean deltas (min_folds 3) on all three symbols.
  feasibility:
    source: none
    accrual_basis: Fixed published shard; nothing accrues.
decision_rule:
  id: RULE-RQ20261026A14201-REGMLP
  statistic: 'Paired per-fold logloss difference on identical purged folds (5, embargo 96) and on the holdout (rows after 2026-07-12), per symbol: lgbm_base minus the candidate (positive = candidate better);
    mean over folds. Reported, not graded: every arm minus the class prior.'
  rule: 'PASS IF candidate improves logloss by >= 0.005 on the CV mean on ALL THREE symbols AND >= 0 on the holdout on all three: a regularised MLP adds information over the shipped-shape head (a disjoint-window
    confirmation follows before any manifest note; trial count 2). FAIL IF the candidate is worse than lgbm_base on the CV mean on EVERY symbol (record the exact configuration in the plan family history;
    the family stays open for other configurations). INDETERMINATE otherwise, or if folds < 3 or an arm is unavailable.'
  min_n: 3 usable CV folds per symbol; holdout >= 200 rows per symbol.
  what_it_does_not_do: Trains nothing that serves; touches no config, registry, roster or order path; compares unweighted arms on the shared features, not shipped models. A learner-family result is not
    edge and is not a P&L claim.
  registered_before_run: true
  registered_at: '2026-10-26'
compute: auto
value:
  bucket: ai_trader
  usd_at_stake_per_month: 50
  confidence: 0.2
  basis: planning weight for the regime-head quality and model-diversity line (02 Q1.3 / Q4), not a measured P&L
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  published_data: metis-market-data
  peak_memory_gb: 4.0
  est_minutes: 40
  basis: 'Estimate, NOT measured: 3 shards x 2-3 arms x 5 folds, comparable to RQ-20261025-008 (30 min at 40,000 tail rows); re-declare from the first run.'
ml_bakeoff:
  task: classification
  metric: logloss
  dataset:
    kind: jsonl
    groups:
      BTCUSDT:
        path: datasets-out/market_features/BTCUSDT/15m/v002/data.jsonl
      ETHUSDT:
        path: datasets-out/market_features/ETHUSDT/15m/v002/data.jsonl
      SOLUSDT:
        path: datasets-out/market_features/SOLUSDT/15m/v002/data.jsonl
    ts_col: ts
    target: regime_label
    features:
    - rolling_log_return_vol
    - log_return
    - log_return_lag_1
    - log_return_lag_2
    - hour_of_day
    - dayofweek
    tail_rows: 60000
    holdout_after: '2026-07-12'
  cv:
    folds: 5
    embargo_rows: 96
    min_train_frac: 0.4
  baseline: lgbm_base
  controls:
  - prior
  candidates:
  - cand
  learners:
    prior:
      kind: prior
    lgbm_base:
      kind: lightgbm
      params:
        n_estimators: 200
        learning_rate: 0.05
        num_leaves: 31
        min_child_samples: 50
    cand:
      kind: sklearn_mlp
      params:
        hidden_layer_sizes:
        - 16
        alpha: 0.1
  rule:
    min_folds: 3
    pass_if:
    - group:
      - BTCUSDT
      - ETHUSDT
      - SOLUSDT
      vs: baseline
      window: cv
      op: '>='
      value: 0.005
    - group:
      - BTCUSDT
      - ETHUSDT
      - SOLUSDT
      vs: baseline
      window: holdout
      op: '>='
      value: 0.0
    fail_if_no_candidate_reaches:
    - group: any
      vs: baseline
      window: cv
      op: '>='
      value: 0.0
run:
  command:
  - python3
  - scripts/research/ml_bakeoff.py
  - --unit
  - '{unit}'
  - --out
  - '{out_dir}'
  timeout_minutes: 120
  inputs:
    research_unit: RQ-20261026-a142-01
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
programme: P2
related:
- research/queue/RQ-20261026-90d3-01.yaml
- scripts/research/ml_bakeoff.py
last_dispatched_at: '2026-10-26T22:56:51+00:00'
