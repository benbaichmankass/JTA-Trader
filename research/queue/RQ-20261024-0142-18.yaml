question: 'Value coverage: do at least 90 % of queued authored units carry a value block with usd_at_stake_per_month?'
why_this_matters: 'Lane AUTHOR-FLOOR-1024: research SLO in breach on runnable_floor, authoring_supply_ratio_7d and theme_share_min_ratio on 2026-10-24; the existing
  infra units (ae17-40..45, 3a84-12/-13) detect plumbing and supply, not unit QUALITY. This puts one more cause on the queue as a daily detector instead of a once-a-week
