id: RQ-20261023-a1f3-15
title: 'Range-vol lift for the BTC and ETH 1h regime head scored on LOG-LOSS (first test failed -> variant): does lgbm_yz beat lgbm_base on log-loss, not just macro-F1?'
status: done
cadence: once
theme: ml_health
priority: 2
kind: experiment
question: On BTCUSDT and ETHUSDT 1h v002 shards, regime_label, does lgbm_yz (base + four range-vol estimators) beat lgbm_base by >= 0.003 nats of log-loss on the
  CV mean on BOTH symbols with the same sign on the post-2026-07-12 holdout?
why_this_matters: 'Operator directive 2026-10-22: an idea that failed one test is not dead; it failed the first test. This unit is a registered VARIANT. Lane AUTHOR-FLOOR-1023
  (research runnable floor 40 vs 57 at 09:14Z). First test(s): RQ-20261022-3a84-09 (range-vol lift, BTC 1h, macro-F1) graded FAIL; 3a84-10 (ETH 1h) was indeterminate;
  3a84-11 (SOL 1h) PASSED. Diagnosis (one line): macro-F1 over three regime classes is a coarse, thresholded score that can hide a probability-quality gain; the 1h
  regime head''s PASS evidence is on LOG-LOSS (65cc-10, 4591-01), so the same feature block was never scored on the metric the head is judged by'
power:
  expected_n: 20000
  min_detectable_effect: 0.1
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'Row floor: d=0.1 paired needs ~785 rows; rows are autocorrelated so effective n is lower. expected_n is an ESTIMATE from tail_rows x folds, not a measurement;
    below the fold floor the unit grades indeterminate, never FAIL.'
  feasibility:
    source: none
    accrual_basis: 'Fixed by construction (tail_rows of a nightly-rebuilt shard): n does not grow with waiting, so an underpowered result is reported as such and
      the follow-up is a larger or different dataset, not a re-run.'
decision_rule:
  id: RULE-RQ20261023-A1F3-15-REGIME-1H-YZ-LOGLOSS
  registered_at: '2026-10-23'
  registered_before_run: true
  statistic: Paired purged-CV log-loss difference (lgbm_base minus lgbm_yz, positive = yz better) on identical rows, and the same on the holdout, per symbol.
  rule: PASS IF lgbm_yz beats lgbm_base by >= +0.003 nats (CV mean) on BOTH symbols AND > 0 on the holdout on both. FAIL IF lgbm_yz does not reach >= +0.001 vs lgbm_base
    (CV mean) on ANY symbol. INDETERMINATE otherwise, or if folds < 3, the holdout has < 20 rows, or an arm is unavailable. A PASS is not a promotion.
  min_n: 3 usable CV folds per symbol; reported n_rows per symbol.
  what_it_does_not_do: Builds, calibrates and serves nothing, promotes nothing, touches no config; a score PASS is not edge and not a P&L figure.
compute: auto
value:
  usd_at_stake_per_month: 100
  confidence: 0.2
  bucket: ai_trader
  basis: 'stand-in: gates whether a downstream ML lever is worth building; not a measured P&L'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  published_data: metis-market-data
  peak_memory_gb: 3.0
  est_minutes: 20
  basis: 'Estimate, NOT measured: CPU-capable bake-off on the published 1h v002 shards the 4591 units read; compute: auto routes it to the Kaggle CPU kernel (published
    data; idle backend per the 09:14Z health line).'
ml_bakeoff:
  task: classification
  metric: logloss
  higher_is_better: false
  dataset:
    kind: jsonl
    groups:
      BTCUSDT_1h:
        path: datasets-out/market_features/BTCUSDT/1h/v002/data.jsonl
      ETHUSDT_1h:
        path: datasets-out/market_features/ETHUSDT/1h/v002/data.jsonl
    ts_col: ts
    target: regime_label
    features:
    - rolling_log_return_vol
    - log_return
    - log_return_lag_1
    - log_return_lag_2
    - hour_of_day
    - dayofweek
    tail_rows: 40000
    holdout_after: '2026-07-12'
    extra_columns:
    - parkinson_vol
    - garman_klass_vol
    - rogers_satchell_vol
    - yang_zhang_vol
  cv:
    folds: 5
    embargo_rows: 96
    min_train_frac: 0.4
  baseline: lgbm_base
  controls:
  - prior
  candidates:
  - lgbm_yz
  learners:
    prior:
      kind: prior
    lgbm_base:
      kind: lightgbm
      params: &id001
        learning_rate: 0.05
        min_child_samples: 50
        n_estimators: 200
        num_leaves: 31
    lgbm_yz:
      kind: lightgbm
      params: *id001
      feature_blocks:
      - kind: df_columns
        columns:
        - parkinson_vol
        - garman_klass_vol
        - rogers_satchell_vol
        - yang_zhang_vol
  rule:
    min_folds: 3
    pass_if:
    - group:
      - BTCUSDT_1h
      - ETHUSDT_1h
      vs: baseline
      window: cv
      op: '>='
      value: 0.003
    - group:
      - BTCUSDT_1h
      - ETHUSDT_1h
      vs: baseline
      window: holdout
      op: '>'
      value: 0.0
    fail_if_no_candidate_reaches:
    - group: any
      vs: baseline
      window: cv
      op: '>='
      value: 0.001
run:
  command:
  - python3
  - scripts/research/ml_bakeoff.py
  - --unit
  - '{unit}'
  - --out
  - '{out_dir}'
  timeout_minutes: 60
  inputs:
    research_unit: RQ-20261023-a1f3-15
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
roadmap:
- M25
