# Gates this adds or changes: none.
id: RQ-20261117-dc44-05
title: 'fvg_range_15m FIDELITY: every replay so far ran the harness''s MIDLINE target while the live strategy targets the
  OPPOSITE boundary. What does the leg earn as it actually trades (far target), and does far beat the midline, net of the full cost
  stack, 1830 d?'
status: done
cadence: once
kind: experiment
theme: live_strategy
priority: 2
roadmap:
- L-LADDER
practice_precedent: 'M2, M4 (docs/reference/trading-and-model-practice-principles.md): walk-forward on fresh data against a rule registered before the run; one-factor
  sensitivity before combinations'
question: 'On the 1830-day window, net of the full cost stack: (1) what are n, net R, maxDD and fold signs of fvg_range_15m with the
  live opposite-boundary target (the first faithful Stage-0 reading of this leg); (2) does that arm beat the midline-target arm that
  d5a7-11/-12 used as control (+4.0 R, maxDD no worse, 3 of 4 folds)?'
why_this_matters: 'fvg_range_15m is a testing leg (bybit_1). Its control read -13.84 R at n 45 in d5a7-11/-12, and both lever
  sweeps failed on that control. If the control was the wrong strategy, those FAILs grade a configuration the leg never trades, and
  the leg is neither lever-exhausted nor diagnosed. This unit replaces the unfaithful reading. PASS: the far target is the leg''s
  real Stage-0 base, and the exit and regime_gating sweeps are re-run on it (the d5a7-12 adx_max 15 arm, +5.33 R at n 14, is the
  first lead to re-check). FAIL: the far target does not rescue it either; the leg is then read on its faithful control, and if
  flat, the entry family (min_touches / third_frac) is next. Arm denominator 2.'
power:
  expected_n: 45
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'd=0.45 -> 39 trades at alpha 0.05 / power 0.8 (the E35 floor). The midline control had n 45 over 1830 days in
    d5a7-11. The far target changes exits, not entries, except where the degenerate-target guard skips a signal, so n should stay
    near 45, just above the floor. A near-miss is underpowered by construction on this single-symbol window, and the result
    says so.'
  feasibility:
    source: none
    accrual_basis: Fixed in-hand 1830-day window; nothing accrues.
evidence_class:
  holdout: in_sample
  claim: edge
decision_rule:
  id: RULE-RQ20261117-dc44-05-FVG-FAR-TARGET
  statistic: 'exit_lever_ablation.py --grade sweep: per variant, delta net R vs the control A, delta maxDD, and the number of 4 calendar folds in which it beats A,
    all net of the full cost stack (execution_costs.resolve_cost_policy); the control''s own n, net R and fold signs are reported in verdict.json (the standing walk-forward
    reading).'
  rule: 'Baseline = arm mid (--exit-style mid, the harness default every earlier replay used). PASS (a LEAD for a holdout read,
    never a setting change here) IF arm A (config-exact with the live far target, the builder pin of FVG-EXIT-STYLE-FIDELITY)
    beats mid by >= 4.0 R with maxDD no worse and >= 3 of 4 folds, at n >= 39 for both arms; and A is net positive in >= 3 of 4
    calendar years, with no single year > 50% of total net, and the per-year and per-direction table reported. FAIL IF A does
    not clear that bar at n >= 39. INDETERMINATE IF either arm has n < 39, the producer failed, or arm A''s argv does not carry
    --exit-style far (fidelity). A''s own n, net R, maxDD and fold signs are reported in every case: that is the leg''s first
    faithful reading. Arm denominator = 2.'
  registered_at: '2026-11-17'
  registered_before_run: true
  what_it_does_not_do: Changes no config, roster, risk or order path; a PASS is a lead for a pre-registered holdout read then a Tier-3 proposal, not a promotion case.
  baseline: control arm A = the leg config-exact, same run.
