iteration:
  subject: fvg_range_15m
  subject_kind: strategy_leg
  from_result: RQ-20261116-d5a7-11
  verdict_read: fail
  diagnosis: 'Read from the committed control trades of d5a7-11 (run 44066996242, arm A, n 45, 2021-11..2026-11): gross -2.21 R,
    net -13.84 R, so cost (0.258 R per trade, 11.6 R in all) is 84% of the loss. 23 targets averaged +0.81 R gross (+0.54 net)
    against 21 stops at -1.25 R net; median MFE 0.30 R; only 4.4% of trades reached 1 R. tp_basis is unit_tp on all 45. The
    target sits about 0.8 R away, so the trade cannot clear a 0.26 R cost. That is the "tight-target / fee trap" the live strategy
    docstring says the far-boundary target was chosen to avoid (src/units/strategies/fvg_range_15m.py: tp = R for a long, tp = S
    for a short). The replay did not use that target. regime_debt_matrix.py''s fvg_range branch forwards exit_style only if the
    config declares it, the live config does not, and backtest_fvg_range.py defaults to --exit-style mid. Every replay (both d5a7
    sweeps, their controls and arms) therefore measured a midline-target strategy and still declared itself faithful. Fixed in
    the same PR (FVG-EXIT-STYLE-FIDELITY: the builder pins --exit-style far when the config is silent, with a regression test).'
  search: 'exit family, fidelity first: the live far target (arm A) vs the midline the earlier replays ran (arm mid); one factor'
  levers:
  - exit
  map_entries:
  - research/levers/fvg_range_15m.yaml
