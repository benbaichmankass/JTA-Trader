question: 'Is trend_donchian_sol net-positive across a long multi-window walk-forward (1095d, 6 contiguous time folds) of its live config at the full cost stack (fee 11.0 bps round trip + venue slippage + funding), or was its 365d D1 pass a single-window artifact?'
why_this_matters: 'COST-STACK-RECOST-SWEEP (PR #20966, 2026-10-28) re-baselined the Bybit-linear evidence records at 11.0 bps and the 365d window rolled 4-5 weeks. net_r_oos +4.46 -> -2.88 (n 59 -> 58); -1.93 at 7.5 bps on the SAME new window, and fee alone leaves the old window at +3.51. The sign flip is window drift. The leg trades only on bybit_1 (Stage-1 demo floor), so nothing is removed or demoted either way; the question is whether it is eligible for Stage-2 and whether one 365d window tells us anything. Operator approved the walk-forward 2026-10-28 ("Merge; walk-forward the 4 drift flips").'
