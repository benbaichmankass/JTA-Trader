  expected_n: 174
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'd=0.3 needs ~88 observations at alpha 0.05 / power 0.8 (the floor RQ-20260928-011/-012 registered). expected_n=174 is ~3x the leg''s committed 365d trade count (an estimate, not measured). Below 88 the unit grades UNDERPOWERED, never FAIL.'
  feasibility:
