id: RQ-20261118-04a5-02
title: 'D6 distributional TP head: on the SAME frozen Foxhound-1 held-out decisions, does a per-decision TP at the predicted 60th
  percentile of forward MFE (LightGBM quantile, SL 2 ATR unchanged) beat the live fixed 3 ATR TP by +0.02 R/decision, paired, net of
  each symbol''s own cost stack?'
status: done
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
programme: P2
kind: experiment
iteration:
  subject: ml-brackets
  subject_kind: ml_model
  from_result: RQ-20261117-c21d-02
  verdict_read: fail
  diagnosis: 'Every D6 arm so far is a FIXED or cell-chosen TP. Pointer v0 (RQ-20261114-82fd-01 / RQ-20261115-a474-01) and
    bracket-by-cell (RQ-20261116-089f-03) FAILED: they move ~11.5k trades for a delta near 0. c21d-02 (static TP 4 ATR on the frozen
    Foxhound-1 held-out decisions, per-symbol cost) FAILED: pooled mean net R -0.0585 (se 0.0110), n 12,088 on 51 symbols. c692-02''s
    learned per-decision bracket regressed net R over a 24-cell grid and its argmax tracked the best static cell. None of them predicted
    WHERE THE MOVE RUNS OUT on each decision. A quantile model of forward MFE-before-stop gives the TP as a direct, calibratable
    prediction (TP doctrine: the TP is a prediction), which is a different information path from regressing net R per cell.'
  search: 'lever family bracket, mechanism: TP 3 ATR fixed -> TP = clip(q0.60 MFE-before-stop prediction, 1, 6) ATR per decision;
    SL 2 ATR, decisions, tau, horizon and cost stack fixed; q fixed at 0.60 before the run (no q search)'
  levers:
  - bracket
  map_entries:
  - research/levers/ml-brackets.yaml
  attempt: 3
  due_by: '2026-11-22'
question: 'Holding the frozen Foxhound-1 decisions fixed (tau 0.10), relabel each taken decision with TP at the LightGBM q=0.60
  quantile of its forward MFE-before-stop (fit on rows whose label ends before the held-out window, embargo 25 h), SL 2 ATR unchanged.
  Is the paired per-decision net R difference vs the same decision at TP 3 ATR >= +0.02 R with a CI lower bound > 0?'
why_this_matters: 'D6 has no live model; ml_entry rests a fixed 3 ATR TP. A pass is the first learned TP that pays on the held-out
  year and the evidence for a data-backed Tier-3 bracket proposal for ml_entry; a fail closes the quantile-TP mechanism on this entry
  model and leaves D6 waiting for a positive-net entry model (D3).'
power:
  expected_n: 12000
  min_detectable_effect: 0.02
  effect_units: R_per_decision
  sd: 0.5
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATE: same decisions as 2e3b-01 / c21d-02 (n 12,746 / 12,088). sd of the PAIRED difference is unmeasured; a TP change
    alters only the trades whose path crosses one TP and not the other, so it is well below the per-trade sd (~0.9 R). At sd 0.5 and n
    12,000 the z 1.96 half-width is ~0.009 R, so +0.02 is resolvable; if the paired sd is ~0.9 the half-width is ~0.016 R and a
    +0.02 mean is still a PASS only with CI lower > 0.'
  feasibility:
    source: none
    accrual_basis: Replays public Binance Vision klines + fundingRate; nothing accrues.
evidence_class:
  holdout: holdout_window
  claim: edge
ml_consumer:
