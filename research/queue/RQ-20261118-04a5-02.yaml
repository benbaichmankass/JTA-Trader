decision_rule:
  id: RULE-RQ20261118-04a5-02-QUANTILE-MFE-TP
  registered_at: '2026-11-18'
  registered_before_run: true
  baseline: the same taken decisions at the fixed 3 ATR TP (2e3b-01 harness)
  statistic: 'scripts/research/ml_entry_population_test.py run --tp-model quantile --tp-q 0.60: the 2e3b-01 population, window
    2025-10-01..2026-10-31, frozen boosters, tau from model.json. Per side, a LightGBM quantile regressor (alpha 0.60, LGB_PARAMS,
    label = MFE-before-stop in ATR over 24 h winsorised at 10, features = the frozen ENTRY features) fit on rows whose 24 h label ends
    before 2025-10-01 (embargo HORIZON_H + 1 = 25 h). Each window decision is relabelled through ml_decision_entry.label_symbol with
    TP = clip(prediction, 1, 6) ATR (same first passage, tie to SL, gap fill) and re-costed per symbol. d = net R (quantile TP) - net
    R (TP 3) on each decision TAKEN by the TP-3 policy; mean, se (one decision = one cluster), CI at z 1.96. Reported: TP reach rate
    both arms, predicted-TP quantiles, calibration (share of window rows with realised MFE >= predicted q, target 0.40), the arm''s
    own sequential-policy summary (context, never gating). Read claimed in the holdout ledger before any summary.'
  rule: 'PASS iff paired n >= 300 (harness N_MIN) AND mean d >= +0.02 R/decision AND CI lower bound > 0. FAIL iff n >= 300 AND CI upper
    bound < +0.02. INDETERMINATE otherwise. q (0.60), clip [1, 6] ATR, MFE cap, embargo, window and features are fixed now, never
    changed after any result.'
  pass_action: 'A fresh-window confirmation unit first (the first months after 2026-10-31 at the same rule), then a data-backed Tier-3
    proposal: ml_entry TP placed by the quantile head at entry (a TP-doctrine record: tp_intent = predicted q0.60 MFE), with this
    record and the confirmation.'
  fail_action: 'The quantile-TP mechanism is closed on Foxhound-1 for q 0.60; record it on research/levers/ml-brackets.yaml. Next D6
    lever only after a positive-net entry model (D3); a distributional head of MAE for the SL is a separate unit, not a re-run.'
  proposal_mapping: 'pass -> confirmation then Tier-3 bracket proposal; fail -> mechanism closed; indeterminate -> state why (n or
    between bars) and stop, no re-run at another q.'
  what_it_does_not_do: 'Changes no SL, no tau, no entry decision; moves no TP in-trade (Labrador-1b, D7); serves nothing; no order, no
    config; adds no gate. Ignores the occupancy change a different exit would cause (paired on the TP-3 policy''s decisions), said so;
    the arm''s own sequential policy is reported as context.'
  min_n: 300
