id: RQ-20261125-0838-05
title: 'CONFIRMATION of the qqq_pullback_1h long-only side filter (bd30-02 PASS, +11.2R over bidirectional on 2019..2026): does it hold on 2013-01..2018-12, a window
  the discovery never saw?'
status: queued
cadence: once
theme: live_strategy
priority: 2
kind: experiment
question: Same leg, arms (A= declared bidirectional, SL=--side-filter=long), cost stack and bars as bd30-02; window 2013-01-01..2018-12-31 (pre-discovery in-hand
  Dukascopy history, 6 calendar folds). Does SL beat A?
why_this_matters: Decides whether the short half of qqq_pullback_1h is worth keeping on the road to real money (the record says it loses gross and net) and whether
  the SPY long-only lead generalises to a second index ETF. On PASS the follow-up is a confirmation on the other disjoint QQQ window (2025-06+ record window is NOT
  disjoint from this one; use the QQQM series bd30-01) and the Tier-3 declare proposal for the manager; on FAIL the direction family on this leg is closed for this
  window and the next family is regime_gating cells.
power:
  alpha: 0.05
  basis: 'MEASURED: b163-01 (2026-11-24) recorded n(A)=256 on this exact window and feed. SL will have roughly the long share (~55%). Below 39 grades INDETERMINATE,
    never FAIL.'
  design: one_sample
  effect_units: sd
  expected_n: 256
  feasibility:
    accrual_basis: Re-measurement on freshly fetched public candles over a pinned window; nothing accrues.
    source: none
  min_detectable_effect: 0.45
  power: 0.8
decision_rule:
  id: RULE-RQ20261125083805-LONGONLY-CONFIRM
  registered_at: '2026-11-25'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg qqq_pullback_1h --grade replace, window 2019-01-01 .. 2026-10-15 (--non-crypto-source dukascopy), 6 folds
    by entry time, net of the full cost stack. Arms fixed now: A=; SL=--side-filter=long. Per arm: n, net_total_r, max_drawdown_r, net R per fold.'
  rule: 'Registered 2026-11-25 before any run. Same statistic and bars as RQ-20261124-bd30-02, window only changed: candidate SL PASSES iff net_r(SL) > net_r(A) AND
    delta >= 0.02 R x n(A) AND net R >= A in >= 4 of 6 folds AND maxDD <= 1.35 x maxDD(A); n(A) >= 39 else INDETERMINATE (also if the arm is byte-identical to A).
    Regime-robustness: per-year table reported; a pass concentrated in one year (> 50% of the delta) is reported as PASS_CAVEATED. PASS = the long-only side filter
    holds on a window its discovery never saw: the Tier-3 declare PROPOSAL (with the mirror, never a config edit) goes to the manager on both records. FAIL = the
    discovery was window-specific; family not retired.'
  regime_robustness: 'Reported with the result, not graded here (the grade is the rule above): per-year net R table for every arm, long-side and short-side net R
    separately, and the largest single year share of total net R. Set before the run.'
  what_it_does_not_do: Edits no config and no roster, places no order, is not a promotion case.
  pass_action: Tier-3 declare proposal for the manager on the discovery + this confirmation (no config edit here).
  fail_action: Record the side-filter response as window-specific on the lever map; next untested family.
practice_precedent: 'M4, M5, M13 (docs/reference/trading-and-model-practice-principles.md): pre-registered arm grid, every arm counted, baseline = the declared leg,
  confirmation on an in-hand window the lead was not read on'
intervention_controls:
  not_applicable: a Stage-0 / parameter-ablation re-measurement of the declared leg through the harness, not an in-trade action or active-management intervention
