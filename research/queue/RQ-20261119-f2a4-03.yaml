title: 'P8-Q4 HEAD-TO-HEAD on the alpaca_live cash book: does slv_trend_1h (the one leg 207f-04 qualified), alone or sharing the slot
  with Foxhound-4 (+ tqqq_trend_long_1d), beat Foxhound-4 alone by the P8 promotion rule s 5.2, on their common DEV window?'
status: done
