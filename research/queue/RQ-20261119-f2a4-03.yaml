kind: experiment
question: 'Replaying Foxhound-4 as configured (tau 0.25, net-R label, the purged DEV walk-forward of `foxhound --section book`, <= 2025-06-30)
  and the Stage-0 trades of slv_trend_1h (build_strategy_evidence, config-exact) through the alpaca_live cash book on their COMMON window,
  paired by month: does slv_trend_1h alone (REPLACE) or the combined book (Foxhound-4 picks first, tqqq_trend_long_1d included; JOIN)
  clear plan s 5.2 against Foxhound-4 alone: mean monthly return difference >= +0.25 % of the book, paired t >= holdout_lock.bar_for(2).point_t_min,
  n_taken >= 30 for both books, max drawdown <= 1.5x the incumbent''s?'
why_this_matters: 'Decision it changes: what alpaca_live (a real-money book) trades. 207f-01 found Foxhound-4''s dev edge does NOT survive
  the cash book (book mean -0.058 R over n 97 vs -0.002 R unconstrained), and 207f-04 qualified slv_trend_1h as the only challenger
  (n_taken >= 30, book mean > 0, month-clustered t >= 1). PASS (REPLACE or JOIN) -> a Tier-3 proposal for the manager per plan s 5.5,
  after the s 5.3 confirmation on a window after the leg''s Stage-0 window; FAIL -> Foxhound-4 stays, and the record says no rostered
  rule-based leg beats it on this book; the P8 search moves to Q7 rotation (a new family sized for the account).'
