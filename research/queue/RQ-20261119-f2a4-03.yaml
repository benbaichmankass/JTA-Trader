    arm vs the incumbent.'
  rule: 'Per plan s 5.2 / 5.4, every clause reported: an arm CLEARS iff paired monthly mean difference >= +0.25 %/month AND paired t
    >= bar_for(2).point_t_min AND n_taken >= 30 for both AND maxDD <= 1.5x the incumbent''s. PASS (REPLACE) iff slv_trend_1h clears
