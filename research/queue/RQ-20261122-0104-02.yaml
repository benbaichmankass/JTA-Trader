question: On QQQ 1h history BEFORE 2022-12 (the discovery window of RQ-20261122-5722-01), does trend_lookback 90 beat the configured 60 by >= 4.0 R net of cost with maxDD no
  worse and >= 3 of 4 calendar folds? One arm vs control (denominator 1 of the 5 the discovery chose from).
why_this_matters: '5722-01 (best of 5 one-factor arms, 2022-12..2026-11) found tl90 +16.03 R over A with 4 of 4 folds and DD -3.57 R; tl40 was -5.49 R and A is the control,
  so the response in trend_lookback is monotone (40: -5.5, 60: 0, 90: +16.0), the shape a real lever has. But the same lever on SPY (5722-02, tl90 in its 5 arms) did not clear,
  and a best-of-5 discovery on one window is not a confirmation. Operator rule (2026-11-05): confirm on untouched IN-HAND data - here pre-dev history, registered before the
  run.'
