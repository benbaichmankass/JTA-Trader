id: RQ-20261023-1d5c-16
title: 'Prop pace squeeze at 2h on the first alt basket (BNB, LINK, DOGE, LTC, BCH, DOT): break-even floor, stale exit, stricter compression'
status: queued
cadence: once
roadmap:
- L-PROP
theme: new_strategy_prop
priority: 2
kind: experiment
question: RQ-20261006-006/-010/-022 (squeeze 1h) graded FAIL; 4b82-09 measures 2h on the six majors only. Over 2020-06-01..2026-10-22 on 6 cells at 2h, does any arm
  (BE1, ST12, WIDE) pass the pooled Stage-0 rule with breadth AND beat B by >= 0.05 R/trade pooled?
why_this_matters: 'Operator directive 2026-10-22: an idea that failed one test is not dead; it failed the first test. This unit is a registered VARIANT/EXTENSION.
  Lane AUTHOR-FLOOR-1023B (research runnable floor 47 vs 59 at 18:45Z; regime 8 vs share 14, new_strategy_prop 7 vs 17). First test(s): RQ-20261006-006, RQ-20261006-010,
  RQ-20261006-022, RQ-20261022-4b82-03, RQ-20261022-4b82-09. DIAGNOSIS (one line, a hypothesis not a finding): squeeze''s losers run at 1h (XRP -0.0688 R n=552, 37%
  win); the exit-side levers are the open ones and the alt basket tests whether the 2h majors read transfers; hypothesis'
power:
  expected_n: 600
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: Pooled floor 88 trades (d = 0.3 at alpha 0.05 / power 0.8, the repo's standing floor for this family of units); expected_n=600 is an ESTIMATE, not a measurement
    for these arms; below the floor the unit grades indeterminate, never FAIL.
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ202610231D5C16-SQ2H-A
  registered_at: '2026-10-23'
  registered_before_run: true
  statistic: 'scripts/research/harness_stage0.py --family squeeze --timeframe 2h, arms fixed now: B=; BE1=--be-floor-r=1.0; ST12=--stale-exit-bars=12;--stale-exit-below-r=0.3;
    WIDE=--bb-std=2.5;--kc-mult=1.0; baseline B; per cell and pooled across 6 cells; flags --folds 6 --fold-majority 4 --n-floor 39 --pooled-n-floor 88 --breadth-frac
    0.5 --baseline B --delta-r-per-trade 0.05; cost = the harness venue-aware fee + slippage + funding stack (execution_costs.resolve_cost_policy), recorded per cell.'
  rule: 'Arms and thresholds are fixed now and are not changed after any result. A candidate PASSES iff it passes the pooled Stage-0 rule (pooled n >= 88, pooled
    net_r > 0, >= 4 of 6 calendar folds net positive, >= half of the powered cells pass) AND beats B''s pooled net R/trade by >= 0.05 R. PASS IF one or more candidates
    pass: the best by pooled net R is named and the follow-up is ONE confirmation unit on a disjoint window with the same statistic and bar (a pass on one window
    is a lead), then the prop/real-money SUPERSET ladder; never a roster edit. FAIL IF every candidate fails (n >= floor) -> this variant is closed on this window
    and the record names which arm moved closest, so the next variant is aimed; the family is NOT retired on one config. INDETERMINATE IF pooled n < 88 or fewer than
    half the cells measured (a fetch/harness fault is recorded per cell, never dropped).'
  what_it_does_not_do: Edits no config and no roster, places no order, is not a promotion case. A best-of-k arm is a LEAD (programme 03 rung S0-C), never a finding.
    Candles are Binance USD-M (a PROXY for Bybit linear); the funding term is a directionless magnitude (execution_costs P1); both are stated in the record. Does
    not pool with any committed record. Does not duplicate 4b82-09 (majors) or 4b82-03 (1h).
