id: RQ-20261124-f1a0-04
title: 'ml_entry BOOK/RECENCY INPUTS: do 5 point-in-time recency columns (the symbol''s own long/short bracket outcome 24 h ago; universe mean
  long R and long/short stop shares 24 h ago) beat the recipe and a timestamp-shuffled placebo by +0.0068 R/decision on the dev folds, net of
  the full cost stack?'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
programme: P2
kind: experiment
iteration:
  subject: ml-entry
  subject_kind: ml_model
  from_result: RQ-20261124-e1a7-02/45455675005
  verdict_read: indeterminate
  diagnosis: 'RQ-20261124-e1a7-02 (run 45455675005, verdict_top1.json, MEASURED, dev folds 2022-01..2025-10, n 71,334 base decisions): the registered
    recipe''s LONG side is net -0.0063 R/decision (n 25,793) vs SHORT +0.0082 (n 45,541); 11.8 entries per decision bar; bar-level max DD 1,604
    R at full risk per entry; top-1 per bar was INDETERMINATE (+0.0042, t 0.26, beats random 1-of-k by +0.0115 t 1.16). Live (docs/research/ml-entry-review-2026-11-24.md):
    the side is a market-wide contrarian rule on btc_ret24 / btc_vol24 (SHAP); 9 of 10 BTC-move bars went against the move; 11 of 11 bars single-signed;
    management saved ~11 R vs the untouched bracket. Verified on the serving path: the model sees no input about its own recent results; live
    it kept re-buying after stop-outs in the same tape. The policy-independent form of "recent own-trade R / recent stops" is the outcome of the
    previous decision of each side, which is closed by bar t''s close.'
  search: 'lever family features/book-recency, one fixed set of 5 columns (no grid): own_prev_net_long, own_prev_net_short, xs_prev_net_long,
    xs_prev_stop_long, xs_prev_stop_short (all at t - 24 h).'
  levers:
  - features
  map_entries:
  - research/levers/ml-entry.yaml
  attempt: 1
  due_by: '2026-12-01'
question: On the 8 dev folds, is mean net R per decision of the recipe + BOOK_FEATURES at least +0.0068 above the recipe AND above the recipe
  + the same 5 columns with timestamps shuffled (t >= 2, >= 6/8 folds, >= 3/4 years)?
why_this_matters: Row ML-ENTRY-BOOK-FEATURES asked for this arm; it is the input-side answer to "does the model consider its own past trades".
