question: On avax_pullback_2h over the pinned window, does either pre-registered --direction-filter arm (DI = di, SL = slope) beat the leg as declared by >= 0.02 R/trade in
  >= 4 of 6 folds within the drawdown bar?
why_this_matters: 'The --direction-filter axis of scripts/backtest_pullback.py was first-tested on xrp/ada/eth/sol_pullback_2h and the 1d ETF legs (RQ-20261022-3a84-01..07,
  2230-01); a grep of research/queue (2026-10-26) shows no direction-filter arm on avax_pullback_2h. First-test cell for the axis on this leg. Lane RESEARCH-AUTHOR-20261026-0030
  (research SLO breach 23:15Z 2026-10-25, ops-flags #17895: runnable 42 < floor 71; the 23:16Z routine fire produced no PR). Operator 2026-10-22: an idea that failed one test
  is not dead; it failed the first test.'
