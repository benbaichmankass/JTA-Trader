id: RQ-20261124-f1a0-12
title: 'ml_entry REGIME ARM: does weighting every training row by the similarity of its BTC regime state to the pre-fold state beat the same SL
  4 / TP 6 / 48 h recipe unweighted, and a permuted-regime placebo, by +0.0068 R/decision on the dev folds, net of the full cost stack?'
status: done
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
programme: P2
kind: experiment
iteration:
  subject: ml-entry
  subject_kind: ml_model
  from_result: RQ-20261124-f1a0-11 (running) + RQ-20261124-f1a0-03/-09
  verdict_read: indeterminate
  diagnosis: 'Regime in ml_entry, measured today on the 8 dev folds: as raw input columns (e1a7-01 local partial) worse than base and no better
    than noise columns; as a hard split into per-BTC-trend heads (f1a0-03) -0.0175, no better than a coin split, because halving each head''s
    data costs more than the conditioning buys; as a side mute (f1a0-01) +0.006 but random mutes do as well; as recency-fit calibration (f1a0-09)
    FAIL -0.0359 because side EVs anti-persist from one half-year fold to the next. So regime must enter as a soft, data-preserving conditioning
    on a STATE (not on the latest outcomes): kernel similarity weights keep all rows and up-weight periods whose market state resembles the one
    being traded. Built on the cost-lever recipe (SL 4 / TP 6 / 48 h, f1a0-11) because cost per R is the binding constraint.'
  search: 'lever family regime/sample-weighting, one fixed rule (no grid): RSW_STATE 3 columns, Gaussian bandwidth 1.0, reference = mean state
    over the 7 days before the test fold.'
  levers:
  - regime
  map_entries:
  - research/levers/ml-entry.yaml
  attempt: 1
  due_by: '2026-12-01'
question: On the 8 dev folds, is mean net R per decision of the SL 4 / TP 6 / 48 h recipe fit with regime-similarity sample weights (Gaussian
  kernel, bandwidth 1.0 in train-standardized units, of each row's BTC state [30d log return, log distance from the 1200 h mean, vol24 percentile
  over 90d] to the mean state of the 7 days before the test fold; weights mean 1) at least +0.0068 above the same recipe with uniform weights
  AND above the same weighting on timestamp-permuted states (week-clustered t >= 2, >= 6/8 folds, >= 3/4 years)? Net R per regime cell (BTC 30d
  trend sign x vol above/below median) is reported for every arm.
why_this_matters: 'Operator 2026-11-24 (via the manager, binding): regime classification is a standing, first-class lever in every research stream.
  Today''s ml_entry reads say how NOT to use it: as raw inputs it overfits, as a hard split it halves the data, as recency it chases anti-persistent
  side EVs. Similarity weighting conditions on regime while keeping every row.'
