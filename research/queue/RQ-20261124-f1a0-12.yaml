  min_detectable_effect: 0.0068
  effect_units: R_per_decision
  sd: 1.1
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATE: arm n ~ base n (~70,000), mostly the same decisions so se(delta) ~ 0.005-0.010; INDETERMINATE possible, stated now.'
