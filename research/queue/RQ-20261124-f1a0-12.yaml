decision_rule:
  id: RULE-ML-ENTRY-FIX-ARMS-20261124
  registered_at: '2026-11-24'
  registered_before_run: true
  baseline: the same SL 4 / TP 6 / 48 h recipe with uniform weights; control = the same weighting on timestamp-permuted regime states
  statistic: 'scripts/research/ml_entry_fix_arms.py --arm rsw_xwide_h48: delta = pooled mean net R per decision (regime-weighted) - (uniform)
    over the 8 dev folds; se = week-clustered influence se (ml_decision_entry.arm_diff); folds_better and years_positive vs the uniform arm; control
    = permuted-state placebo.'
  rule: PASS iff arm n >= 3000 AND delta(weighted - uniform) >= +0.0068 AND t >= 2.0 AND delta(weighted - placebo) >= +0.0068 AND folds_better
    >= 6 of 8 AND years_positive >= 3 of 4. FAIL iff n >= 3000 AND delta + 2.0 se < +0.0068. INDETERMINATE otherwise. State columns, bandwidth,
    reference window, bracket, horizon, tau, folds and cost stack are fixed now and never changed after a result.
  pass_action: Fresh-window confirmation (2025-10..2026-11, holdout ledger claim, deflated bar), then a data-backed Tier-3 replacement packet
    (the weighted refit; serving needs the 3 regime columns) to the manager. Applied by the operator or a mandate, never by a lane.
  fail_action: 'Regime stays a standing lever (operator): the next form is a regime-dependent BRACKET (SL multiple scaled by the BTC vol percentile),
    authored from the per-regime-cell table in this result; similarity weighting at this bandwidth is recorded closed.'
  proposal_mapping: pass -> fresh-window confirmation (bars after 2025-10-01, holdout ledger claim, deflated bar) -> Tier-3 proposal to the manager
    with this evidence record; fail/indeterminate -> the next iteration authored from this diagnosis at once.
  what_it_does_not_do: Changes no served model, config, sizing or order path; reads no held-out window; is not a promotion; adds no gate.
