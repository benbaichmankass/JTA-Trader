id: RQ-20261014-77dc-02
title: 'Macro / information: PLACEBO for the PPI m/m ES=F effect (de02-04): move each release anchor 10 trading days later and re-run'
status: done
cadence: once
theme: macro
priority: 2
kind: experiment
question: With every PPI release anchor shifted +10 trading days (no information event at the anchor), does the 3-day negative IC still reach |t_eff| >= 2.4?
why_this_matters: 'The cheapest check that de02-04 is tied to the release date and not to a drift/vol pattern in the surprise series. Placebo semantics: PASS = the placebo ALSO reproduces
  the effect (evidence AGAINST de02-04); FAIL = placebo clean (consistent with a release-specific effect, still not proof). PARENT: this placebo grades against RQ-20261014-de02-04 (the
  +10 trading-day post-release placebo of that exact study, 3d horizon, same 139 releases). It complements, and does not duplicate, the P4 family placebo RQ-20261014-4a4c-03 (the -10
  trading-day pre-release placebo).'
power:
  expected_n: 139
  min_detectable_effect: 0.2
  effect_units: sd
  design: one_sample
  alpha: 0.01
  power: 0.8
  basis: Same 139 releases as de02-04, anchors moved; n unchanged (checked by the run).
  feasibility:
    source: none
    accrual_basis: fixed historical backfill; a short join lands INDETERMINATE, never padded.
decision_rule:
  id: RULE-RQ_20261014_77DC_02
  registered_at: '2026-10-14'
  registered_before_run: true
  statistic: Overlap-corrected Spearman t (ic_t_eff) of PPI m/m surprise vs forward ES=F return, 3-trading-day horizon only (the horizon at which RQ-20261014-de02-04 peaked, t=-3.43,
    n=139), graded by macro_event_study_run.py grade().
  rule: 'PASS (placebo reproduces) IF n >= 100 AND the 3-day IC is negative with |ic_t_eff| >= 2.4 at the shifted anchor: de02-04 is treated as not release-specific. FAIL (placebo clean)
    IF n >= 100 and that t is not reached. INDETERMINATE IF n < 100.'
  min_n: '100'
  what_it_does_not_do: Not a promotion case, not a leg, not a config change, not a P&L figure; daily closes only. News layer and WEPE are not retired or confirmed by this result. A clean
    placebo is necessary, not sufficient.
