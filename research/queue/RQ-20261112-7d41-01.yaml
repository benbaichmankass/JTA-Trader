  basis: 'config/accounts.yaml: breakout_2, tradeify_1 and velotrade_1 all trade ETHUSDT and SOLUSDT (exchange: breakout)'
  tradeable_now:
  - ETHUSDT
  - SOLUSDT
  population_rule: Pooled ML over both symbols (an account configures strategies, never symbols). The bv profile covers breakout_2 and velotrade_1 (shared model, the stricter of their declared
