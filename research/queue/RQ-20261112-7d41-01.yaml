title: 'P5-MLPROP-BASIS-LOWCAP-BV: does the funding/basis stream (premiumIndexKlines) carry a net-of-cost ETH+SOL entry signal at LOW model capacity (regularised logistic head) on the sealed backward
  held-out 2020-07-01..2021-12-21, and does it clear V3 on breakout_2 and velotrade_1?'
