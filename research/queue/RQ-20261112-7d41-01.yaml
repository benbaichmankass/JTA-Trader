data_sources:
  status: 'Binance Vision um 1h klines, resampled to 8h by the driver; monthly 1m premiumIndexKlines (public archive, no credential), reduced to one reading per UTC hour stamped when the hour
    closes; reachable from the lane container and the runner (data.binance.vision). Census: RQ-20261109-98e3-30 (PASS on premiumIndexKlines).'
  candidates:
  - F0 price/volume only (the control). F0+BASIS = F0 + 4 basis columns (basis, basis_ma24, basis_z, basis_chg24), each taken as-of the bar close from hourly readings stamped at or before it;
    a reading older than 6 h at the bar close is NaN. Funding-rate (F1), OI/flow, macro (F2) and text (F3) are not arms. book_depth is deferred (no builder).
label_and_horizon:
  bar: 8h (--bar-hours 8); horizon as the driver sets it for 8h bars
  entry: as RQ-20261105-d256-01 (score each closed 8h bar per symbol; enter next bar open when score >= tau; one position per symbol; no hedging)
  label: as RQ-20261105-d256-01 (net R >= +0.5 after the profile cost stack; q60 MFE TP head clipped to [1.5R, 4.0R])
  horizon_bars: driver default for bar_hours 8
baselines:
  cost_stack: 'bv profile: commission 4 bps/side, slippage 3 bps/side, swap 5 bps/night prorated (the stricter of Breakout''s and Velotrade''s declared stacks per term).'
  B0: flat (net R 0).
  B1: all-bars control and matched random-selection control (2000 draws, seed 20261105) on the identical held-out span.
  B3: 'ml_entry ETH+SOL ledger (the reference the driver registers): reported beside the candidate, see the baseline clause of the rule.'
arms:
  denominator: '10 registered draws: feature set {F0, F0+BASIS} x tau {0.30, 0.35, 0.40, 0.45, 0.50}. All graded arms are counted and reported. The tau grid is shifted down from RQ-20261109-98e3-34''s
    because a regularised logistic score is concentrated near the label base rate (registered before any run, for scale, not after seeing a result). Family-level multiplicity disclosed: this family
    has already been graded with LightGBM in RQ-20261109-98e3-34 (10 draws, no discovery-eligible arm).'
  models: 'LOW-CAPACITY head (the one lever of this unit): median-impute + standardise + L2 logistic regression (C=0.05, fixed in the driver before any run; --model logit) for the win label, and
    ONE constant TP per side (q60 of the training MFE clipped to [1.5R, 4.0R]); no tuning loop. Every other element (label, bracket, costs, folds, eligibility, E1-E4) is the predecessor''s, unchanged.'
split:
