  unchanged.
question: 'RQ-20261109-98e3-34 (LightGBM, F0 vs F0+BASIS, 8h, bv) FAILED on discovery: no arm eligible (F0+BASIS sums -4.5/-10.0/+6.6/+1.7/-0.6 R, 3-5 of 9 folds positive). A fixed 200-tree LightGBM
  on ~10k rows, 11+ features and a noisy label may simply overfit a slow, persistent signal (funding/basis is the classic crowding/carry state variable: Schmeling-Schrimpf-Todorov 2023, BIS WP
  1087, crypto carry predicts returns; Liu-Tsyvinski 2021 RFS). Does the same information, offered to a LOW-capacity head, show a discovery-eligible arm and then clear the registered held-out
  read? Operator spec 2026-11-05 (popup "New data sources (Rec.)"); surge from 2026-11-12.'
why_this_matters: 'The prop accounts still have no ML entry candidate (every price-only line closed; the three free non-price families each failed at LightGBM capacity: 98e3-31/32 oi_flow, 98e3-34/35
  basis, 98e3-37/38 book_depth). Capacity is the one lever those six units did not vary. A discovery FAIL here, with the held-out unread, closes the free-Binance non-price route at BOTH capacities
  and is a clean basis for the programme review to retire the pooled prop-entry-ML line for these families (liquidation history is not in the public archive: verified 404, 2026-11-12). Basis is
  ranked first because its signal is slow (8h bars match the state variable) and it is the only family whose history reaches the sealed backward span.'
