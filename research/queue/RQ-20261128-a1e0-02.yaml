question: 'On the 60-perp frozen universe, 8 dev folds, net of fee + slippage 3 + funding 1 bps/8h: once a day at the 00:00 UTC decision bar,
  rank symbols by the model''s predicted cross-sectionally demeaned (net_long - net_short)/2 (RidgeCV, alphas 1..1000, per-bar rank-gaussianised
  features, fit on the training span), go long the top 5 (their long-bracket net R) and short the bottom 5 (short-bracket net R), each leg R/5.
  Does the book beat the same book ranked by raw ret_24 (momentum or reversal, the sign chosen on the TRAIN fold) by >= +0.010 R per leg-row (week-clustered
  t >= 2.24) AND beat a random-rank book by >= +0.010, on >= 6 of 8 folds and >= 3 of 4 years? The LightGBM twin is reported, not graded.'
why_this_matters: 'Row ML-ENTRY-REDESIGN arm R2 (operator 2026-11-28 ''Step back: redesign (Recommended)'', relayed by Manager 2026-11-28b). A
  PASS feeds a NEW D3 variant (a paired-entry book), not the single-leg ml_entry; one confirming read on the held-out year at the deflated bar
  decides.'
