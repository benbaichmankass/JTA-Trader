  registered_at: '2026-11-28'
  registered_before_run: true
  statistic: 'scripts/research/ml_entry_fix_arms.py --arm xs_rank_ridge (META_RULE): delta(arm - xs_baseline) and delta(arm - control) in net
    R per leg-row, week-clustered se, folds_better of 8, years_positive of 4; xs_rank_gbdt (written to {out_dir}/gbdt/) reported, not graded.
    Both emit series for PBO.'
