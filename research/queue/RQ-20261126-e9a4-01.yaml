id: RQ-20261126-e9a4-01
title: 'REGIME-PROGRAM equities/futures entry filter: on the ROSTERED non-crypto legs (ETFs, micro futures), does skipping each trade whose walk-forward
  LightGBM prediction (the f1a0-26 frozen recipe; own-symbol + SPY daily state) falls below the training 1/3 quantile beat taking every trade by +0.01 R
  per available trade, and beat random skips of the same count within leg-month, net of the full cost stack?'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
programme: P2
kind: experiment
iteration:
  subject: regime-program
  subject_kind: ml_model
  from_result: RQ-20261125-f1a0-35
  verdict_read: fail
  diagnosis: 'The crypto regime forms are exhausted. Sizing tilts (f1a0-19..32) and the entry filter (f1a0-35 FAIL: -0.0026 R, the skipped tercile still
    averaged +0.010 R) both failed, and regime as a model INPUT failed too (F8 f8a1-01 FAIL: -0.072 R/decision, more and worse entries). Every one of those
    tests used crypto legs whose state is dominated by one BTC cycle. The non-crypto legs (bonds, gold, silver, oil, index ETFs, micro futures) have
    different and less correlated regime drivers (rates, risk-on/off), and no regime form has ever been tested on them. Competing hypothesis: the daily
    trend/pullback harnesses already embed their own regime filter (SMA/ADX), so a learned state adds nothing on any asset class. This unit separates the
    two by running the SAME frozen recipe on the new population with nothing re-tuned.'
  search: 'one fixed definition, the f1a0-35 recipe unchanged (MS_FEATS, MS_LGB, huber, clip 3R, yearly walk-forward from RR.TEST_START, skip iff the prediction
    is below the 1/3 quantile of that year''s TRAINING predictions, every other trade at size 1). The only changes are the population (--universe equities)
    and the market-anchor block (SPY daily instead of BTC). No grid, no threshold search.'
  levers:
  - regime
  - entry
  map_entries:
  - research/levers/ml-entry.yaml
  attempt: 14
  due_by: '2026-12-03'
question: On the rostered non-crypto legs (trend / pullback harnesses; Dukascopy candles), does skipping each trade whose walk-forward LightGBM prediction (f1a0-26
  frozen recipe, own-symbol + SPY daily state) is below that year's training 1/3 quantile, taking every other trade at equal risk, add >= +0.01 R per available
  trade over taking all of them (t >= 2, >= 4 of 5 test years positive) and beat 200 random skips of the same count within each leg x month (share <= 0.05),
  net of the full cost stack?
why_this_matters: It is the first regime test on the non-crypto half of the roster (19 replayable rostered legs, 3 of them real money). A pass is an input to a
  Tier-3 per-family entry-filter proposal for those legs (strategy logic; the operator decides), after a fresh-window confirmation. A fail retires this recipe
  for both asset classes and moves REGIME-PROGRAM to a different form (a hand rule on the rates/risk-off axis, or the equities intraday state).
power:
  expected_n: 1835
  min_detectable_effect: 0.045
  effect_units: metric
  sd: 1.2
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'MEASURED trade counts (local replay 2026-11-26 with the runner''s pinned dukascopy-python 4.0.1, no grade computed): 19 of 22 rostered non-crypto legs
    replay (MHG, QLD and TQQQ are refused by the Dukascopy lane: no copper mapping, and leveraged ETFs have no valid proxy). That gives 2,350 trades in
    2020-09-01..2026-10-26, of which 1,835 are test-window trades (>= 2022-01-03) over 249 test weeks. With per-trade sd ~1.2 R (ESTIMATE) and a 1/3 skip,
    the delta per available trade has SE ~ 1.2 / sqrt(3 x 1835) = 0.016 R, so the MDE is ~0.045 R. That is ABOVE the rule''s +0.01 bar, so the unit is
    underpowered for an effect at the bar: INDETERMINATE is a live (likely) outcome, stated up front. The rule is the frozen f1a0-35 one, unchanged.'
  feasibility:
    source: none
    accrual_basis: Fixed history pulled at run time from the keyless Dukascopy lane over a pinned window; nothing accrues.
