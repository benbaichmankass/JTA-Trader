decision_rule:
  id: RULE-REGIME-ENTRY-FILTER-EQ-20261126
  registered_at: '2026-11-26'
  registered_before_run: true
  baseline: take every replayed trade at equal risk (the same trades); 200 random skips of the same count within each leg x month
  statistic: 'scripts/research/rostered_leg_replay.py --mode filter --universe equities (metastate_frame with the SPY anchor in the btc_* columns, metastate_raw
    kind=filter, grade_raw normalise=False, grade_filter): delta = -(sum of skipped net R) / all test trades (a skipped trade contributes 0 R); se from 1,000
    entry-week bootstrap draws; permutation share = share of 200 within leg x month permutations of the 0/1 keep flags with delta >= the arm; yearly delta;
    skipped share and the mean net R of skipped vs kept; per-family delta and skip share reported; per-leg feed (source, ticker; proxies) reported.'
  rule: PASS iff delta >= +0.01 R per available trade AND t >= 2 AND permutation share <= 0.05 AND >= 4 of 5 test years > 0; FAIL iff delta <= 0 or share >= 0.5;
    else INDETERMINATE. Fixed now (the RULE_MS thresholds, unchanged from f1a0-35).
  pass_action: 'A fresh-WINDOW confirmation first (trades after 2026-10-26 once enough accrue, or the leg configs on non-rostered ETFs), plus the regime-selectivity
    walk-forward-before-Tier-3 rule; then a Tier-3 per-family entry-filter PROPOSAL to the manager with this evidence record. A filter is strategy logic: the
    operator decides; no lane applies it.'
  fail_action: Record that this RECIPE (the f1a0-26 frozen walk-forward LightGBM entry filter on own-symbol + market-anchor daily state) failed on both the crypto
    and the non-crypto rostered legs; REGIME-PROGRAM's next form is authored from this result (a hand rates / risk-off rule on the bond and gold legs, or the
    equities intraday state).
  proposal_mapping: pass -> fresh-window confirmation -> Tier-3 entry-filter proposal; fail or indeterminate -> the next regime form from this diagnosis.
  what_it_does_not_do: Changes no config, sizing, filter or order path; adds no gate. Re-runs the evidence builder's harness path read-only (writes only under --out).
