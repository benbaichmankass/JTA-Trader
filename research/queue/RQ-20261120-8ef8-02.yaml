  targeted maxDD <= baseline maxDD and a positive Sharpe delta in >= 3 of 4 equal calendar blocks, at >= 100 trades?'
why_this_matters: 'trend_donchian_sol_prop trades on bybit_2 + bybit_portfolio (real money). The regime programme''s on/off SKIP units are predicted to fail on trend legs (IDEA-REVIEW-1016
  s11; the 11 donchian skip units were dropped before merge), so the open regime question for these legs is continuous SIZING, node P2-R5 and row IR-VOL-TARGET-SIZING-STAGE0. The corpus
  is Bybit-native per the manager''s 2026-11-20 03:52Z method decision (comms/research/VENUE-GAP-20261120/record.json: Binance-fed evidence overstates the Bybit book by a trade-weighted
  0.0185 R/trade, 21 legs). Sizing is the RiskManager''s (MECE s 2.1): a PASS is evidence for a Tier-3 sizing proposal, never a config edit from this unit. The node asked for pairing
  with skip verdicts on the same window; no skip unit exists for this leg (the 65ff skip units cover pullback legs and trend_donchian_sol over 2022-10..2024-10, before the Bybit file
  starts), so this unit stands alone.'
