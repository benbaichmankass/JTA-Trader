decision_rule:
  id: RULE-RQ202611208ef802-VOLTARGET-SIZING
  registered_at: '2026-11-20'
  registered_before_run: true
  rule: 'Row IR-VOL-TARGET-SIZING-STAGE0 / node P2-R5''s rule, thresholds unchanged: INDETERMINATE IF n_trades < 100 or the Sharpe delta or a drawdown is unmeasurable. PASS iff (a) dSharpe
    = Sharpe(targeted) - Sharpe(baseline) >= +0.10 net of the overlay''s costs, AND (b) maxDD(targeted) <= maxDD(baseline) (positive R magnitudes), AND (c) dSharpe > 0 in >= 3 of 4 equal
    calendar blocks of the daily book. FAIL otherwise. PASS: evidence for ONE Tier-3 sizing proposal for this leg (operator/RiskManager), after a confirmation on a disjoint span; never
    a config edit from this unit. FAIL: vol-target sizing is not the lever for this leg at these settings; closes this configuration, not the family. Thresholds are not changed after
    any result.'
  statistic: 'scripts/research/vol_target_verdict.py: the trainer''s Bybit file (finest file <= the timeframe, m20_fleet_exit_sweep.resolve_data) aggregated open-stamped to the leg timeframe;
    the leg''s Stage-0 argv (regime_debt_matrix.build_harness_cmd) with --emit-trades and --start/--end; backtest_vol_target.build_book -> run_vol_target(return_series) with resolve_overlay_costs(<symbol>);
