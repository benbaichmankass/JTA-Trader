id: RQ-20261105-c692-08
title: 'Dynamic SL, one factor (be): SL to breakeven once a bar closes at >= +1R -- does it beat the fixed 2-ATR stop (hold-to-bracket) on frozen-ENTRY
  trades, net of the full cost stack, held-out?'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: experiment
practice_precedent: 'T1, M6 (docs/reference/trading-and-model-practice-principles.md): purged + embargoed walk-forward with a sealed held-out
  window; triple-barrier first-passage labels (Lopez de Prado 2018, ch. 3); docs/research/ml-decision-models-2026-11-01/DESIGN.md.'
question: 'Row ML-ENTRY-DYNAMIC-SL arm: Break-even stop at +1R (price-triggered at every bar close, applied from the next bar; no parameter to
  tune). One factor against the fixed 2.0-ATR SL with the static 2/4 ATR bracket, on the SAME frozen-ENTRY trades (paired, trade-for-trade), dev
  folds choose the parameter, held-out 2025-10-01..2026-09-30 read once. Net R per original stop distance, fee+slippage+funding. Spec DESIGN.md
  section 4a. Look-before-retest: 5e04-01 (structure SL pivot 5 + moving TP, ENTRY trades, 2025-10..2026-10) and 5e01-09/10/11 (blocked) are entry-time
  structure stops, a different factor; no break-even/trail/time-decay/ML-revision arm had a unit before this one.'
why_this_matters: 'Operator 2026-11-01 ~23:00Z (row ML-ENTRY-DYNAMIC-SL): "we also need to test dynamic sl features for the ml". Active management,
  SL side. A live change is Tier 3.'
decision_rule:
  id: RULE-RQ20261105-c692-08-DYNSL
  registered_at: '2026-11-05'
  registered_before_run: true
  statistic: 'Held-out paired mean delta net R per trade vs hold-to-bracket (arm minus fixed 2-ATR SL, same trades, same cost stack), trade-grouped
    paired bootstrap CI95 (2000 draws); also reported: win rate, p05 and min net R (tail), giveback (mean MFE R minus exit gross R), by-month
    delta, exit-reason counts, matched random / best static where the arm is a learned head.'
  rule: 'NOT READ (verdict fail, dev) IF the dev-chosen parameter''s pooled dev delta net R per trade vs hold-to-bracket <= 0: no held-out outcome
    is read. INDETERMINATE IF held-out trades < 300 OR distinct symbols < 10. PASS IF held-out mean paired delta > 0 AND the CI95 lower bound
    > 0. FAIL otherwise. A FAIL closes this parameterization and cadence, not the family. Thresholds are not changed after any result.'
  what_it_does_not_do: No sizing, no config change, no order. A PASS is a Tier-3 PROPOSAL to the operator with the exact change, not a change.
