    with a moving-block bootstrap 90% CI; state autocorrelation and dominant-cell persistence reported.'
  rule: 'The PERSISTENCE HORIZON is the longest W whose side-gap r >= 0.3 with the 90% CI lower bound > 0. PASS iff such a W exists (written to
