    vs random routing).
  fail_action: Record that side edge has no usable persistence; author R2 with STRATEGY-performance labels (which family/leg earned) instead of
    side labels.
  proposal_mapping: pass/fail/indeterminate -> R2 authored from the measured persistence table; nothing is proposed for the trade path.
