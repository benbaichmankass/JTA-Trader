question: On the ml_entry dev table (every 4-h row, 60 perps, 2020-09..2025-10, policy-free side net R under SL 2 / TP 3 / 24 h, full cost stack),
  what is the lag-1 persistence of the window-mean BTC regime state and of the window SIDE GAP (mean net_short - mean net_long), overall and within
  each BTC cell, at windows of 1 week, 1 month, 1 quarter and 6 months? Is there a window whose side gap correlates >= 0.3 with the next window's,
  CI lower bound > 0?
