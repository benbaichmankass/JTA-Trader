# Authored 2026-11-25 by lane ML-PRIMARY: the ETF regime form after 1e06-09 FAIL (the SMA200 gate was window-specific). ONE rule on TWO windows,
# registered together with RQ-20261125-1e06-10; the pair passes only if BOTH pass. No local read of either window. Gates this adds or changes: none.
id: RQ-20261125-1e06-11
title: 'CREDIT-STATE GATE for the capitulation trigger (2000-01-01..2010-05-28 (the pre-sample window)): kept only when the Baa-10y spread is at or below its trailing 252-day median,
  1x ETFs on the 1e06-07 pairs, graded POOLED (paired with RQ-20261125-1e06-10; both must pass)'
status: queued
cadence: once
kind: experiment
theme: live_strategy
priority: 2
roadmap:
- L-LADDER
question: On 2000-01-01..2010-05-28 (the pre-sample window), does the 1.5-ATR capitulation trigger kept only when Moody's Baa-10y spread (FRED BAA10Y, as-of the prior day) is at or below
  the median of its trailing 252 observations, executed in the 1x ETF on the 1e06-07 pairs (KBE, SMH, EWZ, FXI, EWG, EWU, VGK, IJR), earn positive
  pooled net R with >= 4 of 8 pairs positive, stay positive under 2x slippage, AND beat >= 95% of 200 re-timed replays?
why_this_matters: 'The index''s own SMA200 gate passed on 2010-2026 (1e06-07) and failed on 2000-2010 (1e06-09): it is window-specific. A dip-buying
  rule''s failure mode is buying into a credit event (2008, 2020), which the price trend sees late; the credit spread sees it directly and has data
  for both windows. Registering one rule on both windows at once makes the out-of-time read part of the test, not an afterthought. A pass on both
  goes to the manager as the evidence for adding the credit gate to the INDEX-CAPIT-1X-LEG spec; a fail closes macro gating for this leg.'
power:
  expected_n: 250
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATE: 1e06-05 measured pooled n 205 on six 3x pairs (shorter histories); these 8 1x ETFs trade back to 2010 or earlier, so n ~ 250-400,
    above the floor 25. No local read of this population.'
  feasibility:
    source: none
    accrual_basis: Fixed in-hand window; nothing accrues.
evidence_class:
  holdout: in_sample
  claim: edge
decision_rule:
  id: RULE-RQ-20261125-1e06-11
  registered_at: '2026-11-25'
  registered_before_run: true
  statistic: 'index_signal_etf_harness.py unit RQ-20261125-1e06-11: family capitulation_credit (capitulation_wide kept where x_credit_ok: credit_ok_series on FRED
    BAA10Y, last observation strictly before the signal date <= the median of its trailing 252 observations; False without a full window) on the
    1e06-07 pairs (1x execution, baseline flat), 2000-01-01..2010-05-28 (the pre-sample window); POOLED grade; the timing control (200 re-timed replays, shifts 40-400 sessions, same
    stop geometry, TP and cost) is a RULE CLAUSE. Cost stack: 5 bps slippage per side (2x slippage re-read), the ETF price series itself (expense
    embedded), no funding; TP = K* calibrated on the first 60% of in-window trades, never tp_r 50.'
  rule: 'PASS IFF pooled n>=25 AND pooled net_r>0 AND >=4 of 8 pairs net_r>0 AND pooled net_r>0 under 2x slippage AND pooled actual net_r beats >= 95%
    of the 200 re-timed draws; INDETERMINATE if pooled n<25; FAIL otherwise. The (RQ-20261125-1e06-10, RQ-20261125-1e06-11) PAIR passes only if both
    units PASS; either FAIL fails the pair.'
  pass_action: If BOTH units pass, report to the manager as the evidence for adding the credit gate to the INDEX-CAPIT-1X-LEG spec (a Tier-3 proposal
    input, applied by the operator or a mandate).
  fail_action: Record macro (SMA200 and credit) gating closed for the capitulation leg; the leg stays as specified; the next ETF iteration moves to the
    leg's exit side (TP doctrine K* per ticker re-fit as a fresh-window read) or to new populations.
  proposal_mapping: both pass -> manager proposal input; any fail or indeterminate -> the next iteration from its diagnosis.
  what_it_does_not_do: Changes no config. NO local read of either window preceded this registration.
  baseline: Flat; the ungated trigger on the same pairs is reported in 1e06-07 / 1e06-09 context, never re-graded here.
