  needs_gpu: false
  peak_memory_gb: 6.0
  est_minutes: 150
  why_runner: Alpaca market data (read-only, paper key) exists only on research-script-run; LightGBM fits on ~0.37M rows.
  basis: 'MEASURED analogue: RQ-20261107-98e3-06 (same command without the flag) ran within its 330-min budget on a 4 vCPU / 16 GB runner.'
