id: RQ-20261117-43b6-04
title: 'ITERATION 2 of ltr-tp-pull-in (ed2b-05 FAIL: the risk cut was the act, not the timing): does a TP pull-in at an INFORMATIVE trigger (near_target,
  new_peak, structure_break) beat a random-time pull-in under RULE-AM-RISK-ADJUSTED-V1?'
status: done
cadence: once
theme: live_strategy
priority: 2
roadmap:
- L-ATM
programme: P1
kind: experiment
question: Over the committed Stage-0 per-trade corpora (8 legs; legs with a fictional TP, tp_r >= 10, excluded and named by the harness), does tp_pull_in
  (TP replaced at the next bar by a limit keeping 50% of the open-to-TP distance) at the first near_target, new_peak or structure_break trigger cut maxDD
  or weekly CVaR5 by >= 15% at <= 0.05 R/trade net of the full cost stack, hold in >= 4 of 6 folds, and beat the same pull-in at a random bar?
why_this_matters: 'ltr-tp-pull-in is an orphan (iteration_orphans.py 2026-11-17): iteration 1 (RQ-20261113-ed2b-05) FAILED and nothing iterated from it.
  On PASS: a discovery, then ONE confirmation on a holdout population with real TPs (the holdout legs of 43b6-01 declare tp_r 50 and cannot serve; the confirmation
  needs a real-TP holdout corpus, filed with the result). On FAIL: tp_pull_in has been read on 6 of 10 triggers with no informative timing; with R4 failing
  on timing twice, the class goes to a lever-exhaustion family review rather than another trigger sweep.'
iteration:
  subject: ltr-tp-pull-in
  subject_kind: ltr_class
  from_result: research/results/RQ-20261113-ed2b-05/43492527084.jsonl
  verdict_read: fail
  diagnosis: 'RQ-20261113-ed2b-05 (3,527 priced trades): momentum_flip passed R1 (cost 0.0071 R/trade), R2 (maxDD cut 15.3%) and R3 (4 of 6 folds) but FAILED
    R4: 0 of 200 random-time pull-ins beaten, edge vs random -0.042 R (Bonferroni CI [-0.065, -0.018]). giveback (edge -0.044) and stall failed R2/R3. So
    the risk cut comes from pulling the TP in at ALL, not from when: the tested triggers are state-of-weakness triggers whose timing carries negative information
    (a random time does better). The untested triggers that carry positive timing information in sibling classes are near_target (partial_close@near_target
    edge vs random +0.34 R, CI95 [+0.31, +0.38], ed2b-01) and new_peak (sl_to_structure@new_peak beat 200 of 200 random books, ed2b-03); structure_break
    is the remaining untested state trigger. The tp_keep bound (0.5) is held fixed: R4 compares the same keep at a random time, so changing keep cannot
    fix a timing failure.'
  search: trigger family, the 3 untested triggers with positive timing evidence in sibling classes, at the fixed tp_keep 0.5 of iteration 1; arm denominator
    3 (+ hold); cumulative 6 triggers for this class
  levers:
  - trigger
  map_entries:
  - research/levers/ltr-tp-pull-in.yaml
  - research/levers/ltr-partial-close.yaml
  - research/levers/ltr-sl-to-structure.yaml
  attempt: 2
  due_by: '2026-11-24'
