decision_rule:
  id: RULE-RQ-20261117-43b6-04
  registered_at: '2026-11-17'
  registered_before_run: true
  statistic: 'Over the pooled committed Stage-0 per-trade corpora in comms/strategy_evidence/ltr_corpus (legs with tp_r >= 10 excluded and named), per pre-registered
    trigger T in {near_target, new_peak, structure_break}: the book with the TP replaced at bar j0+1 by a limit keeping 50% of the distance from that bar''s
    open to the declared TP (a closer limit fills before the recorded exit or not at all; SL-first on the recorded exit bar), vs the HOLD book, against
    200 matched random-time pull-ins on the same trades.'
  rule: 'RULE-AM-RISK-ADJUSTED-V1 (am_risk_adjusted.grade_risk_adjusted, V1 parameters: R1 r_cost <= 0.05 R per baseline trade; R2 maxDD cut >= 15% OR weekly-CVaR5
    cut >= 15%; R3 >= 4 of 6 calendar folds hold; n_floor 39) with R4 vs 200 matched random-time books (min_control_beat_frac 0.9833), plus L1: a pass must
    keep r_cost <= 0.05 R/trade after dropping the leg with the largest favourable contribution. Reported, never graded: the B3 best static rule (hold +
    the registered trigger arms, chosen leave-one-fold-out) and each candidate''s margin over it. Three pre-registered candidates (n_comparisons 3, Bonferroni
    1 - 0.05/3), so R4 uses 0.9833 and the reported edge CI is at 0.9833; the 3 triggers of ed2b-05 are disclosed as prior reads (cumulative 6). PASS: at
    least one trigger clears R1-R4 and L1 (a discovery). It is a SCREEN pass (per-trade R books, graduation_eligible false until BOOK-SIM-REAL-SIZER): a
    Tier-3 proposal input for the class''s status, never an apply. FAIL: every candidate fails a read necessary clause (R1, R2 or R3) or is beaten by its
    random control (R4). INDETERMINATE: anything else, i.e. the best candidate is under the n floor, never fired, carried by one leg (L1 fails), or no trade
    could be priced (read_state no_data). Fixed now; not changed after a run.'
  what_it_does_not_do: 'Advice-only research: serves, promotes or applies nothing; adds no gate; changes no config, mandate or roster; places no order.'
practice_precedent: 'T1 (docs/reference/trading-and-model-practice-principles.md): an intervention is graded against a matched random-intervention control
  in the same trade, net of the full cost stack, per class (RULE-AM-RISK-ADJUSTED-V1); same harness and design as RQ-20261113-ed2b-01/-03/-05.'
