practice_precedent: 'T-G1 (docs/research/practice-review-2026-11-18.md): book-level exposure read as one bet; week-block bootstrap for autocorrelated
  daily outcomes.'
what_it_does_not_do: Proposes no gate, cap or sizing change; places no order.
