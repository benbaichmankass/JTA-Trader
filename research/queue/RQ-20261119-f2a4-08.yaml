# Hand-authored 2026-11-19 by lane PROGRAMME-REPLAN-20261119 (session_01AFoLuJ2Mx5E1JEVEWziCcb) from perf review 2026-11-18 call G4
# (manager-named build). Rule registered BEFORE any run of the harness on the export. Gates this adds or changes: none.
id: RQ-20261119-f2a4-08
title: 'Cross-book SAME-DIRECTION concentration on the LIVE journal (perf review 2026-11-18 call G4): does the number of open positions sharing
  one direction at 00:00 UTC predict a worse next-24 h book return, over every closed trade since 2026-09-01 (the population the backtest read
  in #27202 did not touch)?'
status: done
cadence: once
theme: live_strategy
priority: 2
roadmap:
- L-LADDER
kind: experiment
question: 'On the daily 00:00 UTC grid of scripts/research/codirection_drawdown.py (the perf-followup harness, PR #27202) run with --journal on
  the committed live-journal export comms/research/codirection/2026-11-19.jsonl (1,231 closed non-backtest trades on every book, 2026-09-01..2026-11-19),
  is the Spearman rho between cdir = max(#open long, #open short) and the cohort''s next-24 h outcome negative, on both sum and mean (the scale
  control), and below the direction-shuffle placebo?'
why_this_matters: '#27202 read the same question on the committed BACKTEST corpora (rho(sum_r) about +0.12, no negative association); that read
  is already taken and is not re-graded here. The live books are a different population (paper + real, live fills, the 2026-11-18 FOMC cluster
  where 15 of 22 open paper positions were short) and no run has read this export. PASS -> a Tier-1 concentration readout to the manager with
  this rho and a sizing (never gating) follow-up unit; FAIL -> concentration carries no measurable next-day cost on the live books either and
  G4 closes with both records. No gate is proposed either way.'
origin: new_hypothesis
origin_reason: 'Correlated same-direction exposure is one bet sized as many: when the common factor moves, every leg loses at once (risk-parity
  and portfolio-heat practice). Whether OUR books show it at a daily horizon is unmeasured.'
levers_declared:
- portfolio (same-direction concentration count; measured, not acted on)
power:
  expected_n: 78
  min_detectable_effect: 0.35
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'A rank correlation is already standardised (entered as sd of the rank scale). MEASURED: the export spans ~80 days, so ~78 daily snapshots
    and ~11 week blocks; at 78 points and power 0.8 the detectable |rho| is ~0.32, so smaller associations read INDETERMINATE, not FAIL. The harness
    defaults (200 snapshots / 30 blocks) are sized for the 8-year corpora; this unit registers 45 / 8 for the live window before any run.'
  feasibility:
    source: none
    accrual_basis: Reads a committed journal export pinned at 2026-11-19; nothing accrues.
decision_rule:
  id: RULE-RQ20261119f2a408-CODIRECTION
  registered_at: '2026-11-19'
  registered_before_run: true
  statistic: 'scripts/research/codirection_drawdown.py --journal comms/research/codirection/2026-11-19.jsonl --min-snapshots 45 --min-blocks 8
    (min-legs 6, min-cohort 3, 2,000 draws, seed 20261119: the harness defaults): rho(cdir, sum) and rho(cdir, mean) with week-block bootstrap
    95% CIs, and the direction-shuffle placebo p05.'
  rule: 'PASS iff the harness grades "hit": rho(sum) CI upper < 0 AND rho(mean) CI upper < 0 AND rho(mean) < placebo p05. FAIL iff not PASS and
    the rho(sum) CI lower bound > -0.10 (no material negative association). INDETERMINATE otherwise, or when the harness grades indeterminate
    (< 45 snapshots or < 8 week blocks). The outcome column is the journal''s per-trade pnl_percent (return on notional) carried as net_r with
    y_kind ret_pct_on_notional_not_R, NOT R: the journal''s stop_loss is the current, possibly trailed, stop, so an R from it would be biased;
    stated in the result. Thresholds fixed now; not changed after a run.'
  what_it_does_not_do: Proposes no gate, cap or sizing change; places no order. A PASS supports a READOUT and a follow-up study, nothing else.
compute: cpu_light
value:
  bucket: own_losses
  usd_at_stake_per_month: 60
  confidence: 0.15
  basis: portfolio drawdown clustering on the paper and real books; an estimate, not a measurement
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 1.0
  est_minutes: 5
  basis: A daily grid over ~1,200 trades, a 2,000-draw bootstrap and a 2,000-draw placebo; seconds to a minute of CPU.
  why_runner: Reads a committed file only; short, so the runner (kaggle_first applies above 30 min).
run:
  command:
  - python3
  - scripts/research/codirection_drawdown.py
  - --journal
  - comms/research/codirection/2026-11-19.jsonl
  - --min-snapshots
  - '45'
  - --min-blocks
  - '8'
  - --unit
  - RQ-20261119-f2a4-08
  - --out
  - '{out_dir}'
  timeout_minutes: 30
  inputs:
    research_unit: RQ-20261119-f2a4-08
lands:
