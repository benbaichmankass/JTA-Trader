# Hand-authored 2026-11-19 by lane PROGRAMME-REPLAN-20261119 (session_01AFoLuJ2Mx5E1JEVEWziCcb) from perf review 2026-11-18 call G4
# (manager-named build). Rule registered BEFORE any run of the harness on the export. Gates this adds or changes: none.
id: RQ-20261119-f2a4-08
title: 'Cross-book SAME-DIRECTION concentration (perf review 2026-11-18 call G4): does the number of open positions sharing one direction
  at 00:00 UTC predict a worse next-24 h equal-weight book return, over every closed trade since 2026-09-01?'
status: queued
cadence: once
theme: live_strategy
priority: 2
roadmap:
- L-LADDER
kind: experiment
question: 'On a daily 00:00 UTC grid over the committed journal export comms/research/codirection/2026-11-19.jsonl (1,231 closed non-backtest
  trades on every book, 2026-09-01..2026-11-19), is the Spearman rank correlation between C(t) = max(#open long, #open short) and Y(t)
  = the summed return-on-notional of trades closing in (t, t+24h] negative, with a week-block bootstrap 95% CI excluding 0?'
why_this_matters: 'Decision it changes: whether a portfolio readout of same-direction concentration (perf-followup Track 4, a report,
  never a gate) is evidence-backed. At the 2026-11-18 FOMC 15 of 22 open paper positions were short across crypto, metals and equities.
  PASS -> the readout goes to the manager as a Tier-1 report with this rho, and a book-level de-concentration study (sizing, not gating)
  is the next unit; FAIL -> concentration carries no measurable next-day cost on this book and the item closes with this record. No
  gate is proposed either way (operator rule: no new gates).'
origin: new_hypothesis
origin_reason: 'Correlated same-direction exposure is one bet sized as many: when the common factor moves, every leg loses at once (risk-parity
  and portfolio-heat practice). Whether OUR books show it at a daily horizon is unmeasured.'
levers_declared:
- portfolio (same-direction concentration count; measured, not acted on)
power:
  expected_n: 78
  min_detectable_effect: 0.35
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'A rank correlation is already standardised (|rho| 0.35 is entered as 0.35 sd of the rank scale; at 78 points and power 0.8 the detectable |rho| is ~0.32, so smaller associations will read INDETERMINATE, not FAIL). MEASURED: the export spans ~80 days, so ~78 daily points (non-overlapping 24 h outcomes); week-block bootstrap over ~11 weeks.
    under 45 days the unit grades INDETERMINATE.'
  feasibility:
    source: none
    accrual_basis: Reads a committed journal export pinned at 2026-11-19; nothing accrues.
decision_rule:
  id: RULE-RQ20261119f2a408-CODIRECTION
  registered_at: '2026-11-19'
  registered_before_run: true
  statistic: 'scripts/research/codirection_drawdown.py run --population all: Spearman rho(C, Y) on the daily grid with a week-block
    bootstrap 95% CI (4,000 draws, seed fixed); rho(C, |Y|) and rho(C, worst-decile Y) reported.'
  rule: 'PASS iff rho(C, Y) < 0 with the CI upper bound < 0 on >= 45 daily points. FAIL iff the CI lower bound > -0.10 (no material
    negative association). INDETERMINATE otherwise, or under 45 daily points. Y is summed per-trade return on notional (the journal''s
    pnl_percent), NOT R: the journal''s stop_loss is the current, possibly trailed, stop, so an R from it would be biased; stated in
    the result. Thresholds fixed now; not changed after a run.'
  what_it_does_not_do: Proposes no gate, cap or sizing change; places no order. A PASS supports a READOUT and a follow-up study, nothing
    else.
compute: cpu_light
value:
  bucket: own_losses
  usd_at_stake_per_month: 60
  confidence: 0.15
  basis: portfolio drawdown clustering on the paper and real books; an estimate, not a measurement
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 1.0
  est_minutes: 5
  basis: A daily grid over ~1,200 trades and a 4,000-draw bootstrap; seconds of CPU.
  why_runner: Reads a committed file only; short, so the runner (kaggle_first applies above 30 min).
run:
  command:
  - python3
  - scripts/research/codirection_drawdown.py
  - run
  - --trades
  - comms/research/codirection/2026-11-19.jsonl
  - --population
  - all
  - --unit
  - RQ-20261119-f2a4-08
  - --rule-id
  - RULE-RQ20261119f2a408-CODIRECTION
  - --registered-at
  - '2026-11-19'
  - --out
  - '{out_dir}'
  timeout_minutes: 30
  inputs:
    research_unit: RQ-20261119-f2a4-08
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
ml_consumer:
  not_applicable: 'Not an ML unit: a portfolio concentration association study.'
intervention_controls:
  not_applicable: an observational association read, not an in-trade action
practice_precedent: 'T-G1 (docs/research/practice-review-2026-11-18.md): book-level exposure read as one bet; week-block bootstrap for
  autocorrelated daily outcomes.'
what_it_does_not_do: Proposes no gate, cap or sizing change; places no order.
