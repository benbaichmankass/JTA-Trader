id: RQ-20261014-4a4c-07
title: 'P4-Q2 family: does the CORE CPI m/m surprise vs the PIT survey consensus predict ES=F forward returns at 1-5 trading days? (n~138)'
status: done
cadence: once
theme: macro
priority: 2
kind: experiment
question: Using survey-consensus PIT rows only (live + survey backfill merged, earliest observed_at wins), is Spearman(core_cpi_mom surprise, ES=F forward return from the release-day
  close) negative with |t_eff| >= 2.4 at h=1, 3 or 5?
why_this_matters: Inflation-surprise family, untested kind (cpi_mom FAILED in RQ-20261013-1414-12; ppi_mom PASSED in RQ-20261014-de02-04). Core is the print the Fed reads; if the PPI
  drift is an inflation-surprise channel, core CPI is the likeliest second member. Adds 3 tests to the P4 event family (13 kinds x 3 horizons landed -> 15 x 3 = 45); the programme reads
  the family with BH, not this unit alone.
power:
  expected_n: 138
  min_detectable_effect: 0.2
  effect_units: sd
  design: one_sample
  alpha: 0.01
  power: 0.8
  basis: '138 releases with a defined surprise (88 non-zero; consensus and actual are both 0.1-step so ties are frequent, which Spearman tie-averages). rho 0.20 at alpha 0.01 needs ~292:
    UNDERPOWERED BY DESIGN, it can PASS only on a larger effect.'
  feasibility:
    source: none
    accrual_basis: n is bounded by the resolved releases of this kind with a defined survey surprise on file (fixed historical backfill, MEASURED 2026-10-14 via load_resolved_events_multi
      over the two committed files); the run prints the joined count.
decision_rule:
  id: RULE-RQ-20261014-4a4c-07
  registered_at: '2026-10-14'
  registered_before_run: true
  statistic: ic_t_eff at horizons 1, 3, 5 (macro_event_study_run.py grade()).
  rule: PASS IF at some horizon in {1,3,5} with n >= 100, |ic_t_eff| >= 2.4 AND the IC is negative. FAIL IF every horizon has n >= 100 and none does (a significant WRONG-sign horizon
    is reported, not a pass). INDETERMINATE IF any horizon has n < 100.
  what_it_does_not_do: A PASS is evidence for a confirmation set like RQ-20261014-4a4c-01..06, not a leg and not a config change. Daily closes only.
compute: cpu_light
value:
  bucket: information
  usd_at_stake_per_month: 80
