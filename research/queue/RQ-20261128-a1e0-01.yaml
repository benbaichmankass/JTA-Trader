question: On the 60-perp frozen universe, 8 dev folds, net of fee + slippage 3 + funding 1 bps/8h, the side is sign(ret_168) and the model (elastic-net
  logistic regression, penalty chosen on 3 time-ordered inner folds of each training span, quantile-normalised features, train-median fill) predicts
  P(net R of that side > 0); take iff P > 0.5. Does it beat taking the rule's trade every time by >= +0.010 R/decision (week-clustered t >= 2.24)
  AND beat a random take at the same rate by >= +0.010, on >= 6 of 8 folds and >= 3 of 4 years? The LightGBM classifier twin is run and reported,
  not graded.
