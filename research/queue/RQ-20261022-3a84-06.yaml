id: RQ-20261022-3a84-06
title: 'Trend-direction confirmation, slv_pullback_1d: does requiring the DI or EMA-slope direction filter beat the declared setting net of the full cost
  stack?'
status: queued
cadence: once
theme: regime
priority: 2
kind: experiment
question: On the full history up to 2026-10-22, same cost stack and same harness argv builder as the evidence builder, does either pre-registered --direction-filter
  arm on slv_pullback_1d (DI = di, SL = slope) beat the leg as declared by >= 1.0 R, with no worse drawdown and in at least 3 of 4 calendar folds? Arm values
  are fixed here before any run; offline Stage-0 re-measurement, never a book decision.
why_this_matters: Theme regime (weight 5) held 4 runnable units on 2026-10-22 against a computed share of 11 (research-slo theme_share_min_ratio 0.31; health
  check H1-THEME). The --direction-filter axis of scripts/backtest_pullback.py has no unit in research/queue/ (grep -- "--direction-filter" = 0 on 2026-10-22)
  and is absent from the committed adx_max / vol-skip / side-filter siblings RQ-20261017-ae17-01..28. Lane RESEARCH-HEALTH-W43. A lone pass is a LEAD, confirmed
  on a disjoint window before any Tier-3 proposal.
power:
  expected_n: 40
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'd=0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo''s standing E35 floor). expected_n=40 is an ESTIMATE, not a measurement: the baseline
    count over the full history is not committed for slv_pullback_1d; below 39 baseline trades the unit grades indeterminate (underpowered), never FAIL,
    and that outcome is itself the finding (the leg cannot support this axis). The R bar is a MATERIALITY bar over the whole window, not a significance
    test; the 3-of-4 calendar-fold majority refuses a one-period artifact.'
  feasibility:
    source: none
    accrual_basis: Re-measurement on freshly fetched keyless candles (slv_pullback_1d); the harness replays history, nothing accrues.
decision_rule:
  id: RULE-RQ20261022-3A84-06-DIRFILTER
  registered_at: '2026-10-22'
  registered_before_run: true
  statistic: 'Per arm, from the harness''s own --json summary of scripts/backtest_pullback.py (argv built by regime_debt_matrix.build_harness_cmd plus the
    arm''s tokens; full cost stack: fee + resolved slippage + funding, never a zero default): total_trades, net_total_r, max_drawdown_r, plus net_r per
    fold over FOUR equal calendar spans (same boundaries every arm). Arms: B = leg as declared; DI = --direction-filter=di; SL = --direction-filter=slope.
    Per candidate C: dR = net_r(C) - net_r(B); dDD = maxDD(C) - maxDD(B); fold_wins = folds in which C out-earns B.'
  rule: 'indeterminate IF n(B) < 39 (underpowered: no verdict, extend the window or redesign; never FAIL on thin n). A candidate C PASSES iff dR >= 1.0
    R AND dDD <= 0 AND fold_wins >= 3 of 4. PASS IF any candidate passes (best = highest dR): a LEAD, followed by ONE confirmation unit on a disjoint window
    with the same statistic and bar; only a confirmed pass becomes a Tier-3 PROPOSAL note on the owning checklist row for the manager, never a config edit.
    Two passing candidates within 0.5 R of each other is a preference, not a finding. FAIL IF none passes: the declared setting stands; the axis is recorded
    honest_negative on this history. The bar, the drawdown clause, the 3-of-4 fold majority, the 39 floor and the arm values are not changed after any result.'
  what_it_does_not_do: 'Does not mine values: the arm values are fixed here and may not be edited after seeing any result. Does not edit config, and a single-leg
    pass is a LEAD only. Does not test any other axis.'
  min_n: '39'
compute: cpu_light
value:
  usd_at_stake_per_month: 30
  confidence: 0.15
  bucket: structural
  basis: 'stand-in: small edge on a live/mirror/paper leg from one pre-registered entry-direction setting; estimate, not a measurement.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 20
  basis: One keyless candle fetch of the full history and 4 harness passes over it; GitHub-hosted runner, no trainer data (same shape as RQ-20261014-f0e2-09..13
    and RQ-20261016-c56e-16).
