  - --arm
  - SL=--direction-filter=slope
  - --days
  - '7300'
  - --end
  - '2026-10-22'
  - --grade
  - sweep
  - --baseline
  - B
  - --delta-r
  - '1.0'
  - --fold-majority
  - '3'
  - --n-floor
  - '39'
  - --out
  - '{out_dir}'
  timeout_minutes: 60
  inputs:
    research_unit: RQ-20261022-3a84-06
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
  note: research/results/RQ-20261022-3a84-06/<run_id>.jsonl via the batch collector; per-arm summaries and verdict.json under comms/research/RQ-20261022-3a84-06/<run_id>/.
