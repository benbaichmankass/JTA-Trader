question: On 2020-10-13 .. 2023-10-12 23:59 (disjoint from, and immediately preceding, the committed record's window), is trend_donchian_sol_4h at its configured
  params net-positive with >= 4 of 6 calendar folds net > 0, at n >= 39?
why_this_matters: 'BREADTH for the real-money crypto book. trend_donchian_sol_4h is off every roster yet carries the strongest 4h record in the repo (+45.3
  R, n=116 on 2023-10..2026-10); RQ-20261014-470a-10''s arm B measured +36.9 R, n=83, 4/4 folds on 2022-10..2024-10 -- but that window OVERLAPS the record
  by a year. This is the clean disjoint test: if it passes, the leg has Stage-0 evidence on six years and is a re-entry case under MD-PROMOTE-S0-S1 (bybit_1
  soak), subject to the same-symbol overlap with trend_donchian_sol_prop on bybit_2 (programme node P3-Q8-sol4h-overlap).'
power:
  expected_n: 115
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'd=0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo''s standing E35 floor). expected_n=115 is an ESTIMATE: the 1095d record''s 116 trades
    over 3 yr give ~39/yr x 3 yr. SOLUSDT lists on Binance 2020-08-11, so 2020-10-13 leaves a two-month warm-up. Folds 6 (half-years), majority 4.'
  feasibility:
    source: none
    accrual_basis: Re-measurement on freshly fetched keyless candles over a pinned historical window; nothing accrues.
decision_rule:
  id: RULE-RQ20261016c56e15
  registered_at: '2026-10-16'
  registered_before_run: true
  statistic: 'ONE arm B = the leg exactly as declared in config/strategies.yaml (argv built by regime_debt_matrix.build_harness_cmd; full cost stack fee
    + resolved slippage + funding via execution_costs.resolve_cost_policy), graded by exit_lever_ablation.py --grade stage0: net_total_r, n, max_drawdown_r,
    and net_r per fold over 6 equal calendar spans of the window. Reported, not graded: net_r_per_capital_day. NO positive control: no committed record
    exists on this window (it is disjoint from and immediately precedes the leg''s record), the precedent being RQ-20261014-470a-01; the argv is built by
    the same builder the committed record used, from the same config keys.'
  rule: 'indeterminate IF n(B) < 39 (underpowered: no verdict, never FAIL on thin n). PASS IF net_r(B) > 0 AND >= 4 of 6 calendar folds net > 0: the leg
    has Stage-0 evidence on two disjoint windows -- a re-entry case under MD-PROMOTE-S0-S1 (bybit_1 soak), routed through the manager after the same-symbol
    overlap read. FAIL IF n >= 39 and that does not hold: the record''s window carries the edge alone -- the leg stays off every roster and the breadth
    lead is recorded honest_negative. Windows are never pooled with the committed record''s; the record keeps its own grade. The 0 R bar, the 4-of-6 fold
    majority and the 39 floor are not changed after any result.'
  what_it_does_not_do: Does not edit config or any roster, does not tune (one arm, as declared), does not pool windows. Not a promotion case.
