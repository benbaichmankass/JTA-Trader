priority: 2
roadmap:
- L-PROGRAMMES
programme: P6
kind: experiment
question: On 2020-06-01..2024-06-30 (Binance USD-M archive, point-in-time top-20), does any of FS1 (keep a short only while its trailing-7d
  settled funding >= 0), FS2 (only while >= the 0.01%/8h base rate) or FL1 (drop a long while trailing funding > 3x base) clear the unchanged
  discovery rule at the cumulative trial count, against the T4 control?
why_this_matters: 'tsmom-crypto is an orphan (scripts/research/iteration_orphans.py 2026-11-13: no live iteration unit). Operator 2026-11-01:
  nothing that failed is closed; attribute first, choose the next test from the lever map. Attempt 2 tested regime, rebalance and universe;
  the short leg still lost in every arm, and funding (the largest cost item, ~5x fees) was never used as a signal.'
iteration:
  subject: tsmom-crypto
  subject_kind: strategy_leg
  from_result: research/results/RQ-20261101-d1f3-01/41776294812.jsonl
  verdict_read: fail
  diagnosis: 'RQ-20261101-d1f3-01 (attempt 2; 7 arms incl. control, daily net, 2020-06-01..2024-06-30, n_days=1491, DSR N_cum=16): every
    arm FAILS; the SHORT leg is net-negative in ALL 7 (control -0.127, R1 BTC-gated shorts -0.054, F1 -0.078, U1 -0.133) while the long leg
    is +0.64..+1.01. Best arms U1 (Sharpe 0.994, h2 0.357, DSR 0.58) and R2 (0.979, h2 0.471, DSR 0.57) fail on DSR. Discovery attribution
    (RQ-20261101-58e4-01): net 0.61 = gross 0.79 - funding 0.15 - fee+slip 0.03; worst months 2023-01, 2022-07, 2020-09 are reversals.
    CAUSE (hypothesis): the short leg enters names whose funding is already negative (crowded shorts) and gets squeezed in reversals, a
    PER-SYMBOL crowding effect that a market-level BTC gate cannot see; and longs pay the funding drag when crowded. COMPETING: shorts lose
    to crypto''s structural upward drift (beta); then a funding filter only approaches long-only (T8 1.07 ~ BTC buy-and-hold 1.06 = beta,
    not edge) and FS1/FS2 add nothing beyond deleting shorts.'
  hypothesis: per-symbol funding (crowding) separates the short trades that earn from the ones that get squeezed, and crowded longs are where
    the funding drag is paid
  search: 'direction x cost: funding-aware side filter (FS1 shorts if trailing-7d funding >= 0; FS2 >= 0.0003/day; FL1 longs off if > 0.0009/day)'
  levers:
  - direction
  - filter
  attempt: 3
  due_by: '2026-11-20'
  map_entries:
  - research/levers/tsmom-crypto.yaml
baseline:
  what: control A0 = discovery primary T4 (lookbacks 28/56/112 d, sleeve vol 0.40, long-short, weekly rebalance, top-20), re-run in the same
    invocation
  net_of: fee 11.0 bps round trip (execution_costs.resolve_fee_bps_roundtrip) charged per side + slippage 3 bps round trip + SIGNED settled
    funding (long pays, short receives); stress arm = 2x fee+slippage
  committed_value: net Sharpe 0.761, halves 1.373 / -0.036, DSR 0.396 at N=16, side net sums long +0.735 / short -0.127 (RQ-20261101-d1f3-01
    A0)
power:
  expected_n: 1491
  min_detectable_effect: 1.4
  effect_units: annualised_sharpe
  sd: 19.105
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'n=1491 daily net returns (2020-06-01..2024-06-30); the harness annualises with 365 days, so sd=sqrt(365)=19.105 converts an annualised
    Sharpe to a per-observation d. One-sample, alpha 0.05, power 0.8: required n = 7.84*365/S^2, so at n=1491 the smallest annualised Sharpe
    separable from zero is ~1.4. That is above the 0.5 bar, which is why the rule is the absolute registered rule with a cumulative-N DSR,
    not a delta against the control (an arm-vs-control difference below ~0.7 Sharpe is not separable).'
  feasibility:
    source: none
    accrual_basis: Fixed historical archive (data.binance.vision, capped at 2024-06 by edge_data.MAX_MONTH); nothing accrues.
decision_rule:
  id: RULE-RQ-20261113-62e3-01
  registered_at: '2026-11-13'
  registered_before_run: true
  statistic: 'ARMS (4 incl. control, all counted; grid fixed in scripts/research/edge_portfolio_discovery.py ITER_GRIDS["62e3"]["tsmom"]):
    A0 = T4 control; FS1 = A0 with a short kept only while the symbol''s trailing-7d mean daily settled funding (through t-1) >= 0; FS2 =
    same with threshold 0.0003/day (= 0.01%/8h); FL1 = A0 with a long dropped while that trailing funding > 0.0009/day. Unknown funding leaves
    a position unchanged. Per arm: net Sharpe, stress Sharpe, half Sharpes, stationary-bootstrap p05 of annualised mean, DSR at N_cum = 20
    (9 discovery + 7 attempt-2 arms + these 4).'
  rule: 'PASS iff at least one NON-control arm clears the UNCHANGED discovery rule: net Sharpe >= 0.5 AND stress (2x fee+slippage) Sharpe >
    0 AND Sharpe > 0 in BOTH halves AND bootstrap p05 of annualised mean net > 0 AND DSR > 0.95 at N_cum = 20, on 2020-06-01..2024-06-30.
    FAIL iff the control computed and reproduced and no arm clears it (FS1, FS2 and FL1 on T4 did not clear the rule; their response is written to the lever map). INDETERMINATE iff the control series is insufficient (< 200 days) OR the control A0 net Sharpe misses the committed 0.761 by
    more than 0.01 (--expect-control-sharpe; harness or data drift is not a verdict). The side split and by-year sums are REPORTED, not graded.
    Holdout not read. A PASS earns ONE holdout read (HOLDOUT-LOCK), never a book.'
  what_it_does_not_do: Edits no config and no roster, places no order, proposes no live leg, reads no data after 2024-06-30. A FAIL says only that
    these three funding-filter configs on T4 did not clear the rule.
