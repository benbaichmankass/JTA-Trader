# Hand-authored 2026-11-13 by lane orphans-legs (Tier 1), dispatched by the manager. ITERATION unit (attempt 3) for orphan subject tsmom-crypto, authored from a written diagnosis of its last result (RQ-20261101-d1f3-01). Decision rule registered BEFORE any run (this commit precedes the run; the author ran the harness on a SYNTHETIC panel only, no real-data arm number seen). Gates: none.
id: RQ-20261113-62e3-01
title: 'ITERATION 3 of tsmom-crypto (fail): does a funding-aware side filter (shorts only while not paying / not crowded; longs off when crowded)
  lift the T4 crypto trend portfolio, net of fee + slippage + signed funding?'
