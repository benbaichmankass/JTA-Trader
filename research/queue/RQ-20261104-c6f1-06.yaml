cadence: once
roadmap:
- L-ATM
- M20
theme: live_strategy
priority: 1
kind: experiment
practice_precedent: T3 (net of the full cost stack) + T9 (on trend legs the TP doctrine requires MEASURING the cost of a target,
  not assuming it); binding source docs/ARCHITECTURE-CANONICAL.md § TP doctrine; holdout design = PROMOTION-BAR-HOLDOUT-1016
  (exit_lever_ablation.py --grade holdout).
question: 'iaum_pullback_1d is on alpaca_live real money (its mirror twin on alpaca_portfolio is the gold proxy gld_pullback_1d)
  and FAILS tp-doctrine-guard on tp_revision (rule_undeclared); entry TP 3.5R declared (tp_intent r_multiple, family-pooled
  K*) (scripts/ci/check_tp_doctrine.py on main 745bcf758, 2026-11-04). Candidates: tp_extend (registered live rule) anchored
  at the declared 3.5R: extend 1R (X351) and 0.5R (X3505). Baseline B = the declared static 3.5R target (--tp-target-r=3.5).
  Selected on the discovery span only and read ONCE on a later held-out span, does a candidate beat B?'
why_this_matters: 'Operator decision 2026-11-04 (weekly planning popup, relayed by Manager Session 2026-11-04a): ''Yes, test
  all 6 (Recommended)'' -- every non-compliant REAL-MONEY leg gets ONE pre-registered TP test. Prior tests on this leg: RQ-20261015-cab7-06
  (family-pooled K*, indeterminate); RQ-20261101-5e01-01 (structure SL+TP, indeterminate, n 38). None held a span back from
  selection; this one does, so a PASS here is the evidence record a Tier-3 declare needs and a FAIL closes these configurations
  honestly.'
