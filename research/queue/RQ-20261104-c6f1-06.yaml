id: RQ-20261104-c6f1-06
title: 'TP doctrine, real money, HELD-OUT: does a predictive take-profit (X351, X3505) selected on the earlier span of iaum_pullback_1d''s
  history beat its current exit on a later span selection never saw, net of the full cost stack?'
