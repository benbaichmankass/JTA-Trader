  expected_n: 60
  min_detectable_effect: 0.63
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: '(1.96 + 0.8416)^2 / 0.63^2 = 19.8 trades -> the registered discovery floor 20 / held-out floor 12. MEASURED: IAUM
    alone holds 38 baseline trades 2021-07..2026-10 (research/results/RQ-20261101-5e01-01, arm A) -- too few for any held-out
    design. This unit runs the config-exact GOLD TWIN (--symbol GLD, every other field unchanged; IAUM and GLD hold the same
    bullion) from 2018-07 on the dukascopy lane. INFERRED ~60 trades; the floors are registered low and the MDE says what
    that costs.'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
evidence_class:  # EVIDENCE-CLASS-BACKFILL 2026-11-11, rule E1 (scripts/research/backfill_evidence_class.py)
  holdout: holdout_window
  claim: edge
decision_rule:
  id: RULE-RQ20261104c6f106-TP-HOLDOUT
  statistic: 'scripts/research/exit_lever_ablation.py --grade holdout on iaum_pullback_1d, window 2018-07-01 .. 2026-11-03
    23:59, net of the full cost stack the harness resolves per venue (execution_costs.resolve_cost_policy: fees + slippage
    + funding; recorded per arm as cost_stack). Every arm runs once over the whole window. The boundary is fixed from B''s
    ENTRY TIMES before any outcome is read: the latest 25% of the window, grown in 1% steps until it holds 12 of B''s entries,
    capped at 40%. DISCOVERY = trades whose entry AND exit precede the boundary, cut into 4 equal calendar folds (multi-fold
    walk-forward); HELD-OUT = trades entered on/after it (no overlap; straddlers excluded). Per arm: n, net R, per-fold net
    R, max DD R, by_outcome. Reported, not graded: tp_share = by_outcome.take_profit / n.'
  rule: 'ELIGIBLE on discovery iff n >= 20, net R > 0 and >= 3 of 4 discovery folds net-positive; the eligible arm with the
    highest discovery net R is SELECTED (a tie goes to B). PASS iff ALL of: (1) the selected arm is a candidate (X351, X3505),
    not B; (2) its held-out n >= 12 and held-out net R > 0 (harness label confirmed); (3) on the SAME held-out span its net
    R >= B''s held-out net R (paired read of arms/<label>__trades.jsonl, read once, no re-selection). FAIL iff B is selected
    (the declared exit wins discovery), or the harness labels no_discovery / not_replicated, or clause 3 fails. INDETERMINATE
    iff insufficient_discovery or underpowered (a power shortfall, never evidence against the leg). The negative control XU
    (--tp-thesis unknown: the extension never fires) MUST equal B in n and net R over the whole window; if it does not, the
    run is INVALID (harness defect), not a verdict, and XU is never a candidate even if the harness selects it. PASS -> doctrine
    read: tp_share(selected) >= 0.10 on the held-out span, else forwarded as ''P&L without a reachable prediction'', not a
    declare; otherwise ONE Tier-3 proposal on row TP-DECLARE-ALPACA-PB1D: tp_revision: {rule: tp_extend, extend_r: <sel>,
    approach_frac: 0.85, max_extends: 3} on iaum_pullback_1d (and its mirror proxy by the alpaca superset rule), bybit/alpaca
    live + mirror in one revertible PR, operator''s approval. Thresholds are not changed after any result. A FAIL closes these
    configurations, never the family (research-ops § D).'
  what_it_does_not_do: Edits no config, places no order. The leg's ENTRY params were chosen on windows that overlap both spans;
    the held-out span is independent of the TP selection made here, not of the leg's construction. A one-leg per-trade-R read,
    not the book simulation.
