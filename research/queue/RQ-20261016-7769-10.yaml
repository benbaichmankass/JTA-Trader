id: RQ-20261016-7769-10
title: 'P4-Q2 rates channel (sleeve IEF/TLT): does the nfp survey surprise predict ZN=F forward returns from the release-day close at h=3 trading days (negative
  sign, |t_eff| >= 2.4, n~140)?'
status: done
cadence: once
theme: macro
priority: 2
kind: experiment
question: Over nfp releases with a point-in-time survey consensus (live + survey backfill, 2015-01..2026-10), is the overlap-corrected Spearman IC of (surprise,
  ZN=F forward return from the release-day close) NEGATIVE with |ic_t_eff| >= 2.4 at h=3 trading days, n >= 100?
why_this_matters: 'Rates channel, labour: a strong payrolls print -> higher yields -> lower note price. BH family: the P4 event family held 45 IC tests
  (15 kinds x 3 horizons) before this lane; this lane adds 19 units graded at ONE primary horizon each (h=3, where the PPI parent is strongest), so the
  family is 64 tests and the BH rank-1 threshold is 0.05/64 = 0.00078 (|t| ~3.36). A PASS at the unit''s own bar is therefore a LEAD that must clear its
  own placebo and sub-period rungs (pre-registered in research/programmes/04-macro-sleeve.yaml), never an axis on its own.'
power:
  expected_n: 140
  min_detectable_effect: 0.25
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'Unit = one release with a defined surprise; 140 on file (MEASURED 2026-10-16 with econ_event_study.load_resolved_events_multi over the two committed
    snapshot files (releases with a defined survey surprise, before the price join; the run prints the joined count)). Floor at the unit''s own bar |t|
    >= 2.4: ((2.4+0.84)/0.25)^2 = 168 at d=0.25: NOT cleared (underpowered by design, stated). Monthly releases with h<=5 trading days never overlap, so
    releases are not autocorrelated by construction.'
  feasibility:
    source: none
    accrual_basis: 'n is bounded by the resolved releases on file (a fixed historical backfill 2015-01..2026-10, ~12/yr accrue). Not an accrual: a short
      join lands INDETERMINATE, never padded.'
decision_rule:
  id: RULE-RQ-20261016-7769-10
  registered_at: '2026-10-16'
  registered_before_run: true
  statistic: 'scripts/research/macro_event_study_run.py grade(): ic_t_eff and n at the primary horizon 3 (horizons 1,3,5 reported).'
  rule: 'PASS IF at h=3 (the one pre-registered horizon; h=1/5 are reported, never graded) n >= 100 and |ic_t_eff| >= 2.4 AND the IC is negative. FAIL IF
    n >= 100 and not PASS (a significant wrong-sign IC is reported in the note and is not a pass). INDETERMINATE IF n < 100. no_data/producer_failed: a
    route fault, not a verdict.'
  what_it_does_not_do: 'An IC is not money: a PASS starts this kind''s own placebo and sub-period rungs (programme nodes P4-Q2-nfp-zn-placebo/-early/-late)
    and never feeds a conviction axis, a config or a leg by itself. Daily closes only; no intraday reaction is measured.'
