  rule: 'INDETERMINATE IF n(A) < 39 or IF every candidate arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C) > net_r(A) AND delta
    >= 0.02 R x n(A) AND net R(C) >= net R(A) in >= 4 of 6 folds AND maxDD(C) <= maxDD(A) x 1.35. PASS IF one or more pass: the best by net R is named (the denominator
    is the 2 candidate arms here) and the follow-up is ONE confirmation unit on a disjoint window, then a live-producer check and a Tier-3 declare PROPOSAL with the
    mirror in the same PR, never a config edit. FAIL IF none passes with n(A) >= 39: THIS arm grid is closed on ict_scalp_sol_15m for this window and the lever FAMILY
    is NOT retired (scripts/research/family_retirement_policy.yaml); the record names the arm that moved closest. Thresholds and the arm grid are not changed after
    any result.'
  statistic: 'scripts/research/exit_lever_ablation.py --leg ict_scalp_sol_15m --grade replace, window 2025-10-05 .. 2026-10-04 23:59, 6 equal calendar folds by entry
    time, net of the full cost stack the harness resolves per venue (execution_costs.resolve_cost_policy, recorded per arm as cost_stack). Arms fixed now: A = the
    leg as declared in config/strategies.yaml; candidates AX40, AX50. Per arm: n, net_total_r, max_drawdown_r, net R per fold.'
  what_it_does_not_do: 'Edits no config and no roster, places no order, is not a promotion case. A PASS also needs a live producer for the lever and a Tier-3 declare.
    The arm grid is the whole search: no arm is added after the run, and the baseline is the declared leg, not a tuned one.'
