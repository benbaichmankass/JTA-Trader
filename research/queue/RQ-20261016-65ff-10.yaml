id: RQ-20261016-65ff-10
title: 'Regime good-vs-bad, trend_donchian_xrp_4h: does a pre-registered cold-volatility tail skipped at entry (ATR percentile) (VL10, VL20, VL30) beat
  the leg as declared net of the full cost stack on 2022-10-13..2026-10-10?'
status: queued
cadence: once
theme: regime
priority: 1
kind: experiment
question: 'Same harness argv builder as the evidence builder (regime_debt_matrix.build_harness_cmd), full cost stack, pinned window 2022-10-13 .. 2026-10-10
  23:59: does any of the 3 pre-registered arms (VL10 = --vol-skip-below-pctl=0.1, VL20 = --vol-skip-below-pctl=0.2, VL30 = --vol-skip-below-pctl=0.3) beat
  trend_donchian_xrp_4h as declared (arm B) by >= 2.0 R with no worse drawdown and in >= 3 of 4 calendar folds? This asks whether the market condition at
  entry (the cold-volatility tail skipped at entry (ATR percentile)) separates the leg''s good trades from its bad ones well enough to gate on -- REGIME-PROGRAM
  deliverable 3. DISCLOSED: trend_donchian_xrp_4h DECLARES vol_skip_above_pctl 0.9 and skip_hours 0; every arm keeps those and adds the cold-tail skip.'
why_this_matters: trend_donchian_xrp_4h trades real money (bybit_2 + bybit_portfolio mirror, bybit_1 paper). The volcold axis has no committed unit for
  this leg (coverage read from research/queue on 2026-10-16 by lane P2-AI-REGIME-BACKLOG-1016). Regime theme weight is 5 with 0 regime units queued (L-REGIME
  'where'); this is the per-leg good-vs-bad trade condition study the operator asked for on 2026-10-11. A null is recorded honest_negative so the axis is
  not re-asked.
power:
  expected_n: 46
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'd=0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo''s standing E35 floor). expected_n=46 is an ESTIMATE: the committed 1460d record (n=46,
    short-only leg); the window is pinned to that record. Below 39 baseline trades the unit grades indeterminate (underpowered), never FAIL. The R bar is
    a MATERIALITY bar over the whole window, not a significance test; the 3-of-4 calendar-fold majority refuses a one-period artifact.'
  feasibility:
    source: none
    accrual_basis: Re-measurement on freshly fetched keyless Binance Vision candles over a pinned window; the harness replays history, nothing accrues.
decision_rule:
  id: RULE-RQ2026101665ff10-REGIME-VOLCOLD
  registered_at: '2026-10-16'
  registered_before_run: true
  statistic: 'Per arm, from the harness''s own --json summary (argv built by regime_debt_matrix.build_harness_cmd plus the arm''s tokens; full cost stack:
    fee + resolved slippage + funding via execution_costs.resolve_cost_policy, never a zero default): total_trades, net_total_r, max_drawdown_r, plus net_r
    per fold over FOUR equal calendar spans (same boundaries every arm). Arms: B = leg as declared; VL10 = --vol-skip-below-pctl=0.1; VL20 = --vol-skip-below-pctl=0.2;
    VL30 = --vol-skip-below-pctl=0.3. Per candidate C: dR = net_r(C) - net_r(B); dDD = maxDD(C) - maxDD(B); fold_wins = folds in which C out-earns B. Also
    reported per arm, not graded: net_r_per_capital_day (the programme headline measure).'
  rule: 'indeterminate IF the positive control fails (arm B must reproduce the committed record within 2% n / 0.5 R) or n(B) < 39 (underpowered: no verdict,
    never FAIL on thin n). A candidate C PASSES iff dR >= 2.0 R AND dDD <= 0 AND fold_wins >= 3 of 4. PASS IF any candidate passes (best = highest dR):
    a LEAD only -- the follow-up is a fresh-window confirmation unit on the disjoint preceding window with the single chosen arm (the 470a-10 pattern),
    never a config edit; two passing arms within 0.5 R of each other is a preference, not a finding. FAIL IF none passes: the declared setting stands; the
    axis is recorded honest_negative for this leg on this window. The 2.0 R bar, the drawdown clause, the 3-of-4 fold majority and the 39 floor are not
    changed after any result.'
  what_it_does_not_do: 'Does not mine values: the arms are fixed here and may not be edited after any result. Does not edit config/strategies.yaml, config/regime_policy.yaml
    or any roster; a pass is a lead/packet for the manager (Tier-3), never a promotion case. Live/paper P&L plays no part. Tests no other axis.'
