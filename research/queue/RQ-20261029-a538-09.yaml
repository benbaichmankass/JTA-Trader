id: RQ-20261029-a538-09
title: 'Volatility regime cell on xrp_pullback_2h (real money): does a top-vol skip at 0.95 or 0.90 beat the declared leg net of cost?'
status: queued
cadence: once
roadmap:
- L-REGIME
theme: regime
priority: 3
kind: experiment
question: On xrp_pullback_2h over 2020-07-01..2026-10-15 23:59, does vol_skip_above_pctl=0.95 (V95) or 0.90 (V90) beat the declared leg (A) by
  >= 0.02 R x n(A), in >= 4 of 6 folds, with maxDD <= 1.35 x A?
why_this_matters: ada_pullback_2h carries vol_skip_above_pctl 0.95 and xrp_pullback_2h (the sibling real-money leg) does not; the live-vs-backtest
  audit shows the pair BELOW_BACKTEST. A vol cell is one candidate for the gap and is cheap to measure.
power:
  expected_n: 120
  min_detectable_effect: 0.02
  effect_units: r_per_trade
  sd: 0.9
  design: paired
  alpha: 0.05
  power: 0.5
  basis: Declared leg n >= 39 is the unit floor; at sd ~0.9 R per trade a 0.02 R/trade bar is NOT powered for n ~ 120 (ESTIMATE), so a PASS is
    a discovery lead and a FAIL closes the configuration only; folds 6.
  feasibility:
    source: none
    accrual_basis: Re-measurement on freshly fetched public candles over a pinned window; nothing accrues.
decision_rule:
  id: RULERQ20261029A53809
  registered_at: '2026-10-29'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg xrp_pullback_2h --grade replace, window 2020-07-01 .. 2026-10-15 23:59, 6 equal calendar
    folds by entry time, net of the full cost stack the harness resolves per venue (execution_costs.resolve_cost_policy, recorded per arm as cost_stack).
    Arms fixed now: A = the leg as declared in config/strategies.yaml; candidates V95, V90. Per arm: n, net_total_r, max_drawdown_r, net R per
    fold.'
  rule: 'INDETERMINATE IF n(A) < 39 or IF every candidate arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C)
    > net_r(A) AND delta >= 0.02 R x n(A) AND net R(C) >= net R(A) in >= 4 of 6 folds AND maxDD(C) <= maxDD(A) x 1.35. PASS IF one or more pass:
    the best by net R is named and the follow-up is ONE confirmation unit on a disjoint window (a PASS on one window is a discovery; the denominator
    is the number of candidate arms in this unit), then a live-producer check and a Tier-3 declare PROPOSAL with the mirror in the same PR, never
    a config edit. FAIL IF none passes with n(A) >= 39: THIS arm grid is closed on xrp_pullback_2h for this window and the family is NOT retired;
    the record names the arm that moved closest. Thresholds and the arm grid are not changed after any result.'
  what_it_does_not_do: 'Edits no config and no roster, places no order, is not a promotion case. A PASS also needs a live producer for the lever
    and a Tier-3 declare. The arm grid is the whole search: no arm is added after the run, and the baseline is the declared leg, not a tuned one.'
intervention_controls:
  not_applicable: a parameter-width ablation of the declared entry/exit geometry run through the harness, not an in-trade action or active-management
    intervention
compute: cpu_light
routing:
