  needs_gpu: false
  peak_memory_gb: 4.0
  est_minutes: 40
  why_runner: Fetches keyless public candles for a pinned window; reads no trainer data; CPU only.
  basis: Estimate from comparable exit_lever_ablation runs of 2026-10-26..29; the first run replaces it.
