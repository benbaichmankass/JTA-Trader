question: 'On ict_scalp_xrp_5m over 2020-02-01 .. 2021-11-13 23:59 (disjoint from the 2021-11-14 .. 2026-11-17 window of RQ-20261118-abab-37), does the ONE arm abab-37 named best, S_LATE (--skip-hours=20,21,22,23), beat the declared leg A by the same registered bar (net R higher, delta >= 0.02 R x n(A), >= 4 of 6 folds, max drawdown <= 1.35 x A''s), net of the harness cost stack? The first window graded S_LATE PASS under the registered rule (net R -111.73 vs A -186.48, n(A) 764, 4/6 folds, run 44576895535, re-graded from the raw arm trades); this unit asks whether that survives out of window.'
why_this_matters: 'abab-37''s registered PASS rule names ONE confirmation unit on a disjoint in-hand window before any live-producer check or Tier-3 declare proposal. Decision changed: PASS -> a live-producer check for the session lever on ict_scalp_xrp_5m and a Tier-3 declare PROPOSAL (with the mirror in the same PR, never a config edit); FAIL -> the abab-37 PASS is not confirmed and no proposal is drafted. Note the declared leg is deeply net-negative on the first window (A -186 R), so a PASS here is ''less negative'', not an edge claim.'
