kind: experiment
question: RQ-20261018-ef5d-04 (daily trend-pullback, pullback_frac 0.5/0.618, six perps pooled) graded FAIL. Over 2020-01-01..2026-10-22 on 6
  cells (BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,ADAUSDT,AVAXUSDT) at 1d, does any candidate arm (A15, L100, L100A) of the pullback harness pass the pooled
  Stage-0 rule with breadth AND beat the baseline arm B by >= 0.05 R/trade pooled? The pre-registered hypothesis is that a multi-month trend definition
  makes the daily pullback a trend-continuation trade.
why_this_matters: 'Operator directive 2026-10-22: an idea that failed one test is not dead; it failed the first test. This unit is a registered
  VARIANT of that first test. First test: RQ-20261018-ef5d-04 (daily trend-pullback, pullback_frac 0.5/0.618, six perps pooled) graded FAIL. DIAGNOSIS
  (one line): the daily pullback tested only the pullback depth (frac 0.5, 0.618) at the default 40-bar trend lookback: with 6 cells x ~6 y of
  daily bars the entry count is small and the 40-day ''trend'' it pulls back within is shorter than the multi-month crypto trends a daily hold
  targets, so the lookback and a trend-strength floor were the untested levers. Lane AUTHOR-FLOOR-1022 (research runnable floor 33 vs 65 at 17:40Z).
  Prior ids: RQ-20261018-ef5d-04. theme timeframes was short in the 17:40Z health check.'
power:
  expected_n: 120
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: Pooled floor 39 (d = 0.45, as the failed first test registered for the daily bar) trades (d = 0.3 at alpha 0.05 / power 0.8, the repo's
    standing floor for this family of units); expected_n=120 is an ESTIMATE from the first test's per-cell counts (cited in the question's prior
    ids), not a measurement for the variant arms; below the floor the unit grades indeterminate, never FAIL.
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ20261022-4B82-19-PULLBACK-1D-LOOKBACK
  registered_at: '2026-10-22'
  registered_before_run: true
  statistic: 'scripts/research/harness_stage0.py --family pullback --timeframe 1d, arms fixed now: B=; A15=--adx-min=15; L100=--trend-lookback=100;
    L100A=--trend-lookback=100;--adx-min=15; baseline B; per cell and pooled across 6 cells; flags --folds 6 --fold-majority 4 --n-floor 20 --pooled-n-floor
    39 --breadth-frac 0.5 --baseline B --delta-r-per-trade 0.05; cost = the harness venue-aware fee + slippage + funding stack (execution_costs.resolve_cost_policy),
    recorded per cell.'
  rule: 'Arms and thresholds are fixed now and are not changed after any result. A candidate PASSES iff it passes the pooled Stage-0 rule (pooled
    n >= 39, pooled net_r > 0, >= 4 of 6 calendar folds net positive, >= half of the powered cells pass) AND beats B''s pooled net R/trade by
    >= 0.05 R. PASS IF one or more candidates pass: the best by pooled net R is named and the follow-up is ONE confirmation unit on a disjoint
    window with the same statistic and bar (a pass on one window is a lead), then the prop/real-money SUPERSET ladder; never a roster edit. FAIL
    IF every candidate fails (n >= floor) -> this variant is closed on this window and the record names which arm moved closest, so the next variant
    is aimed. INDETERMINATE IF pooled n < 39 or fewer than half the cells measured (a fetch/harness fault is recorded per cell, never dropped).'
  what_it_does_not_do: Edits no config and no roster, places no order, is not a promotion case. A best-of-k arm is a LEAD (programme 03 rung S0-C),
    never a finding. Candles are Binance USD-M (a PROXY for Bybit linear); the funding term is a directionless magnitude (execution_costs P1);
    both are stated in the record. Does not pool with any committed record.
