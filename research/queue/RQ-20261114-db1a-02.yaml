id: RQ-20261114-db1a-02
title: 'DEMO-FLOOR regime-level unit: is the record-year loss common across the 15 crypto testing pullback/trend legs, and does a 1-D trend-regime cell separate it (picked
  on the record year, held on the year before, walk-forward stable drag)?'
status: queued
cadence: once
kind: experiment
theme: live_strategy
priority: 1
roadmap:
- L-LADDER
question: 'Across the 15 crypto testing (bybit_1 demo-floor) pullback and Donchian trend legs, each config-exact on its LIVE decision bar, net of the full cost stack: (A) is
  the 2025-11-13..2026-11-12 loss common (>= 2/3 of legs negative, pooled negative)? (B) does one (ADX trend regime, direction) cell, chosen on that record year, also lose
  on the year before and read stable_drag under regime_cell_walkforward''s fixed fold panel?'
why_this_matters: 'Manager ruling 2026-11-14 05:10Z after db1a-01: the per-leg lever failures are the WINDOW, and lever responses flip sign between years (5/10). If the loss
  is a common regime, the fix is a regime gate across legs, not per-leg tuning; if a cell separates it, the 2-D (trend, vol) walk-forward with trainer vol labels is the next
  unit (regime-selectivity Rules 2-3). If not, per-leg dispositions (incl. retirement proposals) follow.'
power:
  expected_n: 1800
  min_detectable_effect: 0.2
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'MEASURED order of magnitude: the forming records carry about 50-105 trades per leg-year (f251-21/22/23, db1a-01), so about 1,000 per window across 15 legs; a selected
    cell must reach n >= 30 on the record window and n >= 10 on the prior window, and the walk-forward applies MIN_DIRECTION_TRADES = 10.'
  sd: null
  feasibility:
    source: none
    accrual_basis: Fixed in-hand windows; nothing accrues; Binance / Binance-vision covers them at run time.
evidence_class:
  holdout: in_sample
  claim: edge
