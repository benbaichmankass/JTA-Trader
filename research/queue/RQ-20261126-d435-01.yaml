why_this_matters: The lever map reads `timeframe` as not tested for slv_trend_1h. If the edge only exists
  on one bar size it is more likely a fit to that bar size's history than a property of the setup; if
  it holds on a twin it is a lead for a population-level pooled test (never a per-symbol decision).
power:
  expected_n: 50
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d=0.45 -> 39 trades at alpha 0.05 / power 0.8 (the E35 floor). expected_n 50 is an ESTIMATE from
    comparable single-leg Stage-0 windows, not a measurement of this twin; below the 39 floor the unit
    grades INDETERMINATE, never FAIL.
  feasibility:
    source: none
    accrual_basis: Re-measurement on freshly fetched public candles over a pinned window; nothing accrues.
      Bybit-hosted symbols may land producer_failed on a GitHub runner (known geoblock), recorded honestly
      rather than retried.
decision_rule:
  id: RULE-TPL-LEG-TWIN-TIMEFRAME-STAGE0
  statistic: exit_lever_ablation.py --leg slv_trend_1h --arm A= --timeframe 2h --grade stage0 --baseline
    A, 4 calendar folds, net of the full cost stack (execution_costs.resolve_cost_policy, the leg's own);
    reports n, net R, maxDD and net R per fold.
  rule: PASS IF net R > 0 AND n >= 39 AND >= 3 of 4 folds net-positive (the harness stage0 grade). FAIL
    IF n >= 39 and that does not hold. INDETERMINATE IF n < 39 or the producer failed. A PASS or FAIL
    is a reading of the leg's lever map for `timeframe` (counted in iteration.multiple_testing), never
    a promotion, a demotion or a retirement; a FAIL closes THIS twin, not the lever family. Thresholds
    are not changed after any result.
  what_it_does_not_do: Edits no config or roster and places no order. Per-symbol results never gate (operator
    2026-11-04); a population claim needs its own pooled test.
  registered_at: '2026-11-26'
  registered_before_run: true
