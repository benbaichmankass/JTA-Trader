  R n=715): the live prop edge sits on ETH/SOL 1h at the live params, and the default channel is too short for 2h; this is the 2h half of variant
  01. Lane AUTHOR-FLOOR-1022 (research runnable floor 33 vs 65 at 17:40Z). Prior ids: RQ-20261011-6897-01, RQ-20261011-1fce-02, RQ-20261011-8025-04.
