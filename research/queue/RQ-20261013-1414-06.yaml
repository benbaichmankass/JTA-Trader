id: RQ-20261013-1414-06
title: 'Frontier / tabular foundation models at small n: TabICL and TabPFN (research-eval) vs LightGBM on a 3,000-row regime head (BTC
  15m tail, MES 1d)'
status: done
cadence: once
theme: ml_health
priority: 2
kind: experiment
question: 'When the training set is small by construction (last 3,000 BTC 15m bars; MES daily history), do the pretrained tabular in-context
  learners TabICL and TabPFN beat LightGBM by >= 0.01 macro-F1 under purged CV on BOTH datasets? This is the regime-head half of frontier-scan
  idea #2 that does NOT need the 300 labelled setups RQ-20261011-9da8-02 waits for.'
why_this_matters: 'FRONTIER-LEVER-TRAINER-DEPS is done: tabicl 2.2.0, tabpfn 9.1.0 and catboost are importable on the trainer, but NO
  bake-off has exercised those arms yet (the lever row says so). tabular_foundation_model has 0 registered models. The meta-label wall
  (~99 closed trades) is the project''s binding constraint and these learners are pretrained for exactly small n, so this is the cheapest
  honest first look, and it also proves the arms run (arm_status) before 9da8-02 is unblocked. DATASET PATHS UNVERIFIED FROM THIS SANDBOX:
  the trainer shards are not reachable here. The 15m v002 BTC/ETH/SOL shards and the base feature names are the ones queued unit RQ-20261012-75b2-19..21
  already declare (MEASURED present on the trainer 2026-10-11 per RQ-20261011-9da8-01); a missing column lands as a dead NaN feature
  or producer_failed, which research-ops must read as a ROUTE FAULT (fix the path, re-queue), never as a verdict. TabPFN weights are
  Prior Labs non-commercial (license:other): an offline research arm ONLY; the engine flags research_only and serving one is an operator
  licence decision. TabPFN/TabICL weights are fetched from the Hugging Face Hub on first use: if the trainer cannot reach it the arm
  errors and the verdict is INDETERMINATE (a FAIL requires every arm evaluated), not a FAIL.'
power:
  expected_n: 600
  min_detectable_effect: 0.1
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: tail_rows 3000 with min_train_frac 0.4 leaves ~1,800 out-of-sample rows over 5 folds (~360 per fold) per dataset; d=0.1 paired
    needs 785 rows, so each dataset alone is UNDERPOWERED on rows and the rule requires the same-direction CV mean on BOTH datasets
    instead of a significance test on one. Autocorrelation makes the true requirement higher.
  feasibility:
    source: none
    accrual_basis: 'Fixed by construction (tail_rows 3000 / the MES history length): n does not grow with waiting, so an underpowered
      result is reported as such and the follow-up is the larger meta-label dataset in 9da8-02, not a re-run.'
decision_rule:
  id: RULE-RQ20261013-1414-06-TABULAR-FM-SMALL-N
  registered_at: '2026-10-13'
  registered_before_run: true
  statistic: Paired per-fold macro-F1 difference (candidate minus LightGBM) on identical purged folds (5, embargo 96 rows for BTC 15m
    / 5 for MES via the shared embargo setting, min_train_frac 0.4); mean over folds, per dataset.
  rule: PASS IF a candidate (tabicl or tabpfn) beats LightGBM by >= +0.010 macro-F1 on the CV mean on BOTH datasets (feature-lift gate
    only; a PASS earns the meta-label unit 9da8-02 a higher priority and a licence question for the operator if the winner is TabPFN).
    FAIL IF no candidate reaches >= 0 vs LightGBM on any dataset AND both arms were evaluated (a FAIL closes only these two checkpoints
    at n~3k on these 5 features). INDETERMINATE otherwise, or if folds < 3, or an arm is unavailable/errored.
  min_n: 3 usable CV folds per dataset; reported n_rows per dataset (MES may hold fewer than 3,000 rows).
  what_it_does_not_do: 'Serves nothing, registers nothing, touches no config. TabPFN is research-eval only: a TabPFN PASS is an operator
    licence decision before ANY live use. Says nothing about the meta-label head, trade P&L, or larger n.'
compute: needs_vm_data
value:
  bucket: frontier
  usd_at_stake_per_month: 200
  confidence: 0.2
  basis: 'stand-in: if a pretrained tabular learner wins at n~3k it is the candidate for the ~99-trade meta-label head (the label wall);
    not a measured P&L'
routing:
  needs_trainer_resident_data: true
  needs_gpu: false
  peak_memory_gb: 5.0
  est_minutes: 120
  basis: 'Estimate, NOT measured: TabICL/TabPFN in-context fit+predict on ~1.8k-row train folds x 5 folds x 2 datasets on 1 OCPU; torch
    CPU working set. Re-declare from the first run.'
ml_bakeoff:
  task: classification
  metric: macro_f1
  dataset:
    kind: jsonl
    groups:
      BTCUSDT_15m_last3000:
        path: datasets-out/market_features/BTCUSDT/15m/v002/data.jsonl
      MES_1d:
        path: datasets-out/market_features/MES/1d/v002/data.jsonl
    ts_col: ts
    target: regime_label
    features:
    - rolling_log_return_vol
    - log_return
    - log_return_lag_1
    - log_return_lag_2
    - dayofweek
    tail_rows: 3000
  cv:
    folds: 5
    embargo_rows: 96
    min_train_frac: 0.4
  baseline: lgbm
  controls:
  - prior
  - logit
  candidates:
  - tabicl
  - tabpfn
  learners:
    prior:
      kind: prior
    lgbm:
      kind: lightgbm
      params:
        n_estimators: 150
        learning_rate: 0.05
        num_leaves: 15
        min_child_samples: 20
    logit:
      kind: numpy_logit
    tabicl:
      kind: tabicl
      params: {}
    tabpfn:
      kind: tabpfn
      params: {}
      weights_note: Prior Labs non-commercial weights (license:other); offline research evaluation only
  rule:
    min_folds: 3
    pass_if:
    - group:
      - BTCUSDT_15m_last3000
      - MES_1d
      vs: baseline
      window: cv
      op: '>='
      value: 0.01
    fail_if_no_candidate_reaches:
    - group: any
      vs: baseline
      window: cv
      op: '>='
      value: 0.0
run:
  command:
  - python3
  - scripts/research/ml_bakeoff.py
  - --unit
  - '{unit}'
  - --out
  - '{out_dir}'
  timeout_minutes: 300
  inputs:
    research_unit: RQ-20261013-1414-06
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
roadmap:
- M25
related:
- RQ-20261011-9da8-02
- FRONTIER-LEVER-TABULAR
- FRONTIER-LEVER-TRAINER-DEPS
- docs/research/frontier-scan-2026-10-11.md
last_dispatched_at: '2026-10-14T07:33:56+00:00'
grading:
  auto: true
  awaiting: more_data
  decision_rule_id: RULE-RQ20261013-1414-06-TABULAR-FM-SMALL-N
  evidence:
  - research/results/RQ-20261013-1414-06/38488362215.jsonl
  - research/results/RQ-20261013-1414-06/38529192993.jsonl
  graded_at: '2026-10-14'
  grader: scripts/research/queue_grade.py
  note: 'indeterminate is the pre-registered under-powered/null outcome: complete, but NOT a pass and
    NOT a kill'
  reason: 1 row(s), all measured, all indeterminate (1 earlier producer_failed / re-graded wiring_only
    row(s) superseded)
  rows: 1
  verdict: indeterminate
