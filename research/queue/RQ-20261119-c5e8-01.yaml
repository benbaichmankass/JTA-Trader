title: 'POOLED 1d-ETF pullback DIRECTION (cells IEF, TLT, SLV, GLD, GDX; arms BOTH / LONG-only / SHORT-only): does restricting the pullback family to one side beat both sides pooled, net of the full cost stack?'
status: done
cadence: once
theme: regime
priority: 2
kind: experiment
question: 'On daily bars of IEF, TLT, SLV, GLD and GDX (Dukascopy proxies, 2021-07-01..2026-10-15, the abab-38 window), does the pullback family at its harness-declared parameters read better pooled across the five cells when entries are restricted to LONG only or SHORT only (arms LONG, SHORT) than with both sides (baseline A), by at least 0.02 R per trade, with pooled net R > 0 and >= 4 of 6 calendar folds net positive?'
why_this_matters: 'abab-38 asked the DIRECTION question on ief_pullback_1d alone and was INDETERMINATE (n 33 < 39); the same window is shared by the sibling 1d legs, so the standing doctrine (STRUCTURE-EXITS-DEFAULT) is one pooled 1d-ETF population. PASS -> a per-leg direction confirmation on a disjoint window, then a Tier-3 declare proposal; FAIL -> this configuration (the pooled five-cell population at one shared parameter set, arms LONG and SHORT) is closed for direction and abab-38 is retired by record. It tests the pullback harness at one shared parameter set; it does not test any leg''s own declared parameters (they differ per leg).'
