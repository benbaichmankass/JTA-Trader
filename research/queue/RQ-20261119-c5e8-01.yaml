  baseline: 'Arm A = both sides, the pullback family at its harness-declared parameters, same cells, window, folds and cost stack as the candidates.'
  statistic: 'scripts/research/harness_stage0.py --family pullback, cells IEF, TLT, SLV, GLD, GDX on 1d bars, arms A (both sides), LONG (--side-filter=long), SHORT (--side-filter=short); per arm the pooled trades, pooled net R (full venue-aware cost stack the harness resolves per symbol), net R by calendar fold (6), net R per trade, one-sided t p-value; baseline A.'
  rule: 'A candidate arm PASSES iff pooled n >= 60 AND pooled net R > 0 AND >= 4 of 6 calendar folds net positive AND at least half the measured cells with n >= 20 pass their own cell rule AND its pooled net R per trade beats arm A by >= 0.02 R. INDETERMINATE for an arm with pooled n < 60 or fewer than half the five cells measured. Verdict: pass iff any candidate passes (the best by pooled net R is named; the denominator is 2 candidate arms); indeterminate iff none passes and any arm is indeterminate; fail iff both candidates fail. Thresholds, cells, window and arm grid are fixed now and not changed after any result.'
  pass_action: 'ONE per-leg direction confirmation unit on a disjoint window for the leg(s) whose own cell carries the effect, then a Tier-3 declare PROPOSAL with the mirror in the same PR; never a config edit. abab-38 is re-armed on the pooled lead.'
  fail_action: 'record the direction arms LONG and SHORT as tested at this pooled 1d-ETF configuration (research/levers/ief_pullback_1d.yaml and the sibling 1d legs); retire abab-38 by record. Nothing beyond this configuration is ruled out by this unit (family_retirement_policy.yaml).'
  what_it_does_not_do: 'Edits no config and no roster, places no order, is not a promotion case. It does not test any leg''s own declared parameters. The arm grid is the whole search: no arm is added after the run.'
