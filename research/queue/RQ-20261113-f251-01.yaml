- PI-20260929-VOLSKIP-SIGNAL-0002
practice_precedent: 'R5 + M10 (docs/reference/trading-and-model-practice-principles.md): rule registered before the run, net of the full cost stack, graded once on
  fixed in-hand windows; the same forming-bar re-measure RQ-20261113-1449-01 ran for the equity leg tqqq_trend_long_1d.'
follow_up: On a measured verdict a session reads <out_dir>/evidence/*.json and copies the faithful records to comms/strategy_evidence/ (Tier 1). Per-leg FAILs go
  to the manager via AM-ML.
