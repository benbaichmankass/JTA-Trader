    all net of the full cost stack (execution_costs.resolve_cost_policy); the control''s own n, net R and fold signs are reported in verdict.json (the standing walk-forward
    reading).'
  rule: 'PASS (a LEAD for a holdout read, never a setting change here) IF some donchian-30 + adx arm beats control A by >= 4.0 R
    with maxDD no worse than A and >= 3 of 4 folds, at that arm''s n >= 39 and A n >= 39; and it is net positive in >= 3 of 4
