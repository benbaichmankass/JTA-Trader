    The ungated d30 arm is not re-run: d5a7-14 measured it (+14.57 R, maxDD +16.98 R vs A) and it is the reference this lever is
    read against. INDETERMINATE IF A n < 39 or the producer failed. Arm denominator = 3 (5 distinct arms in the family with d5a7-14).'
