id: RQ-20261117-dc44-04
title: 'fade_breakout_4h: on the donchian 30 lead, does a stricter chop gate (adx_max 15 / 17.5 vs the configured 20) remove the
  fold-3 stop streak that failed d5a7-14 on maxDD, net of the full cost stack (iteration, one factor on top of donchian 30)?'
status: queued
cadence: once
kind: experiment
theme: live_strategy
priority: 2
roadmap:
- L-LADDER
practice_precedent: 'M2, M4 (docs/reference/trading-and-model-practice-principles.md): walk-forward on fresh data against a rule registered before the run; one-factor
  sensitivity before combinations'
question: 'With donchian 30 fixed (the d5a7-14 lead), does lowering adx_max from 20 to 17.5 or 15 (one factor) make the leg clear
  the SAME rule d5a7-14 applied against the config-exact control A: net R +4.0 R or more, maxDD no worse, and 3 of 4 calendar
  folds, net of the full cost stack, over the 1830-day window?'
why_this_matters: 'ITERATION of d5a7-14 (graded FAIL 2026-11-17). Its donchian_30 arm was +14.57 R over control A and won 3 of 4
  folds, but maxDD was worse by 16.98 R, so it failed the rule only on drawdown. If a regime gate removes the drawdown without
  removing the edge, the lead becomes a holdout candidate. If it does not, the donchian 30 lead is a single regime-lucky window.
  On PASS: ONE confirmation on pre-development history (RESEARCH-NO-WAIT order 1) before any Tier-3 note. On FAIL: the
  regime-gating response on d30 goes into the lever map, and the direction family (shorts carried the fold-3 loss) is next. Arm
  denominator: 3 here (A and two adx arms), 5 distinct arms in the family counting d5a7-14.'
