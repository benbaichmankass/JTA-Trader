id: RQ-20261015-1631-02
title: 'Same-symbol allocation, XRPUSDT: which of trend_donchian_xrp_4h, xrp_pullback_2h earns the single position slot on bybit_1, bybit_2, bybit_portfolio?'
status: queued
cadence: once
theme: live_strategy
priority: 2
kind: experiment
question: With 2 legs rostered on one (bybit_1/bybit_2/bybit_portfolio, XRPUSDT) and one net position per symbol on a one-way venue, does running
  them TOGETHER under the live election beat the best single leg alone, by OOS net R per capital-day, net of the full cost stack? If not, which
  single leg should hold the slot?
why_this_matters: 'Operator, 2026-10-15: ''If we''re running the same strategy and symbol on 2 different timeframes, than we need to make sure
  that we know how to allocate the trades properly (and not, say alphabetically), or we need to choose the better one based on testing on run
  with that one''. MEASURED by the manager: src/runtime/intents.py::_election_sort_key ranks by -confidence (about 50% exact ties), then declared
  priority, then 3-day realized PnL, then timestamp, then the NAME — no backtest-quality term. Roster inventory by lane SAME-SYMBOL-ALLOCATION
  over config/accounts.yaml x config/strategies.yaml symbols (HEAD of 2026-10-15). One test serves three (account, symbol) groups: the same two
  legs on bybit_1 (paper), bybit_2 (real money) and bybit_portfolio (its mirror). The verdict must be applied to bybit_2 and bybit_portfolio together
  (mirror equality is test-enforced).'
power:
  expected_n: 40
  min_detectable_effect: 0.5
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'Unit = OOS closed trade per arm; min_oos_trades 20 per arm is a floor on ranking, not a significance claim. The rule is a deterministic
    argmax over a stated metric on a fixed history, so no effect size is tested: the arms are RANKED and a starved arm yields indeterminate. Bars
    are autocorrelated; treat a narrow margin as unsettled.'
  feasibility:
    source: none
    accrual_basis: No observed per-leg OOS trade count for the combined election arm exists; the first run reports each arm's n_oos, and an arm
      below 20 returns indeterminate rather than a winner.
decision_rule:
  id: RULE-RQ-20261015-1631-02-SAME-SYMBOL-H2H
  registered_at: '2026-10-15'
  registered_before_run: true
  statistic: OOS net R per capital-day per arm (scripts/research/same_symbol_head_to_head.py), full venue cost stack via execution_costs, live
    risk basis, one position slot.
  rule: 'Arms (fixed now): solo:<leg> for each leg, and together (all legs under the live aggregate_intents election, ONE position slot). Metric
    per arm: OOS net R per capital-day = sum(pnl/(qty*|entry-entry_stop|)) / sum(holding days), pnl net of fee+slippage+funding, OOS = entries
    on/after oos_start. IF every arm has >= min_oos_trades OOS trades THEN verdict pass and winner = together iff its metric is STRICTLY greater
    than the best solo arm, else the best solo arm (keep it alone; a tie keeps the single arm). IF any arm is below min_oos_trades or has zero
    capital-days THEN indeterminate, naming the starved arm. read_state unavailable (no candles / leg not in ROSTER) is a ROUTE/HARNESS FAULT,
    never a verdict.'
  what_it_does_not_do: Edits no config. config/accounts.yaml / config/strategies.yaml changes that follow a verdict are data-backed Tier-3, applied
    by the manager under the operator instruction of 2026-10-15, with the evidence record committed to comms/same_symbol_allocation/. A pass here
    says which leg earns the slot on this history; it is not live P&L and not a promotion.
compute: cpu_long
head_to_head:
  symbol: XRPUSDT
  legs:
  - trend_donchian_xrp_4h
  - xrp_pullback_2h
  accounts:
  - bybit_1
  - bybit_2
  - bybit_portfolio
  oos_start: '2025-01-01'
  min_oos_trades: 20
  clock_tf: 15m
  risk_account: bybit_1
  initial_balance: 10000.0
value:
  bucket: structural
  usd_at_stake_per_month: 0
  confidence: 0.3
  basis: 'stand-in: removes an arbitrary (confidence-tie then name) allocation on a live slot; not a measured P&L'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 3.0
  est_minutes: 60
  basis: 'Estimate. UNVERIFIED: whether the GitHub runner can obtain 5m candles for this symbol. If not, the driver lands read_state: unavailable
    (a route fault to fix, never a verdict).'
run:
  workflow: research-script-run.yml
  command:
  - python3
  - scripts/research/same_symbol_head_to_head.py
  - --unit
  - '{unit}'
  - --out
  - '{out_dir}'
  timeout_minutes: 180
  inputs:
    research_unit: RQ-20261015-1631-02
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
roadmap:
- M18
related:
- SAME-SYMBOL-ALLOCATION
- scripts/research/same_symbol_head_to_head.py
- scripts/ci/check_same_symbol_allocation.py
- src/runtime/intents.py
last_dispatched_at: null
