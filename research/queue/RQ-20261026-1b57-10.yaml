id: RQ-20261026-1b57-10
title: 'Prop pace POOLED trend 1h: does Donchian-55 / trail 6 beat the Donchian-20 baseline by >= 0.05 R/trade over 12 perps at the sample size that bar needs?'
status: queued
cadence: once
theme: new_strategy_prop
