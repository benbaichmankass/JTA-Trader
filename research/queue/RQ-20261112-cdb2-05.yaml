# Hand-authored 2026-11-12 by lane SLV-ITERATION (am:TRADING; reports to AM-TRADING, cc the manager). The decision rule is
# registered BEFORE any run of this unit. Gates this adds or changes: none.
id: RQ-20261112-cdb2-05
title: 'SLV-ITERATION lever: COST ROBUSTNESS of slv_trend_1h: does the declared leg stay net-positive at 2x the placeholder slippage (10 bps RT),
  and where does it break even, on 2019-01..2026-10?'
status: queued
cadence: once
theme: live_strategy
priority: 2
roadmap:
- L-LADDER
kind: experiment
question: The leg's cost stack is fee 0 + 5 bps RT slippage, a placeholder, not a measured SLV fill cost. At 10 bps RT (2x), is net R still >
  0 with >= 3 of 4 folds positive? And at 15 / 20 / 30 bps, what is the break-even slippage?
why_this_matters: Real money now trades this leg at 1 to a few shares, where the spread and odd-lot fills can exceed 5 bps. If the edge does not
  survive 2x cost, the leg is fee-fragile and AM-TRADING needs to know before the mirror window says so.
iteration:
  subject: slv_trend_1h
  subject_kind: strategy_leg
  from_result: comms/strategy_evidence/slv_trend_1h.json
  verdict_read: pass_short_window
  diagnosis: Live on real money since 2026-11-12 on a ~17-month record; full-history mean positive but unresolved (RQ-20261112-cdb2-01). Lever
    map (research/levers/slv_trend_1h.yaml) reads entry and exit tested, filter / regime_gating / session / sizing_vs_cost untested.
  hypothesis: stepping the sizing_vs_cost lever one factor at a time moves net-of-cost R monotonically and fold-stably; a flat or spiky response
    is recorded as no edge / overfit
  attempt: 1
  due_by: '2026-11-26'
  design:
    control: A (the leg as declared, tp_r 6.0)
    kind: cost sensitivity, one arm graded
    levers:
      slv_trend_1h: sizing_vs_cost
    lever_basis:
      slv_trend_1h: lever_map_gap
    why_this_lever:
      slv_trend_1h: 'lever map: sizing_vs_cost untested; 5 bps is a placeholder'
    arms:
      slv_trend_1h:
      - - C10
        - tp_r=6.0;--slippage-bps-roundtrip=10
      - - A
        - tp_r=6.0
      - - C15
        - tp_r=6.0;--slippage-bps-roundtrip=15
      - - C20
        - tp_r=6.0;--slippage-bps-roundtrip=20
      - - C30
        - tp_r=6.0;--slippage-bps-roundtrip=30
  multiple_testing:
    arms_counted: 5
    variants_vs_control: 4
    correction: Holm
    note: every variant is fixed before the run; a best-of-k pass is a LEAD that needs a held-out read, never a finding
design: structured
levers_declared:
- sizing_vs_cost
power:
  expected_n: 380
  min_detectable_effect: 0.37
  effect_units: r_per_trade
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'One-sample on C10''s own trades; n ESTIMATED ~380 (as cdb2-02). MDE at sd ~2.9 R: 0.37 R/trade. The grade is the Stage-0 sign-and-folds
    bar at 2x cost, not a significance test. Floor 100.'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public Dukascopy candles over a pinned window; nothing accrues.
evidence_class:
  holdout: in_sample
  claim: edge
decision_rule:
  id: RULE-RQ-20261112-cdb2-05
  registered_at: '2026-11-12'
  registered_before_run: true
  statistic: scripts/research/exit_lever_ablation.py --grade stage0 on slv_trend_1h, Dukascopy SLV CFD 1h, window 2019-01-01..2026-10-31 23:59,
    one continuous harness pass per arm; every arm is the declared leg (tp_r 6.0) with only --slippage-bps-roundtrip changed (fee 0, funding 0).
    Net R, n, maxDD, 4 calendar folds per arm.
  rule: 'Graded on arm C10 only (exit_lever_ablation --grade stage0, baseline C10): PASS IF C10 net R > 0 AND n >= 100 AND >= 3 of 4 calendar
    folds net-positive. FAIL IF n >= 100 and that does not hold (the leg is fee-fragile at 2x: a Gate-2 INPUT to AM-TRADING, never a demotion
    here). INDETERMINATE IF n < 100 or the producer failed. DESCRIPTIVE, not graded: net R of A / C15 / C20 / C30 and the linearly interpolated
    break-even slippage in bps RT. Thresholds are not changed after any result.'
  on_pass: Record the leg as cost-robust to 2x; report the break-even bps to AM-TRADING.
  on_fail: Report to AM-TRADING as a fee-fragility Gate-2 INPUT with the break-even bps. No config change.
  what_it_does_not_do: 'Edits no config, roster or record; places no order. IN-SAMPLE: the control''s parameters were chosen on data inside this
    window (docs/research/slv-trend-1h-param-provenance-2026-11-12.md), so a PASS is a LEAD that earns a held-out or fresh-span read before any
    Tier-3 proposal, never a finding. Bars: Dukascopy SLV CFD 1h (INSTRUMENT_ETF_CFD_US_SLV_US_USD, bid), the repo''s adjudicated SLV mapping;
    CFD hours and prices are a proxy for the SLV ETF, not its tape. The control A pins tp_r 6.0 (PR #25267''s value) so the unit reads the same
    arm before and after that PR merges.'
intervention_controls:
  not_applicable: a config-exact harness parameter ablation on history, not an in-trade action
practice_precedent: 'M2, M4 (docs/reference/trading-and-model-practice-principles.md): one-factor sensitivity before combinations, net of the
  full cost stack, rule registered before the run, variants counted.'
