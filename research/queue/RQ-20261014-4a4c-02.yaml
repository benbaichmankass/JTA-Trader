id: RQ-20261014-4a4c-02
title: 'P4-Q2 confirm: is the PPI m/m surprise -> ES=F drift present in the EARLIER sub-period alone (releases ..2020-12-31)? (n~71; underpowered by design)'
status: done
cadence: once
theme: macro
priority: 1
kind: experiment
question: On ppi_mom releases dated before 2021-01-01 only, is the overlap-corrected Spearman IC of (survey surprise, ES=F forward return from the release-day close) negative with |t_eff|
  >= 2.0 at h=3 or h=5 trading days?
why_this_matters: 'Parent: RQ-20261014-de02-04 PASSED 2026-10-14 (run 38605585550): ppi_mom survey surprise vs ES=F forward return, n=139 releases 2015-01-15..2026-09-10, IC h1 -0.183
  (t -2.17), h3 -0.281 (t -3.43), h5 -0.247 (t -2.98), expected negative sign. It was 1 PASS of 13 kinds x 3 horizons = 39 tests landed 2026-10-13/14; normal-approx two-sided p at t=-3.43
  is ~0.0006, under the BH rank-1 threshold 0.05/39 = 0.0013, so it survives the family read, but a single-sample IC on daily closes is a lead: stability, a placebo, a second instrument
  and a net-of-cost book are owed before it can feed a conviction axis (programme 04-MACRO-SLEEVE.md, Q2). The sibling of RQ-20261014-4a4c-01 (the other half of the same sample).'
power:
  expected_n: 71
  min_detectable_effect: 0.35
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'Unit = one release with a defined surprise; 71 before 2021-01-01. Same arithmetic as RQ-20261014-4a4c-01: floor 64 at d=0.35, ~93 at the parent''s observed d~0.29, so UNDERPOWERED
    BY DESIGN at the observed effect.'
  feasibility:
    source: none
    accrual_basis: 'n is bounded by the resolved ppi_mom releases with a defined survey surprise on file (a fixed historical backfill, MEASURED 2026-10-14 with econ_event_study.load_resolved_events_multi
      over the two committed files: 139 total, 71 before 2021-01-01, 68 on/after; 118 with a non-zero surprise). Not an accrual: ~12 releases/yr add slowly; the run prints the joined
      count and a short join lands INDETERMINATE, never padded.'
decision_rule:
  id: RULE-RQ-20261014-4a4c-02
  registered_at: '2026-10-14'
  registered_before_run: true
  statistic: ic_t_eff at horizons 3 and 5 (macro_event_study_run.py grade(), --release-end 2021-01-01).
  rule: PASS IF at h=3 or h=5 with n >= 50, |ic_t_eff| >= 2.0 AND the IC is negative. FAIL IF both horizons have n >= 50 and neither does. INDETERMINATE IF a horizon has n < 50. Read
    with RQ-20261014-4a4c-01 (rule there).
  what_it_does_not_do: As RQ-20261014-4a4c-01.
compute: cpu_light
value:
  bucket: information
  usd_at_stake_per_month: 80
  confidence: 0.2
  basis: 'stand-in: confirms or retires the one event-surprise lead that could seed an event-scored conviction axis for the M28 sleeve (alpaca_options_paper); information value, not
