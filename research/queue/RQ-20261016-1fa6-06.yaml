id: RQ-20261016-1fa6-06
title: 'In-trade exit line on the HIGHER-timeframe legs: does an exit-now policy on the RICH in-trade state add >= 0.10 R per trade net on pullback_2h + Donchian
  4h legs at K = 3 R, where a truncation costs least relative to 1 R?'
status: done
cadence: once
theme: ml_health
priority: 2
kind: experiment
question: 'first_passage.py --mode policy --features rich on the committed ledgers whose leg matches ''pullback_2h|donchian.*4h'' (MEASURED 2026-10-16 on comms/strategy_evidence/runs:
  10 legs, 1,917 trades), bracket K = 3.0 R. Paired per-trade difference policy net R - bracket net R on OOS trades, net of the exit''s round trip.'
why_this_matters: 'd6e7-04 (rich state) was positive in 4/4 folds with calibration slope 1.03 but under the 0.002-nat proxy bar; the money rung was gated on that
  proxy and never ran. P1''s RQ-20261016-013 runs the money rung pooled at K = 2. The exit-head history (RQ-20260929-401) says the ict_scalp heads were positive GROSS
  and negative NET because a truncation pays a round trip that is large relative to 1 R on 15m; on 2h/4h legs the same cost is a small fraction of R. Kaminski & Lo
  2014 and Lo & Remorov 2017: stop/exit rules add value only under serial correlation/regime structure and lose to costs when tight -- so the higher-timeframe population
  is where the family''s documented mechanism should show first.'
power:
  expected_n: 800
  min_detectable_effect: 0.1
  effect_units: metric
  sd: 1.0
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: Paired per-trade difference, sd ~1.0 R INFERRED (early exits move a trade by up to 1 + K R at K = 3). 0.10 R needs (2.80 x 1.0 / 0.10)^2 = 784 OOS trades.
    1,917 ledger trades MEASURED; the OOS non-timeout share is INFERRED at ~40-50%, so INDETERMINATE is a live outcome and is stated as such.
  feasibility:
    source: none
    accrual_basis: Committed ledgers + public candles; nothing accrues.
decision_rule:
  id: RULE-RQ-20261016-1fa6-06
  registered_at: '2026-10-16'
  registered_before_run: true
  statistic: 'first_passage.py --mode policy verdict.json: pooled per-trade gain (policy - bracket, net R, OOS), its CI, gain sign per fold, the capital-day guard
    and the p0 sanity control, with --min-trade-gain-r 0.10 --min-folds 3 --min-n 300.'
  rule: 'PASS IF pooled per-trade gain >= 0.10 R AND CI lower bound > 0 AND gain > 0 in >= 3 of 4 folds AND the capital-day guard holds AND the p0 sanity control
    exits on < 5% of trades -> next rung is harness-native confirmation on the real-money legs (blocked on EXIT-PATH-EMIT-OFFLINE / RQ-20261014-d6e7-06), never a
    flip. FAIL IF the CI upper bound < 0.10 R with n >= 300 OOS trades: the exit-now line is honest_negative on HTF legs at K = 3 for this feature set. INDETERMINATE
    otherwise (incl. n < 300). The harness''s own verdict wording is authoritative for which branch fired.'
  what_it_does_not_do: Uses a FIXED K = 3 R bracket re-walk, not the legs' real trailing exits (that is d6e7-06). Not a promotion case; no config.
