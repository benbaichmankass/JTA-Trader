id: RQ-20261014-65cc-05
title: 'Macro / information: does the US retail-sales m/m surprise vs the PIT SURVEY consensus predict ES=F forward returns at 1-5 trading days? (n=142 releases, monthly; underpowered
  by design)'
status: done
cadence: once
theme: macro
priority: 2
kind: experiment
question: Using ONLY survey-consensus point-in-time rows (live forward feed + survey backfill merged, earliest observed_at wins), is Spearman(surprise = actual - consensus,
  forward ES=F return) significant at 1, 3 or 5 trading days after the retail_sales_mom release at |t_eff| >= 2.4 (Bonferroni over 3 horizons) with the expected positive sign?
why_this_matters: 'Mechanism: retail sales above consensus is a hard-data consumption surprise, expected POSITIVE for equities (sibling of the CPI unit RQ-20261013-1414-12
  at the same n scale). INFORMATION bucket (target 20% of fires, under-served): the surprise->return family has only the NG/crude/CPI units queued. MEASURED 2026-10-14 (scripts/macro/econ_event_study.py::load_resolved_events_multi
  over the two committed files): 142 releases of retail_sales_mom with a defined survey surprise, 2015-01-14..2026-10-08. Prices come from the runner-side yfinance/Stooq fetch
  (the sandbox cannot reach them), so the join count is verified by the run, which prints releases, releases_with_value and price_bars.'
power:
  expected_n: 142
  min_detectable_effect: 0.2
  effect_units: sd
  design: one_sample
  alpha: 0.01
  power: 0.8
  basis: 'Unit = one release with a defined survey surprise. A Spearman rho of 0.20 needs ~292 pairs at alpha 0.01 ((2.576+0.8416)^2/0.2^2); the merged files hold 142 releases
    before the price join, so this unit is UNDERPOWERED BY DESIGN at rho=0.20 (142 < 292): it can PASS only on a larger effect and a FAIL is weak evidence. The rule bar is
    |t_eff| >= 2.4 on the overlap-corrected t (ic_t_eff).'
  feasibility:
    source: none
    accrual_basis: n is bounded by the count of resolved releases with a defined survey surprise on file (a fixed historical backfill, not an accrual); the run prints the bound
      and a short join lands INDETERMINATE, never padded.
decision_rule:
  id: RULE-RQ20261014-65CC-05-RETAIL_SALES_MOM-ESF-SURPRISE-EVENT-STUDY
  registered_at: '2026-10-14'
  registered_before_run: true
  statistic: Overlap-corrected Spearman t (ic_t_eff) of surprise vs forward return at horizons 1, 3, 5 trading days (scripts/macro/econ_event_study.py event_study, merged live+survey
    snapshots), graded by scripts/research/macro_event_study_run.py grade() with the CLI flags below.
  rule: 'PASS IF at some horizon in {1,3,5} with n >= 100, |ic_t_eff| >= 2.4 AND the sign of the IC is positive. FAIL IF every horizon has n >= 100 and none reaches |t_eff|
    >= 2.4 in the positive direction (a significant WRONG-sign horizon is reported but is not a pass; a FAIL closes only this surprise definition, instrument and these horizons).
    INDETERMINATE IF any horizon has n < 100. no_data/producer_failed IF the price panel is empty or no release has a defined surprise: a route fault, not a verdict.'
  min_n: 100 joined releases per horizon (the run reports releases, releases_with_value, price_bars and per-horizon n).
  what_it_does_not_do: A PASS is evidence for a build row (tradeable timing, costs, a placebo and the naive-floor check are all still owed), not a leg and not a config change.
    Uses daily closes, so it cannot see the intraday reaction; a FAIL does not say the release is unpriced intraday. Not a P&L figure.
compute: cpu_light
value:
  bucket: information
  usd_at_stake_per_month: 80
  confidence: 0.15
  basis: 'stand-in: a scheduled-release signal with a stated mechanism would feed the M1/M2 event overlay and the news-influence layer; information value, not a P&L claim'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 1.0
  est_minutes: 10
  basis: 'Estimate (same shape as RQ-20261013-1414-12, which this copies): one yfinance/Stooq daily-close fetch, a few hundred snapshot rows, a rank correlation per horizon.'
run:
  command:
  - python3
  - scripts/research/macro_event_study_run.py
  - --kind
  - retail_sales_mom
  - --snapshots
  - comms/macro/econ_calendar_snapshots.jsonl,comms/macro/econ_calendar_snapshots_survey_backfill.jsonl
  - --symbol
  - ES=F
  - --horizons
  - 1,3,5
  - --primary-horizons
  - 1,3,5
  - --min-n
  - '100'
  - --t-bar
  - '2.4'
  - --expected-sign
  - positive
  - --population
  - retail_sales_mom releases (live feed + survey-consensus backfill) joined to ES=F daily closes
  - --out
  - '{out_dir}'
  timeout_minutes: 30
  inputs:
    research_unit: RQ-20261014-65cc-05
lands:
