id: RQ-20261119-d7c3-01
title: 'DESK TRIGGER REPLAY, family atr_burst: when the live desk trigger fires (the last closed 5m bar range is >= 2.0 x ATR14 (live atr_burst)), does entering (continuation or fade, one fixed 1.5 ATR SL / 3.0 ATR TP / 12-bar bracket) beat a same-symbol, same-ATR%-decile random entry by S3 >= +0.15 R net of the full cost stack on the DEV window?'
status: done
cadence: once
theme: live_strategy
priority: 2
roadmap:
- M40
kind: experiment
question: 'On closed 5m bars of BTC/ETH/SOL/XRP/ADA/AVAX USDT over the DESK-18G DEV window (2025-11-01..2026-09-15), firings of the atr_burst detector of config/desk_triggers.yaml (frozen parameters), entered at the next bar open with SL 1.5 x ATR14, TP 3.0 x ATR14 and a 12-bar time stop, scored under a continuation rule (bar colour (close >= open = up)) and its fade, net of fee + slippage + funding: does the better rule beat random same-symbol, same-ATR%-decile cutoffs (the firing''s own side and geometry, 200 draws, more than 12 bars from any firing) by S3 >= +0.15 R with a Holm-adjusted 97.5% weekly-cluster lower bound > 0 on n >= 100 firings?'
why_this_matters: 'The desk wakes on these triggers (desk_triggers.yaml) but no trigger has ever been measured as an entry situation; the operator asked to rethink HOW we test (row DESK-ENTRY-REVIEW-REDESIGN). PASS -> the family goes forward as a candidate trigger for desk_triggers.yaml; FAIL -> it stays label-only with its data collection kept. A fail is as useful as a pass: it tells the desk which wakes spend a session on a coin flip.'
power:
  expected_n: 350
  min_detectable_effect: 0.15
  effect_units: R per firing
  sd: 1.0
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATE, not a measurement: sd 1.0 R is the per-firing spread of a 3.0/1.5 ATR bracket minus a matched baseline mean; n = (2.8 x sd / MDE)^2 = 348 for an iid one-sided test. The firing count is MEASURED only when the run lands; the harness then computes the cluster MDE from the MEASURED sd and returns INDETERMINATE by design if +0.15 R is undetectable at 80% power or n < 100.'
  feasibility:
    source: none
    accrual_basis: 'Replays public Binance Vision 5m history; nothing accrues. The firing count for this family on the DEV window is unmeasured until the run (the live trigger log is not a point-in-time record of every firing); the n >= 100 floor and the power clause decide the verdict, not this estimate.'
evidence_class:
