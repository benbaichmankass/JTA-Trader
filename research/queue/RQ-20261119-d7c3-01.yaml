  claim: edge
decision_rule:
  id: RULE-RQ20261119d7c301-DESK-TRIGGER-ATR-BURST
  registered_at: '2026-11-19'
  registered_before_run: true
  baseline: 'B3 (decisive): random cutoffs of the SAME symbol in the SAME window, same ATR%-decile (vol_matched_pool), more than 12 bars from any firing of the family, the firing''s own side and geometry, 200 draws; refused slot = no-trade = 0 R on both sides.'
  statistic: 'S3 = mean over firings of (firing net R minus B3 mean net R) per direction rule (continuation, fade), weekly-cluster bootstrap 10,000 draws; the verdict reads the better rule by S3 mean. Cost stack: venue fee + resolve_cost_policy slippage + funding (execution_costs.roundtrip_cost_r) through the certified desk_gen_replay_driver engine.'
  rule: 'PASS iff n >= 100 firings AND S3 >= +0.15 R AND the one-sided level 0.05/8 (Holm step 1 over the 8 registered family x rule cells) weekly-cluster lower bound > 0 AND the planted controls hold (oracle clears, anti-oracle S3 < 0, random-side does not clear, detectors identical on a truncated history). NOT_CLEARED otherwise (the one-sided p is recorded; desk_trigger_replay.py holm over the four family results may still upgrade a cell by the full Holm step-down). INDETERMINATE iff n < 100, the cluster MDE from the measured sd exceeds +0.15 R, or any control fails. Thresholds, windows, bracket and rules are fixed now and not changed after any result.'
  pass_action: 'author the HOLDOUT read for this family only (desk_trigger_replay.py holdout, one read through holdout_lock.claim_read, claim before the read); a family that also passes the holdout goes forward as a candidate trigger for desk_triggers.yaml (a Tier-3 proposal, not this unit).'
  fail_action: 'the family stays label-only in desk_triggers.yaml (data collection kept, shadowed-features record unchanged); nothing is re-run in this configuration.'
  what_it_does_not_do: 'Changes no live leg, no desk_triggers.yaml setting, no config; places no order; adds no gate. Not a promotion case. near_signal and calendar triggers are NOT scored (their firings are not reconstructable point-in-time) and are recorded unscored in the result.'
