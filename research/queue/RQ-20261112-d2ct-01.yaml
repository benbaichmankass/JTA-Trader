# Hand-authored 2026-11-12 by lane ML-D2-CONSUMER-TEST (Tier 1), dispatched by the ML assistant manager. Decision rule registered BEFORE any run. Gates: none.
id: RQ-20261112-d2ct-01
title: 'CONSUMER TEST of the D2 regime gate on the trend_donchian family, pooled: applied to every TD leg whose symbol has an advisory vol head, would the dropped trades have lost money, out of sample, more than the same number dropped at random?'
status: queued
cadence: once
theme: regime
priority: 1
roadmap:
- L-REGIME
- L-ML-MECE
programme: P2
kind: experiment
question: 'Take the (trend, vol, side) OFF-cells config/regime_policy.yaml already authors for trend_donchian (BTC population: trending/volatile long, transitional/calm long, chop/calm long). Apply them, unchanged, to the SOL and ETH trend_donchian legs (symbols the cells were NOT authored on) using each symbol''s advisory vol head labels. Pooled over those legs, does dropping the cell trades add net R, in >= 4 of 6 calendar folds, and beat a matched-random drop of the same count?'
why_this_matters: 'ML-DEEP-AUDIT 2.1 / MECE P9: 150 of 234 ML units since 2026-10-01 are regime/direction bake-offs and no regime head changes an order on real money. This is the one money read of the regime slot on the TD family (bybit_2 trend_donchian_sol_prop; bybit_1/prop eth+sol legs). PASS = first real-money D2 consumer (Tier-3 PROPOSAL to the operator, who alone grants the limitation); FAIL sizes D2 research and the nightly regime-head cycle down. PRECONDITION FINDING (MEASURED, file read): no xrp-regime-* head config exists in ml/configs, so the two bybit_2 XRP TD legs (trend_donchian_xrp_4h, trend_donchian_xrp_adx25) resolve vol=unknown and the hard gate is permissive for them (regime-selectivity Rule 3b): the gate cannot change an order on 2 of the 3 real-money TD legs whatever this unit reads.'
power:
  expected_n: 200
  min_detectable_effect: 0.3
  effect_units: metric
  sd: 1.5
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATE. expected_n = dropped trades pooled over 4 legs (BTC precedent RQ-20261008-902 dropped about 90 of 147 trades on one 1h leg; ETH/SOL leg trade counts unmeasured here). MDE = 2.8*sd/sqrt(n) = 0.30 R per dropped trade at sd 1.5 R, n 200. Below 25 dropped trades pooled the grade is indeterminate (underpowered), never FAIL.'
  feasibility:
    source: none
    accrual_basis: Replays fixed history; nothing accrues.
decision_rule:
  id: RULE-RQ-20261112-d2ct-01
  registered_at: '2026-11-12'
  registered_before_run: true
  statistic: 'scripts/research/regime_gate_family_consumer.py over per-leg fully tagged trades (regime_cell_walkforward harness emit, fully tagged by regime_tag_emitted --emit-tagged --vol-labels with no --only filter; net_r already net of fee + resolved slippage + funding via execution_costs.resolve_cost_policy). Legs: trend_donchian_sol_prop, trend_donchian_eth_prop, trend_donchian_sol_4h, trend_donchian_eth_4h, each only if its symbol resolves an advisory vol head at run time (else listed as inert and excluded). Cells: read from config/regime_policy.yaml trend_vol for strategy trend_donchian at run time (not chosen after seeing trades). added_r = -(sum net_r of dropped trades) pooled over legs; fold_wins over 6 equal-width calendar folds of the pooled trades; control = per leg and side, drop the same count of same-side trades uniformly at random, 5000 draws, seed 20261112, p = share of draws with added_r >= actual.'
  rule: 'indeterminate_underpowered IF dropped_n < 25. PASS iff added_r > 0 AND fold_wins >= 4 of 6 AND control_p <= 0.05. Else FAIL. Secondary, reported not graded: the same on trades from 2026-07-01 on (post the cells'' authoring), per-leg added_r, the BTC trend_donchian leg (authoring population, excluded from the pooled grade). Label fidelity: ml_vol_label_replay verify must run first; a verify disagreement beyond the tool tolerance, or in_sample labels without the caveat stamped, grades producer_failed, not FAIL. PASS = a Tier-3 PROPOSAL (held PR to the manager) that the operator may grant as a specific limitation; this unit writes no cell and flips nothing. FAIL = D2 head bake-offs for the TD family lose their only consumer: the manager stops authoring regime/direction bake-offs and de-prioritises the nightly regime-head cycle (a line still ends only on its registered exhaustion condition).'
  what_it_does_not_do: 'Edits no config, flips no router mode, authors no cell, places no order, adds no gate.'
holdout:
  claim: 'Before any outcome is read run scripts/research/holdout_lock.py claim --family regime-vol-head-TD --train-end <registry train end of each head> --start <first trade date after it> ...; a WindowOverlapsTraining refusal is recorded in the result and the in-sample caveat stands (labels are market-state, stamped in_sample: true); the N-th read of the family is graded against holdout_lock.bar_for(N).'
routing:
