power:
  expected_n: 120
  min_detectable_effect: 0.3
  effect_units: R
  sd: 1.2
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'Per-trade net-R sd about 1.2; n about 100 to 130 trades on a 3-year 2h/4h leg (recorded OOS n 46 to 135). The 95% CI half-width at n=120 is about
    0.21 R, so only an edge of about 0.3 R or more can have a lower bound above 0: most outcomes will be FAIL_EDGE or INDETERMINATE by construction, which
    is the honest reading of a thin leg. expected_n is an ESTIMATE from the recorded OOS n, not a measurement.'
  feasibility:
    source: none
    accrual_basis: Re-measure of public price history at the prop stack; nothing accrues. If n < 88 on 3y the verdict is INDETERMINATE and the leg is not
      a candidate until it accrues.
decision_rule:
  id: RULE-RQ-20261031-a4e7-03-PROP-CANDIDATE
  registered_at: '2026-10-31T23:00:00Z'
  registered_before_run: true
  statistic: 'scripts/research/prop_candidate_gate.py (self-tested; chains exit_lever_ablation.py --grade stage0 arm P = fee 8 / slip 3 / funding 5 bps
    per 24 h on ADAUSDT, 2023-10-13..2026-10-11 20:00, with scripts/research/prop_gate.py V2 + V3 and prop_ev_sim.py, 5 seeds x 1000 lives, one-leg book
    at each account configured risk_pct, daily-DD switch 0.8, arms cur and ven). Windows: 3y = the whole ledger; 365d = entries >= 2025-10-11 20:00. Verdict
    per cell: prop_gate.grade_v3.'
  rule: PASS iff the V3 verdict is PASS on ALL THREE accounts on the 3y window and arm cur (V2 ceiling and EV>0 at every seed AND edge CI lower bound >
    0). CONTESTED (reported as FAIL for routing) iff that holds but the 365d window has n >= 88 and median EV < 0 on >= 2 accounts. FAIL if any 3y/cur account
    is FAIL or FAIL_EDGE. INDETERMINATE (verdict indeterminate) if n < 88 on 3y or the harness failed (read_state producer_failed). Thresholds are not changed
    after any result; the ven arm is reported, not graded.
  min_n: 88 trades on the 3y window
  proposal_mapping: 'PASS -> the manager brings ONE Tier-3 swap PR to the operator: pull trend_donchian_eth_prop from breakout_2 / tradeify_1 / velotrade_1
    and add this leg with the SAME risk_pct and mirror rules per OPERATING-PLAN, citing this record and the batch denominator (k PASS of 4). If more than
    one candidate PASSes, the PR proposes the one with the higher worst-seed EV percent at breakout_2 on the 3y cur cell, stated before either result is
    read. Nothing is applied by this unit; the leg must also be on the soak path (a Stage-1 mechanical count of 1 to 2 clean trades).'
  what_it_does_not_do: Changes no roster, risk, sizing or config; reads no live book P&L; prices the leg ALONE (the gate population), not the account book;
    a PASS is a discovery with a batch denominator of 4, not a confirmation.
