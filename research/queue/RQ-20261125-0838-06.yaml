id: RQ-20261125-0838-06
title: 'CONFIRMATION of the spy_pullback_1h long-only side filter on 2012-01..2018-05 (bd30-05 PASS on 2018-06..2020-06 but the 2020-07+ read failed on folds): which
  window is the outlier?'
status: queued
cadence: once
theme: live_strategy
priority: 2
kind: experiment
question: Same leg, arms (A=, LONG=--side-filter=long) and bars as bd30-05; window 2012-01-01..2018-05-31 (Dukascopy SPY history earlier than every prior read), 3
  folds.
why_this_matters: spy_pullback_1h is a testing leg with a negative record (-8.55 R) and one lever that responds; this settles whether that lever is a 2020+ artefact
  (its 203c-01 failure) or an early-slice artefact (its 003 pass). PASS -> the manager gets a Tier-3 declare proposal with the QQQ read (bd30-02) as the cross-symbol
  denominator; FAIL -> the direction lever is closed for SPY and the iteration moves to untested families.
power:
  alpha: 0.05
  basis: 'ESTIMATE: 003 measured n(LONG)=205 and n(A)=344 over 2018-06..2026-10; scaled by years (2.1/8.4) this is ~51 long / ~86 declared. Below the 25 floor the
    unit grades INDETERMINATE, never FAIL.'
  design: one_sample
  effect_units: sd
  expected_n: 50
  feasibility:
    accrual_basis: Re-measurement on freshly fetched public candles over a pinned window; nothing accrues.
    source: none
  min_detectable_effect: 0.45
  power: 0.8
decision_rule:
  id: RULE-RQ20261125083806-LONGONLY-CONFIRM
  registered_at: '2026-11-25'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg spy_pullback_1h --grade replace, window 2018-06-01 .. 2020-06-30 (--non-crypto-source dukascopy), 3 folds
    by entry time, net of the full cost stack. Arms fixed now: A=; LONG=--side-filter=long.'
  rule: 'Registered 2026-11-25 before any run. Same statistic and bars as RQ-20261124-bd30-05, window only changed: candidate LONG PASSES iff net_r(LONG) > net_r(A)
    AND delta >= 0.02 R x n(A) AND net R >= A in >= 2 of 3 folds AND maxDD <= 1.35 x maxDD(A); n(A) >= 25 else INDETERMINATE (also if the arm is byte-identical to
    A). Regime-robustness: per-year table reported; a pass concentrated in one year (> 50% of the delta) is reported as PASS_CAVEATED. PASS = the long-only side filter
    holds on a window its discovery never saw: the Tier-3 declare PROPOSAL (with the mirror, never a config edit) goes to the manager on both records. FAIL = the
    discovery was window-specific; family not retired.'
  regime_robustness: 'Reported with the result, not graded here (the grade is the rule above): per-year net R table for every arm, long-side and short-side net R
    separately, and the largest single year share of total net R. Set before the run.'
  what_it_does_not_do: Edits no config and no roster, places no order, is not a promotion case.
  pass_action: Tier-3 declare proposal for the manager on the discovery + this confirmation (no config edit here).
  fail_action: Record the side-filter response as window-specific on the lever map; next untested family.
practice_precedent: 'M4, M5, M13 (docs/reference/trading-and-model-practice-principles.md): pre-registered arm grid, every arm counted, baseline = the declared leg,
  confirmation on an in-hand window the lead was not read on'
intervention_controls:
  not_applicable: a Stage-0 / parameter-ablation re-measurement of the declared leg through the harness, not an in-trade action or active-management intervention
iteration:
