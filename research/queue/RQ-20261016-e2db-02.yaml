id: RQ-20261016-e2db-02
title: >-
  Tradeify NEW-strategy search, non-crypto: volatility-compression breakout (squeeze) (backtest_squeeze, harness defaults) on USO 1h priced as USOIL/USD -- a family
  no live leg runs on this instrument
status: done
cadence: once
theme: new_strategy_prop
priority: 1
kind: experiment
roadmap:
- L-PROP
question: >-
  Does volatility-compression breakout (squeeze) (scripts/backtest_squeeze.py at its harness DEFAULTS, nothing tuned) on USO 1h show net edge AND survive Tradeify
  24/7 1-Step (3% daily on live equity, 6% static drawdown) at flat 0.5% risk and the venue leverage cap 5:1, priced with Tradeify's cost stack, on the trainer's
  multi-year USO 1h history as the proxy for the USOIL/USD synthetic perp listed on tradeify_1?
why_this_matters: >-
  Operator, daily sync 2026-10-16 (verbatim): "If non if the existing strategies match that we should investigate some ones, maybe for symbols that we don't currently
  trade." Every unit that re-priced an EXISTING leg on Tradeify non-crypto failed or was underpowered: RQ-20261015-24ca-01 (SLV fade, fail), -04 (SPY pullback 1h,
  fail), -02/-03 (QQQ/SPY trend 1d, indeterminate n<88); RQ-20261015-24ca-05 (uso_trend_1h) has not run yet. This unit asks a DIFFERENT entry family on USOIL/USD:
  crude moves in event-driven bursts (inventory, OPEC headlines) out of quiet ranges; RQ-20261006-032 (USO 1h pullback) failed and -05/ca42-01 re-ask the trend leg,
  so a breakout-from-compression family is the untested one. USO is a futures-roll ETF and a poor proxy for spot WTI; that limits the reading. Families were picked
  from what the instrument does, using only harnesses that already resolve the full cost stack; session-open mean-reversion and carry/seasonality have no cost-complete
  harness in the repo and are not tested here. MULTIPLICITY, disclosed before the run: this is one of FOUR sibling units (RQ-20261016-e2db-01..04, one family per
  instrument, harness defaults, no parameter selection). A PASS is a LEAD, not a promotion case: it still needs the mechanical soak, cost fidelity and the Tier-3
  roster decision, and the manager should read four-way multiplicity into a single marginal pass.
power:
  expected_n: 110
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: >-
    d=0.3 needs ~87-90 observations at alpha 0.05 / power 0.8 (the repo's prop-fit floor, RQ-20260928-011/-012/-013, the same floor as RQ-20261015-24ca-01..05). expected_n=110
    is a GUESS, not a measurement: backtest_squeeze has never run on USO 1h. Below 88 the unit grades UNDERPOWERED (indeterminate), never FAIL.
  feasibility:
    source: none
    accrual_basis: >-
      Fixed historical backfill over the trainer's USO 1h candles (to 2026-06-18, ~8 years, verified trainer-diag #18392); nothing accrues.
decision_rule:
  id: RULE-RQ-20261016-e2db-02
  registered_at: '2026-10-16'
  registered_before_run: true
  statistic: >-
    Per seed 1-5: prop_ev_sim path-mode ev_net_usd_per_life and p_net_positive over the leg's trade ledger (n = ledger rows), as graded by scripts/research/prop_ev_grid.py
    --grade pass_all_seeds.
  rule: >-
    PASS IF n_trades >= 88 AND ev_net_usd_per_life > 0 on ALL 5 seeds AND p_net_positive >= 0.70 on ALL 5 seeds (prop_ev_sim path mode, config/prop_rulesets/tradeify_247_1step.yaml,
    flat 0.5% risk, --lev-cap uso_squeeze_1h=5, --no-hedge, prorated swap, funded-start fresh). FAIL IF ev_net_usd_per_life <= 0 on ANY seed. INDETERMINATE (UNDERPOWERED)
    IF n_trades < 88; INDETERMINATE (NULL) IF ev > 0 on all seeds but p_net_positive < 0.70 on any seed. The harness's own Stage-0 number (net_total_r at the same
    costs) is written to harness.json and reported, not graded separately: a leg with no net edge cannot show ev > 0 on all 5 seeds. Tradeify cost stack: commission
    0.04%/side = 8 bps round trip and swap 0.033%/day, both FIRM-DECLARED and UNCONFIRMED (config/prop_rulesets/tradeify_247_1step.yaml, accepted as declared by the
    manager 2026-10-15 21:20Z, checklist TRADEIFY-INSTR-SPECS); slippage 3 bps round trip DECLARED, which is >= the MEASURED one-snapshot spread for every instrument
    here (bps of mid, run 38807791311: SILVER 1.74, XYZ100 1.00, SP500 0.13, USOIL 1.04), so the measured spread is inside the slippage term, not added on top of
    it. Leverage: 5:1 (marginRate 0.2 MEASURED by REST probe run 38808598907 for SILVER and USOIL, 5:1 INFERRED from it; the firm's rule page names 2:1 for indices/stocks
    and does not name metals/oil). RQ-20261015-ca42-01 asks whether the cap binds for the existing legs; this unit uses the measured reading. OPERATOR RULE (2026-10-15,
    binding on every prop leg): a prop leg clears a SUPERSET of the real-money ladder: Stage 0 net of the full cost stack, THEN a mechanical soak (1-2 clean live
    prop trades count), THEN cost fidelity, PLUS prop DD survival under the account's rules. This unit supplies Stage 0 and the prop-survival simulation only. A PASS
    authorizes NO roster edit, NO account opening and NO order.
  what_it_does_not_do: >-
    Does not tune: harness defaults only, so there is nothing to select among. Does not touch config/strategies.yaml, config/accounts.yaml or config/prop_platforms.yaml,
    places no order, and does not claim the synthetic perp's own price path: candles are the USO ETF series (regular + extended hours only), not the Hyperliquid-fed
    24x7 instrument, so overnight/weekend gaps the perp would trade through are absent here.
