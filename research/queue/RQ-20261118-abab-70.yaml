question: On SOLUSDT 1h (the leg trend_donchian_1h's config applied to SOLUSDT via --symbol, a config-exact twin), 2020-07-01..2026-10-15, does the LONG-only arm beat the both-sides incumbent A by the registered
  replace rule (net R above A and by >= 0.02 R x n, >= 4 of 6 folds, maxDD <= A x 1.35, n >= 39), net of the harness cost stack?
why_this_matters: 'abab-48 passed on BTCUSDT only. A PASS on one window and one symbol is a discovery, not a confirmation (research-ops step D); this is its symbol holdout, the in-hand form of a disjoint
  window (research-ops, RESEARCH ITERATES ON IN-HAND DATA). abab-48 (trend_donchian_1h on BTCUSDT 1h, 2020-07-01..2026-10-15, n=986 both-sides baseline A): the LONG-only arm PASSED the registered replace
  rule: net R +47.6 vs A +16.1 (delta +31.5 R), 5 of 6 folds at or above the incumbent, max drawdown 40.8 R inside the 45.2 R cap; the SHORT arm lost -91.3 R and was below the incumbent in 5 of 6 folds.
  A closed-bar read. Diagnosis: a one-window discovery (best of 2 arms) on one symbol with a strong asymmetry: the short side loses in every fold but the last. Over this window crypto drifted up, so long-biased
  filters can win by market beta alone; the cheapest in-hand test of ''long side beats both sides for this rule'' is the SAME rule on other symbols the leg was never selected on. Correlated evidence (all
  perps share the market factor), said so.'
