id: RQ-20261024-0142-10
title: 'Milder, later ER gate on trend_donchian_eth_4h: after the early gate lost 28-40 R, does a 3.0 R-armed 4.0 x ATR tighten stop the damage and still add?'
status: queued
cadence: once
roadmap:
- L-ATM
- L-REGIME
- M20
theme: regime
priority: 3
kind: experiment
question: On trend_donchian_eth_4h, does a trail that tightens to 4.0 x ATR (or 3.5) only once peak_r >= 3.0 AND er_6 < 0.20 (declared now) beat the declared exit
  A by >= 0.02 R/trade in >= 4 of 6 folds within the drawdown bar, AND beat its matching ungated control (UT40 / UT35)?
why_this_matters: 'Lane AUTHOR-FLOOR-1024 (research runnable floor 34 vs 57 at ~11:50Z 2026-10-24; regime 4 vs share 13). Operator directive 2026-10-22: an idea that
  failed one test is not dead; it failed the first test. This unit is a registered VARIANT/EXTENSION of RQ-20261023-1d5c-03 (ER gate on eth_4h, graded FAIL badly:
  E20 -28.0 R, E30 -35.6 R, E40 -39.5 R, 1 of 6 folds, and the ungated control -48.7 R, while DD fell 20.4 -> 15.6). DIAGNOSIS (hypothesis): the leg already composes
  a stall trail-decay (10 bars to 1.8 x ATR) and the width-0.5 measured-move target, and the gate''s 2.5 x ATR tighten at 1.5 R sits INSIDE those, so it cuts the
  runners that carry the leg; the drawdown fell, so the gate does fire on genuine give-back. A late, mild tighten is the consistent variant and the cheapest to falsify.'
power:
  expected_n: 275
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d=0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo's standing E35 floor). expected_n=275 is an ESTIMATE from sibling units on this leg/window, not
    a measurement; below 39 the unit grades indeterminate, never FAIL.
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ20261024014210-ETH4HERMILDLATE
  registered_at: '2026-10-24'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg trend_donchian_eth_4h --grade replace, window 2020-07-01 .. 2026-10-15 23:59, 6 equal calendar folds by
    entry time, net of the full cost stack the harness resolves per venue (execution_costs.resolve_cost_policy, recorded per arm as cost_stack). Arms fixed now: A
    = the leg as declared in config/strategies.yaml; candidates E20L, E20M ; ungated controls UT40, UT35. Per arm: n, net_total_r, max_drawdown_r, net R per fold.'
  rule: 'INDETERMINATE IF n(A) < 39 or IF every candidate arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C) > net_r(A) AND delta
    >= 0.02 R x n(A) AND net R(C) >= net R(A) in >= 4 of 6 folds AND maxDD(C) <= maxDD(A) x 1.35 AND net_r(C) > net_r of its matching UNGATED control (UT40, UT35:
    the same action on every trade the gate would reach, so a PASS cannot be ''any early action''). PASS IF one or more pass: the best by net R is named and the follow-up
    is ONE confirmation unit on a disjoint partition (a PASS on one window is a discovery), then a live-producer check and a Tier-3 declare PROPOSAL with the mirror
    in the same PR, never a config edit. FAIL IF none passes with n(A) >= 39: this arm grid is closed on trend_donchian_eth_4h for this window and the family is NOT
    retired; the record names the arm that moved closest and the next variant (drop the ER feature for chop at 0.85, or retire the path-state family on eth_4h only
    through family_retirement_policy.yaml). Thresholds and the arm grid are not changed after any result.'
  what_it_does_not_do: 'Edits no config and no roster, places no order, is not a promotion case. A PASS also needs a live producer for the lever (check the leg''s
    monitor) and a Tier-3 declare. The arm grid is the whole search: no arm is added after the run, and the baseline is the declared leg, not a tuned one. real-money
    leg.'
