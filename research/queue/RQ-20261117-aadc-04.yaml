id: RQ-20261117-aadc-04
title: 'ml-exit-head-donchian-1h ITERATION (LABEL family): does training the head on holding_pays_0 (future R >= 0) or more_mfe (new
  favourable excursion still ahead) instead of holding_pays (future R >= +0.25) improve its out-of-sample replayed R per trade, net of cost?'
status: done
cadence: once
roadmap:
- L-ML-LIVE
theme: ml_health
priority: 2
kind: experiment
iteration:
  subject: ml-exit-head-donchian-1h
  subject_kind: ml_model
  from_result: RQ-20261116-d5a7-06
  verdict_read: fail
  diagnosis: 'Every graded iteration changed a family that is now flat: FEATURES (volume composition at lookback 500 (0bc8-02) and 250
    (d5a7-06): comp - champion -0.0016 R/trade, CI95 [-0.0036, +0.0004], n 11,160; champion, vol and comp all -0.0135 R vs hold, CI95
    [-0.042, +0.015]), UNIVERSE (BTC -0.0141 OOS n 1,041; SOL -0.0246 IS; ETH +0.0215 IS: sign flips), POOLING (a474-03, donchian-4h
    family: FAIL, AUC 0.613 but no arm beats B net of cost). Three feature sets giving the SAME replayed R says the head''s decisions are
    insensitive to inputs; the shared element is the TARGET. holding_pays = 1[final_r - open_r(t) >= +0.25] is read off a tail the
    chandelier trail shapes, so it labels "the trail will leave me 0.25 R better off", which the features cannot see. The lever map marks
    labels and recipe untested.'
  search: 'one factor, the label family: champion holding_pays (+0.25 R margin) vs holding_pays_0 (margin removed) vs more_mfe = 1 -
    peak_is_in (a truncation observable independent of the trail). Features, hyper-parameters, shape (below_half_r, tau 0.10), action,
    folds, embargo and lookback fixed at the champion''s.'
  levers:
  - labels
  map_entries:
  - research/levers/ml-exit-head-donchian-1h.yaml#manifest.labels
  attempt: 3
  due_by: '2026-11-24'
question: 'Same rows.jsonl, legs (trend_donchian BTC, trend_donchian_eth, trend_donchian_sol, 1h), 5 sequential folds, 7-day embargo, live
  predicate and cost stack as 0bc8-02 / d5a7-06 (lookback 500); ONE LEVER CHANGED: the training target. For each label arm, does the paired
  per-trade replayed R vs the holding_pays champion reach +0.01 R/trade with a deflated CI lower bound > 0?'
why_this_matters: 'The head still closes trades on the demo floor (trend_donchian_eth, bybit_1) and its D8 slot has no other model in
  iteration. It is a research orphan (no live iteration unit). If no target moves it either, the inputs, the universe AND the label are all
  flat at power, and the subject goes to a family-review record instead of more trainer time; that is a decision either way.'
evidence_class:
  holdout: walk_forward
  claim: model_quality
power:
  expected_n: 11000
  min_detectable_effect: 0.01
  effect_units: r_multiple
  sd: 0.11
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'MEASURED basis from d5a7-06 (same rows, legs, folds): n_oos 11,160 and paired comp - champion SE 0.0010, so sd ~0.11 R per trade.
    At n ~11,000 the SE is ~0.0010; at the deflated z 2.241 the half-width is ~0.0024, so a +0.01 R lift is detectable with room, and a
    FAIL (CI upper < +0.01) is decisive. A label change moves MORE trades than a feature add (the firing set changes), so the paired sd may
    rise; the first run replaces it.'
  feasibility:
    source: none
    accrual_basis: Replays the existing trainer corpus (rows.jsonl) and resident 1h candles; nothing accrues.
baseline:
  definition: 'The holding_pays champion (the shipped recipe, train_exit_head.FEATURES, unchanged hyper-parameters) retrained on the SAME
    fold training rows and replayed on the SAME OOS trades with the live predicate; each trade net of fee + slippage + funding. Hold (no
    head) is reported as context.'
  net_of_cost: true
decision_rule:
  id: RULE-RQ20261117-aadc-04-EXITHEAD-LABEL
  registered_at: '2026-11-17'
  registered_before_run: true
  baseline: the holding_pays champion on identical folds and trades
  statistic: 'scripts/research/exit_head_label_bakeoff.py: pooled over legs and folds, per OOS trade d_arm = replayed_r(arm) -
    replayed_r(champion) on identical trades, replay and cost; per arm mean, SE (one trade = one cluster) and CI at z 2.241 (Bonferroni over
    the 2 label arms). Reported: each arm and the champion vs hold, firing counts per arm, target coverage in rows.jsonl.'
  rule: 'PASS iff some label arm has n_oos >= 300, mean d >= +0.01 R/trade AND deflated CI lower bound > 0 (chosen = the higher mean).
    FAIL iff both arms have n_oos >= 300 and both deflated CI upper bounds < +0.01. INDETERMINATE otherwise (an arm below n, or between the
    bars). An arm whose source column (future_r_delta / peak_is_in) is absent from rows.jsonl is could_not_look and makes the unit
    INDETERMINATE, never FAIL. Thresholds, legs, folds (5), embargo (7 d), lookback (500), shape and arms are not changed after any result.'
  pass_action: 'ONE confirmation on a held-out symbol (RESEARCH-NO-WAIT order 2: a donchian 1h leg not in the three, claimed in
    holdout_lock), then a data-backed Tier-3 proposal to retrain exit-head-donchian-1h on the winning target.'
  fail_action: 'Labels join features, universe and pooling as flat at power. File a family-review record for ml-exit-head-donchian-1h
    (research/family_reviews/, family_retirement_policy.yaml, six protocol items); the manager takes the retire/keep call to the operator.
    The head keeps its demo-floor data collection either way (off the trade path is not off the data path).'
  min_n: 300 pooled OOS trades per arm; per fold MIN_FOLD_TEST_N test trades and the multifold training floor
  what_it_does_not_do: 'Edits no config, registry, artifact or exit_head_action; promotes and demotes nothing. A PASS is an offline result
    under the head''s own judge, then a confirmation, then a Tier-3 proposal. Places no order; adds no gate.'
practice_precedent: 'M1 (label what the decision is paid on; a trail-shaped label conflates the exit rule with the forecast), one-factor
  ablation against a baseline control (docs/reference/trading-and-model-practice-principles.md)'
