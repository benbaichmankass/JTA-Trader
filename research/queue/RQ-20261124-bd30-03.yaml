  id: RULERQ20261124bd3003
  registered_at: '2026-11-24'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg splg_trend_long_1d --grade replace, window 2005-11-15 .. 2011-12-31 (SPYM 1d), 3 folds by entry time, net of the full cost stack. Arms fixed now:
    A=; VL20=--vol-skip-below-pctl=0.2; VL30=--vol-skip-below-pctl=0.3. Per arm: n, net_total_r, max_drawdown_r, net R per fold.'
  rule: 'INDETERMINATE IF n(A) < 25 or IF every candidate arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C) > net_r(A) AND delta >= 0.02 R x n(A) AND net R(C) >= net
    R(A) in >= 2 of 3 folds AND maxDD(C) <= maxDD(A) x 1.35. PASS IF one or more pass: the best by net R is named (the denominator is the 2 candidate arm(s) here) and the follow-up is a Tier-3 declare PROPOSAL
    (mes_trend_long_1d and splg_trend_long_1d together, mirror in the same PR) for the manager, never a config edit. FAIL IF none passes with n(A) >= 25: THIS arm grid is closed for this window and the
    lever FAMILY is NOT retired (scripts/research/family_retirement_policy.yaml); the record names the arm that moved closest. Thresholds and the arm grid are not changed after any result.'
  regime_robustness: 'Reported with the result, not graded here (the grade is the rule above): per-year net R table for every arm, long-side and short-side net R separately, and the largest single year
    share of total net R. Set before the run.'
  what_it_does_not_do: Edits no config and no roster, places no order, is not a promotion case, and is a twin confirmation of the MES lead, not a read of ES=F or MES itself.
