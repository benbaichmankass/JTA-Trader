question: On splg_trend_long_1d over SPYM 1d 2005-11-15 .. 2011-12-31, does VL20 or VL30 beat the declared leg A net of the full cost stack, in >= 2 of 3 folds within 1.35x the drawdown?
why_this_matters: 'A pass confirms (by the twin) that the cold-vol skip is not a 2012+ artefact and clears the way to a Tier-3 declare proposal on mes_trend_long_1d / splg_trend_long_1d; a fail on a window
  including the 2008-09 crash and its aftermath says the lever acts only in the post-2012 regime and the MES PASS stays a discovery. Both branches change the manager''s Tier-3 proposal list. LIMIT: SPYM-as-SPLG
  history pre-2012 and ES=F differ (twin, not the same series), and the 2005-2026 run 9e1b-07 already contained these bars in its aggregate (they were not read separately), stated here.'
