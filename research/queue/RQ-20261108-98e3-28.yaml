id: RQ-20261108-98e3-28
title: 'PROP-ML-NEW-DATA step 1: which non-price sources (funding/basis, OI + long-short + taker flow, book depth) are usable as point-in-time features for ETHUSDT
  and SOLUSDT, and which time-disjoint held-out spans can each support?'
status: done
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: deterministic
practice_precedent: 'none: a data-feasibility census before any model, per docs/reference/trading-and-model-practice-principles.md (establish what bounds n and what
  the source supports before building); PROP-ML-NEW-DATA row brief.'
question: 'Price-only prop entry ML is closed on every route (pooled ETH/SOL ~40 arms, Donchian filter d256-02, prop-specific d256-01). The open route is information
  price does not carry. Before any model: for ETHUSDT and SOLUSDT (the symbols breakout_2 / tradeify_1 / velotrade_1 trade; BTCUSDT as context) and each non-price
  stream of the Binance USD-M archive (fundingRate, premiumIndexKlines, metrics, bookDepth; aggTrades listed only), what is the history span, are there gaps, do sampled
  files pass point-in-time/integrity checks, and which candidate held-out spans does each source cover? Also state what the lake is PLANNED to hold, labelled unverified.'
why_this_matters: 'Weekly priority: a live ML entry on every live-money account; the prop accounts have no price-only candidate. Time-disjoint design is mandatory
  (market-wide features identify the date, PI-20261105-GEXSLEAK-0001): metrics starts about 2021-12, so it cannot support the backward 2020-07..2021-12 held-out,
  which changes the design of step 2. A fail here closes the non-price route with evidence instead of a guess.'
decision_rule:
  id: RULE-RQ20261108-98e3-28-NONPRICE-USABLE
  registered_at: '2026-11-08'
  registered_before_run: true
  statistic: 'scripts/research/nonprice_inventory.py run: archive listing (data.binance.vision S3) + up to 3 sample files per (symbol, stream) verified against Binance''s
    .CHECKSUM, for ETHUSDT, SOLUSDT (required) and BTCUSDT (context).'
  rule: 'A (symbol, stream) is USABLE iff: the archive is reachable; the first listed day is <= 2022-01-01; inside [max(first day, 2022-01-01), run date] the share
    of missing days is <= 2% AND the longest missing run is <= 3 days; the last listed day is no more than 5 days before the run date; every one of 3 sample files
    (first, middle, last) passes its checksum, parses, has >= 99% non-null value columns, monotone timestamps, no timestamp more than 1 day after the file''s date
    (point-in-time sanity), and rows per day within 5% of nominal (metrics 288, premium 1m 1440; funding >= 2 events a day). USABLE-PARTIAL = every check passes but
    the first listed day is after 2022-01-01. NOT-USABLE = any check fails. INDETERMINATE = the archive or a sample could not be read (network), or fewer than 3 samples
    could be read. Families: funding_basis = fundingRate OR premiumIndexKlines; oi_flow = metrics; book_depth = bookDepth. A family counts iff some stream in it is
    USABLE or USABLE-PARTIAL for BOTH ETHUSDT and SOLUSDT. Unit verdict: PASS (step 2, feature ranking and a time-disjoint design, is justified) iff >= 2 families
    count; INDETERMINATE iff fewer count but undecided (INDETERMINATE) cells could still reach 2; FAIL otherwise. Coverage of each candidate held-out span (backward
    2020-07..2021-12; discovery 2022..2026-09; forward 2025-10..2026-09) is REPORTED per source and is NOT part of the verdict. Thresholds are not changed after any
    result.'
  proposal_mapping: 'PASS -> step 2: a pre-registered feature-family ranking unit on a time-disjoint design the covered spans allow; FAIL -> the non-price route is
    closed for these symbols; INDETERMINATE -> re-queue.'
  what_it_does_not_do: 'Trains no model, reads no label, touches no held-out price span, changes no roster, config or served model. It does NOT read the private lake:
    HF returns 403 (storage cap) and the Kaggle mirror is not a published_data target of the runner twin (row HF-LAKE-KAGGLE-LOADER), so the lake''s presence is reported
    as UNVERIFIED next to the plan in config/data_universe.yaml. The prop venues'' own funding/OI do not exist as data here: the Binance USD-M series are a PROXY
    for the underlying asset. aggTrades is listed, not graded.'
  min_n: 3 sample files per (symbol, stream)
compute: cpu_light
