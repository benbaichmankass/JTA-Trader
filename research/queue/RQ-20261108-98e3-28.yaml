why_not_inferential: 'A data census: it counts files, days, gaps and sample rows of a public archive and applies fixed thresholds to those counts. It estimates no
  effect from a sample, so an expected n and a minimum detectable effect would be theatre. The unit is graded on counts it measures, not on a statistic with sampling
  error.'
