  - --end
  - '2026-10-17'
  - --arm
  - W10=--donchian=10
  - --arm
  - W20=--donchian=20
  - --folds
  - '6'
  - --fold-majority
  - '4'
  - --n-floor
  - '10'
  - --pooled-n-floor
  - '39'
  - --breadth-frac
  - '0.5'
  - --rule-id
  - RULE-RQ20261026-1B57-14-WEEKLY-CRYPTO-TREND
  - --data-dir
  - '{out_dir}/data'
  - --out
