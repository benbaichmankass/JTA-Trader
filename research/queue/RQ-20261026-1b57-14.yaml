id: RQ-20261026-1b57-14
title: 'WEEKLY-bar Donchian (10 and 20) on the six core perps: does the weekly crypto trend clear Stage 0 where the daily one did not?'
status: queued
cadence: once
theme: timeframes
priority: 3
kind: experiment
question: ef5d-05 measured the weekly bar on ETFs/futures proxies (PASS); nobody has measured it on crypto. On Binance daily candles resampled to weekly bars (1W, right-labelled) for
  BTC/ETH/SOL/XRP/ADA/AVAX, 2020-01-01..2026-10-17, does Donchian 10 (W10) or 20 (W20) at the harness trail pass the pooled Stage-0 rule at pooled n >= 39 with >= 4 of 6 folds?
why_this_matters: 'Programme 07 TIMEFRAMES (operator 2026-10-18: lowest-priority theme but get tests into the queue). Prior work this builds on and does NOT repeat: RQ-20261018-ef5d-01
  (cost-viable bar x hold cells), ef5d-03/-04/-06 (daily Donchian / pullback, regime-filtered arms), 7c2b-03 (LONG transfer to basket A), RQ-20260930-504/505 and RQ-20261016-1fa6-07
  (sub-1h FAIL at taker cost). Time-series momentum at 1-12 months is the most replicated trend result (Moskowitz-Ooi-Pedersen 2012); the weekly bar is the cheapest way to hold a trade
  for months on a perp and the break-even study (ef5d-01) found every perp cost-viable at 4h and 1d. Expect INDETERMINATE on n (a weekly Donchian-10 makes a handful of trades per symbol
  per year): the n is itself the finding for whether the bar can be Stage-0-graded at all.'
power:
  expected_n: 70
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d = 0.45 at alpha 0.05 / power 0.8 needs 39 pooled trades. expected_n=70 is an ESTIMATE (ef5d-05's ~3 trades/symbol/year at weekly bars x six symbols x 6.8 years, doubled for
    two arms' overlap), not a measurement; below the floor the unit grades indeterminate, never FAIL.
  feasibility:
    source: none
    accrual_basis: Re-measurement on freshly fetched public candles over a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ20261026-1B57-14-WEEKLY-CRYPTO-TREND
  registered_at: '2026-10-26'
  registered_before_run: true
  statistic: 'harness_stage0.py --family trend --timeframe 1w (fetch 1d, harness --resample 1W); arms fixed now: W10=--donchian=10; W20=--donchian=20; --folds 6 --fold-majority 4 --n-floor
    10 --pooled-n-floor 39 --breadth-frac 0.5; cost = the harness''s own venue-aware fee + slippage + funding stack resolved by execution_costs.resolve_cost_policy() (never a zero default),
    recorded per cell in the result.'
  rule: 'PASS iff any arm passes (pooled n >= 39, pooled net_r > 0, >= 4 of 6 folds, >= half the powered cells n >= 10 pass) -> overlap read vs the live legs then a re-entry case under
    MD-PROMOTE-S0-S1, never a roster act. FAIL iff every arm fails with pooled n >= 39 (configuration closed on this window, horizon open). INDETERMINATE if pooled n < 39 for both arms:
    recorded as ''the weekly crypto bar is too slow to Stage-0 at six perps'', and the next unit pools more symbols rather than lowering the floor.'
  what_it_does_not_do: Edits no config and no roster, places no order, is not a promotion case; a best-of-k arm is a LEAD (programme 03 rung S0-C), never a finding; a FAIL closes the
    CONFIGURATION on this window, never the horizon. Candles are Binance USD-M daily/weekly (a PROXY for Bybit linear); funding is a directionless magnitude (execution_costs P1).
compute: cpu_long
value:
  usd_at_stake_per_month: 120
  confidence: 0.25
  bucket: frontier
  basis: 'stand-in: a candidate crypto position-trading leg at alpaca/bybit per-leg risk; an estimate, not a measurement.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 3.0
  est_minutes: 40
  why_runner: harness_stage0.py fetches keyless public candles (Binance Vision / Yahoo) and runs the repo harnesses; none of these symbols sit in metis-market-data, nothing is trainer-resident;
    CPU only.
  basis: Estimate from the comparable harness_stage0 runs of 2026-10-18..26 scaled by cells x arms x bars; the first run replaces it.
