id: RQ-20261112-3144-01
title: 'ITERATION 2 of ml-tm-action-value (fail): with a SHORT-HORIZON per-action label (the action''s value censored at 12 bars), is the
  per-action advantage predictable out of fold?'
status: done
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
- L-ATM
programme: P2
kind: experiment
question: 'TM-BENCH corpus v1 (tmb-73f5c3660014, the committed Q-TM1b emit), R1 + the path-state block, the same learner, folds and seed as
  RQ-20261101-78fc-04. Label changed: label_H[a][t] = net R(B0 + a at t, everything closed at bar t+1+H) - net R(B0, closed at bar t+1+H),
  H = 12 bars, full cost stack (first passage of whichever level is in force within H, else a mark-to-close at H). Does Stage-A out-of-fold
  rank calibration of the per-action advantage beat the within-trade shuffled control?'
why_this_matters: 'The full-trade label prices an action at t by everything that happens until the leg exits, often dozens of bars later, so
  most of its variance is path noise after the decision. That is a candidate reason the OOS action-value ceiling (0.86 R/trade) exists while
  no state selects it.'
