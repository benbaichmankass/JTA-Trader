id: RQ-20261028-2a2e-09
title: 'Model-family transfer to the SOL 1h regime head: does sklearn HistGradientBoosting or ExtraTrees beat the class prior on LOG-LOSS (SOLUSDT)?'
status: queued
cadence: once
roadmap:
- M25
theme: ml_health
priority: 2
kind: experiment
question: On the SOLUSDT 1h regime label, does HistGradientBoosting or ExtraTrees beat the class prior by >= 0.005 nats of multiclass log-loss on the CV mean?
why_this_matters: 'RQ-20261014-4591-04 and RQ-20261014-de02-01 ran the non-LightGBM families on BTC/ETH only; SOL''s advisory regime head (live) has only lgbm and catboost on record
  (65ff-24, 65ff-30). Model-family diversity check (frontier-research): capacity should not pile onto one family without the third symbol being read. Daily authoring lane 2026-10-28
  (DAILY-AUTHORING-20261028; research-queue-health H1-THEME ml_health: runnable 0 of share 9; kaggle_cpu idle with nothing due). Published data only (metis-market-data), so it lands
  on the idle Kaggle CPU backend.'
power:
  expected_n: 24000
  min_detectable_effect: 0.1
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'tail_rows 40000 with min_train_frac 0.4 leaves ~24000 out-of-sample rows over 5 folds per symbol; d=0.1 paired needs ~785 rows; bars are autocorrelated so effective n is lower:
    the rule requires the same-direction CV mean on EVERY symbol. expected_n is an ESTIMATE, not a measurement.'
  feasibility:
    source: none
    accrual_basis: 'Fixed by construction (tail_rows of a nightly-rebuilt shard): n does not grow with waiting, so an underpowered result is reported as such and the follow-up is a larger
      or different dataset, not a re-run.'
decision_rule:
  id: RULE-RQ202610282A2E09-ML
  registered_at: '2026-10-28'
  registered_before_run: true
  statistic: Paired per-fold difference in multiclass log-loss (baseline minus learner, positive = learner better) on identical purged folds (5, embargo 24 rows), mean over folds, per
    symbol.
  rule: PASS IF a candidate (hgb or extratrees) beats the class prior by >= +0.005 nats on the CV mean on SOLUSDT_1h. FAIL IF neither candidate beats the prior by >= 0 on the CV mean
    AND both arms were evaluated. INDETERMINATE otherwise, or if folds < 3 or an arm is unavailable.
  min_n: 3 usable CV folds per symbol; reported n_rows per symbol.
  what_it_does_not_do: Builds, calibrates and serves nothing, promotes nothing, touches no config; a log-loss PASS is not edge and not a P&L figure, and the head's advisory stage is
    unchanged.
compute: auto
value:
  bucket: ai_trader
  usd_at_stake_per_month: 100
  confidence: 0.2
  basis: 'stand-in: gates whether a model-family/health lever is worth building on the 1h heads; not a measured P&L'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  published_data: metis-market-data
  peak_memory_gb: 3.0
  est_minutes: 20
  basis: 'Estimate, NOT measured: CPU bake-off on the published 1h v002 shards the 4591/65cc units read; compute: auto routes it to the Kaggle CPU kernel.'
run:
  command:
  - python3
  - scripts/research/ml_bakeoff.py
  - --unit
  - '{unit}'
  - --out
  - '{out_dir}'
  timeout_minutes: 60
  inputs:
    research_unit: RQ-20261028-2a2e-09
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
programme: P2
related:
- scripts/research/ml_bakeoff.py
- scripts/research/market_data_export.py
- DAILY-AUTHORING-20261028
last_dispatched_at: '2026-10-28T09:41:07+00:00'
ml_bakeoff:
  baseline: prior
  candidates:
  - hgb
  - extratrees
  controls:
  - lgbm
  cv:
    embargo_rows: 24
    folds: 5
    min_train_frac: 0.4
  dataset:
    features:
    - rolling_log_return_vol
    - log_return
    - log_return_lag_1
    - log_return_lag_2
    - hour_of_day
    - dayofweek
    groups:
      SOLUSDT_1h:
        path: datasets-out/market_features/SOLUSDT/1h/v002/data.jsonl
    kind: jsonl
    tail_rows: 40000
    target: regime_label
    ts_col: ts
  higher_is_better: false
  learners:
    prior:
      kind: prior
    hgb:
      kind: sklearn_hgb
      params:
        learning_rate: 0.05
        max_iter: 200
        max_leaf_nodes: 31
        min_samples_leaf: 50
    extratrees:
      kind: sklearn_extratrees
      params:
        min_samples_leaf: 20
        n_estimators: 300
        n_jobs: -1
    lgbm:
      kind: lightgbm
      params:
        learning_rate: 0.05
        min_child_samples: 50
        n_estimators: 200
        num_leaves: 31
  metric: logloss
  rule:
    fail_if_no_candidate_reaches:
    - group: any
      op: '>='
      value: 0.0
      vs: baseline
      window: cv
    min_folds: 3
    pass_if:
    - group:
      - SOLUSDT_1h
      op: '>='
      value: 0.005
      vs: baseline
      window: cv
  task: classification
