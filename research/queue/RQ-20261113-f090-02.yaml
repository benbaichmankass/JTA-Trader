id: RQ-20261113-f090-02
title: 'EXIT LEVER on qqq_pullback_1h: trail-mult 4.0 / 6.5 on the long-only arm, holdout-selected, net of the full cost stack (iteration 4 from RQ-20261113-1751-02 PASS)'
cadence: once
roadmap:
