theme: live_strategy
priority: 2
kind: experiment
question: 'qqq_pullback_1h: S1 (long-only) was selected from 4 and read PASS on its held-back span (RQ-20261113-1751-02: held-back net +11.56 R, n 38; discovery +36.14 R, n 92, 3/4 folds); the adx_min family
  did not improve it (F1 2/4 folds ineligible, F2 +11.59 R). Does a different trail multiplier on the long-only arm, T1 4.0 or T2 6.5 against the declared 5.0, raise discovery net R and survive a held-back
  span, read once?'
why_this_matters: 'ITERATION 4 of qqq_pullback_1h (research-ops 2026-11-13 1545Z). 1751-02 attribution: filter family flat-to-worse (adx 20 ineligible; adx 25 discovery +11.59 R vs S1 +36.14 R), so the
  next untested family on the lever map is exits (trail_mult). DENOMINATOR: 3 arms (S1 as baseline A, T1, T2) selected on discovery, one read once. DISCLOSURE: S1 was read on this same held-back span by
  203c-03 and 1751-02, so the holdout is correlated evidence for S1 and virgin only for T1/T2; each extra read of S1 is re-read under M13 and the grader applies the deflated bar where the harness records
  it. A PASS with a non-baseline arm is a LEAD for a Tier-3 proposal NOTE, never a config edit.'
power:
  expected_n: 38
  min_detectable_effect: 0.57
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: expected_n = the 38 held-back S1 trades of 1751-02; a trail variant holds a similar count (an ESTIMATE); n < 25 held-back grades INDETERMINATE/underpowered, never FAIL.
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ20261113F09002-ITERATION
  registered_at: '2026-11-13'
  statistic: 'scripts/research/exit_lever_ablation.py --grade holdout on qqq_pullback_1h, window 2020-07-01 .. 2026-10-15 23:59, every arm ONE continuous harness pass, net of the full cost stack the harness
    resolves for the venue; per-trade net_r from --emit-trades. Arms fixed now: A: --side-filter=long (the S1 arm of 1751-02, trail 5.0); T1: --side-filter=long;--trail-mult=4.0; T2: --side-filter=long;--trail-mult=6.5.
    BOUNDARY, fixed before any outcome is read: the latest 25% of the calendar window, grown in 1% steps until it holds 25 of arm A entries, capped at 40%. DISCOVERY = trades whose entry AND exit precede
    the boundary; 4 equal calendar folds. HOLDOUT = the selected arm trades entered on/after the boundary. Regime-robustness clause: per-year table read in the result; a PASS with one calendar year above
    50% of net gain is reported as a LEAD with that caveat.'
  rule: 'SELECTION (discovery only): an arm is eligible iff discovery n >= 25 AND discovery net R > 0 AND >= 3 of 4 discovery folds net-positive; the eligible arm with the highest discovery net R is selected
    (a tie goes to A). HOLDOUT (read once): INDETERMINATE/insufficient_discovery IF every arm holds < 25 discovery trades; FAIL/no_discovery IF no arm is eligible; INDETERMINATE/underpowered IF the selected
    arm holds < 25 held-back trades; PASS/confirmed IF held-back net R > 0; FAIL/not_replicated otherwise (closes THAT configuration on THIS window, never the lever family). A PASS with a non-A arm is a
    LEAD for a Tier-3 proposal NOTE on the owning checklist row, never a config edit. Thresholds are not changed after any result.'
  what_it_does_not_do: Edits no config, roster or record and places no order. A backtest of a filter value on one leg is not edge and not a P&L claim; not a Tier-3 case; 4 arms are counted as the denominator
    and one configuration is read once on the holdout.
  registered_before_run: true
