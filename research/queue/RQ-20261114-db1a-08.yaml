decision_rule:
  id: RULE-ETH4H-TP4-NONINF-20261114
  registered_at: '2026-11-14'
  registered_before_run: true
  statistic: 'exit_lever_ablation --grade stage0 --days 800, arms A (config-exact: tp_r 50 sentinel + declared donchian_measured_move revision) and T4 (tp_r 4, revision kept) per window
    on the leg''s closed decision bar; two_window_lever_grade.py --non-inferiority-margin 2.0 applies the rule.'
  rule: 'Multiple-testing guard: names the prior attempts on this lever (RQ-20261028-a7c3-04 T3/T4 PASS +0.78R on 2020-07..2026-10, forming basis; RQ-20261104-c6f1-04 FAIL by its rule:
    tie on discovery; T4 read 15.92R vs 13.97R on its held-out span, n 76, REPORTED NOT GRADED). T4 is chosen because it is the doctrine-compliant finite target already tested and the
    held-out leader; because that choice saw held-out data, this unit tests NON-INFERIORITY only and can never support an edge claim. The margin 2.0R per window is fixed here before
    any run. PASS iff T4 net_r >= A net_r - 2.0 on the record window AND T4 net_r >= A net_r - 2.0 on the prior window; FAIL iff graded and not; INDETERMINATE iff T4 n < 20 on the record
    window, a run or arm is missing, or the harness refuses the arm (two TP movers). No threshold is relaxed.'
  what_it_does_not_do: Changes no config, roster, order or evidence record and makes no edge claim. A PASS is a Tier-3 doctrine-compliance proposal (tp_r 50.0 -> 4.0 + tp_intent mode
    r_multiple) for trend_donchian_eth_4h via the manager; the leg is on prop (tradeify_1, velotrade_1) and the bybit_1 demo floor, so the prop superset rule requires a prop EV re-run
    at tp_r 4 before any prop change.
  baseline: the leg config-exact on its closed decision bar (arm A), both windows, run in this unit.
