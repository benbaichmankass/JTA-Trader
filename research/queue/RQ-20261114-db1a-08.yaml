  2.0R net, on its closed decision bar, on the record year 2025-11-13..2026-11-12 AND the year before, net of the full cost stack?
why_this_matters: 'Row RM-AM-ETH4H-ENTRYTP (manager 2026-11-14 14:02Z; TP doctrine, operator 2026-10-06). check_tp_doctrine.py reads FAIL:entry_tp (sentinel 50R) for this leg on bybit_1,
  tradeify_1 and velotrade_1. The doctrine requires a REAL predictive take-profit at entry. This is a COMPLIANCE question (does the doctrine-compliant setting cost R), not an edge question:
  RQ-20261028-a7c3-04 passed T4 by +0.78R over 2020-07..2026-10 and RQ-20261104-c6f1-04 failed by its rule because the finite targets tie the incumbent on discovery (the declared measured
  move binds first). The leg trades the CLOSED bar since #25853, which neither earlier unit tested.'
