id: RQ-20261016-c56e-04
title: 'Pullback window length, real money: does moving xrp_pullback_2h''s pullback_lookback (5, 15, 20 bars) beat the declared pullback_lookback 10 on
  its 730-day window, net of the full cost stack?'
status: queued
cadence: once
theme: live_strategy
priority: 1
kind: experiment
question: On 2024-10-05 .. 2026-10-04 23:59, does any of the 3 pre-registered pullback_lookback (5, 15, 20 bars) arms on xrp_pullback_2h beat the leg as
  declared by >= 1.0 R, with no worse drawdown, in >= 3 of 4 calendar folds? Arm values fixed here before any run.
why_this_matters: 'xrp_pullback_2h is a real-money leg (bybit_2 + mirror) and the one real-money leg the Stage-0 census grades `drag` (2/4 folds positive,
  365d record); its live book is also BELOW_BACKTEST (RQ-20261015-8bbc-01: -8.84 R over 16 closes, 3.4th percentile). Tune before retire (perf-followup
  Track 1): Axes already measured on this leg and window: adx_min (470a-02 FAIL), pullback_frac (470a-04 FAIL), vol-skip-above (f0e2-11 FAIL), pullback
  short side (419b-02 NOT_CONFIRMED). pullback_lookback has never been swept on any pullback leg; it is the last structural entry axis on this leg after
  c56e-01..03.'
power:
  expected_n: 122
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'd=0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo''s standing E35 floor). expected_n=122 is MEASURED: arm B reproduced the committed
    730d record''s n=122 exactly in RQ-20261014-470a-04 on this window. The R bar is a MATERIALITY bar over the whole window (1.0 R for 2h pullbacks, programme
    03 § 2.4); the 3-of-4 calendar-fold majority refuses a one-period artifact.'
  feasibility:
    source: none
    accrual_basis: Re-measurement on freshly fetched keyless Binance Vision candles over a pinned window; the harness replays history, nothing accrues.
decision_rule:
  id: RULE-RQ20261016c56e04
  registered_at: '2026-10-16'
  registered_before_run: true
  statistic: 'Per arm, from the harness''s own --json summary (argv built by regime_debt_matrix.build_harness_cmd from config/strategies.yaml plus the arm''s
    tokens; full cost stack: fee + resolved slippage + funding via execution_costs.resolve_cost_policy, never a zero default): total_trades, net_total_r,
    max_drawdown_r, plus net_r per fold over FOUR equal calendar spans (same boundaries every arm). Arms: B = leg as declared (pullback_lookback 10); PL05=pullback_lookback=5;
    PL15=pullback_lookback=15; PL20=pullback_lookback=20. Per candidate C: dR = net_r(C) - net_r(B); dDD = maxDD(C) - maxDD(B); fold_wins = folds in which
    C out-earns B. Also reported per arm, not graded: net_r_per_capital_day (the programme''s headline measure).'
  rule: 'indeterminate IF the positive control fails (arm B must reproduce the committed record within 2% n and 0.5 R) or n(B) < 39 (underpowered: no verdict;
    never FAIL on thin n). A candidate C PASSES iff dR >= 1.0 R AND dDD <= 0 AND fold_wins >= 3 of 4. PASS IF any candidate passes (best = highest dR).
    FAIL IF none passes: the declared value stands and the axis is recorded honest_negative on this window for this leg. A PASS from a best-of-3 sweep is
    a LEAD, not a finding: it opens exactly one fresh-window confirmation unit (the passing arm alone vs B, on the disjoint window immediately preceding
    this one, same bars, no re-selection; 03-STRATEGY-IMPROVEMENT.md rung S0-C; programme node P3 tree), and no Tier-3 proposal is written until that unit
    reads CONFIRMED. The 1.0 R bar, the drawdown clause, the 3-of-4 fold majority and the 39 floor are not changed after any result.'
  what_it_does_not_do: Does not edit config or any roster. Does not mine values (fixed here). A PASS is a LEAD for rung S0-C, never a promotion case.
compute: cpu_light
value:
  usd_at_stake_per_month: 150
  confidence: 0.25
  bucket: own_losses
  basis: 'stand-in: a real-money 2h pullback leg plus its mirror (same basis as RQ-20261014-470a-04); estimate, not a measurement.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 20
  basis: One keyless Binance Vision fetch of ~760 days and 4 harness passes over it (RQ-20261014-470a-04 measured the same shape).
  why_runner: exit_lever_ablation.py fetches its own keyless candles (Binance Vision / Yahoo) and runs the repo harnesses; the symbol/timeframe is not in
    metis-market-data and the script has no published-data input, so the Kaggle-CPU and trainer backends cannot take it.
