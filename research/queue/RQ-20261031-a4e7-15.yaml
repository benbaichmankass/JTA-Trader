  - --rule-id
  - RULE-VOLWIN-A2-LONGER-HOLD
  - --data-dir
  - '{out_dir}/data'
  - --out
  - '{out_dir}'
  timeout_minutes: 240
  inputs:
    research_unit: RQ-20261031-a4e7-15
