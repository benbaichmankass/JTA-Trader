# Hand-authored 2026-10-31 by lane RESEARCH-PROP-REPLACEMENT-20261031 (Tier 1, Sonnet), dispatched by Manager Session 2026-10-31a. Decision rule registered BEFORE any run. Gates: none.
id: RQ-20261031-a4e7-15
title: 'VOL-WINDOW stage A2 (longer holds): on the lowest-cost lanes (SPY QQQ GLD SLV IAUM MES MGC USO, BTC ETH), do follow/fade/break rules held 120 and
  240 minutes beat the cost drag that sank the 15-60 minute holds, net of the full cost stack, on held-out folds?'
status: queued
cadence: once
theme: timeframes
priority: 2
kind: experiment
question: On the 5-minute candles 2020-01-01..2026-10-31 of the ten lowest-cost lanes, is there a (symbol, window, rule) cell, with windows of 120 or 240
  minutes from the seven clock anchors, rules C15, F15, O15 only, that is vol-stable (ratio >= 1.5 in >= 2 of 3 discovery and >= 2 of 3 confirmation folds)
  AND whose confirmation-fold mean net R has a Bonferroni-over-the-shortlist lower bound > 0 on >= 150 held-out trades with >= 2 of 3 confirmation folds
  positive?
why_this_matters: 'Stage A (RQ-20261031-28bf-01) found real volatility excess but no net edge at 15-60 min: follow and fade both lost (mean -0.27 R across
  the top 34 vol-stable cells), the signature of a friction-dominated short hold. DIAGNOSIS to test: cost is a large share of R when the R unit is the window
  own range at 15 min; longer windows have wider ranges, so the same bps cost is a smaller R. Decision changed: whether any window strategy / ML head /
  desk branch (P3-VOLWIN-s0-breakout, P2-VOLWIN-direction-head, P1-VOLWIN-desk-wake) is built at all. Programme node P3-VOLWIN-A2-longer-hold.'
practice_precedent: 'M4, M5 (docs/reference/trading-and-model-practice-principles.md): pre-registered rule, discovery/confirmation split with a purge, and
  a selection-deflated multiple-testing correction across every cell tried; none (house-specific) for the window grid itself.'
power:
  expected_n: 800
  min_detectable_effect: 0.2
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'Same per-cell confirmation n as stage A (about 800 equity, 1,200 crypto trades), so the minimum detectable effect is unchanged (about 0.1 to 0.14
    sd after correction). The family is smaller: 10 symbols x 7 anchors x 2 lengths x 3 rules = about 420 cells against 8,128 in stage A, so the Bonferroni
    M is smaller and the test is more sensitive. expected_n is an ESTIMATE.'
  feasibility:
    source: none
    accrual_basis: Re-measurement on freshly fetched public 5m candles over a pinned window; nothing accrues. The window is bounded by listing dates (SOL/AVAX
      2020-09) and by what the Dukascopy lane serves for each non-crypto symbol (named per symbol in the record).
decision_rule:
  id: RULE-VOLWIN-A2-LONGER-HOLD
  registered_at: '2026-10-31T23:00:00Z'
  registered_before_run: true
  statistic: 'Identical to RULE-VOLWIN-A-SCAN (RQ-20261031-28bf-01) except: lengths 120 and 240 minutes (scripts/research/vol_window_scan.py --lengths 120,240,
    self-tested), rules C15,F15,O15 (--rules), the hour-of-week slots off (--no-hour-of-week, they are 60 min), and the ten lowest-cost lanes. Same 6 folds
    of 2020-01-01..2026-10-31, +-1 day embargo, gate V (theta 1.5), n_floor 150, alpha 0.05, R unit = trailing median of the previous 20 occurrences window
    range, cost = execution_costs fee + slippage + perp funding magnitude.'
  rule: PASS iff >= 1 cell qualifies (shortlisted AND confirmation n >= 150 AND mean - z(1-0.05/M)*se > 0 with M the shortlist size AND >= 2 of 3 confirmation
    folds positive). PASS -> author the three VOLWIN nodes (P3-VOLWIN-s0-breakout, P2-VOLWIN-direction-head, P1-VOLWIN-desk-wake) on exactly the qualifying
    cells, treating a cell that qualifies only under the shortlist correction as a LEAD. FAIL iff BTC and ETH and >= 6 of the 8 non-crypto lanes measured
    and no cell qualifies -> this configuration (5m-grid entries, holds up to 240 min) is CLOSED, the window family stays open, and the volatility-excess
    table goes to the desk as calendar context only. INDETERMINATE otherwise (re-run on a fixed data lane; no threshold is lowered). Thresholds are not
    changed after any result.
  what_it_does_not_do: Edits no roster or config; is not a backtest of a strategy (no stops, one time-exit trade a day); does not use scripts/backtest_orb.py
    or src/backtest/backtester.py; no threshold or rule is tuned after seeing results; crypto candles are Binance USD-M (a PROXY for Bybit linear); the
    ETF/futures lanes are CFD proxies so their cells are Stage-0 leads even on a pass.
compute: cpu_long
value:
  bucket: structural
  usd_at_stake_per_month: 120
  confidence: 0.1
  basis: 'stand-in: decides whether any window strategy is built at all; an estimate, not a measurement'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 4.0
  est_minutes: 60
  basis: '14 symbols x 5m candles over 6.8 years (~700k bars each for 24/7 symbols): the keyless fetch dominates (Binance monthly zips; Dukascopy is the
    slow lane); the scan is vectorised numpy, ~189 windows x 5 rules per symbol. Estimate from a synthetic self-test (2 symbols x 4 years, 3 anchors + hour-of-week,
    13 s).'
  why_runner: The driver fetches public candles through scripts/ops/fetch_backtest_candles.py and the 5m series are not in metis-market-data (15m+1h only).
