id: RQ-20261101-e5b1-03
title: 'Calendar event study (richmond_fed_manufacturing_index): does the richmond_fed_manufacturing_index surprise vs the PIT survey consensus predict SPY forward
  returns at 1-5 trading days?'
cadence: once
theme: macro
priority: 3
kind: experiment
programme: P4
roadmap:
- M28
question: 'Using survey-consensus point-in-time rows (live feed plus survey backfill: 112 DISTINCT richmond_fed_manufacturing_index releases with a defined surprise,
  MEASURED 2026-11-01 by scripts/macro/econ_event_study.load_resolved_events_multi over comms/macro/econ_calendar_snapshots.jsonl + comms/macro/econ_calendar_snapshots_survey_backfill.jsonl),
  is Spearman(surprise = actual - consensus, forward SPY return) significant at 1, 3 or 5 trading days after the release at |t_eff| >= 3.5 (Bonferroni over 3 horizons
  x about 73 calendar-class studies registered to date)?'
why_this_matters: '`richmond_fed_manufacturing_index` has NO macro event study in the queue (scan of research/queue incl. blocked/, 2026-11-01: 0 richmond_fed_manufacturing_index
  units), while sibling classes already have repeated reads; the calendar-event-types work (CALENDAR-EVENT-TYPES, operator 2026-10-26) needs every collected class
  measured before any non-zero news-layer weight. A regional manufacturing survey (siblings ny_empire_state and philadelphia_fed are studied on ES=F/SPY); SPY is
  the index the regional-survey siblings used, sign not pre-registered. The t-bar is 3.5 as in the d5dd/3ef3 batches, so a single-class PASS is a discovery lead,
  not a result.'
power:
  expected_n: 112
  min_detectable_effect: 0.42
  effect_units: sd
  design: one_sample
  alpha: 0.01
  power: 0.8
  basis: 'Unit = one distinct release with a defined survey surprise (112, MEASURED 2026-11-01). Fisher-z: detecting rho at the registered |t| bar 3.5 with power
    0.8 needs atanh(rho) >= (3.5+0.8416)/sqrt(n-3), i.e. rho >= 0.42 at n=112. A FAIL therefore means "no effect >= ~0.42 sd at daily-close resolution", not "no effect".
    The queue power gate only tabulates alpha 0.01, so power.alpha is declared 0.01 (looser than the registered bar); min_detectable_effect is computed at the STRICTER
    t bar.'
  feasibility:
    source: none
    accrual_basis: n is a fixed historical backfill, not an accrual; the run prints releases, releases_with_value and price_bars so the bound is MEASURED and a short
      join lands INDETERMINATE, never padded.
decision_rule:
  id: RULERQ20261101e5b103
  registered_at: '2026-11-01'
  registered_before_run: true
  statistic: Overlap-corrected Spearman t (ic_t_eff) of surprise vs forward TLT return at horizons 1, 3, 5 trading days (scripts/macro/econ_event_study.py event_study,
    merged live+survey snapshots), graded by scripts/research/macro_event_study_run.py grade() with the CLI flags below.
  rule: 'PASS IF at some horizon in {1,3,5} with n >= 100, |ic_t_eff| >= 3.5 (sign not pre-specified: either direction is reported with its sign). FAIL IF every horizon
    has n >= 100 and none reaches the bar. INDETERMINATE IF any horizon has n < 100. no_data/producer_failed IF the price panel is empty or no release has a defined
    surprise: a route fault, not a verdict. Thresholds are not changed after any result.'
  min_n: 100 joined releases per horizon.
  what_it_does_not_do: A PASS is evidence for a weight-setting proposal (Tier 3, operator-gated; costs, a placebo, a sub-period split and the naive-floor check still
    owed), not a weight. Sets no weight, touches no config or order path. Daily closes cannot see the intraday reaction.
