id: RQ-20261022-bea9-03
title: 'TP doctrine COMPLIANCE, real money + prop: does trend_donchian_sol_prop with a REACHABLE 3R entry target
  plus the Donchian measured-move revision (width 0.5 / 1.0) no worse than the declared unreachable 6R bracket in
  5 of 6 folds over 2020-10..2026-10, at the Bybit cost stack?'
status: done
cadence: once
roadmap:
- L-ATM
- M20
theme: live_strategy
priority: 1
kind: experiment
question: 'trend_donchian_sol_prop trades on bybit_2 (real money), bybit_portfolio, bybit_1 and three prop books
  (breakout_2, tradeify_1, velotrade_1): 6 routings + 3 at stake, the most of any leg, and it FAILS BOTH doctrine
  dimensions -- the 6R target is reached by 1.9% of 370 harness trades (below the 10% TP-REACH-FLOOR) and the leg
  declares no revision rule. Fixed-target replacements all failed the replacement bar on 2020-10..2026-10 (MEASURED:
  RQ-20261018-006 K25 -4.67 R 2/6 folds; RQ-20261018-024 T3 -2.38 R 4/6, T4 +1.05 R 3/6; RQ-20261018-022 stall-pull-in
  retarget R2 +2.08 R 3/6). Two things are untested on this leg: a target that MOVES by the leg''s own structure
  (the measured-move rule live on trend_donchian_eth_4h since 2026-10-18, src/runtime/tp_revision.py) and the doctrine''s
  full shape -- a reachable entry prediction (3R: reach 15.3% uncapped, RQ-20261016-004) that then moves. Neither
  arm has ever been run, so this window is not spent for them.'
why_this_matters: 'Every earlier TP-lever unit on this leg asked a REPLACEMENT question -- beat the incumbent by
  a materiality bar of 0.02 R x n(A) -- which is the right bar for a P&L-motivated swap. The TP doctrine (docs/ARCHITECTURE-CANONICAL.md
  § ''TP doctrine'', operator 2026-10-06, binding) makes compliance itself the motive, so a revision that is no
  worse than the incumbent is the doctrine''s answer; a materiality bar makes compliance unreachable for any roughly
  P&L-neutral revision. This unit asks the COMPLIANCE question: everything as the programme''s replace bar (fold
  supermajority, 0.35 drawdown tolerance, 39-trade floor) except the materiality term, which is 0. Real-money +
  prop routings are first by money at stake; this is the one leg where entry_tp and tp_revision both fail.'
