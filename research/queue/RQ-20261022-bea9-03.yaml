decision_rule:
  id: RULE-W43-SOLPROP-ENTRY3-MM-COMPLIANCE
  statistic: 'From scripts/research/exit_lever_ablation.py --grade replace on trend_donchian_sol_prop, window 2020-10-01
    .. 2026-10-15 23:59 (6 equal calendar folds; a trade is binned by entry time), net of the full cost stack the
    harness resolves per venue (execution_costs.resolve_cost_policy; recorded per arm as cost_stack). Per arm from
    the harness''s own --json summary: n, net_total_r, max_drawdown_r, net R per fold, net_r_per_capital_day, by_outcome.
    A = the leg as declared in config/strategies.yaml on the run''s ref (argv built by regime_debt_matrix.build_harness_cmd).
    Candidates: E3MM05 = tp_r 3.0 + tp_revision donchian_measured_move width_mult 0.5; E3MM10 = the same at width_mult
    1.0 (named before this run). Per candidate C: delta = net_r(C) - net_r(A); folds_ge = folds where net_r(C) >=
    net_r(A) (ties count); maxDD(C) vs maxDD(A). Reported, not graded (the doctrine read below): tp_share = by_outcome.take_profit
    / n(C) (the realised reach of the final target), lever_fired, net_r_per_capital_day(C) vs (A); clamped_share
    = params.tp_revisions_clamped / params.tp_revisions_applied (a share >= 0.5 means the moving target mostly sits
    at the venue cap).'
  rule: 'INDETERMINATE IF n(A) < 39 (underpowered: no verdict, never FAIL on thin n). A candidate C PASSES iff net_r(C)
    > net_r(A) AND folds_ge >= 5 of 6 AND maxDD(C) <= maxDD(A) x 1.35 (the harness grades exactly this with --delta-r
    0 --delta-r-per-trade 0, so the unit is gradable as registered). PASS IF one or more pass: the passing candidate
    with the highest net R is named, and the follow-on is the DOCTRINE READ, registered here: if tp_share(C) < 0.10
    (the TP-REACH-FLOOR) OR lever_fired is false OR net_r_per_capital_day(C) < net_r_per_capital_day(A), the PASS
    is forwarded to the manager as ''P&L without a reachable prediction'', not a declare; otherwise it is the evidence
    record for a Tier-3 declare proposal of tp_r 3.0 + that tp_revision block on bybit_2 + bybit_portfolio + bybit_1
    (mirror equality) -- with clamped_share >= 0.5 also forwarding it as ''at the cap''; the three PROP routings
    additionally wait on the prop EV/survival gate at the prop cost stack (Programme 01 node P1-Q4-solprop-propcost),
    never a lower bar -- a note on row TP-DOCTRINE-W43 (or TP-DOCTRINE) for the manager, never a config edit. FAIL IF none passes
    -> the measured-move family is retired on sol_prop at both widths under the compliance bar; the leg''s doctrine
    route is the in-trade exit model on the legs as traded (Programme 01 Q8), and the 6R sentinel-under-another-name
    stays reported as debt. Thresholds (zero materiality, 5/6 folds, the 0.35 drawdown tolerance, the 39 floor,
    the 0.10 tp_share read) are not changed after any result.'
  what_it_does_not_do: Edits no config and places no order. Not a prop-cost measurement (Bybit stack only). tp_share
    is a reach proxy, not calibration (row ABLATION-TP-CALIBRATION). Two candidates on one window is a multiple
    comparison; the 5/6 fold supermajority carries it.
