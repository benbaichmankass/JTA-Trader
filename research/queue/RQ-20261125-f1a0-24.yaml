    excludes_test_folds: true
    note: 'one fixed rule, not chosen on any fold; no grid was searched'
  bootstrap_group: week
practice_precedent: rule registered before the run, net of the full cost stack, matched random control and week-clustered se (principles R5, M6,
  M13).
