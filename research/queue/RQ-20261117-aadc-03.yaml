# Hand-authored 2026-11-17 by lane ML-PRIMARY-5 (Tier 1 research), dispatched by Manager Session 2026-11-15a. D4 slot iteration:
# the "faster D4 lever" the slot table names (docs/research/ml-slot-iteration-2026-11-17.md: a challenger that disagrees with Beagle-1
# more often, via a different target, not a threshold). Decision rule registered BEFORE any run. Gates this adds or changes: none.
id: RQ-20261117-aadc-03
title: 'D4 Beagle-1 challengers that change the TARGET: on the same CPCV splits, does a tail-winner (P(net_r >= 1R)) or a money-weighted
  (|net_r|-weighted P(win)) overlay pass the V1 gate, beat Beagle-1 paired, AND disagree with it on >= 20% of decisions?'
status: done
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
programme: P2
kind: experiment
question: 'On the TD family Stage-0 corpus 2020-07-01..2026-10-15 (the cc86-01 main window, the 4 real-money gate legs plus 4 training-only
  siblings), CPCV N=6 k=2 with purge + 7-day embargo: refit Beagle-1''s recipe (L2 logistic, C 0.1, q 0.20, target net_r > 0) and two
  challengers with the same features, config and q but target (a) tail1r: net_r >= 1 R, (b) evweight: net_r > 0 weighted by |net_r|
  (clip 0.05..5). Per arm: does it pass the V1 gate vs take-all, is its paired mean overlay R above Beagle-1''s, and how often do the two
  disagree?'
why_this_matters: 'D4''s only live iteration is the forward read cc86-02 (EV-threshold challenger): it disagrees with Beagle-1 on ~8.7%
  of packages, so its n = 60 disagreement packages takes ~2.5 years (ESTIMATE, cc86-02 power block). The pre-2020-07 holdout windows
  are read 3x (M13), so no further historical holdout read is authored on Beagle-1. A challenger that changes what is predicted
  disagrees more, and the forward read shortens in proportion. The diagnosis below says the target is the lever, not the threshold.'
iteration:
  subject: ml-overlay-td-v1
  subject_kind: ml_model
  from_result: RQ-20261029-5785-05
  verdict_read: fail
  diagnosis: '5785-05 (TD spot holdout, n 424) FAILED with dR -0.021: the reduce halves trades that average +0.21 R against +0.31 R for
    take-all, i.e. it cuts trades that are still net POSITIVE. A trend book is paid by a few tail winners; a P(win) model ranks by win
    rate, which is not the payoff. cc86-01 (EV threshold, same P(win) model) moved only the cut-off and disagreed on 8.7% of trades:
    NOT A WIN (paired +0.0241, LB95 +0.0053, deflated -0.0002, n 1,587). Untested on the lever map: the label/target family. Two targets
    address the diagnosis directly: tail1r (rank by P(tail winner)) and evweight (rank by money).'
  search: 'one factor, the target family (win | tail1r | evweight), features/config/q fixed at Beagle-1''s; 2 challenger arms, both
    counted'
  attempt: 1
  due_by: '2026-11-24'
  map_entries:
  - research/levers/ml-overlay-td-v1.yaml
levers:
- name: overlay_target
  values: [win (base, Beagle-1), tail1r, evweight]
  hypothesised_effect: a money-aligned target cuts fewer still-positive trades, so the reduced trades' mean R falls below take-all and
    the paired R vs Beagle-1 rises, at a disagreement rate well above 8.7%
evidence_class:
  holdout: none
  claim: edge
power:
  expected_n: 1587
  min_detectable_effect: 0.02
  effect_units: metric
  sd: 0.34
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'INFERRED. expected_n = gate-leg OOS trades in this window (cc86-01 n 1,587). Paired d = (m_ch - m_base) x R is non-zero only on
    disagreement trades: at a 20% disagreement rate and per-disagreement |d| sd ~0.75 R (cc86-02 basis), sd(d) over all trades ~0.75 x
    sqrt(0.2) ~ 0.34 R; month-block clustering roughly doubles the SE, so MDE ~ 2 x 2.8 x 0.34 / sqrt(1587) ~ 0.024 R. This is a DEV
    SCREEN on the window Beagle-1 was selected on: the rule needs a positive paired point estimate, not a CI, and the decision to swap
    rests on the forward read a PASS creates. Stated before the run.'
  feasibility:
    source: none
    accrual_basis: Replays public candles through the Stage-0 harness; nothing accrues.
baseline:
  definition: 'Beagle-1''s recipe (target win, C 0.1, q 0.20, multiplier 0.5) refit on the SAME CPCV training folds, scored on the same
    test folds (the paired control); take-all (multiplier 1.0) for each arm''s own V1 gate; the V1 same-rate random reduce (2000
    permutations within calendar groups).'
  net_of_cost: true
decision_rule:
  id: RULE-RQ20261117-aadc-03-D4-TARGET-CHALLENGER
  registered_at: '2026-11-17'
  registered_before_run: true
  baseline: Beagle-1's recipe on the same CPCV splits (paired); take-all and same-rate random for each arm's own gate
  statistic: 'scripts/research/ml_overlay_noninferior.py --cpcv-challenger tail1r --cpcv-challenger evweight (function cpcv_challengers):
    on the 4 gate legs'' CPCV out-of-sample trades, net_r cost-net (fee + slippage + funding) in R of initial risk. Per arm: (own) the
    RULE-ML-OVERLAY-NONINFERIOR-V1 checks a-e vs take-all (evaluate); (paired) mean of d = (m_ch - m_base) x net_R on path-averaged
    multipliers, with month-block one-sided LB95 and LB at alpha/3 reported; (disagree) share of (trade, CPCV path) cells where the two
    arms'' multipliers differ. Reported: each arm''s reduce rate, reduced-trade mean R, target base rate, maxDD and CVaR5 of both arms,
    the family V1 verdict of Beagle-1 itself.'
  rule: 'Per arm: PASS iff own V1 gate passes (all of a-e) AND paired mean d > 0 AND disagree >= 0.20. UNIT: PASS iff at least one arm
    passes; the chosen arm is the passing arm with the higher paired mean (2 arms counted; the paired LBs are reported, not gating, because
    this is a dev screen and the swap needs the forward read). FAIL iff no arm passes. INDETERMINATE iff the family corpus is
    INDETERMINATE by the V1 harness reasons (parity < 0.98, n_gate < 200, unaligned trades). Thresholds fixed now.'
  pass_action: 'The run exports the chosen arm (fit on the whole main-window pool) to {out_dir}/challenger/overlay_td_<target>.json.
    Next: (1) propose it to the manager as a SECOND shadow challenger in ml/overlay/challengers/ (log-only beside Beagle-1 and the EV
    challenger; src/runtime/overlay_shadow.py already logs every artifact in that dir; a deploy of a log-only artifact, never a sizing
    change); (2) author its forward paired read, n = 60 disagreement packages, with the accrual estimate scaled by the measured disagree
    rate.'
  fail_action: 'Iteration input. If an arm passes its own gate and the paired test but disagrees < 0.20, the target is acting as a
    threshold in disguise: the next lever is the FEATURE family (e.g. the path_state block, made live-computable in overlay_features
    first). If the reduced trades'' mean R is still above the take-all mean, record that response for the target lever on the lever map
    and choose the next untested family from it.'
  what_it_does_not_do: 'Changes no config/overlay_policy.yaml mode, no artifact under ml/overlay/, no sizing, no order; claims no holdout
    read (the window is the dev window Beagle-1 was fit on, said so); adds no gate. A PASS is a shadow-logging proposal plus a forward
    unit, never a swap.'
  min_n: 200 gate trades (the V1 harness floor)
practice_precedent: 'M1 (label what you are paid for: a trend book''s payoff is its tail, so the meta-label should be), M4/M5 (every arm
  counted, paired against the incumbent on identical splits), docs/reference/trading-and-model-practice-principles.md'
intervention_controls:
  matched_random:
    draws: 2000
    note: the V1 same-rate random reduce (permutation within calendar groups), applied to each arm's own gate
  best_static:
    grid:
    - target_win_c0.1_q0.20 (Beagle-1, fixed)
    - target_tail1r_c0.1_q0.20
    - target_evweight_c0.1_q0.20
    excludes_test_folds: true
    note: nothing is tuned on a test fold; every arm uses Beagle-1's fixed C and q, and each CPCV split fits on its training folds only
  bootstrap_group: month
  hold_to_bracket: true
  hold_to_bracket_note: every arm keeps the leg's own entry, bracket and exit; only the size multiplier (1.0 or 0.5) differs
compute: cpu_light
