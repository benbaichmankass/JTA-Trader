id: RQ-20261029-a538-10
title: 'Prop stop width: does SL x1.25 (3.125 ATR) or x0.8 (2.0 ATR) beat the declared 2.5 ATR on eth_pullback_prop_2h net of the prop cost stack?'
status: queued
cadence: once
roadmap:
- L-PROP
theme: new_strategy_prop
priority: 1
kind: experiment
question: On eth_pullback_prop_2h over 2020-07-01..2026-10-15 23:59 at the breakout_1 stack, does atr_stop_mult 3.125 (SL125) or 2.0 (SL80) beat
  2.5 (A) by >= 0.02 R x n(A) in >= 4 of 6 folds with maxDD <= 1.35 x A?
why_this_matters: On a prop account the stop width sets both R and the daily-loss budget per trade; the counterfactual grader (scripts/research/counterfactual_grader.py)
  reads post-exit paths on live closes, but a stop-width verdict needs the harness grid over history first. atr_stop_mult is untested on every
  prop-roster leg except sol_prop.
power:
  expected_n: 80
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'd=0.45 at alpha 0.05 / power 0.8 needs (1.96+0.8416)^2/0.45^2 = 38.8 -> 39 trades (the repo standing E35 floor). expected_n=80 is an
    ESTIMATE from sibling units on this leg family, NOT a measurement; below 39 the unit grades INDETERMINATE, never FAIL. The 0.02 R x n bar
    is a materiality bar, not a powered effect: a PASS is a discovery lead and a FAIL closes the configuration only.'
  feasibility:
    source: none
    accrual_basis: Re-measurement on freshly fetched public candles over a pinned window; nothing accrues.
decision_rule:
  id: RULERQ20261029A53810
  registered_at: '2026-10-29'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg eth_pullback_prop_2h --grade replace, window 2020-07-01 .. 2026-10-15 23:59, 6 equal
    calendar folds by entry time, net of the prop cost flags in the arm argv (7.5 bps fee + 5.0 bps slippage round trip + 1.0 bps funding/window,
    the breakout_1 stack). Arms fixed now: A = the leg as declared in config/strategies.yaml; candidates SL125, SL80. Per arm: n, net_total_r,
    max_drawdown_r, net R per fold.'
  rule: 'INDETERMINATE IF n(A) < 39 or IF every candidate arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C)
    > net_r(A) AND delta >= 0.02 R x n(A) AND net R(C) >= net R(A) in >= 4 of 6 folds AND maxDD(C) <= maxDD(A) x 1.35. PASS IF one or more pass:
    the best by net R is named and the follow-up is ONE confirmation unit on a disjoint window (a PASS on one window is a discovery; the denominator
    is the number of candidate arms in this unit), then a live-producer check and a Tier-3 declare PROPOSAL with the mirror in the same PR, never
    a config edit. FAIL IF none passes with n(A) >= 39: THIS arm grid is closed on eth_pullback_prop_2h for this window and the family is NOT
    retired; the record names the arm that moved closest. Thresholds and the arm grid are not changed after any result.'
  what_it_does_not_do: 'Edits no config and no roster, places no order, is not a promotion case. A PASS also needs a live producer for the lever
    and a Tier-3 declare. The arm grid is the whole search: no arm is added after the run, and the baseline is the declared leg, not a tuned one.'
intervention_controls:
  not_applicable: a parameter-width ablation of the declared entry/exit geometry run through the harness, not an in-trade action or active-management
    intervention
compute: cpu_light
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 4.0
  est_minutes: 40
  why_runner: Fetches keyless public candles for a pinned window; reads no trainer data; CPU only.
  basis: Estimate from comparable exit_lever_ablation runs of 2026-10-26..29; the first run replaces it.
value:
  usd_at_stake_per_month: 200
  confidence: 0.15
  bucket: structural
  basis: planning weight; prop stop-width, an estimate
run:
  command:
  - python3
  - scripts/research/exit_lever_ablation.py
  - --leg
  - eth_pullback_prop_2h
  - --arm
  - A=--fee-bps-roundtrip=7.5;--slippage-bps-roundtrip=5.0;--funding-bps-per-window=1.0
  - --arm
  - SL125=atr_stop_mult=3.125;--fee-bps-roundtrip=7.5;--slippage-bps-roundtrip=5.0;--funding-bps-per-window=1.0
  - --arm
  - SL80=atr_stop_mult=2.0;--fee-bps-roundtrip=7.5;--slippage-bps-roundtrip=5.0;--funding-bps-per-window=1.0
  - --days
  - '2330'
  - --start
  - '2020-07-01'
  - --end
  - 2026-10-15 23:59
  - --grade
  - replace
  - --baseline
  - A
  - --delta-r
  - '0'
  - --delta-r-per-trade
  - '0.02'
  - --folds
  - '6'
  - --fold-majority
  - '4'
  - --dd-tol-frac
  - '0.35'
  - --n-floor
  - '39'
  - --out
  - '{out_dir}'
  timeout_minutes: 150
  inputs:
    research_unit: RQ-20261029-a538-10
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
related:
