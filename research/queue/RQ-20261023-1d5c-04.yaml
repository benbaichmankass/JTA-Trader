kind: experiment
question: On trend_donchian_sol_prop (prop leg), does a trail that tightens to 2.5 x ATR only while peak_r >= 1.5 AND chop_6 > thr (thr 0.55 / 0.65 / 0.75 declared
  now) beat the declared exit A by >= 0.02 R/trade in >= 4 of 6 folds within the Path B drawdown bar, AND beat the ungated R-armed tight trail UT?
why_this_matters: 'Operator directive 2026-10-22: an idea that failed one test is not dead; it failed the first test. This unit is a registered VARIANT/EXTENSION.
  Lane AUTHOR-FLOOR-1023B (research runnable floor 47 vs 59 at 18:45Z; regime 8 vs share 14, new_strategy_prop 7 vs 17). First test(s): RQ-20261023-a1f3-11 (hot-vol
  trail on sol_prop, queued) and the ADX-trail first tests on the 4h/prop legs. Diagnosis (one line, a hypothesis not a finding): the hot-vol trail and ADX trail
  arms on sol_prop are queued or failed on a volatility/strength axis; the chop gate conditions on the realised path of THIS trade, and on a prop leg with a daily-drawdown
  limit a give-back cut after a profitable run is worth most'
power:
  expected_n: 120
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d=0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo's standing E35 floor). expected_n=120 is an ESTIMATE from sibling units on this leg/window, not
    a measurement; below 39 the unit grades indeterminate, never FAIL.
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ202610231D5C04-SOLPROP-CHOPGATE
  registered_at: '2026-10-23'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg trend_donchian_sol_prop --grade replace, window 2020-07-01 .. 2026-10-15 23:59, 6 equal calendar folds
    by entry time, net of the full cost stack the harness resolves per venue (execution_costs.resolve_cost_policy, recorded per arm as cost_stack). Arms fixed now:
    A = the leg as declared in config/strategies.yaml; candidates C55, C65, C75; control UT. The gate flags are the PATHSTATE-TRAIL-GATE contract. Per arm: n, net_total_r,
    max_drawdown_r, net R per fold.'
  rule: 'INDETERMINATE IF n(A) < 39 or IF every candidate arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C) > net_r(A) AND delta
    >= 0.02 R x n(A) AND net R(C) >= net R(A) in >= 4 of 6 folds AND maxDD(C) <= maxDD(A) x 1.35 AND net_r(C) > net_r(UT) (the UNCONDITIONAL control UT: the same
    action on every trade the gate would reach, so a PASS cannot be ''any early action''). PASS IF one or more pass: the best by net R is named and the follow-up
    is ONE confirmation unit on a disjoint partition (a PASS on one window is a discovery), then a live-producer check and a Tier-3 declare PROPOSAL with the mirror
    in the same PR, never a config edit. FAIL IF none passes with n(A) >= 39: this arm grid is closed on trend_donchian_sol_prop for this window and the family is
    NOT retired; the record names the arm that moved closest and the next variant (chop window 12, tight mult 3.5, or an ER-feature gate). Thresholds and the arm
    grid are not changed after any result.'
  what_it_does_not_do: 'Edits no config and no roster, places no order, is not a promotion case. A PASS also needs a live producer for the lever (check the leg''s
    monitor) and a Tier-3 declare. The arm grid is the whole search: no arm is added after the run, and the baseline is the declared leg, not a tuned one. prop leg.'
