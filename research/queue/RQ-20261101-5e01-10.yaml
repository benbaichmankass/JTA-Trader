question: 'Replace ml_entry_v2''s declared SL/TP mechanism (ML entry harness; ATR stop 2.0, TP 2.0R) with a dynamic structure-based SL and TP and compare
  it with the declared exit on the same entries. ML signals are fixed; only the bracket changes. Operator 2026-11-01: dynamic structure-based exits are
  the default until a leg''s own net-of-cost evidence proves another exit better; this unit is that evidence for this leg.'
why_this_matters: 'Operator 2026-11-01 ~23:00Z (verbatim in ARCHITECTURE-CANONICAL § Active management, ''The default exit''): structure-based SL and TP
  are the default for all strategies and ML. Row STRUCTURE-EXITS-DEFAULT. Real-money first; a PASS is a discovery, never a config change.'
power:
  expected_n: 400
  min_detectable_effect: 0.1
  effect_units: R
  sd: 1.2
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATE (sd 1.2 R is the assumed per-trade sd also used by the 5e02 sibling units; the test is one-sample on the per-trade difference between
    arms (same entries), whose sd is expected to be smaller than the per-trade sd, so 1.2 is conservative; sd of the per-trade difference; the first run
    replaces it): ESTIMATE: leg-level Stage-0 trade counts of 2020-07..2026-10 runs are 400-700 for 2h/4h crypto legs and thinner for 1d legs; n >= 39 floor
    below which the leg grades INDETERMINATE, never FAIL. The first run replaces it.'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues. The detector and harness arms are the blockers,
      not the data.
evidence_class:  # EVIDENCE-CLASS-BACKFILL 2026-11-11, rule E2 (scripts/research/backfill_evidence_class.py)
  holdout: in_sample
  claim: edge
decision_rule:
  id: RULE-STRUCTURE-EXITS-V1
  unit_rule_id: RULE-RQ20261101-5E01-10-STRUCT-EXIT
  registered_at: '2026-11-01'
  registered_before_run: true
  statistic: 'Per leg, exit_lever_ablation.py (the leg''s own Stage-0 harness, same argv build_strategy_evidence.py uses) over the pinned window 2020-07-01..2026-10-15,
    6 equal calendar folds by entry time, net of the full cost stack the harness resolves per venue (fee + slippage + funding, recorded per arm as cost_stack).
    Arms: A = the leg as declared (hold-to-bracket); S = structure SL+TP; R = 100 seeded matched-rate random-exit controls. Entries are fixed: the declared
    leg''s own signals in every arm. Per arm: n, net R, max drawdown R, weekly CVaR5, R giveback (peak MFE R - realised net R) mean and p95, net P&L %.'
  rule: 'Structure arm S (ONE factor: the source of the SL and TP levels; sizing, entries, venue, cost stack unchanged). SL = beyond the most recent CONFIRMED
    swing (N-bar pivot, N left = N right) on the adverse side minus 0.25 ATR, clamped to [0.5, 3.0] x the declared atr_stop distance; it ratchets only toward
    price to each newly confirmed favourable swing and never loosens. TP = the nearest opposing liquidity level (swing extreme or unfilled FVG edge) at
    >= 1.0 R, re-estimated on each newly confirmed level and extend-only (src/runtime/tp_revision.py tp_extend semantics). The pivot N in {3, 5, 8} is the
    ONLY dev-selected parameter: chosen on 5 folds, scored on the held fold (leave-one-fold-out); the clamp and buffer constants are fixed here and never
    tuned. VERDICT per leg on the 6 held-out fold scores. PASS_BETTER: mean net R per trade of S exceeds A and the paired week-bootstrap 95% lower bound
    of (S - A) is > 0, in >= 4 of 6 folds, and S beats the 95th pct of the 100 random-exit controls (R4); n >= 39 else INDETERMINATE. PASS_NONINFERIOR:
    lower bound of (S - A) > -0.05 R/trade, R4 holds, and RULE-AM-RISK-ADJUSTED-V1 R2 (book max drawdown or worst-5% weekly outcome cut >= 15%) holds. FAIL
    otherwise. INDETERMINATE if n < 39, S never differs from A, or the controls or detector are missing. A PASS is a DISCOVERY: ONE confirmation run on
    post-window data, then a per-leg Tier-3 apply PR; the per-trade-R run is a screen until BOOK-SIM-REAL-SIZER exists (canonical Active management clause
    4). Thresholds, grid, seeds and window are not changed after any result.'
  what_it_does_not_do: Edits no config, roster, mandate or live-review policy and places no order. A PASS is not a promotion. Harness fills a stop at the
    stop price (no gap), equally in S, A and the R controls.
amendments:
- at: '2026-11-27T03:34Z'
  by: lane ML-PRIMARY (row ML-STRUCTURE-ENTRY-V2-POPULATION, assigned by Manager 26a 2026-11-27 03:18Z)
  before_any_run: true
  what: 'HARNESS changed, rule and thresholds unchanged (same amendment shape as 5e01-09). Registered harness: scripts/research/exit_lever_ablation.py --leg ml_entry_v2. Harness actually used: scripts/research/ml_structure_unit.py via ml_entry_v2_run.py levers, population ml_entry_v2 (structure_unit_v2): the decisions are those of the served leg ml-decision-entry-v2 as the b608 winning stack S3_R2_gate_24 makes them -- R2 recipe fold members, thresholded at the c692 base decision share (set before the gate), cost-per-R gate 0.06, decisions on the table relabelled at the registered bracket SL 2.0 ATR / TP 2.0 R = 4.0 ATR; scored on the leg''s own symbols re-parsed from config/strategies.yaml::ml_entry_v2.symbols (the wider pool only feeds cross-section features); the declared arm''s decisions re-scored with ml_structure_bracket.label_cell_structure at pivot 3/5/8 plus 100 seeded random-exit controls.'
  why: 'exit_lever_ablation replays a leg''s Stage-0 backtest harness; ml_entry_v2''s decisions come from fitted fold models, which only the ML walk-forward can express (the same reason as 5e01-09). Arms A / S3 / S5 / S8, entries fixed, pivot chosen leave-one-bin-out on 5 of 6 calendar bins and scored on the held bin, paired week-bootstrap lower bound, >= 4 of 6 bins, R4 vs 100 random-exit controls, PASS_NONINFERIOR via R2, n >= 39 else INDETERMINATE, net of the full cost stack. No threshold, grid, seed or window changed. Implementation choices the registration did not fix: the 6 bins regroup the out-of-sample trades into equal spans of entry time; the first seed decides (others reported). The unit had not run and no result was seen. Tests: tests/test_ml_structure_unit.py.'
