id: RQ-20261101-5e01-10
title: 'Structure-based SL+TP (ML bracket) (swing / FVG / liquidity, ratcheting) vs the declared exit on ml_entry_v2 (bybit_1 (demo floor; served)): does
  it beat the current exit net of the full cost stack, held-out?'
status: queued
cadence: once
theme: live_strategy
priority: 1
roadmap:
- L-AM-STANDARD
kind: experiment
practice_precedent: 'T1, T2, T3, T4, T8 (docs/reference/trading-and-model-practice-principles.md): intervention judged against hold AND a matched random
  intervention, per leg, entries fixed, net of cost.'
