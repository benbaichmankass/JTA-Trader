practice_precedent: 'M2 + M4 (docs/reference/trading-and-model-practice-principles.md): one lever per cell; a second lever on a leg that already carries one needs a single-vs-combo read against the CURRENT
  incumbent before any declare.'
question: 'slv_pullback_1d: against the leg''s CURRENT live exit (trail 4.0 + trail_decay 6 / 2.0), does the momentum-stale time stop (momentum_stale_bars 8, adx_below 20) improve net R as a REPLACEMENT
  for trail_decay or ADDED to it, net of the full cost stack, under the same replace grade that confirmed it?'
why_this_matters: 'NODE P1-Q6-slv1d-declare (manager ask, research-ops 2026-11-17). RQ-20261016-016 CONFIRMED momentum_stale 8/20: 20.73 R vs 12.82 R (n 89 vs 69, 3/4 folds, DD 6.36 vs 7.02, 2018-03..2026-10)
  -- but its control A carried NO trail_decay: the pullback argv builder omits --trail-decay-* (exit_lever_ablation.py docstring and self-test; read in the result''s A argv), while the live leg has run
  trail_decay 6/2.0 since the M20 P4.1 sweep (PR #6251, 2026-07). So the Oct-18 confirmation was against a baseline that is NOT the live exit, and the live trail_decay was never compared with momentum_stale:
  NOT superseded, and NOT packet-ready. The producer block is gone (MOMENTUM-LEVERS-LIVE done; src/runtime/momentum_levers.momentum_stale_verdict is wired). The baseline here passes the live decay as raw
  flags so A_live IS the live exit. On PASS: a Tier-3 packet for alpaca_live + alpaca_portfolio; on FAIL: the node closes as superseded by the live trail_decay.'
power:
  expected_n: 75
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: control n 69 on 2018-03..2026-10 in RQ-20261016-016 (MEASURED, without decay); n < 39 grades INDETERMINATE.
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
evidence_class:
  holdout: in_sample
  claim: edge
decision_rule:
  id: RULE-RQ20261117-b3aa-08-SINGLE-VS-COMBO
  statistic: scripts/research/exit_lever_ablation.py --grade replace on slv_pullback_1d, arms A_live (config-exact + the live trail_decay 6/2.0 as raw flags, since the pullback builder omits them), M_replace
    (momentum-stale, no decay), M_combo (both), SLV 1d dukascopy 2018-03-01..2026-11-15, net of the full cost stack, 4 calendar folds; same grade parameters as RQ-20261016-016. Window overlaps 016's (re-read,
    disclosed; arm count on this family 4 incl. 016's M1).
  rule: 'Per candidate C (harness replace grade): PASS iff net_r(C) > net_r(A_live) AND net_r(C) - net_r(A_live) >= 0.02 x n(A_live) AND folds where C >= A_live >= 3 of 4 AND maxDD(C) <= 1.35 x maxDD(A_live)
    AND n(A_live) >= 39. Several pass -> highest net R names the packet arm. Per-fold table reported; the winning arm must be net positive in >= 3 of 4 folds with no fold above 50% of its total (read by
    the session; a harness pass failing it is graded FAIL). Long and short net reported (long-only leg: short n/a). INDETERMINATE iff n(A_live) < 39 or the producer failed. FAIL otherwise: the live trail_decay
    stands and the node closes as superseded. Arm denominator 3.'
  registered_at: '2026-11-17'
  registered_before_run: true
  what_it_does_not_do: Edits no config and places no order. A PASS is the evidence for a Tier-3 packet to the manager (real-money leg); it is not itself a declare.
  baseline: arm A_live = the leg's CURRENT live exit, same run.
