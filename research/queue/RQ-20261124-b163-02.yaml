why_this_matters: 'Two readings of the same lever on the same index disagree: mes_trend_long_1d VL20 PASSED (RQ-20261123-c5d2-02: net 26.72 vs 25.06 R, n 49 vs 51, drawdown 2.25 vs 2.92 R, 2012-2026),
  while splg_trend_long_1d VL20/VL30 FAILED on 2005-11..2026-10 (RQ-20261117-9e1b-07: VL20 35.99 vs 35.67 R, n 90 vs 103, +0.32 R which is below the 2.06 R materiality bar at n 103; VL30 32.17).
  Same index, different windows (2005+ vs 2012+) and different materiality scaling. Running the SPY-family leg on the MES window separates a window/materiality effect from an instrument effect,
  which decides whether the MES lead is worth the disjoint-window confirmation the c5d2-02 rule asks for. It is a reconcile, not a new lever test: the arm grid is the one c5d2-02 registered. No
  config change either way.'
