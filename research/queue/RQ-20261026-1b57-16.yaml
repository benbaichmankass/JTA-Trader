  - --arm
  - D20=--trail-mult=5.0
  - --arm
  - L100=--donchian=100;--long-only;--trail-mult=5.0
  - --baseline
  - D20
  - --delta-r-per-trade
  - '0.1'
  - --folds
  - '6'
  - --fold-majority
  - '4'
  - --n-floor
  - '15'
  - --pooled-n-floor
  - '39'
  - --breadth-frac
  - '0.5'
  - --rule-id
  - RULE-RQ20261026-1B57-16-DAILY-DONCHIAN100-LONG
  - --data-dir
  - '{out_dir}/data'
