id: RQ-20261026-1b57-16
title: 'Position trading proper: does a 100-day Donchian long-only (months-long holds) pass Stage 0 on the six core perps against the 20-day baseline?'
status: queued
cadence: once
theme: timeframes
priority: 3
kind: experiment
question: ef5d-03 tested daily Donchian 20 and 55. On the same six perps and window (2020-01-01..2026-10-17), does a SLOWER channel (--donchian=100, long-only, trail 5.0) pass the pooled
  Stage-0 rule AND beat the D20 baseline by >= 0.10 R/trade?
why_this_matters: 'Programme 07 TIMEFRAMES (operator 2026-10-18: lowest-priority theme but get tests into the queue). Prior work this builds on and does NOT repeat: RQ-20261018-ef5d-01
  (cost-viable bar x hold cells), ef5d-03/-04/-06 (daily Donchian / pullback, regime-filtered arms), 7c2b-03 (LONG transfer to basket A), RQ-20260930-504/505 and RQ-20261016-1fa6-07
  (sub-1h FAIL at taker cost). Node P7-Q3-donchian-fail lists ''long-only'' and ''longer'' as the untested corners of the daily arm. Donchian 100 enters only on 100-day highs, so entries
  are few and holds long: the cell the literature calls trend-following proper rather than breakout trading.'
power:
  expected_n: 45
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d = 0.45 at alpha 0.05 / power 0.8 needs 39 pooled trades. expected_n=45 is an ESTIMATE (D55's ef5d-03 counts scaled by channel length (fewer entries)), not a measurement; below
    the floor the unit grades indeterminate, never FAIL.
  feasibility:
    source: none
    accrual_basis: Re-measurement on freshly fetched public candles over a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ20261026-1B57-16-DAILY-DONCHIAN100-LONG
  registered_at: '2026-10-26'
  registered_before_run: true
  statistic: 'harness_stage0.py --family trend --timeframe 1d; arms fixed now: D20=--trail-mult=5.0; L100=--donchian=100;--long-only;--trail-mult=5.0; baseline D20; --delta-r-per-trade
    0.10 --folds 6 --fold-majority 4 --n-floor 15 --pooled-n-floor 39 --breadth-frac 0.5; cost = the harness''s own venue-aware fee + slippage + funding stack resolved by execution_costs.resolve_cost_policy()
    (never a zero default), recorded per cell in the result.'
  rule: 'PASS iff L100 passes the pooled rule (pooled n >= 39, pooled net_r > 0, >= 4 of 6 folds, >= half the powered cells n >= 15 pass) AND beats D20 by >= 0.10 R/trade -> overlap
    read then a confirmation on basket A. FAIL iff L100 fails with pooled n >= 39. INDETERMINATE if pooled n < 39 (likely: the n is then the finding and the next unit pools baskets A+B+core
    rather than lowering the floor).'
  what_it_does_not_do: Edits no config and no roster, places no order, is not a promotion case; a best-of-k arm is a LEAD (programme 03 rung S0-C), never a finding; a FAIL closes the
    CONFIGURATION on this window, never the horizon. Candles are Binance USD-M daily/weekly (a PROXY for Bybit linear); funding is a directionless magnitude (execution_costs P1).
compute: cpu_long
value:
  usd_at_stake_per_month: 100
  confidence: 0.25
  bucket: frontier
  basis: 'stand-in: a candidate crypto position-trading leg at alpaca/bybit per-leg risk; an estimate, not a measurement.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 3.0
  est_minutes: 40
  why_runner: harness_stage0.py fetches keyless public candles (Binance Vision / Yahoo) and runs the repo harnesses; none of these symbols sit in metis-market-data, nothing is trainer-resident;
    CPU only.
  basis: Estimate from the comparable harness_stage0 runs of 2026-10-18..26 scaled by cells x arms x bars; the first run replaces it.
