id: RQ-20261111-207f-04
title: 'ALPACA-LIVE BOOK / CHALLENGERS (P8-Q4): which rostered equity legs earn on the alpaca_live cash book -- [balance removed], long only, whole shares, one slot, T+1, the live sizer
  -- one at a time and all competing for the slot?'
status: queued
cadence: once
roadmap:
- L-LADDER
- L-ML-LIVE
theme: live_strategy
priority: 1
kind: experiment
programme: P8
question: 'The equity legs on alpaca_paper (testing) and tqqq_trend_long_1d (production, on alpaca_live beside Foxhound-4) have Stage-0 records in R per trade (comms/strategy_evidence/:
  e.g. tqqq_trend_long_1d +0.206 R n 120, slv_trend_1h +0.78 R n 68, tlt_pullback_1d +0.095 R n 134, tlt_pullback_1h -0.071 R n 94 FAIL) with no cash, no slot and no whole-share
  limit. Run each leg''s config-exact Stage-0 harness (scripts/ops/build_strategy_evidence.py, last 700 days, its cost stack) and replay its trade list through the alpaca_live
  book: n taken, refusals by reason, taken mean net R, return %/month and month-clustered t; then all 16 legs competing for the one slot.'
why_this_matters: 'Challengers must be scored on the account, not on R per trade: a 1d ETF leg that fires a few times a year and always fits in cash can out-earn a 1h model
  that cannot afford most of its picks. This is the first common-book ranking; legs that qualify go to the head-to-head with Foxhound-4 (node P8-Q4-h2h).'
power:
  expected_n: 40
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'Unit = trade taken on the simulated book, per leg. ESTIMATE: 1d legs take ~5-60 trades in 700 days, 1h legs more but slot- and T+1-limited; a leg under 30 taken trades
    cannot qualify (the rule''s floor).'
  feasibility:
    source: none
    accrual_basis: 'Yahoo candles (yfinance==1.7.0 on the runner: 1d uncapped, 1h ~730 d); nothing accrues.'
decision_rule:
  id: RULE-RQ20261111-207f-04-CHALLENGER-BOOK
  registered_at: '2026-11-11'
  registered_before_run: true
  statistic: 'scripts/research/alpaca_live_book.py legs: per leg, the build_strategy_evidence trade list (entry_time, exit_time, entry, sl, net_r, direction) replayed through
    the alpaca_live book (cash [balance removed], accounts.yaml risk_pct, risk.py wall + round-up, one slot, T+1, long only): n_candidates, n_taken, refusals, taken mean net R, return
    %/month with month-clustered t, max drawdown $; plus the combined one-slot book of all listed legs (entry-time order).'
  rule: 'INDETERMINATE IF no leg reaches n_taken >= 30. PASS IF at least one leg has n_taken >= 30 AND book taken mean net R > 0 AND month-clustered t of book return >= 1.0;
    those legs QUALIFY for the head-to-head with Foxhound-4 (node P8-Q4-h2h). FAIL otherwise. A qualification is not a promotion: the P8 promotion rule (docs/research/programmes/08-ALPACA-LIVE-BOOK.md
    s 5) still applies.'
  on_pass: 'Author the head-to-head (P8-Q4-h2h): each qualifying leg vs Foxhound-4''s live-book baseline (207f-01) on their common window, paired by month, deflated for the
    number of qualifiers.'
  on_fail: No existing equity leg earns on this book at power; the challenger search moves to new families built for a one-slot cash book (ETF rotation / dual momentum, node
    P8-Q7) and the Foxhound-4 levers. No leg is retired by this unit.
  what_it_does_not_do: No roster or config change. Does not re-grade any leg's Stage-0 verdict. uso_trend_1h is excluded on the operator's standing non-financial constraint
    (config/accounts.yaml USO block). GLD legs are scored, but GLD on alpaca_live also carries the operator-kept zombie OCO (PI-20261025-ALQWWPXT-0001); IAUM is the declared
    affordability proxy. 1h legs cover ~730 days only (yfinance), so their window is shorter than the 1d legs'.
  min_n: 30 trades taken per leg
