  usd_at_stake_per_month: 150
  confidence: 0.1
  basis: 'stand-in, as 4654-07: Foxhound-1 trades bybit_2 + prop books; a +0.06 R/decision lift at ~40 decisions/month on bybit_2 is the scale; not
    a P&L measurement.'
