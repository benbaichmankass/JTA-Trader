id: RQ-20261101-b622-01
title: 'ENTRY timeframe lever, 15m bars with clock-count scaling: does the pooled ENTRY pipeline (v1 recipe, 60 perps, dev folds) keep an edge net of the full cost stack at 15m, does it beat the 1h baseline,
  and which features keep their role? (clock-time scaling: the SAME CLOCK time as the 1h recipe (every window, the ATR length, the 24 h label horizon and the 4 h decision cadence converted from hours to
  bars, rounded, floor 1)) Dev folds only'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: experiment
practice_precedent: 'T1, M6 (docs/reference/trading-and-model-practice-principles.md): purged + embargoed walk-forward; shadow-feature (Boruta-style) controls so a model that cannot reject noise columns
  is not trusted to admit real ones.'
question: 'Operator 2026-11-01 ~22:35Z: "I want to que a training session for 5 minutes bars as well so we can compare results and see what scales tfs and what doesn''t". This unit: 15m bars, clock scaling
  = the SAME CLOCK time as the 1h recipe (every window, the ATR length, the 24 h label horizon and the 4 h decision cadence converted from hours to bars, rounded, floor 1). Same universe, folds, recipe,
  bracket (SL 2 / TP 3 ATR), full cost stack, one-position-per-symbol policy and seeds 7/11/13 as the 1h base, which this unit re-runs inside itself. Reported with and without v2''s cost gate (refuse when
  k / atr_pct > 0.06). Rows about ~668k decision rows on the dev folds.'
why_this_matters: 'Operator 2026-11-01 ~22:35Z (relayed by the manager): compare the ENTRY model across bar sizes to learn which timeframes the edge scales to and which it does not. Fee plus slippage is
  a much larger share of R at short bars, so gross R, cost per R and net R are reported side by side.'
power:
  expected_n: 72000
  min_detectable_effect: 0.0148
  effect_units: metric
  sd: 1.0
  design: two_sample
  alpha: 0.05
  power: 0.8
  basis: 'MEASURED 2026-11-01 (round 1): the v1 recipe at a fixed tau on the pooled 60 symbols over the dev folds has a pooled seed range 0.0034 at n about 72k; the win threshold is 2 x max(0.0034, the
    1h seed range). The naive two-sample MDE at n 72,000 per arm and sd 1 is 0.0148 R; the registered win threshold (2 x 0.0034 = 0.0068) is below it, so the fold, year and seed-range conditions, not a
    t-test, carry the evidence (as in b607). Shorter bars have more decisions (about 12x at 5m bar-count), so their MDE is smaller. Row counts for other bar sizes are INFERRED (decision cadence x the measured
    668,280 1h dev rows).'
  feasibility:
    source: none
    accrual_basis: Replays public Binance Vision history through 2025-09-30 (dev folds only); nothing accrues.
decision_rule:
  id: RULE-20261101-b622-01
  registered_at: '2026-11-01'
  registered_before_run: true
  statistic: 'Per arm and seed (7, 11, 13) at the FIXED tau 0.10 under the one-position-per-symbol policy: n, mean gross R, cost R and net R per decision; seed mean and range; per-fold (8) and per-calendar-year
    (4) net R; ungated and with v2''s cost gate. The 1h baseline is re-run inside the unit. Plus gain share, SHAP sign, signal overlap with the 1h model.'
  rule: 'Three registered words, ungated headline (the gated variant gets the same words, reported beside it). (1) VIABLE: the seed mean net R per decision at tau 0.10 is > 0, >= 6 of 8 dev folds positive,
    >= 3 of 4 calendar years positive, and every fold has >= 1000 decisions. (2) BEATS_1H: every fold keeps >= 1000 decisions (else INDETERMINATE) AND the seed mean beats this unit''s own 1h baseline by
    >= 2 x max(0.0034, the 1h baseline seed range) AND is better than it in >= 6 of 8 folds AND the delta is positive in >= 3 of 4 calendar years. (3) verdict word: beats_1h | viable_not_better | not_viable
    | indeterminate. READ-OUT (no pass/fail): per feature and head, KEEPS iff the SHAP-sign relationship matches the 1h model (or either |rho| < 0.05) and the gain share is within 0.5-2 x the 1h share;
    otherwise DROPS; plus the gain-rank Spearman vs 1h and the signal overlap (Jaccard, side agreement) with the 1h model on the shared 4-hourly UTC decision grid. A beats_1h arm is only a CANDIDATE: it
    goes, as a NEW unit with its rule registered first, to ONE fresh-window read (ML-BAR-ONE-READ). Thresholds are not changed after any result.'
  what_it_does_not_do: Reads no sealed or held-out window (dev folds only, no month after 2025-09 is downloaded), serves nothing, changes no config or live symbol list, places no order, sizes nothing.
  min_n: 1000 dev decisions per fold
