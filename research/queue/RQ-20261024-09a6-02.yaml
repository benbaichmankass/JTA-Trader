id: RQ-20261024-09a6-02
title: 'AI-ATM rung A2: does FLOW (funding, taker imbalance, open interest where history exists) add per-bar exit information beyond
  the price state, on the crypto money legs as traded?'
status: queued
cadence: once
roadmap:
- L-ATM
- M23
programme: P1
theme: live_strategy
priority: 1
kind: experiment
question: 'Same population, label, folds and grading as RQ-20261024-09a6-01 (trend_donchian_eth_4h, trend_donchian_xrp_4h, xrp_pullback_2h,
  ada_pullback_2h, trend_donchian_eth_prop, trend_donchian_sol_prop, 2020-07-01 .. 2026-10-15 23:59, as traded). Reference = the better
  of 09a6-01''s R0/R1 on its own verdict (R1 if it PASSED, else R0). Candidate = reference + point-in-time flow at bar t: taker imbalance
  2*taker_buy_base/volume - 1 on bar t and its 6-bar mean (src/research/intrabar_features.py definition), the last SETTLED funding rate
  at or before bar t and its change since entry, and, where a point-in-time open-interest history exists for the symbol, the OI change
  since entry and over 6 bars (rows without OI carry an indicator, never an imputed zero). Does flow add log-loss information on the
  decision ''hold loses to exiting now''?'
why_this_matters: 'Every exit head this repo has failed was fed price-derived features only (ML-S2; d6e7). Programme 02 Q5 names flow
  as the information class that could change the exit answer, and the operator named it for this programme (2026-10-24). It is asked
  whatever 09a6-01 finds: a FAIL on price state says nothing about a different information class.'
power:
  expected_n: 600
  min_detectable_effect: 0.002
  effect_units: metric
  sd: 0.8
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'MEASURED in checklist row EXIT-PATH-METRICS-W43 (path_state_giveback.py over xrp/ada pullback_2h, eth_4h, eth/sol prop, 2020-07..2026-10,
    harness cost stack): 958 trades / 18,770 states with peak >= 1 R; every-bar states on these six legs are several times that. States
    within a trade are autocorrelated, so power is carried by TRADES (n ~1,000 pooled; per leg 68 (xrp_4h) to ~400 (ada_pb)) and the
    CI is a trade-cluster bootstrap.'
  feasibility:
    source: none
    accrual_basis: Replays history through config-exact harness runs on keyless public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ20261024-09A6-02-FLOW-INFO
  registered_at: '2026-10-24'
  registered_before_run: true
  statistic: 'As 09a6-01: trade-weighted OOS log-loss gain of (reference + flow) over the reference, trade-cluster bootstrap CI, per-fold
    sign, calibration slope; the share of states carrying each flow column is reported per leg.'
  rule: 'INDETERMINATE IF any flow column is present on < 80% of states for a leg (that leg is dropped and named) or fewer than 600
    trades remain. PASS IF pooled gain >= 0.002 nats AND CI lower > 0 AND >= 4 of 6 folds positive AND calibration slope in [0.7, 1.3]
    -> the flow block joins the policy rung''s state (d6e7-06 / the advisor) and a live flow producer is a named prerequisite of any
    shadow (Programme 02 Q6). FAIL IF CI upper < 0.002 nats: flow adds no exit information on these legs at bar resolution; the class
    is recorded in families history and the signals catalog as no_lift for exits.'
  min_n: 600 trades pooled
blocked_on: []
compute: cpu_light
value:
  bucket: ai_trader
  usd_at_stake_per_month: 400
  confidence: 0.15
  basis: 'stand-in: the prize is the giveback (book keeps ~13% of peak R, 90d paper+mirror n=328, docs/reviews/2026-10-21-weekly-walkthrough.md);
    not a P&L measurement of this lever.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 3.0
  est_minutes: 60
  why_runner: Keyless public candles + config-exact harness runs; reads no trainer data.
  basis: 'Estimate: six harness passes with --emit-paths (one per leg, ~1-2 min each MEASURED for exit_lever_ablation arms 2026-10-16)
    plus the fit.'
run:
  workflow: research-script-run.yml
  command:
  - python3
  - scripts/research/path_flow_join.py
  - --harness-legs
  - trend_donchian_eth_4h,trend_donchian_xrp_4h,xrp_pullback_2h,ada_pullback_2h,trend_donchian_eth_prop,trend_donchian_sol_prop
  - --days
  - '2330'
  - --start
  - '2020-07-01'
  - --end
  - 2026-10-15 23:59
  - --mode
  - grade
  - --reference
  - auto
  - --min-coverage
  - '0.8'
  - --min-gain-nats
  - '0.002'
  - --min-folds
  - '4'
  - --min-n
  - '600'
  - --n-folds
  - '6'
  - --n-boot
  - '2000'
  - --out
  - '{out_dir}'
  timeout_minutes: 120
  inputs:
    research_unit: RQ-20261024-09a6-02
  note: 'PATH-FLOW-JOIN (scripts/research/path_flow_join.py). --reference auto = R1 if 09a6-01''s own rule (same code, same thresholds) passes R1 vs R0 on these trades, else R0. Funding/OI/taker come from Binance Vision (keyless). The unit''s decision_rule is applied literally: a leg with any flow column on < 80% of states is dropped and named.'
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
related:
- IN-TRADE-EXIT-MODEL
- docs/research/programmes/01-ACTIVE-TRADE-MANAGEMENT.md (section 'AI active trade management')
- docs/research/programmes/02-AI-TRADER.md (Q3)
- research/queue/blocked/RQ-20261014-d6e7-06.yaml
- 'scripts/research/path_metric_giveback.py (run_leg_paths: config-exact harness + --emit-paths)'
- src/research/intrabar_features.py
- scripts/research/pair_funding_drag.py
what_it_does_not_do: Changes no config; builds no live producer. A PASS earns flow a place in the policy state and makes a live flow
  producer a prerequisite of any shadow; it is not a promotion.
last_dispatched_at: null
