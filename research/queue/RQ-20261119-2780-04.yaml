baseline:
  definition: take-all, take-none (0) and a matched random take at the head's own take rate, on the identical eval rows, each net of realized cost (journal pnl).
  net_of_cost: true
decision_rule:
  id: RULE-RQ20261119-2780-04-P1-MEASURED-PAPER-THR
  registered_at: '2026-11-19'
  registered_before_run: true
  min_n: 200 measured, filtered paper eval rows
  population_filter: 'FIXED BEFORE THE RUN, identical to RULE-RQ20261119-3e98-01-P1-ROSTERED-PAPER: event_source == live_paper AND strategy in ROSTER_59 (research/manifests/roster59-20261119.txt), AND pnl_provenance
    == measured (p1_costnet_grade.py --measured-only). Estimated rows are EXCLUDED by rule.'
  statistic: 'STEP 1 (training side only): scripts/ml/p1_threshold_oof.py --manifest research/manifests/setup-candidates-metalabel-rostered-paper-v1.yaml --dataset datasets-out/setup_candidates/all/all/v024/data.jsonl,
    5-fold expanding walk-forward from 0.50 over the live_holdout TRAIN rows (never the live_paper rows), grid 0.30..0.70 step 0.02, take band [0.05, 0.60]; SELECTED threshold = the highest OOF value_r
    (sum taken R / n) among in-band thresholds, tie -> closest to 0.5. STEP 2 (once): scripts/ml/p1_costnet_grade.py on the 3e98-01 model state (ml/experiments-runs/setup-candidates-metalabel-rostered-paper-v1/20261119T202129Z)
    with a manifest copy whose evaluator_config.decision_threshold = the selected threshold, --eval-source live_paper --strategies-file research/manifests/roster59-20261119.txt --measured-only --lb-pct
    0.625 (two-sided alpha 0.05 / 4: ML-P1 gross, 78fc-02, 3e98-01, this). P1 clauses (a)-(e) as in 3e98-01.'
  rule: 'INDETERMINATE (no grade step) IF v024 data.jsonl no longer has 6,659 rows (the build changed), or STEP 1 selects no threshold. Otherwise PASS iff (a) AND (b) AND (c) AND (d) AND (e) on the measured
    filtered rows. FAIL iff n_eval >= 200 AND ((a) fails OR (b) fails). INDETERMINATE otherwise (n_eval < 200, (c)/(d)/(e) not met, or unit_fallback share > 10%). Reported, never graded: the measured+estimated
    read at the same threshold, the OOF grid, and the selected threshold''s OOF take rate vs its paper take rate. Thresholds, grid, band, filter and model are not changed after any result.'
  pass_action: 'ONE confirmation on a disjoint in-hand window (the paper rows after the run''s data cut are not in hand, so: a time split of the same population, earlier half train / later half eval, registered
    then), then a data-backed Tier-3 proposal to the manager to set the head advisory on the demo-floor legs in its population.'
  fail_action: 'Configuration closed: the threshold lever on this head and book (read once). Next lever: the label (realized-R-trained arm) via a new unit, or a family-review record if the lever map is
    exhausted.'
  what_it_does_not_do: Serves, promotes or applies nothing; changes no config, registry stage or roster; places no order; adds no gate.
practice_precedent: 'T1, M6, M13 (docs/reference/trading-and-model-practice-principles.md): a lever read on training folds only, the eval book touched once, a deflated bar for a re-read.'
