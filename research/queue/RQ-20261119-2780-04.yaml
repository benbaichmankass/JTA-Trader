id: RQ-20261119-2780-04
title: 'P1 iteration 3 (ml-setup-metalabel-p2pool): decision threshold read on TRAINING folds only, then ONE re-read on the MEASURED rostered paper book at that threshold (4th read, deflated)'
status: done
cadence: once
theme: ml_health
priority: 2
roadmap:
- L-ML-LIVE
programme: P2
kind: experiment
question: Does the setup meta-label head (setup-candidates-metalabel-rostered-paper-v1, the 3e98-01 model, unchanged) pass P1 on the MEASURED-outcome rows of the rostered paper book when it acts at the
  decision threshold chosen on walk-forward out-of-fold scores of its TRAINING rows, with the bootstrap bar deflated for a fourth read?
why_this_matters: 'RQ-20261119-3e98-01 graded INDETERMINATE by its provenance clause: PASS on measured+estimated paper rows (n 1,053) but FAIL on measured-only rows (n 698: LB -0.0061, take rate 0.043 <
  the 0.05 floor), while the head still beat take-all (-0.030) and take-none there. The take rate sits at the floor because the threshold 0.5 was never read on any data. Reading it on the eval book would
  leak; reading it on training folds does not. Estimated outcomes are excluded by rule, so a PASS here stands on measured fills only (operator and manager: measured first).'
iteration:
  subject: ml-setup-metalabel-p2pool
  subject_kind: ml_model
  from_result: RQ-20261119-3e98-01
  verdict_read: indeterminate
  diagnosis: measured-only read fails (b) LB -0.0061 and (c) take 0.043 at threshold 0.5 while the selection signal survives (beats take-all and take-none); the threshold is an unread lever.
  search: one factor, the DECISION THRESHOLD, chosen on training-fold OOF scores by a rule fixed now; model, features, params, dataset v024 and the population filter unchanged
  levers:
  - threshold
