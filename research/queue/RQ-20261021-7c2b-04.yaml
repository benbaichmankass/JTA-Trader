id: RQ-20261021-7c2b-04
title: >-
  Programme 07 Q6 transfer: does the daily Donchian-55 arm that won ef5d-03 clear Stage 0 on six perps it was NOT selected on?
status: queued
cadence: once
theme: timeframes
priority: 2
kind: experiment
question: >-
  On Binance USD-M daily candles for BNB/DOGE/LINK/LTC/BCH/DOT over 2020-06-01..2026-10-20 with donchian 55 and trail_mult 5.0 (ef5d-03's
  best arm, fixed), does D55 pass the pooled Stage-0 rule?
why_this_matters: >-
  ef5d-03 PASSED, best arm D55: pooled 0.422 R/trade, n=179, +75.5 R on the six core perps (D20: 0.267, n=256). Best of two arms on
  one symbol set = a LEAD. Before any overlap read or re-entry case (node P7-Q6-daily-donchian), the arm is transferred unchanged to
  six symbols it was not chosen on. One arm, no baseline: the question is whether it stands alone.
power:
  expected_n: 160
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: ef5d-03 D55 n=179 over six symbols x 6.8 y -> ~160 here; floor 39.
  feasibility:
    source: none
    accrual_basis: Re-measurement on fetched public candles over a pinned window; nothing accrues.
decision_rule:
  id: RULE-P7-Q6-D55-TRANSFER
  registered_at: '2026-10-21'
  registered_before_run: true
  statistic: >-
    harness_stage0.py --family trend --timeframe 1d, one arm D55 (donchian 55, trail 5.0); per cell and pooled.
  rule: >-
    PASS iff D55 passes -> node P7-Q6-daily-donchian (same-symbol overlap read against the live bybit_2 legs, then a re-entry case under
    MD-PROMOTE-S0-S1). FAIL -> the D55 lead is symbol-selected; record it on the node. INDETERMINATE otherwise. Verdicts are the script's
    own (scripts/research/harness_stage0.py, grades fixed by these flags): per CELL pass iff n >= n_floor AND net_r > 0 AND >= fold_majority
    of the calendar folds net > 0, fail iff n >= n_floor and not, indeterminate iff n < n_floor; per ARM pass iff pooled n >= pooled_n_floor
    AND pooled net_r > 0 AND pooled folds >= fold_majority AND >= breadth_frac of the POWERED cells pass (and, with --baseline, beats
    the baseline's pooled net R/trade by >= delta), indeterminate iff pooled n < pooled_n_floor or < 2 powered cells or < half the declared
    cells measured (a fetch/harness fault is recorded per cell, never dropped), fail otherwise. Holm-corrected one-sided t p-values
    are REPORTED, not graded. Thresholds are not changed after any result.
  what_it_does_not_do: >-
    Does not edit config/strategies.yaml, config/accounts.yaml or any roster; does not tune beyond the fixed arms listed; does not pool
    windows with any committed record; is not a promotion case. Candles are Binance USD-M (a PROXY for Bybit linear; prices track within
    a few bps) and the funding term is a directionless magnitude (execution_costs P1), both stated in the record.
compute: cpu_long
value:
  usd_at_stake_per_month: 100
  confidence: 0.3
  bucket: frontier
  basis: stand-in (07 node P7-Q6 weight); an estimate.
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 4.0
  est_minutes: 45
  basis: >-
    Estimate from the ef5d-0x harness_stage0 runs (2026-10-18/20) scaled by cells x arms x bars; the first run replaces it.
  why_runner: >-
    harness_stage0.py fetches public candles and runs the repo harnesses; CPU-only; not trainer-resident.
run:
  command:
  - python3
  - scripts/research/harness_stage0.py
  - --family
  - trend
  - --symbols
  - BNBUSDT,DOGEUSDT,LINKUSDT,LTCUSDT,BCHUSDT,DOTUSDT
  - --timeframe
  - 1d
  - --days
  - '2400'
  - --start
  - '2020-06-01'
  - --end
  - '2026-10-20'
  - --param
  - trail_mult=5.0
  - --param
  - donchian=55
  - --arm
  - D55=
  - --folds
  - '6'
  - --fold-majority
  - '4'
  - --n-floor
  - '20'
  - --pooled-n-floor
  - '39'
  - --breadth-frac
  - '0.5'
  - --rule-id
  - RULE-P7-Q6-D55-TRANSFER
  - --data-dir
  - '{out_dir}/data'
  - --out
  - '{out_dir}'
  timeout_minutes: 150
  inputs:
    research_unit: RQ-20261021-7c2b-04
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
roadmap:
- L-TIMEFRAMES
programme: P7
related:
- RQ-20261018-ef5d-03
- research/programmes/07-timeframes.yaml
