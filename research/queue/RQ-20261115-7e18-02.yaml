  subject_kind: ml_model
  from_result: RQ-20261112-cd01-01
  verdict_read: indeterminate
  diagnosis: 'cd01-01 R3 COST-ARTIFACT: the net-R target''s information coefficient is 0.497 against net R but 0.003 against gross R, with
    atr_pct the driver; a7e8-03 Brinson: tilt share 0.061 and within-bucket gross selection +0.0051 R (t 0.84). The residual-market target
    (4654-01) FAILED; the learner changes (4654-07/-08/-09) FAILED or were INDETERMINATE. No unit has separated the deterministic cost term from
    the learned gross term.'
  hypothesis: removing the known cost-per-R structure from the learned target lets the booster spend its splits on gross direction, raising net R per decision
