id: RQ-20261115-7e18-02
title: 'Foxhound-1 DECOMPOSED score: does LightGBM on GROSS R minus the known pre-trade cost per R beat the served recipe''s net-R target on the
  trades each would take at actual net R? (13 monthly refits over 2025-10..2026-09; diagnosis cd01-01 R3)'
status: done
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: experiment
origin: iteration
practice_precedent: 'M6 (docs/reference/trading-and-model-practice-principles.md): one-factor lever, same rows, purge, tau and cost stack as the
  baseline, paired by window; the RQ-20261112-4654 family design (ml_entry_residual.py) with only the target / score changed.'
levers:
- name: target_and_score
  values:
  - net-R target, score = predicted net R (RAW, the served recipe, baseline)
  - gross-R target, score = predicted gross R - k_side / (SL_ATR x atr_pct), k_side fitted on the refit's own training rows (GROSS, decided)
  hypothesised_effect: GROSS raises held-out net R per decision by >= +0.06 vs RAW
question: 'Refit the SAME recipe (ml_decision_entry FEATURES, LGB_PARAMS, E.purge_train, served tau, BTCUSDT excluded) at each of 13 monthly
  origins over the frozen v1''s held-out year with two scores -- RAW (LightGBM on net_long / net_short; the served recipe) and GROSS (LightGBM
  on gross_long / gross_short, then minus the decision-time cost per R c_hat = k_side / (SL_ATR x atr_pct), where k_side = sum(cost_side) /
  sum(1 / (SL_ATR x atr_pct)) on that refit''s training rows) -- and grade each on the decisions it takes at the ACTUAL net R of an outright
  bracket trade (canonical cost stack). Does the decomposed score beat the net-R target?'
why_this_matters: 'Foxhound-1 trades bybit_2 real money, its mirror and the prop books, and every ranked ENTRY lever has failed its held-out read
  (residual target, ridge, ensemble, conformal, vol24 abstention, cost gate). The diagnosis no lever has tested: the net-R LABEL is cost-driven
  on atr_pct (cd01-01 R3: IC net 0.497 vs gross 0.003), so the model may spend its capacity learning the known cost-per-R structure instead of
  direction. Separating the two (learn gross, subtract the known cost) is the one-factor test of that diagnosis. It decides the line''s next
  lever either way: PASS -> a decomposed-score candidate for the combined held-out read (ML-LEVER-PLAN); FAIL -> the target family closes for
  crypto ENTRY (with RESID already FAIL) and the next lever must be new information (features / data), not another target.'
