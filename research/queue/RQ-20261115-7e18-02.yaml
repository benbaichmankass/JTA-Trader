decision_rule:
  id: RULE-RQ20261115-7e18-02-GROSS-DECOMP
  registered_at: '2026-11-15'
  registered_before_run: true
  baseline: 'RAW: the same LightGBM recipe on the raw net-R target at the same origins, same rows (BTCUSDT excluded), same tau, same cost stack.
    Net of the full cost stack.'
  statistic: 'scripts/research/ml_entry_residual.py run --arms raw,gross: per 28-day window, mean actual net R per taken decision for each arm
    (E.policy, served tau); d_w = GROSS - RAW over windows where both took >= 30 decisions; mean, sd and 95% t-interval of d_w
    (paired_extra_vs_raw.gross); pooled means and n; each window''s k_long / k_short (gross_info).'
  rule: 'decide_vs_raw on GROSS: PASS iff >= 10 paired windows AND mean d >= +0.06 R/decision AND the 95% t-CI lower bound > 0 AND GROSS pooled n
    >= 300. FAIL iff >= 10 paired windows AND mean d <= 0. INDETERMINATE otherwise. Net of the full cost stack (fee + slippage + funding via
    ml_decision_entry._cost_r). Thresholds are not changed after any result.'
  pass_action: 'the decomposed score becomes a candidate in ML-LEVER-PLAN''s ONE combined held-out read (frozen-v1 baseline, holdout_lock family
    ENTRY on the deflated bar); a PASS there is the Tier-3 candidate-to-served packet. Never a promotion from this unit.'
  fail_action: 'the TARGET family closes for crypto ENTRY (RESID 4654-01 FAIL + GROSS FAIL); MLP-D3-FOXHOUND-1''s next lever must add information
    (features or data, e.g. MLP-D3-RANKING-TARGETS taker flow), recorded on the plan line.'
  what_it_does_not_do: Changes no served model, tau, roster or config. No search over the cost model (k is a single training-set ratio per side,
    fixed form). The served tau was tuned on the RAW prediction scale; GROSS decision counts are reported (n < 300 is INDETERMINATE, declared).
    BTCUSDT excluded. The window was read before by 98e3-26 and the 4654 family (declared). A PASS is not a promotion.
  min_n: 10 paired windows with >= 30 decisions per arm; 300 pooled GROSS decisions
