decision_rule:
  id: RULE-AM-HEADS-RICHER-20261124
  registered_at: '2026-11-24'
  registered_before_run: true
  baseline: the 9-feature heads on the same rows (same state baseline)
  statistic: 'scripts/research/am_heads_fit.py run --feats rich (run_rich, richer_head_verdict, richer_verdict) on labels from cf_bar_labels_run.py shard
    --context (corpus pinned at cf-bar-labels.yml''s default corpus_sha, the run-w job set). Per graded head (TARGET q0.5, q0.9, reach_2; INVALIDATION
    stop_first, dip_recovers): delta = skill_vs_state(RICH) - skill_vs_state(BASE) per dev fold on identical rows (per-fold seed), dev mean, folds positive,
    and the holdout fold''s delta (ledger claim family AM-HEADS, model AM-HEADS-richer, read before it is scored).'
  rule: 'Per head PASS iff dev mean delta >= +0.01 AND delta > 0 in >= 6 of 8 dev folds AND holdout delta > 0. FAIL iff dev mean delta <= 0. INDETERMINATE
    otherwise. UNIT: PASS iff >= 1 TARGET head AND >= 1 INVALIDATION head pass; FAIL iff all five graded heads fail; else INDETERMINATE. Features, windows,
    params, seed, folds, purge and the 400,000-row cap are fixed now.'
  pass_action: 'Re-dump the heads with the ctx block (am_heads_fit dump, rich feature list) and author the next action-value / Stage B iteration on them;
    nothing graduates on skill.'
  fail_action: 'Record the 6 ctx features closed on research/levers/ml-brackets.yaml; next feature lever: cross-asset state (BTC / index return since entry,
    breadth, funding).'
  proposal_mapping: 'pass -> rich heads feed the next policy unit; fail/indeterminate -> the next feature iteration authored from the per-head deltas.'
  what_it_does_not_do: 'Applies no head to a bracket, claims no P&L (skill is a loss ratio), changes no config or order; the ml_entry / ml_entry_eq decisions
    are not in this corpus (rule-strategy backtest trades only).'
