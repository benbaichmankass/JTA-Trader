title: 'AM v2 RICHER FEATURES: do market-structure and vol-regime features (ctx block, bars <= k incl. pre-entry history) raise the TARGET and INVALIDATION
  heads'' skill over the SAME state baseline by >= 1% loss vs the 9-feature heads, on the same rows (>= 6 of 8 dev folds, positive on the claimed holdout)?'
