question: 'On purged half-year folds of trade-entry time (2022-01..2026-01) and a claimed 2026 holdout, does adding the 6 ctx features to the 9 Stage A features
  raise each graded head''s skill vs the state-conditioned baseline (1 - loss_model / loss_state) by >= 0.01 on average over the 8 dev folds, with the
  increment > 0 in >= 6 of 8 dev folds and > 0 on the holdout, for >= 1 TARGET head and >= 1 INVALIDATION head?'
why_this_matters: 'Operator priority (AM v2). Richer inputs are the lever the Stage A fail_action named for the heads and the input every next policy (the
  c7e3 action-value classes included) would consume. A pass re-dumps the heads with the ctx block for the next Stage B / action-value iteration; a fail
  closes these 6 features and moves the lever to cross-asset state (BTC / index return since entry, breadth, funding).'
