  basis: 'ESTIMATE, same basis as RQ-20261123-a9d1-01: the independent unit is the entry week (~400 weeks); the comparison is PAIRED (same rows, same
    seed, only the feature set differs), so its se is below Stage A''s across-fold se of 0.003-0.014.'
