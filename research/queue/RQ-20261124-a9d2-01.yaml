  from_result: RQ-20261123-a9d1-01/local-20261123T2011Z
  verdict_read: pass
  diagnosis: 'Stage A (RQ-20261123-a9d1-01) PASSED on 9 point-in-time features (6 path features + side/tf/strategy), but the incremental skill over the
    (strategy x open_r decile x bar-age) lookup is small (+0.01..0.035 loss; AUC .747 vs .724), and Stage B''s five classes FAILED (RQ-20261124-b5a1-01..05).
    The heads cannot see WHERE the trade sits in the market: distance to the recent extremes, range position, local trend, the vol regime, how wide the
    stop is in current volatility. Row AM-V2-RICHER-FEATURES names exactly these. This unit measures whether they add skill before any policy uses them.'
  search: 'one fixed feature block (6 ctx features, windows 48 / 24 / 14 / 100 bars, no search), same LightGBM params, seed, folds, purge, row cap and state
    baseline as Stage A; BASE and RICH fit on identical sampled rows per fold.'
  levers:
