  timeout_minutes: 240
  command:
  - python3
  - scripts/research/exit_head_fresh_rows.py
  - --legs
  - trend_donchian,trend_donchian_eth,trend_donchian_sol
  - --tf
  - 1h
  - --family
  - donchian
  - --symbols
  - BTCUSDT,ETHUSDT,SOLUSDT
  - --after
  - '2026-11-01'
  - --db
  - data/trade_journal.db
  - --build-out
  - datasets-out/exit_head/1h/donchian_fresh_build
  - --publish
  - datasets-out/exit_head/1h/donchian_fresh/rows.jsonl
  - --unit
  - '{unit}'
  - --out
  - '{out_dir}'
  inputs:
    research_unit: RQ-20261119-ef40-01
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
related:
