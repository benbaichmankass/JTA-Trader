    be replayed on the forming bar at all. The gap is structural, not a tuning miss; it is closed by building the equity 1m source and the US-session forming
    mode, then re-measuring.'
  hypothesis: 'On the forming bar, replayed from TQQQ 1m, D20 keeps positive net-of-cost expectancy and still clears D30, and the regenerated record reads
    faithful -- closing the approximate exception the live leg carries.'
  attempt: 1
