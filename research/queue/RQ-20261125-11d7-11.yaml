question: Across avax_pullback_2h, htf_pullback_trend_2h, sol_pullback_2h (pooled n(A) 875 from the kept arm emits of RQ-20261105-008, RQ-20261106-020, RQ-20261106-011), is the paired
  per-entry net-R difference of pullback_frac_hi minus A >= 0.06 R per baseline trade with a month-block bootstrap CI lower bound > 0, in >= 3 of 4 folds, with pooled maxDD <= 1.35x
  baseline?
why_this_matters: 'The weekly one-factor sweeps of this family graded fail/indeterminate leg by leg although every leg ran the SAME lever values (pullback_frac 0.375 / pullback_frac
  0.625, declared 0.5); a per-leg verdict cannot resolve a 0.02-0.05 R/trade effect (pool_arm_diff.py header). Pooling the legs that carry the same lever is the design that can. Dedupe:
  one symbol per leg (AVAXUSDT, BTCUSDT, SOLUSDT 2h): no trade is shared between legs. PASS gives a family-level Tier-3 declare PROPOSAL input (a population redefinition needs its own
  pooled test on fresh data, stated here); FAIL closes THIS value for THIS pool and leaves the family and the other value open. This is a pooled re-read of the same trades the sweeps
  produced, not an independent sample.'
