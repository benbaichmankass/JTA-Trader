    - /tmp/ml_entry_equity
    - --out
    - '{out_dir}/seckey'
    - --unit
    - '{unit}'
    - --where
    - research-script-run
    - --security-keyed
    - --ensemble-seeds
    - 1,2,3,4,5
    - --taus
    - 0.2,0.25
    - --min-mean
    - '0.04'
    - --reproduce-sha
    - 8c3a70b5d1024229f150f06e99a2e1ad505258dd5573a76ea86633af7e0a7f26
    - --expect-n
    - '213'
    - --expect-mean
    - '0.3891090207472068'
    - --trades-out
    - '{out_dir}/seckey_trades.jsonl'
    - --rule-id
    - RULE-RQ20261126-7c11-02-SECKEY
    - --registered-at
    - '2026-11-26'
  - - python3
    - scripts/research/eq_confirm_concentration.py
    - --trades
    - served=comms/research/RQ-20261119-e8a1-04/44439340946/ml_entry_eq_struct__trades.jsonl
    - --trades
    - seckey={out_dir}/seckey_trades.jsonl
    - --gate
    - served
    - --out
    - '{out_dir}'
  timeout_minutes: 330
  inputs:
    research_unit: RQ-20261126-7c11-03
