  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATE: 1e06-04 measured pooled n 305 on six 3x pairs over 2010-2026; the fresh pairs have shorter histories (DUSL / UTSL 2017+, WANT
    2018+), so n ~ 150-250, above the floor 25. No local read of this population.'
  feasibility:
    source: none
    accrual_basis: Fixed in-hand window; nothing accrues.
