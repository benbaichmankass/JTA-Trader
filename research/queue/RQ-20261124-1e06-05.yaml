decision_rule:
  id: RULE-RQ-20261124-1e06-05
  registered_at: '2026-11-24'
  registered_before_run: true
  statistic: 'index_signal_etf_harness.py unit 1e06-05: family capitulation_wide on (XBI,LABU),(KRE,DPST),(EEM,EDC),(XLI,DUSL),(XLU,UTSL),(XLY,WANT),
    arm B = 1x index ETF; POOLED grade; plus a timing control (200 re-timed replays, shifts 40-400 sessions) a RULE CLAUSE here (share of draws
    >= actual must be <= 0.05). Cost stack: fee 0 + 5 bps slippage per side (2x slippage re-read), the ETF price series itself (decay + expense
    embedded), no funding; TP = K* calibrated on the first 60% of trades (tp_prediction_derive constants), never tp_r 50.'
  rule: PASS IFF pooled n>=25 AND pooled net_r(3x)>0 AND pooled net_r(3x)>pooled net_r(1x) AND >=3 of 6 pairs net_r>0 AND pooled net_r>0 under
    2x slippage AND pooled actual net_r beats >= 95% of the 200 re-timed draws (share_of_draws_ge_actual <= 0.05); INDETERMINATE if pooled n<25;
    FAIL otherwise.
  what_it_does_not_do: 'Changes no config. NO local read preceded this registration (unlike 1e06-01..04): the runner run of the committed command
    is the first look at this population. A pass needs a fresh-window read before any manager proposal.'
