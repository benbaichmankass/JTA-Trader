id: RQ-20261124-1e06-05
title: 'Timing-gated test of the capitulation 3x buy on six FRESH 3x ETFs (LABU, DPST, EDC, DUSL, UTSL, WANT): must beat 95% of 200 re-timed entries,
  graded POOLED'
