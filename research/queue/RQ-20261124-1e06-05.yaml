question: Does the 1e06-03 capitulation trigger (1.5-ATR flush then the first up-close, executed in the 3x ETF) earn positive pooled net R on
  six index/ETF pairs used in no earlier read, beat the same trigger in each 1x ETF, AND beat >= 95% of 200 re-timed replays of the same signals
  (the timing control 1e06-04 only reported)?
why_this_matters: '1e06-04 passed its rule locally (pooled n 305, 3x +41.0 R vs 1x +26.4 R, 5/6 pairs positive, +32.0 R at 2x slippage) but the
  200 re-timed draws averaged +15.3 R and the actual sat at the 86th percentile: most of the result is bull drift x leverage, not the flush timing.
  This unit makes the timing control a RULE clause on a fresh population, so a pass means the trigger''s timing pays, not just being long a 3x
  ETF.'
