question: gld_pullback_1d trades Stage-1 paper/mirror book. Its exit-lever cells be_floor / bank / cooldown (and the extras named in the arms) have no unit. Does any arm, selected on the earliest ~75% of
  2018-03..2026-10 and read once on the held-back latest span, hold up net of the full cost stack?
