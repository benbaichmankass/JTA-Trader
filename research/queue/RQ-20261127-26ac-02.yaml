id: RQ-20261127-26ac-02
title: 'ml_entry CRYPTO IMPLIED VOLATILITY: on the 8 dev folds, do 3 BTC implied-vol columns (Deribit DVOL level, 24h log change,
  168h z), added to the 20-feature ENTRY recipe, beat a seeded noise placebo of the same width (3 columns), net of the full cost stack?'
status: done
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: experiment
origin: follow_up
question: 'On the pooled ENTRY recipe''s 8 half-year dev folds (2022-01..2025-09, 60 frozen perps, LOFO tau, fee + slippage + funding), is the
  leave-one-fold-out mean net R per decision higher with F9 (BTC DVOL: level, 24h log change, 168h z-score; the hourly candle that closed one
  hour before the decision bar''s close) than with the same recipe plus 3 seeded N(0,1) columns?'
why_this_matters: 'c4e2-01 says served v1 decays because the market shifted in a way its 20 realised-price features cannot see. Implied vol is
  forward-looking and priced by option traders: a regime change shows in DVOL before it shows in realised vol. The one market-wide input tried
  so far (F8 cross-asset equities) failed (-0.072 R), so the prior is modest; DVOL is crypto-native, which F8 was not. Unit 26ac-01 tests the
  in-hand derivatives state; this asks whether a new external information class helps.'
practice_precedent: 'M3 (one lever per arm against a same-shape control), M4 (rule registered before the run), M6 (net of the full cost
  stack), M13 (a post-hoc reading motivates a fresh registered test, never a promotion) and T1 (purged + embargoed walk-forward on dev folds
  only) in docs/reference/trading-and-model-practice-principles.md.'
evidence_class:
  holdout: none
  claim: ml_dev_fold_feature_value
power:
  expected_n: 60000
  min_detectable_effect: 0.01
  effect_units: metric
  sd: 1.0
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATE before any run: fs01-01 / f8a1-01 arms scored 35k-92k LOFO decisions over the 8 dev folds; the materiality bar +0.010
    R/decision is the fs01-01 / f8a1-01 bar. One arm, graded at the house level: one-sided 0.025 on the 8 per-fold deltas (df 7), t >= 2.3646
    (Manager 26a review 2026-11-27 15:25Z). POWER, stated honestly: fs01-01 per-fold deltas spread about 0.02-0.05 R, so P(PASS | true effect
    +0.010) is about 23 / 13 / 7 percent at fold sd 0.02 / 0.03 / 0.05 (noncentral t, df 7). A real effect of the materiality size most likely
    reads INDETERMINATE; FAIL needs the upper bound below +0.010.'
  feasibility:
    source: none
    accrual_basis: Replays public Binance Vision history and Deribit's public DVOL history through 2025-09-30 only (no later date is
      downloaded); nothing accrues.
run:
  command:
  - python3
  - scripts/research/ml_entry_v2_run.py
  - ablation_dvol
  - '{unit}'
  - '{out_dir}'
  timeout_minutes: 300
  workflow: research-script-run.yml
  inputs:
    research_unit: RQ-20261127-26ac-02
decision_rule:
  id: RULE-RQ20261127-26ac-02-DVOL
  registered_at: '2026-11-27'
  registered_before_run: true
  baseline: 'its MATCHED-WIDTH PLACEBO N3 (the recipe + 3 seeded N(0,1) columns, seed 20261130). Baseline A (20 features) and A2 (A,
    second LightGBM seed) are reported, never graded.'
  statistic: 'ml_entry_v2.combine_dvol (combine_placebo for arm V vs N3): the pooled LOFO mean net R per decision minus the placebo''s;
    the 8 per-fold deltas (each fold at its own LOFO tau, as fs01-01); folds with delta > 0; the one-sided t of the 8 per-fold deltas and the
    upper bound mean + t_bar x se; the per-calendar-year mean delta (2022..2025); F9 dev coverage. Columns, the 1-hour availability lag, placebo seed, arms and dev window are fixed now.'
  rule: 'PASS iff pooled delta vs N3 >= +0.010 R/decision AND delta > 0 in >= 6 of 8 folds AND the per-fold t >= 2.3646 (one-sided,
    alpha 0.025, df 7, one arm) AND the yearly mean delta is positive in >= 3 of 4 years AND F9 is present on >= 40 percent of dev rows.
    FAIL iff mean(fold deltas) + 2.3646 x se(fold deltas) < +0.010 (the effect is excluded at the bar). INDETERMINATE otherwise, and whenever
    coverage < 40 percent or fewer than 8 folds carry both means. No threshold, column, lag or seed changes after any result.'
  pass_action: 'ONE confirming read of F9 on disjoint out-of-time data (2025-10-01 onward, holdout_lock claimed, the deflated ENTRY
    bar), registered in its own unit before it runs; a pass there makes those columns an input of the next ml_entry_retrain challenger, a
    data-backed Tier-3 replacement packet applied by the manager or a mandate, never by a lane.'
  fail_action: Close BTC implied vol (DVOL) as a crypto ENTRY input on research/levers/ml-entry.yaml; the next class in the plan (order-book
    depth) stays deferred to its re-entry test. No re-run with other columns, lags or seeds.
  proposal_mapping: pass -> confirming out-of-time read -> Tier-3 packet; fail -> class closed, next class authored; indeterminate -> report the
    realised per-fold se and coverage, stop.
  what_it_does_not_do: Promotes nothing; reads no sealed or held-out window (dev folds only, no date after 2025-09-30 is downloaded); serves
    nothing; changes no config, served model or order path; sizes nothing; adds no gate. One definition (BTC DVOL, 3 columns); a FAIL does not
    refute implied vol in another form (ETH DVOL, term structure, skew).
  min_n: 1000 dev decisions per arm
compute: cpu_long
