why_this_matters: 'tsmom-etf is an orphan (scripts/research/iteration_orphans.py 2026-11-13). Every result so far (58e4-05, d1f3-04) was computed
  on unadjusted closes, which the harness itself states understates long carry on bond/equity ETFs and flatters shorts. Every further lever
  is measured on that series, so the data fix comes first.'
