decision_rule:
  id: RULE-RQ-20261113-62e3-03
  registered_at: '2026-11-13'
  registered_before_run: true
  statistic: 'ARMS (2, both counted; grid fixed in scripts/research/edge_etf_tsmom.py ITER_GRIDS["62e3"]): A0 = E5 on committed price-only
    closes; TR1 = E5 on total-return closes = committed close x (yfinance Adj Close / Close) forward-filled onto the committed dates, factor
    1 for the MHG futures proxy. Per arm: net Sharpe, stress Sharpe, half Sharpes, bootstrap p05, DSR at N_cum = 16 (9 discovery + 5 attempt-2
    arms + these 2). Dividend parity is checked per symbol: median |daily return diff| between yfinance Close and the committed close <= 5 bps.'
  rule: 'PASS iff TR1 clears the UNCHANGED registered rule: net Sharpe >= 0.5 AND stress (2x slippage) Sharpe > 0 AND Sharpe > 0 in BOTH halves
    AND bootstrap p05 of annualised mean net > 0 AND DSR > 0.95 at N_cum = 16, on 2008-01-02..2024-06-28. FAIL iff the control computed and
    reproduced and TR1 does not clear it (the series lever response is recorded; the next lever is measured on whichever series is correct).
    INDETERMINATE iff the control series is insufficient, OR the control A0 net Sharpe misses the committed 0.418 by more than 0.01
    (--expect-control-sharpe), OR any distribution-paying symbol''s dividend factor cannot be established (fetch failed / no rows / parity
    failed): a part-price-only arm is not a verdict. Holdout not read; a PASS earns ONE holdout read, never a book.'
  what_it_does_not_do: Edits no config and no roster, places no order, proposes no live leg, reads no data after 2024-06-30. Does not model
    short borrow or cash financing (stated in the harness). A FAIL says only that TR1 (E5 on total-return closes) did not clear the rule.
