  diagnosis: 'RQ-20261101-d1f3-04 (attempt 2; 5 arms incl. control, daily net, 2008-01-02..2024-06-28, n_days=4151, DSR N_cum=14): every
    arm FAILS. Control E5 net Sharpe 0.418 (< 0.5), halves 0.495 / 0.342, DSR 0.48; long leg +0.319, short -0.023; asset-class gating hurt
    (equity-only 0.40, non-equity 0.27); R2 (flat when SPY < 200d) is best at 0.609, DSR 0.77, failing only the DSR bar. The edge is stable
    but SMALL. CAUSE (hypothesis): part of the shortfall is measurement - the series are price-only (harness docstring), so the long book,
    which is the side that earns, is missing its distributions (bond ETFs TLT/IEF and equity ETFs pay; a long-biased trend book on 16.5 years
    carries that every year), while shorts are not charged them. COMPETING: distributions are a small level shift (single-digit bps per day
    at the sleeve weights) that lifts longs and penalises shorts about equally across the sample, leaving Sharpe near 0.42-0.6 and the DSR
    bar out of reach; then the binding constraint is breadth (11 assets), not the series.'
  hypothesis: total-return closes lift the long book's carry enough to move the E5 Sharpe toward the bar without any parameter change
  search: 'data: total-return series (committed close x yfinance Adj Close / Close dividend factor), signals and costs unchanged'
