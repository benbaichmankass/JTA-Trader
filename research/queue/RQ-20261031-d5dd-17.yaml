# Hand-authored 2026-10-31 by RESEARCH-AUTHORING-20261031-SAMEDAY (Tier 1), dispatched by Manager Session 2026-10-31a (runnable_floor breach 13:05Z, 67 vs 71). Decision rule registered BEFORE any run. Gates: none.
id: RQ-20261031-d5dd-17
title: 'Regime head at 1h: does adding HAR-RV day/week/month realised-variance features lift LightGBM log-loss over LightGBM on the shipped features on
  BTC, ETH and SOL?'
status: queued
cadence: once
theme: ml_health
priority: 2
kind: experiment
programme: P2
roadmap:
- M25
question: On the latest 60,000 1h bars of BTCUSDT, ETHUSDT and SOLUSDT, does LightGBM with HAR-RV inputs (d/w/m, bars_per_unit 24) beat LightGBM on the
  shipped six features by >= 0.003 nats of regime log-loss on the CV mean on ALL three symbols?
why_this_matters: 'HAR-RV was read only at 15m (75b2-22..24, a793-01..03, all done); 1h is the horizon of the rostered 2h/4h legs'' regime gate and was
  never ablated. The class-prior comparison at 1h is already on record (41cc-14/-26); this asks the marginal question the prior cannot: does the classical
  vol-persistence block add anything to a model that already has rolling vol?'
ml_consumer:
  consumer: src/runtime/regime_shadow.py
  decision: whether the regime head (and its vol/direction feature set) may advance candidate -> shadow -> advisory as the vol/trend gate input on the rostered
    real-money legs (it acts only through the regime router, never an order)
  legs:
  - trend_donchian_eth_4h
  - trend_donchian_xrp_4h
  - xrp_pullback_2h
  - ada_pullback_2h
  book: money
power:
  expected_n: 36000
  min_detectable_effect: 0.1
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'tail_rows 60000 with min_train_frac 0.4 leaves ~36000 out-of-sample rows over 5 folds per symbol; d=0.1 paired needs ~785 rows; bars are autocorrelated
    so effective n is lower: the rule requires the same-direction CV mean on EVERY symbol. expected_n is an ESTIMATE, not a measurement.'
  feasibility:
    source: none
    accrual_basis: 'Fixed by construction (tail_rows of a nightly-rebuilt shard): n does not grow with waiting, so an underpowered result is reported as
      such and the follow-up is a different dataset, not a re-run.'
decision_rule:
  id: RULERQ20261031d5dd17
  registered_at: '2026-10-31'
  registered_before_run: true
  statistic: Paired per-fold difference in multiclass log-loss (baseline minus candidate, positive = candidate better) on identical purged folds (5, embargo
    24 rows), mean over folds, per symbol.
  rule: 'PASS IF lgbm_har beats lgbm by >= +0.003 nats on the CV mean on ALL of BTCUSDT, ETHUSDT and SOLUSDT. FAIL IF lgbm_har does not beat lgbm by >=
    0 on the CV mean on ANY symbol: HAR-RV adds nothing at 1h on this configuration (handed to /ml-review, never an automatic change). INDETERMINATE otherwise,
    or if folds < 3 or a shard is stale/unavailable. Thresholds are not changed after any result.'
  min_n: 3 usable CV folds per symbol; reported n_rows per symbol.
  what_it_does_not_do: Builds, calibrates and serves nothing, promotes nothing, touches no config; a log-loss PASS is not edge and not a P&L figure, and
    the head's advisory stage is unchanged. A FAIL closes this configuration only; the learner family is not retired.
intervention_controls:
  not_applicable: a model-quality bake-off on a static published shard, not an in-trade action or active-management intervention
compute: auto
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  published_data: metis-market-data
  peak_memory_gb: 3.0
  est_minutes: 30
  basis: 'Estimate, NOT measured: 3 shards x 2 arms x 5 folds on published shards, comparable to RQ-20261030-41cc-26; compute: auto routes it to the Kaggle
    CPU kernel.'
value:
  bucket: ai_trader
  usd_at_stake_per_month: 150
  confidence: 0.2
  basis: 'stand-in: gates whether the head is worth advancing on the money legs; not a measured P&L'
run:
  command:
  - python3
  - scripts/research/ml_bakeoff.py
  - --unit
  - '{unit}'
  - --out
  - '{out_dir}'
  timeout_minutes: 60
  inputs:
    research_unit: RQ-20261031-d5dd-17
ml_bakeoff:
  task: classification
  metric: logloss
  higher_is_better: false
  dataset:
    kind: jsonl
    groups:
      BTCUSDT_1h:
        path: datasets-out/market_features/BTCUSDT/1h/v002/data.jsonl
      ETHUSDT_1h:
        path: datasets-out/market_features/ETHUSDT/1h/v002/data.jsonl
      SOLUSDT_1h:
        path: datasets-out/market_features/SOLUSDT/1h/v002/data.jsonl
    ts_col: ts
    target: regime_label
    features:
    - rolling_log_return_vol
    - log_return
    - log_return_lag_1
    - log_return_lag_2
    - hour_of_day
    - dayofweek
    tail_rows: 60000
  cv:
    folds: 5
    embargo_rows: 24
    min_train_frac: 0.4
  baseline: lgbm
  controls:
  - prior
  candidates:
  - lgbm_har
  learners:
    prior:
      kind: prior
    lgbm:
      kind: lightgbm
      params: &id001
        learning_rate: 0.05
        min_child_samples: 50
        n_estimators: 200
        num_leaves: 31
    lgbm_har:
      kind: lightgbm
      params: *id001
      feature_blocks:
      - kind: har_rv
        return_col: log_return
        bars_per_unit: 24
  rule:
    min_folds: 3
    pass_if:
    - group:
      - BTCUSDT_1h
      - ETHUSDT_1h
      - SOLUSDT_1h
      vs: baseline
      window: cv
      op: '>='
      value: 0.003
    fail_if_no_candidate_reaches:
    - group: any
      vs: baseline
      window: cv
      op: '>='
      value: 0.0
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
practice_precedent: 'M6 (docs/reference/trading-and-model-practice-principles.md): purged, embargoed walk-forward CV; a log-loss lift is reported per symbol,
  never pooled; the control arm is the strongest classical feature set, not only the class prior.'
related:
- RQ-20261030-41cc-26
- RQ-20261012-75b2-22
- scripts/research/ml_bakeoff.py
