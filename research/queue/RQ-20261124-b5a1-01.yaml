# with its rule, its matched random-intervention control and its claimed holdout. Every choice the design memo left open is written down in decision_rule.choices_where_the_design_memo_is_silent.
# Gates this adds or changes: none. Nothing here touches the trade path; a pass is a proposal input, never an apply.
id: RQ-20261124-b5a1-01
title: 'AM v2 stage B (target): a two-way TARGET as a head-driven bracket policy on the CF replay vs HOLD and 20 matched random re-timings'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
programme: P2
kind: experiment
iteration:
  subject: ml-brackets
  subject_kind: ml_model
  from_result: research/results/RQ-20261123-a9d1-01/local-20261123T2011Z.jsonl
  verdict_read: pass
  diagnosis: 'Stage A (RQ-20261123-a9d1-01) PASSED: all five graded heads (q0.5, q0.9, reach_2, stop_first, dip_recovers) beat the training fold''s state-conditioned
    lookup by 1-3.5% loss on >= 6 of 8 dev folds and on the 2026 holdout. Skill is NOT P&L (the giveback predictor''s lesson). The operator''s frame (2026-11-23,
    AM-V2-CF-DIRECTED): brackets move in both directions (a predicted target, an invalidation level, banking, loosening when a dip should recover). Stage B asks,
    one action class per unit, whether the heads'' moves pay on the counterfactual path.'
  search: 'lever family bracket; mechanism: Level = clip(original TP, close + Q50, close + Q90) in R from entry, floor 0.25 R beyond the close, re-placed when it
    moves >= 0.10 R; legs with no TP in the replay (tp None) get no target action. Heads: q0.5, q0.9 (Stage A PASS).'
  levers:
  - bracket
  map_entries:
  - research/levers/ml-brackets.yaml
  attempt: 1
  due_by: '2026-12-01'
question: 'Does a two-way TARGET (the original TP clipped into the [q0.5, q0.9] remaining-MFE band: pulled in when it sits beyond what 90% of paths reach, extended
  when it sits nearer than the median reach), driven by the Stage-A heads on the run-w counterfactual replay, clear RULE-AM-RISK-ADJUSTED-V1 (R1 cost <= 0.05 R/trade,
  R2 drawdown or weekly-CVaR5 cut >= 15%, R3 >= 4 of 6 calendar folds, R4 beats >= 95% of 20 matched random re-timings of the same action), net of the full cost stack,
  on the dev segment AND on the claimed 2026 holdout?'
why_this_matters: 'A pass is a Tier-3 PROPOSAL input for this action class (advice-only today, ARCHITECTURE-CANONICAL § Active management) and nothing else; a fail
  closes this class on these 9 features and sends the diagnosis to richer features (structure, market state). Operator priority 2026-11-23: active management v2 is
  top for ML and strategy work.'
power:
  expected_n: 481
  min_detectable_effect: 0.02
  effect_units: R_per_trade_weekly_mean_delta
  sd: 0.05
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATE. The independent unit is the entry WEEK (~481 distinct entry weeks in the run-w corpus, MEASURED in Stage A''s power block), not the ~469k trades
    or the 9.4M rows that share market paths. The statistic is the week''s mean paired (arm - HOLD) net R per trade; sd 0.05 R of that weekly mean is NOT measured
    (an inflated guess: ~975 trades a week at a per-trade delta sd of ~0.5 R gives ~0.016 if independent, x3 for the shared market path). At sd 0.05 and a 0.02 R
    effect the paired floor is (2.8*0.05/0.02)^2 = 49 weeks, below 481. The graded verdict is RULE-AM-RISK-ADJUSTED-V1''s R1-R4 screen, not this t-test.'
  feasibility:
    source: replay
    verdict: comms/research/RQ-20261123-a9d1-01/local-20261123T2011Z/verdict.json
    accrual_basis: Re-reads the SAME fixed corpus Stage A measured (469,172 trades, 9.4M rows, ~481 entry weeks); nothing accrues.
evidence_class:
  holdout: holdout_window
  claim: edge
ml_consumer:
  consumer: .claude/skills/live-trade-review/SKILL.md
  decision: target, invalidation and banking levels a live-review packet states and may move (advice-only until a class passes RULE-AM-RISK-ADJUSTED-V1)
  legs:
  - ml_entry
  book: money
baseline:
  definition: 'HOLD = `replayed_actual` of the same replay (the leg''s own TP, trail and harness timeout), net of the full cost stack. REFERENCE (reported, never
    gating): the random re-timings of the same action (R4).'
  net_of_cost: true
  per_leg_base_rates: reported per strategy / leg / timeframe in the landed measurement (reported_cuts), never graded
run:
  workflow: am-policy-arm.yml
  timeout_minutes: 360
  inputs:
    research_unit: RQ-20261124-b5a1-01
    classes: target
decision_rule:
  id: RULE-AM-HEADS-STAGE-B-20261124
  registered_at: '2026-11-24'
  registered_before_run: true
  statistic: 'scripts/research/am_policy_arm.py (decide, control_specs, reduce_run, unit_verdict) over scripts/research/am_risk_adjusted.grade_risk_adjusted: class
    target arm vs HOLD and 20 seeded matched random re-timings, on the dev segment (entry < 2026-01-01) and the claimed holdout (entry >= 2026-01-01).'
  rule: 'RULE-AM-RISK-ADJUSTED-V1 with V1 parameters UNCHANGED, per segment: R1 net R given up per baseline trade <= 0.05; R2 max-drawdown cut >= 15% OR weekly-CVaR5
    cut >= 15%; R3 the fold holds in >= 4 of 6 calendar folds; R4 beats >= 95% of the 20 controls (net R >= the control''s AND the risk cut >= the control''s, one
    strictly); n floor 39; the lever must fire. UNIT verdict: PASS iff dev AND holdout both PASS; FAIL iff the dev segment FAILS (a necessary clause read and failed);
    else INDETERMINATE. Every number in the policy (score cuts, levels, hysteresis, caps, fractions, seeds, 20 draws) is fixed in am_policy_arm.py before the first
    run and never changed after a result.'
  what_it_does_not_do: Serves, promotes or applies nothing; changes no bracket, config or order; is a per-trade-R SCREEN (BOOK-SIM-REAL-SIZER owns the book-level
    $ measurement), so a pass is a Tier-3 proposal input only; says nothing about the other action classes (each is its own unit).
  pass_action: Propose the target class to the manager as a Tier-3 / mandate decision input (advice-only today); no apply from this unit.
  fail_action: Record the target class closed on these features on research/levers/ml-brackets.yaml and file the richer-feature build (structure, market state) as
    the next lever, not a re-run.
  proposal_mapping: pass -> Tier-3 proposal input; fail -> richer-features unit; indeterminate -> state which segment/clause and why and stop (no re-run at another
    threshold).
  choices_where_the_design_memo_is_silent:
  - 'DECISION ROWS: one decision per bar CLOSE k, k = 1.. the bars the UNMANAGED trade is still open (the cf_bar_labels rows the heads were fitted on); features use
    bars 1..k only; a move is effective on the first bar opening at or after bar k''s close. After the unmanaged trade''s last row the brackets stay where the policy
    left them (no head output outside its training distribution).'
  - 'SCORE CUTS: the fold''s own TRAINING-score percentiles (p90, and p50 for the dip head), saved with the heads; never test data, never tuned.'
  - 'HEADS: re-fits of the Stage-A recipe (same 9 features, LGB params, seed, 400k-row cap, purged half-year folds), saved by `am_heads_fit.py dump`, because Stage
    A''s own models were not saved; a trade is scored by the head of the fold it ENTERED in (trained on trades whose label window ends 7 days before that fold). The
    holdout fold''s head is fitted on pre-2026 data only. Trades before 2022-01-01 have no out-of-sample head and are excluded (counted).'
  - BASELINE = HOLD = `replayed_actual` of the same replay (the leg's own TP + trail + harness timeout), byte for byte (tests/test_am_policy_arm.py::test_baseline_arm_is_replayed_actual);
    a policy that never acts equals it exactly. Entry at the signal bar's close (entry_at_bar_close, run-w convention), no signal-bar lookahead.
  - R unit = the ORIGINAL stop distance; net R from the engine's own net_of (fee + exit slippage + funding, the full cost stack). Positions are not re-sized in trade,
    so a loosened stop genuinely risks more than 1 R and that tail is charged to the arm's drawdown and CVaR.
  - 'POPULATION: the run-w backtest corpus (sha 1eb164f4), the legs that have a keyless Binance Vision bar source (crypto); equity/ETF legs have none (`no_bar_source`)
    and the ml_entry decision legs are not in this corpus; stated, not silently dropped. Fidelity of the replay to the harness (76% within 0.10 R, cfb-20261123b,
    pending re-read on w) is a property of both HOLD and the arm, so the delta cancels it; the baseline is the replay, not the harness.'
  - 'CONTROL (R4): 20 seeded draws per class; each keeps the policy''s per-trade action count and level parameters and re-times them to uniformly drawn rows from
    the unmanaged trade''s open rows that satisfy the class''s head-free precondition. It never fires into a closed trade, so it is a STRONGER control than a causal
    one (conservative for the policy).'
  - 'GRADING: RULE-AM-RISK-ADJUSTED-V1 with its V1 parameters unchanged (am_risk_adjusted.grade_risk_adjusted), on the DEV segment (entry before 2026-01-01) and again
    on the claimed HOLDOUT (entry from 2026-01-01). PASS iff both segments pass R1-R4; FAIL iff the dev segment fails a necessary clause; else INDETERMINATE. Per-strategy
    / per-leg / per-timeframe cuts are REPORTED, never graded. BOOK-SIM-REAL-SIZER does not exist yet, so this is a per-trade-R SCREEN (`graduation_eligible: false`):
    a PASS is a Tier-3 proposal input, never an apply.'
  - 'HOLDOUT: each class unit is its own read of family AM-HEADS on 2026-01-01..end, claimed in the ledger by the reduce step BEFORE the holdout books are built.
    Stage A was read 1 (prior n_tries 1), so the first Stage-B unit reads as n_tries 2 and later ones deflate further; the ledger line is merged and landed with the
    result. The bar for each read is the ledger''s own `bar_for(n)`.'
  - 'THIS CLASS: Level = clip(original TP, close + Q50, close + Q90) in R from entry, floor 0.25 R beyond the close, re-placed when it moves >= 0.10 R; legs with
    no TP in the replay (tp None) get no target action. Heads: q0.5, q0.9 (Stage A PASS).'
