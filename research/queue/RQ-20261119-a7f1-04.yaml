decision_rule:
  id: RULE-RQ-20261015-24ca-05
  registered_at: '2026-10-15'
  registered_before_run: true
  statistic: 'Per seed 1-5: prop_ev_sim path-mode ev_net_usd_per_life and p_net_positive over the leg''s trade ledger
    (n = ledger rows), as graded by scripts/research/prop_ev_grid.py --grade pass_all_seeds.'
  rule: 'PASS IF n_trades >= 88 AND ev_net_usd_per_life > 0 on ALL 5 seeds AND p_net_positive >= 0.70 on ALL 5 seeds
    (prop_ev_sim path mode, config/prop_rulesets/tradeify_247_1step.yaml, flat 0.5% risk, --lev-cap uso_trend_1h=2,
    --no-hedge, prorated swap, funded-start fresh, Tradeify cost stack 8 bps commission round trip + 3 bps declared
    slippage + 0.033%/day swap re-applied by the sim to the harness gross_r). FAIL IF ev_net_usd_per_life <= 0 on
    ANY seed (one pass: re-queues once for a confirmatory run before it is read as a kill). INDETERMINATE (UNDERPOWERED)
    IF n_trades < 88; INDETERMINATE (NULL) IF ev > 0 on all seeds but p_net_positive < 0.70 on any seed. The harness''s
    own Stage-0 number (net_total_r at the same declared costs) is written to harness.json beside the verdict and
    is reported, not graded separately: a leg with no net edge cannot show ev > 0 on all 5 seeds. OPERATOR RULE
    (2026-10-15, relayed by the manager; binding on every prop leg): a prop leg clears the full real-money path,
    not a shortcut. STAGE 0 backtest net of the full cost stack, THEN a SOAK (live prop trading on the account counts
    as the soak), THEN COST FIDELITY (realized cost vs the declared cost used here), PLUS prop DD SURVIVAL under
    the account''s rules. This unit is the first and last-but-one of those only: it supplies Stage 0 and the prop-survival
    simulation. A PASS authorizes NO roster edit, NO account opening and NO order; soak, cost fidelity and the Tier-3
    roster decision stay open.'
  what_it_does_not_do: 'Does not touch config/strategies.yaml, config/accounts.yaml or config/prop_platforms.yaml,
    places no order, and does not claim Tradeify''s quoted spread: the per-instrument spread/commission/swap/leverage/hours
    shown by the terminal are UNMEASURED (the terminal''s instrument-info panel is reachable only after a watchlist
    add, a UI mutation this lane did not perform); the costs above are the firm-declared rule-page figures (docs/research/tradeify-portfolio-feasibility-2026-09-30.md,
    config/prop_rulesets/tradeify_247_1step.yaml, unconfirmed: true) plus a DECLARED 3 bps slippage. Candles are
    the trainer''s data/<SYM>_<tf>.csv (1h to 2026-06-18, verified by trainer-diag #18392 on 2026-10-15), i.e. an
    ETF proxy, not the Hyperliquid-fed synthetic perp''s own price history.'
