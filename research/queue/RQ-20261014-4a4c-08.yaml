question: Using survey-consensus PIT rows only, is Spearman(core_pce_mom surprise, ES=F forward return from the release-day close) negative with |t_eff| >= 2.4 at h=1, 3 or 5?
why_this_matters: Inflation-surprise family, untested kind; the third member after ppi_mom (PASS) and core_cpi_mom (RQ-20261014-4a4c-07). Core PCE is usually well anticipated after CPI/PPI,
  so the prior is a SMALLER effect than PPI; a PASS would be surprising and is read with BH over the family (45 tests).
