id: RQ-20261017-ae17-42
title: 'Queue integrity: does every queued unit name a known theme, a priority 1-3 and a pre-registered decision rule?'
status: queued
cadence: daily
theme: infra
priority: 1
kind: deterministic
question: >-
  Does every research/queue unit with status queued carry id == filename, a theme present in research/THEMES.yaml, priority 1-3 and a decision_rule.id
  + rule (e35-bracket-sweep.yml units carry the E35 gate in the harness)?
why_this_matters: >-
  Theme infra (weight 2) held 0 runnable units on 2026-10-17 and fired 3 of 300 times in 7 d (research-slo theme_share_min_ratio 0.11 vs target
  0.5), while the research pipeline's own failures (a runner without yfinance; a grader that erased hand grades) went unseen for hours. A daily
  self-test is the cheapest standing detector for each. Plumbing only: it says nothing about any strategy or model.
why_not_inferential: 'A deterministic self-test of repo state on the runner: the property either holds or it does not. There is no sampling question
  to power.'
decision_rule:
  id: RULE-RQ20261017ae1742-INFRA-QUEUE-INTEGRITY
  registered_at: '2026-10-17'
  registered_before_run: true
  statistic: verdict.measurement.violations from scripts/research/infra_selftest.py --check queue_integrity
  rule: >-
    PASS IF 0 violations over the queued population. FAIL IF any unit is unparseable or misses one of the four (named in measurement.sample):
    a unit without a pre-registered rule is not work. A producer_failed or no_data record is NOT a verdict: read run-manifest.json, fix the route,
    re-queue (last_dispatched_at: null); the rule is never edited.
  what_it_does_not_do: Measures nothing about any strategy, model or market; edits no config, registry, account or queue unit.
