id: RQ-20261125-0838-02
title: 'eth_pullback_2h / sol_pullback_2h COST-SHARE iteration: gross edge survives but cost takes ~80% of gross at 2h; does a 4h bar or a wider 3.0 ATR stop cut
  cost per R enough to pass Stage 0 net?'
status: queued
cadence: once
roadmap:
- L-LADDER
theme: new_strategy_prop
priority: 2
kind: experiment
question: 'On ETHUSDT and SOLUSDT, 2020-06..2026-10, full cost stack, harness pullback family at the live params (== family defaults): does arm T4 (same params at
  a 4h bar) or W30 (2h, atr_stop_mult 3.0) beat the 2h declared arm B by >= 0.05 R per trade pooled, with pooled n >= 88, pooled net R > 0 and >= 4 of 6 calendar
  folds net positive?'
why_this_matters: 'lever map research/levers/eth_pullback_2h.yaml: n 83, net +1.39R, gross +6.76R, cost 5.38R = 79.5% of gross (verdict_hint: gross edge survives
  cost); timeframe and symbol_set families are UNTESTED. Cost in R falls as the stop widens in price terms (cost_bps / stop_bps) and as the bar coarsens (fewer, larger
  moves), so these two arms are the levers the diagnosis implicates. A PASS is a discovery (Stage-0 selection of 2 arms) for a confirmation on a disjoint window,
  never a roster edit.'
power:
  expected_n: 160
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATE: ETH 2h n 83 over ~1.4y (lever map) scales to ~6y x 2 symbols ~ 160-350; 2h arms. d 0.3 at alpha 0.05 / power 0.8, pooled floor 88; below it grades
    indeterminate, never FAIL.'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ20261125-0838-02-PULLBACK-COSTSHARE
  registered_at: '2026-11-25'
  registered_before_run: true
  rule: 'Arms and thresholds fixed before the run (2 arms W30 vs B at 2h; the 4h arm is the separate unit RQ-20261125-0838-03, denominator 2 candidates across the
    pair). W30 PASSES iff pooled n >= 88, pooled net_r > 0, >= 4 of 6 calendar folds net positive, >= half the powered cells pass, AND W30 beats B pooled net R/trade
    by >= 0.05 R. Net positive in >= 3 of 4 calendar years, no single year > 50% of total net, long and short net both >= 0 and per-year table reported (regime-robustness
    clause). PASS = a SELECTION, unconfirmed: the follow-up is ONE confirmation on a disjoint window (pre-2020-06 where the feed exists, else a symbol twin: AVAX/ADA
    2h). FAIL if W30 fails (n >= floor): stop width is not the cost lever on this leg; next family is symbol_set. INDETERMINATE if pooled n < 88 or fewer than half
    the cells measured.'
  statistic: 'harness_stage0.py --family pullback: per cell and pooled net R/trade, per-fold, per-year, full cost stack by venue.'
  pass_action: ONE confirmation unit on a disjoint window; then the Stage-0 evidence record for the leg (never a roster edit, Tier-3 the manager's).
  fail_action: Record the stop-width response on research/levers/eth_pullback_2h.yaml; the 4h arm (0838-03) and symbol_set are the remaining untested families.
  what_it_does_not_do: Edits no config or roster, places no order, promotes nothing; the live legs run unchanged.
  min_n: 88
