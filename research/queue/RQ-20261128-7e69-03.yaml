id: RQ-20261128-7e69-03
title: 'M16 within-leg `confidence` vs full-cost R on an INDEPENDENT longer-history eval set (the harness trades before each leg''s committed
  window): the rule of RQ-20260930-602, run now instead of waiting for +500 ledger trades'
status: queued
cadence: once
theme: ml_health
priority: 3
kind: experiment
question: 'M18 measured the `confidence` scalar at OOS AUC 0.522 against a pre-registered 0.55 gate (n_eval = 1,236) as a CROSS-candidate win
  predictor, so it cannot select between strategies. Each strategy builds `confidence` from its own geometry (breakout depth, pierce depth, pullback
  quality), so its scale is not comparable across strategies. Does the score rank trades WITHIN a leg: is the past-only within-leg percentile
  of a trade''s confidence positively associated with its full-cost net R, net of month-level drift, and does a budget-matched tilt on it gain
  R, on the committed cost-complete ledgers? Population change ONLY: instead of waiting for the committed 365-day ledgers to accrue, every committed
  measured leg is replayed by the harness (scripts/ops/build_strategy_evidence.py) over 1,095 days with its CURRENT config, kept only if its rebuilt
  config fingerprint equals the committed record, and graded on the trades BEFORE its committed window start (so the eval set shares no trade
  with the ledgers RQ-20260930-601 read).'
why_this_matters: 'Operator, 2026-09-30 (manager popup, verbatim): "Re-scope it" — M16 is re-scoped rather than parked, to a use confidence MIGHT
  serve (pipeline item PI-20260928-NLANEM16-0001; WORKPLAN-2026-08-26 Lane D1). Within-leg sizing is the use the M18 verdict does not rule out,
  and it is the use the live reductive conviction-sizing arm (bybit_1, demo) already assumes. The C1 A/B (docs/research/C1-conviction-sizing-evidence-2026-08-04.md)
  graded that arm on portfolio max-drawdown over a net-negative population; nobody has measured the prior question of whether confidence ranks
  trades inside a leg. A FAIL closes the within-leg use and leaves the demo arm with no evidential basis (a Tier-3 call for the operator, not
  made here). A PASS only authorises a budget-matched path A/B. Memo: docs/research/m16-rescope-2026-09-30.md. This unit exists because the operator
  (2026-11-28) wants no research to wait months for data (row RESEARCH-NO-WAIT-FOR-DATA / NO-WAIT-HAND-BUILDS): the harness can generate the missing
  eval trades now. RQ-20260930-602 stays as-is (it waits for the ledgers); this is its no-wait twin and the registered rule is unchanged.'
power:
  expected_n: 5000
  min_detectable_effect: 0.0802
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATE from a MEASURED smoke: a 3-leg run (ada/avax/eth pullback, 1,095 d) gave 359 eval trades after the 20-trade warm-up (about
    120 per leg before the committed window); x about 46 config-exact legs = about 5,500; expected_n is set below that. The registered N_FLOOR
    1,500 and the 0.08 bar are those of RQ-20260930-602 (Fisher-z minimum detectable rho 0.0724 at the floor). Trades in a month across legs share
    a market, so the permutation null stays stratified by (leg, month).'
  feasibility:
    source: none
    accrual_basis: Historical re-read of committed files; nothing accrues. Population census run 2026-09-30 before registration and limited to
      counts, nulls and distinct values — the confidence-to-R relationship was NOT computed, so the rule below is registered before anyone has
      seen it.
decision_rule:
  id: RULE-RQ20261128-7E69-03-M16-LONGHISTORY
  registered_at: '2026-11-28'
  registered_before_run: true
  statistic: 'scripts/research/m16_within_leg_confidence.py over comms/strategy_evidence/: every leg whose summary reads coverage_state "measured"
    and whose source_run ledger exists, legs with >= 40 usable trades (numeric confidence and net_r). For each trade with >= 20 trades of STRICTLY
    EARLIER entry time in its leg (trades sharing its timestamp are not its past), pct = mid-rank percentile of its confidence among those earlier
    trades (past-only; reads confidences, never outcomes). rho = pooled Spearman(pct, full-cost net_r), both centred within (leg, entry-month)
    strata. p = one-sided permutation p, net_r permuted within the same strata, 10,000 shuffles, seed 20260930. lofo = rho with each strategy
    family (ict_scalp, trend_donchian, pullback, other) removed in turn. delta = sum(w - 1) * net_r over the eval trades, where w = (0.5 + pct)
    / mean over that trade''s leg of (0.5 + pct), so each leg''s tilted book risks the same total as its flat book (budget-matched PER LEG; without
    the division a leg whose confidence merely drifts upward gets weights near 1.5 and gains about half its net R with no ranking). delta is the
    net R the tilt gains against flat sizing on this ledger. POPULATION for this unit: the legs and ledgers are those of scripts/research/m16_longhistory.py:
    committed measured legs rebuilt over 1,095 days with the current config, kept only if config_fingerprint equals the committed record, trades
    kept only if entry time is BEFORE the leg''s committed reproduce.data_start. The statistic, bars, floor, seed and permutation are unchanged
    (m16_within_leg_confidence.grade).'
  rule: UNDERPOWERED (verdict indeterminate) IF pooled n_eval < 1,500. NOT_APPLICABLE (no_data) IF no leg qualifies. ELSE PASS IF (A) n_eval >=
    1,500 AND (B) rho >= +0.08 AND (C) permutation p <= 0.05 AND (D) min over families of lofo >= +0.04 AND (E) delta > 0. ELSE FAIL. The bar
    0.08 sits above the 0.0724 minimum detectable effect at the floor, so a PASS cannot be a detectable-but-trivial correlation. A FAIL is one
    pass and re-queues once for a confirmatory run before it is read as a kill. A PASS authorises ONLY a budget-matched path-dependent A/B (the
    existing c1-conviction-ab harness, per leg); it does not authorise a config, sizing or risk change, and no live setting moves on this unit
    alone. (Unchanged from RULE-RQ0930-602-M16-CONFIRMATORY; only the population differs.)
  what_it_does_not_do: 'Does not test cross-strategy selection (closed by M18). Does not test a veto: the bottom-decile contrast is printed, informationally,
    and gates nothing. Does not test a volatility or regime proxy, nor an ordering tie-break (already measured: ranking-key A/B 2026-09-08, confidence_first
    p = 0.097, not preferred over priority_first). Does not model position-path interaction: a tilt changes size, hence margin and drawdown, which
    this ledger-level delta cannot see. The ledgers are 365-day crypto windows and ~15-month equity windows under parameter_selection not_established;
    a PASS is Stage-0 evidence of a mechanism, not of edge. Reads no live book and changes no config.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 3.0
  est_minutes: 60
  why_runner: rebuilds ~49 harness ledgers from public Binance Vision klines (and keyless equity bars); the Kaggle kernel has no internet
  basis: 'MEASURED: one leg over 1,095 d took 39 s (fetch + replay) locally; 3 legs took 1 min 53 s end to end; x about 49 legs = about 30 min
    plus the 10,000-shuffle permutation; 60 min kept as headroom.'
