id: RQ-20261110-c4f1-04
title: 'Regime head at 15m on SOL: does adding BOTH BTC and ETH return and vol context beat the same-asset LightGBM regime head?'
status: queued
cadence: once
theme: ml_health
priority: 2
kind: experiment
programme: P2
roadmap:
- M25
question: Two-leader context (BTC and ETH log_return and rolling_log_return_vol) vs same-asset lgbm on SOL 15m, purged 5-fold CV embargo 24, tail 60000 rows. 15m twin of c4f1-03.
why_this_matters: '15m twin of c4f1-03 on the deployed timeframe. One group: a PASS is a LEAD, not a pooled claim. This is one of 4 cross-asset arms in this batch.'
ml_consumer:
  consumer: src/runtime/regime_shadow.py
  decision: whether a two-leader context block is worth building into the SOL 15m regime head candidate
  legs:
  - trend_donchian_eth_4h
  - trend_donchian_xrp_4h
  - xrp_pullback_2h
  - ada_pullback_2h
  book: money
power:
  expected_n: 36000
  min_detectable_effect: 0.1
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'tail_rows 60000 with min_train_frac 0.4 leaves ~36000 out-of-sample rows over 5 folds per symbol; d=0.1 paired needs ~785 rows; bars are autocorrelated so effective n is lower: the rule
    requires the same-direction CV mean on EVERY listed symbol. expected_n is an ESTIMATE, not a measurement.'
  feasibility:
    source: none
    accrual_basis: 'Fixed by construction (tail_rows of a nightly-rebuilt shard): n does not grow with waiting, so an underpowered result is reported as such and the follow-up is a different dataset,
      not a re-run.'
decision_rule:
  id: RULE-RQ20261110c4f104
  registered_at: '2026-11-10'
  registered_before_run: true
  statistic: 'scripts/research/ml_bakeoff.py: per-group (SOLUSDT_15m) paired CV mean logloss delta of lgbm_xbe vs lgbm (positive = lgbm_xbe better), 5 folds, embargo 24, tail 60000 rows.'
  rule: 'PASS IF lgbm_xbe beats lgbm by >= +0.002 nats on the CV mean on ALL of SOLUSDT_15m. FAIL IF it does not beat it by >= 0 on ANY group. INDETERMINATE otherwise, or if folds < 3 or a shard
    is stale/unavailable. Stated n: ~60,000 tail rows per group (about 36000 out-of-sample), 5 folds. Thresholds are not changed after any result.'
  what_it_does_not_do: 'No served model, roster or config is read or changed; a research bake-off recipe, not any deployed head. A log-loss PASS is not edge and not a P&L figure; a FAIL closes
    this configuration only, never the lever family. Costs: none apply (a model-quality score, no trades); the full cost stack applies to any later P&L read of a head built from a PASS.'
  min_n: 5 purged CV folds on the tail shard, >= 3 folds
intervention_controls:
  not_applicable: a model-quality bake-off on a static published shard, not an in-trade action or active-management intervention
compute: auto
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  published_data: metis-market-data
  peak_memory_gb: 3.0
  est_minutes: 30
  basis: 'Estimate, NOT measured: 1 shard(s) x 2 arms x 5 folds on published shards, comparable to RQ-20261030-41cc-26; compute: auto routes it to the Kaggle CPU kernel or the runner by the router.'
value:
  bucket: ai_trader
  usd_at_stake_per_month: 100
  confidence: 0.15
  basis: 'stand-in planning weight: gates whether a regime/direction head recipe is worth advancing on the money legs; an estimate, not a measured P&L'
run:
  command:
  - python3
  - scripts/research/ml_bakeoff.py
  - --unit
  - '{unit}'
  - --out
  - '{out_dir}'
  timeout_minutes: 60
  inputs:
    research_unit: RQ-20261110-c4f1-04
ml_bakeoff:
  task: classification
  metric: logloss
  higher_is_better: false
  dataset:
    kind: jsonl
    groups:
      SOLUSDT_15m:
        path: datasets-out/market_features/SOLUSDT/15m/v002/data.jsonl
    ts_col: ts
    target: regime_label
    features:
    - rolling_log_return_vol
    - log_return
    - log_return_lag_1
    - log_return_lag_2
    - hour_of_day
    - dayofweek
    tail_rows: 60000
  cv:
    folds: 5
    embargo_rows: 24
    min_train_frac: 0.4
  baseline: lgbm
  controls:
  - prior
  candidates:
  - lgbm_xbe
  learners:
    prior:
      kind: prior
    lgbm:
      kind: lightgbm
      params:
        learning_rate: 0.05
        min_child_samples: 50
        n_estimators: 200
        num_leaves: 31
    lgbm_xbe:
      kind: lightgbm
      params:
        learning_rate: 0.05
        min_child_samples: 50
        n_estimators: 200
        num_leaves: 31
      feature_blocks:
      - kind: join_columns
        path: datasets-out/market_features/BTCUSDT/15m/v002/data.jsonl
        columns:
        - log_return
        - rolling_log_return_vol
        prefix: btc_
      - kind: join_columns
        path: datasets-out/market_features/ETHUSDT/15m/v002/data.jsonl
        columns:
        - log_return
        - rolling_log_return_vol
        prefix: eth_
  rule:
    min_folds: 3
    pass_if:
    - group:
      - SOLUSDT_15m
      vs: baseline
      window: cv
      op: '>='
      value: 0.002
    fail_if_no_candidate_reaches:
    - group: any
      vs: baseline
      window: cv
      op: '>='
      value: 0.0
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
practice_precedent: 'M6 (docs/reference/trading-and-model-practice-principles.md): purged, embargoed walk-forward CV; a log-loss lift is reported per symbol, never pooled; the control arm is the
  strongest classical feature set, not only the class prior.'
