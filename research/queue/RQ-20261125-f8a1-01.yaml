  holdout: none
  claim: ml_dev_fold_feature_value
run:
  command:
  - python3
  - scripts/research/ml_entry_v2_run.py
  - ablation_macro
  - '{unit}'
  - '{out_dir}'
  timeout_minutes: 300
  workflow: research-script-run.yml
  inputs:
    research_unit: RQ-20261125-f8a1-01
decision_rule:
  id: RULE-RQ-20261125-f8a1-01-MACRO-F8
  registered_at: '2026-11-25'
  registered_before_run: true
  statistic: 'ml_entry_v2.combine over arms A (20-feature baseline), A2 (arm A, second LightGBM seed = the harness noise floor) and M (A + the F8 cross-asset / macro-state
    family). Per arm: leave-one-fold-out tau, pooled mean net R per decision across the 8 dev folds, the per-fold means, and the F8 dev coverage. net R is the recipe''s
    own cost stack (fee + slippage + funding). DEV FOLDS ONLY; no sealed or held-out window is read.'
  rule: 'The ablation admission rule, registered before any run (ml_entry_v2.combine, unchanged from fs01-01): ADMIT F8 iff its pooled LOFO delta vs arm A is >= +0.010
    R per decision AND the delta is positive in >= 6 of 8 folds AND it is >= the measured seed-noise floor |A - A2| AND F8 is present on >= 40 percent of dev decision
    rows. Unit verdict: pass if F8 is ADMITTED; fail if REJECTED; indeterminate if F8 coverage < 40 percent. The thresholds, the arms and the dev window are fixed
    now and not changed after any result.'
  proposal_mapping: pass -> a fresh-window confirmation unit (HOLDOUT-LOCK, deflated bar) before any live ENTRY recipe change (Tier 3, operator). fail -> F8 recorded
    as not an ML entry input on this recipe; regime moves to the equities/futures legs. indeterminate -> F8 too sparse on the dev population; no change.
  what_it_does_not_do: Reads no sealed or held-out window (dev folds only), serves nothing, promotes nothing, changes no config, places no order, sizes nothing, changes
    no live feature set. One definition of macro state (F8, 21 columns); a null does not refute cross-asset inputs under another definition.
  min_n: 1000 dev decisions per arm
  pass_action: Fresh-window confirmation of F8 (decisions after the last ENTRY holdout read; holdout ledger claim, deflated bar) as its own unit, then a Tier-3 recipe
    proposal input for ml_entry (operator decides).
  fail_action: Record F8 (cross-asset as an ENTRY input) closed on this recipe; the regime lever then moves to the equities/futures legs (REGIME-PROGRAM) and ml_entry
    to its next registered lever (decision bar timeframe, b620/b626), authored from this result.
