title: 'Cross-asset / macro state as an ML ENTRY feature (family F8: daily SPY/QQQ/TLT/GLD/UUP 1/5/20-day returns + 20-day realised vol, as of the last COMPLETED
  US close): does adding F8 to the 20-feature ENTRY baseline raise pooled net R per decision on the 8 DEV folds, past the seed-noise floor?'
status: done
cadence: once
theme: ml_health
priority: 2
roadmap:
- L-ML-LIVE
kind: experiment
question: Does adding the F8 cross-asset / macro-state family (21 columns, as of the last completed US close) to the 20-feature ENTRY baseline raise the pooled leave-one-fold-out
  net R per decision by >= +0.010 vs the baseline, positive in >= 6 of 8 dev folds, beyond the measured seed-noise floor, with F8 present on >= 40% of dev decision
  rows, net of the recipe's full cost stack?
why_this_matters: Regime is the operator's standing lever and every sizing/filter form on the crypto legs is closed; this is the regime-as-input form on the model
  that trades money (ml_entry, live on ml_decision_entry_v1, iteration only). An ADMIT goes to a fresh-window confirmation before any recipe change.
power:
  expected_n: 60000
  min_detectable_effect: 0.01
  effect_units: metric
  sd: 1.0
  design: two_sample
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATE, not measured: the pooled ENTRY dev window (60 perps, 2020-07..2025-09, 1h) carries tens of thousands of decision rows per arm (a508-01 measured
    ~5,500 on the traded-5 alone). The admission rule is a per-decision delta of +0.010 R over the A2 seed-noise floor across 8 folds, the same materiality bar the
    F1..F5 ablation (fs01-01) registered. Said before any run; the harness reports the realised n.'
  feasibility:
    source: none
    accrual_basis: Replays public Binance Vision history through 2025-09-30 (dev folds only); nothing accrues, no sealed window is read.
