id: RQ-20261021-7c2b-02
title: >-
  Programme 07 TIMEFRAMES A4 RE-ASK of the VOL arm (instrument error in ef5d-06): daily Donchian-20 on the six perps with the ATR-percentile
  floor at 0.50 / 0.75 on the 0-1 scale vs unfiltered
status: queued
cadence: once
theme: timeframes
priority: 2
kind: experiment
question: >-
  On Binance USD-M daily candles for the six perps over 2020-01-01..2026-10-17 (donchian 20, trail_mult 5.0, as ef5d-06), do VOL50 /
  VOL75 (--vol-skip-below-pctl 0.50 / 0.75) pass the pooled Stage-0 rule AND beat unfiltered B by >= 0.10 R per trade?
why_this_matters: >-
  ef5d-06 (PASS, best arm LONG) carried a VOL50 arm passed as --vol-skip-below-pctl 50 on a 0-1 scale: it measured only the pre-window
  warm-up entries (n=25, +26.6 R, 1.06 R/trade -- a number nobody should quote). The ADX20 and LONG arms are unaffected. This re-asks
  the vol-floor half of the regime-filter question at the correct scale, so P7-Q5's transfer (7c2b-03) is not the only filter read.
power:
  expected_n: 120
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: >-
    B measured n=256 pooled in ef5d-06; VOL50 keeps ~half after the 200-bar percentile warm-up (~110); floor 39 at d=0.45 (E35).
  feasibility:
    source: none
    accrual_basis: Re-measurement on fetched public candles over a pinned window; nothing accrues.
decision_rule:
  id: RULE-P7-A4-VOL-FLOOR-REASK
  registered_at: '2026-10-21'
  registered_before_run: true
  statistic: >-
    harness_stage0.py --family trend --timeframe 1d, arms B, VOL50, VOL75 (donchian 20, trail_mult 5.0); per cell and pooled as ef5d-06.
  rule: >-
    Arms fixed now. PASS iff a VOL arm passes and beats B by >= 0.10 R/trade -> confirm by TRANSFER on the six new perps (same arm,
    no re-selection). FAIL -> the vol floor does not select better daily breakouts on these perps; LONG (ef5d-06) remains the only passing
    filter. INDETERMINATE otherwise (expected for VOL75: ~25% of B's 256 entries after the 200-day warm-up). Verdicts are the script's
    own (scripts/research/harness_stage0.py, grades fixed by these flags): per CELL pass iff n >= n_floor AND net_r > 0 AND >= fold_majority
    of the calendar folds net > 0, fail iff n >= n_floor and not, indeterminate iff n < n_floor; per ARM pass iff pooled n >= pooled_n_floor
    AND pooled net_r > 0 AND pooled folds >= fold_majority AND >= breadth_frac of the POWERED cells pass (and, with --baseline, beats
    the baseline's pooled net R/trade by >= delta), indeterminate iff pooled n < pooled_n_floor or < 2 powered cells or < half the declared
    cells measured (a fetch/harness fault is recorded per cell, never dropped), fail otherwise. Holm-corrected one-sided t p-values
    are REPORTED, not graded. Thresholds are not changed after any result.
  what_it_does_not_do: >-
    Does not edit config/strategies.yaml, config/accounts.yaml or any roster; does not tune beyond the fixed arms listed; does not pool
    windows with any committed record; is not a promotion case. Candles are Binance USD-M (a PROXY for Bybit linear; prices track within
    a few bps) and the funding term is a directionless magnitude (execution_costs P1), both stated in the record.
compute: cpu_long
value:
  usd_at_stake_per_month: 100
  confidence: 0.25
  bucket: frontier
  basis: 'stand-in: daily position legs for the paper/prop books; an estimate.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 4.0
  est_minutes: 60
  basis: >-
    Estimate from the ef5d-0x harness_stage0 runs (2026-10-18/20) scaled by cells x arms x bars; the first run replaces it.
  why_runner: >-
    harness_stage0.py fetches public candles and runs the repo harnesses; CPU-only; not trainer-resident.
run:
  command:
  - python3
  - scripts/research/harness_stage0.py
  - --family
  - trend
  - --symbols
  - BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,ADAUSDT,AVAXUSDT
  - --timeframe
  - 1d
  - --days
  - '2600'
  - --start
  - '2020-01-01'
  - --end
  - '2026-10-17'
  - --param
  - trail_mult=5.0
  - --arm
  - B=
  - --arm
  - VOL50=--vol-skip-below-pctl=0.5
  - --arm
  - VOL75=--vol-skip-below-pctl=0.75
  - --baseline
  - B
  - --delta-r-per-trade
  - '0.10'
  - --folds
  - '6'
  - --fold-majority
  - '4'
  - --n-floor
  - '20'
  - --pooled-n-floor
  - '39'
  - --breadth-frac
  - '0.5'
  - --rule-id
  - RULE-P7-A4-VOL-FLOOR-REASK
  - --data-dir
  - '{out_dir}/data'
  - --out
  - '{out_dir}'
  timeout_minutes: 180
  inputs:
    research_unit: RQ-20261021-7c2b-02
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
roadmap:
- L-TIMEFRAMES
programme: P7
related:
- RQ-20261018-ef5d-06
- scripts/backtest_trend.py
- scripts/research/harness_stage0.py
