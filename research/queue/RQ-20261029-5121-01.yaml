  workflow: research-script-run.yml
  command:
  - python3
  - scripts/research/exit_lever_ablation.py
  - --leg
  - ada_pullback_2h
  - --arm
  - A=
  - --arm
  - BX25=--bank-state-feature=atr_ratio;--bank-state-window=6;--bank-state-op=gt;--bank-state-thr=1.5;--bank-frac=0.25;--bank-at-r=2.0
  - --arm
  - BX33=--bank-state-feature=atr_ratio;--bank-state-window=6;--bank-state-op=gt;--bank-state-thr=1.5;--bank-frac=0.33;--bank-at-r=2.0
  - --arm
  - BX50=--bank-state-feature=atr_ratio;--bank-state-window=6;--bank-state-op=gt;--bank-state-thr=1.5;--bank-frac=0.50;--bank-at-r=2.0
  - --arm
  - UB25=--bank-frac=0.25;--bank-at-r=2.0
  - --arm
  - UB33=--bank-frac=0.33;--bank-at-r=2.0
  - --arm
  - UB50=--bank-frac=0.50;--bank-at-r=2.0
  - --days
  - '2330'
  - --start
  - '2020-07-01'
  - --end
  - 2026-10-15 23:59
  - --grade
  - replace
  - --baseline
  - A
  - --delta-r
  - '0'
  - --delta-r-per-trade
  - '0.02'
  - --folds
  - '6'
  - --fold-majority
  - '5'
  - --dd-tol-frac
  - '0.35'
  - --n-floor
  - '39'
  - --out
  - '{out_dir}'
  timeout_minutes: 120
  inputs:
    research_unit: RQ-20261029-5121-01
    gate_flags_contract: PATHSTATE-TRAIL-GATE
lands:
