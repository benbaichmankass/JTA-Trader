id: RQ-20261029-5121-01
title: 'Q14 lever (VOLATILITY-EXPANSION-GATED PARTIAL BANK): on ada_pullback_2h, does banking 25% / 33% / 50% at +2.0 R ONLY
  when ATR has EXPANDED to >= 1.5 x its entry value beat the declared exit AND the ungated bank in 5 of 6 folds? (operator
  2026-10-29: ''very volatile ... a good time to bank some of that R'')'
status: queued
cadence: once
roadmap:
- L-ATM
- M20
- L-AM-STANDARD
theme: live_strategy
priority: 1
kind: experiment
question: 'RQ-20261022-b7e1-08 gated the bank on LOW path efficiency (er_6 < 0.30) and FAILED; its named variants are the
  rung (+1.5 / +3.0) and a dist_atr gate. No unit gates the bank on volatility EXPANSION, which is what the operator described
  on 2026-10-29 (open bybit_2 ADAUSDT short, ATR percentile 0.76, ''very volatile''). On ada_pullback_2h, do arms BX25 / BX33
  / BX50 (bank that fraction at +2.0 R only if atr_t / atr_entry >= 1.5 when the level is reached) beat A by >= 0.02 R/trade
  in >= 5 of 6 folds within the Path B drawdown bar AND beat the SAME bank taken ungated (UB25/UB33/UB50)? PRIOR, stated before
  the run: RQ-20261022-b7e1-06''s discovery read atr_ratio_t same-side in 6 of 6 folds (higher ATR-vs-entry -> LESS further
  giveback), so this form is expected to FAIL; it is run because the operator''s picture is the opposite and the cost is one
  cpu_light run.'
why_this_matters: Real-money leg (bybit_2 + mirror). The 2026-10-29 live-review pricing (ADA-AM-CASE) found no option beats
  hold at n>=floor; this settles the one operator-described trigger (vol expansion) no existing unit covers, so the answer
  to 'what is missing to make banking automatic' is a measured record, not an opinion.
power:
  expected_n: 402
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'Floor (1.96 + 0.8416)^2 / 0.45^2 = 38.76 -> 39 incumbent trades; incumbent n is MEASURED per leg in the sibling
    units (ada_pb 402, xrp_pb 394, eth_prop 1085). Trade sequences autocorrelate: the fold majority carries the rest.'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-ADA-AM-CASE-VOLEXP-BANK-01
  registered_at: '2026-10-22'
  registered_before_run: true
  statistic: 'From scripts/research/exit_lever_ablation.py --grade replace on ada_pullback_2h, window 2020-07-01 .. 2026-10-15
    23:59, 6 equal calendar folds by entry time, net of the full cost stack (resolve_cost_policy, recorded per arm). Per arm:
    n, net_total_r, max_drawdown_r, net R per fold. A = the leg as declared. Arms: BX25, BX33, BX50; controls: UB25, UB33,
    UB50. Gate flags are the build PATHSTATE-TRAIL-GATE contract (path-state features computed from bars <= t of the trade,
    in R/ATR units, by the SAME function the path_state_giveback.py study uses).'
  rule: 'INDETERMINATE IF n(A) < 39 or IF every candidate arm is byte-identical to A (the gate never fired). A candidate C
    PASSES iff net_r(C) > net_r(A) AND delta >= 0.02 R x n(A) AND folds_ge(A) >= 5 of 6 AND maxDD(C) <= maxDD(A) x 1.35 AND
    net_r(C) > net_r(UB25/UB33/UB50) (the UNCONDITIONAL control: the same action on every trade the gate would reach, so a
    PASS cannot be "any early action"). PASS IF one or more pass: ONE confirmation unit on a disjoint partition (a PASS on
    one window is a discovery), then Q6 parity and a Tier-3 declare proposal -- never a config edit. FAIL IF none passes:
    the vol-expansion-gated bank is closed on this leg (the discovery prior was against it); the open variants of the family
    stay those named in RQ-20261022-b7e1-08. Thresholds and the arm grid are not changed after any result.'
  what_it_does_not_do: 'Edits no config and places no order. A PASS needs a live producer that computes the path state bar
    by bar (position_path_history exists; the monitor does not read it for exits; src/runtime/trail_decay.py is the nearest
    live producer) and a Tier-3 declare with the mirror in the same PR. TP is untouched (every arm keeps the leg''s declared
    TP), so the TP doctrine''s zero-materiality compliance bar does not apply; each arm is graded on the normal Path B bar
    (0.02 R/trade materiality). PRIOR INFORMATION, disclosed: the fixed bank, level-triggered tightening and the 1R giveback
    stop all failed vs the declared exit on the Bybit money legs on 2026-10-22; the in-trade measurement (docs/research/exit-path-metrics-2026-10-22.md)
    screens a full exit at the first flagged state as LOSING vs the declared exit on every pullback/trend leg (so these arms
    tighten or partially bank, never exit outright, except the time-in-chop unit). No look at any arm here was taken before
    registration.'
practice_precedent: 'Volatility-conditioned profit-taking (partial exits on range expansion) is a standard discretionary-desk practice; the in-repo measurement that bears on it is RQ-20261022-b7e1-06 (atr_ratio_t read same-side in 6 of 6 folds: higher ATR-vs-entry -> LESS further giveback) and docs/research/exit-path-metrics-2026-10-22.md.'
compute: cpu_light
value:
  bucket: own_losses
  usd_at_stake_per_month: 500
  confidence: 0.1
  basis: 'stand-in: money/prop leg; the operator named giveback the standing priority; not a P&L measurement.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 30
  why_runner: Fetches keyless public candles (Binance Vision) for a pinned window; reads no trainer data.
  basis: One harness invocation per arm on freshly fetched public candles (74 s wall for 2 arms on xrp_pullback_2h MEASURED
    2026-10-16; the 5-leg path_state_giveback measurement run took ~15 min wall, 1h legs dominating).
