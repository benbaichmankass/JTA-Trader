# Hand-authored 2026-10-31 by RESEARCH-OPS-20261031-1120 (Tier 1). Harness-defect re-run of ea4a-01 (--days too short). Rule unchanged, registered before run.
id: RQ-20261031-c6fc-01
title: 'RE-RUN (window fix) of the CONFIRMATION (disjoint window) of the stop-out cooldown on trend_donchian_eth_prop: do CD4 / CD8 beat the declared leg
  net of cost over 2020-07-01..2023-05-31, a window RQ-20261030-41cc-24 did not see?'
status: queued
cadence: once
roadmap:
- L-PROP
- L-REGIME
theme: new_strategy_prop
priority: 3
kind: experiment
programme: P5
question: On trend_donchian_eth_prop over 2020-07-01..2023-05-31 23:00 (disjoint from 41cc-24's 2023-06-01..2026-10-15), do CD4 or CD8 beat the declared
  leg (A) by >= 0.02 R x n(A), in >= 4 of 6 folds, with maxDD <= 1.35 x A, net of the harness cost stack? Same statistic and bar as 41cc-24.
why_this_matters: 'RQ-20261030-ea4a-01 landed producer_failed: argv --days 1064 fetched candles from 2023-12 only, so the 2020-07-01..2023-05-31 window
  was empty (ValueError empty window). Same unit with --days 2330 (the span 41cc-05/-06 used for the same start). 41cc-24 PASSed both arms on the recent
  window (CD4 +14.43R, 6/6 folds; CD8 +16.01R, 5/6 folds), chosen from a 2-arm grid inside a 11-unit batch (41cc) that passed 7 and failed 4. A PASS on
  one window is a discovery, not a confirmation. This is the confirmation; PASS here is what a Tier-3 declare PROPOSAL (note on the owning row, never a
  config edit) may rest on.'
power:
  expected_n: 80
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'd=0.45 at alpha 0.05 / power 0.8 needs (1.96+0.8416)^2/0.45^2 = 38.8 -> 39 trades (the repo standing E35 floor). expected_n=80 is an ESTIMATE
    from sibling units on this leg family (a538-07..15), NOT a measurement; below 39 the unit grades INDETERMINATE, never FAIL. The 0.02 R x n bar is a
    materiality bar, not a powered effect: a PASS is a discovery lead and a FAIL closes the configuration only.'
  feasibility:
    source: none
    accrual_basis: Re-measurement on freshly fetched public candles over a pinned window; nothing accrues.
decision_rule:
  id: RULERQ20261031C6FC01
  registered_at: '2026-10-31'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg trend_donchian_eth_prop --grade replace, window 2020-07-01 .. 2023-05-31 23:00, 6 equal calendar
    folds by entry time, net of the full cost stack the harness resolves per venue (execution_costs.resolve_cost_policy, recorded per arm as cost_stack).
    Arms fixed now: A = the leg as declared in config/strategies.yaml; candidates CD4, CD8. Per arm: n, net_total_r, max_drawdown_r, net R per fold.'
  rule: 'INDETERMINATE IF n(A) < 39 or IF every candidate arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C) > net_r(A)
    AND delta >= 0.02 R x n(A) AND net R(C) >= net R(A) in >= 4 of 6 folds AND maxDD(C) <= maxDD(A) x 1.35. PASS IF one or more pass: CONFIRMED on a disjoint
    window; the follow-up is a live-producer check and a Tier-3 declare PROPOSAL with the mirror in the same PR (a note for the manager, never a config
    edit). FAIL IF none passes with n(A) >= 39: THIS arm grid is closed on trend_donchian_eth_prop for this window and the lever FAMILY is NOT retired (scripts/research/family_retirement_policy.yaml);
    the record names the arm that moved closest. Thresholds and the arm grid are not changed after any result.'
  what_it_does_not_do: 'Edits no config and no roster, places no order, is not a promotion case. A PASS also needs a live producer for the lever and a Tier-3
    declare. The arm grid is the whole search: no arm is added after the run, and the baseline is the declared leg, not a tuned one.'
intervention_controls:
  not_applicable: a parameter-width ablation of the declared entry/exit geometry run through the harness, not an in-trade action or active-management intervention
