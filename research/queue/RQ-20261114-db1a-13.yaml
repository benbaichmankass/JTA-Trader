question: With trend_donchian_eth_4h's entry TP at 4R (tp_r 4) instead of the 50R sentinel, is the leg's prop EV and survival non-inferior to config-exact on every firm ruleset that
  ROSTERS it per config/accounts.yaml (tradeify_247_1step on tradeify_1, velotrade_classic_1step on velotrade_1), on the prop record's own 3-year window, with fresh simulation seeds?
why_this_matters: 'Row RM-AM-ETH4H-ENTRYTP, manager 2026-11-14 14:05Z: RQ-20261114-db1a-08 PASSED the tp_r 4 doctrine-compliance non-inferiority on the real-money cost stack; ''a prop
  EV re-run (prop superset) before anything ships''. The leg is rostered on tradeify_1 and velotrade_1 (operator_exception baseline, 2026-11-05), and the prop superset rule (operator
  2026-10-15) means a change must not worsen its prop EV/survival. RE-REGISTRATION (manager 2026-11-14 15:49Z, ruling (c)): RQ-20261114-db1a-09 FAILED as registered (research-script-run
  43609534323) on breakout_2 alone (p_breach 0.5016 -> 0.5166; EV up on all three firms; tradeify_1 and velotrade_1 passed). breakout_2 was in its account list by a SCOPING ERROR: the
  lane copied the 2026-11-06 retest''s cell list, and config/accounts.yaml does not roster trend_donchian_eth_4h on breakout_2 (on ice). db1a-09 stays FAIL; it is not re-graded. This unit
  re-registers the question on the rostered firms with seeds 6..10, which db1a-09 did not use. DISCLOSED: the lane has seen db1a-09''s per-firm results (seeds 1..5) on these same two
  firms and the same trade ledgers; the fresh seeds re-sample the simulation only, so this adds Monte Carlo independence, not new trades.'
