decision_rule:
  id: RULE-ETH4H-TP4-PROPEV-NONINF-ROSTERED-20261114
  registered_at: '2026-11-14'
  registered_before_run: true
  statistic: 'exit_lever_ablation arms A (config-exact) and T4 (tp_r 4) on 2023-11-05..2026-11-05 20:00 write one trade ledger each; prop_ev_ab_grade.py scores both with prop_ev_sim
    path mode, seeds 6..10 x 1000 lives, accounts tradeify_1 and velotrade_1 only (--accounts), with the 2026-11-06 retest''s per-account cells (''cur'' cost arm: commission 11.0 / slippage 3.0 bps rt, swap 0.0003, sizing start, dd switch 0.8;
    breakout_2 risk 0.0035, tradeify_1 and velotrade_1 risk 0.005, lev cap 5). The grader reproduces the committed retest cell eth4h__3y__tradeify_1__cur__s1 exactly (ev 102.3, p_breach
    0.333; checked locally before registration).'
  rule: 'Multiple-testing guard: this is the SECOND prop EV read of this change; RQ-20261114-db1a-09 (seeds 1..5, three firms incl. the unrostered breakout_2) FAILED as registered and
    stays FAIL; both runs are disclosed in any proposal. Follows RQ-20261114-db1a-08 (PASS, compliance only; the 4R target never bound on the record year) and names RQ-20261028-a7c3-04 / RQ-20261104-c6f1-04.
    Rule as set by the manager (2026-11-14 14:38Z), with NO margin, fixed before any run. PER ACCOUNT: PASS iff mean over seeds of T4''s ev_net_usd_per_life >= A''s AND mean T4 p_breach
    (max-DD + daily-loss) <= A''s. Both arms use the same seeds; a T4 trade stream identical to A''s therefore grades equal and passes. UNIT PASS iff every account passes; FAIL iff any
    account fails; INDETERMINATE iff any cell is missing or either ledger has fewer than 60 rows. No threshold is relaxed.'
  what_it_does_not_do: Changes no config, roster, order, prop record or evidence record. A PASS completes the evidence for a Tier-3 doctrine-compliance proposal (tp_r 50.0 -> 4.0 + tp_intent
    mode r_multiple) that goes to the operator via the manager; it does not change the leg's prop admission (operator_exception) or its fail_edge grade.
  baseline: the leg config-exact (arm A) on the same window and the same sim cells, run in this unit.
