id: RQ-20261114-db1a-13
title: 'db1a-09b: PROP superset for the eth_4h tp_r 4 compliance change, RE-REGISTERED on the firms that roster the leg (tradeify_1 / velotrade_1), fresh seeds 6..10, strict NON-INFERIORITY; db1a-09 FAILED as registered after scoping in breakout_2 by mistake'
