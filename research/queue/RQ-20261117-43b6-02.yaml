# Hand-authored 2026-11-17 by lane RESEARCH-OPS-20261117-1006 (Tier 1, research-ops fork A), dispatched by the manager. ITERATION unit: authored from a written diagnosis of the subject's last result. Decision rule registered BEFORE any run. Gates this adds or changes: none.
id: RQ-20261117-43b6-02
title: 'ITERATION 2 of ltr-close (indeterminate): does a FULL close at the first near_target or stall trigger clear RULE-AM-RISK-ADJUSTED-V1 on four legs
  never in the ed2b selection population?'
status: done
cadence: once
theme: live_strategy
priority: 2
roadmap:
- L-ATM
programme: P1
kind: experiment
question: On four holdout testing-leg corpora (eth_pullback_2h, sol_pullback_2h, trend_donchian_avax_4h, trend_donchian_ada_4h), does closing the WHOLE
  position at the next bar's open after the first near_target or stall trigger cut book risk (maxDD or weekly CVaR5 >= 15%) at <= 0.05 R/trade net of the
  full cost stack, hold in >= 4 of 6 folds, and beat the same close at a random bar?
why_this_matters: 'ltr-close is an orphan (iteration_orphans.py 2026-11-17): its only positive signal is one live window (docs/audits/2026-11-01-from-scratch/AUDIT.md
  § 8, 18 priced packages), its iteration 1 (RQ-20261101-78fc-10) was retired, LTR-CLOSE-CLASS-TEST was dropped, and RQ-20261112-c1a5-01 waits for a live
  window (not_before 2026-12-01) and carries no iteration block. This is the in-hand test (RESEARCH-NO-WAIT). On PASS: a Tier-3 proposal note for the close
  class (advice-only -> its own net-of-cost pass, ARCHITECTURE-CANONICAL § Active management), then ONE confirmation. On FAIL: the close response at profit-side
  triggers is recorded and the next family is the timing lever (per-leg max-hold, which RQ-20261116-7c1a-01 already read FAIL at the package level, so the
  class moves toward retirement review only through family_retirement_policy). HOLDOUT POPULATION (RESEARCH-NO-WAIT order 2, a leg/symbol holdout, correlated
  evidence and said so): four testing legs whose corpora were never in the 8-leg selection population of RQ-20261113-ed2b-01/-03/-05 (ada_pullback_2h, iaum_pullback_1d,
  ml_entry, trend_donchian_eth_4h, trend_donchian_eth_prop, trend_donchian_sol_prop, trend_donchian_xrp_4h, xrp_pullback_2h). The run builds them with scripts/research/build_ltr_corpus.py
  --mode harness (exit_lever_ablation arm A, config-exact, closed bar, full cost stack) from committed candle CSVs and restricts the harness to them with
  --legs. CORRELATION DISCLOSED: ETH/SOL/ADA/AVAX trade in the same crypto regime as the selection legs, and trend_donchian_sol_4h is excluded because trend_donchian_sol_prop
  is in the selection population. eth/sol_pullback_2h trade the forming bar live; the corpus scores the CLOSED bar (stated bias).'
iteration:
  subject: ltr-close
  subject_kind: ltr_class
  from_result: research/results/RQ-20261113-ed2b-01/43492518743.jsonl
  verdict_read: indeterminate
  diagnosis: 'The live close class has one positive window and no grade (AUDIT.md § 8). LTR-TRIGGER-CLOSE-S0 (552 live packages): profit triggers beat a
    random close but never beat hold. The sharper evidence is RQ-20261113-ed2b-01 (partial_close at f = 0.5 on the 4,076-trade Stage-0 corpus): ltr_action_trigger_s0.price_partial
    is EXACTLY linear in f (net = f x banked + (1 - f) x recorded), so a full close is the f = 1 arm of the same pricer. At f = 0.5: near_target cost -0.0005
    R/trade (a small gain) with maxDD cut 8.3% / CVaR5 cut 6.2%, n_fired 388; stall cost 0.0119 R/trade with cuts 10.6% / 10.2%, n_fired 1,167; r_milestone
    cost 0.041 R/trade (doubling breaks R1, so excluded). At f = 1 the R cost doubles exactly (near_target ~-0.001, stall ~0.024, both inside R1) and the
    risk cuts roughly double (~16-21%), which is what R2 needs: the partial failed R2/R3 on SIZE, and the close is the size lever at its bound. Because
    the triggers were chosen from ed2b-01''s numbers on the 8-leg corpus, the read is on four legs that corpus never held.'
  search: action_bounds at its bound (close fraction 1.0) on the two triggers whose f = 0.5 R cost stays inside R1 when doubled (near_target, stall); arm
    denominator 2 (+ hold)
  levers:
  - action_bounds
  - trigger
  map_entries:
  - research/levers/ltr-close.yaml#levers.trigger.close_trigger
  - research/levers/ltr-partial-close.yaml
  attempt: 2
  due_by: '2026-11-24'
