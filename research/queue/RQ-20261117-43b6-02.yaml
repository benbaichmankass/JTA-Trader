    as recorded per row by the corpus harness)'
  source: comms/strategy_evidence/ltr_corpus/<leg>__trades.jsonl
power:
  expected_n: 1138
  min_detectable_effect: 0.06
  effect_units: metric
  sd: 0.5
  design: paired
  alpha: 0.01
  power: 0.8
  basis: 'MDE 0.06 R/trade declared (the holdout book is ~1,138 trades; at 0.05 the router floor is 1,168). INFERRED, not measured: about 1,138 trades on the four holdout corpora (dry-run counts 2026-11-17 from the committed candle CSVs: eth_pullback_2h
    454, sol_pullback_2h 147, trend_donchian_avax_4h 264, trend_donchian_ada_4h 273; the run''s own counts replace them). On ed2b-01 near_target fired on
    388 of 3,921 priced trades (~10%) and stall on 1,167 (~30%), so ~110 and ~340 fired trades are expected here; above V1''s n_floor 39. At sd 0.5 and
    alpha 0.01, ~110 fired trades detect ~0.14 R/trade and ~340 detect ~0.08 R/trade: the cost clause R1 is coarse for near_target, so an R1 read near the
    bar is reported as such.'
  feasibility:
    source: none
    accrual_basis: Replays committed corpora and committed candles; nothing accrues.
decision_rule:
  id: RULE-RQ-20261117-43b6-02
  registered_at: '2026-11-17'
  registered_before_run: true
  statistic: 'Over the four holdout corpora built in this run, per pre-registered trigger T in {near_target, stall}: the book that banks the WHOLE position
    at bar j0+1''s open after T first fires (ltr_action_trigger_s0 --action partial_close --partial-frac 1.0, i.e. a full close, cost charged at that bar),
    vs the HOLD book, against 200 matched random-time full closes on the same trades.'
  rule: 'RULE-AM-RISK-ADJUSTED-V1 (am_risk_adjusted.grade_risk_adjusted, V1 parameters: R1 r_cost <= 0.05 R per baseline trade; R2 maxDD cut >= 15% OR weekly-CVaR5
    cut >= 15%; R3 >= 4 of 6 calendar folds hold; n_floor 39) with R4 vs 200 matched random-time books (min_control_beat_frac 0.975), plus L1: a pass must
    keep r_cost <= 0.05 R/trade after dropping the leg with the largest favourable contribution. Reported, never graded: the B3 best static rule (hold +
    the registered trigger arms, chosen leave-one-fold-out) and each candidate''s margin over it. Two pre-registered candidates (n_comparisons 2, Bonferroni
    1 - 0.05/2), so R4 uses 0.975 and the reported edge CI is at 0.975. PASS: at least one trigger clears R1-R4 and L1. It is a SCREEN pass (per-trade R
    books, graduation_eligible false until BOOK-SIM-REAL-SIZER): a Tier-3 proposal input for the class''s status, never an apply. FAIL: every candidate
    fails a read necessary clause (R1, R2 or R3) or is beaten by its random control (R4). INDETERMINATE: anything else, i.e. the best candidate is under
    the n floor, never fired, carried by one leg (L1 fails), or no trade could be priced (read_state no_data). Fixed now; not changed after a run.'
  what_it_does_not_do: 'Advice-only research: serves, promotes or applies nothing; adds no gate; changes no config, mandate or roster; places no order.'
practice_precedent: 'T1 (docs/reference/trading-and-model-practice-principles.md): an intervention is graded against a matched random-intervention control
  in the same trade, net of the full cost stack, per class (RULE-AM-RISK-ADJUSTED-V1); same harness and design as RQ-20261113-ed2b-01/-03/-05.'
