  basis: 'ESTIMATE: n(QQQ)=73 on this exact window in the committed record; QQQM tracks the same index so a similar n is expected. Below 39 grades INDETERMINATE, never FAIL. d=0.45 at alpha 0.05 / power
    0.8 needs 39 trades (E35 floor).'
  design: one_sample
  effect_units: sd
  expected_n: 73
  feasibility:
