decision_rule:
  id: RULERQ20261124bd3001
  registered_at: '2026-11-24'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg qqq_pullback_1h --symbol QQQM --grade stage0 (single arm A = the leg as declared, symbol replaced), window 2025-06-02 .. 2026-11-11, 4 folds,
    net of the full cost stack the harness resolves per venue (recorded per arm as cost_stack). Per arm: n, net_total_r, max_drawdown_r, net R per fold.'
  rule: 'PASS iff net R(A) > 0 AND n(A) >= 39 AND >= 3 of 4 calendar folds net-positive, net of the full cost stack. FAIL iff n(A) >= 39 and that does not hold: the proxy is not cleared and the leg stays
