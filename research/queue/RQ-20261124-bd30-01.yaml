  4 calendar folds net-positive and n >= 39?
why_this_matters: 'Real-money route for qqq_pullback_1h is blocked on the proxy having its own Stage-0 record (operator 2026-11-24). A proxy run on a window shorter than the Dukascopy QQQ one is the best
  available in-hand series (QQQM has no Dukascopy instrument: scripts/ops/dukascopy_instruments.py maps no QQQM, so Yahoo is the only 1h source, ~730 days). HONEST LIMITS: this is a sign test on one ~17-month
  window, the same window the QQQ record was measured on; the proxy-vs-underlying comparison is reported (n and net R of this arm vs the record''s 73 / +5.49 R), but QQQM spread and fill quality are not
  visible in candles and are measured only by the paper soak. A PASS is a Stage-0 lead for the proxy, not a promotion.'
