title: 'REGIME-PROGRAM entry filter: does SKIPPING each rostered-leg trade whose walk-forward LightGBM prediction (f1a0-26 frozen recipe: own-symbol + BTC daily state)
  falls below the training 1/3 quantile beat taking every trade by +0.01 R per available trade, and beat random skips of the same count within leg-month, net of the
  full cost stack?'
