  from_result: RQ-20261125-f1a0-32/45550595880
  verdict_read: indeterminate
  diagnosis: 'Per-trade SIZING tilts on the rostered crypto legs are exhausted: book (f1a0-19..24), cell (f1a0-25), daily learned (f1a0-26/28/30) and intraday (f1a0-32,
    +0.0046 t 0.48 share 0.31). The daily learned model ranked trades better than chance on 2 of 3 populations (perm share 0.005 / 0.000) but a symmetric 2.0/0.5
    tilt with renormalisation pays for its up-weights with its down-weights, so only the spread between terciles counts. An entry filter keeps the downside half of
    that ranking only: if the bottom tercile is net negative after costs, skipping it adds R (and saves its cost) without having to be right about the top. The registered
    fail_action of f1a0-32 names this form.'
  search: 'one fixed definition: the f1a0-26 frozen recipe (MS_FEATS, MS_LGB, huber, clip 3R, yearly walk-forward from RR.TEST_START), skip iff the prediction is
    below the 1/3 quantile of that year''s TRAINING predictions, every other trade at size 1; no renormalisation, no grid, no threshold search.'
  levers:
  - regime
  - entry
  map_entries:
  - research/levers/ml-entry.yaml
  attempt: 13
  due_by: '2026-12-01'
question: Does skipping each rostered crypto-leg trade whose walk-forward LightGBM prediction (f1a0-26 frozen recipe) is below that year's training 1/3 quantile,
  taking every other trade at equal risk, add >= +0.01 R per available trade over taking all of them (t >= 2, >= 4 of 5 test years positive) and beat 200 random skips
  of the same count within each leg x month (share <= 0.05), net of the full cost stack?
why_this_matters: It is the last registered regime form on the rostered crypto legs before the lever closes for these families. A pass is an input to a Tier-3 per-family
  entry-filter proposal (strategy logic; operator decides), after a fresh-population confirmation on the two disjoint symbol sets.
