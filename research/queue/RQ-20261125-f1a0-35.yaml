decision_rule:
  id: RULE-REGIME-ENTRY-FILTER-20261125
  registered_at: '2026-11-25'
  registered_before_run: true
  baseline: take every replayed trade at equal risk (the same trades); 200 random skips of the same count within each leg x month
  statistic: 'scripts/research/rostered_leg_replay.py --mode filter (metastate_frame, metastate_raw kind=filter, grade_raw normalise=False, grade_filter): delta =
    -(sum of skipped net R) / all test trades (a skipped trade contributes 0 R); se from 1,000 entry-week bootstrap draws; permutation share = share of 200 within
    leg x month permutations of the 0/1 keep flags (same skip count per leg-month) with delta >= the arm; yearly delta; skipped share and mean net R of skipped vs
    kept; per-family delta and skip share reported.'
  rule: PASS iff delta >= +0.01 R per available trade AND t >= 2 AND permutation share <= 0.05 AND >= 4 of 5 test years > 0; FAIL iff delta <= 0 or share >= 0.5;
    else INDETERMINATE. Fixed now (RULE_MS thresholds).
  pass_action: 'Fresh-POPULATION confirmation first (the frozen recipe on --population fresh and fresh2, the disjoint symbol sets), and the regime-selectivity walk-forward-before-Tier-3
    rule; then a Tier-3 per-family entry-filter PROPOSAL to the manager with this evidence record. A filter is strategy logic: the operator decides; no lane applies
    it.'
  fail_action: Record the regime lever CLOSED for the rostered crypto families (sizing and entry-filter forms, with the f1a0-19..35 trail); REGIME-PROGRAM moves to
    equities/futures legs or to regime as a model INPUT (ml_entry F8 cross-asset family), authored from this result.
  proposal_mapping: pass -> fresh-population confirmation -> Tier-3 entry-filter proposal; fail or indeterminate -> the next regime form from this diagnosis.
  what_it_does_not_do: Changes no config, sizing, filter or order path; adds no gate. Re-runs the evidence builder's harness path read-only (writes only under --out).
