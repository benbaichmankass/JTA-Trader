decision_rule:
  id: RULE-DFI-TD1H-TF-20261113
  registered_at: '2026-11-13'
  registered_before_run: true
  statistic: exit_lever_ablation --grade stage0 --forming-1m-fetch per timeframe (config-exact arm; --timeframe overrides only the bar); timeframe_lever_grade.py
    over the three. Candles are fetched at the native 1h bar and resampled up; the 1m forming replay drives every timeframe.
  rule: Registered 2026-11-13 on row DEMO-FLOOR-ITER-20261113 before any run of this arm set (no arm was run on this window before registration, except a tooling
    smoke on 2026-09-01..11-01 -- 1h n30 -3.63R, 2h n16 -2.68R, both forming -- that checked the native-bar fetch + forming argv and does not alter the rule). Each
    arm runs as its OWN Stage-0 run through exit_lever_ablation --grade stage0 on the same pinned window, feed and full cost stack (fee + slippage + funding from
    resolve_run_costs); timeframe_lever_grade.py grades them together. PASS iff some candidate passes its own Stage 0 (net_r > 0, n >= 30, >= 3/4 folds positive)
    AND its net_r exceeds the baseline arm's net_r. FAIL iff every candidate is graded (n >= 30) and none passes both. INDETERMINATE otherwise (a run wrote no verdict,
    the baseline did not run, a candidate under its n floor). Arms, window, folds and floors are fixed now.
  what_it_does_not_do: Changes no config, roster, order or evidence record. A PASS is a data-backed Tier-3 proposal routed to the manager via AM-ML (the leg stays
    on the demo floor until then); a FAIL is recorded on the lever map and the next untested family is picked.
  baseline: trend_donchian_1h at 1h, forming, re-run in this unit on the same corpus (f251-01 read -10.57R over n 184).
