levers:
- name: label_population
  values:
  - all 707 (089f-01, FAIL)
  - package risk_atr >= 1.0 only (this unit)
  hypothesised_effect: 'the anti-signal shrinks toward 0 (tier-A REPORT: on 469 risk_atr >= 1 packages grade_score rho +0.067 [-0.024, +0.157]); ML-PRIMARY-5''s
    orientation audit (net USD / notional, rho -0.150, negative in both sides) predicts it SURVIVES. Prior: FAIL or INDETERMINATE, not PASS.'
question: 'Same 707 blind grades, same journal join, same pooling, CIs, thresholds and decision rule as RQ-20261116-089f-01, with ONE population change
  declared before the run: exclude every trade whose package stop distance is under 1.0 ATR, risk_atr = |order_packages.entry - order_packages.sl| /
  signal_logic.atr (exactly the bracket.risk_atr that scripts/ops/blind_grade.py puts in the packet the grader saw). Does the blind grade_score
  rank-predict net R, and beat confidence, on the remaining trades?'
why_this_matters: 'The operator keeps the weekly blind-grade backfill PAUSED, not retired, until an alternative label is in place (2026-11-16, "Paused nit
  retired, until there''s a replacement"). 089f-01 FAILED (rho -0.183, n 707), but the tier-A diagnostic found 148 of 617 packages with a stop under 1 ATR
  whose net R sits on a tiny risk basis (win rate 0.858, mean +35.9 R), consistent with the package SL not being the initial stop. If the FAIL is that
  artifact, the blind source is not yet disproven; if it survives, the alternative must be outcome-based or a re-designed rubric.'
