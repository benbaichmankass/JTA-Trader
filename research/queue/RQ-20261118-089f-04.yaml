decision_rule:
  id: RULE-RQ20261118-089f-04-BLIND-VALIDATION-RISKATR1
  registered_at: '2026-11-18'
  registered_before_run: true
  baseline: Strategy confidence on the SAME trades (as 089f-01).
  statistic: As RULE-RQ20261116-089f-01-BLIND-VALIDATION, on the population with package risk_atr >= 1.0 (trades with no computable risk_atr excluded and
    counted as risk_atr_unknown; trades under 1.0 counted as risk_atr_below_min).
  rule: 'UNCHANGED from 089f-01: PASS iff n distinct trades >= 150 AND rho(grade_score, net R) > 0 with the lower bound of the WIDER of the analytic and
    cluster-bootstrap 95% CIs > 0 AND the paired difference rho_judgment - rho_confidence has a lower 95% bound > 0. FAIL iff n >= 150 AND (rho <= 0 OR
    the upper 95% bound of rho < 0.05 OR the paired difference point estimate <= 0). INDETERMINATE otherwise. Thresholds not changed after any result.
    Because the 1.0 ATR split was chosen after seeing the tier-A artifact, a PASS is EXPLORATORY and qualifies nothing on its own.'
  pass_action: 'Do NOT write qualified.json. Author a confirmation unit on blind grades of trades closed after 2026-11-18 (a population this read never
    saw) with the same filter fixed, and bring the manager the result as the first CJ-LABEL-ALTERNATIVE candidate.'
  fail_action: 'The anti-signal is not the risk_atr<1 artifact: the blind grade is not a usable teacher label as designed. CJ-LABEL-ALTERNATIVE moves to an
    OUTCOME-BASED alternative (the label is the realised net R itself on a corrected risk basis, PI-20261117-ZZUFKM1F-0001) or a re-designed rubric; the
    weekly backfill stays paused per the operator until one passes.'
  what_it_does_not_do: Trains no model, changes no config and no served artifact; writes no qualified.json under any verdict.
  min_n: 150 distinct closed trades after the journal join and the risk_atr filter
