id: RQ-20261122-fa22-06
title: 'D5 position aggregation: is the a474-02 FAIL (rule arms A1-A3 vs today''s rule A0) robust to the cross-fit split? Same five pairs and streams, windows re-cut
  at 2025-07-01'
status: done
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: deterministic
why_not_inferential: 'A fixed replay, not a sample: every arm re-weights the SAME fully replayed solo streams over two fixed windows, so a re-run returns the same
  numbers. The chance element is handled inside the rule by A4 (matched random exposure, 1000 seeded draws, the arm must beat its 95th percentile) and by requiring
  the SAME arm to clear the bar in both windows.'
question: 'RQ-20261114-82fd-02 PASSED: 27-54 percent of Stage-0 trades on every declared real-money pair open while another leg is open. Replaying those solo streams
  (rule legs: backtest_system solo arms at the full cost stack; ml_entry: its served-policy replay at the fixed 2/3 ATR bracket) through one risk budget per pair
  (1.0 = one trade of risk), compare A0 = today''s rule per the accounts'' position_model (slices on bybit_2/bybit_portfolio, one-package election on tradeify_1/velotrade_1)
  with A1 1/N netting, A2 best-single (cross-fit on the other window), A3 static forecast combination (weights from the other window''s mean net R), and A4 matched
  random exposure.'
why_this_matters: 'D5 (position aggregator) is a named block with no runnable unit. The window-parameterised driver (this lane) lets the one open question on the
  rule-arm fail be asked: does it hold on a different split of the same streams? It costs a runner and decides whether "rule-exhausted" is a robust label or a split
  artefact.'
