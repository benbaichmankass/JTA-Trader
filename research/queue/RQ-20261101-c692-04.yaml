id: RQ-20261101-c692-04
title: 'TRAINING UNIVERSE for the ENTRY decision model: trained on (a) the traded bybit_2 symbols only, (b) the frozen 60-perp universe, (c) every
  qualifying Binance USDT-M perp, does each arm reach held-out mean net R per decision >= 0 on the TRADED symbols, and which arm is best?'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: experiment
practice_precedent: 'T1, M6 (docs/reference/trading-and-model-practice-principles.md): purged + embargoed walk-forward with a sealed held-out
  window; triple-barrier first-passage labels (Lopez de Prado 2018, ch. 3); docs/research/ml-decision-models-2026-11-01/DESIGN.md.'
question: 'Operator 2026-11-01 ~07:50Z: train on more than what we trade if it improves decisions on what we trade. Same recipe as RQ-20261101-c692-01
  (features, 2/3 ATR reference bracket, 24h horizon, LightGBM params, tau rule on dev folds, purge + embargo, sealed held-out 2025-10-01..2026-09-30,
  full cost stack). Only the TRAINING rows change by arm; dev folds and held-out are scored on the traded symbols (bybit_2 data-pull list re-parsed
  from config/accounts.yaml at run time). Cross-sectional features use the frozen-60 reference set in every arm. Spec DESIGN.md section 1a.'
why_this_matters: 'Operator directive 2026-11-01 (row ML-DECISION-MODELS): ML decision makers live on real money as soon as possible; live bar
  "Point estimate >= 0", path "Straight to real money" (bybit_2 + mirror). This is the critical path: BRACKETS (c692-02) and MANAGE (c692-03)
  compose on top of it.'
power:
  expected_n: 600
  min_detectable_effect: 0.12
  effect_units: metric
  sd: 1.0
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'INFERRED: 5 traded symbols x 365 days, ~1-day holds, ~15 percent take rate gives ~300-600 decisions; sd ~1 R gives SE ~0.04-0.06. The
    operator bar is a point estimate.'
  feasibility:
    source: none
    accrual_basis: Replays public history; nothing accrues. The run records the observed n and sd.
decision_rule:
  id: RULE-RQ20261101-c692-04-TRAIN-UNIVERSE
  registered_at: '2026-11-01'
  registered_before_run: true
  statistic: 'Per arm (a, b, c): held-out mean net R per taken decision on the traded symbols, n, distinct symbols; tau chosen per arm on its
    own dev folds (traded-symbol dev rows); reported: the paired difference c-a and b-a on the held-out, bootstrap CI (reported only).'
  rule: 'Per arm: INDETERMINATE IF held-out n < 300 on the traded symbols or no tau reaches dev n >= 1000; PASS IF held-out mean net R per decision
    >= 0; FAIL otherwise. The unit verdict is PASS if any arm passes (records fan out one row per arm). The arm adopted for the next ENTRY build
    is the passing arm with the highest held-out mean; if none passes, the arm with the highest dev pooled mean is named for the next lever unit
    (dev only, never the held-out). Thresholds are not changed after any result.'
  what_it_does_not_do: No sizing, no config change, no order. Other asset classes (arm d) are not in any 1h store; filed as ML-DATA-XASSET-1H,
    not run here.
  min_n: 300 held-out decisions on the traded symbols
