id: RQ-20261022-eba2-09
title: 'Q10 variant (first test failed -> variant): does a SWING-level trail with a WIDER tight mult (4.0 / 4.5 x ATR of the
  declared 6.0) or a longer FVG lookback (120) replace the declared exit of xrp_pullback_2h on net R in 5 of 6 folds over
  2020-07..2026-10?'
status: queued
cadence: once
roadmap:
- L-ATM
- M20
theme: live_strategy
priority: 1
kind: experiment
question: 'RQ-20261022-004 tightened to HALF the trail (3.0) and failed (swing -13.8 R, fvg -5.7, round -28.7 vs A 29.65 R,
  n 394). DIAGNOSIS of the first test (RQ-20261022-001..006, MEASURED from the arms'' level diagnostics): (i) ROUND levels
  exist on 100% of trades and are touched on 60-75% of them, so the ''trigger'' fires on most trades and the arm is an unconditional
  tight trail (worst arm on every leg, -28 R on xrp_pb and sol_prop) -- a trigger-definition failure, not evidence about levels;
  (ii) FVG levels exist on only 4-36% of trades (4 of 68 on xrp_4h, 61 of 409 on sol_prop), so the arm barely acts (identical
  to A on xrp_4h); (iii) SWING was the only kind with a selective trigger and the only arm near the incumbent (eth_prop +2.2
  R at maxDD 16.5 vs 22.0; xrp_pb -13.8 R); (iv) the tight mult was fixed at HALF the declared trail, which latches on a first
  touch and gives away trend continuation -- a wider tight mult was never tried; (v) a tight exit frees the leg to re-enter
  (n rose 4-15% on arms), so total-R deltas are not per-trade deltas. Osler (2000, FRBNY EPR 6(2)) finds published levels
  predict intraday INTERRUPTIONS (bounces) with power varying by series and firm -- a short-horizon effect, while these legs
  hold 12-48 h. Over 2020-07-01 .. 2026-10-15 23:59, replace grade, 6 calendar folds, do arms S40 (swing, tight 4.0), S45
  (swing, tight 4.5) or F40 (fvg with lookback 120, tight 4.0) beat the declared exit by >= 0.02 R/trade in >= 5 of 6 folds
  within the Path B drawdown bar?'
why_this_matters: 'Operator directive 2026-10-22: a first-test fail is not a dead idea. The first test''s failure has specific,
  testable causes (tight mult, FVG coverage) that this unit changes one at a time; ROUND is dropped (unconditional by construction).
  SOURCES (practitioner/secondary unless stated; none is a validated result): Osler, ''Support for Resistance'', FRBNY Economic
  Policy Review 6(2), 2000 (newyorkfed.org/medialibrary/media/research/epr/00v06n2/0007osle.pdf) [primary]; NexusFi MFE scale-out
  guide; MQL5 article 24466 (R-multiple MFE percentile scale-out); LuxAlgo library ''Scaling Out'' and ''MAE/MFE Distributions'';
  TradingView ATR Chandelier and ADX exhaustion scripts; LuxAlgo/StrategyQuant on Kaufman''s efficiency ratio.'
power:
  expected_n: 394
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'Floor (1.96 + 0.8416)^2 / 0.45^2 = 38.76 -> 39 incumbent trades; the incumbent read n 394 on this window (MEASURED,
    a sibling unit). Trade sequences autocorrelate: the fold majority carries the rest.'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-P1-Q10V-XRPPB-WIDE-LEVEL
  registered_at: '2026-10-22'
  registered_before_run: true
  statistic: 'From scripts/research/exit_lever_ablation.py --grade replace on xrp_pullback_2h, window 2020-07-01 .. 2026-10-15
    23:59 (6 equal calendar folds; a trade is binned by entry time), net of the full cost stack the harness resolves per venue
    (execution_costs.resolve_cost_policy, recorded per arm as cost_stack). Per arm: n, net_total_r (full-position R), max_drawdown_r,
    net R per fold. A = the leg as declared in config/strategies.yaml. Per candidate C: delta = net_r(C) - net_r(A); folds_ge
    = folds with net_r(C) >= net_r(A); maxDD(C) vs maxDD(A).'
  rule: 'INDETERMINATE IF n(A) < 39, or IF every C arm is byte-identical to A (the lever never fired). A candidate C PASSES
    iff net_r(C) > net_r(A) AND delta >= 0.02 R x n(A) AND folds_ge >= 5 of 6 AND maxDD(C) <= maxDD(A) x 1.35. PASS IF one
    or more pass: the best by net R is named and the follow-up is ONE confirmation unit on a disjoint partition (a PASS on
    one window is a discovery), never a config edit. FAIL IF none passes: the declared exit stands for THESE arms on this
    leg; the idea is not retired (a family is not retired on one config) and the diagnosis in the unit decides the next variant.  Thresholds
    are not changed after any result.'
  what_it_does_not_do: Edits no config and places no order; a PASS needs a Tier-3 declare (and a live producer where the lever
    has none). Three arms on one leg are a multiple comparison that the fold majority and the materiality bar guard. No look
    at any of these arms was taken before registration.
