decision_rule:
  id: RULERQ20261031d5dd03
  registered_at: '2026-10-31'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg splg_trend_long_1d --grade sweep, up to 7300 days ending 2026-10-27 (what the keyless daily
    lane serves; the realised window is recorded), 4 default calendar folds, net of the full cost stack the harness resolves for the venue (recorded per
    arm as cost_stack). Arms fixed now: B = the leg as declared; candidates AX30, AX40. Per arm: n, net_total_r, max_drawdown_r, net R per fold.'
  rule: 'INDETERMINATE IF n(B) < 39 (underpowered: no verdict; never FAIL on thin n) or IF every candidate arm is byte-identical to B (the lever never fired).
    A candidate C PASSES iff dR(C vs B) >= 1.0 R AND dDD <= 0 AND fold_wins >= 3 of 4. PASS IF any candidate passes (best = highest dR): a LEAD, followed
    by ONE confirmation unit on a disjoint window with the same statistic and bar; only a confirmed pass becomes a Tier-3 PROPOSAL note on the owning checklist
    row for the manager, never a config edit. FAIL IF none passes with n(B) >= 39: this configuration is closed on this window and the record names the
    arm that moved closest (the lever family stays open; a family retirement needs a review record per family_retirement_policy.yaml). The bar, the drawdown
    clause, the fold majority, the 39 floor and the arm values are not changed after any result.'
  what_it_does_not_do: 'Edits no config and no roster, places no order, is not a promotion case. A PASS also needs a live producer for the lever and a Tier-3
    declare. The arm grid is the whole search: no arm is added after the run, and the baseline is the declared leg, not a tuned one.'
