id: RQ-20261024-4ef5-02
title: 'Base trail width on ada_pullback_2h: does a narrower UN-ARMED chandelier (2.5/3.0/3.5/4.0 x ATR vs the declared 5.0) replace the declared exit?'
status: done
cadence: once
roadmap:
- L-ATM
- M20
theme: live_strategy
priority: 2
kind: experiment
question: 'On ada_pullback_2h (declared tp_r 4, stop 1.5 x ATR), does a narrower base trail_mult (2.5, 3.0, 3.5, 4.0 x ATR, active from the first bar, no
  arm) replace the declared 5.0 on net R in 5 of 6 calendar folds over 2020-07..2026-10, at the venue cost stack? Every exit unit on this leg so far added
  an ARMED or GATED lever on top of 5.0; RQ-20261007-022 (M8 tune) swept atr_stop_mult and pullback_frac only and pinned trail_mult 5.0. At 5.0 the trail
  sits 3.33 R behind the extreme (5.0/1.5), wider than the 4 R target can ever pay for (MEASURED: 21 of 402 exits are trail_stop, 127 take_profit, 253 stop).'
why_this_matters: 'Operator 2026-10-24 ~15:25Z on the live bybit_2 ADAUSDT short (trade 6726, +3.4 R open, SL locking +0.18 R): "secure most of the gains".
  Lane ADA-LIVE-EXIT-REVIEW-1024, row ADA-LIVE-EXIT-REVIEW-1024; evidence docs/research/ada-live-exit-review-2026-10-24.md. STRUCTURAL FINDING: trail 5.0
  x ATR against a 1.5 x ATR initial stop puts the trail 3.33 R behind the extreme, so before the 4 R target it can lock at most +0.67 R; MEASURED 21 of
  402 baseline exits are trail_stop. Looked before authoring: the queue was grepped for ada_pullback_2h exit units (about 30, incl. eba2-03/05/12, fd06-01,
  a1f3-07, b7e1-*, f08c-01/02/07/19, 9a7e-01, RQ-20261018-009/015/016, RQ-20261007-022); none asks this arm set.'
power:
  expected_n: 402
  min_detectable_effect: 0.14
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'n = 402 is the MEASURED baseline trade count of ada_pullback_2h in the parent verdict(s). Unpaired one-sample MDE = 2.8/sqrt(n) = 0.14 sd. Arms
    share most trades, so the paired difference is far tighter than that (MEASURED in the diag doc: paired sd 0.06-0.5 R per entry); the unit''s bar is
    stated in R and is not claimed to be detectable at the unpaired MDE. A unit whose lever touches a handful of trades is reported with its differing-trade
    count.'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-202610244ef502
  registered_at: '2026-10-24'
  registered_before_run: true
  statistic: scripts/research/exit_lever_ablation.py --grade replace on ada_pullback_2h, window 2020-07-01 .. 2026-10-15 23:59, 6 calendar folds, net_r
    per arm net of the harness venue-aware stack (fee 7.5 bps round trip, slippage 3.0 bps round trip, funding 1.0 bps per 8h window; MEASURED in the parent
    verdicts' cost_stack); baseline A = the leg as declared.
  rule: 'INDETERMINATE IF n(A) < 39, or IF every C arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C) > net_r(A) AND
    delta >= 0.02 R x n(A) AND folds_ge >= 5 of 6 AND maxDD(C) <= maxDD(A) x 1.35. PASS IF one or more pass: the best by net R is named and the follow-up
    is ONE confirmation unit on a disjoint partition, never a config edit; before any Tier-3 proposal the winner is re-run with stop fills gap-adjusted.
    FAIL IF none passes: the declared exit stands for THESE arms on this leg; the idea is not retired (operator rule 2026-10-22). With a 1.5 x ATR initial
    stop, a k x ATR trail first moves the stop once the trade is (k - 1.5)/1.5 R up (T25 0.67 R, T30 1.0 R, T35 1.33 R, T40 1.67 R), so it also reshapes
    trades that later lose; the record reports exit_reason counts per arm. Thresholds are not changed after any result.'
what_it_does_not_do: 'Edits no config and places no order. Not a promotion case: a PASS is a discovery needing one disjoint-window confirmation. HARNESS
  CAVEAT (same as f08c-01): a stop the bar trades through fills AT the stop price, which flatters every arm in proportion to its stop exits, so it favours
  tighter arms; a PASS must be re-run gap-adjusted before any Tier-3 note.'
