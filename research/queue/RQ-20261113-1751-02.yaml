id: RQ-20261113-1751-02
title: 'FILTER LEVER on qqq_pullback_1h: does an ADX floor (adx-min 20 / 25) on the long-only arm stabilise the net edge, holdout-selected, net of the full cost stack (iteration 3 from RQ-20261112-c1b4-01
  FAIL)'
