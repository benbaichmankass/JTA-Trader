question: 'qqq_pullback_1h: S1 (long-only) passed its holdout read (RQ-20261111-203c-03, +11.56 R, n 38) but its pre-development confirmation (RQ-20261112-c1b4-01) was net +11.32 R with only 1 of 2 folds
  positive. The map shows by_year 2025 net -2.03 (n 20) vs 2026 +10.07 (n 36): a window-concentrated edge. Does one added filter value, S1 + adx-min 20 or 25, keep a discovery-eligible net edge that survives
  a held-back span, read once?'
why_this_matters: 'ITERATION 3 of qqq_pullback_1h (research-ops 2026-11-13 0850Z), an ORPHAN. c1b4-01 FAIL = fold instability on a net-positive result (net +11.32 R, n not binding), so the diagnosis is
  regime/window concentration, not absent edge; the filter family (adx_min) is untested for this leg (research/levers/qqq_pullback_1h.yaml: only direction and be_floor tested). DENOMINATOR: 4 arms (A, S1,
  F1, F2) on discovery, one selected, read once on the held-back span. DISCLOSURE: A and S1 were read on this same 2020-07..2026-10 window by RQ-20261111-203c-03, so the holdout boundary here is the same
  25% span: it is correlated evidence for A and S1, virgin only for the F arms. Fold stability across the ADX values is read as the lever response shape.'
power:
  expected_n: 38
  min_detectable_effect: 0.57
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: expected_n = the held-back S1 n from RQ-20261111-203c-03 (38); a filtered arm holds fewer, and n < 25 held-back grades INDETERMINATE/underpowered, never FAIL (an ESTIMATE).
