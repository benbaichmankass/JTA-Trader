  needs_gpu: false
  peak_memory_gb: 6.0
  est_minutes: 90
  basis: 'MEASURED on the lane container (4 cores): the era build took about 25 min for 9,111 packets; the ridge walk-forward on 1.09M actions a few minutes; candle fetch about 15 min.'
run:
  command:
  - python3
  - scripts/research/desk_edge_levers.py
  - fade
  - --ceiling
  - /tmp/desk_edge_era
  - --candles
  - /tmp/desk_edge_era_candles
  - --funding
  - /tmp/desk_edge_era_funding
  - --fetch
  - --out
  - '{out_dir}'
  inputs:
    research_unit: RQ-20261027-fe57-03
  timeout_minutes: 180
lands:
