id: RQ-20261024-9a7e-01
title: 'EXIT-GIVEBACK-PREDICTOR-GATE: on ada_pullback_2h, does tightening the trail ONLY on trades a vol-controlled giveback
  predictor flags (P>=0.6 at bar 6) beat the declared exit, the same tightening on every trade, AND the same tightening on
  a matched-rate random draw, net R in 5 of 6 folds?'
status: done
cadence: once
roadmap:
- L-ATM
theme: live_strategy
priority: 1
kind: experiment
question: 'The predictor of eba2-01/-04 has log-loss skill only (pooled ll_gain 0.0115 / 0.0145 on a 0.69 coin-flip base;
  OOS R2 gain ~0) and eba2-07/-08 (gate at P>=0.5, no vol control) FAILED on ada/xrp pullback 2h with the gate flagging about
  half the trades. Here the trigger is built with vol_ratio_k in the BASELINE (so it is the path metrics beyond realised volatility),
  is SELECTIVE (P>=0.6), and every candidate is also graded against a matched-rate RANDOM flag draw. Over 2020-07-01 .. 2026-10-15
  23:59 on ada_pullback_2h (replace grade, 6 calendar folds by entry time), out-of-fold triggers only (a trade''s flag never
  sees its own fold): does MT (flagged trades tighten the trail to 2.5 x ATR) beat A by >= 0.02 R/trade, beat UT (every trade
  open at bar 6) and RT (random flags, same count) on net R and in >= 5 of 6 folds, within the Path B drawdown bar?'
why_this_matters: 'Operator row EXIT-GIVEBACK-PREDICTOR-GATE: can the giveback predictor be a GATE for the exit levers. A
  tightening lever that fails ungated (the tight trail loses R on every leg tested) can only pay if the predictor selects
  trades better than chance. RT is the null: a gate that does not beat RT is not selecting, it is tightening a random half.
  The harness fills a stop AT the stop price, which flatters a tightened trade; MT and RT tighten the same NUMBER of trades,
  so MT - RT cancels the fill artifact where MT - A does not.'
power:
  expected_n: 402
  min_detectable_effect: 0.14
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'Floor 39 incumbent trades; expected n(A)=402 (MEASURED in the baseline arm of the parent result for this leg). MDE
    = 2.8/sqrt(n) = 0.14 sd for an unpaired one-sample test. The registered 0.02 R/trade bar is BELOW what one leg''s n can
    resolve (diagnosis doc, exit-failed-levers-diag-2026-10-24, finding 1): the 5-of-6-fold gate and the two control contrasts
    carry the verdict, and a PASS is a lead for ONE confirmation unit, never a promotion.'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-9A7E-01-ADA-PULLBACK-2H
  registered_at: '2026-10-24'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --grade replace on ada_pullback_2h with arms A (declared exit), MT (tight
    2.5 x ATR on trades flagged by the out-of-fold trigger), UT (tight 2.5 x ATR on every trade open at bar 6) and RT (tight
    2.5 x ATR on a seeded matched-rate random flag draw). Trigger: path_metric_giveback.oof_triggers, FULL model (vol_ratio_k
    in the baseline) fit on the OTHER calendar folds only, k=6, big-quantile 0.5, flag when P(big giveback) >= 0.6. Window
    2020-07-01 .. 2026-10-15 23:59, 6 calendar folds, net of the full cost stack (resolve_cost_policy, recorded per arm).
    Per arm: n, net_total_r, max_drawdown_r, net R per fold, trail_stop exit count.'
  rule: 'INDETERMINATE IF n(A) < 39 or MT is byte-identical to A (no flag fired). MT PASSES iff net_r(MT) > net_r(A) AND delta
    vs A >= 0.02 R x n(A) AND folds_ge(A) >= 5 of 6 AND maxDD(MT) <= maxDD(A) x 1.35 AND net_r(MT) > net_r(UT) with folds_ge(UT)
    >= 5 of 6 AND net_r(MT) > net_r(RT) with folds_ge(RT) >= 5 of 6 (the harness enforces all of it via --vs-control). PASS:
    the predictor gate selects better than chance on this leg: ONE confirmation unit on a disjoint partition (a PASS on one
    window is a discovery), a gap-adjusted re-run (stop fills charged a gap, the harness fills at the stop price), then Q6
    parity and a Tier-3 declare proposal -- never a config edit. FAIL: the gate does not pay on this leg and the declared
    exit stands; if MT beat A but not RT, the report says ''selection indistinguishable from chance''. Thresholds (P 0.6,
    bar 6, 2.5 x ATR, seed 20261024) are not changed after any result.'
