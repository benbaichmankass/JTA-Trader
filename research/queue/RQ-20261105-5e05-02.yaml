  registered_before_run: true
  statistic: exit_lever_ablation.py --grade replace, baseline A (declared, structure on) vs N0 (-structure_exit), 2020-07-01..2026-10-15, 6 folds, net of the full
    cost stack.
  rule: 'Registered 2026-11-05 before any run of this unit. REVERSE test on a leg that DECLARES structure_exit pivot=5 (#22626): baseline A = the leg as declared
    (structure SL+TP on); ONE candidate N0 = the same leg with structure_exit unset (-structure_exit), i.e. the exit it traded before #22626. Verdict: exit_lever_ablation
    --grade replace over 2020-07-01..2026-10-15, 6 equal calendar folds by entry time, net of the full venue-aware cost stack, parameters UNCHANGED from RULE-STRUCTURE-EXITS-V1:
    delta-r 0, delta-r-per-trade 0.02, fold-majority 4 of 6, dd-tol-frac 0.35, n-floor 39 (multiplicity 1). PASS (N0 replaces A) = the prior exit beats the structure
    default by the registered margin on this leg: supports a Tier-3 proposal to turn structure_exit OFF on this leg, brought to the operator as an exact diff (operator
    2026-11-03: structure is the default until something is proven better). FAIL = the structure default stands on this leg. INDETERMINATE if n < 39 or N0 is identical
    to A (the structure lever never fired). HONEST WINDOW: the prior exit was itself tuned on overlapping history, so the window is biased toward N0; a PASS is still
    a measured record, and a FAIL is conservative for the default. Thresholds, arm, window not changed after any result. Sibling evidence (not this leg): the same
    structure form lost on 6 of 6 non-declaring legs (5e01-02..07).'
  what_it_does_not_do: Edits no config or roster, places no order, touches no other leg.
  min_n: 39
