id: RQ-20261023-7e83-02
title: 'CROSS-SYMBOL CONFIRMATION of the 4b82-14 cold-vol window PASS (VW100 on eth_pullback_2h): does the 100-bar percentile lookback also beat ada_pullback_2h as declared?'
status: queued
cadence: once
roadmap:
- L-REGIME
theme: regime
priority: 2
kind: experiment
question: RQ-20261022-4b82-14 graded PASS for arm VW100 on eth_pullback_2h (+5.70 R vs B, 2020-07..2026-10-15) -- a single-window LEAD chosen from 3 arms. On ada_pullback_2h (a different symbol, same family, real money), over 2020-07-01..2026-10-15 23:59 (6 calendar folds by entry time, the harness's venue-aware fee + slippage + funding stack), does VW100 (--vol-skip-below-pctl=0.2, --vol-pctl-window=100), fixed from that lead and not re-searched, beat the leg as declared (B) by >= 1.0 R net in >= 4 of 6 folds with max drawdown no worse?
why_this_matters: 'A PASS read on one window is a discovery, not a confirmation (research-ops step D). The lead was selected from 3 arms (multiple-testing denominator 3 on one leg). Same-statistic replication on a sibling symbol is the cheapest independent read; a Tier-3 note needs it. Lane RESEARCH-OPS-20261023-1447. Prior: RQ-20261022-4b82-14, RQ-20261014-f0e2-12.'
power:
  expected_n: 100
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d=0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo's standing E35 floor). expected_n is an ESTIMATE from the leg's committed
    730 d record (comms/strategy_evidence/runs/2026-10-05-730d-expand/) scaled to the longer window, not a measurement; below 39 the unit grades
    indeterminate, never FAIL.
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ20261023-7E83-02-ADAPB2H-COLDVOL-WINDOW
  registered_at: '2026-10-23'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg ada_pullback_2h --grade sweep, baseline B = the leg as declared in config/strategies.yaml,
    arm fixed now (from the 4b82-14 lead, not re-searched): VW100=--vol-skip-below-pctl=0.2;--vol-pctl-window=100; --folds 6 --fold-majority 4 --n-floor 39 --delta-r 1.0; per arm: n, net_total_r, max_drawdown_r, net R per fold; dR = net_r(arm) - net_r(B),
    dDD = maxDD(arm) - maxDD(B).'
  rule: 'INDETERMINATE IF n(B) < 39 (underpowered; never FAIL on thin n). The candidate arm PASSES iff dR >= 1.0 R AND dDD <= 0 AND it beats B in
    >= 4 of 6 folds. PASS IF the arm passes : a LEAD, followed by ONE confirmation unit on a disjoint window with the same
    statistic and bar; only a confirmed pass becomes a Tier-3 PROPOSAL note on the owning checklist row for the manager, never a config edit.
    FAIL IF it does not pass with n(B) >= 39: this variant is closed on this window and the record names the arm that moved closest. Thresholds are
    fixed now and not changed after any result.'
  what_it_does_not_do: 'Edits no config and no roster, places no order. A PASS also needs a live producer (see the leg''s monitor) and a Tier-3
    declare with the mirror in the same PR; it is not a promotion case. The single arm is the whole search: no arm is added after the run, and the
    baseline is the declared leg, not a tuned one.'
