  registered_at: '2026-11-24'
  registered_before_run: true
  baseline: the registered recipe on the same folds, rows, tau and cost stack
  statistic: 'scripts/research/ml_entry_fix_arms.py --arm lim_choose (fit_lim_chooser, choose_rows): the market arm''s taken decisions per fold;
    delta = pooled mean net R per decision with the chosen entry - the same rows at market; week-clustered influence se; folds/years vs market;
    vs_control = the same rows with the limit used at RANDOM at the arm''s limit share (100 draws) and GATING. Limit share, correlation of predicted
    and realised delta, realised delta where the limit / market was chosen, and the all-limit delta reported per fold.'
  rule: PASS iff arm n >= 3000 AND delta(arm - market entry) >= +0.0068 AND t >= 2.0 AND delta(arm - random choice) >= +0.0068 AND folds_better >=
    6 of 8 AND years_positive >= 3 of 4. FAIL iff n >= 3000 AND delta + 2.0 se < +0.0068. INDETERMINATE otherwise. Fixed now (the same LEVER rule as
    f1a0-21, control gating).
  pass_action: Fresh-window confirmation (2025-10..2026-11, holdout ledger claim), then a data-backed Tier-3 entry-order proposal to the manager (applied
    by the operator or a mandate).
  fail_action: Record the learned limit/market choice closed at this limit geometry; the entry-order lever moves to the limit DEPTH chosen per decision
    (0.25 / 0.5 / 1.0 ATR) or closes, and ml_entry iteration returns to the label side (cost-aware labels).
  proposal_mapping: pass -> fresh-window confirmation (bars after 2025-10-01, holdout ledger claim, deflated bar) -> Tier-3 proposal to the manager
    with this evidence record; fail/indeterminate -> the next iteration authored from this diagnosis at once.
