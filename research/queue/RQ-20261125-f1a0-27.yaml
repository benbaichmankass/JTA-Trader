id: RQ-20261125-f1a0-27
title: 'ml_entry LEARNED ENTRY-ORDER CHOICE: on exactly the SL 4 / TP 6 refit''s market-entry decisions, does choosing limit vs market per
  decision by a per-fold model of (limit - market) net R beat plain market entry by +0.0068 R/decision and beat a random choice at the same share?'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
programme: P2
kind: experiment
iteration:
  subject: ml-entry
  subject_kind: ml_model
  from_result: RQ-20261125-f1a0-22/45524436045
  verdict_read: indeterminate
  diagnosis: 'f1a0-22 (lim_fallback, run 45524436045) was INDETERMINATE at -0.0027 R/decision vs market (t -0.54, 2 of 8 folds, 1 of 4 years): re-entering
    the unfilled winners at market 4 h later gave back more than the limit saved, so a blanket fallback is closed. f1a0-21''s per-fold pattern says the limit is
    a SELECTIVE thinning whose value depends on the market arm''s own fortune (limit minus market, per fold, from its log): positive in EVERY fold where
    the market arm lost (2022-01 +0.016, 2022-07 +0.017, 2023-07 +0.033, 2025-07 +0.053 R), mixed where it won (2023-01 -0.024, 2024-07 -0.046;
    2024-01 +0.015, 2025-01 +0.007). That is predictable per decision from the same state the entry model sees, so
    the f1a0-22 fail_action''s D9 step is taken directly: learn the (limit - market) value per decision and post the limit only where it is positive.
    Earlier: f1a0-21 (lim_paired, run 45518523469) was INDETERMINATE: +0.0068 R/decision vs market on the same 52,029 decisions (t 0.92, 6 of 8 folds, 3 of 4 years), +0.0121 vs random thinning (t 2.48). Every fold showed adverse selection: the decisions whose limit FILLED were market losers (-0.05..-0.17 R at market) and the ones that did NOT fill were winners (+0.12..+0.37 R). The limit earned ~0.125 R of price plus ~0.02 R of cost on each fill but forfeited the runaway winners. A market fallback when the limit is still unfilled after 4 h keeps those winners (at a worse, later price) while fills keep the improvement.'
  search: 'one fixed policy: the f1a0-17 / f1a0-21 limit (0.5 ATR14, 4 x 1h bars, strict fill, maker entry; unfilled = 0 R) or market, chosen per
    decision by one fixed LightGBM huber regressor (LIMC_PARAMS, seed 20261125) on (limit - market) net R per side, fitted per dev fold on TRAIN
    decisions only (both sides as rows, side as a feature, the 20 FEATURES); limit iff predicted delta > 0. Entry model, labels and cost stack unchanged.'
  levers:
  - entry
  map_entries:
  - research/levers/ml-entry.yaml
  attempt: 16
  due_by: '2026-12-01'
question: On the 8 dev folds, on exactly the decisions the SL 4 / TP 6 / 24 h refit takes with market entry, is mean net R per decision when each
  decision uses the post-only limit (0.5 ATR14, 4 h, strict fill, maker; unfilled = 0 R) only where a per-fold model predicts (limit - market) net R
  > 0 and market otherwise at least +0.0068 above plain market entry AND above a random limit/market choice at the same limit share (week-clustered
  t >= 2, >= 6/8 folds, >= 3/4 years)?
why_this_matters: Cost per R binds; the entry order is the remaining cost term, and the limit is already a better-than-random filter (+0.012 R vs
  random thinning on f1a0-21) whose sign flips by regime. The random-choice control at the same limit share separates the model's choice from
  merely using the limit some of the time.
