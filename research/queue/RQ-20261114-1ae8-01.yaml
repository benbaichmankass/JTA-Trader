  best_static:
    grid: [4, 8, 12, 16, 20]
    excludes_test_folds: true
practice_precedent: 'RQ-20261101-383f-01 (Labrador-1b: same recipe, harness and cost stack; PASSED its forward read) and
  the failed exit-now line RQ-20261014-d6e7-06; M4, M5 (pre-registered rule, out-of-sample grade).'
follow_up: 'ML-PRIMARY grades on landing and updates MLP-D8-LABRADOR-2; PASS -> held Tier-3 PR reported to the manager.'
