id: RQ-20261115-2411-04
title: 'DEMO-FLOOR harness-native HTF long gate (SMA200), THIRD+FOURTH disjoint windows 2022-11..2024-11: does the db1a-04 record-year gain survive older regimes? (iteration from RQ-20261114-db1a-04)'
status: done
cadence: once
kind: experiment
theme: live_strategy
priority: 1
roadmap:
- L-LADDER
question: 'Same fixed gate as RQ-20261114-db1a-04 (daily-SMA200 long gate inside the harness, arm H vs config-exact A) on two OLDER disjoint years: window W3 = 2023-11-13..2024-11-12 (graded as the "record"
  slot) and W4 = 2022-11-13..2023-11-12 (the "prior" slot). Does pooled H-A stay > 0 on both?'
why_this_matters: 'ITERATION (research-ops 2026-11-15 2247Z), handed off by the 14:47Z pass as the one unit that decides this family. RQ-20261114-db1a-04 FAILed on its rule: pooled H-A +85.3 R on the record
  year (2025-11..2026-11, a down-trend year for crypto) but -0.63 R on the year before; 0 of 15 legs passed per-leg, 13 fail, 3 indeterminate under the n floor. Diagnosis: the gate removes record-year losses
  (down-trend regime) and is neutral-to-slightly-negative on the prior year, a drag-removal filter whose value depends on the regime, not shown as edge. Two older years (2023-11..2024-11 mostly up-trend,
  2022-11..2023-11 recovery) are the regime test that was never run: if H-A is positive on both the gate has regime-independent value and the per-leg proposal path (Tier 3) opens; if negative on the up-trend
  year it is a regime hedge (a different decision: regime router, not a per-leg filter). DENOMINATOR: one fixed filter, no parameter chosen; prior attempts on the SMA family named in the rule. DISCLOSURE:
  windows W3/W4 are earlier than every window db1a-02/-03/-04 read, so virgin for this filter; legs without data for the full window grade indeterminate, not zero.'
power:
  expected_n: 2656
  min_detectable_effect: 0.2
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'MEASURED in RQ-20261114-db1a-02/-03: 1,343 record and 1,313 prior trades over the 15 legs; 831 longs fell below the SMA200 post-hoc. Per leg n 34..183 per window; the per-leg Stage-0 floor is
    the leg''s f251 floor (30; avax_4h 20).'
  sd: null
  feasibility:
    source: none
    accrual_basis: Fixed in-hand windows; nothing accrues; Binance / Binance-vision covers them at run time.
evidence_class:
  holdout: in_sample
  claim: edge
