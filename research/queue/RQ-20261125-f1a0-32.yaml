    id_hi96 = close / 96-bar high - 1, from the last bar CLOSED at or before entry, + direction / leg / family codes), f1a0-26''s LightGBM recipe and
    walk-forward unchanged, the same 2.0 / 0.5 tercile tilt and leg x month renormalisation; no grid.'
  levers:
  - regime
  map_entries:
