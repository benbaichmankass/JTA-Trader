    sees a different payoff than one entered mid-range in quiet, whatever the daily trend. The next form (registered fail_action of f1a0-30) replaces
    the daily block with the leg''s OWN-TIMEFRAME state at entry; the tilt, renormalisation, permutation control and grade are unchanged.'
