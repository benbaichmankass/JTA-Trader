  diagnosis: 'The DAILY own-symbol + BTC state tilt (frozen recipe) was positive on 2 of 3 disjoint populations (f1a0-26 rostered +0.0168, perm share
    0.005; f1a0-28 BNB/DOGE/LINK/LTC +0.0119, share 0.000) and null on the third (f1a0-30 DOT/ATOM/BCH/ETC -0.0018, share 0.69): daily state does not
