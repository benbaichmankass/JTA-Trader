id: RQ-20261104-c6f1-05
title: 'TP doctrine, real money, HELD-OUT: does a predictive take-profit (E25, E3, E4) selected on the earlier span of trend_donchian_sol_prop''s
  history beat its current exit on a later span selection never saw, net of the full cost stack?'
status: done
cadence: once
roadmap:
- L-ATM
- M20
theme: live_strategy
priority: 1
kind: experiment
practice_precedent: T3 (net of the full cost stack) + T9 (on trend legs the TP doctrine requires MEASURING the cost of a target,
  not assuming it); binding source docs/ARCHITECTURE-CANONICAL.md § TP doctrine; holdout design = PROMOTION-BAR-HOLDOUT-1016
  (exit_lever_ablation.py --grade holdout).
question: 'trend_donchian_sol_prop is on bybit_2 real money (+ bybit_portfolio mirror, bybit_1 paper twin) and FAILS tp-doctrine-guard
  on entry_tp (6R declared, unreachable: guard reach 0.019) AND tp_revision (rule_undeclared) (scripts/ci/check_tp_doctrine.py
  on main 745bcf758, 2026-11-04). Candidates: a reachable entry target 2.5 / 3 / 4 R, each WITH the donchian_measured_move
  revision (width 0.5): only an arm carrying both makes the leg compliant. Baseline B = the leg as declared (6R target, no
  revision). Selected on the discovery span only and read ONCE on a later held-out span, does a candidate beat B?'
why_this_matters: 'Operator decision 2026-11-04 (weekly planning popup, relayed by Manager Session 2026-11-04a): ''Yes, test
  all 6 (Recommended)'' -- every non-compliant REAL-MONEY leg gets ONE pre-registered TP test. Prior tests on this leg: RQ-20261022-bea9-03
  (3R+MM full-window replace, fail: net R up, fold bar missed); RQ-20261028-a7c3-03 (2.5R static, fail); RQ-20261101-5e01-06
  (structure SL+TP, fail). None held a span back from selection; this one does, so a PASS here is the evidence record a Tier-3
  declare needs and a FAIL closes these configurations honestly.'
power:
  expected_n: 400
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: '(1.96 + 0.8416)^2 / 0.45^2 = 38.8 trades -> the registered discovery floor 39 / held-out floor 25. MEASURED: 400
    baseline trades over 2020-10-01..2026-10-15 in research/results/RQ-20261022-bea9-03 (arm A).'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ20261104c6f105-TP-HOLDOUT
  statistic: 'scripts/research/exit_lever_ablation.py --grade holdout on trend_donchian_sol_prop, window 2020-10-01 .. 2026-11-03
    23:59, net of the full cost stack the harness resolves per venue (execution_costs.resolve_cost_policy: fees + slippage
    + funding; recorded per arm as cost_stack). Every arm runs once over the whole window. The boundary is fixed from B''s
    ENTRY TIMES before any outcome is read: the latest 25% of the window, grown in 1% steps until it holds 25 of B''s entries,
    capped at 40%. DISCOVERY = trades whose entry AND exit precede the boundary, cut into 4 equal calendar folds (multi-fold
    walk-forward); HELD-OUT = trades entered on/after it (no overlap; straddlers excluded). Per arm: n, net R, per-fold net
    R, max DD R, by_outcome. Reported, not graded: tp_share = by_outcome.take_profit / n.'
  rule: 'ELIGIBLE on discovery iff n >= 39, net R > 0 and >= 3 of 4 discovery folds net-positive; the eligible arm with the
    highest discovery net R is SELECTED (a tie goes to B). PASS iff ALL of: (1) the selected arm is a candidate (E25, E3,
    E4), not B; (2) its held-out n >= 25 and held-out net R > 0 (harness label confirmed); (3) on the SAME held-out span its
    net R >= B''s held-out net R (paired read of arms/<label>__trades.jsonl, read once, no re-selection). FAIL iff B is selected
    (the declared exit wins discovery), or the harness labels no_discovery / not_replicated, or clause 3 fails. INDETERMINATE
    iff insufficient_discovery or underpowered (a power shortfall, never evidence against the leg). PASS -> doctrine read:
    tp_share(selected) >= 0.10 on the held-out span, else forwarded as ''P&L without a reachable prediction'', not a declare;
    otherwise ONE Tier-3 proposal on row RM-AM-SOLPROP-TP25: tp_r: <sel> (replacing 6.0) and tp_revision: {rule: donchian_measured_move,
    width_mult: 0.5}; the prop twin trend_donchian_eth_prop is a different leg and is not graded here, bybit/alpaca live +
    mirror in one revertible PR, operator''s approval. Thresholds are not changed after any result. A FAIL closes these configurations,
    never the family (research-ops § D).'
  what_it_does_not_do: Edits no config, places no order. The leg's ENTRY params were chosen on windows that overlap both spans;
    the held-out span is independent of the TP selection made here, not of the leg's construction. A one-leg per-trade-R read,
    not the book simulation.
