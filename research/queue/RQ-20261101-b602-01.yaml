# Authored 2026-11-01 by lane ML-RECIPE (Tier 1) for the ENTRY lever plan (manager/operator 17:55Z). Decision rule registered BEFORE any run. Gates: none.
id: RQ-20261101-b602-01
title: 'ENTRY lever 2, selectivity: do a score-band cap, a tau choice rule, regime abstention or a side filter lift the dev mean when selected on dev only?'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: experiment
practice_precedent: 'T1, M6 (docs/reference/trading-and-model-practice-principles.md): purged + embargoed walk-forward; shadow-feature (Boruta-style) controls so a model that cannot reject noise columns
  is not trusted to admit real ones.'
question: 'Dev reading (v1 frozen recipe, seed 7, all 60 symbols, tau 0.10): pooled tau curve over the dev folds is peaked and then NEGATIVE (tau 0.0 -0.0026, 0.05 +0.0026, 0.10 +0.0154, 0.15 +0.0100, 0.20
  -0.0012, 0.30 -0.0216); by predicted-score quintile net R is +0.008, +0.008, +0.015, +0.023, -0.0075, so the TOP quintile (mean score 0.38) loses. By side: dev short +0.0195 (n 45.9k) vs long -0.0089
  (n 26.1k), but held-out was long +0.032 vs short -0.004 and the sign flips by calendar year (2022 long -0.069 / short +0.038; 2023 long +0.077 / short -0.025). Arms, one factor each against the base (tau
  0.10, no filter): A band cap: abstain when the score is above the q-quantile, q in {0.80, 0.90}, of the OTHER dev folds'' out-of-sample scores (leave-one-fold-out, labels never used); B tau choice: tau
  in {0.05, 0.10, 0.15} chosen by a plateau rule (the largest tau whose neighbours are within 0.01); C regime abstention: abstain in each tercile of BTC 24h return and of vol24 in turn; D side abstention:
  drop long, drop short. Three seeds.'
why_this_matters: 'Operator 2026-11-01: 20 features is a regression equation, not algorithmic trading; manager 2026-11-01 ~12:03Z: a family ablation at +0.010 cannot admit anything when the recipe overfits
  with any extra column, so fix the recipe, then the columns.'
power:
  expected_n: 60000
  min_detectable_effect: 0.01
  effect_units: metric
  sd: 1.0
  design: two_sample
  alpha: 0.05
  power: 0.8
  basis: 'MEASURED 2026-11-01: top score quintile -0.0075 vs +0.023 for the fourth (n 14,390 each, one seed). Removing the top quintile in-sample would lift the mean by about +0.004 (ESTIMATED, selection
    bias uncorrected) which is below the registered 0.0068; expect INDETERMINATE unless the fold-level selection widens it.'
  feasibility:
    source: none
    accrual_basis: Replays public history through 2025-09-30 (dev folds only); nothing accrues.
decision_rule:
  id: RULE-20261101-b602-01
  registered_at: '2026-11-01'
  registered_before_run: true
  statistic: 'Per arm and seed: n, mean gross, cost and net R per decision at the frozen entry tau; seed mean and range; per-fold and per-calendar-year net; traded-5 slice beside the pooled frozen-60 population.'
  rule: 'Extra for D: a side may be dropped only if that side is negative in >= 3 of 4 calendar years (the dev sign flips predict the held-out failure of a side filter). Extra for A and C: the cap is the
    quantile of the other folds'' out-of-sample scores and the regime cutoffs are terciles of the label-free features over the dev rows; no label of the scored fold is used. A lever arm WINS iff, net of
    the full cost stack on the dev folds, on the pooled frozen-60 population (the traded five are reported beside it, never instead): (1) every fold keeps >= 1000 scored decisions (else INDETERMINATE);
    (2) the mean over seeds 7/11/13 beats the base arm by >= 2 x the base seed range (base range 0.0034 (MEASURED 2026-11-01, v1 frozen recipe at a fixed tau on the pooled 60 symbols over the dev folds:
    per-seed means +0.0063..+0.0097, n about 72k; traded-5 range 0.0058), recomputed from this run''s base arm if larger); (3) it is better than the base in >= 6 of 8 dev folds; (4) its sign is the same
    in >= 3 of 4 calendar years. A winner is only a CANDIDATE: it is selected on dev alone and goes, with the other winners, into ONE combined held-out read (a later unit, ML-BAR-ONE-READ); no arm of this
    unit reads a held-out or sealed window. Thresholds are not changed after any result.'
  what_it_does_not_do: Reads no sealed or held-out window (dev folds only), serves nothing, changes no config or live symbol list, places no order, sizes nothing.
  min_n: 1000 dev decisions per fold
