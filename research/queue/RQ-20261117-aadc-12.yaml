id: RQ-20261117-aadc-12
title: 'ml-exit-head-donchian-1h CONFIRMATION (held-out symbols): does the holding_pays_neg25 target, trained on the BTC/ETH/SOL rows only,
  beat the holding_pays champion by +0.01 R/trade on donchian 1h trades of 10 perps the head never saw?'
status: done
cadence: once
