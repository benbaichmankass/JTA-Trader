  verdict_read: pass
  diagnosis: 'aadc-11 (run 44098413330) PASSED on the head''s own three legs: holding_pays_neg25 - champion +0.0134 R/trade, deflated CI
    [+0.0020, +0.0247], n 11,160; vs HOLD the arm is -0.0002 (champion -0.0135), so the label change removes the champion''s give-up
    rather than adding edge over holding. The margin value -0.25 was chosen after reading margin 0 (aadc-04, +0.0069), a sequential search
    on the same rows, so the pass is a dev result. The registered pass_action is one confirmation on symbols outside the training rows
    before any retrain proposal.'
  search: 'none: the arm (holding_pays_neg25), recipe, shape, folds, embargo and lookback are fixed at aadc-11''s; only the TEST population
    changes (10 held-out perps, trend_donchian 1h parameters), with every training row from BTC/ETH/SOL'
  levers:
  - labels
  map_entries:
  - research/levers/ml-exit-head-donchian-1h.yaml#manifest.labels
  attempt: 5
  due_by: '2026-11-24'
question: 'Same recipe as aadc-11, ONE ARM (holding_pays_neg25) vs the holding_pays champion, trained per fold on rows.jsonl rows of BTC/ETH/
  SOL only (--exclude-train-symbol for each test symbol, verified by rows_by_symbol), tested on trend_donchian 1h harness trades of XRPUSDT,
  ADAUSDT, AVAXUSDT, DOGEUSDT, LINKUSDT, BNBUSDT, LTCUSDT, DOTUSDT, TRXUSDT and NEARUSDT. Is the paired per-trade replayed R >= +0.01 with a
  CI lower bound > 0?'
why_this_matters: 'A retrain of exit-head-donchian-1h on the new target is a Tier-3 proposal; aadc-11''s pass was reached by a sequential
  search on the same rows, so it needs one read on trades the head and the search never saw. A PASS sends a data-backed retrain proposal to
  the manager; a FAIL keeps the champion and records the label result as in-sample only.'
evidence_class:
  holdout: walk_forward
  claim: model_quality
power:
  expected_n: 11000
  min_detectable_effect: 0.0134
  effect_units: r_multiple
  sd: 0.535
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'MEASURED sd from aadc-11 (SE 0.00507 at n 11,160, so sd ~0.535 R per trade). expected_n is an ESTIMATE: BTC trend_donchian 1h
    gave 1,389 harness trades, ~1,155 out of sample over 5 folds, so 10 perps give ~11,000 if every symbol has candles on the trainer
    (a symbol without candles is producer_failed for that leg only and lowers n). At n 11,000 the z 1.96 half-width is ~0.010, so PASS
    needs the mean above ~+0.010; if the true lift is aadc-11''s +0.0134, power is ~0.75. Stated before the run.'
  feasibility:
    source: none
    accrual_basis: Replays the trainer corpus (rows.jsonl, BTC/ETH/SOL) and trainer-resolved 1h candles; nothing accrues.
baseline:
  definition: 'The holding_pays champion (the shipped recipe, train_exit_head.FEATURES, unchanged hyper-parameters) retrained on the SAME
    fold training rows and replayed on the SAME OOS trades with the live predicate; each trade net of fee + slippage + funding. Hold (no
    head) is reported as context.'
  net_of_cost: true
decision_rule:
  id: RULE-RQ20261117-aadc-12-EXITHEAD-NEG25-CONFIRM
  registered_at: '2026-11-17'
  registered_before_run: true
  baseline: the holding_pays champion on identical folds and trades
  statistic: 'scripts/research/exit_head_label_bakeoff.py --arms holding_pays_neg25 --z 1.96 --pass-dr 0.01, with every test symbol passed
    to --exclude-train-symbol: pooled over the 10 held-out legs and 5 folds, per OOS trade d = replayed_r(neg25) - replayed_r(champion) on
    identical trades, replay and cost; mean, SE (one trade = one cluster), CI at z 1.96 (one confirmation read, no further arms). Reported:
    rows_by_symbol (before exclusion), each arm vs hold, firing counts, per-leg read_state.'
  rule: 'PASS iff n_oos >= 3000 AND mean d >= +0.01 R/trade AND CI lower bound > 0. FAIL iff n_oos >= 3000 AND CI upper bound < +0.01.
    INDETERMINATE otherwise (n below 3000, or between the bars). Training never includes a test symbol (dropped by --exclude-train-symbol;
    rows_by_symbol and train_rows_after_exclusion are reported). Thresholds, symbols, arm, folds (5), embargo (7 d), lookback (500) and shape are not changed after any result.'
  pass_action: 'A data-backed Tier-3 PROPOSAL to the manager: retrain exit-head-donchian-1h on holding_pays_neg25 (same features and
    hyper-parameters), with aadc-11 and this record; the new artifact is promoted on its offline evidence by the manager / operator, never
    by this lane.'
  fail_action: 'The neg25 lift is in-sample only (it does not carry to unseen symbols). Keep the champion; record the label lever on the map
    as in-sample positive / out-of-sample flat, and the head goes to the family review aadc-04''s fail_action describes.'
  what_it_does_not_do: 'Edits no config, registry, artifact or exit_head_action; retrains nothing for serving; places no order; adds no
    gate. No holdout_lock claim: held-out SYMBOLS, not a held-out time window (the folds span the head''s training period); said so.'
  min_n: 3000 pooled OOS trades; per fold MIN_FOLD_TEST_N test trades and the multifold training floor
  what_it_does_not_do: 'Edits no config, registry, artifact or exit_head_action; promotes and demotes nothing. A PASS is an offline result
    under the head''s own judge, then a confirmation, then a Tier-3 proposal. Places no order; adds no gate.'
practice_precedent: 'M1 (label what the decision is paid on; a trail-shaped label conflates the exit rule with the forecast), one-factor
  ablation against a baseline control (docs/reference/trading-and-model-practice-principles.md)'
