question: On 2020-06-01..2024-06-30 (Binance USD-M archive, point-in-time top-20, weekly), does ranking on the 28d residual return vs BTC (RM1
  raw sum, RM2 sum / residual sd; beta from the trailing 90d) clear the unchanged discovery rule at the cumulative trial count, against the X1
  raw-momentum control?
why_this_matters: 'xsec-crypto is an orphan (scripts/research/iteration_orphans.py 2026-11-13). Attempt 2 tested regime, rebalance and universe;
  none fixed the concentration in one bull episode. Whether the family has SELECTION skill or only beta timing is the open question, and
  residual momentum is the standard way to separate the two.'
iteration:
  subject: xsec-crypto
  subject_kind: strategy_leg
  from_result: research/results/RQ-20261101-d1f3-02/41753804464.jsonl
  verdict_read: fail
  diagnosis: 'RQ-20261101-d1f3-02 (attempt 2; 7 arms incl. control, daily net, 2020-06-01..2024-06-30, n_days=1491, DSR N_cum=17): every arm
    FAILS. Control X1 net Sharpe 1.325, halves 2.132 / 0.259, DSR 0.80; by year 2020 +0.50, 2021 +1.09, 2022 +0.01, 2023 +0.08, 2024H1 -0.07
    (2021 = 68% of net, discovery attribution); long leg +1.84, short -0.23. R2 (flat when BTC < 200d) lifts Sharpe to 1.49 but h2 turns -0.017;
    R1 kills the short loss (-0.006) yet total Sharpe falls to 1.13. Robustness cuts (58e4-02 followups): ex-2021 Sharpe 0.65, ex top-3
    (AXS, SOL, LINK) 0.74. CAUSE (hypothesis): raw 28d momentum in an alt-season ranks on BETA (high-beta alts lead a rising market), so the
    return is one beta episode, not selection. COMPETING: genuine idiosyncratic continuation (narrative flows into specific alts) that happened
    to cluster in 2021; then the residual ranking keeps the 2021 return and holds h2 too.'
  hypothesis: ranking on the BTC-residual return removes the beta loading, so whatever selection skill exists shows in BOTH halves rather than
    in one bull episode
  search: 'entry signal: residual momentum vs BTC (RM1 raw residual sum, RM2 residual sum / residual sd), beta window 90d, formation 28d'
  levers:
  - entry
  attempt: 3
  due_by: '2026-11-20'
  map_entries:
  - research/levers/xsec-crypto.yaml
baseline:
  what: control A0 = discovery primary X1 (raw 28d return, top/bottom 30%, long-short, equal weight, weekly, top-20), re-run in the same invocation
  net_of: fee 11.0 bps round trip charged per side + slippage 3 bps round trip + SIGNED settled funding (long pays, short receives); stress
    arm = 2x fee+slippage
  committed_value: net Sharpe 1.325, halves 2.132 / 0.259, DSR 0.805 at N=17, side net sums long +1.843 / short -0.230 (RQ-20261101-d1f3-02 A0)
power:
  expected_n: 1491
  min_detectable_effect: 1.4
  effect_units: annualised_sharpe
  sd: 19.105
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'n=1491 daily net returns; harness annualises with 365 days so sd=sqrt(365)=19.105. One-sample, alpha 0.05, power 0.8: required n
    = 7.84*365/S^2, so at n=1491 the smallest annualised Sharpe separable from zero is ~1.4. The pass bar is the absolute registered rule
    with a cumulative-N DSR, not an arm-vs-control delta (differences below ~0.7 Sharpe are not separable; 2021 alone is 68% of the control).'
  feasibility:
    source: none
    accrual_basis: Fixed historical archive (data.binance.vision, capped at 2024-06); nothing accrues.
decision_rule:
  id: RULE-RQ-20261113-62e3-02
  registered_at: '2026-11-13'
  registered_before_run: true
  statistic: 'ARMS (3 incl. control, all counted; grid fixed in scripts/research/edge_portfolio_discovery.py ITER_GRIDS["62e3"]["xsec"]):
    A0 = X1 control; RM1 = X1 ranked on the residual sum over the same 28 formation rows, residual = r - beta*r_BTC with beta from the trailing
    90 daily returns through t-1; RM2 = RM1 score divided by the residual sd. Same quantiles, weights, rebalance, universe and cost stack.
    Per arm: net Sharpe, stress Sharpe, half Sharpes, bootstrap p05, DSR at N_cum = 20 (10 discovery + 7 attempt-2 arms + these 3).'
  rule: 'PASS iff at least one NON-control arm clears the UNCHANGED discovery rule: net Sharpe >= 0.5 AND stress (2x fee+slippage) Sharpe >
    0 AND Sharpe > 0 in BOTH halves AND bootstrap p05 of annualised mean net > 0 AND DSR > 0.95 at N_cum = 20, on 2020-06-01..2024-06-30.
    FAIL iff the control computed and reproduced and no arm clears it. INDETERMINATE iff the control series is insufficient OR the control
    A0 net Sharpe misses the committed 1.325 by more than 0.01 (--expect-control-sharpe). By-year sums and side split are REPORTED (the 2021
    share is the diagnostic read), not graded. Holdout not read; a PASS earns ONE holdout read, never a book.'
  what_it_does_not_do: Edits no config and no roster, places no order, proposes no live leg, reads no data after 2024-06-30. A FAIL says only that
    RM1 and RM2 on X1 did not clear the rule.
