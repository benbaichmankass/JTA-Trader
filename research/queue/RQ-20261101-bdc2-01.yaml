decision_rule:
  id: RULE-RQ20261101-bdc2-01-ENTRY-ON-ALPACA
  registered_at: '2026-11-01'
  registered_before_run: true
  statistic: 'scripts/research/ml_entry_alpaca_score.py verdict(): held-out mean net R per TAKEN LONG decision on the alpaca_live symbols, n, per
    symbol. Reported, never gating: bootstrap CI95; the same frozen model with BOTH sides on the alpaca_live symbols and on the alpaca_portfolio
    symbols (the mirror takes shorts); always-long under identical mechanics; by month; the c692-06 bybit_2 read; the October long-side monitoring
    figure above.'
  rule: 'INDETERMINATE IF held-out n < 30 (the c692-06 floor). PASS IF held-out mean net R per decision >= 0 (point estimate, the operator bar).
    FAIL otherwise. PASS -> ONE held Tier-3 PR: ml_entry on alpaca_live AND alpaca_portfolio as a per-account config block on the ONE ml_entry
    implementation (coordinated with lane ML-ENTRY-GOLIVE-UNBLOCK, never forked), new order-path code proving itself on ONE small trade. FAIL or
    INDETERMINATE -> no per-category model (operator); the consolidation unit (ONE ENTRY v2 on all symbols of all accounts, c692-04 arm (c) /
    ML-DATA-XASSET-1H) is filed on a fresh forward window under ML-BAR-ONE-READ, reporting the per-account result inside that one model.
    Thresholds are not changed after any result.'
  what_it_does_not_do: No re-fit, no new model, no tau choice, no sizing, no config change, no order. Yahoo bars are a proxy for Alpaca fills;
    5.0 bps slippage is a placeholder. The crypto-referenced cross-sectional features are the frozen model's definition applied as-is, which is
    exactly the serve-parity question this read answers.
  min_n: 30 held-out LONG decisions on the alpaca_live symbols
