id: RQ-20261101-bdc2-01
title: 'ENTRY on alpaca_live: does THE frozen ENTRY model (ml-decision-entry-v1, the c692-01 final fit, tau 0.10), applied to alpaca_live''s
  symbols with the account''s constraints as execution rules (SHORT -> nothing, regular session, Alpaca costs), reach held-out mean net R per
  decision >= 0 on 2025-10-01..2026-09-30?'
status: done
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: experiment
practice_precedent: 'T1, M6 (docs/reference/trading-and-model-practice-principles.md): one frozen model, one read of a sealed window; RQ-20261101-c692-06
  (the same frozen model scored on the bybit_2 symbols) is the precedent this mirrors.'
question: 'Operator 2026-11-01 ~10:40Z, verbatim: "really, the same entry model should be applied to alpaca as to bybit 2 - we''re trying to consolidate
  so we have overall-context models, in addtion to the per-symbol models, and I''m not sure when we decided that there was a distinction between
  bybit and the other accounts on this, but that''s wrong - the supra-symbol mls are for all symbols on all accounts. If we find evidence for per-category
  MLs later on, than we''ll build those later on, but that was never the design spec for the models I asked for this morning". Load the served
  artifact ml/served/ml_decision_entry_v1/model.json (branch claude/ml-entry-live-adapter commit 09df3fdf6f2c, sha256 489dcee3d4f6df55f9a8c33e87ba5a98e0ece62d7d9932fab1347781f5db4630;
  no re-fit, tau 0.10 as served). For every symbol of config/accounts.yaml alpaca_live symbols: (re-parsed at run time), build Yahoo 1h REGULAR-session
  bars 2025-05-01..2026-10-30; compute the model''s 20 features with scripts/research/ml_decision_entry.features_symbol on the equity''s own bar
  sequence, hour/dow from the bar''s real close, and the cross-sectional / BTC features against the model''s own 60-perp xs_reference (Binance Vision
  1h) at the latest perp bar closed by the equity bar''s close (the equity''s 24-bar return ranked among the 60 perps; no feature is missing: the model
  has no funding input). Decide at every RTH bar close whose UTC hour % 4 == 0 (the model clock); entry next RTH bar open; first passage over SL 2
  ATR14 / TP 3 ATR14 / 24-bar time stop (tie -> SL, gap through the stop -> open fill); the served decide() picks the side; SHORT -> nothing on the
  cash book; one position per symbol. Net of fee 0.0 (resolve_fee_bps_roundtrip SPY, commission-free) + slippage 5.0 bps (resolve_cost_policy, PROVISIONAL)
  + regulatory 0.5 bps round trip (SEC section 31 + FINRA TAF, rounded up), funding 0. Score 2025-10-01..2026-09-30 (the c692 sealed window) ONCE.'
why_this_matters: 'Operator 2026-11-01 ~10:30Z (row ALPACA-LIVE-ACTIVITY-ML): "I also want to make sure we have MLs live on that account by the
  end of the week". A PASS makes the alpaca_live adapter a CONFIG change on the one ml_entry implementation (PR #22079, lane ML-ENTRY-GOLIVE-UNBLOCK).
  Context reported beside the result, not gating (manager 2026-11-01): ENTRY''s October forward monitoring RQ-20261101-383f-03 read LONGS n=137
  -0.308 R on crypto perps; a long-only account takes only that side.'
