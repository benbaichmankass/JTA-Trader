id: RQ-20261028-2a2e-16
title: 'adx-max lever, avax_pullback_2h: does an arm (AX30/AX40) beat the declared leg net of the full cost stack (dR >= 1.0 R, >= 3 of 4 calendar folds, no worse drawdown)?'
status: queued
cadence: once
roadmap:
- L-REGIME
theme: regime
priority: 2
kind: experiment
question: On history up to 2026-10-27, with the harness's venue-aware fee + slippage + funding stack (the same argv builder as the evidence builder), does any pre-registered arm (AX30,
  AX40) of --adx-max on avax_pullback_2h beat the leg as declared (B) by >= 1.0 R net, with no worse max drawdown, in >= 3 of 4 calendar folds? Arm values are fixed here before any run;
  offline Stage-0 re-measurement, never a book decision.
why_this_matters: 'Daily authoring lane 2026-10-28 (DAILY-AUTHORING-20261028; research-queue-health H1-THEME regime: runnable 10 < share 14). avax_pullback_2h was moved shadow -> live
  by the DEMO-FLOOR rule 2026-10-27 and has 22 lever flags on record but no adx-max cell; its siblings (xrp/ada/eth/sol_pullback_2h) all ran it. GAP CHECKED by a leg x lever inventory
  of every exit_lever_ablation unit in research/queue (queued, done, blocked): none pairs avax_pullback_2h with --adx-max. A lone pass is a LEAD; the cell was chosen by the gap in the
  leg x lever matrix, not by a prior result. Trial count for this cell: 1 unit, 2 arms (a PASS is confirmed on a disjoint window before any Tier-3 proposal).'
power:
  expected_n: 60
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'd=0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo standing E35 floor). expected_n is an ESTIMATE, not a measurement: the baseline count for this leg over the window
    is not re-measured here; below 39 baseline trades the unit grades indeterminate (underpowered), never FAIL. The R bar is a MATERIALITY bar over the whole window, not a significance
    test; the calendar-fold majority refuses a one-period artifact.'
  feasibility:
    source: none
    accrual_basis: Re-measurement on freshly fetched keyless candles (avax_pullback_2h); the harness replays history, nothing accrues.
decision_rule:
  id: RULE-RQ202610282A2E16-__ADX_MAX
  registered_at: '2026-10-28'
  registered_before_run: true
  min_n: '39'
  statistic: 'Per arm, from the harness''s own --json summary (argv built by regime_debt_matrix.build_harness_cmd plus the arm''s tokens; full cost stack, never a zero default): total_trades,
    net_total_r, max_drawdown_r, plus net_r per fold over 4 equal calendar spans (same boundaries every arm). Arms: B = leg as declared; AX30=--adx-max=30; AX40=--adx-max=40. Per candidate
    C: dR = net_r(C) - net_r(B); dDD = maxDD(C) - maxDD(B); fold_wins = folds in which C out-earns B.'
  rule: 'INDETERMINATE IF n(B) < 39 (underpowered: no verdict; never FAIL on thin n). A candidate C PASSES iff dR >= 1.0 R AND dDD <= 0 AND fold_wins >= 3 of 4. PASS IF any candidate
    passes (best = highest dR): a LEAD, followed by ONE confirmation unit on a disjoint window with the same statistic and bar; only a confirmed pass becomes a Tier-3 PROPOSAL note on
    the owning checklist row for the manager, never a config edit. FAIL IF none passes with n(B) >= 39: this configuration is closed on this window and the record names the arm that
    moved closest (the lever family stays open; a family retirement needs a review record per family_retirement_policy.yaml). The bar, the drawdown clause, the fold majority, the 39
    floor and the arm values are not changed after any result.'
  what_it_does_not_do: 'Does not mine values: the arm values are fixed here and may not be edited after seeing any result. Does not edit config, place an order or touch a roster; a single-leg
    backtest lever is not edge and not a P&L claim, and a PASS is a lead, not a promotion.'
