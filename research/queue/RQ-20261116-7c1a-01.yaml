  - --arm
  - stall:24:0.5
  - --n-floor
  - '100'
  - --margin
  - '0.05'
  - --month-min-n
  - '8'
  - --month-pos-min
  - '3'
  - --out
  - '{out_dir}'
  inputs:
    research_unit: RQ-20261116-7c1a-01
ml_consumer:
