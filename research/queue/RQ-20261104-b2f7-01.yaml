    Pooled 1458 trades, 4 folds of 364-365: per-trade net R +0.044, +0.126, -0.055, -0.064; fold net R +15.98, +46.00, -20.02,
    -23.35; whole-window +18.61 R (+0.013 R/trade; longs -30.66, shorts +49.27). Held-out fold 4 (2025-07-24..2026-11-02) per-trade
