  command:
  - python3
  - scripts/research/leg_replay_emit.py
  - --legs
  - eth_pullback_2h,sol_pullback_2h,xrp_pullback_2h,ada_pullback_2h,avax_pullback_2h
  - --days
  - '1830'
  - --rule
  - family-regime
  - --out
