decision_rule:
  id: RULE-RQ20261122-b18a-03-BRACKET-CEILING
  unit_rule_id: RULE-RQ20261122-b18a-03-BRACKET-CEILING
  registered_at: '2026-11-22'
  registered_before_run: true
  min_n: 39
  statistic: exit_lever_ablation.py --grade replace over 2020-07-01..2026-10-15 (--days 2330), 6 calendar folds by entry time, full cost stack the harness resolves
    per venue, baseline B = the leg as declared; delta-r 0, delta-r-per-trade 0.03, fold-majority 5 of 6, dd-tol-frac 0.35, n-floor 39 (the 2780 family bars).
  rule: 'Registered 2026-11-22 BEFORE any run of the grid. A candidate C REPLACES B iff net_r(C) > net_r(B) AND net_r(C) - net_r(B) >= 0.03 R x n(B) AND net_r(C)
    >= net_r(B) in >= 5 of 6 folds AND maxDD(C) <= 1.35 x maxDD(B). Several pass -> the highest net R is SELECTED. MULTIPLICITY: 19 candidates, so the bars are the
    stricter 0.03 R/trade and 5 of 6 (not the single-arm 0.02 / 4 of 6). PASS = a SELECTION, unconfirmed: it supports nothing on the order path until the selected
    cell alone passes a confirmation registered now: exit_lever_ablation --grade paired (selected vs B) on a disjoint window (pre-2020-07 where the feed exists, else
    a symbol twin), same bars. FAIL = no candidate passes with n(B) >= 39: the bracket surface is flat on this leg and window, so a learned bracket has no measured
    headroom here. INDETERMINATE if n(B) < 39 or every candidate is byte-identical to B or the producer failed. Thresholds, arms, window are not changed after any
    result.'
  what_it_does_not_do: Edits no config, roster or order path; a PASS is not a promotion and a FAIL does not retire the Pointer family (family review needed, scripts/research/family_retirement_policy.yaml).
    Per-trade R changes with the stop distance (R is stop-denominated), which the replace grade reports beside net R.
