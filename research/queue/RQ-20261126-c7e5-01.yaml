run:
  workflow: am-action-value.yml
  timeout_minutes: 330
  inputs:
    research_unit: RQ-20261126-c7e5-01
    classes: mf_tighten_fixed_cc
    corpus_sha: ''
    strategies: ict_scalp_5m
    symbols: BTCUSDT
    entry_from: '2026-11-24'
decision_rule:
  id: RULE-AM-Q10-ONE-LEG-OOT-20261126
  registered_at: '2026-11-26'
  registered_before_run: true
  statistic: 'scripts/research/am_action_value.py reduce --strategies ict_scalp_5m --symbols BTCUSDT --entry-from 2026-11-24: `paired.holdout` = per-trade paired
    delta (arm net R - HOLD net R; 0 where the tighten never fired) over trades entering >= 2026-11-24: n, n_fired, mean_delta_r, sd_delta_r, t, and
    share_controls_beaten (share of the 100 causal random placements whose mean delta the arm beats). `paired.dev` (entry < 2026-01-01) supplies sd_dev
    for n*. The RULE-AM-RISK-ADJUSTED-V1 book clauses are reported, not graded (folds and drawdown cannot be read on a few hundred trades).'
  rule: 'n* = ceil((2.8 x paired.dev.sd_delta_r / 0.05)^2). If paired.holdout.n < n*: INDETERMINATE (n not reached; re-arm not_before by the accrual rate).
    Else PASS iff mean_delta_r > 0 AND t >= 2.0 AND share_controls_beaten >= 0.90; FAIL iff mean_delta_r <= 0 OR share_controls_beaten <= 0.50; else
    INDETERMINATE. Fixed now; no threshold is changed after a result.'
  what_it_does_not_do: Serves, promotes or applies nothing; changes no bracket, config or order; a per-trade-R SCREEN for one leg; says nothing about any other leg or class.
  pass_action: Propose the tighten on ict_scalp_5m to the manager as a Tier-3 / mandate decision input with this record (live-review tighten advice for that leg); the operator
    or manager decides.
  fail_action: 'Record that this CONFIG failed on disjoint data: mf_tighten_fixed_cc (tighten_half once at the first eligible bar aged >= 5) on
    ict_scalp_5m BTCUSDT 5m. Author the next AM iteration from this result on another action (bank / partial) or another fixed age on the same leg.'
  proposal_mapping: pass -> Tier-3 proposal input; fail -> this config failed, next action or age from the result; indeterminate -> n not reached (re-arm) or not separable (state it, iterate).
  choices_where_the_design_memo_is_silent:
  - 'FADE_BREAKOUT_4H: recorded "unpowered, not run". MDE = 2.8 x 0.3 / sqrt(102) = 0.083 R (holdout) and 0.042 R (dev, n 403) vs the +0.0023 R family cut; even
    the 93k-trade family needs ~176k trades for 0.002 R.'
  - 'CORPUS: corpus_sha empty = the repo tree at dispatch (the pinned 1eb164f4 holds no post-2026-11-23 entry). The run log records the checkout sha.'
  - 'MODELS: the model-free class only uses the value models to fix the population; the last heads fold is open-ended (test_end null), so post-2026-11-23
    trades get a fold. The heads artifact am-heads-45384292963 is kept only to 2026-12-24 and the value models are rebuilt here (av_run_id empty), so the
    dispatch needs a live heads artifact: precondition tracked in docs/claude/work/PIPELINE.jsonl (re-materialise before expiry).'
  - 'HOLDOUT: family AM-HEADS, 2026-11-24..end, symbols [BTCUSDT], claimed by the reduce step BEFORE the holdout books are built.'
