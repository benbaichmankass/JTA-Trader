title: 'AM v2 Q10 re-scope: the fixed-age-5 tighten (mf_tighten_fixed_cc) on ict_scalp_5m BTCUSDT 5m only, graded OUT-OF-TIME on entries after 2026-11-23
  vs HOLD and 100 causal random placements'
