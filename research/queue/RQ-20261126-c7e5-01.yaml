    classes: av_tighten +0.084, mf_tighten_fixed (06 and 09) +0.068, av_tighten_late +0.058, av_bank +0.049 R/trade, drawdown cut 14-22%, n 1,298. Those cuts were read over dev AND
    holdout together, so the whole pinned corpus (1eb164f4, 2026-11-23) is the CHOOSING window (operator 2026-11-23/25: a number measured only over the
    grading window never promotes). Only trades entering after 2026-11-23 are disjoint.'
  search: 'one class, one leg, no search: mf_tighten_fixed_cc exactly as c7e3-09 registered it (tighten_half once at the first eligible bar aged >= 5; causal
    controls), filtered at reduce to strategy ict_scalp_5m, symbol BTCUSDT; the holdout starts at 2026-11-24.'
  levers:
