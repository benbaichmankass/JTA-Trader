  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 60
  why_runner: Fetches keyless public Dukascopy candles for a pinned window; reads no trainer data; CPU only.
  basis: 5 harness passes over one ~8-year 1h fetch; estimate from RQ-20261112-5ab1-03.
value:
