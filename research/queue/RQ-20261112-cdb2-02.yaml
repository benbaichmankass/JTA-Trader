  - --arm
  - S_close=tp_r=6.0;--skip-hours=19,20
  - --arm
  - S_both=tp_r=6.0;--skip-hours=13,14,19,20
  - --arm
  - S_flat20=tp_r=6.0;--flat-at-utc=20:00
  - --days
  - '2200'
  - --start
