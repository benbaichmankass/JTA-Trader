    trend_donchian_sol=RQ-20261106-030 --unit trend_donchian_sol_4h=RQ-20261106-031 --unit trend_donchian_xrp_4h=RQ-20261106-033, baseline A, candidate donchian_lo, --bar 0.05 --min-n
    400 --folds 4 --fold-majority 3 --dd-mult 1.35 --seed 20261125.
  rule: 'Per the harness, thresholds fixed now: INDETERMINATE if any unit''s arm files are missing, pooled n(A) < 400, or the MDE exceeds 0.05. PASS iff pooled diff per baseline trade
