question: Across trend_donchian, trend_donchian_avax_4h, trend_donchian_eth, trend_donchian_sol, trend_donchian_sol_4h, trend_donchian_xrp_4h (pooled n(A) 1730 from the kept arm emits
  of RQ-20261106-017, RQ-20261106-026, RQ-20261106-027, RQ-20261106-030, RQ-20261106-031, RQ-20261106-033), is the paired per-entry net-R difference of donchian_lo minus A >= 0.05 R
  per baseline trade with a month-block bootstrap CI lower bound > 0, in >= 3 of 4 folds, with pooled maxDD <= 1.35x baseline?
why_this_matters: 'The weekly one-factor sweeps of this family graded fail/indeterminate leg by leg although every leg ran the SAME lever values (donchian 15 / donchian 25, declared
  20); a per-leg verdict cannot resolve a 0.02-0.05 R/trade effect (pool_arm_diff.py header). Pooling the legs that carry the same lever is the design that can. Dedupe: trend_donchian_sol_prop
  (same SOLUSDT 1h trades as trend_donchian_sol) and trend_donchian_xrp_adx25 (same XRPUSDT 4h trades as trend_donchian_xrp_4h) are EXCLUDED so no trade is counted twice; mgc_trend_1h
  is futures, not pooled with crypto. PASS gives a family-level Tier-3 declare PROPOSAL input (a population redefinition needs its own pooled test on fresh data, stated here); FAIL closes
  THIS value for THIS pool and leaves the family and the other value open. This is a pooled re-read of the same trades the sweeps produced, not an independent sample.'
power:
  alpha: 0.05
  basis: 'MEASURED n(A) per leg from the kept emits (latest run): pooled 1730. The harness computes MDE = 2.487*paired_sd/sqrt(n); if it exceeds the 0.05 bar the unit grades INDETERMINATE
    (said, never a fail).'
  design: one_sample
  effect_units: sd
  expected_n: 1730
  feasibility:
    accrual_basis: Re-reads committed arm emits; nothing accrues.
    source: none
  min_detectable_effect: 0.3
  power: 0.8
