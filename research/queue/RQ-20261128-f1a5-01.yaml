id: RQ-20261128-f1a5-01
title: 'ITERATION 5 of ltr-tighten-sl (family-review verdict A): does the -0.5 R tighten, fired only once the trade has DEVELOPED (age: one trading day of bars, one week on 1d) or on a VOLATILITY REGIME SWITCH against the entry (ATR >= 1.5x entry ATR), clear RULE-AM-RISK-ADJUSTED-V1 vs hold and vs a random-time tighten on the Stage-0 corpus?'
status: queued
cadence: once
theme: live_strategy
priority: 2
roadmap:
- L-ATM
programme: P1
kind: experiment
question: Over the committed Stage-0 per-trade corpora (8 legs), does moving the stop to -0.5 R at the first `age` trigger (k+1 >= 24 bars on 1h, 12 on 2h, 6 on 4h, 5 on 1d) or the first `vol_expansion` trigger (ATR(k) >= 1.5 x ATR at the first bar), taken only when that level is >= 1 ATR below the next open, cut maxDD or weekly CVaR5 by >= 15% at <= 0.05 R/trade net of the full cost stack, hold in >= 4 of 6 folds, and beat the same tighten at a random bar?
why_this_matters: 'Five graded tighten units failed (43b6-05, c8e1-01, d4a9-01/-02/-03): every arm failed R2 and R3, 0/6 folds each. The lever map reads exhausted at the policy granularity (trigger, timing, action_bounds), so a C retirement was drafted, and it did not survive its own protocol. (1) Every trigger tested was a PRICE EVENT (r_milestone, giveback, momentum_flip, structure_break, near_target); none conditioned on trade AGE or on REGIME. (2) RQ-20261125-c7e3-05 (ml-brackets, queued) MEASURED on 108,922 dev trades that a uniformly placed tighten beat HOLD (+7,180 R vs -10,282 R) while first-bar fires cost -16,376 R: the value sits after the trade develops. (3) Lo & Remorov (2017, J. Financial Markets 34) find stops pay in regime-switching markets when volatility rises in the adverse regime, and that tight stops lose to costs; Kaminski & Lo (2014) find stops add value only with serial correlation. Both name conditions our tests did not cover, which makes the verdict A (re-test), never C. Level -0.5 R is the middle of the d4a9 dose (the -0.75 R arm beat the random tighten on mean per-trade R, edge CI +0.013..+0.036, yet failed R2 and R4, which are judged on the risk cut), wide enough to respect the "tight stops lose to costs" finding.'
iteration:
  subject: ltr-tighten-sl
  subject_kind: ltr_class
  from_result: research/results/RQ-20261122-d4a9-03/45093028931.jsonl
  verdict_read: fail
  diagnosis: 'd4a9-01/-02/-03 (stop level -0.75 / -0.5 / 0.0 R at r_milestone), 43b6-05 (BE+0.25 R at r_milestone) and c8e1-01 (four momentum-failure triggers) all failed R2/R3 with 0/6 folds; mean dT vs hold ran from -0.011 R (-0.75 R level, CI -0.025..+0.001) to -0.103 R (giveback). The drawdown never fell (dd_cut -0.3% to -5.5%) because the book''s drawdown is made of full -1 R losers that never reach a +1 R trigger, which a price-event tighten cannot touch. What was never tested: a trigger keyed to trade age (c7e3-05 measured that tighten value appears after the first bars) or to an adverse volatility-regime switch (Lo & Remorov 2017). Both reach trades that never went +1 R, which is where the drawdown is.'
  search: 'trigger family, two untested conditions: age (fixed bars per timeframe, declared 2026-11-28 before any data read) and vol_expansion (ATR ratio 1.5); action_bounds fixed at -0.5 R; room condition fixed (>= 1 ATR); n_comparisons 2'
