    accrual_basis: Replays committed corpora and committed candles; nothing accrues.
decision_rule:
  id: RULE-RQ-20261128-f1a5-01
  registered_at: '2026-11-28'
  registered_before_run: true
  statistic: 'Over the pooled committed Stage-0 per-trade corpora in comms/strategy_evidence/ltr_corpus (8 legs), at EACH research trigger in {age, vol_expansion} (ltr_trigger_close_s0.RESEARCH_TRIGGERS, first firing per trade, values fixed in the script 2026-11-28): the book with the stop moved at bar j0+1 to -0.5 R, taken only when that level is >= 1 ATR below the next open (else the trade holds) and is a tighten (level > -1 R), replayed to the recorded exit with lro.replay_tighten, vs the HOLD book, against 200 matched random-time tightens to the same level rule on the same trades.'
  rule: 'RULE-AM-RISK-ADJUSTED-V1 (am_risk_adjusted.grade_risk_adjusted, V1 parameters: R1 r_cost <= 0.05 R per baseline trade; R2 maxDD cut >= 15% OR weekly-CVaR5 cut >= 15%; R3 >= 4 of 6 calendar folds hold; n_floor 39) with R4 vs 200 matched random-time books at min_control_beat_frac 0.975 (Bonferroni over 2 trigger arms), plus L1: a pass must keep r_cost <= 0.05 R/trade after dropping the leg with the largest favourable contribution. Two pre-registered candidates (n_comparisons 2). PASS: at least one tighten_be@<trigger> clears R1-R4 and L1 (a discovery; SCREEN pass, graduation_eligible false until BOOK-SIM-REAL-SIZER; a Tier-3 proposal input, never an apply; the two conditions were chosen from other data (c7e3-05 and the outside literature), not from this corpus, and a confirming out-of-time unit still follows before any proposal). FAIL: every candidate fails a read necessary clause (R1, R2 or R3) or is beaten by its random control (R4); then the regime and age conditions are counted tested in the family review''s lever map and not_tested list. INDETERMINATE: under the n floor, never fired, carried by one leg (L1 fails), or no trade could be priced. Fixed now; not changed after a run.'
  what_it_does_not_do: 'Advice-only research: serves, promotes or applies nothing; adds no gate; changes no config, mandate or roster; places no order.'
practice_precedent: 'T1 (docs/reference/trading-and-model-practice-principles.md): an intervention is graded against a matched random-intervention control in the same trade, net of the full cost stack, per class (RULE-AM-RISK-ADJUSTED-V1); same harness and design as RQ-20261122-d4a9-01/-02/-03 and RQ-20261122-c8e1-01.'
