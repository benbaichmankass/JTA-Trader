question: Does raising trend_donchian_eth_prop's min_confidence from 0.6 to 0.8 make the leg pass Stage 0 on the record year 2025-11-13..2026-11-12 and beat config-exact there, while
  holding (positive and above config-exact) on the year before, net of the full cost stack?
why_this_matters: 'Manager ruling 2026-11-14 09:19Z: after the profit-lock unit, pick between the census candidates. trend_donchian_eth_prop is negative in both years (-9.75R n166 /
  -4.52R n183) and its attribution reads ''cost erases a gross edge'' (gross +14.48R, cost 14.73R). Its strongest responder on its OWN decision bar (closed) is min_confidence: 0.7 +50.2R
  and 0.8 +75.7R vs +8.7R (RQ-20261101-78fc-14, 2020-07..2026-10, n 865 at 0.8, 6/6 folds, monotone). Chosen over trend_donchian_1h atr_stop_mult 3.125 because that evidence is closed-bar
  while trend_donchian_1h decides on the forming bar, where db1a-01 showed closed-bar responses often flip.'
