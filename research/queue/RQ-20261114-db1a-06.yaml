decision_rule:
  id: RULE-ETHPROP-MINCONF08-20261114
  registered_at: '2026-11-14'
  registered_before_run: true
  statistic: exit_lever_ablation --grade stage0 --forming-1m-fetch --days 800, arms A (config-exact, min_confidence 0.6) and M (min_confidence 0.8) per window; two_window_lever_grade.py
    applies the rule.
  rule: 'Multiple-testing guard: names the prior attempts on this leg and these windows (RQ-20261114-db1a-05 profit lock FAIL, -04 harness-native HTF gate FAIL, -03 post-hoc HTF filter,
    -02 ADX cell FAIL, -01 decision_bar) and the selection: 0.8 is the best of two values (0.7, 0.8) in RQ-20261101-78fc-14 over 2020-07..2026-10, a window that OVERLAPS both windows
    graded here, so this is an in-sample confirmation on the two most recent years, not an out-of-sample test. The value is fixed (0.8), not chosen here. PASS iff M passes Stage 0 on
    the record window (net_r > 0, n >= 30, >= 3/4 folds positive) AND M net_r > A net_r there, AND on the prior window M net_r > 0 AND > A net_r. FAIL iff graded and not; INDETERMINATE
    iff M n < 30 on the record window or a run/arm is missing. No threshold is relaxed.'
  what_it_does_not_do: Changes no config, roster, order or evidence record. A PASS is a Tier-3 parameter proposal (min_confidence 0.6 -> 0.8) for trend_donchian_eth_prop on bybit_1,
    via the manager. The leg is on no prop account.
  baseline: the leg config-exact (min_confidence 0.6) on its closed decision bar (arm A), both windows, run in this unit.
