id: RQ-20261026-1b57-05
title: 'As-declared breadth transfer: does xrp_4h (trend_donchian_xrp_4h) clear Stage 0 on basket B (AVAX/NEAR/ATOM/FIL/TRX/ETC) it was never measured on?'
status: done
cadence: once
theme: new_strategy_prop
priority: 2
kind: experiment
question: On Binance USD-M 4h candles for AVAX/NEAR/ATOM/FIL/TRX/ETC over 2020-06-01..2026-10-26, with every lever fixed at trend_donchian_xrp_4h (real money, bybit_2) as declared in
  config/strategies.yaml (read 2026-10-26), does the declared configuration pass the pooled Stage-0 rule net of the full cost stack, with breadth (half the powered cells) and a calendar-fold
  majority? Basket B is disjoint from basket A (BNB/DOGE/LINK/LTC/BCH/DOT, RQ-20261021-7c2b-07) and from every roster symbol.
why_this_matters: 'Stage 0 on the leg AS DECLARED is the cheapest honest test of whether an edge is a symbol fit. The same configuration was measured on basket A (RQ-20261021-7c2b-07);
  basket B was used only by variant units (prop-pace series 1d5c / 71e8 / d7e6 / 90d3), never as an as-declared transfer (MEASURED 2026-10-26 by grepping research/queue/*.yaml for the
  basket''s symbols against ''AS DECLARED'' and the leg key). A PASS gives per-symbol candidates for the prop/real-money roster search at zero tuning; a FAIL records that the declared
  leg is a symbol fit beyond basket A. PROP SUPERSET BAR (CLAUDE.md promotion ladder): this unit supplies Stage 0 only. A PASS is a Stage-0 input for a prop or real-money roster add;
  the prop EV/survival gate against each firm''s DD limits (prop_ev_grid.py / comms/prop_survival/<leg>.json), a PASSED mechanical Stage-1 soak and Gate 2 are ALL still required, and
  no roster is edited here.'
power:
  expected_n: 400
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d = 0.3 at alpha 0.05 / power 0.8 needs ~88 pooled trades (the repo's standing floor for this unit family). expected_n=400 is an ESTIMATE (~400 pooled from the basket-A cell
    counts of RQ-20261021-7c2b-07 scaled by symbol-years in the window), not a measurement; below the floor the unit grades indeterminate, never FAIL.
  feasibility:
    source: none
