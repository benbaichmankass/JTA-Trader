decision_rule:
  id: RULE-20261026-1B57-05-TRANSFER-XRP-4H-B
  registered_at: '2026-10-26'
  registered_before_run: true
  statistic: harness_stage0.py --family trend --timeframe 4h, one arm B = trend_donchian_xrp_4h as declared (params + raw flags listed in run.command); per cell n, net_r, max_drawdown_r,
    6 calendar folds (majority 4), net_r_per_capital_day; pooled across the basket's cells; cost = the harness's own venue-aware fee + slippage + funding stack resolved by execution_costs.resolve_cost_policy()
    (never a zero default), recorded per cell in the result.
  rule: 'PASS iff B passes the pooled Stage-0 rule: pooled n >= 88, pooled net_r > 0, >= 4 of 6 calendar folds net positive, and >= half of the powered cells (n >= 39) pass. A PASS names
    the passing CELLS (not the pool) as candidates: next is a same-book correlation/overlap read against the live legs, then the prop EV/survival gate and a re-entry case under MD-PROMOTE-S0-S1
    as a new evidence record -- never a roster act. FAIL iff B fails with pooled n >= 88: the declared configuration is a symbol fit beyond basket A on this window (CONFIGURATION closed,
    family stays open; next test = a symbol-cell-specific variant). INDETERMINATE otherwise (pooled n < 88, fewer than 2 powered cells, or under half the cells measured; a fetch/harness
    fault is recorded per cell, never dropped; the floors are never lowered). Thresholds are not changed after any result.'
  what_it_does_not_do: 'Edits no config and no roster, places no order, is not a promotion case, does not tune beyond the single declared arm, and does not pool with any committed record.
    Candles are Binance USD-M (a PROXY for Bybit linear); the funding term is a directionless magnitude (execution_costs P1); a symbol listed after the window start contributes only
    its own history. Both are stated in the record. PROP SUPERSET BAR (CLAUDE.md promotion ladder): this unit supplies Stage 0 only. A PASS is a Stage-0 input for a prop or real-money
    roster add; the prop EV/survival gate against each firm''s DD limits (prop_ev_grid.py / comms/prop_survival/<leg>.json), a PASSED mechanical Stage-1 soak and Gate 2 are ALL still
    required, and no roster is edited here.'
