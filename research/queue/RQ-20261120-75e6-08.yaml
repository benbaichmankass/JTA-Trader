question: Over 2020-07-01 .. 2026-10-15 23:59 on eth_pullback_2h (ETHUSDT 2h, live), on the NATIVE 2h candles of the Stage-0 evidence feed (keyless Binance Vision, the grid
  the leg trades), does removing the shipped trail decay (trail_decay_tight_mult 2.5, trail_decay_stall_bars 10) beat the leg as declared (A) by >= 0.02 R/trade on net R in
  >= 3 of 4 calendar folds within the drawdown bar (maxDD(OFF) <= maxDD(A) x 1.35)? R is on the full initial position's risk.
why_this_matters: 'The trail decay on eth_pullback_2h was chosen by M20 trainer sweeps, which replay the trainer''s ETHUSDT 5m/15m files resampled to 2h. Two defects make those
  sweeps a different measurement from the leg we trade: (1) the harness _resample used label/closed right, a one-sub-bar phase shift of every resampled bar (left/left reproduces
  199,185 of 199,259 native ETHUSDT 15m bars, right/right 4; relay #27551; fixed in PR #27566), and (2) the trainer crypto files are a different venue''s series (trainer files
  = Bybit linear perp, the live venue; evidence feed = Binance USD-M perp: close diff median 0.88 bps, p99 6.1, max 76.5 bps over 34,032 ETH 1h bars, no time offset; on trend_donchian_eth
  the venue alone moves the book from +4.26 R to -2.61 R, 422 of 451 trades matched by entry time; relay #27576) (PI-20261120-7ITMUEB1-0005). On trend_donchian_eth the shifted
  trainer grid read n 465 -35.73 R vs n 451 +4.26 R on native 1h. This unit re-reads the lever on the series the evidence and the live leg use; it changes nothing by itself.'
power:
  alpha: 0.05
  basis: 'Floor (1.96 + 0.8416)^2 / 0.45^2 = 38.76 -> 39 incumbent trades, as in RQ-20261023-a1f3-06; below it the unit grades indeterminate, never FAIL. Trade sequences autocorrelate:
    the fold majority carries the rest.'
  design: one_sample
  effect_units: sd
  expected_n: 100
