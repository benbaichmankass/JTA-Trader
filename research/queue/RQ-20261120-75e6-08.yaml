  rule: 'INDETERMINATE IF n(A) < 39, or IF OFF is byte-identical to A (the lever never fired). OFF PASSES iff net_r(OFF) > net_r(A) AND delta >= 0.02 R x n(A) AND folds_ge
    >= 3 of 4 AND maxDD(OFF) <= maxDD(A) x 1.35. PASS (removal beats keeping): a discovery on one window; the follow-up is ONE confirmation unit on a disjoint partition before
    any Tier-3 proposal to remove the lever, never a config edit from this unit. FAIL: the shipped lever stands on the native feed for this window. Thresholds are not changed
    after any result.'
  statistic: 'scripts/research/exit_lever_ablation.py --grade replace on eth_pullback_2h, window 2020-07-01 .. 2026-10-15 23:59 (4 equal calendar folds, a trade binned by entry
    time), net of the full cost stack the harness resolves per venue (execution_costs.resolve_cost_policy, recorded per arm as cost_stack). Arms fixed now: A = the leg as declared
    in config/strategies.yaml; OFF = A with trail_decay_tight_mult, trail_decay_stall_bars unset. Per arm: n, net_total_r, max_drawdown_r, net R per fold. delta = net_r(OFF)
    - net_r(A); folds_ge = folds with net_r(OFF) >= net_r(A).'
