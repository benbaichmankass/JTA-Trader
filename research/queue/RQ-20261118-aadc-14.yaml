  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 15
  why_runner: 'Needs the trade journal (account data, never committed), which the trainer syncs to data/trade_journal.db; lightgbm is in
    the trainer venv. The Stage-0 evidence and blind grades are committed.'
  basis: 'ESTIMATE: a few thousand rows, 5 small fits, 2,000 bootstrap draws twice.'
