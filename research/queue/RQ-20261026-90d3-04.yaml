id: RQ-20261026-90d3-04
title: 'Path-state trail gate (first test on this leg): do ER-gated and CHOP-gated tight trails beat the declared trend_donchian_1h exit?'
status: done
cadence: once
roadmap:
- L-ATM
- M20
theme: regime
priority: 2
kind: experiment
question: On trend_donchian_1h (BTC 1h Donchian on bybit_1 (soak book)) over the pinned window, does a trail that tightens to 2.5 x ATR once peak R >= 1.5 AND the path-state
  gate holds (ER over 6 bars < 0.25 / < 0.35, or CHOP over 6 bars > 0.75) beat the declared exit A by >= 0.02 R/trade in >= 5 of 6 folds AND beat the ungated tighten-every-trade
  control UT?
why_this_matters: 'Path-state units RQ-20261024-0142-07..09 and RQ-20261025-3947-01..08 cover the other crypto roster and prop legs; trend_donchian_1h is the remaining crypto
  leg with no path-state arm (grep exit_lever_ablation --trail-state-feature over research/queue, 2026-10-26). A pass here is a transfer data point for the family, not a roster
  case. Lane RESEARCH-AUTHOR-20261026-0030 (research SLO breach 23:15Z 2026-10-25, ops-flags #17895: runnable 42 < floor 71; the 23:16Z routine fire produced no PR). Operator
  2026-10-22: an idea that failed one test is not dead; it failed the first test.'
power:
  expected_n: 150
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d=0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo's standing E35 floor). expected_n=150 is an ESTIMATE from sibling units on this leg/window, not a measurement;
    below 39 the unit grades indeterminate, never FAIL.
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ2026102690d304-PATHSTATE
  registered_at: '2026-10-26'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg trend_donchian_1h --grade replace, window 2020-07-01 .. 2026-10-15 23:59, 6 equal calendar folds by entry time,
    net of the full cost stack the harness resolves per venue (execution_costs.resolve_cost_policy, recorded per arm as cost_stack). Arms fixed now: A = the leg as declared
    in config/strategies.yaml; candidates E25, E35, C75; ungated control UT. Per arm: n, net_total_r, max_drawdown_r, net R per fold.'
  rule: 'INDETERMINATE IF n(A) < 39 or IF every candidate arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C) > net_r(A) AND delta >= 0.02
    R x n(A) AND net R(C) >= net R(A) in >= 5 of 6 folds AND maxDD(C) <= maxDD(A) x 1.35 AND net_r(C) > net_r(UT) in >= 5 of 6 folds (so a PASS cannot be "any early action").
    PASS IF one or more pass: the best by net R is named and the follow-up is ONE confirmation unit on a disjoint partition (a PASS on one window is a discovery; the denominator
    is the number of arms in this unit), then a live-producer check and a Tier-3 declare PROPOSAL with the mirror in the same PR, never a config edit. FAIL IF none passes with
    n(A) >= 39: THIS arm grid is closed on trend_donchian_1h for this window and the family is NOT retired; the record names the arm that moved closest and the next variant.
    Thresholds and the arm grid are not changed after any result.'
  what_it_does_not_do: 'Edits no config and no roster, places no order, is not a promotion case. A PASS also needs a live producer for the lever (check the leg monitor) and
    a Tier-3 declare. The arm grid is the whole search: no arm is added after the run, and the baseline is the declared leg, not a tuned one.'
