decision_rule:
  id: RULE-RQ20261028A7C301-ADA-TPX-COMPLIANCE
  statistic: 'From scripts/research/exit_lever_ablation.py --grade replace on ada_pullback_2h, window 2020-07-01 .. 2026-10-26
    23:59 (6 equal calendar folds; a trade is binned by entry time), net of the full cost stack the harness resolves per
    venue (execution_costs.resolve_cost_policy; recorded per arm as cost_stack). Per arm from the harness''s own --json
    summary: n, net_total_r, max_drawdown_r, net R per fold, net_r_per_capital_day, by_outcome. BASELINE S4 = the leg as
    declared with the GEOM-B1 static target at its declared 4R (--tp-target-r=4), so S4 vs X6 isolates the REVISION. XU
    = the negative control (--tp-thesis unknown) and MUST equal S4 (exit-refinement SKILL: ''the negative control must equal
    the no-extension run''); it is not a candidate. Reported, not graded: tp_share = by_outcome.take_profit / n, lever_fired,
    net_r_per_capital_day.'
  rule: 'INDETERMINATE IF n(S4) < 39 or IF every candidate arm is byte-identical to S4 (the lever never fired). A candidate
    C PASSES iff net_r(C) > net_r(S4) (the harness grades exactly this with --delta-r 0 --delta-r-per-trade 0) AND folds where
    net_r(C) >= net_r(S4) >= 5 of 6 AND maxDD(C) <= maxDD(S4) x 1.35. This is the TP-doctrine COMPLIANCE bar (bea9 precedent):
    zero materiality, because compliance is the motive and a P&L-neutral prediction is the doctrine''s answer. Only X6 is
    a candidate. IF XU differs from S4 the run is INVALID (harness defect), not a verdict. PASS -> the doctrine read: if
    tp_share(X6) < 0.10 OR lever_fired is false OR net_r_per_capital_day(X6) < net_r_per_capital_day(S4), forward as ''P&L
    without a reachable prediction'', not a declare; otherwise it is the evidence record for ONE Tier-3 declare proposal
    on ada_pullback_2h (bybit_2 + bybit_portfolio + bybit_1, strict mirror equality) on row RM-AM-ADA-TPX. Thresholds are
    not changed after any result. A FAIL is ''first test failed -> variants queued'', never ''dead'' (research-ops § D).'
  what_it_does_not_do: Edits no config, places no order. The window overlaps the windows the leg's own entry params were
    chosen on, so independence is by lever (X6 was selected on xrp, not ada), not by date. tp_share is a reach proxy, not
    calibration.
