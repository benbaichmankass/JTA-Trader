theme: live_strategy
priority: 1
kind: experiment
question: 'On trend_donchian_eth_prop (prop leg; drawdown limits bind), does a swing or FVG level trail cut maxDD with a net-R give-up of at most
  3 R over the window, in at least 3 of 6 folds, at the venue cost stack? DIAGNOSIS of the first test (eba2-10, 005): MEASURED: the replace rule
  asked for +21.7 R (0.02 R x 1085) in 5 of 6 folds. RQ-20261022-005: LS175 dR +2.20, LF175 dR +0.67, maxDD 16.5 / 16.0 vs 22.0 (-25%/-27%), folds
  2 of 6. eba2-10: S25/S30/F30 dR -12.5 / -2.8 / -2.5, maxDD 16.9 / 18.5 / 20.8. MEASURED paired: LS175 changes 281 of 1080 matched entries, mean
  dR/entry +0.0019, paired t 0.13 (no R effect either way). The round-number arm LR is -62 R and is dropped. Class: wrong objective for a prop
  leg (the lever shifts drawdown, not R; the registered bar could only see R) plus a threshold set far above a measurable effect. The prop leg
  clears a SUPERSET of the ladder, so a DD cut is evidence only; the EV/survival gate still follows.'
why_this_matters: 'Operator rule 2026-10-22: a first-test fail is diagnosed and re-asked, never retired. Lane EXIT-FAILED-LEVERS-DIAG (2026-10-24),
  row EXIT-FAILED-LEVERS-DIAG, serves eba2-10, 005. Diagnosis and evidence: docs/research/exit-failed-levers-diag-2026-10-24.md. Looked before
  authoring (PLANNING s1): the queue was grepped for the same leg and lever family; no queued or done unit asks this exact arm set. Parents: research/queue/RQ-20261022-eba2-10.yaml,
  research/queue/RQ-20261022-005.yaml.'
power:
  expected_n: 1085
  min_detectable_effect: 0.09
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'n = 1085 is the MEASURED baseline trade count of trend_donchian_eth_prop in the parent verdict(s). Unpaired one-sample MDE = 2.8/sqrt(n)
    = 0.09 sd. Arms share most trades, so the paired difference is far tighter than that (MEASURED in the diag doc: paired sd 0.06-0.5 R per entry);
    the unit''s bar is stated in R and is not claimed to be detectable at the unpaired MDE. A unit whose lever touches a handful of trades is
    reported with its differing-trade count.'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-F08C-05
  registered_at: '2026-10-24'
  registered_before_run: true
  statistic: scripts/research/exit_lever_ablation.py --grade sweep on trend_donchian_eth_prop, window 2020-07-01 .. 2026-10-15 23:59, 6 calendar
    folds, dR and dDD vs A net of the harness venue-aware stack (fee 7.5 bps round trip, slippage 3.0 bps round trip, funding 1.0 bps per 8h window;
    MEASURED in the parent verdicts' cost_stack).
  rule: 'INDETERMINATE IF n(A) < 39. A candidate arm PASSES iff dR >= -3.0 R (net_r(C) - net_r(A) over the window) AND dDD <= 0 (maxDD(C) - maxDD(A),
    in R) AND it beats A in >= 3 of 6 folds. PASS IF any arm passes (best = highest dR): a LEAD, followed by ONE confirmation unit on a disjoint
    window with the same statistic and bar; only a confirmed pass becomes a Tier-3 PROPOSAL note on the owning checklist row, never a config edit.
    FAIL IF none passes with n(A) >= 39: this variant is closed on this window and the record names the arm that moved closest; the idea is not
    retired. Thresholds are fixed now and not changed after any result.'
what_it_does_not_do: 'Edits no config and places no order. Not a promotion case: a PASS is a discovery needing one disjoint-window confirmation.
  HARNESS CAVEAT (code-read 2026-10-24, scripts/backtest_pullback.py / backtest_trend.py): a stop or ratcheted trail that the bar trades through
  fills AT the stop price, not at a gap-open worse than it, and lever exits fill at the bar close; that flatters every arm in proportion to its
  stop exits, so it favours tight-trail arms. A PASS must be re-run gap-adjusted before any Tier-3 note. A drawdown cut is not a prop clearance:
  the firm DD simulation (comms/prop_survival) still applies after any lead.'
