id: RQ-20261024-f08c-05
title: 'Variant of eba2-10 / level-trail 005 (level trail failed on trend_donchian_eth_prop): PROP leg judged on DRAWDOWN at no material R cost,
  not on R gain'
status: queued
cadence: once
roadmap:
