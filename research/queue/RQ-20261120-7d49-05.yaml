# ONE factor changed: --target-mode trailing_median (unit-free target), plus a degeneracy clause. Rule registered BEFORE any run. Gates this adds or changes: none.
id: RQ-20261120-7d49-05
title: 'VARIANT (unit-free target): does vol-target SIZING with a trailing-median target improve trend_donchian_eth_prop''s net Sharpe by >= +0.10 without
  a worse drawdown, in >= 3 of 4 calendar blocks?'
status: queued
cadence: once
roadmap:
- L-REGIME
theme: regime
priority: 2
kind: experiment
practice_precedent: 'docs/research/idea-family-review-2026-10-16.md (family A: vol-SCALING, not gating, is where the documented momentum/trend gain lives
  -- Kim-Tse-Wald 2016, Cederburg et al. 2020, Barroso-Detzel on costs; Moreira & Muir 2017 volatility-managed portfolios) and docs/research/P1-vol-target-result-2026-06-26.md
  (the book-level +0.10..0.20 dSharpe that predates the full cost stack and was never pre-registered).'
question: 'On the trainer''s Bybit linear ETHUSDT bars aggregated open-stamped to 1h, with trend_donchian_eth_prop as declared in config/strategies.yaml
  (its exact Stage-0 evidence argv) over 2023-02-01 .. 2026-10-31 23:59, does continuous vol-target sizing of the leg''s daily book (backtest_vol_target.run_vol_target:
  target 10% annualized, 20/60 lookback blend 0.5, multiplier capped 0.5..1.5, monthly retarget, trades binned by exit day, venue-aware turnover + funding
  costs) raise the net annualized Sharpe by >= 0.10 over the unscaled book, with targeted maxDD <= baseline maxDD and a positive Sharpe delta in >= 3 of
  4 equal calendar blocks, at >= 100 trades?'
why_this_matters: 'trend_donchian_eth_prop trades on bybit_1 only (demo floor; programme node P2-R5 listed it as real money, accounts.yaml at authoring
  says demo floor). The regime programme''s on/off SKIP units are predicted to fail on trend legs (IDEA-REVIEW-1016 s11; the 11 donchian skip units were
  dropped before merge), so the open regime question for these legs is continuous SIZING, node P2-R5 and row IR-VOL-TARGET-SIZING-STAGE0. The corpus is
  Bybit-native per the manager''s 2026-11-20 03:52Z method decision (comms/research/VENUE-GAP-20261120/record.json: Binance-fed evidence overstates the
  Bybit book by a trade-weighted 0.0185 R/trade, 21 legs). Sizing is the RiskManager''s (MECE s 2.1): a PASS is evidence for a Tier-3 sizing proposal, never
  a config edit from this unit. The node asked for pairing with skip verdicts on the same window; no skip unit exists for this leg (the 65ff skip units
  cover pullback legs and trend_donchian_sol over 2022-10..2024-10, before the Bybit file starts), so this unit stands alone.'
power:
  alpha: 0.05
  power: 0.8
  design: one_sample
  effect_units: sd
  expected_n: 528
  min_detectable_effect: 0.122
  basis: 'expected_n = the leg''s Bybit trade count over 2023-02-01 .. 2026-11-15 in the venue-gap run (comms/research/VENUE-GAP-20261120/legs.jsonl: n_bybit
    528); MDE (1.96 + 0.8416) / sqrt(528) = 0.122 sd on per-trade R, reported for scale only. The registered rule is a point rule on the Sharpe delta plus
    a 3-of-4 calendar block majority, which carries the consistency requirement; below 100 trades the unit grades INDETERMINATE, never FAIL.'
  feasibility:
    source: none
    accrual_basis: Replays history on the trainer's resident Bybit files for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ202611208ef803-VOLTARGET-SIZING-TRAILMED
  registered_at: '2026-11-20'
  registered_before_run: true
  rule: 'Row IR-VOL-TARGET-SIZING-STAGE0 / node P2-R5''s rule, thresholds unchanged: INDETERMINATE IF n_trades < 100, or the Sharpe delta or a drawdown
    is unmeasurable, or more than 50% of re-target periods sit at a multiplier cap (overlay_degenerate: a constant scale, not vol targeting). PASS iff (a)
    dSharpe = Sharpe(targeted) - Sharpe(baseline) >= +0.10 net of the overlay''s costs, AND (b) maxDD(targeted) <= maxDD(baseline) (positive R magnitudes),
    AND (c) dSharpe > 0 in >= 3 of 4 equal calendar blocks of the daily book. FAIL otherwise. PASS: evidence for ONE Tier-3 sizing proposal for this leg
    (operator/RiskManager), after a confirmation on a disjoint span; never a config edit from this unit. FAIL: vol-target sizing is not the lever for this
    leg at these settings; closes this configuration, not the family. Thresholds are not changed after any result.'
  statistic: 'scripts/research/vol_target_verdict.py: the trainer''s Bybit file (finest file <= the timeframe, m20_fleet_exit_sweep.resolve_data) aggregated
    open-stamped to the leg timeframe; the leg''s Stage-0 argv (regime_debt_matrix.build_harness_cmd) with --emit-trades and --start/--end; backtest_vol_target.build_book
    -> run_vol_target(return_series) with resolve_overlay_costs(<symbol>); Sharpe = portfolio_combine.sharpe_annualized per arm and per block. Stated limit:
    the book series holds only days with >= 1 closed trade (portfolio_combine.combine_daily), so Sharpe and the 20/60 lookbacks are in trade-day units;
    both arms share them. Overlay settings are the row''s (IR-VOL-TARGET-SIZING-STAGE0 note: --basis exit --short 20 --long 60 --retarget monthly --cap-lo
    0.5 --cap-hi 1.5); target vol 0.10 is the overlay''s own default (the row names none).'
