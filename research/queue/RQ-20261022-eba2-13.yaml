  expected_n: 394
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'Floor (1.96 + 0.8416)^2 / 0.45^2 = 38.76 -> 39 incumbent trades; the incumbent read n 394 on this window (MEASURED,
    a sibling unit). Trade sequences autocorrelate: the fold majority carries the rest.'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-P1-Q13-XRPPB-BANK-FARRUNG
  registered_at: '2026-10-22'
  registered_before_run: true
  statistic: 'From scripts/research/exit_lever_ablation.py --grade replace on xrp_pullback_2h, window 2020-07-01 .. 2026-10-15
    23:59 (6 equal calendar folds; a trade is binned by entry time), net of the full cost stack the harness resolves per venue
    (execution_costs.resolve_cost_policy, recorded per arm as cost_stack). Per arm: n, net_total_r (full-position R), max_drawdown_r,
    net R per fold. A = the leg as declared in config/strategies.yaml. Per candidate C: delta = net_r(C) - net_r(A); folds_ge
    = folds with net_r(C) >= net_r(A); maxDD(C) vs maxDD(A).'
  rule: 'INDETERMINATE IF n(A) < 39, or IF every C arm is byte-identical to A (the lever never fired). A candidate C PASSES
    iff net_r(C) > net_r(A) AND delta >= 0.02 R x n(A) AND folds_ge >= 5 of 6 AND maxDD(C) <= maxDD(A) x 1.35. PASS IF one
    or more pass: the best by net R is named and the follow-up is ONE confirmation unit on a disjoint partition (a PASS on
    one window is a discovery), never a config edit. FAIL IF none passes: the declared exit stands for THESE arms on this
    leg; the idea is not retired (a family is not retired on one config) and the diagnosis in the unit decides the next variant.  Thresholds
    are not changed after any result.'
  what_it_does_not_do: 'Edits no config and places no order; a PASS needs a Tier-3 declare (and a live producer where the
    lever has none). HARNESS CAVEAT, stated: the bank rung is tested at the top of each bar BEFORE the stop test, so a bar
    printing both credits the bank (optimistic for C; a FAIL is robust, a PASS is checked by its confirmation). No monitor
    places a second TP leg for one entry, so a PASS also needs a live producer, the mirror in the same PR and a Tier-3 declare.
    No look at any of these arms was taken before registration.'
