id: RQ-20261022-eba2-13
title: 'Bank variant (first test failed -> variant): do FAR-rung, small-size partial exits (P25: 25% at 2.5 R; P33: 33% at
  2.0 R) or a partial exit COMBINED with an R-armed tight trail on the remainder (PT) replace the declared exit of xrp_pullback_2h
  on net R in 5 of 6 folds over 2020-07..2026-10?'
status: done
cadence: once
roadmap:
- L-ATM
- M20
theme: live_strategy
priority: 1
kind: experiment
question: 'The 50%-at-1R bank failed on this family (RQ-20261022-fd06-01/-02/-03). DIAGNOSIS of the first test (RQ-20261022-fd06-01/-02/-03):
  the census puts the paper pool''s median peak at about 0.9-1.1 R, so a rung at +1.0 R is reached by roughly half of all
  trades and the bank halves the winners that reach the 3-4 R target (ada_pb: 127 of 402 trades exit at the 4R TP; banking
  half at 1R forgoes about 1.5 R on each) -- the rung sat INSIDE the median trade, not out in the tail it was meant to protect.
  Practitioner guidance (NexusFi MFE scale-out, MQL5 article 24466) sets the first rung where a minority of trades reach and
  trails the remainder; the tested rung and the 50% size were the least tail-friendly choice. Untested: far rungs (2-3 R),
  smaller sizes (25-33%), and the combination with an R-armed tight trail on the remainder. Open-source caveat: no controlled
  study of scale-out versus full exit on trend systems was found; rungs fitted to MFE percentiles inherit fitting fragility
  (LuxAlgo), hence fixed, pre-registered rungs here. Over 2020-07-01 .. 2026-10-15 23:59, replace grade, 6 folds, do arms
  P25, P33 or PT (33% at 2.0 R, then the remainder''s trail tightens once peak >= 2.0 R) beat the declared exit by >= 0.02
  R/trade in >= 5 of 6 folds within the Path B drawdown bar? R is on the FULL initial position''s risk.'
why_this_matters: 'Operator directive 2026-10-22 and the operator''s ''split into two trades'' idea (IDEAS.md 2026-10-21):
  the first test answered ONE rung and ONE size. PT is the manager''s named combination (partial TP + R-triggered tight trail).
  SOURCES (practitioner/secondary unless stated; none is a validated result): Osler, ''Support for Resistance'', FRBNY Economic
  Policy Review 6(2), 2000 (newyorkfed.org/medialibrary/media/research/epr/00v06n2/0007osle.pdf) [primary]; NexusFi MFE scale-out
  guide; MQL5 article 24466 (R-multiple MFE percentile scale-out); LuxAlgo library ''Scaling Out'' and ''MAE/MFE Distributions'';
  TradingView ATR Chandelier and ADX exhaustion scripts; LuxAlgo/StrategyQuant on Kaufman''s efficiency ratio.'
