decision_rule:
  id: RULE-DFI3-HTF-TPTARGET4-20261114
  registered_at: '2026-11-14'
  registered_before_run: true
  statistic: exit_lever_ablation --grade stage0 --forming-1m-fetch, one run per arm per window; timeframe_lever_grade.py --family exit --confirm-prefix pre_.
  rule: 'AM-ML multiple-testing guard (2026-11-13 18:50Z): successive levers on one window fork the paths, so this rule NAMES the leg''s prior lever attempts on the
    record window and ALSO requires the pass to hold on the equal-length window before the record window, which no diagnosis or lever pick read. No fold bar is relaxed
    from the leg''s first DEMO-FLOOR-ITER unit. Prior lever attempts on this window: RQ-20261113-f251-01 (forming baseline, -23.37R), RQ-20261113-f251-10 (adx_min
    20/25/30 -- FAIL), RQ-20261113-f251-15 (long-only, -12.88R, 1/4 folds -- FAIL). ONE arm, ONE value (tp_target_r 4), chosen from the closed-bar map (RQ-20261110-73de-08)
    before this run; the confirmation window was read by f251-15''s baseline only, never by a lever pick. PASS iff the candidate passes its own Stage 0 on the record
    window (net_r > 0, n >= 30, >= 3/4 folds positive) AND beats the baseline arm''s net_r there, AND on the confirmation window 2024-11-13..2025-11-12 (the equal-length
    window BEFORE the record window, read by no diagnosis or lever pick) its net_r is > 0 and above the baseline arm''s. FAIL iff graded and either clause fails.
    INDETERMINATE otherwise (a run wrote no verdict, the baseline did not run, the candidate under its n floor on the record window). Arms, windows, folds and floors
    are fixed now.'
  what_it_does_not_do: Changes no config, roster, order or evidence record. A PASS is a data-backed Tier-3 proposal routed to the manager (tp_target_r 4 in place
    of tp_r 50; it is also the TP-doctrine fix); a FAIL is recorded on the lever map and the next candidate (pullback_frac 0.625, then vol_skip_below 0.2) waits on
    the manager.
  baseline: htf_pullback_trend_2h config-exact, forming, both sides, re-run in this unit on both windows.
