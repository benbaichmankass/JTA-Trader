decision_rule:
  id: RULE-RQ20261105-e9a1-02-ENTRY-EQUITY-CONFIRM
  registered_at: '2026-11-06'
  registered_before_run: true
  statistic: 'scripts/research/ml_entry_equity.py confirm --config B --tau 0.2: pooled restricted-long mean net R per decision, n, n_symbols, se (iid), month-clustered se (reported), by month, by symbol (top 10), over decisions whose close is in 2025-07-15 .. the last complete month before the run, model refit on rows < 2025-07-01 minus 10 days (train_end 2025-06-30). The read is claimed in the holdout ledger as family ENTRY-EQ and graded against bar = holdout_lock.bar_for(N) with N = the number of prior ENTRY-EQ reads on an overlapping window and symbol set plus one.'
  rule: 'INDETERMINATE IF pooled n < 30. PASS IF (a) pooled mean net R >= bar.point_t_min * se (N = 1: mean net R >= 0, the operator bar; a re-read raises it) AND (b) the dev pooled OOF mean net R of the selected config/tau, +0.1067, is > 0 (true as registered). FAIL otherwise. A PASS writes nothing by itself: comms/ml_universe/ml_entry.json and a held Tier-3 roster PR (alpaca_live + alpaca_portfolio, with the fixed 2/3 ATR bracket vs the live structure_exit fidelity caveat) follow only on a PASS. Thresholds never change after any result.'
  what_it_does_not_do: 'No re-selection of config or tau, no sizing, no config change, no order. The window is read once; a re-read is allowed only at the deflated bar and is recorded. DECLARED: the window overlaps dates other models have seen on this population (bdc2-01: 11 ETFs 2025-02..09 under served v1; a41f v1: 2025-10..2026-10); nothing in this model was tuned on it. FIDELITY: the harness models the fixed 2/3 ATR bracket, not the live structure_exit, so roster-promotion-evidence-guard C5 does not clear on it alone.'
