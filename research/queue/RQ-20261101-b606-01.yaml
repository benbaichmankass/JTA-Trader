decision_rule:
  id: RULE-20261101-b606-01
  registered_at: '2026-11-01'
  registered_before_run: true
  statistic: 'Per arm and seed: n, mean gross, cost and net R per decision at the frozen entry tau; seed mean and range; per-fold and per-calendar-year net; traded-5 slice beside the pooled frozen-60 population.'
  rule: 'SMOOTH: the winning gate''s neighbours on the grid are each within 0.01 of it and the response is monotone over the three gates on one side of it (an island is rejected). SMOOTH: the winning cell''s
    SL-neighbour and TP-neighbour cells (one grid step) are each within 0.01 of it, otherwise it is an island and is rejected. A lever arm WINS iff, net of the full cost stack on the dev folds, on the pooled
    frozen-60 population (the traded five are reported beside it, never instead): (1) every fold keeps >= 1000 scored decisions (else INDETERMINATE); (2) the mean over seeds 7/11/13 beats the base arm by
    >= 2 x the base seed range (base range 0.0034 (MEASURED 2026-11-01, v1 frozen recipe at a fixed tau on the pooled 60 symbols over the dev folds: per-seed means +0.0063..+0.0097, n about 72k; traded-5
    range 0.0058), recomputed from this run''s base arm if larger); (3) it is better than the base in >= 6 of 8 dev folds; (4) its sign is the same in >= 3 of 4 calendar years. A winner is only a CANDIDATE:
    it is selected on dev alone and goes, with the other winners, into ONE combined held-out read (a later unit, ML-BAR-ONE-READ); no arm of this unit reads a held-out or sealed window. Thresholds are not
    changed after any result.'
  what_it_does_not_do: Reads no sealed or held-out window (dev folds only), serves nothing, changes no config or live symbol list, places no order, sizes nothing.
