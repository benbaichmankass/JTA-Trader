id: RQ-20261101-b606-01
title: 'ENTRY lever 3b, cost-aware gate: does abstaining when the estimated cost per R is high lift the dev mean, and where does the dose-response stop? One factor, dev folds only'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: experiment
practice_precedent: 'T1, M6 (docs/reference/trading-and-model-practice-principles.md): purged + embargoed walk-forward; shadow-feature (Boruta-style) controls so a model that cannot reject noise columns
  is not trusted to admit real ones.'
question: 'Round 1 (b602-01, 2026-11-01): abstaining in the lowest vol24 tercile lifts the dev mean +0.0089 -> +0.0220; attribution shows the gross edge is the same in every vol tercile (+0.0748 low vs
  +0.0724 high) while cost per R is 0.0922 vs 0.0466, so the loss is cost share, not edge. EXPLORATORY first look (run BEFORE this rule was written, so not evidence for a candidate): gate on estimated cost
  per R of 0.10 / 0.08 / 0.06 gave +0.0112 / +0.0126 / +0.0205 (base +0.0089), monotone. This unit registers the grid {0.03, 0.04, 0.05, 0.06, 0.08, 0.10} (0.03-0.05 not yet seen). Arm: abstain when est_cost_R
  = k / atr_pct exceeds the gate, k = median over the OTHER dev folds of (realised cost per R x atr_pct), no label of the scored fold used; entry model, tau 0.10 and brackets frozen. Three seeds. Dev folds
  only.'
why_this_matters: 'Operator 2026-11-01: 20 features is a regression equation, not algorithmic trading; manager 2026-11-01 ~12:03Z: a family ablation at +0.010 cannot admit anything when the recipe overfits
  with any extra column, so fix the recipe, then the columns.'
