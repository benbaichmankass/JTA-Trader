  basis: 'MEASURED 2026-11-01: exploratory gate 0.06 delta +0.0115 over base on n about 39.5k decisions per seed (45% fewer than base), 6 of 8 folds, 3 of 4 years (2022 -0.004); threshold 0.0068.'
