  basis: 'MEASURED 2026-11-26 (local, CPU): TabICLv2 2.2.0 with the shipped regressor checkpoint fit + predict on 3,000 rows in 3.0 s, offline (model_path, no download). The replay trains on 646,766-749,324 rows per refit at full n; T4 time and memory at that context are NOT measured (the first run measures them). --gpu-arm-budget-min 290 records windows past the budget as unavailable (INDETERMINATE).'
