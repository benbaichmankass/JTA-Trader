question: 'RQ-20261022-007 read PASS on the log-loss clause only (pooled ll_gain 0.0137, 5 of 6 folds; r2_gain -0.0038), carried
  by ada_pullback_2h and xrp_pullback_2h; trend_donchian_eth_4h read FAIL (0 of 6 folds) and trend_donchian_xrp_4h underpowered.
  Its time-disjoint confirmation RQ-20261022-1f8b-01 is INDETERMINATE (58 trades open at k < 100; the perps'' klines start
  2019-12, so no longer disjoint window exists). The only confirmation still available is by LEG: with the same features,
  label, k=6 and thresholds, does adding chop_k, er_k, shape_k, early_k raise out-of-sample R2 on giveback by >= 0.02 or lower
  log-loss by >= 0.01, in >= 4 of 6 calendar folds, pooled over eth_pullback_2h, sol_pullback_2h, avax_pullback_2h, trend_donchian_sol_4h,
  trend_donchian_ada_4h, trend_donchian_avax_4h?'
why_this_matters: 'Gate for the whole giveback lever line: rung 2 (a metric-TRIGGERED bank or tight trail, blocked unit RQ-20261022-eba2-07)
  is only worth building if the metric information is real beyond the four legs it was picked on. A single-window, single-clause
  PASS is a discovery (research-ops step D). Real money is not touched: these are the sibling legs on bybit_1 / soak, the
  nearest independent sample of the same two strategy families.'
power:
