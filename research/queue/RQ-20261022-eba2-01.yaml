  min_detectable_effect: 0.15
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'Same arithmetic as RQ-20261022-007: the r2_gain bar is a partial correlation of about 0.14, stated as 0.15 sd, floor
    (1.96 + 0.8416)^2 / 0.15^2 = 349 pooled trades. Expected about 900 pooled trades still open at bar 6 across six legs (007
    read 275 and 352 open at k on ada_pullback_2h and xrp_pullback_2h; the siblings trade at comparable frequency; NOT measured
    on these legs, so a pooled n < 100 reads INDETERMINATE under the rule, never FAIL).'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-P1-Q11-R1B-TRANSFER
  registered_at: '2026-10-22'
  registered_before_run: true
  statistic: 'From scripts/research/path_metric_giveback.py (the SAME script, features, label, ridge/logistic models and k=6
    as RQ-20261022-007), legs eth_pullback_2h, sol_pullback_2h, avax_pullback_2h, trend_donchian_sol_4h, trend_donchian_ada_4h,
    trend_donchian_avax_4h, window 2020-07-01 .. 2026-10-15 23:59, 6 calendar folds by entry time, leave-one-fold-out, pooled
    over legs: r2_gain = R2_oos(full) - R2_oos(base); ll_gain = logloss_oos(base) - logloss_oos(full); fold wins = folds where
    the gain > 0; net of the venue cost stack the harness resolves per leg.'
  rule: 'INDETERMINATE IF pooled n < 100. PASS IF (r2_gain >= 0.02 AND r2 fold wins >= 4 of 6) OR (ll_gain >= 0.01 AND ll
    fold wins >= 4 of 6): the metric TRANSFERS, and with 007''s PASS it clears rung 2 (RQ-20261022-eba2-07 unblocks on the
    build row HARNESS-METRIC-TRIGGER) -- never a config change. FAIL otherwise: the 007 PASS does not transfer, rung 2 is
    not built on it, and the volatility-controlled re-ask (eba2-04) is the only remaining rung-1 unit. Per-leg verdicts are
    reported, not graded. Thresholds are not changed after any result.'
what_it_does_not_do: 'A label study, not a lever: edits no config, places no order, tests no exit. Window OVERLAPS 007''s
  (same years) -- it is disjoint by leg, not by time, and says so. Volatility is an uncontrolled confound (a choppier path
  also swings more R); eba2-04 controls it. Harness paths are not live paths. No look at these legs'' path metrics was taken
  before registration.'
