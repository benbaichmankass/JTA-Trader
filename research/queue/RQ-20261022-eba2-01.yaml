title: 'Programme 01 Q11 rung 1b (TRANSFER): do the bar-6 path metrics predict peak-to-exit giveback beyond bars-in-trade
  and current R on six legs RQ-20261022-007 was NOT selected on (eth/sol/avax pullback 2h, sol/ada/avax Donchian 4h), 2020-07..2026-10,
