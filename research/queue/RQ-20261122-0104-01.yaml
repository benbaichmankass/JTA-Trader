id: RQ-20261122-0104-01
title: 'ml-exit-head-donchian-1h FEATURE lever on the 8-symbol BACKTEST-SOURCE corpus (public Binance-vision USD-M 1h klines (Bybit REST is 403 from runners)): does feat_exh
  beat the champion by +0.03 R per OOS trade, and what n does the widened corpus reach?'
status: done
cadence: once
roadmap:
- L-ML-LIVE
theme: ml_health
priority: 2
programme: P2
kind: experiment
iteration:
  subject: ml-exit-head-donchian-1h
  subject_kind: ml_model
  from_result: RQ-20261122-fa22-02
  verdict_read: indeterminate
  diagnosis: 'fa22-02 produced no verdict (producer_failed x3: HTTP 403 from api.bybit.com on every kline request from GitHub runners; dispatcher retry cap reached). Harness
    defect, not a result. Context: fa22-01 (3 symbols, published candles, n 909) feat_exh d +0.009 CI [-0.033,+0.051]; ad6a-03 (trainer, 8 symbols) feat_exh target_coverage
    0.8926 < 0.90 -> could_not_look and feat_path_only d -0.044 CI [-0.079,-0.009].'
  search: same legs/arm/folds/rule on public Binance-vision candles (driver --candle-source binance_vision); perp basis vs Bybit not measured, stated in the result
  attempt: 3
  due_by: '2026-12-01'
  map_entries:
  - research/levers/ml-exit-head-donchian-1h.yaml#features
question: 'On rows rebuilt in-run from public Bybit linear-perp 1h klines (2020-06 to now) for BTC, ETH, SOL, LINK, BNB, XRP, ADA and AVAX (harness trades of trend_donchian
  on each symbol, full venue cost policy, no journal rows), 3 folds, 7-day embargo, lookback 500: is the pooled paired per-trade replayed R of feat_exh vs the champion >= +0.03
  R with the CI lower bound > 0, and is pooled n_oos >= 8,200?'
why_this_matters: 'The corpus-widening test of row ML-EXITHEAD-CORPUS-WIDEN on public market data, available now: it measures the n an 8-symbol multi-year backtest corpus reaches
  (the trainer build fa22-03 is the live-aligned twin) and reads the contrast at that n. The result de-risks ad6a-03. SUPERSEDES RQ-20261122-fa22-02 (retired: three producer_failed
  runs on Bybit 403).'
evidence_class:
  holdout: walk_forward
  claim: model_quality
power:
  expected_n: 8200
  min_detectable_effect: 0.03
  effect_units: r_multiple
  sd: 0.97
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: n ESTIMATED from the f1a9-04 trade rate (pooled n_oos 2,403 over 8 legs x 3 folds; the span of that corpus is not stated in the record); multi-year backtest rows are
    expected to reach the 8,200 needed for MDE 0.03 (80% power, sd 0.97 MEASURED), the run measures the actual n. MDE (1.960+0.842) x 0.97 / sqrt(8200) = 0.030.
  feasibility:
    source: none
    accrual_basis: Replays history; nothing accrues. n is the corpus size the run measures; a run below the rule's n floor is INDETERMINATE, not a verdict.
baseline:
  definition: The holding_pays champion (the shipped recipe, train_exit_head.FEATURES, unchanged hyper-parameters) retrained on the SAME fold training rows and replayed on
    the SAME OOS trades with the live predicate; each trade net of fee + slippage + funding. Hold (no head) is reported as context.
  net_of_cost: true
decision_rule:
  id: RULE-RQ20261122-0104-01-EXITHEAD-FEATURES-WIDE
  registered_at: '2026-11-22'
  registered_before_run: true
  baseline: the holding_pays champion on identical folds and trades
  statistic: 'exit_head_label_bakeoff.py (via the driver) --arms none --feature-arms feat_exh --z 1.96 --pass-dr 0.03: pooled over legs and folds, per OOS trade d = replayed_r(arm)
    - replayed_r(champion) on identical trades, replay and cost; mean, SE (one trade = one cluster), CI at z 1.96. One arm graded (denominator 1). Reported: per-leg n_oos,
    target_coverage, fired counts, rows_by_source / corpus facts.'
  rule: 'An arm is could_not_look if target_coverage < 0.90. PASS iff pooled n_oos >= 1500 AND mean d >= +0.03 R/trade AND CI lower bound > 0. FAIL iff pooled n_oos >= 8200
    (the n at which +0.03 is resolvable at sd 0.97, 80% power) AND CI upper bound < +0.03. INDETERMINATE otherwise; the verdict then reports n_oos and the n still needed. Thresholds,
    legs, arm, folds, embargo, lookback and rows source are not changed after any result. NOTE registered before the run: the FAIL bar (pooled n_oos >= 8200) is likely unreachable
    on this corpus (ad6a-03 reached n_oos 2,406 on 8 symbols); the expected reading is a CI on d at n ~3k, INDETERMINATE unless feat_exh clears the PASS bar, and the CI upper
    bound is the evidence for the family review.'
  pass_action: ONE confirmation before any proposal (the held-out-symbol design or a disjoint window), then a data-backed Tier-3 proposal (export + annotate-only pin) to the
    manager.
  fail_action: Record feat_exh as tested at power on research/levers/ml-exit-head-donchian-1h.yaml (features family); the head has no in-hand feature lever at +0.03 R on donchian
    1h and the next step is the family review, never a re-run.
  what_it_does_not_do: Edits no config, exports or serves nothing, places no order, adds no gate. No close authority for any exit model. Backtest-source rows are a different
    population from the trainer live-aligned corpus (stated in the result).
practice_precedent: 'Size the test to the decision: a pre-registered minimum effect with power computed from the measured variance, rather than a bar the data cannot reach
  (docs/reference/trading-and-model-practice-principles.md).'
intervention_controls:
  hold_to_bracket: true
  hold_to_bracket_note: every arm keeps the leg's own entry, stop and trail; only the head's close decision differs, replayed by the live predicate
  matched_random:
    draws: 200
    note: 'not computed by this unit; the champion''s own matched random truncation control is RQ-20260927-002 / 78fc-03. Reported here as context only: hold (no head) per
      arm.'
  best_static:
    grid:
    - holding_pays (champion, shipped features, fixed)
    - feat_exh
    excludes_test_folds: true
    note: each fold trains on rows with bar_t <= fold start - 7 d only; nothing is tuned on a test fold
  bootstrap_group: trade
compute: cpu_long
