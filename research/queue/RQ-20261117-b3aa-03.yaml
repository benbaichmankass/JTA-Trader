practice_precedent: 'M13 (docs/reference/trading-and-model-practice-principles.md): a holdout re-read is allowed, recorded and graded on a stricter deflated bar; T1 regime-robustness per sub-period.'
question: 'qqq_pullback_1h: on the pre-development window 2018-06-01..2021-10-31, do trend_lookback 75 (bf1b-03 discovery, 2411-01 confirmation PASS) and pullback_lookback 15 (2411-02) beat the config-exact
  control net of the full cost stack in >= 3 of 4 folds, net positive in >= 3 of 4 folds, with no fold above 50% of the arm''s net, under a grade whose clauses equal the registered rule?'
why_this_matters: 'ITERATION (research-ops 2026-11-17 1006Z). RULE/HARNESS MISMATCH found reading the rows: 2411-01 PASS: trend75 46.97 R vs A 35.56 R, n 101, both folds, maxDD 4.82 vs 8.22; 2411-02 FAIL:
  pb15 43.07 vs 35.56, n 96, both folds won, maxDD 9.03 vs 8.22 (+0.81 R). pb15 failed ONLY on the harness sweep grade''s maxDD(C) <= maxDD(A) clause, which is NOT in 2411-02''s registered rule; the registered
  rules'' regime-robustness clause (net positive in >= 3 calendar years, no year > 50%) was never computed because the harness emits only 2 folds and no per-year table (comms/research/<unit>/<run>/measurement.json
  has no by_year). So the mechanical verdicts on these confirmations do not equal their registered rules in either direction. This unit re-reads the same arms on the same window with 4 folds (roughly calendar-year
  sub-periods: 2018-06..2019-04, ..-2020-01, ..-2020-09, ..-2021-10) and a grade whose clauses are exactly the rule below (replace grade, dd tolerance 10%). On PASS: the leg''s lever change goes to the
  manager as a Tier-3 proposal with BOTH reads disclosed (discovery 1830 d + pre-dev). On FAIL: the lever stays a window-specific response in the map. M13 re-read: deflated bar via the arm count disclosed.'
power:
  expected_n: 100
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'control n MEASURED on this exact window: 101 (qqq) / 134 (spy) in 2411-0x; per fold ~25-35; n < 25 grades INDETERMINATE.'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched dukascopy candles for a pinned window; nothing accrues.
evidence_class:
  holdout: holdout_window
  claim: edge
decision_rule:
  id: RULE-RQ20261117-b3aa-03-PREDEV-REREAD-4F
  statistic: scripts/research/exit_lever_ablation.py --grade replace on qqq_pullback_1h, arms A, trend_lookback_75, pullback_lookback_15, window 2018-06-01 .. 2021-10-31 23:59, dukascopy lane, one continuous
    harness pass, net of the full cost stack the harness resolves for the venue, 4 equal calendar folds, --dd-tol-frac 0.10; per-fold net R of every arm reported in measurement.json. Arms fixed now (all
    previously selected), nothing re-selected.
  rule: 'Per arm C: PASS iff net_r(C) > net_r(A) AND folds where C >= A (ties count) >= 3 of 4 AND maxDD(C) <= 1.10 x maxDD(A) AND n(A) >= 25 (these clauses are the harness replace grade) AND, read from
    the same measurement.json fold rows, C is net positive in >= 3 of 4 folds with no single fold above 50% of C''s total net R. The unit PASSES iff some arm passes all clauses (the grader''s pass on the
    harness clauses with a failed fold clause is graded FAIL by the reading session). INDETERMINATE iff n(A) < 25 or the producer failed. FAIL otherwise. M13: this window has been read once before for each
    arm (2411-0x); deflation = the disclosed cumulative arm count on the lever (qqq trend 3, pullback 2; spy trend 3). Thresholds fixed now.'
  registered_at: '2026-11-17'
  registered_before_run: true
  what_it_does_not_do: Edits no config, roster or record; places no order. A PASS is a lead for a Tier-3 NOTE with both reads disclosed, not a promotion.
  baseline: control arm A = the leg config-exact, same run.
