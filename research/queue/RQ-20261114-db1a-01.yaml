question: 'Round 3 re-ran six closed-bar responders on the forming bar and none passed (f251-10, -14, -19, -21, -22, -23). Is the inversion the DECISION BAR (a closed-bar edge
  needs the close) or the WINDOW (closed passes were measured over 2020..2026, the forming re-runs over one year)? On the same candle CSV and 1m feed, over the record window
  2025-11-13..2026-11-12 and the equal-length window before it, net of the full cost stack: does any closed-bar arm (decision_bar: closed alone, or with one lever already run
  forming) pass Stage 0, beat the forming incumbent and hold on the confirmation window?'
why_this_matters: 'Manager ruling 2026-11-14 04:07Z: top priority before any further per-leg lever. A pass makes a per-leg decision_bar switch a data-backed Tier-3 proposal
  (the shape the operator approved for trend_donchian_eth_4h / sol_4h in #25853); a fail with same-sign closed lever deltas says the levers fail on the window, not the bar,
  and the census readings stand.'
