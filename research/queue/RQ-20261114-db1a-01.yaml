decision_rule:
  id: RULE-DBINV-FORMING-INVERSION-20261114
  registered_at: '2026-11-14'
  registered_before_run: true
  statistic: exit_lever_ablation --grade stage0 --forming-1m-fetch, ONE run per leg per window carrying every arm on the same feed; decision_bar_inversion_grade.py applies
    the rule.
  rule: 'AM-ML multiple-testing guard: this rule NAMES every prior lever attempt on these record windows (RQ-20261113-f251-07 (avax_4h long-only, FAIL), -08 (eth_prop short-only,
    FAIL), -09 (avax_pullback_2h short-only, FAIL), -10 (htf adx_min 20/25/30, FAIL), -14 (eth_prop vol_skip_above 0.8, FAIL), -15 (htf long-only, FAIL), -19 (htf tp_target_r
    4, FAIL), -21 (avax_4h vol_skip_below 0.3, FAIL), -22 (avax_pullback_2h adx_min 30, FAIL), -23 (eth_prop pullback_frac 0.625, FAIL)) and requires every pass to hold on
    the equal-length window before the record window (2024-11-13..2025-11-12). No fold bar is relaxed. Arms fixed now, per leg: F = config-exact forming (the incumbent); C
    = decision_bar: closed; C_<x> = decision_bar: closed plus ONE lever already run forming in round 3 at its forming value (htf: long-only, adx_min 30, tp_target_r 4; eth_prop:
    short-only, vol_skip_above 0.8, pullback_frac 0.625; avax_pullback_2h: short-only, adx_min 30; avax_4h: long-only, vol_skip_below 0.3). A closed arm PASSES iff on the record
    window net_r > 0, n >= the leg''s f251 floor (30; avax_4h 20), >= 3/4 folds positive and net_r > F''s, AND on the confirmation window net_r > 0 and > F''s. Leg PASS iff
    any closed arm passes; FAIL iff every closed arm is graded and none passes; INDETERMINATE iff a run or F is missing or a non-passing arm is under its n floor. Unit: indeterminate
    if any leg is, else pass if any leg passes, else fail. C is the primary (a bare decision_bar switch); a passing C_<x> is a two-change proposal and is reported as such,
    never as C.'
  what_it_does_not_do: 'Changes no config, roster, order or evidence record. A leg PASS is a data-backed Tier-3 decision_bar proposal routed to the manager, who takes it to
    the operator; the evidence record would be re-measured on the closed basis with build_strategy_evidence first (as #25853 did). Descriptive outputs (bar effect C-F, C/F
    entry Jaccard, closed lever delta C_<x>-C) carry no verdict.'
  baseline: each leg config-exact on the forming bar (F), re-run in this unit on both windows.
