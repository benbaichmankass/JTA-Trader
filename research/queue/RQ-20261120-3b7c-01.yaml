  rule: 'INDETERMINATE IF n(OFF) + n(ON) < 175. PASS IF n(OFF) + n(ON) >= 175 AND net R(ON) > net R(OFF) AND mean R(ON) >= mean R(OFF) - 0.3 AND net R(ON) > net R(OFF) with each arm''s single worst trade removed. FAIL otherwise. The first three clauses are RULE-RQ0928-001-ICTSCALP-HTF-FILTER-WIRE unchanged; the fourth is the programme node''s outlier clause. Thresholds are not changed after any result.'
  pass_action: 'record the HTF filter as confirmed (loss-cutting, not edge) on ict_scalp_sol_5m in research/levers/ict_scalp_sol_5m.yaml; at most a Tier-3 keep note through the manager; never a config edit.'
  fail_action: 'record the first-window PASS as NOT confirmed on ict_scalp_sol_5m; no claim; the lever family is not retired (scripts/research/family_retirement_policy.yaml); any change to the live filter state is a separate Tier-3 act.'
