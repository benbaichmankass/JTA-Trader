question: 'trend_donchian_eth_4h and trend_donchian_sol_4h decide on the FORMING 4h bar (no decision_bar key) and AM-OPS measured both re-emitting a package about
  every 60 s inside one forming bar (2026-11-13 03:25-04:01Z: 34 + 33 packages, drifting entries; tradeify_1 SOL cancelled and re-ticketed at 03:58Z; no duplicate
  fill); the closed-bar control trend_donchian_eth_prop emitted once. Replayed with the same tool as the 2026-10-22 DECISION-BAR-MATCH run (scripts/research/decision_bar_match.py,
  grading unchanged), is closed >= forming within the tool''s band on each leg, net of the full cost stack?'
why_this_matters: 'Both legs trade prop money (tradeify_1, velotrade_1) and the bybit_1 demo; the re-emit/entry-chasing cost exists only on the forming bar and the
  backtest cannot see it, so the rule breaks ties toward closed. PRIOR (read, not re-derived; docs/research/evidence/decision-bar-match-2026-10-22.json): eth_4h to
  2026-10-17 read NO_MATERIAL_DIFFERENCE / SWITCH_TO_CLOSED, forming +143.32 R (n 446) vs closed +130.92 R (n 295), forming winning 4/6 folds; the operator kept forming.
  sol_4h was never measured and its record reads approximate. Answers PROP-FORMING-BAR-REEMIT (AM-OPS).'
