decision_rule:
  id: RULE-FORMING-VS-CLOSED-4H-20261113
  registered_at: '2026-11-13'
  registered_before_run: true
  statistic: 'scripts/research/decision_bar_match.py, grading unchanged: per leg, forming_bar_pooled_regrade.leg_run (closed and forming arms, config-exact to config/strategies.yaml,
    full cost stack, Binance USD-M 1m proxy); 6 equal calendar folds of [first decision bar, --end]; dR_k = net R(closed) - net R(forming), floor max(1.0 R, 0.02
    R x max n); better = CLOSED_BETTER / FORMING_BETTER (>= 4 folds, <= 1 opposite, matching sign of dR_full) else NO_MATERIAL_DIFFERENCE; verdict from the better
    bar + RULE-D1 per arm on the committed record window (restate). The improvement folds run over the full fetched history through --end (the tool''s own window,
    as on 2026-10-22); RULE-D1 reads the committed record''s window.'
  rule: 'Copied verbatim from row FORMING-VS-CLOSED-ETH4H-SOL4H (AM-ML, 2026-11-13 ~14:45Z, before any run): PRE-REGISTERED RULE (written 2026-11-13 ~14:45Z, before
    any run), RULE-FORMING-VS-CLOSED-4H-20261113:

    - Per leg, scripts/research/decision_bar_match.py with its existing grading UNCHANGED (the same tool as 2026-10-22, for comparability). Arms: forming (4h decision
    replayed from Binance USD-M 1m) vs closed, the same leg config, the full cost stack, on each leg''s committed record window extended to the run date.

    - Outcomes: verdict SWITCH_TO_CLOSED, or better=NO_MATERIAL_DIFFERENCE, means closed >= forming within the tool''s band, so propose decision_bar: closed to the
    manager as Tier 3, with the record.

    - Ties go to closed on purpose: the backtest does not model the live re-emit and entry-chasing cost, which only the forming bar incurs.

    - Forming MATERIALLY better (the tool''s better=FORMING) means keep forming, and propose to AM-OPS an entry-hold / no-re-ticket fix for the chasing.

    - Nothing changes config without the manager.

    - Fixed now; not changed after any result. || AMENDED BEFORE ANY RUN (AM-ML, 2026-11-13 14:53Z, recorded on the row note; rule id kept): the tie case is narrowed
    -- SWITCH_TO_CLOSED, or NO_MATERIAL_DIFFERENCE with closed PASSING RULE-D1 on the record window -> propose decision_bar: closed (Tier 3, through AM-ML to the
    manager); NO_MATERIAL_DIFFERENCE with closed FAILING RULE-D1 -> no closed proposal, the tool verdict reported as-is (KEEP_FORMING_REBASE_RECORD if forming passes,
    DEMOTE_CANDIDATE if neither passes); forming materially better -> unchanged (keep forming; entry-hold fix to AM-OPS). || E5 ENCODING (reporting only; the grading
    is unchanged): per leg, pass = propose closed, which is exactly the tool verdict SWITCH_TO_CLOSED; fail = no closed proposal (FORMING_BETTER, or a tie / closed-better
    where closed fails RULE-D1); indeterminate = not graded. Unit: indeterminate if any leg is; else pass if both pass; else fail. Each leg''s better, match_verdict,
    folds and RULE-D1 facts are carried in its record.'
  what_it_does_not_do: 'Changes no config, roster or order. A switch to decision_bar: closed is a Tier-3 proposal AM-ML makes to the manager with this record; an
    entry-hold fix is a proposal to AM-OPS.'
  baseline: 'The incumbent: each leg''s live forming-bar decision, replayed config-exact on the same 1m history and cost stack (paired per fold).'
  amended_before_run:
    at: '2026-11-13T14:53:00Z'
    by: AM-ML (session_01AFoLuJkXEM1EigH9mSfz1F)
    source: row FORMING-VS-CLOSED-ETH4H-SOL4H note, 2026-11-13 14:53Z
