  a10d-01 graded, each matched to its own rebuilt bar exactly as vol_serve_path_diff does: are the six live fc_* values equal (1e-6)
  to the rebuilt stride-1 fc_* of the own bar (k=0), of one other bar (k in -2..+2), close only (1e-3), or none? Does k=0 plus the single
  most common nonzero k cover at least 98% of matched rows?'
why_this_matters: 'a10d-01 FAILED: the stride-1 rebuild removed the 75% staleness, yet agreement stayed 0.9736 BTC / 0.9307 SOL and
  forecast_fc reproduces 100% of the flips. Every non-forecast column agrees, so the closes agree and the forecast differs (fc_ret_med
  differs > 1e-3 on 44.9% of BTC bars). src/runtime/forecast_live.py (MAX_FORECAST_LAG_BARS = 1) states that serving the previous
  bar''s forecast is the normal in-flight case. If that explains the gap, no replay reproduces live labels until it models the serve
  lag, and the heads are trained on own-bar fc_* but scored on lagged fc_* about half the time (a train/serve skew on a live advisory
  input). a10d-02 and every D2 cell money test stay blocked until this is known.'
why_not_inferential: 'This estimates no effect. Each matched row is classified by an exact equality test against a fixed set of offsets;
  the rule reads a share of an enumerated population (about 980 BTC + 900 SOL rows), not a sample statistic. An expected_n or a
  minimum detectable effect would be theatre.'
population: 'live per-bar rows of btc-regime-15m-lgbm-fc-pcv-v2 and sol-regime-15m-lgbm-fc-pcv-v2 in comms/live_parity/vol_serve_rows_20261118
  (2026-11-09..18, the most recent 1000 per head), matched to the stride-1 rebuild that a10d-01 wrote on the trainer.'
decision_rule:
