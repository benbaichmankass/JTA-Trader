    scorer waits for its own bar''s forecast, or the heads train on the served lag; each choice is its own pre-registered test. No
    serving change ships from this unit.'
  fail_action: 'RESIDUAL: the none / near_only rows name what else differs (magnitude per column). Next step is observability: the live
    publisher stamps its window end ts and a window hash into the artifact (Tier 1 tooling), so the next diff compares windows directly.'
  what_it_does_not_do: Serves, trains, stages and promotes nothing; edits no config and no serving code; places no order; adds no gate.
