    Reported: lag -1 streak lengths, scoring second-into-bar by class, per-column |diff| quantiles of near_only and none rows.'
  rule: 'Per head: INDETERMINATE if matched rows < 200 or the rebuilt dataset is missing (read_state no_data); LAG_EXPLAINS iff
    share(exact_k0) + share(the single most common nonzero exact_k) >= 0.98; RESIDUAL otherwise. Unit: LAG_EXPLAINS only if both heads
    are; RESIDUAL if any head is; else INDETERMINATE. verdict.json carries LAG_EXPLAINS as pass, RESIDUAL as fail, INDETERMINATE as
    indeterminate (verdict_label keeps the name). Tolerances, offsets and the 0.98 bar are fixed now.'
  pass_action: 'LAG_EXPLAINS: (1) re-grade the a10d-01 parity with each live row matched to the rebuilt fc_* at its measured lag (a
