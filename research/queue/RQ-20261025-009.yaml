question: 'Is the shipped regime-head LightGBM over-capacity: does a much smaller one (100 trees, 7 leaves,
  min_child_samples 200) stay within 0.01 macro_f1 of it on the 1h published shards? Same rows for every
  arm, purged 5-fold walk-forward CV (embargo 24) plus the holdout after 2026-07-12, the six shared features,
