why_this_matters: 'If a 7-leaf model matches the 31-leaf shipped config within the non-inferiority margin,
  the shipped heads carry capacity that the data does not reward, which is the first suspect for the persistent
  score drift on the advisory heads (RQ-20261011-6e85-01 / 65ff-27 ask what the drift IS; this asks whether
  the model is brittle enough to produce it). A smaller head is also cheaper to retrain daily. Non-inferiority
  margins follow the programme''s own convention (plan Q4: +-0.01 pass, -0.03 fail).'
