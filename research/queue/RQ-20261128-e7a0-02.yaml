  needs_gpu: false
  peak_memory_gb: 4.0
  est_minutes: 60
  basis: 'Estimate: 4,076 trades x 3 triggers x 200 random books on CPU; the first run replaces it.'
  why_runner: Replays committed corpora and candles on CPU.
