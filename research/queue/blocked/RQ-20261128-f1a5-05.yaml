id: RQ-20261128-f1a5-05
title: 'DISJOINT read of the REMOVED cell trend_donchian:chop/calm/long (BTC): on trades entered after the removal (>= 2026-11-29), would vetoing that cell have earned R (re-author it) or lost R (the removal stands), the fa22-04 rule unchanged?'
status: blocked
cadence: once
theme: regime
priority: 2
roadmap:
- L-ML-LIVE
programme: P2
kind: experiment
question: Under the same labels (btc-regime-15m-lgbm-fc-pcv-v2) and the same per-leg authored cells, on trend_donchian BTCUSDT harness trades ENTERED ON/AFTER 2026-11-29 (disjoint from RQ-20261120-d7c2-01's 1460 d window that fa22-04 graded, and after the removal), would the removed chop/calm/long OFF-cell have added_r = -(sum net R of the trades it would veto) > 0 at n >= 25 with control_p <= 0.05 and >= 2/3 of active folds (RE-AUTHOR it), or <= 0 at n >= 25 (the removal stands, confirmed out of time)?
why_this_matters: 'fa22-04 (RQ-20261122-fa22-04) FAILED this cell on d7c2-01''s committed trades (n >= 25, added_r <= 0) and a Tier-3 removal is held as #29682. The operator held it on 2026-11-28; the reason given (the live exit head omitted from the replay) does not apply, because trend_donchian''s exit_head_action is annotate, so live never closes on the head and the replay without it matches live. What does remain is that the FAIL was measured on a single window. OPERATING-PLAN § 2 "A number measured only over the grading window never promotes" asks for disjoint data; this unit is that read, on trades entered after both the fa22-04 window and the removal.'
