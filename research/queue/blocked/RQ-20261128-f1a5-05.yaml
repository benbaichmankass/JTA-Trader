  ref: scripts/research/ml_vol_label_replay.py replay-refit + scripts/research/build_market_features_span.py (branch lane/ml-primary-replay-refit, ML-PRIMARY, 2026-11-28)
  what: 'The refit labeller mode this unit runs. It is a Tier-1 tooling PR opened the same day; nothing here waits on data.'
  clears_when: 'replay-refit is on main (ml_vol_label_replay.py --help lists replay-refit); then git-mv this file to research/queue/ with status queued.'
baseline:
  arm: no_veto
  definition: 'the same leg''s harness trades with the cell switched off, each trade''s net_r net of the FULL cost stack (fee + slippage + funding per symbol, stamped by the harness); control = a matched random drop of the same leg and side (the fa22-04 control, unchanged)'
  source: research/results/RQ-20261122-fa22-04/45015566879.jsonl
power:
  expected_n: 25
  min_detectable_effect: 0.84
  effect_units: metric
  sd: 1.5
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'INFERRED: the rule''s floor is n >= 25 vetoed trades (fa22-04 MIN_N). At n 25 and per-trade sd ~1.5 R (d7c2-01 power basis), a one-sample test at alpha 0.05 detects |mean| ~0.84 R/trade at power 0.8; smaller effects read INDETERMINATE, said so. The run is a confirmation of an existing FAIL, so a FAIL here needs only added_r <= 0 at the floor (the fa22-04 rule).'
  feasibility:
    source: none
    accrual_basis: 'Nothing accrues: BTC 15m history from 2020-03 is built in the run by build_market_features_span.py (Bybit linear-perp klines, the adapter clamps to listing); trend_donchian made ~60 BTC harness trades a year (34 in 2026-06-01..11-19), so ~160 trades in 2.7 years; the cell''s share is unknown until the run.'
decision_rule:
  id: RULE-RQ-20261128-f1a5-05
  registered_at: '2026-11-28'
  registered_before_run: true
  statistic: 'regime_cell_marginal_grade.py --policy comms/research/RQ-20261128-f1a5-05/regime_policy_pre_29682.yaml on a d2_family_consumer_run replay of trend_donchian BTCUSDT tagged with the REFIT labels (labels exist only on 2020-03-25..2022-11-22, so only trades entered there carry a vol label and are graded), for the ONE cell trend_donchian chop/calm/long: n vetoed, added_r, control_p (matched random drop), active folds and wins. Plus the refit FIDELITY read in labels manifest `fidelity` (refit vs live labels on 2022-11-23..2026-11-27). Other cells reported, not graded.'
  rule: 'FIRST the fidelity gate: if fidelity.state != label_faithful (agree < 85% or < 1000 overlapping bars) the run is INDETERMINATE (label_not_live_faithful), never a verdict. Otherwise the fa22-04 per-cell rule, unchanged, for this cell only: FAIL (the removal stands, confirmed out of time) iff n >= 25 AND added_r <= 0. PASS (RE-AUTHOR calm: { trend_donchian: { long: off } }) iff n >= 25 AND added_r > 0 AND control_p <= 0.05 AND >= 3 active folds AND wins >= ceil(2/3 of active). INDETERMINATE otherwise, including n < 25. A PASS is a Tier-3 input, never an apply. The window is read once and registered in the read ledger (scripts/research/read_ledger.py counts the result row; a holdout_lock claim does not apply because the labeller span is AFTER the window, a backward out-of-time read, stated). Fixed now; not changed after a run.'
  what_it_does_not_do: Edits no config, no regime_policy cell, no roster and no registry artifact (the refit head lives only in the run); places no order.
practice_precedent: 'M2, M4 (docs/reference/trading-and-model-practice-principles.md): a rule registered before the run, one factor; the same harness and per-cell rule as RQ-20261122-fa22-04 (.claude/skills/regime-selectivity/SKILL.md Rule 1); OPERATING-PLAN § 2 "A number measured only over the grading window never promotes" (disjoint confirmation).'
