blocked_on:
- kind: data
  ref: trend_donchian BTCUSDT harness trades entered >= 2026-11-29 that fall in the chop/calm cell (long side)
  what: 'The fa22-04 floor is n >= 25 vetoed trades in this ONE cell. The whole BTC trend_donchian book produced 34 ungated trades in 2026-06-01..2026-11-19 (RQ-20261119-c8e2-02, all cells), so a single cell needs many months of new data.'
  clears_when: 'A read-only run of scripts/research/regime_cell_marginal_grade.py --since 2026-11-29 --policy comms/research/RQ-20261128-f1a5-05/regime_policy_pre_29682.yaml on a fresh d2_family_consumer_run replay reports n >= 25 for trend_donchian chop/calm/long (research-ops checks it monthly; the first look is due 2027-03-01).'
baseline:
  arm: no_veto
  definition: 'the same leg''s harness trades with the cell switched off, each trade''s net_r net of the FULL cost stack (fee + slippage + funding per symbol, stamped by the harness); control = a matched random drop of the same leg and side (the fa22-04 control, unchanged)'
  source: research/results/RQ-20261122-fa22-04/45015566879.jsonl
power:
  expected_n: 25
  min_detectable_effect: 0.84
  effect_units: metric
  sd: 1.5
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'INFERRED: the rule''s floor is n >= 25 vetoed trades (fa22-04 MIN_N). At n 25 and per-trade sd ~1.5 R (d7c2-01 power basis), a one-sample test at alpha 0.05 detects |mean| ~0.84 R/trade at power 0.8; smaller effects read INDETERMINATE, said so. The run is a confirmation of an existing FAIL, so a FAIL here needs only added_r <= 0 at the floor (the fa22-04 rule).'
  feasibility:
    source: none
    accrual_basis: 'New BTC trend_donchian harness trades after 2026-11-20 accrue with time; the cell''s share of them is unknown until the first read.'
decision_rule:
  id: RULE-RQ-20261128-f1a5-05
  registered_at: '2026-11-28'
  registered_before_run: true
  statistic: 'scripts/research/regime_cell_marginal_grade.py --since 2026-11-29 --policy comms/research/RQ-20261128-f1a5-05/regime_policy_pre_29682.yaml on a fresh replay (ml_vol_label_replay labels, then d2_family_consumer_run --cells-per-leg for trend_donchian), for the ONE cell trend_donchian chop/calm/long: n vetoed trades entered >= 2026-11-29, added_r, control_p (matched random drop), active folds and fold wins. The other authored cells are reported, not graded here.'
  rule: 'The fa22-04 per-cell rule, unchanged, applied to this cell only. FAIL (the removal stands, confirmed out of time) iff n >= 25 AND added_r <= 0. PASS (the cell earns its keep out of time: RE-AUTHOR it, restoring calm: { trend_donchian: { long: off } }) iff n >= 25 AND added_r > 0 AND control_p <= 0.05 AND >= 3 active folds AND wins >= ceil(2/3 of active). INDETERMINATE otherwise, including n < 25 (underpowered). A PASS is a Tier-3 input (re-authoring the cell), never an apply; a FAIL closes the question. Fixed now; not changed after a run.'
  what_it_does_not_do: Edits no config, no regime_policy cell and no roster; places no order. It only reads trades entered after both the fa22-04 window and the removal.
practice_precedent: 'M2, M4 (docs/reference/trading-and-model-practice-principles.md): a rule registered before the run, one factor; the same harness and per-cell rule as RQ-20261122-fa22-04 (.claude/skills/regime-selectivity/SKILL.md Rule 1); OPERATING-PLAN § 2 "A number measured only over the grading window never promotes" (disjoint confirmation).'
