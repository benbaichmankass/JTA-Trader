id: RQ-20261128-f1a5-05
title: 'DISJOINT read of the REMOVED cell trend_donchian:chop/calm/long (BTC) on 2020-03..2022-11-22 history, labelled by a head refit ONLY on 2022-11-23..2026-11-27: would vetoing the cell have earned R (re-author it) or lost R (the removal stands), the fa22-04 rule unchanged?'
status: blocked
cadence: once
theme: regime
priority: 2
roadmap:
- L-ML-LIVE
programme: P2
kind: experiment
question: On trend_donchian BTCUSDT harness trades ENTERED 2020-03-25..2022-11-22 (before RQ-20261120-d7c2-01's window 2022-11-23..2026-11-04 that chose the cell and fa22-04 graded), with vol labels from the btc-regime-15m-lgbm-fc-pcv-v2 RECIPE refit only on 2022-11-23..2026-11-27 (fc_* dropped; it does not exist that early), would the removed chop/calm/long OFF-cell have added_r = -(sum net R of the trades it would veto) > 0 at n >= 25 with control_p <= 0.05 and >= 2/3 of active folds (RE-AUTHOR it), or <= 0 at n >= 25 (the removal stands, confirmed out of time)? The read counts only if the refit labels agree with the LIVE head's labels on >= 85% of 2022-11-23..2026-11-27 bars.
why_this_matters: 'fa22-04 (RQ-20261122-fa22-04) FAILED this cell on d7c2-01''s committed trades (n >= 25, added_r <= 0) and #29682 removed it (operator 2026-11-28 ~09:12Z, after the hold reason was corrected: trend_donchian''s exit_head_action is annotate, so the replay without the head matches live). What does remain is that the FAIL was measured on a single window. OPERATING-PLAN § 2 "A number measured only over the grading window never promotes" asks for disjoint data; this unit is that read, on history BEFORE the choosing window with labels from a head refit only AFTER it (RESEARCH-NO-WAIT-FOR-DATA, operator 2026-11-28).'
iteration:
  subject: ml-btc-router-cells
  subject_kind: ml_model
  from_result: research/results/RQ-20261122-fa22-04/45015566879.jsonl
  verdict_read: fail
  diagnosis: 'fa22-04 graded 8 authored BTC OFF-cells on the committed d7c2-01 trades (1460 d to 2026-11-20, full cost stack) and FAILED one: trend_donchian chop/calm/long lost R when vetoed (its vetoed trades were net positive). The cell is removed (#29682); the open question is whether that loss holds out of time or was a feature of the one window. The replay is faithful (exit head annotate on this leg since 2026-10-29), so the only lever is the sample; history before the choosing window, labelled by a labeller fit only on the later span, is that sample now (no wait).'
  search: 'out-of-time sample WITHOUT waiting: the same cell, rule and harness on the pre-2022-11-23 BTC history, labelled by the head recipe refit on the disjoint later span (ml_vol_label_replay replay-refit)'
  levers:
  - regime_gating
  attempt: 3
  due_by: '2027-06-30'
  map_entries:
  - research/levers/ml-btc-router-cells.yaml
blocked_on:
