  subject: ml-btc-router-cells
  subject_kind: ml_model
  from_result: research/results/RQ-20261122-fa22-04/45015566879.jsonl
  verdict_read: fail
  diagnosis: 'fa22-04 graded 8 authored BTC OFF-cells on the committed d7c2-01 trades (1460 d to 2026-11-20, full cost stack) and FAILED one: trend_donchian chop/calm/long lost R when vetoed (its vetoed trades were net positive). The removal is held; the open question is whether that loss holds out of time or was a feature of the one window. The replay is faithful (exit head annotate on this leg since 2026-10-29), so the only lever is the sample: trades after 2026-11-28.'
  search: 'out-of-time sample: the same cell, same labels, same rule, on trades entered >= 2026-11-29 only'
  levers:
  - regime_gating
  attempt: 3
  due_by: '2027-06-30'
  map_entries:
