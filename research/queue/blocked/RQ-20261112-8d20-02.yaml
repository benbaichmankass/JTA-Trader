question: 'Sibling of RQ-20261112-8d20-01 for the equity real-money leg ml_entry_eq_struct (alpaca_live + alpaca_portfolio; 1h decisions, long only,
  tau 0.25, 5-seed structure ensemble of RQ-20261107-98e3-06). Split its taken decisions on the confirming window 2025-07-15..2026-10-31 by the DAILY
  trend at the decision: daily bars = the RTH 1h bars of each completed session BEFORE the decision day (point in time); direction D = sign(+DI14 -
  -DI14), strength ADX14 (Wilder). A long is AGAINST when D = -1. ADX buckets < 25, 25..40, > 40. Robustness (reported): daily EMA20 vs EMA50.'
why_this_matters: 'The crypto leg question applied to the equity real-money leg the dispatch named ("check ml_entry_eq_struct the same way if its data
  allows"). The data needs the Alpaca read-only keys, which only the research runner holds.'
