    in the E5 shape. The realised-label joiner (ML-HEAD-AGREEMENT-JOIN) is NOT needed here (the shards carry regime_label).'
  clears_when: conformal_abstain_eval.py merged with a synthetic-exchangeable self-test showing nominal coverage; then git mv this unit to research/queue/,
    status queued, run.command [python3, scripts/research/conformal_abstain_eval.py, --unit, '{unit}', --out, '{out_dir}'].
