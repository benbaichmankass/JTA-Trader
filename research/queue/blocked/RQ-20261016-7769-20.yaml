  usd_at_stake_per_month: 80
  confidence: 0.2
  basis: 'stand-in: completes the confirmation set of the one event-surprise lead that could seed an event-scored conviction axis for the M28 sleeve (alpaca_options_paper);
    information value, not a P&L claim'
