  confidence: 0.05
  bucket: ai_trader
  basis: 'stand-in, not a measurement: as RQ-20261030-f18f-01; prior P(clear) below 10%.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 20
  basis: 'estimate: about 860 events x 200 draws of at most 24 bars.'
