# Hand-authored 2026-11-18 by lane PRACTICE-REFRESH-20261118 (Tier 1, frontier-research practice refresh), dispatched by the manager
# (operator Ideas-inbox item: book-level risk around macro events). Decision rule registered BEFORE any run. Gates this adds or changes: none.
id: RQ-20261118-a5b3-01
title: 'Book-level macro-event exposure: do trades held THROUGH a scheduled fomc / cpi / nfp release carry a worse net mean or left
  tail than the same legs'' other trades, and does flattening the same-direction book 60 min before the release beat HOLD and a matched
  random-time flatten under RULE-AM-RISK-ADJUSTED-V1? (BLOCKED on EVENT-SPAN-HISTORY)'
status: blocked
cadence: once
kind: experiment
theme: live_strategy
priority: 2
roadmap:
- L-ATM
programme: P1
origin: new_hypothesis
practice_precedent: 'T15 (new 2026-11-18) + T1 + T14 (docs/reference/trading-and-model-practice-principles.md): practice measures a
  book''s exposure to a scheduled catalyst with a short-horizon statistical model and weighs the cost of closing the tilt against the
  risk [S79 Acadian, PRAC]; scheduled releases raise conditional volatility, decisions more than minutes [S80 Rosa NY Fed; S81 Nechio-Wilson
  FRBSF]; the intervention is graded against hold AND a matched random intervention (T1).'
question: 'Over the committed Stage-0 per-trade corpora (comms/strategy_evidence/ltr_corpus, 8 legs, each row net of fee + slippage
  + funding), tagging each trade by whether it was open at a high-impact scheduled US release (fomc DECISION, cpi, nfp; fomc minutes
  tagged separately and reported, not graded): (a) is the net-R mean and p10 of event-spanning trades different from the same leg''s
  non-spanning trades, and (b) does the book that closes every open trade on the side that carries the majority of open risk at T-60
  min (re-entry none; the trade ends there at the next bar open, net of cost) cut maxDD or weekly CVaR5 by >= 15% at <= 0.05 R per baseline
  trade, beat 200 matched random-time flattens of the same trades, and hold in >= 4 of 6 calendar folds?'
why_this_matters: 'Operator Ideas-inbox item 2026-11-18: "we carried 12+ same-direction shorts into FOMC tonight". What exists, read
  2026-11-18 on main e66d3b333: the only event-risk input on the trade path is src/news/news_events.py (event_risk = impact x proximity,
  per symbol, at ENTRY, reduce-only, never a blackout); nothing reads the BOOK''s combined same-direction exposure into a release (BOOK-CORR-VIEW-LTR,
  queued since 11-01, is the packet view without an event clock); every live reviewer flags "one beta bet" and can only defer to an
  account risk layer that has no such input. Decisions it changes: on PASS, a Tier-3 proposal for a book-level pre-event action class
  (advice-only first, per ARCHITECTURE-CANONICAL "Active management"); on FAIL, the concern is answered with numbers and the reviewers
  stop raising it as a risk; on (a)-only (spanning trades worse but flattening does not pay), the finding goes to sizing research (event_risk
  weights), not to a flatten rule. Premortem: crypto legs span relatively few release hours, so the effect may be under the n floor
  (INDETERMINATE is then the honest answer).'
power:
  expected_n: 4076
  min_detectable_effect: 0.05
  effect_units: R
  sd: 0.8
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'INFERRED, not measured: 4,076 committed corpus trades (as RQ-20261117-43b6-03); the share that spans a release is UNKNOWN
    until EVENT-SPAN-HISTORY lands (rough prior 10-25% for multi-hour holds); at ~600 spanning trades and sd 0.8 R the paired read detects
    ~0.09 R, so the mean clause may be underpowered and V1''s n_floor 39 governs the grade.'
  feasibility:
    source: none
    accrual_basis: Replays committed corpora and a point-in-time event history; nothing accrues.
evidence_class:
  holdout: none
  claim: risk_reduction
decision_rule:
  id: RULE-RQ-20261118-a5b3-01-BOOK-EVENT-FLATTEN
  registered_at: '2026-11-18'
  registered_before_run: true
  statistic: 'Per pooled corpus and per leg: (a) mean and p10 net R of event-spanning vs non-spanning trades with a trade-grouped bootstrap
    95% CI of the difference; (b) the FLATTEN book (close the majority-risk side at the next bar open after T-60 min for every graded
    release) vs the HOLD book, against 200 matched random-time flattens (same trades, same count of flattens, random hours outside +-6
    h of any graded release), all net of the full cost stack.'
  rule: '(b) is graded by RULE-AM-RISK-ADJUSTED-V1 (am_risk_adjusted.grade_risk_adjusted: R1 r_cost <= 0.05 R per baseline trade; R2
    maxDD cut >= 15% OR weekly CVaR5 cut >= 15%; R3 >= 4 of 6 calendar folds hold; n_floor 39 flattened trades) plus R4: beats >= 95%
    of the 200 random-time books on the R2 metric, plus L1: the pass survives dropping the leg with the largest favourable contribution.
    PASS: (b) clears R1-R4 and L1 (a SCREEN pass on per-trade R books; on PASS the same arm is re-read on the book-level $ simulation,
    BOOK-SIM-REAL-SIZER done 2026-11-13, before any proposal). FAIL: (b) fails R1, R2 or R3, or R4. INDETERMINATE: fewer than 39 flattened
    trades, the event history does not cover the corpus window (read_state could_not_look for the uncovered span), or L1 fails. (a)
    is REPORTED with its CI, never graded. One candidate arm (n_comparisons 1); fomc minutes and T-30 / T-120 offsets are reported as
    sensitivity, not graded. Fixed now; not changed after a run.'
  baseline: HOLD = each corpus row's recorded net_r (the leg's own exit, untouched).
  what_it_does_not_do: 'Advice-only research: serves, promotes or applies nothing; adds no gate; changes no config, mandate, roster
    or risk cap; places no order. A book-level event action is a Tier-3 proposal on its own evidence.'
intervention_controls:
  hold_to_bracket: true
  matched_random:
    draws: 200
    same_cell: true
  best_static:
    grid:
    - hold
    - flatten_majority_side@T-60m
    - flatten_majority_side@T-30m
    - flatten_majority_side@T-120m
    excludes_test_folds: true
    how: leave-one-calendar-fold-out over V1's 6 folds; REPORTED, never a pass clause
  bootstrap_group: trade
compute: cpu_light
routing:
