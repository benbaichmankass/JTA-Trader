  - --start
  - '2020-07-01'
  - --end
  - 2026-10-15 23:59
  - --days
  - '2330'
  - --reference-corpus
  - comms/research/RQ-20261024-09a6-01/40143286436/first_passage_paths_4b_c03_b
  - --parity-basis
  - trade
  - --holdout-start
  - '2017-09-01'
