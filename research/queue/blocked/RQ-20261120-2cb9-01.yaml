question: Does the setup meta-label head setup-candidates-metalabel-rostered-paper-v1 (the RQ-20261119-3e98-01 model state, unchanged) at decision threshold 0.48 (selected by RQ-20261119-2780-04
  STEP 1 on training-side OOF scores; NOT re-selected) pass P1 clauses (a)-(e) on the MEASURED rostered-paper rows (event_source live_paper AND strategy in research/manifests/roster59-20261119.txt
  AND pnl_provenance measured) whose ts is after 2026-11-20T00:00:00Z, i.e. rows the 2780-04 read (all 698 measured rows of v024) never saw?
why_this_matters: 'RQ-20261119-2780-04 PASSED P1 on 698 measured rostered-paper rows (value +0.0362 R/opp vs matched random -0.0018; bootstrap lower bound +0.0012 at the 0.625 percentile,
  the fourth read of that population; take rate 41 of 698). Its registered pass action is ONE confirmation before any Tier-3 proposal. A time split of the same 698 rows (the first draft,
  PI-20261120-7ITMUEB1-0003) is not independent: every row was already read at 0.48. Only rows entered after the v024 build are. Two caveats stated at authoring: (1) the model''s TRAINING
  side is 92.2% backtest rows (5,164 of 5,598 in v024), which code-read says are built on Binance-vision candles (PI-20261120-7ITMUEB1-0007), while the eval rows are Bybit paper trades;
  the venue-gap record (comms/research/VENUE-GAP-20261120/record.json) measured a 0.0185 R/trade harness-level gap between the venues; (2) the 2780-04 point estimate was selected after
  three earlier reads of the family, so it is likely inflated (winner''s curse) and this unit''s power below is an upper bound.'
