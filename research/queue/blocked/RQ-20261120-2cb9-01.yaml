    --lb-pct 2.5 (the registered 95%: a DISJOINT population read once at a fixed threshold, so no multiplicity deflation). P1 clauses (a)-(e) exactly as RULE-RQ20261119-2780-04-P1-MEASURED-PAPER-THR.'
  rule: 'INDETERMINATE (no grade step) IF the build holds < 600 filtered eval rows after the cut, or the model state / threshold differs from the above. Otherwise PASS iff (a) AND (b)
    AND (c) AND (d) AND (e); FAIL iff (a) fails OR (b) fails; INDETERMINATE otherwise ((c)/(d)/(e) not met or unit_fallback share > 10%). PASS: the confirmation the 2780-04 pass action
    requires; evidence for ONE Tier-3 proposal to act on the head on the demo floor, never a change from this unit. FAIL: the 2780-04 pass does not replicate out of time; recorded on
    the family; the head is not acted on. Reported, never graded: the measured+estimated read at the same cut, the per-symbol table, and the venue-restricted companion below. Thresholds,
    filter, cut and model are not changed after any result.'
  companion_reported_ungraded: 'VENUE-RESTRICTED COMPANION (manager 2026-11-20 02:47Z): the same recipe retrained with its TRAINING rows restricted to outcomes from the live venue (the
