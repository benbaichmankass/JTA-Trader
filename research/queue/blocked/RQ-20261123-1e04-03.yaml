question: After an index flush (close >= 2.0 ATR14 below its 5-day mean AND a lower low than the prior 20 sessions, then the first up-close), does buying the 3x bull
  ETF with the stop at the flush low mapped through the ETF and a calibrated TP earn positive net R net of decay, versus flat and the same trigger executed in the
  1x index ETF?
why_this_matters: 'This is the mirror case: down-markets also end, and a flush entry is the only bear-market way to be long the bull ETF; the 1x baseline separates
  timing edge from leverage.'
