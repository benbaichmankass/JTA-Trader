  registered_at: '2026-11-23'
  registered_before_run: true
  statistic: 'index_signal_etf_harness: flush rule as stated, entry next open in the bull ETF, stop = flush low mapped through the ETF, TP calibrated K*, hold cap
    10 sessions; net_r, n, maxDD, per-fold, decay drag; arm B = the same trigger in the 1x index ETF. Cost stack: fee 0 + 5 bps slippage per side (2x slippage re-read),
    the ETF price series itself (embeds daily-rebalance decay and expense ratio over the hold), no funding. TP doctrine: the TP is the index-structure target mapped
    to the ETF (index move x leverage sign), a real predictive TP at entry, calibrated by tp_prediction_derive on the in-sample span, never tp_r 50.'
  rule: PASS IFF n >= 25 AND net_r(3x) > 0 AND net_r(3x) > net_r(1x) AND >= 3 of 4 folds > 0 AND net_r > 0 under 2x slippage. INDETERMINATE if n < 25. FAIL otherwise.
    Parameters fixed now.
  what_it_does_not_do: Changes no config.
  baseline: Flat; and the same trigger in the 1x ETF.
