question: 'fs06-01 could not grade T1 (+0.026 on 41-1,275 decisions per fold) or T4 (+0.008, one cell under 1000) because the fixed raw-net-R tau grid does not fit rescaled scores. Arms (R0 params, features
  S0, the per-fold score-quantile threshold of d507-01, E1-style K=3 seed ensemble): T0 raw net R, T1 market-neutral, T4 first-passage score; the noise control S1 (9 noise columns) is run for each. Three
