# Authored 2026-11-01 by lane ML-RECIPE (Tier 1) from the fs05-01/fs06-01 diagnosis. Decision rule registered BEFORE any run. Gates: none.
id: RQ-20261101-d507-01
title: 'ENTRY variance and threshold fix: does a K-seed score ensemble with a per-fold score-quantile threshold make the recipe gradeable (every fold >= 1000 decisions) and lift the dev mean above the seed
  noise, with noise controls? Dev folds only'
status: blocked
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: experiment
practice_precedent: 'T1, M6 (docs/reference/trading-and-model-practice-principles.md): purged + embargoed walk-forward; shadow-feature (Boruta-style) controls so a model that cannot reject noise columns
  is not trusted to admit real ones.'
question: 'fs05-01/fs06-01 (2026-11-01) found: across-seed range of the pooled LOFO mean is 0.012-0.040 (14x the assumed 0.0017); regularised arms (R1 +0.029, R2 +0.025 on S0) and T1/T4 cannot be graded
  because the raw-net-R tau grid leaves folds under 1000 decisions. Arms (features S0 = 20 baseline columns, noise set S1 = S0 + 9 noise columns, S2 = S0 + F1..F5; targets T0 raw and T1 market-neutral,
  T4 first-passage score): E0 single baseline model (reference, tau grid as in fs05-01); E1 mean score of K=3 baseline models (seed sets {7,11,13}, {17,19,23}, {29,31,37} = three independent draws; E0 is
  each draw''s first member); E2 E1 with R1 parameters; E3 E1 with R2 parameters. Threshold: instead of the fixed grid, the decision score of a row is max(long, short) of the ensemble mean, and the threshold
  of a fold is the q-quantile of that fold''s OWN test-row scores (labels are never used to set the value), with q chosen leave-one-fold-out from {0.80,0.85,0.90,0.95,0.98} by the pooled mean over the OTHER
  folds (n >= 1000 there), as tau was before. This fixes the decision share per fold by construction and is deployable with a trailing score window. The three draws give the spread. About 54 model walks
  of about 2.5 minutes. No sealed window is read.'
why_this_matters: 'Operator 2026-11-01: 20 features is a regression equation, not algorithmic trading; manager 2026-11-01 ~12:03Z: a family ablation at +0.010 cannot admit anything when the recipe overfits
  with any extra column, so fix the recipe, then the columns.'
power:
  expected_n: 60000
  min_detectable_effect: 0.01
  effect_units: metric
  sd: 1.0
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'MEASURED 2026-11-01 (fs05-01): across-seed range of the pooled LOFO mean 0.012-0.040 per cell; ensembling K=3 should cut it roughly with sqrt(3); this unit measures it.'
  feasibility:
    source: none
    accrual_basis: Replays public history through 2025-09-30 (dev folds only); nothing accrues.
decision_rule:
  id: RULE-20261101-d507-01
  registered_at: '2026-11-01'
  registered_before_run: true
  statistic: 'Per arm, set and draw: n and sum of net R at the leave-one-fold-out quantile threshold; pooled mean; across-draw range (spread); noise-control delta S1-S0; per-fold comparison with E0; min
    decisions per fold.'
  rule: 'GRADEABLE: every fold has >= 1000 scored decisions in every cell, else the arm is INDETERMINATE. NOISE-IMMUNE: mean over draws of (S1 - S0) >= -spread, spread = across-draw range of that arm''s
    S0 pooled mean. WIN: a gradeable noise-immune arm whose mean-over-draws S0 beats E0''s S0 by >= 2 x E0''s across-draw range AND is better in >= 6 of 8 folds. RESULT: the winning arm with the highest
    S0, or ''no ensemble/threshold fix: the pooled bar-level recipe has no gradeable edge on the dev folds'' (then the lever left is the label/horizon family and the universe). Thresholds are not changed
    after any result.'
  what_it_does_not_do: Reads no sealed window (dev folds only), serves nothing, changes no config, places no order, sizes nothing.
  min_n: 1000 dev decisions per fold
