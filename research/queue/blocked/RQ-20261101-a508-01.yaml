# Authored 2026-11-01 by lane ML-RECIPE (Tier 1) from the v1 dev-fold seed-spread attribution. Decision rule registered BEFORE any run. Gates: none.
id: RQ-20261101-a508-01
title: 'ENTRY v1 traded-slice test: is the five-symbol dev shortfall (-0.041 net R/decision vs +0.007 pooled) a coin effect, a cost-share effect or a cadence effect, and which traded symbols does the live
  go/no-go rest on? Dev folds only'
status: blocked
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: experiment
practice_precedent: 'T1, M6 (docs/reference/trading-and-model-practice-principles.md): purged + embargoed walk-forward; shadow-feature (Boruta-style) controls so a model that cannot reject noise columns
  is not trusted to admit real ones.'
question: 'v1 frozen recipe (20 features, baseline params, tau 0.10) on the DEV folds: traded-5 (BTC, ETH, XRP, ADA, SOL) -0.041 (n about 5,500 per seed, seed range 0.0058) vs pooled 60 symbols +0.007;
  seed-7 attribution: gross +0.038 vs +0.076 for the other 55, cost 0.078 vs 0.063R; BTC -0.132 (t -3.7), ETH -0.082 (t -2.5), XRP/ADA/SOL about 0. Arms, all on the dev folds with seeds 20261101, 7, 11,
  13 and tau 0.10 frozen: A0 reference as measured, per symbol and per calendar year; A1 cost-neutral: the traded trades re-priced at the other 55 symbols'' mean cost per R (the cost-share lever); A2 cadence:
  decisions every 2h and every 8h instead of 4h (labels, features and model rebuilt, tau 0.10 unchanged, a cadence lever; the 4h arm is A0); A3 split: BTC+ETH versus ADA+SOL+XRP with SE from the per-decision
  spread of seed-pooled trades. No sealed or held-out window is read.'
why_this_matters: 'Operator 2026-11-01: 20 features is a regression equation, not algorithmic trading; manager 2026-11-01 ~12:03Z: a family ablation at +0.010 cannot admit anything when the recipe overfits
  with any extra column, so fix the recipe, then the columns.'
power:
  expected_n: 60000
  min_detectable_effect: 0.01
  effect_units: metric
  sd: 1.0
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'MEASURED 2026-11-01: v1 dev traded-5 seed range 0.0058 (SD 0.0026) at n about 5,500; BTC SE 0.036 at n=867. A0 per-symbol SE 0.03-0.04 means a symbol-level effect below about 0.07 is not detectable
    alone; the BTC+ETH pool (n about 1,945, SE about 0.024) is.'
  feasibility:
    source: none
    accrual_basis: Replays public history through 2025-09-30 (dev folds only); nothing accrues.
decision_rule:
  id: RULE-20261101-a508-01
  registered_at: '2026-11-01'
  registered_before_run: true
  statistic: 'Per arm, symbol and seed: n, mean gross, cost and net R per decision at tau 0.10; seed-mean and range; SE = SD of per-decision net R / sqrt(n); t = mean/SE; per calendar year n and net.'
  rule: 'SYMBOL FLAG (A0, per traded symbol, seed-mean): HARM iff mean net < 0 AND t <= -2; SUPPORTED iff mean net >= 0 AND net >= 0 in >= 3 of 4 calendar years (each year n >= 100); otherwise UNDETERMINED.
    COST-DRIVEN iff A1 traded-5 mean net >= 0; COIN-DRIVEN iff A1 < 0 and (A3) the BTC+ETH mean net is below the ADA+SOL+XRP mean by >= 2 x the seed range of A0 traded-5 (0.0116 as measured, recomputed
    from the run); CADENCE-DRIVEN iff, for 2h or 8h, traded-5 mean net exceeds the 4h value by >= 2 x the 4h seed range AND n >= 1000 AND the pooled-60 mean at that cadence is not lower than at 4h by more
    than that range. More than one cause may hold; none holding is reported as ''unattributed''. THE GO/NO-GO READ: the lane reports the per-symbol flags; a HARM flag is a recommendation of no-go for that
    symbol on the dev evidence, a proposal to the operator that the lane never applies. Thresholds are not changed after any result.'
  what_it_does_not_do: Reads no sealed or held-out window (dev folds only), serves nothing, changes no config, places no order, sizes nothing, changes no live symbol list.
  min_n: 1000 dev decisions per pooled arm; 100 per symbol-year
compute: cpu_long
value:
  bucket: ai_trader
  usd_at_stake_per_month: 400
  confidence: 0.2
  basis: 'stand-in: the operator priority-1 goal (ML decision makers live); not a P&L measurement.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 8.0
  est_minutes: 150
  why_runner: Keyless public Binance Vision archives; GBDT on CPU.
  basis: 'MEASURED 2026-11-01: one 8-fold arm of the baseline recipe takes about 480 s on 4 threads (arm A); this unit runs a fixed number of arms.'
run:
  workflow: research-script-run.yml
  command:
  - python3
  - scripts/research/ml_entry_v2_run.py
  - traded
  - '{unit}'
  - '{out_dir}'
