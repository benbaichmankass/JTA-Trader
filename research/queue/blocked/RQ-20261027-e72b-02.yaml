id: RQ-20261027-e72b-02
title: 'Desk D-S0 entry generation, forward-shadow set: do the live desk''s recorded propose_entry rows, replayed on the real candles net of the full cost stack, beat a random entry with the same bracket (S1, S2, S3), overall and under configuration C1?'
status: blocked
cadence: once
theme: live_strategy
priority: 1
roadmap:
- L-DESK
kind: experiment
question: >-
  Take every `propose_entry` row on the desk/decisions branch (comms/desk/decisions.jsonl; real symbols, packets that SHOW the strategies' book) whose symbol has Binance Vision candles. Replayed with the driver's engine and cost stack, is the mean net R per filled proposal (S1) positive,
  is the net R per capital-day (S2) positive, and does the mean of (net_i minus the mean of 200 random-entry draws with the same geometry, same symbol, at random eligible hourly cutoffs from the first proposal to five days before the last candle) (S3) exceed 0, for all filled proposals and for the C1 subset (cutoff hour 13..20 UTC and stop >= 1.0 ATR14)?
why_this_matters: >-
  DESK-18C-EDGE-OPT: the forward set is the second out-of-sample leg of the entry-generation D-S0 (RQ-20261026-e535-03: "forward-shadow set (DESK-6), once n >= 100, has a point estimate > 0") and the only evidence that uses packets showing the strategies' book. It costs no judging. MEASURED 2026-10-27 12:xx Z over comms/desk/decisions.jsonl on desk/decisions
  (22 rows, 2026-10-26 13:50Z .. 2026-10-27 12:05Z): 22 no_trade, 0 propose_entry. The live desk proposes at a rate that is NOT yet measured above 0 per packet (95% upper bound for 0 of 22 = 0.13 per packet), so the date n >= 100 is reached is open: see the report's table.
power:
  expected_n: 100
  min_detectable_effect: 0.64
  effect_units: R
  sd: 1.6
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: >-
    sd 1.6 as RQ-20261027-e72b-01 (MEASURED 1.61 on judged-1's C1 d_i). At the registered floor n = 100 the MDE is 2.8 x 1.6 / sqrt(100) = 0.45 R iid, 0.64 R at design effect 2: THIS UNIT CANNOT CERTIFY A SMALL EDGE; its job under the registered rule is the point-estimate sign check at n >= 100 and the early kill: a point estimate <= 0 at n >= 100 is evidence against, not an edge test. expected_n 100 is the floor, not a forecast.
  feasibility:
    source: none
    accrual_basis: >-
      Accrual is the live desk's own proposal rate: UNMEASURED above 0 (0 propose_entry of 22 packets). Days from 2026-10-27 to n_filled = 100 at 24 hourly packets a day and every proposal filling: 0.02 per packet 208 d, 0.05 83 d, 0.10 42 d, 0.20 21 d (INFERRED arithmetic, 100 / (24 x rate)). The C1 subset is about 24% of an unfiltered desk's proposals (1/3 of packets are US-session, 73% of those satisfy the stop floor: MEASURED on judged-1), so it takes about 4x as long until the brief adopts C1. While admitted `accruing`, research_disposition refuses a terminal disposition without an `accrual_override_reason` of >= 20 characters.
decision_rule:
  id: RULE-RQ20261027-E72B-02-DESK-FORWARD
  registered_at: '2026-10-27'
  registered_before_run: true
  statistic: >-
    Population: all `propose_entry` rows on desk/decisions at the run time, from the first row (2026-10-26) on, whose `proposal.symbol` is one of the six crypto USDT perps. Each is replayed by `desk_gen_edge_decompose.py forward`: the cutoff is the row's info_cutoff_at; the driver's `simulate` (market entry fills at the next open; limit/stop only when price trades through; stop before target in a bar; time stop at horizon_bars),
    net R = gross minus execution_costs.roundtrip_cost_r; a refused or unresolved row is counted, not scored. S1, S2, S3 and their weekly-cluster 95% intervals (10,000 draws) as in RQ-20261027-e72b-01; the random-entry pool is every eligible hourly cutoff of the same symbol between the first proposal and five days before the last candle. Both the whole set and the C1 subset are reported.
    Candles are Binance Vision SPOT klines, the same route as the masked replay; realised fills on the bybit_1 demo (claude_desk leg) are a separate read through the trade journal and are NOT this unit's statistic.
  rule: >-
    READ at n_filled(all) >= 100 (and again at 200, 400), the set the entry-generation rule of RQ-20261026-e535-03 names: FORWARD-SUPPORTS IF S1 > 0 AND S3 > 0 (point estimates), FORWARD-CONTRADICTS IF S1 <= 0 OR S3 <= 0, each labelled with the CI and n. n_filled(all) < 100: INDETERMINATE, 'could not conclude' with n.
    The C1 subset is reported beside it with its own n and signs; it becomes the decisive set only for rows recorded after the desk brief of record carries C1 (a manager decision: from then every live proposal is a C1 proposal). This unit never PASSes anything alone: the D-S0 for the filtered desk needs RQ-20261027-e72b-01 PASS AND this unit FORWARD-SUPPORTS at n >= 100.
  what_it_does_not_do: >-
    Places, sizes and changes nothing; not an order-path or roster statistic; no Tier-3 step follows from it alone. It does not read the realised bybit_1 fills, which carry execution effects (latency, rejections, the account's risk manager) this replay does not.
requires_result:
  unit: RQ-20261026-e535-01
  verdict: pass
blocked_on:
- kind: observation
  ref: desk-forward-n-100
  what: >-
    n_filled(all) >= 100 forward proposals. At 0 propose_entry of 22 packets the count is 0; the date is a function of the live proposal rate (see the report).
  clears_when: >-
    `python3 scripts/research/desk_gen_edge_decompose.py forward --decisions <desk/decisions comms/desk/decisions.jsonl> ...` prints n_all >= 100. Then: git mv this file to research/queue/, remove blocked_on, set status: queued, and commit a copy of decisions.jsonl under comms/research/desk_gen_forward/ as the unit's input.
masked_replay:
  population: not a masked replay; the live desk's own recorded rows on real symbols (the packets show the strategies' book).
  construction: >-
    `desk_gen_edge_decompose.py forward --decisions comms/research/desk_gen_forward/decisions.jsonl --candles <dir> --fetch`. The input file is a committed copy of comms/desk/decisions.jsonl from desk/decisions at the run time, so the run is reproducible.
  unmask_key: not applicable.
  leak_controls: The decision rows were written before their outcomes; the pool is hourly cutoffs of the same symbol over the same period.
  novelty: not scored here; the live packet carries the strategies' book and the row's own novelty.
compute: cpu_light
value:
  usd_at_stake_per_month: 500
  confidence: 0.05
  bucket: ai_trader
  basis: 'stand-in, not a measurement: as RQ-20261027-e72b-01.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 10
  basis: 'estimate: at most a few hundred rows x 200 random draws of at most 96 bars.'
run:
  command:
  - python3
  - scripts/research/desk_gen_edge_decompose.py
  - forward
  - --out
  - '{out_dir}'
  - --candles
  - /tmp/desk_gen_candles_fwd
  - --fetch
  - --candles-since
  - '2026-10-01'
  - --decisions
  - comms/research/desk_gen_forward/decisions.jsonl
  inputs:
    research_unit: RQ-20261027-e72b-02
  timeout_minutes: 30
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
