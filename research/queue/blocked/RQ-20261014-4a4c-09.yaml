    the floor) AND RQ-20261014-4a4c-03 FAIL (placebo clean) AND at least one of RQ-20261014-4a4c-01/-02 PASS
    (sub-period stability). If 03 PASSES (artifact) or 06 FAILS, this unit is RETIRED with that reason, not run.
  ref: docs/research/programmes/04-MACRO-SLEEVE.md Q2 -> Q3
  clears_when: research/results/ holds graded records for RQ-20261014-4a4c-01, -02, -03, -06 meeting the clause above.
- what: >-
    Lever (build row proposed to the manager: MACRO-EVENT-AXIS-HARNESS, Tier-1): an offline replay that forms one
    thesis per (release, symbol) on GLD/IEF/SLV/SPY/TLT with conviction = the registered surprise-sign mapping (hot
    inflation print: short SPY/TLT/IEF, no view on GLD/SLV unless a separate unit registers one), horizon 3 trading
