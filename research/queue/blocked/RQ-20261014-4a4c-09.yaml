    sleeve's, plus the valuation-only axis on the same dates. Neither thesis_backtest_run.py nor build_replay_entries
    accepts an events input today (RQ-20260928-009's blocker, verified 2026-09-28); this lever is the OFFLINE half of
    that fix only and does not touch thesis_tick.py.
  ref: RQ-20260928-009 / PI-20260927-CAA05-0002
  clears_when: >-
    a scripts/research/ script runs this replay with a test asserting the event join is non-empty end-to-end, and
    this unit's run block is filled with its command on research-script-run.yml.
question: >-
  If the PPI m/m surprise drift survives its confirmation set, does it make an M28 conviction AXIS: across the 5-symbol
  universe, does the event-scored book's mean net return per thesis exceed (a) the valuation-only axis on the same
  dates and (b) the all-long floor, in >= 4 of 6 calendar walk-forward folds (2015-2026, ~2-year folds), net of the
  debit-vertical cost proxy?
why_this_matters: >-
  M28's conviction comes only from the valuation read, which scored calibration_rank -0.0037 / edge_vs_baseline
  -0.0047 at zero cost (n=1,104; comms/macro/thesis_p4_scorecard.json). The operator chose "Keep exploring" (not parked)
  on 2026-10-09 and asked for a NEW conviction axis; the programme's measure is net R per conviction axis vs the naive
  floor. This is the first axis candidate with a measured lead, and the only rung that speaks the sleeve's own unit.
power:
  expected_n: 139
  min_detectable_effect: 0.25
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: >-
    Unit = one release-date cohort (the 5 symbols on one date are not independent, so the paired test is on the
    per-release cohort mean): 139 ppi_mom releases with a defined surprise (MEASURED 2026-10-14), 118 non-zero. Floor
    (2.80/0.25)^2 = 126 at d=0.25; the non-zero count 118 is below it, so this is UNDERPOWERED BY DESIGN at d=0.25
    (it can PASS only on a larger effect) and the run reports its cohort n.
  feasibility:
    source: none
    accrual_basis: Fixed historical backfill; ~12 releases/yr. Prices from the off-VM fetch_macro_candles.
decision_rule:
  id: RULE-RQ-20261014-4a4c-09
  registered_at: '2026-10-14'
  registered_before_run: true
  statistic: >-
    Per walk-forward fold: mean net return per release cohort of the event-scored book, the valuation-only book and
    the all-long book, all at fee_frac 0.005; paired difference event minus each comparator with a 95% bootstrap
    interval resampling whole release cohorts (2000 draws, seed 20261014).
  rule: >-
    PASS (axis earns a Tier-3 proposal to add it as a c_macro conviction input on alpaca_options_paper, with this
    record) IF the pooled paired difference vs BOTH comparators is > 0 with the interval above 0 AND the event book
    beats both in >= 4 of 6 folds. FAIL (axis retired with the numbers as the reason) IF the pooled difference vs
    either comparator has its interval at or below 0 and fewer than 4 folds win. INDETERMINATE otherwise or if the
    cohort n < 100.
  what_it_does_not_do: >-
    No config, no roster, no sizing: a PASS is a proposal. Does not model option payoff shape (linear exposure with a
    fee proxy). Does not wake M29 by itself; the 04 programme reads this record for the M29 wake decision.
