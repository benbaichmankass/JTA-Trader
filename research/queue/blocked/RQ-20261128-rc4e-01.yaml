id: RQ-20261128-rc4e-01
title: 'ml-btc-router-cells read at power WITHOUT waiting: on BTC 2020-04..2022-06 (before the A/B that authored the cells), keyed by labels from the v2 head recipe refit only on 2022-07..2026-11, does the ML-keyed trend_vol OFF-cell book have net >= the ungated book AND maxDD% <= it?'
status: blocked
cadence: once
roadmap:
- L-ML-LIVE
theme: ml_health
priority: 2
kind: experiment
iteration:
  subject: ml-btc-router-cells
  subject_kind: ml_model
  from_result: RQ-20261119-c8e2-02
  verdict_read: indeterminate
  diagnosis: 'c8e2-02''s fresh fold held 34 ungated trades, under the ~60 its power basis assumed, and the two book metrics split (net -1.57, maxDD -1.69 pp): the rule maps a split to MIXED. The binding limit is n. Waiting to 2027-04 is ruled out (RESEARCH-NO-WAIT-FOR-DATA); 2.25 years of BTC history before the cells'' authoring window holds several times that n, labelled by a labeller fit only after it.'
  hypothesis: the MIXED read is sampling noise on 34 trades; at ~60 the cells either hold (net and DD) or do not
  levers:
  - regime_cells
  attempt: 2
  due_by: '2026-12-31'
question: On the disjoint fold 2020-04-01:2022-06-30 (scripts/backtest_system.py over a BTC 5m candle file built in the run from 2020-03, roster trend_donchian, squeeze_breakout_4h, htf_pullback_trend_2h, live config/regime_policy.yaml at dispatch), with the ml arm keyed on vol labels from the btc-regime-15m-lgbm-v2 recipe REFIT only on 2022-07-01..2026-11-27 (backtest_system --vol-verdict labels), does the ML-keyed OFF-cell book have net >= the ungated book AND max drawdown % <= the ungated book? Same harness and two-metric rule as c8e2-02; the read counts only if the refit labels agree with the live head's on >= 85% of overlapping bars.
why_this_matters: 'ml-btc-router-cells is an ORPHAN (Manager 2026-11-28a drain). Its reads so far: classification lift -0.0001 vs the +0.10 bar (75b2-16); per-cell
  marginal FAIL for trend_donchian chop/calm/long (fa22-04: n 101, added R -1.72, matched-drop p 0.41; the other 7 cells underpowered); and the book read c8e2-02
  MIXED on 34 ungated trades (cells cost 1.57 net, buy 1.69 pp maxDD; ML keying +216.88 vs frozen). The MIXED read is an n problem (34 < the 60 its own power basis
  assumed), so the next read is the same rule at power, not a new lever.'
evidence_class:
  holdout: out_of_time_backward
  claim: regime_cell
power:
  expected_n: 60
  min_detectable_effect: 0.37
  effect_units: sd
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'MEASURED rate: c8e2-02 fresh fold 2026-06-01..2026-11-19 = 34 ungated trades in 5.6 months (~6.1/month) -> ~165 on the 27-month disjoint fold if the rate holds (an ESTIMATE; the run reports the n). d = 0.37 SD detectable at n = 60 (paired, alpha 0.05, power 0.8), so the fold is powered above the 50-trade floor.'
  feasibility:
    source: none
    accrual_basis: 'Nothing accrues: BTC 5m candles from 2020-03 and 15m features from 2020-03 are built in the run (scripts/research/build_market_features_span.py, Bybit linear-perp klines; the adapter clamps to listing).'
baseline:
  definition: The ungated book (--regime-router off), same roster, window, data and harness cost model as the gated arms.
  net_of_cost: true
decision_rule:
  id: RULE-RQ20261128-rc4e-01-ROUTER-CELLS-POWERED
  registered_at: '2026-11-28'
  registered_before_run: true
  baseline: the ungated book on the same fold
  statistic: 'scripts/research/vol_offcell_fresh_wf.py grade() with --vol-labels (refit labels): on the fold 2020-04-01:2022-06-30, ml.net - ungated.net and ml.maxdd_pct - ungated.maxdd_pct (scripts/backtest_system.py --json net_pnl / max_drawdown_pct), plus the refit FIDELITY read in the labels manifest (refit vs live labels on 2022-07-01..2026-11-27). The sub-folds and ml vs frozen are reported, decide nothing.'
  rule: FIRST the fidelity gate (fidelity.state == label_faithful, >= 85% agreement over >= 1000 bars, else INDETERMINATE label_not_live_faithful). Then HOLDS (pass) iff on the fold 2020-04-01:2022-06-30 the ML-keyed book has net >= the ungated book AND maxDD% <= the ungated book, with >= 50 ungated trades. DOES_NOT_HOLD (fail) iff net < ungated AND maxDD% > ungated at >= 50 ungated trades. MIXED (indeterminate) otherwise; INDETERMINATE below 50 ungated trades or if any arm fails. Backward out-of-time read, stated; registered in the read ledger by its result row.
  pass_action: Record the cells as holding out of time at power on REGIME-PROGRAM; no config change (they are live and stay the incumbent).
  fail_action: A data-backed Tier-3 proposal (held PR to the manager) to set the trend_vol cells' enforcement off (shadow-log only), citing c8e2-02 and this record
    (regime-selectivity Rule 1).
  min_n: 50 ungated trades on the disjoint fold
  proposal_mapping: holds -> recorded; does_not_hold -> Tier-3 cells-off proposal; mixed/indeterminate -> report; next is a redesign of the cells (no third read of this rule on this span).
  what_it_does_not_do: Changes no config. Grades the cell BOOK, not individual cells (fa22-04 graded those); the trend_donchian chop/calm/long removal is a separate
    Tier-3 proposal.
practice_precedent: confirm a single-window pass on data the decision never saw (weekly audit 2026-11-18 Q3; docs/reference/trading-and-model-practice-principles.md)
ml_consumer:
  consumer: config/regime_policy.yaml
  decision: keep or retire the vol-keyed trend_vol OFF-cells (trending/volatile and chop/volatile, keyed by the ML vol head's verdict) that drop live intents before
    routing
  legs:
  - trend_donchian
  book: demo_floor
intervention_controls:
