  ref: checklist NEWS-ALPHA-HARNESS (scripts/research/news_alpha_ic.py)
  clears_when: 'NEWS-ALPHA-HARNESS is done: writes a script_run verdict.json and appends to research/news_alpha/TEST-LEDGER.jsonl'
  resolved_by: 'NEWS-ALPHA-HARNESS (scripts/research/news_alpha_ic.py, PR #18558, merged 2026-10-16)'
  resolved_at: '2026-10-16'
