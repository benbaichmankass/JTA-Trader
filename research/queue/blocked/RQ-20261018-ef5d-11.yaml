decision_rule:
  id: RULE-P7-B5-IGNITION-15M
  registered_at: '2026-10-18'
  registered_before_run: true
  statistic: >-
    Once TF-IGNITION-HARNESS lands: harness_stage0.py --family ignition --timeframe 15m with the three arms above (scripts/backtest_ignition.py
    --range-mult --vol-z --tp-r --atr-stop-mult 1.0 --timeout-bars 8), full cost stack via execution_costs.resolve_cost_policy;
    per cell n, net_r, max_drawdown_r, 6 calendar folds; pooled.
  rule: >-
    Arms fixed now. Flags: --folds 6 --fold-majority 4 --n-floor 39 --pooled-n-floor 88 --breadth-frac 0.5. PASS iff any arm
    passes the pooled Stage-0 rule -> node P7-B5-confirm (the passing arm alone at 5m and 1h). FAIL iff every arm fails ->
    ignition at these three configurations is closed on this window. INDETERMINATE otherwise. Thresholds not changed after
    any result.
  what_it_does_not_do: >-
    Does not edit config/strategies.yaml, config/accounts.yaml or any roster; does not tune beyond the fixed arms listed;
    does not pool windows with any committed record; is not a promotion case. Candles are Binance USD-M (a PROXY for Bybit
    linear; prices track within a few bps) and the funding term is a directionless magnitude (execution_costs P1), both stated
    in the record. Cannot run until the ignition harness exists.
