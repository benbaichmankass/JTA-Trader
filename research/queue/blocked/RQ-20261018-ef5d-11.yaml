kind: experiment
question: >-
  On Binance USD-M 15m candles for the six perps over 2021-01-01..2026-10-17, does entering on the close of an ignition bar
  (range >= k x ATR14, volume z >= z over 96 bars) in the bar's direction, with a 1 x ATR stop, a fixed target and a short
  time stop, read net-positive pooled with >= 4 of 6 folds at pooled n >= 88? Arms fixed now: K2Z2_TP15 (k 2.0, z 2.0, tp
  1.5R, 8 bars), K3Z2_TP15 (k 3.0), K2Z2_TP1 (tp 1.0R).
why_this_matters: >-
  Operator 2026-10-18: breakout-style entries that anticipate a jump/drop and catch just that wave, at horizons where fees
  dominate. No repo harness keys an entry on single-bar range/volume expansion (checked 2026-10-18: squeeze keys on compression,
  trend on channel breaks, fade on failed breaks, ict_scalp on sweeps + FVG). Registered now so the design is fixed before
  the harness is written (row TF-IGNITION-HARNESS). Prior short-horizon work this builds on and does NOT repeat: RQ-20260930-504
  (<=1h discovery grid at live/default params, FAIL at taker cost; squeeze/fade/pullback/fvg/chop had NO Stage-A survivor
  at 5m-30m), blocked/RQ-20260930-505 (its 1m arm), RQ-20261016-1fa6-07 (maker entries do not rescue the 15m scalp book, FAIL),
  the 2026-10-06 prop breadth batch RQ-20261006-005..031 (5m-15m taker FAIL as a configuration class), docs/research/idea-family-review-2026-10-16.md
  s13/s16, rows IR-CRYPTO-DAILY-TREND and IR-INTRADAY-SEASONALITY-HARNESS.
