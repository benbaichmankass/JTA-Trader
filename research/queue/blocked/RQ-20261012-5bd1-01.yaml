id: RQ-20261012-5bd1-01
title: 'NEWS-ALPHA U01: does the LIVE news score carry standalone information about the next 15m-1d move of its symbol, over
  ALL evaluations (not only taken trades)?'
status: blocked
roadmap: M28
program: NEWS-ALPHA-PROGRAM
cadence: once
kind: experiment
theme: macro
priority: 1
question: 'G1 graded the news adjustment only against taken-trade net R (IC -0.014, n=634). Here the 13,173-row runtime_logs/news_decisions.jsonl
  (2026-06-11..) is re-read as a FEATURE PANEL: one row per (symbol, hour) with the mean adjustment, the item count (attention)
  and any veto, against that symbol''s forward return, |return| and realized vol, irrespective of whether a trade was taken.'
why_this_matters: 'Cheapest standalone test on data that already exists; separates ''the score has no information'' from ''the
  score has information our overlay mis-uses''. Program index: docs/research/news-alpha-program-2026-10-12.md.'
populations: Every symbol in the log with >= 200 distinct hours; candles from the canonical sources per asset class.
grid:
  features:
  - adjustment_mean
  - item_count
  - veto_any
  targets:
  - fwd_ret
  - fwd_absret
  - fwd_rv
  horizons:
  - 15m
  - 1h
  - 4h
  - 1d
  populations:
  - pooled
grid_cells: 36
cell_statistic: Spearman IC (time-series, pooled across symbols with per-symbol demeaning)
power:
  expected_n: 2500
  min_detectable_effect: 0.06
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'Effect is a rank correlation r treated as d (n ~ 7.85/r^2): floor 2180.2 at d=0.06. Discovery 2026-06-11..2026-08-31
    (82 d): if >= 3 symbols carry >= 1 row/hour, ~5,900 symbol-hours at 1h; 2,500 is the stated lower planning value. The
    1d cells are UNDERPOWERED by construction (~250 non-overlapping symbol-days) and are reported, not graded. The floor is
    per-test and unadjusted; the unit''s 36 cells are controlled by the family BH over 600 declared tests (rule), so survival
    needs |t| well above 2 -- the conservative direction.'
  feasibility:
    source: none
    accrual_basis: Log rows are one per signal evaluation per tick, so distinct symbol-hours are UNKNOWN until the adapter
      de-duplicates; the log grows ~110 rows/day.
decision_rule:
  id: RULE-RQ1012-5bd1-01-NEWS-ALPHA
  registered_at: '2026-10-12'
  registered_before_run: true
  statistic: 'Per registered cell (feature x target x horizon x population, enumerated in `grid` and counted in `grid_cells`):
    on the DISCOVERY window only, the cell statistic named in `cell_statistic` with its two-sided p from a Newey-West t (lag
    = ceil(1.5 x horizon in bars)) for time-series cells, from the NW t of the per-period cross-sectional IC series for cross-sectional
    cells, and from a 2,000-resample day-block bootstrap against the matched non-event baseline for event cells; n stated
    per cell. Discovery survivors = cells whose p <= 0.10 x r / 600 where r is the cell''s p-rank WITHIN THIS UNIT (family
    BH at q=0.10 over the declared wave-1 budget of 600 tests, unrun cells counted as p=1 -- conservative and computable per
    unit). Each survivor gets ONE confirmatory test on the sealed holdout 2026-09-01..2026-10-11 (this unit''s own split;
    the log starts 2026-06-11) (same cell, same sign required), Holm-adjusted across ALL program holdout tests at alpha 0.05,
    cap 20 holdout tests in wave 1, logged in research/news_alpha/TEST-LEDGER.jsonl. Leakage tests run before any statistic
    and gate the run (failure => read_state producer_failed): (L1) every feature row asserts max(item available_at) < the
    bar time the target window opens (GDELT: V2.1DATE ingest time; publisher time is never used for availability); (L2) a
    +1-bar FUTURE-shifted feature is computed and reported -- if the true feature''s IC is not materially below the future-shifted
    one on the volatility cells, the alignment is suspect and is reported; (L3) a circular-shift placebo (shift by a random
    offset >= 30 days, 200 draws) must put the true cell outside the placebo''s central 95% to count; (L4) holdout rows are
    not readable in --phase discovery (harness refuses).'
  rule: 'DIRECTION cells (target = forward return): PASS additionally requires the sign-of-feature (time-series) or quintile
    long-short (cross-sectional) strategy''s holdout mean return NET of the full cost stack (src/runtime/execution_costs.resolve_cost_policy
    per symbol: fee + slippage + perp funding, charged per unit turnover) to have NW t >= 2.0 and the discovery-window net
    mean > 0; a cell that confirms in rank but not net of cost reads PASS_RANK_ONLY (information, not edge). VOL/VOLUME cells
    (target = realized vol, |return| or volume): graded SEPARATELY -- PASS iff the holdout QLIKE (vol) or MSE-of-log (volume)
    loss of baseline+feature beats the declared baseline (HAR-RV for vol; AR(5) of log volume for volume) by >= 2% with a
    one-sided Diebold-Mariano p < 0.05 after the same Holm adjustment; a vol PASS is a sizing/risk input, never direction.
    VERDICTS: pass = >= 1 cell PASS (direction or vol, reported separately); fail = n >= the unit floor on every primary cell
    AND no discovery survivor, or every survivor fails its holdout (a DISCOVERY_ONLY cell is a FAIL for that exact configuration);
    indeterminate = any primary cell below its n floor, or a leakage check fails (then read_state producer_failed, never a
    verdict). Cells with unadjusted p < 0.05 that do not survive are reported as LEADS: they may seed a wave-2 unit only on
    data the discovery window did not touch. A FAIL closes ONLY the configuration tested (feature definition, source, population,
    horizon) -- never ''news''. Every PASS also files a PROSPECTIVE unit graded on data after 2026-10-12 (the holdout window
    was partly viewed by RQ-20261012-2a7b-01, disclosed in docs/research/news-alpha-program-2026-10-12.md).'
  what_it_does_not_do: 'Touches no config, no order path, no NEWS_VETO_ENABLED, no roster. A PASS is not a promotion: a direction
    PASS earns a Stage-0 new_strategy unit on an existing cost-complete harness; a vol PASS earns a sizing/risk research unit.
    Does not evaluate the live veto overlay (that is RQ-20261009-902 / RQ-20261012-2a7b-01). Does not retire the news layer
    on a FAIL (operator 2026-10-12: retirement is off the table).'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 30
  basis: Panel IC / event study over a precomputed feature panel; no model fitting beyond HAR/AR baselines.
blocked_on:
- what: A runner-readable export of runtime_logs/news_decisions.jsonl (live VM; 13,173 rows 2026-06-11..2026-10-09 per the
    program index) de-duplicated to symbol-hours, plus a harness source adapter `live_log` in scripts/research/news_alpha_ic.py
    load_inputs (it has only `gdelt_panel` today)
  ref: checklist NEWS-ALPHA-FEATURES (live-log adapter part)
  clears_when: the export is committed (or published) with its symbol-hour count printed AND news_alpha_ic.py has a `live_log`
    source; then add the unit's news_alpha block (it declares its own holdout 2026-09-01..2026-10-11)
  updated_at: '2026-10-16'
  updated_by: lane NEWS-ALPHA-HARNESS-1016
run:
  workflow: null
  inputs:
    research_unit: RQ-20261012-5bd1-01
  note: Becomes research-script-run.yml with run.command [python3, scripts/research/news_alpha_ic.py, --unit, '{unit}', --phase,
    discovery, --out, '{out_dir}'] once the blocked_on rows land; the holdout phase is a second, ledgered invocation (--phase
    holdout) on discovery survivors only.
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
