id: RQ-20261022-eba2-04
title: 'Programme 01 Q11 rung 1d (VOLATILITY-CONTROLLED): do the bar-6 path metrics predict giveback BEYOND a baseline that
  already carries realised-vol-vs-entry-vol, on the four bybit_2 money legs, 2020-07..2026-10?'
cadence: once
roadmap:
- L-ATM
- M20
theme: live_strategy
priority: 2
kind: experiment
question: 'Operator idea (IDEAS.md 2026-10-21): metrics of the volatility and up/down swing of a trade (realised vol vs entry
  vol, efficiency ratio, MAE/MFE path shape, chop) as giveback predictors. RQ-20261022-007 stated the confound in its own
  what_it_does_not_do: a choppier path also swings more R. Add vol_ratio_k = (mean bar true range over bars 1..k) / (ATR at
  entry) to the BASELINE (open_r_k, peak_r_k, bars_since_peak_k, vol_ratio_k) and ask the same question of chop_k, er_k, shape_k,
  early_k on trend_donchian_eth_4h, trend_donchian_xrp_4h, ada_pullback_2h, xrp_pullback_2h over 2020-07-01 .. 2026-10-15
  23:59: r2_gain >= 0.02 or ll_gain >= 0.01 in >= 4 of 6 folds, pooled.'
why_this_matters: A PASS in 007 that is only vol_ratio_k in disguise says 'trades that swing more give back more', which is
  true by construction of a wide trail and is no lever. Only a gain beyond the vol-augmented baseline can justify a metric-TRIGGERED
  exit (rung 2). This is the operator's own 'realised vol vs entry vol' metric.
power:
  expected_n: 900
  min_detectable_effect: 0.15
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'Same arithmetic as RQ-20261022-007: the r2_gain bar is a partial correlation of about 0.14, stated as 0.15 sd, floor
    (1.96 + 0.8416)^2 / 0.15^2 = 349 pooled trades. Expected about 900 pooled trades still open at bar 6 across six legs (007
    read 275 and 352 open at k on ada_pullback_2h and xrp_pullback_2h; the siblings trade at comparable frequency; NOT measured
    on these legs, so a pooled n < 100 reads INDETERMINATE under the rule, never FAIL).'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-P1-Q11-R1D-VOLCTL
  registered_at: '2026-10-22'
  registered_before_run: true
  statistic: 'From scripts/research/path_metric_giveback.py with the vol-control baseline (build PATHMETRIC-VOLCTL: feature
    vol_ratio_k, flag --baseline-extra vol_ratio_k), k=6, 6 calendar folds by entry time, leave-one-fold-out, pooled over
    the four legs. Baseline = open_r_k, peak_r_k, bars_since_peak_k, vol_ratio_k; full = baseline + chop_k, er_k, shape_k,
    early_k. r2_gain, ll_gain and fold wins as in RULE-P1-Q11-PATH-METRIC-GIVEBACK-R1.'
  rule: 'INDETERMINATE IF pooled n < 100. PASS IF (r2_gain >= 0.02 AND r2 fold wins >= 4 of 6) OR (ll_gain >= 0.01 AND ll
    fold wins >= 4 of 6): the path metrics carry information beyond realised volatility; this is the evidence rung 2 rests
    on, together with eba2-01. FAIL otherwise: the 007 PASS was volatility in disguise and rung 2 is not built on it. Per-leg
    verdicts are reported, not graded. Thresholds are not changed after any result.'
what_it_does_not_do: 'A label study, not a lever: edits no config, places no order, tests no exit. Harness paths are not live
  paths. A PASS says information, not causation. Same window as 007 by design (the contrast is the baseline, not the sample).'
compute: cpu_light
value:
