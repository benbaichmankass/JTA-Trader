# Hand-authored 2026-11-01 ~20:10Z by lane ML-ENTRY-GOLIVE-UNBLOCK (Tier 1), on the operator popup ~19:50Z (verbatim, relayed by Manager
# Session 2026-11-01a): "Test it properly first (Rec.)" for widening ml_entry beyond the 5 bybit_2 symbols. Decision rule registered BEFORE
# any run. Gates: none (a measurement; a PASS feeds a Tier-3 universe PR, it does not widen anything itself).
id: RQ-20261101-a24c-01
title: 'ENTRY universe, tested properly: with each symbol charged its OWN historical spread + square-root impact (not a flat 3 bps), and a liquidity
  rule chosen on the dev folds only, does the frozen ENTRY model clear the bar on that rule''s Bybit-listed universe on a FRESH forward window --
  under both the c692-01 tau policy and the v2 cost gate (ml/promotion/cost_gate.py)?'
status: blocked
cadence: once
theme: ml_health
priority: 1
programme: P2
roadmap:
- L-ML-LIVE
kind: experiment
practice_precedent: 'T1, M6, M10 (docs/reference/trading-and-model-practice-principles.md): promote on out-of-sample decision value NET OF THE FULL
  COST STACK against take-all / take-none / matched-random on the same rows; Corwin & Schultz (2012) high-low spread estimator; square-root market
  impact (Almgren et al. 2005; Toth et al. 2011); purged + embargoed walk-forward with a sealed forward window read once (HOLDOUT-LOCK).'
question: 'The operator rule (ML-ENTRY-ALL-ACCOUNTS, 2026-11-01): a general ML trades every market it is VALIDATED on and that our venues list.
  MEASURED 2026-11-01 (comms/research/ML-ENTRY-UNIVERSE/local-20261101T1830Z): on the c692-01 held-out decisions of the 51 symbols Bybit lists,
  the pooled mean is +0.0065 R/decision at the flat 3 bps slippage the evidence charged, and -0.0050 when each symbol pays its measured Bybit
  spread (one tickers snapshot; 27 of 51 quote > 3 bps). That snapshot is one Sunday-evening read and that window is no longer sealed (read by
  c692-01, c692-02 and that re-cost: variants_on_window 3). This unit asks the question properly. (1) COST MODEL, historical, per symbol and month:
  round-trip cost = fee 11 bps + funding as c692-01 + spread_bps + impact_bps, where spread_bps is the Corwin-Schultz high-low estimate from the
  same 1h Binance Vision klines (monthly median, floored at one tick of the symbol''s Bybit tickSize at that month''s median price), and
  impact_bps = 1e4 x sigma_daily x sqrt(Q / ADV_bybit) per side x 2, with Q = the REFERENCE ORDER NOTIONAL registered below and ADV_bybit = the
  symbol''s Binance 30-day median quote volume x that symbol''s Bybit/Binance 24h-turnover ratio (from the committed Bybit snapshot
  bybit_specs_20261101.json and the same-day Binance 24h ticker; a symbol with no ratio is dropped and counted). (2) LIQUIDITY RULE, chosen on
  the DEV FOLDS ONLY (c692-01 DEV_FOLDS, nothing at or after 2025-10-01 read): a symbol is IN when its dev-period median round-trip cost
  (1) <= C bps; C is the value in {10, 15, 20, 30, 50, inf} that maximises the pooled dev-fold mean net R per decision re-costed by (1), with dev
  n >= 1000; tie -> larger C. (3) The frozen c692-01 model and tau (ml/served/ml_decision_entry_v1, unchanged), scored on the rule''s universe
  restricted to symbols Bybit lists as Trading USDT LinearPerpetual at run time, every decision re-costed by (1). (4) Two decision arms on the
  same rows: A = the c692-01 tau policy (one position per symbol); B = the v2 cost gate (ml.promotion.cost_gate.evaluate_cost_gate on (taken,
  net_r) pairs of every opportunity row: strictly above take_all, take_none and matched_random).'
why_this_matters: 'The operator wants the general ENTRY model on every market it is validated on (17:55Z, 18:00Z) and chose "Test it properly
  first (Rec.)" (19:50Z). The flat-3-bps evidence over-states the edge on thin symbols by up to 0.09 R/trade (BAND, ZRX), larger than the
  +0.0073 pooled edge itself, so widening on c692-01 alone would put real money on a universe whose net edge is unmeasured. ML-RECIPE ENTRY v2
  is gated by the same cost_gate, so arm B answers the universe question for v2 as well; the unit re-runs on v2 when its artifact exists.'
power:
  expected_n: 900
  min_detectable_effect: 0.12
  effect_units: metric
  sd: 1.3
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'MEASURED proxy: c692-01 took ~940 held-out decisions a month on 53 symbols (11,240 / 12; by_month 702..1,197); per-decision net R sd ~1.3
    (SL -1R plus cost, TP +1.5R, time stops). One forward month 2026-10 gives n ~ 900 and SE ~ 0.043 R, so only an effect >= ~0.12 R is detectable
    at 80 percent power; the pooled c692-01 edge (+0.0073) is far below that. STATED BEFORE THE RUN: a one-month forward read is UNDERPOWERED
    for the expected effect; the rule therefore reads the point estimate (the operator bar) and the run is repeated monthly (cadence below is
    once; a monthly re-read is a new claim on a new forward month).'
  feasibility:
    source: none
    accrual_basis: Replays public history; the forward window accrues one month per calendar month (Binance Vision publishes the monthly zip in the
      first days of the next month).
decision_rule:
  id: RULE-RQ20261101-a24c-01-ENTRY-UNIVERSE-COSTED
  registered_at: '2026-11-01'
  registered_before_run: true
  statistic: 'On the forward window 2026-10-01..2026-10-31 (claimed via scripts/research/holdout_lock.py, model id ENTRY-v1-universe-costed),
    for the dev-chosen universe U(C): arm A held-out mean net R per decision re-costed by (1), n, distinct symbols, per-symbol n and mean, the
    same statistic at the flat 3 bps (for comparison); arm B the cost_gate result (value, take_all, take_none, matched_random, PSR, DSR with
    n_trials = 6 C values x 2 arms). Reported, never gating: the same on the 5 bybit_2 symbols; C and |U(C)|; the snapshot-vs-model spread error
    per symbol.'
  rule: 'INDETERMINATE IF no C reaches dev n >= 1000, OR forward n < 300, OR |U(C)| < 10, OR the cost model is missing for more than 10 percent
    of U(C)''s decisions, OR the forward window cannot be claimed (already read). PASS IF arm A forward mean net R per decision (re-costed) >= 0
    AND arm B cost_gate passes. FAIL otherwise. A PASS is the evidence a Tier-3 PR cites to widen ml_entry (bybit_2 + bybit_portfolio) to U(C);
    a FAIL keeps the 5 symbols and is reported to the manager. C, the cost model and the arms are fixed here and never changed after any result.'
  what_it_does_not_do: No sizing, no config change, no order, no refit. Does not re-choose tau. Does not read 2025-10-01..2026-09-30 (no longer
    sealed).
  min_n: 300 forward decisions on >= 10 symbols
  reference_order_notional_usd: 5000
  reference_order_notional_basis: 'Registered before the run as the impact model''s Q. A stand-in for one default-risk ml_entry order (1.5 percent
    at a median 2.5 percent stop is ~0.6 x equity); the account balance is not stated in this public repo. The run also reports the pooled result
    at Q x 0.25 and Q x 4 as a sensitivity (reported, not gating).'
compute: cpu_long
value:
  bucket: ai_trader
  usd_at_stake_per_month: 800
  confidence: 0.2
  basis: 'stand-in: the operator priority-1 goal (the general ENTRY model on every validated market); not a P&L measurement.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 6.0
  est_minutes: 60
  why_runner: Keyless public Binance Vision klines; GBDT scoring on CPU; the Bybit specs come from the committed snapshot, so no Bybit call.
  basis: 'INFERRED: the c692-01 fetch (~4,500 monthly zips) plus one month; scoring only (the frozen artifact, no refit); the cost model is
    vectorised over ~0.8M rows.'
run:
  workflow: research-script-run.yml
  command:
  - python3
  - scripts/research/ml_decision_entry.py
  - universe-costed
  - --bybit-specs
  - comms/research/ML-ENTRY-UNIVERSE/local-20261101T1830Z/bybit_specs_20261101.json
  - --cache
  - /tmp/ml_decision_klines
  - --unit
  - '{unit}'
  - --out
  - '{out_dir}'
  timeout_minutes: 180
  inputs:
    research_unit: RQ-20261101-a24c-01
lands:
