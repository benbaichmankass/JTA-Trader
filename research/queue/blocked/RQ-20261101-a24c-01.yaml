  assert_field: read_state
  min_rows: 1
related:
- ML-ENTRY-ALL-ACCOUNTS
- ML-ENTRY-LIVE-ADAPTER
- ML-RECIPE
- RQ-20261101-c692-01
- RQ-20261101-c692-05
- comms/research/ML-ENTRY-UNIVERSE/local-20261101T1830Z/summary.json
what_it_does_not_do: Registers, serves or promotes nothing; changes no config; places no order; sizes nothing.
blocked_on:
- kind: harness
  ref: scripts/research/ml_decision_entry.py
  what: 'the universe-costed subcommand: Corwin-Schultz spread + square-root impact cost model per symbol-month, the dev-fold liquidity rule over
    the registered C grid, arm A (tau policy) and arm B (ml.promotion.cost_gate.evaluate_cost_gate) on the same forward rows, and the
    holdout_lock claim before any forward outcome is read'
  clears_when: 'the subcommand lands on main with a self-test (a planted illiquid symbol is excluded by the dev rule; a planted one-tick spread
    floors the estimate); the lane git-mvs this file to research/queue/ with status queued, rule unchanged'
- kind: data
  ref: Binance Vision monthly klines 2026-10
  what: the forward window's monthly zip for every U(C) symbol
  clears_when: data.binance.vision lists {SYMBOL}-1h-2026-10.zip for BTCUSDT (positive control) and every candidate
ml_consumer:
  consumer: ML-ENTRY-ALL-ACCOUNTS
  decision: 'whether ml_entry on bybit_2 + bybit_portfolio widens from BTC/ETH/XRP/ADA/SOL to the rule''s universe U(C) beside the rostered legs
    below, which share the account risk book (margin, the 3 percent daily-DD switch)'
  legs:
