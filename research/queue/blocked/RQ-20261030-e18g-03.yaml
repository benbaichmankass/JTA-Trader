  leak_controls: Event detectors read only data stamped at or before known_at; the decision cutoff is the next 1h boundary and the engine reads bars after it only for the outcome. Prefix-identity control
    (history truncated at 2026-04-01 gives identical events) and oracle/anti-oracle/random-side controls are part of the verdict.
  novelty: not scored.
