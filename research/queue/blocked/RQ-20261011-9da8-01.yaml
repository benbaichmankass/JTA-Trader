id: RQ-20261011-9da8-01
title: 'Frontier: time-series foundation-model forecaster bake-off for the volatility-regime head (Chronos-2, TimesFM-2.5,
  TiRex-2, Kronos vs the shipped Chronos-Bolt-Tiny fc features, with a HAR-RV control)'
status: blocked
cadence: once
theme: regime
priority: 2
kind: experiment
question: Under purged 5-fold walk-forward CV and the SAME dataset rows, does ANY of Chronos-2 (119M, Apache-2.0), TimesFM-2.5
  (231M, Apache-2.0), TiRex-2 (82M, Apache-2.0) or Kronos-base (102M, MIT, OHLCV-native) used as a frozen quantile forecaster
  (the same six scale-free fc_* columns build_forecasts.py emits) lift the BTC/ETH/SOL 15m volatility-regime head's macro_f1
  and f1_volatile over the incumbent fc features (Chronos-Bolt-Tiny, 9M) AND over a no-neural control (HAR-RV realised-vol
  forecast columns)?
why_this_matters: 'Only ONE TSFM (Chronos-Bolt-Tiny) has ever been tested, frozen, on the volatility head (T0.1/T0.4, 2026-07-01);
  its fc features are the one durable win and are advisory today (macro_f1 0.573 BTC / 0.541 SOL). Two things are UNTESTED,
  not closed: (1) larger / newer / finance-native forecasters; (2) whether fc beats a classical HAR-RV control at all (no
  record of that comparison was found in ROADMAP.md T0.4 or docs/research/T0.4-*). Operator 2026-10-11: do not let the first
  good thing dictate scope. Kronos is reported (secondary source, unverified) to be pretrained on 45 exchanges incl. crypto, so the registered rule also reads a post-2025-09-01
  holdout where overlap with pretraining is least likely (the pretraining cutoff is UNVERIFIED).'
power:
  expected_n: 3
  min_detectable_effect: 0.01
  effect_units: sd
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 3 symbols x 5 purged folds on ~175k rows for BTC (dataset v003; ETH/SOL sizes not re-measured here); the registered quantity is the paired fold-level
    difference in macro_f1 vs the incumbent. 5 folds is thin for an interval, which is why the rule requires the SAME sign
    on all three symbols rather than a significance test on one.
  feasibility:
    source: none
    accrual_basis: ''
decision_rule:
  id: RULE-RQ1011-9DA8-01-TSFM-BAKEOFF
  registered_at: '2026-10-11'
  registered_before_run: true
  statistic: 'Per candidate forecaster and symbol: paired purged-CV delta macro_f1 and delta f1_volatile vs the incumbent
    fc (Chronos-Bolt-Tiny) head on identical rows, and vs the HAR-RV control; plus the same deltas on the post-2025-09-01
    holdout. Feature-lift gate only -- NOT a P&L figure.'
  rule: 'PASS IF for at least one candidate forecaster: delta macro_f1 >= +0.010 vs the incumbent fc AND >= +0.010 vs HAR-RV
    on BTC, the same sign (> 0) on ETH and SOL, AND the post-2025-09-01 holdout delta is > 0 on BTC. FAIL IF no candidate
    reaches delta macro_f1 > +0.005 vs the incumbent on any symbol (the incumbent stays; the family is not closed -- a FAIL
    closes only these checkpoints, zero-shot, on this head). If HAR-RV >= the incumbent fc on BTC, REPORT that as the headline
    (the neural forecaster adds nothing over a classical one) and re-route. INDETERMINATE otherwise. A PASS is a candidate-stage
    manifest only; any advisory use is judged downstream by the regime-cell walk-forward NET OF COST.'
  what_it_does_not_do: 'Does not train, promote or serve anything; does not touch config/*.yaml; no live-box dependency (torch
    stays trainer-side, forecasts are mirror-published like fc). A feature-lift PASS is not edge: it earns a candidate manifest
    and the downstream net-of-cost regime-cell walk-forward, nothing more. Says nothing about fine-tuned (LoRA) variants --
    that is a separate unit only if zero-shot passes.'
blocked_on:
- kind: work_item
  ref: FRONTIER-LEVER-TSFM
  what: build_forecasts.py is hard-wired to Chronos-Bolt-Tiny; there is no backend switch for Chronos-2 / TimesFM-2.5 / TiRex-2
    / Kronos and no HAR-RV control columns.
  clears_when: scripts/ml/build_forecasts.py takes --backend {chronos-bolt-tiny,chronos-2,timesfm-2.5,tirex-2,kronos} + a
    HAR-RV control producer, a test pins the six fc_* column names/shape per backend, and one backend has produced a non-zero
    side-stream on the trainer. Then git mv to research/queue/ and fill run.
routing:
  needs_trainer_resident_data: true
  needs_gpu: false
  peak_memory_gb: 8.0
  est_minutes: 240
  basis: Estimate from the sibling fc / harness runs; the first run replaces it.
run:
  workflow: null
  note: 'Deliberately null: the instrument does not exist yet (see blocked_on). Fill in when the lever row closes.'
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
related:
- ML-N1J
- T0.4-forecast-features-DESIGN
- ROADMAP.md T0.1/T0.4
- docs/research/frontier-scan-2026-10-11.md
- FRONTIER-RESEARCH
last_dispatched_at: null
