id: RQ-20261117-617c-04
title: 'ml_entry_eq ITERATION 2: does a COST-NEUTRAL target (ATR-neutral net-R, or gross-R minus known cost) lift the equity-native ENTRY model (config B, tau 0.20,
  fixed SL2/TP3) over its live net-R recipe at matched trade count on the dev walk-forward, net of the full cost stack?'
status: blocked
cadence: once
kind: experiment
theme: ml_health
priority: 2
roadmap:
- L-ML-LIVE
programme: P8
practice_precedent: 'M2, M4 (docs/reference/trading-and-model-practice-principles.md): one-factor ablation of the training target against the incumbent recipe at matched
  trade count; every arm counted.'
question: On the dev walk-forward (<= 2025-06-30, purged), does training ml_entry_eq's config-B model on an ATR-neutral net-R target (A1) or on gross R with the known
  per-trade cost subtracted at decision time (A2) beat the live net-R target at the same number of taken trades, by >= 0.03 R per trade, net of cost?
why_this_matters: 'ITERATION (research-ops 2026-11-17, fork B). ml_entry_eq''s graded record RQ-20261105-e9a1-02 PASS (+0.0392 R, n 858) is gross 0.0899 minus cost
  0.0507: cost is 56% of gross and the iid t is 0.93. Iteration 1 (RQ-20261113-6d44-02) capped entries to the top 3 scores per bar and the mean fell from +0.129 to
  -0.058: the HIGHEST scores are the WORST trades. The sibling recipe''s diagnostic (RQ-20261111-207f-03, ml-entry-eq-struct) found the model ranks cost per R (IC vs
  cost -0.527). Same features, same symptom: the target, not the threshold, is the lever. RQ-20261117-c21d-06 (lane ML-ITERATION-REFILL-20261117, PR #26634) tests
  this lever on the struct sibling; this unit carries it to the testing leg once that harness exists for this recipe. On PASS: one confirmation on the 2025-07+ window
  then a candidate-manifest note (Tier 3); on FAIL: the cost lever is closed for this recipe and the next family is the universe (a price / ATR floor on the pool).'
power:
  expected_n: 3900
  min_detectable_effect: 0.045
  effect_units: sd
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'dev OOF decisions at tau 0.20 numbered 3,896 in RQ-20261105-e9a1-01; matched-count arms are paired on the same dates. d=0.045 at n=3900 (alpha 0.05, power 0.8).
    Day-clustered t is the reported statistic; it is weaker than iid.'
  feasibility:
    source: none
    accrual_basis: Fixed in-hand dev walk-forward on cached Alpaca bars; nothing accrues.
evidence_class:
  holdout: in_sample
  claim: edge
decision_rule:
  id: RULE-RQ20261117-617c-04-EQ-NEUTRAL-TARGET
  statistic: 'alpaca_live_book.py section_neutral (parameterized for config B, fixed SL 2 / TP 3 ATR14 bracket labels, 24-bar stop, tau 0.20 baseline): per arm the
    mean net R per taken trade at a count-matched threshold vs the live net-R recipe, day-clustered t, folds won of 5 dev folds, net of the per-symbol cost stack.'
  rule: 'PASS iff an arm beats the baseline by >= 0.03 R per trade AND day-clustered t >= holdout_lock.bar_for(2)["point_t_min"] (two arms) AND it wins >= 3 of 5 folds
    AND its yearly table is net positive in >= 2 of the 3 dev years with no year above 50% of its net (long-only leg: the sides clause is n/a). FAIL iff neither arm does
    at baseline n >= 300. INDETERMINATE iff baseline n < 300 or the producer failed. Arm denominator = 3 (baseline + A1 + A2). Thresholds not changed after any result.'
  registered_at: '2026-11-17'
  registered_before_run: true
  what_it_does_not_do: Changes no model artifact, config, roster or order path; a PASS earns one confirmation read, not a serve proposal.
