  alpha: 0.05
  power: 0.8
  basis: 'MEASURED 2026-11-01 (b609-01 W1): candidates 19.2/day -> policy 10.3/day; dev 27 policy/day; per-decision SD about 1.07 R; n=600 gives SE 0.044.'
  feasibility:
    source: none
    accrual_basis: Replays public history through 2025-09-30 (dev folds only); nothing accrues.
decision_rule:
  id: RULE-20261101-b610-01
  registered_at: '2026-11-01'
  registered_before_run: true
  statistic: 'W1 decisions of the stack: n, symbols, mean gross/cost/net R per decision, bootstrap CI95 (reported), per side, traded-5 slice, baselines (no-trade, always-long, random matched at the stack
    take rate); the same for the frozen v1 reference; variants on the window from the lock.'
  rule: 'PASS iff, net of the full cost stack on the window: (a) n >= 300 policy decisions and >= 10 distinct symbols; (b) the mean net R per decision >= 0; (c) the mean >= the frozen v1 reference''s mean
    on the same rows. FAIL iff (a) holds and (b) or (c) fails. INDETERMINATE iff (a) fails at the window close. ONE read: the lock (model id ENTRY-v2-frozen-fwd) refuses a second read; no variant of the
    artifact is scored on this window; the variant count is stated beside the result. Traded-5, bootstrap CI, per-side and baselines (no-trade, always-long/short, random matched) are reported and do not
    gate. STATED POWER (so a PASS is not over-read): the per-decision SD is about 1.07 R (W1 CI width 0.235 at n=320), so at n=600 the standard error is about 0.044 R. A PASS is a point estimate >= 0 (the
    live bar, ML-BAR-ONE-READ), not proof of an edge: a true +0.03 edge has only about 14% power to show a CI above zero at n=600 (about 8,700 decisions, years of accrual, would be needed). A FAIL with
    the CI upper bound below 0 is strong evidence against. Thresholds are not changed after the result.'
  what_it_does_not_do: Registers, serves or promotes nothing; changes no config; places no order; sizes nothing. The bybit_1 demo leg is a separate mechanics soak (1-2 clean trades) and never an edge input.
