  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 15
  basis: 'estimate: scoring is CPU-only; a 800-proposal run costs 800 x 200 random-entry draws of at most 96 bars; the packet re-derivation measured ~0.3 s per packet locally. The judging step is Claude sessions and is not this unit.'
