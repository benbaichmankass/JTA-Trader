decision_rule:
  id: RULE-RQ202611120f8702
  registered_at: '2026-11-12'
  registered_before_run: true
  statistic: Per closed trade net R (full cost stack) grouped by overlay multiplier < 1 vs = 1 across the gate legs in the real-money and mirror
    journals; difference of means with a trade-clustered CI.
  rule: PASS iff n_reduced >= 30 AND mean net R of reduced trades <= mean net R of unreduced trades (point estimate; one read of a count-closed
    window, no variant after the result). FAIL iff n_reduced >= 30 and the reduced trades mean exceeds the unreduced mean with a trade-clustered
    90% LB > 0 on the difference. INDETERMINATE otherwise or n_reduced < 30.
  what_it_does_not_do: Serves, promotes or applies nothing; changes no config; places no order. A result is a data-backed proposal for the manager,
    never an action.
