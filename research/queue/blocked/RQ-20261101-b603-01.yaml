id: RQ-20261101-b603-01
title: 'ENTRY lever 7, horizon and cadence: does a different time-stop horizon (12/24/48 h) or decision cadence (2/4/8 h) lift the dev mean, one factor at a time?'
status: blocked
cadence: once
theme: ml_health
priority: 2
roadmap:
- L-ML-LIVE
kind: experiment
practice_precedent: 'T1, M6 (docs/reference/trading-and-model-practice-principles.md): purged + embargoed walk-forward; shadow-feature (Boruta-style) controls so a model that cannot reject noise columns
  is not trusted to admit real ones.'
question: 'Horizon (time stop) is 24h and decisions are every 4h for every symbol; neither has been varied, and the a508-01 cadence arm covers only the traded five. Arms: horizon in {12, 24, 48} h at cadence
  4h; cadence in {2, 4, 8} h at horizon 24h; entry model refit per arm (labels, features and model rebuilt), tau 0.10 unchanged and the tau curve reported beside it. Three seeds.'
why_this_matters: 'Operator 2026-11-01: 20 features is a regression equation, not algorithmic trading; manager 2026-11-01 ~12:03Z: a family ablation at +0.010 cannot admit anything when the recipe overfits
  with any extra column, so fix the recipe, then the columns.'
power:
  expected_n: 60000
  min_detectable_effect: 0.01
  effect_units: metric
  sd: 1.0
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'No reading yet (untested lever). ESTIMATED cost: a table rebuild and about 9 seeded walks per factor, about 3 h of CPU.'
  feasibility:
    source: none
    accrual_basis: Replays public history through 2025-09-30 (dev folds only); nothing accrues.
decision_rule:
  id: RULE-20261101-b603-01
  registered_at: '2026-11-01'
  registered_before_run: true
  statistic: 'Per arm and seed: n, mean gross, cost and net R per decision at the frozen entry tau; seed mean and range; per-fold and per-calendar-year net; traded-5 slice beside the pooled frozen-60 population.'
  rule: 'Per-arm decision counts differ by design, so rule (1) uses a floor of 1000 per fold on the pooled population and the comparison is on mean net R per decision AND on net R per symbol-day (reported,
    the decision metric stays per decision). A lever arm WINS iff, net of the full cost stack on the dev folds, on the pooled frozen-60 population (the traded five are reported beside it, never instead):
    (1) every fold keeps >= 1000 scored decisions (else INDETERMINATE); (2) the mean over seeds 7/11/13 beats the base arm by >= 2 x the base seed range (base range 0.0034 (MEASURED 2026-11-01, v1 frozen
    recipe at a fixed tau on the pooled 60 symbols over the dev folds: per-seed means +0.0063..+0.0097, n about 72k; traded-5 range 0.0058), recomputed from this run''s base arm if larger); (3) it is better
    than the base in >= 6 of 8 dev folds; (4) its sign is the same in >= 3 of 4 calendar years. A winner is only a CANDIDATE: it is selected on dev alone and goes, with the other winners, into ONE combined
    held-out read (a later unit, ML-BAR-ONE-READ); no arm of this unit reads a held-out or sealed window. Thresholds are not changed after any result.'
  what_it_does_not_do: Reads no sealed or held-out window (dev folds only), serves nothing, changes no config or live symbol list, places no order, sizes nothing.
  min_n: 1000 dev decisions per fold
