  clears_when: 'ML-HEAD-AGREEMENT-JOIN merged and one joined file per advisory head exists on the trainer; then add a `conformal.stream: {kind: joined_shadow_log,
    path: ...}` loader to conformal_abstain_eval.py (a ~30-line reader, no new statistics), git mv to research/queue/, run.workflow research-script-run-trainer.yml,
    run.command [python3, scripts/research/conformal_abstain_eval.py, --unit, ''{unit}'', --out, ''{out_dir}''].'
