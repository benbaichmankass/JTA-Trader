id: RQ-20261011-9da8-03
title: 'Frontier: conformal abstention on the advisory volatility-regime heads (Mondrian split-conformal vs a plain probability threshold at matched coverage)'
status: blocked
cadence: once
theme: ml_health
priority: 2
kind: experiment
question: On the shadow log of the three advisory regime heads (btc/sol-regime-15m-lgbm-fc-pcv-v2, mes-regime-5m-lgbm-v2), does a rolling-calibrated Mondrian
  (per vol-bucket) split-conformal abstention rule give a lower selective error rate than the plain max-probability threshold at the SAME coverage, while
  keeping empirical coverage within 3 points of nominal in every rolling 30-day window?
why_this_matters: 'Calibrated abstention is the direct answer to ''the head is right only when it is confident'' and a family the registry has never tried
  (conformal_calibration: 0 models). It adds no new learner and costs almost nothing, so it is the cheapest family-diversity test. Honest limit (arXiv 2607.24875):
  conformal guarantees assume exchangeability, which regime shifts weaken -- that is why the rule tests rolling-window validity, not just average coverage.'
power:
  expected_n: 3
  min_detectable_effect: 0.3
  effect_units: sd
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'Three heads, ~10^4-10^5 labelled shadow rows each (shadow/stats: 69,706 retained rows across 36 models since 2026-09-26) -- the unit of analysis
    is the rolling window, ~30 days x 3 heads.'
  feasibility:
    source: none
    accrual_basis: Row counts per head are read from the shadow log at run time; windows with < 200 labelled rows are excluded and counted.
decision_rule:
  id: RULE-RQ1011-9DA8-03-CONFORMAL-ABSTAIN
  registered_at: '2026-10-11'
  registered_before_run: true
  statistic: 'Per head: selective error rate (misclassification rate among non-abstained rows) of (a) the plain threshold and (b) the conformal rule, at
    matched coverage in {50%, 70%, 90%}; empirical coverage per rolling 30-day window vs nominal.'
  rule: PASS IF on at least two of three heads the conformal rule has selective error lower than the plain threshold at all three coverage levels AND rolling-window
    coverage stays within +/-3 points of nominal in >= 90% of windows. FAIL IF either condition fails on two or more heads (validity broken by drift, or
    no gain). INDETERMINATE IF fewer than 6 usable windows per head.
  what_it_does_not_do: Does not change any head, threshold or order path. 'Abstain' here is measured offline on the shadow log; wiring it as a per-trade
    RiskManager refusal is a separate Tier-3 proposal. No halting, no mode flip.
