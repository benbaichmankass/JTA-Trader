decision_rule:
  id: RULE-RQ-20261123-1e04-02
  registered_at: '2026-11-23'
  registered_before_run: true
  statistic: 'index_signal_etf_harness: lower-high rule = confirmed pivot-5 high lower than the prior pivot-5 high while the index is below its 50-day mean; entry
    next open in the inverse ETF; stop = that lower high mapped through the ETF; TP calibrated K*; hold cap 15 sessions; net_r, n, maxDD, per-fold, decay drag. Cost
    stack: fee 0 + 5 bps slippage per side (2x slippage re-read), the ETF price series itself (embeds daily-rebalance decay and expense ratio over the hold), no funding.
    TP doctrine: the TP is the index-structure target mapped to the ETF (index move x leverage sign), a real predictive TP at entry, calibrated by tp_prediction_derive
    on the in-sample span, never tp_r 50.'
  rule: PASS IFF n >= 25 AND net_r > 0 AND net_r > net_r of RQ-20261123-1e04-01 on the same index (or 1e04-01 INDETERMINATE and net_r > 0 in >= 3 of 4 folds) AND
    net_r > 0 under 2x slippage. INDETERMINATE if n < 25. FAIL otherwise. Parameters fixed now.
  what_it_does_not_do: Changes no config.
  baseline: Flat; and 1e04-01 on the same index.
