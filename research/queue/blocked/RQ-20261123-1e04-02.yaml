question: After an index bounces and fails at a lower high (daily close back below the 20-day mid, pivot-5 lower-high confirmed), does buying the inverse ETF with
  the stop above that lower high and a calibrated TP earn positive net R net of decay, versus flat and the 1e04-01 breakdown form?
why_this_matters: The continuation form trades the clean downtrend leg after confirmation, which should hold the ETF for fewer chop sessions than a breakdown-at-low
  entry.
