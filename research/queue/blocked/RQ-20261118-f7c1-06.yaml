  fail_action: record FAIL for exactly FT-Transformer / declared schedule / v1 recipe / raw target in the diversity ledger; the deep-tabular family is NOT
    retired on one configuration.
  what_it_does_not_do: Changes no served model or config. No architecture search. A PASS is not a promotion. The window was read before (declared, as dbf8-01).
  min_n: 10 paired windows with >= 30 decisions per arm; 300 pooled decisions
