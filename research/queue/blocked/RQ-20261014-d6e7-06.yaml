id: RQ-20261014-d6e7-06
title: >-
  In-trade exit line, rung 6: the first-passage census and the exit-now policy on HARNESS-NATIVE per-bar paths of the real-money
  legs -- the leg as it trades, not a fixed bracket. BLOCKED: no harness emits per-bar paths (EXIT-PATH-EMIT-OFFLINE)
status: blocked
cadence: once
theme: live_strategy
priority: 1
kind: experiment
question: >-
  On config-exact harness runs of the real-money legs with --emit-paths (the stop and target IN FORCE at every bar, so trailing,
  TP revision and stale exits are the leg's own): (a) the d6e7-01 census quantities with the leg's actual exit as the passage event,
  and (b) the d6e7-03/05 policy (whichever passed) applied bar by bar against the leg's ACTUAL exit, net of the full cost stack
  -- does the exit-now rule beat the leg as it trades, per leg?
why_this_matters: >-
  Rungs 1-5 answer the operator's question on a plain bracket built from committed ledgers. Before anything is proposed for a real-money
  leg it has to beat that leg's own exit (trailing stop, TP revision, stale exit), which needs the harness's own per-bar path.
  This is also the corpus RQ-20261011-9da8-04 (exit-arm bandit) and blocked/RQ-20261014-9807-05 (momentum-turn labels) consume.
power:
  expected_n: 600
  min_detectable_effect: 0.05
  effect_units: metric
  sd: 0.8
  design: paired
  alpha: 0.05
  power: 0.8
  basis: >-
    Paired per trade; the real-money 4h/2h legs carry ~50-120 trades each per committed ledger (46-232, MEASURED 2026-10-14 from
    the newest ledgers), so per leg this is underpowered for 0.05 R and the rule pools within family; per-leg rows are reported
    with their n.
  feasibility:
    source: none
    accrual_basis: Harness re-runs; nothing accrues. Blocked on the emit.
decision_rule:
  id: RULE-RQ20261014-D6E7-06-HARNESS-NATIVE-EXIT-POLICY
  registered_at: '2026-10-14'
  registered_before_run: true
  statistic: >-
    Per family (trend_donchian 4h, pullback 2h) and per leg: policy net R - the leg's actual net R per trade (same trade, policy
    early exit pays the extra cost_slippage_r), trade bootstrap CI, 6-fold yearly walk-forward sign; net R per capital-day both
    arms.
  rule: >-
    PASS IF within a family the per-trade gain >= 0.05 R with CI lower bound > 0 AND >= 5 of 6 walk-forward folds positive AND
    maxDD not worse than 1.35x the leg's -> exit-refinement P2 gate + observe-only shadow on the first leg (Programme 01 Q8), Tier-3
    proposal only after the shadow's parity read. FAIL IF the CI upper bound < 0.05 R: the leg's own exit already captures what
    the model sees. INDETERMINATE otherwise or under n.
  min_n: 100 trades per family
  what_it_does_not_do: >-
    Requires a rung-3 or rung-5 PASS to be worth running; it is the confirmation, not a new search. Changes no config.
blocked_on:
- what: >-
    No harness emits per-bar in-trade paths with the stop/target in force at each bar; harness --emit-trades rows are per-trade,
    and first_passage.py's re-walk can only reconstruct a FIXED bracket.
  ref: docs/claude/work/checklist/EXIT-PATH-EMIT-OFFLINE.json
  clears_when: >-
    EXIT-PATH-EMIT-OFFLINE lands --emit-paths on backtest_trend.py + backtest_pullback.py with its parity test, AND RQ-20261014-d6e7-03
    or -05 has graded PASS. Then git mv to research/queue/, status queued, set run.command (a --paths reader mode on first_passage.py)
    and requires_result.
