id: RQ-20261101-c692-05
title: 'ENTRY v2 under the first-passage label contract: 1m-resolved ties, a 3-class (target-first / stop-first / timeout-by-24h) classifier per
  side driving the same tau policy -- does the pooled 60-perp model still reach held-out mean net R per decision >= 0, and how well calibrated
  is each outcome class?'
status: blocked
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: experiment
practice_precedent: 'T1, M6 (docs/reference/trading-and-model-practice-principles.md): purged + embargoed walk-forward with a sealed held-out
  window; triple-barrier first-passage labels (Lopez de Prado 2018, ch. 3); docs/research/ml-decision-models-2026-11-01/DESIGN.md.'
question: 'As RQ-20261101-c692-01 (universe, window, features, purge/embargo, dev folds, tau grid and rule, reference bracket 2/3 ATR, 24h, full
  cost stack) with two changes only, both from the operator first-passage contract (DESIGN.md section 1b): (1) labels from scripts/research/decision_labels.py
  with same-bar double touches resolved on Binance Vision 1m klines (still-ambiguous kept SL-first and counted); (2) the model is a LightGBM 3-class
  first-passage classifier per side; its score is sum over classes of P(class) x that class mean net R on the training rows. Held-out per-class
  Brier and a 10-bin reliability table are reported.'
why_this_matters: 'Operator directive 2026-11-01 (row ML-DECISION-MODELS): ML decision makers live on real money as soon as possible; live bar
  "Point estimate >= 0", path "Straight to real money" (bybit_2 + mirror). This is the critical path: BRACKETS (c692-02) and MANAGE (c692-03)
  compose on top of it.'
power:
  expected_n: 3000
  min_detectable_effect: 0.06
  effect_units: metric
  sd: 1.0
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'INFERRED capacity: 60 symbols x 365 held-out days, decisions every 4h, one position per symbol with holds <= 24h gives ~20,000 free
    slots; a take rate of 15 percent gives ~3,000 decisions. sd ~1 R because net R is bounded near [-1.1, +1.4] under the 2/3 ATR bracket. The
    operator bar is a point estimate (>= 0), not a test against 0; the n floor 300 (DESIGN section 1.7) keeps the SE near 0.06 R.'
  feasibility:
    source: none
    accrual_basis: Replays public history; nothing accrues. The run records the observed n and sd.
decision_rule:
  id: RULE-RQ20261101-c692-05-ENTRY-V2
  registered_at: '2026-11-01'
  registered_before_run: true
  statistic: 'Held-out mean net R per taken decision, n, distinct symbols (as c692-01); reported: per-class Brier and reliability (10 bins) per
    side, still-ambiguous tie count, the c692-01 held-out mean on the same window.'
  rule: INDETERMINATE IF no tau reaches dev n >= 1000, OR held-out n < 300, OR held-out distinct symbols < 10, OR the label manifest is missing
    its tie_resolution counts. PASS IF held-out mean net R per decision >= 0. FAIL otherwise. Calibration is reported, never gating. A PASS makes
    this recipe the one the live adapter serves (it is the contract-compliant one); a FAIL with c692-01 PASS is reported to the manager with both
    records. Thresholds are not changed after any result.
  what_it_does_not_do: No sizing, no config change, no order.
  min_n: 300 held-out decisions on >= 10 symbols
compute: cpu_long
value:
  bucket: ai_trader
  usd_at_stake_per_month: 800
  confidence: 0.2
  basis: 'stand-in: the operator priority-1 goal (first ML decision model on real money); not a P&L measurement.'
