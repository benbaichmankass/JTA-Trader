id: RQ-20261101-fs06-01
title: 'ENTRY label/target fix: does a market-neutral or rank-transformed target (instead of raw net R per side) stabilise the dev folds and raise the leave-one-fold-out mean at the same features? Dev folds only, noise controls built in'
status: blocked
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: experiment
practice_precedent: 'T1, M6 (docs/reference/trading-and-model-practice-principles.md): purged + embargoed walk-forward; shadow-feature (Boruta-style) controls so a model that cannot reject noise columns is not trusted to admit real ones.'
question: 'Dev folds swing from -0.10 to +0.06 net R per decision across half-year periods for the same model, so the target carries a market-regime component the 20 features cannot explain. Arms (features fixed at the 20 baseline, recipe fixed at the baseline LightGBM parameters, same labels and cost stack; only the TRAINING TARGET changes, scoring is always raw net R): T0 raw net R per side; T1 net R minus the cross-sectional mean of net R over the 60 symbols at the same decision timestamp (market-neutral alpha); T2 per-timestamp cross-sectional rank of net R scaled to [-1, 1]; T3 net R clipped to [-3, +3] ATR-risk units; T4 first-passage 3-class classifier per side (target-first / stop-first / timeout) with score = sum of P(class) x class mean net R (the contract of DESIGN.md section 1b, ties SL-first until DATA-LABEL-TIES lands). Each arm also runs S1 = 20 columns plus 9 noise columns as the noise control and three seeds (7, 11, 13). No sealed window is read.'
why_this_matters: 'Manager 2026-11-01 ~12:03Z: labels/targets are the other lever after the recipe; operator 2026-11-01: improving the labelling is super important.'
power:
  expected_n: 60000
  min_detectable_effect: 0.01
  effect_units: metric
  sd: 1.0
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'INFERRED: dev folds hold about 6 x 10^4 scored decisions at the chosen tau (arm A, 2026-11-01: 67,860 leave-one-fold-out). The seed-to-seed spread of arm A (measured, A vs A2: 0.0017 leave-one-fold-out, 0.003 to 0.005 pooled at a fixed tau) is the noise floor the rule is set against.'
  feasibility:
    source: none
    accrual_basis: Replays public history through 2025-09-30 (dev folds only); nothing accrues.
decision_rule:
  id: RULE-20261101-fs06-01
  registered_at: '2026-11-01'
  registered_before_run: true
  statistic: 'Per arm, seed and fold: n and sum of raw net R at the leave-one-fold-out tau; pooled mean; across-seed spread; noise-control delta; per-fold comparison with T0; fold-to-fold standard deviation of the mean (stability).'
  rule: "A target arm is ADMITTED iff its mean-over-seeds leave-one-fold-out mean (S0) beats T0 by >= 2 x spread (spread = the across-seed range of T0, measured) AND it is better than T0 in >= 6 of 8 folds AND its noise-control delta (S1 - S0) is >= -spread. If none is admitted the result is 'target change does not help the dev folds' and the lane reports that the pooled bar-level recipe has no measured edge above the seed noise. Thresholds are not changed after any result. INDETERMINATE if spread cannot be computed or any fold has fewer than 1000 scored decisions."
  what_it_does_not_do: 'Reads no sealed window (dev folds only), serves nothing, changes no config, places no order, sizes nothing.'
  min_n: 1000 dev decisions per fold
compute: cpu_long
