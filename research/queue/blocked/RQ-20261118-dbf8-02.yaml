id: RQ-20261118-dbf8-02
title: 'Tabular foundation model on a MONEY label (D3 Foxhound): does TabICLv2 (BSD-3, in-context, no training) at FULL n on a GPU beat LightGBM on the
  trades each would take at actual net R? (the same 13 monthly refits as RQ-20261118-dbf8-01)'
status: blocked
cadence: once
theme: ml_health
priority: 2
roadmap:
- L-ML-LIVE
kind: experiment
origin: new_hypothesis
practice_precedent: 'https://arxiv.org/abs/2602.11139 (M6) -- Qu, Holzmueller, Varoquaux, Le Morvan, TabICLv2, arXiv 2602.11139 (PRIMARY abstract read 2026-11-18; licence bsd-3-clause read on
  the Hub card jingang/TabICL): reports SOTA on TabArena and TALENT over RealTabPFN-2.5 without tuning (author-reported, not replicated by us). A secondary
  write-up says GBDTs keep the edge above ~100 features; ml_decision_entry has fewer (declared, re-counted at run time).'
levers:
- name: learner
  values:
  - LightGBM (RAW, baseline)
  - TabICLv2 regressor, full training rows, GPU (TICL, decided)
  hypothesised_effect: TICL raises held-out net R per decision by >= +0.06 vs RAW
question: As RQ-20261118-dbf8-01, with TabICLv2 as the candidate learner at full n (no 5,000-row CPU cap), run where a GPU exists (Kaggle).
why_this_matters: 'Every tabular-FM arm so far (65cc-06/07/08, ff8f-02, 4a3b-01, 38be-01, eda2-02) ran on regime/direction labels and either came back
  unavailable (CPU cap), timed out, or ran capped at 3-12k rows. The family has never been tested at full n on a label that changes an order. ML-FRONTIER-PREP-20261118
  frontier rank #2.'
evidence_class:
  holdout: holdout_window
  claim: edge
power:
  expected_n: 13
  min_detectable_effect: 0.06
  effect_units: metric
  sd: 0.074
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATE (QUOTED): the same windows and sd as RQ-20261118-dbf8-01 / 4654-07.'
  feasibility:
    source: none
    accrual_basis: Replays published Binance history; nothing accrues.
decision_rule:
  id: RULE-RQ20261118-dbf8-02-TABICL-ENTRY
  registered_at: '2026-11-18'
  registered_before_run: true
  baseline: 'RAW: the same LightGBM recipe, same origins, rows, tau and cost stack. Net of the full cost stack.'
  statistic: per 28-day window, mean actual net R per taken decision; d_w = TICL - RAW over windows where both took >= 30 decisions; mean, sd, 95% t-interval.
  rule: 'PASS iff >= 10 paired windows AND mean d >= +0.06 R/decision AND the 95% t-CI lower bound > 0 AND TICL pooled n >= 300. FAIL iff >= 10 paired
    windows AND mean d <= 0 AND the TICL arm ran at full n on every window. INDETERMINATE otherwise; an unavailable or capped arm is INDETERMINATE, never
    FAIL. Thresholds are not changed after any result.'
  pass_action: a Tier-3 proposal note on ML-ENTRY-FINETUNE (candidate manifest; serving is mirror-publish of scores from the trainer/GPU, zero torch on
    the money box) and a serving-latency unit; tag tabular_foundation_model PASS with this configuration.
  fail_action: record FAIL for exactly TabICLv2 / full n / v1 recipe / raw target in families.tabular_foundation_model.history; the family is NOT retired
    on one configuration.
  what_it_does_not_do: Changes no served model or config. No fine-tuning of TabICL. TabPFN is not an arm (non-commercial weights; research-only). A PASS
    is not a promotion.
  min_n: 10 paired windows with >= 30 decisions per arm; 300 pooled decisions
blocked_on:
- what: 'Two builds: (a) FRONTIER-LEVER-TABULAR -- the learner set observed importable on a GPU backend (a PROBE_LEARNERS line from Kaggle in a run log);
    (b) a tabicl learner arm in scripts/research/ml_entry_residual.py plus a Kaggle (GPU) route for that script (today it runs only on research-script-run,
    4 vCPU, where TabICL at full n timed out in 4a3b-01).'
  ref: FRONTIER-LEVER-TABULAR
  kind: build
  clears_when: 'FRONTIER-LEVER-TABULAR closes with a Kaggle PROBE_LEARNERS line showing tabicl ok on GPU, and the tabicl arm lands with a smoke run; then
    git mv to research/queue/, set status queued and fill run.workflow/run.command.'
  owner: FRONTIER-LEVER-TABULAR (checklist row; raised to the manager by ML-FRONTIER-PREP-20261118 as queued for 4+ scans)
compute: gpu
value:
