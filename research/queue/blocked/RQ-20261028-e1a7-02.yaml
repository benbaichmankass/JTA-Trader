id: RQ-20261028-e1a7-02
title: 'Fresh-window confirmation of the ALLOW / BLOCK tighten split on CLAUDE-judged trades: on random entries after the S0 corpus (2026-09-07..10-24), walked by Claude under C4E, do BLOCK-cell tightens still lose vs hold and ALLOW-cell tightens stay within 0.05 R of hold?'
status: blocked
cadence: once
theme: live_strategy
priority: 2
roadmap:
- L-ATM
- L-DESK
kind: experiment
practice_precedent: 'T1, T5, M5 (docs/reference/trading-and-model-practice-principles.md): judge intervention against hold, separate the check-in clock from the action rate, confirm once on a fresh window.'
intervention_controls:
  hold_to_bracket: true
  # per-tighten ablation is already paired against hold; matched-random = the same tighten count and level offset at random check-ins of the same trade
  matched_random: {draws: 100}
  best_static: {grid: [breakeven, atr_trail, structure, giveback, losscut], excludes_test_folds: true}
  bootstrap_group: week
question: >-
  On up to 420 fresh random market entries (six USD-M perps, 1h, contract C48, 2026-09-07..2026-10-24), generated by
  scripts/research/ltr_tighten_optimize.py::fresh_entries (seed 20261028, the same entries as that lane's FRESH split), each is walked by a Claude judge under
  check-in policy C4E with WALK-PROTOCOL.md unchanged from DESK-LIFECYCLE-S0. What is the per-tighten ablation value (that tighten replaced by hold) in the
  BLOCK cell (open < +1 R or the new stop below breakeven) and in the ALLOW cell (open >= +1 R and the new stop >= breakeven), both with and without the
  1-ATR buffer?
why_this_matters: >-
  The ALLOW / BLOCK split proposed by LTR-TIGHTEN-OPTIMIZE was chosen after seeing the S0 slices (post hoc). Its only clean out-of-sample test on the actor the
  live LTR actually is (a Claude judge) is a fresh window. Rules alone cannot answer it: the mechanical rule grid's best held-out arm was INDETERMINATE
  (+0.009 R fresh, CI spans 0). The split decides whether live auto-tightening is restricted or made advice-only.
power:
  expected_n: 400
  min_detectable_effect: 0.10
  effect_units: R
  sd: 0.74
  design: paired
  alpha: 0.05
  power: 0.8
  basis: >-
    MEASURED on S0: 981 tightens over 938 walked trades (1.05 per trade), 59% BLOCK and 41% ALLOW; per-tighten dR sd 0.74 R. So 420 trades give ~260 BLOCK and
    ~180 ALLOW tightens. At sd 0.74 that resolves about +-0.13 R (BLOCK) and +-0.15 R (ALLOW); the rule grades the observed CI, never a lowered bar.
  feasibility:
    source: none
    accrual_basis: >-
      The candles exist now (fetched to 2026-10-27). The spend is plan-session judging: about 6.2 check-ins per trade x 420 trades x $0.053 MEASURED
      per check-in (S0 full run), roughly $140, on the plan with no API credits. It needs a manager GO and a ceiling.
decision_rule:
  id: RULE-RQ20261028-E1A7-02-FRESH-TIGHTEN-SPLIT
  registered_at: '2026-10-28'
  registered_before_run: true
  statistic: >-
    The per-tighten ablation value exactly as scripts/research/ltr_tighten_optimize.py slices computes it (desk_lifecycle_driver.run, C4E, full cost stack, a
    +0.05 R moved-stop sensitivity reported), cut into the BLOCK and ALLOW cells. The weekly-cluster bootstrap 97.5% CI uses 10,000 draws, seed 20261028.
  rule: >-
    Bonferroni over 2 cells. KEEP_RESTRICTION if the BLOCK CI upper bound < 0 AND the ALLOW CI lower bound > -0.05 R. ADVICE_ONLY if the ALLOW CI upper bound
    < -0.05 R, or the ALLOW mean < BLOCK mean + 0.05 R with BLOCK's CI upper bound < 0. INDETERMINATE otherwise; then the restriction stays as proposed and
    the operator is told it is unconfirmed. VOID if any judge transcript holds a tool call other than the registered walk command (S0's isolation audit).
    Numbers are fixed before the run.
  what_it_does_not_do: >-
    Edits no config or policy. It confirms or refutes a Tier-3 proposal that goes to the operator.
blocked_on:
- kind: work_item
  ref: LTR-TIGHTEN-OPTIMIZE
  what: >-
    Plan-session judging is not runner compute: the manager must dispatch a judging lane with a dollar ceiling (about $140 estimated). The walk tooling
    exists (desk_lifecycle_driver.py walk / step / score). Fresh entries need an `entries --fresh` route, or a one-off entries.jsonl written by
    ltr_tighten_optimize.fresh_entries.
  clears_when: >-
    The manager GOes a judging lane with a ceiling. That lane writes the fresh entries.jsonl, walks it, and runs ltr_tighten_optimize.py slices on the result
    (with --lifecycle pointing at it). This unit then closes by hand-grading against the rule above. It is never dispatched to a runner.
compute: cpu_light
value:
  usd_at_stake_per_month: 150
  confidence: 0.2
  bucket: ai_trader
  basis: 'stand-in: decides whether the live LTR auto-tighten is restricted or advice-only; an estimate, not a measurement.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 30
  basis: 'Estimate for the scoring step only; judging is plan-session time, not runner time.'
run:
  command:
  - python3
  - scripts/research/ltr_tighten_optimize.py
  - slices
  - --lifecycle
  - '{out_dir}/fresh-c4e'
  - --out
  - '{out_dir}'
  inputs:
    research_unit: RQ-20261028-e1a7-02
  timeout_minutes: 60
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
related:
- RQ-20261028-e1a7-01
- RQ-20261028-d1f5-02
- scripts/research/desk_lifecycle_driver.py
- scripts/research/ltr_tighten_optimize.py
- docs/research/ltr-tighten-optimize-2026-10-28.md
last_dispatched_at: null
