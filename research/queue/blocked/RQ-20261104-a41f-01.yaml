  funding_bps_per_8h: 0.0}} (no artifact_bps_rt: tau is NOT re-based). Load ml/served/ml_decision_entry_v1/model.json as served (sha256 recorded).
  For every symbol of config/accounts.yaml alpaca_live symbols: (re-parsed at run time) build Yahoo 1h REGULAR-session bars from 2024-11-18 (Yahoo''s
  ~730-day 1h reach) with the harness''s features; cross-sectional / BTC features against the model''s 60-perp xs_reference (Binance Vision 1h)
  as of the equity bar''s close. Decide at RTH bar closes with UTC hour % 4 == 0 (the model clock) that ALSO pass the live session gate (us_equity
  open at the close and at close + 24h); LONG when p_long > tau (the restricted argmax: p_short is never compared); entry next RTH open; first
  passage SL 2 ATR14 / TP 3 ATR14 / 24-bar time stop; one position per symbol. Net of fee 0.0 + slippage 5.0 bps (PROVISIONAL) + regulatory 0.5
  bps round trip, funding 0. Score 2025-02-10..2025-09-21 ONCE.'
why_this_matters: 'The operator target (row ML-ENTRY-ALL-ACCOUNTS 2026-11-03 ~10:50Z, verbatim: "If we can get that going Wednesday night, then
  maybe we can get it trading by Thursday evening or Friday") is ml_entry on alpaca_live. The code that makes it a CONFIG change is the held Tier-3
  PR of this lane; the roster add needs THIS record. The prior read is a FAIL and is context, not a gate: RQ-20261101-bdc2-01 read -0.308 R per
  decision (n=128) for the SERVED side rule (a SHORT argmax -> nothing) with decisions at the session close. This unit tests the two execution
  rules the profile changes (restricted long argmax; session gate) on a window bdc2-01 never read.'
