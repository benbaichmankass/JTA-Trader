  that fail the filter are not tested (counted and listed).'
per_symbol_rule:
  id: RULE-ML-UNIVERSE-PER-SYMBOL-SHRUNK-N100
  registered_at: '2026-11-04'
  registered_before_run: true
  operator_decision: 'Operator 2026-11-04 ~19:18Z popup answer, verbatim (relayed by Manager Session 2026-11-04a): "Shrunk ≥ 0, n ≥ 100 (Recommended)".
    Earlier ~19:08Z: "Per-symbol passes (Recommended)", "Per-symbol tests (Recommended)". ~19:06Z: "the MLs trade whatever is whatever they''re
    set to trade. They don''t have their roster is internal to the ML, and it''s based on what tests have passed versus which ones have not."'
  population: 'the CANDIDATE POOL in `population` (and every ETF ml_entry trades on alpaca_paper today: SPY QQQ IWM TLT IEF SLV USO GDX TQQQ QLD
    SPYM IAUM SCHA, tested whether or not the filter keeps them)'
  window: '2021-01-01..the last complete month before the run (Alpaca 1h RTH bars; the crypto reference perps need >= 2020 history). DECLARED:
    the crypto rows of that calendar overlap v1s training (train_end_exclusive 2025-09-22 19:00Z) for the CROSS-SECTIONAL reference features;
    the ETFs were never trained on. Reported beside each verdict, never gating: the same statistic on 2025-10-01 onward only (the clean part).'
  statistic: 'Per symbol s, over the arm-A (tau policy, one position per symbol) decisions on the window, each net of fee 0.0 (Alpaca commission-free)
    + slippage 5.0 bps round trip (PROVISIONAL, src/runtime/execution_costs.resolve_cost_policy) + regulatory 0.5 bps round trip, funding 0: n_s,
    m_s = mean net R per decision, se_s = sd_s / sqrt(n_s). Pooled mu = the inverse-variance-weighted mean of m_s over symbols with n_s >= 100;
    between-symbol variance tau2 by DerSimonian-Laird (floored at 0). shrunk_s = mu + tau2 / (tau2 + se_s^2) x (m_s - mu) (empirical-Bayes, shrunk
    to the pooled mean by its own SE). With tau2 = 0 every symbol reads mu: the per-symbol verdicts then coincide with the pooled sign (stated
    here, before the run). Decisions: RTH bar closes with UTC hour % 4 == 0 that pass the live session gate (us_equity open at the close and at
    close + 24h); LONG when p_long > tau (restricted argmax); entry next RTH open; SL 2 ATR14 / TP 3 ATR14 / 24-bar time stop; one position per
    symbol.'
  rule: 'Per symbol: INDETERMINATE IF n_s < 100 (keeps the account''s current set for that symbol). PASS IF n_s >= 100 AND shrunk_s >= 0. FAIL
    IF n_s >= 100 AND shrunk_s < 0. Re-evaluated monthly on the window extended by each new forward month (pooled per symbol; a monthly re-read
    is a new claim, rule unchanged); a FAIL removes the symbol. The run writes comms/ml_universe/ml_entry.json (schema ml_universe/1, src/config/ml_universe.py)
    with every tested symbol''s verdict, n, m, se, shrunk and the venues that list it at run time; that record, not config, decides what ml_entry
    trades. Thresholds never change after any result.'
  multiple_comparison_note: 'Shrinkage is the multiple-comparison control across symbols (no per-symbol alpha); a symbol is never selected on
    its raw mean. MEASURED context (comms/research/ML-ENTRY-UNIVERSE/local-20261101T1830Z/summary.json): per-symbol n median 225, se ~0.087 R,
    pooled edge +0.0073; 25 of 51 raw re-costed means read >= 0.'
