id: RQ-20261011-9da8-06
title: 'Frontier strategy: cross-sectional momentum on the crypto perp basket with funding charged on held legs (Stage-0)'
status: blocked
cadence: once
theme: new_strategy_prop
priority: 2
kind: experiment
question: Over the declared 1d basket, does the cross-sectional momentum long/short (long top tercile, short bottom tercile
  by trailing return) show positive net R after fees, slippage AND the funding actually paid or received on each held perp
  leg?
why_this_matters: Cross-sectional momentum is documented in crypto but its edge is the kind funding erodes (the long leg usually
  pays funding in uptrends). scripts/backtest_xsec_momentum.py has slippage wired but no funding term (CLAUDE.md), so any
  current number overstates the long side. Different mechanism from TSMOM (relative, not absolute) and from every roster family.
power:
  expected_n: 40
  min_detectable_effect: 0.45
  effect_units: sd
  design: paired
  alpha: 0.05
  power: 0.8
  basis: Same E35 floor; the basket rebalances ~weekly, giving ~150 rebalances over 3y.
  feasibility:
    source: none
    accrual_basis: ''
decision_rule:
  id: RULE-RQ1011-9DA8-06-XSEC-MOM-FUNDING
  registered_at: '2026-10-11'
  registered_before_run: true
  statistic: net_total_r and n_trades from the harness with funding accrued exactly from settled rates over each holding interval.
  rule: PASS IF net_total_r > 0 AND n_trades >= 39; FAIL IF net_total_r <= 0 with n >= 39 (one pass -> confirmatory re-run
    before a kill); INDETERMINATE IF n < 39. If gross > 0 and net <= 0 only because of funding, REPORT the funding share as
    the headline.
  what_it_does_not_do: No roster or config change; no live leg proposed. Does not apply to prop venues (props pay no funding
    and charge swap).
