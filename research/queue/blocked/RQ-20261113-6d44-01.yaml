blocked_on:
- kind: tool
  what: 'the ablation harness does not exist. ml_entry_levers.py has stack_unit (cumulative S1..S3 on DEV folds only) and w1_unit (one stack, hard
    wired to W1 and to the b608 winning stack); neither fits several arms at one cutoff and scores a chosen post-cutoff window. Needed: an opt-in
    subcommand `ml_entry_levers.py ablate-window --start 2025-10-01 --end 2026-09-30` (arms V1, V2, V2-R2, V2-gate, V2-2/4; seeds 7, 11, 13;
    share, tau and k fixed on dev rows; a holdout_lock claim per arm before any outcome) and the runner mode `ml_entry_v2_run.py ablate` that
    fetches the klines and calls it.'
  clears_when: 'both land with a self-test proving (a) the V2 arm reproduces stack_unit''s S3_R2_gate_24 policy on a synthetic table, (b) every
    claim is written before any outcome is read and refuses a window that overlaps the fit (holdout_lock rule 4), and (c) V1 at tau 0.10 equals
    the base arm; then git-mv this file to research/queue/ with the rule unchanged.'
