holdout_ledger: 'Window 2025-10-01..2026-09-30 was read before by the ENTRY family (comms/research/holdout_reads.jsonl: ENTRY-v1-c692-01 and
  later re-reads; `holdout_lock.py families` shows the next bar). Rule 1 / 2 of holdout_lock.py: a re-read is allowed and every arm''s read is
  claimed (family ENTRY, train_end 2025-09-23) BEFORE any outcome; this rule is relative (arm vs arm on the same rows), so the deflated bar is
