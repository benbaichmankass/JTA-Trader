id: RQ-20261022-b7e1-05
title: 'Q14 lever (EFFICIENCY-RATIO-GATED tight trail): on xrp_pullback_2h, once a trade is >= 1.5 R up AND the 6-bar efficiency
  ratio is below 0.20 / 0.30 / 0.40, does tightening the trail to 2.5 x ATR beat the declared exit AND the same tightening
  applied ungated, on net R in 5 of 6 folds?'
status: blocked
cadence: once
roadmap:
- L-ATM
- M20
theme: live_strategy
priority: 1
kind: experiment
question: On xrp_pullback_2h (real money on bybit_2 + mirror), does a trail that tightens from the declared 5.0 x ATR to 2.5
  x ATR only while peak_r >= 1.5 AND er_6 < thr (thr 0.20 / 0.30 / 0.40 declared now, not tuned) beat the declared exit A
  by >= 0.02 R/trade in >= 5 of 6 folds within the Path B drawdown bar, AND beat the ungated R-armed tight trail UT15 (peak
  >= 1.5 -> 2.5, the RQ-20261022-eba2-03 arm)? Kaufman's efficiency ratio is the practitioner measure of how much of the move
  was directional; a LOW ratio after a profitable run is the chop-after-trend state.
why_this_matters: 'Operator idea (IDEAS.md 2026-10-21): surf the volatility instead of holding through it. Today''s results
  say acting on EVERY trade fails (fixed 50% bank -43..-68 R on ada_pullback_2h, level-triggered tightening, 1R giveback stop;
  RQ-20261022-fd06-*, -001..006): the declared wide trail earns its R in the right tail. This unit asks the SELECTIVE form
  with a feature chosen from the in-trade path measurement. Discovery (X=1.0, xrp_pullback_2h): er_w AUC 0.472, same side
  in 5 of 6 folds (lower ER -> more giveback), n 170/145 trades with a state; modest, which is why the control is the ungated
  tighten.'
power:
  expected_n: 394
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'Floor (1.96 + 0.8416)^2 / 0.45^2 = 38.76 -> 39 incumbent trades; incumbent n is MEASURED per leg in the sibling
    units (ada_pb 402, xrp_pb 394, eth_prop 1085). Trade sequences autocorrelate: the fold majority carries the rest.'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-P1-Q14-ER-GATED-TRAIL-05
  registered_at: '2026-10-22'
  registered_before_run: true
  statistic: 'From scripts/research/exit_lever_ablation.py --grade replace on xrp_pullback_2h, window 2020-07-01 .. 2026-10-15
    23:59, 6 equal calendar folds by entry time, net of the full cost stack (resolve_cost_policy, recorded per arm). Per arm:
    n, net_total_r, max_drawdown_r, net R per fold. A = the leg as declared. Arms: E20, E30, E40; controls: UT15. Gate flags
    are the build PATHSTATE-TRAIL-GATE contract (path-state features computed from bars <= t of the trade, in R/ATR units,
    by the SAME function the path_state_giveback.py study uses).'
  rule: 'INDETERMINATE IF n(A) < 39 or IF every candidate arm is byte-identical to A (the gate never fired). A candidate C
    PASSES iff net_r(C) > net_r(A) AND delta >= 0.02 R x n(A) AND folds_ge(A) >= 5 of 6 AND maxDD(C) <= maxDD(A) x 1.35 AND
    net_r(C) > net_r(UT15) (the UNCONDITIONAL control: the same action on every trade the gate would reach, so a PASS cannot
    be "any early action"). PASS IF one or more pass: ONE confirmation unit on a disjoint partition (a PASS on one window
    is a discovery), then Q6 parity and a Tier-3 declare proposal -- never a config edit. FAIL IF none passes: the family
    is NOT retired -- variants queued from a written diagnosis: (1) thr 0.50 and a 2-bar persistence requirement, (2) tight
    mult 3.5 instead of 2.5, (3) the same gate on the OTHER pullback leg; file as a new unit, never drop the family on one
    grid. Thresholds and the arm grid are not changed after any result.'
  what_it_does_not_do: 'Edits no config and places no order. A PASS needs a live producer that computes the path state bar
    by bar (position_path_history exists; the monitor does not read it for exits; src/runtime/trail_decay.py is the nearest
    live producer) and a Tier-3 declare with the mirror in the same PR. TP is untouched (every arm keeps the leg''s declared
    TP), so the TP doctrine''s zero-materiality compliance bar does not apply; each arm is graded on the normal Path B bar
    (0.02 R/trade materiality). PRIOR INFORMATION, disclosed: the fixed bank, level-triggered tightening and the 1R giveback
    stop all failed vs the declared exit on the Bybit money legs on 2026-10-22; the in-trade measurement (docs/research/exit-path-metrics-2026-10-22.md)
    screens a full exit at the first flagged state as LOSING vs the declared exit on every pullback/trend leg (so these arms
    tighten or partially bank, never exit outright, except the time-in-chop unit). No look at any arm here was taken before
    registration.'
