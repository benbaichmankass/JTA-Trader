  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: null
  why_runner: Replays committed Stage-0 trade lists on keyless public candles for a pinned window; reads no trainer data. est_minutes is null because the arm does not exist yet.
  basis: 'est_minutes null rather than guessed: the harness arm is the blocker.'
