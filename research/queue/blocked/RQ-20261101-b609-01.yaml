# Authored 2026-11-01 by lane ML-RECIPE (Tier 1). Decision rule registered BEFORE the b608-01 result and before any W1 outcome is read. Gates: none.
id: RQ-20261101-b609-01
title: 'ENTRY v2 ONE read on W1 (2026-10-01..31): does the winning dev stack of b608-01 clear the live bar, and is it no worse than the frozen v1 on the same window? One model, one read'
status: blocked
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: experiment
practice_precedent: 'T1, M6 (docs/reference/trading-and-model-practice-principles.md): purged + embargoed walk-forward; shadow-feature (Boruta-style) controls so a model that cannot reject noise columns
  is not trusted to admit real ones.'
question: 'The winning stack of RQ-20261101-b608-01 (whichever level it is; if none, this unit is not run) is fitted ONCE on all rows before W1 with the 7-day embargo and 24h label purge, with every number
  fixed on dev: R2 parameters, seed 20261101; tau_v2 = the quantile of the pooled dev-fold out-of-sample scores that takes the dev share of rows of the frozen v1 (mean over folds of P(max score > 0.10));
  cost-gate k = median over all dev rows of realised cost per R x atr_pct, gate 0.06 (if the stack has the gate); bracket SL 2 / TP 4 (if the stack has it), else 2/3. It then scores W1 once, claimed in
  the holdout lock (comms/research/holdout_reads.jsonl, model id ENTRY-v2-<stack>). The frozen v1 booster (comms/research/RQ-20261101-c692-06/41324826751/model, 20 features, tau 0.10, bracket 2/3) scores
  the same rows as a second claim (ENTRY-v1-frozen-ref), reported and used only in condition (c). Pooled population: every frozen-60 symbol with W1 rows; the five bybit_2 symbols reported beside it, never
  instead.'
why_this_matters: 'Operator 2026-11-01: 20 features is a regression equation, not algorithmic trading; manager 2026-11-01 ~12:03Z: a family ablation at +0.010 cannot admit anything when the recipe overfits
  with any extra column, so fix the recipe, then the columns.'
power:
  expected_n: 60000
  min_detectable_effect: 0.01
  effect_units: metric
  sd: 1.0
  design: two_sample
  alpha: 0.05
  power: 0.8
  basis: 'INFERRED: W1 is one calendar month; the stack takes about 6 decisions a day per symbol at the v1 share before the gate, so n of a few thousand pooled is expected, per-decision SE about 1/sqrt(n)
    = 0.015-0.02; a +0.02 effect is about one SE, so W1 can confirm a point estimate >= 0 but cannot establish a small edge.'
  feasibility:
    source: none
    accrual_basis: Replays public history through 2025-09-30 (dev folds only); nothing accrues.
decision_rule:
  id: RULE-20261101-b609-01
  registered_at: '2026-11-01'
  registered_before_run: true
  statistic: 'W1 decisions of the stack: n, symbols, mean gross/cost/net R per decision, bootstrap CI95 (reported), per side, traded-5 slice, baselines (no-trade, always-long, random matched at the stack
    take rate); the same for the frozen v1 reference; variants on the window from the lock.'
  rule: 'PASS iff, net of the full cost stack on W1: (a) n >= 300 decisions and >= 10 distinct symbols; (b) the stack''s mean net R per decision >= 0 (the live bar: point estimate >= 0); (c) the stack''s
    mean >= the frozen v1 reference''s mean on the same W1 rows. FAIL iff (a) holds and (b) or (c) fails. INDETERMINATE iff (a) fails. ONE read: a second read of the same model and window is refused by
    the lock; no variant is tried on W1 after seeing the result; the number of variants on the window is stated beside the result. The traded-5 slice, the bootstrap interval, per-side and baseline rows
    are reported and do not gate. Thresholds are not changed after the result.'
  what_it_does_not_do: Reads no sealed or held-out window (dev folds only), serves nothing, changes no config or live symbol list, places no order, sizes nothing.
  min_n: 300 W1 decisions
