id: RQ-20261011-9da8-07
title: 'Frontier strategy: BTC-to-alt lead-lag at 5m (Stage-0, new harness)'
status: blocked
cadence: once
theme: new_strategy_prop
priority: 2
kind: experiment
question: Does a BTC 5m return impulse (|r| >= registered k x trailing sigma) predict the same-direction move of ETH/SOL/XRP
  over the next 1-6 bars by more than the round-trip cost stack (fees + slippage), entering at the NEXT bar open after the
  impulse closes?
why_this_matters: 'No lead-lag STRATEGY harness or queue unit exists (grep of research/, scripts/, ROADMAP.md 2026-10-11).
  Lead-lag was probed once as an ML FEATURE block on an ETH head (docs/research/cross-asset-feature-probe-2026-06-18.md):
  dropping it cost -0.0022, i.e. negligible -- that does not close a 5m impulse-trade, which is a different horizon and a
  different use, but it and docs/research/cross-asset-strategy-scope-2026-06-18.md (lead-lag is usually shared beta, not alpha)
  set the prior LOW. 2026 literature searches found no cross-validated public alpha claim. So this is exploratory and cheap:
  it dies at the cost stack or against the placebo, or surfaces something to price.'
power:
  expected_n: 60
  min_detectable_effect: 0.45
  effect_units: sd
  design: paired
  alpha: 0.05
  power: 0.8
  basis: E35 floor; 5m impulses with k=2.5 sigma occur many times a month, so n >= 39 is expected to be easy -- the real risk
    is the cost wall, not n.
  feasibility:
    source: none
    accrual_basis: ''
decision_rule:
  id: RULE-RQ1011-9DA8-07-LEADLAG-5M
  registered_at: '2026-10-11'
  registered_before_run: true
  statistic: net_total_r and n_trades per follower symbol at each registered horizon, entries at next-bar open, execution_costs.resolve_cost_policy
    fees+slippage.
  rule: PASS IF net_total_r > 0 AND n_trades >= 39 at one pre-registered horizon on at least two follower symbols AND exceeds
    a PLACEBO (the same number of entries at volatility-matched random non-impulse bars, direction = sign of BTC's trailing
    1-bar return -- the shared-beta control) by > 0 net R (the horizon set {1,3,6} is fixed here; a horizon chosen after seeing
    results is a multiple-comparison and grades INDETERMINATE); FAIL IF net_total_r <= 0 at every horizon with n >= 39; INDETERMINATE
    otherwise.
  what_it_does_not_do: Does not propose a leg; any edge found is Stage-0 evidence only and must survive a latency check against
    the live tick before a build row.
blocked_on:
- kind: work_item
  ref: FRONTIER-LEVER-LEADLAG
  what: No lead-lag harness exists (research-harness-dispatch.yml has no such arm).
  clears_when: scripts/backtest_leadlag.py with the registered statistic, a no-lookahead test (entry strictly after the impulse
    bar closes), a research-harness-dispatch.yml arm, and the 5m multi-symbol corpus fetched.
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 20
  basis: Estimate from the sibling fc / harness runs; the first run replaces it.
run:
  workflow: null
  note: 'Deliberately null: the instrument does not exist yet (see blocked_on). Fill in when the lever row closes.'
lands:
