kind: experiment
question: When comms/live_bar/latest.json first shows claude_desk with n >= 20 confirmed-R closed trades (R on the declared signal-time risk, net of realized costs), does its feed verdict read pass (sum R > 0 AND mean - 0.8416 sd / sqrt(n) > 0)?
why_this_matters: 'claude_desk is a testing leg with no Stage-0 evidence record (comms/strategy_evidence/claude_desk.json absent): a discretionary desk has no backtest, so its evidence is its own record, and the operator''s live bar is the path a live record takes to promote (OPERATING-PLAN § 2 "Live-performance promotion path"). Read 2026-11-28 07:0xZ (scripts/research/live_bar.py over the live journal): n 13, sum R +7.68, mean +0.59 R, lcb80 +0.31, verdict n_short; all 13 on bybit_1 (paper); 12 of 13 venue-measured pnl (+7.49 R); only 4 with the stop never moved (lcb80 -0.17). The trend is promising and seven more trades decide it. Without a pre-registered read point, re-checking the bar every day until it passes inflates the false-pass rate; this unit fixes the read at the first n >= 20.'
