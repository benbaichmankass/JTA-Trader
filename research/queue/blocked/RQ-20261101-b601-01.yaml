  is not trusted to admit real ones.'
question: 'Live reference is SL 2 / TP 3 ATR. c692-02 measured, on the SAME decisions, the dev-chosen static 2/4 at +0.0144 (n=10,641) against 2/3 at +0.0073 (n=11,240) held-out; dev static means: 2/4 +0.0209,
  2/3 +0.0154. The held-out year has therefore been read on two geometries already, so the next read needs a fresh window. Arms (entry model and tau 0.10 frozen, base = 2/3): SL sweep at TP 4: SL in {1.5,
  2, 3}; TP sweep at SL 2: TP in {3, 4, 6}. Three seeds. Dev folds only.'
why_this_matters: 'Operator 2026-11-01: 20 features is a regression equation, not algorithmic trading; manager 2026-11-01 ~12:03Z: a family ablation at +0.010 cannot admit anything when the recipe overfits
  with any extra column, so fix the recipe, then the columns.'
