title: 'ITERATION 1 of ltr-tp-extend (pending, 0 live calls): does extending the TP by 50% of its distance at the first near-target trigger clear
  RULE-AM-RISK-ADJUSTED-V1 vs hold and vs a random-time extend? BLOCKED on a past-the-recorded-exit replay'
status: blocked
cadence: once
theme: live_strategy
priority: 2
roadmap:
- L-ATM
programme: P1
kind: experiment
question: Over the committed Stage-0 per-trade corpora with a real TP, does tp_extend (TP moved 50% of the entry-to-TP distance further) at the
  first near_target or new_peak trigger beat hold net of cost and beat the same extend at a random bar?
why_this_matters: 'ltr-tp-extend is an orphan: no live iteration unit (scripts/research/iteration_orphans.py, 2026-11-13), verdict pending since
  LTR-CLASS-GRADE closed. docs/ARCHITECTURE-CANONICAL.md § Active management: each action class stays advice-only until its own net-of-cost test
  passes, so a class with no test can never graduate or be retired on evidence.'
iteration:
  subject: ltr-tp-extend
  subject_kind: ltr_class
  from_result: comms/research/ltr_class_grade/verdict.json
  verdict_read: pending
  diagnosis: 'comms/research/ltr_class_grade/VERDICT.md: move_tp was never called (0 of 318 live review rows), so no extend was ever graded. live_review_outcomes.move_tp_net_r
    replays a new TP only up to the recorded exit; for an extend the recorded TP fill IS the recorded exit, so it returns the recorded net_r and
    would price every extend as no change (a biased zero, not a measurement). Grading needs the path past the original TP replayed under the leg''s
    stop/trail, which does not exist.'
  hypothesis: trades that reach the target zone with momentum carry further, so a farther TP beats the declared one net of cost, and the timing
    beats a random extend
  attempt: 1
  due_by: '2026-11-20'
  map_entries:
  - research/levers/ltr-tp-extend.yaml
baseline:
  arm: hold
  definition: 'each corpus row''s recorded net_r: the leg''s own declared exit, untouched, net of the full cost stack (fee 11 bps round trip +
    slippage + funding per window, as recorded per row by the corpus harness)'
  source: comms/strategy_evidence/ltr_corpus/<leg>__trades.jsonl
power:
  expected_n: 3630
  min_detectable_effect: 0.05
  effect_units: metric
  sd: 0.7
  design: paired
  alpha: 0.0125
  power: 0.8
  basis: 'INFERRED, not measured: the book is the 3630 committed corpus trades (counted 2026-11-13 from the trades.jsonl files); hold net_r sd
    over them is 1.47 R (measured), and the per-trade paired difference action - hold is assumed about 0.7 R because the action touches only the
    post-trigger part of a trade. At alpha 0.0125 (Bonferroni over 4) and power 0.8 a paired mean difference of about 0.039 R/trade is detectable,
    below the 0.05 R R1 bar. Trades with no candles or no path are excluded and counted; V1''s n_floor 39 governs. Blocked: nothing runs until
    the named harness lands.'
  feasibility:
    source: none
    accrual_basis: Replays committed corpora and candles; nothing accrues.
decision_rule:
  id: RULE-RQ-20261113-ed2b-04
  registered_at: '2026-11-13'
  registered_before_run: true
  statistic: 'Over the pooled committed Stage-0 per-trade corpora in comms/strategy_evidence/ltr_corpus (8 legs, 4,076 trades; each row''s net_r
    already net of fee + slippage + funding) minus corpora without a real TP (tp_r >= 10, e.g. trend_donchian_eth_4h tp_r 50), per pre-registered
    trigger T in {near_target, new_peak}: the book with the TP extended by 0.5 x the entry-to-TP distance from the bar after T fires, replayed
    past the recorded exit under the leg''s declared exits, vs the HOLD book, against 200 matched random-time extends.'
  rule: 'RULE-AM-RISK-ADJUSTED-V1 (am_risk_adjusted.grade_risk_adjusted, V1 parameters: R1 r_cost <= 0.05 R per baseline trade; R2 maxDD cut >=
    15% OR weekly-CVaR5 cut >= 15%; R3 >= 4 of 6 calendar folds hold; n_floor 39) with R4 vs 200 matched random-time books, plus L1: a pass must
    keep r_cost <= 0.05 R/trade after dropping the leg with the largest favourable contribution. Multiple comparisons: this unit and its blocked
    twin (RQ-20261113-ed2b-02 widen_sl, RQ-20261113-ed2b-04 tp_extend) share the continuation harness with 2 pre-registered triggers each = 4
    candidates, so R4 uses min_control_beat_frac 0.9875 (1 - 0.05/4, Bonferroni; 198 of 200 random books must be beaten) instead of V1''s 0.95,
    and the reported edge CI is at 1 - 0.05/4. PASS: at least one pre-registered trigger candidate clears R1-R4 and L1. It is a SCREEN pass (per-trade
    R books, graduation_eligible false until BOOK-SIM-REAL-SIZER): a Tier-3 proposal input for the class''s status, never an apply. FAIL: every
    candidate fails a read necessary clause (R1, R2 or R3) or is beaten by its random control (R4): back to diagnosis (trigger choice, then action
    bounds). INDETERMINATE: anything else, i.e. the best candidate is under the n floor, never fired, carried by one leg (L1 fails), or no trade
    could be priced (read_state no_data). Fixed now; not changed after a run.'
  what_it_does_not_do: 'Advice-only research: serves, promotes or applies nothing; adds no gate; changes no config, mandate or roster; places
    no order.'
practice_precedent: 'T1 (docs/reference/trading-and-model-practice-principles.md): an intervention is graded against a matched random-intervention
  control in the same trade, net of the full cost stack, per class (RULE-AM-RISK-ADJUSTED-V1); the design copies LTR-TRIGGER-CLOSE-S0 (comms/research/ltr_trigger_close_s0/PREREGISTRATION.md).'
