id: RQ-20261101-5b6b-01
title: 'ENTRY consolidation: does ONE pooled ENTRY model trained on ALL symbols of ALL accounts'' universes (the 60 perps + the US ETF universe
  the Alpaca accounts pull), with no asset-class id, reach mean net R per decision >= 0 on the fresh forward window 2026-11-02..2026-11-30, with
  the per-account result (bybit_2, alpaca_live long-only, alpaca_portfolio both sides) reported inside that one model?'
status: blocked
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: experiment
practice_precedent: 'T1, M6 (docs/reference/trading-and-model-practice-principles.md): one registered model, one read of a never-seen forward window;
  RQ-20261101-c692-04 arm (c) (training universe as a researched factor) and docs/research/ml-decision-models-2026-11-01/DESIGN.md sections 1a-1c.'
question: 'Operator 2026-11-01 ~10:40Z, verbatim: "the supra-symbol mls are for all symbols on all accounts. If we find evidence for per-category
  MLs later on, than we''ll build those later on". RQ-20261101-bdc2-01 (frozen v1, alpaca_live symbols) FAILED: -0.308 R per decision, n=128, 11
  symbols, CI95 [-0.52, -0.08]; always-long under the same mechanics -0.178. The ONE model here: the c692-01 recipe (LightGBM per-side net-R
  regressors, 300 trees, lr 0.03, 31 leaves, min leaf 500, seed 20261101; 2 ATR / 3 ATR / 24-bar first-passage labels, entry next bar open, tie
  -> SL, gap -> open fill; tau grid and dev-n >= 1000 rule; one position per symbol; decisions on the model clock, UTC close hour % 4 == 0) with
  exactly two changes: (1) TRAINING ROWS = the 60 frozen perps (Binance Vision 1h, 2020-07-01..2026-10-31) PLUS the union of alpaca_live and
  alpaca_portfolio symbols: and the alpaca_paper ETFs (Yahoo 1h regular-session bars, from the earliest the source serves, ~730 days); every row
  costed by its own venue (perps: fee 11.0 + slip 3.0 bps + funding 1.0/8h; ETFs: fee 0.0 + slip 5.0 + regulatory 0.5 bps, funding 0); (2) the SESSION family F6 added to the 20,
  exactly as owned by lane ML-FEATURE-INFRA in scripts/research/ml_entry_families.py (PR #22097): f6_bars_since_session_open,
  f6_last_session_gap_atr, f6_gap_seen168 (leakage-tested there; constant on a 24/7 series). This unit does not define its own copy.
  Cross-sectional / BTC features keep the
  60-perp reference. No symbol id and no asset-class id. Dev folds as c692-01 (the ETF rows enter the folds they fall in). Fit ONCE on all rows
  through 2026-10-31 (purged + embargoed), read 2026-11-02..2026-11-30 ONCE through HOLDOUT-LOCK.'
why_this_matters: 'Operator 2026-11-01 ~10:30Z (row ALPACA-LIVE-ACTIVITY-ML): "MLs live on that account by the end of the week"; v1 does not pass on
  equities. Measured in bdc2-01 (reported there): on the 2025-10..2026-09 window the raw 24-bar drift of a SPY long was +0.09 R yet the bracketed
  long read -0.158 R gross: 59% of SPY longs ended at the stop and 59 of 497 GAPPED through it, because a 2 x 1h-ATR stop sits inside the overnight
  gap range. The session features let one model see the gap; if this still fails, the next lever (BRACKETS, c692-02, composed) is the bracket
  itself, not a per-category model.'
