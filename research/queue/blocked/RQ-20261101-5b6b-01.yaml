decision_rule:
  id: RULE-RQ20261101-5b6b-01-ENTRY-ALL-ACCOUNTS
  registered_at: '2026-11-01'
  registered_before_run: true
  statistic: 'Pooled forward mean net R per taken decision, n, distinct symbols. Reported, never gating: the same model''s decisions restricted to
    each account (bybit_2 symbols both sides; alpaca_live symbols LONG only; alpaca_portfolio symbols both sides), per symbol; frozen v1 on the
    same window; always-long; matched random (200 draws); bootstrap CI95; variants read on the window (this unit: 1, plus v1 as a reported reference).'
  rule: 'INDETERMINATE IF no tau reaches dev n >= 1000, OR forward n < 300, OR forward distinct symbols < 10. PASS IF pooled forward mean net R per
    decision >= 0 (the operator bar, point estimate). FAIL otherwise. A PASS makes this the ONE ml_entry model on every account it is rostered on,
    through the single ml_entry implementation (lane ML-ENTRY-GOLIVE-UNBLOCK), with a per-account config block; alpaca_live goes live only through
    its own held Tier-3 PR. A FAIL closes this configuration (training universe + session features), never the family; the per-category question
    is opened only on evidence (operator). Thresholds are not changed after any result.'
  what_it_does_not_do: No sizing, no config change, no order. Not an Alpaca-specific model. Yahoo 1h bars are a proxy for Alpaca fills; ETF
    slippage 5.0 bps is a placeholder.
