id: RQ-20261119-c9d2-01
title: 'ITERATION 4 of ltr-close (abab-68 near_target PASS needs a real-TP holdout): does a FULL close at the first near_target trigger clear
  RULE-AM-RISK-ADJUSTED-V1 on four legs that carry a REAL take-profit and were never used to choose the trigger?'
status: done
cadence: once
theme: live_strategy
priority: 2
kind: experiment
question: 'On the committed Stage-0 corpora of tlt_pullback_1d, tqqq_trend_long_1d, scha_trend_long_1d and slv_trend_1h (361 trades; each declares
  a real take-profit and its Stage-0 trades hit it: 24.5%, 55.9%, 37.2% and 17.3% exit by take_profit; none is among the 8 selection legs), does
  closing the WHOLE position (partial_frac 1.0) at the first near_target trigger clear RULE-AM-RISK-ADJUSTED-V1 (R1 cost, R2 risk cut, R3 folds,
  R4 random-time controls, L1 drop-best-leg)?'
why_this_matters: abab-68 read partial_close@near_target risk_adjusted_pass on the 8 selection legs (folds 4 of 6, 200 of 200 controls beaten);
  its registered rule says a near_target PASS is a lead that first needs a holdout population with a REAL take-profit, named in the next unit,
  because none of the four legs of 43b6-02 carries one (tp_r 50.0 sentinel, near_target can never fire). This unit names that population. PASS
  -> one fresh-window confirmation on legs that carry a real TP, then a Tier-3 proposal for the ltr-close near_target class (never a config edit);
  FAIL -> the near_target full close is closed on this real-TP holdout and the lever map records it.
power:
  expected_n: 346
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'trade count 361 (49 + 136 + 78 + 98) is MEASURED from the built corpora; a LOCAL PREVIEW of the FIRST four-leg set (see the preview
    note in decision_rule.what_it_does_not_do) had near_target fire on 39 of 346 priced trades (11%), so the trigger-conditional n is expected
    near 40, below the 87 a d=0.3 one-sample test needs: expect the harness label, not a mean test, to decide, and expect INDETERMINATE (underpowered)
    to be a live outcome. The graded statistic is the harness RULE-AM-RISK-ADJUSTED-V1 label; underpowered or never-fired cases grade indeterminate,
    never fail.'
  feasibility:
    source: none
    accrual_basis: Offline replay of committed Stage-0 corpora; nothing accrues. The holdout corpora were built 2026-11-19 from committed candle
      CSVs by build_ltr_corpus.py (mode harness).
evidence_class:
  holdout: disjoint_legs
  claim: edge
decision_rule:
  id: RULE-RQ20261119C9D2-01-LTR-CLOSE-NEAR-TARGET-REALTP
  registered_at: '2026-11-19'
  registered_before_run: true
  statistic: 'scripts/research/ltr_action_trigger_s0.py --action partial_close --partial-frac 1.0 --triggers near_target on the four committed
    real-TP holdout corpora (tlt_pullback_1d, tqqq_trend_long_1d, scha_trend_long_1d, slv_trend_1h) (--corpus-dir comms/strategy_evidence/ltr_corpus_realtp);
    per candidate: r_cost per baseline trade, maxDD and weekly-CVaR5 cut vs hold, folds held of 6, controls beaten of 200, n_fired, L1 drop-best-leg;
    cost = the corpus rows'' recorded full-stack net R.'
  rule: 'PASS iff partial_close@near_target has the harness label risk_adjusted_pass: R1 r_cost <= 0.05 R/trade AND R2 (maxDD cut >= 15% OR weekly-CVaR5
    cut >= 15%) AND R3 >= 4 of 6 folds hold AND R4 beats >= 0.9969 of 200 matched random-time full closes (Bonferroni family 16 = the 15 comparisons
    already counted through abab-68 plus this 1 arm) AND L1 holds after dropping the best leg. FAIL iff the label is any fails_*: the near_target
    full close is closed on this real-TP holdout population. INDETERMINATE iff the label is indeterminate (never_fired / underpowered). The trigger
    is only near_target because only near_target passed on the selection legs (stall failed R4, 0 of 200). Thresholds, population and trigger
    are fixed now and not changed after any result. A PASS from this run is NOT actionable on its own: it requires a fresh-window confirmation
    (data after this run''s window, on legs that carry a real TP) before any Tier-3 proposal, because this population''s windows overlap the history
    the preview and the screen already touched.'
  what_it_does_not_do: 'Edits no config and no roster, places no order, adds no gate, is not a promotion case. PREVIEW AND POPULATION DISCLOSURE
    (RULE ONE): PREVIEW RECORD: run date 2026-11-19, 50 draws (the unit uses 200), local machine, first four-leg population, read near_target
    fails_R2_R3 (n_fired 39 of 346 priced, 0 of 50 controls beaten, folds_held 0 of 6). (1) the first population was tlt_pullback_1d, tqqq_trend_long_1d,
    tlt_pullback_1h, gld_pullback_1h. Before writing the unit I ran that configuration locally at 50 draws to check that the lever fires and the
    corpora load; it read near_target fails_R2_R3 (n_fired 39 of 346 priced, 0 of 50 controls beaten, folds_held 0 of 6). (2) The manager then
    required a TP-reachability screen (drop a leg under about 10% of its Stage-0 trades reaching the declared TP). By exit_reason == take_profit
    (a lower bound), tlt_pullback_1h reaches 4.7% (3 of 64) and gld_pullback_1h 6.8% (8 of 117), so both were dropped and replaced by the next
    candidates by count with a real TP, scha_trend_long_1d (37.2%) and slv_trend_1h (17.3%). The swap was made on the reachability rule the manager
    set, not on the preview, but the preview result was known when it was made; the replacement corpora were NOT scored locally. The rule (abab-68''s
    thresholds, family 16) and the trigger are unchanged by any of this, and a FAIL remains a live read. The preview is not a result and is not
    landed.'
  pass_action: a PASS is NOT actionable without a fresh-window confirmation. Author ONE confirmation unit on a fresh window for the legs whose
    own cell carries the effect; only after that confirmation passes, a Tier-3 proposal for the ltr-close near_target class with the mirror in
    the same PR; never a config edit.
  fail_action: record near_target (full close) as failed on a real-TP holdout in research/levers/ltr-close.yaml; the class moves to the untested
    triggers (giveback, adverse_r_0.5, momentum_flip) per abab-68's rule.
  min_n: about 39 fired near_target trades (preview); below the harness floor the label is indeterminate
practice_precedent: 'T1 and M4 (docs/reference/trading-and-model-practice-principles.md): an action tested against hold and against a random-time
  action, every arm counted in the multiplicity family; the test must be able to fire on its population (n_fired reported)'
