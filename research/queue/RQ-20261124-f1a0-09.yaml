  statistic: 'scripts/research/ml_entry_fix_arms.py --arm ev_calib_recent: delta = pooled mean net R per decision (arm) - (base) over the 8 dev
    folds, base = the registered recipe refit per fold on the same table; se = week-clustered influence se (ml_decision_entry.arm_diff); folds_better
    = dev folds where the arm mean beats the base mean; years = calendar years of fold starts with a positive pooled delta.'
