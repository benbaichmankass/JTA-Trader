  diagnosis: 'RQ-20261124-f1a0-06 (ev_calib, run 45488209456) INDETERMINATE: -0.0099 R/decision vs base (t -1.01), -0.0052 vs matched random thinning;
    3/8 folds, 0/4 years. The per-fold calibration read shows the whole-training-window isotonic map is NON-STATIONARY: the short side''s max
    calibrated EV is +1.32 in 2022-01 but +0.019 / +0.017 in 2022-07 / 2023-01 and the short take rate is 0 in 2024-07, while the long side''s
    positive-EV share swings 2.7%..38.6%. A map averaged over every past regime prices the side EVs of regimes that are gone. This iteration fits
    the map on the most recent block only, so the EV each side is credited with is the one the model earned in the latest regime (the regime-tracking
    the side split needs: RQ-20261123-d3a1-01 side gap vs regime corr 0.89).'
