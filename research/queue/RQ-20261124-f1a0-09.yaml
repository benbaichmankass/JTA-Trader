title: 'ml_entry CALIBRATED EV, iteration 3 (recent-block calibration): with the isotonic pred -> net R map fit only on the training block nearest
  the test fold, does trading iff calibrated EV > 0 beat the raw-tau recipe and a matched random thinning by +0.0068 R/decision on the dev folds?'
