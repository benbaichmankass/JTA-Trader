question: On the 8 dev folds, is mean net R per decision of the calibrated-EV policy with the per-side isotonic map fit ONLY on the most recent
  of 4 purged training blocks (out-of-fold predictions; the map applied to the full-train predictions) at least +0.0068 above the recipe (raw
  preds, tau 0.10) AND above the recipe thinned at random to the arm's per-side take rate (week-clustered t >= 2, >= 6/8 folds, >= 3/4 years)?
why_this_matters: 'Measured: the long head has no positive-EV decile and the short head''s top decile loses; a calibrated policy trades only where
