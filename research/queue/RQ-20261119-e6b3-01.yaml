title: 'Symbol-disjoint confirmation of the sol_4h breadth transfer: does sol_4h as declared clear Stage 0 on basket C (UNI/ICP/GRT/THETA/RUNE/ZEC),
  a basket neither it nor the prior baskets ever touched?'
