kind: experiment
question: 'On Binance USD-M 4h bars for UNIUSDT, ICPUSDT, GRTUSDT, THETAUSDT, RUNEUSDT and ZECUSDT (6 USDT perps used in no queued unit''s --symbols
  list, MEASURED 2026-11-19), 2020-06-01..2026-11-15, does sol_4h as declared (the 1b57-08 arm B flags, unchanged) read net-positive pooled across
  the six cells with >= 4 of 6 calendar folds positive at pooled n >= 88 AND pass on at least half the powered cells (n >= 39)? The time-disjoint
  form of this confirmation does not exist: 1b57-08 already read the full 2020-06..2026-10-26 history of basket B, so a disjoint population is
  the available holdout.'
why_this_matters: '1b57-08 PASSED on basket B but is weak (pooled one-sided p 0.10, 4 of 6 folds, 3 of 6 cells pass, last fold -24.6 R): a discovery,
  not a confirmation. This is the one disjoint-population confirmation the manager approved (2026-11-19 04:42Z). PASS -> the overlap-read cells
  (RQ-20261119-e6b2-01) and the prop EV/survival gate go ahead on firmer ground; FAIL -> the declared configuration is a basket-B symbol fit and
  the candidate cells are closed.'
