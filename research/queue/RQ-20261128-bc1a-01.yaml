id: RQ-20261128-bc1a-01
title: 'ml_entry SCORE-BAND CAP lever: on the registered dev folds, does abstaining on decisions whose better-side predicted net R is above the 95th / 90th / 80th
  percentile of the train fold''s above-tau predictions raise mean net R per decision, and beat abstaining on the same number of above-tau decisions at random?'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: experiment
origin: follow_up
practice_precedent: 'M3, T2 (docs/reference/trading-and-model-practice-principles.md): one lever per arm (the upper bound only), graded against the registered recipe
  and a same-size random-removal control on the same folds, so the arm must beat removing trades blindly, not just removing trades.'
question: On the registered ml_entry dev folds (8 half-year folds 2022-01-01..2025-10-01, purge + embargo, tau 0.10, the harness cost stack), is mean net R per decision
  higher when the registered model ABSTAINS on bars whose better-side predicted net R exceeds the q-quantile (q = 0.95 / 0.90 / 0.80) of that fold's TRAIN in-sample
  better-side predictions above tau, than (a) the uncapped registered policy and (b) the same policy abstaining on the same number of above-tau bars drawn at random?
why_this_matters: 'research/levers/ml-entry.yaml declares score_band_cap with the hypothesis ''the top band is over-confident and loses'' and no unit has ever tested
  it; the manifest families universe/horizon/threshold/calibration are untested too. ml_entry trades real money (bybit_2 + bybit_portfolio) and the staleness/capacity/encoder
  arms are spent (c4e2-02 INDETERMINATE, c4e2-03 FAIL, c4e2-04 INDETERMINATE). A cap is a post-hoc filter on the served scores: if the top band loses, it is the cheapest
  change to the live policy (no retrain). Idle-compute order from Manager 2026-11-28a (trainer nearly empty): this runs on the trainer.'
evidence_class:
  holdout: dev_folds
  claim: edge
power:
  expected_n: 60000
  min_detectable_effect: 0.0068
  effect_units: R
  sd: 1.2
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'alpha is the tabulated power-floor level (as c4e2-02); the per-arm family bar t >= 2.3909 (Sidak, k = 3) is enforced by the decision rule, so INDETERMINATE
    is a live outcome stated now. MEASURED on the same folds: base arm n 72,996 decisions (f1a0-01 run 45484674095). A cap arm keeps all but the capped band, so n
    per arm is ~66-71k (q 0.80 removes about a fifth of the above-tau bars before sequencing frees later bars). min_detectable_effect = LEVER_RULE min_delta_r (0.0068
    R).'
  feasibility:
    source: none
    accrual_basis: Replays public Binance history fetched at run time; nothing accrues.
decision_rule:
  id: RULE-RQ20261128-bc1a-01-SCORE-BAND-CAP
  registered_at: '2026-11-28'
  registered_before_run: true
  baseline: the registered uncapped policy (arm 'base'), same refit, tau 0.10, policy and cost stack
  statistic: 'per arm, ml_decision_entry.py lever_arms(): delta = mean net R (arm) - mean net R (base) over the pooled dev-fold decisions, week-clustered se; delta
    vs random_<arm> (the same number of above-tau bars removed uniformly at random, seeded per fold); folds where the arm beats base; years with a positive yearly
    delta. The cap is fitted on TRAIN in-sample predictions only.'
  rule: 'Each of the 3 arms (cap95, cap90, cap80) is graded by LEVER_RULE (RULE-ML-ENTRY-LEVER-ARMS-20261124) with the family bar for 3 arms in one unit: PASS iff
    n >= 3000 AND delta >= 0.0068 R AND week-clustered t >= 2.3909 (one-sided Sidak for k = 3, alpha 0.025; the code sets min_t = max(2.0, this)) AND delta vs random_<arm>
    >= 0.0068 AND the arm beats base in >= 6 of 8 folds AND the yearly delta is positive in >= 3 years. FAIL iff n ok and delta + min_t * se < 0.0068. INDETERMINATE
    otherwise. verdict.json carries the first arm; arm_verdicts carries all 3.'
  pass_action: The best PASSing cap (largest delta) gets ONE confirming read on disjoint out-of-time data (2025-10-01 onward, holdout_lock claimed, the deflated ENTRY
    bar) in its own unit; a pass there makes the cap a data-backed Tier-3 packet for the served ml_entry policy (manager or mandate applies, never a lane).
  fail_action: Close score_band_cap for crypto ENTRY on research/levers/ml-entry.yaml (the top band does not lose more than blind removal); no re-run at other quantiles.
  proposal_mapping: pass -> confirming out-of-time read -> Tier-3 packet; fail -> lever closed; indeterminate -> report the realised se, stop.
  what_it_does_not_do: 'Promotes nothing. These are DEV folds, the window that chooses: a PASS only qualifies the chosen cap for ONE confirming read on disjoint data
    in its own unit, and that read decides. No served artifact, roster or config changes here.'
  min_n: 3000
compute: cpu_long
baseline:
  definition: The registered recipe (20 FEATURES, LGB_PARAMS) refit per dev fold on every row before the fold minus the embargo, unweighted, better predicted side
    if > tau 0.10, one open position per symbol, SL 2 / TP 3 ATR14, 24 h time stop, full cost stack. Arm 'base' = this, uncapped.
  net_of_cost: true
value:
  bucket: ai_trader
  usd_at_stake_per_month: 300
  confidence: 0.15
  basis: 'stand-in: ml_entry trades real money on bybit_2 + bybit_portfolio and is losing (c4e2-01); a fresher fit is the direct lever on the diagnosed staleness.'
routing:
