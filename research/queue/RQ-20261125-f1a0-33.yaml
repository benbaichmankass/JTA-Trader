question: Does replacing the registered per-side net-R regressor with a per-side LightGBM classifier of P(net R > 0) (same 20 features, rows, folds, LGB
  params and bracket), trading a side iff its probability clears that side's training breakeven p* = mean|loss|/(mean win + mean|loss|), beat the registered
  recipe by >= +0.0068 R/decision with t >= 2 AND beat 100 random thinnings of the base at the arm's per-side take rate, on the dev folds, net of the full
  cost stack?
why_this_matters: 'Every execution, sizing and input lever on ml_entry (f1a0-14..32) landed within noise; the registered fail_action of f1a0-29/31 names
  the LABEL / target as the next lever. A net-R regressor on a 1.5:1 bracket spends capacity fitting payoff magnitudes that the bracket already fixes; a
  classifier of the sign of net R puts it on ranking, which is what the policy acts on. A pass goes to a fresh-window confirmation (not the spent 2025-10
  window: ENTRY has 27 reads there), then a Tier-3 proposal input.'
