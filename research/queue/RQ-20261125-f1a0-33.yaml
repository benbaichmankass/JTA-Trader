decision_rule:
  id: RULE-RQ-20261125-f1a0-33
  registered_at: '2026-11-25'
  registered_before_run: true
  baseline: the registered recipe on the same folds, rows, tau and cost stack
  statistic: 'scripts/research/ml_entry_fix_arms.py --arm oi_feats (oi_columns, prop_ml_leg.fetch_metrics / f1_features, shuffle_ts on the rows with data):
    per dev fold the registered recipe refit with FEATURES + OI_FEATURES vs without (same rows); delta = pooled mean net R per decision of the arm policy
    - the base policy; week-clustered influence se; folds / years vs base; vs_control = the arm vs the same recipe with the 7 columns timestamp-shuffled
    (GATING). Per-fold coverage of the columns is reported.'
  rule: PASS iff arm n >= 3000 AND delta(arm - base) >= +0.0068 AND t >= 2.0 AND delta(arm - the mean of 100 take-rate-matched random thinnings of the base) >= +0.0068 AND folds_better >= 6 of 8 AND
    years_positive >= 3 of 4. FAIL iff n >= 3000 AND delta + 2.0 se < +0.0068. INDETERMINATE otherwise. Fixed now (the LEVER rule, control gating, as book_feats).
  pass_action: Register a FRESH-WINDOW confirmation (a forward window after the last ENTRY holdout read, or a wider population) before any proposal; on
    that pass, a Tier-3 proposal input for the served ml_entry target.
  fail_action: Record the sign target closed on this recipe; the next target form is the HORIZON (a 4 h or 8 h bracket with the cost stack re-scaled), then
    cross-asset inputs (ETH/BTC lead, index futures), each as its own unit.
  proposal_mapping: pass -> fresh-window confirmation (bars after 2025-10-01, holdout ledger claim, deflated bar) -> Tier-3 proposal to the manager with
    this evidence record; fail/indeterminate -> the next iteration authored from this diagnosis at once.
  what_it_does_not_do: Changes no served model, config, sizing or order path; reads no held-out window; is not a promotion; adds no gate.
  min_n: 3000
  choices_where_the_design_memo_is_silent:
  - 'TARGET: y = 1[net R of that side > 0] on the registered labels (fee + slippage + funding already in net R); LightGBM classifier with M.LGB_PARAMS (the
    regressor''s params; default binary objective).'
  - 'DECISION: score = P(y=1) - p*, p* per side from that fold''s TRAINING labels only (point-in-time); the registered sequential policy (better side, >
    tau, symbol busy until exit) with tau = 0.'
  - 'CONTROL: 100 seeded draws per fold of the base policy with each side kept at the arm''s take rate vs base (capped at 1: if the arm takes MORE than
    base on a side, that side''s control equals base).'
  - 'No grid, no tau search: p* is a fixed function of training labels.'
