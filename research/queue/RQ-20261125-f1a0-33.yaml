  subject: ml-entry
  subject_kind: ml_model
  from_result: RQ-20261125-f1a0-31/45550064744
  verdict_read: indeterminate
  diagnosis: f1a0-31 (OI / long-short / taker inputs) INDETERMINATE +0.0044 vs base (t 0.39); with funding (f1a0-29) and every execution / sizing lever
    within noise, inputs and mechanics are exhausted on this recipe. The registered fail_action names the target. The recipe regresses net R on a fixed
    1.5:1 bracket, so most label variance is the payoff magnitude the bracket fixes, not the ranking the policy acts on.
  search: 'one fixed definition: the sign target with a training-label breakeven cut; no grid.'
  levers:
