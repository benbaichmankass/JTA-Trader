id: RQ-20261125-f1a0-33
title: 'ml_entry TARGET LEVER (clf_target): a per-side CLASSIFIER of P(net R > 0), traded iff it clears the side''s training breakeven probability, vs the
  registered net-R regressor and 100 take-rate-matched random thinnings, on the 8 dev folds, net of the full cost stack'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
