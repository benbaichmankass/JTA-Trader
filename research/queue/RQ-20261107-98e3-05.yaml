id: RQ-20261107-98e3-05
title: 'ENTRY-EQ structure-label seed ENSEMBLE (dev): does the mean of 5 pinned-seed fits of config B read higher or steadier on pooled dev OOF mean net R at tau
  0.20 / 0.25 / 0.30 than the single-fit reads (+0.083 / +0.109 / +0.197, run 42396313667)?'
