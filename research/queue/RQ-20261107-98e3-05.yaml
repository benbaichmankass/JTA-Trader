kind: experiment
practice_precedent: 'M13 (docs/reference/trading-and-model-practice-principles.md): unlimited iteration on the training-period walk-forward; the confirming window
  is loaded by NO code path of this unit.'
question: 'Seed variance (RQ-20261107-98e3-04) and the 98e3-03 re-read (+0.083 vs the graded dev +0.1222 at tau 0.20) show single-fit noise the size of the edge.
  A mean of 5 pinned-seed fits is one served model (bagging-style variance reduction). Dev-only (rows <= 2025-06-30, same 5 purged folds, structure labels, config
  B): pooled OOF mean net R, n, by_fold at tau 0.20/0.25/0.30 for the ensemble.'
why_this_matters: If the ensemble reads at least as high and is fold-stable, it is the candidate to export and confirm once (N=3) instead of a single unpinned fit;
  if not, the single-fit edge is not robust. Descriptive; no record changes.
