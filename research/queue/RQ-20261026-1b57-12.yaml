id: RQ-20261026-1b57-12
title: 'trend_donchian_xrp_4h is SHORT-only as declared: on 12 perps it was not fitted to, does the short-only side filter beat the same leg trading both sides?'
status: queued
cadence: once
theme: new_strategy_prop
priority: 2
kind: experiment
question: 'trend_donchian_xrp_4h declares side_filter: short (config/strategies.yaml, read 2026-10-26), a rare one-sided configuration on a real-money leg. Over BNB/DOGE/LINK/LTC/BCH/DOT/AVAX/NEAR/ATOM/FIL/TRX/ETC
  at 4h, 2020-06-01..2026-10-26, with every other lever fixed at the declared value, does the SHORT arm (B) beat the BOTH-sides arm by >= 0.05 R/trade pooled, and does B pass the pooled
  Stage-0 rule?'
why_this_matters: '7c2b-07 found xrp_4h positive on all six basket-A cells with the short-only filter. Whether that filter is a property of the strategy or an XRP-specific fit decides
  if the leg''s symbol transfers are read short-only (as declared) or both-sides, and whether a long side has been left on the table. Twelve cells give n; the arm set is two. PROP SUPERSET
  BAR (CLAUDE.md promotion ladder): this unit supplies Stage 0 only. A PASS is a Stage-0 input for a prop or real-money roster add; the prop EV/survival gate against each firm''s DD
  limits (prop_ev_grid.py / comms/prop_survival/<leg>.json), a PASSED mechanical Stage-1 soak and Gate 2 are ALL still required, and no roster is edited here.'
power:
  expected_n: 850
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d = 0.3 at alpha 0.05 / power 0.8 needs ~88 pooled trades (the repo's standing floor for this unit family). expected_n=850 is an ESTIMATE (7c2b-07's measured 434 pooled on six
    cells, doubled for the second basket; the BOTH arm roughly doubles trades again), not a measurement; below the floor the unit grades indeterminate, never FAIL.
  feasibility:
    source: none
    accrual_basis: Re-measurement on freshly fetched public candles over a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ20261026-1B57-12-XRP4H-SIDE-FILTER
  registered_at: '2026-10-26'
  registered_before_run: true
  statistic: 'harness_stage0.py --family trend --timeframe 4h; arms fixed now: B = xrp_4h as declared (short-only); BOTH = identical flags with --side-filter=both; baseline B; --delta-r-per-trade
    0.05 --folds 6 --fold-majority 4 --n-floor 39 --pooled-n-floor 88 --breadth-frac 0.5; per cell and pooled across 12 cells; cost = the harness''s own venue-aware fee + slippage +
    funding stack resolved by execution_costs.resolve_cost_policy() (never a zero default), recorded per cell in the result.'
  rule: 'READ per arm, both reported: (a) B passes the pooled rule? (b) BOTH passes? (c) pooled net R/trade difference BOTH - B. PASS (short-only justified) iff B passes AND BOTH does
    not beat B by >= 0.05 R/trade. FAIL (side filter is a symbol fit) iff BOTH passes the pooled rule AND beats B by >= 0.05 R/trade -> the side_filter becomes a Tier-3 PROPOSAL NOTE
    on the owning checklist row for the manager (with the prop-superset caveat), never a config edit. INDETERMINATE otherwise (pooled n < 88 or neither arm passes: the question ''is
    short-only better'' is not answered, which is stated). Arms and bar are fixed now and not changed after any result.'
  what_it_does_not_do: 'Edits no config and no roster; tests one axis (side filter) only; is not a promotion case. PROP SUPERSET BAR (CLAUDE.md promotion ladder): this unit supplies
    Stage 0 only. A PASS is a Stage-0 input for a prop or real-money roster add; the prop EV/survival gate against each firm''s DD limits (prop_ev_grid.py / comms/prop_survival/<leg>.json),
    a PASSED mechanical Stage-1 soak and Gate 2 are ALL still required, and no roster is edited here.'
