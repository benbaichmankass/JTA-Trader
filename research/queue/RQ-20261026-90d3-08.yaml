question: On eth_pullback_prop_2h over the pinned window, does tightening the trail to 2.5 x ATR once peak R reaches 1.5 (R15), 2.0 (R20) or 3.0 (R30), declared now, beat the
  declared exit A by >= 0.02 R/trade in >= 4 of 6 folds within the drawdown bar?
why_this_matters: 'R-armed tightening has been read on ada/xrp/sol/eth pullback and Donchian legs (RQ-20261007-021, RQ-20261022-eba2-03, 3947-13/-14 for the eth/sol prop legs);
  a grep of research/queue (2026-10-26) shows no trail-decay-arm-r arm on eth_pullback_prop_2h. First-test cell for the family on this leg. Lane RESEARCH-AUTHOR-20261026-0030
  (research SLO breach 23:15Z 2026-10-25, ops-flags #17895: runnable 42 < floor 71; the 23:16Z routine fire produced no PR). Operator 2026-10-22: an idea that failed one test
  is not dead; it failed the first test.'
