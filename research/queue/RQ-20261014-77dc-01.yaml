id: RQ-20261014-77dc-01
title: 'Macro / information: does the PPI m/m negative-sign ES=F effect (de02-04, t=-3.43 at 3d) REPLICATE in the later half of the sample (releases from 2021-01-01)?'
status: queued
cadence: once
theme: macro
priority: 2
kind: experiment
question: Restricting to ppi_mom releases dated >= 2021-01-01 (the half of the 139 not weighted by the 2015-2020 regime), is the 3-day Spearman t negative at |t_eff| >= 1.96?
why_this_matters: 'de02-04 is the only PASS of 14 survey-surprise event studies this cycle (13 FAIL/INDET): at 14 studies x 3 horizons a single |t|>=2.4 is not rare by chance alone,
  so the pass is a lead to be replicated, not a finding. A split-sample read is the cheapest independent check on the same data.'
power:
  expected_n: 70
  min_detectable_effect: 0.2
  effect_units: sd
  design: one_sample
  alpha: 0.01
  power: 0.8
  basis: MEASURED 2026-10-14 only the total (139 releases 2015-01 to 2026-09); the post-2021 count is estimated at ~70 from the release cadence and is checked by the run. rho~0.28 at
    alpha 0.05 needs ~100 pairs, so this is underpowered by design; a PASS is informative, a FAIL is weak.
  feasibility:
    source: none
    accrual_basis: fixed historical backfill; a short join lands INDETERMINATE, never padded.
decision_rule:
  id: RULE-RQ_20261014_77DC_01
  registered_at: '2026-10-14'
  registered_before_run: true
  statistic: Overlap-corrected Spearman t (ic_t_eff) of PPI m/m surprise vs forward ES=F return, 3-trading-day horizon only (the horizon at which RQ-20261014-de02-04 peaked, t=-3.43,
    n=139), graded by macro_event_study_run.py grade().
  rule: PASS IF n >= 50 AND the 3-day IC is negative with |ic_t_eff| >= 1.96. FAIL IF n >= 50 and that t is not reached in the negative direction (a significant WRONG-sign result is
    reported, not a pass). INDETERMINATE IF n < 50. no_data/producer_failed is a route fault, not a verdict. A FAIL does NOT overturn de02-04, it downgrades it to a sample-period effect.
  min_n: '50'
  what_it_does_not_do: Not a promotion case, not a leg, not a config change, not a P&L figure; daily closes only. News layer and WEPE are not retired or confirmed by this result.
compute: cpu_light
value:
  bucket: information
  usd_at_stake_per_month: 80
  confidence: 0.2
  basis: 'stand-in: replication gate on the one pass of the macro survey-surprise family (de02-04); information value, not a P&L claim'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 1.0
  est_minutes: 10
  basis: 'Estimate (same shape as RQ-20261014-65cc-05, which this copies): one daily-close fetch, a few hundred snapshot rows, a rank correlation per horizon.'
run:
  command:
  - python3
  - scripts/research/macro_event_study_run.py
  - --kind
  - ppi_mom
  - --snapshots
  - comms/macro/econ_calendar_snapshots.jsonl,comms/macro/econ_calendar_snapshots_survey_backfill.jsonl
  - --symbol
  - ES=F
  - --horizons
  - '3'
  - --primary-horizons
  - '3'
  - --min-n
  - '50'
  - --t-bar
  - '1.96'
  - --expected-sign
  - negative
  - --release-start
  - '2021-01-01'
  - --population
  - ppi_mom releases from 2021-01-01 joined to ES=F daily closes
  - --out
  - '{out_dir}'
  timeout_minutes: 30
  inputs:
    research_unit: RQ-20261014-77dc-01
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
