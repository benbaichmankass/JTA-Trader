id: RQ-20261022-4b82-03
title: 'Prop pace VARIANT of the failed squeeze-1h cells: break-even floor, stale exit, and a wider compression definition'
status: queued
cadence: once
roadmap:
- L-PROP
theme: new_strategy_prop
priority: 2
kind: experiment
question: RQ-20261006-006 (squeeze XRP 1h), RQ-20261006-010 (ADA), RQ-20261006-022 (LINK), RQ-20261010-353c-12 and RQ-20261011-8753-07 (AAVE)
  graded FAIL. Over 2020-06-01..2026-10-22 on 6 cells (ADAUSDT,XRPUSDT,LINKUSDT,AAVEUSDT,DOGEUSDT,BNBUSDT) at 1h, does any candidate arm (BE1,
  ST12, WIDE) of the squeeze harness pass the pooled Stage-0 rule with breadth AND beat the baseline arm B by >= 0.05 R/trade pooled? The pre-registered
  hypothesis is that capping the loser (break-even/stale) or demanding a deeper squeeze lifts expectancy above cost.
why_this_matters: 'Operator directive 2026-10-22: an idea that failed one test is not dead; it failed the first test. This unit is a registered
  VARIANT of that first test. First test: RQ-20261006-006 (squeeze XRP 1h), RQ-20261006-010 (ADA), RQ-20261006-022 (LINK), RQ-20261010-353c-12
  and RQ-20261011-8753-07 (AAVE) graded FAIL. DIAGNOSIS (one line): squeeze at defaults on 1h loses 0.06-0.07 R/trade at ~37% win (XRP -0.0688
  R n=552, AAVE -0.0632 R n=533): winners are small and the losers run, so the exit side (break-even floor, stale exit) and a stricter compression
  definition are the open levers; the TP2/TP15 target arms already ran on the six majors (RQ-20261018-ef5d-08) and are not repeated. Lane AUTHOR-FLOOR-1022
  (research runnable floor 33 vs 65 at 17:40Z). Prior ids: RQ-20261006-006, RQ-20261006-010, RQ-20261006-022, RQ-20261010-353c-12, RQ-20261011-8753-07,
  RQ-20261018-ef5d-08. theme new_strategy_prop was short in the 17:40Z health check.'
power:
  expected_n: 2400
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: Pooled floor 88 trades (d = 0.3 at alpha 0.05 / power 0.8, the repo's standing floor for this family of units); expected_n=2400 is an
    ESTIMATE from the first test's per-cell counts (cited in the question's prior ids), not a measurement for the variant arms; below the floor
    the unit grades indeterminate, never FAIL.
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ20261022-4B82-03-SQUEEZE-1H-EXITS
  registered_at: '2026-10-22'
  registered_before_run: true
  statistic: 'scripts/research/harness_stage0.py --family squeeze --timeframe 1h, arms fixed now: B=; BE1=--be-floor-r=1.0; ST12=--stale-exit-bars=12;--stale-exit-below-r=0.3;
    WIDE=--bb-std=2.5;--kc-mult=1.0; baseline B; per cell and pooled across 6 cells; flags --folds 6 --fold-majority 4 --n-floor 39 --pooled-n-floor
    88 --breadth-frac 0.5 --baseline B --delta-r-per-trade 0.05; cost = the harness venue-aware fee + slippage + funding stack (execution_costs.resolve_cost_policy),
    recorded per cell.'
  rule: 'Arms and thresholds are fixed now and are not changed after any result. A candidate PASSES iff it passes the pooled Stage-0 rule (pooled
    n >= 88, pooled net_r > 0, >= 4 of 6 calendar folds net positive, >= half of the powered cells pass) AND beats B''s pooled net R/trade by
    >= 0.05 R. PASS IF one or more candidates pass: the best by pooled net R is named and the follow-up is ONE confirmation unit on a disjoint
    window with the same statistic and bar (a pass on one window is a lead), then the prop/real-money SUPERSET ladder; never a roster edit. FAIL
    IF every candidate fails (n >= floor) -> this variant is closed on this window and the record names which arm moved closest, so the next variant
    is aimed. INDETERMINATE IF pooled n < 88 or fewer than half the cells measured (a fetch/harness fault is recorded per cell, never dropped).'
  what_it_does_not_do: Edits no config and no roster, places no order, is not a promotion case. A best-of-k arm is a LEAD (programme 03 rung S0-C),
    never a finding. Candles are Binance USD-M (a PROXY for Bybit linear); the funding term is a directionless magnitude (execution_costs P1);
    both are stated in the record. Does not pool with any committed record.
