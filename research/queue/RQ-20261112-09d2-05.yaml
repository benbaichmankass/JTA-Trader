  diagnosis: 'Costs ~= gross on MES and MGC (the stops are tight relative to $1.82-$2.12 + 2 ticks); MNQ has the widest stop in $ per micro
    (median $171), so costs are 27% of gross, and an edge is visible but not separable from zero at the deflated bar on a proxy feed.'
  hypothesis: on the real contract the MNQ_OR15 edge is at least as large and clears the deflated bar
  attempt: 1
power:
  expected_n: 345
  min_detectable_effect: 0.225
  effect_units: R per trade
  sd: 1.2
  design: one_sample
  alpha: 0.01
  power: 0.8
  basis: 'MEASURED 2026-11-12 (amended BEFORE any run, AM-TRADING decision (b); power block only, decision_rule
    unchanged): IB serves MNQ contracts 20241220..20270319 and nothing older (contract_span lines, issue #25422), so
    real front-month coverage is ~2024-09-12..2026-11-11 (~540 RTH sessions). At the proxy trade rate (~213/yr) that is
    ~460 trades, ~345 in the 75% discovery window. MDE = (2.638 + 0.842) x 1.2 / sqrt(345) = 0.225 R per trade at the
    rule''s own two-sided alpha 0.00833 (z = 2.638, the 6-cell bar). alpha is declared 0.01 only because the power gate
    tabulates {0.10, 0.05, 0.01} and refuses any other value; 0.01 is the strictest it offers, and the MDE above is the
    one at the rule''s stricter 0.00833, so the declared effect is conservative (at 0.01 the MDE would be 0.221). THIS RUN CAN DETECT ONLY AN EDGE >= ~0.22 R/trade, ~3.7x the proxy
    mean (+0.060): a PASS means a large edge; a FAIL or INDETERMINATE says little about a smaller one. No new power
    target is registered.'
