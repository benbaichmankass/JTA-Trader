question: Using the engine and Tradeify costs of RQ-20261112-09d2-01 unchanged, on a real CME MNQ 5m continuous series (rolled on volume,
  from IB's free historical data, the operator's 2026-11-12 decision; whatever span IB serves), does the 15-minute opening-range breakout on MNQ clear Stage 0 at the 6-cell Bonferroni bar?
why_this_matters: MNQ_OR15 was the closest cell on proxies. Discovery net +89.3R on n=1488 with 5/6 folds; holdout +11.3R. Its per-trade
  mean of +0.060R missed only the multiplicity-deflated edge clause (CI lower bound -0.020). The proxy (a Dukascopy CFD) differs from the
  futures in session hours, the close and microstructure; the real contract is the instrument Tradeify trades.
