# Gates this adds or changes: none (a research unit; no config, regime cell, filter or order path).
id: RQ-20261126-c4f2-01
title: 'ITERATION 3 of ml-btc-router-cells: did the LIVE regime_hard_gate drops (2026-09-01..11-26) save money? Replay every dropped live signal as emitted and
  compare its net R with matched random signals of the same strategies the gate let through, split by axis (ML vol vs ADX trend).'
status: queued
cadence: once
theme: regime
priority: 2
roadmap:
- L-ML-MECE
programme: P2
kind: experiment
origin: new_hypothesis
iteration:
  subject: ml-btc-router-cells
  subject_kind: ml_model
  from_result: RQ-20261113-b819-01/43462233659
  verdict_read: fail
  diagnosis: 'b819-01 FAILED on money: under REPLAYED labels the 8 BTC trend_vol OFF-cells added +6.9 R over 250 dropped harness trades but control_p 0.55 (no
    better than random drops), with trend_donchian -1.05 R. bcd2-01 also failed, and aadc-01 measured replay-vs-live label agreement at kappa 0.24. So
    every money grade so far was on labels the live trader did not use. The cells still drop live intents every day (vol_enforced=true rows on
    trend_donchian, squeeze_breakout_4h and ict_scalp_5m). Competing hypotheses: (a) the cells are cosmetic, and the live drops are no worse than random signals
    of the same leg; (b) the live ML labels, not the replayed ones, carve out a real losing slice that the replay could not see. The live drop rows plus the
    strategy eval rows (entry/SL/TP as emitted) price the actual vetoes without needing label parity.'
  hypothesis: the live ML-vol drops are not worse than matched random signals of the same strategies (veto not separable or costly), so the cells are cosmetic
  attempt: 3
  due_by: '2026-12-02'
  map_entries:
  - research/levers/ml-btc-router-cells.yaml
question: 'Over the live regime_hard_gate drops 2026-09-01..2026-11-26, replayed on Binance Vision USD-M klines exactly as emitted (market fill at the next bar
  open, emitted SL/TP, 48-bar horizon, net of the full cost stack), is the mean net R of the ML-vol-axis dropped signals < 0 with its 90% bootstrap CI below 0
  and at or below the 10th percentile of matched random same-strategy signals (PASS: the veto saved money), or is its CI above 0 (FAIL: the veto cost money)?'
why_this_matters: 'The only regime veto with ML in the loop that enforces live has never been priced on the trades it actually removed. A FAIL or a
  not-separable read joins b819-01 as the evidence for a data-backed Tier-3 removal proposal of the BTC trend_vol cells (regime-selectivity Rule 1,
  no cosmetic cells), which gives the demo-floor legs back the signals the cells suppress. A PASS is the first live evidence that the ML router earns
  its keep.'
levers:
- name: live_veto_money_test
  values: [ML-vol-axis dropped signals, ADX-trend-axis dropped signals (reported), matched random same-strategy signals (2000 draws)]
  hypothesised_effect: the ML-vol drops are no worse than random signals of the same strategies
evidence_class:
  holdout: none
  claim: edge
power:
  expected_n: 40
  min_detectable_effect: 0.53
  effect_units: metric
  sd: 1.2
  design: one_sample
  alpha: 0.10
  power: 0.8
  basis: 'MEASURED counts (diag audit_query regime_hard_gate, 2026-09-01..11-26, read 2026-11-26): 236 vol_enforced drop rows (trend_donchian 40,
    squeeze_breakout_4h 188, ict_scalp_5m 8) in 40 unique strategy x symbol x side x hour episodes; 1,981 ADX-trend-axis rows (htf_pullback_trend_2h
    1,957, gld_pullback_1h 65, fvg_range_15m 24) in 446 episodes. sd 1.2 R per signal is an ESTIMATE (bracket replays on these legs, 1.0-1.5). MDE =
    2.8 x 1.2 / sqrt(40) = 0.53 R per dropped signal on the ML axis; ~0.16 R on the trend axis. The ML axis is UNDERPOWERED for any but a large effect:
    INDETERMINATE (not separable) is the likely outcome and is stated up front; it still counts toward the cells-are-cosmetic read with b819-01.'
  feasibility:
    source: none
    accrual_basis: A committed snapshot of the live audit rows with a fixed window; nothing accrues inside the unit. A re-run on a later snapshot widens n by
      ~13 ML-vol episodes per month.
ml_consumer:
  consumer: research/levers/ml-btc-router-cells.yaml
  decision: drop (veto) a BTC intent before routing when the advisory vol head's live label lands in an authored trend_vol OFF-cell
  legs:
  - trend_donchian
  - squeeze_breakout_4h
  - ict_scalp_5m
  book: demo_floor
baseline:
  definition: matched random signals - for each dropped signal, one signal drawn from all replayed live signals of the same strategy (dropped, kept or mixed),
    2000 draws; and zero (not trading the dropped signal).
  net_of_cost: true
run:
  command:
  - python3
  - scripts/research/regime_veto_counterfactual.py
  - grade
  - --snapshot
  - comms/live_parity/regime_veto_20261126/snapshot.jsonl
  - --out-dir
  - '{out_dir}'
  timeout_minutes: 60
  inputs:
    research_unit: RQ-20261126-c4f2-01
decision_rule:
  id: RULE-REGIME-LIVE-VETO-CF-20261126
  registered_at: '2026-11-26'
  registered_before_run: true
  baseline: matched random same-strategy live signals (2000 draws); zero
  statistic: 'scripts/research/regime_veto_counterfactual.py grade (signals, replay_signal = desk_outcomes.replay unchanged, axis_verdict): per axis, mean net R
    of the DROPPED signals (status dropped = every tick of the bar dropped; mixed bars excluded from the dropped set), its 90% bootstrap CI (2000 draws),
    the matched random control mean and p_control_le = share of draws with mean <= the dropped mean; per-strategy n and mean reported; could_not_replay counted.'
  rule: 'Decided on the ml_vol axis. PASS iff mean < 0 AND CI90 upper < 0 AND p_control_le <= 0.10 (the veto saved money). FAIL iff CI90 lower > 0 (the veto
    cost money). n < 5 dropped signals = INDETERMINATE (underpowered). Else INDETERMINATE (not separable). The trend axis is graded by the same rule and
    reported beside it; it does not decide this unit.'
  pass_action: 'Record the first live evidence for the cells; re-grade on a later snapshot (disjoint window, after 2026-11-26) before any claim that the router
    adds money; no config change.'
  fail_action: 'With b819-01 (fail, replayed labels), propose to the manager the data-backed Tier-3 REMOVAL of the BTC trend_vol OFF-cells on the legs where
    the live drops cost money (regime-selectivity Rule 1); the operator or manager decides; no lane edits config/regime_policy.yaml.'
  proposal_mapping: fail -> Tier-3 cell-removal proposal; indeterminate -> joins b819-01 as cosmetic-cell evidence and the next iteration re-grades on a wider
    live window; pass -> disjoint-window re-grade.
  what_it_does_not_do: Changes no config, regime cell, filter or order path; adds no gate; reads a committed snapshot and the keyless Binance Vision archive,
    writes only under --out-dir.
  min_n: 5
compute: cpu_light
value:
  bucket: ai_trader
  usd_at_stake_per_month: 100
  confidence: 0.2
  basis: 'stand-in: ~13 ML-vol vetoed signals per month on demo-floor legs; not a P&L measurement.'
intervention_controls:
  matched_random:
    description: one same-strategy live signal per dropped signal, drawn with replacement from all replayed live signals of that strategy; 2000 draws; the
      dropped mean must sit at or below the 10th percentile
    draws: 2000
  hold_to_bracket: true
  hold_to_bracket_note: 'every signal, dropped or kept, is replayed to the same emitted SL/TP bracket with a 48-bar horizon; no in-trade action on either arm'
  best_static:
    grid:
    - no veto (trade every dropped signal) - the registered comparator
    excludes_test_folds: true
    note: one fixed rule; no threshold, horizon or window was searched
  bootstrap_group: signal
practice_precedent: rule registered before the run, net of the full cost stack, matched random control (principles R5, M6, M13); the live-label grade the
  aadc-01 kappa 0.24 finding called for.
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 1.0
  est_minutes: 10
  why_runner: Keyless Binance Vision klines for 2-3 symbols x 4 timeframes over 3 months plus a committed snapshot; no model fit.
  basis: 'ESTIMATE: ~500 signals, one bracket replay each; the kline download dominates (a few hundred small zips).'
lands:
