power:
  alpha: 0.05
  basis: 'ESTIMATE. The independent unit is the entry WEEK (~481 distinct entry weeks in the run-w corpus, MEASURED in Stage A''s power block),
    not the ~469k trades or the 9.4M rows that share market paths. The statistic is the week''s mean paired (arm - HOLD) net R per trade; sd 0.05
    R of that weekly mean is NOT measured (an inflated guess: ~975 trades a week at a per-trade delta sd of ~0.5 R gives ~0.016 if independent,
    x3 for the shared market path). At sd 0.05 and a 0.02 R effect the paired floor is (2.8*0.05/0.02)^2 = 49 weeks, below 481. The graded verdict
    is RULE-AM-RISK-ADJUSTED-V1''s R1-R4 screen, not this t-test.'
  design: paired
  effect_units: R_per_trade_weekly_mean_delta
  expected_n: 481
  feasibility:
