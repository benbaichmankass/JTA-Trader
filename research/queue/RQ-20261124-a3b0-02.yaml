# Hand-authored 2026-11-24 by lane ML-PRIMARY (the standing ML lane, Manager Session 2026-11-22a; operator 2026-11-24 "every research path is iterative and
# continuous"), Tier 1 research. AM v3: the next iteration authored from the Stage-B diagnosis (see iteration.diagnosis). Rule registered BEFORE any run.
# Gates this adds or changes: none. Nothing here touches the trade path; a pass is a proposal input, never an apply.
baseline:
  definition: 'HOLD = `replayed_actual` of the same replay (the leg''s own TP, trail and harness timeout), net of the full cost stack. REFERENCE
    (reported, never gating): the random re-timings of the same action (R4).'
  net_of_cost: true
  per_leg_base_rates: reported per strategy / leg / timeframe in the landed measurement (reported_cuts), never graded
cadence: once
compute: cpu_long
decision_rule:
  choices_where_the_design_memo_is_silent:
  - 'DECISION ROWS: one decision per bar CLOSE k, k = 1.. the bars the UNMANAGED trade is still open (the cf_bar_labels rows the heads were fitted
    on); features use bars 1..k only; a move is effective on the first bar opening at or after bar k''s close. After the unmanaged trade''s last
    row the brackets stay where the policy left them (no head output outside its training distribution).'
  - 'SCORE CUTS: the fold''s own TRAINING-score percentiles (p90, and p50 for the dip head), saved with the heads; never test data, never tuned.'
  - 'HEADS: re-fits of the Stage-A recipe (same 9 features, LGB params, seed, 400k-row cap, purged half-year folds), saved by `am_heads_fit.py
    dump`, because Stage A''s own models were not saved; a trade is scored by the head of the fold it ENTERED in (trained on trades whose label
    window ends 7 days before that fold). The holdout fold''s head is fitted on pre-2026 data only. Trades before 2022-01-01 have no out-of-sample
    head and are excluded (counted).'
  - BASELINE = HOLD = `replayed_actual` of the same replay (the leg's own TP + trail + harness timeout), byte for byte (tests/test_am_policy_arm.py::test_baseline_arm_is_replayed_actual);
    a policy that never acts equals it exactly. Entry at the signal bar's close (entry_at_bar_close, run-w convention), no signal-bar lookahead.
  - R unit = the ORIGINAL stop distance; net R from the engine's own net_of (fee + exit slippage + funding, the full cost stack). Positions are
    not re-sized in trade, so a loosened stop genuinely risks more than 1 R and that tail is charged to the arm's drawdown and CVaR.
  - 'POPULATION: the run-w backtest corpus (sha 1eb164f4), the legs that have a keyless Binance Vision bar source (crypto); equity/ETF legs have
    none (`no_bar_source`) and the ml_entry decision legs are not in this corpus; stated, not silently dropped. Fidelity of the replay to the
    harness (76% within 0.10 R, cfb-20261123b, pending re-read on w) is a property of both HOLD and the arm, so the delta cancels it; the baseline
    is the replay, not the harness.'
  - 'CONTROL (R4): 100 seeded draws per class; each keeps the policy''s per-trade action count and level parameters and re-times them to uniformly
    drawn rows from the unmanaged trade''s open rows that satisfy the class''s head-free precondition. It never fires into a closed trade, so
    it is a STRONGER control than a causal one (conservative for the policy).'
  - 'GRADING: RULE-AM-RISK-ADJUSTED-V1 with its V1 parameters unchanged (am_risk_adjusted.grade_risk_adjusted), on the DEV segment (entry before
    2026-01-01) and again on the claimed HOLDOUT (entry from 2026-01-01). PASS iff both segments pass R1-R4; FAIL iff the dev segment fails a
    necessary clause; else INDETERMINATE. Per-strategy / per-leg / per-timeframe cuts are REPORTED, never graded. BOOK-SIM-REAL-SIZER does not
    exist yet, so this is a per-trade-R SCREEN (`graduation_eligible: false`): a PASS is a Tier-3 proposal input, never an apply.'
  - 'HOLDOUT: each class unit is its own read of family AM-HEADS on 2026-01-01..end, claimed in the ledger by the reduce step BEFORE the holdout
    books are built. Stage A was read 1 (prior n_tries 1), so the first Stage-B unit reads as n_tries 2 and later ones deflate further; the ledger
    line is merged and landed with the result. The bar for each read is the ledger''s own `bar_for(n)`.'
  - 'THIS CLASS (AM v3 tighten_early): set_stop to -1 + 0.5 x (open_r + 1) when P(stop_first) >= the fold training p90 AND P(dip_recovers) <=
    p50 AND open_r >= -0.25 R; a further tighten only when >= 0.05 R tighter. Controls re-time the same count to rows with open_r >= -0.25 R.'
  - 'HEADS: the Stage-B heads artifact am-heads-45384292963 (fitted by run 45384292963 on the same recipe; reused via heads_run_id, not refitted),
    so the only difference from Stage B is the policy.'
  fail_action: Record early tightening closed on these features; the next lever is a structure-anchored invalidation level (swing-based, not halfway-to-close)
    from the richer-feature build.
  id: RULE-AM-HEADS-STAGE-B-20261124
  min_n: 100000
  pass_action: Propose the tighten_early class to the manager as a Tier-3 / mandate decision input (advice-only today) after a fresh-window read;
    no apply from this unit.
  proposal_mapping: pass -> Tier-3 proposal input; fail -> richer-features unit; indeterminate -> state which segment/clause and why and stop
    (no re-run at another threshold).
  registered_at: '2026-11-24'
  registered_before_run: true
  rule: 'RULE-AM-RISK-ADJUSTED-V1 with V1 parameters UNCHANGED, per segment: R1 net R given up per baseline trade <= 0.05; R2 max-drawdown cut
    >= 15% OR weekly-CVaR5 cut >= 15%; R3 the fold holds in >= 4 of 6 calendar folds; R4 beats >= 95% of the 100 controls (net R >= the control''s
    AND the risk cut >= the control''s, one strictly); n floor 39; the lever must fire. UNIT verdict: PASS iff dev AND holdout both PASS; FAIL
    iff the dev segment FAILS (a necessary clause read and failed); else INDETERMINATE. Every number in the policy (score cuts, levels, hysteresis,
    caps, fractions, seeds, 100 draws) is fixed in am_policy_arm.py before the first run and never changed after a result.'
  statistic: 'scripts/research/am_policy_arm.py (decide, control_specs, reduce_run, unit_verdict) over scripts/research/am_risk_adjusted.grade_risk_adjusted:
    class tighten_early arm vs HOLD and 100 seeded matched random re-timings, on the dev segment (entry < 2026-01-01) and the claimed holdout
    (entry >= 2026-01-01).'
  what_it_does_not_do: Serves, promotes or applies nothing; changes no bracket, config or order; is a per-trade-R SCREEN (BOOK-SIM-REAL-SIZER
    owns the book-level $ measurement), so a pass is a Tier-3 proposal input only; says nothing about the other action classes (each is its own
    unit).
