iteration:
  attempt: 2
  diagnosis: 'Stage B (RQ-20261124-b5a1-01..05, runs 45384282222..45384297711) all FAILED, and random re-timings of the same actions beat the
    model (bank dev: HOLD -8526 R, policy -12268, controls mean -5229; tighten dev: policy -8694, controls -7615). Trade-level read of the bank
    shard 0 (14,387 fired trades, MEASURED, scratch): banking helps losers by the same amount under the policy and under random timing (+0.133
    vs +0.129 R/trade for HOLD < -0.9 R) and costs runners the same (-1.76 vs -1.62 R/trade for HOLD > 3 R): the heads do not tell runners from
    losers at bank time. The policy''s extra loss is in long-lived trades (> 20 re-placements: -0.101 vs -0.011 R/trade): close + Q50 re-placed
    as Q50 decays converges on the close and fills on noise (a chase). Tighten shard 13 (488 fired): the policy saves less on eventual losers
    than random (+0.19 vs +0.31 R/trade) because P(stop_first) crosses its p90 AFTER the adverse move, when halfway-to-the-close is near the stop;
    random timing tightens earlier.'
  due_by: '2026-12-01'
  from_result: research/results/RQ-20261124-b5a1-02/45384285490.jsonl
