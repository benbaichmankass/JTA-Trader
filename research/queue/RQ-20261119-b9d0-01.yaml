id: RQ-20261119-b9d0-01
title: 'D10 Basset ORDER-NULL re-read: graded against a shuffled-order null instead of 0.5, does aadc-14''s learned degradation score
  (or the CUSUM baseline) rank leg decay better than chance?'
status: done
cadence: once
theme: ml_health
priority: 2
roadmap:
- L-ML-LIVE
kind: experiment
practice_precedent: 'M-series model-evaluation practice (docs/reference/trading-and-model-practice-principles.md): grade a score against
  the null of the design it runs in. Here 0.5 is not that null: overlapping next-N labels on short legs and leg-grouped folds both bias
  the AUC below 0.5 with no signal (harness audit, scripts/research/d10_basset_baseline.py § NULL CALIBRATION).'
question: 'Same points, label, features, folds and learner as RQ-20261118-aadc-14 (closed live/paper journal trades on legs with a
  measured Stage-0 record; decay = 1[mean net R of the leg''s next 20 trades < 0]; LightGBM out of fold by 5 leg groups). The null is
  each leg''s trades shuffled (same legs, lengths, trade set and mean; only the order is destroyed), with points and scores rebuilt and
  the learned score REFIT on every draw. Is the learned score''s pooled AUC above its order-null mean (one-sided p < 0.05), and by more
  than the CUSUM baseline''s excess on the same points?'
why_this_matters: 'aadc-14 (0.414) and f7c1-07 (0.419 without mu/n_seen) read the learned score as "worse than chance". The harness
  audit shows the design''s no-signal AUC is 0.46-0.48 pooled and ~0.37 within leg (synthetic iid legs shaped like aadc-14''s), so
  those reads were graded against the wrong null. This read says, on the real points, whether the D10 learned lever is empty (FAIL), or
  a working score that was mis-graded (PASS), before any further D10 learned unit is authored. It also reports how much of the CUSUM''s
  0.654 survives the same null.'
iteration:
  subject: ml-d10-basset
  subject_kind: ml_model
  from_result: RQ-20261118-f7c1-07
  verdict_read: fail
  diagnosis: 'f7c1-07 (run 44417165432) FAIL: dropping mu/n_seen left the pooled AUC at 0.4188 CI95 [0.3327, 0.4902]; within-leg AUC
    learned 0.285, CUSUM 0.549. Harness audit (PI-20261119-JX6BUNMV-0001, ML-PRIMARY-9): no leak (features read trades 0..i, label
    i+1..i+20, folds by leg group; a planted label-reading feature drives the OOF AUC above 0.9). On iid synthetic legs with no signal,
    through the same functions (20 seeds): within-leg AUC of "bad recent mean -> decay" 0.364 and of the CUSUM 0.373; learned pooled
    AUC 0.461-0.477. So below-0.5 is the design''s null, not an inversion.'
  search: 'none: aadc-14''s features, learner, folds, seed and label are fixed; only the reference distribution changes (0.5 -> the
    order null). Draws fixed now: 200 for the CUSUM, 40 for the learned.'
