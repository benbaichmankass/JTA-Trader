baseline:
  definition: 'The CUSUM baseline (aadc-05''s) on the same points, graded against the same order null.'
decision_rule:
  id: RULE-RQ20261119-b9d0-01-D10-ORDER-NULL
  registered_at: '2026-11-19'
  registered_before_run: true
  statistic: 'scripts/research/d10_basset_baseline.py --null-calibrate (draws 200 cusum / 40 learned): per score, the observed pooled
    and within-leg AUC, the order-null mean and sd, excess = observed - null mean, and p = (1 + #null >= observed) / (1 + draws).'
  rule: 'INDETERMINATE IF labelled points < 200 OR legs < 3 OR fewer than 30 learned null draws scored. PASS IF learned pooled excess > 0
    AND learned pooled p < 0.05 AND learned pooled excess > CUSUM pooled excess. FAIL IF learned pooled p >= 0.20 (no skill over the
    order null). INDETERMINATE otherwise. Within-leg excess and the CUSUM''s own excess and p are reported, never gating. Thresholds and
    draws fixed now and not changed after any result.'
  pass_action: 'The D10 learned lever is a working score that was graded against the wrong null: record on aadc-14 / f7c1-07 and the D10
    lever map; the next D10 learned unit is graded by excess over the order null on a FRESH window (trades closed after this run).'
  fail_action: 'The learned score carries no ranking skill over the order null on these points: record the D10 learned lever as empty
    for this feature set (not inverted); the CUSUM (with its order-null excess) stays the D10 reference; the next D10 lever is the
    feature family, not the learner.'
  what_it_does_not_do: Trains nothing persistent, registers, serves or promotes nothing; changes no config; places no order.
  min_n: 200 labelled points on >= 3 legs
