id: RQ-20261014-65cc-06
title: 'Frontier / tabular foundation models on Kaggle GPU: TabICL and TabPFN (research-eval) vs LightGBM on the BTC and ETH 1h regime head at a 3,000-row tail (off-trainer
  twin of RQ-20261013-1414-06)'
status: done
cadence: once
theme: ml_health
priority: 2
kind: experiment
question: When the training set is small by construction (last 3,000 BTC and ETH 1h bars), does a pretrained tabular in-context learner (TabICL or TabPFN) beat LightGBM by
  >= 0.01 macro-F1 under purged CV on BOTH symbols?
why_this_matters: 'RQ-20261013-1414-06 asks this on the trainer and its run died before measuring anything: exit 75 after 3601.6 s is the trainer heavy-lock wait timing out
  (scripts/ops/_trainer_heavy_lock.sh returns 75 on timeout), i.e. the saturated trainer never started it (MEASURED: comms/research/RQ-20261013-1414-06/38488362215/run-manifest.json).
  The published 1h shards plus a Kaggle GPU remove the trainer from the path, and Kaggle had ~29 GPU-h unused this week (manager, 2026-10-14). TabPFN weights are non-commercial:
  research arm only, a TabPFN win is an operator licence question, never a serve proposal. Weights come from the Hugging Face Hub: Kaggle runs with internet off, so an arm
  that cannot fetch weights errors and the verdict is INDETERMINATE (a FAIL requires every arm evaluated), which is itself the finding to act on (stage the weights in the bundle).
  DATA PATHS UNVERIFIED FROM THIS SANDBOX (the shards are not reachable here): the BTC/ETH 1h v002 market_features paths are inside the published allowlist (scripts/research/market_data_export.py::ALLOW)
  and RQ-20261013-1414-03 already reads ETHUSDT 1h with these six features; BTC 1h and the target column on each shard are the ones to check in the first run''s published-data.json
  (last_ts per shard). A missing column or a stale/withheld shard lands as producer_failed or no_data: a ROUTE FAULT to fix and re-queue, never a verdict.'
power:
  expected_n: 1800
  min_detectable_effect: 0.1
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'tail_rows 3000 with min_train_frac 0.4 leaves ~1800 out-of-sample rows over 5 folds per symbol; d=0.1 paired needs ~785 rows, so each symbol is above the row floor
    on rows, but bars are autocorrelated so effective n is lower: the rule also requires the same-direction CV mean on BOTH symbols.'
  feasibility:
    source: none
    accrual_basis: 'Fixed by construction (tail_rows of a nightly-rebuilt shard): n does not grow with waiting, so an underpowered result is reported as such and the follow-up
      is a larger or different dataset, not a re-run.'
decision_rule:
  id: RULE-RQ20261014-65CC-06-TABULAR-FM-1H-SMALL-N
  registered_at: '2026-10-14'
  registered_before_run: true
  statistic: Paired per-fold macro-F1 difference (candidate minus LightGBM) on identical purged folds (5, embargo 24 rows, min_train_frac 0.4); mean over folds, per symbol.
  rule: PASS IF a candidate (tabicl or tabpfn) beats LightGBM by >= +0.010 macro-F1 on the CV mean on BOTH BTCUSDT_1h and ETHUSDT_1h (feature-lift gate only; a PASS earns the
    meta-label unit RQ-20261011-9da8-02 a higher priority, and a licence question for the operator if the winner is TabPFN). FAIL IF no candidate reaches >= 0 vs LightGBM on
    any symbol AND both arms were evaluated (a FAIL closes only these two checkpoints at n~3k on these 6 features). INDETERMINATE otherwise, or if folds < 3, or an arm is unavailable/errored.
  min_n: 3 usable CV folds per symbol; reported n_rows per symbol.
  what_it_does_not_do: Serves nothing, registers nothing, touches no config. TabPFN is research-eval only. Says nothing about the meta-label head, trade P&L, or larger n.
compute: gpu
value:
  bucket: frontier
  usd_at_stake_per_month: 200
  confidence: 0.2
  basis: 'stand-in: if a pretrained tabular learner wins at n~3k it is the candidate for the ~99-trade meta-label head (the label wall); not a measured P&L'
routing:
  needs_trainer_resident_data: false
  needs_gpu: true
  published_data: metis-market-data
  peak_memory_gb: 8.0
  est_minutes: 60
  basis: 'Estimate, NOT measured: re-declare from the first run''s run-manifest.json.'
ml_bakeoff:
  task: classification
  metric: macro_f1
  dataset:
    kind: jsonl
    groups:
      BTCUSDT_1h:
        path: datasets-out/market_features/BTCUSDT/1h/v002/data.jsonl
      ETHUSDT_1h:
        path: datasets-out/market_features/ETHUSDT/1h/v002/data.jsonl
    ts_col: ts
    target: regime_label
    features:
    - rolling_log_return_vol
    - log_return
    - log_return_lag_1
    - log_return_lag_2
    - hour_of_day
    - dayofweek
    tail_rows: 3000
  cv:
    folds: 5
    embargo_rows: 24
    min_train_frac: 0.4
  baseline: lgbm
  controls:
  - prior
  - logit
  candidates:
  - tabicl
  - tabpfn
  learners:
    prior:
      kind: prior
    lgbm:
      kind: lightgbm
      params:
        n_estimators: 150
        learning_rate: 0.05
        num_leaves: 15
        min_child_samples: 20
    logit:
      kind: numpy_logit
    tabicl:
      kind: tabicl
      params: {}
    tabpfn:
      kind: tabpfn
      params: {}
      weights_note: Prior Labs non-commercial weights (license:other); offline research evaluation only
  rule:
    min_folds: 3
    pass_if:
    - group:
      - BTCUSDT_1h
      - ETHUSDT_1h
      vs: baseline
      window: cv
      op: '>='
      value: 0.01
    fail_if_no_candidate_reaches:
    - group: any
      vs: baseline
      window: cv
      op: '>='
      value: 0.0
run:
  command:
  - python3
  - scripts/research/ml_bakeoff.py
  - --unit
  - '{unit}'
  - --out
  - '{out_dir}'
  timeout_minutes: 180
  inputs:
    research_unit: RQ-20261014-65cc-06
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
roadmap:
- M25
related:
- RQ-20261013-1414-06
- RQ-20261011-9da8-02
- FRONTIER-LEVER-TABULAR
- docs/research/frontier-scan-2026-10-11.md
- scripts/research/research_compute.yaml
last_dispatched_at: '2026-10-14T07:33:51+00:00'
grading:
  auto: true
  awaiting: more_data
  decision_rule_id: RULE-RQ20261014-65CC-06-TABULAR-FM-1H-SMALL-N
  evidence:
  - research/results/RQ-20261014-65cc-06/38519996229.jsonl
  graded_at: '2026-10-14'
  grader: scripts/research/queue_grade.py
  note: 'indeterminate is the pre-registered under-powered/null outcome: complete, but NOT a pass and
    NOT a kill'
  reason: 1 row(s), all measured, all indeterminate
  rows: 1
  verdict: indeterminate
