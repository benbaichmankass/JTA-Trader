question: 'Row ML-DECISION-MODELS, MANAGE question, lever M1 (the row''s 2026-11-12 lever table). On the SAME frozen-ENTRY trades every MANAGE arm
  used (tau from c692-01, static 2/4 ATR bracket, 24h, one position per symbol), CLOSE at the next bar open when, at check-in k in {4,8,12,16,20},
  the ENTRY model re-scored at that bar says: own_le0 (own-side prediction <= 0), opp_gt_tau (opposite side > tau), or either. One rule chosen on
