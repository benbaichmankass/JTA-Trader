    distinct symbols < 10. PASS IF held-out mean paired delta > 0 AND the bootstrap lower bound at the ledger''s bar (MANAGE read 6 on this window:
    CI level 99.16%, one-sided alpha 0.0042) > 0. FAIL otherwise. Thresholds are not changed after any result.'
