  statistic: 'Held-out paired mean delta net R per trade vs hold-to-bracket (same trades, same cost stack; a close pays the cost at its exit bar),
    trade-resampled paired bootstrap (2000 draws) at the holdout ledger''s bar for this read. Reported, never gating: managed mean net R vs hold,
    n closed and mean delta per closed trade, closes by check-in, day-clustered SE, matched random (same count and check-in mix on random trades,
    200 draws), by-month and by-side delta, the delta ex the 9 symbols peeked on 2026-11-05, giveback.'
  rule: 'Rule chosen on DEV only: argmax pooled dev delta over {own_le0, opp_gt_tau, either} (tie -> the earlier). NOT READ (verdict fail, dev) IF
