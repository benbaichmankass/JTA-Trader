id: RQ-20261108-98e3-29
title: 'PROP-ML-NEW-DATA step 1 follow-up: which (symbol, series) does the Kaggle lake mirror hold for ETH, SOL and BTC, over which months? (lake-presence column
  of the non-price census)'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: deterministic
practice_precedent: 'none: a data-feasibility census; follows RQ-20261108-98e3-28 and the PROP-ML-NEW-DATA row brief (state which source is already in the lake).'
question: The census RQ-20261108-98e3-28 reads the public Binance archive and reports lake presence as UNVERIFIED (HF returns 403; the mirror was not a runner target).
  With the manifest-only published_data target metis-market-lake (#24358), read each mirror part's MANIFEST.json and state, for ETHUSDT, SOLUSDT and BTCUSDT, which
  of the census streams (funding, premium_1m, metrics_5m, bookdepth, orderflow_1m, 1m klines) the manifests list, over which months, with how many months missing
  inside the span.
why_this_matters: A usable non-price source is only usable on a runner for ML if the lake can serve it. This turns the census's UNVERIFIED lake column into a measured
  one, and exercises the new manifest-only fetch against the real Kaggle API for the first time (a loud REFUSED here is the test result). It does not read any shard.
decision_rule:
  id: RULE-RQ20261108-98e3-29-LAKE-PRESENCE
  registered_at: '2026-11-08'
  registered_before_run: true
  statistic: 'scripts/research/lake_presence.py run: every member path listed in every metis-market-lake-pNNN MANIFEST.json (read by the manifest-only fetch into
    $LAKE_MANIFEST_ROOT), parsed as crypto/<market>/<label>/<SYMBOL>/<YYYY or YYYY-MM>.parquet.'
  rule: 'For each (symbol in ETHUSDT, SOLUSDT, BTCUSDT) x (stream in funding, premium_1m, metrics_5m, bookdepth, orderflow_1m, 1m): IN-MANIFEST iff >= 1 member path
    parses to that (label, symbol), with its first/last month and the months missing inside that span; otherwise ABSENT-FROM-MANIFESTS. Unit verdict: PASS iff >=
    1 part manifest was read AND >= 95% of all member paths parse; INDETERMINATE iff the manifests were read but < 95% of member paths parse, or no members were listed
    (the layout is not understood, so presence is NOT stated); not_applicable (NEVER MEASURED) iff LAKE_MANIFEST_ROOT is unset (the fetch step refused). The presence
    table is the finding and is reported whatever the verdict. Thresholds are not changed after any result.'
  what_it_does_not_do: 'Reads no shard, hashes nothing and trains nothing; a manifest member is a CLAIM that the file was copied (verified by kaggle-cold-lake-copy.yml),
    not proof the rows are readable (that is the loader row HF-LAKE-KAGGLE-LOADER). The mirror holds frozen closed-month history only: the current months are not
    in it. The graded census RQ-20261108-98e3-28 is a separate record and is not edited.'
  min_n: 1 part manifest
compute: cpu_light
value:
  bucket: ai_trader
  usd_at_stake_per_month: 100
  confidence: 0.2
  basis: 'stand-in: the operator goal (a live ML entry on every live-money account, prop included); not a P&L measurement.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 1.0
  est_minutes: 10
  published_data: metis-market-lake
  why_runner: the manifest-only fetch needs KAGGLE_API_TOKEN, which only the runner twin's fetch step holds; the unit's own command runs without it
  basis: 'ESTIMATE, not measured: 11 MANIFEST.json downloads of a few MB each plus a pass over ~33k member paths.'
run:
  workflow: research-script-run-data.yml
  command:
  - python3
  - scripts/research/lake_presence.py
  - run
  - --out
  - '{out_dir}'
  - --unit
  - '{unit}'
  - --where
  - research-script-run-data
  - --rule-id
  - RULE-RQ20261108-98e3-29-LAKE-PRESENCE
  - --registered-at
  - '2026-11-08'
  timeout_minutes: 45
  inputs:
    research_unit: RQ-20261108-98e3-29
ml_consumer:
  consumer: ML-PROP-ITERATE
  decision: whether PROP-ML-NEW-DATA proceeds to a feature-family ranking unit and which time-disjoint design it can use; no change from this unit
  legs:
  - ml_entry
  book: money
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
related:
- RQ-20261108-98e3-28
- HF-LAKE-KAGGLE-LOADER
- PROP-ML-NEW-DATA
- scripts/research/published_data.py
- config/data_universe.yaml
population: Members listed in the per-part MANIFEST.json of the private Kaggle lake mirror metis-market-lake-pNNN (frozen crypto history), for ETHUSDT, SOLUSDT, BTCUSDT;
  a claim of copy, not a read of any shard.
why_not_inferential: 'A data census: it counts manifest members and applies a fixed parse-rate threshold. It estimates no effect from a sample, so an expected n and
  an MDE would be theatre.'
