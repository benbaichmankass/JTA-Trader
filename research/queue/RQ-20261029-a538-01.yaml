id: RQ-20261029-a538-01
title: 'Daily LONG-only Donchian lookback on twelve perps: does a 30- or 55-day channel beat the 20-day channel the LONG filter was found at?'
status: queued
cadence: once
roadmap:
- L-TIMEFRAMES
theme: timeframes
priority: 2
kind: experiment
compute: cpu_long
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 4.0
  est_minutes: 90
  basis: Estimate from comparable harness_stage0 runs of 2026-10-18..29 scaled by cells x arms x bars; the first run replaces it.
  why_runner: harness_stage0.py fetches keyless public candles and runs the repo harnesses; these symbols/bars are not in the metis-market-data
    allowlist, so no idle published-data backend can hold it; CPU only.
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
question: On Binance USD-M daily candles for the twelve perps over 2020-06-01..2026-10-25 (--long-only, trail 5 ATR), does donchian 30 (L30) or
  55 (L55) pass the pooled Stage-0 rule AND beat donchian 20 (L20) by >= 0.10 R per trade?
why_this_matters: The daily long-only filter is the one timeframes lead with committed passing records (ef5d-06, 1b57-15, f679-05). Its channel
  length was never varied on the filtered arm; slower channels trade less and pay less cost per R. One fixed grid of two lookbacks, baseline =
  the lead itself; a win is a lead for a disjoint basket, never a confirmation.
power:
  expected_n: 100
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d=0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo standing floor) = the pooled floor 39; expected_n is an ESTIMATE from comparable
    runs, NOT a measurement for these arms; below the floor the unit grades indeterminate, never FAIL. The 0.10 R/trade delta over the baseline
    is a materiality bar, so a PASS is a LEAD.
  feasibility:
    source: none
    accrual_basis: Re-measurement on freshly fetched public candles over a pinned window; nothing accrues.
practice_precedent: 'M4, M5 (docs/reference/trading-and-model-practice-principles.md): pre-registered rule, selection-deflated across the arms
  tried'
intervention_controls:
  not_applicable: a Stage-0 parameter/horizon arm comparison through the harness, not an in-trade action or active-management intervention
decision_rule:
  id: RULE-RQ20261029A53801
  registered_at: '2026-10-29'
  registered_before_run: true
  statistic: 'harness_stage0.py --family trend --timeframe 1d on 12 perps, 2020-06-01..2026-10-25; arms fixed now: L20=--long-only; L30=--long-only;--donchian=30;
    L55=--long-only;--donchian=55; baseline L20. Net of the harness venue-aware fee + slippage + funding stack (execution_costs.resolve_cost_policy).'
  rule: 'A candidate (L30, L55) PASSES iff it passes the pooled Stage-0 rule (pooled n >= 39, pooled net_r > 0, >= 4 of 6 calendar folds net positive,
    >= half of the powered cells pass) AND beats L20 pooled net R/trade by >= 0.10. PASS IF one or more pass: the best by pooled net R is named
    and the follow-up is ONE confirmation unit on a symbol-disjoint basket or later window (a pass on one window is a lead), never a roster edit.
    FAIL IF every candidate fails with pooled n >= 39: this arm grid is closed on this basket and window; the horizon/family is NOT retired. INDETERMINATE
    otherwise; cells under the floor are named, the floor is never lowered. Thresholds and arms are not changed after any result.'
  what_it_does_not_do: Edits no config, roster or risk; is not a promotion case; Binance USD-M candles are a PROXY for Bybit linear; each R is
    net of the harness's own cost stack with a directionless funding magnitude (execution_costs P1).
value:
  usd_at_stake_per_month: 100
  confidence: 0.3
  bucket: frontier
  basis: stand-in planning weight for the programme node this question belongs to; an estimate, not a measurement.
