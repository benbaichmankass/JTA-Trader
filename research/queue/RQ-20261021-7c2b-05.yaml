id: RQ-20261021-7c2b-05
title: >-
  Programme 07 Q2 (frontier PASS): cost-gated Donchian-20 breakout at 15m on the three perps whose shortest viable bar is 15m (ADA,
  AVAX, SOL), gate on the 0-1 scale
status: queued
cadence: once
theme: timeframes
priority: 2
kind: experiment
question: >-
  On Binance USD-M 15m candles for ADAUSDT/AVAXUSDT/SOLUSDT over 2022-01-01..2026-10-20, do G50 / G75 / G90 (--vol-skip-below-pctl 0.50/0.75/0.90)
  pass the pooled Stage-0 rule AND beat ungated B by >= 0.05 R per trade?
why_this_matters: >-
  ef5d-02 PASSED: the cost-aware frontier puts the shortest viable perp bar at 15m for ADA (p(move >= 2 cost) 0.61), AVAX (0.53) and
  SOL (0.53), and 30m for BTC/ETH. Node P7-Q2-frontier-pass: author the family units at the shortest viable bar on the viable symbols
  only. The 30m read is 7c2b-01; this is the 15m cell, same arms. Compression (ef5d-08) and sweep (ef5d-09) both FAILED at 1h net of
  cost, so they are not transferred down to a costlier bar.
power:
  expected_n: 600
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: >-
    ef5d-07 B at 30m: ~2,700 entries per symbol over 5.8 y; 15m over 4.8 y doubles bars; G90 keeps ~10% -> ~600 pooled.
  feasibility:
    source: none
    accrual_basis: Re-measurement on fetched public candles over a pinned window; nothing accrues.
decision_rule:
  id: RULE-P7-Q2-COST-GATED-15M
  registered_at: '2026-10-21'
  registered_before_run: true
  statistic: >-
    harness_stage0.py --family trend --timeframe 15m, arms B, G50, G75, G90 on the three 15m-viable perps (frontier record research/results/RQ-20261018-ef5d-02);
    per cell and pooled.
  rule: >-
    PASS iff a gated arm passes (breadth 2 of 3 cells) and beats B by >= 0.05 R/trade -> node P7-B2-confirm at 15m. FAIL -> the gate
    does not rescue 15m breakouts on the viable perps; the short arm's next lever is maker cost, not a family. INDETERMINATE otherwise.
    Verdicts are the script's own (scripts/research/harness_stage0.py, grades fixed by these flags): per CELL pass iff n >= n_floor
    AND net_r > 0 AND >= fold_majority of the calendar folds net > 0, fail iff n >= n_floor and not, indeterminate iff n < n_floor;
    per ARM pass iff pooled n >= pooled_n_floor AND pooled net_r > 0 AND pooled folds >= fold_majority AND >= breadth_frac of the POWERED
    cells pass (and, with --baseline, beats the baseline's pooled net R/trade by >= delta), indeterminate iff pooled n < pooled_n_floor
    or < 2 powered cells or < half the declared cells measured (a fetch/harness fault is recorded per cell, never dropped), fail otherwise.
    Holm-corrected one-sided t p-values are REPORTED, not graded. Thresholds are not changed after any result.
  what_it_does_not_do: >-
    Does not edit config/strategies.yaml, config/accounts.yaml or any roster; does not tune beyond the fixed arms listed; does not pool
    windows with any committed record; is not a promotion case. Candles are Binance USD-M (a PROXY for Bybit linear; prices track within
    a few bps) and the funding term is a directionless magnitude (execution_costs P1), both stated in the record.
compute: cpu_long
value:
  usd_at_stake_per_month: 150
  confidence: 0.15
  bucket: frontier
  basis: stand-in (07 node P7-Q2 weight); an estimate.
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 4.0
  est_minutes: 150
  basis: >-
    Estimate from the ef5d-0x harness_stage0 runs (2026-10-18/20) scaled by cells x arms x bars; the first run replaces it.
  why_runner: >-
    harness_stage0.py fetches public candles and runs the repo harnesses; CPU-only; not trainer-resident.
run:
  command:
  - python3
  - scripts/research/harness_stage0.py
  - --family
  - trend
  - --symbols
  - ADAUSDT,AVAXUSDT,SOLUSDT
  - --timeframe
  - 15m
  - --days
  - '1760'
  - --start
  - '2022-01-01'
  - --end
  - '2026-10-20'
  - --arm
  - B=
  - --arm
  - G50=--vol-skip-below-pctl=0.5
  - --arm
  - G75=--vol-skip-below-pctl=0.75
  - --arm
  - G90=--vol-skip-below-pctl=0.9
  - --baseline
  - B
  - --delta-r-per-trade
  - '0.05'
  - --folds
  - '6'
  - --fold-majority
  - '4'
  - --n-floor
  - '39'
  - --pooled-n-floor
  - '88'
  - --breadth-frac
  - '0.67'
  - --rule-id
  - RULE-P7-Q2-COST-GATED-15M
  - --data-dir
  - '{out_dir}/data'
  - --out
  - '{out_dir}'
  timeout_minutes: 330
  inputs:
    research_unit: RQ-20261021-7c2b-05
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
