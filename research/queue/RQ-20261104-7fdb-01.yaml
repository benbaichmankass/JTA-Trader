    grown in 1% steps until it holds 25 of baseline T3''s entries, capped at 40%. Discovery = trades whose entry AND exit precede the boundary;
    4 equal calendar folds of discovery.'
  rule: 'SELECTION (discovery only): a T-arm is eligible
    iff discovery n >= 25 AND discovery net R > 0 AND >= 3 of 4 discovery folds net-positive; the eligible T-arm with the highest discovery
    net R is selected (a tie goes to the baseline T3, the harness default). HOLDOUT (read once): INDETERMINATE/insufficient_discovery if every T-arm holds < 25 discovery
