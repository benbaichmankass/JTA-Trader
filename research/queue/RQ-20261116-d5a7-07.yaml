question: 'Same rows, folds (5), embargo (7 d), legs, arms and judge as RQ-20261112-0bc8-02; ONE LEVER CHANGED: the volume baseline lookback 1000 bars (0bc8-02: 500).
  Does comp - champion reach +0.01 R/trade with CI95 lower > 0 and mean(comp - vol) >= 0?'
why_this_matters: 'ITERATION (research-ops 2026-11-16 0715Z) of ml-exit-head-donchian-1h (orphan, verdict fail). 0bc8-02 (two rows): comp - champion -0.0016 R/trade,
  CI95 [-0.0036, +0.0004] at n 11160 (trainer run), CI UB +0.0004 < +0.01; the head''s own dR vs hold is -0.0135 R/trade (CI95 [-0.042, +0.015]) for champion, vol
  and comp alike. Diagnosis: the three arms are indistinguishable (flat), so composition is not the missing information at lookback 500; the one unscanned parameter
  of the feature is its baseline window. A short window (1000) tests whether the surprise needs a faster baseline; this is one point of a two-point response (250
  and 1000) authored together. On PASS: ONE confirmation unit on a symbol holdout (RESEARCH-NO-WAIT order 2). On FAIL: the volume-composition feature lever is recorded
  flat across the lookback range and the next family (labels/threshold) is chosen. Decision: whether any more exit-head feature work is worth trainer time.'
evidence_class:
  holdout: walk_forward
  claim: model_quality
power:
  expected_n: 500
  min_detectable_effect: 0.01
  effect_units: r_multiple
  sd: 0.15
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATE, not a measurement. n = pooled OOS trades over 3 legs x (folds - seed block); 78fc-03 / RQ-20260927-002 saw ~350-1,000 OOS trades per leg-family
    at 1h. The test is one-sample on the per-trade paired difference comp - champion (same trade replayed by both heads), which is zero on every trade neither head
    closes early, so its sd is far below the per-trade R sd; sd 0.15 R is a guess the first run replaces. At n 500 and sd 0.15 the SE is ~0.0067, so the 0.01 R bar
    plus CI LB > 0 is reachable only for a real lift. At that guess the one-sample floor for 0.01 R is ~1,770 trades, ABOVE the ~500 expected: the unit is under-powered
    for a lift near the bar, and the rule''s FAIL (CI UB < +0.01) then needs a clearly non-positive mean, so under-power reads INDETERMINATE rather than a false FAIL.
    The first run replaces sd.'
  feasibility:
    source: none
    accrual_basis: Replays the existing trainer corpus and the public Binance archive; nothing accrues.
decision_rule:
  id: RULE-RQ20261116-d5a7-07-LOOKBACK1000
  registered_at: '2026-11-16'
  registered_before_run: true
  statistic: Pooled over legs and folds, per OOS trade d_c = replayed_r(comp) - replayed_r(champion) and d_v = replayed_r(comp) - replayed_r(vol), on identical trades,
    replay and cost; mean, per-trade SE (one trade = one cluster) and normal 95% CI.
  rule: INDETERMINATE IF pooled n_oos < 300. PASS IF mean(d_c) >= +0.01 R/trade AND the 95% CI lower bound of d_c > 0 AND mean(d_v) >= 0 (composition beats plain
    volume). FAIL IF the 95% CI upper bound of d_c < +0.01 R/trade (cannot reach the bar). INDETERMINATE otherwise. Thresholds, legs, folds (5), embargo (7 d), lookback
    (500), shape and arms are not changed after any result.
  min_n: 300 pooled OOS trades; per fold MIN_FOLD_TEST_N 64 test trades and 500 training rows (the multifold harness floors).
  what_it_does_not_do: 'Edits no config, registry, artifact or exit_head_action; promotes and demotes nothing. A PASS is an offline result under the head''s own judge;
    any change to what the live head runs is a separate Tier-3 proposal with its own evidence record (OPERATING-PLAN section 2). Does not re-test the champion''s
    own KEEP rule (RQ-20260927-002 / 78fc-03 own that). The baseline harness models the legs'' config params only (donchian / atr / trail / min_confidence / long_only),
    as 78fc-03; other declared exit levers are not modelled. Binance 1h klines PROXY the venue''s trade count; rows.jsonl symbols Binance does not list get NaN composition
    (rows_joined_share is reported). The walk-forward span overlaps the window f5c8-02 read when it selected the feature (2021-01..2026-09): a PASS is not independent
    of that discovery, stated as a caveat on the reading. No look at the real corpus was taken before registration: the harness was smoke-tested on BTC 2020 harness
    trades built locally (outside every span, fold floor lowered in-process for mechanics only); no delta was read.'
  proposal_mapping: 'The registered rule decides. PASS -> a Tier-3 proposal for the exit-head recipe change (retrain exit-head-donchian-1h-v1 with the comp columns,
    plus the live-serving parity build: a Binance kline trade-count read beside the Bybit bars), with this record as its evidence, put to the operator. FAIL -> composition
    adds nothing to the exit head beyond its recipe at the 1h grain (this configuration closed, not the family); the 4h-only and tick-data variants stay open. INDETERMINATE
    -> read which clause missed and file the narrower follow-up.'
practice_precedent: M4 (rule registered before the run), M6 (beat the simple baseline, the champion recipe AND plain volume, on identical trades and cost) in docs/reference/trading-and-model-practice-principles.md;
