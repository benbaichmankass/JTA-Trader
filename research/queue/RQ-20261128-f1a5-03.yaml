  subject_kind: strategy_leg
  from_result: research/results/RQ-20261113-62e3-04/43800476250.jsonl
  verdict_read: fail
  diagnosis: 'RQ-20261113-62e3-04 (time-exit, no TP/SL, 00:00 UTC anchor, 14 bps, DSR N=20): every arm loses net (BO1gt -0.506, BO1t -0.570, FD1gt -0.583, FD1t -1.014; stress -0.913); the control bracket grid is -0.72. So the bracket was not what destroyed value (removing it helped only +0.21): there is no post-touch drift at the midnight anchor, and the fade has zero gross edge, so the loss is the cost. A day anchored at 00:00 UTC spends its first half in the thin Asian session, where the touch is noise. Untested: WHEN the bracket is set (session family, map state untested). If drift exists anywhere in the 24h day, the US-open window is where the literature finds it.'
