decision_rule:
  id: RULE-RQ-20261128-f1a5-03
  registered_at: '2026-11-28'
  registered_before_run: true
  statistic: 'TWO invocations of scripts/research/edge_movement_capture.py at 14 bps round trip, DSR N_cum = 22 in both (8 discovery + 8 attempt-2 cost-ceiling + 4 attempt-3 time-exit + these 2): control = the committed CFG grid (--grid base); ARM = CFG_SESSION (--grid session): BO1s (bo, a 0.4) and FD1s (fd, a 0.5), anchored at the 13:00 UTC bar''s open, scanning bars 13..23, R_hat x sqrt(11/24), no TP and no SL, exit at the day''s last close; a bar touching both levels takes the worse direction. Selection is the harness''s own (best primary Sharpe). Combined by scripts/research/edge_iteration_verdict.py.'
  rule: 'PASS iff the ARM''s selected config clears the UNCHANGED registered rule: net Sharpe >= 0.5 AND stress (2x cost) Sharpe > 0 AND Sharpe > 0 in both halves AND bootstrap p05 > 0 AND DSR(N=22) > 0.95 AND the four RR.clause checks (years, concentration, sides, subperiods). FAIL iff the arm computed and does not clear it: no post-touch drift large enough to pay the registered cost in the US-open window either. INDETERMINATE iff the control does not reproduce (selected net Sharpe off -0.72 by more than 0.01, --expect-control-sharpe) or the arm cannot compute. Holdout not read; a PASS earns ONE holdout read, never a book.'
  what_it_does_not_do: Edits no config and no roster, places no order, proposes no live leg, reads no data after 2024-06-30. A FAIL says only that BO1s and FD1s at the 13:00 UTC anchor did not clear the rule.
