- L-PROGRAMMES
programme: P6
kind: experiment
question: On the committed 10-perp 1h archive (EVAL_START..END_DISCOVERY), does a touch of +/- a x R_hat x sqrt(11/24) from the 13:00 UTC open, held to the day's last close with no TP and no SL (BO1s breakout a 0.4, FD1s fade a 0.5), clear the unchanged registered rule at 14 bps round trip and DSR N_cum = 22?
why_this_matters: 'movement-capture is an orphan (scripts/research/iteration_orphans.py 2026-11-28). Volatility IS predictable (Spearman 0.48-0.58 every year) but no bracket has monetised it, and 62e3-04 showed there is no post-touch drift at the 00:00 UTC anchor (time-exit arms all lose, best -0.51). Stop orders around a level replicate an option and have zero value without drift (Carr & Jarrow 1990), so the only place this family can pay is where drift exists. The two sources on crypto intraday structure point at one window: volatility and liquidity peak around the major stock-market opens (Eross, McGroarty, Urquhart & Wolfe 2019), and Bitcoin intraday momentum is strongest in the highest-volume, highest-volatility session (Shen, Urquhart & Wang 2022, Financial Review). The session lever is untested in the map; this tests it with everything else held at 62e3-04.'
