id: RQ-20261128-f1a5-03
title: 'ITERATION 4 of movement-capture (fail): is there post-touch DRIFT in the US-OPEN window? The 62e3-04 time-exit test with ONE change, the bracket anchored at the 13:00 UTC open instead of 00:00 UTC, net of the full cost stack'
