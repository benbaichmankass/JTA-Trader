decision_rule:
  id: RULE-RQ-20261117-43b6-01
  registered_at: '2026-11-17'
  registered_before_run: true
  statistic: 'Over the four holdout corpora built in this run (each row net of fee + slippage + funding by the corpus harness), for trigger new_peak only:
    the book with the stop moved at the bar after new_peak fires to the swing extreme against the position over the last 5 closed bars less 0.1 ATR (taken
    only when > -1 R and below the next open; else the trade holds), replayed to the recorded exit, vs the HOLD book, against 200 matched random-time structure
    moves on the same trades.'
  rule: 'RULE-AM-RISK-ADJUSTED-V1 (am_risk_adjusted.grade_risk_adjusted, V1 parameters: R1 r_cost <= 0.05 R per baseline trade; R2 maxDD cut >= 15% OR weekly-CVaR5
    cut >= 15%; R3 >= 4 of 6 calendar folds hold; n_floor 39) with R4 vs 200 matched random-time books (min_control_beat_frac 0.95), plus L1: a pass must
    keep r_cost <= 0.05 R/trade after dropping the leg with the largest favourable contribution. Reported, never graded: the B3 best static rule (hold +
    the registered trigger arms, chosen leave-one-fold-out) and each candidate''s margin over it. One pre-registered candidate (n_comparisons 1), so R4
    uses V1''s 0.95. PASS: sl_to_structure@new_peak clears R1-R4 and L1. It is a SCREEN pass (per-trade R books, graduation_eligible false until BOOK-SIM-REAL-SIZER):
    a Tier-3 proposal input for the class''s status, never an apply. FAIL: every candidate fails a read necessary clause (R1, R2 or R3) or is beaten by
    its random control (R4). INDETERMINATE: anything else, i.e. the best candidate is under the n floor, never fired, carried by one leg (L1 fails), or
    no trade could be priced (read_state no_data). Fixed now; not changed after a run.'
  what_it_does_not_do: 'Advice-only research: serves, promotes or applies nothing; adds no gate; changes no config, mandate or roster; places no order.'
