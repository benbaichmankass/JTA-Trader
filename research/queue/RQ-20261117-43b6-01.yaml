question: On four testing-leg corpora that were never in ed2b-03's selection population (eth_pullback_2h, sol_pullback_2h, trend_donchian_avax_4h, trend_donchian_ada_4h),
  does sl_to_structure at the first new_peak (stop to the 5-bar swing extreme less 0.1 ATR, only when tighter) still clear RULE-AM-RISK-ADJUSTED-V1 vs hold
  and vs a random-time structure move, net of the full cost stack?
why_this_matters: 'ltr-sl-to-structure is an orphan (scripts/research/iteration_orphans.py 2026-11-17): its only test, RQ-20261113-ed2b-03, PASSED on one
  trigger of three (batch denominator: 1 of 9 candidates across ed2b-01/-03/-05), and a PASS read on one population is a discovery. This is its ONE confirmation
  on an in-hand disjoint population (RESEARCH-NO-WAIT; never a future month). On PASS: a Tier-3 proposal note for the class''s status (advice-only -> eligible
  for auto-apply on its own net-of-cost test, docs/ARCHITECTURE-CANONICAL.md § Active management). On FAIL: the new_peak response is recorded as population-specific
  in research/levers/ltr-sl-to-structure.yaml and the next untested family (action_bounds: pivot_bars / buffer) is chosen. The two branches lead to different
  class decisions. HOLDOUT POPULATION (RESEARCH-NO-WAIT order 2, a leg/symbol holdout, correlated evidence and said so): four testing legs whose corpora
  were never in the 8-leg selection population of RQ-20261113-ed2b-01/-03/-05 (ada_pullback_2h, iaum_pullback_1d, ml_entry, trend_donchian_eth_4h, trend_donchian_eth_prop,
  trend_donchian_sol_prop, trend_donchian_xrp_4h, xrp_pullback_2h). The run builds them with scripts/research/build_ltr_corpus.py --mode harness (exit_lever_ablation
  arm A, config-exact, closed bar, full cost stack) from committed candle CSVs and restricts the harness to them with --legs. CORRELATION DISCLOSED: ETH/SOL/ADA/AVAX
  trade in the same crypto regime as the selection legs, and trend_donchian_sol_4h is excluded because trend_donchian_sol_prop is in the selection population.
  eth/sol_pullback_2h trade the forming bar live; the corpus scores the CLOSED bar (stated bias).'
