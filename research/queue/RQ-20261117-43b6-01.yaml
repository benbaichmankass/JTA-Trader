- the hold arm is the corpus harness's recorded exit; the action arm replays on committed candles from the action bar, so a leg's own trail path after the
  action is not modelled except through its recorded exit
- a replayed stop fills at its level (a gap fills at the open), which flatters stop-based actions
- triggers are evaluated on bar closes, live on telemetry passes
- the holdout corpora score the CLOSED bar; eth/sol_pullback_2h trade the forming bar live
- 'ETH/SOL/ADA/AVAX share the crypto regime of the selection legs: correlated evidence, not independent'
