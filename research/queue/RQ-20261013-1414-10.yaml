id: RQ-20261013-1414-10
title: 'Macro / information: does the EIA natural-gas storage surprise vs the PIT SURVEY consensus predict NG=F forward returns at 1-5
  trading days? (n bounded by the survey backfill, not by 17 forward releases)'
status: done
cadence: once
theme: macro
priority: 2
kind: experiment
question: 'Using ONLY survey-consensus point-in-time rows (the daily forward feed plus the survey backfill: 564 eia_natgas_storage releases
  with a defined surprise (MEASURED), vs the n=13-17 the forward-only scorecard holds), is Spearman(surprise = actual - consensus, forward
  NG=F return) significant at 1, 3 or 5 trading days after the release at |t_eff| >= 2.4 (Bonferroni over 3 horizons) in the expected
  direction (negative)?'
why_this_matters: 'Mechanism: the Thursday EIA storage report moves the front-month when the injection/withdrawal differs from consensus;
  a bigger build than expected is bearish, so the expected sign is NEGATIVE. This is the best-documented scheduled-surprise effect in
  the energy complex. The existing scorecard (comms/macro/econ_event_study_*_scorecard.json) reads n=13-17 because it consumes the forward
  feed only; macro-research invariant 4 says establish what bounds n before waiting for accrual, and the survey backfill (comms/macro/econ_calendar_snapshots_survey_backfill.jsonl,
  564 releases of this kind with a defined surprise after merging with the live feed) is an arbitrary-date-range source, i.e. a missing
  sibling, not a ceiling. Survey consensus is used, NOT the model-expectation backfill: the M3 validation (econ_expectation_validation.json)
  shows the model expectation tracks the survey but is not the quantity the market surprised against, and beats the naive floor only
  for some kinds. MEASURED 2026-10-13 (load_resolved_events_multi over the two committed files): 564 releases with a defined survey
  surprise, 2015-01-08..2026-10-08 (17 live + 553 survey, 6 overlap). Prices come from the runner-side yfinance/Stooq fetch (the sandbox
  cannot reach them, so the join count is verified by the run, not here).'
power:
  expected_n: 564
  min_detectable_effect: 0.2
  effect_units: sd
  design: one_sample
  alpha: 0.01
  power: 0.8
  basis: 'Unit = one release with a defined survey surprise. alpha is declared at the tabulated 0.01 (the nearest tabulated level below
    Bonferroni 0.05/3 = 0.0167, so the declared floor is conservative; the rule bar itself is |t_eff| >= 2.4, p ~ 0.017). A Spearman
    rho of 0.20 needs ~(2.576+0.8416)^2/0.2^2 = 292 pairs at alpha 0.01; the merged files hold 564 releases before the price join, so
    rho=0.20 is clear of the floor only where 564 >= 292 (cpi_mom at 139 is UNDERPOWERED by design and runs as such: it can PASS on
    a large effect, and an INDETERMINATE/FAIL there is weak evidence). Forward windows at horizon 5 overlap when releases are weekly
    (overlap factor ~1), so ic_t_eff (the overlap-corrected t the verdict trusts) is graded.'
  feasibility:
    source: none
    accrual_basis: n is bounded by the count of resolved releases with a defined survey surprise on file (a fixed historical backfill,
      not an accrual); the run prints releases, releases_with_value and price_bars so the bound is MEASURED, and a short join lands
      INDETERMINATE, never padded.
decision_rule:
  id: RULE-RQ20261013-1414-10-EIA-NATGAS-STORAGE-SURPRISE-EVENT-STUDY
  registered_at: '2026-10-13'
  registered_before_run: true
  statistic: Overlap-corrected Spearman t (ic_t_eff) of surprise vs forward NG=F return at horizons 1, 3, 5 trading days (scripts/macro/econ_event_study.py
    event_study, merged live+survey snapshots, one row per release date, earliest observed_at wins), graded by scripts/research/macro_event_study_run.py
    grade() with the CLI flags below.
  rule: 'PASS IF at some horizon in {1,3,5} with n >= 100, |ic_t_eff| >= 2.4 AND the sign of the IC is negative. FAIL IF every horizon
    has n >= 100 and none reaches |t_eff| >= 2.4 in the negative direction (a significant WRONG-sign horizon is reported but is not
    a pass; a FAIL closes only this surprise definition and these horizons). INDETERMINATE IF any horizon has n < 100 (the source bounded
    the test). no_data/producer_failed IF the price panel is empty or no release has a defined surprise: a route fault, not a verdict.'
  min_n: 100 joined releases per horizon (the run reports releases, releases_with_value, price_bars and per-horizon n).
  what_it_does_not_do: A PASS is evidence for a build row (tradeable timing, costs, a placebo and the naive-floor check are all still
    owed), not a leg and not a config change. Not a trade P&L. Uses daily closes, so it cannot see the intraday reaction; a FAIL does
    not say the release is unpriced intraday.
compute: cpu_light
value:
  bucket: information
  usd_at_stake_per_month: 120
  confidence: 0.3
  basis: 'stand-in: an energy/macro release signal with a stated mechanism would feed the M1/M2 event overlay and the news-influence
    layer; information value, not a P&L claim'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 1.0
  est_minutes: 10
  basis: 'Estimate: one yfinance/Stooq daily-close fetch, ~600 rows of snapshots, a rank correlation per horizon; seconds of CPU after
    the network round trips.'
