  confidence: 0.3
  bucket: own_losses
  basis: 'planning stand-in, not a measurement: ib_paper is bricked by the cap today (sized_qty=0 refusals on trades 6892-6895) and the corpus is the registered one.'
practice_precedent: 'docs/research/mgc-sizing-oversize-2026-10-24.md (the sizer replay this unit follows up); comms/strategy_evidence/runs/2026-09-24-e55 (the corpus).'
