id: RQ-20261119-b9a4-01
title: 'IB-GROSS-ATR-FLOOR-S0: on the 141 committed Stage-0 trades of the four IB futures legs, does sizing on max(stop, k x ATR14) for k in {0.5, 1.0} hold max concurrent gross notional at or under 1.5x equity without giving up the dollar edge?'
status: queued
cadence: once
theme: live_strategy
priority: 1
roadmap:
- L-OPS
kind: experiment
question: 'Replaying the committed net-of-cost Stage-0 trades of mgc_trend_1h, mhg_pullback_1d, mgc_pullback_1d and mes_trend_long_1d on one compounding equity path, with the risk distance floored at k x ATR14 (k 0.5 and 1.0; the stop and so each trade''s net R unchanged, only its dollar weight), is there a smallest k for which (a) M1 max concurrent gross notional / equity <= 1.5 at every point, (b) the 80% bootstrap lower bound of M2(B_k)/M2(A) >= 0.80, and (c) M3(B_k) >= 0.90 x M3(A)?'
why_this_matters: 'Flat 1.5% risk over a 0.26-0.40% futures stop buys 3.7-5.8x notional per trade, and the 1.5x IB gross cap then bricks ib_paper (row IB-GROSS-NO-CAP-FIX; docs/research/mgc-sizing-oversize-2026-10-24.md). PASS -> a data-backed Tier-3 sizing change (size futures legs on max(stop, k ATR14)) and a re-read of whether 1.5x ever binds; FAIL -> the caps stay and the next lever is a per-leg risk_pct for the 15m scalp.'
power:
  expected_n: 141
  min_detectable_effect: 0.25
  effect_units: sd
  design: one_sample
  alpha: 0.1
  power: 0.8
  basis: 'n = 141 MEASURED (committed per-trade rows: 118 + 10 + 8 + 5). The power table is a PROXY here: the test is a PAIRED reweighting (the same trades in every arm, only the weights differ), so the per-trade sd of net R (1.856 R, MEASURED over the 141) cancels in the ratio M2(B_k)/M2(A) and the registered bar is the 80% bootstrap lower bound >= 0.80 of that ratio, not a mean test. alpha 0.1 is the nearest tabulated level to that one-sided 80% bound; d 0.25 needs about 99 trades at that level, inside 141. If more than 50% of trades are reweighted the bound widens and INDETERMINATE is the likely verdict (stated before the run, by the registered rule); the harness reports the reweighted share.'
  feasibility:
    source: none
    accrual_basis: 'Replays committed per-trade rows; nothing accrues. The corpus is fixed at 141 trades by the registered rule (ict_scalp_mgc_15m has no committed per-trade rows and is excluded); the n >= 60 ATR-computable floor decides INDETERMINATE.'
evidence_class:
  holdout: dev_folds
  claim: sizing
decision_rule:
  id: RULE-IB-GROSS-ATR-FLOOR-S0
  registered_at: '2026-11-19'
  registered_before_run: true
  baseline: 'A = current sizing: risk 1.5% of equity over |entry-sl|, on the same trades and the same compounding equity path.'
  statistic: 'M1 = max concurrent gross notional / equity; M2 = sum(w_i x net_r_i) and the ratio M2(B_k)/M2(A) with its 80% bootstrap lower bound (one-sided 20th percentile, 10,000 trade resamples, seed 20261119); M3 = return / max drawdown on the path; w_i = |entry-sl| / max(|entry-sl|, k x ATR14), ATR14 from bars closed before entry_time at each leg''s timeframe (read from its bt.json).'
  rule: 'PASS for the smallest k in {0.5, 1.0} where M1 <= 1.5 at every point AND the 80% bootstrap lower bound of M2(B_k)/M2(A) >= 0.80 AND M3(B_k) >= 0.90 x M3(A). FAIL if no k passes. INDETERMINATE if fewer than 60 trades have a computable ATR14. Thresholds, k grid, corpus and seed are fixed now and not changed after any result.'
  pass_action: 'data-backed Tier 3 proposal: size futures legs on max(stop, k x ATR14); re-read whether 1.5x ever binds on ib_paper and propose retiring both IB caps if it never does; read exposure from the venue, not the journal.'
  fail_action: 'the caps stay. The tight-stop trades carry the dollar edge. The next lever is a per-leg risk_pct for the 15m scalp.'
  what_it_does_not_do: 'Changes no sizer, no cap, no config; places no order; adds no gate. A PASS on a Stage-0 corpus is a proposal for the operator-gated Tier-3 sizing change, not the change.'
  min_n: 60 ATR-computable trades of the 141
compute: cpu_light
