decision_rule:
  id: RULE-RQ-20261125-9e71-01
  registered_at: '2026-11-25'
  registered_before_run: true
  baseline: LightGBM on the same 10 columns, folds and rows
  statistic: 'scripts/research/ml_bakeoff.py: per symbol, the paired moving-block (block_rows 24, n_boot 1000, seed 0) bootstrap of the POOLED out-of-fold log-loss
    improvement (LightGBM minus GRU; positive = GRU better), stat boot_ci_low (95% lower bound) and boot_mean; the fold-level paired mean and the prior control are
    reported.'
  rule: PASS iff the GRU boot_ci_low vs LightGBM is > 0 on ALL of BTCUSDT_1h, ETHUSDT_1h, SOLUSDT_1h (>= 3 folds measured). FAIL iff the GRU boot_mean vs LightGBM
    is <= 0 on EVERY symbol. INDETERMINATE otherwise. Fixed now; machine form in ml_bakeoff.rule.
  pass_action: Author the entry-label GRU arm in scripts/research/ml_entry_fix_arms.py (net R per side, frozen v1 recipe as baseline, net of the full cost stack)
    as its own pre-registered unit (MLP-F-SEQUENCE-GRU levers_ahead).
  fail_action: Close the sequence learner (GRU) on these engineered features for D2/D3 (MLP-F-SEQUENCE-GRU exhaustion), recorded with this result; the deep_sequence
    family re-opens only on a new representation (raw OHLCV windows or a pretrained TS encoder), authored from this diagnosis.
  proposal_mapping: pass -> entry-label GRU unit; fail -> line closed; indeterminate -> one re-read at 15m (more rows) authored from the CI width.
  what_it_does_not_do: Changes no served model, config or order path; reads no held-out window; is not a promotion; adds no gate.
