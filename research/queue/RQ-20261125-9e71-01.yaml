id: RQ-20261125-9e71-01
title: 'D2/F29 RESOLVABLE sequence test (GPU): does a 2-layer GRU over 48-bar windows of the engineered features beat LightGBM on the SAME features at 1h regime log-loss
  on BTC/ETH/SOL, judged by a paired moving-block bootstrap 95% lower bound (not the fold mean that made RQ-20261018-ff8f-04 unresolvable)?'
status: done
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-MECE
programme: P2
kind: experiment
iteration:
  subject: ml-sequence-gru
  subject_kind: ml_model
  from_result: RQ-20261018-ff8f-04
  verdict_read: unresolvable
  diagnosis: 'ff8f-04 (GRU vs LightGBM, 15m regime macro-F1) could not decide: fold-level macro-F1 delta sd ~0.03, so a +0.010 bar is unresolvable (ML-F29), and the
    GRU saw 4 volatility columns the LightGBM baseline did not. ml_bakeoff now has a paired moving-block row bootstrap (cv.row_bootstrap, rule stat boot_ci_low; FRONTIER-Q-GRU-RESOLVABLE),
    so the question is decidable at row level. This unit gives BOTH learners the identical 10 columns (the only difference is the sequence model), uses a proper scoring
    rule (log-loss) on the 1h regime target where LightGBM is known to beat the prior (RQ-20261014-65cc-10 PASS), and runs on the GPU.'
  search: one fixed GRU (window 48, hidden 64, layers 2, epochs 15, seeded); no grid.
  levers:
  - model_family
  map_entries:
  - research/levers/ml-entry.yaml
  attempt: 2
  due_by: '2026-12-02'
question: On published BTC/ETH/SOL 1h market_features v002 (purged expanding walk-forward, 5 folds, embargo 24 bars), does a GRU over 48-bar windows of 10 engineered
  features have a LOWER regime log-loss than LightGBM on the same 10 features, with the paired moving-block (24-row) bootstrap 95% lower bound of the improvement
  above 0 on all three symbols?
why_this_matters: 'It is the gate for the deep_sequence family (ML-F22/F29): a PASS justifies building a GRU arm into the ml_entry decision harness (the entry label,
  the slot that trades money); a FAIL closes the sequence learner on our engineered features for this data and frees D2/D3 from it. It also gives the idle Kaggle
  GPU a decidable job (operator 2026-11-25: free compute must not sit idle).'
power:
  expected_n: 100000
  min_detectable_effect: 0.002
  effect_units: logloss_nats_per_row
  sd: 0.3
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATE: ~40k 1h rows per symbol x 3 with ~60% in test folds (~70k paired test rows); per-row log-loss difference sd ~0.3 nats gives a row-level se ~0.0012
    before block dependence; the 24-row block bootstrap widens it, so a ~0.002-0.004 improvement is the smallest resolvable effect. INDETERMINATE is possible and
    stated now.'
  feasibility:
    source: none
    accrual_basis: Published market shards (metis-market-data); nothing accrues.
