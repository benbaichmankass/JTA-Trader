question: Does the hold-biased exit head (78fc-05's 13 value heads, features and folds unchanged) pass the 78fc-05 clauses on corpus B when its act margin tau is chosen per outer fold from the grid {0.15,0.25,0.35,0.5,0.75,1.0}
  R by inner purged leave-one-fold-out on that fold's training trades only (advice rate <= 15% on the inner OOF, max inner mean dR)?
why_this_matters: 'RQ-20261101-78fc-05 FAILED all three clauses at the fixed tau 0.15 R: advice rate 0.717 (cap 0.15), LB95 -0.0554, xrp_4h -0.054. At 0.15 the head acts on 72% of check-ins, so it is not
  hold-biased at all; the margin is the lever that controls that, it was fixed by the plan rather than read, and it can be read without touching a held-out fold. The registered fail action is ''margin vs
  features'': this unit reads the margin; if the head still cannot pass with a cap-respecting margin, the features lever is next (PI-20261119-RIMARY12-0005).'
