decision_rule:
  id: RULE-RQ20261119-2780-05-HOLDBIAS-TAU-INNER
  registered_at: '2026-11-19'
  registered_before_run: true
  min_n: 500 held-out trades
  statistic: 'scripts/research/exit_holdbias.py --tau-grid 0.15,0.25,0.35,0.5,0.75,1.0 on comms/research/desk_lifecycle/action-grid/corpus-b/grid_labels.jsonl.gz (the 78fc-05 corpus, sha256 66a209386d2f79fb...).
    Per outer calendar fold: tau = select_tau_inner (inner leave-one-fold-out over the other folds; inner fit mask = the outer purged train mask AND the inner fold''s purged mask; selected = the highest
    pooled inner-OOF mean dR among grid taus with inner advice rate <= 0.15, tie -> the larger tau; none meets the cap -> the largest tau, flagged cap_unreachable). The outer fold is then scored once at
    that tau with heads fit on the full outer train mask. Clauses read on the pooled held-out trades exactly as 78fc-05.'
  rule: 'PASS iff (a) trade-bootstrap 95% LB of the pooled mean dR > -0.01 R/trade AND (b) held-out advice rate <= 15% AND (c) no leg''s mean dR < -0.05 R/trade (the 78fc-05 clauses, unchanged). FAIL otherwise
    at >= 500 held-out trades. INDETERMINATE below 500, or if any fold is cap_unreachable (then the margin cannot deliver a hold-biased head on that fold''s data and the read is diagnosis, not a test).
    Reported, never graded: the matched-random policy, per-fold selected tau and inner tables, per-leg dR, action mix. Second read of this model family on corpus B; the selection is nested inside each fold''s
    training data, so no outer selection bias is added. Thresholds, grid and corpus are not changed after any result.'
  pass_action: ONE confirmation on a disjoint corpus (fresh-window action-grid labels on the same legs) before any Tier-3 proposal to give the head advice standing on the money legs; no close authority
    follows from this unit.
  fail_action: 'The margin lever is read and closed for this head on corpus B; next lever: the features (what the per-action value heads see), via a new unit.'
  what_it_does_not_do: Trains nothing persistent; registers, serves, promotes or applies nothing; changes no config; adds no gate.
