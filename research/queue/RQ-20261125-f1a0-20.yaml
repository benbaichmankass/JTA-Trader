# Authored 2026-11-25 by lane ML-PRIMARY (REGIME-PROGRAM R3, state classifiers judged on money) from the f1a0-19 read. Rule fixed before any run.
# DISCLOSURE: the R2/R4 book-performance reads on these books were read; no state-cell read exists. Gates this adds or changes: none.
id: RQ-20261125-f1a0-20
title: 'REGIME-PROGRAM R3: does a BTC state cell (ADX/vol-style 2 x 2, or a 2-state HMM) say which family x symbol x direction books
  earn, tilting risk 2.0 / 0.5 by each book''s prior mean in the same cell, by +0.01 R/trade and beating within-week permutations?'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
programme: P2
kind: experiment
iteration:
  subject: regime-program
  subject_kind: ml_model
  from_result: RQ-20261125-f1a0-19/45515431409
  verdict_read: indeterminate
  diagnosis: 'f1a0-19 (run 45515431409): tilting by each book''s OWN trailing 13-week sign gave +0.0098 R/trade (t 1.27), beating all 200
    permutations, but flat-to-negative in 2025-26; the R2 routing forms (f1a0-16, -18) said the same. Book self-momentum is real against chance
    but small and decaying. R3 asks the program''s other half: does the MARKET STATE (classified causally from BTC) say which books earn? The
    manager plan names R3 as HMM vs change-point vs ADX/vol vs LGBM judged on money; this unit runs the two cheapest classifiers on the R4 money
    metric and control.'
  search: two fixed classifiers (advol 2 x 2, hmm2 fit on pre-test weeks), one tilt rule (2.0 / 0.5, >= 20 prior trades in the cell, else
    1.0); no grid.
  levers:
  - regime
  map_entries:
  - research/levers/ml-entry.yaml
  attempt: 5
  due_by: '2026-12-01'
question: 'On the same corpus and 210 books as f1a0-18/-19, does tilting each book-week 2.0 / 0.5 by the sign of the book''s mean net R per trade
  in PRIOR weeks of the SAME BTC state cell (advol: price vs 50-day mean x 20-day vol vs its 365-day median; hmm2: filtered state of a 2-state
  Gaussian HMM on weekly returns fit before 2022), renormalised weekly, beat equal risk by >= +0.01 R/trade (week-bootstrap t >= 2), beat >=
  97.5% of 200 within-week permutations, and hold in >= 4 of 5 years, for either classifier?'
why_this_matters: 'REGIME-PROGRAM R3 (operator 2026-11-24: regime classification is a standing lever, judged on money). A pass gives the first market-state
  signal that moves money across books, for a fresh-window confirmation and then sizing; a fail closes these two classifiers and moves R3 to the
  change-point and LGBM state classifiers.'
power:
  expected_n: 251
  min_detectable_effect: 0.01
  effect_units: r_per_trade
  sd: 0.05
  design: paired
  alpha: 0.025
  power: 0.8
  basis: 'ESTIMATE: 251 test weeks (the cluster); f1a0-18 measured se 0.016 R/trade for routing on these books; a tilt keeps every trade so its
    se should be lower, but a +0.01 effect may still be INDETERMINATE, stated now.'
  feasibility:
    source: none
    accrual_basis: Fixed in-repo corpus with a pinned entry window; nothing accrues.
evidence_class:
  holdout: none
  claim: edge
ml_consumer:
  consumer: REGIME-PROGRAM
  decision: weekly risk sizing across strategy books by BTC state (R3)
  legs:
  - trend_donchian
  - htf_pullback
  - fade_breakout
  - squeeze_breakout
  book: money
baseline:
  definition: Equal risk per trade on every book every week (weight 1), on the same trades; and 200 within-week permutations of the state-tilt weights.
  net_of_cost: true
run:
  command:
  - python3
  - scripts/research/regime_r2_family_router.py
  - --unit
  - '{unit}'
  - --books
  - symbol
  - --mode
  - state
  - --out
  - '{out_dir}'
  inputs:
    research_unit: RQ-20261125-f1a0-20
decision_rule:
  id: RULE-REGIME-R3-STATE-CELLS-20261125
  registered_at: '2026-11-25'
  registered_before_run: true
  baseline: equal risk per trade (weight 1); the same state-tilt weights permuted across books within each week (200 draws)
  statistic: 'scripts/research/regime_r2_family_router.py --books symbol --mode state (cells_advol, cells_hmm2, state_raw, grade_tilt, tilt_verdict
    with RULE_STATE): per classifier, delta = weighted net R per trade - unweighted over test weeks 2022-01-03..2026-10-26; se from 1,000 week-bootstrap
    draws; permutation share of 200 within-week permutations; yearly delta 2022..2026. BTC daily closes from the ml_entry klines cache (Binance
    Vision, fetched when absent).'
  rule: 'Per classifier PASS iff delta >= +0.01 R/trade AND delta/se >= 2 AND permutation share <= 0.025 AND delta > 0 in >= 4 of 5 test years;
    FAIL iff delta <= 0 or share >= 0.5; else INDETERMINATE. UNIT PASS iff either classifier passes; FAIL iff both fail; else INDETERMINATE.'
  pass_action: Fresh-window confirmation (held-out families or a later corpus slice), then a Tier-3 sizing proposal to the manager with this evidence
    record (sizing, never a drop gate).
  fail_action: Record that trailing book performance does not route; author R3 (HMM / change-point / ADX-vol / LGBM state classifiers head-to-head
    on the same money metric and random-routing control).
  proposal_mapping: pass -> fresh-window confirmation -> Tier-3 sizing proposal; fail/indeterminate -> change-point and LGBM state classifiers
    on the same metric.
  what_it_does_not_do: Changes no config, sizing or order path; adds no gate (every trade kept). No state-cell read preceded registration.
  min_n: 100
compute: cpu_light
value:
  bucket: ai_trader
  usd_at_stake_per_month: 300
  confidence: 0.1
  basis: 'stand-in: the four families carry most rostered crypto legs; not a P&L measurement.'
intervention_controls:
  matched_random:
    draws: 200
    description: the same state-tilt raw weights permuted across books within each test week (renormalised); each classifier must beat >= 97.5% of draws
  hold_to_bracket: true
  hold_to_bracket_note: 'no in-trade action: each trade keeps its harness bracket; only its risk weight changes, with the weekly total unchanged'
  best_static:
    grid:
    - equal risk per trade on every book (weight 1), the registered comparator
    excludes_test_folds: true
    note: 'one fixed rule, not chosen on any fold; no grid was searched'
  bootstrap_group: week
practice_precedent: rule registered before the run, net of the full cost stack, matched random control and week-clustered se (principles R5, M6,
  M13).
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 6.0
  est_minutes: 30
  why_runner: Reads the in-repo trade corpus plus keyless Binance Vision BTCUSDT 1h klines; numpy only.
  basis: 'MEASURED: f1a0-16 (same loader, 8 books) completed on a runner; several hundred books make the 200 random routings slower, est.
    under 30 min.'
lands:
