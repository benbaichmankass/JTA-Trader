  registered_at: '2026-11-24'
  registered_before_run: true
  baseline: all books every week; random same-count routing (200 draws)
  statistic: 'scripts/research/regime_r2_family_router.py --books symbol (run, grade, arm_verdict with RULE_SYMBOL): persist arm only; delta
    = net R per trade taken - all-books net R per trade over test weeks 2022-01-03..2026-10-26; se from 1,000 week-bootstrap draws; random share
    of 200 same-count random routings; yearly delta 2022..2026; trade share.'
  rule: 'PASS iff delta >= +0.02 R/trade AND delta/se >= 2 AND random share <= 0.05 AND delta > 0 in >= 4 of 5 test years AND trade share >=
    0.30. FAIL iff delta <= 0 or random share >= 0.5. INDETERMINATE otherwise.'
  pass_action: Fresh-window confirmation (held-out families or a later corpus slice), then R4 regime-conditioned sizing across books on the passing
    arm's signal; a Tier-3 proposal only after both.
  fail_action: Record that trailing book performance does not route; author R3 (HMM / change-point / ADX-vol / LGBM state classifiers head-to-head
    on the same money metric and random-routing control).
  proposal_mapping: nothing is proposed for the trade path from this unit alone; any proposal is sizing (R4), never a drop gate.
  what_it_does_not_do: Changes no config, adds no gate, trains nothing that reaches a book. No symbol-level read preceded registration (the f1a0-16 family-level result was read; disclosed in the header).
