id: RQ-20261023-a1f3-19
title: 'Break-even-floor variant (first test failed -> variant): does a BE floor ALONE at a far arm (1.5-2.5 R) replace the declared exit of trend_donchian_eth_prop
  (prop leg, drawdown matters most)?'
status: queued
cadence: once
roadmap:
- L-ATM
- M20
theme: live_strategy
priority: 1
kind: experiment
question: 'RQ-20261022-eba2-14 (far-rung bank on trend_donchian_eth_prop) and RQ-20261022-fd06-01/-02/-03 (bank + BE floor) graded FAIL. DIAGNOSIS of the first test:
  the first test paired the break-even floor with a 50% bank at 1R, so a FAIL could not say whether the floor or the bank cost the R; a break-even floor ALONE at
  a far arm (1.5-2.5 R) was never tested, and it is the cheapest lever to produce live. Over 2020-07-01 .. 2026-10-15 23:59 on trend_donchian_eth_prop, 6 calendar
  folds, does any arm (BE15 / BE20 / BE25 = break-even floor armed at +1.5 / 2.0 / 2.5 R, no bank) beat the leg as declared (A) by >= 0.02 R/trade on net R in >=
  5 of 6 folds within the Path B drawdown bar (maxDD <= A x 1.35)? R is on the full initial position''s risk.'
why_this_matters: 'Operator directive 2026-10-22: an idea that failed one test is not dead; it failed the first test. This unit is a registered VARIANT. Lane AUTHOR-FLOOR-1023
  (research runnable floor 40 vs 57 at 09:14Z). First test(s): RQ-20261022-eba2-14 (far-rung bank on trend_donchian_eth_prop) and RQ-20261022-fd06-01/-02/-03 (bank
  + BE floor) graded FAIL. Diagnosis (one line): the first test paired the break-even floor with a 50% bank at 1R, so a FAIL could not say whether the floor or the
  bank cost the R; a break-even floor ALONE at a far arm (1.5-2.5 R) was never tested, and it is the cheapest lever to produce live.'
power:
  expected_n: 1085
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'Floor (1.96 + 0.8416)^2 / 0.45^2 = 38.76 -> 39 incumbent trades; expected_n=1085 is an ESTIMATE from sibling units'' n on this leg/window (not a measurement
    for these arms); below the floor the unit grades indeterminate, never FAIL. Trade sequences autocorrelate: the fold majority carries the rest.'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ20261023-A1F3-19-ETHPROP-BEFLOOR-ALONE
  registered_at: '2026-10-23'
  registered_before_run: true
  statistic: 'From scripts/research/exit_lever_ablation.py --grade replace on trend_donchian_eth_prop, window 2020-07-01 .. 2026-10-15 23:59 (6 equal calendar folds,
    a trade binned by entry time), net of the full cost stack the harness resolves per venue (execution_costs.resolve_cost_policy, recorded per arm as cost_stack).
    Arms fixed now: BE15 / BE20 / BE25 = break-even floor armed at +1.5 / 2.0 / 2.5 R, no bank. Per arm: n, net_total_r (full-position R), max_drawdown_r, net R per
    fold. A = the leg as declared in config/strategies.yaml. Per candidate C: delta = net_r(C) - net_r(A); folds_ge = folds with net_r(C) >= net_r(A).'
  rule: 'INDETERMINATE IF n(A) < 39, or IF every C arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C) > net_r(A) AND delta >= 0.02
    R x n(A) AND folds_ge >= 5 of 6 AND maxDD(C) <= maxDD(A) x 1.35. PASS IF one or more pass: the best by net R is named and the follow-up is ONE confirmation unit
    on a disjoint partition (a PASS on one window is a discovery), never a config edit. FAIL IF none passes: the declared exit stands for THESE arms on this leg;
    the idea is not retired and the diagnosis here decides the next variant. Thresholds are not changed after any result.'
  what_it_does_not_do: 'Edits no config and places no order; a PASS needs a Tier-3 declare (and a live producer where the lever has none, plus the mirror in the same
    PR). HARNESS CAVEAT, stated: the bank rung is tested at the top of each bar BEFORE the stop test (optimistic for C; a FAIL is robust, a PASS is checked by its
    confirmation).'
