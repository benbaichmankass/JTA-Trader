id: RQ-20261016-c56e-09
title: 'Breakout strength floor, real money, multi-fold: does moving trend_donchian_xrp_4h''s min_confidence (0.6, 0.7, 0.9) beat the declared min_confidence
  0.8 in >= 7 of 8 folds over ~6 years, net of the full cost stack?'
status: done
cadence: once
theme: live_strategy
priority: 1
kind: experiment
question: On 2020-10-13 .. 2026-10-10 20:00, does any of the 3 pre-registered min_confidence (0.6, 0.7, 0.9) arms on trend_donchian_xrp_4h beat the leg
  as declared by >= 4.0 R over the window, with no worse drawdown, winning >= 7 of 8 equal calendar folds? Arm values fixed here before any run.
why_this_matters: 'trend_donchian_xrp_4h is a real-money leg (bybit_2 + mirror), 0.1266 R/capital-day, 3/4 folds. Axes graded: cooldown (470a-06 FAIL; every
  arm identical -- the lever does not bind), vol-skip-above (470a-07 FAIL), skip-hours (f0e2-02 indeterminate). It declares min_confidence 0.8, the highest
  floor on any 4h leg, never swept.'
power:
  expected_n: 69
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'd=0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo''s standing E35 floor). expected_n=69 is an ESTIMATE: the 1460d record''s 46 trades
    (MEASURED, reproduced exactly by 470a-06''s arm B) -> ~11.5/yr x 6 yr; MC09 may fall below 39 (the floor binds on B only). Window ~6 years with no control
    arm (no committed record spans it; precedent RQ-20261014-470a-01): the argv is built by the same builder the record used.'
  feasibility:
    source: none
    accrual_basis: Re-measurement on freshly fetched keyless Binance Vision candles over a pinned window; the harness replays history, nothing accrues.
decision_rule:
  id: RULE-RQ20261016c56e09
  registered_at: '2026-10-16'
  registered_before_run: true
  statistic: 'Per arm, from the harness''s own --json summary (argv built by regime_debt_matrix.build_harness_cmd from config/strategies.yaml plus the arm''s
    tokens; full cost stack: fee + resolved slippage + funding via execution_costs.resolve_cost_policy, never a zero default): total_trades, net_total_r,
    max_drawdown_r, plus net_r per fold over EIGHT equal calendar spans (~9 months each) (same boundaries every arm). Arms: B = leg as declared (min_confidence
    0.8); MC06=min_confidence=0.6; MC07=min_confidence=0.7; MC09=min_confidence=0.9. Per candidate C: dR = net_r(C) - net_r(B); dDD = maxDD(C) - maxDD(B);
    fold_wins = folds in which C out-earns B. Also reported per arm, not graded: net_r_per_capital_day (the programme''s headline measure).'
  rule: 'indeterminate IF n(B) < 39 (underpowered: no verdict; never FAIL on thin n). A candidate C PASSES iff dR >= 4.0 R over the whole ~6-year window
    AND dDD <= 0 AND fold_wins >= 7 of 8. PASS IF any candidate passes (best = highest dR). FAIL IF none passes: the declared value stands and the axis
    is recorded honest_negative over ~6 years for this leg (it does NOT mean the declared param is dead config -- the exit_lever_ablation ''strip them''
    wording is wrong for entry sweeps, build row GRADER-FAIL-WORDING). WHY 7 of 8 and not an S0-C unit: on 2026-10-14..15 all four single-window best-of-3
    PASSes (f0e2-05, f0e2-10, 470a-05, 470a-09) failed their fresh-window confirmation; with 3 arms, a null arm wins >= 7 of 8 independent folds with p
    ~= 0.035 each (~0.10 for any of 3), so the fold clause carries the confirmation inside one registered unit (the audit''s ''multi-fold, f01d style'').
    A PASS is a Tier-3 PROPOSAL input sent through the manager with the mandate resolver read first; no further S0-C unit. The 4.0 R bar, drawdown clause,
    7-of-8 majority and 39 floor are not changed after any result.'
  what_it_does_not_do: Does not edit config or any roster. Does not mine values (fixed here). A PASS is a Tier-3 proposal input, never a flip.
