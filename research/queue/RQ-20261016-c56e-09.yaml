  - --days
  - '1475'
  - --start
  - '2022-10-13'
  - --end
  - 2026-10-10 20:00
  - --control
  - B=comms/strategy_evidence/runs/2026-10-12-1460d/trend_donchian_xrp_4h__bt.json
  - --control-tol-n
  - '0.02'
  - --control-tol-r
  - '0.5'
  - --grade
  - sweep
  - --baseline
  - B
  - --delta-r
  - '2.0'
  - --fold-majority
