id: RQ-20261105-15c9-01
title: 'ENTRY 1h baseline on PINNED data: does the corrected timeframe harness (frozen bars masked, float64 features) reproduce round 1 on the single seeds, and what are the K=3 ensemble mean and its across-draw spread that every later 1h comparison is judged against? Dev folds only'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: experiment
practice_precedent: 'T1, M6 (docs/reference/trading-and-model-practice-principles.md): purged + embargoed walk-forward; a baseline is only a baseline if the data it was computed on is identified, so a later difference can be attributed.'
question: 'b620-01 returned DOES_NOT_REPRODUCE (2026-11-03). Diagnosis 2026-11-05 (comms/research/RQ-20261101-b620-01/diagnosis-20261105/): the timeframe harness built its table without the frozen-bar delisting mask of round 1 (36,330 frozen dev-window bars over the 60 symbols; +423 dev rows) and cast features to float32; with the mask and float64 the harness pipeline gives round 1 to the last digit (+0.0089485665675495, n 71,950 / 71,886 / 72,063). This unit runs the corrected harness once as the registered 1h baseline: three independent draws (seeds {7,11,13}, {17,19,23}, {29,31,37}) of K=3 models whose scores are averaged, tau 0.10, ungated, 60 frozen perps, 8 dev folds, with the input data identified (per-symbol rows, first/last bar, frozen bars masked, sha256, and a manifest sha256) in the result.'
why_this_matters: 'Manager 2026-11-05: a single seed spreads 13-27x the 0.0005 reproduction tolerance, so a baseline must be an ensemble with a tolerance set against the measured spread, and the data must be pinned so a later re-run can tell "data moved" from "result moved".'
