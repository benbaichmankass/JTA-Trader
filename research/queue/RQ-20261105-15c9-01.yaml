  power: 0.8
  basis: 'MEASURED 2026-11-01 (d507-01 E1): the across-draw range of the pooled mean of a K=3 ensemble is 0.0136 (draws +0.0156/+0.0055/+0.0019) and E0 (single model) 0.0091; the reproduction tolerance below is registered from that measured number, not from the naive two-sample MDE at n 72,000 (0.0148), which it is close to.'
  feasibility:
    source: none
    accrual_basis: Replays public Binance Vision history through 2025-09-30 (dev folds only); nothing accrues.
decision_rule:
  id: RULE-20261105-15c9-01
  registered_at: '2026-11-05'
  registered_before_run: true
  statistic: 'Per draw (K=3 mean score, tau 0.10, ungated, one position per symbol): n and the pooled mean net R per decision, per-fold n and mean, per-year mean; per single seed 7/11/13 (draw-1 members): the same; the data pin (per-symbol rows, first and last bar, frozen bars masked, sha256) and its manifest sha256.'
  rule: 'GRADEABLE iff every fold of every draw has >= 1000 scored decisions AND the data pin is recorded for all 60 symbols. VERDICT WORD: reproduces iff gradeable AND the b620-01 criterion holds on the draw-1 single members (mean over seeds 7/11/13 within 0.0005 of the round-1 v1 base +0.0089486 AND each seed''s decision count within 1% of 71,950 / 71,886 / 72,063); does_not_reproduce iff gradeable and not; indeterminate otherwise. RECORDED REGARDLESS: the baseline B = mean over the three draws of the pooled ensemble mean, rho = their range, and the manifest sha256. REPRODUCTION TOLERANCE for any later run of this baseline: max(0.0136, rho) on the draw means, applicable only when the later run''s manifest sha256 equals the recorded one; a later run on a different manifest sha256 is "data_moved", never "result_moved". Thresholds are not changed after any result.'
  what_it_does_not_do: Reads no sealed or held-out window (dev folds only, no month after 2025-09 is downloaded), serves nothing, changes no config or live symbol list, places no order, sizes nothing.
