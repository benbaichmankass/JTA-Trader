id: RQ-20261023-a1f3-13
title: 'Direction at 1h, RECENT window (first test failed -> variant): does the 1h direction head beat the class prior on log-loss when fit on only the last ~2 years
  (17,520 rows) of BTC, ETH, SOL?'
status: done
cadence: once
theme: ml_health
priority: 2
kind: experiment
question: On BTC/ETH/SOL 1h v002 shards with tail_rows 17,520, direction_label, does LightGBM or the logit beat the class prior by >= 0.002 nats on the CV mean on
  ALL THREE symbols?
why_this_matters: 'Operator directive 2026-10-22: an idea that failed one test is not dead; it failed the first test. This unit is a registered VARIANT. Lane AUTHOR-FLOOR-1023
  (research runnable floor 40 vs 57 at 09:14Z). First test(s): RQ-20261014-4591-02 (direction_label 1h, 40,000-row window, BTC + ETH) graded FAIL. Diagnosis (one
  line): if direction structure exists it is non-stationary, and a 4.5-year window (40,000 rows) dilutes a regime-local effect; recency lifted the regime head on
  the same shards (4591-06 PASS) and was never tried on direction'
power:
  expected_n: 15000
  min_detectable_effect: 0.1
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'Row floor: d=0.1 paired needs ~785 rows; rows are autocorrelated so effective n is lower. expected_n is an ESTIMATE from tail_rows x folds, not a measurement;
    below the fold floor the unit grades indeterminate, never FAIL.'
  feasibility:
    source: none
    accrual_basis: 'Fixed by construction (tail_rows of a nightly-rebuilt shard): n does not grow with waiting, so an underpowered result is reported as such and
      the follow-up is a larger or different dataset, not a re-run.'
decision_rule:
  id: RULE-RQ20261023-A1F3-13-DIR-1H-RECENT
  registered_at: '2026-10-23'
  registered_before_run: true
  statistic: Paired per-fold log-loss difference on identical purged folds (5, embargo 24 rows), tail_rows 17,520, mean over folds, per symbol; positive = candidate
    better.
  rule: PASS IF a candidate (lgbm or logit) beats the class prior by >= +0.002 nats on the CV mean on ALL THREE symbols. FAIL IF no candidate beats the prior by >=
    0 on ANY symbol. INDETERMINATE otherwise, or if folds < 3 or an arm is unavailable. Thresholds are not changed after any result.
  min_n: 3 usable CV folds per symbol; reported n_rows per symbol.
  what_it_does_not_do: Builds, calibrates and serves nothing, promotes nothing, touches no config; a score PASS is not edge and not a P&L figure.
compute: auto
value:
  usd_at_stake_per_month: 100
  confidence: 0.2
  bucket: ai_trader
  basis: 'stand-in: gates whether a downstream ML lever is worth building; not a measured P&L'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  published_data: metis-market-data
  peak_memory_gb: 3.0
  est_minutes: 20
  basis: 'Estimate, NOT measured: CPU-capable bake-off on the published 1h v002 shards the 4591 units read; compute: auto routes it to the Kaggle CPU kernel (published
    data; idle backend per the 09:14Z health line).'
ml_bakeoff:
  task: classification
  metric: logloss
  higher_is_better: false
  dataset:
    kind: jsonl
    groups:
      BTCUSDT_1h:
        path: datasets-out/market_features/BTCUSDT/1h/v002/data.jsonl
      ETHUSDT_1h:
        path: datasets-out/market_features/ETHUSDT/1h/v002/data.jsonl
      SOLUSDT_1h:
        path: datasets-out/market_features/SOLUSDT/1h/v002/data.jsonl
    ts_col: ts
    target: direction_label
    features:
    - rolling_log_return_vol
    - log_return
    - log_return_lag_1
    - log_return_lag_2
    - hour_of_day
    - dayofweek
    tail_rows: 17520
  cv:
    folds: 5
    embargo_rows: 24
    min_train_frac: 0.4
  baseline: prior
  controls: []
  candidates:
  - lgbm
  - logit
  learners:
    prior:
      kind: prior
    lgbm:
      kind: lightgbm
      params:
        learning_rate: 0.05
        min_child_samples: 50
        n_estimators: 200
        num_leaves: 31
    logit:
      kind: numpy_logit
  rule:
    min_folds: 3
    pass_if:
    - group:
      - BTCUSDT_1h
      - ETHUSDT_1h
      - SOLUSDT_1h
      vs: baseline
      window: cv
      op: '>='
      value: 0.002
    fail_if_no_candidate_reaches:
    - group: any
      vs: baseline
      window: cv
      op: '>='
      value: 0.0
run:
  command:
  - python3
  - scripts/research/ml_bakeoff.py
  - --unit
  - '{unit}'
  - --out
  - '{out_dir}'
  timeout_minutes: 60
  inputs:
    research_unit: RQ-20261023-a1f3-13
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
roadmap:
- M25
