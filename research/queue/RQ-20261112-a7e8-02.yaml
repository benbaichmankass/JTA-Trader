decision_rule:
  id: RULE-RQ20261112a7e802
  registered_at: '2026-11-12'
  registered_before_run: true
  statistic: 'harness_stage0.py --family fade --timeframe 1d on SPY,QQQ,IWM,DIA,TLT,IEF,GLD,SLV,GDX, 2020-06-01..2026-11-11; arms fixed now: B = declared base (donchian 20); D5 = donchian=5. No baseline arm (the family has no ETF history to beat). Net of the harness venue-aware fee + slippage + funding stack (execution_costs.resolve_cost_policy; ETFs pay no funding).'
  rule: 'An arm PASSES iff pooled n >= 39, pooled net_r > 0, >= 4 of 6 calendar folds net positive, and >= half of the powered cells (n >= 20, at least 2) pass. PASS IF one or both pass: the best by pooled net R is named; it is a LEAD and the follow-up is ONE confirmation unit on a symbol-disjoint ETF basket (sector SPDRs), never a roster edit. FAIL IF both fail with pooled n >= 39: the fade family at these params is closed on this ETF basket and window (other params, horizons and bars are NOT closed). INDETERMINATE otherwise; thin cells are named and floors are never lowered. Arms and thresholds are not changed after any result.'
  what_it_does_not_do: 'Edits no config, roster or risk; is not a promotion case. yfinance unadjusted daily candles (dividends not added back). Each R is net of the harness''s own cost stack.'
