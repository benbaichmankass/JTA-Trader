why_this_matters: 'Row FRONTIER-STATIC-MARKETS. The fade family has 10 registered units, every one on crypto perps or SLV 1h; scan of research/queue 2026-11-12: harness_stage0 --family fade on equity-index / bond ETFs at 1d appears in 0 units. Equity indices mean-revert at short daily horizons where crypto trends (see RQ-20261112-a7e8-01 sources), so this asks whether the existing, already-wired family works on the asset class the reversion literature is about, at zero build cost. Pairs with a7e8-01 (a different entry mechanism on the same population and window): if both pass, the confirmation unit tests them together; if only one passes, the mechanism is identified.'
