question: 'Same rows.jsonl, legs (trend_donchian BTC, trend_donchian_eth, trend_donchian_sol, 1h), 5 sequential folds, 7-day embargo, live predicate
  and cost stack as aadc-04 (lookback 500); ONE ARM: target holding_pays_neg25 = 1[future_r_delta >= -0.25]. Does the paired per-trade replayed
  R vs the holding_pays champion reach +0.01 R/trade with a deflated CI lower bound > 0?'
why_this_matters: 'The head still closes trades on the demo floor and its D8 slot has no other model in iteration. aadc-04 left the label lever
  open (sub-bar positive). One more value on the same lever settles it: a PASS gives a retrain target; a FAIL with the margin response flattening
  lets the family review go ahead on a closed label lever rather than an open one.'
evidence_class:
  holdout: walk_forward
  claim: model_quality
power:
  expected_n: 11000
  min_detectable_effect: 0.01
  effect_units: r_multiple
  sd: 0.2
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'MEASURED basis from aadc-04 (same rows, legs, folds): holding_pays_0 - champion n 11,160, SE 0.00186, so sd ~0.20 R per trade for a
    label arm. At the deflated z 2.241 the half-width is ~0.0042, so a +0.01 R lift with LB > 0 is detectable, and a FAIL (CI upper < +0.01) needs
    the mean below ~+0.006. A lower margin moves more trades (the head fires less), so the paired sd may move; the run replaces it.'
  feasibility:
    source: none
    accrual_basis: Replays the existing trainer corpus (rows.jsonl) and resident 1h candles; nothing accrues.
baseline:
