    training rows and replayed on the SAME OOS trades with the live predicate; each trade net of fee + slippage + funding. Hold (no head) is reported
    as context.
  net_of_cost: true
decision_rule:
  id: RULE-RQ20261117-aadc-11-EXITHEAD-MARGIN
  registered_at: '2026-11-17'
  registered_before_run: true
  baseline: the holding_pays champion on identical folds and trades
  statistic: 'scripts/research/exit_head_label_bakeoff.py: pooled over legs and folds, per OOS trade d_arm = replayed_r(arm) - replayed_r(champion)
    on identical trades, replay and cost; mean, SE (one trade = one cluster) and CI at z 2.241, kept at aadc-04''s deflated z although one arm
    is read here (a conservative stand-in for the family-wise count of label arms on these rows). Reported: the arm and the champion vs hold,
    firing counts, target coverage in rows.jsonl.'
  rule: PASS iff the holding_pays_neg25 arm has n_oos >= 300, mean d >= +0.01 R/trade AND deflated CI lower bound > 0. FAIL iff n_oos >= 300 and
    the deflated CI upper bound < +0.01. INDETERMINATE otherwise (below n, or between the bars; or future_r_delta absent, which is could_not_look).
    Thresholds, legs, folds (5), embargo (7 d), lookback (500), shape and the arm are not changed after any result.
  pass_action: 'ONE confirmation on a held-out symbol (RESEARCH-NO-WAIT order 2: a donchian 1h leg not in the three, claimed in holdout_lock),
    then a data-backed Tier-3 proposal to retrain exit-head-donchian-1h on the winning target.'
  fail_action: 'The margin lever is closed below the bar (two values read: 0 and -0.25). Labels join features, universe and pooling as flat at
    power (more_mfe stays unread until peak_is_in is emitted; say so in the review). File a family-review record for ml-exit-head-donchian-1h
    (research/family_reviews/, family_retirement_policy.yaml, six protocol items); the manager takes the retire/keep call to the operator. The
    head keeps its demo-floor data collection either way (off the trade path is not off the data path).'
  min_n: 300 pooled OOS trades per arm; per fold MIN_FOLD_TEST_N test trades and the multifold training floor
  what_it_does_not_do: Edits no config, registry, artifact or exit_head_action; promotes and demotes nothing. A PASS is an offline result under
    the head's own judge, then a confirmation, then a Tier-3 proposal. Places no order; adds no gate.
  rerun_of: RQ-20261117-aadc-11
  rerun_note: 'Re-run of RQ-20261117-aadc-11''s registered rule, unchanged, on fresh data; the rule id is the original''s so the two reads are
    comparable. The original PASS stands as evidence on truncated data; #26906 waits on this read.'
