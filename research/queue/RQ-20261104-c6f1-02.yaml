  not assuming it); binding source docs/ARCHITECTURE-CANONICAL.md § TP doctrine; holdout design = PROMOTION-BAR-HOLDOUT-1016
  (exit_lever_ablation.py --grade holdout).
question: 'xrp_pullback_2h is on bybit_2 real money (+ bybit_portfolio mirror) and FAILS tp-doctrine-guard on tp_revision
  (rule_undeclared); entry TP 3R declared and reachable (guard reach 0.246) (scripts/ci/check_tp_doctrine.py on main 745bcf758,
  2026-11-04). Candidates: tp_extend (registered live rule): anchor 3R extend 1R (X31 = bea9 cell X6), anchor 3R extend 0.5R
  (X305), anchor 2.5R extend 1R (X251). Baseline B = the declared static 3R target (--tp-target-r=3) with the leg''s declared
  trail. Selected on the discovery span only and read ONCE on a later held-out span, does a candidate beat B?'
why_this_matters: 'Operator decision 2026-11-04 (weekly planning popup, relayed by Manager Session 2026-11-04a): ''Yes, test
  all 6 (Recommended)'' -- every non-compliant REAL-MONEY leg gets ONE pre-registered TP test. Prior tests on this leg: RQ-20261022-bea9-01/02/04
  (X6 family read fired, full-window, X6 SELECTED on this leg''s whole history -- this unit is the first test where selection
  never sees the held-out span); RQ-20261028-a7c3-05 (stall pull-in, fail); RQ-20261101-5e01-03 (structure SL+TP, queued).
  None held a span back from selection; this one does, so a PASS here is the evidence record a Tier-3 declare needs and a
  FAIL closes these configurations honestly.'
