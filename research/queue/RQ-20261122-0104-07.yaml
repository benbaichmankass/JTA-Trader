  subject_kind: ml_model
  from_result: RQ-20261122-fa22-04
  verdict_read: fail
  diagnosis: fa22-04 FAIL came from ONE cell (trend_donchian chop/calm/long, n 101, -1.72 R, p 0.41); 5 of 8 cells had n 7-13 (< 25) and all 5 were added_r > 0; d7c2-01/b819-01
    pooled PRIMARY was +6.9 R but control_p 0.55. Power, not the lever, limits the 5 cells; the failing cell is a separate finding.
  search: lengthen the history from 1460 to 2190 days for the two legs holding the underpowered cells, same cells, same grade script; a cell that reaches n >= 25 is gradeable
  levers:
  - regime_gating
  map_entries:
