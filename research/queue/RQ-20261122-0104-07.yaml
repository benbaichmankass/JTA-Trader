  Binance-vision candles to the run date that carry a replayed fc-pcv-v2 vol label; full cost stack; a consumer (veto) test, not a promotion read.
what_it_does_not_do: Edits no regime cell, flips no router or verdict mode, re-stages no model, places no order, adds no gate. A FAIL produces a held Tier-3 removal proposal
  only.
intervention_controls:
  not_applicable: an offline consumer evaluation; any cell change is a separate Tier-3 act
iteration:
