  - --primary-horizons
  - 1,3,5
  - --min-n
  - '100'
  - --t-bar
  - '2.4'
  - --expected-sign
  - positive
  - --population
  - initial_jobless_claims releases (live feed + survey-consensus backfill) joined to TLT daily closes
  - --out
  - '{out_dir}'
  timeout_minutes: 30
  inputs:
    research_unit: RQ-20261014-65cc-03
lands:
