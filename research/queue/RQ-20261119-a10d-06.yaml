title: 'ml-exit-head-donchian-1h ITERATION (LABEL target): does the more_mfe target (1 - peak_is_in: is there still > 0.25 R of new favourable
  excursion ahead), aadc-04s second registered arm that could not be read, improve the heads out-of-sample replayed R per trade over the holding_pays
  champion by +0.01 R, net of cost?'
