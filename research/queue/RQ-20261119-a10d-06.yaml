  diagnosis: 'aadc-04 (run 44070631985) registered two label arms: holding_pays_0 (read, +0.00687 R/trade, INDETERMINATE) and more_mfe, which
    was could_not_look because the trainer rows.jsonl predates the builders peak_is_in pass. more_mfe asks a different question from the margin
    lever (aadc-10/-11): not "will the trail cost me" but "is the favourable move exhausted", a pure truncation observable independent of the
    trail. BUILD (this PR): exit_head_label_bakeoff.py --derive-peak-is-in stamps peak_is_in on the existing rows with the builders own definition
    (per trade, final MFE = the running mfe_r at the last bar; peak_is_in = 1 iff final MFE - mfe_r(t) <= 0.25 R), so the read needs no rebuild
    and the queued exit-head units keep their inputs byte-for-byte.'
  search: one arm (more_mfe) against the champion on aadc-04s exact legs, folds, embargo, lookback, shape and cost
