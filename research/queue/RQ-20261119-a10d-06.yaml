  attempt: 5
  due_by: '2026-11-26'
question: 'On aadc-04s population (trend_donchian BTC / ETH / SOL 1h, 5 walk-forward folds, 7-day embargo, lookback 500, live shape below_half_r
  tau 0.10), with peak_is_in derived on the existing rows: does the head trained on more_mfe beat the holding_pays champion by >= +0.01 R per
  OOS trade with the deflated CI lower bound > 0?'
why_this_matters: 'The head still closes trades on the demo floor and its D8 slot has no other model in iteration. aadc-04 left the label lever
  open (sub-bar positive). One more value on the same lever settles it: a PASS gives a retrain target; a FAIL with the margin response flattening
  lets the family review go ahead on a closed label lever rather than an open one.'
evidence_class:
  holdout: walk_forward
  claim: model_quality
power:
  expected_n: 11000
  min_detectable_effect: 0.01
  effect_units: r_multiple
  sd: 0.2
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'MEASURED basis from aadc-04 (same rows, legs, folds): holding_pays_0 - champion n 11,160, SE 0.00186, so sd ~0.20 R per trade for a
    label arm. At the deflated z 2.241 the half-width is ~0.0042, so a +0.01 R lift with LB > 0 is detectable, and a FAIL (CI upper < +0.01) needs
    the mean below ~+0.006. A lower margin moves more trades (the head fires less), so the paired sd may move; the run replaces it.'
  feasibility:
    source: none
    accrual_basis: Replays the existing trainer corpus (rows.jsonl) and resident 1h candles; nothing accrues.
baseline:
  definition: The holding_pays champion (the shipped recipe, train_exit_head.FEATURES, unchanged hyper-parameters) retrained on the SAME fold
    training rows and replayed on the SAME OOS trades with the live predicate; each trade net of fee + slippage + funding. Hold (no head) is reported
    as context.
  net_of_cost: true
decision_rule:
  id: RULE-RQ20261119-a10d-06-EXITHEAD-MOREMFE
  registered_at: '2026-11-19'
  registered_before_run: true
  baseline: the holding_pays champion on identical folds and trades
  statistic: 'scripts/research/exit_head_label_bakeoff.py --derive-peak-is-in --arms more_mfe: pooled over legs and folds, per OOS trade d = replayed_r(more_mfe
    head) - replayed_r(champion head) on identical trades, replay and cost; mean, SE (one trade = one cluster), CI at z 2.241. Reported: peak_is_in_source
    (already labelled / derived / not derivable counts), target coverage, firing counts, each arm vs hold. Derivation note: the builder compares
    its unrounded final MFE with 4-dp mfe_r; the derived final MFE is the 4-dp max, so labels can differ only for rows within 5e-5 R of the 0.25
    boundary.'
  rule: PASS iff the more_mfe arm has n_oos >= 300, mean d >= +0.01 R/trade AND deflated CI lower bound > 0 (z 2.241, aadc-04s two-arm deflation,
    kept). FAIL iff n_oos >= 300 and the deflated CI upper bound < +0.01. INDETERMINATE otherwise (below n, between the bars, or peak_is_in not
    derivable on < 90% of rows, which is could_not_look). Thresholds, legs, folds (5), embargo (7 d), lookback (500), shape and the arm are not
    changed after any result.
  pass_action: 'A pass_pending_fresh_window: confirm on the per-leg OOS control (04a5-04 harness) with more_mfe before any export; if both pass,
    export the more_mfe head as a CANDIDATE artifact (never served from this unit) and file the D8 slots target change as a Tier-3 proposal with
    the evidence.'
  fail_action: 'The exhaustion target does not beat the margin label on these rows: record more_mfe as read and closed for the 1h donchian head
    on the lever map; the D8 next family is the exhaustion feature block (--features extended) or the trade-path sequence model.'
  min_n: 300 pooled OOS trades per arm; per fold MIN_FOLD_TEST_N test trades and the multifold training floor
  what_it_does_not_do: Exports, serves or promotes nothing; edits no config; rebuilds no dataset (the derivation runs in memory on a copy read
    from rows.jsonl, which is not rewritten); places no order; adds no gate.
