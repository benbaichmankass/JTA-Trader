id: RQ-20261016-65ff-27
title: 'Drift remediation (PI-20261016-P3PFA1GK-0001): is the persistent drift flag on the same 9 heads an INSTRUMENT artifact (scores pooled across model
  versions / input mix) or model decay?'
status: done
cadence: once
theme: ml_health
priority: 1
kind: experiment
question: 'For each of the 9 heads the hourly ict-drift-retrain scan flags on every pass (eth-regime-5m-lgbm-v1, mes-regime-5m-baseline-v1, setup-quality-baseline-v0,
  sol-regime-15m-lgbm-fc-pcv-v1, sol-regime-15m-lgbm-fc-pcv-v2 (ADVISORY), sol-regime-5m-lgbm-v1, btc-regime-15m-lgbm-yz-v1, btc-regime-1h-lgbm-v2, btc-regime-1h-lgbm-yz-v1):
  recomputed on scores from ONE model version at a time (and on a fixed input-mix reference window), does the drift statistic still exceed its threshold?'
why_this_matters: '16-17 consecutive scans flag the same 9 and nothing has ever retrained (plan-only). The drift-remediation skill forbids reflexive demotion
  and arming a retrain (TRAINER-DRIFT-NEXT Q2, operator 2026-10-16 ''Hold; diagnose first'') before the cause is known. INFERRED, unverified on the pipeline
  item: the ADWIN scan reads shadow scores across model versions. This unit makes that a measurement.'
power:
  expected_n: 9
  min_detectable_effect: 0.5
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'Unit = head (9). Not a significance test across heads: per head a deterministic recompute of the scan''s own statistic on a version-pure score
    stream.'
  feasibility:
    source: none
    accrual_basis: Reads the retained shadow log (since 2026-09-26) and drift_retrain.jsonl; nothing accrues.
decision_rule:
  id: RULE-RQ2026101665ff27-DRIFT-ARTIFACT
  statistic: 'Per head: the scan''s drift statistic and threshold on (a) the scan''s own input (as today), (b) scores from the newest model_version only,
    (c) newest version with the input mix re-weighted to the training window''s symbol/session mix.'
  rule: 'Per head, ARTIFACT IF (a) exceeds the threshold and (b) does not: the flag is the instrument -> fix the scan (Tier-1, row ML-DRIFT-SPLIT-INSTRUMENT),
    no model action. MIX IF (b) exceeds and (c) does not: input-mix shift -> drift-remediation ''transient'' disposition. DECAY IF (c) still exceeds: persistent
    capability loss -> drift-remediation ''persistent'' (feature/label fix shipped as a new version; demote only as interim safety, operator-gated). The
    unit PASSES (instrument explains it) IF >= 6 of 9 heads read ARTIFACT or MIX; FAILS IF >= 4 of 9 read DECAY; INDETERMINATE otherwise or if a head has
    < 500 scored rows on the newest version.'
  min_n: 500 scored rows per head on its newest version.
  what_it_does_not_do: Retrains, demotes and promotes nothing; arms no retrain; edits no timer, stage or config.
  registered_at: '2026-10-16'
  registered_before_run: true
