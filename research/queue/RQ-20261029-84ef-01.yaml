question: On Binance USD-M daily candles for the twelve perps over 2020-06-01..2026-10-25 (donchian 20, --long-only), does LONG_TR8 (trail 8 ATR)
  or LONG_TS60 (60-bar time stop) pass the pooled Stage-0 rule AND beat LONG (trail 5 ATR) by >= 0.10 R per trade?
why_this_matters: The daily long-only filter is the only timeframes lead with three committed passing records (ef5d-06, 1b57-15, f679-05). 1b57-13
  found the 8-ATR trail / 60-bar stop helped the UNFILTERED two-sided daily arm, but a142-02 failed to confirm TR8 on a disjoint basket. Neither
  tested the exit lever ON the filtered arm. One fixed grid of two exit levers on the lead, baseline = the lead itself; a TR8 win here would still
  carry a142-02 as a caution, so a PASS is a lead for a disjoint basket, never a confirmation.
power:
  expected_n: 425
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: f679-05 LONG n~425 on the same twelve perps and window; folds 6; floor 20 per cell, 39 pooled.
  feasibility:
    source: none
    accrual_basis: Re-measurement on freshly fetched public candles over a pinned window; nothing accrues.
practice_precedent: 'M4, M5 (docs/reference/trading-and-model-practice-principles.md): pre-registered rule, selection-deflated across the timeframes
  tried'
decision_rule:
  id: RULE-RQ20261029-84EF-01-LONG-DAILY-EXITS
  registered_at: '2026-10-29'
  registered_before_run: true
  statistic: 'harness_stage0.py --family trend --timeframe 1d on the twelve perps; arms fixed now: LONG=--long-only; LONG_TR8=--long-only;--trail-mult=8.0;
    LONG_TS60=--long-only;--timeout-bars=60; baseline LONG.'
  rule: 'PASS iff LONG_TR8 or LONG_TS60 passes the pooled Stage-0 rule (pooled n >= 39, pooled net_r > 0, >= 4 of 6 folds, >= half the powered
    cells) AND beats LONG pooled net R/trade by >= 0.10 -> the named exit lever is a fold-consistent improvement on the long-only daily lead;
    next unit is one confirmation on a symbol-disjoint basket (1b57-15 basket), no roster edit. FAIL iff both fail the pass condition with pooled
    n >= 39 -> the 5-ATR trail stays the daily long-only geometry; closes the exit-lever configuration on this window, not the horizon. INDETERMINATE
    otherwise; cells under the floor are named, the floor is never lowered. Verdicts are the script''s own (scripts/research/harness_stage0.py,
    grades fixed by these flags): per CELL pass iff n >= n_floor AND net_r > 0 AND >= fold_majority of the calendar folds net > 0, fail iff n
    >= n_floor and not, indeterminate iff n < n_floor; per ARM pass iff pooled n >= pooled_n_floor AND pooled net_r > 0 AND pooled folds >= fold_majority
    AND >= breadth_frac of the POWERED cells pass (and, with --baseline, beats the baseline''s pooled net R/trade by >= delta), indeterminate
    iff pooled n < pooled_n_floor or < 2 powered cells or < half the declared cells measured (a fetch/harness fault is recorded per cell, never
    dropped), fail otherwise. Holm-corrected one-sided t p-values are REPORTED, not graded. Thresholds are not changed after any result.'
  what_it_does_not_do: Does not edit config/strategies.yaml, config/accounts.yaml or any roster; does not tune beyond the fixed arms listed; is
    not a promotion case. Candles are Binance USD-M (a PROXY for Bybit linear) with the harness's own venue-aware fee + slippage + funding cost
    stack (execution_costs.resolve_cost_policy), so every R is net of cost; the funding term is a directionless magnitude (execution_costs P1).
