title: 'ml_entry serve-parity preflight: do live Bybit V5 1h bars give the same features and LONG/SHORT/NONE decisions as the Binance Vision bars
  the ENTRY model was trained on, over the last 30 days of decision bars on the bybit_2 symbols?'
question: 'Manager 2026-11-01 (operator popup "After 2 cheap checks (Rec.)"): include the serve-parity check in the adapter preflight. scripts/research/ml_entry_serve_parity.py
  builds each decision-bar feature row twice through the served code (src/runtime/ml_decision_features.py), from Bybit V5 public klines and from
  Binance Vision daily klines (own symbol + the 60 reference symbols), and scores both with the served artifact ml/served/ml_decision_entry_v1.'
why_this_matters: The model was trained on Binance bars and will be served on Bybit bars; a venue difference in OHLCV, listing set or bar alignment
  changes the features silently. A mechanical fault found here is fixed in the adapter, never a reason to stop (manager 2026-11-01).
why_not_inferential: 'A parity check on a fixed window: every decision bar of the window is compared; there is no sample to power.'
decision_rule:
  id: RULE-RQ20261101-c692-07-SERVE-PARITY
  registered_at: '2026-11-01'
  registered_before_run: true
  statistic: Decision agreement (long/short/none equal on both venues) over all compared decision bars; per-feature max and median |diff|; |pred
    diff| median and max; reference symbols missing per venue.
  rule: 'PASS IF agreement >= 0.95 over n >= 50 compared bars. FAIL IF n >= 50 and agreement < 0.95 (a mechanical fault: the adapter is fixed
    and this unit re-run). INDETERMINATE IF n < 50. producer_failed when either venue cannot be read (re-run from a host that reaches api.bybit.com,
    e.g. the trainer-vm-diag relay). Reported, not gating, at the first real-money trade unless FAIL.'
  what_it_does_not_do: No order, no config change; does not measure edge.
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 15
  why_runner: Keyless public endpoints.
  basis: 'INFERRED: 61 symbols x 50 daily zips + ~61 Bybit kline pages, 12 threads.'
