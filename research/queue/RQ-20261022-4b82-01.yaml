question: RQ-20261010-353c-06/-10 and RQ-20261011-8753-06/-08 (trend harness at default Donchian-20 on LINK/AAVE 1h) graded FAIL. Over 2020-06-01..2026-10-22
  on 6 cells (LINKUSDT,AAVEUSDT,BNBUSDT,DOGEUSDT,ADAUSDT,XRPUSDT) at 1h, does any candidate arm (D40, D55, D40A) of the trend harness pass the
  pooled Stage-0 rule with breadth AND beat the baseline arm B by >= 0.05 R/trade pooled? The pre-registered hypothesis is that fewer, ADX-confirmed
  breakouts lift expectancy above cost.
why_this_matters: 'Operator directive 2026-10-22: an idea that failed one test is not dead; it failed the first test. This unit is a registered
  VARIANT of that first test. First test: RQ-20261010-353c-06/-10 and RQ-20261011-8753-06/-08 (trend harness at default Donchian-20 on LINK/AAVE
  1h) graded FAIL. DIAGNOSIS (one line): default Donchian-20 on 1h fires on 715 breakouts per cell at 36% win and ~0 expectancy (LINK -0.0025
  R/trade, AAVE -0.0024 R/trade, n=715 each): the signal is noise-dominated, not cost-dominated, so a slower channel and an ADX floor test whether
  fewer, stronger breakouts earn. Lane AUTHOR-FLOOR-1022 (research runnable floor 33 vs 65 at 17:40Z). Prior ids: RQ-20261010-353c-06, RQ-20261010-353c-10,
  RQ-20261011-8753-06, RQ-20261011-8753-08. theme new_strategy_prop was short in the 17:40Z health check.'
