id: RQ-20261127-7ab1-01
title: 'D3 TabICL CAPPED-n FEASIBILITY PROBE on a Kaggle T4: does ONE TabICLv2 window fit in-context on the most recent 50,000 training rows, and does
  the slowest probed window x 13 fit the 290-min GPU budget and peak GPU memory fit 14,500 MB?'
status: done
