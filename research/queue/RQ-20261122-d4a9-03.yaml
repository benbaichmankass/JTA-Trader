# Hand-authored 2026-11-22 by lane QUEUE-FILL-STANDING-W48 (Tier 1), at the manager's direction (action_bounds iteration of ltr-tighten-sl, one of three single-level units sharing one family). ITERATION unit authored from the written diagnosis of RQ-20261122-c8e1-01 / RQ-20261117-43b6-05. Decision rule registered BEFORE any run; no performance output was read before registering (the harness was only run with 1 draw and its output discarded, to confirm it accepts the level). Gates this adds or changes: none.
id: RQ-20261122-d4a9-03
title: 'ITERATION 4 of ltr-tighten-sl (action_bounds, 1 of 3): does the SAME r_milestone tighten with its stop moved only to breakeven (0.0 R), with >= 1 ATR room,
  clear RULE-AM-RISK-ADJUSTED-V1 vs hold and vs a random-time tighten on the 4,076-trade Stage-0 corpus?'
status: queued
cadence: once
theme: live_strategy
priority: 2
roadmap:
- L-ATM
programme: P1
kind: experiment
question: Over the committed Stage-0 per-trade corpora (8 legs), does moving the stop to +0 R at the first r_milestone trigger (first close >= +1 R), taken only when
  that level is >= 1 ATR below the next open, cut maxDD or weekly CVaR5 by >= 15% at <= 0.05 R/trade net of the full cost stack, hold in >= 4 of 6 folds, and beat
  the same tighten at a random bar? One of three pre-registered stop levels (-0.75, -0.5, 0.0 R) that share the family correction.
why_this_matters: 'ltr-tighten-sl has failed on timing early (-0.041 R, CI -0.087..-0.005), timing late and the r_milestone level BE+0.25R (RQ-20261117-43b6-05: -0.0777
  R/trade, CI -0.1191..-0.0372, 0/200 controls, 0/6 folds, all 8 legs negative), and on four momentum-failure triggers (RQ-20261122-c8e1-01: giveback -0.103, momentum_flip
  -0.075, near_target ~0, structure_break -0.313 on n 20; 0/6 folds and 0/200 controls each). Timing and trigger are exhausted for a BE-ish stop. The one untested
  family is ACTION_BOUNDS: how far the stop moves. Diagnosis: a stop at BE+0.25R sits so close to the entry that normal retracements stop out trades that go on to
  run (the cost sits in the winners, every leg negative); a stop only partway in from -1R would keep most of that room while still capping the worst tail. The sibling
  sl_to_structure action, whose level is looser than BE, is the one tighten shape that has graded a PASS (ed2b-03), which is consistent with that reading. Three stop
  levels, the trigger fixed at r_milestone (the cell with the most fires, n 1,403) so the stop level is the only variable: -0.75, -0.5 and 0.0 R. A dose-response
  that improves toward the looser levels but never clears R2 would say there is no free lunch in a tighten at this trigger; a level that clears R2-R4 is a discovery.
  The family review follows only after all three are graded.'
