decision_rule:
  id: RULE-RQ-20261122-d4a9-03
  registered_at: '2026-11-22'
  registered_before_run: true
  statistic: 'Over the pooled committed Stage-0 per-trade corpora in comms/strategy_evidence/ltr_corpus (8 legs), at trigger r_milestone (first close >= +1 R): the
    book with the stop moved at bar j0+1 to +0 R, taken only when that level is >= 1 ATR below the next open (else the trade holds) and is a tighten (level > -1 R),
    replayed to the recorded exit with lro.replay_tighten, vs the HOLD book, against 200 matched random-time tightens to the same level rule on the same trades.'
  rule: 'RULE-AM-RISK-ADJUSTED-V1 (am_risk_adjusted.grade_risk_adjusted, V1 parameters: R1 r_cost <= 0.05 R per baseline trade; R2 maxDD cut >= 15% OR weekly-CVaR5
    cut >= 15%; R3 >= 4 of 6 calendar folds hold; n_floor 39) with R4 vs 200 matched random-time books at min_control_beat_frac 0.9833 (Bonferroni over the family
    of 3 stop levels, -0.75 / -0.5 / 0.0 R, each its own unit), plus L1: a pass must keep r_cost <= 0.05 R/trade after dropping the leg with the largest favourable
    contribution. One pre-registered candidate per unit (n_comparisons 3). PASS: tighten_be@r_milestone at this level clears R1-R4 and L1 (a discovery; SCREEN pass,
    graduation_eligible false until BOOK-SIM-REAL-SIZER; a Tier-3 proposal input, never an apply). FAIL: the candidate fails a read necessary clause (R1, R2 or R3)
    or is beaten by its random control (R4). INDETERMINATE: under the n floor, never fired, carried by one leg (L1 fails), or no trade could be priced. Fixed now;
    not changed after a run. The family is read only when all three units are graded; a family review of ltr-tighten-sl follows that, not before.'
  what_it_does_not_do: 'Advice-only research: serves, promotes or applies nothing; adds no gate; changes no config, mandate or roster; places no order.'
practice_precedent: 'T1 (docs/reference/trading-and-model-practice-principles.md): an intervention is graded against a matched random-intervention control in the
