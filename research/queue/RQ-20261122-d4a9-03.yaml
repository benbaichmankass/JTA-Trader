    0/6 folds and 0/200 controls beaten; per-trade effect vs hold was negative on every arm that fired in volume, worst on ada_pullback_2h (-50.5 R on n 160 for r_milestone).
    The loss does not depend on WHEN the stop moves (early, late, four triggers); the untested variable is WHERE it moves to (action_bounds).'
