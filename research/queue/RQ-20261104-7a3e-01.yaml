    of the full cost stack the harness resolves per venue (cost_stack recorded per arm), baseline A, parameters unchanged from RQ-20261101-5e02-07: delta-r 0, delta-r-per-trade
    0.02, fold-majority 4 of 6, dd-tol-frac 0.35, n-floor 39.'
  rule: 'Registered 2026-11-04 before any run. Candidates SW5T15, SW5T20, SW5T30 (tight-mult 1.5 / 2.0 / 3.0; pivot_k 5; multiplicity 3, plus the 3 arms already read
    on this window in 5e02-07 = 6 tries on this leg and window). One factor: the tightening multiple. A candidate PASSES when the harness''s replace verdict passes
    with the unchanged parameters (delta-r-per-trade 0.02, fold-majority 4 of 6, dd-tol-frac 0.35, n-floor 39). FAIL if none passes. INDETERMINATE if n < 39 or no
    arm fires the level. HONEST WINDOW: second read of the same 2020-07-01..2026-10-15 window, so a PASS is a DISCOVERY with an optimistic bias: it needs one confirmation
