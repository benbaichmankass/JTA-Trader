id: RQ-20261104-7a3e-01
title: 'Structure trail tightening multiple (the one factor; pivot 5 fixed): does loosening SW5''s tighten-to level from 1.0 to 1.5 / 2.0 / 3.0 ATR clear the registered
  +0.02 R/trade bar on trend_donchian_eth_prop, net of the full cost stack? Iteration on the 5e02-07 near-miss'
status: queued
question: '5e02-07 (trend_donchian_eth_prop, n=1085, 2020-07-01..2026-10-15, full venue cost stack): SW5 (pivot 5, tighten-to 1.0 ATR) net R +26.65 vs incumbent +8.72
  = +17.93 R = +0.0165 R/trade; 4 of 4 folds at or above the incumbent (needs 4), max DD 23.4 R vs incumbent 37.5 R (cap 50.6) -- it FAILED only the registered +0.02
  R/trade bar (21.7 R at n=1085). SW3 +16.8 R and FVG +14.0 R fell short the same way; every arm beat A, so the direction is consistent. The incumbent is a trail
  (819 of 1085 trades exit by trail_stop) and the structure arm tightens to 1.0 ATR on first touch; the diagnosis is that 1.0 ATR is too tight for a trend follower
  on 1h bars and gives back some of the gain. Measure the tightening multiple, nothing else.'
why_this_matters: Row STRUCTURE-EXITS-DEFAULT / operator 2026-11-01 default-exit decision. trend_donchian_eth_prop is the only one of 7 legs where a structure trail
  beat the incumbent in 5e02 (the other six lost to it); a near-miss with a consistent sign is exactly the lever-map case to iterate (research-ops core mandate).
  A PASS is a discovery, never a config change.
