# Hand-authored 2026-11-19 by lane ML-PRIMARY-10 (session_01AFoLuMq6PeudHur3tmBVgF, Tier 1 research), dispatched by the JTA Trader
# manager (session_01AFoLuHbhd9wFuGJfWRqyoV, 11:44Z: "author the slot-policy unit now as a pre-registered P8 unit"). The follow-on to
# RQ-20261119-a10d-04 (INDETERMINATE, thin). Decision rule, the selection-vs-noise test and every verdict meaning registered BEFORE any
