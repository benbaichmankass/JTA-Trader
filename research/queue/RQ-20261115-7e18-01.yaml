title: 'ml-tm-action-value STAGE B: on the money legs, does acting on the corpus-v2-trained per-action value (only the Stage-A passers close and
  partial_close_50, inner-fold act margin) beat hold-to-rules, the best static rule, the distance logit and a matched random intervention,
  net of the full cost stack?'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
- L-ATM
programme: P2
kind: experiment
question: 'Same test rows, training rows, features, label and learner as RQ-20261112-3144-02 (TM-BENCH v1 tmb-73f5c3660014, the six money legs
  as traded, 6 purged calendar folds by entry; train = v1 train trades + a seed-11 trade-grouped sample of corpus v2 bp2-f4271084b120 at 4x the
  fold''s v1 train-trade count, cross-symbol purge; R1 + path_state features; 12-bar per-action label; lgbm_action_value). 3144-02 PASSED Stage A
  on exactly two classes (close 4/6 folds, partial_close_50 4/6; research/results/RQ-20261112-3144-02/). STAGE B: the lgbm policy may take only
  those two actions (fixed now: --actions close,partial_close_50), acting when the best predicted dR exceeds a margin chosen per outer fold on 3
  inner out-of-fold folds of the outer TRAIN set from the registered grid {0, 0.02, 0.05, 0.1, 0.2, 0.3} R. Scored per trade on the v1 test rows
  at the engine replay, net of the full cost stack, against B0 (hold to the leg''s own rules), B1 (the best static rule), B2 (the distance
  logit) and B4 (matched random intervention at the arm''s own action rate).'
why_this_matters: 'D7 / D8 in-trade decisions for the real-money legs have no live learned policy: seven earlier action-value negatives, the
  hindsight ceiling says 0.86 R/trade exists, and iteration 3 (4x data) is the first to resolve per-action value out of fold. This read decides
  whether the action-value model goes to a fresh-window confirmation (then a Tier-3 in-trade advice proposal) or iteration 3 closes and the next
  unit is authored from a new diagnosis.'
