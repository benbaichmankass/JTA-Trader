    rank-calibrated head can still lose net of cost to hold or to a static rule. The registered next step is the policy-value read on the
    passing classes.'
  hypothesis: acting on the two passing classes at an inner-chosen margin adds >= 0.03 R/trade over max(B0, B1) net of cost on >= 5 of 6 folds
