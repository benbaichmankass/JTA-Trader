# Authored 2026-11-26 by lane QUEUE-FILL-STANDING-W49 (Tier 1) on the manager order (MG1 execution-convention audit, practice review 2026-11-25 sec 6 M3 / S89; tool HARNESS-ENTRY-NEXT-OPEN, #28955). Rule registered BEFORE the run. Gates this adds or changes: none.
id: RQ-20261126-11d7-03
title: 'MG1 audit, gld_pullback_1d: same-bar close fill vs t+1 next-open fill on the SAME signals, paired per-trade dR net of the full cost stack'
status: queued
cadence: once
theme: live_strategy
priority: 2
kind: experiment
question: On gld_pullback_1d over the pinned 1830-day window, how much per-trade R does the same-bar-close fill convention (the research default) over- or under-state against the live t+1 next-open fill, on the same signals?
why_this_matters: 'The research harnesses fill a closed-bar signal at the signal bar close; live sends the order after the bar closes and fills at the next open. On a 1d leg that is a full session of price move between the two. The practice review (2026-11-25, M3 / S89) asks for the gap to be measured per leg instead of assumed zero. Every Stage-0 number for this leg is on the same-bar convention; this unit gives the manager its next-open twin, paired on identical signals.'
power:
  alpha: 0.05
  basis: 'ESTIMATE: a 1d leg trades tens of signals over five years; below the n floor the read is INDETERMINATE, never a verdict.'
  design: paired
  effect_units: r_multiple
  sd: 1.0
  expected_n: 40
  feasibility:
    accrual_basis: Re-measurement on public candles over a pinned window; nothing accrues.
    source: none
  min_detectable_effect: 0.3
  power: 0.8
decision_rule:
  id: RULE-RQ2026112611d703-MG1-NEXT-OPEN
  registered_at: '2026-11-26'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg gld_pullback_1d --grade paired --baseline CLOSE --candidate NEXT, arms CLOSE (the leg as declared, same-bar close fill) and NEXT (--entry-at=next_open, the live convention: fill at the next bar open, stop and risk anchored to the signal close, fill through the stop refused), 4 calendar folds, paired by entry time, per-trade dR = net_r(NEXT) - net_r(CLOSE) net of the full cost stack.'
  rule: 'AUDIT, read by label, not a leg pass/fail. INDETERMINATE if either arm has n < 30, fewer than 80% of the smaller arm trades pair by entry time, or the producer fails. Otherwise: label incumbent_beats_candidate (the harness verdict reads fail) means the same-bar convention OVERSTATED this leg per-trade R at |t| >= 2 with mean dR below 0 over a majority (>= 3 of 4) of folds; candidate_beats_incumbent means it UNDERSTATED; tie_keep_incumbent means no detectable convention effect. Reported with the result, never graded: n per arm, refused (fill-through-stop) count, mean dR with its t, per-fold dR, absolute net R of each arm, and whether NEXT net R is <= 0 while CLOSE net R > 0 (a leg whose Stage-0 sign depends on the convention is FLAGGED to the manager). Thresholds are not changed after any result.'
  regime_robustness: Per-fold dR is reported with the result and is part of the rule above. Set before the run.
  what_it_does_not_do: Edits no config, roster or account mode and places no order. Not a promotion or demotion case; a flagged leg is a proposal row for the manager.
practice_precedent: 'M3, S89 (docs/reference/trading-and-model-practice-principles.md): the execution convention of a backtest is measured against the live one, per leg.'
