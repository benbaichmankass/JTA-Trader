question: Does a stop loosened to structure (the last 20 closed bars' swing extreme minus 0.10 R, cap 2 R) ONLY where the dip head says the dip recovers (P(dip_recovers) >= the fold's
  training p90) AND the value model says it pays, as an action-value policy on the run-w counterfactual replay (act once, at the first decision row whose predicted net value clears max(0,
  the action's training p75)), clear RULE-AM-RISK-ADJUSTED-V1 (R1 cost <= 0.05 R/trade, R2 drawdown or weekly-CVaR5 cut >= 15%, R3 >= 4 of 6 calendar folds, R4 beats >= 95% of 100 matched
  random placements of the same action), net of the full cost stack, on the dev segment AND on the claimed 2026 holdout?
why_this_matters: 'Loosen was the one Stage B class better than HOLD on the holdout (-2,427 vs -2,663 R) but worse on dev; this asks whether value-gating keeps the holdout gain and fixes
  dev. A pass goes to a FRESH-WINDOW confirmation and then a Tier-3 proposal input (advice-only today, ARCHITECTURE-CANONICAL § Active management); a fail is the input to the next iteration,
  authored from its diagnosis (operator 2026-11-24: a failed test is the input, never the end).'
