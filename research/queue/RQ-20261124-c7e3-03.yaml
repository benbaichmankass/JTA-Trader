  fail_action: 'Diagnose the fail from the landed cuts and per-action kinds and author the next iteration unit at once (lever: features, labels, menu or the cut), recorded on the iteration
    block; never a re-run at another threshold.'
  proposal_mapping: pass -> fresh-window confirmation, then Tier-3 proposal input; fail -> next iteration from its diagnosis; indeterminate -> state which segment/clause and why, then
    iterate.
  choices_where_the_design_memo_is_silent:
  - 'LABELS: every replayable dev trade (entry 2022-01-01..2025-12-31, crypto legs with Binance Vision bars) gets up to 8 decision rows drawn by a seed of its trade key; at each, EVERY
    menu action is replayed alone from that row''s close (placed once, never re-placed) through am_policy_arm.run_arm: label = arm net R - HOLD net R (fee + exit slippage + funding).
    No holdout trade is labelled.'
  - 'FEATURES (point-in-time, bars <= k): the 9 Stage-A head features, the six Stage-B head outputs of the trade''s own fold head (q0.5, q0.9, reach_1, reach_2, stop_first, dip_recovers),
    the gap to the structure level and the gap to the leg''s TP. Heads reused from am-policy-arm run 45384292963 (artifact am-heads-45384292963).'
  - 'FIT: per heads test fold from 2022-07-01 (8 folds incl. the 2026 holdout fold), LightGBM huber regressor per action (fixed params, seed 20261124, deterministic), trained ONLY on
    label rows of trades whose label window ends 7 days before the fold (the holdout fold: before 2025-12-01), labels winsorised at +-3 R, <= 300k rows per fit. Trades entering 2022-01-01..2022-06-30
    have no out-of-sample value model and are excluded (counted as no_value_model_for_fold).'
  - 'POLICY: at each decision row (the unmanaged trade''s open rows) the class''s eligible actions are scored; the FIRST row where an action''s predicted value clears max(EV_MARGIN_R
    = 0, that action''s TRAINING-row p75 predicted value) fires the highest-value such action ONCE; nothing else on that trade. Every number fixed in am_action_value.py before the first
    run and never changed after a result.'
  - BASELINE = HOLD = replayed_actual of the same replay (the leg's own TP + trail + harness timeout), byte for byte; a policy that never acts equals it.
  - 'CONTROL (R4): 100 seeded draws per fired trade: the SAME action kind placed once at a uniformly drawn decision row where that action is eligible (same count, kind and level rule;
    no timing information). It never fires into a closed unmanaged trade: a stronger control than a causal one.'
  - 'GRADING: RULE-AM-RISK-ADJUSTED-V1 with V1 parameters unchanged (am_risk_adjusted.grade_risk_adjusted via am_policy_arm._segment) on DEV (entry < 2026-01-01) and on the claimed HOLDOUT
    (entry >= 2026-01-01). PASS iff both pass R1-R4; FAIL iff dev fails a necessary clause; else INDETERMINATE. Per-family / per-strategy / per-timeframe cuts REPORTED, never graded.
    BOOK-SIM-REAL-SIZER does not exist: a per-trade-R SCREEN (graduation_eligible false).'
  - 'HOLDOUT: family AM-HEADS, 2026-01-01..end, claimed by the reduce step BEFORE the holdout books are built. The family has been read 6 times (Stage A 1 + Stage B 5), so these units
    read as n_tries 7-10 in dispatch order and each is graded against the ledger''s deflated bar_for(n).'
  - 'DISPATCH STAGGER: the four units carry not_before two hours apart (re-staggered 2026-11-24 21:40Z by the next owner, lane ML-PRIMARY, so a late merge cannot make two due at once) so their result jobs never append comms/research/holdout_reads.jsonl concurrently (PI-20261124-RQFAILS-0001 stranded
    4 results that way).'
  - R unit = the ORIGINAL stop distance; positions are not re-sized in trade, so a loosened stop genuinely risks more than 1 R and that tail is charged to the arm's drawdown and CVaR.
  - 'THIS CLASS (av_loosen): a stop loosened to structure (the last 20 closed bars'' swing extreme minus 0.10 R, cap 2 R) ONLY where the dip head says the dip recovers (P(dip_recovers)
    >= the fold''s training p90) AND the value model says it pays.'
