  registered_before_run: true
  statistic: 'scripts/research/am_action_value.py (label, fit, decide_av, control_av, reduce_run) over am_policy_arm._segment / am_risk_adjusted.grade_risk_adjusted: class av_loosen
    arm vs HOLD and 100 seeded matched random placements, on the dev segment (entry 2022-07-01..2025-12-31) and the claimed holdout (entry >= 2026-01-01).'
  rule: 'RULE-AM-RISK-ADJUSTED-V1 with V1 parameters UNCHANGED, per segment: R1 net R given up per baseline trade <= 0.05; R2 max-drawdown cut >= 15% OR weekly-CVaR5 cut >= 15%; R3 the
    fold holds in >= 4 of 6 calendar folds; R4 beats >= 95% of the 100 controls (net R >= the control''s AND the risk cut >= the control''s, one strictly); n floor 39; the lever must
    fire. UNIT verdict: PASS iff dev AND holdout both PASS; FAIL iff the dev segment FAILS; else INDETERMINATE. Every number (menu, levels, rows per trade, LightGBM params, seed, label
