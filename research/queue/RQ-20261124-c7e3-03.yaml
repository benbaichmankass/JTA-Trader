  diagnosis: 'Stage B (RQ-20261124-b5a1-01..05, RULE-AM-HEADS-STAGE-B-20261124) FAILED R4 on every class while the matched random re-timings of tighten and bank BEAT HOLD (dev net R:
    HOLD -8,526; tighten policy -8,694 vs random -7,615; bank policy -12,268 vs random -5,229; n 312,008). The diagnostic replay (scripts/research/am_policy_diag.py, 4,557 dev trades
    in 24 sampled shards, docs/research/am-v2-stage-b-diagnosis-2026-11-24.md) shows WHY: (1) any exposure cut pays in this corpus because the legs'' own exits give back (a 50% market
    close at a uniformly drawn open row nets +0.106 R, positive in 75% of rows, flat across head-score deciles; HOLD giveback mean 1.63 R in the Stage B dev book), so random timing collects
    that structural value; (2) the Stage B rules mapped head PROBABILITIES to actions with fixed cuts, never the action''s VALUE: tighten fired only at P(stop_first) >= p90, i.e. 100%
    under water (mean open_r -0.57, first move at bar ~38 vs ~17 for random), where a half-way move is worth little (policy -0.042 R per fired trade vs random +0.085); bank re-placed
    close+Q50 ~17 times a trade, chasing price (fill level 1.22 R vs 1.48 R random; 10.6% of fills below entry vs 4.9%); (3) the realised value of each action varies strongly and learnably
    with state (breakeven: +0.148 R in the lowest open_r quintile vs -0.004 in the highest; +0.169 R in the 4th P(stop_first) quintile vs -0.014 in the lowest; bank at +1R: +0.087 at
    the lowest P(stop_first) quintile vs -0.007 at the 4th). So the next iteration learns each action''s own value net of cost and acts only where it is high.'
  search: 'lever family bracket; mechanism: an ACTION-VALUE regressor per (fold, action) on the action''s own realised net-R delta vs HOLD, the policy acting once at the first row whose
    predicted value clears max(0, the training p75 of that action''s predicted value). Replaces Stage B''s probability-cut policy (diagnosis above).'
