id: RQ-20261024-0142-01
title: 'Chop-gate strength variant: does a stricter CHOP gate (0.80 / 0.90) tighten the trail only in the worst chop and beat the declared prop leg trend_donchian_sol_prop?'
status: done
cadence: once
roadmap:
- L-ATM
- L-REGIME
- M20
theme: regime
priority: 2
kind: experiment
question: On trend_donchian_sol_prop (live prop leg, 1h long-only), does a trail that tightens to 2.5 x ATR only while peak_r >= 1.5 AND chop_6 > thr (thr 0.80 /
  0.90 declared now) beat the declared exit A by >= 0.02 R/trade in >= 4 of 6 folds within the Path B drawdown bar, AND beat the ungated R-armed tight trail UT?
why_this_matters: 'Lane AUTHOR-FLOOR-1024 (research runnable floor 34 vs 57 at ~11:50Z 2026-10-24; regime 4 vs share 13). Operator directive 2026-10-22: an idea that
  failed one test is not dead; it failed the first test. This unit is a registered VARIANT/EXTENSION of RQ-20261023-1d5c-04 (chop gate 0.55 / 0.65 / 0.75, graded
  FAIL). DIAGNOSIS (hypothesis, not a finding): the 0.75 arm earned +3.16 R over A with 6 of 6 folds at equal drawdown (12.02 vs 12.10) but missed the 0.02 R x 403
  = 8.06 R materiality bar; the gate moved the right way and the gain grew with the threshold (55: -7.4, 65: +2.6, 75: +3.2), so stricter thresholds are the untested
  direction. The materiality bar is unchanged here: a variant must clear the same bar.'
power:
  expected_n: 403
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d=0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo's standing E35 floor). expected_n=403 is an ESTIMATE from sibling units on this leg/window, not
    a measurement; below 39 the unit grades indeterminate, never FAIL.
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ20261024014201-SOLPROPCHOPGATEWID
  registered_at: '2026-10-24'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg trend_donchian_sol_prop --grade replace, window 2020-07-01 .. 2026-10-15 23:59, 6 equal calendar folds
    by entry time, net of the full cost stack the harness resolves per venue (execution_costs.resolve_cost_policy, recorded per arm as cost_stack). Arms fixed now:
    A = the leg as declared in config/strategies.yaml; candidates C80, C90 ; ungated controls UT. Per arm: n, net_total_r, max_drawdown_r, net R per fold.'
  rule: 'INDETERMINATE IF n(A) < 39 or IF every candidate arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C) > net_r(A) AND delta
    >= 0.02 R x n(A) AND net R(C) >= net R(A) in >= 4 of 6 folds AND maxDD(C) <= maxDD(A) x 1.35 AND net_r(C) > net_r of its matching UNGATED control (UT: the same
    action on every trade the gate would reach, so a PASS cannot be ''any early action''). PASS IF one or more pass: the best by net R is named and the follow-up
    is ONE confirmation unit on a disjoint partition (a PASS on one window is a discovery), then a live-producer check and a Tier-3 declare PROPOSAL with the mirror
    in the same PR, never a config edit. FAIL IF none passes with n(A) >= 39: this arm grid is closed on trend_donchian_sol_prop for this window and the family is
    NOT retired; the record names the arm that moved closest and the next variant (chop gate 0.85 with a 2-bar persistence, or tight mult 2.0 at 0.75 (unit 02)).
    Thresholds and the arm grid are not changed after any result.'
  what_it_does_not_do: 'Edits no config and no roster, places no order, is not a promotion case. A PASS also needs a live producer for the lever (check the leg''s
    monitor) and a Tier-3 declare. The arm grid is the whole search: no arm is added after the run, and the baseline is the declared leg, not a tuned one. real-money
    prop leg.'
