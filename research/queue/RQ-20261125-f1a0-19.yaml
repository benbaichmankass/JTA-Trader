decision_rule:
  id: RULE-REGIME-R4-BOOK-TILT-20261125
  registered_at: '2026-11-25'
  registered_before_run: true
  baseline: equal risk per trade (weight 1); the same weights permuted across books within each week (200 draws)
  statistic: 'scripts/research/regime_r2_family_router.py --books symbol --mode tilt (grade_tilt, tilt_weights, tilt_verdict): delta = weighted
    net R per trade - unweighted over test weeks 2022-01-03..2026-10-26; se from 1,000 week-bootstrap draws; control share = share of 200 within-week
    permutations of the raw weights whose weighted R per trade >= the arm''s; yearly delta 2022..2026.'
  rule: 'PASS iff delta >= +0.01 R/trade AND delta/se >= 2 AND permutation share <= 0.05 AND delta > 0 in >= 4 of 5 test years. FAIL iff delta <=
    0 or permutation share >= 0.5. INDETERMINATE otherwise.'
  pass_action: Fresh-window confirmation (held-out families or a later corpus slice), then a Tier-3 sizing proposal to the manager with this evidence
    record (sizing, never a drop gate).
  fail_action: Record that trailing book performance does not route; author R3 (HMM / change-point / ADX-vol / LGBM state classifiers head-to-head
    on the same money metric and random-routing control).
  proposal_mapping: pass -> fresh-window confirmation -> Tier-3 sizing proposal; fail/indeterminate -> R3 (state classifiers head-to-head on money).
  what_it_does_not_do: Changes no config, sizing or order path; adds no gate (every trade is kept in the simulation). No sizing read preceded
    registration (f1a0-18's routing read is disclosed in the header).
