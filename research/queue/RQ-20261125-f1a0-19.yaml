# DISCLOSURE: f1a0-18's routing result on the same 210 books was read; no tilt / sizing read exists. Gates this adds or changes: none.
id: RQ-20261125-f1a0-19
title: 'REGIME-PROGRAM R4: does tilting risk 2.0 / 0.5 by each family x symbol x direction book''s trailing 13-week sign (every trade kept,
  same total risk) beat equal risk by +0.01 R/trade and beat the same weights permuted across books?'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
programme: P2
kind: experiment
iteration:
  subject: regime-program
  subject_kind: ml_model
  from_result: RQ-20261124-f1a0-18/45513198865
  verdict_read: indeterminate
  diagnosis: 'f1a0-18 (run 45513198865), 210 family x symbol x direction books, 251 test weeks: routing to books with trailing 13-week mean > 0 beat ALL 200 same-count random routings (share 0.00) but gained only +0.018 R/trade (t 1.14, 3 of 5 years) while dropping 61% of trades; f1a0-16 at 8 books was +0.021 (t 0.76). The signal is real against chance but small against week-to-week variance, and a drop gate throws away the trades it is wrong about. The manager plan''s R4 is regime-conditioned SIZING, not drops: keep every trade and move risk toward the books that are earning.'
  search: one fixed tilt (2.0 / 0.5 by the trailing 13-week sign, 1.0 without history), per-week renormalised; no grid.
  levers:
  - regime
  map_entries:
  - research/levers/ml-entry.yaml
  attempt: 4
  due_by: '2026-12-01'
question: On the same corpus and books as f1a0-18, does weighting each book-week 2.0 when its trailing 13-week mean net R per trade > 0 and 0.5
  otherwise (1.0 without history), renormalised so each week''s total risk is unchanged, raise net R per trade over equal weights by >= +0.01
  (week-bootstrap t >= 2), beat >= 95% of 200 within-week permutations of the same weights, and hold in >= 4 of 5 test years?
why_this_matters: 'REGIME-PROGRAM R4: sizing is how a regime signal reaches money without becoming a gate. A pass is the first regime lever that keeps
  every trade; it would go to a fresh-window confirmation, then a Tier-3 sizing proposal. A fail moves the program to R3 (state classifiers).'
power:
  expected_n: 251
  min_detectable_effect: 0.01
  effect_units: r_per_trade
  sd: 0.05
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATE: 251 test weeks (the cluster); f1a0-18 measured se 0.016 R/trade for routing on these books; a tilt keeps every trade so its
    se should be lower, but a +0.01 effect may still be INDETERMINATE, stated now.'
  feasibility:
    source: none
    accrual_basis: Fixed in-repo corpus with a pinned entry window; nothing accrues.
evidence_class:
