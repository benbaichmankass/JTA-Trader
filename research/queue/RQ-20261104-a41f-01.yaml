  statistic: 'scripts/research/ml_entry_alpaca_score.py run --side-rule restricted --session-gate: POOLED held-out mean net R per taken LONG decision
    over the population, n, n_symbols. Window 2021-01-01..the last complete month before the run (Alpaca 1h RTH bars), net of fee 0.0 + slippage
    5.0 bps (PROVISIONAL) + regulatory 0.5 bps round trip, funding 0. Decisions at RTH closes with UTC hour % 4 == 0 that pass the live session
    gate; LONG when p_long > tau; entry next RTH open; SL 2 / TP 3 ATR14 / 24-bar time stop; one position per symbol. Reported, never gating:
    per-symbol n and mean; bootstrap CI95; by year; the 2025-10-01-onward slice (clean of v1s training calendar); the 13 alpaca_paper ETFs pooled.'
