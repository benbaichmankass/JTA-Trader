id: RQ-20261016-65ff-06
title: 'Regime good-vs-bad, ada_pullback_2h: does a pre-registered hot-volatility tail skipped at entry (ATR percentile) (VH80, VH90, VH95) beat the leg
  as declared net of the full cost stack on 2024-10-05..2026-10-04?'
status: done
cadence: once
theme: regime
priority: 1
kind: experiment
question: 'Same harness argv builder as the evidence builder (regime_debt_matrix.build_harness_cmd), full cost stack, pinned window 2024-10-05 .. 2026-10-04
  23:59: does any of the 3 pre-registered arms (VH80 = --vol-skip-above-pctl=0.8, VH90 = --vol-skip-above-pctl=0.9, VH95 = --vol-skip-above-pctl=0.95) beat
  ada_pullback_2h as declared (arm B) by >= 1.0 R with no worse drawdown and in >= 3 of 4 calendar folds? This asks whether the market condition at entry
  (the hot-volatility tail skipped at entry (ATR percentile)) separates the leg''s good trades from its bad ones well enough to gate on -- REGIME-PROGRAM
  deliverable 3.'
why_this_matters: 'ada_pullback_2h trades real money (bybit_2 + bybit_portfolio mirror, bybit_1 paper). The volhot axis has no committed unit for this leg
  (coverage read from research/queue on 2026-10-16 by lane P2-AI-REGIME-BACKLOG-1016). Regime theme weight is 5 with 0 regime units queued (L-REGIME ''where'');
  this is the per-leg good-vs-bad trade condition study the operator asked for on 2026-10-11. A null is recorded honest_negative so the axis is not re-asked.
  Design check (IDEA-REVIEW-1016 s11): the literature''s ''skips fail'' prediction is for TREND-FOLLOWING entries (crisis alpha); ada_pullback_2h enters
  on a counter-move inside a trend, a different payoff shape, and pullback hot-tail skips are untested on this leg. The sizing alternative is IR-VOL-TARGET-SIZING-STAGE0.'
power:
  expected_n: 110
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'd=0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo''s standing E35 floor). expected_n=110 is an ESTIMATE: 407c-15 n(B)=111 on this window.
    Below 39 baseline trades the unit grades indeterminate (underpowered), never FAIL. The R bar is a MATERIALITY bar over the whole window, not a significance
    test; the 3-of-4 calendar-fold majority refuses a one-period artifact.'
  feasibility:
    source: none
    accrual_basis: Re-measurement on freshly fetched keyless Binance Vision candles over a pinned window; the harness replays history, nothing accrues.
decision_rule:
  id: RULE-RQ2026101665ff06-REGIME-VOLHOT
  registered_at: '2026-10-16'
  registered_before_run: true
  statistic: 'Per arm, from the harness''s own --json summary (argv built by regime_debt_matrix.build_harness_cmd plus the arm''s tokens; full cost stack:
    fee + resolved slippage + funding via execution_costs.resolve_cost_policy, never a zero default): total_trades, net_total_r, max_drawdown_r, plus net_r
    per fold over FOUR equal calendar spans (same boundaries every arm). Arms: B = leg as declared; VH80 = --vol-skip-above-pctl=0.8; VH90 = --vol-skip-above-pctl=0.9;
    VH95 = --vol-skip-above-pctl=0.95. Per candidate C: dR = net_r(C) - net_r(B); dDD = maxDD(C) - maxDD(B); fold_wins = folds in which C out-earns B. Also
    reported per arm, not graded: net_r_per_capital_day (the programme headline measure).'
  rule: 'indeterminate IF n(B) < 39 (no committed record exists on this exact window, so arm B is reported as the baseline itself) (underpowered: no verdict,
    never FAIL on thin n). A candidate C PASSES iff dR >= 1.0 R AND dDD <= 0 AND fold_wins >= 3 of 4. PASS IF any candidate passes (best = highest dR):
    a LEAD only -- the follow-up is a fresh-window confirmation unit on the disjoint preceding window with the single chosen arm (the 470a-10 pattern),
    never a config edit; two passing arms within 0.5 R of each other is a preference, not a finding. FAIL IF none passes: the declared setting stands; the
    axis is recorded honest_negative for this leg on this window. The 1.0 R bar, the drawdown clause, the 3-of-4 fold majority and the 39 floor are not
    changed after any result.'
  what_it_does_not_do: 'Does not mine values: the arms are fixed here and may not be edited after any result. Does not edit config/strategies.yaml, config/regime_policy.yaml
    or any roster; a pass is a lead/packet for the manager (Tier-3), never a promotion case. Live/paper P&L plays no part. Tests no other axis.'
