question: 'On trend_donchian_xrp_4h (n about 68), does a level trail with an FVG lookback of 120 bars (tight 2.5/3.0) or a strict swing (pivot_k
  5) replace the declared exit on net R in 3 of 4 folds over 2020-07..2026-10, at the venue cost stack? Whether each arm fires is part of the
  record. DIAGNOSIS of the first test (006): MEASURED: RQ-20261022-006 and fd06-03 ran on n(A)=68 trades in 4 folds of about 17 (the leg simply
  produced few entries), with a bar of 0.02 R x 68 = 1.36 R. In 006 the FVG arm LF was byte-identical to A (lever_fired False: no unfilled opposing
  FVG was touched at the default 60-bar lookback), so one of three arms never ran; LS dR -0.49, LR dR -4.02. In fd06-03 B1 / B15 / B1E dR -4.84
  / -2.63 / -4.92, and a1f3-01 (far-rung) P25 +0.32 with 4 of 4 folds. Class: underpowered (n=68) with an inert arm; the leg cannot discriminate
  a 1.4 R effect. '
why_this_matters: 'Operator rule 2026-10-22: a first-test fail is diagnosed and re-asked, never retired. Lane EXIT-FAILED-LEVERS-DIAG (2026-10-24),
  row EXIT-FAILED-LEVERS-DIAG, serves 006. Diagnosis and evidence: docs/research/exit-failed-levers-diag-2026-10-24.md. Looked before authoring
  (PLANNING s1): the queue was grepped for the same leg and lever family; no queued or done unit asks this exact arm set. Parents: research/queue/RQ-20261022-006.yaml,
  research/queue/RQ-20261022-fd06-03.yaml.'
power:
  expected_n: 68
  min_detectable_effect: 0.34
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'n = 68 is the MEASURED baseline trade count of trend_donchian_xrp_4h in the parent verdict(s). Unpaired one-sample MDE = 2.8/sqrt(n)
    = 0.34 sd. Arms share most trades, so the paired difference is far tighter than that (MEASURED in the diag doc: paired sd 0.06-0.5 R per entry);
    the unit''s bar is stated in R and is not claimed to be detectable at the unpaired MDE. A unit whose lever touches a handful of trades is
    reported with its differing-trade count.'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-F08C-15
  registered_at: '2026-10-24'
  registered_before_run: true
  statistic: scripts/research/exit_lever_ablation.py --grade replace on trend_donchian_xrp_4h, window 2020-07-01 .. 2026-10-15 23:59, 4 calendar
    folds, net_r per arm net of the harness venue-aware stack (fee 7.5 bps round trip, slippage 3.0 bps round trip, funding 1.0 bps per 8h window;
    MEASURED in the parent verdicts' cost_stack); baseline A = the leg as declared.
  rule: 'INDETERMINATE IF n(A) < 39, or IF every C arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C) > net_r(A)
    AND delta >= 0.02 R x n(A) AND folds_ge >= 3 of 4 AND maxDD(C) <= maxDD(A) x 1.35. PASS IF one or more pass: the best by net R is named and
    the follow-up is ONE confirmation unit on a disjoint partition (a PASS on one window is a discovery), never a config edit; before any Tier-3
    proposal the winner is re-run with stop fills gap-adjusted (see what_it_does_not_do). FAIL IF none passes: the declared exit stands for THESE
    arms on this leg; the idea is not retired (the operator''s 2026-10-22 rule) and the diagnosis in this unit decides the next variant. Thresholds
    are not changed after any result.'
what_it_does_not_do: 'Edits no config and places no order. Not a promotion case: a PASS is a discovery needing one disjoint-window confirmation.
  HARNESS CAVEAT (code-read 2026-10-24, scripts/backtest_pullback.py / backtest_trend.py): a stop or ratcheted trail that the bar trades through
  fills AT the stop price, not at a gap-open worse than it, and lever exits fill at the bar close; that flatters every arm in proportion to its
  stop exits, so it favours tight-trail arms. A PASS must be re-run gap-adjusted before any Tier-3 note. n(A) is 68: a PASS here is a lead only
  and would need the sibling transfer units (f08c-16, f08c-17) to agree; a FAIL is weak evidence.'
