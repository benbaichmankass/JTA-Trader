  six and BNB baskets (4b82-02/-08); the AVAX basket is the one 1h pullback basket not run, and the family has 2h and 4h baskets on it already. Prior work this does NOT repeat: RQ-20261022-4b82-02,
  RQ-20261022-4b82-08, RQ-20261021-7c2b-14 (pullback 1h), RQ-20261023-1d5c-08 (pullback 2h AVAX basket). Node: P5 prop-pace pullback, AVAX basket at 1h. Trial count for this cell: 1
