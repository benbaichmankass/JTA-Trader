decision_rule:
  id: RULE-RQ202610282A2E07-PULLBACK1H
  registered_at: '2026-10-28'
  registered_before_run: true
  statistic: 'scripts/research/harness_stage0.py --family pullback --timeframe 1h, arms fixed now: B=; BE1=--be-floor-r=1.0; LONG=--side-filter=long; baseline B; per cell and pooled
    across 6 cells; --folds 6 --fold-majority 4 --n-floor 39 --pooled-n-floor 88 --breadth-frac 0.5 --delta-r-per-trade 0.05; cost = the harness venue-aware fee + slippage + funding
    stack (execution_costs.resolve_cost_policy), recorded per cell.'
  rule: 'Arms and thresholds are fixed now and are not changed after any result. A candidate PASSES iff it passes the pooled Stage-0 rule (pooled n >= 88, pooled net_r > 0, >= 4 of 6
    calendar folds net positive, >= half of the powered cells pass)  AND beats B''s pooled net R/trade by >= 0.05 R. PASS IF one or more candidates pass: the best by pooled net R is
    named and the follow-up is ONE confirmation unit on a disjoint window with the same statistic and bar (a pass on one window is a lead), then the prop/real-money SUPERSET ladder;
    never a roster edit. FAIL IF every candidate fails (n >= floor) -> this variant is closed on this window and the record names which arm moved closest so the next variant is aimed;
    the family is NOT retired on one config. INDETERMINATE IF pooled n < 88 or fewer than half the cells measured (a fetch/harness fault is recorded per cell, never dropped).'
  min_n: '88'
  what_it_does_not_do: Edits no config and no roster, places no order, is not a promotion case. A best-of-k arm is a LEAD (programme 03 rung S0-C), never a finding. Candles are Binance
    USD-M (a PROXY for Bybit linear); the funding term is a directionless magnitude (execution_costs P1); both are stated in the record. Does not pool with any committed record.
