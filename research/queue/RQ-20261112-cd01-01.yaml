# Hand-authored 2026-11-12 by lane CRYPTO-ENTRY-DIAG (rows CRYPTO-ENTRY-RETRAIN-UNIT + ML-DECISION-LABEL-VOL-CONFOUND, Tier 1), dispatched by the ML assistant manager. Decision rule registered BEFORE any run; pushed before the run. Gates this adds or changes: none.
id: RQ-20261112-cd01-01
title: 'Served crypto ml_entry (v1r20261106) negative replay: regime vs selection vs cost on the recent window, against the clean frozen v1, plus the gross-label feature ranking'
