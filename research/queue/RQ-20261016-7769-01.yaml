id: RQ-20261016-7769-01
title: 'P4-Q2 placebo for the NQ=F leg: does the PPI m/m surprise ''predict'' NQ=F returns over a window that ENDS BEFORE the release (anchor shifted -10
  trading days)? Expected FAIL'
status: done
cadence: once
theme: macro
priority: 1
kind: experiment
question: With every ppi_mom release's base bar moved 10 trading days earlier (so the h=3 and h=5 forward windows end 5-7 trading days before the print),
  is the IC of (surprise, NQ=F forward return) negative with |t_eff| >= 2.0? The surprise is unknowable in that window, so a PASS means the NQ leg's IC
  is a property of the sample, not information.
why_this_matters: 'Parent lead: RQ-20261014-de02-04 (ppi_mom -> ES=F, n=139, h3 IC -0.281, t_eff -3.43) and its confirmation set, MEASURED from research/results/
  2026-10-16: both sub-periods PASS (4a4c-01 n=68 h3 t -2.05; 4a4c-02 n=71 h3 t -2.79), placebo -10 td CLEAN (4a4c-03 h3 t -0.41, rerun -0.20), +10 td shift
  clean (77dc-02 t -0.72), NQ=F PASS (4a4c-04 h3 t -2.93), ZN=F FAIL (4a4c-05, wrong-sign t +0.86/+1.24), net-of-MES-cost sign book FAIL (4a4c-06: mean
  net +0.00221/trade, t 1.53, n=118; all-long floor +0.00341; book minus floor -0.0012, t -0.59). The drift is real in rank but a symmetric sign book does
  not beat being long. The NQ=F leg (4a4c-04) is the second instrument the axis would rest on; its own placebo is the one check owed that the ES leg already
  cleared (4a4c-03).'
power:
  expected_n: 139
  min_detectable_effect: 0.25
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'Unit = one release with a defined surprise; 139 on file (MEASURED 2026-10-16 with econ_event_study.load_resolved_events_multi over the two committed
    snapshot files (releases with a defined survey surprise, before the price join; the run prints the joined count)). Floor at the unit''s own bar |t|
    >= 2.0: ((2.0+0.84)/0.25)^2 = 130 at d=0.25: CLEARED. Monthly releases with h<=5 trading days never overlap, so releases are not autocorrelated by construction.
    Shifted bars that precede the panel start are dropped, never clamped.'
  feasibility:
    source: none
    accrual_basis: 'n is bounded by the resolved releases on file (a fixed historical backfill 2015-01..2026-10, ~12/yr accrue). Not an accrual: a short
      join lands INDETERMINATE, never padded.'
decision_rule:
  id: RULE-RQ-20261016-7769-01
  registered_at: '2026-10-16'
  registered_before_run: true
  statistic: 'scripts/research/macro_event_study_run.py grade() with --anchor-shift-td -10: ic_t_eff at horizons 3 and 5.'
  rule: 'The verdict is stated FOR THE PLACEBO: PASS (= the ''edge'' exists in a window that ends BEFORE the print = the parent is an ARTIFACT) IF at h=3
    or h=5 with n >= 100, |ic_t_eff| >= 2.0 AND the IC is negative. FAIL (= placebo clean, the parent survives) IF both horizons have n >= 100 and neither
    does. INDETERMINATE IF n < 100. no_data/producer_failed: a route fault, not a verdict.'
  what_it_does_not_do: Does not test the post-release window; it only rules a sample artifact in or out for the NQ leg.
