  diagnosis: 'Iteration 2 (RQ-20261124-c7e3-01..04, RQ-20261125-a9d2-02) FAILED in every class with effect: the value model chose WORSE than a uniform placement of the same
    action (av_tighten dev: policy -11,618 R vs HOLD -10,282 vs random +7,180; rich features -11,550, so the inputs are not the constraint). MEASURED (scripts/research/am_av_fire_timing.py
    on all 24 a9d2-02 policy shards, 108,922 fired dev trades): 87.1% of fires are at the FIRST decision bar (k p50 1; fire point p50 = 5.6% of the HOLD path); fires at k/bars_held
    < 0.1 (65%) cost -16,376 R vs HOLD where the uniform control made +2,492 R on the same trades (HOLD win rate 0.39 there: the eventual winners, cut early); later fires (k/held
    0.1-0.5) equal the control (+0.40 vs +0.41 R/trade). Cause: first-crossing over noisy per-bar predicted values (optional stopping) fires at bar 1, and the labels were drawn
    uniformly so the fit never saw that selection. The structural value is tightening AFTER the trade develops.'
