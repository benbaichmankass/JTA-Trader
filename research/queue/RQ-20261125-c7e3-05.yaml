    slippage + funding). No holdout trade is labelled.'
  - 'FEATURES (point-in-time, bars <= k): the 9 Stage-A head features, the six Stage-B head outputs of the trade''s own fold head (q0.5, q0.9, reach_1, reach_2, stop_first,
    dip_recovers), the gap to the structure level and the gap to the leg''s TP. Heads reused from am-policy-arm run 45384292963 (artifact am-heads-45384292963).'
  - 'FIT: per heads test fold from 2022-07-01 (8 folds incl. the 2026 holdout fold), LightGBM huber regressor per action (fixed params, seed 20261124, deterministic), trained
    ONLY on label rows of trades whose label window ends 7 days before the fold (the holdout fold: before 2025-12-01), labels winsorised at +-3 R, <= 300k rows per fit. Trades
    entering 2022-01-01..2022-06-30 have no out-of-sample value model and are excluded (counted as no_value_model_for_fold).'
  - 'POLICY: at each decision row (the unmanaged trade''s open rows) the class''s eligible actions are scored; the FIRST row where an action''s predicted value clears max(EV_MARGIN_R
    = 0, that action''s TRAINING-row p75 predicted value) fires the highest-value such action ONCE; nothing else on that trade. Every number fixed in am_action_value.py before
    the first run and never changed after a result.'
  - BASELINE = HOLD = replayed_actual of the same replay (the leg's own TP + trail + harness timeout), byte for byte; a policy that never acts equals it.
  - 'CONTROL (R4): 100 seeded draws per fired trade: the SAME action kind placed once at a uniformly drawn decision row where that action is eligible (same count, kind and
    level rule; no timing information). It never fires into a closed unmanaged trade: a stronger control than a causal one.'
  - 'GRADING: RULE-AM-RISK-ADJUSTED-V1 with V1 parameters unchanged (am_risk_adjusted.grade_risk_adjusted via am_policy_arm._segment) on DEV (entry < 2026-01-01) and on the
    claimed HOLDOUT (entry >= 2026-01-01). PASS iff both pass R1-R4; FAIL iff dev fails a necessary clause; else INDETERMINATE. Per-family / per-strategy / per-timeframe cuts
    REPORTED, never graded. BOOK-SIM-REAL-SIZER does not exist: a per-trade-R SCREEN (graduation_eligible false).'
  - R unit = the ORIGINAL stop distance; positions are not re-sized in trade, so a loosened stop genuinely risks more than 1 R and that tail is charged to the arm's drawdown
    and CVaR.
  - 'THIS CLASS (mf_tighten_random): tighten_half (stop half-way from the original stop to the close) once at a uniformly drawn eligible decision row; seed = sha256(trade key|class|policy),
    disjoint from control seeds.'
