question: Does a stop tightened half-way from the original stop to the close, ONCE per trade at a uniformly drawn eligible decision bar (no model, seeded by the trade key),
  clear RULE-AM-RISK-ADJUSTED-V1 clauses R1-R3 vs HOLD (R1 cost <= 0.05 R/trade, R2 drawdown or weekly-CVaR5 cut >= 15%, R3 >= 4 of 6 calendar folds), net of the full cost
  stack, on the dev segment AND the claimed 2026 holdout?
why_this_matters: 'Uniform placement of the same tighten beat HOLD by ~17.5k R dev / ~3.9k R holdout as iteration 2''s CONTROL (conditioned on trades where the model fired).
  As a standalone policy on every replayable trade it is a time-stop / giveback rule that needs no model, no heads and no label pipeline: the cheapest possible live AM lever
  if it holds. A pass goes to a fresh-window confirmation, then a Tier-3 proposal input.'
