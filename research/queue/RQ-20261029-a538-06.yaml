id: RQ-20261029-a538-06
title: 'Volatility regime cell on trend_donchian_sol_4h: does skipping the top vol decile or quintile beat the declared leg net of cost?'
status: done
cadence: once
roadmap:
- L-REGIME
theme: regime
priority: 2
kind: experiment
question: On trend_donchian_sol_4h over 2020-07-01..2026-10-15 23:59, does vol_skip_above_pctl=0.9 (V90) or 0.8 (V80) beat the declared leg (A,
  no vol skip) by >= 0.02 R x n(A), in >= 4 of 6 folds, with maxDD <= 1.35 x A?
why_this_matters: trend_donchian_xrp_4h carries vol_skip_above_pctl 0.9 and trend_donchian_sol_4h does not. A vol cell must gate a money-losing
  regime that generalizes; the top-vol bars are where a 4h breakout leg pays the most slippage per R. Measured against the declared leg with the
  fold bar, not on one window average.
power:
  expected_n: 80
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'd=0.45 at alpha 0.05 / power 0.8 needs (1.96+0.8416)^2/0.45^2 = 38.8 -> 39 trades (the repo standing E35 floor). expected_n=80 is an
    ESTIMATE from sibling units on this leg family, NOT a measurement; below 39 the unit grades INDETERMINATE, never FAIL. The 0.02 R x n bar
    is a materiality bar, not a powered effect: a PASS is a discovery lead and a FAIL closes the configuration only.'
  feasibility:
    source: none
    accrual_basis: Re-measurement on freshly fetched public candles over a pinned window; nothing accrues.
decision_rule:
  id: RULERQ20261029A53806
  registered_at: '2026-10-29'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg trend_donchian_sol_4h --grade replace, window 2020-07-01 .. 2026-10-15 23:59, 6 equal
    calendar folds by entry time, net of the full cost stack the harness resolves per venue (execution_costs.resolve_cost_policy, recorded per
    arm as cost_stack). Arms fixed now: A = the leg as declared in config/strategies.yaml; candidates V90, V80. Per arm: n, net_total_r, max_drawdown_r,
    net R per fold.'
  rule: 'INDETERMINATE IF n(A) < 39 or IF every candidate arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C)
    > net_r(A) AND delta >= 0.02 R x n(A) AND net R(C) >= net R(A) in >= 4 of 6 folds AND maxDD(C) <= maxDD(A) x 1.35. PASS IF one or more pass:
    the best by net R is named and the follow-up is ONE confirmation unit on a disjoint window (a PASS on one window is a discovery; the denominator
    is the number of candidate arms in this unit), then a live-producer check and a Tier-3 declare PROPOSAL with the mirror in the same PR, never
    a config edit. FAIL IF none passes with n(A) >= 39: THIS arm grid is closed on trend_donchian_sol_4h for this window and the family is NOT
    retired; the record names the arm that moved closest. Thresholds and the arm grid are not changed after any result.'
  what_it_does_not_do: 'Edits no config and no roster, places no order, is not a promotion case. A PASS also needs a live producer for the lever
    and a Tier-3 declare. The arm grid is the whole search: no arm is added after the run, and the baseline is the declared leg, not a tuned one.'
