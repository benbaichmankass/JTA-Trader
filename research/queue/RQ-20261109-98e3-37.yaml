  - scripts/research/prop_ml_leg.py
  - run
  - --profile
  - bv
  - --bar-hours
  - '4'
  - --taus
  - 0.35,0.40,0.45,0.50,0.55
  - --arms
  - F0,F0+BOOK
  - --select-from
  - F0+BOOK
  - --require-positive-sum
  - --heldout-span
  - 2023-03-01:2023-12-21
  - --discovery-start
  - '2024-01-01'
  - --cache
  - /tmp/prop_ml_cache
  - --out
  - '{out_dir}'
  timeout_minutes: 330
  inputs:
    research_unit: RQ-20261109-98e3-37
