id: RQ-20261109-98e3-37
title: 'P5-MLPROP-BOOK-BV: does the order-book depth family (Binance bookDepth, builder unit RQ-20261109-98e3-36 PASS) lift a prop-specific ETH+SOL ML entry over price-only on a time-disjoint 2023 held-out,
  and does it clear V3 on breakout_2 and velotrade_1?'
status: done
cadence: once
theme: new_strategy_prop
priority: 1
kind: experiment
roadmap:
- L-PROP
- L-ML-LIVE
practice_precedent: T3 (net of the full cost stack) + M-principles purged walk-forward with one held-out read; prop gate scripts/research/prop_gate.py RULE-P5-GATE-BRK-PER-LEG-V3 via ml_variant_prop_gate.py,
  unchanged.
question: 'The price-only prop ML entry, the oi_flow family and the funding/basis family have each failed on the prop slice (d256-01, 98e3-31/32, 98e3-34/35). The manager asked for the book-depth family
  next (2026-11-09 09:27Z). The builder unit RQ-20261109-98e3-36 graded PASS: a point-in-time book-depth table for ETHUSDT and SOLUSDT from the public Binance bookDepth archive, 2023-01-01..2026-09-30,
  bar coverage >= 0.99 at 4 h, 0 look-ahead in 1,000 audited bar closes per symbol and bar size. Does adding it (arm F0+BOOK) to the prop-specific model (scripts/research/prop_ml_leg.py, profile bv) beat
  the price-only control (arm F0) on a time-disjoint held-out inside 2023+, read once, and does its ledger clear the V3 prop survival gate on breakout_2 and velotrade_1?'
why_this_matters: 'Weekly priority: a live ML entry on every live-money account; the prop accounts have no candidate and the operator wants one that beats the current baseline, which is ml_entry itself.
  Book depth is the one remaining non-price family with a point-in-time table. Its history starts 2023-01, so discovery and held-out must both sit inside 2023+ (the sealed 2020-07..2021-12 span cannot be
  used). The held-out is read at most once, and only if an F0+BOOK cell is eligible on discovery.'
instrument_universe:
  basis: 'config/accounts.yaml: breakout_2, tradeify_1 and velotrade_1 all trade ETHUSDT and SOLUSDT (exchange: breakout)'
  tradeable_now:
  - ETHUSDT
  - SOLUSDT
  population_rule: Pooled ML over both symbols (an account configures strategies, never symbols). The bv profile covers breakout_2 and velotrade_1 (shared model, the stricter of their declared stacks).
data_sources:
  status: Binance Vision um 1h klines resampled to 4h by the driver; daily bookDepth archive for ETHUSDT and SOLUSDT (public, no credential), reduced to point-in-time bar-close features by scripts/research/book_depth_pit.py
    (builder unit RQ-20261109-98e3-36, PASS).
  candidates:
  - 'F0 price/volume only (the matched control: graded, never selected). F0+BOOK = F0 + 8 book columns (imb1, imb2, imb5 = (bid-ask)/(bid+ask) notional within 1, 2, 5 % of mid; lq1, lq5 = log of total notional
    within 1 and 5 %; slope = lq5 - lq1; imb1_mean = mean imb1 over the bar; d_imb1 = change of imb1 since the previous bar close), each from snapshots at or before the bar close; a snapshot older than
    900 s at the close is NaN. Funding, basis, OI/flow, macro (F1/F1b/F1o/F2) and text (F3) are not arms.'
label_and_horizon:
  bar: 4h (--bar-hours 4); horizon 12 bars (48 h), as the driver sets it for 4h bars
  entry: as RQ-20261105-d256-01 (score each closed 4h bar per symbol; enter next bar open when score >= tau; one position per symbol; no hedging)
  label: as RQ-20261105-d256-01 (net R >= +0.5 after the profile cost stack; q60 MFE TP head clipped to [1.5R, 4.0R])
  horizon_bars: 12
baselines:
  cost_stack: 'bv profile: commission 4 bps/side, slippage 3 bps/side, swap 5 bps/night prorated (the stricter of Breakout''s and Velotrade''s declared stacks per term).'
  B0: flat (net R 0).
  B1: all-bars control and matched random-selection control (2000 draws, seed 20261105) on the identical held-out span.
  B3: 'ml_entry ETH+SOL ledger (the reference the driver registers): reported beside the candidate, see the baseline clause of the rule.'
arms:
  denominator: '10 registered draws: feature set {F0, F0+BOOK} x tau {0.35, 0.40, 0.45, 0.50, 0.55}. All graded draws are counted and reported. SELECTION is restricted to the 5 F0+BOOK draws (--select-from
    F0+BOOK): F0 is the matched control, graded and reported, never selected.'
  models: LightGBM, the driver's fixed hyperparameters (no tuning loop).
split:
  discovery: 2024-01-01 .. 2026-09-30 (rows before 2024-01-01 never enter discovery training or folds; --discovery-start), purged expanding walk-forward by calendar quarter, a fold scored only once its
    training set holds >= 5000 rows (the driver constant, unchanged), so scored folds start in 2025 Q2.
  held_out: 'BACKWARD design inside the book-depth era: 2023-03-01 .. 2023-12-21 (time-disjoint, entirely BEFORE discovery with an embargo asserted by the driver; 2023-01 and 2023-02 are excluded because
    book-depth coverage there is 0.88-0.89 against >= 0.97 from 2023-03), read ONCE by ONE model fit on every discovery row. Caveat registered now: the span is about 9.7 months, so n may fall below the
    driver floor of 150 and read INDETERMINATE even if an arm were eligible.'
power:
  expected_n: 150
  min_detectable_effect: 0.185
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATED, not measured: the d256-01 floor of n >= 150. A discovery-only dry run (bv) produced 167 to 666 discovery trades per draw over the 18 months of scored folds at 4h (MEASURED), which scales
    by span to roughly 90 to 360 over the 9.7-month held-out; n < 150 => INDETERMINATE, never FAIL (the driver floor, unchanged).'
  feasibility:
    source: none
    accrual_basis: Replays history on a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ-20261109-98e3-37-BOOK-V3
  registered_at: '2026-11-09'
  registered_before_run: true
  statistic: 'The single F0+BOOK draw selected on discovery (highest summed walk-forward net R among F0+BOOK draws with >= 100 discovery trades, >= 2/3 of folds with trades net-positive, and discovery sum
    net R > 0) among 2 feature sets x 5 taus = 10 registered draws (F0 price-only control, graded and reported but never selected; F0+BOOK = F0 plus the 8 book columns) x tau {0.35, 0.40, 0.45, 0.50, 0.55},
    scored once on the held-out, graded by the driver''s E1-E4 exactly as RQ-20261105-d256-01 (E4 = ml_variant_prop_gate.py V3, the prop survival gate scripts/research/prop_gate.py RULE-P5-GATE-BRK-PER-LEG-V3,
    on breakout_2 and velotrade_1 (profile bv), both cost arms). 4h bars, BACKWARD split: discovery 2024-01-01..2026-09-30 (purged expanding walk-forward from 2024-01-01, a fold scored only once its training
    set holds >= 5000 rows), held-out 2023-03-01..2023-12-21 read once by one fit on every discovery row.'
  rule: 'INDETERMINATE iff held-out n < 150, the ledger is missing, or a self-check fails. FAIL iff no F0+BOOK draw is eligible on discovery (the held-out is then NOT read), or any of E1-E4 fails. PASS
    iff E1 (mean >= +0.10 R and block-bootstrap CI lower bound > 0) AND E2 (beats B0, B1 all-bars and the random p95) AND E3 (driver regime clause over the OOS ledger) AND E4 (V3 PASS on both arms for >=
    1 account of this profile). The verdict applies to the selected F0+BOOK draw and the record NAMES it; the F0 control can never be selected, so a PASS is a book-depth finding by construction. BASELINE
    TO BEAT (MEASURED, comms/prop_survival/ml_entry.json and docs/research/ml-entry-prop-gate-2026-11-02/RESULT.md): the deployed ml_entry, ETH+SOL, served ENTRY v1 + extend-only TP on the held-out 2025-10-01..2026-09-30,
    n=381: edge mean net R +0.0170 (breakout_2 / tradeify_1) and +0.0223 (velotrade_1), 95% CI lower bound about -0.10 R; V3 FAIL on all three firms (EV median -13.55 / -83.70 / -26.75 USD for breakout_2
    / tradeify_1 / velotrade_1). A candidate beats this baseline only by clearing E1 (mean >= +0.10 R, CI lower bound > 0) and E4 (V3 PASS) where the baseline failed both. No common-window comparison is
    claimed: the baseline was read on 2025-10..2026-09, this unit on 2023-03..2023-12 (a different span, a different regime). A PASS is NOT a roster add: it authorises ONE forward-window unit for the frozen
    arm (bars after 2026-10-01) and a manager proposal of a minimum-size baseline variant; it adds no gate. Thresholds are not changed after any result.'
  what_it_does_not_do: 'Promotes nothing, edits no config or roster, places no order; the held-out is read at most once and only if an F0+BOOK draw is eligible on discovery. DISCLOSURES. (1) A discovery-only
    dry run (--no-heldout, profile bv, 4h, the identical arms and split, the held-out never scored) was made before this registration to check the new arm end to end under Python 3.11. Result: 11 folds
    (6 with trades), 12,024 rows; F0 draws sums -46.9/-55.0/-30.7/-11.6/+2.9 R (n 637/523/392/266/171; only tau 0.55 eligible, 5 of 6 folds positive); F0+BOOK draws sums -60.1/-45.3/-52.8/-27.5/-16.3 R
    (n 666/550/421/276/167; none eligible, 1 to 3 of 6 folds positive). So the expected outcome of this unit is FAIL on discovery with the held-out unread. No bar size, tau, arm, feature or threshold was
    changed after seeing it. (2) The one design choice made after the dry run is --select-from F0+BOOK: F0 stays graded but cannot be selected, so the sealed 2023 held-out is never spent on the price-only
    control (which is not a question this unit asks); it can only make a held-out read less likely, never more. (3) The tradeify_es twin was not dry-run; it shares the table, the features and the folds
    and differs in the cost stack''s swap term and the V3 account. (4) The 2023-03..2023-12 span was inside the DISCOVERY window of units RQ-20261109-98e3-34/35 for the price-only F0 and the basis arm (discovery-start
    2022-01-01), so F0 and its tau grid were not selected blind to it; the book columns were. This is why the span is called time-disjoint, not never-seen. (5) Book-depth columns are NaN before 2023-01
    and on stale or missing snapshots; LightGBM handles NaN natively; no row is dropped for a missing book value. (6) Timestamp semantics of the bookDepth CSV are assumed to be capture time (not provable
    from the file).'
  min_n: 150 held-out trades (the driver floor)
ml_consumer:
  not_applicable: No consumer leg exists yet; it would reach breakout_2 and velotrade_1 only by a held Tier-3 roster PR after a PASS plus the forward check.
compute: cpu_long
value:
  bucket: ai_trader
  usd_at_stake_per_month: 100
  confidence: 0.1
  basis: 'stand-in, not a P&L measurement: three live prop accounts; no family has shown an edge on any read; the operator wants a prop ML entry that beats the ml_entry baseline.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 6.0
  est_minutes: 45
  why_runner: Keyless public archive (data.binance.vision); research-script-run.yml holds no secret. The same command ran end to end locally on a cold klines cache plus a cold book cache.
  basis: 'MEASURED on the local discovery-only dry run (bv, 4h, two arms): the table and 11 folds ran in about 400 s after the data was cached; a cold runner also downloads ~2,740 bookDepth day-files (about
    9 min); est_minutes leaves headroom.'
