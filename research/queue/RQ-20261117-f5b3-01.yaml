question: 'eth_pullback_2h: on 2022-10-05..2024-10-04, does the skip-hours arm SL (no entries on trigger bars at 20-23 UTC) still beat the declared leg when the control is the CURRENT live exit (trail_decay_stall_bars
  10 / tight 2.5 forwarded by the argv builder), net of the full cost stack, by >= 1.0 R with no worse drawdown in >= 3 of 4 folds?'
why_this_matters: 'TIER-3 PACKET GAP (P2-R3.c03-pass; manager ask PI-20261117-ZFRREVN5-0005; packet docs/research/regime-tier3-packets-2026-11-17.md). SL has PASSED on three disjoint windows: 2020-07..2022-10
  (47b6-03, +8.66 R, 4/4) and 2024-10..2026-10 (47b6-04, +5.51 R, 3/4) against the live exit, but the middle window 2022-10..2024-10 (65ff-03, +7.92 R, 4/4) was read on 2026-10-16 when the pullback argv
  builder still DROPPED --trail-decay-* (its B argv carries no decay flag; 47b6-0x''s do). So one of the three windows was measured against an exit the leg does not run. This re-read makes all three windows
  comparable before the operator flips. On PASS: the packet is READY (three disjoint live-exit windows); on FAIL: the packet stays NOT READY and the middle-window response is recorded as exit-dependent.
  The decision differs by branch.'
