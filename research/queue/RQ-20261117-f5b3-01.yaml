    cost stack (fee 7.5 + slippage 3 bps rt + funding 1 bps/8h as resolved), 4 equal calendar folds. The reading session first confirms B's argv carries --trail-decay-stall-bars 10 --trail-decay-tight-mult
    2.5; if not, the result is INDETERMINATE (wrong incumbent).
  rule: 'INDETERMINATE IF n(B) < 39 or B''s argv lacks the live trail_decay flags. Candidate SL PASSES iff dR = net_r(SL) - net_r(B) >= 1.0 R AND maxDD(SL) <= maxDD(B) AND fold_wins >= 3 of 4 (the 65ff-03
    bar, unchanged). Regime-robustness clause: per-fold table reported; SL net positive in >= 3 of 4 folds with no fold above 50% of its net is reported, and a pass that misses it is a LEAD with that caveat.
    Long and short net reported separately. FAIL IF not passed at n >= 39 (this configuration closes on this window; the session family stays open). M13: second read of this window for this arm (65ff-03
    was the first). Thresholds fixed now.'
  what_it_does_not_do: Edits no config, roster or order path; it completes a Tier-3 packet's evidence and is not itself a declare.
