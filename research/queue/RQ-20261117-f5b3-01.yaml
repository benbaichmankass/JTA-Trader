title: 'SL (--skip-hours=20,21,22,23) on eth_pullback_2h against the LIVE exit (trail_decay 10/2.5 forwarded): re-read of 2022-10-05..2024-10-04, net of the full cost stack (closes the gap in the P2-R3.c03
