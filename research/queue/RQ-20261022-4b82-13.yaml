question: RQ-20261014-470a-10 (fresh-window CONFIRM of the sol_4h hot-vol skip 0.95) graded FAIL. On trend_donchian_sol_4h, over 2020-07-01..2026-10-15
  23:59 (6 calendar folds by entry time, the harness's venue-aware fee + slippage + funding stack), does any arm (TV80, TV90, TV95) beat the leg
  as declared (B) by >= 1.0 R net in >= 4 of 6 folds with max drawdown no worse? The pre-registered hypothesis is that an exit-side vol rule generalises
  where the entry skip did not.
why_this_matters: 'Operator directive 2026-10-22: an idea that failed one test is not dead; it failed the first test. This unit is a registered
  VARIANT of that first test. First test: RQ-20261014-470a-10 (fresh-window CONFIRM of the sol_4h hot-vol skip 0.95) graded FAIL. DIAGNOSIS (one
  line): the 0.95 skip looked like a pass on one window and failed on the disjoint one, the signature of a window-selected lead; the same regime
  on the exit side was never tested, and is not selected by that window. Lane AUTHOR-FLOOR-1022 (research runnable floor 33 vs 65 at 17:40Z).
  Prior ids: RQ-20261014-470a-10, RQ-20261014-470a-07. regime theme was short in the 17:40Z health check.'
power:
  expected_n: 150
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d=0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo's standing E35 floor). expected_n is an ESTIMATE from the leg's committed
    730 d record (comms/strategy_evidence/runs/2026-10-05-730d-expand/) scaled to the longer window, not a measurement; below 39 the unit grades
    indeterminate, never FAIL.
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ20261022-4B82-13-SOL4H-HOTVOL-TRAIL
  registered_at: '2026-10-22'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg trend_donchian_sol_4h --grade sweep, baseline B = the leg as declared in config/strategies.yaml,
    arms fixed now: TV80=--trail-vol-above-pctl=0.8;--trail-vol-tight-mult=2.5; TV90=--trail-vol-above-pctl=0.9;--trail-vol-tight-mult=2.5; TV95=--trail-vol-above-pctl=0.95;--trail-vol-tight-mult=2.0;
    --folds 6 --fold-majority 4 --n-floor 39 --delta-r 1.0; per arm: n, net_total_r, max_drawdown_r, net R per fold; dR = net_r(arm) - net_r(B),
    dDD = maxDD(arm) - maxDD(B).'
  rule: 'INDETERMINATE IF n(B) < 39 (underpowered; never FAIL on thin n). A candidate arm PASSES iff dR >= 1.0 R AND dDD <= 0 AND it beats B in
    >= 4 of 6 folds. PASS IF any arm passes (best = highest dR): a LEAD, followed by ONE confirmation unit on a disjoint window with the same
    statistic and bar; only a confirmed pass becomes a Tier-3 PROPOSAL note on the owning checklist row for the manager, never a config edit.
    FAIL IF none passes with n(B) >= 39: this variant is closed on this window and the record names the arm that moved closest. Thresholds are
    fixed now and not changed after any result. Two passing arms within 0.5 R of each other are reported as a tie (take the milder).'
  what_it_does_not_do: 'Edits no config and no roster, places no order. A PASS also needs a live producer (see the leg''s monitor) and a Tier-3
    declare with the mirror in the same PR; it is not a promotion case. The arm set is the whole search: no arm is added after the run, and the
    baseline is the declared leg, not a tuned one.'
