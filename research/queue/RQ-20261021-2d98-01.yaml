id: RQ-20261021-2d98-01
title: 'Parameter re-test for fold consistency, real money: does any pre-registered variant of slv_pullback_1d clear >= 5 of 8 folds net > 0 on 2006-10-02 ..
  2025-04-09 and then replicate on the disjoint held-back confirmation span, net of the full cost stack?'
status: queued
cadence: once
theme: live_strategy
priority: 1
kind: experiment
question: slv_pullback_1d as declared is net-positive but not fold-consistent (RQ-20261016-c56e-17 FAIL, +5.03R, 4 of 8 folds, n 160, window 2006-10-02 .. 2025-04-09).
  Selecting on the earlier span only, does one of 5 pre-registered parameter variants (or the declared leg) reach net_r > 0 with >= 5 of 8 calendar folds net > 0,
  and does that ONE selected arm then stay net_r > 0 on the disjoint latest span, tested once?
why_this_matters: 'Operator decision 2026-10-21 (popup ~22:15Z, "Keep live, retest": "Keep it live, since it''s net positive, and queue a parameter re-test aimed
  at consistency across periods"). slv_pullback_1d trades REAL MONEY on alpaca_live (+ mirror). This unit is the queued re-test; the live config is not touched.
  Prior units on the same leg: RQ-20261016-c56e-17 (the FAIL this answers), RQ-20261011-6707-01 (faithful arm, record window), RQ-20261005-015/016 -- looked
  up per PLANNING.md section 1; this unit differs from them by testing a registered parameter set on the long window with a held-back confirmation span.'
power:
  expected_n: 160
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'd=0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo''s standing E35 floor), applied to the DISCOVERY span. expected_n=160 is the c56e-17 count
    on the full window; the discovery span (earliest ~75%) holds ~120 and the held-back span (>= 25 baseline entries, grown to <= 40% of the window) the rest.
    Six arms are tried (declared + 5); the holdout tests exactly one arm once, so no deflation is needed (operator 2026-10-16 "Require holdout"). Cost stack:
    Alpaca equity fee 0 + resolved slippage + no funding, resolved by execution_costs.resolve_cost_policy as in c56e-17.'
  feasibility:
    source: none
    accrual_basis: Re-measurement on freshly fetched keyless candles over a pinned historical window; nothing accrues.
decision_rule:
  id: RULE-RQ20261021-2d98-01
  registered_at: '2026-10-21'
  registered_before_run: true
  statistic: 'Six arms, every one built by regime_debt_matrix.build_harness_cmd and run once over the pinned window, graded by exit_lever_ablation.py --grade holdout:
    B = the leg as declared; P1 trend_lookback=60; P2 pullback_frac=0.5; P3 atr_stop_mult=2.5; P4 trail_mult=3.0; P5 trend_lookback=60 + atr_stop_mult=2.5. The
    boundary is the latest 25% of the window (grown to hold 25 baseline entries, capped at 40%), fixed before any outcome. Discovery eligibility per arm: n >= 39 AND
    net_r > 0 AND >= 5 of 8 calendar folds of the discovery span net > 0. The eligible arm with the highest discovery net R is selected (tie -> B). The selected
    arm is read ONCE on the held-back span.'
  rule: 'PASS IF an arm is eligible on discovery (net_r > 0 AND >= 5 of 8 folds net > 0, full cost stack) AND the selected arm has n_holdout >= 25 and net_r_holdout > 0 on the
    disjoint held-back span (verdict confirmed). FAIL IF >= 1 arm held >= 39 discovery trades but none is eligible (no_discovery) or the selected arm has net_r_holdout <= 0
    at n >= 25 (not_replicated): no tested configuration has fold-consistent edge; a roster-retention case for alpaca_live sent to the manager, nothing changed here.
    INDETERMINATE IF every arm held < 39 discovery trades or n_holdout < 25 (a power shortfall, never evidence against the leg). The 0 R bar, the 5-of-8 fold majority, the
    39 and 25 floors, the arm list and the holdout fraction are not changed after any result. Windows are never pooled with the c56e-17 record; it keeps its own grade.'
  what_it_does_not_do: Does not edit config/strategies.yaml or any roster and does not change slv_pullback_1d's live parameters. A PASS naming a non-declared arm is a Tier-3
    proposal input for the manager, not a change. Not a promotion case, and does not by itself alter the 2026-10-21 decision to keep the leg live.
