question: 'RQ-20261022-4b82-03 read PASS on arm WIDE (--bb-std=2.5 --kc-mult=1.0; pooled net_r 43.46, 1 of 4 arms) over 2020-06-01..2026-10-22 on ADA/XRP/LINK/AAVE/DOGE/BNB 1h. That is a discovery on one
  window, chosen from 3 candidate arms (BE1, ST12, WIDE) on a pooled cell set (denominator: 3 arms x 6 cells = 18 cell-arm reads; the family also failed 5 earlier default-parameter tests). Every calendar
  window is already seen, so the only disjoint axis left is the symbol set. Does WIDE, with parameters fixed to the 4b82-03 values, pass the SAME pooled Stage-0 rule and beat B by >= 0.05 R/trade pooled
  on 6 cells it never saw (AVAXUSDT,NEARUSDT,ATOMUSDT,FILUSDT,TRXUSDT,ETCUSDT) at 1h?'
why_this_matters: 'research-ops 2026-10-24 14:47Z follow-up under the SKILL rule ''a PASS on one window is a discovery, not a confirmation'' and 4b82-03''s own rule (ONE confirmation unit, same statistic
  and bar). Not a promotion case: a PASS here still only feeds the prop/real-money SUPERSET ladder; a forward-accrual confirmation is a separate later step because history has no unseen window.'
power:
