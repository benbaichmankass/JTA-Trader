decision_rule:
  id: RULE-RQ20261024-71E8-01-SQUEEZE-1H-WIDE-CONFIRM
  registered_at: '2026-10-24'
  registered_before_run: true
  statistic: 'scripts/research/harness_stage0.py --family squeeze --timeframe 1h, arms fixed now: B=; BE1=--be-floor-r=1.0; ST12=--stale-exit-bars=12;--stale-exit-below-r=0.3; WIDE=--bb-std=2.5;--kc-mult=1.0;
    baseline B; per cell and pooled across 6 cells; flags --folds 6 --fold-majority 4 --n-floor 39 --pooled-n-floor 88 --breadth-frac 0.5 --baseline B --delta-r-per-trade 0.05; cost = the harness venue-aware
    fee + slippage + funding stack (execution_costs.resolve_cost_policy), recorded per cell.'
  rule: 'Arms and thresholds are fixed now and are not changed after any result; WIDE parameters are exactly those of RQ-20261022-4b82-03 (no re-tuning). PASS IF WIDE passes the pooled Stage-0 rule (pooled
    n >= 88, pooled net_r > 0, >= 4 of 6 calendar folds net positive, >= half of the powered cells pass) AND beats B''s pooled net R/trade by >= 0.05 R: the WIDE lead replicates off-symbol; follow-up is
    a Tier-3 NOTE for the manager on the owning row (never a roster edit) and one forward-accrual unit. FAIL IF WIDE fails with n >= floor: the 4b82-03 PASS is read as a within-basket lead that did not
    generalise; record which fold/cell broke it and aim the next variant (this does not kill the squeeze family; retire only via family_retirement_policy.yaml). INDETERMINATE IF pooled n < 88 or fewer than
    half the cells measured (a fetch/harness fault is recorded per cell, never dropped).'
  what_it_does_not_do: Edits no config and no roster, places no order, is not a promotion case. A best-of-k arm is a LEAD (programme 03 rung S0-C), never a finding. Candles are Binance USD-M (a PROXY for
    Bybit linear); the funding term is a directionless magnitude (execution_costs P1); both are stated in the record. Does not pool with any committed record.
