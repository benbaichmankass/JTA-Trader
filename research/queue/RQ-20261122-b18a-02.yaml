    - --reference-corpus
    - comms/research/RQ-20261118-04a5-06/44417153590/corpus
    - --parity-basis
    - trade
    - --holdout-artifact
    - ml/overlay/overlay_td.json
    - --holdout-challenger
    - mlgbm
    - --holdout-start
    - '2019-12-01'
    - --holdout-end
