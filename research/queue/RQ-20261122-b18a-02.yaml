  decision: replace the live Beagle-1 artifact (overlay_td.json) with a challenger only if it beats it; never a demotion
  legs:
  - trend_donchian_eth_4h
  - trend_donchian_xrp_4h
  - trend_donchian_eth_prop
  - trend_donchian_sol_prop
  book: money
programme: P2
iteration:
  subject: ml-overlay-td-v1
  subject_kind: ml_model
  from_result: RQ-20261119-e8a1-03
  verdict_read: pass
  diagnosis: e8a1-03 PASSED its dev screen (mlgbm arm own V1 gate a-e, paired mean +0.0013, disagreement 0.230) on the SAME 2020-07..2026-10 window Beagle-1 was selected
    on, and its own text says any swap rests on a forward read. cc86-01 already built the blind-holdout harness (V2, window 2019-12..2020-06 perp, baseline sha-pinned
    artifact ml/overlay/overlay_td.json) but only for the EV-threshold challenger, which FAILED/INDETERMINATE. The learner arm has never been scored on data it did
    not see. Only the holdout-challenger plumbing for mlgbm is new (ml_overlay_noninferior.py::mlgbm_holdout_scores, self-tested).
  search: one challenger (mlgbm), the cc86-01 holdout A window and baseline artifact unchanged; hyper-parameters (MLGBM_PARAMS), monotone signs and tau quantile are
    the e8a1-03 ones, fixed before any run
  attempt: 2
  due_by: '2026-12-01'
  map_entries:
  - research/levers/ml-overlay-td-v1.yaml
