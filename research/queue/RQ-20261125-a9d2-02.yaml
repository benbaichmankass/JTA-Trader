  - 'GRADING: RULE-AM-RISK-ADJUSTED-V1 with V1 parameters unchanged (am_risk_adjusted.grade_risk_adjusted via am_policy_arm._segment) on DEV (entry < 2026-01-01) and on the claimed HOLDOUT
