  bound > 0, in >= 3 of 4 folds, with pooled maxDD <= 1.35x baseline?
why_this_matters: 'The 5 weekly one-factor sweeps of this family each graded fail/indeterminate on one leg''s n (23-70 trades), below the n a single leg needs to resolve a 0.02-0.05
  R/trade effect (pool_arm_diff.py header). Pooling the legs that carry the SAME lever is the design that can resolve it. Tested values: donchian 22 / 38 against the declared 30. PASS
  gives a family-level Tier-3 declare PROPOSAL input (population redefinition needs its own pooled test, stated here); FAIL closes THIS lever value for THIS pool and leaves the family
  and the other lever side open. Reads only committed arm emits: nothing is refetched, so it costs seconds, and it uses no new data (the same trades the five sweeps already produced;
  stated, not hidden: this is a pooled re-read, not an independent sample).'
