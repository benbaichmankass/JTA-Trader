id: RQ-20261101-5e01-03
title: 'Structure-based SL+TP (causal swing / FVG, ratcheting) vs the declared exit on xrp_pullback_2h (bybit_2 + bybit_portfolio): does it beat the current
  exit net of the full cost stack, held-out?'
status: done
cadence: once
theme: live_strategy
priority: 1
roadmap:
- L-AM-STANDARD
kind: experiment
practice_precedent: 'T1, T2, T3, T4, T8 (docs/reference/trading-and-model-practice-principles.md): intervention judged against hold AND a matched random
  intervention, per leg, entries fixed, net of cost.'
intervention_controls:
  not_applicable: Static grid of structure parameters judged by the harness replace verdict; the random-exit control is deferred to the confirmation run
    (see rule).
question: 'Replace xrp_pullback_2h''s declared SL/TP mechanism (backtest_pullback 2h; ATR stop 2.5 + trail 6.0, TP 3R) with a dynamic structure-based SL
  and TP and compare it with the declared exit on the same entries.  Operator 2026-11-01: dynamic structure-based exits are the default until a leg''s own
  net-of-cost evidence proves another exit better; this unit is that evidence for this leg.'
why_this_matters: 'Operator 2026-11-01 ~23:00Z (verbatim in ARCHITECTURE-CANONICAL § Active management, ''The default exit''): structure-based SL and TP
  are the default for all strategies and ML. Row STRUCTURE-EXITS-DEFAULT. Real-money first; a PASS is a discovery, never a config change.'
power:
  expected_n: 400
  min_detectable_effect: 0.1
  effect_units: R
  sd: 1.2
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATE (sd 1.2 R is the assumed per-trade sd also used by the 5e02 sibling units; the test is one-sample on the per-trade difference between
    arms (same entries), whose sd is expected to be smaller than the per-trade sd, so 1.2 is conservative; sd of the per-trade difference; the first run
    replaces it): ESTIMATE: leg-level Stage-0 trade counts of 2020-07..2026-10 runs are 400-700 for 2h/4h crypto legs and thinner for 1d legs; n >= 39 floor
    below which the leg grades INDETERMINATE, never FAIL. The first run replaces it.'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues. The detector and harness arms are the blockers,
      not the data.
decision_rule:
  id: RULE-STRUCTURE-EXITS-V1
  unit_rule_id: RULE-RQ20261101-5E01-03-STRUCT-EXIT
  registered_at: '2026-11-02'
  registered_before_run: true
  statistic: 'exit_lever_ablation.py --grade replace over 2020-07-01 (2021-07-01 for the dukascopy ETF legs)..2026-10-15, 6 equal calendar folds by entry
    time, net of the full cost stack the harness resolves per venue (cost_stack recorded per arm), baseline A; arms A, S3, S5, S8, S5NB; parameters unchanged
    from RQ-20261026-ed1c-17: delta-r 0, delta-r-per-trade 0.02, fold-majority 4 of 6, dd-tol-frac 0.35, n-floor 39.'
  rule: 'Registered before any run (amends the blocked-form text; no result existed). One factor: the source of the SL and TP levels (src/runtime/structure_levels.py,
    causal: a swing is usable only after its confirming bar closes). Arms: A = leg as declared; S3 / S5 / S8 = structure SL+TP at pivot half-width 3 / 5
    / 8 (SL beyond the last confirmed swing minus 0.25 ATR, distance clamped to [0.5, 3.0] x the declared ATR stop, ratcheting toward price only; TP = nearest
    opposing swing / unfilled FVG edge >= 1.0 R, extend-only); S5NB = S5 with NO ATR buffer (the buffer arm). Entries, sizing, cost stack unchanged. Verdict:
    exit_lever_ablation --grade replace, over 2020-07-01 (2021-07-01 for dukascopy ETF legs)..2026-10-15, 6 equal calendar folds by entry time, net of the
    full cost stack, parameters delta-r 0, delta-r-per-trade 0.02, fold-majority 4 of 6, dd-tol-frac 0.35, n-floor 39 (the ed1c-17 parameters). Candidates
    S3, S5, S8, S5NB (multiplicity 4): a candidate PASSES when the replace verdict passes; the best passing one is named. FAIL if none passes with every
    floor met. INDETERMINATE if n < 39 or no arm differs from A. NOT in this run: the 100 matched random-exit controls (R4) and leave-one-fold-out pivot
    selection (they need the control harness); a PASS here is therefore a DISCOVERY on the static-grid screen and needs a confirmation run on post-window
    data WITH the random-exit control before any per-leg Tier-3 apply PR. Thresholds, arms, window are not changed after any result. Per-trade-R is a screen
    until BOOK-SIM-REAL-SIZER exists (canonical Active management clause 4).'
  what_it_does_not_do: Edits no config, roster, mandate or live-review policy and places no order. A PASS is not a promotion. Harness fills a stop at the
    stop price (no gap), equally in S, A and the R controls.
