id: RQ-20261029-84ef-04
title: 'Weekly crypto trend, pooled over seventeen perps: is the weekly Donchian arm (10 and 20) gradeable once n is raised, and does it pass?'
status: done
cadence: once
roadmap:
- L-TIMEFRAMES
- L-REGIME
