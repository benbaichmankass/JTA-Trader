programme: P2
kind: experiment
question: 'Run ml_overlay_noninferior.py for the TD family (the aadc-03 family spec and window) WITHOUT --reference-corpus, graded by the
  fidelity rule (--repin-fidelity): does every gate leg build, with every trade aligned to a decision bar and n_gate >= 200? The built
  corpus (each leg''s __trades.jsonl, <= 1 MB, landed by the collector under comms/research/RQ-20261118-04a5-06/<run>/corpus/) becomes
  the new reference.'
why_this_matters: 'Every TD overlay read since 10-24 is INDETERMINATE on trade parity (cc86-01, aadc-03: eth_4h 0.8473, xrp_4h 0.0882,
  eth_prop 0.5779, sol_prop 0.4194, all < 0.98), so no D4 challenger (target, feature family, monotone GBM) can be graded. The cause is
  named and is deliberate: the four gate legs changed config after the reference was built. Re-pinning at current config unblocks D4.'
