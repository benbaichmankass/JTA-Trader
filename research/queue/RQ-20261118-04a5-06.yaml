    n_gate >= N_GATE_MIN 200). Reported beside it, never gating: trade parity of the new corpus vs the 09a6-01 reference per gate leg
    (expected low: that is the disclosed drift) and the V1 primary eval of Beagle-1''s recipe on the re-pinned population.'
  net_of_cost: true
decision_rule:
  id: RULE-RQ20261118-04a5-06-TD-REPIN-FIDELITY
  registered_at: '2026-11-18'
  registered_before_run: true
  baseline: the V1 harness fidelity floor
  statistic: 'scripts/research/ml_overlay_noninferior.py --repin-fidelity RULE-RQ20261118-04a5-06-TD-REPIN-FIDELITY (function
    repin_fidelity_verdict): with no --reference-corpus, run_family''s reasons are exactly the fidelity failures; per family, fidelity
    pass iff it has none. --report-parity-against the 09a6-01 corpus adds per-gate-leg trade parity (report-only).'
  rule: 'PASS iff the TD family has no fidelity reason: every gate leg (eth_4h, xrp_4h, eth_prop, sol_prop) builds, every trade is aligned
    to a decision bar, and n_gate >= 200. FAIL otherwise (the harness cannot produce a clean reference; the failing reason names the
    leg). The edge verdict of Beagle-1''s recipe and the old-reference parity are reported and never gate. Window, legs, harness and
    floors are not changed after any result.'
  pass_action: 'Follow-up edits (separate PR, not this one): RQ-20261117-aadc-03 and RQ-20261116-cc86-01 re-runs pass --reference-corpus
    comms/research/RQ-20261118-04a5-06/<run_id>/corpus (the landed __trades.jsonl files; parity basis trade reads only those). Disclose
    on every such read that Beagle-1 was fit and validated on the PRE-change (10-24) population, so a re-pinned read measures the
    challengers on the trades the legs now make, not the trades Beagle-1 was selected on. Close PI-20261117-ZZUFKM1F-0002 part (1).'
  fail_action: 'File the failing leg''s reason (unbuilt leg or unaligned trades) as a harness defect on PI-20261117-ZZUFKM1F-0002 and
    fix it before any TD overlay read; D4 stays blocked.'
  what_it_does_not_do: 'Edits no config, no overlay artifact and no other unit (aadc-03 / cc86-01 are not edited here); trains, serves or
    swaps nothing; places no order; adds no gate. Not an edge read: the reported Beagle-1 eval is on the dev window Beagle-1 was fit on.'
  min_n: 200 gate trades (the V1 harness floor)
practice_precedent: 'M2 train/serve parity and reproducibility (docs/reference/trading-and-model-practice-principles.md): pin the reference
