  subject_kind: ml_model
  from_result: RQ-20261117-aadc-03
  verdict_read: indeterminate
  diagnosis: 'aadc-03 (and cc86-01) were INDETERMINATE on trade parity vs the 09a6-01 reference corpus built from config at b574c9770
    (2026-10-24). MEASURED 2026-11-18 by diffing config/strategies.yaml b574c9770 -> main on the four gate legs: trend_donchian_eth_4h
    tp_r 50 -> 4 + tp_intent r_multiple + decision_bar closed; trend_donchian_xrp_4h atr_stop_mult 2 -> 1.5, trail_mult 5 -> 4;
    trend_donchian_eth_prop min_confidence 0.6 -> 0.8; trend_donchian_sol_prop trail_mult 3.5 -> 4.5. Harness fidelity fixes landed in
    the same window (backtest_trend gap-fill #21628, 10-30; trail ratchet #21898, 10-31). So the drift is strategy config + harness
    fidelity, not data or fetch; the parity drop sizes track the size of each leg''s change. The remedy is a re-pinned reference at
    current config, with the drift disclosed.'
  search: 'none: one build of the family at current config, same window and harness as aadc-03; no model arm is chosen'
  attempt: 2
  due_by: '2026-11-22'
  map_entries:
