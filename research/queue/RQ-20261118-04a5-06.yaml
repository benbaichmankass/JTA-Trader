title: 'D4 TD reference-corpus RE-PIN: at current config, does the TD family Stage-0 corpus (2020-07-01..2026-10-15) build cleanly on
  every real-money gate leg (all trades aligned to a decision bar, n_gate >= 200), so it can replace the 10-24 reference every TD
  overlay read is INDETERMINATE against?'
