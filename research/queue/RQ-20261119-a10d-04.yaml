  level?'
why_this_matters: 'ml_entry_eq_struct trades real money on alpaca_live, and the operator''s demotion question (manager 17:37Z email, 2026-11-19)
  hangs on four reads that disagree: 98e3-06 confirm +0.492 R n 207 (reproduced exactly by e8a1-04), dev OOF refits 98e3-06 +0.132 n 1,691, c21d-06
  +0.0845 n 1,628 and 207f-01 -0.0015 n 1,016, and 207f-01''s live-book arm -0.058 R n 97. Every dev read is a REFIT on a pool that the live POOL_RULE
  rebuilt at run time (pool 173 -> 172 between runs, revised bars), and the only book read (207f-01) was a dev refit at synthetic cash. None measured
  the SERVED model through the ACCOUNT on the held-out window. This read does, with both moving parts removed.'
