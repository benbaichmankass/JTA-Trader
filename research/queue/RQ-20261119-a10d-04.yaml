decision_rule:
  id: RULE-RQ20261119-a10d-04-EQSTRUCT-FROZEN-BOOK
  registered_at: '2026-11-19'
  registered_before_run: true
  baseline: 0 R per taken trade, deflated for the read count
  statistic: 'scripts/research/alpaca_live_book.py frozen-book: claim the holdout read (family ENTRY-EQ; N = prior reads + 1, 5 at registration)
    BEFORE any bar is read; score the frozen boosters on the pinned pool (ml_entry_equity._pinned_pool_and_bars + build_table with the artifact''s
    structure_exit + _artifact_scorer); check the population reproduces 98e3-06 (n 207, |mean - 0.4922070639835765| <= 1e-6); attach entry / stop
    / entry and exit times (attach_prices); walk the taken trades through replay() at cash 250 / 1,000 / 5,000 with the live sizer constants (src/units/accounts/risk.py,
    accounts.yaml alpaca_live risk_pct). Per arm: n_taken, taken mean net R, iid se, monthly return %, refusals by reason. Reported only: the
    same cash levels without T+1, and an unconstrained multi-slot arm.'
  rule: 'Per cash arm: INDETERMINATE if n_taken < 30; PASS if taken mean net R > 0 AND mean >= point_t_min(N) x se; FAIL if mean + ci_z(N) x se
    < 0; INDETERMINATE otherwise (N and its bar from holdout_lock.claim_read; N = 5 gives t_min 1.1926, ci_z 2.5723). UNIT: INDETERMINATE unless
    the frozen population reproduces 98e3-06 exactly; PASS iff every cash arm PASSES; FAIL iff every cash arm FAILS; INDETERMINATE otherwise.
    Thresholds and the grid are fixed now.'
  meaning_for_the_leg:
    pass: 'The served model''s held-out edge survives the account at every plausible balance: the data do NOT support demoting ml_entry_eq_struct;
      the 207f-01 book read is superseded (a dev refit). Recommend keep; the operator decides.'
    fail: 'The account''s constraints turn the edge negative at every balance on the grid: the data support demoting the leg to the demo floor
      (alpaca_paper) while the book is iterated. Demotion is the operator''s decision; this read is the evidence put to them.'
    indeterminate: Either thin, not separable from zero at the deflated bar, or cash-dependent (the per-arm table says which). No data-backed
      case to demote or to clear; the operator decides on the per-arm table against the account's own balance (never committed). If the cause
      is the population not reproducing, the read is void and re-runs once the bar revision is named.
  pass_action: 'Report to the manager for the operator''s demotion question: keep, with the per-arm table. Record the result on PI-20261119-K7ZSW5Z7-0003
    and close it; the evidence record''s known_gaps line on cash-book sizing is updated in a separate PR.'
  fail_action: 'Report to the manager for the operator: the data support demotion to the demo floor; nothing is changed by this lane (demotions
    wait for the operator). File the book-side iteration (sizing / slot policy) as a P8 unit.'
  what_it_does_not_do: Places no order; changes no roster, mode, execution, sizing or config; demotes nothing; refits nothing. The live balance
