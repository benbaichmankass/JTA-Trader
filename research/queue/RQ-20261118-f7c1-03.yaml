title: 'P8-Q5 Foxhound-4 FEATURE FAMILIES: does adding volatility-regime context or ETF-family-relative strength to config B beat the live recipe on
  the alpaca_live cash book, above a 9-pure-noise-column control, on the ETF-pool dev walk-forward?'
status: queued
cadence: once
theme: ml_health
priority: 2
roadmap:
- L-ML-LIVE
programme: P8
kind: experiment
iteration:
  subject: ml-entry-eq-struct
  subject_kind: ml_model
  from_result: RQ-20261117-c21d-06
  verdict_read: pending
  diagnosis: 'Config A vs B read flat (98e3-14, indeterminate). 207f-03 found the net-R model ranks COST PER R, not direction (IC pred vs cost_long
    -0.527); c21d-06 tests the label. The features family is untested on the lever map: volatility-regime context and ETF-family-relative strength
    are direction-bearing inputs config B lacks.'
  search: 'lever family features: config B + {volregime}, + {familyrs}, + both; fixed here before any run. FOMC/CPI event flags NOT built (the repo
    has no point-in-time historical release calendar).'
  levers:
  - features
  map_entries:
  - research/levers/ml-entry-eq-struct.yaml
  attempt: 1
  due_by: '2026-12-02'
levers:
- name: feature_family
  values: [config_B, B+volregime, B+familyrs, B+all, B+noise9 (control)]
  hypothesised_effect: a family that carries direction raises the book's monthly return by >= +0.25 %/month; the noise arm does not
question: 'Foxhound-4 (ml_entry_eq_struct; config B features, structure exit pivot=5;sl_only, 5-seed pinned ensemble, tau 0.25) on the ETF-pool dev
  walk-forward. Add ONE feature family at a time to config B (ml_entry_equity.FAMILY_FEATURES): volregime = VIXY ret24 / vol24 + the pool''s median
  vol24 and its percentile among the prior 500 closes; familyrs = rank of ret24 / ret168 and ret24 minus the family median WITHIN the ETF''s family
  (family = the anchor SPY / TLT / GLD / VIXY with the highest trailing 336-bar 1h-return correlation, or inverse when the SPY correlation < -0.5;
  causal, data-defined). Re-fit, take at tau 0.25, replay through the alpaca_live cash book. Does any family beat config B and the noise control?'
why_this_matters: 'PASS -> the first features lever for the real-money equity model: a confirm-window read of the winning feature set (fresh unit), then
  a Tier-3 challenger proposal (the live model keeps trading until then). FAIL -> these two families close on this leg (the features family stays open
  for event flags once a point-in-time calendar exists), recorded on the lever map.'
power:
  expected_n: 1600
  min_detectable_effect: 0.25
  effect_units: pct_per_month
  sd: 2.15
  sd_basis: 'MEASURED: RQ-20261111-207f-01 run 44387485084 live-book monthly return SE 0.392 %/month over 30 dev months -> sd ~0.392 x sqrt(30) = 2.15 %/month (single-arm sd, used for the paired difference as a conservative stand-in; added 2026-11-19 by ML-PRIMARY-9 when unblocking, rule unchanged)'
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'Unit = dev OOF trade (tau-0.25 baseline n 1691 in 98e3-06) replayed through the one-slot cash book; graded on paired monthly book return
    (~30 dev months), as 207f-02. 3 draws (2 families + all) deflate the bar: holdout_lock.bar_for(3). ESTIMATE: no power computation for the
    monthly paired difference is derived here; a thin book (n_taken < 30) reads INDETERMINATE.'
  feasibility:
    source: none
    accrual_basis: Replays Alpaca 1h RTH history to TRAIN_END; nothing accrues.
evidence_class:
  holdout: walk_forward
  claim: edge
ml_consumer:
