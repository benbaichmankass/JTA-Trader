  inputs:
    research_unit: RQ-20261118-f7c1-03
decision_rule:
  id: RULE-RQ20261118-f7c1-03-FEATURE-FAMILIES
  registered_at: '2026-11-18'
  registered_before_run: true
  statistic: 'alpaca_live_book.py foxhound --section features: dev walk-forward OOF (ml_entry_equity DEV_FOLDS to TRAIN_END, 5-seed pinned ensemble,
    structure exit pivot=5;sl_only) restricted-LONG decisions on the ETF pool. Baseline = config B at tau 0.25. Arms = B+volregime, B+familyrs, B+all
    (draws) and B+noise9 (control, not a draw), each re-fit with the same recipe and taken at tau 0.25. Every arm''s trades replayed through the
    alpaca_live cash book (replay: one slot, T+1, whole shares, live sizer constants, net of the measured Alpaca cost stack the harness resolves:
    fee + slippage from src/runtime/execution_costs + 0.5 bps regulatory). Per arm vs baseline: paired monthly book return % (mean diff, t), n_taken,
    dev folds with mean net R > 0. LOFO: with two families, all-minus-one equals the single-family arms (reported, no extra draw).'
  rule: 'INDETERMINATE IF the B+noise9 arm itself clears the bar below (the recipe gains from noise), OR the baseline book n_taken < 30 and no arm clears.
    PASS IF a draw arm has book n_taken >= 30 AND paired monthly mean diff >= +0.25 %/month AND t >= holdout_lock.bar_for(3).point_t_min AND mean net R
    > 0 in >= 3 of 5 dev folds AND its monthly mean diff exceeds the noise arm''s. FAIL otherwise. Thresholds fixed now, never changed after any result.'
  proposal_mapping: pass -> a confirm-window read of the winning feature set (fresh unit), then a Tier-3 challenger proposal for ml_entry_eq_struct; fail
    -> volregime and familyrs close on this leg (the features family stays open for event flags); indeterminate -> reported with the reason.
  what_it_does_not_do: Reads no confirm-window row (bars end at TRAIN_END), serves nothing, places no order, changes no config. Not a promotion case.
  min_n: 30 book trades per arm
