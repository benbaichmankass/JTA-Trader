id: RQ-20261022-eba2-03
title: 'Operator idea ''once a trade passes a certain R the stop turns into a tight trail'': does an R-ARMED tight trail (peak
  >= 1.5 / 2.0 / 3.0 R -> 2.5 x ATR, half the declared 5.0) replace the declared exit of ada_pullback_2h on net R in 5 of
  6 calendar folds over 2020-07..2026-10, at the venue cost stack?'
status: done
cadence: once
roadmap:
- L-ATM
- M20
theme: live_strategy
priority: 1
kind: experiment
question: 'Operator idea (IDEAS.md 2026-10-21): once a trade passes a certain amount of R, the stop becomes a tight trailing
  stop. src/research/trail_levers.py / --trail-decay-arm-r is that lever, and ada_pullback_2h (bybit_2 real money + bybit_portfolio
  mirror) declares NO trail_decay (A runs trail 5.0, tp_r 4). Over 2020-07-01 .. 2026-10-15 23:59 (replace grade, 6 calendar
  folds by entry time), does any of three arms -- T15 (arm at peak 1.5 R), T20 (2.0 R), T30 (3.0 R), each tightening the trail
  to 2.5 x ATR once armed -- beat the declared exit (A) by >= 0.02 R/trade in >= 5 of 6 folds within the Path B drawdown bar?'
why_this_matters: 'The live ADA trade that prompted the operator idea round-tripped a large open profit. Fixed banking (-43..-68
  R) and a 1R giveback stop (RQ-20261019-004) failed on this leg; the R-ARMED tight trail is the one operator-named lever
  never registered on it (the stall-armed variant and the bank are not the same shape: it keeps 100% of the position and the
  TP). A real-money leg, so it ranks first.'
power:
  expected_n: 402
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'Floor (1.96 + 0.8416)^2 / 0.45^2 = 38.76 -> 39 incumbent trades; the incumbent read n 402 over this window in RQ-20261022-fd06-01
    (MEASURED). Trade sequences autocorrelate: the fold majority carries the rest.'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-P1-Q12-ADAPB-R-ARMED-TRAIL
  registered_at: '2026-10-22'
  registered_before_run: true
  statistic: 'From scripts/research/exit_lever_ablation.py --grade replace on ada_pullback_2h, window 2020-07-01 .. 2026-10-15
    23:59 (6 equal calendar folds; a trade is binned by entry time), net of the full cost stack the harness resolves per venue
    (execution_costs.resolve_cost_policy, recorded per arm as cost_stack). Per arm: n, net_total_r, max_drawdown_r, net R
    per fold. A = the leg as declared in config/strategies.yaml. Per candidate C: delta = net_r(C) - net_r(A); folds_ge =
    folds with net_r(C) >= net_r(A); maxDD(C) vs maxDD(A).'
  rule: 'INDETERMINATE IF n(A) < 39, or IF every C arm is byte-identical to A (the lever never fired). A candidate C PASSES
    iff net_r(C) > net_r(A) AND delta >= 0.02 R x n(A) AND folds_ge >= 5 of 6 AND maxDD(C) <= maxDD(A) x 1.35. PASS IF one
    or more pass: the best by net R is named, and the follow-up is ONE confirmation unit on a disjoint partition with the
    same statistic and bar (a PASS on one window is a discovery), never a config edit. FAIL IF none passes: the declared exit
    stands for the R-armed tight-trail family on THIS leg at these three arms (a family is not retired on one config; xrp_pullback_2h
    read FAIL for arm < 3 R in RQ-20261007-021). Thresholds are not changed after any result.'
  what_it_does_not_do: 'Edits no config and places no order. A PASS needs a Tier-3 declare of trail_decay_arm_r / trail_decay_tight_mult
    on ada_pullback_2h (src/runtime/trail_decay.py is the live producer; bybit_2 + bybit_portfolio in one PR). Tight mult
    fixed at half the declared trail by rule, not chosen per arm; three arms is a multiple comparison that the fold majority
    and the materiality bar guard. PRIOR INFORMATION, disclosed: on 2026-10-22 the fixed 50% bank (RQ-20261022-fd06-01/-02/-03),
    level-triggered tightening (RQ-20261022-001..006) and a 1R giveback stop (RQ-20261019-004/-018) all FAILED against the
    declared exit on the Bybit money legs, by margins of -3 to -68 R over n 68-402; the declared wide trail earns its R in
    the right tail. No look at an R-armed arm on this leg was taken before registration.'
