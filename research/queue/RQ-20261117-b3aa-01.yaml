question: 'turtle_soup: does atr_stop_mult 0.5 (selected in RQ-20261116-d5a7-09 on BTCUSDT 15m 2021-11-12..2026-11-15) still beat the config-exact control A (0.3) net of the full cost stack on the disjoint
  pre-development window 2020-01-01..2021-11-11 that no selection step saw?'
why_this_matters: 'ITERATION (research-ops 2026-11-17 1006Z). RQ-20261116-d5a7-09 PASS (a discovery, arm denominator 3 incl. control): atr_stop_mult 0.5 +62.34 R vs A over 708 control trades, maxDD -56.7
  R, 3/4 folds; sibling 0.2 +115.4 R but only 2/4 folds AND its trade count collapses to 2 and 0 in folds 3-4 (the tighter stop starves entries, a degenerate arm, not a lead). ATTRIBUTION read from the
  rows: the control loses -175.1 R net (-0.25 R/trade) and -118.2 R fee-only, so the leg has NO gross edge on this window; sl 342 vs tp 365 outcomes. The 0.5 arm is still -112.8 R net: a PASS here reduces
  demo-floor losses, it does not make the leg pass Stage 0. On PASS: a Tier-3 proposal NOTE for the manager (stop 0.3 -> 0.5 on a demo-floor leg; own-losses bucket); the entry family (b3aa-02) stays the
  route to an absolute edge. On FAIL: the stop response is window-specific in research/levers/turtle_soup.yaml and only the entry family is pursued. The two branches change different decisions (declare
  the stop or not).'
