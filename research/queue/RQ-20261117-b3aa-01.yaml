    control loses; the absolute Stage-0 regime-robustness clause is not applicable to the arm''s sign and is reported only. A PASS is a LEAD for a Tier-3 proposal NOTE, never a config edit. Thresholds not
    changed after any result. M13: this window was not read for this lever before (first read).'
