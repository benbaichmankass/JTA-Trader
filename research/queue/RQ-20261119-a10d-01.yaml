decision_rule:
  id: RULE-RQ-20261119-a10d-01-FC-STRIDE1-PARITY
  registered_at: '2026-11-19'
  registered_before_run: true
  baseline: 04a5-03 on the stride-4 replay (BTC 0.955 / kappa 0.76; SOL 0.872 / kappa 0.70)
  statistic: 'scripts/research/fc_stride1_rebuild.py: per symbol, (1) build_forecasts --stride 1 over the trainer market_raw v002 into
    the private root; (2) market_features with the nightly 15m params plus forecast_path into the private root; (3) python -m ml train
    of the unchanged head manifest into a PRIVATE registry (candidate); (4) vol_serve_path_diff.diff_head with the SERVED head
    (production registry) on the rebuilt rows vs the committed live snapshot: agreement, kappa, per-block flips reproduced; (5) the
    same diff with the private candidate (reported only); (6) share of consecutive rows whose fc_ret_med repeats since 2026-11-09,
    production v002 vs rebuilt. Each step timed.'
  rule: 'Per head on step 4: INDETERMINATE if any of steps 1-4 failed for the head or matched bars < 200; PASS if agreement >= 0.98
    AND kappa >= 0.8; FAIL otherwise. Unit verdict = the worst head in the order FAIL > INDETERMINATE > PASS. Thresholds are the
    clears_when of PI-20261119-K7ZSW5Z7-0002 and are not changed after any result.'
  pass_action: 'The stride-4 replay was the defect. git mv research/queue/blocked/RQ-20261119-a10d-02 to research/queue/ (the aadc-01
    re-run on the rebuilt dataset, aadc-01''s rule unchanged). Record the measured per-step trainer cost on PI-20261119-K7ZSW5Z7-0002.
    The private candidates stay unserved; changing the nightly builder to stride 1 (which retrains the served heads on fresh fc_*
    every night) is proposed to the manager as a data-backed change only after a10d-02 passes, with these candidates'' eval metrics
    beside the served heads''.'
  fail_action: 'Stride alone does not restore parity. Read the remaining flips by block: if forecast_fc still reproduces >= 80% of
    them, the live forecast differs from a stride-1 offline forecast for another reason (context window end, the bar the live
    publisher anchors on, model id); next iteration diffs the fc_* values bar-for-bar against the live publisher''s inputs. Otherwise
    the next block named is the fix target.'
  what_it_does_not_do: 'Serves, stages or promotes nothing: the candidates are written to a private registry under
    runtime_logs/research/fc_stride1/ that neither the live trader nor the nightly cycle reads. Does not change the nightly builder,
    the production v002 datasets, forecast_features DEFAULT_STRIDE, any regime cell, threshold or REGIME_ML_VERDICT_MODE; places no
    order; adds no gate. Verifies features, not edge.'
  min_n: 200 matched bars per head
