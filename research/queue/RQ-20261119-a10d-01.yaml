question: 'Per head (BTC, SOL fc-pcv-v2), over the live per-bar rows of the committed snapshot (2026-11-09..18) matched bar-for-bar to a
  STRIDE-1 rebuild of market_features v002: does the SERVED head label the rebuilt row and the live row alike (agreement >= 0.98 AND
  kappa >= 0.8)? Reported alongside: the trainer cost of the rebuild per step, the private candidate heads retrained on the rebuild,
  and the stale-row share before and after.'
why_this_matters: 'No live D2 change ships until the replayed labels are the live labels (operator D6), and 04a5-03 named the replay
