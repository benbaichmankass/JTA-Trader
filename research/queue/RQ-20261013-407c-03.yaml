id: RQ-20261013-407c-03
title: >-
  Entry depth, eth_pullback_2h: does a deeper or shallower pullback_frac (0.382, 0.618, 0.75 vs the declared value) beat the
  declared entry net of the full cost stack? (M21 depth_threshold column = pending)
status: done
cadence: once
theme: live_strategy
priority: 2
kind: experiment
question: >-
  The M21 entry-refinement coverage matrix (docs/research/entry-refinement-coverage.json) carries depth_threshold = PENDING
  for the whole 2h pullback family: the pullback_frac band was never swept config-exact for eth_pullback_2h. The one prior
  look (docs/research/xrp-pullback-entry-axis-2026-08-24.md) found pullback_frac higher is better in sample on xrp_pullback_2h
  but not replicated across the family and flagged its gain as recent-tail. On the same pinned 730d window (ETHUSDT 2h, 2024-10-05
  .. 2026-10-04 23:59), same cost stack as the evidence builder, does any of pullback_frac [0.382, 0.618, 0.75] beat the declared
  entry by a material margin with no worse drawdown and in at least 3 of 4 calendar folds?
why_this_matters: >-
  eth_pullback_2h is on a live roster and its recent closes are net negative (perf-followup 2026-10-10: the 2h pullback family
  bleeds; bybit_2 xrp_pullback_2h -5.9R, ada_pullback_2h -5.6R over n=10-12 each). Entry depth is the one axis the matrix
  still lists as pending, so it is the cheapest untested lever on a losing leg.
power:
  expected_n: 116
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: >-
    d=0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo's standing E35 floor, RQ-20261006-002/-004/-060). expected_n
    = 116 is an ESTIMATE from the nearest committed record or the leg's trade cadence, not a measurement of this exact arm
    set. Below 39 baseline trades the unit grades indeterminate (underpowered), never FAIL. The 1.0 R bar is a MATERIALITY
    bar over the whole window, not a significance test; the 3-of-4 calendar-fold majority is what refuses a one-period artifact.
  feasibility:
    source: none
    accrual_basis: >-
      Re-measurement on freshly fetched keyless Binance Vision candles (eth_pullback_2h, pinned window 2024-10-05 .. 2026-10-04
      23:59); the harness replays history, nothing accrues. expected_n is an estimate, so power_state stays accruing and a
      thin baseline grades indeterminate.
decision_rule:
  id: RULE-20261013407C03-DEPTH
  registered_at: '2026-10-13'
  registered_before_run: true
  statistic: >-
    Per arm, from the harness's own --json summary of scripts/backtest_pullback.py (argv built by regime_debt_matrix.build_harness_cmd,
    the evidence builder's own, plus the arm's raw tokens; full cost stack: fee + resolved slippage + funding, never a zero
    default): total_trades, net_total_r, max_drawdown_r, plus net_r per fold over FOUR equal calendar spans of the window
    (same date boundaries every arm). Arms: B = leg as declared, F0382 = pullback_frac=0.382, F0618 = pullback_frac=0.618,
    F075 = pullback_frac=0.75. POSITIVE CONTROL, first: B must reproduce the committed record (total_trades within 2%, net_total_r
    within 0.5 R). Per candidate C in {F0382, F0618, F075}: dR = net_r(C) - net_r(B); dDD = maxDD(C) - maxDD(B); fold_wins
    = folds in which C out-earns B.
  rule: >-
    indeterminate IF the positive control fails or n(B) < 39 (underpowered: no verdict, extend the window or redesign; never
    FAIL on thin n). A candidate C PASSES iff dR >= 1.0 R AND dDD <= 0 AND fold_wins >= 3 of 4. PASS IF any candidate passes
    (best = highest dR; the script's generic label reads 'reachable_lever_beats_removed'): a Tier-3 PROPOSAL note on the owning
    checklist row for the manager, never a config edit; two passing candidates within 0.5 R of each other is a preference,
    not a finding. FAIL IF none passes (script label 'no_reachable_lever_beats_removed'): the declared pullback_frac stands;
    the axis is recorded honest_negative on this window. The 1.0 R bar, the drawdown clause, the 3-of-4 fold majority and
    the 39 floor are not changed after any result.
  what_it_does_not_do: >-
    Does not edit config/strategies.yaml; does not re-grade eth_pullback_2h's bracket (E35/M20 own those) or its ADX gate;
    a PASS is a Tier-3 proposal input for the manager, mirrored to bybit_portfolio/bybit_1 in the same PR if ever shipped
    (mirror trade-shaping equality). eth_pullback_2h left the Bybit rosters on 2026-10-05; this unit is a family-generalisation
    read (does depth help the family beyond xrp/ada), not a re-entry case.
