id: RQ-20261122-fa22-04
title: 'ml-btc-router-cells per-cell marginal grade: which authored BTC OFF-cells earn their keep against a matched-drop control (committed d7c2-01 trades, net of
  cost)?'
cadence: once
roadmap:
- L-ML-LIVE
theme: ml_health
priority: 2
kind: experiment
practice_precedent: 'M2, M4, M13 (docs/reference/trading-and-model-practice-principles.md): walk-forward against a rule registered before the run; one-factor sensitivity
  before combinations; every arm counted.'
question: On the committed per-trade tagged rows of RQ-20261120-d7c2-01 (trend_donchian, squeeze_breakout_4h, ict_scalp_5m on BTCUSDT, 1460 d, full cost stack), does
  EACH authored (trend, vol, direction) OFF-cell have added_r = -(sum net R of its vetoed trades) > 0 at n >= 25, beat a matched random drop of the same leg and direction
  (p <= 0.05) and hold in >= 2/3 of the folds where it vetoes? (8 cells; each graded alone.)
why_this_matters: 'd7c2-01 FAILED pooled (228 dropped, added_r +11.57, 4 of 6 folds, matched p 0.35) and its fail_action is a Tier-3 REMOVAL proposal for cells with
  added_r <= 0. A pooled grade cannot name which cells carry the result, so no cell can be kept or removed on it. The ML head (btc-regime-15m-lgbm-fc-pcv-v2) is the
  labeller, so this is also the first per-cell read of what the head''s labels are worth. DISCLOSURE: the driver was smoke-run once on these same committed rows while
  it was being built and its output was seen; the thresholds below were fixed in the script before that run and mirror d7c2-01 (n >= 25, p <= 0.05, 6 folds); no threshold
  is chosen after a result.'
power:
  expected_n: 25
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'MEASURED cell sizes come from the committed d7c2-01 rows (read at registration: most cells veto < 25 trades and will grade indeterminate_underpowered by
    design; trend_donchian chop/calm/long and transitional/calm/long have n >= 25). 8 cells are the multiple-testing denominator; replay of in-hand rows, nothing
    accrues.'
  feasibility:
    source: replay
    verdict: comms/research/RQ-20261120-d7c2-01/44756273079/verdict.json
    basis: Same committed rows as the pooled run; a re-grade of in-hand data.
decision_rule:
  id: RULE-RQ20261122-fa22-04-BTC-CELL-MARGINAL
  registered_at: '2026-11-22'
  registered_before_run: true
  baseline: No veto on the same trades (each cell alone), plus a matched random drop of the same leg and direction (5000 draws, seed 20261112).
  statistic: 'scripts/research/regime_cell_marginal_grade.py: per authored cell, n, added_r, control_p, fold wins of the folds where the cell vetoes, per-year table
    (not graded).'
  rule: 'Per cell: indeterminate_underpowered if n < 25; fail if n >= 25 AND added_r <= 0; pass if n >= 25 AND added_r > 0 AND control_p <= 0.05 AND >= 3 active folds
    AND wins >= ceil(2/3 of active); else indeterminate. Run verdict: pass iff all 8 cells pass; fail iff any cell fails; indeterminate otherwise. Thresholds fixed
    in the script and here, not changed after any result. Regime-robustness: the per-year table is attached, not graded (a cell that is not net-positive in >= 3 of
    4 calendar years is flagged).'
  pass_action: Record the cells that pass as kept on the lever map; no config change.
  fail_action: 'For each FAILED cell only: a data-backed Tier-3 REMOVAL proposal (held PR to the manager, regime-selectivity Rule 1; trend_donchian cells are approximate:
    the live exit head is omitted, so the operator weighs that). Underpowered cells are not touched.'
  what_it_does_not_do: Edits no config/regime_policy.yaml cell, flips no router switch, retrains nothing, places no order. A pass or fail here is a Stage-0 read of
    the cells, not a promotion.
