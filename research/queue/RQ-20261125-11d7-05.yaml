# Authored 2026-11-25 by lane QUEUE-FILL-STANDING-W49 (Tier 1) from the 40-unit overdue diagnosis (attempt 2, pooled). Rule registered BEFORE the run; the author read only trade COUNTS of the emits, no outcomes. Gates this adds or changes: none.
id: RQ-20261125-11d7-05
title: 'POOLED ATTEMPT-2 for the 1d ETF/futures pullback_1d family: does pullback_frac_hi (x1.25 of each leg''s declared pullback_frac (0.4635/0.7725 for the 0.618 legs, 0.375/0.625
  for mhg at 0.5)) beat the declared leg on the pooled paired read of 5 legs, where a single leg cannot resolve the effect?'
status: queued
cadence: once
roadmap:
- L-LADDER
theme: live_strategy
priority: 2
kind: experiment
question: Across gdx_pullback_1d, iaum_pullback_1d, mgc_pullback_1d, slv_pullback_1d, mhg_pullback_1d (pooled n(A) ~267 from the kept arm emits of RQ-20261105-023, RQ-20261105-027, RQ-20261106-002,
  RQ-20261106-009, RQ-20261106-005), is the paired per-entry net-R difference of pullback_frac_hi minus A >= 0.08 R per baseline trade with a month-block bootstrap CI lower bound > 0,
  in >= 3 of 4 folds, with pooled maxDD <= 1.35x baseline?
why_this_matters: 'The 5 weekly one-factor sweeps of this family each graded fail/indeterminate on one leg''s n (23-70 trades), below the n a single leg needs to resolve a 0.02-0.05
  R/trade effect (pool_arm_diff.py header). Pooling the legs that carry the SAME lever is the design that can resolve it. Tested values: x0.75 / x1.25 of each leg''s declared pullback_frac
  (0.4635/0.7725 for the 0.618 legs, 0.375/0.625 for mhg at 0.5). PASS gives a family-level Tier-3 declare PROPOSAL input (population redefinition needs its own pooled test, stated here);
  FAIL closes THIS lever value for THIS pool and leaves the family and the other lever side open. Reads only committed arm emits: nothing is refetched, so it costs seconds, and it uses
  no new data (the same trades the five sweeps already produced; stated, not hidden: this is a pooled re-read, not an independent sample).'
power:
  alpha: 0.05
  basis: 'MEASURED n(A) per leg from the kept emits (latest run): pooled 267. MDE = 2.487*paired_sd/sqrt(n) is computed by the harness; if it exceeds the 0.08 bar the unit grades INDETERMINATE
    (said, never graded as a fail).'
  design: one_sample
  effect_units: sd
  expected_n: 267
  feasibility:
    accrual_basis: Re-reads committed arm emits; nothing accrues.
    source: none
  min_detectable_effect: 0.3
  power: 0.8
decision_rule:
  id: RULERQ20261125-11d7-05
  registered_at: '2026-11-25'
  registered_before_run: true
  statistic: scripts/research/pool_arm_diff.py over --unit gdx_pullback_1d=RQ-20261105-023 --unit iaum_pullback_1d=RQ-20261105-027 --unit mgc_pullback_1d=RQ-20261106-002 --unit slv_pullback_1d=RQ-20261106-009
    --unit mhg_pullback_1d=RQ-20261106-005, baseline A, candidate pullback_frac_hi, --bar 0.08 --min-n 150 --folds 4 --fold-majority 3 --dd-mult 1.35 --seed 20261125.
  rule: 'Per the harness, thresholds fixed now: INDETERMINATE if any unit''s arm files are missing, pooled n(A) < 150, or the MDE exceeds 0.08. PASS iff pooled diff per baseline trade
    >= 0.08 R AND the bootstrap CI lower bound > 0 AND fold wins >= 3 of 4 AND pooled maxDD <= 1.35x baseline. FAIL otherwise at pooled n >= 150 and MDE <= 0.08: this lever value is
    closed for this pool; the family and the other value (lo) are NOT retired. The denominator for the family is 2 candidate values (Holm over the pair is reported). Thresholds are not
    changed after any result.'
  regime_robustness: Per-leg and per-year pooled diff table reported, not graded. Set before the run.
  what_it_does_not_do: 'Edits no config or roster and places no order. Not an independent sample (re-reads the five sweeps'' emits); not a promotion case, and per-symbol results never
    gate (operator 2026-11-04): a PASS is a population-level proposal input needing its own pooled test on fresh data.'
