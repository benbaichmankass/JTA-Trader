ml_bakeoff:
  task: classification
  metric: macro_f1
  dataset:
    kind: jsonl
    groups:
      BTCUSDT:
        path: datasets-out/market_features/BTCUSDT/1h/v002/data.jsonl
      ETHUSDT:
        path: datasets-out/market_features/ETHUSDT/1h/v002/data.jsonl
      SOLUSDT:
        path: datasets-out/market_features/SOLUSDT/1h/v002/data.jsonl
    ts_col: ts
    target: regime_label
    features:
    - rolling_log_return_vol
    - log_return
    - log_return_lag_1
    - log_return_lag_2
    - hour_of_day
    - dayofweek
    tail_rows: 40000
    holdout_after: '2026-07-12'
  cv:
    folds: 5
    embargo_rows: 24
    min_train_frac: 0.4
  baseline: lgbm_base
  controls:
  - prior
  - lgbm_har
  candidates:
  - lgbm_var
  learners:
    prior:
      kind: prior
    lgbm_base:
      kind: lightgbm
      params: &id001
        n_estimators: 200
        learning_rate: 0.05
        num_leaves: 31
        min_child_samples: 50
    lgbm_har:
      kind: lightgbm
      params: *id001
      feature_blocks:
      - kind: har_rv
        d: 1
        w: 5
        m: 22
        bars_per_unit: 24
    lgbm_var:
      kind: lightgbm
      params: *id001
      feature_blocks:
      - kind: var_price_vector
        own: <group>
        lags: 4
        window: 2000
        refit_every: 24
        peer_tail_rows: 40000
        peers:
          BTCUSDT: datasets-out/market_features/BTCUSDT/1h/v002/data.jsonl
          ETHUSDT: datasets-out/market_features/ETHUSDT/1h/v002/data.jsonl
          SOLUSDT: datasets-out/market_features/SOLUSDT/1h/v002/data.jsonl
  rule:
    min_folds: 3
    pass_if:
    - group:
      - BTCUSDT
      - ETHUSDT
      - SOLUSDT
      vs: baseline
      window: cv
      op: '>='
      value: 0.005
    - group:
      - BTCUSDT
      - ETHUSDT
      - SOLUSDT
      vs: lgbm_har
      window: cv
      op: '>='
      value: 0.0
    - group:
      - BTCUSDT
      - ETHUSDT
      - SOLUSDT
      vs: baseline
      window: holdout
      op: '>='
      value: 0.0
    fail_if_no_candidate_reaches:
    - group: any
      vs: baseline
      window: cv
      op: '>='
      value: 0.0
