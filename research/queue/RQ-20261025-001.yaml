id: RQ-20261025-001
title: 'AI trader / linear floor (P2-Q4-var-price-vector): does a causal rolling VAR price-vector feature
  set lift the BTC/ETH/SOL 1h regime head over the six shared features, and over a HAR-RV control, on
  the PUBLISHED shards?'
status: queued
cadence: once
roadmap:
- M23
theme: ml_health
priority: 2
kind: experiment
question: On the published 1h v002 market_features shards (regime_label, the six shared features), under
  purged 5-fold walk-forward CV with the same rows for every arm, does adding the causal rolling ridge
  VAR(4) next-bar [return, |return|] vector for BTC/ETH/SOL (refit every 24 bars on the trailing 2000,
  block var_price_vector) lift LightGBM macro_f1 over (a) the six shared features alone and (b) the same
  features plus HAR-RV regressors (day/week/month realised variance, 24 bars per day)?
why_this_matters: 'Operator idea 2026-10-21 (IDEAS.md): a multivariate linear price-vector model is the
  honest linear floor every TSFM / GBDT forecaster must beat. RQ-20261011-9da8-01 ran it as a control
  arm at 15m on the trainer only (headline checks har_rv_ge_incumbent_btc / var_ge_incumbent_btc did not
  hold on BTC; no grade on the VAR arm itself at 1h). This is its 1h, off-trainer twin on published data,
  so the floor is measured at the timeframe the regime-cell work uses and without a trainer slot. SCOPE,
  stated: this grades the feature-lift on the existing head metric (macro_f1), NOT the out-of-fold price
  MSE / directional log-loss vs AR(p) and a random walk that the plan node names; that forecaster-metric
  grading needs a regression task in ml_bakeoff.py that does not exist -- filed as the lever below, not
  hidden.'
power:
  expected_n: 24000
  min_detectable_effect: 0.1
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: Unit = OOS row per symbol. tail_rows 40000 at min_train_frac 0.4 leaves ~24,000 OOS rows per
    symbol over 5 folds (same plan as RQ-20261016-65ff-25, ESTIMATE until the first run replaces it with
    the measured n). d=0.1 needs ~785 rows so rows are not the limit; bars are autocorrelated, so the
    rule also requires fold-mean deltas (min_folds 3) on all three symbols.
  feasibility:
    source: none
    accrual_basis: Fixed published shard; nothing accrues.
decision_rule:
  id: RULE-P2-Q4-VAR-PRICE-VECTOR-1H-FEATURE-LIFT
  statistic: 'Paired per-fold macro_f1 difference on identical purged folds (5, embargo 24) and on the
    holdout (rows after 2026-07-12), per symbol: lgbm_var minus lgbm_base, and lgbm_var minus lgbm_har
    (the HAR-RV control); mean over folds. Reported, not graded: every arm minus the class prior.'
  rule: 'PASS IF lgbm_var - lgbm_base >= +0.005 on the CV mean on ALL THREE symbols AND lgbm_var - lgbm_har
    >= 0 on the CV mean on all three AND lgbm_var - lgbm_base >= 0 on the holdout on all three: the linear
    price vector adds information the shared features and a classical volatility control do not (a disjoint-window
    confirmation unit follows before any candidate-manifest note; this PASS was chosen from ONE configuration,
    trial count 1). FAIL IF lgbm_var - lgbm_base < 0 on the CV mean on EVERY symbol (the linear floor
    adds nothing at 1h; record the exact configuration in families.linear_logit.history, family not closed:
    another lag order or a return-only vector is a variant unit). INDETERMINATE otherwise (mixed by symbol),
    or if folds < 3 or an arm is unavailable.'
  min_n: 3 usable CV folds per symbol; holdout >= 200 rows per symbol.
  what_it_does_not_do: Trains nothing that serves; touches no config, registry, roster or order path;
