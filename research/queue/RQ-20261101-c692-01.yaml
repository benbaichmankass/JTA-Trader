  id: RULE-RQ20261101-c692-01-ENTRY
  registered_at: '2026-11-01'
  registered_before_run: true
  statistic: 'scripts/research/ml_decision_entry.py verdict(): held-out mean net R per TAKEN decision (net of fee 11.0 + slip 3.0 bps + funding
    1.0 bps/8h), n taken, distinct symbols traded; tau from TAU_GRID by the dev-only rule; baselines no-trade / always-long / always-short /
    random matched (200 draws) reported under identical mechanics.'
  rule: 'INDETERMINATE IF no tau reaches dev n >= 1000, OR held-out n < 300, OR held-out distinct symbols < 10. PASS IF held-out mean net R
