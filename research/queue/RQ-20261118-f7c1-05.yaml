id: RQ-20261118-f7c1-05
title: 'True ranking LOSS on the D3 Foxhound recipe: does a LightGBM lambdarank model (one query group per decision timestamp, net R graded into fixed
  relevance bins) beat the LightGBM regression recipe on the trades each would take at actual net R? (13 monthly refits over 2025-10..2026-09)'
status: done
cadence: once
theme: ml_health
priority: 2
roadmap:
- L-ML-LIVE
kind: experiment
origin: iteration
practice_precedent: 'https://www.microsoft.com/en-us/research/publication/from-ranknet-to-lambdarank-to-lambdamart-an-overview/ (Burges 2010, PRIMARY,
  known before this pass, not re-read): LambdaMART optimises the order inside a query directly; cross-sectional selection (pick the best perps at a bar)
  is a ranking problem, and docs/plans/ml-week-plan-2026-11-19.md section 2 lists "net-R ranking (LambdaRank)" as Foxhound''s next labels lever.'
levers:
- name: loss
  values:
  - LightGBM regression on raw net R (RAW, the served recipe, baseline)
  - LightGBM lambdarank, groups = decision timestamp, relevance = net R in bins (-inf,-0.5) (-0.5,0) (0,0.5) (0.5,1.5) (1.5,inf) -> 0..4 (LRANK, decided)
  hypothesised_effect: LRANK raises held-out net R per decision by >= +0.06 vs RAW at matched coverage
- name: lrank_coverage
  values:
  - 'matched out of sample inside each refit''s training rows: ranker + RAW fit on PROPER + CAL-A (the conf slices, 70% + 15% with 25 h gaps); per side
    s* = the ranker-score quantile on CAL-B admitting as many rows as RAW > tau admits there'
  hypothesised_effect: fixed, not swept (declared); makes the comparison one of ORDER at about RAW's decision count, not of count
iteration:
  subject: ml-decision-entry
  subject_kind: ml_model
  from_result: RQ-20261112-4654-06
  verdict_read: fail
  diagnosis: 'RQ-20261112-4654-06 FAILED: the ranking-FORM target (each side''s net R minus its cross-sectional mean at that timestamp, still fit by
    squared-error REGRESSION) gave paired xsdemean - raw mean -0.031 R/decision, 95% CI [-0.131, +0.068], k 13, n 1,743. That arm changed the TARGET,
    not the LOSS: a squared-error fit on demeaned net R is still dominated by the heavy tails (one +3 R TP and one -1 R stop move it as much as the
    whole middle), and its prediction is then thresholded at tau as if it were net R, which it no longer is (mean zero by construction). A true
    ranking loss (lambdarank) is a different lever: (1) it optimises pairwise ORDER inside a timestamp with an NDCG weight, so a tail value changes a
    pair''s sign, not the size of its gradient; (2) the graded relevance bins bound each outcome''s influence; (3) the selection threshold is matched
    to RAW''s coverage out of sample instead of reading a non-R score against tau. Untested on this recipe (lever map: labels/ranking loss).'
  search: 'one loss (lambdarank) with one relevance binning and one coverage rule, all fixed here; LightGBM params = the recipe''s LGB_PARAMS plus objective
    lambdarank (no tuning); nothing chosen on the test windows'
  attempt: 2
  due_by: '2026-11-25'
question: 'Refit the SAME recipe (ml_decision_entry FEATURES, E.purge_train, served tau, BTCUSDT excluded) at each of 13 monthly origins over the frozen
  v1''s held-out year with two models -- RAW (LightGBM regression on raw net R, the served recipe) and LRANK (LightGBM lambdarank per side, one group per
  decision timestamp, graded relevance, coverage matched as declared) -- and grade each on the decisions it takes at the ACTUAL net R of an outright
  bracket trade (canonical cost stack). Does LRANK beat RAW?'
why_this_matters: 'Foxhound-1 (D3 ml_entry) trades bybit_2 (real money), its mirror and two prop books on one LightGBM regression (mean net R +0.0371,
  n 907). The policy is a cross-sectional SELECTION (which perps to take at a bar), and every label lever tried so far (resid 4654-01, xsdemean 4654-06,
  gross cd01) kept a regression loss. A PASS is a cheap serving change (a LightGBM booster with a different objective plus two thresholds); a FAIL
  closes the ranking-loss lever for this recipe.'
