  id: RULE-RQ20261118-f7c1-05-LAMBDARANK-ENTRY
  registered_at: '2026-11-18'
  registered_before_run: true
  baseline: 'RAW: the same LightGBM regression recipe on the raw net-R target at the same origins, same rows (BTCUSDT excluded), same tau, same cost stack.
    Net of the full cost stack.'
  statistic: 'scripts/research/ml_entry_residual.py run --arms raw,lrank: per 28-day window, mean actual net R per taken decision for each arm (E.policy,
    served tau; LRANK scores shifted by their matched thresholds); d_w = LRANK - RAW over windows where both took >= 30 decisions; mean, sd and 95%
    t-interval of d_w (paired_extra_vs_raw.lrank); pooled means and n; per-window lrank_info (s* per side, CAL-B reference counts, group count).'
  rule: 'decide_vs_raw on LRANK: PASS iff >= 10 paired windows AND mean d >= +0.06 R/decision AND the 95% t-CI lower bound > 0 AND LRANK pooled n >= 300.
    FAIL iff >= 10 paired windows AND mean d <= 0. INDETERMINATE otherwise. Net of the full cost stack (fee + slippage + funding via ml_decision_entry._cost_r).
    Thresholds are not changed after any result.'
  pass_action: 'a Tier-3 proposal note on row ML-ENTRY-FINETUNE: candidate manifest for a lambdarank ENTRY model (booster + per-side thresholds), plus the
    promotion-design unit on the full held-out year with the prop survival gate and a fresh-window confirmation; a PASS here is a discovery, not a promotion.'
  fail_action: 'record FAIL for this exact configuration (lambdarank, LRANK_EDGES bins, matched coverage) on the lever map; with 4654-06 (target form)
    also FAIL, the ranking lever is closed for this recipe at this feature set; the next D3 levers stay the learner arms (dbf8-01 CatBoost, dbf8-02 TabICL)
    and the cost lever (per-symbol cost as a feature).'
  what_it_does_not_do: Changes no served model, tau, roster or config. No hyperparameter or bin search. One seed per refit. BTCUSDT excluded. The window
    was read before by 98e3-26, 4654-01/-06/-07/-09 and dbf8-01 (declared; a recipe comparison on a re-read window, deflation is the pass_action's
    fresh-window confirmation). A PASS is not a promotion.
  min_n: 10 paired windows with >= 30 decisions per arm; 300 pooled LRANK decisions
