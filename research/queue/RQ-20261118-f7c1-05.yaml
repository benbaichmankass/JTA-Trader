  basis: 'ESTIMATE (QUOTED, not re-derived): the same 13 x 28-day windows as RQ-20261118-dbf8-01 / 4654-06 / 4654-07; frontier-scan-2026-11-11 K1 paired
    window sd 0.074 R/decision, se 0.0205, 80%-power MDE ~0.063 R. 4654-06''s measured paired CI half-width was ~0.10 over k 13, so this design may land
    INDETERMINATE on a true +0.06 effect (declared). Fewer than 10 windows with n >= 30 per arm is INDETERMINATE.'
