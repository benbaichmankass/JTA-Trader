    (with bd30-02 as the cross-symbol read) for the manager, never a config edit. FAIL IF none passes with n(A) >= 25: THIS arm grid is closed for this window and the lever FAMILY is NOT retired (scripts/research/family_retirement_policy.yaml);
    the record names the arm that moved closest. Thresholds and the arm grid are not changed after any result.'
  regime_robustness: 'Reported with the result, not graded here (the grade is the rule above): per-year net R table for every arm, long-side and short-side net R separately, and the largest single year
    share of total net R. Set before the run.'
