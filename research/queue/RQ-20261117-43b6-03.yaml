id: RQ-20261117-43b6-03
title: 'ITERATION 2 of ltr-partial-close (ed2b-01 FAIL, risk cut too small): does banking half at the first ADVERSE-side trigger (adverse 0.5 R / 0.75 R,
  structure break, momentum flip) cut the left tail enough to clear RULE-AM-RISK-ADJUSTED-V1?'
status: done
