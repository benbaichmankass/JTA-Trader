priority: 2
roadmap:
- L-ATM
programme: P1
kind: experiment
question: Over the committed Stage-0 per-trade corpora (comms/strategy_evidence/ltr_corpus, 8 legs), does partial_close (bank 50% at the next bar's open)
  at the first adverse_r_0.5, adverse_r_0.75, structure_break or momentum_flip trigger cut maxDD or weekly CVaR5 by >= 15% at <= 0.05 R/trade net of the
  full cost stack, hold in >= 4 of 6 folds, and beat the same partial at a random bar?
why_this_matters: 'ltr-partial-close is an orphan (iteration_orphans.py 2026-11-17): iteration 1 (RQ-20261113-ed2b-01) FAILED on every trigger and nothing
  iterated from it. The diagnosis below points at the trigger family: the three triggers tested all fire on trades already in profit, while the V1 risk
  clauses read the left tail. On PASS: a discovery, ONE confirmation on the holdout legs of RQ-20261117-43b6-01, then a Tier-3 class-status note. On FAIL:
  the partial class has been read on 7 of 10 triggers at f = 0.5; the remaining family is action_bounds (f), which RQ-20261117-43b6-02 reads at its bound
  (f = 1, the close class).'
iteration:
  subject: ltr-partial-close
  subject_kind: ltr_class
  from_result: research/results/RQ-20261113-ed2b-01/43492518743.jsonl
  verdict_read: fail
  diagnosis: 'RQ-20261113-ed2b-01 (3,921 priced trades): every candidate failed R2/R3, i.e. on RISK, not cost: near_target cost -0.0005 R/trade with maxDD
    cut 8.3% / CVaR5 cut 6.2% (n_fired 388); r_milestone cost 0.041 with cuts 11.2% / 11.3% (n_fired 1,426); stall cost 0.012 with cuts 10.6% / 10.2% (n_fired
    1,167); 0 of 6 folds held for any. All three triggers fire on trades that are in profit or flat, so banking half removes upside variance and leaves
    the losers, which hold the weekly CVaR5 (-10.3 R) and the drawdown, untouched. The untested triggers that fire on the losing side (adverse_r_0.5, adverse_r_0.75,
    structure_break, momentum_flip) act where the tail lives. Counter-evidence named: the plain tighten class lost on early (losing-side) cells (comms/research/ltr_tighten_optimize/verdict.json),
    so the R1 cost of an adverse partial may exceed 0.05 R; that is exactly what this reads.'
  search: trigger family, the 4 untested adverse-side triggers at the fixed f = 0.5 of iteration 1; arm denominator 4 (+ hold); cumulative family 7 triggers
    read for this class
  levers:
  - trigger
  map_entries:
  - research/levers/ltr-partial-close.yaml
  attempt: 2
  due_by: '2026-11-24'
