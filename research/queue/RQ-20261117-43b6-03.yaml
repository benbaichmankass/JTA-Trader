decision_rule:
  id: RULE-RQ-20261117-43b6-03
  registered_at: '2026-11-17'
  registered_before_run: true
  statistic: 'Over the pooled committed Stage-0 per-trade corpora in comms/strategy_evidence/ltr_corpus (8 legs; each row''s net_r net of fee + slippage
    + funding), per pre-registered trigger T in {adverse_r_0.5, adverse_r_0.75, structure_break, momentum_flip}: the book that banks 50% of the position
    at bar j0+1''s open after T first fires (the rest keeps the recorded exit), vs the HOLD book, against 200 matched random-time partials on the same trades.'
  rule: 'RULE-AM-RISK-ADJUSTED-V1 (am_risk_adjusted.grade_risk_adjusted, V1 parameters: R1 r_cost <= 0.05 R per baseline trade; R2 maxDD cut >= 15% OR weekly-CVaR5
    cut >= 15%; R3 >= 4 of 6 calendar folds hold; n_floor 39) with R4 vs 200 matched random-time books (min_control_beat_frac 0.9875), plus L1: a pass must
    keep r_cost <= 0.05 R/trade after dropping the leg with the largest favourable contribution. Reported, never graded: the B3 best static rule (hold +
    the registered trigger arms, chosen leave-one-fold-out) and each candidate''s margin over it. Four pre-registered candidates (n_comparisons 4, Bonferroni
    1 - 0.05/4), so R4 uses 0.9875 and the reported edge CI is at 0.9875; the 3 triggers of ed2b-01 are disclosed as prior reads of the same class (cumulative
    7). PASS: at least one trigger clears R1-R4 and L1 (a discovery). It is a SCREEN pass (per-trade R books, graduation_eligible false until BOOK-SIM-REAL-SIZER):
    a Tier-3 proposal input for the class''s status, never an apply. FAIL: every candidate fails a read necessary clause (R1, R2 or R3) or is beaten by
    its random control (R4). INDETERMINATE: anything else, i.e. the best candidate is under the n floor, never fired, carried by one leg (L1 fails), or
    no trade could be priced (read_state no_data). Fixed now; not changed after a run.'
  what_it_does_not_do: 'Advice-only research: serves, promotes or applies nothing; adds no gate; changes no config, mandate or roster; places no order.'
