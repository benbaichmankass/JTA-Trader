  statistic: 'index_signal_etf_harness.py unit RQ-20261125-1e06-14 --start 2010-06-01 --end 2026-10-22: family capitulation_wide (UNFILTERED, no regime
    gate) on capitulation_bull (8 pairs, 1x execution, baseline flat); POOLED grade; the timing control (200 re-timed replays, shifts 40-400 sessions, same
    stop geometry, TP and cost) is a RULE CLAUSE. Cost stack: 5 bps slippage per side (2x slippage re-read), the ETF price series itself (expense embedded),
    no funding; TP = K* calibrated on the first 60% of in-window trades, never tp_r 50. Pairs with no bars in the window count as not positive.'
  rule: PASS IFF pooled n>=25 AND pooled net_r>0 AND >=4 of 8 pairs net_r>0 AND pooled net_r>0 under 2x slippage AND pooled actual net_r beats >= 95% of
