    differ.
  pass_action: Record on INDEX-CAPIT-1X-LEG as a third population for the unfiltered spec (input to widening the leg's ticker population later; a widening
    needs its own population test, which this is).
  fail_action: Record that the unfiltered spec does not carry to these pairs in-window, compare with the filtered 1e06-07 PASS (the filter's in-window value),
    and author the next iteration from the per-pair diagnosis.
  proposal_mapping: pass -> evidence record on INDEX-CAPIT-1X-LEG; fail or indeterminate -> manager flag + the next iteration from its diagnosis.
  what_it_does_not_do: Changes no config and no roster. NO local read of this window/population preceded this registration.
