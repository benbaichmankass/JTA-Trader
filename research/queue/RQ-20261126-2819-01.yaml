  workflow: research-script-run-kaggle.yml
  timeout_minutes: 240
  inputs:
    research_unit: RQ-20261126-2819-01
decision_rule:
  id: RULE-RQ-20261126-2819-01
  registered_at: '2026-11-26'
  registered_before_run: true
  baseline: LightGBM on the same 10 columns, pooled rows and folds
  statistic: 'scripts/research/ml_bakeoff.py POOLED mode (dataset.paths + entity_col symbol): group POOLED, the paired moving-block
    (block_rows 1440 = one calendar day across 60 symbols, n_boot 1000, seed 0) bootstrap of the out-of-fold log-loss improvement
    (LightGBM minus GRU; positive = GRU better), stat boot_ci_low (95% lower bound) and boot_mean. Reported: fold-level paired mean, the
    prior control, per-fit epochs/best epoch/temperature (measurement.torch_gru_fit), the files pooled (measurement.pooled_files) and
    n_entities.'
  rule: PASS iff the GRU boot_ci_low vs LightGBM is > 0 on POOLED (>= 3 folds measured). FAIL iff the GRU boot_mean vs LightGBM is <= 0
    on POOLED. INDETERMINATE otherwise. Fixed now; machine form in ml_bakeoff.rule.
  pass_action: Author the entry-label GRU arm on the pooled bp2 population (net R per side, frozen v1 recipe as baseline, net of the full
    cost stack) as its own pre-registered unit (MLP-F-SEQUENCE-GRU levers_ahead).
  fail_action: If 9e72-01 also FAILED, close the GRU on these engineered features at both scales. The deep_sequence family re-opens
    only on a new representation (raw OHLCV windows, or a pretrained TS encoder over the bp2 market_raw), authored from this diagnosis.
    If 9e72-01 PASSED, author the split read (which symbols the pooled fit loses on).
  proposal_mapping: pass -> entry-label GRU unit; fail -> line closed (with 9e72-01) or split read; indeterminate -> one re-read at a
    larger train cap authored from the CI width.
  what_it_does_not_do: Changes no served model, config or order path; reads no held-out window; is not a promotion; adds no gate. Binance-vision
    klines, not Bybit; the basis is not measured, and the target is a market regime label, so the venue does not enter a cost.
  min_n: 3
