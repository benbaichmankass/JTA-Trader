id: RQ-20261126-2819-01
title: 'D2/F29 POOLED GRU (GPU): the 9e72-01 recipe (early stopping + temperature calibration) trained ONCE PER FOLD on the bp2 60-perp
  universe pooled, vs LightGBM on the same 10 features, 1h regime log-loss, calendar folds, paired day-block bootstrap (metis-market-bp2)'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-MECE
programme: P2
kind: experiment
iteration:
  subject: ml-sequence-gru
  subject_kind: ml_model
  from_result: RQ-20261125-9e71-01/45724458202
  verdict_read: fail
  diagnosis: '9e71-01 failed with a mis-trained GRU (no validation, no calibration; worse than the class prior). 9e72-01 re-opens it with
    a fair recipe on 3 symbols, about 40k rows each. A sequence learner is data-hungry. This twin keeps that exact recipe and widens the
    population to 60 perps pooled into one fit per fold (up to 1,000,000 train windows), the data the deep_sequence family is supposed to
    need. If the GRU loses at 60 symbols, "not enough data" is no longer the excuse.'
  search: one fixed recipe (the 9e72-01 GRU params; only max_train_windows widened for the pooled population); no grid.
  levers:
  - model_family
  - population
  map_entries:
  - research/levers/ml-entry.yaml
  attempt: 4
  due_by: '2026-12-03'
question: Trained on the 60 bp2 perps pooled (calendar folds, windows inside each symbol), does the early-stopped, temperature-calibrated
  GRU have a LOWER 1h regime log-loss than LightGBM on the same 10 features, with the paired day-block bootstrap 95% lower bound of the
  pooled improvement above 0?
why_this_matters: It gives the deep_sequence family its data-rich read on free Kaggle GPU (operator 2026-11-25, "these resources are free
  and should never sit idle"). PASS -> the entry-label GRU arm on the pooled population. FAIL -> the GRU is closed on these engineered
  features at both 3-symbol and 60-symbol scale, and the family re-opens only on a new representation. It is also the first unit on
  metis-market-bp2, so it proves the route for every pooled unit after it.
power:
  expected_n: 1400000
  min_detectable_effect: 0.005
  effect_units: logloss_nats_per_row
  sd: 0.3
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 'MEASURED + ESTIMATE. 60 symbols x tail 40,000 1h rows (the dataset holds 2020-07 onward; the tail keeps the newest ~4.6 years per symbol, as 9e72-01) = up to 2.4M pooled rows. Folds score the last 60% (min_train_frac 0.4),
    so ~1.4M paired OOS rows. The bootstrap resamples whole calendar days (block_rows 1440 = 24 h x 60 symbols), so the effective n is
    the ~1,000 OOS days, not 1.4M rows. MEASURED 2026-11-26: a local CPU smoke of this exact spec on 3 real bp2 symbols (ADA/BTC/DOGE,
    72,000 OOS rows, 1-day blocks of 72 rows; cut-down GRU budget: 4 epochs, hidden 32, 1 layer, 60k windows; n_boot 200) gave a
    bootstrap sd of the GRU-minus-LightGBM log-loss delta of 0.00176 nats/row over the same ~1,000 day-blocks. ESTIMATE: averaging 60
    symbols per day instead of 3 lowers the per-block variance (cross-sectional correlation ~0.3 assumed), so sd ~0.0014 and MDE ~2.8 x sd
    ~0.004; 0.005 is declared to leave margin. The smoke is NOT a result of this unit (3 symbols, reduced GRU). INDETERMINATE is
    possible and stated now.'
  feasibility:
    source: none
    accrual_basis: Published market shards (metis-market-bp2, built from public data.binance.vision klines); nothing accrues.
evidence_class:
  holdout: none
  claim: model_quality
ml_consumer:
  not_applicable: 'a model-family gate on a market regime target: no order, leg or book consumes this result; a PASS authors the entry-label
    GRU unit (ML-ENTRY-FINETUNE), which carries its own consumer'
baseline:
  definition: LightGBM (n_estimators 200, lr 0.05, num_leaves 31, min_child_samples 50) on the SAME 10 columns, the same pooled rows and
    folds; the class prior is a reported control.
  net_of_cost: false
run:
