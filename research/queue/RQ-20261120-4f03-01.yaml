  basis: 'expected_n is the HOLDOUT trade count, an estimate: the Binance holdout held 96 trades over the same span (holdout_confirmation.n_holdout) and the venue-gap run matched
    227 of 236 trades by entry time (0.962), so ~92-96 Bybit holdout trades. At the 25-trade floor a one-sample test detects d = (1.96 + 0.8416) / sqrt(25) = 0.56 -> 0.57 sd; at
    n 92, 0.29 sd. A per-trade edge of 0.0392 R against a per-trade sd near 1.5 R is ~0.03 sd, far below either: this unit tests the registered sign rule (net R > 0), not a
    significance bar, exactly as the original holdout did.'
