    RULE-RQ-20261016-077e-05''s holdout clause (held-back net R > 0) on the same boundary. INDETERMINATE IF discovery n < 25 (underpowered) or IF discovery passes and holdout n <
    25 (holdout_underpowered). FAIL IF discovery net R <= 0 (stage0_no_edge) or holdout net R <= 0. PASS iff both hold. Fold counts are reported, never graded: --fold-majority 1
