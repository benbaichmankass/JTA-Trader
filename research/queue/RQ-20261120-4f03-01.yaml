  exact argv on both venues over 2023-02-01 .. 2026-11-15: Bybit earned 0.0364 R/trade less (n 236, sum 19.555 R on Binance vs 10.970 R on Bybit). That is 1.08x the holdout margin,
  the thinnest of the real-money legs. Manager 2026-11-20 03:52Z: re-run on the Bybit bars, graded on the rule its evidence registered. No demotion, config or live change rides on
  this unit; a FAIL is reported to the manager as evidence for the operator, never acted on here.'
power:
