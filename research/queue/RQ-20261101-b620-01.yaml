id: RQ-20261101-b620-01
title: 'ENTRY timeframe lever, precondition: does the new timeframe harness, run at 1h, REPRODUCE the round-1 v1 base (R0, seeds 7/11/13, tau 0.10, dev folds, pooled frozen 60: seed-mean +0.0089, n about
  72k)? It is the baseline every other timeframe unit is judged against. Dev folds only'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: experiment
practice_precedent: 'T1, M6 (docs/reference/trading-and-model-practice-principles.md): purged + embargoed walk-forward; shadow-feature (Boruta-style) controls so a model that cannot reject noise columns
  is not trusted to admit real ones.'
question: 'Operator 2026-11-01 ~22:35Z: queue ENTRY training on other bar sizes (5m) to see what scales across timeframes and what does not. Before comparing, prove the harness: scripts/research/ml_entry_timeframe.py
  at 1h must give the round-1 v1 base (b607-01 arms.base: mean +0.0089486, n 71,950 / 71,886 / 72,063). Also reports the 1h gate-on/gate-off rows and the 1h feature importance (gain share, SHAP sign) every
  other arm is compared with.'
why_this_matters: 'Operator 2026-11-01 ~22:35Z (relayed by the manager): compare the ENTRY model across bar sizes to learn which timeframes the edge scales to and which it does not. Fee plus slippage is
  a much larger share of R at short bars, so gross R, cost per R and net R are reported side by side.'
power:
  expected_n: 72000
  min_detectable_effect: 0.0148
  effect_units: metric
  sd: 1.0
  design: two_sample
  alpha: 0.05
  power: 0.8
  basis: 'MEASURED 2026-11-01 (round 1): the v1 recipe at a fixed tau on the pooled 60 symbols over the dev folds has a pooled seed range 0.0034 at n about 72k; the win threshold is 2 x max(0.0034, the
    1h seed range). The naive two-sample MDE at n 72,000 per arm and sd 1 is 0.0148 R; the registered win threshold (2 x 0.0034 = 0.0068) is below it, so the fold, year and seed-range conditions, not a
    t-test, carry the evidence (as in b607). Shorter bars have more decisions (about 12x at 5m bar-count), so their MDE is smaller. Row counts for other bar sizes are INFERRED (decision cadence x the measured
    668,280 1h dev rows).'
  feasibility:
    source: none
    accrual_basis: Replays public Binance Vision history through 2025-09-30 (dev folds only); nothing accrues.
decision_rule:
  id: RULE-20261101-b620-01
  registered_at: '2026-11-01'
  registered_before_run: true
  statistic: 'Per seed (7, 11, 13) at tau 0.10, one-position-per-symbol: n, mean gross, cost and net R per decision, per-fold and per-year net; ungated and with the v2 cost gate; LightGBM gain share and
    Spearman SHAP-sign per feature (last dev fold, seed 7, long and short heads).'
  rule: 'REPRODUCES iff, at the frozen tau 0.10 on the dev folds and pooled frozen-60 population, the mean over seeds 7/11/13 is within 0.0005 of the round-1 v1 base +0.0089486 AND each seed''s decision
    count is within 1% of round 1''s 71,950 / 71,886 / 72,063. DOES_NOT_REPRODUCE otherwise: a mechanical fault in the harness, fixed before any other timeframe unit is read. Nothing else is judged here.'
  what_it_does_not_do: Reads no sealed or held-out window (dev folds only, no month after 2025-09 is downloaded), serves nothing, changes no config or live symbol list, places no order, sizes nothing.
  min_n: 1000 dev decisions per fold
