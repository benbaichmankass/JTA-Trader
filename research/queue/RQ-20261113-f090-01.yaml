title: 'FILTER LEVER on tlt_pullback_1h: ADX floor (adx-min 20 / 25) on the short-only arm, holdout-selected over the full 2018-06..2026-10 window, net of the full cost stack (iteration 2 from RQ-20261113-1751-01
  PASS)'
