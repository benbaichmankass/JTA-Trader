question: 'tlt_pullback_1h: short-only (S1) passed on pre-dev history 2018-06..2020-06 (RQ-20261113-1751-01: net +13.80 R, n 65, 2/2 folds). Does one added filter value, S1 + adx-min 20 or 25, keep or improve
  a discovery-eligible net edge across the full 2018-06..2026-10 window and survive a held-back latest-25% span, read once?'
why_this_matters: 'ITERATION 2 of tlt_pullback_1h (research-ops 2026-11-13 1545Z). Iteration 1 (1751-01) confirmed the direction lever on a disjoint in-hand window (short-only net +13.80 R, n 65, folds
  +2.60 / +11.20; fee-only +19.77 so cost share is 30%). The leg map shows the filter family (adx_min) untested and the stop exits losing -40 R vs trail +40 R over 2025-26. DENOMINATOR: 4 arms (A both sides,
  S1 short, F1 short+adx20, F2 short+adx25), one selected on discovery, read once on the held-back span. DISCLOSURE: the 2025-26 direction reading came from the same span that falls in the held-back 25%
  here, so the holdout is correlated evidence for A and S1 and virgin only for the F arms. A PASS with a non-A arm is a LEAD for a Tier-3 proposal NOTE, never a config edit.'
power:
  expected_n: 38
  min_detectable_effect: 0.57
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: expected_n = the 38-trade held-back count of the sibling QQQ 1h leg (an ESTIMATE); n < 25 held-back grades INDETERMINATE/underpowered, never FAIL.
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ20261113F09001-ITERATION
  registered_at: '2026-11-13'
  statistic: 'scripts/research/exit_lever_ablation.py --grade holdout on tlt_pullback_1h, window 2018-06-01 .. 2026-10-15 23:59, every arm ONE continuous harness pass, net of the full cost stack the harness
    resolves for the venue; per-trade net_r from --emit-trades. Arms fixed now: A: the leg as declared; S1: --side-filter=short; F1: --side-filter=short;--adx-min=20; F2: --side-filter=short;--adx-min=25.
    BOUNDARY, fixed before any outcome is read: the latest 25% of the calendar window, grown in 1% steps until it holds 25 of arm A entries, capped at 40%. DISCOVERY = trades whose entry AND exit precede
    the boundary; 4 equal calendar folds. HOLDOUT = the selected arm trades entered on/after the boundary. Regime-robustness clause: per-year table read in the result; a PASS with one calendar year above
    50% of net gain, or a net-negative long or short side, is reported as a LEAD with that caveat.'
  rule: 'SELECTION (discovery only): an arm is eligible iff discovery n >= 25 AND discovery net R > 0 AND >= 3 of 4 discovery folds net-positive; the eligible arm with the highest discovery net R is selected
    (a tie goes to A). HOLDOUT (read once): INDETERMINATE/insufficient_discovery IF every arm holds < 25 discovery trades; FAIL/no_discovery IF no arm is eligible; INDETERMINATE/underpowered IF the selected
    arm holds < 25 held-back trades; PASS/confirmed IF held-back net R > 0; FAIL/not_replicated otherwise (closes THAT configuration on THIS window, never the lever family). A PASS with a non-A arm is a
    LEAD for a Tier-3 proposal NOTE on the owning checklist row, never a config edit. Thresholds are not changed after any result.'
  what_it_does_not_do: Edits no config, roster or record and places no order. A backtest of a filter value on one leg is not edge and not a P&L claim; not a Tier-3 case; 4 arms are counted as the denominator
    and one configuration is read once on the holdout.
  registered_before_run: true
