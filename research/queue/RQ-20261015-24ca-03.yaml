id: RQ-20261015-24ca-03
title: 'Tradeify non-crypto Stage 0 + prop survival: spy_trend_long_1d params on SPY 1d priced as SP500/USD'
status: done
cadence: once
theme: new_strategy_prop
priority: 2
kind: experiment
roadmap:
- L-PROP
question: >-
  Does the live spy_trend_long_1d geometry (donchian 30, atr_stop 1.5, trail 4.0, tp_r 2.0, long-only; backtest_trend.py) show net edge on SPY
  1d at Tradeify's declared costs and survive Tradeify's 1-Step rules, as the proxy for the SP500/USD (S&P 500 synthetic perp) the tradeify_1
  terminal lists?
why_this_matters: >-
  spy_trend_long_1d is a live Alpaca leg with a committed population of n=11 (underpowered; RQ-20260928-013). Tradeify lists SP500/USD (issue
  #18399, 2026-10-15): 'S&P 500 Index priced in United States dollars (synthetic perp via Hyperliquid)'. SPY 1h squeeze and orb cells already
  FAILED at Stage 0 (RQ-20261006-030/-033); the daily trend leg is the SPY cell with live-roster geometry that has not been tested on the long
  history.
power:
  expected_n: 120
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: >-
    d=0.3 needs ~87-90 observations at alpha 0.05 / power 0.8 (the repo's prop-fit floor, RQ-20260928-011/-012/-013). expected_n=120 is a cadence
    GUESS, not a measurement: this (leg, symbol, timeframe) at Tradeify costs has not been run on the trainer's 2018-2026 history. Below 88 the
    unit grades UNDERPOWERED (indeterminate), never FAIL.
  feasibility:
    source: none
    accrual_basis: >-
      Bounded by the history requested: SPY_1d.csv on the trainer (modified 2026-07-07) is a fixed backfill whose row count #18392 did not list.
      A daily long-only donchian-30 trend produces few trades per year; below 88 it grades UNDERPOWERED and the bar is not lowered.
decision_rule:
  id: RULE-RQ-20261015-24ca-03
  registered_at: '2026-10-15'
  registered_before_run: true
  statistic: >-
    Per seed 1-5: prop_ev_sim path-mode ev_net_usd_per_life and p_net_positive over the leg's trade ledger (n = ledger rows), as graded by scripts/research/prop_ev_grid.py
    --grade pass_all_seeds.
  rule: >-
    PASS IF n_trades >= 88 AND ev_net_usd_per_life > 0 on ALL 5 seeds AND p_net_positive >= 0.70 on ALL 5 seeds (prop_ev_sim path mode, config/prop_rulesets/tradeify_247_1step.yaml,
    flat 0.5% risk, --lev-cap spy_trend_long_1d=2, --no-hedge, prorated swap, funded-start fresh, Tradeify cost stack 8 bps commission round trip
    + 3 bps declared slippage + 0.033%/day swap re-applied by the sim to the harness gross_r). FAIL IF ev_net_usd_per_life <= 0 on ANY seed (one
    pass: re-queues once for a confirmatory run before it is read as a kill). INDETERMINATE (UNDERPOWERED) IF n_trades < 88; INDETERMINATE (NULL)
    IF ev > 0 on all seeds but p_net_positive < 0.70 on any seed. The harness's own Stage-0 number (net_total_r at the same declared costs) is
    written to harness.json beside the verdict and is reported, not graded separately: a leg with no net edge cannot show ev > 0 on all 5 seeds.
    OPERATOR RULE (2026-10-15, relayed by the manager; binding on every prop leg): a prop leg clears the full real-money path, not a shortcut.
    STAGE 0 backtest net of the full cost stack, THEN a SOAK (live prop trading on the account counts as the soak), THEN COST FIDELITY (realized
    cost vs the declared cost used here), PLUS prop DD SURVIVAL under the account's rules. This unit is the first and last-but-one of those only:
    it supplies Stage 0 and the prop-survival simulation. A PASS authorizes NO roster edit, NO account opening and NO order; soak, cost fidelity
    and the Tier-3 roster decision stay open.
  what_it_does_not_do: >-
    Does not touch config/strategies.yaml, config/accounts.yaml or config/prop_platforms.yaml, places no order, and does not claim Tradeify's
    quoted spread: the per-instrument spread/commission/swap/leverage/hours shown by the terminal are UNMEASURED (the terminal's instrument-info
    panel is reachable only after a watchlist add, a UI mutation this lane did not perform); the costs above are the firm-declared rule-page figures
    (docs/research/tradeify-portfolio-feasibility-2026-09-30.md, config/prop_rulesets/tradeify_247_1step.yaml, unconfirmed: true) plus a DECLARED
    3 bps slippage. Candles are the trainer's data/<SYM>_<tf>.csv (1h to 2026-06-18, verified by trainer-diag #18392 on 2026-10-15), i.e. an ETF
    proxy, not the Hyperliquid-fed synthetic perp's own price history.
compute: needs_vm_data
value:
  bucket: structural
  usd_at_stake_per_month: 120
  confidence: 0.2
  basis: >-
    stand-in, not a measurement: a non-crypto prop leg widens tradeify_1 beyond ETH/SOL (2 legs, P(net>0)~0.37 min-seed, RQ-20261005-902); information
    value of a leg that diversifies inactivity gaps and drawdown clustering
routing:
