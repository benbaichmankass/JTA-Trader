    - --tp-r
    - '2.0'
    - --fee-bps-roundtrip
    - '8.0'
    - --slippage-bps-roundtrip
    - '3.0'
    - --funding-bps-per-window
    - '3.3'
    - --funding-window-hours
    - '24'
    - --emit-trades
    - '{out_dir}/trades.jsonl'
    - --json
    - '{out_dir}/harness.json'
  - - python3
    - scripts/research/prop_ev_grid.py
    - --leg
    - spy_trend_long_1d={out_dir}/trades.jsonl
    - --arm
    - A=--sizing balance --risk-pct 0.005
