      --ruleset config/prop_rulesets/tradeify_247_1step.yaml --lev-cap spy_trend_long_1d=2 --no-hedge --swap-model prorated --funded-start fresh
    - --seeds
    - 1,2,3,4,5
    - --grade
    - pass_all_seeds
    - --p-floor
