kind: experiment
question: 'RQ-20261022-fd06-03 and RQ-20261022-eba2-12/-13/-14 graded FAIL on four sibling legs. DIAGNOSIS of the first test: the 50%-at-1R rung sat INSIDE the median
  trade (census median peak ~0.9-1.1 R), halving winners that reach the target; far rungs (2-3 R), small sizes (25-33%) and the bank + R-armed trail combination were
  untested on this leg, and eba2-12/-13/-14 (far rung on ada_pb, xrp_pb, eth_prop) also failed incumbent_stands, so this tests whether the leg''s own tail shape differs.
  Over 2020-07-01 .. 2026-10-15 23:59 on trend_donchian_sol_4h, 6 calendar folds, does any arm (P25 = 25% at 3.0 R; P33 = 33% at 2.0 R; PT = 33% at 2.0 R plus an
  R-armed tight trail on the remainder) beat the leg as declared (A) by >= 0.02 R/trade on net R in >= 4 of 6 folds within the Path B drawdown bar (maxDD <= A x 1.35)?
  R is on the full initial position''s risk.'
why_this_matters: 'Operator directive 2026-10-22: an idea that failed one test is not dead; it failed the first test. This unit is a registered VARIANT. Lane AUTHOR-FLOOR-1023
  (research runnable floor 40 vs 57 at 09:14Z). First test(s): RQ-20261022-fd06-03 and RQ-20261022-eba2-12/-13/-14 graded FAIL on four sibling legs. Diagnosis (one
  line): the 50%-at-1R rung sat INSIDE the median trade (census median peak ~0.9-1.1 R), halving winners that reach the target; far rungs (2-3 R), small sizes (25-33%)
  and the bank + R-armed trail combination were untested on this leg, and eba2-12/-13/-14 (far rung on ada_pb, xrp_pb, eth_prop) also failed incumbent_stands, so
  this tests whether the leg''s own tail shape differs.'
power:
  expected_n: 150
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'Floor (1.96 + 0.8416)^2 / 0.45^2 = 38.76 -> 39 incumbent trades; expected_n=150 is an ESTIMATE from sibling units'' n on this leg/window (not a measurement
    for these arms); below the floor the unit grades indeterminate, never FAIL. Trade sequences autocorrelate: the fold majority carries the rest.'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ20261023-A1F3-03-SOL4H-BANK-FARRUNG
  registered_at: '2026-10-23'
  registered_before_run: true
  statistic: 'From scripts/research/exit_lever_ablation.py --grade replace on trend_donchian_sol_4h, window 2020-07-01 .. 2026-10-15 23:59 (6 equal calendar folds,
    a trade binned by entry time), net of the full cost stack the harness resolves per venue (execution_costs.resolve_cost_policy, recorded per arm as cost_stack).
    Arms fixed now: P25 = 25% at 3.0 R; P33 = 33% at 2.0 R; PT = 33% at 2.0 R plus an R-armed tight trail on the remainder. Per arm: n, net_total_r (full-position
    R), max_drawdown_r, net R per fold. A = the leg as declared in config/strategies.yaml. Per candidate C: delta = net_r(C) - net_r(A); folds_ge = folds with net_r(C)
    >= net_r(A).'
  rule: 'INDETERMINATE IF n(A) < 39, or IF every C arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C) > net_r(A) AND delta >= 0.02
    R x n(A) AND folds_ge >= 4 of 6 AND maxDD(C) <= maxDD(A) x 1.35. PASS IF one or more pass: the best by net R is named and the follow-up is ONE confirmation unit
    on a disjoint partition (a PASS on one window is a discovery), never a config edit. FAIL IF none passes: the declared exit stands for THESE arms on this leg;
    the idea is not retired and the diagnosis here decides the next variant. Thresholds are not changed after any result.'
  what_it_does_not_do: 'Edits no config and places no order; a PASS needs a Tier-3 declare (and a live producer where the lever has none, plus the mirror in the same
    PR). HARNESS CAVEAT, stated: the bank rung is tested at the top of each bar BEFORE the stop test (optimistic for C; a FAIL is robust, a PASS is checked by its
    confirmation).'
