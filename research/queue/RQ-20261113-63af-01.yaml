  ref: TREND-ALIGNMENT-FEATURE
  what: 'the per-leg corpus driver: `trend_alignment.py corpus` (built on label_trade), labels every leg''s committed Stage-0
    __trades.jsonl, bootstrap CI of D=mean(with)-mean(counter) within arm (seed 20261113, 10,000 resamples), Holm across
    legs clearing 30/arm, writes verdict.json per this rule.'
  cleared_by: 'this PR adds the corpus subcommand with a --self-test planting a with>counter leg and a no-difference leg, and git-moves this
    unit from research/queue/blocked/ to research/queue/ with run.workflow research-script-run.yml (rule unchanged).'
