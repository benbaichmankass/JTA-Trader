id: RQ-20261113-63af-01
title: 'Trend alignment (TREND-ALIGN-V1): per leg, do Stage-0 trades taken WITH the prevailing trend earn more net R than trades taken AGAINST
  it, net of the full cost stack?'
status: queued
cadence: once
roadmap:
- L-PROGRAMMES
theme: live_strategy
priority: 2
kind: experiment
question: 'The operator asked (2026-11-13, relayed 06:50Z) to track, beyond long vs short, whether each trade goes with or against the prevailing
  trend, and see whether strategies trade better one way or the other. Label every trade in each leg''s committed Stage-0 corpus (the
  __trades.jsonl its evidence record comms/strategy_evidence/<leg>.json names as source_run) with TREND-ALIGN-V1
  (docs/research/trend-alignment-framework-2026-11-13.md, registered 2026-11-13): the LEG-timeframe label is PRIMARY (with_trend /
  counter_trend / neutral / missing), D1 is reported. Compare mean net R per trade (the corpus''s own net_r: fee + slippage + funding, the
  harness cost stack) between with_trend and counter_trend, per leg.'
why_this_matters: 'If a leg''s counter-trend entries lose net of cost while its with-trend entries pay, an alignment filter is a candidate lever
  for that leg (a separate Tier-3 proposal with its own holdout test); if no leg shows a difference, alignment is not a lever on these legs under
  this definition, and step 5 (ML feature ablation) is the remaining use.'
evidence_class:
  holdout: none
  claim: description_of_backtest_edge_by_slice
power:
  expected_n: 60
  min_detectable_effect: 0.3
  effect_units: R
  sd: 1.0
  design: two_sample
  alpha: 0.05
  power: 0.8
  basis: 'ESTIMATE, not measured: Stage-0 corpora hold roughly 50-900 trades per leg (e35 / evidence n_trades_oos); with ~25-35 percent of trades
    in each directional label and sd ~1 R, a leg with ~60 trades per arm resolves a 0.5 R difference at 80 percent power, ~0.3 R needs ~175 per arm.
    The per-arm floor below is the binding gate; legs under it grade INDETERMINATE, never FAIL.'
  feasibility:
    source: none
    accrual_basis: Re-labels committed Stage-0 trade files; nothing accrues.
decision_rule:
  id: RULE-RQ20261113-63af-01-TREND-ALIGN
  registered_at: '2026-11-13'
  registered_before_run: true
  statistic: 'Per leg L with a committed Stage-0 trades file and a LEG timeframe in config/strategies.yaml (re-parsed at run time): n_with,
    n_counter, mean net R per trade in each arm, the difference D = mean(with) - mean(counter), and its 95% bootstrap CI (10,000 resamples of
    trades within each arm, seed 20261113). Neutral and missing trades are counted and reported, never pooled into an arm. Across legs, the CI
    is Holm-corrected for the number of legs that clear the per-arm floor (family-wise alpha 0.05). D1 labels and the journal backfill
    (comms/research/trend_alignment/backfill-2026-11-13/, realized live/paper R) are REPORTED, never gating.'
  rule: 'Per leg: INDETERMINATE if n_with < 30 or n_counter < 30. Otherwise ALIGNMENT_MATTERS if the Holm-corrected CI of D excludes 0
    (sign recorded: with > counter, or counter > with); NO_DIFFERENCE if it includes 0. Unit verdict: pass if at least one leg is
    ALIGNMENT_MATTERS; fail if every leg that clears the floor is NO_DIFFERENCE and at least one leg clears it; indeterminate if no leg clears
    the floor. A pass is a DISCOVERY per leg (in-sample on each leg''s Stage-0 window), never a gate: any filter needs its own holdout test.'
  proposal_mapping: 'pass -> per passing leg, a separate queue unit testing the alignment filter on an untouched holdout (M13) before any Tier-3
    proposal; plus step 5 (ML feature ablation, its own unit). fail -> alignment is recorded as not a lever on these legs under TREND-ALIGN-V1;
    step 5 still runs. indeterminate -> no change.'
  what_it_does_not_do: 'Changes no config, filters nothing, places no order. Describes Stage-0 backtest trades only (a live or paper book never
    establishes edge). One definition of trend (TREND-ALIGN-V1); a null does not refute alignment under another definition.'
  min_n: 30 trades per arm per leg
practice_precedent: 'M4 (rule registered before the run), M6 (net of the full cost stack), M12 (multiple comparisons: Holm across legs) in
  docs/reference/trading-and-model-practice-principles.md; trading with the higher-timeframe trend is a standard multi-timeframe practice.'
compute: cpu_light
value:
  bucket: information
  usd_at_stake_per_month: 100
  confidence: 0.2
  basis: 'stand-in: a per-leg slice filter candidate; not a P&L measurement.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 30
  why_runner: Committed corpora + public Binance Vision / Yahoo candles; CPU only.
  basis: 'INFERRED from the step-2 backfill (2,629 trades, candles for ~40 symbol/timeframe pairs, a few minutes once candles are cached).'
cleared_blocker:
