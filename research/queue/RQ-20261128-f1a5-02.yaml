title: 'ITERATION 5 of xsec-crypto (fail): does replacing the losing ALT SHORT leg with a BTC hedge (notional 1:1, or the long basket''s trailing beta) keep X1''s long selection and clear the discovery rule, net of fee + slippage + signed funding?'
