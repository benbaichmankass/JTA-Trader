  statistic: 'ARMS (3 incl. control, all counted; grid fixed in scripts/research/edge_portfolio_discovery.py ITER_GRIDS["f1a5"]["xsec"]): A0 = X1 control; HN = X1 long top 30% at +0.5 gross with a -0.5 BTCUSDT short (mode lh, hedge notional); HB = the same with the BTC short scaled by the long basket''s beta to BTC over the trailing 90 daily returns through the decision row, clipped to [0, 3], reading 1.0 when history is short (btc_hedge_ratio). Same quantiles, weights, rebalance, universe and cost stack. Per arm: net Sharpe, stress Sharpe, half Sharpes, bootstrap p05, DSR at N_cum = 30 (10 discovery + 7 d1f3 + 3 62e3 + 5 fa22-05 + 2 0104-06 + these 3).'
  rule: 'PASS iff at least one NON-control arm clears the UNCHANGED discovery rule: net Sharpe >= 0.5 AND stress (2x fee+slippage) Sharpe > 0 AND Sharpe > 0 in BOTH halves AND bootstrap p05 of annualised mean net > 0 AND DSR > 0.95 at N_cum = 30, on 2020-06-01..2024-06-30. FAIL iff the control computed and reproduced and no arm clears it. INDETERMINATE iff the control series is insufficient OR the control A0 net Sharpe misses the committed 1.325 by more than 0.01 (--expect-control-sharpe). By-year sums and side split are REPORTED (the 2021 share is the diagnostic read), not graded. Holdout not read; a PASS earns ONE holdout read, never a book.'
