programme: P6
kind: experiment
question: On 2020-06-01..2024-06-30 (Binance USD-M archive, point-in-time top-20, weekly), does the X1 long selection hedged with a BTC short (HN notional 1:1; HB the long basket's trailing-90d beta to BTC, clipped 0..3) clear the unchanged discovery rule at the cumulative trial count, against the X1 long-short control?
why_this_matters: 'xsec-crypto is an orphan (scripts/research/iteration_orphans.py 2026-11-28). The short leg lost in EVERY arm measured: X1 -0.23, RM1 -0.40, RM2 -0.69 (62e3-02), while the long leg earned +1.84..+1.99. Long-only X6 is no answer (Sharpe 1.01, halves 1.64 / 0.20): it is alt beta. Shorting individual alts carries squeeze and funding risk in a rising market; shorting BTC against the long basket removes the market leg without shorting the names most likely to squeeze. If the long selection has skill beyond beta, the hedged book shows it in both halves; if it is pure alt-beta (alts outrunning BTC in 2021), the hedged book collapses to the 2021 episode and fails, which says so too.'
