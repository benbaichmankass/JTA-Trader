  - --rule-id
  - RULE-RQ20261029-84EF-05-LONG-DAILY-PLATEAU
  - --data-dir
  - '{out_dir}/data'
  - --out
  - '{out_dir}'
  timeout_minutes: 330
  inputs:
    research_unit: RQ-20261029-84ef-05
