decision_rule:
  id: RULE-RQ20261024014226-SOLPBSTALEEXIT
  registered_at: '2026-10-24'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg sol_pullback_2h --grade replace, window 2020-07-01 .. 2026-10-15 23:59, 6 equal calendar folds by entry
    time, net of the full cost stack the harness resolves per venue (execution_costs.resolve_cost_policy, recorded per arm as cost_stack). Arms fixed now: A = the
    leg as declared in config/strategies.yaml; candidates S8, S12, S20. Per arm: n, net_total_r, max_drawdown_r, net R per fold.'
  rule: 'INDETERMINATE IF n(A) < 39 or IF every candidate arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C) > net_r(A) AND delta
    >= 0.02 R x n(A) AND net R(C) >= net R(A) in >= 4 of 6 folds AND maxDD(C) <= maxDD(A) x 1.35. PASS IF one or more pass: the best by net R is named and the follow-up
    is ONE confirmation unit on a disjoint partition (a PASS on one window is a discovery), then a live-producer check and a Tier-3 declare PROPOSAL with the mirror
    in the same PR, never a config edit. FAIL IF none passes with n(A) >= 39: this arm grid is closed on sol_pullback_2h for this window and the family is NOT retired;
    the record names the arm that moved closest and the next variant (the stale threshold at 0.0 R or 1.0 R). Thresholds and the arm grid are not changed after any
    result.'
  what_it_does_not_do: 'Edits no config and no roster, places no order, is not a promotion case. A stale exit is a bar-close exit lever: a PASS also needs a live
    producer (check the leg''s monitor) and a Tier-3 declare. The arm grid is the whole search.'
