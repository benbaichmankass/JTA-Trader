question: On sol_pullback_2h over the pinned window, does a stale exit (stale_exit_bars 8 / 12 / 20 with stale_exit_below_r 0.5, declared now) beat the declared exit
  A by >= 0.02 R/trade in >= 4 of 6 folds within the drawdown bar?
why_this_matters: 'Lane AUTHOR-FLOOR-1024 (live_strategy 8 of share 11 after the first 25 units). Sibling of the eth_pullback_2h stale-exit unit (RQ-20261024-0142-16):
  the matrix of exit_lever_ablation tokens by leg (2026-10-24) shows no stale_exit_bars arm on sol_pullback_2h, which has had direction-filter, ADX and skip reads
  only. Dead-money time is a capital-day cost; the registered arms test whether cutting it pays net of the full cost stack.'
power:
