  id: RULE-RQ20261127-fc31-01-FTTMC-ENTRY
  registered_at: '2026-11-27'
  registered_before_run: true
  baseline: 'RAW: the same LightGBM recipe, same origins, rows, tau and cost stack. Net of the full cost stack.'
  statistic: 'per 28-day window, mean actual net R per taken decision; d_w = fttmc - RAW over windows where both took >= 30 decisions; mean, sd, 95% t-interval (ml_entry_residual.decide_vs_raw).
    Matched-coverage read per window: fttmc_info.<side>.n_cal_b_matched vs n_cal_b_raw.'
  rule: PASS iff >= 10 paired windows AND mean d >= +0.06 R/decision AND the 95% t-CI lower bound > 0 AND fttmc pooled n >= 300. FAIL iff >= 10 paired windows AND
    mean d <= 0 AND the fttmc arm trained to its declared schedule on cuda on every window. INDETERMINATE otherwise; an unavailable, CPU-fallback, budget-cut or truncated
    arm is INDETERMINATE, never FAIL. Thresholds are not changed after any result.
  pass_action: a disjoint-window confirmation (pre-dev windows 2022-10..2025-09, its own unit) before any proposal; then a Tier-3 note on ML-ENTRY-FINETUNE (serving
    = mirror-published scores from a GPU host, zero torch on the money box).
  fail_action: record FAIL for FT-Transformer / FTT_CFG / v1 recipe / raw target / matched coverage in research/levers/ml-entry.yaml (families.deep_tabular); the
    family is not retired on one configuration (family review).
  what_it_does_not_do: Changes no served model or config. No architecture search. A PASS is not a promotion. The window was read before (declared, as f7c1-06).
  min_n: 10 paired windows with >= 30 decisions per arm; 300 pooled decisions
