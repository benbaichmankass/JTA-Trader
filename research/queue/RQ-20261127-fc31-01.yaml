question: Over the 13 monthly refits on 2025-10-01..2026-09-30 (as f7c1-06), with the FT-Transformer's per-side threshold matched on the held-out CAL-B slice to RAW's
  count above tau, is the paired per-window mean of (fttmc - RAW) net R per decision >= +0.06 with the 95% t-CI lower bound > 0, net of the full cost stack?
why_this_matters: 'D3 has ten learner/target arms within noise of RAW; f7c1-06''s FAIL was the only deep learner read, and it was confounded by coverage. This is
  the clean read: PASS keeps a deep learner on the D3 lever list (disjoint-window confirmation, Tier-3 note on ML-ENTRY-FINETUNE); FAIL records deep_tabular flat
  on this label at matched coverage.'
