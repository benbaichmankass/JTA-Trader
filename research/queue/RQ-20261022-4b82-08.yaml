question: RQ-20261022 queue unit 326f-11 and RQ-20261021-7c2b-14 test the pullback harness at DEFAULTS on 4h and 1h; the 1h defaults graded FAIL
  on the majors (RQ-20261006-005, -023, RQ-20261010-353c-16/-17/-18). Over 2020-06-01..2026-10-22 on 6 cells (BNBUSDT,DOGEUSDT,LINKUSDT,LTCUSDT,BCHUSDT,DOTUSDT)
