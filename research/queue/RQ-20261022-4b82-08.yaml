  >= 0.05 R/trade pooled? The pre-registered hypothesis is that a managed exit moves the 32% win-rate family above cost on the alt basket where
  the defaults are untested.
why_this_matters: 'Operator directive 2026-10-22: an idea that failed one test is not dead; it failed the first test. This unit is a registered
  VARIANT of that first test. First test: RQ-20261022 queue unit 326f-11 and RQ-20261021-7c2b-14 test the pullback harness at DEFAULTS on 4h and
  1h; the 1h defaults graded FAIL on the majors (RQ-20261006-005, -023, RQ-20261010-353c-16/-17/-18). DIAGNOSIS (one line): the default-parameter
  reads on the majors were ~flat-to-negative with a 32% win rate; the two failures that a managed exit (break-even floor, stale exit) addresses
  are losers that round-trip from +1 R and trades that go nowhere, and these are not in the defaults. Lane AUTHOR-FLOOR-1022 (research runnable
  floor 33 vs 65 at 17:40Z). Prior ids: RQ-20261021-7c2b-14, RQ-20261006-005, RQ-20261010-353c-16. theme new_strategy_prop was short in the 17:40Z
  health check.'
