id: RQ-20261026-ed1c-10
title: 'Path-state trail gate on trend_donchian: does ER/CHOP-gated tight trails beat the declared exit net of the full cost stack?'
status: done
cadence: once
roadmap:
- L-ATM
- M20
theme: regime
priority: 2
kind: experiment
question: On trend_donchian over the pinned window 2020-07-01..2026-10-15, does E25/E35 (efficiency-ratio below 0.25/0.35, armed at 1.5 R, 2.5 x ATR) and C75 (choppiness above 0.75), each also required
  to beat the UNCONDITIONAL tight trail UT, declared now, beat the declared exit A by >= 0.02 R/trade in >= 5 of 6 folds within the drawdown bar?
why_this_matters: 'Look-before-re-test (PLANNING.md S1): a grep of research/queue on 2026-10-26 shows no ER/CHOP-gated tight trails arm on trend_donchian; the lever''s sibling cells are RQ-20261026-90d3-04/-05.
  First-test cell on this leg; a FAIL closes this arm grid only. Lane RESEARCH-FLOOR-20261026 (runnable 32 < computed floor 61, MEASURED 13:30Z by check_research_queue_throughput/health). Operator 2026-10-22:
  an idea that failed one test is not dead.'
power:
  expected_n: 80
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'd=0.45 at alpha 0.05 / power 0.8 needs (1.96+0.8416)^2/0.45^2 = 38.8 -> 39 trades (the repo''s standing E35 floor). expected_n=80 is an ESTIMATE from sibling units on this leg family, NOT a measurement;
    the harness reports n(A) and below 39 the unit grades INDETERMINATE, never FAIL. Trade sequences autocorrelate: the floor is necessary, the calendar-fold majority carries the rest.'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ20261026ed1c10
  registered_at: '2026-10-26'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg trend_donchian --grade replace, window 2020-07-01 .. 2026-10-15 23:59, 6 equal calendar folds by entry time, net of the full cost stack the harness
    resolves per venue (execution_costs.resolve_cost_policy, recorded per arm as cost_stack). Arms fixed now: A = the leg as declared in config/strategies.yaml; candidates E25, E35, C75; control UT = the
    unconditional tight trail. Per arm: n, net_total_r, max_drawdown_r, net R per fold.'
  rule: 'INDETERMINATE IF n(A) < 39 or IF every candidate arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C) > net_r(A) AND delta >= 0.02 R x n(A) AND net R(C) >= net
    R(A) in >= 5 of 6 folds AND maxDD(C) <= maxDD(A) x 1.35 AND net_r(C) > net_r(UT) in >= 5 of 6 folds (so a PASS cannot be "any early action"). PASS IF one or more pass: the best by net R is named and
    the follow-up is ONE confirmation unit on a disjoint partition (a PASS on one window is a discovery; the denominator is the number of arms in this unit), then a live-producer check and a Tier-3 declare
    PROPOSAL with the mirror in the same PR, never a config edit. FAIL IF none passes with n(A) >= 39: THIS arm grid is closed on trend_donchian for this window and the family is NOT retired; the record
    names the arm that moved closest and the next variant. Thresholds and the arm grid are not changed after any result.'
  what_it_does_not_do: 'Edits no config and no roster, places no order, is not a promotion case. A PASS also needs a live producer for the lever (check the leg monitor) and a Tier-3 declare. The arm grid
    is the whole search: no arm is added after the run, and the baseline is the declared leg, not a tuned one.'
