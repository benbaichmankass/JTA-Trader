id: RQ-20261024-0142-02
title: 'Chop-gate lever-strength variant: at the near-miss threshold 0.75, does a tighter (2.0) or looser (3.0) tight multiple clear the bar on trend_donchian_sol_prop?'
status: queued
cadence: once
roadmap:
- L-ATM
- L-REGIME
- M20
theme: regime
priority: 2
kind: experiment
question: On trend_donchian_sol_prop, holding the chop gate at its 1d5c-04 near-miss setting (chop_6 > 0.75, peak_r >= 1.5), does the tight multiple 2.0 or 3.0 x
  ATR (declared now) beat the declared exit A by >= 0.02 R/trade in >= 4 of 6 folds within the drawdown bar, AND beat its matching ungated control (UT20 / UT30)?
why_this_matters: 'Lane AUTHOR-FLOOR-1024 (research runnable floor 34 vs 57 at ~11:50Z 2026-10-24; regime 4 vs share 13). Operator directive 2026-10-22: an idea that
  failed one test is not dead; it failed the first test. This unit is a registered VARIANT/EXTENSION of RQ-20261023-1d5c-04. DIAGNOSIS (hypothesis): C75 at mult 2.5
  was +3.16 R, 6 of 6 folds, DD 12.02 vs 12.10 and missed only the materiality bar; the lever''s strength (how hard it tightens) was never varied at the near-miss
  gate. One factor changes per arm (mult only), the gate and the arm R stay fixed.'
power:
  expected_n: 403
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d=0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo's standing E35 floor). expected_n=403 is an ESTIMATE from sibling units on this leg/window, not
    a measurement; below 39 the unit grades indeterminate, never FAIL.
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ20261024014202-SOLPROPCHOPSTRENGT
  registered_at: '2026-10-24'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg trend_donchian_sol_prop --grade replace, window 2020-07-01 .. 2026-10-15 23:59, 6 equal calendar folds
    by entry time, net of the full cost stack the harness resolves per venue (execution_costs.resolve_cost_policy, recorded per arm as cost_stack). Arms fixed now:
    A = the leg as declared in config/strategies.yaml; candidates C75M20, C75M30 ; ungated controls UT20, UT30. Per arm: n, net_total_r, max_drawdown_r, net R per
    fold.'
  rule: 'INDETERMINATE IF n(A) < 39 or IF every candidate arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C) > net_r(A) AND delta
    >= 0.02 R x n(A) AND net R(C) >= net R(A) in >= 4 of 6 folds AND maxDD(C) <= maxDD(A) x 1.35 AND net_r(C) > net_r of its matching UNGATED control (UT20, UT30:
    the same action on every trade the gate would reach, so a PASS cannot be ''any early action''). PASS IF one or more pass: the best by net R is named and the follow-up
    is ONE confirmation unit on a disjoint partition (a PASS on one window is a discovery), then a live-producer check and a Tier-3 declare PROPOSAL with the mirror
    in the same PR, never a config edit. FAIL IF none passes with n(A) >= 39: this arm grid is closed on trend_donchian_sol_prop for this window and the family is
    NOT retired; the record names the arm that moved closest and the next variant (arm R 1.0 or 2.0 at the better mult, or a 2-bar persistence on the gate). Thresholds
    and the arm grid are not changed after any result.'
  what_it_does_not_do: 'Edits no config and no roster, places no order, is not a promotion case. A PASS also needs a live producer for the lever (check the leg''s
    monitor) and a Tier-3 declare. The arm grid is the whole search: no arm is added after the run, and the baseline is the declared leg, not a tuned one. real-money
    prop leg.'
