  rule: 'Configs E1..E9 fixed in scripts/research/edge_etf_tsmom.py. PRIMARY = E5 (lookbacks 63/126/252 trading days, sleeve target vol 10%, max leverage 3, 63-day vol window, weekly rebalance, long-short,
    equal 1/11 sleeve share). PASS iff E5 net Sharpe >= 0.5 AND stress (2x cost) net Sharpe > 0 AND net Sharpe > 0 in BOTH halves AND bootstrap 5th-percentile of annualised mean > 0 AND DSR(E5; N=9) > 0.95,
    evaluated 2008-01-01..2024-06-30 (252-day annualisation). FAIL otherwise. Also REPORTED, not graded: the 2020-06..2024-06 sub-window and calendar-year returns. Costs: 2 bps per side per unit |delta
    weight| (commission-free ETFs), stress 4 bps; NO financing or borrow on shorts and PRICE-ONLY returns (committed closes are unadjusted: dividends excluded, understating long carry on bonds and equities,
    flattering shorts) - both stated limitations. Holdout (2024-07+) not read.'
  what_it_does_not_do: Does not read the holdout (2024-07-01 on; edge_data.MAX_MONTH makes it unloadable), touch config/strategies.yaml, rosters or sizing, or propose a live leg. A PASS is only a candidate
