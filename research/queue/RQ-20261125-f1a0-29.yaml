question: On the 8 dev folds, does the registered ml_entry recipe with 4 funding inputs added (own last funding, its 3-day mean and 90-print z,
  and the universe-mean funding, all as-of the decision bar's close) beat the same recipe without them by at least +0.0068 R/decision net of the full
  cost stack, AND beat the same 4 columns with their timestamps shuffled by +0.0068 (week-clustered t >= 2, >= 6/8 folds, >= 3/4 years)?
why_this_matters: ml_entry trades real money and its edge is thin; execution levers are exhausted, so only new information can move it. Funding
  is the positioning signal (crowded longs pay, and unwind) the price features do not see. The shuffled-timestamp placebo separates timing
  information from a mere change in feature count or distribution.
