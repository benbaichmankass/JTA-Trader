id: RQ-20261023-1d5c-08
title: 'Prop pace pullback at 2h on a SECOND alt basket (AVAX, NEAR, ATOM, FIL, TRX, ETC): direction + ADX floor, with and without a break-even floor'
status: queued
cadence: once
roadmap:
- L-PROP
theme: new_strategy_prop
priority: 2
kind: experiment
question: No pullback read exists on this basket at any bar. Over 2020-06-01..2026-10-22 on 6 cells (AVAX, NEAR, ATOM, FIL, TRX, ETC) at 2h, does any arm (DIA, DIAB)
  pass the pooled Stage-0 rule with breadth AND beat B by >= 0.05 R/trade pooled? Cells with a short history are recorded, not dropped.
why_this_matters: 'Operator directive 2026-10-22: an idea that failed one test is not dead; it failed the first test. This unit is a registered VARIANT/EXTENSION.
  Lane AUTHOR-FLOOR-1023B (research runnable floor 47 vs 59 at 18:45Z; regime 8 vs share 14, new_strategy_prop 7 vs 17). First test(s): RQ-20261006-005, RQ-20261010-353c-16
  (pullback 1h, FAIL) and RQ-20261022-4b82-08. DIAGNOSIS (one line, a hypothesis not a finding): the first alt basket (BNB/LINK/DOGE/LTC/BCH/DOT) is queued at 2h;
  a second, independent basket separates ''the family transfers to alts'' from ''it transfers to those six''; stated as a hypothesis'
power:
  expected_n: 700
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: Pooled floor 88 trades (d = 0.3 at alpha 0.05 / power 0.8, the repo's standing floor for this family of units); expected_n=700 is an ESTIMATE, not a measurement
    for these arms; below the floor the unit grades indeterminate, never FAIL.
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-RQ202610231D5C08-PB2H-B
  registered_at: '2026-10-23'
  registered_before_run: true
  statistic: 'scripts/research/harness_stage0.py --family pullback --timeframe 2h, arms fixed now: B=; DIA=--direction-filter=di;--adx-min=20; DIAB=--direction-filter=di;--adx-min=20;--be-floor-r=1.0;
    baseline B; per cell and pooled across 6 cells; flags --folds 6 --fold-majority 4 --n-floor 39 --pooled-n-floor 88 --breadth-frac 0.5 --baseline B --delta-r-per-trade
    0.05; cost = the harness venue-aware fee + slippage + funding stack (execution_costs.resolve_cost_policy), recorded per cell.'
  rule: 'Arms and thresholds are fixed now and are not changed after any result. A candidate PASSES iff it passes the pooled Stage-0 rule (pooled n >= 88, pooled
    net_r > 0, >= 4 of 6 calendar folds net positive, >= half of the powered cells pass) AND beats B''s pooled net R/trade by >= 0.05 R. PASS IF one or more candidates
    pass: the best by pooled net R is named and the follow-up is ONE confirmation unit on a disjoint window with the same statistic and bar (a pass on one window
    is a lead), then the prop/real-money SUPERSET ladder; never a roster edit. FAIL IF every candidate fails (n >= floor) -> this variant is closed on this window
    and the record names which arm moved closest, so the next variant is aimed; the family is NOT retired on one config. INDETERMINATE IF pooled n < 88 or fewer than
    half the cells measured (a fetch/harness fault is recorded per cell, never dropped).'
  what_it_does_not_do: Edits no config and no roster, places no order, is not a promotion case. A best-of-k arm is a LEAD (programme 03 rung S0-C), never a finding.
    Candles are Binance USD-M (a PROXY for Bybit linear); the funding term is a directionless magnitude (execution_costs P1); both are stated in the record. Does
    not pool with any committed record. NEAR/ATOM/FIL listings start after 2020-06; their cells are shorter and power is pooled.
compute: cpu_long
value:
  usd_at_stake_per_month: 100
  confidence: 0.15
  bucket: structural
  basis: 'stand-in: a Stage-0 read for the prop/real-money book; an estimate, not a measurement.'
routing:
