  statistic: exit_lever_ablation --grade stage0 --forming-1m-fetch --days 1100, arms A (config-exact) and H (--htf-long-sma-days 200) per leg per window; htf_native_grade.py
    applies the rule.
  rule: 'Multiple-testing guard: names the prior attempts on these windows (RQ-20261114-db1a-03 post-hoc HTF long filter PASS, RQ-20261114-db1a-02 ADX regime cell FAIL, RQ-20261114-db1a-01
    decision_bar FAIL, RQ-20261113-f251-07..23 per-leg levers FAIL). The filter is the SAME fixed one as db1a-03 (own-symbol prior completed daily close < 200-day SMA -> skip
    a long; shorts never gated); no parameter is chosen here. --days 1100 so the SMA200 has full history at the prior window''s start. UNIT PASS iff sum over graded legs of
    (H net_r - A net_r) > 0 on the record window AND > 0 on the prior window; FAIL iff graded and not; INDETERMINATE iff < 12 legs graded on both windows. PER-LEG PASS (its
    own record, never changes the unit verdict) iff H passes Stage 0 on the record window (net_r > 0, n >= the leg''s floor (30; trend_donchian_avax_4h 20), >= 3/4 folds positive)
    AND beats A there, AND on the prior window H net_r > 0 and > A''s; H under its n floor is indeterminate. No threshold is relaxed.'
  what_it_does_not_do: 'Changes no config, roster, order, live unit or evidence record. A per-leg PASS is a Tier-3 proposal to the operator. LIVE-PATH READ (for a faithful
    proposal): the live builder would fetch the symbol''s 1d candles from the leg''s venue feed (src.runtime.market_data.fetch_candles with ''1d''), take the last COMPLETED
    daily bar (yesterday''s close, never the forming day) and the mean of the last 200 completed daily closes, and refuse a long when close < SMA, re-read once per UTC day;
    this mirrors scripts/research/htf_daily_gate.py, whose daily close is the last intraday bar''s close on the same 00:00 UTC boundary.'
