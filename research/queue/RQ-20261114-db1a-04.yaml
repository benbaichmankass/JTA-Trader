id: RQ-20261114-db1a-04
title: 'DEMO-FLOOR harness-native HTF long gate: --htf-long-sma-days 200 inside the harness vs config-exact, 15 crypto demo-floor legs, record + year before, per-leg Stage-0
  read'
status: queued
cadence: once
kind: experiment
theme: live_strategy
priority: 1
roadmap:
- L-LADDER
question: With the daily-SMA200 long gate running INSIDE the harness (a skipped long frees the position for the next signal), does it improve the pooled net R of the 15 crypto
  demo-floor pullback/Donchian legs on the record year 2025-11-13..2026-11-12 AND the year before, net of the full cost stack, and which legs pass Stage 0 with it on the record
  year while holding on the year before?
why_this_matters: Manager GO 2026-11-14 07:15Z (b). RQ-20261114-db1a-03 passed POST-HOC (gated longs -88.1R n572 record, -5.3R n259 prior; pooled -142.3R -> -54.3R record,
  +106.1R -> +111.4R prior) but ignored path effects. A harness-native per-leg pass is a Tier-3 proposal to the operator; it also decides the operator's RETIRE-AVAX-PB-2H (now
  recommended HOLD pending this unit).
power:
  expected_n: 2656
  min_detectable_effect: 0.2
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'MEASURED in RQ-20261114-db1a-02/-03: 1,343 record and 1,313 prior trades over the 15 legs; 831 longs fell below the SMA200 post-hoc. Per leg n 34..183 per window;
    the per-leg Stage-0 floor is the leg''s f251 floor (30; avax_4h 20).'
  sd: null
  feasibility:
    source: none
    accrual_basis: Fixed in-hand windows; nothing accrues; Binance / Binance-vision covers them at run time.
evidence_class:
  holdout: in_sample
  claim: edge
