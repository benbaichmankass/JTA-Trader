id: RQ-20261101-c692-03
title: 'MANAGE decision model: does ONE pooled LightGBM model choosing HOLD / CLOSE / SL-to-breakeven / trail 1 ATR / TP +1 ATR at each 4h check-in
  keep held-out mean net R per trade >= 0 AND mean delta net R per non-HOLD action >= 0 vs hold-to-bracket?'
status: queued
cadence: once
theme: ml_health
priority: 1
roadmap:
- L-ML-LIVE
kind: experiment
practice_precedent: 'T1, M6 (docs/reference/trading-and-model-practice-principles.md): purged + embargoed walk-forward with a sealed held-out
  window; triple-barrier first-passage labels (Lopez de Prado 2018, ch. 3); docs/research/ml-decision-models-2026-11-01/DESIGN.md.'
question: Spec DESIGN.md section 4. On the held-out trades of the composed ENTRY (+ BRACKETS if passed) policy, at every 4h check-in, label each
  action by the trade final net R under that action minus under HOLD (same bars, same cost stack); a pooled LightGBM regressor per action on (market
  features, open R, bars held, distances to SL/TP in ATR, side); act iff the best predicted delta exceeds a margin chosen on dev only.
why_this_matters: 'Operator directive 2026-11-01 (row ML-DECISION-MODELS): ML decision makers live on real money as soon as possible; live bar
  "Point estimate >= 0", path "Straight to real money" (bybit_2 + mirror). This is the critical path: BRACKETS (c692-02) and MANAGE (c692-03)
  compose on top of it.'
decision_rule:
  id: RULE-RQ20261101-c692-03-MANAGE
  registered_at: '2026-11-01'
  registered_before_run: true
  statistic: Held-out mean net R per managed trade, mean delta net R per non-HOLD action vs hold-to-bracket, n trades, symbols; controls hold_to_bracket,
    matched random (200), best static (dev-only grid), trade-grouped bootstrap.
  rule: INDETERMINATE IF held-out trades < 300 OR distinct symbols < 10. PASS IF held-out mean net R per managed trade >= 0 AND mean delta net
    R per non-HOLD action >= 0. FAIL otherwise. A FAIL closes this action set / cadence / learner, not the family. Thresholds are not changed
    after any result.
  what_it_does_not_do: No sizing, no config change, no order. Reported comparators never gate.
  min_n: 300 held-out trades on >= 10 symbols
compute: cpu_long
