registration_addendum_2026_11_05:
  base_trades: frozen ENTRY (c692-01 recipe; tau read from its summary) opens a trade at the next bar open; static 2.0/4.0 ATR bracket (the dev-chosen static cell of c692-02), 24h time stop; one position per symbol, set defined by HOLD, so every comparison is PAIRED trade-for-trade.
  check_ins: bar closes 4,8,12,16,20 after the entry bar while the trade is alive; actions HOLD / CLOSE (next open) / BE (SL to entry, only if close > entry) / TRAIL (4-bar extreme - 1 ATR, ratchets, only if tightening and below close) / TPX (TP +1 ATR). A tightening at or above the close is UNAVAILABLE.
  window: dev = ENTRY walk-forward OOS trades 2022-01-01..2025-09-30 (MANAGE walk-forward folds 2023-01..2025-07, margin chosen on dev only, grid 0/0.02/0.05/0.10/0.15). Held-out = 2025-10-01..2026-09-30, first MANAGE read, claimed once via holdout_lock (model_id MANAGE-manage). The window is NOT fresh for ENTRY-family models (>= 3 prior variants; the claim reports variants_on_window). 2026-10 is spent for frozen ENTRY v1 and is NOT used. A forward confirm on 2026-11+ is filed separately (PI-20261105-EHARNESS-0001) as RECOMMENDED evidence, not a gate.
  proposal_eligible: reported, not the verdict. = verdict PASS AND delta vs hold-to-bracket > 0 with the trade-grouped paired bootstrap CI95 lower bound > 0. Only an eligible PASS becomes a Tier-3 proposal (a PASS whose managed policy only equals hold is not a case to change anything).
  not_read_rule: if the dev walk-forward delta vs hold is <= 0 at every margin, the held-out is NOT read and the verdict is fail (dev).
  disclosure: "DISCLOSURE (verbatim, 2026-11-05): a plumbing smoke of this harness (--arm manage, 9 symbols: ADAUSDT, BCHUSDT, BTCUSDT, ETCUSDT, ETHUSDT, LINKUSDT, LTCUSDT, TRXUSDT, XLMUSDT; pseudo held-out starting 2024-10-01) mistakenly included the sealed 2025-10-01..2026-09-30 window in its data, because E.fetch's default `end` is bound at import. What was printed to the lane: the tail of the smoke's manage-arm summary for those 9 symbols over 2024-10..2026-09 (by-month delta vs hold, giveback, the matched-random and single-static-action deltas, the action mix); the headline delta, CI and n were truncated from view and not read. The smoke's model was trained on rows before 2024-10-01, not the registered final fit. NOTHING (rule, margin, parameter, grid, action set) was chosen from it. The bug is fixed and guarded (smoke refuses data >= 2025-10-01). Every arm's verdict records peeked_symbols and the held-out delta ex those 9 symbols, so a reader can weigh it."
