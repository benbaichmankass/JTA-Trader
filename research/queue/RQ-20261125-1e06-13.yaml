    differ.
  pass_action: Record with 1e06-12 as out-of-time support for the unfiltered spec, and record the 1e06-09 failure as the filter's (it removed the profitable
    bear-market dips).
  fail_action: Record the pre-sample window as hostile to the trigger itself on these pairs; read jointly with 1e06-12 and author the next iteration from
    the per-pair / sub-period diagnosis.
