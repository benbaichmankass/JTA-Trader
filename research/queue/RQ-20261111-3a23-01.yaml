  - --control-features
  - confidence,direction_long
  - --learners
  - prior,numpy_logit
  - --min-leg-n
  - '300'
  - --folds
  - '4'
  - --embargo
  - '5'
  - --min-train-frac
  - '0.4'
  - --skip-quantile
  - '0.2'
  - --auc-gain
  - '0.05'
  - --lift-r
  - '0.05'
  - --out
  - '{out_dir}'
  timeout_minutes: 30
  inputs:
    research_unit: RQ-20261111-3a23-01
lands:
