id: RQ-20261024-f08c-07
title: 'Variant of eba2-12 / fd06-01 (banking failed on ada_pullback_2h): bank on a leg whose target is NOT capped at 4R (control A6 = wide target
  alone)'
status: queued
cadence: once
roadmap:
- L-ATM
- M20
theme: live_strategy
priority: 2
kind: experiment
question: 'On ada_pullback_2h, does banking 25-33% at +1.5/+2.0 R with the target widened from 4R to 6R replace the declared exit on net R in
  5 of 6 folds over 2020-07..2026-10, at the venue cost stack? A6 (target 6R, no bank) is the control; an A6 pass is reported as a TP-doctrine
  lead, not a bank result. DIAGNOSIS of the first test (eba2-12, fd06-01): MEASURED: fd06-01 B1 / B15 / B1E dR -56.97 / -42.80 / -68.30 and eba2-12
  P25 / P33 / PT dR -3.48 / -21.28 / -32.88, with the bank arms keeping the same 127 take_profit exits (n unchanged at 402), so the loss is the
  halved target payoff. MEASURED from the A-arm trade file: 253 stop exits of which only 21% ever reached 1 R (9.5% reached 1.5 R), against 127
  target hits at about +4 R. A bank trades the capped tail for stop-outs it can rescue, and the stops that reach the rung are too few. INFERRED:
  banking can only pay where the tail is long enough to leave room; hence widen the target. Class: genuinely no effect at THIS design (target
  capped at 4R). The harness caps the target at tp_cap_pct 0.099 of price, which may bind and make A6 byte-identical to A; the record shows the
  effective tp.'
why_this_matters: 'Operator rule 2026-10-22: a first-test fail is diagnosed and re-asked, never retired. Lane EXIT-FAILED-LEVERS-DIAG (2026-10-24),
  row EXIT-FAILED-LEVERS-DIAG, serves eba2-12, fd06-01. Diagnosis and evidence: docs/research/exit-failed-levers-diag-2026-10-24.md. Looked before
  authoring (PLANNING s1): the queue was grepped for the same leg and lever family; no queued or done unit asks this exact arm set. Parents: research/queue/RQ-20261022-eba2-12.yaml,
  research/queue/RQ-20261022-fd06-01.yaml.'
power:
  expected_n: 402
  min_detectable_effect: 0.14
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'n = 402 is the MEASURED baseline trade count of ada_pullback_2h in the parent verdict(s). Unpaired one-sample MDE = 2.8/sqrt(n) = 0.14
    sd. Arms share most trades, so the paired difference is far tighter than that (MEASURED in the diag doc: paired sd 0.06-0.5 R per entry);
    the unit''s bar is stated in R and is not claimed to be detectable at the unpaired MDE. A unit whose lever touches a handful of trades is
    reported with its differing-trade count.'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-F08C-07
  registered_at: '2026-10-24'
  registered_before_run: true
  statistic: scripts/research/exit_lever_ablation.py --grade replace on ada_pullback_2h, window 2020-07-01 .. 2026-10-15 23:59, 6 calendar folds,
    net_r per arm net of the harness venue-aware stack (fee 7.5 bps round trip, slippage 3.0 bps round trip, funding 1.0 bps per 8h window; MEASURED
    in the parent verdicts' cost_stack); baseline A = the leg as declared.
  rule: 'INDETERMINATE IF n(A) < 39, or IF every C arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C) > net_r(A)
    AND delta >= 0.02 R x n(A) AND folds_ge >= 5 of 6 AND maxDD(C) <= maxDD(A) x 1.35. PASS IF one or more pass: the best by net R is named and
    the follow-up is ONE confirmation unit on a disjoint partition (a PASS on one window is a discovery), never a config edit; before any Tier-3
    proposal the winner is re-run with stop fills gap-adjusted (see what_it_does_not_do). FAIL IF none passes: the declared exit stands for THESE
    arms on this leg; the idea is not retired (the operator''s 2026-10-22 rule) and the diagnosis in this unit decides the next variant. Thresholds
    are not changed after any result.'
what_it_does_not_do: 'Edits no config and places no order. Not a promotion case: a PASS is a discovery needing one disjoint-window confirmation.
  HARNESS CAVEAT (code-read 2026-10-24, scripts/backtest_pullback.py / backtest_trend.py): a stop or ratcheted trail that the bar trades through
  fills AT the stop price, not at a gap-open worse than it, and lever exits fill at the bar close; that flatters every arm in proportion to its
  stop exits, so it favours tight-trail arms. A PASS must be re-run gap-adjusted before any Tier-3 note. A wider target changes the TP doctrine
  surface (RQ-20261022-326f-08, bea9-*); this unit changes nothing in config.'
