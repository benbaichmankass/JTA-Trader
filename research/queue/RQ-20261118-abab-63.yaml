title: 'Second symbol holdout for the D55 prop-pace lead at 4h: does Donchian-55 / trail 6.0 beat Donchian-20 on QTUM/ZRX/BAT/RLC/KNC/CRV (a second population disjoint from the lead and from basket C)?'
status: queued
