question: On Binance USD-M 4h candles for QTUM/ZRX/BAT/RLC/KNC/CRV over 2020-06-01..2026-11-17, with the cost stack fixed, does D55 (donchian 55, trail 6.0) pass the pooled Stage-0 rule AND beat the D20
  baseline B by >= 0.05 R/trade, the same rule abab-01 applied to basket C?
why_this_matters: 'abab-01 (basket C) failed the fold clause while meeting the delta bar, so the 4h D55 lead is neither confirmed nor refuted. A second disjoint symbol holdout decides whether the programme
  node P5-RG1025-trend-pooled and the prop EV gate should carry D55 forward: if D55 beats B by >= 0.05 R/trade on two fresh populations the lead is two-population (still not a promotion case); if it fails
  again at a delta near zero it is a symbol fit. abab-01 (D55 vs D20 at 4h on basket C DASH/ONT/NEO/SNX/MANA/SAND, 2020-06..2026-11): pooled n=966, +43.0 R (+0.0446 R/trade), beats B by +0.0601 R/trade
  (the 0.05 bar is met), 4 of 6 cells pass, but 3 of 6 calendar folds positive (needs 4) and one-sided pooled t p 0.215; B pooled -19.7 R with one -77.1 R fold (2023-08..2024-09); D55 max drawdown 48.8
  R vs B 100.2 R. f679-03 (the lead, six perps, in sample): +0.1065 R/trade, 5 of 6 folds. Diagnosis: the direction and the drawdown benefit replicate at about half the size on fresh symbols but fold stability
  does not; one population cannot separate a weak real effect from noise, so a second disjoint population is the cheapest informative next read.'
