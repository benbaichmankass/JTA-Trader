    own venue-aware fee + slippage + funding stack resolved by execution_costs.resolve_cost_policy() (never a zero default).'
  rule: 'PASS iff D55 passes the pooled Stage-0 rule on this basket (pooled n >= 88, pooled net_r > 0, >= 4 of 6 calendar folds positive, >= half of the powered cells (n >= 39) pass) AND beats B by >= 0.05
    R/trade. FAIL iff D55 fails with pooled n >= 88 (configuration closed on this basket; family stays open; next test = the pooled paired read across the three populations, reported as pooling, not as
    a confirmation). INDETERMINATE otherwise (pooled n < 88, fewer than 2 powered cells, or under half the cells measured; a symbol that cannot be fetched is recorded per cell and counts against the half-the-cells
    floor). Regime-robustness clause (set before the run): the pooled result is net positive in at least 3 of 4 calendar years of the window (per-year table reported), no single year carries more than 50%
    of total net R, long-side and short-side net are reported separately and both >= 0, and at least 2 non-overlapping sub-periods are each net positive; a failure of this clause downgrades a PASS to INDETERMINATE
    (reported, never silently dropped). Thresholds are not changed after any result.'
  what_it_does_not_do: 'Edits no config and no roster, places no order, is not a promotion case, does not tune beyond the declared arms, and does not pool with any committed record. Candles are Binance
    USD-M (a PROXY for Bybit linear); funding is a directionless magnitude (execution_costs P1); a symbol listed after the window start contributes only its own history. PROP SUPERSET BAR: this unit supplies
    Stage 0 only; the prop EV/survival gate, a mechanical Stage-1 soak and Gate 2 all still apply and no roster is edited here.'
