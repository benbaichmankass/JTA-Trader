  min_rows: 1
iteration:
  subject: ada_pullback_2h
  subject_kind: strategy_leg
  from_result: RQ-20261114-db1a-04
  verdict_read: fail
  diagnosis: 'Operator 2026-11-14: the real-money ADA short peaked at +2.86R while the leg''s own chandelier trail had moved the stop only +0.47R past entry, about 3R of giveback exposed.
    The live-trade review picks max mean R, and hold beat a +2R lock by 0.14R, inside one SE (~0.26R), while the lock''s worst case was +1.29R vs hold''s -0.52R. The 2026-10-28 advice-only
    verdict pooled every tighten in every state. Across the demo floor, db1a-01/-02/-04 found no entry or regime lever that rescues the legs, and the exit side''s MFE-conditional lock
    is untested on these windows.'
  hypothesis: Locking (k-1)R once a trade has seen kR, k = 2, keeps more of the winners than it clips, net of cost, pooled over both windows.
  search: 'Fixed by the operator directive and the row: k in {2, 2.5}, lock k-1, plus the k=2 lock gated on TP within 0.5R. Harness flags: --be-floor-lock-r (ported to the trend harness)
    and --be-floor-tp-within-r (PR claude/profit-lock-flags).'
  attempt: 1
  due_by: '2026-11-21'
