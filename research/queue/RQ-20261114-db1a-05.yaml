decision_rule:
  id: RULE-PROFIT-LOCK-CONDITIONAL-20261114
  registered_at: '2026-11-14'
  registered_before_run: true
  statistic: exit_lever_ablation --grade stage0 --forming-1m-fetch --days 800, arms A (config-exact), L2, L25, L2T per leg per window on one feed; profit_lock_grade.py applies the rule.
  rule: 'Multiple-testing guard: names the prior attempts on these windows and legs (RQ-20261114-db1a-04 harness-native HTF gate FAIL, -03 post-hoc HTF filter PASS, -02 ADX regime cell
    FAIL, -01 decision_bar FAIL, RQ-20261113-f251-07..23 per-leg levers FAIL, RQ-20261113-f251-18 BE/trail at +1R on tlt) and the pooled 2026-10-28 tighten verdict (-0.097R over 981
    live tightens). Three lock arms are tested and all three are disclosed; the parameters are fixed by the operator''s directive and the row (k in {2, 2.5}, lock k-1, TP gate 0.5R),
    none chosen here. ARMS: L2 = --be-floor-r 2 --be-floor-lock-r 1; L25 = --be-floor-r 2.5 --be-floor-lock-r 1.5; L2T = L2 + --be-floor-tp-within-r 0.5 (the floor arms only while a
    resting TP sits within 0.5R of the extreme). The floor is armed off the since-entry peak (MFE), binds from the next bar (SL-first) and only ever tightens. UNIT PASS iff the PRIMARY
    arm L2''s pooled sum over graded legs of (L2 net_r - A net_r) is > 0 on the record window AND > 0 on the prior window; FAIL iff graded and not; INDETERMINATE iff fewer than 14 of
    the 18 legs are graded on both windows. L25 and L2T get the same pooled clause as records of their own and never change the unit verdict. PER-LEG PASS per arm (its own record) iff
    the arm passes Stage 0 on the record window (net_r > 0, n >= the leg''s floor (30; trend_donchian_avax_4h 20), >= 3/4 folds positive) AND beats A there, AND on the prior window its
    net_r > 0 and > A''s; under the n floor is indeterminate. No threshold is relaxed.'
  what_it_does_not_do: 'Changes no config, roster, order, live unit, live-trade-review policy or evidence record, and does not lift the advice-only status of live tightens. A per-leg
    pass is a Tier-3 exit-param proposal (exit-refinement skill: live parity check before any flip). LIVE-PATH READ: the live units ratchet the stop from position telemetry''s since-entry
    peak, the same quantity the harness''s MFE reads; an MFE-armed lock maps onto that ratchet, while the TP-gated variant also needs the live TP price, which the order package carries.
    Not modelled: intrabar order of peak vs stop within one bar beyond SL-first. The ADA trade that triggered the row is graded separately when it closes (row note).'
  baseline: each leg config-exact on its live decision bar (arm A), both windows, run in this unit.
compute: cpu_light
value:
  bucket: own_losses
  usd_at_stake_per_month: 800
  confidence: 0.2
  basis: 'stand-in: 4 real-money and 15 demo-floor legs, and an operator-directed manual lock on a real-money trade; not a P&L measurement.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 3.0
ml_consumer:
  not_applicable: 'Not an ML unit: an exit-lever test on rule-based legs.'
lands:
