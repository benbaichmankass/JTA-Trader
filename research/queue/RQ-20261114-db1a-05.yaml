id: RQ-20261114-db1a-05
title: 'CONDITIONAL PROFIT LOCK: once open >= kR stop to (k-1)R (k 2, 2.5) and a TP-near-gated k=2 variant vs config-exact, 18 rostered crypto pullback/trend legs (demo floor + real
  money), record + year before'
status: queued
cadence: once
kind: experiment
theme: live_strategy
priority: 1
roadmap:
- L-LADDER
question: Across the 18 rostered crypto pullback/Donchian legs, does locking profit once a trade has SEEN kR (stop to entry + (k-1)R; k = 2, the primary, and 2.5), or the k=2 lock armed
  only while the resting TP is within 0.5R of the extreme, improve pooled net R vs each leg config-exact on the record year 2025-11-13..2026-11-12 AND the year before, net of the full
  cost stack, and which legs pass Stage 0 with a lock while holding on the year before?
why_this_matters: 'Row PROFIT-LOCK-CONDITIONAL-TEST; manager 2026-11-14 09:07Z. Operator ~08:53Z on the real-money ada_pullback_2h short at +2.63R open (+2.86R peak) with its stop only
  +0.47R past entry: "there''s no way that we can leave this much R on the table"; the manager applied a directed +2R lock at 08:56Z. Tightens are advice-only since 2026-10-28 on a POOLED
  population (981 tightens, -0.097R mean) that never tested a lock CONDITIONAL on open >= 2R near the TP. A per-leg pass is a Tier-3 exit-param candidate (exit-refinement skill), including
  the real-money legs ada_pullback_2h, trend_donchian_sol_prop, trend_donchian_xrp_4h and trend_donchian_xrp_adx25. avax_pullback_2h is out of scope (operator keep_demo 2026-11-14: data
  only, no further research).'
power:
  expected_n: 2750
  min_detectable_effect: 0.2
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'MEASURED for 14 of the 18 legs in RQ-20261114-db1a-02/-04 (arm A, the 15 there minus avax_pullback_2h, about 2,650 trades over the two windows); the 4 real-money legs add an
    ESTIMATED ~100 per window (not yet measured on these windows). The lock only changes trades whose MFE reaches kR, so the effective n is that subset, which this unit does not measure;
    per-leg n floor 30 (trend_donchian_avax_4h 20), the f251 floors. avax_pullback_2h is excluded: operator 2026-11-14 RETIRE-AVAX-PB-2H answer keep_demo, kept on the demo for data with
    no further research effort.'
  sd: null
  feasibility:
    source: none
    accrual_basis: Fixed in-hand windows; nothing accrues; Binance / Binance-vision covers them at run time.
evidence_class:
  holdout: in_sample
  claim: edge
