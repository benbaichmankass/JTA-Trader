    baseline_value: 0
  - family: exit
    param: be_floor_lock_r
    values:
    - 1
    - 1.5
    baseline_value: 0
  - family: exit
    param: be_floor_tp_within_r
    values:
    - 0.5
    baseline_value: 0
  map_entries:
