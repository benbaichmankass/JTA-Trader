id: RQ-20261024-f08c-18
title: 'Variant of b7e1-01 (path-state giveback failed pooled over six mixed legs): DONCHIAN-4H legs only, replication on legs the one passing
  leg is not part of'
status: queued
cadence: once
roadmap:
- L-ATM
- M20
theme: live_strategy
priority: 2
kind: experiment
question: 'At any bar of a trade already >= 1 R up on the trend_donchian 4h legs eth, xrp, ada, avax (NOT sol_4h, where b7e1-01 passed), does
  a trailing 6-bar path state predict ''gives back >= 1.5 R from here'' beyond open R, peak R, bars-since-peak, bars-in-trade and room-to-stop,
  by >= 0.01 log-loss in >= 4 of 6 folds? DIAGNOSIS of the first test (b7e1-01): MEASURED in RQ-20261022-b7e1-01: pooled ll_gain +0.0090 (5 of
  6 folds, AUC 0.805 -> 0.813) just under the 0.01 bar. MEASURED per leg: trend_donchian_sol_4h PASSED (ll_gain +0.0268, 5 of 6 folds, AUC 0.664
  -> 0.699, 103 trades reaching the peak) while eth_pullback_2h -0.0026 (1 fold) and avax_pullback_2h -0.0033 (3 folds) failed and three legs
  (sol_pullback_2h, ada_4h, avax_4h) were indeterminate on thin per-leg reach (54-90 trades). Class: wrong legs (the pooled fail mixes pullback
  legs, where the state carries nothing, with a 4h trend leg where it does) and underpowered per leg. Pooling the four 4h Donchian siblings gives
  about 288 reaching trades (94 + 23 + 90 + 81, MEASURED in b7e1-01/-02 and from the xrp_4h A-arm trade file).'
why_this_matters: 'Operator rule 2026-10-22: a first-test fail is diagnosed and re-asked, never retired. Lane EXIT-FAILED-LEVERS-DIAG (2026-10-24),
  row EXIT-FAILED-LEVERS-DIAG, serves b7e1-01. Diagnosis and evidence: docs/research/exit-failed-levers-diag-2026-10-24.md. Looked before authoring
  (PLANNING s1): the queue was grepped for the same leg and lever family; no queued or done unit asks this exact arm set. Parents: research/queue/RQ-20261022-b7e1-01.yaml,
  research/queue/RQ-20261022-b7e1-02.yaml.'
power:
  expected_n: 288
  min_detectable_effect: 0.16
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'n = 288 is the MEASURED baseline trade count of trend_donchian_eth_4h, trend_donchian_xrp_4h, trend_donchian_ada_4h, trend_donchian_avax_4h
    in the parent verdict(s). Unpaired one-sample MDE = 2.8/sqrt(n) = 0.16 sd. Arms share most trades, so the paired difference is far tighter
    than that (MEASURED in the diag doc: paired sd 0.06-0.5 R per entry); the unit''s bar is stated in R and is not claimed to be detectable at
    the unpaired MDE. A unit whose lever touches a handful of trades is reported with its differing-trade count.'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-F08C-18
  registered_at: '2026-10-24'
  registered_before_run: true
  statistic: scripts/research/path_state_giveback.py (the SAME features, label and stop-room control as RQ-20261022-b7e1-01..03) on trend_donchian_eth_4h,
    trend_donchian_xrp_4h, trend_donchian_ada_4h, trend_donchian_avax_4h, window w=6, min_peak 1.0 R, X in [1.5], 6 calendar folds by entry time,
    net of the harness venue-aware stack (fee 7.5 bps round trip, slippage 3.0 bps round trip, funding 1.0 bps per 8h window; MEASURED in the
    parent verdicts' cost_stack); ll_gain = OOS log-loss(baseline) - log-loss(full), pooled.
  rule: 'INDETERMINATE IF trades-with-a-state < 100. PASS IF ll_gain >= 0.01 AND fold wins >= 4 of 6 AND pooled OOS AUC(full) >= AUC(baseline),
    at the SAME bar as b7e1-01..03 (thresholds are not relaxed). PASS: the path state carries information beyond stop room on this population,
    and a gated lever unit is pre-registered on it next (never a config change). FAIL otherwise: no gated lever is queued on this feature set
    for this population; the idea is not retired. Per-leg results are REPORTED, not graded. Thresholds are not changed after any result. '
what_it_does_not_do: 'Edits no config and places no order. Not a promotion case: a PASS is a discovery needing one disjoint-window confirmation.
  HARNESS CAVEAT (code-read 2026-10-24, scripts/backtest_pullback.py / backtest_trend.py): a stop or ratcheted trail that the bar trades through
  fills AT the stop price, not at a gap-open worse than it, and lever exits fill at the bar close; that flatters every arm in proportion to its
  stop exits, so it favours tight-trail arms. A PASS must be re-run gap-adjusted before any Tier-3 note. A label study: edits no config, places
  no order. Harness paths are not live paths. States within a trade are autocorrelated, so the effective n is trades, not states.'
