decision_rule:
  id: RULE-DFI2-TD1H-DIR-20261113
  registered_at: '2026-11-13'
  registered_before_run: true
  statistic: exit_lever_ablation --grade stage0, one run per arm per window (Binance, forming via --forming-1m-fetch); timeframe_lever_grade.py --family direction
    --prefix arm_ --confirm-prefix pre_.
  rule: 'AM-ML multiple-testing guard (2026-11-13 18:50Z): successive levers on one window fork the paths, so this rule NAMES the leg''s prior lever attempts on the
    record window and ALSO requires the pass to hold on the equal-length window before the record window, which no diagnosis or lever pick read. No fold bar is relaxed
    from the leg''s first DEMO-FLOOR-ITER unit. Prior lever attempts on this window: RQ-20261113-f251-01 (forming baseline, -10.57R), RQ-20261113-f251-05 (timeframe
    2h / 4h -- FAIL). PASS iff the candidate passes its own Stage 0 on the record window (net_r > 0, n >= 30, >= 3/4 folds positive) AND beats the baseline arm''s
    net_r there, AND on the confirmation window 2024-11-01..2025-10-31 (the equal-length window BEFORE the record window, read by no diagnosis or lever pick) its
    net_r is > 0 and above the baseline arm''s. FAIL iff graded and either clause fails. INDETERMINATE otherwise (a run wrote no verdict, the baseline did not run,
    the candidate under its n floor on the record window). Arms, windows, folds and floors are fixed now.'
  what_it_does_not_do: Changes no config, roster, order or evidence record. A PASS is a data-backed Tier-3 proposal routed to the manager via AM-ML (the leg stays
    on the demo floor until then); a FAIL is recorded on the lever map and the next untested family is picked.
  baseline: trend_donchian_1h config-exact, forming, both sides, re-run in this unit on both windows.
