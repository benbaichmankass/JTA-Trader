decision_rule:
  id: RULE-RQ-20261112-cdb2-07
  registered_at: '2026-11-12'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --grade replace on slv_trend_1h, Dukascopy SLV CFD 1h (INSTRUMENT_ETF_CFD_US_SLV_US_USD),
    window 2019-01-01..2025-04-22 23:59, one continuous harness pass per arm, net of the full cost stack the harness resolves for an Alpaca equity
    (fee 0 + 5.0 bps RT slippage + 0 funding). Arms: A = tp_r 50 with every other key as declared (atr_stop_mult 1.5); C1 = the same with atr_stop_mult
    1.0. Per arm: n, net R, maxDD; 4 equal calendar folds by entry time; folds where net_r(C1) >= net_r(A).'
  rule: INDETERMINATE IF n(A) < 100 or the producer failed. PASS (C1 replaces A) IF net_r(C1) > net_r(A) AND C1 >= A in >= 3 of 4 folds AND maxDD(C1)
    <= 1.10 x maxDD(A). FAIL otherwise (A stands). Thresholds are not changed after any result.
  on_pass: Report to AM-TRADING as the evidence for a Tier-3 proposal to set atr_stop_mult 1.0 on slv_trend_1h (with the sibling unit's reading
    beside it). This lane edits no config.
  on_fail: 'Report to AM-TRADING: the live atr_stop_mult 1.5 stands on this span; C1''s holdout PASS does not carry to pre-2025 data.'
  what_it_does_not_do: 'Edits no config, roster or record; places no order. Not a fresh span for A: atr_stop_mult 1.5 was chosen by the 2026-08-26
    E35 run on ~2021-08..2026-08, which overlaps this window, so A has an in-sample advantage here. That biases the test AGAINST C1. Bars: the
    SLV CFD, a proxy for the ETF tape. The cost stack''s 5 bps slippage is a placeholder.'
