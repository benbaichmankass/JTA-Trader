  basis: 'ESTIMATE: ~300 trades per arm on SLV CFD 1h over ~6.3 years (RQ-20261112-5ab1-03 T6 cadence: n 438 over 2018-06..2026-10). sd ~2.94
    R/trade from the SLV-EVIDENCE-RECONCILE figures. MDE for either arm''s own mean, two-sided alpha 0.05, power 0.8: 2.80 x 2.94 / sqrt(300)
    = 0.475 -> 0.48 (gate floor ~294 <= 300). The two arms trade different sets, so the comparison is graded by the replace rule (net R, folds,
    drawdown), not by a paired significance test. Floor 100.'
