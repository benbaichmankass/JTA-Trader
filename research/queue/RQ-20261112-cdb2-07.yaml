  = atr_stop_mult 1.0 from 5 configurations on discovery 2025-04-23..2026-04-30 and confirmed it on the held-back span (n 26, +18.28 R, read once,
  at tp_r 50), so the PASS belongs to C1, not to the live config. On SLV CFD 1h bars over 2019-01-01..2025-04-22, which precede C1''s discovery
  window, at tp_r 50, net of the full cost stack: does C1 replace A?'
why_this_matters: 'Manager decision 2026-11-12 19:37Z (relayed by AM-TRADING): the leg trades its current params, and the first iteration unit
  is C1 vs those params. tp_r 50 is the config on main today and the exact config C1 was confirmed on. Sibling unit RQ-20261112-cdb2-06 reads
  the same pair at the other tp_r.'
