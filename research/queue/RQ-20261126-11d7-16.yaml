id: RQ-20261126-11d7-16
title: 'COST ITERATION 2 of tlt_pullback_1h (entry): at the measured 26 bps round trip, does a post-only limit entry at the signal close (rest 1, 2 or 3 bars) turn the leg net-positive
  in >= 3 of 4 folds?'
cadence: once
theme: live_strategy
priority: 1
kind: experiment
question: On tlt_pullback_1h over TLT 1h 2025-06-02 .. 2026-11-11 at --slippage-bps-roundtrip=26, does any limit-entry arm (expire 1, 2 or 3 bars, maker/taker fees 0 on Alpaca, half
  the round-trip slippage on the taker exit) beat the market-entry S26 baseline by >= 27 R (so net R > 0), in >= 3 of 4 folds, with no worse drawdown and n >= 39?
why_this_matters: 'tlt_pullback_1h is a real-money alpaca_live leg that FAILED the measured-cost reprice (RQ-20261119-f2a4-07: S26 net -26.2 R, n 49, 0/4 folds). Iteration 1 (RQ-20261125-11d7-01)
  read the stop/pullback/TP/session levers; the entry lever was untried because the pullback harness had no limit entry. It has one now (#28989, closed-bar path, mirrors ict_scalp):
  a limit at the signal close pays the spread on one side only (half the round-trip slippage on the taker exit) and fills only on a trade-through, so it also filters entries. The cost:
  adverse selection (winners that never dip never fill). PASS gives the manager a Tier-3 declare proposal; FAIL closes THESE arms at THIS window and leaves the levers map open (regime_gating,
  symbol_set untested, forming-path limit filed as PULLBACK-ENTRY-MODE-LIMIT-FORMING).'
power:
  alpha: 0.05
  basis: 'ESTIMATE: S26 n=49 on this window; limit arms fill fewer signals, so n will be lower. Below 39 an arm is INDETERMINATE, never FAIL.'
  design: one_sample
  effect_units: sd
  expected_n: 49
  feasibility:
    accrual_basis: Re-measurement on freshly fetched public candles over a pinned window; nothing accrues.
    source: none
  min_detectable_effect: 0.45
  power: 0.8
decision_rule:
  id: RULERQ20261126-11d7-16
  registered_at: '2026-11-26'
  registered_before_run: true
  statistic: 'scripts/research/exit_lever_ablation.py --leg tlt_pullback_1h --grade sweep, window 2025-06-02 .. 2026-11-11, 4 calendar folds, every arm carries --slippage-bps-roundtrip=26.
    Arms fixed now: S26 (market entry, baseline); LE1 --entry-mode=limit --limit-expire-bars=1; LE2 --limit-expire-bars=2; LE3 --limit-expire-bars=3, each with --maker-fee-bps=0 --taker-fee-bps=0
    (Alpaca equities charge no commission). Limit arms fill only when a bar''s low trades strictly below the signal close within the expiry; the fill bar is stop-only; unfilled signals
    are counted. One lever (entry mode) per arm. Per arm: n, net R, maxDD, net R per fold, fill rate (limit_fill_rate in the arm''s params).'
  rule: 'INDETERMINATE IF n(S26) < 39 or the producer fails. A candidate C PASSES iff net_r(C) - net_r(S26) >= 27 R (the S26 record is -26.2 R, so a pass means net R > 0 at 26 bps) AND
    maxDD(C) <= maxDD(S26) AND C out-earns S26 in >= 3 of 4 folds AND n(C) >= 39 (fewer trades is INDETERMINATE for that arm, never a pass). PASS if one or more pass: the best by net
    R is named, the denominator is 3 arms, and S53 is then re-run on that arm and reported (never graded) before a Tier-3 declare PROPOSAL. FAIL IF none passes with n(S26) >= 39: these
    arm settings are closed at this window and the lever FAMILIES stay open (scripts/research/family_retirement_policy.yaml). Reported, never graded: fill rate per arm and the mean R
    of the unfilled signals as if filled at market (the adverse-selection read). Thresholds and arms are not changed after any result.'
  regime_robustness: Per-fold net R table for every arm is reported with the result and is part of the rule above. Set before the run.
  what_it_does_not_do: 'Edits no config, roster or account mode and places no order. Both legs stay live (operator 2026-11-25: no demotion until iterated and nothing is left to try).
    Not a promotion case; a PASS is a Tier-3 declare PROPOSAL for the manager. Closed-bar path only: the live decision is on the forming bar, so a PASS is evidence for building the forming-path
    version, not for a live change.'
practice_precedent: 'T3 (docs/reference/trading-and-model-practice-principles.md): cost measured, not assumed; M4 every arm counted'
