  registered_at: '2026-11-24'
  registered_before_run: true
  baseline: the registered recipe on the same folds, rows, tau and cost stack
  statistic: 'scripts/research/ml_entry_fix_arms.py --arm lim_fallback (lim_labels fallback=True): the market arm''s taken decisions per fold;
    delta = pooled mean net R per decision with limit-or-fallback entry - the same rows at market; week-clustered influence se; folds/years vs
    market. Fill rate, filled vs fallback net R, and the market R of filled vs unfilled decisions reported per fold. The random-thinning
    control is computed and REPORTED, not gating (every decision trades here).'
  rule: PASS iff arm n >= 3000 AND delta(arm - market entry) >= +0.0068 AND t >= 2.0 AND folds_better >= 6 of 8 AND years_positive >= 3 of
