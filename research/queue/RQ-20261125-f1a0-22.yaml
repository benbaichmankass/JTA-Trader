  from_result: RQ-20261125-f1a0-21/45518523469
  verdict_read: indeterminate
  diagnosis: 'f1a0-21 (lim_paired, run 45518523469) was INDETERMINATE: +0.0068 R/decision vs market on the same 52,029 decisions (t 0.92, 6 of 8 folds, 3 of 4 years), +0.0121 vs random thinning (t 2.48). Every fold showed adverse selection: the decisions whose limit FILLED were market losers (-0.05..-0.17 R at market) and the ones that did NOT fill were winners (+0.12..+0.37 R). The limit earned ~0.125 R of price plus ~0.02 R of cost on each fill but forfeited the runaway winners. A market fallback when the limit is still unfilled after 4 h keeps those winners (at a worse, later price) while fills keep the improvement.'
  search: 'one fixed policy: the f1a0-17 limit (0.5 ATR14, 4 x 1h bars, strict fill, maker entry) plus a market fallback at bar t+5 open when unfilled
    (taker both sides, full slippage); LGB_PARAMS, FEATURES and the SL 4 / TP 6 / 24 h labels unchanged.'
  levers:
  - entry
  map_entries:
  - research/levers/ml-entry.yaml
  attempt: 15
  due_by: '2026-12-01'
question: On the 8 dev folds, on exactly the decisions the SL 4 / TP 6 / 24 h refit takes with market entry, is mean net R per decision with a
  post-only limit 0.5 ATR14 better than bar t+1's open (4 h, strict fill, maker fee) that FALLS BACK to a market entry at bar t+5's open when
  unfilled at least +0.0068 above plain market entry (week-clustered t >= 2, >= 6/8 folds, >= 3/4 years)?
why_this_matters: Cost per R binds; the entry order is the remaining cost term, and a pullback fill also improves the price. The random-thinning
  control separates the fill's selection from mere trade reduction.
