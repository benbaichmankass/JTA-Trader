title: 'ml_entry LIMIT ENTRY WITH MARKET FALLBACK: on exactly the SL 4 / TP 6 refit''s market-entry decisions, does a post-only limit 0.5
  ATR better (4 h, maker fee) that falls back to a market entry when unfilled beat plain market entry by +0.0068 R/decision?'
