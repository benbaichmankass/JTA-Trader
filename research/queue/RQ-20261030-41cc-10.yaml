# Hand-authored 2026-10-30 by lane RESEARCH-AUTHOR-SLO-20261030 (Tier 1), dispatched by Manager Session 2026-10-30b. Decision rule registered BEFORE any runner run. Gates: none.
id: RQ-20261030-41cc-10
title: 'Calendar event types, study (ppi): does the ppi_mom surprise vs the PIT survey consensus predict IWM forward returns at 1-5 trading days?'
status: done
cadence: once
theme: macro
priority: 3
kind: experiment
question: 'Using survey-consensus point-in-time rows (live feed plus survey backfill: 140 DISTINCT ppi_mom releases with a defined surprise, MEASURED
  2026-10-26 as distinct scheduled_for dates over comms/macro/econ_calendar_snapshots.jsonl + comms/macro/econ_calendar_snapshots_survey_backfill.jsonl,
  status=resolved, surprise not null), is Spearman(surprise = actual - consensus, forward IWM return) significant at 1, 3 or 5 trading days after
  the release at |t_eff| >= 3.0 (Bonferroni over 3 horizons x 11 sibling calendar-class studies), with the expected NEGATIVE sign (hotter producer
  prices are bad for risk assets)?'
why_this_matters: 'Instrument-transfer of the one calendar class with repeated PASSes (ppi_mom: 4a4c-01/-02, de02-04, a1f3-17, 4795-01 on ES=F/SPY).
  IWM is a different liquid instrument on the SAME 140 releases, so it is correlated with the parent: it counts as ONE more trial in the ppi_mom
  family (denominator stated in the Bonferroni line), not an independent confirmation. Lane RESEARCH-AUTHOR-SLO-20261030, runnable floor supply.
  Prior: CALENDAR-EVENT-TYPES (operator 2026-10-26: expand the calendar''s event types): the `ppi` class ships collected and logged at weight
  0 on the trade path (shadow class; scripts/macro/econ_calendar_data.py::SHADOW_KIND_TO_NEWS_CLASS). This is the measurement that must precede
  any non-zero weight. Sibli'
power:
  expected_n: 140
  min_detectable_effect: 0.32
  effect_units: sd
  design: one_sample
  alpha: 0.01
  power: 0.8
  basis: 'Unit = one distinct release with a defined survey surprise (140, MEASURED 2026-10-26 over live + survey snapshots). Fisher-z: detecting
    rho at the registered |t| bar 3.0 (two-sided alpha 0.0027, Bonferroni over 3 horizons x 11 sibling studies) with power 0.8 needs atanh(rho)
    >= (3.0+0.8416)/sqrt(n-3), i.e. rho >= 0.32 at n=140. A FAIL therefore means ''no effect >= ~0.32 sd at daily-close resolution'', not ''no
    effect''. Releases are monthly or longer apart so horizon-5 windows do not overlap; ic_t_eff is graded anyway. The queue power gate only tabulates
    alpha 0.01, so `power.alpha` is declared 0.01 (looser than the registered bar); `min_detectable_effect` is computed at the STRICTER |t| bar
    3.0, so the gate''s floor is conservative against the real rule.'
  feasibility:
    source: none
    accrual_basis: n is a fixed historical backfill, not an accrual; the run prints releases, releases_with_value and price_bars so the bound
      is MEASURED and a short join lands INDETERMINATE, never padded.
decision_rule:
  id: RULERQ2026103041cc10
  registered_at: '2026-10-30'
  registered_before_run: true
  statistic: Overlap-corrected Spearman t (ic_t_eff) of surprise vs forward IWM return at horizons 1, 3, 5 trading days (scripts/macro/econ_event_study.py
    event_study, merged live+survey snapshots), graded by scripts/research/macro_event_study_run.py grade() with the CLI flags below.
  rule: 'PASS IF at some horizon in {1,3,5} with n >= 100, |ic_t_eff| >= 3.0 AND the IC sign is negative. FAIL IF every horizon has n >= 100 and
    none reaches the bar in the registered direction (a significant wrong-sign horizon is reported, not a pass). INDETERMINATE IF any horizon
    has n < 100. no_data/producer_failed IF the price panel is empty or no release has a defined surprise: a route fault, not a verdict.'
  min_n: 100 joined releases per horizon.
  what_it_does_not_do: A PASS is evidence for a weight-setting proposal (Tier 3, operator-gated; costs, a placebo, a sub-period split and the
    naive-floor check still owed), not a weight. Sets no weight, touches no config or order path. Daily closes cannot see the intraday reaction.
