decision_rule:
  id: RULE-DFI3-TD1H-CHOP-OFFCELL-20261113
  registered_at: '2026-11-13'
  registered_before_run: true
  statistic: 'regime_cell_walkforward.py --regime chop --forming-1m-fetch on each pinned window (the forming replay, the router''s ADX-14 regime primitive); regime_cell_lever_grade.py
    over both: the cell verdict (FOLD_PANEL 3/4/5 *_stable_drag) plus the gated book''s Stage 0.'
  rule: 'AM-ML multiple-testing guard (2026-11-13 18:50Z) + the regime-selectivity skill. Prior lever attempts on the record window: RQ-20261113-f251-01 (forming
    baseline, -10.57R), RQ-20261113-f251-05 (timeframe 2h / 4h -- FAIL); on the closed bar, entry (donchian 40/55, RQ-20261104-005), exit (trail_decay / trail_state
    / be_floor / atr_stop_mult / tp_r) and filter (adx_min 25 -- backtest-only -- adx_max, vol_skip_above) tests on the lever map. The cell gates BOTH sides (registered
    now, not picked from the result). PASS iff: R1 each gated side is *_stable_drag in the chop cell on the record window (pooled < 0 and strict majority-negative
    under every FOLD_PANEL member -- no cosmetic cell); R2 the book WITHOUT the cell passes Stage 0 on the record window (net_r > 0, n >= 30, >= 3/4 equal calendar
    folds positive -- the same fold bar as f251-05); R3 its net_r beats the ungated book''s; C1 on the confirmation window 2024-11-01..2025-10-31 the chop cell''s
    net R is < 0; C2 there the gated book''s net_r is > 0 and above the ungated book''s. FAIL iff all are measured and one fails. INDETERMINATE when a run errored,
    a gated side is under the walk-forward''s n floor, or the gated book is under n 30. Registered before any run on either window (one local tooling smoke on 2026-09-01..10-31,
    n 30 / chop n 11, checked the forming walk-forward path and does not alter the rule).'
  what_it_does_not_do: Changes no config, roster or order. A PASS is a Tier-3 regime_policy proposal (one 1-D cell, the existing router path -- not a new gate) routed
    to the manager via AM-ML; the operator flips. A FAIL is recorded on the lever map; the next family is sizing_vs_cost, which waits for a measured venue cost.
  baseline: trend_donchian_1h ungated, forming, re-run in this unit on both windows (f251-01 read -10.57R over n 184 on the record window).
