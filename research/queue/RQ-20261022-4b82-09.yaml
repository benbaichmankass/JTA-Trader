  DIAGNOSIS (one line): squeeze loses 0.07-0.20 R/trade at 1h/15m (BTC 15m -0.1991 R n=2182; XRP 1h -0.0688 R n=552) and cost drag falls with
  bar length; 2h is the unmeasured middle between the failing 1h and the queued 4h. Lane AUTHOR-FLOOR-1022 (research runnable floor 33 vs 65 at
  17:40Z). Prior ids: RQ-20261006-006, RQ-20261006-024, RQ-20261022-326f-12. theme new_strategy_prop was short in the 17:40Z health check.'
