# scripts/research/iteration_subjects.yaml -- the NON-STRATEGY subjects of the one research loop (lane RESEARCH-ITERATE, 2026-11-01).
#
# OPERATOR, 2026-11-01 ~12:59Z (verbatim): "first, these rules apply to MLs as well, not just strategies or live reviews. second,
# if the data doesn't pass, it goes back into research for improvments and testing. THere is no other pipeline for underperforming
# strategies/mls."
#
# Gates this adds or changes: none. This file is an INPUT LIST for scripts/research/iteration_orphans.py (report-only). It decides
# nothing about what trades; a subject listed here is a thing that must have a live research iteration while it is not on real money.
#
# Strategy legs are NOT listed: they are DERIVED from config (scripts/ops/strategy_status.py, status `testing`), so the list cannot
# drift from the rosters. ML decision heads and live-review action classes have no machine-readable roster of their own, so they are
# named here, each with the record its current verdict comes from. Add a subject when a new head or class appears; remove one only
# when it is on real money by record (then its demotion signal, not this loop, watches it) or retired by a family-review record
# (research/family_reviews/, scripts/research/family_retirement_policy.yaml).
#
# verdict vocabulary: pass | fail | indeterminate | pending (no graded test yet). `basis` is where the verdict was read.
