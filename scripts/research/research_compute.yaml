# scripts/research/research_compute.yaml -- the ONE place research compute is described (RESEARCH-ROUTER, 2026-10-13).
#
# A queue unit declares WHAT KIND of test it is (`compute: <class>`) and, optionally, what it is WORTH
# (`value:` block). Everything below -- which backend runs it, how much of that backend may be busy,
# how a due unit ranks against another -- is decided HERE by scripts/research/compute_router.py and
# scripts/research/dispatch_queue.py, with no Claude tokens. Claude authors the unit; it never picks a
# runner by hand. A unit that still names an explicit `run.workflow` keeps it (back-compat): `workflow:`
# beats `compute:`.
#
# Authoring contract: research/queue/PLANNING.md § "Compute class and value" and
# .claude/skills/research-ops/SKILL.md § E.
#
# Not a gate on trading: this decides where RESEARCH runs. Nothing here touches a book, a roster or a risk cap.

backends:
  github_runner:
    workflow: research-script-run.yml
    max_concurrent: 4          # OPERATOR 2026-11-03 ~22:00Z (D5 option A, COMPUTE-ALLOCATION-2026-11-03): 10 -> 4 so research stops crowding the 20-slot hosted pool merge path; kaggle_first left at >30 min (widening it to 10 failed test_research_dispatch_money_first scoring, post-reset item). Was: RESEARCH-FLOW 2026-11-03 (lane RESEARCH-CAPACITY): 6 -> 10; 24h runs 2026-11-02T03:30Z..11-03T02:45Z: avg 0.82 of 6 in flight, 0 in flight 61% of minutes, 6 reached 23 min; every cycle fills 6/6 and defers ~128. Was: 3 -> 6 RESEARCH-FLOW 2026-11-02 (operator: get research flowing asap): 3 -> 6. Light units finish in ~2 min (runs 1297-1306), so a slot is held briefly; --max-repo-queued 10 + yield-to-infra still protect system-actions/CI
    cost_weight: 1.0           # relative cost of one hour here (free, but it shares the repo's runner pool)
    # A unit with routing.published_data runs on this backend's published twin instead. KAGGLE-CPU-ROUTE (2026-10-14): the twin is
    # kaggle_cpu, NOT github_runner_data -- kaggle 2.2.4 DownloadDataset 404s for the private dataset from a GitHub runner (runs
    # 38507974681 / 38512183556 / 38514877849, row ML-DATA-RUNNER-FETCH), while a Kaggle kernel mounts it (verified 20/20 files).
    published_variant: kaggle_cpu
    what: "GitHub-hosted runner: free, ~20 concurrent repo-wide, 6 h/job"
  github_runner_data:
    workflow: research-script-run-data.yml
    max_concurrent: 1          # OPERATOR 2026-11-03 D5-A: 2 -> 1. shares the runner pool with github_runner; each run downloads ~1.5 GB, so it is capped lower
    cost_weight: 1.0
    what: "GitHub-hosted runner + the private published ML dataset (ML-DATA-OFF-TRAINER): explicit run.workflow only since KAGGLE-CPU-ROUTE; its fetch 404s from a runner"
  kaggle_cpu:
    workflow: research-script-run-kaggle-cpu.yml
    max_concurrent: 1          # one CPU kernel + bundle dataset slug (metis-research-run-cpu); separate from the GPU slot, so both can run
    cost_weight: 1.5           # free and NOT metered by the GPU quota; the runner job only polls, the kernel does the work
    # NO `quota:` block, deliberately: a CPU kernel does not draw the weekly GPU hours (enable_gpu=false), so there is nothing to gate on.
    what: "Kaggle CPU kernel (internet off): reads the private published dataset by mount; units with routing.published_data"
  trainer:
    workflow: research-script-run-trainer.yml
    max_concurrent: 1          # 1 OCPU / 6 GB; the workflow's own concurrency group is global
    cost_weight: 3.0           # scarce: shares the box with the daily cycle and promotion sweep
    what: "trainer VM over SSH: only for units that read trainer-resident data"
    # The trainer is its OWN queue (ML-DATA-OFF-TRAINER, operator 2026-10-13): a unit bound here is released only into an
    # IDLE WINDOW, never into the training cycle. Windows are DERIVED from the measured hour-of-day occupancy of the
    # trainer's own services (comms/cloud/trainer_workload_profile.json, 7 days to 2026-10-13 16:00Z); a test fails if
    # a window here opens an hour the profile says is busy. A unit must FIT: start + est_minutes x safety_factor <= window end.
    # Same dispatcher, not a second cron: stamping, landing and the liveness receipt are single-writer, and a second
    # dispatcher could fire the same unit twice.
    queue:
      windows_utc: ["03:00-05:00", "07:00-24:00"]
      safety_factor: 1.5
      profile: comms/cloud/trainer_workload_profile.json
  kaggle:
    workflow: research-script-run-kaggle.yml
    max_concurrent: 1
    cost_weight: 5.0           # GPU hours are the scarcest budget we have
    # Weekly GPU quota, read from `kaggle quota` by the dispatch workflow (docs/plans/COMPUTE-KAGGLE-GPU-PILOT-2026-10-13.md).
    # Below `floor_hours` remaining no GPU unit is routed here: it WAITS (deferred, with the refresh time) or, for a
    # class that lists a fallback, goes to the next backend. The queue itself never halts.
    quota: {resource: GPU, floor_hours: 3.0, default_unit_hours: 1.0}
    what: "Kaggle kernel, 2x T4, ~30 GPU h/week, internet off; code travels as a private dataset bundle"
  runpod:
    workflow: gpu-burst-train.yml
    max_concurrent: 1
    cost_weight: 8.0
    # "fallback" (ML-DATA-OFF-TRAINER, operator 2026-10-13 (d)): never a class's first choice. Reached only when every earlier
    # backend of the class is out of quota/capacity AND the unit declares a request it can serve (`routing.runpod:
    # {manifest, est_cost_usd}` -- the pod trains a registered ML manifest; it does not run arbitrary scripts) AND the
    # spend fits the ledger cap. GPU_BURST_ARMED still decides whether a pod launches at all. An explicit
    # run.workflow: gpu-burst-train.yml keeps working exactly as before.
    auto_route: fallback
    ledger: comms/gpu_spend_ledger.json     # month-to-date + estimate must stay <= its budget_usd_per_month ($10)
    rate_usd_per_h: 0.22                    # RTX 3090 spot, July 2026 ledger
    estimate_margin: 2.0                    # estimate = est_hours x rate x margin when the unit declares no est_cost_usd
    what: "RunPod spot GPU burst (M19): operator-armed, ledger-capped; GPU fallback when Kaggle quota is short"

# Datasets published OFF the trainer (ML-DATA-OFF-TRAINER, 2026-10-13). A unit that sets `routing.published_data: <name>`
# reads its shards from this dataset instead of trainer-resident files, so it can run on a runner or Kaggle. The router
# CHECKS the claim: every ml_bakeoff.dataset path of the unit must be in scripts/research/market_data_export.py::ALLOW.
# Market data only; OURS (trades, fills, signals, account, outcome labels) is never published. Private Kaggle dataset.
published_data:
  metis-market-data:
    kaggle_dataset: metis-market-data      # owner = the KAGGLE_API_TOKEN user
    exporter: .github/workflows/ml-data-export-kaggle.yml
    refresh: "daily 06:40Z, after the nightly shard rebuild"
    env: ML_DATA_ROOT                      # the dir that CONTAINS datasets-out/ ; ml_bakeoff resolves relative paths from it
  # LAKE MIRROR, MANIFEST ONLY (2026-11-08, PROP-ML-NEW-DATA step 1; manager 2026-11-07a ruling). The frozen crypto history of the HF lake
  # (private HF storage is at its cap and returns 403) is mirrored as private Kaggle datasets metis-market-lake-pNNN
  # (scripts/data_lake/kaggle_pilot.py, kaggle-cold-lake-copy.yml). `fetch: manifest_only` downloads ONLY each part's MANIFEST.json
  # (never the ~7 GB shards, nothing is re-hashed) so a unit can answer "is this series in the lake, over which dates" on a
  # GitHub runner. It does NOT make the lake's rows readable; that is the loader row HF-LAKE-KAGGLE-LOADER. Runner twin only:
  # a Kaggle kernel route is refused (kaggle_run.py). ROLLBACK: delete this entry (units naming it are then refused by
  # compute_router.published_problem) and revert the manifest_only branch of published_data.py::fetch; nothing else reads it.
  metis-market-lake:
    kaggle_dataset_prefix: metis-market-lake-p   # parts are <prefix>NNN; resolved at fetch time by listing the token user's datasets
    fetch: manifest_only
    exporter: .github/workflows/kaggle-cold-lake-copy.yml
    refresh: "none: frozen closed-month history, copied once (HF-LAKE-STORAGE-403); the hot tail is not in the mirror"
    env: LAKE_MANIFEST_ROOT                # the dir holding <slug>/MANIFEST.json for every part

# Class -> ordered backend preference. The first backend that is not over capacity / quota wins.
# A class with one backend WAITS when it is full; listing a second backend is the declared fallback.
classes:
  cpu_light:      {backends: [github_runner], what: "<= ~30 min, public data / repo data, no GPU"}
  cpu_long:       {backends: [kaggle_cpu, github_runner], what: "30 min .. 5.5 h, public data / repo data, no GPU"}
  needs_vm_data:  {backends: [trainer],       what: "reads trainer-resident data / weights; fits in 6 GB"}
  gpu:            {backends: [kaggle, runpod], what: "needs a GPU; Kaggle first, RunPod burst (ledger-capped, manifest requests only) when Kaggle quota is short; never runs on CPU"}
  gpu_preferred:  {backends: [kaggle, github_runner], what: "GPU if quota allows, else the CPU path (the script must support both). Refused for an ml_bakeoff whose learners are all CPU-only (it would burn GPU quota for nothing): use compute: auto"}

# KAGGLE-FIRST (COMPUTE-PREFER-KAGGLE, operator 2026-11-01: "we should generally prefer specific infra like kaggle when it's relevant to leave
# the general use git resources free for other work"). A DEFAULT, not a gate; an explicit run.workflow still wins. cpu_long lists kaggle_cpu
# first above; a cpu_light unit whose routing.est_minutes exceeds min_est_minutes is promoted the same way (compute_router.class_backends).
# gpu / gpu_preferred already put kaggle first. FALLBACK to the next backend (github_runner) when: kaggle_cpu is at capacity (1 slot), or
# the unit is runner-only (routing.runner_only | needs_secrets | needs_internet | why_runner: the kernel has no internet and no secret).
kaggle_first:
  backend: kaggle_cpu
  classes: [cpu_light]
  min_est_minutes: 30

# Dispatcher-wide ceilings. The per-backend max_concurrent above is the ONE capacity statement per backend;
# these bound the sum, so research can never saturate the runner pool a system-action waits in.
#
# CAP MEASUREMENT 2026-10-13 (lane RESEARCH-UTIL; population: Actions jobs of 4,176 runs created 2026-10-12T19Z..10-13T20Z, all
# `ubuntu-latest`, 5-min buckets, bucket MAXIMUM of jobs running by started_at/completed_at, 288 buckets):
#   CI (pull_request+push, non-research) p50 9 · p90 16 · p99 21 · max 30      all non-research p90 17
#   research p90 5 · max 8                                                     everything p50 12 · p90 20 · p99 28 · max 34
#   Queue wait (created->started): p50 0s · p90 5s · p99 536s; 197 of 4,464 jobs waited > 120 s and ~90% of those started
#   with 18-20 jobs already running -> the shared pool IS binding at ~20. The planned 20 - CI_p90 - 2 = 2 is BELOW today's 3.
#   So the caps are NOT raised: more research slots would queue CI/merge jobs. Also, last measured dispatch cycle
#   (comms/research/utilization, 16:05Z): github_runner in-flight 0/3, due_waiting 0 -- the runner backend had nothing waiting;
#   the waiting units (5) were routed to `trainer` (cap 1, compute_spare saturated, deliberately unchanged).
#   research-script-run.yml's concurrency group is per-unit, so --max-fires-per-workflow=1 does not throttle it.
limits:
  max_total_inflight: 8        # OPERATOR 2026-11-03 D5-A: runner 4 + runner_data 1 + trainer 1 + kaggle 1 + kaggle_cpu 1. Was 15: runner 10 + runner_data 2 + trainer 1 + kaggle 1 + kaggle_cpu 1 (RESEARCH-FLOW 2026-11-03; was 11 at runner 6)
  max_repo_queued: 10          # unchanged from the dispatcher's flag default
  starvation_hours: 0.75       # nothing dispatched this long -> the repo-queued block is lifted for ONE fire/cycle (dispatch_queue.starvation_override)
  # YIELD TO INFRA (GH-CAPACITY-INFRA-FIRST, operator 2026-10-15): while any fresh run of one of these
  # workflows (gh `workflowName`, i.e. the file's `name:`) is QUEUED, the dispatcher fires nothing -- every
  # backend's workflow, trainer and Kaggle included, holds a GitHub runner while it polls. Research uses
  # GitHub capacity only when infra is not waiting. Class backend order already puts the dedicated backend
  # first wherever the unit can run there (gpu/gpu_preferred -> kaggle; published-data cpu units ->
  # kaggle_cpu via published_variant; needs_vm_data -> trainer); github_runner is the spill-over.
  # RESEARCH-FLOW 2026-11-02 (manager 21:25Z): research may fire while at most 1 infra run is queued and defers at 2 or more
  # (was: defer at 1, which deferred every fire on cycle 41521258380). --max-repo-queued still bounds the whole pool.
  infra_yield_at: 2
  # INFRA STARVATION FLOOR (manager 2026-11-12 22:33Z): nothing dispatched this long -> the infra-yield block is lifted for ONE
  # fire/cycle (the top-scored unit), whatever infra is queued (dispatch_queue.starvation_override). 0 disables. MEASURED
  # 2026-11-12: the yield deferred every fire 17:43Z..22:33Z (0 units, ~5 h) -- a halt shape (Prime Directive 7).
  infra_starvation_hours: 2.0
  # RESEARCH-DISPATCH-STALL-1112: an infra run QUEUED longer than this is stuck, not waiting -- it no longer counts toward
  # infra_yield_at (dispatch_queue.INFRA_STUCK_HOURS). 2026-11-11 frozen 3-6 h infra runs deferred every fire for 5 h+.
  infra_stuck_hours: 1.0
  # RESEARCH-DISPATCH-STALL-1112 (manager 2026-11-12): a research run QUEUED longer than this holds no runner -- it no longer counts
  # toward max_total_inflight (dispatch_queue.RESEARCH_STUCK_HOURS); in_progress research runs always count.
  research_stuck_hours: 1.0
  # THE ONE OWNER of "which workflows are money-path ops" (B13). Any workflow reading vars.INFRA_RUNS_ON must be here
  # (runner-admin infra-runner-* aside); no research-* workflow may read it. Report: scripts/ci/check_infra_workflows_single_owner.py
  infra_workflows:
    - system-actions
    - system-actions-cancel-guard
    - deploy-candidate
    - trainer-vm-diag
    - trainer-diag-relay
    - arm-candidate-diag
    - vm-bybit-diag
    - vm-caddy-deploy
    - vm-diag-snapshot
    - vm-driver
    - vm-fix-devnull
    - vm-git-credential-bootstrap
    - vm-ib-gateway-deploy
    - vm-ib-gateway-live-login-test
    - vm-ib-gateway-recover
    - vm-ib-gateway-selftest
    - vm-ib-gateway-stop
    - vm-ib-gateway-watchdog-enable
    - vm-net-diag
    - vm-net-fix
    - vm-resize-live
    - vm-web-api-recover
    - diag-relay-sweep   # reads vars.INFRA_RUNS_ON (B13: the pool readers are a subset of this list)

# Value ranking. score = usd_per_month * confidence * bucket_boost * hand_written_boost * age_boost / cost
#   usd_per_month  unit.value.usd_at_stake_per_month, else priority_usd[declared priority]
#   confidence     unit.value.confidence, else default_confidence      (P(the answer changes a decision), 0..1)
#   bucket_boost   target_share / observed_share of the unit's bucket over the share window, clamped to [min,max]
#   hand_written   someone ASKED this question; a template refill did not (kept from the 2026-10-04 measurement)
#   age_boost      1 + age_step per aging step waited (aging_hours in THEMES.yaml)
#   cost           (1 + est_hours) * backend.cost_weight   -- est_hours from routing.est_minutes
# starve_hours: a unit DUE longer than this sorts ahead of every score, in its theme and across themes. Nothing starves.
#
# MONEY FIRST (operator 2026-10-18, popup verbatim "Fix now, money first"; lane DISPATCH-MONEY-FIRST-1018). This score
# orders due units ACROSS themes, not only inside one. Until then dispatch_queue.fair_order round-robined the themes
# by (fires in THEMES.yaml share_window_hours + picks) / weight and the score ordered units only within a theme:
# run 39098686264 (2026-10-18 04:56Z) gave github_runner's 3 slots to two regime units scoring 6.5 and one infra unit
# at 30.7 while the P1 real-money units (own_losses, 141.9 down) deferred on "at capacity". The operator declined to
# raise the runner cap. Now: starved first, then the operator's programme_priority (below), then the highest score in
# any theme; theme share (THEMES.yaml weight)
# only breaks an EQUAL score; inside a theme an asked unit (authored or programme node) still precedes a template
# refill. Consequence, stated on purpose: a theme holding only low-value units fires when capacity is spare or when
# its units reach starve_hours, so research_slo.yaml theme_share_min_ratio recovers more slowly (supply of VALUABLE
# units in a short theme is how it recovers; check_research_queue_health.py theme_supply names the short themes).
value:
  # PROGRAMME PRIORITY (operator 2026-10-18 ~06:20Z, verbatim: "Those two items are our highest priority, we need to make sure
  # we're pushing forward on them" -- P1 active trade management, P2 AI trader; relayed by the manager to lane
  # DISPATCH-MONEY-FIRST-1018). An ORDERED list of programme ids (research/programmes/*.yaml `programme:`). A due unit of a
  # listed programme (`programme_node.programme`, or `generated.family: programme:<id>`) ranks FIRST on every backend --
  # above every other theme and programme, earlier entries before later ones -- then the money-first value order below,
  # then theme share for ties / spare capacity. Only a STARVED unit (starve_hours) goes ahead of it: nothing waits forever.
  # Edit this list to change the operator's priority; the dispatcher prints `pick=programme:<id>` on each such decision line.
  # 2026-11-01 ~18:00Z, OPERATOR (relayed by the manager): "I do want to prioritize getting tests for this model to the top of the research
  # queue so that we can get in like the first round of iterating as soon as possible ... I want to make sure that we're pushing on the
  # iteration here, even if we have to slow down a few of the other things this week."  The ENTRY lever units (RQ-20261101-b601-01,
  # -b602-01, -b604-01, -a508-01) carry programme_node.programme P2 and priority 1. MEASURED the same hour (dispatch_queue.py dry run on
  # research/queue): they plan as picks 2-5 (`pick=programme:P2`) behind one starved unit, and NO P1 programme-tagged unit is in the
  # dispatch plan, so [P1, P2] does not delay them and the order is left as is. If P1 programme-tagged units come due and push the ENTRY
  # tests down, change this list to [P2, P1]. Revisit at Thursday planning, 2026-11-05.
  programme_priority: [P1, P2]
  default_confidence: 0.3
  priority_usd: {1: 300, 2: 100, 3: 30}     # stand-ins when a unit carries no value block; derived from priority only
  hand_written_boost: 1.25
  age_step: 0.5
  starve_hours: 240
  bucket_boost: {min: 0.5, max: 2.0}
  # The STRATEGY-REALIGN research mix (operator 2026-10-13, ~07:30Z): the target SHARE of fires per bucket.
  buckets:
    own_losses: 0.30
    structural: 0.25
    information: 0.20
    ai_trader: 0.15
    frontier: 0.10
  # Used only when a unit declares no value.bucket. A unit's own bucket always wins.
  theme_bucket:
    live_strategy: own_losses
    regime: structural
    new_strategy_prop: structural
    macro: information
    ml_health: ai_trader
    infra: information
