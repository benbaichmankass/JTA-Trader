      alpaca_portfolio): PER STRATEGY (each leg pulls its own weight) and at PORTFOLIO level (capital-weighted).
      Operator decision 2026-10-14 (weekly planning), replacing net-of-cost expectancy as the headline. Every leg that
      reaches these books still clears Stage 0 (backtest, full cost stack) and Gate 1 (cost fidelity) per
      docs/plans/OPERATING-PLAN-2026-09-21.md; a live book never establishes edge, it checks mechanics and cost.
    baseline: >-
      To be measured by the 2026-10-15 perf-review prep (trigger 'Weekly review prep', Wed 18:53Z: net P&L per capital-day
      in R and $ per strategy and for the whole book, plus giveback and TP-rule compliance). Prior-measure history, NOT the
      new measure: lifetime real-money expectancy -0.3231R (n=431, profitFactor 0.68, 2026-09-21, before the roster cut);
      2026-10-04..10-10 window 4 priced real-money closes, +$2.10 (n=4, "caution"). Roster 2026-10-11 from
      config/accounts.yaml: bybit_2 4 legs, alpaca_live 3 legs. TP doctrine (python3 scripts/ci/check_tp_doctrine.py,
      2026-10-14 06:40Z): 0 of 50 routings compliant.
