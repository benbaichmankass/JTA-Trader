# milestone -> work topic / subtopic (WORK-TOPIC-TAXONOMY, operator 2026-11-11; docs/design/ui-workplan-2026-11.md section 10)
#
# Rows, queue units, pipeline items and insights carry a `roadmap` ref (a milestone id); their topic is COMPUTED from it through
# this map -- never typed on the row, no free text. `GET /api/bot/work/topics` serves it. A milestone with no entry here, and a
# row with no roadmap ref, both read "Unmapped" (visible, so the gap is a to-do, not hidden).
# This file informs grouping only and authorizes nothing. Closed / retired milestones keep their topic so history groups correctly.
# Open call (plan section 10): `Regime` and `Data` could fold under `ML`.
