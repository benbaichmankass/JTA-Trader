# docs/plans/ml-dev-plan.yaml -- THE ITERATIVE ML DEV PLAN (machine-readable; the operator monitors, tracks and edits it).
#
# Row ML-DEV-PLAN (owner AM-ML). Operator 2026-11-12 ~13:47Z (verbatim): "We also need to have the full iterative dev plan built
# out, should be visibile to so i can monitor/track/edit".
#
# Gates this adds or changes: NONE. Nothing here is read by the order path, a promotion, a roster or a dispatcher as a condition.
# A PASS/FAIL arrow says what the NEXT piece of work is; it is not a switch. Where a recommendation would add a gate it sits under
# `labelled_gates_not_planned` and is not planned (operator 11:45Z, verbatim: "no more gates that I don't explicitly give you
# permission for. It is not your job to add limitations that I did not ask for.").
#
# How a model reaches money is stated ONCE in docs/plans/OPERATING-PLAN-2026-09-21.md § 2 (the ladder, the soak, the three
# strategy statuses) and for ML in row ML-ONE-LADDER; this file points at it and restates none of it. Operator p3 2026-11-12
# (verbatim): "We already said that things get promoted to real money based on backtesting, shadow on paper is only for something
# that is demoted and in iteration, not a step on the way to real money". So no lever below routes through a paper/shadow step.
#
# READ / CHECK:  python3 scripts/ops/ml_dev_plan.py            (table; resolves every row + unit; exit 0/1/2)
#                python3 scripts/ops/ml_dev_plan.py --json     (what the operator's Plans page renders)
#                python3 scripts/ops/ml_dev_plan.py --validate (schema only; CI-safe, no network)
# LIVE STATE: every line names its work-store row in `row`. The row's own state is read live by the reader, never copied here.
#
# SCHEMA (per line)
#   id            MLP-<slot|track>-<NAME>; stable; never reused
#   slot          D1..D10 (ML-ROADMAP-MECE-2026-11.md § 2) or "-" for a cross-slot line
#   track         the ml-plan-items.yaml track letter(s) it absorbs (S R X P D N F V M) or "infra"
#   kind          model | idea | slot | infra
#   subject       the model id(s) / idea, with display names (docs/reference/model_names.yaml)
#   consumer      {class: real_money|prop|paper|none, books, legs, note}. `none` is said plainly; none is invented.
#   stage         the one-ladder / RD-REGISTRY vocabulary (src/runtime/rd_registry.py STAGES): idea queued testing_offline failed
#                 iterating passed_waiting testing_book production shadow_advisory retired stuck
#   row           the work-store row that mirrors the line (scripts/ops/work.py --via direct get <row>); a line with no
#                 dedicated live row has a mirror row whose id IS the line id (created by lane ML-DEV-PLAN, 2026-11-12)
#   carried_by    optional: other rows doing the line's current work (the reader checks they exist)
#   state         {summary, evidence: [{record, n, value, provenance}]}; provenance MEASURED | QUOTED | ESTIMATED | UNVERIFIED
#                 (QUOTED = from a committed record or an open PR's committed record, path named; not re-derived)
#   levers_tried  [{lever, ref, verdict}]
#   levers_ahead  [{lever, ref (unit or row; "needs_authoring" if neither exists), baseline (what it must beat, net of cost),
#                   pass, fail}]
#   next_weeks    {W47: ..., W48: ..., W49: ..., W50: ...}  ISO weeks starting 2026-11-16, -23, -30, 12-07
#   exhaustion    the condition that would retire the line. NEVER an attempt count (programme-review skill, ITERATION LOOP).
#   owner         AM-ML unless stated
#   plan_items    the ml-plan-items.yaml ids this line absorbs (the reader flags an open item no line absorbs)
#   proposed_disposition  optional; a kill/retire PROPOSAL with reason + data. Applying it is the manager's / operator's act.
