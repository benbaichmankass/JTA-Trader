# Model display aliases (operator decision 2026-11-03 ~08:15Z, lane MODEL-NAMES; row MODEL-NAMES).
#
# DISPLAY ALIASES ONLY. A model id, config filename, registry key, strategy name or runtime identifier is
# NEVER renamed (CLAUDE.md § Repo identity). Nothing reads this file for a decision; scripts/ops/model_names.py maps
# id -> display name for human-facing lines and falls back to the id.
#
# Operator, verbatim: "on the naming convention, let's push that forward. The only thing I want to make sure is
# that there's ... some connection between ... the breed and the function, right? So like just as an example,
# something that's like looking for ... entry should be something that's sniffing, or something that's about
# exit should be like a retriever ... keeping a little bit of logic behind it, but at the same time, it looks
# good. We should definitely go with that."
#
# SLOT (lane ML-REGISTRY-CONSOLIDATE, operator 2026-11-09): each breed carries `slot: D<n>`, the decision slot of
# docs/plans/ML-ROADMAP-MECE-2026-11.md section 2 (the ONE mapping; /api/bot/ml/registry `by_slot` reads it). Collie and
# Chihuahua = D2, Foxhound = D3, Beagle = D4, Mastiff = D5, Pointer = D6, Labrador = D7 (a model may override with its own
# `slot:`, e.g. an exit head = D8), Whippet = D9, Basset = D10. Mutt = the baseline of its slot, so a Mutt-<Slot>
# model carries its own `slot:`; Canaan is a constraint, not a slot (no slot). A model with no entry renders slot "unassigned".
#
# CONVENTION
#   - One breed per model JOB.
#   - Name = Breed-<generation>[<variant letter>]. The generation goes up only when a version is PROMOTED.
#     Variant letters separate sibling heads of one generation. Asset and timeframe are tags, not part of the name.
#   - A model gets a name only from stage shadow upward. Candidates stay unnamed.
#   - To name a new promotion: add an entry under `models:` in the same PR as the promote-stage record
#     (the ml-review and model-training skills point here).
#   - Registry stage below was MEASURED from GET /api/bot/ml/registry on 2026-11-03 (98 rows; the 24 rows not
#     listed are candidate/OFFLINE and unnamed). `live-served` = served artifact under ml/served, not a registry row.
#
breeds:
  Foxhound: {slot: D3, job: "Entry decision (finds the trade)", note: "scent tracker; final (operator 2026-11-03 \"let's go with Foxhound\"); future prop-specific entry = Foxhound-<n>P"}
  Beagle: {slot: D4, job: "Setup filter / meta-label (take or skip a strategy signal)", note: "sniffs the signal"}
  Pointer: {slot: D6, job: "Direction", note: "points the way"}
  Collie: {slot: D2, job: "Market regime / volatility (Border Collie)", note: "reads and herds the field"}
  Labrador: {slot: D7, job: "Exit and in-trade active management (Labrador Retriever)", note: "brings the profit home; operator 2026-11-03: Golden Retriever -> Labrador; the ML-AM-NEXT-LIVE model is the next generation"}
  Mastiff: {slot: D5, job: "Conviction / sizing", note: "strength"}
  Whippet: {slot: D9, job: "Execution quality", note: "fast, clean fills"}
  Basset: {slot: D10, job: "Trade-outcome / post-trade review (Basset Hound)", note: "slow, thorough, after the fact"}
  Canaan: {job: "Prop rule compliance / survival (Canaan Dog)", note: "Hebrew: Kelev Kna'ani, Israel's national breed; desert survivor and alert sentry, guards the account. Replaces German Shepherd (unassigned). reserved: no prop-compliance model is at shadow+ (prop-mission-policy-baseline-v0 is a candidate baseline, unnamed; a promoted one would be Mutt)"}
  Chihuahua: {slot: D2, job: "Short-horizon alarm / early warning", note: "small, alert, yappy. No anomaly/drift detector exists at shadow+ (checked registry 2026-11-03), so it goes to the shortest-horizon family, the 5m regime heads; the 5m flow head is candidate/unnamed"}
  Mutt: {job: "Baselines (each takes the slot it baselines)", note: "Mutt-Regime, Mutt-Execution, ..."}
  # Generations in use: Collie/Chihuahua-1 lgbm v1/v2 heads, -2 yz heads, -3 cross-asset heads, -4 fc-pcv v1, -5 fc-pcv v2.
