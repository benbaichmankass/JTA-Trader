# Power + demotion-label record for every model that has a consumer (row ML-ONE-LADDER, 2026-11-12).
# REPORT-ONLY. Read by scripts/ops/ml_order_changers.py for the /ml-review one-line-per-model table. Nothing reads this
# for a decision; a demotion_signal is a LABEL in a report, never wired to act. Gates this adds or changes: none.
# Provenance per figure: MEASURED = read from the named evidence file; QUOTED = from docs/research/ml-deep-audit-2026-11-12.md
# (itself reading the cited record); a blank/absent field renders "—" (unknown), never 0.
# ML-SLOT-BASELINES-DECLARE (lane ML-SLOT-MAP, 2026-11-12): the `slots:` block below declares, per decision slot, the baseline a model must
# beat NET OF COST and the competition metric; each `models:` entry gains `slot`, `baseline` (a key of `slots`) and a structured
# `demotion_read`. All of it is a DECLARED READ for reports (ml-review C3 prints it); none of it is wired to act. Gates this adds or
# changes: none (no mode, roster, tau or artifact moves; acting on a demotion read is the manager's/operator's call under the tiers).
# Keyed by registry model_id (GET /api/bot/ml/registry rows[].model_id). Add a line when a model gains a consumer.
slots:
  D2:
    decision: "regime / trend-vol gate: drops intents in off-cells"
    baseline: "the matched Mutt (majority-class predictor; f1_volatile 0.0, macro F1 0.36-0.50) on the SAME shard and split"
    baseline_ref: "docs/plans/ML-CONSOLIDATION-2026-11-11.md addendum 2026-11-11"
    competition_metric: "head macro F1 / log-loss vs its Mutt (necessary, not edge)"
    cost_net_metric: "none exists for any D2 head (cost_gate_applicable 0). The consumer test is the cost-net read: gated vs ungated net R of the real-money TD family (RQ-20261101-78fc-08, blocked; RQ-20261112-0f87-01 for the no-cell heads)"
    status: "partial: Mutt floor declared, cost-net metric still to be MEASURED"
  D3:
    decision: "entry: take long/short/none per bar"
    baseline: "(a) take-nothing: mean net R >= 0 on the held-out window; (b) the incumbent on the same rows (frozen v1 for crypto; ml_entry_eq v1 for equity)"
    baseline_ref: "docs/plans/ML-D3-HEAD-TO-HEAD-2026-11-12.md; RQ-20261101-b609-01; RQ-20261112-ef4c-09"
    competition_metric: "mean net R per trade (day-clustered t), full cost stack, held-out window"
    cost_net_metric: "mean net R (cost stack = the venue's fee + slippage + funding)"
    status: "declared"
  D4:
    decision: "overlay: reduce qty x0.5 below tau on trend_donchian legs"
    baseline: "the unreduced book (multiplier 1.0) on the same trades"
    baseline_ref: "RULE-ML-OVERLAY-NONINFERIOR-V2 (RQ-20261029-5785-02, TD family PASS, PB2H FAIL)"
    competition_metric: "delta net R vs take-all (one-sided 95% LB > -0.02 R), maxDD and CVaR5 not worse, beats 90th pct of 2000 same-rate random reduces"
    cost_net_metric: "net_r is fee+slippage+funding cost-net, R of initial risk"
    status: "declared (a non-inferiority rule: no mean R is claimed)"
  D7:
    decision: "tp-revision: extend the entry TP at 4h check-ins"
    baseline: "the original TP held (no revision) on the same trades"
    baseline_ref: "RULE-RQ20261101-383f-01-ML-ENTRY-TP-REVISION (RQ-20261101-383f-01)"
    competition_metric: "held-out mean delta net R per trade, revised vs held TP"
    cost_net_metric: "delta net R after the full cost stack"
    status: "declared"
  D8:
    decision: "exit head: close advice on trend_donchian legs"
    baseline: "the leg's declared exit with no head (ML-EXITHEAD-VALUE)"
    baseline_ref: "row ML-EXITHEAD-VALUE (BTC FAIL -0.0141 n 1041; SOL FAIL -0.0246 IS n 286; ETH +0.0215 IS only)"
    competition_metric: "delta net R per trade, head vs no head, out of sample"
    cost_net_metric: "delta net R after the full cost stack"
    status: "declared"
