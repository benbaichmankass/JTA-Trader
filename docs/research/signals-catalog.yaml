# docs/research/signals-catalog.yaml -- the RESEARCH view of the signal inventory, as data.
#
# Human twin: docs/research/SIGNALS-CATALOG.md (same facts, with the reasoning). Per-INPUT register (CI-guarded,
# 334 inputs): docs/reference/signal-catalog.yaml -- `inputs_ref` below names the `family`/`kind` (and ids where
# useful) of the entries there; this file does NOT repeat them. What this file adds, per FAMILY: the definition's
# code path, producer, store, consumers, `feeds` (which AI-trader line / label in
# docs/research/programmes/02-AI-TRADER.md it should reach), `status` (live | research_only | unused | unmeasured |
# dead_default | not_implemented), and the row/unit that turns a gap into work.
#
# MEASURED from code and config on main at d577b215e, 2026-10-14 (lane AI-TRADER-PROGRAMME). No live VM value read.
# Maintenance: hand-edit when a family's producer, store or consumer changes; re-verify `measured` dates in the weekly
# roadmap pass. A `status: unmeasured` is a could-not-look, never a healthy.
schema: 1
generated: '2026-10-14'
measured_at: d577b215e
population:
  strategy_legs: 55          # config/strategies.yaml top-level keys
  strategy_families: 8       # unit modules rostered (trend_donchian 23, pullback 19, ict_scalp 8, squeeze 1, fade 1, fvg_range 1, turtle_soup 1, vwap 1)
  ml_manifests: 73           # ml/configs/*.yaml (retired/ excluded)
  reference_inputs: 334      # docs/reference/signal-catalog.yaml population.inputs
  harness_ledgers: {files: 157, rows: 13070, newest_per_leg_legs: 54, newest_per_leg_trades: 5063}
feeds_vocabulary:
  Q0: measurement (headline measure, label census, peak-to-exit census)
  Q1: regime / volatility heads -- when to apply each strategy
  Q2: meta-labeling over all strategy signals (M23 revived)
  Q3: exit models from active-management labels (peak-to-exit)
  Q4: model-family diversity
  Q5: new information classes
  Q6: serve parity / producers (build)
  G6: macro / value sleeve (outside this programme)

families:
# ---------------------------------------------------------------- strategy signals
- id: strat.trend_donchian
  group: strategy_signal
  legs: 23
  definition: close above Donchian(N) high (shift 1) -> long, below low -> short; optional confirm_bars, skip_hours, ATR-percentile vol gate
  code: src/units/strategies/trend_donchian.py:order_package
  confidence: min(breakout depth / ATR, 1)
  producer: src/runtime/strategy_signal_builders.py (36 call sites stamp regime meta)
  store: trade_journal.db::order_packages.meta (donchian_hi/lo, confirm_bars, skip_hours, vol_at_entry_pctl, regime stamp, head_p_win*)
  consumers: [src/research/component_vector.py, src/runtime/allocator_soak.py, strategy monitor]
  feeds: [Q2, Q1]
  status: live
  notes: donchian_hi/lo and vol_at_entry_pctl are stored and read by nothing outside the producer (UNUSED fields)
  inputs_ref: {family: strategy, module: trend_donchian}
- id: strat.pullback
  group: strategy_signal
  legs: 19
  definition: uptrend (close above the Donchian-trend midline) AND position in the pullback range <= pull_frac AND close > prev close -> long; mirror short; optional ADX band, vol gate
  code: src/units/strategies/htf_pullback_trend_2h.py:order_package
  confidence: 0.5*min(depth / 2 ATR, 1) + 0.5*pullback_quality
  store: order_packages.meta (trend_midline, ADX band audit, regime stamp, head_p_win*)
  consumers: [src/runtime/thesis_decay.py, src/research/component_vector.py]
  feeds: [Q2, Q3]
  status: live
  notes: there is no pullback-to-EMA signal; EMA appears only in HTF bias filters
  inputs_ref: {family: strategy, module: htf_pullback_trend_2h}
- id: strat.ict_scalp
  group: strategy_signal
  legs: 8
  definition: liquidity sweep -> displacement bar (body >= k*ATR) -> FVG in the leg -> optional HTF EMA20 bias -> mitigation (wick_rejection | body_inside_fvg); session filter off on every leg
  code: src/units/strategies/ict_scalp.py:order_package (_detect_sweep, _detect_displacement, _detect_fvg_in_leg, _passes_session_filter)
  confidence: 0.4*displacement body/range + 0.3*min(sweep depth/ATR, 1) + 0.3*min(FVG size/ATR, 1)
  store: order_packages.meta (sweep_level, sweep_extreme, sweep_idx_from_end, displacement_body_to_range, fvg_low/high/size, mitigation_mode, htf_filter_active); runtime_logs/signal_audit.jsonl ict_scalp_eval rows
  consumers: [dashboard, src/research/component_vector.py, ml/datasets/families/setup_labels_audit.py]
  feeds: [Q2]
  status: live
  notes: HTF bias raw value UNMEASURED (boolean only); 7 variants never fetch HTF candles (ICT-SCALP-HTF); all 8 legs set shadow_model_ids [] so no model_scores/conviction
  inputs_ref: {family: strategy, module: ict_scalp}
- id: strat.squeeze_breakout_4h
  group: strategy_signal
  legs: 1
  definition: Bollinger inside Keltner on the prior bar and outside on this bar; side = close vs BB basis
  code: src/units/strategies/squeeze_breakout_4h.py:order_package
  confidence: min(|close - basis| / ATR, 1)
  store: order_packages.meta + regime stamp
  consumers: [src/research/component_vector.py]
  feeds: [Q2]
  status: live
- id: strat.fade_breakout_4h
  group: strategy_signal
  legs: 1
  definition: prior-bar ADX < adx_max AND the bar pierces the Donchian band by >= pierce_min*ATR then closes back inside; upside failure -> short
  code: src/units/strategies/fade_breakout_4h.py:order_package
  confidence: min(pierce depth / ATR, 1)
  store: order_packages.meta
  consumers: []
  feeds: [Q2]
  status: live
  notes: execution shadow; its harness ledgers carry no mfe_r (163 rows, 0 positive-peak) -> outside the exit census
- id: strat.fvg_range_15m
  group: strategy_signal
  legs: 1
  definition: ADX < adx_max, range width in bounds, >= min touches both edges, price in lower/upper third, intact FVG there, wick rejection; TP = opposite edge
  code: src/units/strategies/fvg_range_15m.py:order_package (_find_range_fvg)
  confidence: 0.6*location-in-third + 0.4*min(FVG size/ATR, 1)
  store: order_packages.meta (range_touches_hi/lo UNUSED)
  consumers: []
  feeds: []
  status: live
  notes: execution shadow; emits lack a cost breakdown
- id: strat.turtle_soup
  group: strategy_signal
  legs: 1
  definition: 15m bar sweeps the prior N-bar low/high by a buffer, closes back inside, body/range >= min; scans the last K bars
  code: src/units/strategies/turtle_soup.py:_detect_setup, order_package
  confidence: 0.5*body/range + 0.5*min(sweep depth/ATR, 1)
  store: order_packages.meta (level, sweep_extreme, stage_rejections); the only strategy emitting partial-close verdicts
  consumers: [ml/datasets/families/setup_labels_audit.py]
  feeds: [Q2]
  status: live
- id: strat.vwap
  group: strategy_signal
  legs: 1
  definition: session-anchored VWAP deviation in sigma >= policy threshold -> fade toward VWAP; optional 4h EMA200 band
  code: src/units/strategies/vwap.py:build_vwap_signal, order_package
  store: order_packages.meta (htf_close, htf_ema, htf_blocked, recent_context, policy_regime)
  consumers: []
  feeds: []
  status: unused
  notes: enabled false; recent_context / policy_regime read by nothing
- id: strat.pairs
  group: strategy_signal
  definition: log-spread z-score; enter |z| >= entry_z, exit |z| <= exit_z, stop at stop_z (isolated 2-leg order path)
  code: src/units/strategies/pairs_engine.py; src/units/strategies/pairs_executor.py:run_pairs_tick
  config: config/pairs.yaml
  store: its own log
  consumers: [research/queue/RQ-20261007-005..008 (Stage-0, all pass 2026-10-14)]
  feeds: []
  status: live
  notes: legs aligned by tail position not timestamp; misalignment rate UNMEASURED (reference review Q14)
- id: strat.regime_stamp
  group: strategy_signal
  definition: on every actionable signal -- regime, adx_14, regime_source, vol_regime, rolling_log_return_vol, vol_regime_source (+ head_p_win* on donchian/pullback)
  code: src/runtime/strategy_signal_builders.py:_stamp_regime_on_meta
  store: order_packages.meta; signal_audit rows
  consumers: [ml/datasets/families/conviction_meta.py, src/research/component_vector.py]
