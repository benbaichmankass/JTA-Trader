name: research-store-ship
description: >-
  WSD-S6D-RESEARCH-RESULTS (docs/plans/WORK-STORE-DESIGN-2026-11.md D7). Runs ONE command of
  scripts/research/research_store.py ON THE TRAINER over ssh: `ingest-bundle` (a bundle tar built by a
  research writer job, shipped on ssh stdin), or the admin reads/writes `stats`, `parity`, `backfill`.
  The trainer runs its OWN checkout's copy of the script (ict-trainer-git-sync, ~15 min after a merge);
  a checkout that does not have it yet answers STALE_CHECKOUT (exit 7).
  NEVER FAILS THE CALLER by default (shadow phase, no pipeline halts): the outcome is the `rc` / `outcome`
  outputs, a ::warning:: and the step summary. A missed write is measured by `parity`, not hidden.
  The calling job must hold no unit code: it is the only place VM_SSH_KEY is present.
inputs:
  mode:
    description: "ingest-bundle | stats | parity | backfill"
    required: true
  bundle:
    description: "ingest-bundle: local path of the bundle tar"
    required: false
    default: ""
  since:
    description: "parity: ISO timestamp; events newer than this must have a runner-sourced row"
    required: false
    default: ""
  ssh-key:
    description: "secrets.VM_SSH_KEY"
    required: true
  trainer-ip:
    description: "secrets.TRAINER_VM_IP"
    required: true
  trainer-user:
    required: false
    default: ubuntu
  fail-on-error:
    description: "true: exit non-zero when the remote command fails (admin runs); default false"
    required: false
    default: "false"
outputs:
  rc:
    description: remote exit code (or 90 = not attempted, 91 = bad input)
    value: ${{ steps.ship.outputs.rc }}
  outcome:
    description: ok | stale_checkout | failed | not_attempted | parity_gap
    value: ${{ steps.ship.outputs.outcome }}
runs:
  using: composite
  steps:
    - id: ship
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        BUNDLE: ${{ inputs.bundle }}
        SINCE: ${{ inputs.since }}
        KEY: ${{ inputs.ssh-key }}
        IP: ${{ inputs.trainer-ip }}
        TUSER: ${{ inputs.trainer-user }}
        FAIL: ${{ inputs.fail-on-error }}
      run: |
        set +e -uo pipefail  # composite `shell: bash` runs with -e; the remote rc is captured below, never aborts the step
        out() { echo "rc=$1" >> "$GITHUB_OUTPUT"; echo "outcome=$2" >> "$GITHUB_OUTPUT";
                { echo "### research-store-ship: ${MODE}"; echo; echo "outcome: \`$2\` (rc $1)"; echo; echo '```';
                  sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/<ip>/g' /tmp/rs-ship.txt 2>/dev/null | tail -c 20000; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; }
        : > /tmp/rs-ship.txt
        if [ -z "${KEY}" ] || [ -z "${IP}" ]; then
          echo "::warning::research-store-ship: VM_SSH_KEY or TRAINER_VM_IP not provided; not attempted"; out 90 not_attempted; exit 0
        fi
        case "${MODE}" in
          ingest-bundle)
            if [ ! -s "${BUNDLE}" ]; then echo "::warning::research-store-ship: no bundle at '${BUNDLE}'; not attempted"; out 90 not_attempted; exit 0; fi
            ARGS="ingest-bundle" ;;
          stats) ARGS="stats" ;;
          backfill) ARGS="backfill --repo ." ;;
          parity)
            if ! [[ "${SINCE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}(T[0-9:]{8}(Z|[+-]00:00))?$ ]]; then
              echo "::error::parity needs --since as an ISO timestamp, got '${SINCE}'"; out 91 failed; exit 1; fi
            ARGS="parity --repo . --since ${SINCE}" ;;
          *) echo "::error::unknown mode '${MODE}'"; out 91 failed; exit 1 ;;
        esac
        KF="$(mktemp)"; trap 'rm -f "$KF"' EXIT
        printf '%s\n' "${KEY}" > "$KF"; chmod 600 "$KF"
        REMOTE="cd /home/ubuntu/ict-trading-bot || exit 9; PY=.venv/bin/python3; [ -x \"\$PY\" ] || PY=python3; [ -f scripts/research/research_store.py ] || { echo 'STALE_CHECKOUT: scripts/research/research_store.py is not on the trainer checkout yet'; exit 7; }; echo \"== trainer git: \$(git rev-parse --short HEAD)\"; exec \"\$PY\" scripts/research/research_store.py ${ARGS}"
        if [ "${MODE}" = "ingest-bundle" ]; then
          ssh -i "$KF" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "${TUSER}@${IP}" "${REMOTE}" < "${BUNDLE}" > /tmp/rs-ship.txt 2>&1
        else
          ssh -i "$KF" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=40 "${TUSER}@${IP}" "${REMOTE}" < /dev/null > /tmp/rs-ship.txt 2>&1
        fi
        RC=$?
        sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/<ip>/g' /tmp/rs-ship.txt | tail -c 20000
        case "$RC" in
          0) out 0 ok; exit 0 ;;
          7) echo "::warning::research-store-ship: trainer checkout has no research_store.py yet (git-sync lag)"; out 7 stale_checkout ;;
          1) if [ "${MODE}" = "parity" ]; then echo "::warning::research-store parity: gap (see summary)"; out 1 parity_gap; else echo "::warning::research-store-ship ${MODE} failed rc=1"; out 1 failed; fi ;;
          *) echo "::warning::research-store-ship ${MODE} failed rc=${RC}"; out "$RC" failed ;;
        esac
        if [ "${FAIL}" = "true" ]; then exit 1; fi
        exit 0
