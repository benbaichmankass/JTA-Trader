name: research-queue-replenish

# THE QUEUE REFILLS ITSELF (operator, 2026-09-28, relayed by the manager):
# "The research queue should be running 24/7 with or without Claude, we need
# to make sure the queue has enough tests to run and keep replenishing it."
#
# Runs scripts/research/queue_replenish.py, which expands the PRE-REGISTERED
# families under research/templates/ into concrete units until >= 25 runnable
# units are queued (dedupe by generated.key; families drawn by the operator's
# 30/25/20/15/10 weights), and lands the new files through commit-to-main.
# The landing PR self-lands ONLY because check_pr_landing.py re-runs
# `queue_replenish.py --verify` at the merge-base and demands the same bytes
# (a hand-edited or non-template unit holds for a human, as before).
#
# STOP-GENERATED-AUTHORING (operator 2026-11-01, row AUDIT-1101-DECISIONS): the default target is now 0 (queue_replenish._default_target),
# so the cron expands nothing and a floor gap is reported, not filled. A manual dispatch with an explicit `target` still expands templates.
#
# Four times a day (05:50, 11:50, 17:50, 23:50 UTC; RESEARCH-SLO-ROOTCAUSE 2026-10-28: one daily fill to a
# fixed 25 could not hold a ~57-63 floor against ~72 fires/24h; the target is now the computed floor).
# First slot: 05:50 UTC -- half an hour before the dispatcher's 06:20 slot, so
# the first dispatch of the day sees a full queue. schedule-keeper covers a
# dropped slot; the `dedupe` job skips GitHub's late duplicate.
#
# Tier-1: reads config + committed evidence, writes research/queue/RQ-*.yaml
# only. No live path, no order path, no VM.

on:
  schedule:
    - cron: "50 5 * * *"
    - cron: "50 11 * * *"
    - cron: "50 17 * * *"
    - cron: "50 23 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Runnable units to keep queued (blank = the computed floor)"
        default: ""

concurrency:
  group: research-queue-replenish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dedupe:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.d.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ops/schedule_keeper.py
          sparse-checkout-cone-mode: false
      - id: d
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/ops/schedule_keeper.py dedupe
          --run-id "${{ github.run_id }}" --schedule "${{ github.event.schedule }}"

  replenish:
    needs: dedupe
    if: |
      !cancelled() && needs.dedupe.outputs.skip != 'true' && (
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    # one commit-to-main wait (30) + slack, per tests/test_commit_to_main_callers.py
    timeout-minutes: 95  # was 65: shared commit-to-main wait 50->80 (W41)
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pyyaml
        run: pip install --quiet pyyaml
      - name: Generate the missing units
        id: gen
        env:
          # An input reaches the shell through env, never by interpolation
          # into `run:` (review fix 2026-09-29).
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          python3 scripts/research/queue_replenish.py --self-test
          python3 scripts/research/queue_replenish.py --write ${TARGET:+--target "${TARGET}"} | tee /tmp/replenish.txt
          python3 scripts/research/dispatch_queue.py | tail -3
          echo "count=$(git status --porcelain research/queue | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          # REPLENISH-PR-HONEST (manager 2026-11-19): say what was ACTUALLY written. Since STOP-GENERATED-AUTHORING the
          # template families get target 0, so the usual output is programme nodes only; a hardcoded "from templates"
          # title had a programme-node PR (#26927) read as banned floor-filler and closed.
          np=$(grep -cE '^ *WROTE RQ-[^ ]+ +programme:' /tmp/replenish.txt || true)
          nt=$(grep -E '^ *WROTE RQ-' /tmp/replenish.txt | grep -vcE ' programme:' || true)
          if [ "${nt:-0}" -eq 0 ]; then what="${np} programme node(s)"; src="research/programmes/*.yaml (plan-driven programme nodes)";
          elif [ "${np:-0}" -eq 0 ]; then what="${nt} template unit(s)"; src="research/templates/*.yaml (explicit --target; floor-driven generation is off)";
          else what="${np} programme node(s) + ${nt} template unit(s)"; src="research/programmes/*.yaml and research/templates/*.yaml"; fi
          echo "what=${what}" >> "$GITHUB_OUTPUT"
          echo "src=${src}" >> "$GITHUB_OUTPUT"
      # VALIDATE BEFORE LANDING (AM-OPS-9, manager 2026-11-19). Producer-side validation; enforces the existing
      # never-land-red rule; respects the operator's 2026-11-12 PYTEST-RUN-REQUIRED: REPORT-ONLY decision; adds no
      # merge-side gate. Replenish PR #27507 self-landed while pytest-run was still running and main went red
      # (RQ-20261119-031 had no power.sd; tests/test_research_queue.py). The tests that read research/queue now run
      # on the generated tree HERE, before anything is committed. On a FAIL nothing is landed this run, ONE pipeline
      # item "PRODUCER VALIDATION FAILED [research-queue-replenish]" is filed (deduplicated), and the step still exits
      # 0: no red run, no halt; the next scheduled run retries. Strict (no --baseline-ref): a new unit that breaks a
      # test main already fails would be masked by a baseline diff, and a skipped replenish costs nothing.
      # Reader set: scripts/ci/validate_before_land.py::PROFILES["research-queue"].
      - name: Install the validation test runner
        if: steps.gen.outputs.count != '0'
        run: pip install --quiet "pytest>=8.0"
      - name: Validate the generated tree before landing (producer-side, no merge-side gate)
        id: validate
        if: steps.gen.outputs.count != '0'
        env:
          # WSD-S4: pipeline.append writes through the work store's API after the freeze (the filing on a FAIL).
          WORK_STORE_TOKEN: ${{ secrets.WORK_STORE_TOKEN }}
        run: python3 scripts/ci/validate_before_land.py --producer research-queue-replenish --profile research-queue
      - name: Land the new units on main
        if: steps.gen.outputs.count != '0' && steps.validate.outputs.ok == 'true'
        uses: ./.github/actions/commit-to-main
        with:
          verify-merged: "true"
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          paths: research/queue
          message: "research-queue: replenish, ${{ steps.gen.outputs.what }} (run ${{ github.run_id }})"
          pr-title: "research-queue: replenish, ${{ steps.gen.outputs.what }} (auto)"
          pr-body: >-
            ${{ steps.gen.outputs.what }} generated by scripts/research/queue_replenish.py from
            ${{ steps.gen.outputs.src }} (rules registered before any run). Self-lands only while `queue_replenish.py --verify`
            reproduces every added unit byte-for-byte at the merge-base
            (check_pr_landing.py E58).
          branch-prefix: automation/research-queue-replenish
      - name: Summarize
        if: always()
        run: |
          { echo "### research-queue replenish"; echo; echo '```'; cat /tmp/replenish.txt 2>/dev/null || echo "(no output)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
