name: hf-lake-kaggle-pilot

# PILOT (row HF-LAKE-STORAGE-403, lane HF-LAKE-SQUASH). Operator decision 2026-11-05 ~14:51Z, verbatim: "Kaggle 1 GB pilot first (Rec.)".
# Can the FROZEN (closed-month, immutable) crypto 1m history live in a PRIVATE Kaggle dataset `metis-market-lake` on the EXISTING Kaggle
# account (KAGGLE_API_TOKEN, the secret ml-data-export-kaggle.yml already uses)? Measures: (a) file-count limits and sharding for ~75-90 GB,
# (b) private-dataset size before/after a second version, (c) read path + speed from a runner (Kaggle API) and from a Kaggle kernel
# (/kaggle/input), (d) separately, Kaggle's ToS text. NEVER a new account. NOTHING is deleted from Hugging Face (read-only on HF).
#
# no-durable-result: storage pilot, computes no research verdict; its measurements are the job summary + a 30-day artifact, reported in the row note
#
# GATES THIS ADDS OR CHANGES: none. Data path only: no order path, no config the trader reads, no execution flag.
#
# Runs on pull_request (same-repo) for changes to the pilot itself, so the measurement happens before merge; no schedule, no issue trigger.

on:
  pull_request:
    paths:
      - ".github/workflows/hf-lake-kaggle-pilot.yml"
      - "scripts/data_lake/kaggle_pilot.py"
      - "scripts/data_lake/kaggle_pilot_kernel/**"

permissions:
  contents: read

concurrency:
  group: hf-lake-kaggle-pilot-${{ github.head_ref }}
  cancel-in-progress: false

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

jobs:
  pilot:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet "kaggle>=2.0" six huggingface_hub pandas pyarrow pyyaml requests
      - name: Stage ~1 GB of FROZEN crypto 1m partitions (HF read; falls back to Binance Vision if HF refuses the read)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -uo pipefail
          echo "::add-mask::${KAGGLE_API_TOKEN}"
          USERNAME=$(python - <<'PY'
          from kaggle.api.kaggle_api_extended import KaggleApi
          a = KaggleApi(); a.authenticate()
          print(a.config_values.get("username", ""))
          PY
          )
          [ -n "$USERNAME" ] || { echo "::error::token did not resolve to a Kaggle user"; exit 1; }
          echo "::add-mask::$USERNAME"
          echo "$USERNAME" > /tmp/kuser
          if python3 -u scripts/data_lake/kaggle_pilot.py stage --out /tmp/stage --username "$USERNAME" --target-gb 1.0 > /tmp/stage.json 2> /tmp/stage.err; then
            echo "source=hf" ; cat /tmp/stage.json
          else
            echo "HF stage failed (the account is AT its private cap; a read may be refused): $(tail -c 400 /tmp/stage.err)"
            echo "falling back to rebuilding 6 symbols from data.binance.vision (same builder as market-data-lake)"
            python3 -u scripts/data_lake/binance_vision_lake.py --market um_perp --stream klines --out /tmp/lake \
              --symbols BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT,DOGEUSDT 2>&1 | tail -3
            rm -rf /tmp/stage /tmp/stage-chosen.json
            python3 -u scripts/data_lake/kaggle_pilot.py stage --from-dir /tmp/lake --out /tmp/stage --username "$USERNAME" --target-gb 1.0 | tee /tmp/stage.json
          fi
          du -sh /tmp/stage; ls -la /tmp/stage | head
      - name: Quota snapshot 0, create v1, quota snapshot 1, create v2 (extra shard), quota snapshot 2
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -uo pipefail
          echo "::add-mask::${KAGGLE_API_TOKEN}"
          USERNAME=$(cat /tmp/kuser); echo "::add-mask::$USERNAME"
          scrub() { sed "s|$USERNAME|<user>|g"; }
          DS="$USERNAME/metis-market-lake"
          cat > /tmp/quota.py <<'PY'
          import json, sys
          from kaggle.api.kaggle_api_extended import KaggleApi
          a = KaggleApi(); a.authenticate()
          out = {"api_quota_like_methods": [m for m in dir(a) if any(k in m.lower() for k in ("quota", "usage", "storage"))]}
          rows, total = [], 0
          try:
              for d in a.dataset_list(mine=True, page_size=100) if "page_size" in a.dataset_list.__code__.co_varnames else a.dataset_list(mine=True):
                  tb = getattr(d, "total_bytes", None) or getattr(d, "totalBytes", None)
                  priv = getattr(d, "is_private", None)
                  if priv is None:
                      priv = getattr(d, "isPrivate", None)
                  ref = str(getattr(d, "ref", ""))
                  rows.append({"ref": ref.split("/")[-1], "bytes": tb, "private": priv,
                               "version": getattr(d, "current_version_number", None) or getattr(d, "currentVersionNumber", None)})
                  if priv and tb:
                      total += int(tb)
          except Exception as e:
              out["list_error"] = str(e)[:300]
          out["datasets"] = rows
          out["sum_private_current_version_bytes"] = total
          print(json.dumps(out))
          PY
          snap() { python3 /tmp/quota.py | scrub | tee "/tmp/quota-$1.json"; }
          wait_ready() {
            for i in $(seq 1 120); do
              st=$(kaggle datasets status "$1" 2>&1 | scrub); echo "dataset $1: $st"
              case "$st" in *[Rr]eady*|*READY*) return 0;; esac
              sleep 15
            done
            return 1
          }
          snap 0
          T0=$(date +%s)
          if kaggle datasets status "$DS" >/dev/null 2>&1; then
            echo "dataset exists from an earlier run: versioning instead of creating"
            kaggle datasets version -p /tmp/stage -r skip -m "pilot v1 $(date -u +%H:%MZ) run ${GITHUB_RUN_ID}" 2>&1 | scrub | grep -v "it/s\|B/s" | tail -5 || true
          else
            kaggle datasets create -p /tmp/stage -r skip 2>&1 | scrub | grep -v "it/s\|B/s" | tail -5 || true
          fi
          wait_ready "$DS" || echo "::warning::v1 never reported ready"
          T1=$(date +%s); echo "v1_upload_and_ready_seconds=$((T1-T0))" | tee /tmp/timing.txt
          snap 1
          # second version: a different, smaller shard set added next to v1's shards
          FROM=""; [ -d /tmp/lake ] && FROM="--from-dir /tmp/lake"
          python3 scripts/data_lake/kaggle_pilot.py extra --out /tmp/stage $FROM --prev-chosen /tmp/stage-chosen.json --target-gb 0.3 2>&1 | tail -2
          kaggle datasets version -p /tmp/stage -r skip -m "pilot v2 $(date -u +%H:%MZ) run ${GITHUB_RUN_ID}" 2>&1 | scrub | grep -v "it/s\|B/s" | tail -5 || true
          wait_ready "$DS" || echo "::warning::v2 never reported ready"
          T2=$(date +%s); echo "v2_upload_and_ready_seconds=$((T2-T1))" | tee -a /tmp/timing.txt
          snap 2
          kaggle datasets files "$DS" 2>&1 | scrub | head -20 | tee /tmp/files.txt
      - name: File-count limit probe (120 tiny TOP-LEVEL files in a separate private dataset)
        run: |
          set -uo pipefail
          echo "::add-mask::${KAGGLE_API_TOKEN}"
          USERNAME=$(cat /tmp/kuser); echo "::add-mask::$USERNAME"
          scrub() { sed "s|$USERNAME|<user>|g"; }
          python3 scripts/data_lake/kaggle_pilot.py flat --out /tmp/flat --username "$USERNAME" --n 120
          if kaggle datasets status "$USERNAME/metis-market-lake-filecount-probe" >/dev/null 2>&1; then
            kaggle datasets version -p /tmp/flat -r skip -m "probe $(date -u +%H:%MZ)" 2>&1 | scrub | tail -8 | tee /tmp/flatres.txt || true
          else
            kaggle datasets create -p /tmp/flat -r skip 2>&1 | scrub | tail -8 | tee /tmp/flatres.txt || true
          fi
          sleep 45
          kaggle datasets status "$USERNAME/metis-market-lake-filecount-probe" 2>&1 | scrub | tee -a /tmp/flatres.txt
          kaggle datasets files "$USERNAME/metis-market-lake-filecount-probe" 2>&1 | scrub | wc -l | sed 's/^/files_listed_lines=/' | tee -a /tmp/flatres.txt
      - name: Summary + artifact
        if: always()
        run: |
          mkdir -p out
          cp /tmp/stage.json /tmp/stage.err /tmp/quota-*.json /tmp/timing.txt /tmp/files.txt /tmp/flatres.txt out/ 2>/dev/null || true
          { echo '### hf-lake-kaggle-pilot: stage'; cat /tmp/stage.json 2>/dev/null; echo; echo '### timing'; cat /tmp/timing.txt 2>/dev/null;
            echo; echo '### quota snapshots 0/1/2'; for i in 0 1 2; do cat /tmp/quota-$i.json 2>/dev/null; echo; done;
            echo '### file-count probe'; cat /tmp/flatres.txt 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hf-lake-kaggle-pilot-${{ github.run_id }}
          path: out
          retention-days: 30

  verify-runner:
    needs: pilot
    if: ${{ !cancelled() && needs.pilot.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet "kaggle>=2.0" six
      - name: Download the dataset on a GitHub runner via the Kaggle API (timed) and re-hash it
        run: |
          set -uo pipefail
          echo "::add-mask::${KAGGLE_API_TOKEN}"
          USERNAME=$(python - <<'PY'
          from kaggle.api.kaggle_api_extended import KaggleApi
          a = KaggleApi(); a.authenticate()
          print(a.config_values.get("username", ""))
          PY
          )
          echo "::add-mask::$USERNAME"
          mkdir -p /tmp/dl
          T0=$(date +%s)
          kaggle datasets download -d "$USERNAME/metis-market-lake" -p /tmp/dl --unzip 2>&1 | sed "s|$USERNAME|<user>|g" | grep -v "it/s\|B/s" | tail -3
          T1=$(date +%s)
          BYTES=$(du -sb /tmp/dl | cut -f1)
          echo "{\"download_seconds\": $((T1-T0)), \"bytes\": $BYTES, \"MBps\": $(python3 -c "print(round($BYTES/1e6/max($T1-$T0,1),1))")}" | tee verify-runner-download.json
          python3 scripts/data_lake/kaggle_pilot.py verify --root /tmp/dl --record verify-runner.json
          { echo '### runner download'; cat verify-runner-download.json; echo; cat verify-runner.json; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hf-lake-kaggle-verify-runner-${{ github.run_id }}
          path: |
            verify-runner-download.json
            verify-runner.json
          retention-days: 30

  verify-kaggle:
    needs: pilot
    if: ${{ !cancelled() && needs.pilot.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet "kaggle>=2.0" six
      - name: Mount the dataset in a CPU Kaggle kernel and read it (timed)
        run: |
          set -uo pipefail
          echo "::add-mask::${KAGGLE_API_TOKEN}"
          USERNAME=$(python - <<'PY'
          from kaggle.api.kaggle_api_extended import KaggleApi
          a = KaggleApi(); a.authenticate()
          print(a.config_values.get("username", ""))
          PY
          )
          echo "::add-mask::$USERNAME"
          scrub() { sed "s|$USERNAME|<user>|g"; }
          mkdir -p /tmp/k && cp scripts/data_lake/kaggle_pilot_kernel/kernel_read.py /tmp/k/
          python3 - "$USERNAME" <<'PY'
          import json, sys
          u = sys.argv[1]
          json.dump({"id": f"{u}/metis-market-lake-read-pilot", "title": "metis-market-lake-read-pilot",
                     "code_file": "kernel_read.py", "language": "python", "kernel_type": "script",
                     "is_private": "true", "enable_gpu": "false", "enable_tpu": "false", "enable_internet": "false",
                     "dataset_sources": [f"{u}/metis-market-lake"], "competition_sources": [],
                     "kernel_sources": [], "model_sources": []}, open("/tmp/k/kernel-metadata.json", "w"), indent=1)
          PY
          timeout 300 kaggle kernels push -p /tmp/k 2>&1 | scrub | tee /tmp/push.txt
          grep -qi "error\|fail" /tmp/push.txt && { echo "::error::kernel push failed"; exit 1; }
          deadline=$(( $(date +%s) + 2400 ))
          while :; do
            s=$(timeout 90 kaggle kernels status "$USERNAME/metis-market-lake-read-pilot" 2>&1 | scrub); echo "$(date -u +%H:%M:%S) $s"
            case "$s" in *COMPLETE*|*ERROR*|*CANCEL*) break;; esac
            [ "$(date +%s)" -gt "$deadline" ] && { echo "::error::kernel timed out"; exit 1; }
            sleep 30
          done
          mkdir -p kout && timeout 300 kaggle kernels output "$USERNAME/metis-market-lake-read-pilot" -p kout 2>&1 | scrub | tail -3
          cat kout/result.json | tee verify-kaggle.json
          { echo '### kaggle kernel read'; cat verify-kaggle.json; } >> "$GITHUB_STEP_SUMMARY"
          python3 -c "import json,sys; r=json.load(open('verify-kaggle.json')); sys.exit(0 if r.get('ok') else 1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hf-lake-kaggle-verify-kernel-${{ github.run_id }}
          path: verify-kaggle.json
          retention-days: 30
