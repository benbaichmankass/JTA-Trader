# JC-CA-04 (docs/audits/code-audit-2026-09-27.md §6, `A09-hold-merge-unenforced`,
# operator decision 2026-09-28: "Post-merge alarm", option B only).
#
# THE FINDING: nothing mechanical stops a session merging a Tier-2/3 PR
# declared `landing: "hold"` in its .github/pr-landing/<slug>.json — it can be
# green on every required check, and merge tools are pre-allowed. `hold` means
# "a human decides"; nothing today enforces that anyone did.
#
# THIS IS A DETECTOR, NOT A GATE (deliberately). The operator chose option B
# only: catch it AFTER THE FACT and page loudly, rather than option A (a
# branch-protection / CODEOWNERS block on TIER3_PATHS) which would also slow
# every legitimate operator-approved Tier-2/3 merge with an extra click. If
# the residual gap option B leaves open ever matters, that is the operator's
# call to make separately (see JC-CA-04 §6.3 in the audit), not this
# workflow's to assume.
#
# WHAT IT DOES: on every push to main, select every in-scope PR merged in the
# last 6 h not yet labelled hold-merge-graded (see the concurrency note), read each merged PR's .github/pr-landing/<slug>.json (already in the
# tree at this push, the same file check_pr_landing.py required pre-merge)
# and its GitHub reviews, and hand both to the pure decision logic in
# scripts/ops/pr_landing_hold_alarm.py. On ALARM (tier 2/3, landing: "hold",
# no human APPROVED review recorded), open a `system-action` / `send-ping`
# issue — the same relay r4-demotion-gate.yml already uses for its own
# realtime ping — so the operator is paged with the PR number and title.
#
# ⚠️ UNREADABLE IS NOT CLEAN. If the declaration or the reviews list could not
# be fetched, the job FAILS (visible red in Actions) rather than silently
# passing — docs/CLAUDE-RULES-CANONICAL.md § "Green is not evidence": an alarm
# that stays quiet because its OWN reads failed is worse than no alarm, because
# it looks like a clean pass. It does not additionally page the operator for a
# transient API hiccup, to avoid training the ping channel to be ignored (the
# alarm-fatigue P1 the same doc names) — a red run in Actions history is the
# honest signal for "we could not look", not a duplicate of the real alarm.
name: pr-landing hold-merge alarm

on:
  push:
    branches: [main]

# ONE group, no cancel (ACTIONS-QUEUE-BACKLOG alarm dedupe, manager-approved 2026-11-19). The old
# per-sha group queued one run per push to main. With one group GitHub keeps a single pending run and
# DROPS older pending ones, so a run no longer grades "its" push: it grades every in-scope PR merged in
# the last 6 h that does not carry the `hold-merge-graded` label (pr_landing_hold_alarm.py --select-from),
# then labels each PR it graded to a final state. A dropped push's PR is graded by the next run; a PR is
# never graded, or paged, twice.
concurrency:
  group: pr-landing-hold-merge-alarm
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write   # the hold-merge-graded dedupe label (2026-11-19)
  issues: write

jobs:
  alarm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # WORKFLOW-PRUNE P4 (2026-11-06): this job reads one script and the PR declarations, but its full checkout took ~49 s of a
      # ~56 s run, on every push to main (1,610 runs/wk). Sparse + blobless: same files, same outputs. The script is stdlib-only.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /scripts/ops/pr_landing_hold_alarm.py
            /.github/pr-landing/
            /docs/claude/work/checklist/
            /docs/claude/work/pipeline/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Grade every PR associated with this push
        env:
          GH_TOKEN: ${{ github.token }}
          # The ping issue must be opened with a PAT: an issue opened with GITHUB_TOKEN starts no workflow, so
          # system-actions never ran and no alarm was ever delivered (PI-20261112-BOTPING-0001; #25058 #25061
          # #25062 #25065 created 0 runs). Falls back to GITHUB_TOKEN only if the secret is unset.
          PING_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          # HOLD-ALARM-PING-DIRECT: the direct ops channel's credential (the same secret other workflows
          # already use for the work store). The ping goes there first; a system-actions issue is the fallback.
          WORK_STORE_TOKEN: ${{ secrets.WORK_STORE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          closed=/tmp/closed-prs.json
          if ! gh api "repos/${REPO}/pulls?state=closed&sort=updated&direction=desc&per_page=100" > "$closed" 2>/dev/null; then
            echo "::warning::could not list recently closed PRs -- this run could not look (not clean)"
            exit 1
          fi
          prs=$(python3 scripts/ops/pr_landing_hold_alarm.py --select-from "$closed")
          if [ -z "$prs" ]; then
            echo "no in-scope PR merged in the last 6 h without the hold-merge-graded label -- nothing to grade"
            exit 0
          fi

          overall_rc=0
          # A here-string, not a pipe: `echo ... | while ...` would run the
          # loop in a subshell in bash, and overall_rc set inside it would be
          # lost the moment the loop ends -- silently turning every UNREADABLE
          # into a green job. <<< keeps the loop in THIS shell.
          while IFS=$'\t' read -r pr_number pr_title head_ref; do
            [ -z "$pr_number" ] && continue
            echo "::group::PR #${pr_number} (${head_ref})"

            # Slug derivation matches .github/pr-landing/README.md and
            # claude-pr-automerge.yml: strip a leading claude/, then / -> -.
            slug=$(python3 -c "import sys; ref = sys.argv[1]; ref = ref[len('claude/'):] if ref.startswith('claude/') else ref; print(ref.replace('/', '-'))" "$head_ref")
            decl_path=".github/pr-landing/${slug}.json"

            if [ -f "$decl_path" ]; then
              decl_arg="$decl_path"
              if ! python3 -c "import json; json.load(open('$decl_path'))" 2>/dev/null; then
                decl_arg="UNREADABLE"
              fi
            else
              decl_arg="MISSING"
            fi

            reviews_path="/tmp/reviews-${pr_number}.json"
            if gh api "repos/${REPO}/pulls/${pr_number}/reviews" --paginate > "$reviews_path" 2>/dev/null \
               && python3 -c "import json; d=json.load(open('$reviews_path')); assert isinstance(d, list)" 2>/dev/null; then
              reviews_arg="$reviews_path"
            else
              reviews_arg="UNREADABLE"
            fi

            # The PR object: its body may cite the operator decision, its labels may carry operator-approved.
            pr_path="/tmp/pr-${pr_number}.json"
            if gh api "repos/${REPO}/pulls/${pr_number}" > "$pr_path" 2>/dev/null \
               && python3 -c "import json; d=json.load(open('$pr_path')); assert isinstance(d, dict)" 2>/dev/null; then
              pr_arg="$pr_path"
            else
              pr_arg="UNREADABLE"
            fi

            set +e
            out=$(python3 scripts/ops/pr_landing_hold_alarm.py \
              --decl-json "$decl_arg" --reviews-json "$reviews_arg" --pr-json "$pr_arg" \
              --pr-number "$pr_number" --pr-title "$pr_title")
            rc=$?
            set -e
            echo "$out"
            echo "::endgroup::"

            # The dedupe marker: a PR graded to a FINAL state (clean or alarm) is labelled so no later
            # run grades or pages it again. UNREADABLE (rc 3) is not final and stays unlabelled for a retry.
            if [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ]; then
              gh api -X POST "repos/${REPO}/issues/${pr_number}/labels" -f "labels[]=hold-merge-graded" >/dev/null 2>&1 \
                || echo "::warning::could not label PR #${pr_number} hold-merge-graded; a later run may grade it again"
            fi

            if [ "$rc" -eq 2 ]; then
              ping_msg=$(echo "$out" | tail -n1)
              # HOLD-ALARM-PING-DIRECT (option b, manager 2026-11-12): send the ping through the direct ops channel
              # (POST /api/bot/ops/actions send-ping, Tier 1, one Telegram message, no mutation) instead of opening a
              # system-actions issue, which costs a runner and fans out issue-triggered workflows. 202 = queued in the
              # ops jobs store, which runs it when the runner is up. Anything else (no token, refused, host down)
              # falls back to the issue path below, so the alarm is never dropped.
              direct="no"
              if [ -n "${WORK_STORE_TOKEN:-}" ]; then
                body=$(python3 -c 'import json,sys; print(json.dumps({"action": "send-ping", "session": "pr-landing-hold-merge-alarm", "reason": "JC-CA-04 hold-merge alarm", "params": {"message": sys.argv[1], "priority": "high", "target": "claude"}}))' \
                  "${ping_msg} (pr-landing-hold-merge-alarm, run ${{ github.run_id }})")
                code=$(curl -sS -o /tmp/ping-${pr_number}.json -w '%{http_code}' --max-time 30 -X POST \
                  -H "X-Work-Store-Token: ${WORK_STORE_TOKEN}" -H 'Content-Type: application/json' \
                  --data "$body" "https://ict-bot.duckdns.org/api/bot/ops/actions" || echo "000")
                if [ "$code" = "202" ] || [ "$code" = "200" ]; then
                  direct="yes"
                  echo "hold-merge alarm for PR #${pr_number} sent via the direct ops channel (HTTP ${code})"
                else
                  echo "::warning::direct ops channel did not accept the ping (HTTP ${code}); falling back to a system-actions issue"
                fi
              fi
              [ "$direct" = "yes" ] && continue
              GH_TOKEN="${PING_TOKEN:-$GH_TOKEN}" gh issue create --label system-action \
                --title "send-ping: PR #${pr_number} hold-merge alarm (JC-CA-04)" \
                --body "$(printf 'action: send-ping\npriority: high\nmessage: %s (pr-landing-hold-merge-alarm, run %s)\nreason: JC-CA-04 A09-hold-merge-unenforced -- tier 2/3 landing:hold PR merged with no recorded human approval' "$ping_msg" "${{ github.run_id }}")"
            elif [ "$rc" -eq 3 ]; then
              echo "::warning::pr-landing-hold-merge-alarm could not evaluate PR #${pr_number} (unreadable declaration or reviews) -- see the log above"
              overall_rc=1
            fi
          done <<< "$prs"
          exit "${overall_rc:-0}"
