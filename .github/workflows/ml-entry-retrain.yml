name: ml-entry-retrain
run-name: ml-entry-retrain ${{ github.event_name }} ${{ inputs.run_date || '' }}

# WEEKLY CANDIDATE RETRAIN of the live ENTRY model (row ML-ENTRY-RETRAIN-CADENCE, Tier 2, held PR; operator 2026-11-01:
# "a plan for feeding and retraining on more and better data now, not at an unspecified date").
#
# Sunday 04:00Z, first scheduled run 2026-11-08T04:00Z. Refits the REGISTERED c692-01 recipe on all data through the
# previous UTC day minus the registered embargo (scripts/research/ml_entry_retrain.py) and uploads the CANDIDATE artifact
# + freshness.json (feature list, sha256, data-through date) as the run artifact (kept 90 days).
#
# IT NEVER SWAPS THE SERVED MODEL ON ITS OWN: the grade step (scripts/research/ml_entry_candidate_grade.py, rule
# RULE-ENTRY-PROMOTE-20261106, docs/research/ml-entry-promotion-rule-2026-11-06.md) scores the as-of-(today-14d) refit against the
# served artifact on the same post-train window, net of the full cost stack. PASS -> a DRAFT PR (landing hold) that adds a NEW
# versioned artifact directory and repoints the ONE served pointer ml/served/ENTRY_SERVED.json; a human merges it. FAIL or
# insufficient_n -> the old artifact keeps serving and the run goes red (claude-run-failure-alert = the ONE flag). NO HALTING: a failed retrain leaves the previous artifact serving, writes
# retrain_status.json, and the red Actions run is the ONE red flag; the next Sunday tries again (no retry loop, no gate).
# The trader-side freshness line (src/runtime/ml_entry_live_monitor.py) grades the SERVED artifact's data-through date.
#
# no-durable-result: weekly CANDIDATE artifact (model + freshness.json) with no verdict or measurement; serving it is the operator's call and the candidate has had no held-out read
# Keyless: public Binance Vision archives only, no secrets, no VM, persist-credentials: false.
# Gates this adds or changes: none (it automates the evidence rule a real-money model change already needs; a human still merges).

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      run_date:
        description: "UTC date to treat as 'today' (YYYY-MM-DD); empty = now. Dry runs only; never a command."
        default: ""
      mode:
        description: "retrain (default: retrain + grade) or gaps (Tier-1 diagnostic: where are the hourly bar holes). A choice, never a command."
        type: choice
        options: [retrain, gaps]
        default: retrain

permissions:
  contents: write        # ONLY the PASS step pushes a bot branch; nothing here writes main or ml/served on main
  pull-requests: write   # ONLY the PASS step opens a DRAFT PR

concurrency:
  group: ml-entry-retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}   # a PR opened/pushed with the default GITHUB_TOKEN never starts CI (.github/actions/commit-to-main)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (the versions the research runner and the trader pin)
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyyaml requests lightgbm==4.6.0 scikit-learn==1.7.2
      - name: Recipe self-test (the recipe still matches the served artifact)
        if: inputs.mode != 'gaps'
        run: python3 scripts/research/ml_entry_retrain.py --self-test
      - name: Retrain the candidate
        if: inputs.mode != 'gaps'
        env:
          RUN_DATE: ${{ inputs.run_date }}
        run: |
          set -euo pipefail
          python3 scripts/research/ml_entry_retrain.py run --out out --cache /tmp/ml_entry_klines ${RUN_DATE:+--run-date "$RUN_DATE"}
      - name: Bar-gap diagnostic (mode=gaps only)
        if: inputs.mode == 'gaps'
        env:
          RUN_DATE: ${{ inputs.run_date }}
        run: |
          set -euo pipefail
          python3 scripts/research/ml_entry_bar_gaps.py --self-test
          python3 scripts/research/ml_entry_bar_gaps.py --out out --cache /tmp/ml_entry_klines ${RUN_DATE:+--run-date "$RUN_DATE"}
      - name: Grade the candidate against the served artifact (registered rule RULE-ENTRY-PROMOTE-20261106)
        id: grade
        if: inputs.mode != 'gaps'
        continue-on-error: true   # the non-pass branches below must run; the LAST step turns a non-pass into the red run (the one flag)
        env:
          RUN_DATE: ${{ inputs.run_date }}
        run: |
          set -euo pipefail
          python3 scripts/research/ml_entry_candidate_grade.py --self-test
          python3 scripts/research/ml_entry_candidate_grade.py run --cache /tmp/ml_entry_klines --out out --candidate-json out/candidate_model.json ${RUN_DATE:+--run-date "$RUN_DATE"}
      - name: PASS -> open a DRAFT promotion PR (landing hold; main only, never merges)
        if: steps.grade.outcome == 'success' && github.ref == 'refs/heads/main' && hashFiles('out/promote/*/model.json') != ''
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          D=$(ls out/promote | head -1); TAG=${D#ml_decision_entry_v1r}; SLUG="ml-entry-promote-${TAG}-${RUN_ID}"; BR="bot/${SLUG}"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"   # the PAT: the pushed branch DOES start CI
          git checkout -b "$BR"
          cp -r "out/promote/$D" "ml/served/$D"
          python3 - "$D" "$RUN_ID" <<'PY'
          import json, sys
          json.dump({"artifact_dir": sys.argv[1], "note": "The ONE served-ENTRY-model pointer (src/runtime/ml_entry_served.py). Repointed by ml-entry-retrain run " + sys.argv[2] + " after RULE-ENTRY-PROMOTE-20261106 PASSED. Revert = set artifact_dir back to ml_decision_entry_v1."}, open("ml/served/ENTRY_SERVED.json", "w"), indent=2)
          PY
          mkdir -p "comms/research/ml_entry_grade/${RUN_ID}"; cp out/grade_evidence.json "comms/research/ml_entry_grade/${RUN_ID}/"
          mkdir -p .github/pr-landing
          printf '{"tier":3,"landing":"hold","hold_reason":"tier_2_3_needs_approval","hold_text":"Real-money ENTRY model replacement (bybit_2, bybit_portfolio): a human merges after reading the grade evidence.","why":"HELD: ml-entry-retrain run %s graded a candidate PASS under RULE-ENTRY-PROMOTE-20261106 and proposes repointing the served ENTRY model (real money: bybit_2, bybit_portfolio). A human merges; revert is a one-line pointer edit."}\n' "$RUN_ID" > ".github/pr-landing/${SLUG}.json"
          python3 scripts/ops/claim_merge_slot.py --branch-claim --branch "$BR" --held-by "workflow:ml-entry-retrain:${RUN_ID}" --purpose "held ENTRY model promotion" || true
          git add -A ml/served comms/research .github/pr-landing .github/merge-slots
          git commit -qm "ML entry: graded candidate PASS -> ml/served/${D} + repoint (HELD, run ${RUN_ID})"
          git push -q origin "$BR"
          gh pr create --draft --base main --head "$BR" --title "ML entry: PROMOTE graded candidate ${D} (HELD, run ${RUN_ID})" \
            --body "ml-entry-retrain run ${RUN_ID} graded a candidate PASS under RULE-ENTRY-PROMOTE-20261106 (docs/research/ml-entry-promotion-rule-2026-11-06.md). Evidence: comms/research/ml_entry_grade/${RUN_ID}/grade_evidence.json. Adds ml/served/${D} and repoints ml/served/ENTRY_SERVED.json; the old directory stays (revert = one-line pointer edit). Gates this adds or changes: none. HELD: a human merges. NOTE: this PR is pushed with GITHUB_TOKEN, so CI does not start until someone pushes an ordinary commit to the branch."
      - name: Stage the non-pass evidence record (the ledger row is already appended by the grader)
        id: stage
        if: steps.grade.outcome == 'failure' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p "comms/research/ml_entry_grade/${{ github.run_id }}"
          cp out/grade_evidence.json "comms/research/ml_entry_grade/${{ github.run_id }}/"
      - name: Land the non-pass evidence + ledger read on main (one self-landing PR; a non-pass read still counts toward the deflated bar)
        if: steps.stage.outcome == 'success'
        uses: ./.github/actions/commit-to-main
        with:
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          paths: comms/research/ml_entry_grade comms/research/holdout_reads.jsonl
          message: "ml-entry grade: non-pass evidence + holdout read (run ${{ github.run_id }})"
          pr-title: "ml-entry grade: non-pass evidence + holdout read (run ${{ github.run_id }})"
          pr-body: "Automated (auto-merge): grade_evidence.json and the ENTRY holdout-ledger read for a candidate that did not pass RULE-ENTRY-PROMOTE-20261106 (docs/research/ml-entry-promotion-rule-2026-11-06.md). The served model is unchanged."
          verify-merged: "true"
      - name: Upload the candidate (also on failure, retrain_status.json says why)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-entry-retrain-${{ github.run_id }}
          path: out
          retention-days: 90
          if-no-files-found: warn
      - name: A non-pass grade is the ONE red flag (the served model keeps trading)
        if: steps.grade.outcome == 'failure'
        run: |
          echo "::error::ml-entry grade did not PASS (insufficient_n / fail / error): the served ENTRY artifact is kept. Evidence: out/grade_evidence.json (uploaded) and, on main, the evidence PR."
          exit 1
      - name: Summarize the freshness line
        if: always()
        run: |
          {
            echo "### ml-entry-retrain"
            echo
            echo '```'
            cat out/freshness.json 2>/dev/null | head -40 || true
            cat out/retrain_status.json 2>/dev/null || echo "(no retrain_status.json)"
            python3 -c "import json;d=json.load(open('out/grade_evidence.json'));print(json.dumps({k:d.get(k) for k in ('rule_id','verdict','why','plan','holdout_claim','today_candidate','refit_reproduces_retrain_candidate')},indent=1,default=str))" 2>/dev/null || echo "(no grade_evidence.json)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
