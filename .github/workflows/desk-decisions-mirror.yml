name: desk-decisions-mirror

# DESK-6-SHADOW-PILOT. Desk wakes write rows to the protected append-only `desk/decisions`
# branch (.claude/skills/trading-desk/DESK-BRIEF.md § 5), the live-review/rows pattern. main
# must carry the full record and every decision's outcome, so this workflow, on a main
# checkout:
#   1. mirrors every branch row main lacks, BY decision_id, plus the packet it cites
#      (scripts/ops/desk_branch.py mirror; a re-run is a no-op);
#   2. replays every due shadow proposal on the real candles, net of the full cost stack,
#      into comms/desk/outcomes.jsonl (scripts/ops/desk_outcomes.py) -- the outcome join that
#      makes each decision a graded training row;
#   3. validates the whole desk record with desk-records-guard;
#   3b. grades Claude's decisions per role (scripts/ops/claude_role_grade.py, DESK-9-GRADING): the no_trade
#      counterfactual on real forward candles + the n ledger (recorded / graded / needed / earliest ETA per
#      role and action class) -> comms/desk/role_grade.json. A grading failure is a warning, never a stop of
#      the mirror (Prime Directive rule 7); the snapshot is rewritten only when an n/state moved or it is
#      ~20 h old, so it adds at most one landing a day when nothing moved;
#   4. lands it in ONE self-landing PR (commit-to-main, verify-merged).
# One run at a time (concurrency group; each run waits for its PR to merge).
# ⚠️ A `push` run uses the workflow file AS IT EXISTS ON THE PUSHED BRANCH, and desk/decisions was cut
# from main before step 3b existed, so a push run NEVER grades (measured 2026-10-27: every run since
# #20501 was a stale-file push run; the cron also fired late or not at all). The full workflow therefore
# runs from main: `branch-mirror-heartbeat.yml` dispatches it (`--ref main`) on every main push. Do not
# rely on the push trigger or the cron for anything beyond mirroring rows.
# Tier 1: data copy + an offline replay; no runtime effect.

on:
  push:
    branches: ["desk/decisions"]
    paths: ["comms/desk/decisions.jsonl"]
  schedule:
    - cron: "48 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: desk-decisions-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 110  # commit-to-main verify-merged waits up to 80 min (tests/test_commit_to_main_callers.py)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Mirror rows, replay outcomes, validate
        id: mirror
        run: |
          set -o pipefail
          pip install --quiet pyyaml pandas
          git fetch --no-tags origin desk/decisions
          rc=0
          python3 scripts/ops/desk_branch.py mirror --ref origin/desk/decisions \
            | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" -ne 2 ] || { echo "::error::could not read desk/decisions"; exit 1; }
          python3 scripts/ops/desk_outcomes.py | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/ci/check_desk_records.py
          if [ -n "$(git status --porcelain comms/desk)" ]; then echo "changed=1" >> "$GITHUB_OUTPUT"; else echo "changed=0" >> "$GITHUB_OUTPUT"; fi

      - name: Grade Claude's decisions per role (DESK-9-GRADING)
        id: grade
        continue-on-error: true
        env:
          DIAG_READ_TOKEN: ${{ secrets.DIAG_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/ops/claude_role_grade.py --live --write comms/desk/role_grade.json \
            | tee -a "$GITHUB_STEP_SUMMARY" || { echo "::warning::claude_role_grade failed; the mirror still lands"; exit 0; }
          if [ -n "$(git status --porcelain comms/desk)" ]; then echo "changed=1" >> "$GITHUB_OUTPUT"; else echo "changed=0" >> "$GITHUB_OUTPUT"; fi

      - name: Land on main (one self-landing PR)
        if: steps.mirror.outputs.changed == '1' || steps.grade.outputs.changed == '1'
        uses: ./.github/actions/commit-to-main
        with:
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          paths: comms/desk comms/desk/role_grade.json
          # the grade snapshot is regenerated hourly (idempotent): on a stale-branch conflict adopt main's copy
          refresh-command: git fetch -q origin main && git checkout FETCH_HEAD -- comms/desk/role_grade.json || true
          message: "desk: mirror decisions from desk/decisions + replayed outcomes"
          pr-title: "desk: mirror decisions from desk/decisions + replayed outcomes"
          pr-body: "Automated mirror (auto-merge): rows on desk/decisions that main's comms/desk/decisions.jsonl lacks, merged by decision_id, plus the packets they cite; and outcomes.jsonl rows for shadow proposals whose horizon has passed (replayed on real candles, net of the full cost stack). scripts/ops/desk_branch.py, scripts/ops/desk_outcomes.py."
          verify-merged: "true"

      - name: Fail the run if a row was skipped
        if: steps.mirror.outputs.rc == '1'
        run: |
          echo "::error::a desk/decisions row was skipped; see the mirror summary"
          exit 1
