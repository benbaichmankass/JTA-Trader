name: desk-decisions-mirror

# DESK-6-SHADOW-PILOT. Desk wakes write rows to the protected append-only `desk/decisions`
# branch (.claude/skills/trading-desk/DESK-BRIEF.md § 5), the live-review/rows pattern. main
# must carry the full record and every decision's outcome, so this workflow, on a main
# checkout:
#   1. mirrors every branch row main lacks, BY decision_id, plus the packet it cites
#      (scripts/ops/desk_branch.py mirror; a re-run is a no-op);
#   2. replays every due shadow proposal on the real candles, net of the full cost stack,
#      into comms/desk/outcomes.jsonl (scripts/ops/desk_outcomes.py) -- the outcome join that
#      makes each decision a graded training row;
#   3. validates the whole desk record with desk-records-guard;
#   3b. grades Claude's decisions per role (scripts/ops/claude_role_grade.py, DESK-9-GRADING): the no_trade
#      counterfactual on real forward candles + the n ledger (recorded / graded / needed / earliest ETA per
#      role and action class) -> comms/desk/role_grade.json. A grading failure is a warning, never a stop of
#      the mirror (Prime Directive rule 7); the snapshot is rewritten only when an n/state moved or it is
#      ~20 h old, so it adds at most one landing a day when nothing moved;
#   3c. feed-gap alerts (scripts/ops/desk_feed_gaps.py, DESK-14): every external_context.items[] a wake logged is a
#      named data feed the packet lacks -> comms/desk/feed_gaps.jsonl + ONE pipeline item per NEW gap name. A failure
#      is a warning, never a stop (Prime Directive rule 7);
#   4. lands it in ONE self-landing PR (commit-to-main, verify-merged).
# One run at a time (concurrency group; no in-run merge wait -- the next run verifies arrival, CI-SUITE-SLOWDOWN 2026-11-12).
# ⚠️ A `push` run uses the workflow file AS IT EXISTS ON THE PUSHED BRANCH, and desk/decisions was cut
# from main before step 3b existed, so a push run NEVER grades (measured 2026-10-27: every run since
# #20501 was a stale-file push run; the cron also fired late or not at all). The full workflow therefore
# runs from main: `branch-mirror-heartbeat.yml` dispatches it (`--ref main`) on every main push. Do not
# rely on the push trigger or the cron for anything beyond mirroring rows.
# Tier 1: data copy + an offline replay; no runtime effect.

on:
  push:
    branches: ["desk/decisions"]
    paths: ["comms/desk/decisions.jsonl"]
  schedule:
    - cron: "48 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: desk-decisions-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # no in-run merge wait since CI-SUITE-SLOWDOWN (2026-11-12): checkout + mirror + pricing only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}

      # CI-SUITE-SLOWDOWN (2026-11-12): NO IN-RUN MERGE WAIT. This job used to hold a hosted runner for up to
      # 80 min in commit-to-main's verify-merged while its own PR waited on the queued checks, and that wait
      # was itself one of the 20 slots the checks were queued behind (MEASURED 2026-11-12: this mirror and its
      # sibling each held a slot ~90 min while 20/20 slots were busy and ~600 jobs queued). Arrival is now
      # verified ONE CYCLE LATER, here: an open mirror PR younger than 4 h means "still landing" -> this
      # run computes and validates but does not open a second PR; one older than that is STRANDED -> it is
      # closed, this run re-lands everything main still lacks (the mirror is idempotent by id), and the run
      # goes red once (Prime Directive rule 7: keep going, one flag). Fails open: an API error lands anyway.
      # Pinned in tests/test_commit_to_main_callers.py::DEFERRED_VERIFY.
      - name: Check for an in-flight mirror PR (deferred merge verification)
        id: inflight
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          PREFIX: automation/desk-decisions-mirror
          MAX_AGE_S: "14400"
        run: |
          set -uo pipefail
          prs="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --paginate \
                --jq '.[] | select(.head.ref | startswith(env.PREFIX)) | "\((now - (.created_at | fromdateiso8601)) | floor) \(.number)"')" \
            || { echo "::warning::could not list open PRs; landing anyway"; echo "skip=0" >> "$GITHUB_OUTPUT"; exit 0; }
          skip=0; stranded=""
          while read -r age n; do
            [ -n "${n:-}" ] || continue
            if [ "$age" -gt "$MAX_AGE_S" ]; then
              stranded="$stranded #$n"
              gh pr close "$n" --repo "$GITHUB_REPOSITORY" --comment "Closed by $GITHUB_WORKFLOW run $GITHUB_RUN_ID: this mirror PR did not merge within 4 h (stranded). The run re-lands every row main still lacks in a fresh PR." || true
            else
              skip=1; echo "::notice::mirror PR #$n (${age}s old) is still landing; not opening a second one this run"
            fi
          done <<< "$prs"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "stranded=$stranded" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Mirror rows, replay outcomes, validate
        id: mirror
        run: |
          set -o pipefail
          pip install --quiet pyyaml pandas
          git fetch --no-tags origin desk/decisions
          rc=0
          python3 scripts/ops/desk_branch.py mirror --ref origin/desk/decisions \
            | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" -ne 2 ] || { echo "::error::could not read desk/decisions"; exit 1; }
          python3 scripts/ops/desk_outcomes.py | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/ci/check_desk_records.py
          if [ -n "$(git status --porcelain comms/desk)" ]; then echo "changed=1" >> "$GITHUB_OUTPUT"; else echo "changed=0" >> "$GITHUB_OUTPUT"; fi

      - name: Grade Claude's decisions per role (DESK-9-GRADING)
        id: grade
        continue-on-error: true
        env:
          DIAG_READ_TOKEN: ${{ secrets.DIAG_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/ops/claude_role_grade.py --live --write comms/desk/role_grade.json \
            | tee -a "$GITHUB_STEP_SUMMARY" || { echo "::warning::claude_role_grade failed; the mirror still lands"; exit 0; }
          if [ -n "$(git status --porcelain comms/desk)" ]; then echo "changed=1" >> "$GITHUB_OUTPUT"; else echo "changed=0" >> "$GITHUB_OUTPUT"; fi

      - name: Raise feed-gap alerts (DESK-14)
        id: gaps
        continue-on-error: true
        env:
          # WSD-S4: pipeline.append writes through the work store's API after the freeze.
          WORK_STORE_TOKEN: ${{ secrets.WORK_STORE_TOKEN }}
        run: |
          python3 scripts/ops/desk_feed_gaps.py --file-pipeline | tee -a "$GITHUB_STEP_SUMMARY" \
            || echo "::warning::desk_feed_gaps failed; the mirror still lands"
          if [ -n "$(git status --porcelain comms/desk docs/claude/work/pipeline)" ]; then echo "changed=1" >> "$GITHUB_OUTPUT"; else echo "changed=0" >> "$GITHUB_OUTPUT"; fi

      - name: Land on main (one self-landing PR)
        if: steps.inflight.outputs.skip != '1' && (steps.mirror.outputs.changed == '1' || steps.grade.outputs.changed == '1' || steps.gaps.outputs.changed == '1')
        uses: ./.github/actions/commit-to-main
        with:
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          paths: comms/desk comms/desk/role_grade.json docs/claude/work/pipeline
          # the grade snapshot is regenerated hourly (idempotent): on a stale-branch conflict adopt main's copy
          refresh-command: git fetch -q origin main && git checkout FETCH_HEAD -- comms/desk/role_grade.json || true
          message: "desk: mirror decisions from desk/decisions + replayed outcomes"
          pr-title: "desk: mirror decisions from desk/decisions + replayed outcomes"
          pr-body: "Automated mirror (auto-merge): rows on desk/decisions that main's comms/desk/decisions.jsonl lacks, merged by decision_id, plus the packets they cite; and outcomes.jsonl rows for shadow proposals whose horizon has passed (replayed on real candles, net of the full cost stack). scripts/ops/desk_branch.py, scripts/ops/desk_outcomes.py."
          verify-merged: "false"  # deferred: the next run's in-flight check verifies arrival (above)
          branch-prefix: automation/desk-decisions-mirror

      - name: Fail the run if a row was skipped
        if: steps.mirror.outputs.rc == '1'
        run: |
          echo "::error::a desk/decisions row was skipped; see the mirror summary"
          exit 1

      - name: Fail the run if a previous mirror PR stranded
        # Deferred verification's red: the PR an earlier run opened did not merge in time. Its rows were
        # re-landed above; this is the one flag that the landing path itself needs a look.
        if: steps.inflight.outputs.stranded != ''
        run: |
          echo "::error::closed stranded mirror PR(s):${{ steps.inflight.outputs.stranded }} (not merged within the deferred-verification window)"
          exit 1
