name: infra-runner-install

# Installs the repo-scoped self-hosted runners (label `jta-infra`) on the TRAINER VM (never the live trader VM).
# Row GH-CAPACITY-INFRA-RUNNER; operator popup 2026-11-03 ~10:07Z: "Self-hosted runner (Recommended)". Tier 2.
#
# Runs on a GitHub-hosted runner on purpose (it bootstraps the self-hosted one). The registration token is minted
# here from BRANCH_PROTECTION_TOKEN (fine-grained PAT, Administration: read+write; docs/claude/ci-status-checks.md),
# masked, and sent to the VM on SSH stdin only. Installer: scripts/ops/install_infra_runner.sh.
#
# Routing: the moved workflows use `runs-on: ${{ fromJSON(vars.INFRA_RUNS_ON || '"ubuntu-latest"') }}`; this
# workflow does NOT flip that variable. infra-runner-smoke.yml flips it after a green smoke job ON the runner, and
# infra-runner-health.yml flips it back to hosted when no runner is online (no halting).
# Gates this adds or changes: none.

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Runner instances to install (one unprivileged user each)"
        default: "2"
  repository_dispatch:  # routed by issue-router.yml (one dispatch per issue label)
    types: [infra-runner-install]

permissions:
  contents: read
  issues: write

concurrency:
  group: infra-runner-install
  cancel-in-progress: false

jobs:
  install:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'repository_dispatch' &&
       github.event.client_payload.issue.user.login == github.repository_owner &&
       contains(github.event.client_payload.issue.labels.*.name, 'infra-runner-install'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_REPO: ${{ github.repository }}
      COUNT: ${{ inputs.count || '2' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Mint a runner registration token (masked)
        id: tok
        env:
          PAT: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${PAT}" ] || { echo "::error::BRANCH_PROTECTION_TOKEN unset"; echo "mint=no_pat" >> "$GITHUB_OUTPUT"; exit 1; }
          code=$(curl -sS -o /tmp/regtok.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${PAT}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_REPO}/actions/runners/registration-token")
          echo "mint_http=${code}" | tee -a "$GITHUB_OUTPUT"
          [ "$code" = 201 ] || { echo "::error::registration-token mint returned HTTP ${code} (PAT lacks Administration: write?)"; exit 1; }
          t=$(jq -r .token /tmp/regtok.json); echo "::add-mask::${t}"
          printf '%s' "$t" > /tmp/regtok.txt; chmod 600 /tmp/regtok.txt; rm -f /tmp/regtok.json
      - name: Install on the trainer VM
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          TRAINER_IP: ${{ secrets.TRAINER_VM_IP }}
          TRAINER_USER: ${{ vars.TRAINER_VM_USER || 'ubuntu' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${VM_SSH_KEY}" > ~/.ssh/trainer_key && chmod 600 ~/.ssh/trainer_key
          O=(-i ~/.ssh/trainer_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=30)
          scp "${O[@]}" scripts/ops/install_infra_runner.sh "${TRAINER_USER}@${TRAINER_IP}:/tmp/install_infra_runner.sh"
          ssh "${O[@]}" "${TRAINER_USER}@${TRAINER_IP}" \
            "sudo -n bash /tmp/install_infra_runner.sh '${COUNT}' 'https://github.com/${GH_REPO}' jta-infra; rc=\$?; rm -f /tmp/install_infra_runner.sh; exit \$rc" \
            < /tmp/regtok.txt 2>&1 | tee /tmp/install.log
          rm -f /tmp/regtok.txt ~/.ssh/trainer_key
      - name: Wait for runners online; probe the PAT's Variables permission
        if: always()
        env:
          PAT: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
        run: |
          set -uo pipefail
          for i in $(seq 1 18); do
            curl -sS -H "Authorization: Bearer ${PAT}" "https://api.github.com/repos/${GH_REPO}/actions/runners?per_page=100" > /tmp/runners.json
            n=$(jq '[.runners[]? | select(any(.labels[]; .name=="jta-infra")) | select(.status=="online")] | length' /tmp/runners.json)
            [ "${n:-0}" -ge 1 ] && break; sleep 10
          done
          jq -r '.runners[]? | select(any(.labels[]; .name=="jta-infra")) | "runner \(.name) \(.status) busy=\(.busy)"' /tmp/runners.json | tee /tmp/runners.txt
          vcode=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${PAT}" \
            "https://api.github.com/repos/${GH_REPO}/actions/variables?per_page=1")
          echo "variables_read_http=${vcode}" | tee -a /tmp/runners.txt
          # Fork-PR workflow approval policy (public repo: must require approval for outside contributors).
          curl -sS -H "Authorization: Bearer ${PAT}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_REPO}/actions/permissions/fork-pr-contributor-approval" \
            | jq -c '{fork_pr_approval_policy: .approval_policy, message}' | tee -a /tmp/runners.txt || true
      - name: Comment result
        if: always() && github.event_name == 'repository_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const rd = p => { try { return fs.readFileSync(p, 'utf8') } catch { return '(none)' } };
            const log = rd('/tmp/install.log').split('\n').filter(l => !/token/i.test(l)).slice(-40).join('\n');
            const body = `**infra-runner-install** run [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n` +
              '```\n' + log + '\n```\n\n```\n' + rd('/tmp/runners.txt') + '\n```';
            await github.rest.issues.createComment({...context.repo, issue_number: (context.payload.client_payload?.issue?.number ?? context.issue.number), body});
            await github.rest.issues.update({...context.repo, issue_number: (context.payload.client_payload?.issue?.number ?? context.issue.number), state: 'closed'});
