# work-store-export -- the daily EXPORT of the work store into the checklist / pipeline files (AM-OPS-9).
#
# Gates this adds or changes: none added; narrows roadmap-map, soak-contract, claim-basis and redate to
# skip rows whose store updated_at <= export_base_at (pre-cutover debt, tracked on STORE-EXPORT-BACKFILL-258).
#
# Since the WSD-S4 freeze (2026-11-12) checklist rows and pipeline items live in work_store.db on the
# live VM; docs/claude/work/checklist/ and docs/claude/work/pipeline/ are an EXPORT that CI guards read.
# Nothing ran the export, so the files went stale. Once a day this runs
#   python3 scripts/ops/work.py export --to-files      (no --db: pages GET /api/bot/work/items)
# and, when files changed, lands them through .github/actions/commit-to-main (a PAT-opened bot branch
# PR declaring `.github/pr-landing/<slug>.json` tier 1, landing "self", armed for auto-merge; GitHub
# merges it only on green).
#
# THE PRE-CHECK (scripts/ops/work.py export_precheck): before writing, each CHANGED row / record goes
# through the same per-row predicates the guards use -- roadmap_map.row_problems,
# check_soak_contracts.row_findings / pipeline_item_findings, check_claim_basis.new_row_failure,
# pipeline.redate_problems (the redate-guard's predicate; EXPORT-VALIDATION-GAP 2026-11-20). A
# failing one stays in the store, is LEFT OUT of this export, and is filed ONCE as an observation
# titled "EXPORT HELD BACK [<id>] ..." (WORK_STORE_TOKEN; no second filing while one is open; a failed
# filing is printed, never aborts). The next run re-checks it. Every other row lands, so one bad row
# can no longer redden the whole export PR.
#
# CUTOVER: rows/records whose store updated_at <= _header.json `export_base_at` are pre-cutover debt
# (STORE-EXPORT-BACKFILL-258): they land even when they fail, and the three guards skip them in their
# diff-scoped checks, identified through docs/claude/work/EXPORT-STAMPS.json (store updated_at + sha256
# of every file the last export wrote; a hand-edited file is never exempt).
#
# VALIDATE BEFORE LANDING -- IT MUST NEVER PUSH RED TO MAIN. After the export writes files and BEFORE
# anything is committed or pushed, the exported tree is committed LOCALLY (never pushed), and these run
# against it exactly as CI's PR guards job runs them: scripts/ci/run_guards.py in RELEVANCE mode on the
# export's own diff (WORK_READ_SOURCE=export, origin/main as the base), so the guard set is the one CI
# will select for the bot PR, never a hand list; plus pytest over EVERY test file that reads the
# register, derived by scripts/ci/register_reader_tests.py. EXPORT-VALIDATION-GAP (2026-11-20): the
# first run (44648031388) validated with 5 named guards and test_checklist*/test_pipeline*/test_work*,
# passed, and its bot PR #27549 went red in full CI on redate-guard and tests/console_connector.
# If ANY fails: NOTHING is committed or pushed that run, ONE observation "EXPORT VALIDATION FAILED
# [<date>] ..." is filed (failing checks + log tail; not again while an open one exists), and the run
# exits 0 -- no red run, no halt; the next scheduled run retries. This enforces the existing
# never-merge-red rule; adds no gate.
#
# NO HALTING: a failed run (store unreachable, PR not merged) goes red -- the ONE flag -- and the next
# day's run tries again from the current main. A failed VALIDATION is not a red run (above).
name: work-store-export

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

concurrency:
  group: work-store-export
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    # >= the commit-to-main merge wait (80m, .github/actions/commit-to-main) + 5m slack:
    # tests/test_commit_to_main_callers.py enforces it.
    # EXPORT-VALIDATION-GAP (2026-11-20): raised from 100 because validation now runs CI's full
    # relevance guard set (~17 min in CI) and every register-reading test (1,890 tests, ~15 min
    # measured locally) on top of the export and the 80 min merge wait.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, as guards.yml checks out: the diff-scoped guards read history (redate-guard
          # finds an item's previous record with `git grep` over the base). EXPORT-VALIDATION-GAP.
          fetch-depth: 0
          # The PAT: a GITHUB_TOKEN PR gets no required checks (PI-20260928-TURC5MJC-0004).
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime + test dependencies (as pytest-run.yml does)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install -r requirements-dev.txt

      - name: Export the work store into the files (pre-checked)
        id: export
        env:
          # Writes (the held-back filings) need the token; reads are open (scripts/ops/work.py http()).
          WORK_STORE_TOKEN: ${{ secrets.WORK_STORE_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 scripts/ops/work.py export --to-files \
            --run-ref "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > export.json 2> summary.txt || { cat summary.txt; exit 1; }
          cat summary.txt
          { echo "### work-store-export"; echo; echo '```'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate the exported tree (guards + tests) BEFORE anything is committed or pushed
        id: validate
        env:
          WORK_READ_SOURCE: export   # as CI's guard harness reads the files, never the live store
          WORK_STORE_TOKEN: ${{ secrets.WORK_STORE_TOKEN }}   # only for the one failure filing
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -uo pipefail   # no -e: a failing check is recorded, never a red run
          PATHS="docs/claude/work/checklist docs/claude/work/pipeline docs/claude/work/EXPORT-STAMPS.json"
          if [ -z "$(git status --porcelain -- $PATHS)" ]; then
            echo "nothing exported changed -- nothing to validate or land"
            echo "land=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # origin/main = the commit this run exported onto, so the diff-scoped guards see exactly the export.
          git fetch -q --no-tags origin "+${GITHUB_SHA}:refs/remotes/origin/main"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- $PATHS
          git commit -qm "work-store export (LOCAL validation commit, never pushed)"
          LOG="${RUNNER_TEMP:-/tmp}/validate.log"; DIFF="${RUNNER_TEMP:-/tmp}/export.diff"
          git diff origin/main...HEAD > "$DIFF"
          checks=()
          # The guards CI's PR job will run on the bot PR: relevance mode on this diff, no --only list.
          if ! python3 scripts/ci/run_guards.py --base-ref main --event-name pull_request --pr-diff "$DIFF" \
              > "$LOG" 2>&1; then
            # Only run_guards' own closing "FAILING GUARDS" block names guards; a guard's output can
            # carry its own ::error:: lines, which are not guard names.
            mapfile -t failed < <(awk '/^FAILING GUARDS/{f=1; next} f && /::error::/{sub(/.*::error::/, ""); sub(/:.*/, ""); print}' "$LOG" | sort -u)
            for g in "${failed[@]}"; do checks+=(--check "$g"); done
            # Exit 1 with no failing guard named = a guard COULD NOT RUN; CI would be red too.
            [ ${#checks[@]} -gt 0 ] || checks+=(--check "run_guards (a guard could not run)")
          fi
          # Every test file that reads the register (derived, so a new reader is covered automatically).
          if ! mapfile -t TESTS < <(python3 scripts/ci/register_reader_tests.py) || [ ${#TESTS[@]} -eq 0 ]; then
            checks+=(--check "register_reader_tests selected nothing")
          elif ! python3 -m pytest -q "${TESTS[@]}" >> "$LOG" 2>&1; then
            checks+=(--check "pytest (${#TESTS[@]} register-reading test files)")
          fi
          # Back to uncommitted: commit-to-main stages and commits the same paths itself.
          git reset -q --soft HEAD~1
          tail -60 "$LOG"
          if [ ${#checks[@]} -gt 0 ]; then
            echo "::warning::export validation FAILED (${checks[*]}): NOTHING is committed or pushed this run; the next run retries."
            { echo; echo "**Validation FAILED -- nothing landed:** ${checks[*]}"; } >> "$GITHUB_STEP_SUMMARY"
            python3 scripts/ops/work.py export-validation-failed --log "$LOG" "${checks[@]}" \
              --run-ref "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              || echo "::warning::filing the validation failure did not complete (printed above)"
            echo "land=false" >> "$GITHUB_OUTPUT"
          else
            echo "validation passed"
            echo "land=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Land the changed export files (self-landing Tier-1 data PR)
        if: steps.validate.outputs.land == 'true'
        uses: ./.github/actions/commit-to-main
        with:
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          paths: docs/claude/work/checklist docs/claude/work/pipeline docs/claude/work/EXPORT-STAMPS.json
          message: "work-store export: checklist + pipeline files (run ${{ github.run_id }})"
          pr-title: "work-store export: checklist + pipeline files (run ${{ github.run_id }})"
          pr-body: "Automated (auto-merge): the daily export of work_store.db into docs/claude/work/checklist and docs/claude/work/pipeline (scripts/ops/work.py export --to-files), pre-checked with the guards' own row checks; held-back rows are filed in the store as EXPORT HELD BACK observations. Register data only. Gates this adds or changes: none."
          # Without this the step exits 0 the moment the PR OPENS, so an export that never merges reads as success.
          verify-merged: "true"
