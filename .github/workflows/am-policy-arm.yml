name: am-policy-arm
run-name: am-policy-arm ${{ inputs.research_unit || inputs.classes }}

# AM v2 STAGE B (row AM-V2-STAGE-B-POLICY-ARM; parent AM-V2-CF-DIRECTED): the Stage-A heads applied as a bracket policy on the counterfactual replay and
# graded by RULE-AM-RISK-ADJUSTED-V1. plan -> train + dump the heads (or reuse a prior run's) -> sharded replay -> reduce/grade -> land one result record.
# One dispatch = ONE action class (target | tighten | loosen | bank | combined), each its own registered unit RQ-20261124-b5a1-01..05, each with its own
# matched random-intervention control (20 seeded draws) and the claimed AM-HEADS holdout. Tier 1: GitHub-hosted runners, no Claude, no API credits, no
# secret in the compute jobs; it READS the pinned corpus + the keyless Binance Vision archive + the Stage-A label shards and UPLOADS artifacts; only the
# last job writes (through the shared research-result / commit-to-main actions). It touches no trade path, no config, no VM. Gates this adds or changes: none.
# Code: scripts/research/am_policy_arm.py (driver), scripts/research/am_heads_fit.py dump (heads). Design: docs/research/ml-am-heads-design-2026-11-23.md.
#
# The label shards are an expiring artifact of cf-bar-labels run 45243829438 (14-day retention from 2026-11-23): past ~2026-12-07 re-dispatch
# cf-bar-labels.yml (same corpus sha) and pass its run id as `labels_run_id`. To save the ~1 h head fit on the 2nd..5th class, pass the first run's id as
# `heads_run_id` (the heads artifact is kept 30 days).

on:
  workflow_dispatch:
    inputs:
      classes:
        description: "ONE action class: target | tighten | loosen | bank | combined"
        required: true
      research_unit:
        description: "The queue unit that dispatched this run (RQ-YYYYMMDD-xxxx-NN); empty for a manual run (lands under _unattributed)"
        default: ""
      power_state:
        description: "Pass-through dispatcher power-state label, if any (never a command)"
        default: ""
      run_id:
        description: "Run id (names the artifacts), e.g. amb-20261124"
        default: "amb-20261124"
      corpus_sha:
        description: "Commit sha whose comms/research + comms/strategy_evidence trade corpus is replayed (the run-w corpus, same as cf-bar-labels)"
        default: "1eb164f4ae641bea82ac34692af9cb7031640a62"
      labels_run_id:
        description: "GitHub run id of the cf-bar-labels run whose label artifacts the heads are fitted on (default: cfbl-20261123, run 45243829438)"
        default: "45243829438"
      labels_prefix:
        description: "run_id prefix of those label artifacts (artifact names <prefix>-labels-<n>)"
        default: "cfbl-20261123"
      heads_run_id:
        description: "Reuse the heads artifact (am-heads-<id>) of this earlier am-policy-arm run instead of fitting them again; empty = fit here"
        default: ""
      batches:
        description: "Replay matrix width (balanced batches of shards)"
        default: "24"
      n_control:
        description: "Seeded matched random-intervention draws per class (the registered number is 20)"
        default: "20"

permissions:
  contents: read
  actions: read          # ONLY so the label / heads artifacts of another run of this repo can be downloaded with the ambient read token

concurrency:
  group: am-policy-arm-${{ github.event.inputs.run_id }}-${{ github.event.inputs.classes }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas pyyaml requests
      - name: Check the class
        env:
          CLS: ${{ inputs.classes }}
        run: |
          case "$CLS" in target|tighten|loosen|bank|combined) ;; *) echo "classes must be ONE of target|tighten|loosen|bank|combined, got '$CLS'"; exit 2;; esac
      - name: Pin the trade corpus to corpus_sha (code stays at the dispatch ref)
        if: ${{ inputs.corpus_sha != '' }}
        env:
          CORPUS_SHA: ${{ inputs.corpus_sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$CORPUS_SHA"
          rm -rf comms/research comms/strategy_evidence
          git checkout "$CORPUS_SHA" -- comms/research comms/strategy_evidence
          echo "corpus pinned to $CORPUS_SHA"
      - name: Plan shards (cf_bulk's own planner, so shard ids and job keys are cf_bulk's)
        env:
          RUN_ID: ${{ inputs.run_id }}
          BATCHES: ${{ inputs.batches }}
        run: python3 scripts/research/cf_bulk.py plan --run-id "$RUN_ID" --out out --batches "$BATCHES"
      - id: m
        run: echo "matrix=$(python3 -c "import json;print(json.dumps({'include':[{'batch':b['batch'],'index':' '.join(map(str,b['index']))} for b in json.load(open('out/batches.json'))]}))")" >> "$GITHUB_OUTPUT"

  heads:
    needs: plan
    if: ${{ inputs.heads_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas pyyaml requests lightgbm==4.6.0 scikit-learn==1.7.2
      - name: Pin the trade corpus to corpus_sha
        if: ${{ inputs.corpus_sha != '' }}
        env:
          CORPUS_SHA: ${{ inputs.corpus_sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$CORPUS_SHA"
          rm -rf comms/research comms/strategy_evidence
          git checkout "$CORPUS_SHA" -- comms/research comms/strategy_evidence
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.labels_prefix }}-labels-*
          path: labels
          merge-multiple: true
          run-id: ${{ inputs.labels_run_id }}
          github-token: ${{ github.token }}
      - name: Fit and dump the heads (the Stage-A recipe, per purged fold; scores no test row, claims no holdout)
        run: python3 scripts/research/am_heads_fit.py dump --labels labels --corpus . --out heads --rows-per-fold 400000
      - uses: actions/upload-artifact@v4
        with:
          name: am-heads-${{ github.run_id }}
          path: heads
          retention-days: 30

  shard:
    needs: [plan, heads]
    if: ${{ always() && needs.plan.result == 'success' && (needs.heads.result == 'success' || needs.heads.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas pyyaml requests lightgbm==4.6.0 scikit-learn==1.7.2
      - name: Pin the trade corpus to corpus_sha
        if: ${{ inputs.corpus_sha != '' }}
        env:
          CORPUS_SHA: ${{ inputs.corpus_sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$CORPUS_SHA"
          rm -rf comms/research comms/strategy_evidence
          git checkout "$CORPUS_SHA" -- comms/research comms/strategy_evidence
      - uses: actions/download-artifact@v4
        with:
          name: am-heads-${{ inputs.heads_run_id || github.run_id }}
          path: heads
          run-id: ${{ inputs.heads_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Replay this batch's shards with the policy arm and its matched random controls
        env:
          RUN_ID: ${{ inputs.run_id }}
          INDEX: ${{ matrix.index }}
          CLS: ${{ inputs.classes }}
          NCTL: ${{ inputs.n_control }}
        run: python3 scripts/research/am_policy_arm.py shard --run-id "$RUN_ID" --out out --heads heads --index $INDEX --classes "$CLS" --n-control "$NCTL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.run_id }}-${{ inputs.classes }}-shards-${{ matrix.batch }}
          path: out/am_policy
          if-no-files-found: ignore
          retention-days: 14

  reduce:
    needs: shard
    if: ${{ always() && needs.shard.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas pyyaml requests
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.run_id }}-${{ inputs.classes }}-shards-*
          path: out/am_policy
          merge-multiple: true
      - name: Grade (claims the AM-HEADS holdout FIRST, then reads it) under RULE-AM-RISK-ADJUSTED-V1
        env:
          CLS: ${{ inputs.classes }}
          UNIT: ${{ inputs.research_unit }}
          NCTL: ${{ inputs.n_control }}
        run: python3 scripts/research/am_policy_arm.py reduce --out out --classes "$CLS" --unit "${UNIT:-am-policy-arm-manual}" --reader "workflow am-policy-arm run ${{ github.run_id }}" --n-control "$NCTL"
      - uses: actions/upload-artifact@v4
        with:
          name: am-policy-result-${{ github.run_id }}
          path: |
            out/verdict.json
            out/grade_full.json
            out/holdout_claims.jsonl
          retention-days: 30
      # the shard artifacts are large and only the grade is read downstream; they expire on their own (14 days)

  research_result:
    needs: [reduce]
    # a FAILED or CANCELLED reduce still lands (read_state producer_failed: "we looked and it broke"); a SKIPPED one means nobody asked
    if: ${{ always() && needs.reduce.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 110      # outlasts commit-to-main's verify-merged wait
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        id: fetch
        continue-on-error: true
        with:
          name: am-policy-result-${{ github.run_id }}
          path: collected
      - name: Derive the record fields from the run's own output
        id: derive
        env:
          REDUCE: ${{ needs.reduce.result }}
          CLS: ${{ inputs.classes }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          out = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          v = pathlib.Path("collected/verdict.json")
          if os.environ["REDUCE"] == "success" and v.exists():
              d = json.loads(v.read_text())
              rec = {"verdict": d["verdict"], "read_state": d["read_state"], "n": str(d["n"]), "population": d["population"]}
              pathlib.Path("measurement.json").write_text(json.dumps({"note": d.get("note"), **d["measurement"]}))
          else:
              rec = {"verdict": "not_applicable", "read_state": "producer_failed", "n": "null",
                     "population": "AM v2 Stage B policy arm class " + os.environ["CLS"] + ": the replay or the grade did not complete (reduce job " + os.environ["REDUCE"] + "); nothing was measured"}
              pathlib.Path("measurement.json").write_text(json.dumps({"reduce_job_result": os.environ["REDUCE"]}))
          with out.open("a") as fh:
              for k, x in rec.items():
                  fh.write(f"{k}={x}\n")
          PY
      - name: Merge the holdout claim into this checkout's ledger (so the next AM-HEADS read is graded against a deflated bar)
        run: |
          if [ -f collected/holdout_claims.jsonl ]; then
            python3 -c "import sys; from pathlib import Path; sys.path.insert(0, 'scripts/research'); import holdout_lock; print('holdout claims merged:', len(holdout_lock.merge_claims([Path('collected/holdout_claims.jsonl')])))"
          fi
      - name: Land the result on main
        uses: ./.github/actions/research-result
        with:
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          research-unit: ${{ inputs.research_unit }}
          power-state: ${{ inputs.power_state }}
          decision-rule-id: RULE-AM-HEADS-STAGE-B-20261124
          decision-rule-registered-at: '2026-11-24'
          verdict: ${{ steps.derive.outputs.verdict }}
          read-state: ${{ steps.derive.outputs.read_state }}
          population: ${{ steps.derive.outputs.population }}
          n: ${{ steps.derive.outputs.n }}
          measurement-file: measurement.json
          extra-paths: comms/research/holdout_reads.jsonl
          artifact-store: research/results/
          artifact-locator: >-
            the `measurement` block on this record (dev and holdout grade, lever firing, the per-strategy cuts). The full grade (grade_full.json: every
            fold, every control book, per-leg cuts) is the run artifact am-policy-result-<run id>, kept 30 days and never committed: MEASURED
            (source not durably retrievable beyond that).
          tool: scripts/research/am_policy_arm.py (reduce) + scripts/research/am_heads_fit.py (dump)
