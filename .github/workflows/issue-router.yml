name: issue-router

# Issue fan-out fix (row PI-20260927-W6OPSR-0004; tool scripts/ops/issue_router_migrate.py).
#
# Before this workflow, every opened issue started one run of every workflow declaring `on: issues: [opened]`
# (~89 runs per issue on 2026-11-11), even though a job `if:` skipped nearly all of them; the skipped runs still
# queued. Now label-gated workflows declare `repository_dispatch: types: [<label>]`, and this workflow runs once per
# opened issue and sends one repository_dispatch per label on it. GitHub creates runs only for the workflows that
# name one of the issue's labels.
#
# Adds no gate. Every label is forwarded for every issue; the routed workflows keep all of their own job
# conditions (author, label, workflow_dispatch) and read the same issue fields from client_payload.issue.
# Workflows that cannot be routed (title-prefix gates, `labeled` triggers, system-actions) stay on `issues`.

on:
  issues:
    # opened: one dispatch per label on the new issue (event_type = the label).
    # labeled (phase 2, PI-20261112-FANOUT2-0001): one dispatch for the ADDED label (event_type = labeled:<label>),
    # for the workflows that also ran on `labeled`. An issue created with N labels fires opened once and labeled
    # N times, exactly as GitHub did for those workflows before; nothing that ran stops running.
    types: [opened, labeled]

permissions:
  contents: write   # POST /repos/{repo}/dispatches needs contents:write
  issues: read

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch one event per issue label
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const action = context.payload.action;
            const added = action === 'labeled' && context.payload.label ? context.payload.label.name : null;
            const labels = (issue.labels || []).map(l => (typeof l === 'string' ? l : l.name)).filter(Boolean);
            // Same fields, same shape as github.event.issue, so routed workflows read
            // github.event.client_payload.issue.<field> exactly as they read github.event.issue.<field>.
            const payload = {
              issue: {
                number: issue.number,
                title: issue.title,
                body: issue.body || '',
                labels: labels.map(name => ({ name })),
                user: { login: issue.user && issue.user.login },
                html_url: issue.html_url,
                state: issue.state,
              },
            };
            if (added) payload.label = { name: added };
            // labeled: forward ONLY the added label, as labeled:<label>; opened: every label, as <label>.
            const targets = action === 'labeled' ? (added ? ['labeled:' + added] : []) : labels;
            let failed = 0;
            for (const label of targets) {
              // A failed dispatch is retried, then reported; the other labels are still sent (no halting).
              let ok = false;
              for (let attempt = 1; attempt <= 3 && !ok; attempt++) {
                try {
                  await github.rest.repos.createDispatchEvent({
                    owner: context.repo.owner, repo: context.repo.repo,
                    event_type: label.slice(0, 100), client_payload: payload,
                  });
                  ok = true;
                  core.info(`dispatched '${label}' for issue #${issue.number}`);
                } catch (e) {
                  core.warning(`dispatch '${label}' attempt ${attempt} failed: ${e.message}`);
                  await new Promise(r => setTimeout(r, 2000 * attempt));
                }
              }
              if (!ok) failed++;
            }
            core.info(`issue #${issue.number} (${action}): ${targets.length} dispatch(es), ${failed} failure(s)`);
            if (failed) core.setFailed(`${failed} dispatch(es) failed for issue #${issue.number}`);
