name: cancel-queued-runs

# Bulk-cancel stale `queued` workflow runs that never got a runner and are
# cluttering the Actions list.
#
# Why this exists:
#   The hosted GitHub MCP token used by the PM-side sandbox session lacks
#   `actions: write`, so it cannot cancel workflow runs directly (the API
#   returns 403 "Resource not accessible by integration"). This workflow is
#   the runner path — a workflow's built-in GITHUB_TOKEN *does* carry
#   `actions: write`, so it can cancel runs on the session's behalf.
#
#   Issue-driven (mirrors vm-diag-snapshot.yml / vm-web-api-recover.yml): open
#   an issue labelled `cancel-queued-runs`, the workflow cancels every queued
#   run, comments the result back, and closes the issue. Also workflow_dispatch
#   for the Actions UI.
#
# Scope / blast radius:
#   * Cancels runs whose status is exactly `queued` AND created more than
#     MIN_AGE_HOURS ago (default 24, 2026-11-25 W48 operator decision Q11:
#     "Approve both (Recommended)", scope >24 h only) — never `in_progress`,
#     never a run younger than the cutoff, so it can NEVER interrupt active CI
#     (including its own run). It used to cancel EVERY queued run, which would
#     also kill the queued CI of open PRs.
#   * Prints the queued count before and after (the audit trail the row wants).
#   * No edits, no deploys, no VM access, no secrets. Read-only beyond the
#     `gh run cancel` calls.
#
# To drive from a sandbox session:
#   mcp__github__issue_write(method='create',
#       title='[cancel-queued-runs] clear stale queued runs',
#       labels=['cancel-queued-runs'], body='<reason — audit>')
#   Then poll the issue comments for the github-actions[bot] reply.

on:
  workflow_dispatch:
    inputs:
      min_age_hours:
        description: 'Only cancel queued runs created more than this many hours ago (default 24; never younger)'
        required: false
        default: '24'
      delete_zombies:
        description: 'DELETE (not cancel) never-started zombie runs: queued, older than min_age_hours, attempt 1, no job started. Default false = the normal cancel path.'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'With delete_zombies: list what WOULD be deleted and delete nothing (default true). Set false only after the operator decision is on record.'
        type: boolean
        required: false
        default: true
      diagnose:
        description: 'READ-ONLY census: print queued runs bucketed by age (<1h, 1-24h, >24h) x attempt x status, the top workflows per bucket, how many pass the delete filter, and event/branch/PR facts for the oldest >24h runs. Changes nothing. Default false.'
        type: boolean
        required: false
        default: false
      throttle_seconds:
        description: 'With delete_zombies and dry_run=false: seconds to wait between deletes (default 2), so the run cannot exhaust the hourly API budget of the installation token.'
        type: string
        required: false
        default: '2'
  repository_dispatch:  # routed by issue-router.yml (one dispatch per issue label)
    types: [cancel-queued-runs]

permissions:
  actions: write   # required to cancel workflow runs
  issues: write    # comment + close the request issue
  contents: read

concurrency:
  group: cancel-queued-runs
  cancel-in-progress: false

jobs:
  cancel:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'repository_dispatch' &&
       (github.event.client_payload.issue.user.login == github.repository_owner ||
        github.event.client_payload.issue.user.login == 'github-actions[bot]') &&
       contains(github.event.client_payload.issue.labels.*.name, 'cancel-queued-runs'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      MIN_AGE_HOURS: ${{ inputs.min_age_hours || '24' }}
      DELETE_ZOMBIES: ${{ inputs.delete_zombies && 'true' || 'false' }}
      DRY_RUN: ${{ inputs.dry_run == false && 'false' || 'true' }}
      THROTTLE: ${{ inputs.throttle_seconds || '2' }}
    steps:
      # BUILDS-W48 / row ACTIONS-ZOMBIE-QUEUED-RUNS: the plain and force cancel endpoints both return HTTP 409 for runs that are
      # `queued` in the list but never started (282 of 283 on 2026-11-26). The only API path left is DELETE /actions/runs/{id},
      # which removes the run. Scope is deliberately narrow: queued, older than MIN_AGE_HOURS, run_attempt 1, and NO job
      # in_progress or completed. A run that ran is never touched. dry_run defaults TRUE: it lists, deletes nothing.
      - name: Census of queued runs (read-only)
        id: diagnose
        if: github.event_name == 'workflow_dispatch' && inputs.diagnose
        run: |
          set -uo pipefail
          # ACTIONS-ZOMBIE-QUEUED-RUNS (manager 26a, 2026-11-26): the 20:49Z re-delete saw 243 queued runs but only 11 candidates
          # (queued, attempt 1, older than 24 h), against 284 at 17:33Z. Either most of the old zombies left the queue, or the
          # candidate filter read from `gh run list --json` excludes them. This prints the numbers that tell the two apart. READ-ONLY.
          tmp=$(mktemp)
          gh run list --repo "$REPO" --status queued --limit 1000 \
            --json databaseId,createdAt,attempt,status,workflowName,event,headBranch > "$tmp" || { echo "could not list queued runs"; exit 0; }
          now=$(date -u +%s); cut=$(( MIN_AGE_HOURS * 3600 ))
          echo "queued runs listed: $(jq 'length' "$tmp")  (min age for the delete filter: ${MIN_AGE_HOURS} h)"
          echo "--- by age bucket x attempt x status"
          jq -r --argjson now "$now" 'map(. + {age: ($now - (.createdAt | fromdateiso8601))})
            | map(. + {bucket: (if .age < 3600 then "a <1h" elif .age < 86400 then "b 1-24h" else "c >24h" end)})
            | group_by([.bucket, .attempt, .status]) | .[] | "\(.[0].bucket)  attempt=\(.[0].attempt)  status=\(.[0].status)  n=\(length)"' "$tmp"
          echo "--- top workflows per bucket"
          jq -r --argjson now "$now" 'map(. + {age: ($now - (.createdAt | fromdateiso8601))})
            | map(. + {bucket: (if .age < 3600 then "a <1h" elif .age < 86400 then "b 1-24h" else "c >24h" end)})
            | group_by(.bucket) | .[] | (.[0].bucket) as $b | (group_by(.workflowName) | map({w: .[0].workflowName, n: length}) | sort_by(-.n) | .[0:6][] | "\($b)  \(.n)  \(.w)")' "$tmp"
          echo "--- the delete filter (queued, attempt 1, older than ${MIN_AGE_HOURS} h)"
          jq -r --argjson now "$now" --argjson cut "$cut" '
            "older than min age, any attempt/status: \([.[] | select(($now - (.createdAt | fromdateiso8601)) >= $cut)] | length)",
            "  of those, status==queued and attempt==1 (the filter): \([.[] | select(($now - (.createdAt | fromdateiso8601)) >= $cut and .status == "queued" and .attempt == 1)] | length)"' "$tmp"
          echo "--- oldest runs over the min age (id, created, event, branch, workflow, attempt)"
          jq -r --argjson now "$now" --argjson cut "$cut" '[.[] | select(($now - (.createdAt | fromdateiso8601)) >= $cut)] | sort_by(.databaseId) | .[0:40][]
            | "\(.databaseId)  \(.createdAt)  event=\(.event)  branch=\(.headBranch)  wf=\(.workflowName)  attempt=\(.attempt)"' "$tmp"
          echo "--- REST facts for the 15 oldest over the min age (pull_requests, actor, path)"
          for id in $(jq -r --argjson now "$now" --argjson cut "$cut" '[.[] | select(($now - (.createdAt | fromdateiso8601)) >= $cut)] | sort_by(.databaseId) | .[0:15][] | .databaseId' "$tmp"); do
            echo "$id  $(gh api "repos/$REPO/actions/runs/$id" --jq '"pr_count=\(.pull_requests | length) head_repo_fork=\(.head_repository.fork) actor=\(.actor.login) trigger=\(.triggering_actor.login) path=\(.path) status=\(.status) conclusion=\(.conclusion)"' 2>&1 | head -c 220)"
          done
          rm -f "$tmp"

      - name: Delete never-started zombie runs
        id: zombies
        if: github.event_name == 'workflow_dispatch' && inputs.delete_zombies && !inputs.diagnose
        run: |
          set -uo pipefail
          # GH-API-RATE-LIMIT-1126 (manager 26a, 2026-11-26): the first live delete (run 45868657356) was refused 247 times (HTTP 403,
          # message 'Could not delete the workflow run') and then, at 17:38:02Z, succeeded for the last 36. Two readings fit: the
          # installation token's hourly API budget (a rate-limit window ending at 17:38:02Z) or a per-run refusal. This step settles it:
          # it prints the rate_limit endpoint before and after, processes OLDEST first (so a run-age effect cannot be confused with
          # processing order), waits THROTTLE s between deletes, prints the API's own message on every refusal, STOPS on the first
          # rate-limit message, and stops after 10 refusals in a row (it must not hammer an endpoint that keeps refusing).
          rl() { gh api rate_limit --jq '.resources.core | "core remaining=\(.remaining) limit=\(.limit) resets_at=\(.reset | todate)"' 2>&1 | head -c 200; echo; }
          echo "rate limit BEFORE: $(rl)"
          before=$(gh run list --repo "$REPO" --status queued --limit 1000 --json databaseId --jq 'length' || echo '?')
          echo "queued runs BEFORE: $before (dry_run=$DRY_RUN, min age ${MIN_AGE_HOURS} h, throttle ${THROTTLE}s)"
          cutoff=$(date -u -d "${MIN_AGE_HOURS} hours ago" +%Y-%m-%dT%H:%M:%SZ)
          ids=$(gh run list --repo "$REPO" --status queued --limit 1000 --json databaseId,createdAt,attempt,status \
                  --jq ".[] | select(.createdAt < \"$cutoff\" and .status == \"queued\" and .attempt == 1) | .databaseId" | sort -n || true)
          # `total` is every run the filter selected; `cand` is how many the loop had PROCESSED when it ended. They differ whenever a
          # stop condition fires (the 20:49Z run read "candidates=11" after 10 refusals in a row while the filter selected 242).
          total=$(printf '%s\n' "$ids" | grep -c . || true)
          cand=0; elig=0; done_n=0; kept=0; refused=0; consec=0; stopped="none"
          for id in $ids; do
            cand=$((cand+1))
            started=$(gh api "repos/$REPO/actions/runs/$id/jobs" --jq '[.jobs[]|select(.status=="in_progress" or .status=="completed")]|length' 2>/dev/null || echo "?")
            if [ "$started" != "0" ]; then
              echo "KEEP $id (started_jobs=$started): not a never-started zombie"; kept=$((kept+1)); continue
            fi
            elig=$((elig+1))
            if [ "$DRY_RUN" = "true" ]; then
              echo "WOULD DELETE $id"; continue
            fi
            if msg=$(gh api --method DELETE "repos/$REPO/actions/runs/$id" 2>&1 >/dev/null); then
              echo "deleted $id"; done_n=$((done_n+1)); consec=0
            else
              refused=$((refused+1)); consec=$((consec+1))
              echo "refused $id: $(printf '%s' "$msg" | tr '\n' ' ' | head -c 200)"
              if printf '%s' "$msg" | grep -qi "rate limit"; then
                echo "STOP: rate-limit message. $(rl)"; stopped="rate_limit"; break
              fi
              if [ "$consec" -ge 10 ]; then
                echo "STOP: 10 refusals in a row (not a rate-limit message). $(rl)"; stopped="consecutive_refusals"; break
              fi
            fi
            sleep "$THROTTLE"
          done
          after=$(gh run list --repo "$REPO" --status queued --limit 1000 --json databaseId --jq 'length' || echo '?')
          echo "SUMMARY: selected_by_filter=$total processed=$cand (older than ${MIN_AGE_HOURS} h, queued, attempt 1) eligible=$elig deleted=$done_n refused=$refused kept=$kept stopped=$stopped dry_run=$DRY_RUN"
          echo "queued runs AFTER: $after (before: $before)"
          echo "rate limit AFTER: $(rl)"

      - name: Cancel all queued workflow runs
        id: cancel
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.delete_zombies || inputs.diagnose)) }}
        run: |
          set -euo pipefail
          before=$(gh run list --repo "$REPO" --status queued --limit 1000 --json databaseId --jq 'length' || echo '?')
          echo "queued runs BEFORE: $before (cancelling only those older than ${MIN_AGE_HOURS} h)"
          cutoff=$(date -u -d "${MIN_AGE_HOURS} hours ago" +%Y-%m-%dT%H:%M:%SZ)
          ids=$(gh run list --repo "$REPO" --status queued --limit 1000 \
                  --json databaseId,createdAt \
                  --jq ".[] | select(.createdAt < \"$cutoff\") | .databaseId" || true)
          if [ -z "$ids" ]; then
            echo "no queued runs to cancel"
            echo "count=0" >> "$GITHUB_OUTPUT"
            printf 'ids<<EOF\n(none)\nEOF\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n=0
          for id in $ids; do
            # Normal cancel first; long-stuck queued runs reject it, so fall
            # back to the force-cancel endpoint (the API path for runs that
            # won't cancel normally). Surface the error if both fail.
            if gh run cancel --repo "$REPO" "$id" 2>/tmp/cancel_err; then
              echo "cancelled $id"; n=$((n+1))
            elif gh api --method POST "repos/$REPO/actions/runs/$id/force-cancel" \
                   >/dev/null 2>>/tmp/cancel_err; then
              echo "force-cancelled $id"; n=$((n+1))
            else
              echo "skip $id: $(tail -n1 /tmp/cancel_err 2>/dev/null || echo 'unknown error')"
            fi
          done
          echo "cancelled $n queued run(s)"
          after=$(gh run list --repo "$REPO" --status queued --limit 1000 --json databaseId --jq 'length' || echo '?')
          echo "queued runs AFTER: $after (before: $before)"
          echo "count=$n" >> "$GITHUB_OUTPUT"
          printf 'ids<<EOF\n%s\nEOF\n' "$ids" >> "$GITHUB_OUTPUT"

      - name: Comment back + close issue
        if: github.event_name == 'repository_dispatch'
        env:
          NUM: ${{ github.event.client_payload.issue.number }}
          COUNT: ${{ steps.cancel.outputs.count }}
          IDS: ${{ steps.cancel.outputs.ids }}
        run: |
          set -euo pipefail
          gh issue comment "$NUM" --repo "$REPO" \
            --body "$(printf 'cancel-queued-runs: cancelled %s queued run(s).\n\nrun ids:\n```\n%s\n```' "$COUNT" "$IDS")"
          gh issue close "$NUM" --repo "$REPO"
