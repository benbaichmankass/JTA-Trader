name: cancel-queued-runs

# Bulk-cancel stale `queued` workflow runs that never got a runner and are
# cluttering the Actions list.
#
# Why this exists:
#   The hosted GitHub MCP token used by the PM-side sandbox session lacks
#   `actions: write`, so it cannot cancel workflow runs directly (the API
#   returns 403 "Resource not accessible by integration"). This workflow is
#   the runner path — a workflow's built-in GITHUB_TOKEN *does* carry
#   `actions: write`, so it can cancel runs on the session's behalf.
#
#   Issue-driven (mirrors vm-diag-snapshot.yml / vm-web-api-recover.yml): open
#   an issue labelled `cancel-queued-runs`, the workflow cancels every queued
#   run, comments the result back, and closes the issue. Also workflow_dispatch
#   for the Actions UI.
#
# Scope / blast radius:
#   * Cancels runs whose status is exactly `queued` AND created more than
#     MIN_AGE_HOURS ago (default 24, 2026-11-25 W48 operator decision Q11:
#     "Approve both (Recommended)", scope >24 h only) — never `in_progress`,
#     never a run younger than the cutoff, so it can NEVER interrupt active CI
#     (including its own run). It used to cancel EVERY queued run, which would
#     also kill the queued CI of open PRs.
#   * Prints the queued count before and after (the audit trail the row wants).
#   * No edits, no deploys, no VM access, no secrets. Read-only beyond the
#     `gh run cancel` calls.
#
# To drive from a sandbox session:
#   mcp__github__issue_write(method='create',
#       title='[cancel-queued-runs] clear stale queued runs',
#       labels=['cancel-queued-runs'], body='<reason — audit>')
#   Then poll the issue comments for the github-actions[bot] reply.

on:
  workflow_dispatch:
    inputs:
      min_age_hours:
        description: 'Only cancel queued runs created more than this many hours ago (default 24; never younger)'
        required: false
        default: '24'
      delete_zombies:
        description: 'DELETE (not cancel) never-started zombie runs: queued, older than min_age_hours, attempt 1, no job started. Default false = the normal cancel path.'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'With delete_zombies: list what WOULD be deleted and delete nothing (default true). Set false only after the operator decision is on record.'
        type: boolean
        required: false
        default: true
  repository_dispatch:  # routed by issue-router.yml (one dispatch per issue label)
    types: [cancel-queued-runs]

permissions:
  actions: write   # required to cancel workflow runs
  issues: write    # comment + close the request issue
  contents: read

concurrency:
  group: cancel-queued-runs
  cancel-in-progress: false

jobs:
  cancel:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'repository_dispatch' &&
       (github.event.client_payload.issue.user.login == github.repository_owner ||
        github.event.client_payload.issue.user.login == 'github-actions[bot]') &&
       contains(github.event.client_payload.issue.labels.*.name, 'cancel-queued-runs'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      MIN_AGE_HOURS: ${{ inputs.min_age_hours || '24' }}
      DELETE_ZOMBIES: ${{ inputs.delete_zombies && 'true' || 'false' }}
      DRY_RUN: ${{ inputs.dry_run == false && 'false' || 'true' }}
    steps:
      # BUILDS-W48 / row ACTIONS-ZOMBIE-QUEUED-RUNS: the plain and force cancel endpoints both return HTTP 409 for runs that are
      # `queued` in the list but never started (282 of 283 on 2026-11-26). The only API path left is DELETE /actions/runs/{id},
      # which removes the run. Scope is deliberately narrow: queued, older than MIN_AGE_HOURS, run_attempt 1, and NO job
      # in_progress or completed. A run that ran is never touched. dry_run defaults TRUE: it lists, deletes nothing.
      - name: Delete never-started zombie runs
        id: zombies
        if: github.event_name == 'workflow_dispatch' && inputs.delete_zombies
        run: |
          set -uo pipefail
          before=$(gh run list --repo "$REPO" --status queued --limit 1000 --json databaseId --jq 'length' || echo '?')
          echo "queued runs BEFORE: $before (dry_run=$DRY_RUN, min age ${MIN_AGE_HOURS} h)"
          cutoff=$(date -u -d "${MIN_AGE_HOURS} hours ago" +%Y-%m-%dT%H:%M:%SZ)
          ids=$(gh run list --repo "$REPO" --status queued --limit 1000 --json databaseId,createdAt \
                  --jq ".[] | select(.createdAt < \"$cutoff\") | .databaseId" || true)
          cand=0; elig=0; done_n=0; kept=0; refused=0
          for id in $ids; do
            cand=$((cand+1))
            info=$(gh api "repos/$REPO/actions/runs/$id" --jq '[.status,.run_attempt,.created_at]|@tsv' 2>/dev/null || echo "?")
            started=$(gh api "repos/$REPO/actions/runs/$id/jobs" --jq '[.jobs[]|select(.status=="in_progress" or .status=="completed")]|length' 2>/dev/null || echo "?")
            st=$(printf '%s' "$info" | cut -f1); att=$(printf '%s' "$info" | cut -f2)
            if [ "$st" = "queued" ] && [ "$att" = "1" ] && [ "$started" = "0" ]; then
              elig=$((elig+1))
              if [ "$DRY_RUN" = "true" ]; then
                echo "WOULD DELETE $id (status=$st attempt=$att started_jobs=$started)"
              elif gh api --method DELETE "repos/$REPO/actions/runs/$id" >/dev/null 2>/tmp/del_err; then
                echo "deleted $id"; done_n=$((done_n+1))
              else
                echo "refused $id: $(tail -n1 /tmp/del_err 2>/dev/null || echo 'unknown error')"; refused=$((refused+1))
              fi
            else
              echo "KEEP $id (status=$st attempt=$att started_jobs=$started): not a never-started zombie"; kept=$((kept+1))
            fi
          done
          after=$(gh run list --repo "$REPO" --status queued --limit 1000 --json databaseId --jq 'length' || echo '?')
          echo "SUMMARY: candidates(older than ${MIN_AGE_HOURS} h)=$cand eligible=$elig deleted=$done_n refused=$refused kept=$kept dry_run=$DRY_RUN"
          echo "queued runs AFTER: $after (before: $before)"

      - name: Cancel all queued workflow runs
        id: cancel
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.delete_zombies) }}
        run: |
          set -euo pipefail
          before=$(gh run list --repo "$REPO" --status queued --limit 1000 --json databaseId --jq 'length' || echo '?')
          echo "queued runs BEFORE: $before (cancelling only those older than ${MIN_AGE_HOURS} h)"
          cutoff=$(date -u -d "${MIN_AGE_HOURS} hours ago" +%Y-%m-%dT%H:%M:%SZ)
          ids=$(gh run list --repo "$REPO" --status queued --limit 1000 \
                  --json databaseId,createdAt \
                  --jq ".[] | select(.createdAt < \"$cutoff\") | .databaseId" || true)
          if [ -z "$ids" ]; then
            echo "no queued runs to cancel"
            echo "count=0" >> "$GITHUB_OUTPUT"
            printf 'ids<<EOF\n(none)\nEOF\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n=0
          for id in $ids; do
            # Normal cancel first; long-stuck queued runs reject it, so fall
            # back to the force-cancel endpoint (the API path for runs that
            # won't cancel normally). Surface the error if both fail.
            if gh run cancel --repo "$REPO" "$id" 2>/tmp/cancel_err; then
              echo "cancelled $id"; n=$((n+1))
            elif gh api --method POST "repos/$REPO/actions/runs/$id/force-cancel" \
                   >/dev/null 2>>/tmp/cancel_err; then
              echo "force-cancelled $id"; n=$((n+1))
            else
              echo "skip $id: $(tail -n1 /tmp/cancel_err 2>/dev/null || echo 'unknown error')"
            fi
          done
          echo "cancelled $n queued run(s)"
          after=$(gh run list --repo "$REPO" --status queued --limit 1000 --json databaseId --jq 'length' || echo '?')
          echo "queued runs AFTER: $after (before: $before)"
          echo "count=$n" >> "$GITHUB_OUTPUT"
          printf 'ids<<EOF\n%s\nEOF\n' "$ids" >> "$GITHUB_OUTPUT"

      - name: Comment back + close issue
        if: github.event_name == 'repository_dispatch'
        env:
          NUM: ${{ github.event.client_payload.issue.number }}
          COUNT: ${{ steps.cancel.outputs.count }}
          IDS: ${{ steps.cancel.outputs.ids }}
        run: |
          set -euo pipefail
          gh issue comment "$NUM" --repo "$REPO" \
            --body "$(printf 'cancel-queued-runs: cancelled %s queued run(s).\n\nrun ids:\n```\n%s\n```' "$COUNT" "$IDS")"
          gh issue close "$NUM" --repo "$REPO"
