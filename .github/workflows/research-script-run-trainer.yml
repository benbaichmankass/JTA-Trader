name: research-script-run-trainer

# THE TRAINER-SIDE TWIN OF research-script-run.yml (lane ML-RQ-RUNNER, 2026-10-11).
#
# WHY. ML research units (model bake-offs, conformal evals, anything that needs trainer-resident
# datasets, the trainer's torch/lightgbm venv or its model cache) had NO dispatchable route: the
# existing trainer units name a prose "trainer-vm-diag issue" as run.workflow, so the dispatcher
# marks them session-bound and only a Claude session can run them. Operator, 2026-10-11: the ML
# roadmap must run the same continuous research-test-improve flow the strategies have. This is the
# route: a unit declares run.workflow: research-script-run-trainer.yml + run.command exactly as for
# the runner, the dispatcher fires it, and the result comes back through the SAME artifact ->
# collector -> E5 record path. Nothing downstream changes.
#
# WHAT IT DOES. (1) re-checks the unit's command against the SAME allowlist on the runner
# (script_run.py --check: python3 + scripts/research/*.py only); (2) SSHes to the trainer, waits until
# the trainer's checkout holds byte-identical copies of the unit file and the scripts it will run
# (the trainer force-syncs main every ~15 min — a stale checkout would run OLD code under a NEW rule),
# runs `script_run.py --run` THERE under the trainer venv (the engine takes the shared heavy-job
# lock itself), (3) copies the outputs back, derives record-inputs.json on the runner, and uploads the
# artifact the collector lands. The command is NEVER a dispatch input — only the unit id and the
# dispatcher's power_state label are (guard: check_research_script_run.py R2).
#
# SECURITY. Unlike the runner this job holds VM_SSH_KEY (that is what reaching the trainer IS), so the
# trust surface is "code landed on main under review" — the same as everything the trainer already
# runs from its own git sync — bounded by the allowlist above. The key is written to ~/.ssh with
# 600 perms and the checkout has persist-credentials: false. Scope tripwire: the remote script is a
# FIXED string; only the validated unit id / run id / sha256 values reach it, via the environment.
#
# READ-ONLY w.r.t. the product: no registry write, no DB write, no deploy. Outputs go under
# comms/research/<unit>/<run_id>/ on the trainer, are copied back, then removed there.
# Serialized (constant concurrency group): the trainer is 1 OCPU / 6 GB — one research run at a time.
#
# landed-by: scripts/research/collect_runner_results.py

on:
  workflow_dispatch:
    inputs:
      research_unit:
        description: "The queue unit to run (RQ-...). Its run.command is read from research/queue/<id>.yaml on this ref."
        required: true
      power_state:
        description: "Pass-through dispatcher power-state label, if any (never a command)"
        default: ""

permissions:
  contents: read

concurrency:
  group: research-script-run-trainer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyyaml requests
      - name: Check the unit's declared command against the allowlist
        id: plan
        env:
          UNIT: ${{ inputs.research_unit }}
        run: |
          set -euo pipefail
          python3 scripts/research/script_run.py --self-test
          python3 scripts/research/script_run.py --unit "${UNIT}" --run-id "${GITHUB_RUN_ID}" --check
          # Content hashes the trainer must match before it runs anything (stale-checkout guard).
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, os, sys
          sys.path.insert(0, ".")
          from scripts.research import script_run
          p = script_run.plan(os.environ["UNIT"], run_id=os.environ["GITHUB_RUN_ID"])
          paths = {f"research/queue/{p.unit}.yaml", "scripts/research/script_run.py"}
          for argv in p.commands:
              paths.add(argv[1])
          if "scripts/research/ml_bakeoff.py" in paths or any("ml_bakeoff" in a for c in p.commands for a in c):
              paths.add("scripts/ml/_heavy_queue.py")
          h = " ".join(f"{hashlib.sha256(open(x,'rb').read()).hexdigest()}:{x}" for x in sorted(paths))
          print(f"hashes={h}")
          print(f"timeout={p.timeout_minutes}")
          PY
      - name: Install SSH key
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VM_SSH_KEY}" ]; then echo "::error::VM_SSH_KEY secret is unset."; exit 1; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${VM_SSH_KEY}" > ~/.ssh/trainer_key
          chmod 600 ~/.ssh/trainer_key
      - name: Run the unit's command(s) ON THE TRAINER
        id: run
        continue-on-error: true
        env:
          TRAINER_IP: ${{ vars.TRAINER_VM_IP || '158.178.209.121' }}
          TRAINER_USER: ${{ vars.TRAINER_VM_USER || 'ubuntu' }}
          UNIT: ${{ inputs.research_unit }}
          HASHES: ${{ steps.plan.outputs.hashes }}
        run: |
          set -uo pipefail
          case "$UNIT" in RQ-[0-9]*) ;; *) echo "::error::bad unit id"; exit 1;; esac
          case "$UNIT" in *[!A-Za-z0-9-]*) echo "::error::bad unit id chars"; exit 1;; esac
          cat > /tmp/remote.sh <<'REMOTE'
          set -uo pipefail
          cd /home/ubuntu/ict-trading-bot || { echo "NO_REPO"; exit 3; }
          PY=/home/ubuntu/ict-trading-bot/.venv/bin/python
          [ -x "$PY" ] || { echo "NO_VENV: $PY missing — trainer venv not provisioned"; exit 5; }
          # Stale-checkout guard: wait (<= 25 min, the git-sync period is ~15) until the trainer holds the
          # SAME bytes the runner validated. Running old code under a new registered rule is the failure.
          deadline=$(( $(date +%s) + 1500 ))
          while :; do
            bad=""
            for ent in $HASHES; do
              want="${ent%%:*}"; f="${ent#*:}"
              have="$(sha256sum "$f" 2>/dev/null | cut -d' ' -f1)"
              [ "$have" = "$want" ] || bad="$bad $f"
            done
            [ -z "$bad" ] && break
            if [ "$(date +%s)" -ge "$deadline" ]; then echo "STALE_CHECKOUT: trainer lacks byte-identical:$bad"; exit 6; fi
            sleep 60
          done
          echo "== trainer git: $(git rev-parse --short HEAD) python: $($PY -V 2>&1)"
          echo "== mem: $(free -m | awk '/Mem:/ {print $7" MB available"}')"
          export PATH="/home/ubuntu/ict-trading-bot/.venv/bin:$PATH"
          python3 scripts/research/script_run.py --unit "$UNIT" --run-id "$RUN_ID" --run
          RC=$?
          echo "== script_run exit: $RC"
          exit $RC
          REMOTE
          ssh -i ~/.ssh/trainer_key \
              -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
              "${TRAINER_USER}@${TRAINER_IP}" \
              "UNIT='${UNIT}' RUN_ID='${GITHUB_RUN_ID}' HASHES='${HASHES}' bash -s" \
              < /tmp/remote.sh > /tmp/out.txt 2>&1
          RC=$?
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          # Public repo: never leave a VM address in a log or an artifact (ssh errors echo it).
          sed -i -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/<ip>/g' /tmp/out.txt
          tail -c 60000 /tmp/out.txt
          exit $RC
      - name: Copy the outputs back from the trainer
        if: always()
        continue-on-error: true
        env:
          TRAINER_IP: ${{ vars.TRAINER_VM_IP || '158.178.209.121' }}
          TRAINER_USER: ${{ vars.TRAINER_VM_USER || 'ubuntu' }}
          UNIT: ${{ inputs.research_unit }}
        run: |
          set -uo pipefail
          mkdir -p "comms/research/${UNIT}"
          scp -r -i ~/.ssh/trainer_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
              "${TRAINER_USER}@${TRAINER_IP}:/home/ubuntu/ict-trading-bot/comms/research/${UNIT}/${GITHUB_RUN_ID}" \
              "comms/research/${UNIT}/"
          ssh -i ~/.ssh/trainer_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
              "${TRAINER_USER}@${TRAINER_IP}" \
              "rm -rf '/home/ubuntu/ict-trading-bot/comms/research/${UNIT}/${GITHUB_RUN_ID}'" || true
      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/trainer_key
      - name: Ensure the run manifest exists, then derive the result record
        if: always()
        env:
          UNIT: ${{ inputs.research_unit }}
          POWER_STATE: ${{ inputs.power_state }}
        run: |
          set -euo pipefail
          OUT="comms/research/${UNIT}/${GITHUB_RUN_ID}"
          mkdir -p "$OUT"
          if [ ! -s "$OUT/run-manifest.json" ]; then
            # The trainer never produced outputs (unreachable, stale checkout, crash before the runner):
            # say so — derive_record turns a missing manifest into read_state=producer_failed.
            sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/<ip>/g' /tmp/out.txt > "$OUT/trainer-session.log" 2>/dev/null || true
          fi
          python3 scripts/research/script_run.py --unit "${UNIT}" --run-id "${GITHUB_RUN_ID}" \
            --derive-record --power-state "${POWER_STATE}" > /dev/null
          test -s "$OUT/record-inputs.json"
      - name: Upload the run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-script-run-trainer-${{ inputs.research_unit }}-${{ github.run_id }}
          path: comms/research/${{ inputs.research_unit }}/${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
      - name: Summarize
        if: always()
        env:
          UNIT: ${{ inputs.research_unit }}
        run: |
          {
            echo "### research-script-run-trainer — ${UNIT}"
            echo
            echo "* trainer command(s): \`${{ steps.run.outcome }}\` (rc=${{ steps.run.outputs.rc }})"
            echo "* outputs + record-inputs.json uploaded as artifact; landed in one batch by the next research-queue-dispatch cycle"
            echo
            echo '```'
            tail -c 4000 /tmp/out.txt 2>/dev/null || echo "(no trainer output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if the trainer command failed
        if: always() && steps.run.outcome != 'success'
        run: |
          echo "::error::the unit's command did not complete on the trainer (rc=${{ steps.run.outputs.rc }}) — its manifest/logs and a producer_failed record are in the artifact and land with the next cycle."
          exit 1
