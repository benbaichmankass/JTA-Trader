name: probe-vm-git-deploy-token-scope
# ONE-OFF probe (manager, 2026-10-26). It runs ONLY on push to this probe branch
# and is never merged. It tests what VM_GIT_DEPLOY_TOKEN may do, for the LTR
# VM-direct wake (a comment on ops-flags PR #17895). The token is never printed.
on:
  push:
    branches: [probe/vm-git-deploy-token-scope]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          T: ${{ secrets.VM_GIT_DEPLOY_TOKEN }}
          R: ${{ github.repository }}
        run: |
          set -u
          if [ -z "${T}" ]; then echo "RESULT token=unset"; exit 1; fi
          probe() {  # name method url [json]
            local name=$1 m=$2 u=$3 d=${4:-}
            if [ -n "$d" ]; then
              code=$(curl -sS -o /tmp/b -D /tmp/h -w '%{http_code}' -X "$m" -H "Authorization: Bearer ${T}" -H "Accept: application/vnd.github+json" -d "$d" "$u")
            else
              code=$(curl -sS -o /tmp/b -D /tmp/h -w '%{http_code}' -X "$m" -H "Authorization: Bearer ${T}" -H "Accept: application/vnd.github+json" "$u")
            fi
            need=$(grep -i '^x-accepted-github-permissions:' /tmp/h | cut -d: -f2- | tr -d '\r' | xargs)
            exp=$(grep -i '^github-authentication-token-expiration:' /tmp/h | cut -d: -f2- | tr -d '\r' | xargs)
            msg=$(python3 -c "import json;print(json.load(open('/tmp/b')).get('message',''))" 2>/dev/null || true)
            echo "RESULT ${name} http=${code} accepted_permissions='${need}' token_expiry='${exp}' message='${msg}'"
          }
          probe repo_metadata GET "https://api.github.com/repos/${R}"
          probe issue_read GET "https://api.github.com/repos/${R}/issues/17895"
          probe pr_comments_read GET "https://api.github.com/repos/${R}/issues/17895/comments?per_page=1"
          probe pr_comment_write POST "https://api.github.com/repos/${R}/issues/17895/comments" '{"body":"token-scope probe (manager, 2026-10-26): VM_GIT_DEPLOY_TOKEN can post to ops-flags. Safe to ignore.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_"}'
          if [ -f /tmp/b ] && python3 -c "import json,sys;sys.exit(0 if json.load(open('/tmp/b')).get('id') else 1)" 2>/dev/null; then echo "RESULT posted_comment_id=$(python3 -c "import json;print(json.load(open('/tmp/b'))['id'])")"; fi
