              },
              // M1/M3 backfill triggers. These were being auto-created implicitly by the
              // issues API on first use, which works but leaves the declared set incomplete —
              // and this file exists so the labels workflows FILTER on are declared, not
              // discovered. Declaring them also documents what each one fires.
              {
                name: 'flip-override-walkforward-request',
                color: '5319e7',
