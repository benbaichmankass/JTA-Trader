              },
              // NOTE: `econ-event-study-now` is deliberately NOT re-declared here — it is
              // already declared above. A second entry for the same name is DEAD TEXT, not a
              // second declaration: the loop is get-then-skip, so an existing label is left
              // as-is and the later entry's description is never applied. (One was added here
              // on 2026-07-30 and removed the same day.) Before adding a label, grep this
              // array for the name — a duplicate reads like an update while updating nothing.
            ];
            // Resilient bootstrap: one bad label must not abort the rest.
            // GitHub caps label descriptions at 100 chars (422 otherwise), so
            // truncate defensively; collect failures and surface them at the
            // end instead of throwing mid-loop (the prior `throw e` left every
            // label after the first failure uncreated and the run chronically
            // red).
            const failures = [];
            for (const l of LABELS) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: l.name,
                });
                core.info(`label '${l.name}' exists — leaving as-is`);
                continue;
              } catch (e) {
                if (e.status !== 404) {
                  core.warning(`getLabel '${l.name}' failed: ${e.message}`);
                  failures.push(l.name);
                  continue;
                }
              }
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: l.name,
                  color: l.color,
                  description: (l.description || '').slice(0, 100),
                });
                core.info(`created label '${l.name}'`);
              } catch (ce) {
                core.warning(`createLabel '${l.name}' failed: ${ce.message}`);
                failures.push(l.name);
              }
            }
            if (failures.length) {
              core.setFailed(`label bootstrap failed for: ${failures.join(', ')}`);
            }
