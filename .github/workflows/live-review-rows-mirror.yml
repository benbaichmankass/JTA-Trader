name: live-review-rows-mirror

# LTR-APPLY-AUTOFLOW (iv), operator 2026-10-26 ("Approve: rows branch + pinned
# commit (Recommended)"). Reviewers push rows straight to the protected
# append-only `live-review/rows` branch so the apply runs on a pinned commit with
# no main PR in its path. main must still carry the full record: this workflow
# opens ONE self-landing PR (commit-to-main, verify-merged) copying the rows
# main lacks onto main's comms/live_review/reviews.jsonl, plus the packets and
# outcome tables they cite. Merged BY review_id, never text concat; a re-run is
# a no-op. Logic: scripts/ops/live_review_rows_mirror.py.
# LTR-ROWS-SWAP-TRUNCATION (2026-10-27): rows come from the legacy reviews.jsonl AND the per-row files
# comms/live_review/rows/<review_id>.json; the legacy file is refused (a red run) when a row an earlier
# version of it carried is gone at the tip, so nothing is mirrored from a truncated file.
#
# One PR at a time: the concurrency group serialises runs, and a run that finds its previous
# mirror PR still open does not open a second one (deferred verification, CI-SUITE-SLOWDOWN 2026-11-12).
# The hourly schedule is the backstop for a push whose run was superseded.
# ⚠️ A `push` run uses the workflow file AS IT EXISTS ON THE PUSHED BRANCH, and
# live-review/rows was cut from main before this file existed, so a push run uses a stale copy. The full
# workflow runs from main: `branch-mirror-heartbeat.yml` dispatches it (`--ref main`) on every main push,
# because the :41 cron also fires late or not at all (2026-10-27: 43 min late). Mirror lag never touches
# the apply, which reads the pinned rows-branch commit directly.
# A rows-branch row the checker's rules refuse is skipped as `schema: ...` (visible in the run summary)
# and does not fail the run: the branch is append-only, so it would stay red forever.
# LTR-PACKET-ECHO (2026-10-27): a packet_sha mismatch is `packet_sha: ...`: ::error plus ONE ops-flags
# comment per review_id (Prime Directive rule 7: refuse, keep running, one flag). Rows listed in
# comms/live_review/killed_rows.json on main are reported as `killed` with their reason, never mirrored.
# LTR-5 / DESK-9-GRADING: after the mirror, every review whose trade has CLOSED is priced against its
# counterfactual (scripts/ops/live_review_grade.py --live --write-outcomes -> comms/live_review/outcomes.jsonl,
# idempotent by review_id) so grading runs on this schedule instead of whenever a session remembers (the
# first closed-trade review sat unpriced until 2026-10-26 for exactly that reason). A pricing failure is a
# warning, never a stop (Prime Directive rule 7).
# Tier 1: data copy between two branches of this repo; no runtime effect.

on:
  push:
    branches: ["live-review/rows"]
    paths: ["comms/live_review/**"]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: live-review-rows-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # no in-run merge wait since CI-SUITE-SLOWDOWN (2026-11-12): checkout + mirror + pricing only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # commit-to-main pushes with the checkout's credential; the PAT makes
          # the PR it opens receive its required checks.
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}

      # CI-SUITE-SLOWDOWN (2026-11-12): NO IN-RUN MERGE WAIT. This job used to hold a hosted runner for up to
      # 80 min in commit-to-main's verify-merged while its own PR waited on the queued checks, and that wait
      # was itself one of the 20 slots the checks were queued behind (MEASURED 2026-11-12: this mirror and its
      # sibling each held a slot ~90 min while 20/20 slots were busy and ~600 jobs queued). Arrival is now
      # verified ONE CYCLE LATER, here: an open mirror PR younger than 4 h means "still landing" -> this
      # run computes and validates but does not open a second PR; one older than that is STRANDED -> it is
      # closed, this run re-lands everything main still lacks (the mirror is idempotent by id), and the run
      # goes red once (Prime Directive rule 7: keep going, one flag). Fails open: an API error lands anyway.
      # Pinned in tests/test_commit_to_main_callers.py::DEFERRED_VERIFY.
      - name: Check for an in-flight mirror PR (deferred merge verification)
        id: inflight
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          PREFIX: automation/live-review-rows-mirror
          MAX_AGE_S: "14400"
        run: |
          set -uo pipefail
          prs="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --paginate \
                --jq '.[] | select(.head.ref | startswith(env.PREFIX)) | "\((now - (.created_at | fromdateiso8601)) | floor) \(.number)"')" \
            || { echo "::warning::could not list open PRs; landing anyway"; echo "skip=0" >> "$GITHUB_OUTPUT"; exit 0; }
          skip=0; stranded=""
          while read -r age n; do
            [ -n "${n:-}" ] || continue
            if [ "$age" -gt "$MAX_AGE_S" ]; then
              stranded="$stranded #$n"
              gh pr close "$n" --repo "$GITHUB_REPOSITORY" --comment "Closed by $GITHUB_WORKFLOW run $GITHUB_RUN_ID: this mirror PR did not merge within 4 h (stranded). The run re-lands every row main still lacks in a fresh PR." || true
            else
              skip=1; echo "::notice::mirror PR #$n (${age}s old) is still landing; not opening a second one this run"
            fi
          done <<< "$prs"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "stranded=$stranded" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Mirror new rows by review_id
        id: mirror
        env:
          # LTR-PACKET-ECHO: a packet_sha refusal (or a missing/differing cited file) raises ONE ops-flags
          # comment per review_id (deduped by hidden markers) instead of a quiet ::warning.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          pip install --quiet pyyaml
          git fetch --no-tags origin live-review/rows
          rc=0
          FLAG_PR=$(python3 -c 'import yaml;print(yaml.safe_load(open("scripts/research/research_watchdog.yaml"))["ops_flags"]["pr_number"])')
          python3 scripts/ops/live_review_rows_mirror.py --rows-ref origin/live-review/rows --flag-pr "$FLAG_PR" \
            | tee mirror.json | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "mirrored=$(python3 -c 'import json;print(json.load(open("mirror.json")).get("mirrored",0))')" >> "$GITHUB_OUTPUT"
          rm -f mirror.json
          [ "$rc" -ne 2 ] || { echo "::error::could not read the rows branch"; exit 1; }
          python3 scripts/ci/check_live_review_records.py

      - name: Price closed reviews (LTR-5)
        id: price
        continue-on-error: true
        env:
          DIAG_READ_TOKEN: ${{ secrets.DIAG_READ_TOKEN }}
        run: |
          set -o pipefail
          pip install --quiet pandas
          python3 scripts/ops/live_review_grade.py --live --write-outcomes > /dev/null \
            || { echo "::warning::live_review_grade failed; the mirror still lands"; exit 0; }
          python3 scripts/ci/check_live_review_records.py
          if [ -n "$(git status --porcelain comms/live_review)" ]; then echo "changed=1" >> "$GITHUB_OUTPUT"; else echo "changed=0" >> "$GITHUB_OUTPUT"; fi

      - name: Land on main (one self-landing PR)
        if: steps.inflight.outputs.skip != '1' && (steps.mirror.outputs.mirrored != '0' || steps.price.outputs.changed == '1')
        uses: ./.github/actions/commit-to-main
        with:
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          paths: comms/live_review comms/live_review/outcomes.jsonl
          # outcomes are re-priced hourly, idempotent by review_id: on a stale-branch conflict adopt main's copy
          refresh-command: git fetch -q origin main && git checkout FETCH_HEAD -- comms/live_review/outcomes.jsonl || true
          message: "live-review: mirror ${{ steps.mirror.outputs.mirrored }} row(s) from live-review/rows"
          pr-title: "live-review: mirror rows from live-review/rows"
          pr-body: "Automated mirror (auto-merge): rows on live-review/rows that main's comms/live_review/reviews.jsonl lacks, merged by review_id, plus the packets and outcome tables they cite. scripts/ops/live_review_rows_mirror.py."
          verify-merged: "false"  # deferred: the next run's in-flight check verifies arrival (above)
          branch-prefix: automation/live-review-rows-mirror

      - name: Fail the run if a row was skipped
        # A skipped row (a cited file missing, or differing on main) is a
        # finding, not a pass. Runs last so the other rows still land.
        if: steps.mirror.outputs.rc == '1'
        run: |
          echo "::error::a rows-branch row was skipped; see the mirror summary"
          exit 1

      - name: Fail the run if a previous mirror PR stranded
        # Deferred verification's red: the PR an earlier run opened did not merge in time. Its rows were
        # re-landed above; this is the one flag that the landing path itself needs a look.
        if: steps.inflight.outputs.stranded != ''
        run: |
          echo "::error::closed stranded mirror PR(s):${{ steps.inflight.outputs.stranded }} (not merged within the deferred-verification window)"
          exit 1
