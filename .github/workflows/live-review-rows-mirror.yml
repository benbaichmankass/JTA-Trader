name: live-review-rows-mirror

# LTR-APPLY-AUTOFLOW (iv), operator 2026-10-26 ("Approve: rows branch + pinned
# commit (Recommended)"). Reviewers push rows straight to the protected
# append-only `live-review/rows` branch so the apply runs on a pinned commit with
# no main PR in its path. main must still carry the full record: this workflow
# opens ONE self-landing PR (commit-to-main, verify-merged) copying the rows
# main lacks onto main's comms/live_review/reviews.jsonl, plus the packets and
# outcome tables they cite. Merged BY review_id, never text concat; a re-run is
# a no-op. Logic: scripts/ops/live_review_rows_mirror.py.
#
# One PR at a time: the concurrency group serialises runs and each run waits for
# its PR to merge, so the next run checks out a main that already has those rows.
# The hourly schedule is the backstop for a push whose run was superseded.
# ⚠️ A `push` run uses the workflow file AS IT EXISTS ON THE PUSHED BRANCH, and
# live-review/rows was cut from main before this file existed. Until the rows
# branch carries this file (main merged into it), only the schedule fires:
# mirror lag <= ~1 h. That lag never touches the apply, which reads the pinned
# rows-branch commit directly.
# LTR-5 / DESK-9-GRADING: after the mirror, every review whose trade has CLOSED is priced against its
# counterfactual (scripts/ops/live_review_grade.py --live --write-outcomes -> comms/live_review/outcomes.jsonl,
# idempotent by review_id) so grading runs on this schedule instead of whenever a session remembers (the
# first closed-trade review sat unpriced until 2026-10-26 for exactly that reason). A pricing failure is a
# warning, never a stop (Prime Directive rule 7).
# Tier 1: data copy between two branches of this repo; no runtime effect.

on:
  push:
    branches: ["live-review/rows"]
    paths: ["comms/live_review/**"]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: live-review-rows-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 110  # commit-to-main verify-merged waits up to 80 min (tests/test_commit_to_main_callers.py)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # commit-to-main pushes with the checkout's credential; the PAT makes
          # the PR it opens receive its required checks.
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Mirror new rows by review_id
        id: mirror
        run: |
          set -o pipefail
          pip install --quiet pyyaml
          git fetch --no-tags origin live-review/rows
          rc=0
          python3 scripts/ops/live_review_rows_mirror.py --rows-ref origin/live-review/rows \
            | tee mirror.json | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "mirrored=$(python3 -c 'import json;print(json.load(open("mirror.json")).get("mirrored",0))')" >> "$GITHUB_OUTPUT"
          rm -f mirror.json
          [ "$rc" -ne 2 ] || { echo "::error::could not read the rows branch"; exit 1; }
          python3 scripts/ci/check_live_review_records.py

      - name: Price closed reviews (LTR-5)
        id: price
        continue-on-error: true
        env:
          DIAG_READ_TOKEN: ${{ secrets.DIAG_READ_TOKEN }}
        run: |
          set -o pipefail
          pip install --quiet pandas
          python3 scripts/ops/live_review_grade.py --live --write-outcomes > /dev/null \
            || { echo "::warning::live_review_grade failed; the mirror still lands"; exit 0; }
          python3 scripts/ci/check_live_review_records.py
          if [ -n "$(git status --porcelain comms/live_review)" ]; then echo "changed=1" >> "$GITHUB_OUTPUT"; else echo "changed=0" >> "$GITHUB_OUTPUT"; fi

      - name: Land on main (one self-landing PR)
        if: steps.mirror.outputs.mirrored != '0' || steps.price.outputs.changed == '1'
        uses: ./.github/actions/commit-to-main
        with:
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          paths: comms/live_review comms/live_review/outcomes.jsonl
          # outcomes are re-priced hourly, idempotent by review_id: on a stale-branch conflict adopt main's copy
          refresh-command: git fetch -q origin main && git checkout FETCH_HEAD -- comms/live_review/outcomes.jsonl || true
          message: "live-review: mirror ${{ steps.mirror.outputs.mirrored }} row(s) from live-review/rows"
          pr-title: "live-review: mirror rows from live-review/rows"
          pr-body: "Automated mirror (auto-merge): rows on live-review/rows that main's comms/live_review/reviews.jsonl lacks, merged by review_id, plus the packets and outcome tables they cite. scripts/ops/live_review_rows_mirror.py."
          verify-merged: "true"

      - name: Fail the run if a row was skipped
        # A skipped row (a cited file missing, or differing on main) is a
        # finding, not a pass. Runs last so the other rows still land.
        if: steps.mirror.outputs.rc == '1'
        run: |
          echo "::error::a rows-branch row was skipped; see the mirror summary"
          exit 1
