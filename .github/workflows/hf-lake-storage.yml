name: hf-lake-storage

# Measure (and, on request, SQUASH the history of) the private HF dataset bentzbk/jta-market-lake so it stays under the free
# private-storage cap. Row HF-LAKE-STORAGE-403 (lane HF-LAKE-SQUASH). Operator decision 2026-11-05: "Squash first, then free org".
# CI saw 403 "Private repository storage limit reached for bentzbk" on MANIFEST.json (lane ML-DATA-WIRING).
#
# no-durable-result: storage maintenance of the private HF dataset; computes no research verdict. The before/after numbers are
# commented on the triggering issue and kept as a 30-day artifact; the dataset itself is the output.
#
# GATES THIS ADDS OR CHANGES: none. Data path only: no order path, no config the trader reads, no execution flag.
#
# MODES (issue body `mode:` line; label `hf-lake-storage-request`; pull_request always runs measure only)
#   measure   per-private-repo storage on the account, lake current-revision size vs total used (the difference is history)
#   squash    measure -> super_squash_history (IRREVERSIBLE history removal, operator-approved 2026-11-05) -> measure
#             -> verify MANIFEST.json resolves with HTTP 200
# The daily market-data-lake run also squashes when account private storage passes the threshold (retention).

on:
  repository_dispatch:  # routed by issue-router.yml (one dispatch per issue label)
    types: [labeled:hf-lake-storage-request]
  pull_request:
    paths:
      - ".github/workflows/hf-lake-storage.yml"
      - "scripts/data_lake/hf_storage.py"

permissions:
  contents: read
  issues: write

concurrency:
  group: hf-lake-storage-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: false

jobs:
  storage:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository ||
      github.event_name == 'repository_dispatch' && github.event.client_payload.label.name == 'hf-lake-storage-request' &&
      (github.event.client_payload.issue.user.login == github.repository_owner || github.event.client_payload.issue.user.login == 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet huggingface_hub pyyaml
      - name: Resolve mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.client_payload.issue.body }}
        run: |
          set -euo pipefail
          m="measure"
          if [ "$EVENT" = "repository_dispatch" ]; then
            m="$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^mode:[[:space:]]*\([a-z]*\).*/\1/p' | head -1)"; m="${m:-measure}"
          fi
          case "$m" in measure|squash) ;; *) echo "::error::bad mode '$m'"; exit 1;; esac
          echo "mode=$m" >> "$GITHUB_OUTPUT"
      - name: Measure / squash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -o pipefail
          if [ -z "${HF_TOKEN}" ]; then echo "::error::HF_TOKEN not set"; exit 1; fi
          python3 scripts/data_lake/hf_storage.py "$MODE" --record storage.json 2>&1 | tee storage.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hf-lake-storage
          path: |
            storage.json
            storage.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Comment the numbers on the issue
        if: always() && github.event_name == 'repository_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = `hf-lake-storage mode=${{ steps.mode.outputs.mode }} run=${context.runId}\n\n\`\`\`\n`;
            if (fs.existsSync('storage.log')) body += fs.readFileSync('storage.log', 'utf8').slice(-55000);
            body += '\n```';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: (context.payload.client_payload?.issue?.number ?? context.issue.number), body });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: (context.payload.client_payload?.issue?.number ?? context.issue.number), state: 'closed' });
