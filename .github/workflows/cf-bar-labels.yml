name: cf-bar-labels

# AM-V2-CF-DIRECTED unit 1 (bar-expanded label build, docs/research/ml-am-heads-design-2026-11-23.md section 2). Applies
# scripts/research/cf_bar_labels_run.py to the same job corpus and shard plan as cf-bulk-backtest (it imports cf_bulk.build_plan, so shard ids and
# job keys are cf_bulk's own) on GitHub-hosted runners: plan -> sharded matrix -> census. No Claude, no API credits, no secrets; it only READS the
# checked-out corpus + the keyless Binance Vision archive and UPLOADS artifacts (bar_labels shards, census.json). It does no bracket replay and
# does not touch cf_bulk output. Gates this adds or changes: none. Nothing here touches the trade path.
# no-durable-result: artifacts-only first run (labels are training input for the AM v2 heads, large); the small census.json is landed under comms/research/ by the unit that reads it
# Resumable: a shard is cheap to redo; a failed shard job is retried by re-dispatching (batches are independent).

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id (names the artifacts), e.g. cfbl-20261123"
        required: true
      batches:
        description: "Matrix width (balanced batches of shards)"
        default: "24"
      corpus_sha:
        description: "Commit sha whose comms/research + comms/strategy_evidence trade corpus is labelled (pins the job set; default = the sha cfb-20261123w ran on, MEASURED: its file_list_sha1 8ea90ce7e5fc... reproduces from this sha, 7,289 files, 510,345 jobs). Empty = the dispatch ref's own corpus."
        default: "1eb164f4ae641bea82ac34692af9cb7031640a62"
      max_fwd_bars:
        description: "Forward window (bars) the labels look ahead; rows with fewer bars left and no stop/target are censored"
        default: "48"
      context:
        description: "AM-V2-RICHER-FEATURES: 'true' adds the ctx block (market structure + vol regime, bars <= k incl. pre-entry history) to every row"
        default: "false"
      fit_rich_unit:
        description: "Optional queue unit id (e.g. RQ-20261124-a9d2-01): after the labels, run am_heads_fit.py run --feats rich on them (needs context=true) and upload summary/verdict"
        default: ""
      research_unit:
        description: "Pass-through queue unit id the research dispatcher threads (labels the run; the fit job uses fit_rich_unit). Never a command."
        default: ""
      power_state:
        description: "Pass-through dispatcher power-state label, if any (never a command)"
        default: ""

permissions:
  contents: read

concurrency:
  group: cf-bar-labels-${{ github.event.inputs.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas pyyaml requests
      - name: Pin the trade corpus to corpus_sha (code stays at the dispatch ref)
        if: ${{ inputs.corpus_sha != '' }}
        env:
          CORPUS_SHA: ${{ inputs.corpus_sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$CORPUS_SHA"
          rm -rf comms/research comms/strategy_evidence
          git checkout "$CORPUS_SHA" -- comms/research comms/strategy_evidence
          echo "corpus pinned to $CORPUS_SHA"
      - name: Plan shards (cf_bulk's own planner)
        env:
          RUN_ID: ${{ inputs.run_id }}
          BATCHES: ${{ inputs.batches }}
        run: python3 scripts/research/cf_bulk.py plan --run-id "$RUN_ID" --out out --batches "$BATCHES"
      - id: m
        run: echo "matrix=$(python3 -c "import json;print(json.dumps({'include':[{'batch':b['batch'],'index':' '.join(map(str,b['index']))} for b in json.load(open('out/batches.json'))]}))")" >> "$GITHUB_OUTPUT"
      - run: echo "corpus_sha=$GITHUB_SHA" && python3 -c "import json;print(json.load(open('out/plan.json'))['input'])"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.run_id }}-plan
          path: out/plan.json

  shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas pyyaml requests
      - name: Pin the trade corpus to corpus_sha (code stays at the dispatch ref)
        if: ${{ inputs.corpus_sha != '' }}
        env:
          CORPUS_SHA: ${{ inputs.corpus_sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$CORPUS_SHA"
          rm -rf comms/research comms/strategy_evidence
          git checkout "$CORPUS_SHA" -- comms/research comms/strategy_evidence
          echo "corpus pinned to $CORPUS_SHA"
      - name: Label this batch's shards
        env:
          RUN_ID: ${{ inputs.run_id }}
          INDEX: ${{ matrix.index }}
          MAXF: ${{ inputs.max_fwd_bars }}
          CTX: ${{ inputs.context }}
        run: |
          EXTRA=""
          if [ "$CTX" = "true" ]; then EXTRA="--context"; fi
          python3 scripts/research/cf_bar_labels_run.py shard --run-id "$RUN_ID" --out out --index $INDEX --max-fwd-bars "$MAXF" $EXTRA
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.run_id }}-labels-${{ matrix.batch }}
          path: out/bar_labels
          if-no-files-found: ignore
          retention-days: 14

  census:
    needs: shard
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas pyyaml requests
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.run_id }}-labels-*
          path: out/bar_labels
          merge-multiple: true
      - run: python3 scripts/research/cf_bar_labels_run.py census --out out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.run_id }}-census
          path: out/census.json

  fit_rich:
    # AM-V2-RICHER-FEATURES: the registered BASE-vs-RICH head fit (RULE-AM-HEADS-RICHER-20261124) on this run's labels. Research only: it reads the
    # labels artifacts + the pinned corpus and uploads summary.json / verdict.json; the record is landed by the lane through script_run --derive-record.
    needs: shard
    if: always() && needs.plan.result == 'success' && inputs.fit_rich_unit != '' && inputs.context == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas pyyaml requests lightgbm scikit-learn
      - name: Pin the trade corpus to corpus_sha (code stays at the dispatch ref)
        if: ${{ inputs.corpus_sha != '' }}
        env:
          CORPUS_SHA: ${{ inputs.corpus_sha }}
        run: |
          cp comms/research/holdout_reads.jsonl /tmp/holdout_reads.jsonl   # the CURRENT ledger, so the claim's n_tries counts every prior read
          git fetch --no-tags --depth=1 origin "$CORPUS_SHA"
          rm -rf comms/research comms/strategy_evidence
          git checkout "$CORPUS_SHA" -- comms/research comms/strategy_evidence
          cp /tmp/holdout_reads.jsonl comms/research/holdout_reads.jsonl
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.run_id }}-labels-*
          path: labels
          merge-multiple: true
      - name: Fit BASE vs RICH heads
        env:
          UNIT: ${{ inputs.fit_rich_unit }}
        run: |
          python3 scripts/research/am_heads_fit.py run --feats rich --labels labels --corpus . --out fit --unit "$UNIT" \
            --reader "cf-bar-labels fit_rich (${{ github.run_id }})" --rows-per-fold 400000
          tail -n 1 comms/research/holdout_reads.jsonl > fit/holdout_claim_row.jsonl   # the claim this run appended; the lane lands it in the repo ledger
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.run_id }}-fit-rich
          path: fit
          if-no-files-found: ignore
