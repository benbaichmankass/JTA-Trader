name: repo-inventory

# Runs the lightweight repo-inventory script and uploads its output
# as a build artifact. ADVISORY ONLY — this workflow never fails the
# PR; its purpose is to make extension counts, large files, and junk
# candidates visible per-PR so reviewers spot drift early.
#
# Promotion to a blocking check is a follow-up sprint after the
# inventory artifact has been observed across ≥ 5 PRs.
#
# **2026-07-06 (Actions-minutes billing cap, MB-20260706-CI-MINUTES
# survey):** deliberately left WITHOUT a `paths:` filter or a
# changed-files short-circuit. Its whole point is a full-tree scan
# (extension counts, large files, junk candidates) that can drift
# regardless of which specific files a PR touched, and it has no pip
# install to save (stdlib-only script) — narrowing its trigger would
# blind it to the exact class of drift it exists to catch, for near-zero
# billing savings.

on:
  # Dormant until the native merge queue is enabled (BL-20260726 merge-queue enablement);
  # required checks MUST run on the merge_group ref or the queue stalls.
  # NO PULL_REQUEST, MERGE_GROUP OR PUSH TRIGGER (CI-STREAMLINE, manager item 0, 2026-11-03). This is ADVISORY, not in
  # branch-protection-sync.yml REQUIRED_CONTEXTS (pytest-collect / pytest-run / guards); #22730 merged with it cancelled.
  # Yet as a per-PR check it blocked landings: its 5-min job was cancelled INSIDE actions/checkout under load
  # (#22730 job 126204368161, #22705 job 126162423119, #22704), and scripts/ops/ci_settle.py rightly reads any cancelled
  # check as "no verdict", so the PR never read settled and sessions re-ran it by hand.
  # A cheaper checkout cannot fix it: scripts/repo_inventory.py stats EVERY file in the working tree (sizes + names), so
  # it needs the whole ~6.4 GB tree; sparse would change what it measures and blobless still fetches every HEAD blob.
  # It now runs once a day on main. GIVES UP: the per-PR inventory artifact (3-day retention; nothing reads it).
  # Pinned by tests/test_ci_streamline_no_push.py.
  schedule:
    - cron: '47 4 * * *'
  # workflow_dispatch (2026-08-10, BL-20260807-REQUIRED-CHECKS-LACK-WORKFLOW-DISPATCH).
  # The three REQUIRED checks (pytest-collect, pytest-run, guards) already carry
  # one — verified against branch-protection-sync.yml REQUIRED_CONTEXTS. This one
  # is advisory, so a dropped webhook cannot block a merge; it gets a dispatch
  # purely so its full-tree drift scan is re-runnable on demand.
  workflow_dispatch:

# Concurrency (2026-08-10, BL-20260810-REQUIRED-WORKFLOWS-NO-CONCURRENCY-GROUP).
# Without a group, a re-queue (a second push to the same PR, or the
# `opened`+`synchronize` double-fire) STACKS a second full run instead of
# superseding the first — for repo-inventory that is a wasted ~full-tree scan against the
# 2,000-minute free-tier cap this repo already hit once (MB-20260706-CI-MINUTES).
# Observed live on PR #8733: a second commit queued a second full suite while
# the first was still running.
#
# `github.event_name` is IN THE GROUP KEY deliberately: a `merge_group` run must
# NEVER be cancelled by a `pull_request` run on the same ref, or the merge queue
# stalls on a required check that reports `cancelled`. Same shape as guards.yml.
concurrency:
  group: repo-inventory-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repo-inventory:
    runs-on: ubuntu-latest
    # 5 -> 20 (CI-STREAMLINE): a daily off-peak run; the 5-min cap only existed to bound a per-PR cost.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run repo inventory
        run: |
          mkdir -p artifacts
          python scripts/repo_inventory.py | tee artifacts/repo-inventory.txt

      - name: Upload inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-inventory
          path: artifacts/repo-inventory.txt
          retention-days: 3

      # Advisory contract: never fail the workflow, even if the
      # script returns non-zero. Replace this `if: always()` step
      # with a real gate only after the inventory has stabilised.
      - name: Confirm advisory status
        if: always()
        run: |
          echo "::notice::repo-inventory is advisory; not gating PR merge."

# no-durable-result: explicitly ADVISORY ONLY per its own header; a repo-hygiene inventory, not a research verdict
