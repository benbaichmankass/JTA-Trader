name: oi-feed-freshness

# E4-DEMO-LEG. Grades the live open-interest feed the e4_oi_shock_1h leg reads
# (runtime_logs/oi_feed/status.json on the VM, via /api/diag/log_file?name=oi_feed_status)
# every 2 h with scripts/ops/oi_feed_freshness.py and keeps ONE tracking issue: body
# rewritten every run (a stale "Last checked" means this schedule died), a comment only
# when the graded state moves. Not a gate: it changes nothing on the trade path.
# Tier 1: read-only GET, one GitHub issue written.

on:
  schedule:
    - cron: '41 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: oi-feed-freshness
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read and grade
        id: grade
        env:
          DIAG_READ_TOKEN: ${{ secrets.DIAG_READ_TOKEN }}
        run: |
          set -uo pipefail
          pip install -q pyyaml
          bash scripts/ops/diag_fetch.sh 'log_file?name=oi_feed_status&lines=5' > /tmp/oi.json || echo '{}' > /tmp/oi.json
          set +e
          python3 scripts/ops/oi_feed_freshness.py --status-json /tmp/oi.json > /tmp/render.txt; rc=$?
          set -e
          cat /tmp/render.txt
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          echo "digest=$(python3 scripts/ops/oi_feed_freshness.py --status-json /tmp/oi.json --json | python3 -c 'import json,sys; print(\"-\".join(f\"{k}:{v}\" for k,v in sorted(json.load(sys.stdin)[\"states\"].items())))')" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        env:
          RC: ${{ steps.grade.outputs.rc }}
          DIGEST: ${{ steps.grade.outputs.digest }}
        with:
          script: |
            const fs = require('fs');
            const LABEL = 'oi-feed-freshness';
            const render = fs.readFileSync('/tmp/render.txt', 'utf8').slice(0, 20000);
            const digest = process.env.DIGEST, rc = process.env.RC;
            const now = new Date().toISOString();
            const body = [
              `<!-- oi-feed-freshness: ${digest} -->`,
              `**Last checked: ${now}** · exit \`${rc}\` (0 all fresh · 1 stale or cold · 3 could not look)`,
              ``, '```', render.trim(), '```',
              ``, `Grader: \`scripts/ops/oi_feed_freshness.py\` (row E4-DEMO-LEG). Read-only.`,
              ``, `---`, `_Generated by [Claude Code](https://claude.ai/code)_`,
            ].join('\n');
            const found = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: LABEL, per_page: 10 });
            const issue = found.data.find(i => !i.pull_request);
            if (!issue) {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
                title: '📈 E4 open-interest feed freshness', body, labels: [LABEL] });
              return;
            }
            const prev = ((issue.body || '').match(/oi-feed-freshness: (\S+) -->/) || [])[1];
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body });
            if (prev === digest) return;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
              body: `### Graded state changed \`${prev || 'none'}\` → \`${digest}\`\n\n\`\`\`\n${render.trim()}\n\`\`\`\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_` });
