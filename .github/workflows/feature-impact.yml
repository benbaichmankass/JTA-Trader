name: feature-impact

# FEATURE-IMPACT-MAP v0 (docs/design/ui-workplan-2026-11.md section 15): the weekly long table of per-feature
# impact, M1 (model-internal split/gain share) from the committed ml/served + ml/candidates artifacts.
# Off-VM, no Claude, no network beyond pip: scripts/ml/feature_impact.py reads repo files and writes
# comms/feature_impact/<run_id>.jsonl + latest.json, landed on main by commit-to-main.

on:
  schedule:
    # Weekly, Thursday 05:23 UTC (off-peak, before the weekly planning read).
    - cron: "23 5 * * 4"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: feature-impact
  cancel-in-progress: false

jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 110  # commit-to-main verify-merged waits up to 80 min (tests/test_commit_to_main_callers.py)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightgbm (the repo pin; gain shares need it)
        run: pip install --quiet "lightgbm==4.6.0"

      - name: Compute the M1 long table
        run: |
          set -euo pipefail
          python3 scripts/ml/feature_impact.py --self-test
          python3 scripts/ml/feature_impact.py --out-dir comms/feature_impact
          { echo '## feature-impact'; echo '```json'; cat comms/feature_impact/latest.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Land the run on main
        uses: ./.github/actions/commit-to-main
        with:
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          paths: comms/feature_impact
          message: "feature-impact: weekly M1 long table"
          pr-title: "feature-impact: weekly M1 long table"
          pr-body: "Automated weekly data commit (auto-merge): comms/feature_impact/<run_id>.jsonl + latest.json from scripts/ml/feature_impact.py (row FEATURE-IMPACT-MAP)."
          verify-merged: "true"
