name: oci-close-api-port

# SEC-8001-LOCKDOWN (operator decisions page m3, 2026-11-12: "Lock it down: move
# those three clients to HTTPS, then bind 8001 to localhost and drop its
# firewall rule"). Tier 2.
#
# Removes ONLY the OCI ingress rules that are exactly TCP / source 0.0.0.0/0 /
# destination port 8001 from the live trader's subnet security lists and its
# VNIC's network security groups (scripts/ops/cloud_close_port.py). 22/80/443
# and every other rule are untouched. It is the inverse of cloud_open_port.py.
#
# DRY RUN by default: it lists what would be removed and probes whether the API
# key can write (a no-op, etag-guarded update). APPLY needs `apply: true` plus a
# non-empty `reason:` (Tier-2 quote). It also refuses unless the raw API port
# already does NOT answer /api/health (the 127.0.0.1 bind from #25185 must be
# deployed first).
#
# Triggers: workflow_dispatch, or an issue labelled `oci-close-api-port`
# (routed by issue-router.yml) whose body carries `apply: true|false` and
# `reason: ...`. Output names security lists / NSGs by display name only: no
# OCIDs, no addresses (it is posted to a public issue).

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Remove the rules (false = dry run)"
        type: boolean
        default: false
      reason:
        description: "Tier-2 reason (required with apply)"
        required: false
        default: ""
  repository_dispatch:
    types: [oci-close-api-port]

permissions:
  contents: read
  issues: write

concurrency:
  group: oci-close-api-port
  cancel-in-progress: false

jobs:
  close:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'repository_dispatch' &&
       (github.event.client_payload.issue.user.login == github.repository_owner ||
        github.event.client_payload.issue.user.login == 'github-actions[bot]') &&
       contains(github.event.client_payload.issue.labels.*.name, 'oci-close-api-port'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve mode
        env:
          IN_APPLY: ${{ inputs.apply }}
          IN_REASON: ${{ inputs.reason }}
          ISSUE_BODY: ${{ github.event.client_payload.issue.body }}
        run: |
          set -euo pipefail
          apply="${IN_APPLY:-false}"; reason="${IN_REASON:-}"
          if [ -n "${ISSUE_BODY:-}" ]; then
            b_apply="$(printf '%s\n' "$ISSUE_BODY" | grep -i -m1 '^[[:space:]]*apply[[:space:]]*:' | sed 's/^[^:]*:[[:space:]]*//' | tr -d '[:space:]' | tr 'A-Z' 'a-z' || true)"
            b_reason="$(printf '%s\n' "$ISSUE_BODY" | grep -i -m1 '^[[:space:]]*reason[[:space:]]*:' | sed 's/^[^:]*:[[:space:]]*//' || true)"
            [ -n "$b_apply" ] && apply="$b_apply"
            [ -n "$b_reason" ] && reason="$b_reason"
          fi
          case "$apply" in true|false) ;; *) echo "::error::apply must be true or false (got '$apply')"; exit 1 ;; esac
          if [ "$apply" = "true" ] && [ -z "${reason// }" ]; then
            echo "::error::apply: true is a Tier-2 change and needs a non-empty reason."; exit 1
          fi
          echo "APPLY=$apply" >> "$GITHUB_ENV"
          echo ">>> mode: $([ "$apply" = true ] && echo APPLY || echo DRY-RUN)"

      - name: Precondition (apply only) -- raw API port must not answer
        if: env.APPLY == 'true'
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
        run: |
          set +e
          [ -n "${VM_SSH_HOST}" ] || { echo "::error::secret VM_SSH_HOST not set"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 "http://${VM_SSH_HOST}:8001/api/health")"
          echo "raw :8001 /api/health -> http=${code:-none}"
          if [ "$code" = "200" ]; then
            echo "::error::REFUSED: :8001 still answers publicly; deploy the 127.0.0.1 bind (#25185) first. Nothing changed."
            exit 3
          fi

      - name: Install OCI SDK
        run: pip install --quiet oci

      - name: Remove the 8001 ingress rule
        id: run
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
        run: |
          set +e
          flag=""; [ "$APPLY" = "true" ] && flag="--apply"
          python3 scripts/ops/cloud_close_port.py $flag > out.jsonl 2>&1
          rc=$?
          set -e
          echo "RC=$rc" >> "$GITHUB_ENV"
          {
            echo "## oci-close-api-port ($([ "$APPLY" = true ] && echo APPLY || echo DRY-RUN)) exit $rc"
            echo '```'
            cat out.jsonl
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat out.jsonl

      - name: Reply to issue
        if: always() && github.event_name == 'repository_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const out = fs.existsSync('out.jsonl') ? fs.readFileSync('out.jsonl', 'utf8').slice(0, 20000) : '(no output: an earlier step failed; see the run)';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const num = context.payload.client_payload?.issue?.number ?? context.issue.number;
            const mode = process.env.APPLY === 'true' ? 'APPLY' : 'DRY-RUN';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: num,
              body: [`**oci-close-api-port** ${mode}, exit \`${process.env.RC ?? 'n/a'}\`. Run: ${runUrl}`, '', '```', out, '```'].join('\n'),
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: num,
              state: 'closed', state_reason: process.env.RC === '0' ? 'completed' : 'not_planned',
            });

      - name: Fail on a non-zero exit
        if: env.RC != '0'
        run: |
          echo "::error::cloud_close_port.py exited ${RC} (4 = key cannot write -> console fallback; 3 = refused; 1 = API error)"
          exit 1
